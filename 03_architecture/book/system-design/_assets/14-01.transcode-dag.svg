<title id="dt">원본 하나가 세 갈래로 갈라졌다가 조립에서 합쳐진다</title><desc id="dd">영상 갈래에서는 검수 · 영상 인코딩 · 썸네일 · 워터마크가 같은 단계에 놓이고, 영상 인코딩은 다섯 파일을 만든다. 오디오 인코딩과 함께 조립으로 합쳐진다.</desc>
<rect width="960" height="588" fill="#0D1117"/>

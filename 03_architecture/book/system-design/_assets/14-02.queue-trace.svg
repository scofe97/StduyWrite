<title id="dt">작업 하나가 세 큐 사이를 옮겨 간다</title><desc id="dd">영상 인코딩이 작업 큐 맨 앞에서 꺼내져 encoder-2 와 짝이 되어 실행 큐에 들어갔다가 끝나면 지워진다. 작업자 이름과 가동률은 설명용 값이다.</desc>

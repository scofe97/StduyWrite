<title id="dt">사용자 5,000,000 명에서 150 TB 와 $150,000 이 갈라져 나온다</title><desc id="dd">하루 업로드 500,000 건 × 300 MB 는 150 TB 이고, 하루 시청 25,000,000 회 × 0.3 GB 는 7,500,000 GB 이며 GB 당 $0.02 면 $150,000, 구간 요금표로 합산하면 ≈ $151,357 이다.</desc>

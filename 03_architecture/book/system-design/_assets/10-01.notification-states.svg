<title id="dt">알림 한 건의 상태는 기록하는 자리가 다르다</title><desc id="dd">알림 서버가 pending, 작업자가 sent 를 남기고 기기에서 click 이 돌아오며, 실패한 알림은 큐로 되돌아가 정해진 횟수만 다시 시도한다.</desc>
<rect width="1000" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 10-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">알림 한 건의 상태는 기록하는 자리가 다르다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">상태 이름 아래는 그 상태를 기록하는 자리</text>

<title id="dt">다섯 알고리즘은 메모리와 정확도를 맞바꾼다</title><desc id="dd">다섯 알고리즘 모두 메모리가 작지만 이동 윈도 로그만 요청마다 타임스탬프를 남겨 크고, 고정 윈도는 경계에서 한도의 두 배가 통과하며, 이동 윈도 카운터는 근사값을 쓴다.</desc>
<rect width="960" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 04-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">다섯 알고리즘은 메모리와 정확도를 맞바꾼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칸 색은 강점 · 조건부 · 약점</text>

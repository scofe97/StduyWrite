<title id="dt">장애 위치마다 정해 둔 대응은 다섯 갈래다</title><desc id="dd">같은 일을 다시 하거나 다른 부품이 대신 받거나 다시 만들어 이어가거나 새 서버로 바꾸고, 영상 형식이 깨졌으면 멈추고 오류 코드를 돌려준다.</desc>
<rect width="984" height="744" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 14-02 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">장애 위치마다 정해 둔 대응은 다섯 갈래다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">복구 가능한 오류는 앞의 넷 · 복구 불가능한 오류는 마지막 열</text>

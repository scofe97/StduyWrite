<title id="dt">제한기마다 따로 세면 여섯 건이 한도 다섯을 넘는다</title><desc id="dd">한도 5 에 요청 6건을 두 제한기에 번갈아 보내면 따로 센 카운터는 3 과 3 이라 모두 통과하고 Redis 한곳에서 세면 6 이라 여섯째가 429 를 받는다.</desc>

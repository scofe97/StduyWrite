<title id="dt">로그인 뒤 서비스 탐색이 채팅 서버 2 를 골라 사용자 A 에게 알린다</title><desc id="dd">인증은 API 서버가, 서버 선택은 서비스 탐색이 맡고, 연결은 사용자 A 가 직접 건다.</desc>

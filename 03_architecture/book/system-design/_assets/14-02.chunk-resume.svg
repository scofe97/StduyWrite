<title id="dt">조각으로 올리면 실패한 조각만 다시 올린다</title><desc id="dd">300 MB 영상을 75 MB 조각 4 개로 올리다 3 번째가 실패하면 그 조각 75 MB 만 다시 올리고, 통째로 올렸다면 300 MB 를 다시 올린다. 조각 수와 실패 위치는 설명용 가정이다.</desc>

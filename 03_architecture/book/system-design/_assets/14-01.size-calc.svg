<title id="dt">한 시간 분량이 671.8 GB 에서 5.4 GB 로 줄어든다</title><desc id="dd">1920 × 1080 픽셀에 1.5 B, 60 프레임으로 한 시간을 곱하면 671.8 GB 이고, 12 Mbps 로 압축하면 5.4 GB 라서 약 124 배 줄어든다.</desc>
<rect width="788" height="404" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 14-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 시간 분량이 671.8 GB 에서 5.4 GB 로 줄어든다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">8 비트 4:2:0 가정 · 12 Mbps 는 1080p 고프레임 권장 업로드 값</text>
<text x="202.0" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">1 · 입력</text>

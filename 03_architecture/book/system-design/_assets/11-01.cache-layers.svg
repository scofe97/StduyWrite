<title id="dt">캐시 다섯 층은 담는 것의 모양이 서로 다르다</title><desc id="dd">뉴스 피드 층은 게시물 ID 목록만, 콘텐츠 층은 게시물 객체와 핫 캐시, 소셜 그래프 층은 팔로워와 팔로잉, 행동 층은 좋아요와 답글 여부, 카운터 층은 수를 담는다.</desc>

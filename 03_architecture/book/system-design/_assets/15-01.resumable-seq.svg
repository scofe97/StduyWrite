<title id="dt">끊긴 업로드는 상태를 물어 받은 바이트 다음부터 이어 보낸다</title><desc id="dd">세션 URI 하나에 청크를 PUT 하고, 끊기면 빈 PUT 으로 Range 를 받아 524,288 바이트 다음부터 다시 보낸다.</desc>
<rect width="880" height="720" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 15-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">끊긴 업로드는 상태를 물어 받은 바이트 다음부터 이어 보낸다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">2,000,000 바이트 파일 · 청크 524,288 바이트</text>
<rect x="100" y="100" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="200" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="200" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">2,000,000 바이트 파일</text>
<rect x="580" y="100" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="680" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Drive API</text>
<text x="680" y="137" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">upload/drive/v3/files</text>
<line x1="200" y1="150" x2="200" y2="640" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="680" y1="150" x2="680" y2="640" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 210 192 L 668 192" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<rect x="329.22" y="169" width="221.56" height="18" fill="#0D1117"/>
<text x="440.0" y="183" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">POST ?uploadType=resumable</text>
<path d="M 670 248 L 212 248" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)" stroke-dasharray="5 4"/>
<rect x="272.79999999999995" y="225" width="334.40000000000003" height="18" fill="#0D1117"/>
<text x="440.0" y="239" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">200 · Location …upload_id=xa298sd_sdlkj2</text>
<path d="M 210 304 L 668 304" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="268.77" y="281" width="342.46000000000004" height="18" fill="#0D1117"/>
<text x="440.0" y="295" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">PUT Content-Range: bytes 0-524287/2000000</text>
<rect x="368.61" y="309" width="142.78" height="20" fill="#0D1117"/>
<text x="440.0" y="323" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">청크 = 256 KB × 2</text>
<path d="M 670 360 L 212 360" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="349.37" y="337" width="181.26000000000002" height="18" fill="#0D1117"/>
<text x="440.0" y="351" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">308 Resume Incomplete</text>
<rect x="157.97" y="402" width="84.06" height="20" rx="4" fill="#0D1117"/>
<rect x="157.97" y="402" width="84.06" height="20" rx="4" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="200" y="416" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">연결 끊김</text>
<path d="M 210 468 L 668 468" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<rect x="296.98" y="445" width="286.04" height="18" fill="#0D1117"/>
<text x="440.0" y="459" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">PUT Content-Range: bytes */2000000</text>
<rect x="403.97" y="473" width="72.06" height="20" fill="#0D1117"/>
<text x="440.0" y="487" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">본문 없음</text>
<path d="M 670 524 L 212 524" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)" stroke-dasharray="5 4"/>
<rect x="325.19" y="501" width="229.62" height="18" fill="#0D1117"/>
<text x="440.0" y="515" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">308 · Range: bytes=0-524287</text>
<path d="M 210 580 L 668 580" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<rect x="244.58999999999997" y="557" width="390.82000000000005" height="18" fill="#0D1117"/>
<text x="440.0" y="571" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">PUT Content-Range: bytes 524288-1048575/2000000</text>
<rect x="367.44" y="585" width="145.12" height="20" fill="#0D1117"/>
<text x="440.0" y="599" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">받은 바이트 다음부터</text>
<rect x="536.31" y="630" width="287.38" height="20" rx="4" fill="#0D1117"/>
<rect x="536.31" y="630" width="287.38" height="20" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="680" y="644" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">마지막 청크 뒤 200 OK · 201 Created</text>
<line x1="12" y1="664" x2="832" y2="664" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="686" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="676" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="686" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">세션 시작</text>
<rect x="209" y="676" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="231" y="686" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">청크 전송</text>

<title id="dt">글자마다 요청이 가므로 평균 약 23,000 QPS 이고 하루 신규 질의는 0.4 GB 다</title><desc id="dd">사용자 수에 검색 횟수와 글자 수를 곱해 하루 요청을 구하고 86,400 초로 나누며, 저장량은 질의 크기와 신규 비율로 줄인다.</desc>
<rect width="1000" height="548" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 13-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">글자마다 요청이 가므로 평균 약 23,000 QPS 이고 하루 신규 질의는 0.4 GB 다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">면접 가정: 일간 사용자 1,000만 · 하루 10 회 · 질의 20 바이트 · 신규 20 %</text>
<text x="24" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">초당 요청 수</text>
<rect x="24" y="124" width="168" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="38" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">일간 사용자</text>
<text x="38" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">10,000,000</text>
<rect x="220" y="124" width="168" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="234" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">하루 검색 횟수</text>
<text x="234" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">× 10</text>
<rect x="416" y="124" width="168" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="430" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">검색당 요청 수</text>
<text x="430" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">× 20</text>
<rect x="612" y="124" width="168" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="626" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">하루 초</text>
<text x="626" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">÷ 86,400</text>
<rect x="808" y="124" width="168" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="822" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">평균 QPS</text>
<text x="822" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">= 23,148</text>
<path d="M 194 162 L 214 162" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 390 162 L 410 162" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 586 162 L 606 162" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 782 162 L 802 162" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="808" y="232" width="168" height="76" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="822" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">피크 QPS</text>
<text x="822" y="290" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">× 2 = 46,296</text>
<path d="M 892 204 L 892 226" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="24" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">하루 신규 저장량</text>
<rect x="24" y="360" width="168" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="38" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">일간 사용자</text>
<text x="38" y="418" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">10,000,000</text>
<rect x="220" y="360" width="168" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="234" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">하루 검색 횟수</text>
<text x="234" y="418" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">× 10</text>
<rect x="416" y="360" width="168" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="430" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">질의 크기</text>
<text x="430" y="418" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">× 20 B</text>
<rect x="612" y="360" width="168" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="626" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">신규 비율</text>
<text x="626" y="418" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">× 20 %</text>
<rect x="808" y="360" width="168" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="822" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">하루 신규 데이터</text>
<text x="822" y="418" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">= 0.4 GB</text>
<path d="M 194 398 L 214 398" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 390 398 L 410 398" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 586 398 L 606 398" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 782 398 L 802 398" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="12" y1="492" x2="952" y2="492" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="514" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="504" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">계산 단계</text>
<rect x="209" y="504" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설계 기준이 되는 값</text>

<title id="dt">안정 해시를 여섯 절로 읽는다</title><desc id="dd">서버 번호로 나누는 방식이 무너지는 값에서 출발해 링 조회·이동 범위·가상 노드를 거쳐 쓰이는 곳까지 간다.</desc>

<title id="dt">개략 설계는 피드 발행과 피드 조회 두 흐름으로 나뉜다</title><desc id="dd">발행은 사용자가 POST /v1/me/feed 를 보내 게시 서비스·팬아웃 서비스·알림 서비스로 갈라지고, 조회는 GET /v1/me/feed 가 뉴스 피드 서비스를 거쳐 뉴스 피드 캐시에서 피드 ID 를 읽는다.</desc>
<rect width="960" height="524" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 03-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">개략 설계는 피드 발행과 피드 조회 두 흐름으로 나뉜다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 뉴스 피드 캐시를 발행이 쓰고 조회가 읽는다</text>
<text x="24" y="104" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">피드 발행</text>
<text x="24" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">피드 조회</text>
<rect x="24" y="196" width="144" height="56" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="96.0" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">사용자</text>
<text x="96.0" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">POST /v1/me/feed</text>
<rect x="208" y="196" width="144" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="280.0" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">로드 밸런서</text>
<text x="280.0" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">트래픽 분산</text>
<rect x="392" y="196" width="144" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="464.0" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">웹 서버</text>

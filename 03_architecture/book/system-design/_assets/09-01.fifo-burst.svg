<title id="dt">FIFO 큐는 같은 호스트의 URL 을 한꺼번에 내보낸다</title><desc id="dd">한 페이지의 링크는 대부분 같은 호스트를 가리켜서, 큐 앞쪽 칸이 모두 en.wikipedia.org 의 주소가 되고 스레드가 그 호스트를 동시에 두드린다.</desc>

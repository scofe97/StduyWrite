<title id="dt">변환 뒤에 변환본과 완료 이벤트로 갈라지고 메타데이터는 따로 흐른다</title><desc id="dd">클라이언트가 funny.mov 300 MB 를 원본 저장소에 올리는 동안 메타데이터 요청이 API 서버를 지나 DB 에 적힌다. 변환이 끝나면 변환본 5 개는 CDN 으로, 완료 이벤트는 큐와 처리기를 지나 DB 를 바꾼다.</desc>

<title id="dt">N = 3 에서 W + R 이 3 을 넘어야 읽기와 쓰기가 겹친다</title><desc id="dd">쓰기 확인 W 곳과 읽기 응답 R 곳의 합에서 N 을 빼면 둘이 반드시 겹치는 서버 수이고, 음수면 겹침 0 이다.</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 06-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">N = 3 에서 W + R 이 3 을 넘어야 읽기와 쓰기가 겹친다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">겹침 = W + R − N</text>
<text x="24" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">쓰기 확인 W ↓</text>
<text x="316.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">R = 1</text>
<text x="556.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">R = 2</text>
<text x="796.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">R = 3</text>
<text x="24" y="194" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">W = 1</text>
<rect x="200" y="148" width="232" height="80" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.0"/>
<text x="316.0" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">합 2 · 겹침 0</text>
<rect x="440" y="148" width="232" height="80" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.0"/>

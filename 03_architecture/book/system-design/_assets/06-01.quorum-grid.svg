<rect x="680" y="148" width="232" height="80" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.0"/>
<text x="796.0" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">합 4 · 겹침 1</text>
<text x="796.0" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">쓰기 빠름</text>

<title id="dt">메모리에 없으면 블룸 필터가 열 SSTable 을 좁힌다</title><desc id="dd">메모리 캐시가 답하면 디스크는 건드리지 않고, 못 답하면 블룸 필터를 거쳐 후보 파일만 읽는다.</desc>
<rect width="960" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 06-02 §7</text>

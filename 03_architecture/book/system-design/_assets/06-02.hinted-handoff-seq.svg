<title id="dt">응답 없는 s2 몫은 s3 가 받아 두었다가 돌려 준다</title><desc id="dd">s0·s1 의 ACK 로 쓰기는 성공하고, s3 는 s2 에게 줄 값을 힌트와 함께 보관하다 s2 가 돌아오면 넘긴다.</desc>

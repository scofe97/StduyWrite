<title id="dt">공인 IP 하나 뒤에 사설 IP 둘</title><desc id="dd">mywebsite.com 은 88.88.88.1 하나로 풀리고, 로드밸런서가 사설 IP 10.0.0.1 · 10.0.0.2 의 웹 서버로 요청을 나눈다. Server1 이 멈추면 요청이 모두 10.0.0.2 로 간다.</desc>

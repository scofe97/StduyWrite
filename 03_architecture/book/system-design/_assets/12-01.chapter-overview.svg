<title id="dt">채팅 시스템을 아홉 절로 읽는다</title><desc id="dd">범위를 정하고 전달 방식과 서버 부류와 저장소를 고른 뒤, ID 와 탐색과 흐름과 상태로 이어 간다.</desc>
<rect width="1000" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 12-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">채팅 시스템을 아홉 절로 읽는다</text>

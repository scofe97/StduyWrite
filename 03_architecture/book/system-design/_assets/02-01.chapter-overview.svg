<title id="dt">기준 값 셋에서 예제 한 개로, 마지막은 습관이다</title><desc id="dd">2 의 거듭제곱 단위, 지연 시간 표, 가용성 9 의 개수가 기준 값이고, 이 값으로 QPS 와 저장 용량을 어림하며, 반올림·가정·단위 습관으로 마무리한다.</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">기준 값 셋에서 예제 한 개로, 마지막은 습관이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">다섯 절의 지도</text>
<rect x="32" y="120" width="160" height="232" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="46" y="148" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">§1</text>
<text x="112.0" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">단위</text>
<line x1="48" y1="204" x2="176" y2="204" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="112.0" y="236" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">2^10 ≈ 10^3</text>
<text x="112.0" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">2^30 ≈ 10^9</text>
<text x="112.0" y="292" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">2^50 ≈ 10^15</text>
<text x="112.0" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">1,024 의 거듭제곱</text>
<rect x="216" y="120" width="160" height="232" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="230" y="148" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">§2</text>
<text x="296.0" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">지연 시간</text>
<line x1="232" y1="204" x2="360" y2="204" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="296.0" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">L1 캐시 0.5 ns</text>
<text x="296.0" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">메모리 100 ns</text>
<text x="296.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">디스크 탐색 10 ms</text>
<text x="296.0" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">2007 년 기준 값</text>
<rect x="400" y="120" width="160" height="232" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="414" y="148" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">§3</text>
<text x="480.0" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">가용성</text>

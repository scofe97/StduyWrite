<title id="dt">네 단계가 45분 면접에서 걸리는 분</title><desc id="dd">범위 확정은 3~10분, 개략 설계는 10~15분, 상세 설계는 10~25분, 마무리는 3~5분이다. 상세 설계의 폭이 가장 넓다.</desc>

<title id="dt">네 가지 조건을 모두 채우는 방식은 스노플레이크뿐이다</title><desc id="dd">다중 마스터는 서버 사이 시간순을, UUID 는 숫자와 64비트를, 티켓 서버는 조율 없는 생성을 놓친다.</desc>

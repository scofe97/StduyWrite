<text x="786.0" y="369" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">10 ms</text>
<text x="280" y="417" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">디스크에서 1 MB 순차 읽기</text>
<rect x="296" y="400" width="508.6" height="24" rx="3" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="814.6" y="417" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">30 ms</text>
<text x="280" y="465" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">패킷 CA → 네덜란드 → CA</text>
<rect x="296" y="448" width="550.6" height="24" rx="3" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="856.6" y="465" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">150 ms</text>

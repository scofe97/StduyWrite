<title id="dt">지연 시간은 0.5 ns 에서 150 ms 까지 아홉 자릿수 가까이 벌어진다</title><desc id="dd">L1 캐시 0.5 ns 에서 대륙 간 왕복 150 ms 까지 8 개 값을 로그 축 막대로 그렸다. 디스크 탐색은 메인 메모리 참조의 10^5 배다.</desc>
<rect width="960" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 02-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">지연 시간은 0.5 ns 에서 150 ms 까지 아홉 자릿수 가까이 벌어진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Jeff Dean 이 든 값 · 로그 축 · 막대 길이는 자릿수</text>
<line x1="356.0" y1="100" x2="356.0" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="356.0" y="508" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">1 ns</text>
<line x1="536.0" y1="100" x2="536.0" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="536.0" y="508" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">1 µs</text>
<line x1="716.0" y1="100" x2="716.0" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="716.0" y="508" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">1 ms</text>
<line x1="896.0" y1="100" x2="896.0" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="896.0" y="508" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">1 s</text>
<line x1="296" y1="100" x2="296" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="280" y="129" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">L1 캐시 참조</text>
<rect x="296" y="112" width="41.89999999999998" height="24" rx="3" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="347.9" y="129" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">0.5 ns</text>
<text x="280" y="177" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">L2 캐시 참조</text>
<rect x="296" y="160" width="110.69999999999999" height="24" rx="3" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="416.7" y="177" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">7 ns</text>
<text x="280" y="225" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">메인 메모리 참조</text>
<rect x="296" y="208" width="180.0" height="24" rx="3" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="486.0" y="225" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">100 ns</text>
<text x="280" y="273" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">메모리에서 1 MB 순차 읽기</text>
<rect x="296" y="256" width="383.9" height="24" rx="3" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="689.9" y="273" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">250 µs</text>
<text x="280" y="321" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">같은 데이터 센터 안 왕복</text>

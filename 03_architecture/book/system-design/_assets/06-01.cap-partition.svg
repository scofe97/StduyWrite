<title id="dt">n3 가 끊기면 CP 는 오류를 돌려주고 AP 는 낡은 값 100 을 돌려준다</title><desc id="dd">n3 가 n1·n2 와 끊긴 채 잔액 100 을 70 으로 바꾸는 요청이 n1 에 오면, 같은 세 노드의 값과 응답이 정책마다 갈린다.</desc>

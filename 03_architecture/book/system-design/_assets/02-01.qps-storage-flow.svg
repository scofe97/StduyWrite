<text x="574.0" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">QPS 반올림</text>
<rect x="648" y="136" width="100" height="64" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>

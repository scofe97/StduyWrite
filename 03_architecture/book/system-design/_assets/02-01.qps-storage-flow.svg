<title id="dt">가정 여섯 값에서 3,500 QPS 와 55 PB 가 나온다</title><desc id="dd">MAU 300 M 의 절반이 하루 2 글을 올린다. DAU 150 M 에서 초당 요청 ≈ 3,500(피크 ≈ 7,000)과 미디어 30 TB/일 → 5 년 ≈ 55 PB 가 갈라져 나온다.</desc>
<rect width="788" height="404" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 02-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">가정 여섯 값에서 3,500 QPS 와 55 PB 가 나온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">실제 값이 칸마다 바뀐다</text>
<text x="202.0" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">1 · 가정</text>
<text x="326.0" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">2 · 사용자</text>
<text x="450.0" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">3 · 변환</text>
<text x="574.0" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">4 · 다음 값</text>
<text x="698.0" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">5 · 결과</text>
<line x1="132" y1="124" x2="764" y2="124" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="132" y1="204" x2="764" y2="204" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">초당 요청</text>
<text x="24" y="246" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">저장 용량</text>
<rect x="152" y="136" width="100" height="64" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="202.0" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">300 M MAU</text>
<text x="202.0" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">× 50 %</text>

<title id="dt">단축 키를 여는 요청은 캐시를 먼저 묻는다</title><desc id="dd">캐시에 없으면 DB 에서 longURL 을 읽어 캐시에 넣고, 있으면 DB 를 건너뛰며, 어느 쪽이든 302 와 Location 으로 되돌린다.</desc>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 키 zn9edcu 를 두 번 열면 둘째는 DB 를 건너뛴다</text>

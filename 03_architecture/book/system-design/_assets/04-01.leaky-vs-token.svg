<title id="dt">같은 몰림을 누출 버킷은 일정한 간격으로 내보낸다</title><desc id="dd">5건이 한꺼번에 도착하면 크기 3인 토큰 버킷은 3건을 즉시 통과시키고 2건을 버리며, 큐 크기 3에 초당 1건을 꺼내는 누출 버킷은 3건을 큐에 담고 2건을 버린 뒤 1초에 1건씩 내보낸다.</desc>

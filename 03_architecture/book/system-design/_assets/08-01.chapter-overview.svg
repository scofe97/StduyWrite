<title id="dt">URL 단축기를 일곱 절로 읽는다</title><desc id="dd">규모 추정에서 키 길이를 정하고, 키를 만드는 두 방식을 견준 뒤, 단축과 리디렉션 두 흐름으로 이어 확장 주제로 닫는다.</desc>

<title id="dt">YouTube 업로드를 여섯 절로 읽는다</title><desc id="dd">규모와 비용을 어림하고 클라우드로 쓸 부품을 정한 뒤, 업로드의 두 갈래와 스트리밍을 보고, 변환이 왜 필요하며 DAG 로 어떻게 쪼개는지로 이어 간다.</desc>
<rect width="960" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 14-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">YouTube 업로드를 여섯 절로 읽는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">규모 → 구조 → 업로드 → 스트리밍 → 변환 → DAG</text>
<rect x="24" y="104" width="288" height="124" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="38" y="132" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">§1</text>
<text x="38" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">규모와 비용</text>
<text x="38" y="204" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">150 TB/일 · $150,000/일</text>

<title id="dt">뉴스 피드를 일곱 절로 읽는다</title><desc id="dd">범위와 두 API 에서 출발해 게시 흐름을 보고, 쓸 때 밀기와 읽을 때 당기기를 섞는 팬아웃을 고른 뒤, 팬아웃 서비스·조회 흐름·캐시 다섯 층·확장 주제로 이어진다.</desc>
<rect width="960" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 11-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">뉴스 피드를 일곱 절로 읽는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">범위 → 게시 → 팬아웃 혼합 → 조회 → 캐시 층</text>
<rect x="24" y="104" width="208" height="124" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="38" y="132" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">§1</text>
<text x="38" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">범위와 두 API</text>
<text x="38" y="204" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">POST · GET /v1/me/feed</text>
<rect x="256" y="104" width="208" height="124" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="270" y="132" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">§2</text>
<text x="270" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">게시 흐름</text>
<text x="270" y="204" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">인증 · 저장 · 팬아웃</text>

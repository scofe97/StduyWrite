<title id="dt">함정 URL 은 매번 새 주소라 중복 검사를 지난다</title><desc id="dd">마디를 하나 붙일 때마다 문자열이 달라져 URL Seen? 이 막지 못하고, 길이 상한을 넘는 순간에야 필터가 끊는다.</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 09-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">함정 URL 은 매번 새 주소라 중복 검사를 지난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">상한 값은 운영자가 정하며 점선 위치는 개념 표시</text>
<text x="168" y="112" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">길이 = 25 + 8 × k</text>

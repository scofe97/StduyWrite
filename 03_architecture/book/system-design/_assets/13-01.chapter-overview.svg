<title id="dt">검색어 자동완성을 여덟 절로 읽는다</title><desc id="dd">요구사항과 추정에서 출발해 빈도 표와 트라이로 질의를 풀고, 노드별 상위 k 캐시와 주 단위 수집 경로, 질의 최적화, 갱신, 샤딩으로 이어진다.</desc>
<rect width="960" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 13-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">검색어 자동완성을 여덟 절로 읽는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">추정 → 빈도 표 → 트라이 → 노드별 캐시 → 수집 경로 → 질의 → 갱신 → 샤딩</text>
<rect x="24" y="104" width="208" height="124" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="38" y="132" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">§1</text>
<text x="38" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">요구사항과 추정</text>
<text x="38" y="204" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">23,000 QPS · 0.4 GB/일</text>
<rect x="256" y="104" width="208" height="124" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="270" y="132" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">§2</text>
<text x="270" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">빈도 표 개략 설계</text>
<text x="270" y="204" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">LIKE 'tw%' · LIMIT 5</text>
<rect x="488" y="104" width="208" height="124" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="502" y="132" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">§3</text>
<text x="502" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">트라이</text>
<text x="502" y="204" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">tr → true 35 · try 29</text>

<title id="dt">피드 캐시의 ID 한 줄은 두 저장소를 거쳐 완성된 항목이 된다</title><desc id="dd">user 12 의 피드 캐시에는 게시물 ID 9003 · 9001 만 있고, 게시물 캐시에서 본문과 글쓴이 ID 를, 사용자 캐시에서 글쓴이 이름과 사진을 받아 JSON 두 건으로 돌려준다.</desc>
<rect width="960" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 11-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">피드 캐시의 ID 한 줄은 두 저장소를 거쳐 완성된 항목이 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">user 12 가 GET /v1/me/feed 를 부른 뒤</text>

<title id="dt">시계가 뒤로 가면 ID 를 만들지 않고 거절한다</title><desc id="dd">현재 시각이 마지막 발급 시각보다 3 ms 작으면 예외로 거절하고, 같은 밀리초에 순번이 4095 를 넘으면 다음 밀리초까지 기다린다.</desc>
<rect width="960" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 07-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">시계가 뒤로 가면 ID 를 만들지 않고 거절한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">now 는 현재 시각 · last 는 마지막 발급 시각</text>
<text x="28" y="104" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">조건</text>
<text x="348" y="104" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">계산</text>
<text x="668" y="104" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">결과</text>
<rect x="24" y="116" width="280" height="64" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="38" y="142" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">now &lt; last</text>
<text x="38" y="164" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">1586451091222 &lt; 1586451091225</text>
<path d="M 306 148 L 338 148" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="344" y="116" width="280" height="64" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.0"/>
<text x="358" y="142" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F0616D">last − now</text>
<text x="358" y="164" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">= 3</text>
<path d="M 626 148 L 658 148" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="664" y="116" width="272" height="64" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.0"/>
<text x="678" y="142" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">발급 거절</text>
<text x="678" y="164" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">InvalidSystemClock</text>
<rect x="24" y="204" width="280" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="38" y="230" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">now = last</text>
<text x="38" y="252" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">순번 7</text>

<rect x="344" y="292" width="280" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="358" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">(4095 + 1) &amp; 4095</text>
<text x="358" y="340" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">= 0</text>

<rect x="664" y="292" width="272" height="64" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.0"/>
<text x="678" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">다음 ms 까지 대기</text>
<text x="678" y="340" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">tilNextMillis</text>
<rect x="24" y="380" width="280" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="38" y="406" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">now &gt; last</text>
<text x="38" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">새 밀리초</text>
<path d="M 306 412 L 338 412" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="344" y="380" width="280" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="358" y="406" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">순번</text>
<text x="358" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">= 0</text>
<path d="M 626 412 L 658 412" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="664" y="380" width="272" height="64" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.0"/>
<text x="678" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">ID 발급</text>
<text x="678" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">순번 0</text>
<line x1="12" y1="480" x2="912" y2="480" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="502" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

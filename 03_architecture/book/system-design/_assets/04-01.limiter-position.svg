<title id="dt">제한기가 막은 요청은 429 로 돌아간다</title><desc id="dd">클라이언트가 1초 안에 요청 3건을 보내면 처리율 제한 미들웨어가 초당 2건까지만 API 서버로 넘기고 셋째 요청은 429 로 돌려보낸다.</desc>
<rect width="960" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 04-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">제한기가 막은 요청은 429 로 돌아간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">한도는 초당 2건</text>

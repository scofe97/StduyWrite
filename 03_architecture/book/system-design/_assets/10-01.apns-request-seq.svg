<title id="dt">푸시 하나는 POST 한 번으로 APNs 에 닿는다</title><desc id="dd">알림 서버는 기기 토큰을 경로에, 인증 토큰과 주제를 헤더에, 알림 내용을 본문에 담아 보내고 APNs 가 기기로 전달한다.</desc>

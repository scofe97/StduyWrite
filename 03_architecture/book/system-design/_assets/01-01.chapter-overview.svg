<title id="dt">서버 한 대에서 네 단계로 자란다</title><desc id="dd">서버 한 대에서 웹과 DB 를 나누고, 웹 앞에 로드밸런서를 두고, DB 를 주와 부로 복제하는 네 단계의 구성과 해소한 병목.</desc>

<title id="dt">유형별 큐 뒤에서 작업자가 제3자로 보낸다</title><desc id="dd">알림 서버는 알림을 큐에 넣고 돌아서며, 작업자가 큐에서 꺼내 APNs·FCM·SMS·이메일 서비스로 보낸다. 큐가 유형마다 따로라 한 제공자의 장애가 번지지 않는다.</desc>

<title id="dt">두 요청이 3 을 읽고 둘 다 4 를 쓰면 카운터는 4</title><desc id="dd">카운터가 3 일 때 요청 A 와 B 가 쓰기 전에 둘 다 읽으면 각자 3 + 1 = 4 를 써서, 두 건이 들어왔는데 정답 5 가 아닌 4 가 남는다.</desc>

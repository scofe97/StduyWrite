<title id="dt">질문 여섯 개가 범위를 확정하고 수치 둘이 규모를 정한다</title><desc id="dd">모바일과 웹 모두, 게시와 친구 피드 보기, 역시간순, 친구 5,000명, 일간 사용자 1,000만 명, 이미지와 영상 포함으로 범위가 정해지고 친구 수와 일간 사용자가 규모를 정하는 수치다.</desc>
<rect width="960" height="612" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 03-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">질문 여섯 개가 범위를 확정하고 수치 둘이 규모를 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">뉴스 피드 예시의 질문과 답</text>
<text x="24" y="100" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">물은 것</text>

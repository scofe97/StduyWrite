<title id="dt">근사식은 이전 창의 겹친 비율만큼만 센다</title><desc id="dd">한도 분당 7건에서 이전 분 5건 · 현재 분 3건 · 현재 분의 30% 지점이면 이동하는 1분이 이전 분의 70% 를 덮어 3 + 5 × 0.7 = 6.5 이고, 내림한 6 은 한도 7 보다 작아 통과하며 통과 뒤에는 4 + 3.5 = 7.5 로 한도에 닿는다.</desc>
<rect width="960" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 04-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">근사식은 이전 창의 겹친 비율만큼만 센다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">한도 분당 7건 · 현재 분의 30% 지점에 도착</text>

<title id="dt">URL 하나가 프론티어를 나가 새 URL 을 낳고 돌아온다</title><desc id="dd">프론티어가 URL 을 내보내 DNS 와 다운로더를 거치고, 내려받은 페이지의 링크가 필터와 중복 검사를 지나 다시 프론티어로 들어간다.</desc>

<title id="dt">하트비트 세 번 뒤 끊기면 마지막 하트비트에서 30 초 뒤인 40 초에 오프라인이 된다</title><desc id="dd">하트비트 간격은 5 초이고 한도는 30 초다. 한도 안에 다시 붙으면 온라인이 이어진다.</desc>
<rect width="1000" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 12-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">하트비트 세 번 뒤 끊기면 마지막 하트비트에서 30 초 뒤인 40 초에 오프라인이 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">10 + 30 = 40 초</text>
<line x1="60" y1="176" x2="960" y2="176" stroke="#8B98A9" stroke-width="1.2"/>
<line x1="80" y1="170" x2="80" y2="182" stroke="#8B98A9" stroke-width="1.0"/>
<text x="80" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0 s</text>
<line x1="180" y1="170" x2="180" y2="182" stroke="#8B98A9" stroke-width="1.0"/>
<text x="180" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">5 s</text>
<line x1="280" y1="170" x2="280" y2="182" stroke="#8B98A9" stroke-width="1.0"/>
<text x="280" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">10 s</text>
<line x1="380" y1="170" x2="380" y2="182" stroke="#8B98A9" stroke-width="1.0"/>
<text x="380" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">15 s</text>
<line x1="480" y1="170" x2="480" y2="182" stroke="#8B98A9" stroke-width="1.0"/>
<text x="480" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">20 s</text>
<line x1="580" y1="170" x2="580" y2="182" stroke="#8B98A9" stroke-width="1.0"/>
<text x="580" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">25 s</text>
<line x1="680" y1="170" x2="680" y2="182" stroke="#8B98A9" stroke-width="1.0"/>
<text x="680" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">30 s</text>
<line x1="780" y1="170" x2="780" y2="182" stroke="#8B98A9" stroke-width="1.0"/>
<text x="780" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">35 s</text>
<line x1="880" y1="170" x2="880" y2="182" stroke="#8B98A9" stroke-width="1.0"/>
<text x="880" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">40 s</text>
<line x1="80" y1="168" x2="80" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<circle cx="80" cy="176" r="5" fill="#6A95D8"/>
<text x="80" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">하트비트 1</text>
<line x1="180" y1="168" x2="180" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<circle cx="180" cy="176" r="5" fill="#6A95D8"/>
<text x="180" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">하트비트 2</text>
<line x1="280" y1="168" x2="280" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<circle cx="280" cy="176" r="5" fill="#6A95D8"/>
<text x="280" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">하트비트 3</text>
<rect x="260.0" y="226" width="40.0" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="280" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">끊김</text>
<line x1="280" y1="268" x2="880" y2="268" stroke="#E3B341" stroke-width="1.6"/>
<line x1="280" y1="260" x2="280" y2="276" stroke="#E3B341" stroke-width="1.6"/>
<line x1="880" y1="260" x2="880" y2="276" stroke="#E3B341" stroke-width="1.6"/>
<text x="580.0" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">한도 x = 30 s</text>
<text x="580.0" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">한도 안 재접속이면 온라인 유지</text>
<line x1="880" y1="168" x2="880" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<circle cx="880" cy="176" r="7" fill="#F08A59"/>
<text x="880" y="132" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">40 s = 10 + 30 · 오프라인</text>
<rect x="80" y="328" width="800" height="32" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="480.0" y="349" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">온라인</text>
<rect x="880" y="328" width="80" height="32" rx="4" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="920.0" y="349" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">오프라인</text>
<line x1="12" y1="392" x2="952" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="404" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">하트비트</text>
<rect x="196" y="404" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="218" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">끊김과 한도</text>
<rect x="318" y="404" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="340" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">온라인</text>
<rect x="401" y="404" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="423" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">오프라인</text>
<rect x="497" y="404" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="519" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전환 시각</text>
</svg>
<title id="dt">같은 키를 두 번 읽으면 두 번째는 DB 를 건너뛴다</title><desc id="dd">미스 뒤에는 DB 에서 읽어 캐시에 3600초 동안 채우고, 같은 키의 다음 요청은 캐시가 답한다.</desc>

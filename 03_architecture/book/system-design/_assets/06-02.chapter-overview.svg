<title id="dt">충돌과 장애를 다루는 다섯 기법과 노드 안의 읽기·쓰기</title><desc id="dd">동시 쓰기를 벡터 시계로 가르고, 장애를 가십으로 알아내 임시 위탁과 머클 트리로 메운 뒤, 한 노드의 쓰기와 읽기를 따라간다.</desc>
<rect width="960" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 06-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">충돌과 장애를 다루는 다섯 기법과 노드 안의 읽기·쓰기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">값 하나가 충돌하고 복제본 하나가 사라진 뒤 디스크에 닿기까지</text>

<title id="dt">옮길 범위는 바뀐 서버에서 시계 반대 방향 첫 서버까지다</title><desc id="dd">s4 를 더하면 (90, 10] 의 20 이, s1 을 빼면 (15, 40] 의 25 가 이웃 서버로 간다.</desc>
<rect width="1000" height="436" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 05-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">옮길 범위는 바뀐 서버에서 시계 반대 방향 첫 서버까지다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">열은 범위를 찾는 순서이고 괄호는 앞 위치를 제외하고 뒤 위치를 포함한 구간</text>
<text x="236.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">바뀐 서버</text>
<text x="444.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">반시계 첫 서버</text>
<text x="652.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">옮길 범위</text>
<text x="860.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">키를 받는 서버</text>
<text x="16" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">서버 추가</text>
<rect x="140" y="140" width="192" height="100" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="154" y="184" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">s4</text>
<text x="154" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">위치 10</text>
<path d="M 334 190 L 342 190" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="348" y="140" width="192" height="100" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="362" y="184" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">s3</text>
<text x="362" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">위치 90</text>
<path d="M 542 190 L 550 190" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="556" y="140" width="192" height="100" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="570" y="184" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">(90, 10]</text>
<text x="570" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">길이 20</text>
<path d="M 750 190 L 758 190" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="764" y="140" width="192" height="100" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="778" y="184" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">s4</text>
<text x="778" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">s0 에서 받음</text>
<text x="16" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">서버 제거</text>
<rect x="140" y="272" width="192" height="100" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="154" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">s1</text>
<text x="154" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">위치 40</text>
<path d="M 334 322 L 342 322" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="348" y="272" width="192" height="100" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="362" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">s0</text>
<text x="362" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">위치 15</text>
<path d="M 542 322 L 550 322" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="556" y="272" width="192" height="100" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="570" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">(15, 40]</text>
<text x="570" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">길이 25</text>
<path d="M 750 322 L 758 322" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="764" y="272" width="192" height="100" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="778" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">s2</text>
<text x="778" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">s1 에서 받음</text>
<line x1="12" y1="392" x2="952" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="404" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">범위를 찾는 단계</text>
<rect x="261" y="404" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="283" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가장 짚는 칸</text>
</svg>
<title id="dt">버전이 같으냐가 갈림길이다</title><desc id="dd">여러 조각이 같은 라이브러리를 쓸 때 Module Federation 이 버전을 보고 두 길로 나눈다. 색이 붙은 갈래가 성능을 버는 쪽이다.</desc>
<rect width="1000" height="526" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 03-05 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">버전이 같으냐가 갈림길이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">마름모가 판단이고 사각형이 그 결과입니다</text>

<text x="264" y="262" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#F08A59">같다</text>
<text x="764" y="262" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#8B98A9">다르다</text>
<rect x="105" y="312" width="290" height="52" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.3"/>

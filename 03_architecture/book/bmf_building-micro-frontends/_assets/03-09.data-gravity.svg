<title id="dt">엣지가 가까워도 데이터는 멀리 있다</title><desc id="dd">왼쪽 사용자에게 엣지는 가깝지만, 렌더에 필요한 데이터는 오른쪽 리전에 있다. 색이 붙은 긴 경로가 응답 시간을 결정한다.</desc>
<rect width="1200" height="436" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 03-09 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">엣지가 가까워도 데이터는 멀리 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">데이터 중력 — 애플리케이션은 데이터가 있는 곳으로 끌린다</text>
<rect x="40" y="128" width="500" height="176" rx="8" fill="#F5F5F303" stroke="#F5F5F330" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="54" y="120" width="137.2" height="16" fill="#0D1117"/>
<text x="60" y="132" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">SYDNEY · EDGE LOCATION</text>
<rect x="660" y="128" width="500" height="176" rx="8" fill="#F5F5F303" stroke="#F5F5F330" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="674" y="120" width="159.6" height="16" fill="#0D1117"/>
<text x="680" y="132" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">US-EAST-1 · PRIMARY REGION</text>
<rect x="68" y="158" width="444" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="88" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">엣지 컴퓨트</text>
<text x="88" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">여기서 서버 사이드 렌더를 시도한다</text>
<rect x="68" y="228" width="444" height="48" rx="6" fill="#F5F5F308" stroke="#8B98A9" stroke-width="0.8"/>
<text x="88" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">시드니의 사용자 — 엣지까지는 가깝다</text>
<rect x="688" y="158" width="444" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="708" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">API 와 데이터베이스</text>
<text x="708" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">본사가 뉴욕이라 여기에 둔다</text>
<rect x="688" y="228" width="444" height="48" rx="6" fill="#F5F5F308" stroke="#8B98A9" stroke-width="0.8"/>
<text x="708" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">대부분의 조직이 한두 리전에서 운영한다</text>
<path d="M 512 186 L 688 186" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<rect x="542.0" y="160" width="116" height="18" rx="2" fill="#0D1117"/>
<text x="600.0" y="173" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#F08A59">RTT 200~250ms</text>
<text x="600.0" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">엣지가 사용자에 더 가까워도 데이터를 가지러 가는 시간이 그대로라서 개선이 거의 없거나 아예 없다</text>
<line x1="12" y1="392" x2="1152" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="404" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">응답 시간을 결정하는 경로</text>
</svg>
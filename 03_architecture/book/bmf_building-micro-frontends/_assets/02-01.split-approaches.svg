<title id="dt">수평 분할과 수직 분할 — 같은 화면을 두 방식으로</title><desc id="dd">수평 분할은 한 화면 안을 여러 팀이 나눠 갖고, 수직 분할은 화면 하나를 한 팀이 통째로 갖는다. 색이 붙은 것이 팀 사이 조율이 필요한 자리다.</desc>
<rect width="1240" height="448" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 02-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">수평 분할과 수직 분할 — 같은 화면을 두 방식으로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽은 한 화면을 여럿이 나눠 갖고, 오른쪽은 화면마다 임자가 하나입니다</text>
<rect x="40" y="112" width="560" height="268" rx="8" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="56" y="106" width="128" height="12" rx="2" fill="#0D1117"/>
<text x="120.0" y="115" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#5E6B7E">HORIZONTAL SPLIT</text>
<text x="320.0" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한 화면을 여러 팀이 나눠 갖는다 — 조율이 늘고 재사용이 는다</text>
<rect x="660" y="112" width="540" height="268" rx="8" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="676" y="106" width="114" height="12" rx="2" fill="#0D1117"/>
<text x="733.0" y="115" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#5E6B7E">VERTICAL SPLIT</text>
<text x="930.0" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">화면 하나를 한 팀이 통째로 갖는다 — 조율이 준다</text>

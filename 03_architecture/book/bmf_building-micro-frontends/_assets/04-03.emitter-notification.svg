<title id="dt">조각은 셸을 모른 채 셸의 토스트를 띄운다</title><desc id="dd">이미터는 Object.freeze 로 굳힌 싱글턴이고 조각에 주입된다. 조각은 상대가 누구인지 모르고 이벤트만 던진다.</desc>

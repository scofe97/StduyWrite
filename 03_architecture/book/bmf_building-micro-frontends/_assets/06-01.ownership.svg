<rect x="380.0" y="108" width="480" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="620.0" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">기술 리더십</text>
<text x="620.0" y="160" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">tech leadership</text>
<text x="620.0" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">아키텍트 · 플랫폼 · 클라우드 엔지니어가 함께 가드레일을 정한다</text>
<rect x="100" y="268" width="480" height="132" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="120" y="298" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">플랫폼 팀</text>
<text x="120" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">platform</text>
<text x="120" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">· 자동화 전략을 돌리는 도구</text>
<text x="120" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">· 지속 전달에 쓰는 배포 대시보드</text>
<text x="120" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">· 아키텍처 특성을 강제하는 피트니스 함수</text>
<rect x="660" y="268" width="480" height="132" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="680" y="298" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F08A59">개발 팀</text>
<text x="680" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">product team</text>
<text x="680" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">· 아티팩트를 만드는 스크립트와 단계</text>
<text x="680" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">· 자기 조각의 빌드 도구와 최적화</text>
<text x="680" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">· 그 코드로 최적화하는 최선을 아는 쪽</text>
<rect x="100" y="440" width="1040" height="60" rx="6" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="120" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">배포 단계</text>
<text x="230" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">프로젝트의 모든 조각에서 같다</text>
<text x="120" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">빌드 파이프라인</text>
<text x="230" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">조각마다 다른 도구나 최적화를 쓸 수 있다 · 중앙화하면 결과가 나빠질 수 있다</text>
<line x1="12" y1="516" x2="1192" y2="516" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="528" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">권한을 내려보내라고 한 자리</text>

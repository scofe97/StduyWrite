<title id="dt">자동화 책임이 갈리는 자리</title><desc id="dd">위가 경계를 정하는 쪽이고 아래가 그 안에서 움직이는 두 조직이다. 색이 붙은 쪽이 저자가 권한을 내려보내라고 한 자리다.</desc>
<rect width="1240" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 06-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">자동화 책임이 갈리는 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">노드마다 그 조직이 소유하는 것이 붙습니다</text>
<line x1="620.0" y1="208" x2="620.0" y2="240" stroke="#8B98A9" stroke-width="1.0"/>

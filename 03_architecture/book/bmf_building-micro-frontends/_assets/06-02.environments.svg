<rect x="60" y="110" width="60.800000000000004" height="12" rx="2" fill="#0D1117"/>
<text x="90.4" y="119" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#5E6B7E">TESTING</text>
<text x="60" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">테스트</text>
<text x="60" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">셋 중 가장 불안정하다</text>
<rect x="60" y="192" width="236" height="34" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="72" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">개발자가 빠르게 시도하는 자리</text>
<rect x="340" y="116" width="276" height="264" rx="8" fill="#F5F5F304" stroke="#F5F5F330" stroke-width="1.0"/>
<rect x="360" y="110" width="60.800000000000004" height="12" rx="2" fill="#0D1117"/>
<text x="390.4" y="119" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#5E6B7E">STAGING</text>

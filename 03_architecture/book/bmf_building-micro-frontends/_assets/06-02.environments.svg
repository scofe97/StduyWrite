<rect x="960" y="110" width="73.6" height="12" rx="2" fill="#0D1117"/>
<text x="996.8" y="119" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#F08A59">ON-DEMAND</text>
<text x="960" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">온디맨드</text>

<rect x="660" y="110" width="80.0" height="12" rx="2" fill="#0D1117"/>
<text x="700.0" y="119" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#5E6B7E">PRODUCTION</text>
<text x="660" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">프로덕션</text>

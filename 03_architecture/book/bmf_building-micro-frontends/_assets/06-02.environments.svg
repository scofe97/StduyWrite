<title id="dt">세 환경과 필요할 때 띄우는 환경</title><desc id="dd">앞 셋은 상시로 서 있는 환경이고 마지막 하나는 작업이 끝나면 허무는 환경이다. 색이 붙은 존이 그 임시 환경이다.</desc>
<rect width="1240" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 06-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세 환경과 필요할 때 띄우는 환경</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">존마다 그 안에서 도는 것과 접근 규칙이 붙습니다</text>

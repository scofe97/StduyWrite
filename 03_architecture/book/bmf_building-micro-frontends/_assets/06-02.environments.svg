<text x="972" y="346" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">스팟 인스턴스가 맞는 자리</text>
<line x1="12" y1="416" x2="1192" y2="416" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="438" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

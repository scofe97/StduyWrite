<title id="dt">SSR 이 첫 선택지인가 마지막 선택지인가</title><desc id="dd">같은 기술이 어떤 서비스에는 매출이고 어떤 서비스에는 부담이다. 색이 붙은 갈래가 저자가 SSR 이 빛난다고 적은 쪽이다.</desc>

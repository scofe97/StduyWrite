<title id="dt">세 방식이 무엇을 어디서 띄우나</title><desc id="dd">존 안이 그 방식에서 실제로 서 있는 것이고 맨 아래 줄이 저자가 붙인 대가다. 색이 붙은 존이 외부 의존을 없애는 방식이다.</desc>
<rect width="1240" height="464" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 06-05 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세 방식이 무엇을 어디서 띄우나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">존마다 우리가 띄우는 것과 빌려 오는 것이 갈립니다</text>
<rect x="48" y="116" width="368" height="268" rx="8" fill="#F5F5F304" stroke="#F5F5F330" stroke-width="1.0"/>
<rect x="68" y="110" width="131.2" height="12" rx="2" fill="#0D1117"/>
<text x="133.6" y="119" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#5E6B7E">STABLE ENVIRONMENT</text>
<text x="68" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">안정 환경</text>
<text x="68" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">모든 조각이 존재하는 환경에서 전부 돈다</text>
<rect x="68" y="192" width="328" height="48" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="80" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="600" fill="#5E6B7E">우리가 띄운다</text>
<text x="80" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">모든 조각</text>
<rect x="68" y="248" width="328" height="48" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="80" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="600" fill="#5E6B7E">빌려 온다</text>
<text x="80" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">없음</text>
<line x1="68" y1="316" x2="396" y2="316" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="68" y="340" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">치르는 값</text>
<text x="68" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">피드백 루프가 늦어진다</text>
<rect x="448" y="116" width="368" height="268" rx="8" fill="#F5F5F304" stroke="#F5F5F330" stroke-width="1.0"/>
<rect x="468" y="110" width="73.6" height="12" rx="2" fill="#0D1117"/>
<text x="504.8" y="119" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#5E6B7E">ON-DEMAND</text>
<text x="468" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">온디맨드 환경</text>
<text x="468" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">시나리오에 필요한 자원을 한자리에 모은다</text>
<rect x="468" y="192" width="328" height="48" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="480" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="600" fill="#5E6B7E">우리가 띄운다</text>
<text x="480" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">테스트에 필요한 전부</text>
<rect x="468" y="248" width="328" height="48" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="480" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="600" fill="#5E6B7E">빌려 온다</text>
<text x="480" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">없음</text>
<line x1="468" y1="316" x2="796" y2="316" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="468" y="340" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">치르는 값</text>
<text x="468" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">크면 복잡해지고 잘못 구성하면 비싸다</text>
<rect x="848" y="116" width="368" height="268" rx="8" fill="#F08A590A" stroke="#F08A59" stroke-width="1.4"/>
<rect x="868" y="110" width="92.80000000000001" height="12" rx="2" fill="#0D1117"/>
<text x="914.4" y="119" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#F08A59">PROXY SERVER</text>
<text x="868" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">프록시 서버</text>
<text x="868" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">내 조각만 띄우고 나머지는 환경에서 로드한다</text>
<rect x="868" y="192" width="328" height="48" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="880" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="600" fill="#5E6B7E">우리가 띄운다</text>
<text x="880" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">우리 팀의 조각</text>
<rect x="868" y="248" width="328" height="48" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="880" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="600" fill="#5E6B7E">빌려 온다</text>
<text x="880" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">셸과 남의 조각 · 스테이징이나 프로덕션</text>
<line x1="868" y1="316" x2="1196" y2="316" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="868" y="340" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">치르는 값</text>
<text x="868" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="600" fill="#F08A59">관리할 외부 의존이 없어진다</text>
<line x1="12" y1="420" x2="1192" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="432" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">외부 의존을 없애는 방식</text>

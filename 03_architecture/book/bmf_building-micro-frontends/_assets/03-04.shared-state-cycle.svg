<title id="dt">공유 상태로 모이면 분산 모놀리스가 된다</title><desc id="dd">조각 셋이 같은 상태에 의존하고, 그 상태가 바뀔 때마다 검증 요구가 팀으로 되돌아온다. 되돌아오는 간선이 이 그림의 논지다.</desc>

<title id="dt">네 기둥에 이 프로젝트가 넣은 답</title><desc id="dd">2 장의 결정 프레임워크를 실제 이커머스에 적용한 결과다. 색이 붙은 행이 저자가 통짜로 고르지 않고 서브도메인마다 갈랐다고 밝힌 자리다.</desc>

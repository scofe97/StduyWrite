<title id="dt">홈 존이 진입점이자 교통 조정자다</title><desc id="dd">세 존이 각자 독립된 Next.js 애플리케이션이지만 사용자에게는 한 도메인이다. 색이 붙은 존이 자기 몫을 처리하면서 나머지도 프록시한다.</desc>
<rect width="1280" height="504" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 05-04</text>

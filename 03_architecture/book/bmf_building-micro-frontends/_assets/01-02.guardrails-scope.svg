<title id="dt">가드레일 안의 자율 — 결정 권한의 세 겹</title><desc id="dd">바깥 고리일수록 넓은 범위의 결정이고 안쪽 고리가 팀이 스스로 정하는 영역이다. 저자는 자율을 무제한이 아니라 울타리 안의 자율로 정의한다.</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 01-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">가드레일 안의 자율 — 결정 권한의 세 겹</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">안으로 들어갈수록 결정하는 주체가 좁아지고, 가장 안쪽이 팀의 몫입니다</text>
<rect x="60" y="100" width="880" height="372" rx="8" fill="#F5F5F304" stroke="#F5F5F34D" stroke-width="1.0"/>
<rect x="84" y="94" width="144.0" height="12" rx="2" fill="#0D1117"/>
<text x="156.0" y="103" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#5E6B7E">SYSTEM-WIDE STANDARD</text>
<text x="84" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">시스템 공통 표준</text>
<text x="84" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">로깅 · 모니터링처럼 전체가 맞춰야 하는 핵심 결정만 남긴다</text>
<rect x="100" y="156" width="800" height="260" rx="8" fill="#F5F5F306" stroke="#8B98A9" stroke-width="1.1"/>
<rect x="124" y="150" width="80.0" height="12" rx="2" fill="#0D1117"/>
<text x="164.0" y="159" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#5E6B7E">GUARDRAILS</text>
<text x="124" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">기술 리더십이 세운 가드레일</text>
<text x="124" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아키텍트 · 프린시펄 엔지니어 · CTO가 현장 관행과 함께 정한다</text>
<rect x="140" y="212" width="720" height="148" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<rect x="164" y="206" width="99.2" height="12" rx="2" fill="#0D1117"/>
<text x="213.6" y="215" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#F08A59">TEAM AUTONOMY</text>
<text x="164" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">팀이 스스로 정하는 영역</text>
<text x="164" y="272" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 도메인에 맞는 도구와 접근을 고른다</text>
<text x="164" y="296" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 중앙 결정을 기다리지 않고 배포한다</text>
<text x="164" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 도메인 전문성이 쌓이므로 팀이 가장 잘 판단한다</text>
<line x1="12" y1="512" x2="952" y2="512" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="534" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="524" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="534" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">팀의 몫</text>

<title id="dt">5 장을 닫는 네 절</title><desc id="dd">데이터가 어디서 오는지에서 출발해 그것을 어떻게 캐시할지로 가고, BBC 의 실제 배치를 본 뒤 성능을 재는 방법으로 닫는다.</desc>

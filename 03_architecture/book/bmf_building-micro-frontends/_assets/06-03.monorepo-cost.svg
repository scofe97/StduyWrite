<title id="dt">모노레포가 치르는 값 다섯</title><desc id="dd">오른쪽 끝이 값을 안 냈을 때의 결과이고, 뼈 다섯은 원문이 목록으로 든 난제다. 색이 붙은 뼈가 조각에 따로 경고가 붙은 원인이다.</desc>
<rect width="1440" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 06-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">모노레포가 치르는 값 다섯</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">결과 하나로 묶은 것은 노트의 읽기이고, 뼈 다섯은 원문의 목록입니다</text>
<path d="M 80 320 L 1196 320" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="880" y1="320" x2="784" y2="152" stroke="#8B98A9" stroke-width="1.1"/>
<line x1="848" y1="264" x2="816" y2="264" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="812" y="260" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">모노레포에 안 맞는 도구가 많다</text>
<line x1="816" y1="208" x2="784" y2="208" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="780" y="204" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">저장소가 지수적으로 커진다</text>
<line x1="720" y1="320" x2="624" y2="488" stroke="#8B98A9" stroke-width="1.1"/>
<line x1="688" y1="376" x2="656" y2="376" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="652" y="388" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">임계를 넘으면 투자가 계속 는다</text>
<line x1="656" y1="432" x2="624" y2="432" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="620" y="444" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">Google · Facebook · X 가 자체 도구를 만들었다</text>
<line x1="560" y1="320" x2="464" y2="152" stroke="#F08A59" stroke-width="1.4"/>
<line x1="528" y1="264" x2="496" y2="264" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="492" y="260" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">함께 배포될 때만 존재한다</text>
<line x1="496" y1="208" x2="464" y2="208" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="460" y="204" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">다른 모노레포에 공유하지 못한다</text>
<line x1="400" y1="320" x2="304" y2="488" stroke="#8B98A9" stroke-width="1.1"/>
<line x1="368" y1="376" x2="336" y2="376" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="332" y="388" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">하루 수천 커밋을 받는 브랜치</text>
<line x1="336" y1="432" x2="304" y2="432" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="300" y="444" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">조직 전체의 규율과 성숙도</text>
<line x1="240" y1="320" x2="144" y2="152" stroke="#8B98A9" stroke-width="1.1"/>
<line x1="208" y1="264" x2="176" y2="264" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="172" y="260" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">수십에서 수백 명이 함께</text>
<line x1="176" y1="208" x2="144" y2="208" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="140" y="204" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">히스토리가 지저분해진다</text>
<rect x="713.5" y="138" width="141" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="784" y="157" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">자동화 도구 투자</text>
<rect x="560.0" y="474" width="128" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="624" y="493" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">코드베이스 확장</text>
<rect x="406.5" y="138" width="115" height="28" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.3"/>
<text x="464" y="157" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">프로젝트 결합</text>
<rect x="233.5" y="474" width="141" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="304" y="493" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">트렁크 기반 개발</text>
<rect x="93.0" y="138" width="102" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="144" y="157" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">개발자 규율</text>
<rect x="1200" y="280" width="200" height="80" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="1300" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">값을 안 내면</text>
<text x="1300" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">전체가 함께 느려진다</text>
<text x="1300" y="350" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">OBSERVED EFFECT</text>
<line x1="12" y1="540" x2="1392" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="562" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="552" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">조각에 따로 경고가 붙은 원인 · 그 결과</text>
</svg>
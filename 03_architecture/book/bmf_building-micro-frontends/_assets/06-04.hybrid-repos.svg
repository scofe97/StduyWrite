<title id="dt">서브도메인으로 묶는 하이브리드</title><desc id="dd">저장소 경계를 팀이 아니라 바운디드 컨텍스트에 맞춘다. 색이 붙은 점선이 서브도메인 사이를 잇는 유일한 경로다.</desc>

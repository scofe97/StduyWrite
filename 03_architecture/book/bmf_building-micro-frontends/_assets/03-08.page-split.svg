<title id="dt">페이지 그룹마다 한 팀이 끝까지 소유한다</title><desc id="dd">가운데 위가 모든 페이지가 함께 쓰는 템플릿이고 아래 세 칸이 각 팀의 소유 범위다. 캐시도 인프라도 칸마다 따로 정한다.</desc>
<rect width="1200" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 03-08 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">페이지 그룹마다 한 팀이 끝까지 소유한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표는 각 페이지 그룹이 같은 템플릿 안에 실린다는 뜻입니다</text>
<rect x="300" y="108" width="600" height="76" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="600.0" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">표준 템플릿</text>
<text x="600.0" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">푸터처럼 공통인 부분은 런타임에 얹는다</text>
<rect x="40" y="232" width="360" height="172" rx="8" fill="#F5F5F303" stroke="#F5F5F330" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="54" y="224" width="98.0" height="16" fill="#0D1117"/>
<text x="60" y="236" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">OWNED BY TEAM A</text>
<rect x="64" y="258" width="312" height="120" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="84" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">랜딩 페이지 그룹</text>
<text x="84" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">· 독립 개발 · 독립 배포</text>
<text x="84" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">· 정적에 가까워 길게 캐시</text>
<rect x="420" y="232" width="360" height="172" rx="8" fill="#F5F5F303" stroke="#F5F5F330" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="434" y="224" width="98.0" height="16" fill="#0D1117"/>
<text x="440" y="236" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">OWNED BY TEAM B</text>
<rect x="444" y="258" width="312" height="120" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="464" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">카탈로그 뷰</text>
<text x="464" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">· 한 뷰에 조각이 여럿</text>
<text x="464" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">· 그룹 단위로 따로 캐시</text>
<rect x="800" y="232" width="360" height="172" rx="8" fill="#F5F5F303" stroke="#F5F5F330" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="814" y="224" width="98.0" height="16" fill="#0D1117"/>
<text x="820" y="236" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">OWNED BY TEAM C</text>
<rect x="824" y="258" width="312" height="120" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="844" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">체크아웃 그룹</text>
<text x="844" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">· 하부 인프라를 따로 설정</text>
<text x="844" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">· 개인화가 많아 짧게 캐시</text>
<path d="M 360 184 L 360 208.0 L 220.0 208.0 L 220.0 232" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 600.0 184 L 600.0 232" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 840 184 L 840 208.0 L 980.0 208.0 L 980.0 232" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="12" y1="436" x2="1152" y2="436" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="458" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="448" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">모든 페이지가 함께 쓰는 것</text>
<rect x="339" y="448" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="361" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">팀이 끝까지 소유하는 범위</text>

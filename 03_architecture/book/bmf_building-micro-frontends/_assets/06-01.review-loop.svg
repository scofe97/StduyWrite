<title id="dt">파이프라인을 다시 보는 순환</title><desc id="dd">시계 방향으로 한 바퀴가 돌 때마다 소요 시간이 가운데 대시보드에 쌓이고, 그 기록이 다음 바퀴에서 고칠 단계를 정한다.</desc>
<rect width="1000" height="864" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 06-01 §4</text>

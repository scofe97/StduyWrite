<rect x="816" y="168" width="260" height="48" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="946.0" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="600" fill="#F08A59">설정과 관리가 가장 단순하다</text>
<rect x="12" y="220" width="240" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="26" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F5F5F3">다중 스토리지 + 단일 CDN</text>
<text x="26" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="8.5" font-weight="400" fill="#8B98A9">팀마다 버킷</text>
<rect x="264" y="220" width="260" height="48" rx="6" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="394.0" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">팀마다 버킷 · 전달은 한 CDN</text>
<rect x="540" y="220" width="260" height="48" rx="6" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="670.0" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">자율적인 팀이 많은 큰 조직</text>
<rect x="816" y="220" width="260" height="48" rx="6" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="946.0" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">호환과 중복을 막을 조율이 든다</text>
<rect x="12" y="272" width="240" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="26" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F5F5F3">보안 컨테이너</text>
<text x="26" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="8.5" font-weight="400" fill="#8B98A9">규제 산업</text>
<rect x="264" y="272" width="260" height="48" rx="6" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="394.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">VPN 안의 컨테이너로 서빙</text>
<rect x="540" y="272" width="260" height="48" rx="6" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="670.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">정적 파일의 공개 접근이 금지될 때</text>
<rect x="816" y="272" width="260" height="48" rx="6" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="946.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#E3B341">컴퓨트를 낭비하고 복잡도가 크다</text>
<line x1="12" y1="348" x2="1076" y2="348" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="370" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="360" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">가능하면 이것을 쓰라고 권한 쪽</text>
<rect x="365" y="360" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="387" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">저자가 강하게 말리는 값</text>

<title id="dt">경계가 잘 그어졌는지 재는 두 축</title><desc id="dd">노출하는 API 표면의 넓이와 조각의 입도로 네 자리를 가른다. 색이 붙은 칸이 저자가 권하는 자리다.</desc>
<rect width="1240" height="704" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 02-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">경계가 잘 그어졌는지 재는 두 축</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로가 컨테이너에 노출하는 계약의 넓이, 세로가 조각의 입도입니다</text>
<path d="M 252 360 H 988" fill="none" stroke="#F5F5F3" stroke-width="1.2"/>
<path d="M 620 112 V 608" fill="none" stroke="#F5F5F3" stroke-width="1.2"/>
<path d="M 264 360 L 252 360" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 976 360 L 988 360" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 620 124 L 620 112" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 620 596 L 620 608" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="240" y="364" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">NARROW</text>
<text x="1000" y="364" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">WIDE</text>
<text x="620" y="100" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">COARSE</text>
<text x="620" y="628" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">FINE</text>
<rect x="292" y="152" width="280" height="160" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="312" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F08A59">01 · NARROW / COARSE</text>
<text x="312" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F08A59">잘 그어진 경계</text>
<text x="312" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">세션 토큰이나 제품 ID 정도만 받는다</text>
<text x="312" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">도메인 하나를 통째로 소유한다</text>
<rect x="668" y="152" width="280" height="160" rx="8" fill="#F5F5F30A" stroke="#8B98A947" stroke-width="1.0"/>
<text x="688" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#8B98A9">02 · WIDE / COARSE</text>
<text x="688" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">컨테이너가 문맥을 쥔다</text>
<text x="688" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">속성을 많이 노출해 소유권이 넘어간다</text>
<text x="688" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">배포마다 팀 사이 조율이 붙는다</text>
<rect x="292" y="408" width="280" height="160" rx="8" fill="#F5F5F30A" stroke="#8B98A947" stroke-width="1.0"/>
<text x="312" y="436" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#8B98A9">03 · NARROW / FINE</text>
<text x="312" y="468" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">컴포넌트에 가깝다</text>
<text x="312" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">계약은 좁지만 너무 잘다</text>
<text x="312" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">뷰마다 조각이 늘고 중첩이 깊어진다</text>
<rect x="668" y="408" width="280" height="160" rx="8" fill="#F5F5F30A" stroke="#8B98A947" stroke-width="1.0"/>
<text x="688" y="436" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#8B98A9">04 · WIDE / FINE</text>
<text x="688" y="468" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">가장 나쁜 자리</text>
<text x="688" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">결합이 늘고 외부 의존이 쌓인다</text>
<text x="688" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">컨텍스트가 컨테이너로 새어 나간다</text>
<line x1="12" y1="664" x2="1192" y2="664" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="686" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="676" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="686" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">저자가 권하는 자리</text>
<rect x="274" y="676" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="296" y="686" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">피해야 할 자리</text>
</svg>
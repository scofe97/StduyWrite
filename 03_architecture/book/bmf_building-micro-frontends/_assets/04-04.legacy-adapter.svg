<title id="dt">어댑터 조각이 두 세계를 옮겨 준다</title><desc id="dd">셸을 레거시와 직접 잇지 않는다. 가운데 조각이 쿼리 스트링으로 iframe 을 조종하고 돌아온 메시지를 이벤트로 번역한다.</desc>
<rect width="1200" height="564" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 04-04 §1</text>

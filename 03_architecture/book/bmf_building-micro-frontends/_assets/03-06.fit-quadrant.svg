<title id="dt">iframe 이 맞는 자리를 가르는 두 축</title><desc id="dd">조각 사이에 오갈 정보의 양과 격리를 강제해야 하는 정도로 네 자리를 가른다. 색이 붙은 칸이 저자가 iframe 을 권하는 자리다.</desc>
<rect width="1240" height="704" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 03-06 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">iframe 이 맞는 자리를 가르는 두 축</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로가 조각 사이 상호작용의 양, 세로가 격리를 강제해야 하는 정도입니다</text>
<path d="M 252 360 H 988" fill="none" stroke="#F5F5F3" stroke-width="1.2"/>
<path d="M 620 112 V 608" fill="none" stroke="#F5F5F3" stroke-width="1.2"/>
<path d="M 264 360 L 252 360" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 976 360 L 988 360" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 620 124 L 620 112" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 620 596 L 620 608" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="240" y="364" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">FEW</text>
<text x="1000" y="364" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">MANY</text>
<text x="620" y="100" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">HIGH</text>
<text x="620" y="628" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">LOW</text>
<rect x="292" y="152" width="280" height="160" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="312" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F08A59">01 · FEW / HIGH</text>
<text x="312" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F08A59">iframe 이 빛나는 자리</text>
<text x="312" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">인트라넷 대시보드 · 규제 산업 B2B</text>
<text x="312" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">레거시를 새 앱 옆에 격리해 둔다</text>
<rect x="668" y="152" width="280" height="160" rx="8" fill="#F5F5F30A" stroke="#8B98A947" stroke-width="1.0"/>
<text x="688" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#8B98A9">02 · MANY / HIGH</text>
<text x="688" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">다른 격리 수단을 본다</text>
<text x="688" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">화면을 가로지르는 상호작용은 조율이 어렵다</text>
<text x="688" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정보 공유가 많으면 맞는 접근이 아니다</text>
<rect x="292" y="408" width="280" height="160" rx="8" fill="#F5F5F30A" stroke="#8B98A947" stroke-width="1.0"/>
<text x="312" y="436" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#8B98A9">03 · FEW / LOW</text>
<text x="312" y="468" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">값을 치를 이유가 없다</text>
<text x="312" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">성능 · 접근성 · 색인 불가를 그냥 떠안는다</text>
<text x="312" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">더 현대적인 접근이 낫다</text>
<rect x="668" y="408" width="280" height="160" rx="8" fill="#F5F5F30A" stroke="#8B98A947" stroke-width="1.0"/>
<text x="688" y="436" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#8B98A9">04 · MANY / LOW</text>
<text x="688" y="468" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">가장 나쁜 자리</text>
<text x="688" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">중첩된 DOM 에 종단 간 테스트가 길어진다</text>
<text x="688" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">반응형 레이아웃까지 겹치면 손이 많이 간다</text>
<line x1="12" y1="664" x2="1192" y2="664" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="686" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="676" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="686" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">저자가 iframe 을 권하는 자리</text>
<rect x="391" y="676" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="413" y="686" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">다른 접근을 보는 자리</text>
</svg>
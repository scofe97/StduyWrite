<title id="dt">실패한 조각을 어떻게 다룰 것인가</title><desc id="dd">플레이스홀더에 적어 둔 errorbehaviour 가 컴포저의 판단을 정한다. 색이 붙은 갈래가 페이지 전체를 살리는 쪽이다.</desc>

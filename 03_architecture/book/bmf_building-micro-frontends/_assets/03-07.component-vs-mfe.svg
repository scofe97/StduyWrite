<title id="dt">웹 컴포넌트는 두 집합에 걸쳐 있다</title><desc id="dd">왼쪽은 재사용을 위한 기술 해법이고 오른쪽은 서브도메인의 비즈니스 표현이다. 색이 붙은 겹침이 선이 흐려지는 자리다.</desc>
<rect width="1020" height="590" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 03-07 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">웹 컴포넌트는 두 집합에 걸쳐 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">겹치는 부분이 웹 컴포넌트가 조각의 래퍼로 쓰일 때입니다</text>
<circle cx="400" cy="306" r="180" fill="#F5F5F30A" stroke="#F5F5F3" stroke-width="1.0"/>
<circle cx="620" cy="306" r="180" fill="#8B98A90D" stroke="#8B98A9" stroke-width="1.0"/>
<text x="300" y="108" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">COMPONENT</text>
<text x="300" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">컴포넌트</text>
<text x="720" y="108" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">MICRO-FRONTEND</text>
<text x="720" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">마이크로 프론트엔드</text>
<text x="322" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">확장에 열려 있다</text>
<text x="322" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">속성으로 동작을 바꾼다</text>
<text x="322" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">재사용을 위한 기술 해법</text>
<text x="700" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">확장에 닫혀 있다</text>
<text x="700" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">통신에는 열려 있다</text>
<text x="700" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">서브도메인의 비즈니스 표현</text>
<rect x="473.0" y="297" width="74.0" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="510" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">웹 컴포넌트</text>
<line x1="510" y1="318" x2="510" y2="504" stroke="#F08A59" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="510" y="524" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">래퍼가 동작을 커스터마이즈하게 두면 도메인 로직이 밖으로 샌다</text>
<line x1="12" y1="546" x2="972" y2="546" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="568" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="558" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="568" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">선이 흐려지는 자리</text>
</svg>
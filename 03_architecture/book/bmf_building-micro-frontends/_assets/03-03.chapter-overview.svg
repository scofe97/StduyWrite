<title id="dt">수직 분할의 진화와 성능 — 읽는 순서</title><desc id="dd">수직 분할 뒷부분 노트의 절 다섯. 처음 그은 경계를 다시 긋는 법에서 출발해 성능과 점수표로 닫는다.</desc>
<rect width="1240" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 03-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">수직 분할의 진화와 성능 — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앞 네 칸이 아키텍처를 키우는 방법이고, 마지막 칸이 그 결과의 점수입니다</text>
<path d="M 408 152.0 L 430 152.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

<text x="958.0" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">1MB HTML 을 5 밀리초에</text>

<text x="390.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">위 두 곳 어디든</text>
<rect x="540" y="272" width="268" height="48" rx="6" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="674.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">자주 쓰는 데이터와 비싼 연산 결과</text>
<rect x="824" y="272" width="268" height="48" rx="6" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="958.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">첫 요청자가 느린 경험을 겪지 않는다</text>
<text x="26" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="600" fill="#F5F5F3">TTL 은 콘텐츠 변동성에 맞춘다</text>

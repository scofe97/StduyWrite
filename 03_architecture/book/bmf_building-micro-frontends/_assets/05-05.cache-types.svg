<title id="dt">알아야 할 캐시 세 종류</title><desc id="dd">5 초짜리 TTL 하나만 걸어도 백엔드 부담이 크게 준다는 것이 이 절의 요지다. 색이 붙은 행이 트래픽 급증의 첫 방어선이다.</desc>
<rect width="1140" height="414" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 05-05 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">알아야 할 캐시 세 종류</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행이 캐시 종류이고 열이 그 캐시를 가르는 축입니다</text>

<rect x="256" y="100" width="268" height="52" rx="6" fill="#F5F5F3"/>
<text x="390.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#0D1117">어디에 두나</text>
<text x="390.0" y="140" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#0D1117" opacity="0.85">where</text>
<rect x="540" y="100" width="268" height="52" rx="6" fill="#F5F5F3"/>
<text x="674.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#0D1117">무엇을 담나</text>
<text x="674.0" y="140" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#0D1117" opacity="0.85">what</text>

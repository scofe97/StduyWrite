<text x="26" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="8.5" font-weight="400" fill="#8B98A9">미리 채워 둔다</text>

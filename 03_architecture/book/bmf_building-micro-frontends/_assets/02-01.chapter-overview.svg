<title id="dt">네 기둥과 첫 기둥 — 읽는 순서</title><desc id="dd">2장 앞부분 노트의 절 다섯을 읽는 순서로 이은 지도. 네 결정을 세우고 그중 첫 결정인 정의로 들어가 서브도메인 분류로 닫는다.</desc>
<rect width="1240" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">네 기둥과 첫 기둥 — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앞 네 칸이 무엇을 하나로 볼지 정하는 과정이고, 마지막 칸이 그 판단을 투자로 잇습니다</text>

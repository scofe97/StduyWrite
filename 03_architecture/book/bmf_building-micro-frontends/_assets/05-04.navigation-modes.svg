<title id="dt">존을 건너면 페이지가 다시 뜬다</title><desc id="dd">같은 존 안의 이동은 Next.js 가 처리해 빠르다. 존 경계를 넘는 순간 리소스가 통째로 갈리고, 색이 붙은 상태가 그 대가를 치르는 자리다.</desc>
<rect width="1240" height="558" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 05-04 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">존을 건너면 페이지가 다시 뜬다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글이 그 전이를 일으키는 방아쇠입니다</text>

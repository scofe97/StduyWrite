<text x="72" y="268.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#8B98A9">250KB</text>
<line x1="80" y1="187.5" x2="960" y2="187.5" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="72" y="190.5" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#8B98A9">375KB</text>
<line x1="80" y1="110.0" x2="960" y2="110.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="72" y="113.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#8B98A9">500KB</text>
<line x1="80" y1="110" x2="80" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="80" y1="420" x2="960" y2="420" stroke="#8B98A9" stroke-width="1.0"/>
<rect x="265.0" y="110.0" width="110" height="310.0" rx="3" fill="#8B98A926" stroke="#8B98A9" stroke-width="1.1"/>
<text x="320.0" y="102.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#8B98A9">500KB</text>
<text x="320.0" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">SPA · 모든 사용자</text>
<text x="320.0" y="460" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">로직 250 + 공유 250</text>
<rect x="465.0" y="203.0" width="110" height="217.0" rx="3" fill="#F08A591F" stroke="#F08A59" stroke-width="1.1"/>
<text x="520.0" y="195.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#F08A59">약 350KB</text>
<text x="520.0" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">수직 · 비인증 영역만</text>
<text x="520.0" y="460" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">로직 100 미만 + 공유 250</text>
<rect x="665.0" y="110.0" width="110" height="310.0" rx="3" fill="#8B98A926" stroke="#8B98A9" stroke-width="1.1"/>
<text x="720.0" y="102.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#8B98A9">500KB</text>
<text x="720.0" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">수직 · 인증까지 간 사용자</text>
<text x="720.0" y="460" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">앞에서 다 받지는 않는다</text>

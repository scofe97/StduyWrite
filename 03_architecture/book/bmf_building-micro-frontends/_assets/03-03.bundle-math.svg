<title id="dt">사용자가 실제로 받는 양</title><desc id="dd">같은 500KB 애플리케이션을 SPA 로 낼 때와 수직 분할로 낼 때. 아끼는 쪽은 랜딩만 보고 떠나는 사용자다.</desc>
<rect width="1000" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 03-03 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">사용자가 실제로 받는 양</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">막대 아래가 그 사용자가 받는 것의 내역입니다</text>

<title id="dt">토큰을 어디에 두는가</title><desc id="dd">수평 분할에서는 한 뷰의 여러 조각이 같은 토큰을 필요로 한다. 색이 붙은 행이 조각에게서 토큰을 아예 걷어내는 선택지다.</desc>

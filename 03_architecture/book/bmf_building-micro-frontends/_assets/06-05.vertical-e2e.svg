<title id="dt">경계를 넘는 테스트는 양쪽이 나눠 쓴다</title><desc id="dd">왼쪽 열이 자기 도메인 안이고 오른쪽 열이 경계 너머의 확인이다. 색이 붙은 칸이 팀의 통제 밖을 향하는 테스트다.</desc>

<title id="dt">모노레포를 읽는 다섯 자리</title><desc id="dd">저장소를 하나로 두는 정의에서 출발해 이점과 값을 지나 Google 이 스스로 내린 결론에서 멈춘다.</desc>
<rect width="1240" height="276" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 06-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">모노레포를 읽는 다섯 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칸마다 절 번호와 그 절이 답하는 것이 붙습니다</text>

<title id="dt">첫 결정과 두 갈래가 사는 것</title><desc id="dd">수평이냐 수직이냐가 첫 결정이고, 그 뒤의 조합·라우팅·기술이 여기에 매인다. 색이 붙은 마름모가 파급이 가장 큰 판단이다.</desc>
<rect width="1240" height="732" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 03-01 §1~§3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">첫 결정과 두 갈래가 사는 것</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">마름모가 판단, 사각형이 결과, 타원이 종착입니다</text>
<path d="M 620 136 L 620 178" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>

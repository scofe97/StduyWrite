<title id="dt">브라우저는 핸드오프를 모른다</title><desc id="dd">홈 존이 경로를 보고 카탈로그 존에 프록시한 뒤 돌아온 HTML 을 그대로 전달한다. 사용자는 같은 도메인에 머문다.</desc>
<rect width="1180" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 05-04 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">브라우저는 핸드오프를 모른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가운데 레인이 진입점이자 프록시인 홈 존입니다</text>

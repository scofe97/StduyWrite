<text x="392.0" y="140" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#0D1117" opacity="0.85">where</text>
<rect x="540" y="100" width="264" height="52" rx="6" fill="#F5F5F3"/>
<text x="672.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#0D1117">왜</text>
<text x="672.0" y="140" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#0D1117" opacity="0.85">why</text>
<rect x="820" y="100" width="264" height="52" rx="6" fill="#F5F5F3"/>
<text x="952.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#0D1117">주의</text>
<text x="952.0" y="140" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#0D1117" opacity="0.85">caveat</text>

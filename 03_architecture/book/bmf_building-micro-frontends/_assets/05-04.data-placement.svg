<text x="26" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="8.5" font-weight="400" fill="#8B98A9">장바구니 수 · 사용자 선호</text>
<rect x="260" y="272" width="264" height="48" rx="6" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="392.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">백엔드 저장소와 API</text>

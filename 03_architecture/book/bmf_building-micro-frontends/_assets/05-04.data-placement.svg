<text x="202" y="394" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">HttpOnly (XSS) · Secure (HTTPS 만) · SameSite=Lax 또는 Strict (CSRF)</text>

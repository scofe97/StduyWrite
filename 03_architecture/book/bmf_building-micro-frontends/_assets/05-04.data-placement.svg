<title id="dt">존 사이에 무엇을 어디로 넘기나</title><desc id="dd">존이 독립 애플리케이션이라 데이터마다 넘기는 길이 다르다. 색이 붙은 행이 저자가 저장 위치를 못 박은 자리다.</desc>
<rect width="1132" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 05-04 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">존 사이에 무엇을 어디로 넘기나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행이 데이터의 성격이고 열이 그에 따른 결정입니다</text>

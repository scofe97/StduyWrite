<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가운데 레인이 셸 헤더 안에 얹힌 장바구니 컴포넌트입니다</text>

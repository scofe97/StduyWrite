<title id="dt">장바구니는 셸 안에 살지만 셸의 것이 아니다</title><desc id="dd">셸이 노출 여부를 정하면 체크아웃 도메인이 셸로 샌다. 그래서 컴포넌트가 스스로 판단하고 스스로 개수를 가져온다.</desc>

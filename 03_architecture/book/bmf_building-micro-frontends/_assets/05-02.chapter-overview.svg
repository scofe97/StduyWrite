<title id="dt">UI 컴포저가 조각을 꿰맨다</title><desc id="dd">요청은 CDN 에서 출발해 컴포저에 닿고, 컴포저가 업스트림에서 HTML 조각을 받아 템플릿에 끼운다. 색이 붙은 상자는 비즈니스 로직을 모른다.</desc>

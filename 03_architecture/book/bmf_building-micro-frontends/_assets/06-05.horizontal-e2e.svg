<title id="dt">한 뷰의 최종 출력에 여러 팀이 기여한다</title><desc id="dd">위가 조각을 대는 팀들이고 가운데가 그 조각이 함께 나타나는 뷰다. 색이 붙은 팀의 조각이 여러 뷰에 걸쳐 있다.</desc>
<rect width="1240" height="664" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 06-05 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 뷰의 최종 출력에 여러 팀이 기여한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">붉은 점선은 다른 팀이 조각을 바꾸는 순간 일어나는 일입니다</text>
<path d="M 258.0 232 L 258.0 290 L 400.0 290 L 400.0 314" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 258.0 232 L 258.0 290 L 840.0 290 L 840.0 314" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 1034.0 232 L 1034.0 290 L 400.0 290 L 400.0 314" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 1034.0 232 L 1034.0 290 L 840.0 290 L 840.0 314" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 646.0 232 L 646.0 290 L 400.0 290 L 400.0 314" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)"/>
<path d="M 646.0 232 L 646.0 290 L 840.0 290 L 840.0 314" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)"/>
<path d="M 400.0 412 L 400.0 472 L 620.0 472 L 620.0 490" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 840.0 412 L 840.0 472 L 620.0 472 L 620.0 490" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 420 536.0 L 48 536.0 L 48 186.0 L 86 186.0" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)" stroke-dasharray="5 5"/>
<rect x="155.5" y="514.0" width="157.0" height="16" fill="#0D1117"/>
<text x="234.0" y="526.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="600" fill="#F0616D">바뀌면 무효가 되거나 깨진다</text>
<rect x="88" y="140" width="340" height="92" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="108" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">카탈로그 팀</text>
<text x="108" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">자기 조각을 뷰에 얹는다</text>
<rect x="476" y="140" width="340" height="92" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="496" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F08A59">결제 팀</text>
<text x="496" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">결제에 필요한 모든 조각</text>
<rect x="864" y="140" width="340" height="92" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="884" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">그 밖의 팀</text>
<text x="884" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">같은 뷰에 함께 기여한다</text>

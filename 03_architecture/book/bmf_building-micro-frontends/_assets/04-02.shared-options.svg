<text x="374.0" y="290" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">다른 스코프에 따로 붙인다</text>
<rect x="516" y="264" width="252" height="44" rx="6" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="642.0" y="290" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">기본 스코프와의 버전 충돌</text>

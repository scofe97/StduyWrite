<title id="dt">shared 에 줄 수 있는 다섯 옵션</title><desc id="dd">공유 라이브러리를 별도 저장소로 빼는 대신 설정 한 줄로 끝내는 것이 이 플러그인의 값이다. 색이 붙은 행이 이 프로젝트가 세 라이브러리 모두에 준 옵션이다.</desc>
<rect width="1084" height="476" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 04-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">shared 에 줄 수 있는 다섯 옵션</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행이 옵션이고 열이 그 옵션이 만드는 차이입니다</text>

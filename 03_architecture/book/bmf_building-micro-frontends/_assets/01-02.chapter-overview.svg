<title id="dt">일곱 원칙과 프론트엔드로의 번역 — 읽는 순서</title><desc id="dd">1장 후반부 노트의 절 일곱을 읽는 순서로 이은 지도. 원칙을 세우고 프론트엔드로 옮긴 뒤 고유 난제를 지나 적합성 판정으로 닫는다.</desc>
<rect width="1240" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 01-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">일곱 원칙과 프론트엔드로의 번역 — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앞 여섯 칸이 원칙을 옮기는 과정이고, 마지막 칸이 이 장의 결론입니다</text>
<path d="M 312 152.0 L 334 152.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 608 152.0 L 630 152.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 904 152.0 L 926 152.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

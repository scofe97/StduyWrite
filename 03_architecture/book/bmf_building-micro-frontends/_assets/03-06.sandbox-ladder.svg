<text x="834" y="140" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">03</text>
<text x="834" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14.5" font-weight="600" fill="#F5F5F3">폼까지 연다</text>
<text x="834" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">폼 제출도 함께 허용</text>
<text x="834" y="224" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#F5F5F3">sandbox="allow-scripts allow-forms"</text>

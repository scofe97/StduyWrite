<title id="dt">sandbox 는 닫힌 데서 시작해 하나씩 연다</title><desc id="dd">왼쪽이 가장 권한이 적은 구현이고 오른쪽으로 갈수록 제한이 풀린다. 색이 붙은 첫 칸이 저자가 기본으로 든 상태다.</desc>
<rect width="1200" height="332" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 03-06 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">sandbox 는 닫힌 데서 시작해 하나씩 연다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">오른쪽으로 갈수록 iframe 안에서 할 수 있는 일이 늘어납니다</text>

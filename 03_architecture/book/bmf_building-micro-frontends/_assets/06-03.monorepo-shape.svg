<title id="dt">모든 프로젝트가 한 저장소 안에 있다</title><desc id="dd">바깥 상자가 저장소이고 안이 그 안에 함께 놓인 것들이다. 색이 붙은 것이 저자가 첫 이점으로 든 공유 라이브러리다.</desc>

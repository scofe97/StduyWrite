<title id="dt">헤더와 푸터를 언제 합칠 것인가</title><desc id="dd">존이 독립 배포되므로 공유 컴포넌트를 언제 끼워 넣을지 정해야 한다. 색이 붙은 갈래가 저자가 대부분 팀에 권하는 쪽이다.</desc>

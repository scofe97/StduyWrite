<title id="dt">F1.com 은 한 번에 다시 쓰지 않았다</title><desc id="dd">도메인 경계를 먼저 찾고 1 단계 URL 라우팅을 엣지에 걸어, 옮긴 페이지부터 새 애플리케이션이 받게 했다. 색이 붙은 가운데 상태가 마이그레이션 내내 유지된 자리다.</desc>
<rect width="1380" height="436" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 05-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">F1.com 은 한 번에 다시 쓰지 않았다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글이 그 전이를 일으키는 방아쇠입니다</text>
<circle cx="16" cy="218.0" r="6" fill="#F5F5F3"/>
<path d="M 24 218.0 L 68 218.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 370 218.0 L 538 218.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="455.0" y="192.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">도메인 경계를 찾는다</text>
<text x="455.0" y="208.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">엣지에 1 단계 라우팅</text>
<path d="M 840 218.0 L 1008 218.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="925.0" y="200.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">남은 페이지도 옮긴다</text>
<path d="M 690.0 256 V 340 H 570.0 V 258" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="630.0" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#F08A59">도메인을 하나씩 빼낸다 · 나머지는 모놀리스가 계속 받는다</text>
<rect x="70" y="180" width="300" height="76" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="220.0" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">AEM 모놀리스</text>
<text x="220.0" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">한 서버가 모든 HTML 을 만든다</text>
<rect x="540" y="180" width="300" height="76" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="690.0" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">모놀리스와 조각의 공존</text>
<text x="690.0" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#F08A59">옮긴 경로만 새 애플리케이션이 받는다</text>
<rect x="1010" y="180" width="300" height="76" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="1160.0" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">조각 아키텍처</text>
<text x="1160.0" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">공유 컴포넌트와 전용 컴포넌트가 섞인다</text>
<line x1="12" y1="392" x2="1332" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="404" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">마이그레이션 내내 유지된 상태</text>
</svg>
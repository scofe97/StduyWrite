<title id="dt">한 화면을 네 팀이 나눠 갖는다</title><desc id="dd">위가 셸과 디자인 시스템을 대는 팀이고 아래가 뷰에 조각을 얹는 세 팀이다. 색이 붙은 팀이 다른 조각을 조합하는 자리다.</desc>

<text x="122" y="440" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">저자가 뷰마다 정하라고 못 박은 층</text>

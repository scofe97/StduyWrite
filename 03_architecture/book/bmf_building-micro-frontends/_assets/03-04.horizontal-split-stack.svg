<title id="dt">수평 분할이 요구하는 네 층</title><desc id="dd">아래가 먼저 서야 하는 토대이고 위로 갈수록 드물게 지켜지는 규약이다. 색이 붙은 꼭대기가 저자가 뷰마다 정하라고 못 박은 자리다.</desc>
<rect width="1000" height="462" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 03-04</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">수평 분할이 요구하는 네 층</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">아래에서 위로 읽습니다</text>
<polygon points="370.0,112 630.0,112 695.0,180 305.0,180" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F08A59">최종 산출을 한 팀이 책임진다</text>
<text x="500" y="161" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#F08A59">뷰마다 대표 팀 하나</text>
<polygon points="305.0,180 695.0,180 760.0,248 240.0,248" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="209" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">격리 규약을 먼저 정한다</text>
<text x="500" y="229" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">CSS 접두 · 단일 프레임워크 · 토큰 저장 위치</text>
<polygon points="240.0,248 760.0,248 825.0,316 175.0,316" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="277" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">공유 상태 대신 비동기 통신</text>
<text x="500" y="297" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">입력 · 출력 이벤트를 문서로 남긴다</text>
<polygon points="175.0,316 825.0,316 890.0,384 110.0,384" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="345" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">굵은 경계로 시작한다</text>
<text x="500" y="365" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">한 뷰에 조각 6~7 개를 넘기지 않는다</text>

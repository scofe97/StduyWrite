<text x="36" y="248.0" transform="rotate(-90 36 248.0)" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" fill="#5E6B7E" letter-spacing="0.14em">RARER</text>
<line x1="12" y1="418" x2="952" y2="418" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

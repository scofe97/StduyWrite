<title id="dt">프론트엔드는 왜 한 덩어리로 남았는가</title><desc id="dd">Introducing Micro-Frontends 절의 산문을 네 범주로 묶어 하나의 결과에 붙인 원인 분석도. 묶음은 노트의 읽기이고, 색이 붙은 뼈가 저자가 가장 길게 반박하는 원인이다.</desc>
<rect width="1440" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 01-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프론트엔드는 왜 한 덩어리로 남았는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">오른쪽 끝이 관측된 결과이고, 뼈 넷은 원문의 산문을 노트가 묶은 원인 범주입니다</text>
<path d="M 240 320 L 1196 320" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="880" y1="320" x2="784" y2="152" stroke="#8B98A9" stroke-width="1.1"/>
<line x1="848" y1="264" x2="816" y2="264" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="812" y="260" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">여러 프로젝트·팀이 함께 씀</text>
<line x1="816" y1="208" x2="784" y2="208" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="780" y="204" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">유지보수·수동 테스트·소통 비용</text>
<line x1="720" y1="320" x2="624" y2="488" stroke="#F08A59" stroke-width="1.4"/>
<line x1="688" y1="376" x2="656" y2="376" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="652" y="388" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">두 번 쓰려고 수천 배 복잡해짐</text>
<line x1="656" y1="432" x2="624" y2="432" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="620" y="444" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">재사용 횟수를 과대평가</text>
<line x1="560" y1="320" x2="464" y2="152" stroke="#8B98A9" stroke-width="1.1"/>
<line x1="528" y1="264" x2="496" y2="264" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="492" y="260" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">규칙을 한 번 정하고 수년 유지</text>
<line x1="496" y1="208" x2="464" y2="208" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="460" y="204" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">한 결정 바꾸려면 전체 손봄</text>
<line x1="400" y1="320" x2="304" y2="488" stroke="#8B98A9" stroke-width="1.1"/>
<line x1="368" y1="376" x2="336" y2="376" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="332" y="388" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">장수 플랫폼의 장기 개선 제약</text>
<line x1="336" y1="432" x2="304" y2="432" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="300" y="444" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">시간대 분산 팀에 불리</text>
<rect x="720.0" y="138" width="128" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="784" y="157" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">공유 라이브러리</text>
<rect x="573.0" y="474" width="102" height="28" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.3"/>
<text x="624" y="493" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">조기 추상화</text>
<rect x="406.5" y="138" width="115" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="464" y="157" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">중앙집중 결정</text>
<rect x="227.0" y="474" width="154" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="304" y="493" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">모놀리식 프론트엔드</text>
<rect x="1200" y="280" width="200" height="80" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="1300" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">프론트엔드는 팀이 늘어도</text>
<text x="1300" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">한 덩어리로 남았다</text>
<text x="1300" y="350" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">OBSERVED EFFECT</text>
<line x1="12" y1="540" x2="1392" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="562" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="552" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">저자가 가장 길게 반박하는 원인 · 관측된 결과</text>
</svg>
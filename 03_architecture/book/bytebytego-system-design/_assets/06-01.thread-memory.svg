<title id="dt">같은 변수에 쓴 값은 주소 공간이 하나일 때만 보인다</title><desc id="dd">스레드 둘은 힙의 counter 하나를 같이 쓰고 fork 한 프로세스 둘은 복사본을 따로 갖습니다 (값은 문서용 예시)</desc>
<rect width="880" height="472" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 06-01 §1</text>

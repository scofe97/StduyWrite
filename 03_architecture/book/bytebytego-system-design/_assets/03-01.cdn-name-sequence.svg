<title id="dt">사이트의 이름이 CDN 의 이름으로 바뀌고 엣지 주소가 나온다</title><desc id="dd">CNAME 한 단계 뒤 CDN 권한 서버가 질의한 리졸버를 기준으로 엣지를 고름 (이름·주소는 문서용 예시)</desc>

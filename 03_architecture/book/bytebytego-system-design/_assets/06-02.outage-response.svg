<title id="dt">지표가 전부 0이던 밤과 그 뒤의 다섯 단계</title><desc id="dd">윗줄은 그 사건에서 있었던 값이고 아랫줄은 그 단계에 놓을 장치입니다</desc>
<rect width="992" height="392" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 06-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">지표가 전부 0이던 밤과 그 뒤의 다섯 단계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">일간 사용자 약 3,000만 명 소셜 게임의 장애</text>

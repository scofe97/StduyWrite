<title id="dt">page 네 개를 쓰는 시간</title><desc id="dd">채널 한 개는 하나씩 이어서 쓰고, 채널이 네 개면 네 page 를 같은 구간에 씁니다. 이상적인 병렬을 가정한 계산 예입니다</desc>

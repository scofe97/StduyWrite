<title id="dt">같은 사용자 조회가 네 스타일에서 갖는 모양</title><desc id="dd">사용자 7 한 명을 가져오는 일은 같지만 요청이 가리키는 대상과 본문이 달라집니다</desc>
<rect width="900" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 03-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 사용자 조회가 네 스타일에서 갖는 모양</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">SOAP 1.2 · REST · GraphQL over HTTP · gRPC</text>
<rect x="12" y="96" width="140" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="82.0" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">스타일</text>
<rect x="160" y="96" width="252" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.45)" stroke-width="0.9"/>
<text x="286.0" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">요청 줄</text>
<rect x="420" y="96" width="196" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.45)" stroke-width="0.9"/>
<text x="518.0" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">요청 본문</text>
<rect x="624" y="96" width="264" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.45)" stroke-width="0.9"/>
<text x="756.0" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">응답 본문</text>
<rect x="12" y="156" width="140" height="56" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">SOAP</text>
<text x="24" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">연산 이름</text>
<rect x="160" y="156" width="252" height="56" rx="4" fill="#6A95D80c" stroke="#6A95D8" stroke-width="0.8"/>
<text x="286.0" y="190" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">POST /UserService</text>
<rect x="420" y="156" width="196" height="56" rx="4" fill="#6A95D80c" stroke="#6A95D8" stroke-width="0.8"/>
<text x="518.0" y="190" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">&lt;m:GetUser&gt; id=7</text>
<rect x="624" y="156" width="264" height="56" rx="4" fill="#6A95D80c" stroke="#6A95D8" stroke-width="0.8"/>
<text x="756.0" y="190" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">&lt;m:GetUserResponse&gt;</text>
<rect x="12" y="220" width="140" height="56" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="244" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">REST</text>
<text x="24" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">URL + 메서드</text>

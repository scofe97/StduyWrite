<text x="286.0" y="318" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">POST /graphql</text>
<rect x="420" y="284" width="196" height="56" rx="4" fill="#6A95D80c" stroke="#6A95D8" stroke-width="0.8"/>
<text x="518.0" y="318" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">{ user(id:7){ name } }</text>
<rect x="624" y="284" width="264" height="56" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="756.0" y="318" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">{"data":{"user":{"name":"Kim"}}}</text>
<rect x="12" y="348" width="140" height="56" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="372" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">gRPC</text>
<text x="24" y="392" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">메서드 호출</text>

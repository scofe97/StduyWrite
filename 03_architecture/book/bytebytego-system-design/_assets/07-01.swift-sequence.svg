<title id="dt">FIN 에서 MT 송금 메시지는 허가된 뒤에야 상대 은행에 닿는다</title><desc id="dd">MT 메시지가 처리기 네 곳에 저장되고 은행 B 에 닿으며, ACK 와 UAK 와 보고서가 되돌아옵니다.</desc>
<rect width="1000" height="996" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 07-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">FIN 에서 MT 송금 메시지는 허가된 뒤에야 상대 은행에 닿는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저장과 허가를 거친 메시지만 상대 은행에 전달됩니다</text>

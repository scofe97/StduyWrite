<title id="dt">큐가 수신과 발신 일꾼을 가르고 저장 계층 하나를 함께 쓴다</title><desc id="dd">받은 메일은 위 줄을, 보낼 메일은 아래 줄을 따라가며 두 줄이 가운데 저장 계층에서 만납니다.</desc>
<rect width="1000" height="704" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 08-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">큐가 수신과 발신 일꾼을 가르고 저장 계층 하나를 함께 쓴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">메일 크기 한도는 서비스마다 다르며 Gmail 개인 계정은 첨부 합계 25 MB 입니다</text>
<rect x="28" y="252" width="960" height="116" rx="8" fill="#FFFFFF08" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="40" y="276" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">저장 계층</text>

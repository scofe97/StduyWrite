<title id="dt">재고 10 개에 4 개씩 세 요청이 겹치면 분리된 차감만 과판매한다</title><desc id="dd">읽기와 쓰기를 나눈 차감과 재고가 요청 수량 이상일 때만 빼는 원자 차감의 재고 값을 요청마다 맞댑니다.</desc>

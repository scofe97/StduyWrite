<title id="dt">경보와 시각화는 같은 질의 서비스를 지나 시계열 DB 를 읽는다</title><desc id="dd">쓰기는 수집기에서 Kafka 를 거쳐 쌓이고 읽기와 경보는 질의 서비스 한 곳으로 모입니다.</desc>

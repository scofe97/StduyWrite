<title id="dt">국경을 넘는 돈은 메시지를 따라 은행 장부 네 곳이 차례로 바뀐다</title><desc id="dd">메시지는 은행을 따라 이어지지만 돈의 정산은 연방준비제도 장부 한 곳에서 일어납니다.</desc>
<rect width="1000" height="396" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 07-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">국경을 넘는 돈은 메시지를 따라 은행 장부 네 곳이 차례로 바뀐다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">USD 100 → KRW 120,000 은 BIS 가 든 예시 값입니다</text>
<rect x="24" y="124" width="216" height="164" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>

<title id="dt">결제 한 건이 지나는 다섯 자리와 값</title><desc id="dd">카드 승인에서 외환과 장부까지 메시지와 돈이 따로 움직이는 길을 값으로 따라갑니다.</desc>
<rect width="1000" height="516" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 07-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">결제 한 건이 지나는 다섯 자리와 값</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">값은 문서용 예시이며 상한·날짜는 규정과 공식 발표를 따릅니다</text>

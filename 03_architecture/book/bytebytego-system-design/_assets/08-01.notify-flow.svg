<title id="dt">알림은 음소거부터 기기별 pref 까지 순서대로 걸러진다</title><desc id="dd">음소거·방해 금지·멘션 억제에서 안 보냄으로 빠지고, 남은 건 기기별 pref 값이 가른다</desc>

<title id="dt">한 요청이 규모에서 막히는 자리 다섯</title><desc id="dd">타임라인·동시 편집·알림 판정·중복 URL·코드 생성이 값 하나씩을 들고 이어집니다.</desc>
<rect width="960" height="392" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 08-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 요청이 규모에서 막히는 자리 다섯</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">다섯 절이 값 하나씩을 들고 이어집니다</text>

<text x="104.0" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">31,000,000 쓰기</text>
<text x="104.0" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">÷ 300,000/초</text>
<text x="104.0" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">쓸 때 밀어 넣기</text>
<path d="M 190 218.0 L 200 218.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

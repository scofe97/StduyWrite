<title id="dt">결제 세 절과 플래시 세일 네 절을 값으로 따라간다</title><desc id="dd">구매 버튼 뒤의 기록 순서에서 재고 차감까지 같은 카드 자리에 대표 값을 놓았습니다.</desc>
<rect width="1000" height="516" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 07-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">결제 세 절과 플래시 세일 네 절을 값으로 따라간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">금액·재고·요청 수는 문서용 예시이고 §4 의 값은 설계 가정입니다</text>
<rect x="12" y="112" width="224" height="148" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="24" y="140" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">§1</text>
<text x="136.0" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">결제 열 단계</text>
<line x1="24" y1="156" x2="224" y2="156" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="124.0" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">이벤트 → 주문 둘</text>
<text x="124.0" y="212" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">30.00 = 20.00 + 10.00</text>
<text x="124.0" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">PSP 는 실행기만 부름</text>
<path d="M 238 186.0 L 252 186.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="256" y="112" width="224" height="148" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="268" y="140" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">§2</text>
<text x="380.0" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">갱신 순서</text>
<line x1="268" y1="156" x2="468" y2="156" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="368.0" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">PSP → 지갑 → 원장</text>
<text x="368.0" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">멈춘 지점별 남는 값</text>
<text x="368.0" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">원장만 비면 대사로 발견</text>
<path d="M 482 186.0 L 496 186.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

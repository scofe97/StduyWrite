<rect x="500" y="308" width="224" height="148" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="512" y="336" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">§7</text>
<text x="624.0" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">재고 차감</text>

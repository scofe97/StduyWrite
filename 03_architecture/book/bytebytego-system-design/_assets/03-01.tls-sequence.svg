<title id="dt">첫 요청은 TCP 한 왕복과 TLS 1.3 한 왕복 뒤에 나간다</title><desc id="dd">메시지 길이는 openssl 실측(3.6.4 · 2026-10-12T16:33Z · example.com), 요청 줄은 예시</desc>
<rect width="880" height="828" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 03-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">첫 요청은 TCP 한 왕복과 TLS 1.3 한 왕복 뒤에 나간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">{ } 는 핸드셰이크 키, [ ] 는 응용 키로 보호된 메시지입니다</text>
<rect x="24.0" y="100" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

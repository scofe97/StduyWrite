<title id="dt">Prometheus 는 블록을 합쳐 지우고 Thanos 는 해상도를 내린다</title><desc id="dd">2시간 블록·15d 보존과 40시간·10일 다운샘플링을 같은 세 칸 격자에 놓았습니다.</desc>

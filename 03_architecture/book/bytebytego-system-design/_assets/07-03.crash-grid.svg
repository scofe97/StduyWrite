<title id="dt">멈춘 지점마다 PSP·지갑·원장의 값이 어긋나는 모양이 다르다</title><desc id="dd">주문 PO-A 20.00 USD 를 처리하다 서버가 멈췄을 때 세 곳에 남는 값과 그 어긋남을 찾는 방법입니다.</desc>

<title id="dt">카드 한 장 뒤의 계약은 발급사 쪽과 매입사 쪽으로 갈린다</title><desc id="dd">발급사는 카드 소지자와, 매입사는 가맹점과 계약하고 둘 사이를 카드 네트워크의 규칙이 잇습니다.</desc>

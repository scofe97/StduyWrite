<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">수수료 상한은 EU 규정 2015/751 의 소비자 카드 기준입니다</text>

<title id="dt">은행 장부의 100 과 500 은 하루 끝에 준비금 400 한 번이 된다</title><desc id="dd">구매에서 이체 지시까지는 정보만 움직이고, 청산이 서로의 채무를 상계한 뒤에야 준비금이 움직입니다.</desc>

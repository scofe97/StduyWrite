<title id="dt">응답이 사라지면 재시도는 같은 청구를 한 번 더 만든다</title><desc id="dd">서버는 10.00 USD 를 청구했지만 클라이언트는 그 사실을 몰라 같은 요청을 다시 보냅니다.</desc>

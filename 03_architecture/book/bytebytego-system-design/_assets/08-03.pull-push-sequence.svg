<title id="dt">수집기는 목록을 받아 당기고 배치 작업은 밀어 둔 곳을 당긴다</title><desc id="dd">scrape 간격 기본 1m·제한 시간 기본 10s 와 up 값, Pushgateway 로 밀기까지 한 흐름에 놓았습니다.</desc>

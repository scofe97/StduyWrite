<line x1="52" y1="180" x2="192" y2="180" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="122.0" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">READ COMMITTED</text>
<text x="122.0" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">반복 불가 읽기 가능</text>

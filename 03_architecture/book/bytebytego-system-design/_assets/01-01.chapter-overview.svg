<title id="dt">동시 쓰기의 이상을 막는 세 도구와 데이터 모양</title><desc id="dd">격리 수준·MVCC·낙관적 잠금이 이상 현상을 막고, 복제 확인 수가 지연과 일관성을 맞바꾸며, 데이터 모양이 범주를 고른다.</desc>
<rect width="960" height="392" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 01-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">동시 쓰기의 이상을 막는 세 도구와 데이터 모양</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">다섯 절이 값 하나씩을 들고 이어집니다</text>

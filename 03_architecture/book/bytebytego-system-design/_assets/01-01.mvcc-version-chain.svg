<title id="dt">한 행의 버전 두 개와 네 번의 읽기</title><desc id="dd">트랜잭션 A 가 balance 를 200 으로 바꾸고 아직 커밋하지 않았을 때와 커밋한 뒤, 트랜잭션 B 가 읽는 값</desc>
<rect width="920" height="436" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 01-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 행의 버전 두 개와 네 번의 읽기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">READ COMMITTED 는 커밋 뒤 새 값을, REPEATABLE READ 는 처음 읽은 값을 봅니다</text>
<rect x="312" y="120" width="260" height="48" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="442.0" y="140" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">balance 200</text>
<text x="442.0" y="158" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">DB_TRX_ID 201</text>
<rect x="312" y="200" width="260" height="160" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="442.0" y="220" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">balance 100</text>
<text x="442.0" y="238" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">DB_TRX_ID 200</text>
<path d="M 442.0 170 L 442.0 196" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="454.0" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">DB_ROLL_PTR</text>
<text x="676" y="148" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">READ COMMITTED · A 커밋 후</text>

<title id="dt">승인은 금액을 보류할 뿐이고 청구는 유효 기간 안에 따로 온다</title><desc id="dd">가맹점의 승인 요청 한 건이 발급사까지 왕복하고, 보류된 100.00 EUR 을 유효 기간 안에 청구합니다.</desc>
<rect width="1000" height="868" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 07-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">승인은 금액을 보류할 뿐이고 청구는 유효 기간 안에 따로 온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">금액은 문서용 예시이고 유효 기간은 카드 비대면 고객 개시 거래 기준입니다</text>

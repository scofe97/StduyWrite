<title id="dt">근처 식당 한 번의 검색이 지나는 여섯 자리와 값</title><desc id="dd">행을 전부 비교하는 질의에서 격자 색인, 메모리 트리, 읽기 복제본까지 같은 질의가 지나는 자리를 값으로 따라갑니다.</desc>
<rect width="1000" height="516" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 09-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">근처 식당 한 번의 검색이 지나는 여섯 자리와 값</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">사업장 2억 곳과 색인 1.71 GB 는 설계 가정입니다</text>

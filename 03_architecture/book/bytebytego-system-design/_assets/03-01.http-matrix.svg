<text x="584.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">응답 순서 무관</text>
<rect x="668" y="276" width="152" height="52" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="744.0" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">TCP 계층</text>
<text x="744.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">손실 하나가 전체를 막음</text>

<title id="dt">받는 길은 메시지를 어디에 두느냐로 IMAP 과 POP3 가 갈린다</title><desc id="dd">같은 질문 다섯을 IMAP4rev2·POP3·웹메일에 나란히 놓고 서버에 상태가 남는 자리를 짚습니다.</desc>
<rect width="960" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 08-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">받는 길은 메시지를 어디에 두느냐로 IMAP 과 POP3 가 갈린다</text>

<title id="dt">요청 하나가 지나가는 길 위의 부품</title><desc id="dd">클라이언트의 요청이 DNS · CDN · 로드 밸런서를 거쳐 앱 서버에 닿고, 캐시와 데이터베이스와 메시지 큐로 갈라지는 경로. 각 부품에 primer 의 장 번호를 붙였고, 트레이드오프 · 통신 · 보안은 모든 부품에 걸리는 띠로 그렸다.</desc>

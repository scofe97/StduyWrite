<title id="dt">커밋 뒤 캐시 삭제와 색인 갱신이 시간차로 일어난다</title><desc id="dd">PostgreSQL 트랜잭션 커밋 즉시 Redis 캐시 키를 삭제하고, WAL 변경 로그를 Debezium 과 Kafka 로 전달해 수 초 뒤 Elasticsearch 색인을 비동기 갱신합니다.</desc>

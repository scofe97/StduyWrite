<title id="dt">브로커 장애 시 리더 승격과 쓰기 거절의 세 시점</title><desc id="dd">브로커 1대 장애는 ISR 내 리더 승격으로 흡수하고, 2대 장애 시 min.insync.replicas 미달로 쓰기를 거절합니다.</desc>
<rect width="960" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN COURSE · 02-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">브로커 장애 시 리더 승격과 쓰기 거절의 세 시점</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">[t1] ISR=3 정상 복제 → [t2] 브로커 1 다운 · 브로커 2 리더 승격 (ISR=2) → [t3] 브로커 3 다운 · 쓰기 거절</text>
<rect x="28" y="96" width="268" height="356" rx="8" fill="#12171F" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="162" y="118" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">t1 : 정상 복제</text>
<text x="162" y="133" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">RF=3 · acks=all</text>
<text x="162" y="146" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">min.insync.replicas=2</text>
<line x1="40" y1="154" x2="284" y2="154" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="44" y="164" width="236" height="44" rx="6" fill="#3FB98C08" stroke="#3FB98C" stroke-width="1.0"/>
<text x="60" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">브로커 1</text>
<text x="264" y="190" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">Leader (P0)</text>
<rect x="44" y="216" width="236" height="44" rx="6" fill="#6A95D808" stroke="#6A95D8" stroke-width="1.0"/>
<text x="60" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">브로커 2</text>
<text x="264" y="242" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">Follower (ISR)</text>
<rect x="44" y="268" width="236" height="44" rx="6" fill="#6A95D808" stroke="#6A95D8" stroke-width="1.0"/>
<text x="60" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">브로커 3</text>
<text x="264" y="294" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">Follower (ISR)</text>
<line x1="44" y1="324" x2="280" y2="324" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="162" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">ISR = 3  (정상 정족수 충족)</text>
<rect x="44" y="356" width="236" height="84" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="0.9"/>
<rect x="77.0" y="368" width="170.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="162" y="382" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">acks=all 커밋 완료</text>
<text x="162" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">프로듀서 정상 쓰기</text>
<text x="162" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최소 2대 복제본 커밋 확인</text>
<rect x="346" y="96" width="268" height="356" rx="8" fill="#12171F" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="480" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">t2 : 브로커 1 다운</text>
<text x="480" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">컨트롤러 장애 감지 및 리더 승격</text>
<line x1="358" y1="154" x2="602" y2="154" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="362" y="164" width="236" height="44" rx="6" fill="#F0616D08" stroke="#F0616D" stroke-width="1.0"/>
<text x="378" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">브로커 1</text>
<text x="582" y="190" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">하드웨어 크래시 (다운)</text>
<rect x="362" y="216" width="236" height="44" rx="6" fill="#F08A5916" stroke="#F08A59" stroke-width="1.4"/>
<text x="378" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">브로커 2</text>
<text x="582" y="242" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">새 Leader 승격 (P0)</text>
<rect x="362" y="268" width="236" height="44" rx="6" fill="#6A95D808" stroke="#6A95D8" stroke-width="1.0"/>
<text x="378" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">브로커 3</text>
<text x="582" y="294" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">Follower (ISR)</text>
<line x1="362" y1="324" x2="598" y2="324" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="480" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">ISR = 2  (최소 정족수 유지)</text>
<rect x="362" y="356" width="236" height="84" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="0.9"/>
<rect x="395.0" y="368" width="170.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="480" y="382" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">acks=all 쓰기 지속</text>
<text x="480" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">브로커 2 로 리더십 이전</text>
<text x="480" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">120초 타임아웃 내 발행 유지</text>
<rect x="664" y="96" width="268" height="356" rx="8" fill="#12171F" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="798" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">t3 : 브로커 3 도 다운</text>
<text x="798" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ISR 미달 발생 · 일관성 보호</text>
<line x1="676" y1="154" x2="920" y2="154" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="680" y="164" width="236" height="44" rx="6" fill="#F0616D08" stroke="#F0616D" stroke-width="1.0"/>
<text x="696" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">브로커 1</text>
<text x="900" y="190" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">다운 상태 유지</text>
<rect x="680" y="216" width="236" height="44" rx="6" fill="#E3B34108" stroke="#E3B341" stroke-width="1.0"/>
<text x="696" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">브로커 2</text>
<text x="900" y="242" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">단독 Leader (ISR 1대)</text>
<rect x="680" y="268" width="236" height="44" rx="6" fill="#F0616D08" stroke="#F0616D" stroke-width="1.0"/>
<text x="696" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">브로커 3</text>
<text x="900" y="294" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">추가 다운 (ISR 제외)</text>
<line x1="680" y1="324" x2="916" y2="324" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="798" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">ISR = 1  &lt; min.insync.replicas=2</text>
<rect x="680" y="356" width="236" height="84" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="0.9"/>
<rect x="732.03" y="368" width="131.94" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="798" y="382" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">NotEnoughReplicas</text>
<text x="798" y="404" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">NotEnoughReplicasException</text>
<text x="798" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">유실 방지를 위한 쓰기 거절</text>
<path d="M 296 240 L 342 240" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="321" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">고장</text>
<path d="M 614 240 L 660 240" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="639" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">다운</text>
<line x1="12" y1="496" x2="912" y2="496" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="518" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

<title id="dt">두 트랜잭션이 109 를 함께 읽고 둘 다 통과한다</title><desc id="dd">read committed 격리 수준에서 두 트랜잭션이 잔여 재고 109 를 동시에 확인하고 각각 1 씩 더해 커밋하여 상한 110 을 초과한 111 이 되는 경쟁 조건</desc>
<rect width="960" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN COURSE · 01-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">두 트랜잭션이 109 를 함께 읽고 둘 다 통과한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가용성 검증과 갱신 사이 시간차로 두 트랜잭션 모두 통과해 정원을 초과합니다.</text>

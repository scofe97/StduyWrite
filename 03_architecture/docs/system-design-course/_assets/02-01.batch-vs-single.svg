<title id="dt">1,000건 저장 시간: 한 건씩 5,000ms 대 묶어서 50ms</title><desc id="dd">건당 5ms 기준 1,000건 순차 쓰기는 5.0초가 걸리지만, 단일 파티션으로 묶으면 50ms 로 단축됩니다.</desc>
<rect width="960" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN COURSE · 02-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">1,000건 저장 시간: 한 건씩 5,000ms 대 묶어서 50ms</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">1,000건 저장 소요 시간 비교 (단일 파티션 묶음 vs 단건 순차)</text>
<line x1="280" y1="128" x2="280" y2="256" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="280" y="272" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0</text>
<line x1="400" y1="128" x2="400" y2="256" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="400" y="272" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">1,000 ms</text>
<line x1="520" y1="128" x2="520" y2="256" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="520" y="272" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">2,000 ms</text>
<line x1="640" y1="128" x2="640" y2="256" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="640" y="272" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">3,000 ms</text>
<line x1="760" y1="128" x2="760" y2="256" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="760" y="272" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">4,000 ms</text>
<line x1="880" y1="128" x2="880" y2="256" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="880" y="272" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">5,000 ms</text>
<text x="580" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">소요 시간 (밀리초 · 선형 눈금)</text>
<text x="264" y="158" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">단건 순차 쓰기</text>
<text x="264" y="174" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">건당 5ms (가정) × 1,000건</text>
<rect x="280" y="144" width="600" height="32" rx="4" fill="#F0616D12" stroke="#F0616D" stroke-width="1.0"/>
<text x="864" y="165" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">5,000 ms (5.0초)</text>
<text x="264" y="230" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">단일 파티션 묶음</text>
<text x="264" y="246" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">약 100배 속도 향상</text>
<rect x="280" y="216" width="8" height="32" rx="4" fill="#F08A5920" stroke="#F08A59" stroke-width="1.4"/>
<text x="302" y="237" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">50 ms (가정 · 0.05초)</text>
<rect x="24" y="312" width="912" height="52" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>
<text x="40" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">단일 파티션(channel_id) 묶음 기준 · 다중 파티션 배치: 5KiB 경고 · 50KiB 실패</text>
<text x="40" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">대안: 비동기 병렬 쓰기 (다중 파티션 코디네이터 노드 병목 방지)</text>
<line x1="12" y1="416" x2="912" y2="416" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="438" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="428" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">단건 순차 쓰기 (가정)</text>
<rect x="313" y="428" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="335" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">단일 파티션 묶음 쓰기 (초점)</text>
<rect x="578" y="428" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="600" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">배치 크기 제약 (주의)</text>
</svg>
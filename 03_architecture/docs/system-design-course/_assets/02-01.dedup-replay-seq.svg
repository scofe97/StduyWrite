<title id="dt">재발행된 1001 은 같은 키로 덮어써지고 1002 만 새 행이 된다</title><desc id="dd">Cassandra 기본 키 upsert 로 1001 은 동일 값으로 덮어써 중복을 막고 1002 는 신규 영속합니다.</desc>

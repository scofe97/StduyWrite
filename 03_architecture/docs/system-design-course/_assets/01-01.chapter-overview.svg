<title id="dt">호텔 예약 시스템을 여섯 절로 읽는다</title><desc id="dd">읽기와 쓰기를 분리하고 날짜별 재고 행과 멱등 키를 설계한 뒤, 격리 수준 한계를 짚고 세 동시성 해법과 캐시·색인 전파로 완성합니다.</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN COURSE · 01-01</text>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">용량 분리 → 날짜 재고 모델 → 멱등 키 → 경쟁 조건 → 세 해법 → 캐시·색인 전파</text>

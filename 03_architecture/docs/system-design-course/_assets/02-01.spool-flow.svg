<title id="dt">발행 실패에서 재발행까지 메시지가 머무는 곳</title><desc id="dd">Kafka 다운 시 메모리 버퍼와 디스크 WAL 에 보관하고, 복구 후 릴레이가 재발행합니다.</desc>
<rect width="960" height="464" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN COURSE · 02-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">발행 실패에서 재발행까지 메시지가 머무는 곳</text>

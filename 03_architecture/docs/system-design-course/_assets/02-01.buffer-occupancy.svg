<text x="104" y="354" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">25,000</text>
<line x1="120" y1="300" x2="860" y2="300" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="104" y="304" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">50,000</text>
<line x1="120" y1="250" x2="860" y2="250" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="104" y="254" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">75,000</text>
<text x="104" y="204" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">100,000</text>
<text x="104" y="176" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">건수</text>
<text x="860" y="444" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">경과 시간 (초)</text>
<line x1="120" y1="400" x2="120" y2="408" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="120" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">0초 (장애 시작)</text>

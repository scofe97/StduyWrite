<circle cx="416" cy="200" r="6" fill="#F08A59"/>
<text x="416" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">2.0초: 상한 100,000건 도달</text>

<title id="dt">장애 동안 버퍼에 쌓인 건수와 상한</title><desc id="dd">초당 5만 건 유입 시 2초 만에 상한 100,000건에 도달하며, 초과분은 디스크 WAL 로 격리됩니다.</desc>
<rect width="960" height="508" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN COURSE · 02-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">장애 동안 버퍼에 쌓인 건수와 상한</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가상 시나리오: 유입 속도 50,000 msg/s · 버퍼 상한 100,000건</text>
<line x1="120" y1="400" x2="860" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="104" y="404" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0</text>

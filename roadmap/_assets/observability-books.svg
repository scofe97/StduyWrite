<title id="dt">관측 가능성 책 읽기 흐름</title><desc id="dd">자료를 정독 노트 50편과 소장 책 여섯 권, 공식 문서로 한정했다. 같은 책이 여러 단계에 나뉘어 걸리므로 행이 단계가 아니라 책의 역할로 묶인다. 테두리 색이 우선순위다.</desc>

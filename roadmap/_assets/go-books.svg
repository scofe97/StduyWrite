<title id="dt">Go 책 읽기 흐름</title><desc id="dd">보유 노트가 0편이라 책이 자료의 전부다. 다섯 권을 단계 순으로 걸고 각 책에서 읽을 장을 적었다. Learning Go 는 1~3단계와 5단계에 나눠 걸린다. 테두리 색이 우선순위다.</desc>

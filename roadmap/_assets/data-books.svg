<title id="dt">데이터 책 읽기 흐름</title><desc id="dd">이 로드맵이 쓰는 책 넷을 단계 순으로 걸고 각 책에서 읽을 장만 적었다. DDIA 2판이 척추이고 Database Internals 가 구현 층을, Patterns of Distributed Systems 가 패턴 카탈로그를 맡는다. SQL·JPA·QueryDSL 을 다루는 책은 소장본에 없어 걸 자리가 없다. 테두리 색이 우선순위다.</desc>

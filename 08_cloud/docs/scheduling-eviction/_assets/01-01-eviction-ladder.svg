<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 508" role="img" aria-labelledby="t1 d1">
<title id="t1">압박 신호에서 파드 축출까지의 다섯 단</title>
<desc id="d1">kubelet 이 자원 신호를 재고, 임계와 견주고, 노드 컨디션을 달고, 노드 레벨 자원을 회수한 뒤, 그래도 모자랄 때 파드를 고르는 다섯 단계를 위에서 아래로 쌓은 계층 도식입니다. 네 번째 단인 노드 레벨 회수가 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12)}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:12px}
.tag{fill:var(--soft);font-size:11px;letter-spacing:.08em}
.name{fill:var(--ink);font-size:15px;font-weight:600}
.note{fill:var(--muted);font-size:12px}
.sect{fill:var(--soft);font-size:11px}
.dirlab{fill:var(--soft);font-size:12px;letter-spacing:.08em}
.hair{stroke:var(--rule);stroke-width:1}
.dir{stroke:var(--soft);stroke-width:1;fill:none}
</style>
<rect width="1000" height="508" fill="var(--paper)"/>
<text class="mn eyebrow" x="120" y="44">SIGNAL -> THRESHOLD -> CONDITION -> RECLAIM -> EVICT</text>
<text class="kr h1" x="120" y="76">파드를 죽이기 전에 지울 것부터 지웁니다</text>
<text class="kr sub" x="120" y="98">kubelet 이 압박을 감지해 파드를 고르기까지 거치는 다섯 단</text>
<path class="dir" d="M76 140 L76 436"/>
<path class="dir" d="M71 428 L76 436 L81 428"/>
<text class="mn dirlab" x="76" y="124" text-anchor="middle">STEP</text>
<rect x="120" y="132" width="840" height="64" fill="var(--paper2)" stroke="rgba(245,245,243,0.10)" stroke-width="0.8"/>
<text class="mn tag" x="136" y="170" fill="var(--soft)">S1</text>
<text class="kr name" x="180" y="164" fill="var(--ink)">축출 신호 측정</text>
<text class="kr sect" x="180" y="182">본문 2절</text>
<text class="kr note" x="944" y="172" text-anchor="end">memory · nodefs · imagefs · containerfs · pid</text>
<rect x="120" y="196" width="840" height="64" fill="var(--paper)" stroke="rgba(245,245,243,0.10)" stroke-width="0.8"/>
<text class="mn tag" x="136" y="234" fill="var(--soft)">S2</text>
<text class="kr name" x="180" y="228" fill="var(--ink)">임계 비교</text>
<text class="kr sect" x="180" y="246">본문 4절</text>
<text class="kr note" x="944" y="236" text-anchor="end">hard 는 즉시 · soft 는 유예 뒤</text>
<rect x="120" y="260" width="840" height="64" fill="var(--paper2)" stroke="rgba(245,245,243,0.10)" stroke-width="0.8"/>
<text class="mn tag" x="136" y="298" fill="var(--soft)">S3</text>
<text class="kr name" x="180" y="292" fill="var(--ink)">노드 컨디션 부착</text>
<text class="kr sect" x="180" y="310">본문 4절</text>
<text class="kr note" x="944" y="300" text-anchor="end">MemoryPressure · DiskPressure · PIDPressure</text>
<rect x="120" y="324" width="840" height="64" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn tag" x="136" y="362" fill="var(--accent)">S4</text>
<text class="kr name" x="180" y="356" fill="var(--accent)">노드 레벨 회수</text>
<text class="kr sect" x="180" y="374">본문 5절 · 6절</text>
<text class="kr note" x="944" y="364" text-anchor="end">죽은 컨테이너 수거 · 안 쓰는 이미지 삭제</text>
<rect x="120" y="388" width="840" height="64" fill="var(--paper2)" stroke="rgba(245,245,243,0.10)" stroke-width="0.8"/>
<text class="mn tag" x="136" y="426" fill="var(--soft)">S5</text>
<text class="kr name" x="180" y="420" fill="var(--ink)">파드 축출</text>
<text class="kr sect" x="180" y="438">본문 5절</text>
<text class="kr note" x="944" y="428" text-anchor="end">requests 초과 · Priority · 초과 폭 순</text>
<line class="hair" x1="120" y1="464" x2="960" y2="464"/>
<text class="kr note" x="120" y="492">S4 가 이 문서의 논점입니다. 압박이 왔다고 파드가 곧바로 죽는 것이 아닙니다.</text>
</svg>

<text x="820.0" y="417" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">127.0.0.6 RETURN</text>
<rect x="218" y="284" width="84" height="24" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="1.1"/>
<text x="260" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">1337 제외</text>

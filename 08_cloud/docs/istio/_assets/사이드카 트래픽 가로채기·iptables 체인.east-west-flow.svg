<line x1="580" y1="158" x2="580" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="740" y1="158" x2="740" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="900" y1="158" x2="900" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<rect x="416" y="240" width="8" height="56" rx="2" fill="#161B22" stroke="#F08A59" stroke-width="0.9"/>

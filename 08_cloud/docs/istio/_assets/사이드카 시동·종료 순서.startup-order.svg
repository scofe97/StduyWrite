<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">기본은 동시에 시작하고, 두 해법은 순서를 정한다</title><desc id="dd">기본 동작은 앱이 프록시보다 먼저 요청을 보내 실패할 수 있고, holdApplicationUntilProxyStarts 는 시작만, 네이티브 사이드카는 시작과 종료 순서를 모두 맞춘다</desc>
<rect width="960" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SIDECAR · START AND STOP ORDER</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">기본은 동시에 시작하고, 두 해법은 순서를 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">어디까지 순서를 보장하느냐가 세 가지를 가른다</text>
<rect x="32" y="96" width="896" height="110" rx="8" fill="#161B22" stroke="#F0616D" stroke-width="0.9" stroke-dasharray="5 4"/>
<rect x="48" y="100" width="247" height="18" rx="2" fill="#0D1117"/>
<text x="171" y="113" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">기본: 컨테이너가 거의 동시에 시작한다</text>
<rect x="64" y="126" width="200" height="68" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="164" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">istio-proxy 시작</text>
<text x="164" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아직 준비 안 됨</text>
<rect x="380" y="126" width="200" height="68" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.0"/>
<text x="480" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">앱 시작</text>
<text x="480" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바로 아웃바운드 요청</text>
<rect x="696" y="126" width="200" height="68" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="796" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">요청 실패</text>
<text x="796" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">CrashLoopBackOff 가능</text>
<path d="M 264 160 L 380 160" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)"/>
<path d="M 580 160 L 696 160" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="32" y="226" width="896" height="110" rx="8" fill="#161B22" stroke="#F08A59" stroke-width="0.9" stroke-dasharray="5 4"/>
<rect x="48" y="230" width="456" height="18" rx="2" fill="#0D1117"/>
<text x="276" y="243" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">holdApplicationUntilProxyStarts: 시작만 미룬다</text>
<rect x="64" y="256" width="200" height="68" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="164" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">istio-proxy 준비</text>
<text x="164" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">트래픽을 받을 수 있음</text>
<rect x="380" y="256" width="200" height="68" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="480" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">앱 시작</text>
<text x="480" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">훅이 준비될 때까지 미룸</text>
<rect x="696" y="256" width="200" height="68" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.0"/>
<text x="796" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">종료·Job·init</text>
<text x="796" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">순서 보장 없음</text>
<path d="M 264 290 L 380 290" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 580 290 L 696 290" fill="none" stroke="#6A95D8" stroke-width="1.0" marker-end="url(#info)"/>
<rect x="32" y="356" width="896" height="180" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="0.9" stroke-dasharray="5 4"/>
<rect x="48" y="360" width="401" height="18" rx="2" fill="#0D1117"/>
<text x="248" y="373" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">네이티브 사이드카: Kubernetes 가 시작과 종료를 맞춘다</text>
<rect x="64" y="386" width="190" height="68" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="159" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">proxy 시작</text>
<text x="159" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사이드카가 먼저</text>
<rect x="298" y="386" width="190" height="68" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.0"/>
<text x="393" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">앱 시작</text>
<text x="393" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">proxy 가 started 된 뒤</text>
<rect x="532" y="386" width="190" height="68" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.0"/>
<text x="627" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">앱 종료</text>
<text x="627" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">주 컨테이너가 먼저</text>
<rect x="766" y="386" width="130" height="68" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="831" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">proxy 종료</text>
<text x="831" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앱이 멈춘 뒤</text>
<path d="M 254 420 L 298 420" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 488 420 L 532 420" fill="none" stroke="#6A95D8" stroke-width="1.0" marker-end="url(#info)"/>
<path d="M 722 420 L 766 420" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="480" y="500" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">init 컨테이너도 proxy 뒤에 돌고, Job 은 앱이 끝나면 파드가 끝난다</text>
</svg>
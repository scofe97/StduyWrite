<title id="dt">검증 통과 시 새 버전을 ACK 하고, 실패 시 이전 버전과 오류를 NACK 한다</title><desc id="dd">istiod 가 DiscoveryResponse(version_info=v2, nonce=n2) 를 보내면 Envoy 는 유효 시 v2 ACK 를, 무효 시 v1 과 error_detail 로 NACK 을 보내고 v1 설정을 유지한다</desc>
<rect width="880" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">XDS · ACK AND NACK SEQUENCE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">검증 통과 시 새 버전을 ACK 하고, 실패 시 이전 버전과 오류를 NACK 한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">response_nonce 로 응답을 짝짓고 NACK 뒤에도 스트림과 v1 설정을 유지한다</text>
<rect x="24.0" y="104" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="124.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">istiod</text>
<text x="124.0" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">컨트롤 플레인</text>
<rect x="632.0" y="104" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="732.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">Envoy</text>
<text x="732.0" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">데이터 플레인</text>
<line x1="124.0" y1="154" x2="124.0" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="732.0" y1="154" x2="732.0" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 134.0 192 L 720.0 192" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="428.0" y="183" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">DiscoveryResponse(version_info=v2, nonce=n2)</text>
<text x="428.0" y="209" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">새 설정 푸시</text>
<rect x="76" y="232" width="728" height="232" rx="4" fill="rgba(245,245,243,0.04)" stroke="rgba(245,245,243,0.22)" stroke-width="1"/>
<rect x="76" y="232" width="40" height="16" rx="2" fill="#0D1117" stroke="rgba(245,245,243,0.22)" stroke-width="1"/>
<text x="96" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#8B98A9">ALT</text>
<text x="140" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">[검증 통과]</text>
<path d="M 722.0 296 L 136.0 296" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="428.0" y="287" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">DiscoveryRequest(version_info=v2, response_nonce=n2)</text>
<text x="428.0" y="313" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">ACK · 적용 의도 전달 (v2)</text>
<line x1="84" y1="336" x2="796" y2="336" stroke="rgba(245,245,243,0.20)" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="140" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">[검증 실패]</text>
<path d="M 722.0 396 L 136.0 396" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)" stroke-dasharray="5 4"/>
<text x="428.0" y="387" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">DiscoveryRequest(version_info=v1, response_nonce=n2, error_detail)</text>
<text x="428.0" y="413" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">NACK · 오류 보고, 스트림 유지</text>
<rect x="684.12" y="430" width="95.75999999999999" height="20" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="732.0" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">설정 v1 유지</text>
<line x1="12" y1="488" x2="832" y2="488" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="510" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="500" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정 전달</text>
<rect x="209" y="500" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ACK(정상)</text>
<rect x="344" y="500" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="366" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">NACK(거부)</text>
<rect x="492" y="500" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="514" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기존 설정 유지</text>
</svg>
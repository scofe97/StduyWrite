<title id="dt">istiod 가 ECDS 로 내리고 istio-agent 가 받아 캐시한다</title><desc id="dd">istiod 가 WasmPlugin 을 ECDS 설정으로 보내면 istio-agent 가 OCI 레지스트리에서 모듈을 pull 해 로컬 캐시에 둔 뒤 경로를 치환해 Envoy AUTHN 자리에 싣고, 실패 시에는 failStrategy 에 따라 allow 또는 deny RBAC 대체 필터를 싣는다</desc>
<rect width="960" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO · WASMPLUGIN ECDS FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">istiod 가 ECDS 로 내리고 istio-agent 가 받아 캐시한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원격 url 을 로컬 경로로 바꾼 뒤 Envoy HTTP 필터 체인의 AUTHN 자리에 로드한다</text>

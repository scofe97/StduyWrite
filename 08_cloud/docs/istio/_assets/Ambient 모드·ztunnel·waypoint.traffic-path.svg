<title id="dt">Ambient 모드의 두 가지 트래픽 경로 — L4 전송과 L7 waypoint 경유</title><desc id="dd">L4 보안 오버레이만 거치는 기본 경로와 L7 정책 집행을 위해 waypoint 를 경유하는 경로</desc>

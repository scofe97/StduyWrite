<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">rewrite 는 프록시 안에서, redirect 는 클라이언트를 거쳐 경로를 바꾼다</title><desc id="dd">rewrite 는 요청을 한 번만 보내고 프록시가 경로를 바꿔 백엔드에 전달하며, redirect 는 301 응답으로 클라이언트가 새 주소로 다시 요청한다</desc>
<rect width="960" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">VIRTUALSERVICE · REWRITE VS REDIRECT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">rewrite 는 프록시 안에서, redirect 는 클라이언트를 거쳐 경로를 바꾼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">클라이언트가 바뀐 주소를 보는지가 둘을 가른다</text>
<rect x="32" y="96" width="896" height="140" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="0.9" stroke-dasharray="5 4"/>
<rect x="48" y="100" width="346" height="18" rx="2" fill="#0D1117"/>
<text x="221" y="113" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">rewrite: 요청은 한 번, 경로는 프록시가 바꾼다</text>
<rect x="64" y="136" width="140" height="68" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.0"/>
<text x="134" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="134" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">주소는 그대로</text>
<rect x="400" y="136" width="150" height="68" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="475" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">Envoy 프록시</text>
<text x="475" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">rewrite.uri</text>
<rect x="764" y="136" width="140" height="68" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.0"/>
<text x="834" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">백엔드</text>
<text x="834" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바뀐 경로를 받음</text>
<path d="M 204 170 L 400 170" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)"/>
<text x="302" y="160" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">GET /ratings/1</text>
<path d="M 550 170 L 764 170" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="657" y="160" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">GET /v1/bookRatings/1</text>
<rect x="32" y="256" width="896" height="190" rx="8" fill="#161B22" stroke="#F08A59" stroke-width="0.9" stroke-dasharray="5 4"/>
<rect x="48" y="260" width="379" height="18" rx="2" fill="#0D1117"/>
<text x="237" y="273" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">redirect: 301 을 받은 클라이언트가 다시 요청한다</text>
<rect x="64" y="296" width="140" height="68" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.0"/>
<text x="134" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="134" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">요청을 두 번 보냄</text>
<rect x="400" y="296" width="150" height="68" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="475" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">Envoy 프록시</text>
<text x="475" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">redirect</text>
<rect x="764" y="296" width="140" height="68" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.0"/>
<text x="834" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">foo.example.com</text>
<text x="834" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">새 주소</text>
<path d="M 204 318 L 400 318" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)"/>
<text x="302" y="308" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">GET example.com/foo/bar</text>
<path d="M 400 348 L 204 348" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="302" y="366" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">301 foo.example.com/bar</text>
<path d="M 134 364 L 134 414 L 834 414 L 834 364" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)"/>
<text x="484" y="404" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">GET foo.example.com/bar</text>
</svg>
<text class="kr sub" x="64" y="98">물리 컴퓨트 호스트 다섯 대 위에 세 클러스터의 노드 VM 이 흩어진 배치</text>
<rect x="64" y="128" width="208" height="52" rx="6" fill="var(--paper2)" stroke="rgba(245,245,243,0.10)" stroke-width="0.8"/>

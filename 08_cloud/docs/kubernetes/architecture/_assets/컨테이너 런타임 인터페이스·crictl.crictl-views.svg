<rect x="380" y="316" width="540" height="68" rx="8" fill="#161B22" stroke="#F0616D" stroke-width="0.9" stroke-dasharray="5 4"/>
<rect x="396" y="320" width="394" height="16" rx="2" fill="#0D1117"/>
<text x="593" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">독립 Docker Engine 데몬 (/var/run/docker.sock)</text>
<rect x="404" y="340" width="492" height="36" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="650" y="362" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">dockerd 단독 컨테이너 공간 (kubelet 과 연결 없음)</text>

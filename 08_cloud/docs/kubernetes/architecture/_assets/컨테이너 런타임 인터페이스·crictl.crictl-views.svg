<title id="dt">네 도구의 소켓과 네임스페이스 관측 범위</title><desc id="dd">crictl, ctr, nerdctl, docker 가 연결하는 소켓 경로와 네임스페이스 격리 차이</desc>
<rect width="960" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES · RUNTIME</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">네 도구의 소켓과 네임스페이스 관측 범위</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">containerd k8s.io 네임스페이스와 독립 Docker 데몬이 가르는 관측 대상</text>

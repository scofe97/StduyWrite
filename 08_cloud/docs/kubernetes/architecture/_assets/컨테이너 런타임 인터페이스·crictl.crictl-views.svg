<path d="M 256 274 L 334 274 L 334 168 L 402 168" fill="none" stroke="#E3B341" stroke-width="1.2" marker-end="url(#warn)"/>
<path d="M 256 350 L 402 350" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="272.75" y="332" width="90.5" height="16" rx="2" fill="#0D1117"/>

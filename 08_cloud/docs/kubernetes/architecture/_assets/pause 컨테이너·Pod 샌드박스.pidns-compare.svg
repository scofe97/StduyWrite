<title id="dt">shareProcessNamespace 설정에 따른 PID 네임스페이스와 PID 1 차이</title><desc id="dd">좌측 pod-isolated(false)에서는 pause, app, sidecar 가 각자 PID 1 인 별도 PID 네임스페이스를 쓰고, 우측 pod-shared(true)에서는 하나의 PID 네임스페이스 pid:[4026533505] 를 공유해 /pause(NSpid 1961 1)가 PID 1 이 된다.</desc>
<rect width="880" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · PID NAMESPACE</text>

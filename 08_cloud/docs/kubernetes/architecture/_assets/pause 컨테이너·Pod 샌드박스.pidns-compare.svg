<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">kind v1.35 실측: 두 모드 모두 net·ipc·uts 는 공유하고 mnt 는 분리하며, pid 네임스페이스 경계만 달라집니다</text>

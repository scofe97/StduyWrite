<title id="dt">전환 명령이 고치는 필드와 직전 값의 자리</title><desc id="dd">네 명령이 kubeconfig 에서 바꾸는 필드와, 되돌아가기용 직전 값을 남기는 파일을 행마다 보인 흐름도입니다. kubectx 와 kubens 는 kubectl config 명령과 같은 필드를 고치고, 직전 값만 kubeconfig 밖의 상태 파일에 따로 남깁니다.</desc>
<rect width="1000" height="412" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMMAND -&gt; KUBECONFIG FIELD -&gt; PREVIOUS VALUE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">전환 명령이 고치는 필드와 직전 값의 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 필드를 고치고, 직전 값은 kubeconfig 밖 상태 파일에</text>
<text x="24" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">명령</text>
<text x="372" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">kubeconfig 에서 바뀌는 필드</text>
<text x="720" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">직전 값을 남기는 곳</text>
<rect x="24" y="128" width="280" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="150" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">kubectl config use-context</text>
<text x="40" y="168" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">&lt;컨텍스트&gt;</text>
<rect x="372" y="128" width="280" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="512.0" y="159.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">current-context</text>
<rect x="720" y="128" width="256" height="52" rx="6" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="848.0" y="159.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">남기지 않음</text>
<path d="M 308 154.0 L 366 154.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 656 154.0 L 714 154.0" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)" stroke-dasharray="3 4"/>
<rect x="24" y="196" width="280" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="218" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">kubectx</text>
<text x="40" y="236" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">&lt;컨텍스트&gt;</text>
<rect x="372" y="196" width="280" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="512.0" y="227.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">current-context</text>
<rect x="720" y="196" width="256" height="52" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="848.0" y="227.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">~/.kube/kubectx</text>
<path d="M 308 222.0 L 366 222.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 656 222.0 L 714 222.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="24" y="264" width="280" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="286" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">kubectl config set-context</text>
<text x="40" y="304" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">--current --namespace=&lt;ns&gt;</text>
<rect x="372" y="264" width="280" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="512.0" y="295.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">contexts[현재].namespace</text>
<rect x="720" y="264" width="256" height="52" rx="6" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="848.0" y="295.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">남기지 않음</text>
<path d="M 308 290.0 L 366 290.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 656 290.0 L 714 290.0" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)" stroke-dasharray="3 4"/>
<rect x="24" y="332" width="280" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="354" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">kubens</text>
<text x="40" y="372" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">&lt;네임스페이스&gt;</text>
<rect x="372" y="332" width="280" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="512.0" y="363.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">contexts[현재].namespace</text>
<rect x="720" y="332" width="256" height="52" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="848.0" y="363.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">~/.kube/kubens/&lt;컨텍스트&gt;</text>
<path d="M 308 358.0 L 366 358.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 656 358.0 L 714 358.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
</svg>
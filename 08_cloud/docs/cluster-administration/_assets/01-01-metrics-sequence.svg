<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" role="img" aria-labelledby="t1 d1">
<title id="t1">자원 메트릭 파이프라인의 수집 흐름과 조회 흐름</title>
<desc id="d1">위쪽 네 메시지는 metrics-server 가 kubelet 을 주기적으로 조회해 사용량을 메모리에 채우는 상시 수집 흐름입니다. 아래쪽 네 메시지는 사람이 kubectl top 을 쳤을 때 API 서버가 집계 계층으로 metrics-server 에 위임해 그 값을 돌려주는 조회 흐름입니다. 마지막 응답이 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12)}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:12px}
.actor{fill:var(--ink);font-size:13px;font-weight:600}
.asub{fill:var(--muted);font-size:10px}
.msg{fill:var(--muted);font-size:12px}
.msgm{fill:var(--muted);font-size:11px}
.msga{fill:var(--accent);font-size:12px;font-weight:600}
.phase{fill:var(--soft);font-size:12px}
.note{fill:var(--muted);font-size:12px}
.ll{stroke:rgba(245,245,243,0.20);stroke-width:1;stroke-dasharray:3,3}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<defs>
<marker id="f" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 z" fill="#8B98A9"/></marker>
<marker id="fa" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 z" fill="#F08A59"/></marker>
</defs>
<rect width="1000" height="612" fill="var(--paper)"/>
<text class="mn eyebrow" x="60" y="44">RESOURCE METRICS PIPELINE</text>
<text class="kr h1" x="60" y="76">데이터는 위로 올라오고 요청은 아래로 내려갑니다</text>
<text class="kr sub" x="60" y="98">metrics-server 의 수집과 kubectl top 의 조회는 서로 다른 시점에 일어나는 별개 흐름입니다</text>
<rect x="60" y="128" width="160" height="52" rx="6" fill="var(--paper2)" stroke="rgba(245,245,243,0.10)" stroke-width="0.8"/>
<text class="kr actor" x="140" y="152" text-anchor="middle">컨테이너 런타임</text>
<text class="mn asub" x="140" y="169" text-anchor="middle">cgroup · CRI</text>
<line class="ll" x1="140" y1="180" x2="140" y2="556"/>
<rect x="240" y="128" width="160" height="52" rx="6" fill="var(--paper2)" stroke="rgba(245,245,243,0.10)" stroke-width="0.8"/>
<text class="kr actor" x="320" y="152" text-anchor="middle">kubelet</text>
<text class="mn asub" x="320" y="169" text-anchor="middle">cAdvisor 내장</text>
<line class="ll" x1="320" y1="180" x2="320" y2="556"/>
<rect x="420" y="128" width="160" height="52" rx="6" fill="var(--paper2)" stroke="rgba(245,245,243,0.10)" stroke-width="0.8"/>
<text class="kr actor" x="500" y="152" text-anchor="middle">metrics-server</text>
<text class="mn asub" x="500" y="169" text-anchor="middle">메모리 보관</text>
<line class="ll" x1="500" y1="180" x2="500" y2="556"/>
<rect x="600" y="128" width="160" height="52" rx="6" fill="var(--paper2)" stroke="rgba(245,245,243,0.10)" stroke-width="0.8"/>
<text class="kr actor" x="680" y="152" text-anchor="middle">API 서버</text>
<text class="mn asub" x="680" y="169" text-anchor="middle">집계 계층</text>
<line class="ll" x1="680" y1="180" x2="680" y2="556"/>
<rect x="780" y="128" width="160" height="52" rx="6" fill="var(--paper2)" stroke="rgba(245,245,243,0.10)" stroke-width="0.8"/>
<text class="kr actor" x="860" y="152" text-anchor="middle">kubectl top · HPA</text>
<text class="mn asub" x="860" y="169" text-anchor="middle">소비자</text>
<line class="ll" x1="860" y1="180" x2="860" y2="556"/>
<rect x="316" y="224" width="8" height="120" fill="rgba(245,245,243,0.06)" stroke="var(--soft)" stroke-width="0.8"/>
<rect x="136" y="264" width="8" height="40" fill="rgba(245,245,243,0.06)" stroke="var(--soft)" stroke-width="0.8"/>
<rect x="676" y="408" width="8" height="120" fill="rgba(245,245,243,0.06)" stroke="var(--soft)" stroke-width="0.8"/>
<rect x="496" y="448" width="8" height="40" fill="rgba(245,245,243,0.06)" stroke="var(--soft)" stroke-width="0.8"/>
<line class="hair" x1="60" y1="376" x2="940" y2="376" stroke-dasharray="4,3"/>
<text class="kr phase" x="60" y="396">여기까지가 상시 수집입니다. 아래는 사람이 물어볼 때 일어납니다.</text>
<path d="M495 224 L329 224" stroke="var(--muted)" stroke-width="1" fill="none" marker-end="url(#f)"/>
<text class="mn msgm" x="410" y="216" text-anchor="middle">GET /metrics/resource</text>
<path d="M315 264 L149 264" stroke="var(--muted)" stroke-width="1" fill="none" marker-end="url(#f)"/>
<text class="kr msg" x="230" y="256" text-anchor="middle">cgroup · CRI 조회</text>
<path d="M145 304 L311 304" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#f)"/>
<text class="kr msg" x="230" y="296" text-anchor="middle">컨테이너별 사용량</text>
<path d="M325 344 L491 344" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#f)"/>
<text class="kr msg" x="410" y="336" text-anchor="middle">노드 · 파드 사용량</text>
<path d="M855 408 L689 408" stroke="var(--muted)" stroke-width="1" fill="none" marker-end="url(#f)"/>
<text class="mn msgm" x="770" y="400" text-anchor="middle">GET metrics.k8s.io</text>
<path d="M675 448 L509 448" stroke="var(--muted)" stroke-width="1" fill="none" marker-end="url(#f)"/>
<text class="kr msg" x="590" y="440" text-anchor="middle">집계 계층이 위임</text>
<path d="M505 488 L671 488" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#f)"/>
<text class="kr msg" x="590" y="480" text-anchor="middle">메모리 캐시에서 응답</text>
<path d="M685 528 L851 528" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5,3" fill="none" marker-end="url(#fa)"/>
<text class="kr msga" x="770" y="520" text-anchor="middle">CPU · 메모리 사용량</text>
<line class="hair" x1="60" y1="572" x2="940" y2="572"/>
<text class="kr note" x="60" y="596">metrics-server 는 값을 메모리에만 둡니다. 그래서 이 그림에는 과거를 되짚는 경로가 없습니다.</text>
</svg>

<title id="dt">cgroup 관리자가 둘이 되는 경우와 하나인 경우</title><desc id="dd">systemd 가 init 인 노드에서 kubelet 과 런타임의 cgroup 드라이버에 따라 자원을 보는 시각이 갈립니다</desc>

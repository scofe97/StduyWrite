<title id="dt">Application 삭제가 리소스에 닿는 다섯 가지 길</title><desc id="dd">각 줄은 삭제 방법, Argo CD 의 처리, 대상 네임스페이스에 남는 리소스의 결과를 왼쪽에서 오른쪽으로 잇는다. finalizer 가 없거나 CLI 에서 cascade 를 끄면 Application 만 지워지고 리소스가 남는다. foreground finalizer, background finalizer, 기본 CLI 삭제는 리소스까지 지운다.</desc>
<rect width="880" height="452" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 04-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Application 삭제가 리소스에 닿는 다섯 가지 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">finalizer 가 있어야 리소스까지 지워집니다</text>

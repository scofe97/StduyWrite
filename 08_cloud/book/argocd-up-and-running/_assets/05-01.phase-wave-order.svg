<title id="dt">sync 한 번의 적용 순서</title><desc id="dd">왼쪽에서 오른쪽으로 PreSync, Sync, PostSync 세 단계가 차례로 실행된다. 각 단계 안에서는 wave 숫자가 작은 리소스부터 적용되고 앞 wave 가 Healthy 가 된 뒤에 다음 wave 가 시작된다. 아래 줄은 PreSync Job 이 실패한 경로로, SyncFail Job 이 실행되고 Sync 단계는 실행되지 않은 채 동작이 Failed 로 끝난다.</desc>

<title id="dt">두 질문으로 설치 매니페스트를 고르는 길</title><desc id="dd">첫 질문은 API server, UI, SSO 가 필요한지 묻고 아니오면 core-install.yaml 이다. 예이면 둘째 질문으로 Argo CD 가 자기가 도는 클러스터에도 배포하는지 묻는다. 예이면 평가나 데모에는 install.yaml, 운영에는 ha/install.yaml 이다. 아니오이면 평가나 데모에는 namespace-install.yaml, 운영에는 ha/namespace-install.yaml 이고 CRD 는 따로 설치한다.</desc>
<rect width="880" height="490" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 02-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">두 질문으로 설치 매니페스트를 고르는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">범위를 정한 뒤 운영 환경이면 ha/ 매니페스트로 바꿉니다</text>
<rect x="20" y="192" width="230" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="34" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">질문 1 · 기능 범위</text>
<text x="34" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">API server·UI·SSO 가</text>
<text x="34" y="253" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">필요한가?</text>
<rect x="294" y="278" width="230" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="308" y="298" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">질문 2 · 배포 범위</text>
<text x="308" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">Argo CD 가 자기 클러스터에도</text>
<text x="308" y="339" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">배포하는가?</text>
<rect x="600" y="100" width="260" height="86" rx="6" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="616" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">core 설치</text>
<text x="616" y="150" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">core-install.yaml</text>
<text x="616" y="170" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">API server·UI·SSO·알림 없음</text>

<title id="dt">구조는 조직이 정하고 렌더 결과는 따로 쌓으며 승격은 옆 도구가 맡는다</title><desc id="dd">14-01 편의 전체 지도. 첫 행은 같은 YAML 의 반복을 DRY 로 줄이는 방법, 둘째 행은 설정 저장소를 앱 소스에서 떼고 개수를 조직 구조에 맞추는 결정, 셋째 행은 배포 때 렌더하는 방식의 한계를 rendered manifests 패턴과 Source Hydrator 로 푸는 것, 넷째 행은 환경 브랜치 대신 trunk 하나를 쓰고 렌더 결과 브랜치를 병합하지 않는 릴리스 산출물로 두는 것, 다섯째 행은 점진 배포와 승격을 옆 도구에 맡기고 Image Updater 의 write-back 두 방식으로 반영하는 길을 보인다.</desc>
<rect width="1000" height="608" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 14-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">구조는 조직이 정하고 렌더 결과는 따로 쌓으며 승격은 옆 도구가 맡는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행은 본문 절, 화살표 라벨은 앞 키워드에서 뒤 키워드로 넘어가는 관계</text>

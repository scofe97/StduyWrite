<title id="dt">부모가 자식 Application 을 만드는 간격</title><desc id="dd">위쪽 줄은 argocd-cm 에 Application 헬스 체크가 없을 때다. 부모가 wave 1 database, wave 2 backend, wave 3 frontend 자식을 2초 간격으로 만들고 앞 자식이 Progressing 이어도 기다리지 않는다. 아래쪽 줄은 Application 헬스 체크를 더했을 때다. 앞 자식이 Healthy 가 되어야 다음 자식을 만들어서 database 에서 backend 까지 약 27초, backend 에서 frontend 까지 약 16초가 걸린다.</desc>

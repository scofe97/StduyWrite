<title id="dt">dry 소스가 hydrated 브랜치를 거쳐 클러스터에 닿는 길</title><desc id="dd">왼쪽의 dry 소스 브랜치에 커밋이 들어오면 가운데 Source Hydrator 가 렌더하고 commit server 가 결과를 push 한다. 결과는 syncSource 브랜치의 manifest.yaml 로 커밋되고 Argo CD 는 그 브랜치만 읽어 클러스터에 동기화한다. 렌더 결과가 이전과 같으면 새 커밋 없이 git note 의 dry SHA 만 옮기고, hydrateTo 가 있으면 대기 브랜치에만 push 한다.</desc>
<rect width="880" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 14-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">dry 소스가 hydrated 브랜치를 거쳐 클러스터에 닿는 길</text>

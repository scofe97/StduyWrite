<title id="dt">SSO 는 누구인지를, RBAC 정책은 할 수 있는 일을 정한다</title><desc id="dd">06-02 편의 전체 지도. 첫 행은 Dex 설정에서 그룹이 기본으로 나오지 않아 따로 켜는 것, 둘째 행은 직접 OIDC 의 CLI 로그인이 비밀 없이 PKCE 로 동작하는 것, 셋째 행은 인증을 통과해도 권한이 없다가 이름과 그룹 문자열로 p 줄과 g 줄에 일치하고 deny 가 우선하는 것, 넷째 행은 내장 역할로 부족할 때 개발자 역할을 만들고 적용 전에 검증하는 것을 보인다.</desc>
<rect width="1000" height="516" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 06-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SSO 는 누구인지를, RBAC 정책은 할 수 있는 일을 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행은 본문 절, 화살표 라벨은 앞 키워드에서 뒤 키워드로 넘어가는 관계</text>
<rect x="23.18" y="122.0" width="21.64" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="34" y="136.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§1</text>
<rect x="23.18" y="214.0" width="21.64" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>

<title id="dt">매니페스트가 플러그인을 거쳐 나오는 길</title><desc id="dd">왼쪽의 Application 은 소스 경로와 plugin 설정을 가진다. 가운데 repo-server 가 소스 디렉터리를 유닉스 소켓으로 CMP 사이드카에 보낸다. 사이드카는 init 과 generate 를 차례로 실행하고 generate 가 stdout 에 찍은 YAML 을 매니페스트로 돌려준다. plugin 이름이 없고 discover 가 맞는 플러그인도 없으면 repo-server 는 내장 도구인 Helm·Kustomize·Directory 로 렌더한다.</desc>
<rect width="880" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 11-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">매니페스트가 플러그인을 거쳐 나오는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">플러그인은 repo-server 옆 사이드카이고 결과는 stdout 의 YAML 입니다</text>
<rect x="24" y="164" width="150" height="142" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="99.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">Application</text>
<text x="99.0" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">소스 경로</text>
<text x="99.0" y="256" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">plugin.name</text>
<text x="99.0" y="276" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">plugin.env</text>
<rect x="214" y="164" width="200" height="142" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="314.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">argocd-repo-server</text>
<text x="314.0" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">저장소 복제, 플러그인 고르기</text>
<text x="314.0" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">소스 디렉터리를 tar 로 전송</text>
<text x="314.0" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">plugins/&lt;이름&gt;[-&lt;버전&gt;].sock</text>
<rect x="454" y="164" width="216" height="142" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="562.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">CMP 사이드카</text>
<text x="562.0" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">plugin.yaml 의 spec</text>
<text x="562.0" y="258" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">discover → init → generate</text>
<text x="562.0" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">generate 의 stdout = YAML</text>

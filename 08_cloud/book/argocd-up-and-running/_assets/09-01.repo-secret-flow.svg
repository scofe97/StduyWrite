<title id="dt">저장소 등록이 접속으로 이어지는 길</title><desc id="dd">왼쪽의 등록 명령이나 UI 가 저장소 주소와 사용자 이름과 토큰을 argocd 네임스페이스의 Secret 으로 만든다. 가운데에서는 argocd-application-controller 와 argocd-server 가 그 Secret 을 읽어 요청에 담아 argocd-repo-server 에 넘긴다. 오른쪽에서는 argocd-repo-server 가 넘겨받은 자격 증명으로 Git 저장소에 HTTPS 로 접속한다. Secret 이 없는 상태에서 보호된 저장소를 가리키면 접속이 인증 단계에서 거절되어 authentication required 오류로 끝난다.</desc>
<rect width="880" height="400" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 09-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">저장소 등록이 접속으로 이어지는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">등록한 Secret 이 접속의 열쇠다</text>

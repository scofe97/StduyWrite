<title id="dt">플러그인은 사이드카가 매니페스트를 만들고 UI 는 설정과 파일이 맞춘다</title><desc id="dd">11-01 편의 전체 지도. 첫 행은 내장 도구로 렌더할 수 없는 소스를 사이드카의 플러그인이 받아 generate 가 stdout 에 찍은 YAML 을 매니페스트로 쓰는 구조, 둘째 행은 plugin.env 와 parameters 가 접두사를 달고 도착하는 통로와 운영에서 부딪히는 함정, 셋째 행은 배너와 CSS 와 확장의 세 층과 extension 파일이 놓이는 자리를 보인다.</desc>
<rect width="1000" height="424" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 11-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">플러그인은 사이드카가 매니페스트를 만들고 UI 는 설정과 파일이 맞춘다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행은 본문 절, 화살표 라벨은 앞 키워드에서 뒤 키워드로 넘어가는 관계</text>

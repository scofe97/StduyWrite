<title id="dt">RollingSync 의 단계별 sync</title><desc id="dd">ApplicationSet golist 가 Application 4개를 OutOfSync 상태로 한꺼번에 만든다. 그 뒤 RollingSync 가 단계 1 database, 단계 2 backend 라벨의 api-1 과 api-2, 단계 3 frontend 순서로 sync 한다. 각 단계는 앞 단계가 모두 Healthy 가 된 뒤 시작하고, 단계 2 는 maxUpdate 1 이라 api-1 이 Healthy 가 된 뒤에 api-2 를 시작한다.</desc>
<rect width="880" height="352" fill="#0D1117"/>

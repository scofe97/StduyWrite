<title id="dt">Argo CD 설치는 필요한 기능과 범위로 매니페스트 하나를 고르는 일이다</title><desc id="dd">02-01 편의 전체 지도. 첫 행은 컨트롤러가 커스텀 리소스를 감시해 세 CRD 를 제공하는 바탕, 둘째 행은 선언의 길이 Repository Server 에서 Application Controller 로 가고 사용자의 길이 API server 에서 같은 컨트롤러로 이어지는 구성, 셋째 행은 기능과 권한 범위 두 질문이 core 와 multi-tenant 를 거쳐 매니페스트 하나로 좁혀지는 선택, 넷째 행은 CRD 크기 한도를 server-side apply 로 피해 설치하고 초기 admin 비밀번호로 로그인하는 순서, 다섯째 행은 같은 설치를 Helm 차트로 반복할 때 릴리스 이름이 리소스 이름 앞에 붙는 변화를 보인다.</desc>
<rect width="1000" height="608" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Argo CD 설치는 필요한 기능과 범위로 매니페스트 하나를 고르는 일이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행은 본문 절, 화살표 라벨은 앞 키워드에서 뒤 키워드로 넘어가는 관계</text>

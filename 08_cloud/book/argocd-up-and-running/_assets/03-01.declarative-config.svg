<title id="dt">Git 의 설정 YAML 이 Argo CD 설정이 되는 길</title><desc id="dd">왼쪽의 Git 저장소에 둔 ConfigMap 과 Secret YAML 이 kubectl 이나 Application 동기화로 argocd 네임스페이스에 적용되는 흐름이다. 네임스페이스 안에서 argocd-cm 은 대개 API server 가 바로 읽고, argocd-rbac-cm 과 Secret 도 API server 가 읽으며 Secret 은 application-controller 도 읽는다. argocd-cmd-params-cm 은 구성 요소 프로세스의 실행 인자가 된다.</desc>
<rect width="880" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 03-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Git 의 설정 YAML 이 Argo CD 설정이 되는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">argocd-cm 은 대개 바로 읽히고 argocd-cmd-params-cm 은 재시작해야 읽힙니다</text>

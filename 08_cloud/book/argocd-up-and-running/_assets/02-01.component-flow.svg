<title id="dt">Argo CD 구성 요소가 선언을 클러스터에 닿게 하는 길</title><desc id="dd">위 레인은 Git 이나 Helm 저장소를 Repository Server 가 매니페스트로 바꾸고 Application Controller 가 그 결과와 대상 클러스터의 실제 상태를 비교하는 흐름이다. 가운데 레인은 UI, CLI, 외부 CI/CD 가 API server 를 거쳐 Application 리소스를 다루고 같은 Application Controller 가 그 리소스를 감시하는 흐름이다. 아래 레인은 Redis, Dex, Notifications, ApplicationSet controller 가 함께 설치되는 서비스라는 것을 보인다.</desc>

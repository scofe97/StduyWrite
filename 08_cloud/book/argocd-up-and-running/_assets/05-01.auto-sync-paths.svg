<title id="dt">자동 동기화가 세 변경을 처리하는 길</title><desc id="dd">맨 위 줄은 Git 에 push 한 변경이다. 자동 동기화를 켜면 OutOfSync 로 판정된 뒤 Git 값이 클러스터에 적용된다. 가운데 줄은 Git 에서 지운 리소스이고 prune 이 켜져 있으면 클러스터에서 지워지며 꺼져 있으면 남는다. 맨 아래 줄은 클러스터에서 직접 바꾼 값이고 selfHeal 이 켜져 있으면 Git 값으로 돌아오며 꺼져 있으면 OutOfSync 로 남는다.</desc>
<rect width="880" height="458" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 05-01 §1</text>

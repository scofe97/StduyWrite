<rect x="24" y="244" width="300" height="56" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="174.0" y="267" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">plugin.env</text>
<text x="174.0" y="288" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ARGOCD_ENV_&lt;이름&gt;</text>

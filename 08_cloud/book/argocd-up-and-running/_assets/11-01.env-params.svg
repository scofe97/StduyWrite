<title id="dt">generate 프로세스가 읽는 값의 출처</title><desc id="dd">왼쪽 네 칸은 generate 프로세스가 읽는 값의 출처이다. 사이드카 OS 환경과 Argo CD 가 채우는 ARGOCD_APP_* 빌드 환경과 Application 의 plugin.env 에서 온 ARGOCD_ENV_ 접두사 변수와 parameters 에서 온 PARAM_ 변수와 ARGOCD_APP_PARAMETERS 가 가운데 generate 로 모인다. 같은 값이 init 과 discover.find.command 에도 전달된다. 오른쪽 UI Parameters 탭은 plugin.yaml 이 알린 기본값을 보여 주기만 하고 그 값은 generate 로 전달되지 않는다.</desc>
<rect width="880" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 11-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">generate 프로세스가 읽는 값의 출처</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">plugin.yaml 의 기본값은 화면 표시용이고 generate 로 가는 값은 Application 에 적은 것입니다</text>
<rect x="24" y="104" width="300" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="174.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">사이드카 OS 환경</text>
<text x="174.0" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">PATH, HOME 같은 컨테이너 값</text>
<path d="M 326 132 L 406 132" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="24" y="174" width="300" height="56" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="174.0" y="197" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">Argo CD 빌드 환경</text>
<text x="174.0" y="218" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ARGOCD_APP_NAME, ARGOCD_APP_REVISION</text>

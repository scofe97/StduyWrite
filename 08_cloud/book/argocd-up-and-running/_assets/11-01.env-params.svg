<text x="174.0" y="358" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">PARAM_&lt;이름&gt;, ARGOCD_APP_PARAMETERS</text>

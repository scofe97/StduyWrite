<title id="dt">소스가 매니페스트가 되어 대상에 닿는 길</title><desc id="dd">왼쪽의 Git 저장소와 Helm 저장소는 Application 의 source 가 가리키는 곳이다. 가운데의 Repository Server 는 폴더 안의 파일을 보고 Helm, Kustomize, 일반 디렉터리 가운데 하나로 매니페스트를 만든다. 오른쪽의 Application Controller 는 그 매니페스트를 destination 이 가리키는 클러스터와 네임스페이스의 실제 상태와 비교한다.</desc>
<rect width="880" height="372" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 04-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">소스가 매니페스트가 되어 대상에 닿는 길</text>

<title id="dt">Application 은 소스를 대상에 맞추는 선언이고 삭제는 finalizer 가 정한다</title><desc id="dd">04-01 편의 전체 지도. 첫 행은 매니페스트가 있는 곳인 source 를 Application 이 담아 클러스터와 네임스페이스인 destination 에 맞추는 선언, 둘째 행은 소스 폴더의 파일을 보고 Helm 이나 Kustomize 를 골라 렌더링한 매니페스트가 클러스터에 닿는 흐름, 셋째 행은 sync 를 해야 배포되는 새 Application 을 지울 때 finalizer 유무가 리소스를 남기거나 지우는 흐름을 보인다.</desc>
<rect width="1000" height="424" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 04-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Application 은 소스를 대상에 맞추는 선언이고 삭제는 finalizer 가 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행은 본문 절, 화살표 라벨은 앞 키워드에서 뒤 키워드로 넘어가는 관계</text>
<rect x="23.18" y="122.0" width="21.64" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="34" y="136.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§1</text>
<rect x="23.18" y="214.0" width="21.64" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="34" y="228.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§2</text>
<rect x="23.18" y="306.0" width="21.64" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="34" y="320.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§3</text>
<rect x="64" y="104" width="216" height="64" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="172.0" y="131" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">source</text>
<text x="172.0" y="153" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">매니페스트가 있는 곳</text>
<rect x="408" y="104" width="216" height="64" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="516.0" y="131" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">Application</text>

<title id="dt">UI·CLI·REST API 가 같은 API server 로 모이는 길</title><desc id="dd">왼쪽의 세 입구인 브라우저, argocd CLI, REST 클라이언트가 가운데의 Ingress 컨트롤러를 지나 하나의 API server 에 닿는 구성도다. API server 는 오른쪽의 클러스터 리소스인 Application, ConfigMap, Secret 을 읽고 쓴다.</desc>

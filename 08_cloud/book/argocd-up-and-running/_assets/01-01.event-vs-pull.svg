<title id="dt">이벤트 기반 CD 와 Argo CD 의 움직임</title><desc id="dd">위 레인은 Git 변경 이벤트가 웹훅으로 파이프라인을 호출하고 파이프라인이 클러스터에 적용한 뒤 끝나는 이벤트 기반 흐름이고, 아래 레인은 Argo CD 가 정해진 주기로 Git 을 가져와 Live state 와 비교하고 OutOfSync 면 자동 Sync 를 켠 경우 Sync 한 뒤 다시 처음으로 돌아가는 pull 흐름이다.</desc>
<rect width="880" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 01-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이벤트 기반 CD 와 Argo CD 의 움직임</text>

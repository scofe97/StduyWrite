<title id="dt">Argo CD 는 주기로 변경을 알아채고 CI 는 검증 뒤 리비전을 지정한다</title><desc id="dd">12-01 편의 전체 지도. 첫 행은 풀 방식의 감지 지연과 조정 주기 줄이기, 둘째 행은 Webhook 이 새로 고침만 재촉하는 것, 셋째 행은 검증 전에 배포되는 문제를 프로젝트 역할 토큰으로 부르는 app sync --revision 이 푸는 것, 넷째 행은 Tekton 의 Task 와 Pipeline 이 린트 뒤에 동기화를 잇는 것, 다섯째 행은 push 이벤트가 EventListener 를 거쳐 PipelineRun 이 되는 흐름과 인증 없는 접수를 보인다.</desc>
<rect width="1000" height="608" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 12-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Argo CD 는 주기로 변경을 알아채고 CI 는 검증 뒤 리비전을 지정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행은 본문 절, 화살표 라벨은 앞 키워드에서 뒤 키워드로 넘어가는 관계</text>
<rect x="23.18" y="122.0" width="21.64" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="34" y="136.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§1</text>

<title id="dt">Git 변경이 Argo CD 에 닿는 두 길</title><desc id="dd">왼쪽의 Git 저장소에서 변경을 알리는 길이 둘로 갈라진다. 위쪽 길은 조정 주기마다 Argo CD 가 저장소를 끌어와 조회하는 폴링이고 기본 간격은 120초에 최대 60초의 jitter 를 더한 값이다. 아래쪽 길은 Git 서버가 push 때 argocd-server 의 /api/webhook 으로 요청을 보내 새로 고침을 재촉하는 Webhook 이다. 두 길은 가운데 새로 고침 단계에서 합쳐져 repo-server 가 최신 리비전을 읽고 앱을 비교한다. 그 뒤는 앱의 자동 동기화 설정이 갈라서, 켜져 있으면 동기화하고 꺼져 있으면 OutOfSync 로 남겨 둔다.</desc>
<rect width="880" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 12-01 §2</text>

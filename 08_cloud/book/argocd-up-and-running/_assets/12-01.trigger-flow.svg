<title id="dt">push 에서 Argo CD 동기화까지</title><desc id="dd">위쪽 줄에서 Git push 이벤트가 EventListener 로 들어오면 TriggerBinding 이 본문의 after 값을 revision 으로 꺼내고 TriggerTemplate 이 그 값으로 PipelineRun 을 만든다. 아래쪽 PipelineRun 안에서는 lint Task 가 먼저 돌고, 이어서 동기화 Task 가 프로젝트 역할 토큰으로 argocd app sync --revision 과 app wait --health 를 불러 Argo CD 에 그 SHA 를 동기화시킨다.</desc>
<rect width="880" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 12-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">push 에서 Argo CD 동기화까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">검증을 통과한 SHA 만 Argo CD 에 닿습니다</text>
<rect x="24" y="132" width="118" height="92" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="83.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">Git push</text>
<text x="83.0" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">after = 새 SHA</text>
<rect x="172" y="132" width="160" height="92" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="252.0" y="162" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">EventListener</text>
<text x="252.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">el-push-listener</text>
<text x="252.0" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">8080, 접수하면 202</text>
<rect x="362" y="132" width="200" height="92" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="462.0" y="162" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">TriggerBinding</text>
<text x="462.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">revision = $(body.after)</text>
<text x="462.0" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">본문에서 값 꺼냄</text>
<rect x="592" y="132" width="264" height="92" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="724.0" y="162" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">TriggerTemplate</text>
<text x="724.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">revision = $(tt.params.revision)</text>
<text x="724.0" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">PipelineRun 을 만듦</text>

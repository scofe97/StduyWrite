<title id="dt">클러스터가 샤드에 나뉘는 모양</title><desc id="dd">컨트롤러 StatefulSet 이 두 개로 뜨면 Pod 번호 0 과 1 이 각각 샤드가 된다. Secret 이 없는 in-cluster 는 늘 샤드 0 이고, Secret 으로 등록한 클러스터는 기본 알고리즘이 uid 해시로 샤드를 고른다. 클러스터 Secret 에 shard 값을 쓰면 그 샤드로 고정되며 점선이 그 배정이다.</desc>

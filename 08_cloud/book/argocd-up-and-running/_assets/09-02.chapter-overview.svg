<title id="dt">Argo CD 는 열쇠·서명·sync 계정 세 곳에서 Git 에 대한 믿음을 좁힌다</title><desc id="dd">09-02 편의 전체 지도. 첫 행은 SSH 저장소에 개인 키와 호스트 키를 둘 다 등록하고 저장소가 많으면 자격 증명 템플릿의 가장 긴 접두사가 적용되어 CREDS 열에 inherited 가 찍히는 흐름, 둘째 행은 서명 없는 커밋과 낯선 키의 커밋을 sourceIntegrity 정책이 키링과 믿는 키로 거르고 거부 문구로 원인을 가리는 흐름, 셋째 행은 sync 가 컨트롤러 계정 권한을 갖는 문제를 프로젝트의 서비스 계정 매핑과 dry run 검사로 풀어 컨트롤러와 테넌트의 권한을 분리하는 흐름을 보인다.</desc>
<rect width="1000" height="424" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 09-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Argo CD 는 열쇠·서명·sync 계정 세 곳에서 Git 에 대한 믿음을 좁힌다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행은 본문 절, 화살표 라벨은 앞 키워드에서 뒤 키워드로 넘어가는 관계</text>

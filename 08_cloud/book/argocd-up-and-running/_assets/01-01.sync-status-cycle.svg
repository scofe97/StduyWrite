<title id="dt">Application 의 Sync status 가 바뀌는 길</title><desc id="dd">Application 은 Live state 와 Target state 가 같은 Synced 상태에서 출발한다. Git 의 Target state 가 바뀌거나 클러스터의 Live state 가 수동으로 바뀌면 OutOfSync 가 되고, Sync 가 Live state 를 Target state 로 옮기면 다시 Synced 가 된다.</desc>
<rect width="880" height="412" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 01-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Application 의 Sync status 가 바뀌는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Git 이 바뀌어도 클러스터를 손으로 고쳐도 OutOfSync 가 되고, Sync 를 거쳐야 Synced 로 돌아옵니다</text>
<rect x="100" y="124" width="224" height="100" rx="8" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.4"/>
<text x="212.0" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#3FB98C">Synced</text>
<text x="212.0" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Live state 가 Target state 와 같음</text>
<rect x="556" y="124" width="224" height="100" rx="8" fill="#E3B34114" stroke="#E3B341" stroke-width="1.4"/>
<text x="668.0" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#E3B341">OutOfSync</text>
<text x="668.0" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Live state 가 Target state 와 다름</text>
<path d="M 326 150 L 552 150" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Git 의 Target state 변경</text>
<path d="M 326 198 L 552 198" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="189" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Live state 의 수동 변경</text>
<path d="M 668.0 226 L 668.0 294 L 212.0 294 L 212.0 228" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<rect x="416.88" y="284" width="46.24" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="440.0" y="298" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">Sync</text>
<text x="440.0" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Live state 를 Target state 로 이동</text>
<line x1="12" y1="354" x2="832" y2="354" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="376" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="366" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">차이 없음</text>
<rect x="209" y="366" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="231" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">차이 있음</text>
<rect x="318" y="366" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="340" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Sync 전이</text>
</svg>
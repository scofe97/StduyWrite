<title id="dt">RBAC 가 요청을 허용하거나 거부하는 길</title><desc id="dd">왼쪽의 요청에서 시작해 g 줄이 주체가 받은 역할을 찾고 주체 자신과 그 역할의 p 줄을 요청과 대조한다. deny 가 하나라도 일치하면 거부하고 allow 만 일치하면 허용하며 일치하는 줄이 없으면 거부한다. 줄이 적힌 순서는 결과에 영향을 주지 않는다. 아래쪽의 policy.default 의 역할은 이 대조와 별개로 권한을 주며 deny 로 막히지 않는다.</desc>
<rect width="880" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 06-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">RBAC 가 요청을 허용하거나 거부하는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">결과를 가르는 것은 줄의 순서가 아니라 deny 가 일치하는지입니다</text>
<rect x="24" y="170" width="150" height="130" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="99.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">요청</text>
<text x="99.0" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">주체 · 그룹</text>
<text x="99.0" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">자원 · 동작</text>
<text x="99.0" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">객체</text>
<rect x="214" y="170" width="200" height="130" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="314.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">g 줄: 역할 찾기</text>
<text x="314.0" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">주체 자신과 받은 역할</text>
<text x="314.0" y="262" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">g, Developers,</text>
<text x="314.0" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">role:developers</text>
<rect x="454" y="170" width="216" height="130" rx="6" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="562.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">p 줄: 허용 · 거부 대조</text>
<text x="562.0" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">주체 자신과 그 역할의 줄</text>
<text x="562.0" y="262" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">p, role:developers,</text>
<text x="562.0" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">applications, *, */*, allow</text>

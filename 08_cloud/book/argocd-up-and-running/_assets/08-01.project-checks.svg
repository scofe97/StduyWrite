<title id="dt">AppProject 가 거르는 때와 항목</title><desc id="dd">위쪽 줄은 Application 을 만들거나 갱신하는 때와 컨트롤러가 refresh 하는 때다. 프로젝트의 sourceRepos 와 destinations 를 대조해 허용된 값이면 다음으로 가고 어긋나면 InvalidSpecError 로 거부한다. 아래쪽 줄은 동기화하는 시점이다. 프로젝트가 허용한 리소스 종류만 클러스터에 적용되고 허용하지 않은 종류가 있으면 not permitted in project 오류와 함께 동기화가 Failed 로 끝난다.</desc>

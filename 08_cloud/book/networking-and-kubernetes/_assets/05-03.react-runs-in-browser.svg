<title id="dt">정적 파일은 클러스터에, 실행은 브라우저에</title><desc id="dd">리액트 앱의 배치도. 클러스터 안 존에는 정적 파일을 서빙하는 프런트 Pod 와 API 를 받는 백엔드 Pod 가 있고, 실행되는 번들 JS 는 사용자 브라우저 존에 있다. 브라우저가 부르는 API 가 클러스터 밖에서 다시 들어오는 요청이라는 것을 초점으로 강조했다. 서버가 대신 부르는 구성만 Pod 사이 통신이다.</desc>
<rect width="1000" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">WHERE THE CODE RUNS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">정적 파일은 클러스터에, 실행은 브라우저에</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">클러스터에 있는 것은 파일이고, 코드가 도는 자리는 브라우저입니다</text>
<rect x="32" y="128" width="536" height="236" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="52" y="154" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">클러스터 안</text>
<rect x="632" y="128" width="336" height="236" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="652" y="154" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">사용자 브라우저</text>
<rect x="56" y="184" width="216" height="108" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="72" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">프런트 Pod</text>
<text x="72" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정적 파일 서빙</text>

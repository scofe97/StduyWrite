<title id="dt">같은 호스트 안 — 컨테이너마다 자기 스택을 따로 가진다</title><desc id="dd">매핑은 호스트 스택에만 있다. 컨테이너 안에서는 컨테이너 포트만 열려 있고, 자기 lo 는 자기 것이라 서로 닿지 않는다.</desc>

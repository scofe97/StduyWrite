<title id="dt">NAT — 공인 주소 하나를 여럿이 나눠 쓰는 법</title><desc id="dd">나갈 때 사설 주소와 포트를 공인 주소와 새 포트로 바꿔 적고, 돌아올 때 도착 포트만 보고 표에서 주인을 찾는다</desc>
<rect width="1000" height="940" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NAT · PORT ADDRESS TRANSLATION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">NAT — 공인 주소 하나를 여럿이 나눠 쓰는 법</text>

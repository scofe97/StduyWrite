<title id="dt">Docker 에서는 앱이 말한 주소로 다시 붙을 수 없다</title><desc id="dd">포트 매핑 뒤의 Kafka 브로커는 자기를 172.17.0.5 로 보지만 그 주소는 노드 안에서만 유효해, 브로커가 광고한 주소로 클라이언트가 다시 붙는 세 번째 단계가 실패한다.</desc>
<rect width="1000" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DOCKER · PORT MAPPING · THE SECOND CONNECTION FAILS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Docker 에서는 앱이 말한 주소로 다시 붙을 수 없다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">사람이 적은 주소로 붙는 1번은 되고, 앱이 말한 주소로 붙는 3번은 안 된다</text>

<text x="24" y="840" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">네 레인의 칸이 같은 자리에 놓인 것은 평가 순서가 같기 때문이다. 달라지는 것은 그 체인이 어느 테이블을 갖느냐뿐이다.</text>
<text x="24" y="862" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">NAT 열이 맨 위와 맨 아래에서 두 번 켜진다 — 같은 테이블인데 평가되는 시점이 둘이라는 뜻이다.</text>

<title id="dt">체인이 바깥이고 테이블이 그 안이다 — 라우팅 판단에서 갈리는 두 갈래</title><desc id="dd">레인 하나가 체인 하나다. 레인 안의 칸이 그 체인에서 Raw·Mangle·NAT·Filter 순으로 평가되는 테이블이고, 점선 칸은 그 체인에 없는 테이블이다. 칸을 열로 맞춰 두어 nat 열이 위아래로 두 번 켜지는 것이 보인다.</desc>
<rect width="1000" height="936" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">IPTABLES · CHAIN FIRST, TABLE INSIDE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">체인이 바깥이고 테이블이 그 안이다 — 라우팅 판단에서 갈리는 두 갈래</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">레인 = 체인(파란 글자가 커널이 같은 자리를 부르는 훅 이름) · 열 = 테이블 · 진한 칸 = 실제로 일이 일어나는 자리</text>
<text x="264" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">Raw</text>
<text x="264" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">PREROUTING·OUTPUT 뿐</text>
<text x="464" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">Mangle</text>
<text x="464" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">다섯 체인 전부</text>
<text x="664" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">NAT</text>
<text x="664" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">여기서 두 번 켜진다</text>
<text x="864" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">Filter</text>
<text x="864" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">INPUT·FORWARD·OUTPUT</text>
<rect x="24" y="148" width="952" height="124" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="176" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">PREROUTING</text>
<text x="40" y="194" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">라우팅 판단 전</text>
<text x="40" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">NF_IP_PRE_ROUTING</text>

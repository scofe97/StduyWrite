<text x="464" y="482" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">헤더 편집</text>
<rect x="584" y="432" width="160" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="664" y="462" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">NAT</text>
<text x="664" y="482" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">테이블만 존재</text>
<rect x="784" y="432" width="160" height="64" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.4"/>
<text x="864" y="462" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Filter</text>
<text x="864" y="482" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">수락·거부</text>

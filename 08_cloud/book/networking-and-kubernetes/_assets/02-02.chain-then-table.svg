<text x="664" y="638" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">이 체인에 없음</text>
<rect x="784" y="588" width="160" height="64" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.4"/>

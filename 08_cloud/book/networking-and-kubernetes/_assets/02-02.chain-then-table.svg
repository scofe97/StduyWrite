<path d="M 552 464 L 574 464" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 752 464 L 774 464" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="464" y="526" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">또는 — 목적지가 이 호스트가 아니면 아래 레인으로</text>
<rect x="184" y="588" width="160" height="64" rx="6" fill="none" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="6 6"/>
<text x="264" y="618" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">Raw</text>
<text x="264" y="638" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">이 체인에 없음</text>
<rect x="384" y="588" width="160" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="464" y="618" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Mangle</text>
<text x="464" y="638" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">헤더 편집</text>

<rect x="24" y="296" width="952" height="64" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="40" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">라우팅 결정</text>
<text x="40" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">체인을 가르는 유일한 분기</text>

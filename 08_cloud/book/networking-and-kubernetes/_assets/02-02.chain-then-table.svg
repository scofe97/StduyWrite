<path d="M 464 360 L 464 380" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<rect x="184" y="432" width="160" height="64" rx="6" fill="none" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="6 6"/>
<text x="264" y="462" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">Raw</text>
<text x="264" y="482" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">이 체인에 없음</text>

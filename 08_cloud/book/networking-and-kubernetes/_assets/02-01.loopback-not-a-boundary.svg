<title id="dt">127.0.0.1 은 접근 제어가 아니다 — 밖에서 경계를 넘어온 길</title><desc id="dd">점선 안이 '로컬 전용'이라 믿는 구간이다. 노드 설정 하나가 그 안으로 들어가는 길을 열어 줬다.</desc>
<rect width="1000" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CVE-2020-8558 · 127.0.0.1 IS NOT A FENCE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">127.0.0.1 은 접근 제어가 아니다 — 밖에서 경계를 넘어온 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">점선 안이 '로컬 전용'이라 믿는 구간 · 설정 하나가 그 안으로 들어가는 길을 열었다</text>

<path d="M 512 258 L 564 258 L 564 286 L 514 286" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="576" y="264" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">KUBE-SVC 확률 → -j DNAT</text>
<text x="576" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이때 conntrack 항목이 만들어진다</text>

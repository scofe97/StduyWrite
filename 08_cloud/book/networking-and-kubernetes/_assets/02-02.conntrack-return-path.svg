<text x="670" y="390" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">src 10.244.1.66:8080</text>
<text x="670" y="418" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Pod 가 자기 주소로 응답한다</text>
<rect x="81.59" y="454" width="20.82" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="92" y="468" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">5</text>
<path d="M 512 450 L 564 450 L 564 478 L 514 478" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="576" y="456" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">conntrack 조회 → 역-DNAT</text>
<text x="576" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">규칙은 한 줄도 안 본다 — 항목이 목적지를 되돌린다</text>
<rect x="81.59" y="518" width="20.82" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="92" y="532" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">6</text>
<path d="M 488 528 L 174 528" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="330" y="518" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">src 10.96.192.224:8080</text>
<text x="330" y="546" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보낸 주소에서 온 것으로 보여야 소켓이 받는다</text>
<rect x="24" y="592" width="952" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="612" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">conntrack 항목 하나 — 2 에서 만들어져 5 에서 읽힌다 (kind 실측)</text>

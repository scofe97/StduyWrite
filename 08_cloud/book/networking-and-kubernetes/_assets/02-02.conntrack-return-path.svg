<text x="64" y="676" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">src=10.244.1.11:43346  dst=10.96.192.224:8080</text>
<text x="64" y="694" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">클라이언트가 보낸 그대로</text>
<rect x="508" y="632" width="448" height="72" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="528" y="656" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">역방향 기대 튜플</text>
<text x="528" y="676" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">src=10.244.1.66:8080  dst=10.244.1.11:43346</text>
<text x="528" y="694" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">DNAT 결과를 뒤집어 미리 적어 둔 것</text>
<text x="36" y="748" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">응답이 역방향 기대 튜플과 맞으면 커널이 출발지를 되돌린다 — 확률 규칙은 연결 수명 동안 다시 평가되지 않는다</text>
<line x1="12" y1="764" x2="952" y2="764" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="786" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="776" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="786" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">요청 — 규칙을 보는 구간</text>
<rect x="326" y="776" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="348" y="786" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">응답 — 항목만 따라가는 구간</text>

<title id="dt">규칙을 보는 것은 첫 패킷뿐 — 응답은 conntrack 항목 하나를 따라 되돌아온다</title><desc id="dd">위에서 아래로 시간이 흐른다. 1~3 이 요청, 4~6 이 응답이다. 확률 규칙을 평가하는 것은 2 한 번뿐이고, 5 는 규칙 대신 아래 띠의 항목을 읽는다.</desc>
<rect width="1000" height="808" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONNTRACK · ONE ENTRY, TWO DIRECTIONS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">규칙을 보는 것은 첫 패킷뿐 — 응답은 conntrack 항목 하나를 따라 되돌아온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">아래로 갈수록 시간 · 1~3 요청 · 4~6 응답 · 규칙을 보는 것은 2 한 번뿐</text>
<rect x="20" y="108" width="280" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="160" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트 Pod</text>
<text x="160" y="145" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10.244.1.11:43346</text>
<rect x="360" y="108" width="280" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">노드 커널</text>
<text x="500" y="145" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">nat + conntrack</text>
<rect x="700" y="108" width="280" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="840" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">백엔드 Pod</text>
<text x="840" y="145" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10.244.1.66:8080</text>
<line x1="160" y1="160" x2="160" y2="560" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>

<title id="dt">같은 세 줄인데 패킷에 따라 도착지가 다르다</title><desc id="dd">정책을 DROP 으로 뒤집고 두 줄만 허용하면 방향성 있는 방화벽이 됩니다. 기존 연결의 응답은 첫 줄에서 통과하고, 밖에서 온 새 연결은 어디에도 걸리지 않아 정책을 맞습니다.</desc>
<rect width="1000" height="664" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FORWARD CHAIN · TWO TRACES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 세 줄인데 패킷에 따라 도착지가 다르다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">응답은 첫 줄에서, 나가는 새 연결은 둘째 줄에서, 나머지는 정책이 맞는다</text>
<rect x="240" y="146" width="200" height="44" rx="20" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="340" y="173" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">FORWARD 체인 도착</text>
<path d="M 340 190 L 340 212" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 340 220 L 520 268 L 340 316 L 160 268 Z" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="340" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">기존 연결의 일부인가?</text>
<text x="340" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">--ctstate ESTABLISHED,RELATED</text>
<path d="M 520 268 L 656 268" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="592" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">예</text>
<rect x="664" y="246" width="200" height="44" rx="20" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="764" y="273" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">ACCEPT</text>
<rect x="706.56" y="311" width="114.88" height="26" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="764" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">밖에서 온 응답</text>
<path d="M 340 316 L 340 364" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="354" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">아니오</text>
<path d="M 340 372 L 520 420 L 340 468 L 160 420 Z" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="340" y="410" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">출발지가 10.10.1.0/24 인가?</text>
<text x="340" y="436" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">-s 10.10.1.0/24</text>
<path d="M 520 420 L 656 420" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="592" y="408" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">예</text>
<rect x="664" y="398" width="200" height="44" rx="20" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="764" y="425" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">ACCEPT</text>
<rect x="684.84" y="463" width="158.32" height="26" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="764" y="480" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">안에서 나가는 새 연결</text>
<path d="M 340 468 L 340 510" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="354" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">아니오 — 어느 줄에도 안 걸림</text>
<rect x="240" y="518" width="200" height="44" rx="20" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="340" y="545" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">정책 DROP</text>
<rect x="696.84" y="527" width="134.32" height="26" rx="5" fill="#F08A5914" stroke="#F08A59" stroke-width="1.0"/>
<text x="764" y="544" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">밖에서 온 새 연결</text>
<text x="36" y="604" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">규칙을 다 훑고도 안 걸리면 체인의 기본 정책이 적용됩니다. 정책이 ACCEPT 인 채로 두면 이 세 줄은 아무것도 막지 못합니다.</text>
<line x1="12" y1="620" x2="952" y2="620" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="642" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="632" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="642" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">통과</text>
<rect x="170" y="632" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="192" y="642" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어디에도 안 걸려 정책을 맞는다</text>
</svg>
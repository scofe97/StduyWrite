<title id="dt">conntrack 엔트리가 생겨서 사라지기까지 — 플래그는 상태와 다른 축이다</title><desc id="dd">위 축은 상태 전이(NEW → ESTABLISHED), 아래 축은 플래그가 붙고 떨어지는 시점이다. [UNREPLIED] 는 상태 전이와 같은 시점에 떨어지지만 [ASSURED] 는 그보다 뒤, 양방향으로 데이터가 실제로 오간 뒤에 붙는다. 그 사이의 간격이 테이블 포화 때 무엇이 먼저 축출되는지를 가른다.</desc>
<rect width="1000" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONNTRACK ENTRY · STATE AXIS vs FLAG AXIS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">conntrack 엔트리가 생겨서 사라지기까지 — 플래그는 상태와 다른 축이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">상태 전이와 플래그 부착은 같은 시점이 아니다 · 그 간격이 축출 순서를 가른다</text>
<circle cx="48" cy="300" r="6" fill="#F5F5F3"/>
<path d="M 56 300 L 192 300" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="160" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">첫 패킷</text>
<text x="160" y="288" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">TCP SYN</text>
<rect x="200" y="252" width="192" height="96" rx="8" fill="#E3B34112" stroke="#E3B341" stroke-width="1.4"/>
<text x="296" y="274" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">NEW</text>
<text x="296" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">응답이 아직 없음</text>
<text x="296" y="326" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">120초</text>
<path d="M 392 300 L 560 300" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="456" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">반대 방향 패킷 관측</text>
<rect x="568" y="252" width="232" height="96" rx="8" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.4"/>
<text x="684" y="274" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">ESTABLISHED</text>
<text x="684" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">양방향으로 패킷 관측</text>
<text x="684" y="326" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">432000초 · 닷새</text>
<path d="M 800 300 L 898 300" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="852" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">수명 만료</text>
<text x="852" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">테이블에서 삭제</text>
<circle cx="912" cy="300" r="8" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<circle cx="912" cy="300" r="5" fill="#8B98A9"/>

<text x="24" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">플래그 축 · 상태 전이와 다른 자리</text>
<line x1="120" y1="430" x2="880" y2="430" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

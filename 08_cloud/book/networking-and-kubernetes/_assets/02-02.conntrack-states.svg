<line x1="480" y1="430" x2="724" y2="430" stroke="#F08A59" stroke-width="2.4"/>
<text x="602" y="416" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">두 사건 사이의 간격</text>
<line x1="248" y1="348" x2="248" y2="424" stroke="#8B98A9" stroke-width="1.0" stroke-dasharray="4 4"/>
<circle cx="248" cy="430" r="4" fill="#8B98A9"/>
<text x="248" y="458" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">[UNREPLIED] 부착</text>

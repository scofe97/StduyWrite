<text x="552" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">어느 상태에서든</text>
<rect x="604" y="140" width="248" height="68" rx="8" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>

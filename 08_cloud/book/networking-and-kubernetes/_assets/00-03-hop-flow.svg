<title id="dt">구간마다 무엇이 다시 쓰이는가</title><desc id="dd">장비 넷을 가로로 잇고 구간마다 목적지 MAC 과 출발지·목적지 IP 를 값과 그 주인 이름까지 붙인 흐름도. MAC 은 세 번, 출발지 IP 는 NAT 에서 한 번 바뀌고 목적지 IP 만 끝까지 같다.</desc>

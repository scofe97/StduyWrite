<title id="dt">HTTP 요청 아래의 연결 — 비용·상태·판단을 읽는 순서</title><desc id="dd">01-02편의 전체 구조. HTTP 요청 하나가 TCP 연결과 TLS 위에서 차례로 성공해야 한다는 데서 출발해, 새 연결이 매번 치르는 절차와 재사용의 의미를 보고, 연결을 닫은 뒤 남는 상태를 운영 신호로 읽은 다음, TLS·이름·UDP 로 이어진다. 새 연결과 재사용의 차이가 중심이다.</desc>
<rect width="1000" height="392" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 01-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">HTTP 요청 아래의 연결 — 비용·상태·판단을 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세 단계 성공 → 새 연결의 값 → 닫은 뒤 남는 상태 → 얹고 고르기</text>
<text x="119.75" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§1</text>
<rect x="12.0" y="132" width="215.5" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="119.75" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">요청이 지나는 단계</text>
<line x1="30.0" y1="182" x2="209.5" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="119.75" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">TCP · TLS · HTTP 차례로</text>
<text x="30.0" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 단계마다 다른 실패</text>
<text x="30.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 시간 제한도 단계별</text>
<text x="30.0" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· curl 한 줄로 보기</text>
<path d="M 230.5 230.0 L 249.5 230.0" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="361.25" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§2</text>
<rect x="253.5" y="132" width="215.5" height="196" rx="6" fill="#F0616D10" stroke="#F0616D" stroke-width="1.4"/>
<text x="361.25" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">새 연결의 값</text>
<line x1="271.5" y1="182" x2="451.0" y2="182" stroke="#F0616D44" stroke-width="0.9"/>
<text x="361.25" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">수립 · 전송 · 종료를 매번</text>
<text x="271.5" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 캡처로 세 구간 보기</text>
<text x="271.5" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 패킷 수와 시간은 별개</text>
<text x="271.5" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 재사용이 나눠 내는 값</text>
<path d="M 472.0 230.0 L 491.0 230.0" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="602.75" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§3</text>
<rect x="495.0" y="132" width="215.5" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="602.75" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">닫은 뒤 남는 상태</text>
<line x1="513.0" y1="182" x2="692.5" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="602.75" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">TIME-WAIT · CLOSE-WAIT</text>
<text x="513.0" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 먼저 닫은 쪽의 2MSL</text>
<text x="513.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 앱이 안 닫은 소켓</text>
<text x="513.0" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 생성 빈도로 읽기</text>
<path d="M 713.5 230.0 L 732.5 230.0" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="844.25" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§4~§6</text>
<rect x="736.5" y="132" width="215.5" height="196" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.4"/>
<text x="844.25" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">얹고 고르기</text>
<line x1="754.5" y1="182" x2="934.0" y2="182" stroke="#3FB98C44" stroke-width="0.9"/>
<text x="844.25" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">TLS · 이름 셋 · UDP</text>
<text x="754.5" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· TLS — 합의 한 번 더</text>
<text x="754.5" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· DNS·SNI·Host 의 목적</text>
<text x="754.5" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· UDP — 앱이 떠안는 책임</text>
<line x1="12" y1="352" x2="952" y2="352" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="374" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="364" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">도입·전개</text>
<rect x="209" y="364" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="231" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핵심·결론</text>
<rect x="318" y="364" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="340" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">다음으로 이어짐</text>
</svg>
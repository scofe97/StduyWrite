<title id="dt">Transport 계층 해부 — 신뢰성의 비용을 세는 순서</title><desc id="dd">01-02편의 전체 구조. 무엇이 오가는지 보고, 연결을 세우는 절차를 익히고, 그 비용을 패킷 수로 센 뒤, 그 값을 낼지 말지 고르는 네 단계로 이어진다. 12패킷 중 데이터는 2개뿐이라는 사실이 결론이다.</desc>
<rect width="1000" height="406" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 01-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Transport 계층 해부 — 신뢰성의 비용을 세는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">무엇이 오가나 → 연결을 세운다 → 비용을 센다 → 값을 낼지 고른다</text>
<text x="119.75" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§1·2</text>
<rect x="12.0" y="132" width="215.5" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="119.75" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">무엇이 오가나</text>
<line x1="30.0" y1="182" x2="209.5" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="119.75" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">HTTP 요청과 TCP 헤더 필드</text>
<text x="30.0" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· curl -vvv 로 본 L7</text>
<text x="30.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· seq·ack 가 순서를 보증</text>
<text x="30.0" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 윈도우가 흐름을 조절</text>
<path d="M 230.5 230.0 L 249.5 230.0" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="361.25" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§3</text>
<rect x="253.5" y="132" width="215.5" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="361.25" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">연결을 세운다</text>
<line x1="271.5" y1="182" x2="451.0" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="361.25" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">3-way 로 열고 4-way 로 닫는다</text>
<text x="271.5" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 번호가 양방향으로</text>
<text x="271.5" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 11개 상태를 오간다</text>
<text x="271.5" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· TIME-WAIT 가 포트를 문다</text>
<path d="M 472.0 230.0 L 491.0 230.0" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="602.75" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§4</text>
<rect x="495.0" y="132" width="215.5" height="196" rx="6" fill="#F0616D10" stroke="#F0616D" stroke-width="1.4"/>
<text x="602.75" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">비용을 센다</text>
<line x1="513.0" y1="182" x2="692.5" y2="182" stroke="#F0616D44" stroke-width="0.9"/>
<text x="602.75" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">12패킷 중 내용은 둘뿐</text>
<text x="513.0" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 나머지 열은 절차</text>
<text x="513.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· tcpdump 로 실측</text>
<text x="513.0" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 이 편의 결론</text>
<path d="M 713.5 230.0 L 732.5 230.0" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="844.25" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§5·6</text>
<rect x="736.5" y="132" width="215.5" height="196" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.4"/>
<text x="844.25" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">값을 낼지 고른다</text>
<line x1="754.5" y1="182" x2="934.0" y2="182" stroke="#3FB98C44" stroke-width="0.9"/>
<text x="844.25" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">더 내면 TLS, 안 내면 UDP</text>
<text x="754.5" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· TLS — 핸드셰이크 한 번 더</text>
<text x="754.5" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· UDP — 확인을 포기</text>
<text x="754.5" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 같은 저울의 반대편</text>
<text x="500.0" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">붉은 칸이 이 편의 결론입니다 — 마지막 칸에서 길이 갈립니다.</text>
<line x1="12" y1="362" x2="952" y2="362" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="384" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="374" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">도입·전개</text>
<rect x="209" y="374" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="231" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핵심·결론</text>
<rect x="318" y="374" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="340" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">다음으로 이어짐</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">서브체인의 ACCEPT 는 그 체인의 판정일 뿐 — 부모 체인이 이어서 평가한다</title><desc id="dd">왼쪽 레인이 부모 체인, 오른쪽이 서브체인이다. 아래로 갈수록 시간이 흐른다. 주황 화살표가 이 도식의 요점이고, 그 화살표가 있기 때문에 뒤의 DROP 이 성립한다.</desc>
<rect width="1000" height="760" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SUBCHAIN ACCEPT · AN OPINION, NOT A VERDICT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서브체인의 ACCEPT 는 그 체인의 판정일 뿐 — 부모 체인이 이어서 평가한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">아래로 갈수록 시간 · 주황 화살표(복귀)가 있어서 서브체인의 ACCEPT 가 최종이 아니다</text>
<rect x="118" y="112" width="300" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="268" y="132" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">INPUT</text>
<text x="268" y="149" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부모 · 빌트인 체인</text>
<rect x="582" y="112" width="300" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="732" y="132" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">incoming-ssh</text>
<text x="732" y="149" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서브 · 사용자 정의 체인</text>
<line x1="268" y1="162" x2="268" y2="512" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="732" y1="162" x2="732" y2="512" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 280 216 L 718 216" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="500" y="206" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">-j incoming-ssh</text>
<text x="500" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">22 번 포트 조건에 맞아 서브체인으로 점프</text>
<path d="M 720 270 L 668 270 L 668 298 L 718 298" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="656" y="276" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">-s 10.0.0.1 -j ACCEPT</text>
<text x="656" y="296" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 체인의 판정이 나왔다</text>
<path d="M 720 352 L 282 352" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="500" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">복귀</text>
<text x="500" y="370" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패킷의 운명은 아직 정해지지 않았다</text>
<path d="M 280 406 L 332 406 L 332 434 L 282 434" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="344" y="412" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">다음 규칙 계속</text>
<text x="344" y="432" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ACCEPT 뒤에도 부모의 평가는 이어진다</text>
<path d="M 280 474 L 332 474 L 332 502 L 282 502" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="344" y="480" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">-j DROP</text>
<text x="344" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기서 패킷이 끝난다</text>
<text x="36" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">서브체인이 낸 판정</text>
<text x="352" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">그 다음에 벌어지는 일</text>
<rect x="36" y="568" width="300" height="56" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="186" y="602" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">ACCEPT · RETURN</text>
<rect x="352" y="568" width="596" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="372" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">부모 체인으로 복귀 — 뒤 규칙이 그 패킷을 DROP 할 수 있다</text>
<rect x="36" y="636" width="300" height="56" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="186" y="670" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">DROP · REJECT</text>
<rect x="352" y="636" width="596" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="372" y="670" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">복귀가 없다 — 패킷이 그 자리에서 사라진다</text>
<line x1="12" y1="716" x2="952" y2="716" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="738" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="728" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="738" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">복귀 — 아직 안 끝났다</text>
<rect x="313" y="728" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="335" y="738" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">체인의 의견</text>
<rect x="435" y="728" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="457" y="738" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패킷의 끝</text>
</svg>
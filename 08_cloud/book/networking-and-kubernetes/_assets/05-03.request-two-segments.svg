<title id="dt">요청 하나가 성격이 다른 두 구간을 지납니다</title><desc id="dd">밖에서 들어오는 구간은 주소를 바꾸고, 컨트롤러에서 백엔드로 가는 구간은 연결을 새로 연다. 아래 띠는 리액트 앱의 정적 파일과 실행이 서로 다른 자리에 있다는 것을 가른다.</desc>
<rect width="1000" height="736" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">REQUEST PATH · TWO SEGMENTS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">요청 하나가 성격이 다른 두 구간을 지납니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주소를 바꾸는 것과 연결을 새로 여는 것은 다른 장치입니다</text>
<rect x="24.0" y="132" width="212" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="130.0" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">브라우저</text>
<text x="130.0" y="169" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클러스터 밖</text>
<rect x="262.66666666666663" y="132" width="212" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="368.66666666666663" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클러스터 입구</text>
<text x="368.66666666666663" y="169" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">LoadBalancer 나 NodePort</text>
<rect x="501.33333333333326" y="132" width="212" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="607.3333333333333" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Ingress 컨트롤러</text>
<text x="607.3333333333333" y="169" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프록시 Pod</text>
<rect x="740.0" y="132" width="212" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="846.0" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">백엔드 Pod</text>
<text x="846.0" y="169" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앱이 도는 자리</text>
<line x1="130.0" y1="180" x2="130.0" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 4"/>
<line x1="368.66666666666663" y1="180" x2="368.66666666666663" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 4"/>
<line x1="607.3333333333333" y1="180" x2="607.3333333333333" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 4"/>
<line x1="846.0" y1="180" x2="846.0" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 4"/>
<line x1="249.33333333333331" y1="118" x2="249.33333333333331" y2="198" stroke="#5E6B7E" stroke-width="1.2" stroke-dasharray="8 6"/>
<line x1="249.33333333333331" y1="260" x2="249.33333333333331" y2="420" stroke="#5E6B7E" stroke-width="1.2" stroke-dasharray="8 6"/>
<text x="237.33333333333331" y="112" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">클러스터 밖</text>
<text x="261.3333333333333" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">클러스터 안</text>
<path d="M 138.0 228 L 356.66666666666663 228" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="249.33333333333331" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">GET /</text>
<text x="249.33333333333331" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클러스터 밖에서 들어옵니다</text>
<path d="M 376.66666666666663 284 L 595.3333333333333 284" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<text x="487.99999999999994" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">DNAT</text>
<text x="487.99999999999994" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">목적지를 컨트롤러 Pod 로</text>
<path d="M 615.3333333333333 340 L 834.0 340" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="726.6666666666666" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">새 연결을 엽니다</text>
<text x="726.6666666666666" y="358" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">NAT 이 아니라 연결이 둘입니다</text>
<path d="M 838.0 396 L 619.3333333333333 396" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="726.6666666666666" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">응답</text>
<text x="726.6666666666666" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">백엔드가 본 출발지는 컨트롤러 Pod</text>
<text x="32" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Cluster 정책이면 첫 구간에서 출발지까지 노드 IP 로 바뀝니다.</text>
<text x="32" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원 클라이언트 IP 는 IP 헤더에 남지 않으므로, 프록시가 X-Forwarded-For 같은 곳에 따로 적어 넣어야 살아남습니다.</text>
<line x1="24" y1="486" x2="976" y2="486" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="32" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">리액트 앱은 어디에서 도는가</text>
<rect x="32" y="528" width="440" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="52" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클러스터가 주는 것</text>
<text x="52" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">index.html 과 번들 JS — 정적 파일입니다</text>
<rect x="528" y="528" width="440" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="548" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">브라우저가 하는 것</text>
<text x="548" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 JS 의 실행 — API 호출도 여기서 출발합니다</text>
<path d="M 478 566 L 522 566" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="32" y="634" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">그래서 리액트가 부르는 API 는 클러스터 안에서 나가는 요청이 아니라 맨 윗줄로 다시 들어오는 요청입니다.</text>
<text x="32" y="656" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버가 대신 부르는 구성(SSR·BFF)일 때만 Pod 가 직접 부르고, 그때는 Pod 사이 통신입니다. ClusterIP 를 거치면 그 한 걸음에 DNAT 이 붙습니다.</text>
<line x1="12" y1="684" x2="952" y2="684" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="706" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="696" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="706" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">연결을 새로 여는 구간</text>
<rect x="300" y="696" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="322" y="706" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">주소를 바꾸는 구간</text>
<rect x="474" y="696" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="496" y="706" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">브라우저에서 도는 것</text>
<rect x="661" y="696" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="683" y="706" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 밖의 걸음</text>
</svg>
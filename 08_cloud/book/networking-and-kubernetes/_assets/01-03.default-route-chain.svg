<text x="480" y="398" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">0.0.0.0/0</text>
<text x="620" y="398" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">-&gt; ISP 쪽 문</text>
<text x="924" y="398" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">여기 걸린다</text>
<rect x="660" y="454" width="200" height="92" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1" stroke-dasharray="6 5"/>
<text x="760" y="484" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">집 안 기기</text>
<text x="760" y="504" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">10.0.0.x 라면</text>
<text x="760" y="526" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">여기서 끝난다</text>
<path d="M 862 356 L 862 444" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)" stroke-dasharray="5 5"/>
<path d="M 492 416 L 492 500 L 302 500" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>

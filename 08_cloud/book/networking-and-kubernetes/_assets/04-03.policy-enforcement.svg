<title id="dt">커널은 라벨을 모른다. 그 사이를 CNI 가 번역한다</title><desc id="dd">정책은 라벨로 쓰지만 집행은 L3·L4 에서 이뤄지므로, Calico 는 라벨을 IP 집합으로 Cilium 은 숫자 identity 로 번역해 커널에 내려보낸다.</desc>
<rect width="1000" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NETWORKPOLICY · FROM LABELS TO KERNEL RULES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널은 라벨을 모른다. 그 사이를 CNI 가 번역한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">선언은 라벨 · 집행은 주소와 포트 · 그 사이가 번역 계층</text>
<rect x="56" y="104" width="888" height="88" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="76" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">DECLARE</text>
<text x="76" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">NetworkPolicy</text>
<text x="76" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">사람이 쓰는 라벨</text>
<text x="304" y="144" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">podSelector: app=payment</text>
<text x="616" y="144" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">from: app=gateway</text>
<text x="304" y="168" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">ports: 8080/TCP</text>
<rect x="56" y="216" width="888" height="176" rx="8" fill="#F08A590F" stroke="#F08A59" stroke-width="1.4"/>
<text x="76" y="240" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">TRANSLATE</text>
<text x="76" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">CNI 에이전트</text>
<text x="76" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">API 서버 watch</text>
<text x="76" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">라벨 → 현재 Pod 목록</text>
<rect x="304" y="232" width="296" height="144" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.1"/>
<text x="320" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">Calico · 라벨 → IP 집합</text>
<text x="320" y="290" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">ipset 커널 자료구조</text>
<text x="320" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">-m set --match-set gateway src</text>
<text x="320" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Pod 변동 시 멤버만 교체</text>
<rect x="616" y="232" width="296" height="144" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.1"/>
<text x="632" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">Cilium · 라벨 → 숫자 identity</text>
<text x="632" y="290" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">eBPF 정책 맵 조회</text>
<text x="632" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">app=gateway → identity 4211</text>
<text x="632" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">노드별 IP 목록 동기화 불필요</text>
<rect x="56" y="416" width="888" height="72" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="76" y="440" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">ENFORCE</text>
<text x="76" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">커널</text>
<text x="304" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">주소 · 포트 · 프로토콜</text>
<text x="920" y="460" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">라벨 모름</text>
<path d="M 224 196 L 224 208" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 224 396 L 224 408" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="12" y1="504" x2="952" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="526" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="516" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">라벨로 말하는 층</text>
<rect x="261" y="516" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="283" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">번역하는 층</text>
<rect x="383" y="516" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="405" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">라벨을 모르는 집행 층</text>
</svg>
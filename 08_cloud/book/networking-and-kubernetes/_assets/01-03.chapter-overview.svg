<title id="dt">IP 라우팅과 Ethernet 전체 지도 — 전제 하나가 나머지를 감싼다</title><desc id="dd">IP 가 도착을 보장하지 않기 때문에 안쪽 셋이 필요해진다. 각 칸의 꼬리표가 그 대목을 다루는 절이다.</desc>
<rect width="1000" height="492" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">01-03 · CHAPTER MAP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">IP 라우팅과 Ethernet 전체 지도 — 전제 하나가 나머지를 감싼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">IP 가 도착을 보장하지 않기 때문에 안쪽 셋이 필요해진다 · 꼬리표가 그 대목을 다루는 절</text>
<rect x="40" y="116" width="920" height="300" rx="8" fill="#F08A5908" stroke="#F08A59" stroke-width="1.4"/>
<rect x="64" y="107" width="217" height="18" fill="#0D1117"/>
<text x="74" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">§1 전제 — IP 는 도착을 보장하지 않는다</text>
<rect x="102" y="178" width="228" height="116" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="216" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">주소</text>
<text x="216" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CIDR · NAT · IPv6</text>
<text x="216" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">§2 어디로 보낼까</text>
<rect x="386" y="178" width="228" height="116" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="500" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">길 찾기</text>
<text x="500" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">BGP 로 망 사이</text>
<text x="500" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">§3 어느 망으로</text>
<rect x="670" y="178" width="228" height="116" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="784" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">옆 이웃</text>
<text x="784" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">ARP 로 MAC 을</text>
<text x="784" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">§4 어느 기계로</text>
<path d="M 338 236 L 376 236" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="358" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">망 단위</text>
<path d="M 622 236 L 660 236" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="642" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기계 단위</text>
<rect x="102" y="324" width="796" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="500" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">§5 한 요청 — 감싸고 벗긴다</text>
<text x="500" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">앞의 셋이 요청 하나 안에서 순서대로 일어난다</text>
<path d="M 216 300 L 216 314" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 500 300 L 500 314" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 784 300 L 784 314" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<line x1="24" y1="440" x2="952" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="462" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">READING ORDER</text>
<text x="140" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전제(§1) → 주소(§2) → 길 찾기(§3) → 옆 이웃(§4) → 한 요청(§5)</text>
</svg>
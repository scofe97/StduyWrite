<title id="dt">모드 다섯은 백엔드를 무엇으로 찾느냐로 갈린다</title><desc id="dd">userspace 는 제거됐고 iptables 가 기본이며 IPVS 는 해시, nftables 는 1.33 GA 후계, kernelspace 는 Windows 전용이다.</desc>

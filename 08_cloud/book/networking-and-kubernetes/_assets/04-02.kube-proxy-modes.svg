<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">모드 다섯은 백엔드를 무엇으로 찾느냐로 갈린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">책은 넷 · 전부 iptables 의존이라 적었지만, 지금은 다섯이고 둘은 iptables 미사용</text>

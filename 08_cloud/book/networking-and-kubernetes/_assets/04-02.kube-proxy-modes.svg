<title id="dt">모드는 백엔드를 무엇으로 찾느냐로 갈린다</title><desc id="dd">Linux 모드는 iptables·ipvs·nftables 셋이고 iptables 가 기본이다. ipvs 는 폐기 예정이고 nftables 는 1.33 에서 GA 가 됐으며 kernelspace 는 Windows 전용이다.</desc>
<rect width="1000" height="544" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBE-PROXY · MODES IN 1.37 · HOW EACH ONE LOOKS UP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">모드는 백엔드를 무엇으로 찾느냐로 갈린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Linux 는 셋, Windows 는 하나 · ipvs 는 폐기 예정</text>

<title id="dt">커널이 패킷을 판정하는 층 개념 지도 — 이 편은 점선 안을 다룬다</title><desc id="dd">위는 유저 공간, 아래는 물리 네트워크. 커널이 맡는 네 갈래 중 아래 두 칸이 이 편이고 위 두 칸은 02-01 이다. 시간순이 아니라 주제 배치이며, 시간순은 3절 끝의 관통 도식이 맡는다.</desc>
<rect width="1000" height="896" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">02-02 · CHAPTER MAP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널이 패킷을 판정하는 층 개념 지도 — 이 편은 점선 안을 다룬다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주제 배치도 · 패킷이 지나는 시간순이 아니다</text>
<rect x="24" y="104" width="952" height="720" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">부르는 쪽과 물리 네트워크 사이 · 커널이 하는 일</text>
<rect x="156" y="456" width="688" height="244" rx="8" fill="#F08A590A" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="7 6"/>
<rect x="180" y="447" width="175" height="18" fill="#0D1117"/>
<text x="190" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">이 편 — 훅 · 연결 추적 · 라우팅</text>
<rect x="180" y="144" width="640" height="72" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1" stroke-dasharray="6 5"/>
<text x="200" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">애플리케이션</text>

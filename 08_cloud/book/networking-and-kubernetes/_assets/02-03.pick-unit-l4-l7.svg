<title id="dt">백엔드를 고를 기회가 몇 번인가</title><desc id="dd">L4 는 연결이 맺어질 때 5-tuple 로 한 번만 백엔드를 고르므로 그 연결 위의 요청은 전부 같은 Pod 로 가고, L7 은 요청마다 고르므로 같은 연결 위 요청들이 서로 다른 곳으로 갈린다. L7 이 하는 일은 같은 풀에 요청을 나누는 것과 경로로 서비스를 고르는 것 둘로 갈린다.</desc>

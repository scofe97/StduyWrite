<line x1="206" y1="360" x2="242" y2="360" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<line x1="398" y1="360" x2="434" y2="360" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<rect x="792" y="232" width="168" height="64" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="876" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">노드 eth0</text>
<text x="876" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">다른 노드 행</text>
<path d="M 726 264 L 782 264" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="756" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">L3 라우팅</text>
<line x1="12" y1="440" x2="952" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="462" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

<title id="dt">브리지는 FDB 에서 목적지 MAC 의 포트를 찾아 그쪽으로만 넘긴다</title><desc id="dd">왼쪽에 Pod 셋과 각 veth 쌍의 호스트 쪽 끝이 있고, 호스트 쪽 끝만 cni0 브리지의 포트로 물린다. Pod A 가 Pod B 의 MAC 으로 보낸 프레임은 veth-a 로 들어와 FDB 조회로 veth-b 를 찾아 그 포트로만 나간다. 모르는 MAC 은 모든 포트로 flooding 하고, 다른 노드로 가는 패킷은 브리지 주소를 게이트웨이로 삼아 L3 라우팅으로 노드 eth0 에 간다.</desc>
<rect width="1000" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX BRIDGE · FDB</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">브리지는 FDB 에서 목적지 MAC 의 포트를 찾아 그쪽으로만 넘긴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Pod A → Pod B · 배운 MAC 은 그 포트로만, 모르는 MAC 은 모든 포트로</text>
<rect x="40" y="136" width="160" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="120" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Pod A</text>
<text x="120" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">aa:…:a5</text>
<rect x="248" y="136" width="144" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="320" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">veth-a</text>
<text x="320" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">브리지 포트</text>
<rect x="40" y="232" width="160" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="120" y="260" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Pod B</text>
<text x="120" y="280" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">bb:…:b6</text>
<rect x="248" y="232" width="144" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="320" y="260" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">veth-b</text>
<text x="320" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">브리지 포트</text>
<rect x="40" y="328" width="160" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="120" y="356" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Pod C</text>
<text x="120" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">cc:…:c7</text>
<rect x="248" y="328" width="144" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="320" y="356" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">veth-c</text>
<text x="320" y="376" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">브리지 포트</text>
<rect x="440" y="120" width="280" height="272" rx="8" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="580" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">cni0 브리지</text>
<text x="580" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">struct net_bridge · 10.244.1.1</text>
<text x="580" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">FDB · MAC → 포트</text>
<rect x="460" y="212" width="240" height="32" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="580" y="233" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">aa:…:a5 → veth-a</text>
<rect x="460" y="252" width="240" height="32" rx="5" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="580" y="273" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">bb:…:b6 → veth-b</text>
<rect x="460" y="292" width="240" height="32" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="580" y="313" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">cc:…:c7 → veth-c</text>
<text x="580" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">모르는 MAC · 모든 포트로 flooding</text>

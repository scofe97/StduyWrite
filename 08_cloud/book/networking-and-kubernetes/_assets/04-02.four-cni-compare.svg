<title id="dt">4대 CNI 는 첫 관문에서 갈린다</title><desc id="dd">NetworkPolicy 를 강제할 수 있는가가 첫 기준이고, 그다음 배선 방식이 캡슐화냐 라우팅 광고냐 커널 프로그램이냐로 갈린다.</desc>

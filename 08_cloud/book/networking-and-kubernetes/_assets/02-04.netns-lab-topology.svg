<title id="dt">실습으로 지은 배선 — 네임스페이스 둘을 브리지 하나로 잇는다</title><desc id="dd">네트워크 네임스페이스 둘에 veth 쌍의 안쪽 끝을 하나씩 넣고, 바깥쪽 끝 둘을 브리지에 물린다. veth 의 두 끝은 서로의 인덱스를 가리키며, 안쪽 끝은 기본 네임스페이스에서 보이지 않는다.</desc>

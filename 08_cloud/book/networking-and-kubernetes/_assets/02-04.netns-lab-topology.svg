<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">veth 쌍이 경계를 가로지르고, 브리지가 바깥쪽 끝들을 한 스위치에 모은다</text>

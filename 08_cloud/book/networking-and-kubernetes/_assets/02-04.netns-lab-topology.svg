<text x="36" y="592" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">브리지에 물리는 것은 바깥쪽 끝 하나뿐이라 bridge link 에 두 줄만 나온다. 안쪽 끝은 경계 안에 남아 기본 네임스페이스의 ip link 에 보이지 않는다.</text>

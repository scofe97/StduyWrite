<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">스케줄러가 하는 일은 nodeName 한 줄 · 네트워크를 만드는 일은 런타임이 CNI 를 불러서</text>

<title id="dt">스케줄러는 이름만 적고, 네트워크는 런타임이 CNI 를 불러 만든다</title><desc id="dd">스케줄러가 하는 일은 nodeName 한 줄을 적는 것뿐이다. 그 노드의 kubelet 이 CRI 로 샌드박스를 요청하면 컨테이너 런타임이 CNI 플러그인을 불러 네트워크를 만든 뒤 컨테이너를 시작한다.</desc>

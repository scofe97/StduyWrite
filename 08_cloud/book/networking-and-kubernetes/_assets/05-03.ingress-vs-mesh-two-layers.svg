<title id="dt">트래픽 방향이 다른 두 L7 인프라</title><desc id="dd">Ingress 는 밖에서 안으로 들어오는 길을 맡고, 메시는 안쪽끼리 오가는 길을 사이드카가 맡는다.</desc>
<rect width="1000" height="604" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TWO L7 LAYERS · DIFFERENT DIRECTIONS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">트래픽 방향이 다른 두 L7 인프라</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Ingress 는 밖→안, 메시는 안↔안 — 색이 곧 방향이다</text>
<rect x="24" y="104" width="952" height="436" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">방향 둘 · 밖 → 안 · 안 ↔ 안</text>
<rect x="232" y="200" width="728" height="340" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="248" y="191" width="273" height="18" fill="#0D1117"/>
<text x="258" y="204" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">Kubernetes 클러스터 · 안쪽 통신은 사이드카 담당</text>
<rect x="28" y="246" width="160" height="108" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="108" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">외부 클라이언트</text>
<text x="108" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">HTTP(S) 요청</text>
<text x="108" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">클러스터 밖</text>

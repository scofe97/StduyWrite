<title id="dt">훅마다 패킷의 어느 필드가 바뀌는가 — DNAT 가 라우팅보다 먼저인 이유</title><desc id="dd">라우팅 이전에는 목적지를 바꿀 수 있고, 이후에는 출발지만 바뀐다. 같은 필드를 세로로 맞춰 보면 어디서 바뀌는지 드러난다.</desc>
<rect width="1000" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NETFILTER HOOKS · WHICH FIELD CHANGES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">훅마다 패킷의 어느 필드가 바뀌는가 — DNAT 가 라우팅보다 먼저인 이유</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">라우팅 이전에는 목적지를 바꿀 수 있고, 이후에는 출발지만 바뀐다</text>
<rect x="24" y="104" width="952" height="464" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">라우팅이 가운데 서 있어서 앞뒤로 바꿀 수 있는 필드가 갈린다</text>
<text x="36" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">장면 — 클러스터 밖 클라이언트가 노드의 NodePort 30080 으로 보낸다. DNAT 뒤 목적지가 Pod IP 라 이 노드는 중계한다</text>
<rect x="92" y="186" width="302" height="296" rx="8" fill="#F08A5908" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="108" y="177" width="200" height="18" fill="#0D1117"/>
<text x="118" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">라우팅 이전 — 목적지를 바꿀 수 있다</text>
<rect x="530" y="186" width="456" height="296" rx="8" fill="#6A95D808" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="546" y="177" width="171" height="18" fill="#0D1117"/>
<text x="556" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">라우팅 이후 — 출발지만 바뀐다</text>
<rect x="96" y="204" width="138" height="92" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="165" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">요청 도착</text>
<text x="165" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">밖에서 들어왔다</text>

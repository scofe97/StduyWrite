<title id="dt">확률은 새 연결에만 걸린다</title><desc id="dd">기존 연결은 확률 규칙을 다시 지나지 않으므로 살아남은 Pod 에 그대로 남고, 끊겨서 재수립된 연결만 규칙을 지나 나뉘기 때문에 롤링 업데이트 뒤 트래픽이 한쪽으로 쏠린다.</desc>
<rect width="1000" height="552" fill="#0D1117"/>

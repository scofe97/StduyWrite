<title id="dt">프리픽스 숫자가 커질수록 범위는 좁아진다</title><desc id="dd">프리픽스 넷의 주소 범위를 막대 길이로 비교한 도식. 막대는 대소 관계만 나르고 실제 개수는 글자로 적었다.</desc>
<rect width="1000" height="452" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SPAN · PREFIX RANGE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프리픽스 숫자가 커질수록 범위는 좁아진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">막대 길이가 곧 그 프리픽스가 담는 주소 범위입니다. /24 가 이 편에서 쓰는 기준입니다.</text>
<rect x="128" y="152" width="700" height="28" rx="4" fill="#8B98A93A"/>
<text x="60" y="174" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">/8</text>
<text x="844" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">16,777,216 개</text>
<rect x="128" y="212" width="440" height="28" rx="4" fill="#8B98A93A"/>
<text x="60" y="234" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">/16</text>
<text x="584" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">65,536 개</text>
<rect x="128" y="272" width="220" height="28" rx="4" fill="#F08A592E" stroke="#F08A59" stroke-width="1.2"/>
<text x="60" y="294" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">/24</text>
<text x="364" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">256 개</text>
<rect x="128" y="332" width="56" height="28" rx="4" fill="#8B98A93A"/>
<text x="60" y="354" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">/32</text>
<text x="200" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">1 개</text>
<text x="12" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">앞 24 비트가 네트워크부라는 뜻이고, 남은 8 비트가 그 동네의 주소 수를 정합니다.</text>
<line x1="12" y1="412" x2="952" y2="412" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="434" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="424" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="122" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">대소 비교용 막대</text>
<rect x="261" y="424" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="283" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 편의 기준</text>
</svg>
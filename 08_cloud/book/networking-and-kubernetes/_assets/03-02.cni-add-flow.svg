<title id="dt">CNI 플러그인을 실행하는 쪽은 컨테이너 런타임이다</title><desc id="dd">kubelet 이 CRI 로 Pod 샌드박스를 요청하면 컨테이너 런타임이 네트워크 네임스페이스를 만들고 CNI 설정을 읽어 플러그인 실행 파일을 ADD 로 실행한다. 플러그인은 그 네임스페이스에 인터페이스를 만들고 주소와 경로를 넣은 뒤 결과를 표준 출력으로 돌려준다.</desc>
<rect width="1000" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CNI ADD · WHO CALLS WHOM</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">CNI 플러그인을 실행하는 쪽은 컨테이너 런타임이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">kubelet 은 CRI 까지만 말합니다 · 플러그인은 떠 있는 서버가 아니라 그때마다 실행되는 파일입니다</text>

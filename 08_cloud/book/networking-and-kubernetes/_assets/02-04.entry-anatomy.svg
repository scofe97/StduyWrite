<text x="36" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">NAT 를 걸면 오른쪽 가지만 달라집니다. 왼쪽 원본 방향은 패킷이 도착했을 때의 값 그대로 남아, 응답을 되돌릴 때 복원표로 쓰입니다.</text>

<title id="dt">한 줄에 튜플이 둘 — 어디까지가 원본이고 어디부터가 응답인가</title><desc id="dd">conntrack -L 의 한 줄은 프로토콜과 수명, 원본 방향 튜플, 응답 방향 튜플로 나뉩니다. src= 가 두 번 나오는 것이 그 경계이며, NAT 를 걸면 두 번째 튜플만 달라집니다.</desc>
<rect width="1000" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONNTRACK ENTRY · ANATOMY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 줄에 튜플이 둘 — 어디까지가 원본이고 어디부터가 응답인가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">src= 가 두 번 나오는 자리가 두 튜플의 경계다</text>

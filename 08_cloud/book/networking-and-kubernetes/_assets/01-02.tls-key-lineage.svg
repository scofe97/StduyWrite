<title id="dt">세션 키의 계보 — 키는 만들어진 자리를 떠나지 않는다</title><desc id="dd">TLS 1.2 세션 키의 계보. client random·server random·premaster secret 세 재료가 master secret 하나로 합쳐지고 거기서 세션 키가 나온다. 위 세 재료는 망을 건너지만 master secret과 세션 키에는 화살표가 들어오기만 하고 나가지 않는다.</desc>
<rect width="980" height="558" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KEY LINEAGE · 01-02 TLS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세션 키의 계보 — 키는 만들어진 자리를 떠나지 않는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표가 들어오기만 하고 나가지 않는 칸이 곧 망을 건너지 않는 값입니다.</text>
<text x="12" y="102" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">재료 셋 — 망을 건넌다</text>
<rect x="12" y="118" width="286" height="96" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="155.0" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">client random</text>
<text x="155.0" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">클라이언트 난수</text>
<text x="155.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평문으로 그냥 건넜다</text>
<rect x="248.0" y="123" width="36.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="266" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">노출</text>
<path d="M 155.0 216 L 155.0 248 L 332.0 248 L 332.0 275" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<rect x="316" y="118" width="286" height="96" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="459.0" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">server random</text>
<text x="459.0" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">서버 난수</text>
<text x="459.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평문으로 그냥 건넜다</text>
<rect x="552.0" y="123" width="36.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="570" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">노출</text>
<path d="M 459.0 216 L 459.0 248 L 472.0 248 L 472.0 275" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<rect x="620" y="118" width="286" height="96" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="763.0" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">premaster secret</text>
<text x="763.0" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">클라이언트가 생성</text>
<text x="763.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공개키로 봉해져 건넜다</text>
<rect x="856.0" y="123" width="36.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="874" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">봉인</text>
<path d="M 763.0 216 L 763.0 248 L 612.0 248 L 612.0 275" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<rect x="192.0" y="278" width="560" height="76" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.5"/>
<text x="472.0" y="310" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#3FB98C">master secret</text>
<text x="472.0" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">셋이 합쳐진 값 — 양쪽이 각자 계산한다</text>
<rect x="665.5" y="282" width="69.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="700.0" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">안 건넌다</text>
<path d="M 472.0 356 L 472.0 409" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)"/>
<rect x="242.0" y="412" width="460" height="76" rx="6" fill="#F08A5916" stroke="#F08A59" stroke-width="1.7"/>
<text x="472.0" y="444" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F08A59">session key</text>
<text x="472.0" y="466" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">실제 암·복호에 쓰는 키</text>
<rect x="615.5" y="416" width="69.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="650.0" y="430" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">안 건넌다</text>
<text x="926" y="320.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">도청자가 위 셋을 다 주워도</text>
<text x="926" y="336.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">봉인 하나를 못 열면 여기 못 온다</text>
<line x1="12" y1="514" x2="932" y2="514" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="536" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="526" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="536" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평문으로 건넘</text>
<rect x="235" y="526" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="257" y="536" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공개키로 봉해져 건넘</text>
<rect x="422" y="526" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="444" y="536" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">망을 건너지 않음</text>
</svg>
<title id="dt">TCP 헤더는 32비트 줄을 쌓아 만든다</title><desc id="dd">TCP 세그먼트 헤더를 32비트 폭의 격자로 그린 배치도. 고정 다섯 줄에 포트·시퀀스 번호·확인 번호·Data offset·플래그·윈도우·체크섬이 들어가고, 그 아래 옵션은 가변이라 헤더 길이가 변한다. 아홉 비트가 나란히 붙은 플래그 칸을 초점으로 강조했다.</desc>
<rect width="1000" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LAYER STACK · 01-02 TCP HEADER</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TCP 헤더는 32비트 줄을 쌓아 만든다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">한 줄이 32비트입니다. 칸 너비가 곧 필드 크기입니다.</text>
<line x1="100" y1="128" x2="900" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="100" y="148" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">0</text>
<text x="300" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">8</text>
<text x="500" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">16</text>
<text x="700" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">24</text>
<text x="900" y="148" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">31</text>
<rect x="100" y="160" width="400" height="48" rx="0" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="300" y="181" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">Source port</text>
<text x="300" y="199" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">16 bit</text>
<rect x="500" y="160" width="400" height="48" rx="0" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="700" y="181" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">Destination port</text>
<text x="700" y="199" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">16 bit</text>
<text x="916" y="189" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<rect x="100" y="208" width="800" height="48" rx="0" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="500" y="229" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">Sequence number</text>
<text x="500" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">32 bit · 바이트 순번</text>
<text x="916" y="237" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">2</text>
<rect x="100" y="256" width="800" height="48" rx="0" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="500" y="277" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">Acknowledgment number</text>
<text x="500" y="295" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">32 bit · 다음에 기대하는 번호</text>
<text x="916" y="285" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">3</text>
<rect x="100" y="304" width="100" height="48" rx="0" fill="#E3B34112" stroke="#E3B341" stroke-width="1.0"/>
<text x="150" y="325" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">Data offset</text>
<text x="150" y="343" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">4 bit</text>
<rect x="200" y="304" width="75" height="48" rx="0" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="237" y="325" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">Reserved</text>
<text x="237" y="343" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">3 bit</text>
<rect x="275" y="304" width="225" height="48" rx="0" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="387" y="325" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">Flags</text>
<text x="387" y="343" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">9 bit · SYN ACK FIN RST …</text>
<rect x="500" y="304" width="400" height="48" rx="0" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="700" y="325" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">Window size</text>
<text x="700" y="343" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">16 bit · 흐름 제어</text>
<text x="916" y="333" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">4</text>
<rect x="100" y="352" width="400" height="48" rx="0" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="300" y="373" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">Checksum</text>
<text x="300" y="391" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">16 bit</text>
<rect x="500" y="352" width="400" height="48" rx="0" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="700" y="373" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">Urgent pointer</text>
<text x="700" y="391" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">16 bit</text>
<text x="916" y="381" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">5</text>
<rect x="100" y="400" width="800" height="40" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="5 4"/>
<text x="500" y="425" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Options · Padding — 가변 길이</text>
<line x1="12" y1="460" x2="952" y2="460" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="482" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="472" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바이트 번호</text>
<rect x="222" y="472" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="244" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">헤더 길이 칸</text>
<rect x="357" y="472" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>

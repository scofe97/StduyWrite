<title id="dt">소켓 syscall — 애플리케이션이 부르면 커널이 무엇을 만드는가</title><desc id="dd">가로는 부르는 순서, 세로는 그 호출이 커널에 남기는 것. 네 번의 호출이 네 가지를 만든다.</desc>
<rect width="1000" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SOCKET SYSCALLS · CALL vs WHAT IT CREATES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">소켓 syscall — 애플리케이션이 부르면 커널이 무엇을 만드는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로는 부르는 순서 · 세로는 그 호출이 커널에 남기는 것</text>
<rect x="24" y="104" width="952" height="464" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">부르는 쪽은 이름 넷을 알면 되고, 커널이 그 뒤에서 넷을 만든다</text>
<rect x="40" y="200" width="920" height="138" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="56" y="191" width="148" height="18" fill="#0D1117"/>
<text x="66" y="204" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">애플리케이션이 부르는 것</text>
<rect x="40" y="376" width="920" height="138" rx="8" fill="#F08A5906" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="56" y="367" width="104" height="18" fill="#0D1117"/>
<text x="66" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">커널이 만드는 것</text>
<rect x="64" y="226" width="200" height="100" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="164" y="256" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">socket()</text>
<text x="164" y="278" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">AF_INET6 · SOCK_STREAM</text>
<text x="164" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">반환값 3</text>
<rect x="288" y="226" width="200" height="100" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="388" y="256" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">bind()</text>
<text x="388" y="278" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">htons(8080) · [::]</text>
<text x="388" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">반환값 0</text>

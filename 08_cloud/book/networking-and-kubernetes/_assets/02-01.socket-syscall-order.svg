<text x="36" y="536" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">listen() 의 두 번째 인자가 백로그 큐 길이다 — 그 큐가 차면 새 연결이 거절되므로 숫자 하나가 곧 수용량이 된다</text>

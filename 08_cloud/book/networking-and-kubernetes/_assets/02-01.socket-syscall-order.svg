<text x="612" y="256" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">listen()</text>
<text x="612" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">두 번째 인자 128</text>
<text x="612" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">반환값 0</text>
<rect x="736" y="226" width="200" height="100" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="836" y="256" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">accept4()</text>
<text x="836" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">epoll 이 깨운 뒤</text>
<text x="836" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">연결마다 호출</text>
<rect x="64" y="402" width="200" height="100" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>

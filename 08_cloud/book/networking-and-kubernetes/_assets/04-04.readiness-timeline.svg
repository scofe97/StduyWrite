<title id="dt">복귀는 낙하보다 짧습니다</title><desc id="dd">readiness 프로브가 주기 5초, failureThreshold 2, successThreshold 1 일 때 Pod 가 서비스 명단에서 빠지고 돌아오는 시간. 낙하는 5초에서 10초 사이이고 2026-09 에는 8초, 2026-11-08 에는 9.9초였다. 복귀는 성공 한 번으로 뒤집혀 2026-09 에 1초와 4초, 2026-11-08 에 3.3초였다.</desc>

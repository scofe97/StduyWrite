<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
</defs>
<title id="dt">창구를 연 뒤 서버가 도는 순환 — epoll에서 잠들었다 깨어 응답</title><desc id="dd">서버는 epoll_wait에서 잠들어 있다가 accept 큐에 새 연결이 들어오면 커널이 깨우고, accept4로 연결을 꺼내 응답을 쓴 뒤 다시 epoll_wait로 돌아가 다음 손님을 기다린다.</desc>
<rect width="1000" height="400" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">WAIT LOOP · SLEEP → WAKE → ACCEPT → REPLY → SLEEP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">창구를 연 뒤, 서버는 이 순환을 돈다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">잠들어 기다리다 커널이 깨우면 손님을 받고, 응답한 뒤 다시 잠든다</text>

<rect x="360" y="96" width="280" height="60" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500" y="122" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">epoll_wait</text>
<text x="500" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#8B98A9">손님 올 때까지 잠듦 (CPU 안 씀)</text>

<!-- 자기 순환 (손님 없음) -->
<path d="M 640 112 C 700 96, 700 156, 640 140" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="712" y="130" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#5E6B7E">손님 없으면 계속 잠</text>

<path d="M 500 156 L 500 192" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="512" y="178" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#F08A59">커널이 깨움 (accept 큐에 새 연결)</text>

<rect x="360" y="196" width="280" height="60" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">accept4</text>
<text x="500" y="242" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#8B98A9">연결 하나 꺼냄 → 그 연결만의 새 fd</text>

<path d="M 500 256 L 500 292" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="360" y="296" width="280" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="500" y="322" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">write → read</text>
<text x="500" y="342" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#8B98A9">응답을 그 fd 에 씀 → 커널이 패킷으로 내보냄</text>

<!-- 다음 손님으로 돌아가기 -->
<path d="M 360 326 C 220 326, 220 126, 356 126" fill="none" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#acc)"/>
<text x="150" y="230" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#F08A59">다시 잠들어</text>
<text x="150" y="246" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#F08A59">다음 손님 대기</text>

<line x1="12" y1="374" x2="976" y2="374" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="394" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" fill="#5E6B7E">LEGEND</text>
<rect x="90" y="384" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="112" y="394" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#8B98A9">커널이 깨우는·순환하는 흐름</text>
<rect x="320" y="384" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="342" y="394" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#8B98A9">syscall (커널에 건 부탁)</text>
</svg>

<title id="dt">ADD 호출 한 번에 무엇이 넘어가는가</title><desc id="dd">런타임은 Pod 마다 달라지는 값을 환경변수로, 노드에 고정된 망 설정을 stdin JSON 으로 넘기고, 플러그인은 할당한 주소와 경로를 stdout JSON 으로 돌려준다.</desc>
<rect width="1000" height="544" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CNI · WHAT ONE ADD CALL CARRIES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">ADD 호출 한 번에 무엇이 넘어가는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Pod 마다 달라지는 값과 노드에 고정된 값이 서로 다른 통로로 들어간다</text>
<rect x="32" y="104" width="344" height="160" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="52" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">Pod 마다 달라지는 값 · 환경변수</text>
<text x="52" y="164" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">CNI_COMMAND=ADD</text>
<text x="52" y="188" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">CNI_CONTAINERID=6f3a…</text>
<text x="52" y="212" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">CNI_NETNS=/var/run/netns/cni-…</text>
<text x="52" y="236" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">CNI_IFNAME=eth0</text>
<rect x="32" y="288" width="344" height="176" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="52" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">노드에 고정된 값 · stdin JSON</text>
<text x="52" y="346" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">{ "type": "bridge",</text>
<text x="52" y="368" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">  "bridge": "cni0",</text>
<text x="52" y="390" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">  "ipam": { "type": "host-local",</text>
<text x="52" y="412" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">    "subnet": "10.1.3.0/24" } }</text>
<text x="52" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">위치 /etc/cni/net.d/</text>
<rect x="448" y="236" width="200" height="96" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="548" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">플러그인 바이너리</text>
<text x="548" y="290" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">/opt/cni/bin/bridge</text>
<text x="548" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">실행 파일 하나</text>
<rect x="704" y="200" width="264" height="168" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="724" y="228" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">돌려주는 값 · stdout JSON</text>
<text x="724" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">ips:    10.1.3.7/24</text>
<text x="724" y="284" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">routes: 0.0.0.0/0 → 10.1.3.1</text>
<text x="724" y="308" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">dns:    …</text>
<text x="724" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Pod 의 eth0 에 붙는 주소</text>
<path d="M 382 184 L 412 184 L 412 268 L 438 268" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<path d="M 382 376 L 424 376 L 424 300 L 438 300" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 654 284 L 694 284" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<line x1="12" y1="496" x2="952" y2="496" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="518" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="508" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호출마다 바뀌는 입력</text>
<rect x="287" y="508" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="309" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노드에 고정된 입력</text>
<rect x="461" y="508" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="483" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">플러그인이 돌려주는 값</text>
</svg>
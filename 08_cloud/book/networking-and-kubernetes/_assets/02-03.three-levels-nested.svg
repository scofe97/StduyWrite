<title id="dt">훅을 열면 테이블이, 테이블을 열면 규칙이 나온다</title><desc id="dd">실행 축으로 한 겹씩 연 것이다. 바깥 링이 훅(패킷이 어느 자리에 도달했는가), 가운데 링이 그 훅에 등록돼 우선순위 순으로 도는 테이블, 안쪽 링이 그 테이블의 규칙이다. INPUT 훅의 filter 를 끝까지 열었다.</desc>
<rect width="960" height="736" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">IPTABLES · OPENING ONE HOOK</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">훅을 열면 테이블이, 테이블을 열면 규칙이 나온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">구성은 테이블이 체인을 담지만, 실행은 훅이 바깥이다 — 같은 사실을 보는 두 축</text>
<rect x="24" y="136" width="912" height="496" rx="8" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="52" y="172" width="856" height="424" rx="8" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<rect x="80" y="208" width="800" height="352" rx="8" fill="#F08A5908" stroke="#F08A59" stroke-width="1.4"/>
<rect x="48" y="127" width="85" height="18" fill="#0D1117"/>
<text x="58" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">1 훅 · 언제</text>
<rect x="76" y="163" width="111" height="18" fill="#0D1117"/>
<text x="86" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">2 테이블 · 순서</text>
<rect x="104" y="199" width="141" height="18" fill="#0D1117"/>
<text x="114" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">3 규칙 · 조건과 동작</text>
<text x="264" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">PREROUTING</text>
<text x="408" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">INPUT</text>
<text x="552" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">FORWARD</text>
<text x="696" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">OUTPUT</text>
<text x="840" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">POSTROUTING</text>
<text x="264" y="200" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">Raw</text>
<text x="408" y="200" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">Mangle</text>
<text x="552" y="200" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">NAT</text>
<text x="696" y="200" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Filter</text>
<text x="840" y="200" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">Security</text>
<path d="M 452 196 L 500 196" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<path d="M 596 196 L 644 196" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="120" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">매치 — 조건이 맞는가</text>
<text x="464" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">타깃 — 무엇을 하는가</text>
<text x="656" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">그래서 어떻게 되는가</text>
<rect x="104" y="256" width="752" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="120" y="285" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">-m state --state ESTABLISHED</text>
<text x="464" y="285" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">-j ACCEPT</text>
<text x="656" y="285" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">이 테이블 순회 끝</text>
<rect x="104" y="312" width="752" height="48" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="120" y="341" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">-p tcp --dport 22</text>
<text x="464" y="341" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">-j incoming-ssh</text>
<text x="656" y="341" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">판정 없으면 복귀</text>
<rect x="104" y="368" width="752" height="48" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="120" y="397" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">-s 10.0.0.0/8</text>
<text x="464" y="397" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">-j LOG</text>
<text x="656" y="397" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">기록만 · 계속 평가</text>
<rect x="104" y="424" width="752" height="48" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="120" y="453" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">-p tcp --dport 80</text>
<text x="464" y="453" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">-j REJECT</text>
<text x="656" y="453" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">차단 · 사유 회신</text>
<rect x="104" y="480" width="752" height="48" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="120" y="509" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">(아무 규칙에도 안 걸림)</text>
<text x="464" y="509" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">policy DROP</text>
<text x="656" y="509" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">기본 정책으로 차단</text>
<path d="M 92 252 L 92 532" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="76" y="584" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Raw 는 INPUT 훅에 없음(PREROUTING·OUTPUT 뿐) · Security 는 있으나 SELinux 전용이라 보통 빈 체인</text>
<text x="48" y="620" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">나머지 네 훅도 같은 세 겹 · 차이는 등록된 테이블 · 칸마다 별개 체인</text>
<text x="24" y="656" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">위에서 아래로 · 멈추는 범위는 타깃이 정함(LOG 는 계속) · 안 걸리면 기본 정책</text>
<line x1="12" y1="680" x2="912" y2="680" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="702" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="692" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="702" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 테이블 순회 끝</text>
<rect x="274" y="692" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="296" y="702" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">종결 아님 · 계속</text>
<rect x="448" y="692" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="470" y="702" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">차단</text>
<rect x="518" y="692" width="14" height="12" rx="2" fill="#F5F5F322" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="540" y="702" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여는 항목</text>
<rect x="627" y="692" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="649" y="702" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">지금 연 겹</text>
</svg>
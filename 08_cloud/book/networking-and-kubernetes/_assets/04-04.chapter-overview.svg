<title id="dt">여덟 묶음은 노드에서 시작해 노드 밖에서 끝납니다</title><desc id="dd">04-04 의 키워드 개념도. 첫 줄은 CNI 가 없는 노드가 멈추고 Cilium 이 설치되면 주소 대역이 노드 조각으로 내려오는 흐름이다. 둘째 줄은 서비스 하나가 만드는 규칙 11줄과 readiness 를 잃은 Pod 의 줄이 사라지는 흐름이다. 셋째 줄은 정책이 Pod 를 선택해 잠그고 이름 하나가 질의를 불리고 Cilium L7 정책이 응답 서명을 가르는 흐름이다. 넷째 줄은 노드 밖에서 Pod 로 가는 길이다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 04-04 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">여덟 묶음은 노드에서 시작해 노드 밖에서 끝납니다</text>

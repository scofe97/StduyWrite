<title id="dt">Kubernetes 에서는 앱이 말한 주소가 그대로 통한다</title><desc id="dd">Pod IP 는 eth0 에 붙은 진짜 주소이고 CNI 가 노드마다 경로를 깔아 두어, 브로커가 광고한 주소로 클라이언트가 다시 붙는 세 번째 단계도 성공한다.</desc>
<rect width="1000" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES · IP-PER-POD · ALL THREE STEPS SUCCEED</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Kubernetes 에서는 앱이 말한 주소가 그대로 통한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주소를 갈아 끼우는 자리가 없어 1번이 쓴 주소와 2번이 말한 주소가 같다</text>

<title id="dt">같은 노드면 ARP 로 찾고, 다른 노드면 라우팅으로 간다</title><desc id="dd">Pod 의 eth0 에는 MAC 이 있지만 노드 경계를 넘으면 같은 브로드캐스트 도메인이 아니어서 ARP 로 상대를 찾을 수 없고 L3 라우팅에 의존한다.</desc>
<rect width="1000" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">L2 ADJACENCY · WHERE ARP STOPS WORKING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 노드면 ARP 로 찾고, 다른 노드면 라우팅으로 간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">MAC 은 있다 — 없는 것은 노드 사이의 L2 인접성</text>
<rect x="32" y="104" width="456" height="288" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="52" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">같은 노드 안</text>

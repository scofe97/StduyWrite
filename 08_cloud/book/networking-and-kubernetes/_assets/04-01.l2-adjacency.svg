<text x="256" y="218" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">10.1.3.8</text>
<rect x="48" y="256" width="260" height="32" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>

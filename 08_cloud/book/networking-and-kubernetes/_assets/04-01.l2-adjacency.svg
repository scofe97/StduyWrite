<title id="dt">같은 노드여도 ARP 가 상대 Pod 에 닿는지는 CNI 방식이 정한다</title><desc id="dd">bridge 형 CNI 는 같은 노드의 Pod 를 한 브로드캐스트 도메인에 묶고, ptp 형 CNI 는 Pod 가 게이트웨이만 ARP 로 묻게 한다. 노드를 넘으면 어느 쪽이든 ARP 는 멈추고 L3 라우팅이 맡는다.</desc>
<rect width="1000" height="464" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">L2 ADJACENCY · WHERE ARP STOPS WORKING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 노드여도 ARP 가 상대 Pod 에 닿는지는 CNI 방식이 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">MAC 은 어느 Pod 에나 있다 — 갈리는 것은 ARP 가 누구에게 닿느냐</text>
<rect x="24" y="104" width="308" height="272" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="44" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">bridge 형 · 같은 노드 (예시 값)</text>
<rect x="36" y="148" width="284" height="154" rx="6" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="5 5"/>
<text x="48" y="168" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">NODE 1</text>
<rect x="48" y="176" width="104" height="52" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="100" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Pod A</text>
<text x="100" y="218" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">10.1.3.7</text>
<rect x="204" y="176" width="104" height="52" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

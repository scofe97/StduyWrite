<title id="dt">장치마다 바뀌는 필드가 다르고, MASQUERADE 는 한 칸만 더 바꾼다</title><desc id="dd">ns1 에서 옆 노드까지 가는 동안 목적지 MAC 과 TTL 이 각각 다른 자리에서 바뀝니다. 출발지 IP 는 NAT 가 없으면 끝까지 그대로이고, MASQUERADE 를 걸면 POSTROUTING 에서만 바뀝니다.</desc>
<rect width="1000" height="784" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">WHAT CHANGES WHERE · BEFORE / AFTER NAT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">장치마다 바뀌는 필드가 다르고, MASQUERADE 는 한 칸만 더 바꾼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">브리지는 아무것도 안 바꾸고, MASQUERADE 는 POSTROUTING 한 칸만 바꾼다</text>

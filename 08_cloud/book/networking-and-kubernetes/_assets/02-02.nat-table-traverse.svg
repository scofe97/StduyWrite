<title id="dt">한 요청이 nat 을 지나는 자리 — 훅은 둘이고 그 안은 점프로 겹겹이다</title><desc id="dd">위 레인이 라우팅 판단 전의 PREROUTING, 아래가 나가기 직전의 POSTROUTING 이다. 레인 안에서 오른쪽 아래로 내려간 계단이 체인 점프의 깊이이고, 오른쪽 칸이 그 직후의 패킷 상태다.</desc>
<rect width="1000" height="844" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">nat TABLE · TWO HOOKS, ONE JUMP STACK</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 요청이 nat 을 지나는 자리 — 훅은 둘이고 그 안은 점프로 겹겹이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">레인 = 훅 · 계단 = 점프해 들어간 깊이 · 오른쪽 = 그 직후 패킷 상태 (kind 실측)</text>
<rect x="24" y="120" width="952" height="352" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">PREROUTING · nat   —   훅 NF_IP_PRE_ROUTING · 라우팅 판단 전</text>
<rect x="120" y="164" width="380" height="68" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="140" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">KUBE-SERVICES</text>
<text x="140" y="210" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">-d 10.96.192.224/32</text>
<text x="140" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">ClusterIP 에 해당하는 서비스 체인을 고른다</text>
<rect x="200" y="268" width="380" height="68" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="220" y="294" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">KUBE-SVC-LOLE4…</text>
<text x="220" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">! -s 10.244.0.0/16  →  불일치</text>
<text x="220" y="330" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Pod 출발지라 마킹을 건너뛴다 · 이어서 확률 0.33333</text>
<rect x="280" y="372" width="380" height="68" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="300" y="398" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">KUBE-SEP-2MJG…</text>
<text x="300" y="418" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">-j DNAT</text>
<text x="300" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">여기서 목적지가 실제로 바뀐다</text>
<path d="M 164 232 L 164 248 L 244 248 L 244 264" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="190.18" y="238" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="204" y="252" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">-j</text>
<path d="M 244 336 L 244 352 L 324 352 L 324 368" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="270.18" y="342" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="284" y="356" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">-j</text>
<rect x="692" y="168" width="276" height="60" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="710" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">헤더는 그대로</text>
<text x="710" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">체인만 갈아탄다</text>
<rect x="692" y="272" width="276" height="60" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="710" y="296" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">마크가 안 붙는다</text>
<text x="710" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">mark 0x0 유지</text>
<rect x="692" y="376" width="276" height="60" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="710" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">목적지가 바뀐다</text>
<text x="710" y="422" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">dst → 10.244.1.66:8080</text>
<path d="M 324 440 L 324 492 L 500 492 L 500 508" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<rect x="24" y="514" width="952" height="52" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="44" y="536" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">라우팅 판단</text>
<text x="44" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바뀐 목적지로 경로를 다시 정한다 — 여기부터는 다른 훅이다</text>
<text x="956" y="536" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">두 훅을 잇는 것은 mark 0x4000 하나뿐</text>
<text x="956" y="554" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 예에서는 붙지 않았다</text>
<path d="M 500 566 L 500 588" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<rect x="24" y="588" width="952" height="172" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="608" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">POSTROUTING · nat   —   훅 NF_IP_POST_ROUTING · 인터페이스로 나가기 직전</text>
<rect x="120" y="630" width="300" height="68" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="140" y="656" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">KUBE-POSTROUTING</text>
<text x="140" y="676" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">! --mark 0x4000 검사</text>
<text x="140" y="692" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">마크가 붙었는지만 본다</text>
<rect x="520" y="620" width="456" height="56" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="540" y="644" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">-j RETURN</text>
<text x="540" y="662" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">마크 없음 — Pod 가 부른 경우 · src 그대로</text>
<path d="M 428 664 L 452 664 L 452 648 L 510 648" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="520" y="692" width="456" height="56" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="540" y="716" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">MASQUERADE --random-fully</text>
<text x="540" y="734" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">마크 있음 — 노드가 부른 경우 · src → 10.244.1.1:39387</text>
<path d="M 428 664 L 452 664 L 452 720 L 510 720" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="36" y="788" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">체인을 몇 번 갈아타도 헤더는 그대로다 — 실제로 바뀌는 자리는 위 레인의 DNAT 한 번과 아래 레인의 조건부 MASQUERADE 한 번뿐이다</text>
<line x1="12" y1="800" x2="952" y2="800" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="822" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="812" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="822" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">지나는 체인</text>
<rect x="222" y="812" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="244" y="822" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바뀌는 자리 · 레인을 갈아타는 자리</text>
<rect x="526" y="812" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="548" y="822" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노드에서 온 요청일 때만</text>
</svg>
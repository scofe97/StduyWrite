<title id="dt">가장 긴 접두사가 이기고, 없는 주소는 /26 블랙홀이 받습니다</title><desc id="dd">기본 경로에서 시작해 상위 8비트가 10 이면 10.0.0.0/8, 상위 16비트가 10.244 이면 Pod 대역 10.244.0.0/16 으로 내려간다. 그 아래 /26 블록 셋은 워커1, 워커2, 이 노드로 갈린다. 이 노드의 블록 10.244.242.64/26 자체가 blackhole 경로이고 그 아래에 10.244.242.66/32 같은 Pod 별 경로가 calixxx 로 붙는다. calixxx 가 없는 주소는 더 긴 /32 가 없어 /26 blackhole 에서 폐기된다. 10.0.0.0/8 과 10.244.0.0/16 은 분기점을 보이려는 설명용 노드이고 실제 Calico 경로가 아니다. 10.244.242.66 은 Calico 예시 클러스터의 CoreDNS Pod 주소이며 다른 도식의 주소와는 다른 클러스터 예시다.</desc>

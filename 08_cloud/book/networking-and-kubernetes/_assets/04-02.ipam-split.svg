<title id="dt">주소 재고는 위에서 내려오고 배분은 따로 갈라져 있다</title><desc id="dd">클러스터 전체 대역이 노드별 조각으로 잘려 내려오고, 그 조각을 IPAM 플러그인이 Pod 하나에게 배분한다. 배선 플러그인과 IPAM 은 별개 인터페이스다.</desc>
<rect width="1000" height="472" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">IPAM · WHERE ONE POD ADDRESS COMES FROM</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">주소 재고는 위에서 내려오고 배분은 따로 갈라져 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">배선하는 플러그인과 주소를 정하는 플러그인이 따로라 둘을 따로 고른다</text>
<text x="32" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">재고가 내려오는 길</text>
<rect x="32" y="128" width="272" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="168" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">클러스터 전체 대역</text>
<text x="168" y="180" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">--cluster-cidr 10.1.0.0/16</text>
<rect x="364" y="128" width="272" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">노드 조각</text>
<text x="500" y="180" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">spec.podCIDR 10.1.3.0/24</text>

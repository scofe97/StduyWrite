<title id="dt">iptables -L 에 안 보이는 두 검사 — Martian 과 rp_filter</title><desc id="dd">들어온 패킷은 PRE_ROUTING 훅을 지난 뒤 라우팅 코드로 넘어간다. 출발지 주소를 보는 두 검사가 그 안에서 발화하므로, 여기서 버려진 패킷은 iptables 규칙 목록을 아무리 뒤져도 자국이 없다. 두 검사는 스위치도 따로다 — Martian 은 기본 동작이고 rp_filter 는 sysctl 로 켜고 끈다.</desc>
<rect width="1000" height="628" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ROUTING-LAYER DROPS · OUTSIDE THE IPTABLES VIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">iptables -L 에 안 보이는 두 검사 — Martian 과 rp_filter</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">버린 주체가 방화벽이 아니라 라우팅 코드다 — 규칙 목록에는 자국이 남지 않는다</text>
<rect x="24" y="104" width="952" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Netfilter 훅 · iptables -L 에 보이는 자리</text>

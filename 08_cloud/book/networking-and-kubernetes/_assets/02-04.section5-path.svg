<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">패킷 하나가 지나는 자리에 이 절의 네 주제가 놓인다</title><desc id="dd">추적이 켜져 있어야 기록이 남고, 아는 연결이면 규칙을 거치지 않습니다. 그래서 nat 규칙은 연결의 첫 패킷에서만 발화합니다.</desc>
<rect width="1000" height="720" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5 · ONE PACKET'S PATH</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">패킷 하나가 지나는 자리에 이 절의 네 주제가 놓인다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">추적이 켜졌나, 아는 연결인가 — 두 판단이 경로를 가른다</text>
<rect x="204" y="150" width="224" height="44" rx="20" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="316" y="177" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">패킷이 FORWARD 를 지난다</text>
<path d="M 316 194 L 316 214" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 316 222 L 486 268 L 316 314 L 146 268 Z" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="316" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">추적 훅이 등록돼 있나?</text>
<text x="316" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">-m conntrack 또는 nat 규칙</text>
<path d="M 486 268 L 628 268" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="561" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">아니오</text>
<rect x="636" y="246" width="224" height="44" rx="20" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="748" y="273" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아무 기록도 안 남는다</text>
<text x="748" y="312" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">conntrack -L → 0건</text>
<path d="M 316 314 L 316 350" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="330" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">예</text>
<path d="M 316 358 L 486 404 L 316 450 L 146 404 Z" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="316" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">conntrack 이 아는 연결인가?</text>
<text x="316" y="420" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">응답 방향 튜플로 조회</text>
<path d="M 486 404 L 628 404" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="561" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">예</text>
<rect x="636" y="366" width="224" height="76" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="1.1"/>
<text x="748" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">저장된 튜플로 변환</text>
<text x="748" y="420" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">규칙을 아예 안 거친다</text>
<path d="M 316 450 L 316 482" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="330" y="484" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">아니오 — 첫 패킷</text>
<rect x="204" y="490" width="224" height="76" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.1"/>
<text x="316" y="520" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">nat 규칙을 훑는다</text>
<text x="316" y="544" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">카운터가 여기서 오른다</text>
<path d="M 316 566 L 316 586" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="204" y="594" width="224" height="76" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.1"/>
<text x="316" y="624" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">엔트리 생성</text>
<text x="316" y="648" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">튜플 두 줄이 정해진다</text>
<path d="M 428 632 L 628 632" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="636" y="594" width="224" height="76" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="748" y="624" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">변환 후 전달</text>
<text x="748" y="648" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이후 패킷은 위 갈래로</text>
<line x1="12" y1="680" x2="952" y2="680" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="702" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="692" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="702" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">첫 패킷만 지나는 길</text>
<rect x="287" y="692" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="309" y="702" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이후 패킷 — 규칙을 건너뛴다</text>
</svg>
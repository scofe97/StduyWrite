<title id="dt">sandbox 는 endpoint 를 통해서만 network 에 닿는다</title><desc id="dd">컨테이너 셋의 sandbox 와 그 안의 endpoint 넷, 그리고 network 둘. 가운데 sandbox 는 endpoint 를 둘 가져 두 network 에 함께 걸치고, endpoint 하나는 network 하나에만 속한다.</desc>

<title id="dt">veth 는 송신을 반대쪽 끝의 수신으로 곧장 넘긴다</title><desc id="dd">위 레인은 비교 기준인 물리 NIC 두 장 사이 경로로 송신 스택, qdisc, NIC 드라이버, 케이블, 받는 NIC 순이다. 아래 레인은 veth 쌍 사이 경로로 Pod 쪽 끝의 송신 스택에서 veth_xmit 를 거쳐 호스트 쪽 끝의 수신 처리로 바로 간다. qdisc 열과 케이블 자리가 비어 있다.</desc>
<rect width="1000" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">veth PAIR · veth_xmit</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">veth 는 송신을 반대쪽 끝의 수신으로 곧장 넘긴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">물리 NIC 경로와 열을 맞추면 빈 자리가 qdisc 와 케이블이다</text>
<rect x="40" y="112" width="920" height="120" rx="8" fill="#8B98A906" stroke="#8B98A9" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="56" y="103" width="178" height="18" fill="#0D1117"/>

<title id="dt">나갈 때 출발지를 바꾸고, 돌아올 때 목적지를 되돌린다</title><desc id="dd">Pod 의 출발지 10.244.2.2:45678 은 노드를 지나며 192.168.148.4:61234 로 바뀐다. 답장은 바뀐 쌍을 목적지로 달고 돌아오고, 커널이 conntrack 항목으로 원래 쌍을 찾아 목적지를 되돌린다.</desc>
<rect width="1000" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SNAT REPLY · WHO RESTORES THE DESTINATION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">나갈 때 출발지를 바꾸고, 돌아올 때 목적지를 되돌린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바꾼 쌍과 원래 쌍을 conntrack 항목 하나가 함께 들고 있다</text>

<title id="dt">거절을 지어낸 쪽은 목적지가 아니다</title><desc id="dd">규칙이 없으면 목적지 커널이 RST 를 보냅니다. 중간에 규칙이 있으면 그 자리가 답을 지어내고, DROP 이면 아무것도 안 지어내 상대가 한도까지 기다립니다.</desc>
<rect width="1000" height="848" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BLOCKED · WHO ANSWERS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">거절을 지어낸 쪽은 목적지가 아니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">응답이 어느 레인에서 출발하는가가 '누가 막았나'를 말한다</text>
<rect x="24.0" y="104" width="212" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="130.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">ns1</text>
<text x="130.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10.10.1.11</text>
<rect x="382.0" y="104" width="212" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="488.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">br0 · 중계</text>
<text x="488.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10.10.1.1 · 규칙이 있는 자리</text>
<rect x="740.0" y="104" width="212" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="846.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">ubuntu2</text>
<text x="846.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">192.168.139.238</text>
<line x1="130.0" y1="154" x2="130.0" y2="712" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="488.0" y1="154" x2="488.0" y2="712" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="846.0" y1="154" x2="846.0" y2="712" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<text x="36" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">규칙이 없다면 — 기준선</text>
<path d="M 140.0 214 L 834.0 214" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="488.0" y="205" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9"></text>
<text x="667.0" y="205" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">SYN</text>
<text x="667.0" y="229" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">중계는 그냥 넘긴다</text>
<path d="M 836.0 262 L 142.0 262" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="488.0" y="253" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8"></text>
<text x="667.0" y="253" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">RST</text>
<text x="667.0" y="277" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 포트에 소켓이 없다 — 커널의 기본 동작</text>
<text x="36" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">출발지가 목적지 IP — 도달에는 성공했다는 뜻</text>
<line x1="36" y1="320" x2="952" y2="320" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 5"/>
<rect x="38.0" y="344" width="542.0" height="362" rx="4" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
<rect x="38.0" y="344" width="44" height="16" rx="2" fill="#0D1117" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
<text x="60.0" y="356" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ALT</text>
<text x="50.0" y="382" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">[-j DROP]</text>
<path d="M 140.0 420 L 476.0 420" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="309.0" y="411" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">SYN</text>
<text x="309.0" y="437" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">10.10.1.11 → 192.168.139.238:9000</text>
<rect x="430.0" y="458" width="116.0" height="20" rx="4" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="488.0" y="472" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">버린다 · 답을 안 만든다</text>
<rect x="61.5" y="502" width="137.0" height="20" rx="4" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="130.0" y="516" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">5.062 s timed out</text>
<line x1="46.0" y1="540" x2="572.0" y2="540" stroke="rgba(245,245,245,0.20)" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="50.0" y="566" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">[-j REJECT]</text>
<path d="M 140.0 604 L 476.0 604" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="309.0" y="595" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">SYN</text>
<path d="M 478.0 646 L 142.0 646" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="309.0" y="637" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">ICMP port unreachable</text>
<text x="309.0" y="663" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">출발지 10.10.1.1 — br0 이 지어냈다</text>
<rect x="68.5" y="676" width="123.0" height="20" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="130.0" y="690" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">0.036 s refused</text>
<line x1="846.0" y1="344" x2="846.0" y2="706" stroke="#5E6B7E" stroke-width="2.0" stroke-dasharray="3 6"/>
<rect x="795.0" y="515.0" width="102.0" height="20" rx="4" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="846.0" y="529.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">이 연결을 본 적 없다</text>
<text x="36" y="744" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">출발지 IP 는 '중간이냐 끝이냐'만 가르고, '규칙이냐 소켓 없음이냐'는 프로토콜이 가릅니다.</text>
<text x="36" y="766" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">--reject-with tcp-reset 을 쓰면 방화벽이 낸 거절인데 소켓 없음처럼 보이게 위장할 수도 있습니다.</text>
<line x1="12" y1="786" x2="952" y2="786" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="808" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="798" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="808" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">커널 기본 동작 — RST</text>
<rect x="326" y="798" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="348" y="808" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">규칙이 지어낸 거절 — ICMP</text>

<title id="dt">NODE 칸이 정해졌는지가 스케줄러 쪽과 kubelet 쪽을 가른다</title><desc id="dd">kubectl get pod -o wide 의 NODE 가 none 이면 스케줄러가 노드를 못 정한 것이고, 노드가 정해졌는데 ContainerCreating 이면 그 노드의 kubelet 쪽에서 멈춘 것이다.</desc>
<rect width="1000" height="548" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">STUCK POD · WHICH SIDE TO LOOK AT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">NODE 칸이 정해졌는지가 스케줄러 쪽과 kubelet 쪽을 가른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">CNI 가 없을 때는 노드가 NotReady 가 되어 앞쪽(스케줄러)에서 멈춘다</text>
<rect x="160" y="114" width="200" height="36" rx="18" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="260" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Pod 가 안 뜬다</text>
<path d="M 260 150 L 260 186" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 260 188 L 370 236 L 260 284 L 150 236 Z" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="260" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">NODE 칸이</text>
<text x="260" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">&lt;none&gt; 인가?</text>
<path d="M 370 236 L 490 236" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="430" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">예</text>
<rect x="490" y="208" width="300" height="56" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="640" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">Pending · 스케줄러가 노드를 못 정함</text>
<text x="640" y="250" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">FailedScheduling</text>
<path d="M 640 264 L 640 302" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 640 302 L 760 350 L 640 398 L 520 350 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="640" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">untolerated taint 가</text>
<text x="640" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">not-ready 인가?</text>
<path d="M 760 350 L 780 350" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="770" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">예</text>
<rect x="780" y="322" width="200" height="56" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="880" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">노드가 NotReady</text>
<text x="880" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">흔한 원인 · CNI 부재</text>
<path d="M 640 398 L 640 428" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="652" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아니오</text>
<rect x="490" y="428" width="300" height="48" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="640" y="448" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">자원 부족 · affinity · PVC 확인</text>
<text x="640" y="466" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">describe pod 이벤트</text>
<path d="M 260 284 L 260 312" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="272" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아니오</text>
<rect x="110" y="312" width="300" height="56" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="260" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">ContainerCreating · kubelet 쪽에서 멈춤</text>
<text x="260" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">NODE 가 정해진 뒤</text>
<path d="M 260 368 L 260 428" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="110" y="428" width="300" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="260" y="448" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">CNI 가 주소를 못 줌 · 이미지·볼륨도 확인</text>
<text x="260" y="466" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">failed to setup network for sandbox</text>
<line x1="12" y1="492" x2="952" y2="492" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="514" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="504" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스케줄러 쪽</text>
<rect x="222" y="504" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="244" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">kubelet 쪽</text>
<rect x="383" y="504" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="405" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가르는 첫 질문</text>
</svg>
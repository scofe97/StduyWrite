<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">같은 규칙인데 클러스터 밖 이름은 시도가 네 번이다</title><desc id="dd">default 네임스페이스의 Pod 에서 web 은 web.default.svc.cluster.local 이 첫 후보라 시도 1번에 끝나 질의가 2번이다. example.com 은 접미사 세 개가 NXDOMAIN 이고 이름 그대로 네 번째에 적중해 시도 4번, 질의 8번이다.</desc>
<rect width="1000" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CLUSTER DNS · THE SEARCH PATH IS TRIED IN ORDER</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 규칙인데 클러스터 밖 이름은 시도가 네 번이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">안 이름은 첫 후보에서 맞고 밖 이름은 접미사 셋을 소진한 뒤 맞는다</text>
<rect x="32" y="112" width="936" height="180" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.4"/>
<text x="52" y="138" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">클러스터 안 이름 · web</text>
<rect x="52" y="152" width="300" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="202" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1번째 후보</text>
<text x="202" y="194" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">web.default.svc.cluster.local</text>
<text x="202" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">적중 · 여기서 끝</text>
<line x1="356" y1="180" x2="392" y2="180" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="3 3"/>
<rect x="396" y="152" width="540" height="56" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.14)" stroke-width="0.9"/>
<text x="666" y="185" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">이후 후보는 시도하지 않음</text>
<text x="52" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">시도 1번 × (A + AAAA) = 질의 2번</text>
<rect x="32" y="310" width="936" height="212" rx="8" fill="#161B22" stroke="#F0616D" stroke-width="1.4"/>
<text x="52" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">클러스터 밖 이름 · example.com</text>
<rect x="52" y="350" width="214" height="56" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="159" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1번째 후보</text>
<text x="159" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">+default.svc.cluster.local</text>
<text x="159" y="426" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">NXDOMAIN</text>
<path d="M 270 378 L 274 378" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="276" y="350" width="214" height="56" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="383" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">2번째 후보</text>
<text x="383" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">+svc.cluster.local</text>
<text x="383" y="426" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">NXDOMAIN</text>
<path d="M 494 378 L 498 378" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="500" y="350" width="214" height="56" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="607" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">3번째 후보</text>
<text x="607" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">+cluster.local</text>
<text x="607" y="426" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">NXDOMAIN</text>
<path d="M 718 378 L 722 378" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="724" y="350" width="214" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.4"/>
<text x="831" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">4번째 후보</text>
<text x="831" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">example.com (그대로)</text>
<text x="831" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">적중</text>
<rect x="52" y="444" width="884" height="58" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="72" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">시도 4번 × (A + AAAA) = 질의 8번 · 점이 하나라 ndots:5 에 걸려 검색 경로를 먼저 돈다</text>
<line x1="12" y1="548" x2="952" y2="548" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="570" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="560" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">NXDOMAIN 으로 끝난 후보</text>
<rect x="365" y="560" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="387" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">적중한 후보</text>
</svg>
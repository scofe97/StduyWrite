<text x="52" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">dual-stack 확인된 자리</text>
<rect x="328" y="328" width="304" height="72" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="480" y="369" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">할당 실패</text>

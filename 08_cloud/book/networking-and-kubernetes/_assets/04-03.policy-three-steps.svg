<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
</defs>
<title id="dt">정책을 한 단계씩 조이면 무엇이 닫히는가</title><desc id="dd">정책이 없으면 전부 열려 있고, 선택만 하고 규칙을 비우면 양방향이 닫히며, 허용 규칙을 하나 더하면 그 방향만 예외로 열린다.</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NETWORKPOLICY · TIGHTENING IN THREE STEPS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">정책을 한 단계씩 조이면 무엇이 닫히는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">2단계에서 규칙을 하나도 안 적었는데 전부 닫힌다. 선택 자체가 차단으로 뒤집는다는 것이 이 모델의 요점이다</text>

<rect x="32" y="110" width="936" height="128" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.4"/>
<text x="52" y="136" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#3FB98C">1 · 정책 없음</text>
<rect x="120" y="152" width="180" height="52" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="210" y="183" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" fill="#F5F5F3">demo</text>
<rect x="560" y="152" width="180" height="52" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="650" y="183" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" fill="#F5F5F3">demo-db</text>
<line x1="304" y1="170" x2="554" y2="170" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<line x1="554" y1="192" x2="304" y2="192" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<text x="429" y="163" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#3FB98C">열림</text>
<text x="429" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#3FB98C">열림</text>
<text x="780" y="183" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">기본은 전부 허용이다</text>

<rect x="32" y="252" width="936" height="128" rx="8" fill="#161B22" stroke="#F0616D" stroke-width="1.4"/>
<text x="52" y="278" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F0616D">2 · demo-db 를 선택하고 규칙은 비움</text>
<rect x="120" y="294" width="180" height="52" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="210" y="325" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" fill="#F5F5F3">demo</text>
<rect x="560" y="294" width="180" height="52" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.4"/>
<text x="650" y="318" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" fill="#F0616D">demo-db</text>
<text x="650" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#F0616D">선택됨 · 양방향 잠김</text>
<line x1="304" y1="312" x2="554" y2="312" stroke="#F0616D" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#bad)"/>
<line x1="554" y1="334" x2="304" y2="334" stroke="#F0616D" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#bad)"/>
<text x="429" y="305" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#F0616D">막힘</text>
<text x="429" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#F0616D">막힘</text>
<text x="780" y="315" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">규칙은 한 줄도 안 적었다</text>
<text x="780" y="337" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#F0616D">DNS 도 여기서 죽는다</text>

<rect x="32" y="394" width="936" height="128" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="52" y="420" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#6A95D8">3 · ingress 에 app=demo 허용을 하나 더함</text>
<rect x="120" y="436" width="180" height="52" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="210" y="467" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" fill="#F5F5F3">demo</text>
<rect x="560" y="436" width="180" height="52" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.4"/>
<text x="650" y="467" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" fill="#6A95D8">demo-db</text>
<line x1="304" y1="454" x2="554" y2="454" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<line x1="554" y1="476" x2="304" y2="476" stroke="#F0616D" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#bad)"/>
<text x="429" y="447" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#3FB98C">허용된 예외 하나</text>
<text x="429" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#F0616D">egress 는 여전히 막힘</text>
<text x="780" y="457" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">허용만 더할 수 있다</text>
<text x="780" y="479" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">차단은 적을 수 없다</text>

<text x="36" y="546" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" fill="#8B98A9">1단에서 2단으로 가며 닫은 것은 규칙이 아니라 선택이다. 3단이 여는 것도 방향 전체가 아니라 적어 둔 한 갈래뿐이다</text>
</svg>

<text x="350" y="520" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">속의 IP 까지 읽는다</text>
<path d="M 206 492 L 250 492" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="560" y="470" width="380" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="576" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">다른 망으로 · 겉봉 MAC 을 새로 쓴다</text>
<path d="M 446 492 L 550 492" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="60" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">세 줄의 차이는 성능이 아니라 여는 깊이입니다. 겉봉을 고쳐 쓰는 것은 라우터뿐입니다.</text>
<line x1="12" y1="572" x2="952" y2="572" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

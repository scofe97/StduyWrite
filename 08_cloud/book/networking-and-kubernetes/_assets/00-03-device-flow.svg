<title id="dt">같은 프레임이 들어와도 나가는 모습이 다르다</title><desc id="dd">허브·스위치·라우터에 같은 프레임을 넣었을 때 각각 무엇을 읽고 어떻게 내보내는지를 세 줄로 나란히 놓은 흐름 비교. 허브는 모든 포트로 복사하고, 스위치는 한 포트로만 보내며, 라우터만 겉봉을 새로 쓴다.</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW COMPARISON · WHAT EACH DEVICE READS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 프레임이 들어와도 나가는 모습이 다르다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽에 같은 프레임을 넣었습니다. 가운데가 그 장비가 읽는 깊이이고, 오른쪽이 그 결과입니다.</text>
<rect x="60" y="164" width="140" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="130" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">프레임 도착</text>
<text x="130" y="208" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">dst AA:..:02</text>
<rect x="260" y="152" width="180" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="276" y="176" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">L1</text>
<text x="350" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">허브</text>

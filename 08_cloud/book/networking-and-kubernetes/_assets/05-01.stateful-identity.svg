<title id="dt">이름은 재생성을 넘어 남고 주소는 그때그때 풀린다</title><desc id="dd">StatefulSet 이 고정하는 것은 Pod 의 이름이고 IP 가 아니다. 그 이름이 무엇으로 풀리는지는 이름을 맡은 Service 가 headless 인지에 따라 갈린다.</desc>
<rect width="1000" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">STATEFULSET · THE NAME STAYS, THE IP MAY NOT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름은 재생성을 넘어 남고 주소는 그때그때 풀린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">고정되는 것은 이름 · 주소는 조회 시점에 정해진다</text>
<rect x="24" y="104" width="952" height="364" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">무엇을 조회하느냐로 답이 갈린다</text>
<rect x="28" y="258" width="180" height="108" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="118" y="294" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">StatefulSet</text>
<text x="118" y="316" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">postgres · replicas 2</text>
<text x="118" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">고정 = 이름 postgres-0</text>
<rect x="288" y="258" width="224" height="108" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="400" y="294" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">headless Service</text>
<text x="400" y="316" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">clusterIP: None</text>
<text x="400" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">spec.serviceName · 필수</text>
<path d="M 212 312 L 284 312" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="248" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이름 위임</text>
<rect x="580" y="182" width="384" height="92" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="772" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">Pod 별 이름</text>
<text x="772" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">postgres-0.postgres.default.svc…</text>
<text x="772" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">→ 그 Pod 의 현재 IP</text>
<rect x="580" y="350" width="384" height="92" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="772" y="378" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">서비스 이름</text>
<text x="772" y="400" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">postgres.default.svc.cluster.local</text>
<text x="772" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">→ 대상 Pod IP 집합</text>
<path d="M 516 288 L 552 288 L 552 228 L 576 228" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 516 336 L 552 336 L 552 396 L 576 396" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<rect x="32" y="484" width="936" height="64" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="52" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">일반 ClusterIP Service 였다면 · 이름은 Service 의 ClusterIP 하나로만 풀린다</text>
<text x="52" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Pod 별 레코드가 서지 않아 멤버를 지목할 수 없다</text>
<line x1="12" y1="568" x2="952" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="590" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="580" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">멤버를 지목</text>
<rect x="222" y="580" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="244" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전체 대상 집합</text>
<rect x="370" y="580" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="392" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이름을 맡는 자리 · 필수</text>
</svg>
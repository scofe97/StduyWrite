<text x="284" y="332" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">3</text>
<text x="376" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">설정 읽기 · 바이너리 실행</text>
<text x="376" y="360" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">CNI_COMMAND=ADD</text>
<rect x="520" y="400" width="208" height="64" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>

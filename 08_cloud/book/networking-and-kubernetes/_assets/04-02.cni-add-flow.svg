<title id="dt">Pod 하나가 주소를 받기까지</title><desc id="dd">Kubelet 이 Pod 를 맡으면 컨테이너 런타임이 네임스페이스를 만들고 CNI 플러그인을 실행하며, 플러그인이 veth 를 놓고 IPAM 에게 주소를 받아 네임스페이스 안에 넣는다.</desc>
<rect width="1000" height="628" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CNI · FROM SCHEDULED POD TO A WIRED eth0</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Pod 하나가 주소를 받기까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Kubelet → 런타임 → 플러그인 → IPAM 순서로 일을 넘긴다</text>
<text x="128" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">Kubelet</text>
<text x="376" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">컨테이너 런타임</text>
<text x="624" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">CNI 플러그인</text>
<text x="872" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">IPAM 플러그인</text>
<line x1="252" y1="104" x2="252" y2="560" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="500" y1="104" x2="500" y2="560" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="748" y1="104" x2="748" y2="560" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="24" y="136" width="208" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="36" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">1</text>
<text x="128" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">스케줄된 Pod 수령</text>
<rect x="272" y="224" width="208" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="284" y="244" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">2</text>
<text x="376" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">샌드박스 컨테이너 생성</text>
<text x="376" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">네트워크 네임스페이스 생성</text>

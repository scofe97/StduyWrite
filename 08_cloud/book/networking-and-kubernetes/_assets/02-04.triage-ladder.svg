<title id="dt">수사 사다리 — 관문마다 무엇을 치고 어디를 읽는가</title><desc id="dd">위에서부터 하나씩 묻고, 처음 막히는 관문이 곧 원인의 층이다. 아래 줄이 그 관문에서 실제로 치는 명령이다.</desc>
<rect width="1000" height="634" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TRIAGE LADDER · ASK THEN RUN</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">수사 사다리 — 관문마다 무엇을 치고 어디를 읽는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">처음 막히는 관문이 원인의 층이다 · 아래 줄이 거기서 치는 명령</text>
<rect x="24" y="104" width="952" height="458" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">계층 순서대로 묻기 · 원인이 있는 층에서 처음 걸림</text>
<rect x="40" y="200" width="920" height="138" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="56" y="191" width="110" height="18" fill="#0D1117"/>
<text x="66" y="204" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">관문 — 위에서부터</text>
<rect x="40" y="386" width="920" height="138" rx="8" fill="#F08A5906" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="56" y="377" width="67" height="18" fill="#0D1117"/>
<text x="66" y="390" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">치는 명령</text>
<rect x="60" y="226" width="184" height="100" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="152" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">이름이 풀리는가</text>
<text x="152" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">안 풀리면 DNS 문제</text>
<text x="152" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">여기서 멈춤</text>
<rect x="292" y="226" width="184" height="100" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="384" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">호스트에 닿는가</text>
<text x="384" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">안 닿으면 경로 문제</text>
<text x="384" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Service 는 예외</text>
<rect x="524" y="226" width="184" height="100" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="616" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">포트가 열렸는가</text>
<text x="616" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">안 열렸으면 바인딩 문제</text>
<text x="616" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">프로세스 확인</text>
<rect x="756" y="226" width="184" height="100" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="848" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">대화가 되는가</text>
<text x="848" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">안 되면 L7 문제</text>
<text x="848" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">앱 로직으로</text>
<rect x="60" y="412" width="184" height="100" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="152" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">dig &lt;도메인&gt;</text>
<text x="152" y="464" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">status · ANSWER SECTION</text>
<text x="152" y="488" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">NXDOMAIN 이면 없음</text>
<rect x="292" y="412" width="184" height="100" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="384" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">ping -c 3 &lt;주소&gt;</text>
<text x="384" y="464" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">손실률과 왕복 시간</text>
<text x="384" y="488" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Service 면 건너뜀</text>
<rect x="524" y="412" width="184" height="100" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="616" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">ss -ltnp</text>
<text x="616" y="464" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Local Address:Port 열</text>
<text x="616" y="488" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">와일드카드인지 루프백인지</text>
<rect x="756" y="412" width="184" height="100" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="848" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">curl -v &lt;URL&gt;</text>
<text x="848" y="464" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핸드셰이크와 응답 헤더</text>
<text x="848" y="488" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">어느 단계에서 멈추나</text>
<path d="M 250 276 L 282 276" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 482 276 L 514 276" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 714 276 L 746 276" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 152 332 L 152 402" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 384 332 L 384 402" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 616 332 L 616 402" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 848 332 L 848 402" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="164" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">조회</text>
<text x="396" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">확인</text>
<text x="628" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">점검</text>
<text x="860" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">대화</text>
<line x1="12" y1="578" x2="952" y2="578" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="600" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="590" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="600" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">관문</text>
<rect x="170" y="590" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="192" y="600" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">치는 명령</text>
</svg>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">1 차 — 평소엔 64 를 쓰지만 여기서는 일부러 TTL 1 로 쏜다</text>

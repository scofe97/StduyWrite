<title id="dt">traceroute — 한 번에 한 대씩, 일부러 죽여서 알아낸다</title><desc id="dd">TTL 을 1 부터 올려 가며 여러 번 쏜다. 매번 다른 라우터가 항의하고, 그 항의의 출발지 IP 가 곧 그 홉의 정체다.</desc>
<rect width="1000" height="784" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TRACEROUTE · TTL 1 -&gt; 2 -&gt; 3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">traceroute — 한 번에 한 대씩, 일부러 죽여서 알아낸다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">TTL 을 1 부터 올려 가며 쏜다 · 항의가 돌아온 출발지 IP 가 곧 그 홉의 정체다</text>
<rect x="24" y="104" width="952" height="184" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>

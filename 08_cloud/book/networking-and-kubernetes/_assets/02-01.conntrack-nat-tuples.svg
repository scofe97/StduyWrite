<title id="dt">conntrack 엔트리 한 줄에 튜플이 둘 — NAT 뒤에서는 응답 줄이 뒤집기가 아니다</title><desc id="dd">요청이 DNAT·MASQUERADE 를 거치는 순간 conntrack 은 원본 방향과 응답 방향 튜플을 함께 적는다. 응답 패킷은 두 번째 튜플로 조회돼 두 변환이 한 번에 되돌려진다. DNAT 는 응답의 출발지를, MASQUERADE 는 응답의 목적지를 정한다.</desc>
<rect width="1000" height="896" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONNTRACK × NAT · ENTRY SHAPE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">conntrack 엔트리 한 줄에 튜플이 둘 — NAT 뒤에서는 응답 줄이 뒤집기가 아니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">응답 방향 튜플은 원본을 뒤집은 값이 아니라 변환된 주소를 담는다</text>
<rect x="24.0" y="104" width="212" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="130.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="130.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">203.0.113.9:51000</text>
<rect x="382.0" y="104" width="212" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="488.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">노드 커널</text>
<text x="488.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">conntrack + nat</text>
<rect x="740.0" y="104" width="212" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="846.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Pod</text>
<text x="846.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">10.244.1.66:8080</text>
<line x1="130.0" y1="154" x2="130.0" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="488.0" y1="154" x2="488.0" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="846.0" y1="154" x2="846.0" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<rect x="484.0" y="180" width="8" height="364" fill="#8B98A918" stroke="#5E6B7E" stroke-width="0.8"/>
<path d="M 140.0 180 L 476.0 180" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="309.0" y="170" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">SYN</text>
<text x="309.0" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">dst = 노드 IP:30080</text>
<path d="M 498.0 220 L 552.0 220 L 552.0 244 L 501.0 244" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="564.0" y="228" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">PRE_ROUTING 에서 DNAT</text>
<text x="564.0" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">목적지를 Pod IP 로 바꾼다</text>
<path d="M 498.0 272 L 552.0 272 L 552.0 296 L 501.0 296" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="564.0" y="280" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">POST_ROUTING 에서 MASQUERADE</text>
<text x="564.0" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">출발지를 노드 IP 로 바꾼다</text>
<path d="M 498.0 324 L 552.0 324 L 552.0 348 L 501.0 348" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="564.0" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">conntrack 엔트리 생성</text>
<text x="564.0" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">튜플 두 줄이 여기서 정해진다</text>
<path d="M 498.0 388 L 834.0 388" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="667.0" y="378" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">SYN</text>
<text x="667.0" y="406" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">src = 노드 IP · dst = Pod IP</text>
<path d="M 836.0 440 L 500.0 440" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="667.0" y="430" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">SYN-ACK</text>
<text x="667.0" y="458" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">src = Pod IP · dst = 노드 IP</text>
<path d="M 498.0 480 L 552.0 480 L 552.0 504 L 501.0 504" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="564.0" y="488" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">응답 방향 튜플로 조회</text>
<text x="564.0" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">두 변환을 한 번에 되돌린다</text>
<path d="M 478.0 544 L 142.0 544" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="309.0" y="534" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">SYN-ACK</text>
<text x="309.0" y="562" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">src = 노드 IP:30080</text>
<rect x="40" y="600" width="920" height="184" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="64" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">conntrack 엔트리 하나 — 위 '엔트리 생성' 단계에서 채워지는 항목</text>
<rect x="56" y="632" width="888" height="32" rx="5" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="80" y="653" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">원본 방향</text>
<text x="208" y="653" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">src=203.0.113.9:51000</text>
<text x="528" y="653" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">dst=노드 IP:30080</text>
<rect x="56" y="672" width="888" height="32" rx="5" fill="none" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="80" y="693" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">뒤집기라면</text>
<text x="208" y="693" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">src=노드 IP:30080</text>
<text x="528" y="693" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">dst=203.0.113.9:51000</text>
<rect x="56" y="712" width="888" height="32" rx="5" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="80" y="733" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">실제 응답 방향</text>
<text x="208" y="733" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">src=10.244.1.66:8080</text>
<text x="528" y="733" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">dst=노드 IP:51000</text>
<text x="208" y="766" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">두 필드가 모두 어긋난다 — DNAT 가 응답의 src 를, MASQUERADE 가 응답의 dst 를 정했다</text>
<text x="36" y="808" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">NAT 가 없을 때만 아래 줄이 위 줄을 그대로 뒤집은 값이 된다.</text>
<text x="36" y="828" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">로드밸런서가 연결을 한 백엔드에 고정하는 것도 이 두 번째 줄 덕분이다 — 규칙을 다시 고르지 않는다.</text>
<line x1="12" y1="844" x2="952" y2="844" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="866" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="856" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="866" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원본 방향</text>
<rect x="209" y="856" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="866" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실제 응답 방향 — 뒤집기가 아니다</text>
</svg>
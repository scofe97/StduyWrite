<title id="dt">HTTP 규칙은 메서드와 경로 정규식으로 판정한다</title><desc id="dd">webserver 로 향하는 세 요청이 L7 규칙을 거쳐 200 허용과 403 차단으로 갈린다</desc>
<rect width="920" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 13-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">HTTP 규칙은 메서드와 경로 정규식으로 판정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">webserver 로 향하는 세 요청이 L7 규칙을 거쳐 200 허용과 403 차단으로 갈린다</text>
<rect x="20" y="96" width="260" height="32" rx="6" fill="#161B22" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="150.0" y="117" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">클라이언트 요청</text>
<rect x="320" y="96" width="260" height="32" rx="6" fill="#161B22" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="450.0" y="117" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">L7 HTTP 규칙 (정규식)</text>
<rect x="620" y="96" width="260" height="32" rx="6" fill="#161B22" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="750.0" y="117" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Envoy 판정 및 응답</text>
<rect x="20" y="148" width="260" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="150.0" y="190" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">curl webserver</text>
<text x="150.0" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">GET / HTTP/1.1</text>
<rect x="320" y="148" width="260" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="450.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">path: /api (완전 일치)</text>
<text x="450.0" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">하위·루트 경로 불일치</text>

<text x="450.0" y="310" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">method: GET · path: /api</text>
<text x="450.0" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">메서드·경로 정규식 일치</text>
<rect x="620" y="268" width="260" height="100" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.1"/>
<text x="750.0" y="310" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">200 OK</text>

<text x="450.0" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">관리자 경로 불일치</text>
<rect x="620" y="388" width="260" height="100" rx="6" fill="#F0616D10" stroke="#F0616D" stroke-width="1.1"/>
<text x="750.0" y="430" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">403 Forbidden</text>
<text x="750.0" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">본문 "Access denied" · envoy</text>

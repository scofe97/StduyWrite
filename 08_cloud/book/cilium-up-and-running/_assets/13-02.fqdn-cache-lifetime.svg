<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 344" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">FQDN 캐시 항목의 수명</title><desc id="dd">질의로 생긴 항목은 응답 TTL 동안 허용 근거가 되고, 만료 뒤에도 연결이 살아 있으면 IP 가 유지됩니다</desc>
<rect width="920" height="344" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 13-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">FQDN 캐시 항목의 수명</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">눈금은 순서이며 시간 비례가 아닙니다</text>
<line x1="40" y1="200" x2="880" y2="200" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<circle cx="100" cy="200" r="4" fill="#0D1117" stroke="#6A95D8" stroke-width="1.4"/>
<text x="100" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">시작</text>
<line x1="100" y1="178" x2="100" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 2"/>
<text x="100" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">A 질의</text>
<text x="100" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">cilium.io.</text>
<circle cx="260" cy="200" r="6" fill="#F08A59" stroke="#F08A59" stroke-width="1.4"/>
<text x="260" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">응답 전달 전</text>
<line x1="260" y1="228" x2="260" y2="242" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 2"/>
<rect x="200.0" y="242" width="120" height="44" rx="4" fill="#F08A5918" stroke="#F08A59" stroke-width="1.2"/>
<text x="260" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">IP 등록</text>
<text x="260" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">보류 최대 100ms</text>
<circle cx="420" cy="200" r="4" fill="#0D1117" stroke="#6A95D8" stroke-width="1.4"/>
<text x="420" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">등록 뒤</text>
<line x1="420" y1="178" x2="420" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 2"/>
<text x="420" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">응답 전달</text>
<text x="420" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Pod 가 IP 로 연결</text>
<circle cx="580" cy="200" r="4" fill="#0D1117" stroke="#3FB98C" stroke-width="1.4"/>
<text x="580" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">TTL 안</text>
<line x1="580" y1="228" x2="580" y2="242" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 2"/>
<text x="580" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">연결 허용</text>
<text x="580" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">identity 일치</text>
<circle cx="720" cy="200" r="4" fill="#0D1117" stroke="#E3B341" stroke-width="1.4"/>
<text x="720" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">TTL 만료</text>
<line x1="720" y1="178" x2="720" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 2"/>
<text x="720" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">항목 만료</text>
<text x="720" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">연결 중이면 IP 유지</text>
<circle cx="840" cy="200" r="4" fill="#0D1117" stroke="#8B98A9" stroke-width="1.4"/>
<text x="840" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">연결 종료 뒤</text>
<line x1="840" y1="228" x2="840" y2="242" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 2"/>
<text x="840" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">정리</text>
<text x="840" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">캐시에서 삭제</text>
</svg>
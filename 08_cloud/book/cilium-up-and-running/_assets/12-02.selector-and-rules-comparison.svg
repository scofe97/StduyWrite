<title id="dt">단일 규칙 안의 두 문장과 두 규칙의 차이</title><desc id="dd">대시 하나 차이로 AND 결합이 OR 결합으로 바뀌어 보안 구멍이 열린다</desc>
<rect width="920" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 12-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">단일 규칙 안의 두 문장과 두 규칙의 차이</text>

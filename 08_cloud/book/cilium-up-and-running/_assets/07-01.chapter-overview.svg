<title id="dt">Cilium Ingress 의 외부 트래픽 처리 경로</title><desc id="dd">클라이언트가 LoadBalancer IP 로 보낸 HTTP 요청을 eBPF 와 Envoy 가 백엔드로 전달한다</desc>

<title id="dt">리더 장애에서 클라이언트 복구까지</title><desc id="dd">리스 만료까지는 Cilium 의 세 타이머가 결정하고, 그 뒤 실제 트래픽 전환 시점은 클라이언트의 ARP 캐시와 gARP 수용 여부가 정합니다.</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 16-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">리더 장애에서 클라이언트 복구까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">기본값 15s · 5s · 2s 기준 페일오버 폭 10~20초</text>

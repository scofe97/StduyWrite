<title id="dt">NodeLocal DNSCache 와 LRP 연동 질의 흐름</title><desc id="dd">Pod 의 DNS 질의가 노드 로컬 캐시로 가로채지고 미스 시 업스트림으로 전달되는 구조</desc>

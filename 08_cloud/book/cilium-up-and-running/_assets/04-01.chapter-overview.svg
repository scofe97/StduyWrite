<title id="dt">Pod 대역을 누가 나누는지로 갈리는 IPAM 모드 다섯 가지</title><desc id="dd">클러스터 풀을 노드 PodCIDR 과 Pod IP 로 나누는 3단계 가운데, 노드 PodCIDR 을 누가 나눠 주는지에 따라 다섯 모드가 갈립니다. 쿠버네티스가 나누는 Host Scope, 오퍼레이터가 나누는 Cluster Scope(기본값)와 Multi-Pool, 주소 출처가 Cilium 밖에 있는 CRD-backed 와 ENI 입니다. 주소 계열(IPv4·듀얼 스택·IPv6 전용)은 배분 갈래 밖 곁가지입니다.</desc>
<rect width="980" height="668" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 04-01 OVERVIEW</text>

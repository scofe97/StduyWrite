<title id="dt">노드 경계를 넘는 트래픽만 WireGuard 로 암호화한다</title><desc id="dd">같은 노드 Pod 는 eBPF 로 직결하고, 다른 노드 Pod 만 WireGuard 터널로 보낸다</desc>
<rect width="920" height="456" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 14-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">노드 경계를 넘는 트래픽만 WireGuard 로 암호화한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 노드 Pod 는 eBPF 로 직결하고, 다른 노드 Pod 만 WireGuard 터널로 보낸다</text>
<rect x="24" y="104" width="380" height="276" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">노드 A</text>
<rect x="38" y="144" width="352" height="56" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="50" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">출발 Pod (client)</text>
<text x="50" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">Pod IP</text>
<rect x="38" y="214" width="352" height="64" rx="6" fill="#5E6B7E12" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="50" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Cilium eBPF 데이터패스</text>
<text x="50" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ClusterIP 해석 뒤 백엔드 노드 판정</text>
<rect x="38" y="296" width="352" height="68" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="50" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">같은 노드 Pod</text>
<text x="50" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">eBPF 커널 직결 · 암호화 생략</text>

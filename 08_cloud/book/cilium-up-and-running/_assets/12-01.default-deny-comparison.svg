<title id="dt">규칙이 붙은 방향만 기본 거부로 바뀐다</title><desc id="dd">정책 없음에서 ingress 8080 정책, egress {} 정책으로 갈수록 방향별로 닫히지만 허용된 요청의 응답은 계속 나간다</desc>
<rect width="920" height="436" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 12-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">규칙이 붙은 방향만 기본 거부로 바뀐다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">방향마다 따로 판정되고 응답 패킷은 egress 규칙과 무관하다</text>
<rect x="12" y="96" width="196" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="110.0" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">적용 정책</text>
<rect x="220" y="96" width="220" height="44" rx="6" fill="#161B22" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="330.0" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">들어오는 연결</text>
<rect x="454" y="96" width="220" height="44" rx="6" fill="#161B22" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="564.0" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">나가는 연결</text>
<rect x="688" y="96" width="220" height="44" rx="6" fill="#161B22" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="798.0" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">허용된 요청의 응답</text>
<rect x="12" y="152" width="196" height="56" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="24" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">정책 없음</text>
<text x="24" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">양방향 기본 허용</text>
<rect x="220" y="152" width="220" height="56" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="330.0" y="185" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">8080 · 9113 열림</text>
<rect x="454" y="152" width="220" height="56" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="564.0" y="185" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">모든 목적지 열림</text>
<rect x="688" y="152" width="220" height="56" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="798.0" y="185" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">정상 응답</text>
<rect x="12" y="220" width="196" height="56" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="24" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">ingress 8080 정책</text>
<text x="24" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">ingress 만 기본 거부</text>
<rect x="220" y="220" width="220" height="56" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="330.0" y="253" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">8080 허용 · 9113 차단</text>
<rect x="454" y="220" width="220" height="56" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="564.0" y="253" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">외부 접속 유지</text>
<rect x="688" y="220" width="220" height="56" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="798.0" y="253" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">정상 응답</text>
<rect x="12" y="288" width="196" height="56" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="24" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">+ egress {} 정책</text>
<text x="24" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">양방향 기본 거부</text>
<rect x="220" y="288" width="220" height="56" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="330.0" y="321" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">8080 허용 · 9113 차단</text>
<rect x="454" y="288" width="220" height="56" rx="4" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="564.0" y="321" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">이름 해석부터 차단</text>
<rect x="688" y="288" width="220" height="56" rx="4" fill="#F08A5916" stroke="#F08A59" stroke-width="1.4"/>
<text x="798.0" y="321" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">egress 차단에도 응답</text>
<line x1="12" y1="372" x2="872" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="394" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="384" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">열림</text>
<rect x="170" y="384" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="192" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">일부만 허용</text>
<rect x="292" y="384" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="314" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">차단</text>
<rect x="362" y="384" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="384" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">초점</text>

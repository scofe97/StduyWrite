<title id="dt">Pod 대역 광고와 서비스 IP 광고 구조 비교</title><desc id="dd">PodCIDR 광고는 바뀌는 Pod IP 대역을 외부에 노출하고, Service 광고는 고정된 /32 또는 /128 VIP 만 알린 뒤 노드 eBPF 데이터패스가 Pod 로 분산합니다.</desc>
<rect width="960" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 16-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Pod 대역 광고와 서비스 IP 광고 구조 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위쪽은 Pod 대역을 직접 광고하는 경로, 아래쪽은 고정 VIP 뒤에서 노드가 분산하는 경로입니다.</text>
<rect x="24" y="100" width="912" height="172" rx="8" fill="rgba(245,245,243,0.02)" stroke="rgba(245,245,243,0.16)" stroke-width="0.9"/>
<text x="40" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">PodCIDR 광고 · 바뀌는 Pod IP 직접 노출</text>
<rect x="24" y="296" width="912" height="172" rx="8" fill="rgba(245,245,243,0.02)" stroke="rgba(245,245,243,0.16)" stroke-width="0.9"/>
<text x="40" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">Service 광고 · 고정 VIP 와 데이터패스 분산</text>
<path d="M 196 196 L 324 196" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#warn)"/>
<text x="260" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">Pod IP 로 전송</text>
<path d="M 480 186 L 596 186" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#warn)"/>
<text x="538" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">패킷 전달</text>
<path d="M 596 228 L 480 228" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)" stroke-dasharray="4 3"/>
<text x="538" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">PodCIDR 광고</text>
<path d="M 764 204 L 796 204" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 196 392 L 324 392" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>

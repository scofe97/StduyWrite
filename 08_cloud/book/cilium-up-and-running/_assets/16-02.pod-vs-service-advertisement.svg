<text x="402" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">상류 BGP 피어</text>
<text x="402" y="408" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">LoadBalancerIP</text>
<text x="402" y="430" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">IPv4 공간 절약</text>
<rect x="600" y="352" width="160" height="96" rx="6" fill="#F08A5916" stroke="#F08A59" stroke-width="1.4"/>

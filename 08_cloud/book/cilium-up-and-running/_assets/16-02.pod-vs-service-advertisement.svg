<path d="M 480 382 L 596 382" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="538" y="370" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">패킷 전달</text>
<path d="M 596 424 L 480 424" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)" stroke-dasharray="4 3"/>
<text x="538" y="412" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">/32 · /128 광고</text>

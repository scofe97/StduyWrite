<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Pod 는 내부 CA 가 서명한 인증서로 Envoy 와 TLS 를 맺고, Envoy 는 공개 CA 로 검증하는 새 TLS 로 업스트림에 간다</text>

<title id="dt">HTTPS 요청이 Envoy 에서 끊겼다 다시 맺어지는 흐름</title><desc id="dd">Pod 는 내부 CA 가 서명한 인증서로 Envoy 와 TLS 를 맺고, Envoy 는 공개 CA 로 검증하는 새 TLS 로 업스트림에 간다</desc>

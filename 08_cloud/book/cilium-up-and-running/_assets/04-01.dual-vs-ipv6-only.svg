<title id="dt">듀얼 스택과 IPv6 전용의 주소·외부 통신 경로</title><desc id="dd">듀얼 스택은 IPv4·IPv6 를 함께 두고, IPv6 전용은 IPv4 를 끈 대신 외부 IPv4 에 닿을 때 DNS64 와 NAT64 가 필요합니다</desc>

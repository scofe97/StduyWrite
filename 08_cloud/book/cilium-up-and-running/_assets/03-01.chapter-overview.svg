<title id="dt">NotReady 에서 Hubble 의 판정 기록까지</title><desc id="dd">도구만 갖춘 상태에서 시작한 클러스터가 다섯 상태를 지나고, 상태마다 보이는 값이 바뀐다. NotReady 노드 셋은 Cilium 설치로 cilium 3/3 이 되고, 예제 앱이 서비스 IP 로 응답한 뒤, 정책이 요청을 타임아웃과 403 으로 가르고, Hubble 이 그 판정을 흐름 한 줄로 남긴다.</desc>
<rect width="920" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 03-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">NotReady 에서 Hubble 의 판정 기록까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">카드는 클러스터의 상태와 그때 보이는 값, 화살표 옆 글자는 다음 상태로 넘기는 명령, 칩은 그 상태를 다루는 절입니다.</text>
<circle cx="64" cy="112" r="6" fill="#F5F5F3"/>
<text x="84" y="117" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">도구 준비</text>
<text x="172" y="117" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">brew install kind cilium-cli hubble helm</text>
<rect x="506.18" y="102" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="520" y="116" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§1</text>
<rect x="24" y="152" width="872" height="56" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="40.18" y="170" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="54" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§2</text>
<text x="88" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">CNI 없는 클러스터</text>
<text x="88" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">노드 셋이 일을 받지 못함</text>
<line x1="316" y1="162" x2="316" y2="198" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="336" y="178" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">kubectl get nodes → NotReady ×3</text>
<text x="336" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">NetworkReady=false · cni plugin not initialized</text>
<path d="M 64 124 L 64 150" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="80" y="142.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">kind create cluster --config kind.yaml</text>
<rect x="24" y="244" width="872" height="56" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<rect x="40.18" y="262" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="54" y="276" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">§3</text>
<text x="88" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">Cilium 이 설치됨</text>
<text x="88" y="290" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Pod 네트워크가 열림</text>
<line x1="316" y1="254" x2="316" y2="290" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="336" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">cilium status → Cilium: OK · Operator: OK</text>
<text x="336" y="290" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">cilium 3/3 · cilium-envoy 3/3 · cilium-operator 1/1</text>
<path d="M 64 210 L 64 242" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="80" y="231.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">helm install cilium cilium/cilium -n kube-system</text>
<rect x="24" y="336" width="872" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="40.18" y="354" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="54" y="368" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§4</text>
<text x="88" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">앱이 서비스 IP 로 응답</text>
<text x="88" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">정책 전의 기준선</text>
<line x1="316" y1="346" x2="316" y2="382" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="336" y="362" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">curl 10.96.242.74 → Welcome to nginx!</text>
<text x="336" y="382" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">endpoints 10.244.2.127 → 10.244.2.127,10.244.2.189</text>
<path d="M 64 302 L 64 334" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="80" y="323.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">nginx-deployment · netshoot-client 배포</text>
<rect x="24" y="428" width="872" height="56" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<rect x="40.18" y="446" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="54" y="460" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">§5</text>
<text x="88" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">정책이 요청을 가름</text>
<text x="88" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">라벨 허용과 L7 경로 제한</text>
<line x1="316" y1="438" x2="316" y2="474" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="336" y="454" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">unauthorized-client → exit 28</text>
<text x="336" y="474" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">/50x.html → 403 Access denied</text>
<path d="M 64 394 L 64 426" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="80" y="415.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CiliumNetworkPolicy ch03-policy 적용</text>
<rect x="24" y="520" width="872" height="56" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<rect x="40.18" y="538" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="54" y="552" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">§6</text>
<text x="88" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">판정이 흐름 한 줄로 남음</text>
<text x="88" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Hubble 이 판정을 기록</text>
<line x1="316" y1="530" x2="316" y2="566" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="336" y="546" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">policy-verdict:none INGRESS DENIED</text>
<text x="336" y="566" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">ID:8087 &lt;&gt; ID:5834 · TCP Flags: SYN</text>
<path d="M 64 486 L 64 518" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="80" y="507.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">hubble.relay.enabled=true · hubble observe</text>
<line x1="12" y1="600" x2="872" y2="600" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="622" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

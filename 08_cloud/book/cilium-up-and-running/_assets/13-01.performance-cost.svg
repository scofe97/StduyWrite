<title id="dt">L3/L4 정책과 L7 정책의 처리 성능 비교</title><desc id="dd">Siege 2,500회 요청 기준 커널 eBPF 직결 경로와 Envoy 프록시 경유 경로의 소요 시간 및 처리량 차이</desc>
<rect width="920" height="360" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 13-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">L3/L4 정책과 L7 정책의 처리 성능 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Siege 2,500회 요청 기준 커널 eBPF 직결 경로와 Envoy 프록시 경유 경로의 소요 시간 및 처리량 차이</text>

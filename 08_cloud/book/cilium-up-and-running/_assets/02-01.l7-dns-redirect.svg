<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">Pod 패킷이 eBPF 에서 세 갈래로 갈라지는 길</title><desc id="dd">eBPF 프로그램이 패킷을 판정해 L3·L4 는 커널에서 끝내고, L7 규칙이 걸린 패킷은 Envoy 로, DNS 질의는 에이전트 안의 DNS 프록시로 넘기는 분기</desc>
<rect width="920" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 02-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Pod 패킷이 eBPF 에서 세 갈래로 갈라지는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 옆 글자는 갈래를 고르는 조건이고, Envoy 를 거친 패킷은 eBPF 경로로 돌아와 나갑니다.</text>
<rect x="28" y="108" width="224" height="64" rx="6" fill="#8B98A914" stroke="#8B98A9" stroke-width="1.1"/>
<text x="42" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">Pod</text>
<text x="42" y="154" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">패킷을 보냄</text>
<rect x="330" y="108" width="260" height="64" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.4"/>
<text x="344" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">eBPF 프로그램</text>
<text x="344" y="154" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">tc · tcx 후크에서 패킷 판정</text>
<path d="M 252 140 L 330 140" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="460" y1="172" x2="460" y2="200" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 460 200 L 160 200 L 160 244" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 460 200 L 460 244" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<path d="M 460 200 L 760 200 L 760 244" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="172" y="228" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">L7·FQDN 규칙 없음</text>
<text x="472" y="228" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">L7 규칙 있음</text>
<text x="772" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">FQDN 규칙이 걸린</text>
<text x="772" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">DNS 질의</text>
<rect x="28" y="244" width="264" height="78" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="42" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">커널 데이터패스</text>
<text x="42" y="290" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">L3 · L4 판정으로 전달 또는 차단</text>
<text x="42" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">프록시를 거치지 않음</text>
<rect x="328" y="244" width="264" height="78" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<text x="342" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">cilium-envoy</text>
<text x="342" y="290" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">HTTP 경로 · gRPC · TLS 종단</text>
<text x="342" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">TPROXY 로 수신</text>
<rect x="628" y="244" width="264" height="78" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="642" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">DNS 프록시 · 에이전트 안</text>
<text x="642" y="290" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">UDP/TCP 53 질의를 가로챔</text>
<text x="642" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CoreDNS 중계 · 신원 기록</text>
<path d="M 460 322 L 460 360" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="472" y="346" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">처리를 마친 패킷</text>
<rect x="328" y="360" width="264" height="56" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="342" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">커널 eBPF 경로</text>
<text x="342" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">목적지로 전달</text>
<line x1="12" y1="440" x2="872" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="462" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="452" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">판정하는 곳</text>
<rect x="222" y="452" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="244" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">커널 안에서 끝</text>
<rect x="370" y="452" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="392" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Envoy (L7)</text>
<rect x="544" y="452" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="566" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">DNS 프록시</text>
</svg>
<title id="dt">이름 질의는 모두 통과해도 연결은 응답 IP 로만 열린다</title><desc id="dd">DNS 규칙이 *  이므로 example.com 도 해석되지만, 그 응답 IP 에는 허용 규칙이 붙지 않아 연결이 시간 초과됩니다</desc>
<rect width="920" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 13-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름 질의는 모두 통과해도 연결은 응답 IP 로만 열린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">DNS 규칙이 *  이므로 example.com 도 해석되지만, 그 응답 IP 에는 허용 규칙이 붙지 않아 연결이 시간 초과됩니다</text>
<rect x="24" y="96" width="196" height="32" rx="6" fill="#161B22" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="122.0" y="117" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">요청</text>
<rect x="252" y="96" width="196" height="32" rx="6" fill="#161B22" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="350.0" y="117" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">DNS 프록시</text>
<rect x="480" y="96" width="196" height="32" rx="6" fill="#161B22" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="578.0" y="117" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">IP 캐시 매핑</text>
<rect x="708" y="96" width="196" height="32" rx="6" fill="#161B22" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="806.0" y="117" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">연결 결과</text>
<rect x="24" y="148" width="196" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="122.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">curl cilium.io</text>
<text x="122.0" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">A 질의 → TCP 443</text>
<rect x="252" y="148" width="196" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="350.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">matchPattern "*"</text>
<text x="350.0" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">통과 · 응답 IP 기록</text>
<rect x="480" y="148" width="196" height="100" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="578.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">응답 IP ↔ cilium.io</text>
<text x="578.0" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">identity 등록</text>
<rect x="708" y="148" width="196" height="100" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.3"/>
<text x="806.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">HTTP/2 200</text>
<text x="806.0" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">TCP 443 허용</text>
<path d="M 224 198.0 L 246 198.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 452 198.0 L 474 198.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 680 198.0 L 702 198.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="24" y="272" width="196" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="122.0" y="310" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">curl example.com</text>
<text x="122.0" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">A 질의 → TCP 443</text>
<rect x="252" y="272" width="196" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="350.0" y="310" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">matchPattern "*"</text>
<text x="350.0" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">통과 · 응답 IP 기록</text>
<rect x="480" y="272" width="196" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="578.0" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">ipcache 갱신 없음</text>
<text x="578.0" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">고르는 셀렉터 없음</text>
<rect x="708" y="272" width="196" height="100" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.3"/>
<text x="806.0" y="310" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">curl: (28) 1001ms</text>
<text x="806.0" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">연결 시간 초과</text>
<path d="M 224 322.0 L 246 322.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 452 322.0 L 474 322.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 680 322.0 L 702 322.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="24" y="396" width="196" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="122.0" y="434" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">curl --resolve</text>
<text x="122.0" y="458" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">→ 23.220.75.245:443</text>
<rect x="252" y="396" width="196" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="350.0" y="434" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">DNS 질의 없음</text>
<text x="350.0" y="458" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">프록시를 거치지 않음</text>
<rect x="480" y="396" width="196" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="578.0" y="434" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">이 IP 의 매핑 없음</text>
<text x="578.0" y="458" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">FQDN identity 없음</text>
<rect x="708" y="396" width="196" height="100" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.3"/>
<text x="806.0" y="434" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">curl: (28) 1001ms</text>
<text x="806.0" y="458" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">연결 시간 초과</text>
<path d="M 224 446.0 L 246 446.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 452 446.0 L 474 446.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 680 446.0 L 702 446.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
<title id="dt">구성 요소마다 개인키 · 인증서 · CA 인증서 셋이 필요합니다</title><desc id="dd">개인키는 구성 요소 밖으로 나가지 않는 시크릿이고, 자기 인증서는 상대에게 건네며, 신뢰하는 CA 인증서는 상대에게서 받은 인증서를 검증하는 데 쓴다. Spring 에서는 앞의 둘이 keystore.p12, 마지막이 truststore.p12 에 든다.</desc>
<rect width="960" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 11-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">구성 요소마다 개인키 · 인증서 · CA 인증서 셋이 필요합니다</text>

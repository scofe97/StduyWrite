<svg viewBox="0 0 700 360" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>X.509 인증서로 인증하는 구성 요소가 갖춰야 할 세 가지</title>
  <desc>X.509 인증서로 인증하는 컨테이너나 구성 요소는 세 가지가 필요합니다. 첫째 절대 공유해서는 안 되고 시크릿으로 다뤄야 하는 개인키입니다. 둘째 자유롭게 배포해도 되는 자기 인증서로, 다른 구성 요소가 이것으로 신원을 검증합니다. 셋째 신뢰하는 인증 기관 하나 이상의 인증서로, 다른 구성 요소에게서 받은 인증서를 검증하는 데 씁니다. 인증서는 배포를 위한 것이지만 그것을 쓰려면 각 구성 요소가 대응하는 자기 개인키에도 접근할 수 있어야 합니다. 개인키 같은 시크릿 데이터를 컨테이너에 전달하는 방법이 다음 장의 주제입니다. 또한 공격자가 개인키를 얻으면 그 신원을 사칭할 수 있으므로 만료일을 기다리지 않고 즉시 인증서를 무효화하는 방법이 필요하며 이를 인증서 폐기라 부릅니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .danger-title { fill: #7a1f1f; font-size: 11.5px; font-weight: 700; }
    .danger-detail { fill: #7a1f1f; font-size: 9.5px; }
    .tag { fill: #7a1f1f; font-size: 9.5px; font-weight: 700; }
    .ok-tag { fill: #14521d; font-size: 9.5px; font-weight: 700; }
  </style>

  <rect width="700" height="360" fill="#0d0d0d"/>

  <text class="head" x="40" y="30">구성 요소마다 세 가지가 필요합니다</text>

  <rect class="box" x="40" y="42" width="196" height="120" rx="4"/>
  <text class="box-title" x="56" y="63">개인키</text>
  <text class="box-detail" x="56" y="84">복호화와 서명에 쓴다</text>
  <text class="box-detail" x="56" y="102">공개키는 여기서 나온다</text>
  <text class="box-detail" x="56" y="120">전달 방법은 12장에서</text>
  <text class="tag" x="56" y="146">절대 공유 금지 — 시크릿</text>

  <rect class="box" x="252" y="42" width="196" height="120" rx="4"/>
  <text class="box-title" x="268" y="63">자기 인증서</text>
  <text class="box-detail" x="268" y="84">내 신원과 공개키를 담는다</text>
  <text class="box-detail" x="268" y="102">CA 서명이 붙어 있다</text>
  <text class="box-detail" x="268" y="120">상대가 나를 검증한다</text>
  <text class="ok-tag" x="268" y="146">자유롭게 배포해도 된다</text>

  <rect class="box" x="464" y="42" width="196" height="120" rx="4"/>
  <text class="box-title" x="480" y="63">신뢰하는 CA 인증서</text>
  <text class="box-detail" x="480" y="84">하나 이상 갖는다</text>
  <text class="box-detail" x="480" y="102">받은 인증서를 검증한다</text>
  <text class="box-detail" x="480" y="120">사설 CA 여도 된다</text>
  <text class="ok-tag" x="480" y="146">신뢰의 기준점</text>

  <!-- 폐기 -->
  <text class="head" x="40" y="196">개인키가 새면 — 폐기</text>

  <rect x="40" y="208" width="300" height="88" rx="4" fill="#f2d4d4"/>
  <text class="danger-title" x="56" y="229">공격자가 개인키를 얻으면</text>
  <text class="danger-detail" x="56" y="248">그 신원을 사칭할 수 있다</text>
  <text class="danger-detail" x="56" y="266">공개키로 암호화된 것을 푼다</text>
  <text class="danger-detail" x="56" y="286">만료를 기다릴 수 없습니다</text>

  <rect class="box" x="360" y="208" width="300" height="88" rx="4"/>
  <text class="box-title" x="376" y="229">그래서 신원을 나누지 않습니다</text>
  <text class="box-detail" x="376" y="248">구성 요소마다 따로 발급하면</text>
  <text class="box-detail" x="376" y="266">하나만 폐기하고 나머지는 그대로</text>
  <text class="box-detail" x="376" y="286">권한도 따로 줄 수 있습니다</text>

  <text class="hint" x="40" y="330">폐기 목록을 CRL 이라 부릅니다</text>
</svg>

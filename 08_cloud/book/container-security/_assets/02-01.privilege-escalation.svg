<title id="dt">전통적 머신은 침투 뒤 권한 상승이 따로 필요하지만, 컨테이너는 그 단계가 이미 끝나 있습니다</title><desc id="dd">가로 레인 셋과 단계 넷. 전통적 머신은 비특권 사용자로 침투해 root 로 도는 앱의 취약점을 이용해 root 를 얻는다. 컨테이너는 이미 root 라 권한 상승 칸을 건너뛰고 탈출만 하면 호스트 root 다. 비root 컨테이너에도 setuid 바이너리와 추가 capability 두 경로가 남는다.</desc>
<rect width="960" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SWIMLANE · 02-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">전통적 머신은 침투 뒤 권한 상승이 따로 필요하지만, 컨테이너는 그 단계가 이미 끝나 있습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">컨테이너는 기본이 root 라서 탈출만 하면 호스트에서도 root 이고 더 올릴 권한이 없습니다.</text>

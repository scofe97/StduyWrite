<title id="dt">격리 강화 수단은 시스템 콜이 호스트 커널에 닿는 길로 나뉩니다</title><desc id="dd">왼쪽에서 오른쪽으로 일반 컨테이너와 보안 장치, gVisor, VM 격리 세 열. 보안 장치는 시스템 콜이 호스트 커널로 곧장 가고, gVisor 는 Sentry 를 거쳐 호스트 커널로 가며, Kata·Firecracker·Unikernel 은 게스트 OS 를 거쳐 하이퍼바이저로 간다. 아래 축은 호스트 커널 공유에서 비공유로 이어진다.</desc>
<rect width="984" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 08-01 INTRO</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">격리 강화 수단은 시스템 콜이 호스트 커널에 닿는 길로 나뉩니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">seccomp·AppArmor·SELinux 는 커널을 그대로 공유하고, VM 격리는 커널을 공유하지 않으며, gVisor 가 그 사이에 놓입니다.</text>
<rect x="60" y="96" width="272" height="372" rx="8" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="6 5"/>
<rect x="356" y="96" width="272" height="372" rx="8" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="6 5"/>
<rect x="652" y="96" width="272" height="372" rx="8" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="6 5"/>
<text x="196.0" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">seccomp · AppArmor · SELinux</text>
<text x="196.0" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">일반 컨테이너 + 보안 장치</text>
<path d="M 196.0 222 L 196.0 256" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="208.0" y="245" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">syscall</text>
<path d="M 196.0 342 L 196.0 376" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<rect x="76" y="168" width="240" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="196.0" y="199" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">컨테이너 안 앱</text>
<rect x="76" y="260" width="240" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>

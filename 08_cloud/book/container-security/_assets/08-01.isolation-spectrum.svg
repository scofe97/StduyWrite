<svg viewBox="0 0 700 380" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>격리 강화 수단의 스펙트럼 — 일반 컨테이너에서 가상머신까지</title>
  <desc>두 워크로드가 서로 간섭하지 못하게 하는 접근은 둘입니다. 하나는 서로를 인식하지 못하도록 격리하는 것이고, 다른 하나는 인식하더라도 취할 수 있는 행동을 제한하는 것입니다. 후자를 샌드박싱이라 부릅니다. 이 장의 수단들은 왼쪽에서 오른쪽으로 갈수록 커널 공유가 줄어듭니다. seccomp 와 AppArmor 와 SELinux 는 일반 컨테이너 위에 보안 장치를 덧대며 커널을 그대로 공유합니다. gVisor 는 시스템 콜을 가로채 사용자 공간에서 다시 구현해 컨테이너와 가상머신 사이에 놓입니다. Kata Containers 와 Firecracker 와 Unikernel 은 하이퍼바이저 격리를 써서 커널을 공유하지 않습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .axis { stroke: #4a4540; stroke-width: 1; fill: none; }
    .warn-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .warn-detail { fill: #0d0d0d; font-size: 9.5px; }
  </style>

  <rect width="700" height="380" fill="#0d0d0d"/>

  <defs>
    <marker id="uh8" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <text class="head" x="40" y="30">오른쪽일수록 커널 공유가 준다</text>

  <path class="arrow" d="M40,48 L660,48" marker-end="url(#uh8)"/>

  <!-- 1군 -->
  <rect class="box" x="40" y="62" width="196" height="116" rx="4"/>
  <text class="box-title" x="56" y="83">컨테이너 + 보안 장치</text>
  <text class="box-detail" x="56" y="102">seccomp · AppArmor</text>
  <text class="box-detail" x="56" y="118">SELinux</text>
  <text class="box-detail" x="56" y="136">커널은 그대로 공유</text>
  <text class="box-detail" x="56" y="154">검증됐지만 관리가 어렵다</text>
  <text class="box-detail" x="56" y="172">저수준 행동을 단속</text>

  <!-- 2군 -->
  <rect class="box" x="252" y="62" width="196" height="116" rx="4"/>
  <text class="box-title" x="268" y="83">중간 — gVisor</text>
  <text class="box-detail" x="268" y="102">syscall 을 가로채 재구현</text>
  <text class="box-detail" x="268" y="120">사용자 공간 커널</text>
  <text class="box-detail" x="268" y="138">호스트에서 프로세스가 안 보인다</text>
  <text class="box-detail" x="268" y="156">미구현 syscall 이 남는다</text>
  <text class="box-detail" x="268" y="172">syscall 많으면 성능 영향</text>

  <!-- 3군 -->
  <rect class="box" x="464" y="62" width="196" height="116" rx="4"/>
  <text class="box-title" x="480" y="83">가상머신 격리</text>
  <text class="box-detail" x="480" y="102">Kata · Firecracker</text>
  <text class="box-detail" x="480" y="118">Unikernel</text>
  <text class="box-detail" x="480" y="136">커널을 공유하지 않는다</text>
  <text class="box-detail" x="480" y="154">하이퍼바이저가 경계</text>
  <text class="box-detail" x="480" y="172">Firecracker 는 100ms</text>

  <path class="axis" d="M138,178 L138,196"/>
  <path class="axis" d="M350,178 L350,196"/>
  <path class="axis" d="M562,178 L562,196"/>

  <!-- 공유 커널 경고 -->
  <rect x="40" y="208" width="408" height="80" rx="4" fill="rgb(212,168,83)"/>
  <text class="warn-title" x="56" y="230">앞의 둘이 못 막는 것</text>
  <text class="warn-detail" x="56" y="250">사용자 공간 앱의 행동은 제한하지만</text>
  <text class="warn-detail" x="56" y="268">커널은 여전히 공유됩니다</text>
  <text class="warn-detail" x="56" y="284">Dirty COW 는 못 막는다</text>

  <rect class="box" x="464" y="208" width="196" height="80" rx="4"/>
  <text class="box-title" x="480" y="230">샌드박싱이란</text>
  <text class="box-detail" x="480" y="250">자원 접근을 제한해</text>
  <text class="box-detail" x="480" y="268">앱을 가두는 것</text>
  <text class="box-detail" x="480" y="284">컨테이너가 좋은 단위</text>

  <text class="hint" x="40" y="322">리스크 프로파일에 달렸습니다</text>
  <text class="hint" x="40" y="342">클라우드가 주는 선택지도 변수입니다</text>
  <text class="hint" x="40" y="362">어느 쪽이든 9장에서 깨집니다</text>
</svg>

<svg viewBox="0 0 700 380" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>공개키·개인키 쌍의 두 가지 용도 — 암호화와 서명</title>
  <desc>개인키가 먼저 만들어지고 거기서 대응하는 공개키를 계산해 냅니다. 공개키는 누구에게나 나눠 줄 수 있지만 대응하는 개인키는 소유자가 절대 공개해서는 안 됩니다. 이 쌍은 두 가지 쓸모가 있습니다. 첫째 공개키로 메시지를 암호화하면 대응하는 개인키를 가진 사람만 복호화할 수 있습니다. 둘째 개인키로 메시지에 서명하면 대응하는 공개키를 가진 누구든 그 메시지가 개인키 소유자에게서 왔는지 검증할 수 있습니다. 방향이 반대라는 점이 핵심입니다. 암호화는 보내는 쪽이 공개키를 쓰고 받는 쪽이 개인키를 쓰며, 서명은 보내는 쪽이 개인키를 쓰고 받는 쪽이 공개키를 씁니다. 안전한 연결을 세울 때 이 두 능력이 모두 쓰입니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .code { fill: #0d0d0d; font-size: 9.5px; font-weight: 700; font-family: 'Menlo', 'Consolas', monospace; }
    .chip-text { fill: #0d0d0d; font-size: 9.5px; font-weight: 700; }
    .chip { fill: #f5edda; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .danger-detail { fill: #7a1f1f; font-size: 9.5px; font-weight: 700; }
    .lbl { fill: #b8b3ad; font-size: 9.5px; font-weight: 700; }
  </style>

  <rect width="700" height="380" fill="#0d0d0d"/>

  <defs>
    <marker id="uh11" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <text class="head" x="40" y="30">개인키가 먼저입니다</text>

  <rect class="box" x="40" y="42" width="240" height="66" rx="4"/>
  <text class="box-title" x="56" y="63">개인키</text>
  <text class="danger-detail" x="56" y="82">절대 공개하지 않는다</text>
  <text class="box-detail" x="56" y="99">이것이 먼저 생성됩니다</text>

  <path class="arrow" d="M280,75 L326,75" marker-end="url(#uh11)"/>
  <text class="lbl" x="286" y="67">계산</text>

  <rect class="box" x="330" y="42" width="240" height="66" rx="4"/>
  <text class="box-title" x="346" y="63">공개키</text>
  <text class="box-detail" x="346" y="82">누구에게나 나눠 준다</text>
  <text class="box-detail" x="346" y="99">개인키에서 유도됩니다</text>

  <!-- 용도 1 암호화 -->
  <text class="head" x="40" y="150">용도 하나 — 암호화</text>

  <rect class="box" x="40" y="162" width="180" height="72" rx="4"/>
  <text class="box-title" x="56" y="183">보내는 쪽</text>
  <rect class="chip" x="56" y="192" width="100" height="15" rx="3"/>
  <text class="chip-text" x="60" y="203">공개키로 잠근다</text>
  <text class="box-detail" x="56" y="224">누구나 할 수 있다</text>

  <path class="arrow" d="M220,198 L268,198" marker-end="url(#uh11)"/>

  <rect class="box" x="272" y="162" width="180" height="72" rx="4"/>
  <text class="box-title" x="288" y="183">받는 쪽</text>
  <rect class="chip" x="288" y="192" width="100" height="15" rx="3"/>
  <text class="chip-text" x="292" y="203">개인키로 연다</text>
  <text class="box-detail" x="288" y="224">소유자만 할 수 있다</text>

  <rect class="box" x="472" y="162" width="188" height="72" rx="4"/>
  <text class="box-title" x="488" y="183">얻는 것</text>
  <text class="box-detail" x="488" y="202">제3자가 내용을 못 본다</text>
  <text class="box-detail" x="488" y="222">기밀성</text>

  <!-- 용도 2 서명 -->
  <text class="head" x="40" y="276">용도 둘 — 서명</text>

  <rect class="box" x="40" y="288" width="180" height="72" rx="4"/>
  <text class="box-title" x="56" y="309">보내는 쪽</text>
  <rect class="chip" x="56" y="318" width="100" height="15" rx="3"/>
  <text class="chip-text" x="60" y="329">개인키로 서명</text>
  <text class="box-detail" x="56" y="350">소유자만 할 수 있다</text>

  <path class="arrow" d="M220,324 L268,324" marker-end="url(#uh11)"/>

  <rect class="box" x="272" y="288" width="180" height="72" rx="4"/>
  <text class="box-title" x="288" y="309">받는 쪽</text>
  <rect class="chip" x="288" y="318" width="100" height="15" rx="3"/>
  <text class="chip-text" x="292" y="329">공개키로 검증</text>
  <text class="box-detail" x="288" y="350">누구나 할 수 있다</text>

  <rect class="box" x="472" y="288" width="188" height="72" rx="4"/>
  <text class="box-title" x="488" y="309">얻는 것</text>
  <text class="box-detail" x="488" y="328">보낸 사람이 맞는지 안다</text>
  <text class="box-detail" x="488" y="348">신원 확인</text>
</svg>

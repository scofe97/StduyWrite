<svg viewBox="0 0 700 380" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>eBPF 로 관찰하기와 원문이 말한 강제의 한계</title>
  <desc>컨테이너 안에서 실행되는 실행 파일을 어떻게 포착할 수 있는지가 문제입니다. 이를 위한 기술 하나가 eBPF 입니다. Tracee 같은 도구가 eBPF 를 써서 커널에 코드를 삽입하므로 root 로 실행해야 합니다. nginx 컨테이너를 띄우면 정상적으로는 nginx 프로세스만 보여야 하는데, 컨테이너 안에서 다른 명령을 실행하면 그 실행 파일이 도구의 출력에 나타납니다. 공격자가 암호화폐 채굴기를 컨테이너 안에 넣으면 채굴기 실행 파일이 시작될 때 도구가 그것을 포착할 수 있습니다. 런타임 보안 도구는 이런 관찰을 수행해 실행 파일 이름을 허용 목록이나 차단 목록과 비교합니다. 다만 원문 집필 시점 기준으로 eBPF 는 시스템 콜을 탐지할 수는 있어도 수정할 수는 없어서, 공격을 관찰하고 알리는 데는 효율적이고 강력하지만 실제로 막으려면 다른 장치가 필요했습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .code { fill: #0d0d0d; font-size: 9.5px; font-weight: 700; font-family: 'Menlo', 'Consolas', monospace; }
    .chip { fill: #f5edda; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .warn-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .warn-detail { fill: #0d0d0d; font-size: 9.5px; }
    .ok-detail { fill: #14521d; font-size: 9.5px; font-weight: 700; }
    .danger-detail { fill: #7a1f1f; font-size: 9.5px; font-weight: 700; }
  </style>

  <rect width="700" height="380" fill="#0d0d0d"/>

  <defs>
    <marker id="uh13d" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <text class="head" x="40" y="30">커널에 코드를 넣어 관찰합니다</text>

  <rect class="box" x="40" y="42" width="190" height="80" rx="4"/>
  <text class="box-title" x="56" y="63">컨테이너</text>
  <text class="box-detail" x="56" y="82">실행 파일이 뜬다</text>
  <rect class="chip" x="56" y="90" width="90" height="15" rx="3"/>
  <text class="code" x="60" y="101">execve</text>
  <text class="box-detail" x="56" y="116">시스템 콜이 발생</text>

  <path class="arrow" d="M230,82 L268,82" marker-end="url(#uh13d)"/>

  <rect class="box" x="272" y="42" width="190" height="80" rx="4"/>
  <text class="box-title" x="288" y="63">eBPF 프로브</text>
  <text class="box-detail" x="288" y="82">커널에 코드를 삽입한다</text>
  <text class="box-detail" x="288" y="100">그래서 root 로 돈다</text>
  <text class="box-detail" x="288" y="116">Tracee 와 Falco 의 방식</text>

  <path class="arrow" d="M462,82 L500,82" marker-end="url(#uh13d)"/>

  <rect class="box" x="504" y="42" width="156" height="80" rx="4"/>
  <text class="box-title" x="520" y="63">이름 대조</text>
  <text class="box-detail" x="520" y="82">허용 목록과 비교</text>
  <text class="box-detail" x="520" y="100">채굴기가 보이면</text>
  <text class="box-detail" x="520" y="116">경보를 올린다</text>

  <!-- 관찰 예 -->
  <rect class="box" x="40" y="140" width="300" height="76" rx="4"/>
  <text class="box-title" x="56" y="161">정상일 때 보이는 것</text>
  <rect class="chip" x="56" y="169" width="180" height="15" rx="3"/>
  <text class="code" x="60" y="180">execve /usr/sbin/nginx</text>
  <text class="ok-detail" x="56" y="202">기대한 그대로입니다</text>

  <rect class="box" x="360" y="140" width="300" height="76" rx="4"/>
  <text class="box-title" x="376" y="161">exec 을 하면 드러납니다</text>
  <rect class="chip" x="376" y="169" width="130" height="15" rx="3"/>
  <text class="code" x="380" y="180">execve /bin/ls</text>
  <text class="danger-detail" x="376" y="202">프로파일 밖 실행 파일</text>

  <!-- 한계 -->
  <rect x="40" y="234" width="620" height="82" rx="4" fill="rgb(212,168,83)"/>
  <text class="warn-title" x="56" y="255">원문이 짚은 한계</text>
  <text class="warn-detail" x="56" y="274">탐지는 되지만 수정은 안 된다</text>
  <text class="warn-detail" x="56" y="292">막으려면 다른 장치가 필요하다</text>
  <text class="warn-detail" x="56" y="308">Falco 는 경보로 사람을 부른다</text>

  <text class="hint" x="40" y="344">이 한계는 BPF LSM 으로 달라짐</text>
  <text class="hint" x="40" y="364">심화 학습에서 다룹니다</text>
</svg>

<svg viewBox="0 0 680 360" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Linux가 지원하는 namespace 종류와 각각이 격리하는 것</title>
  <desc>종류마다 하나씩 속한다. UTS는 호스트명과 도메인명을, PID는 보이는 프로세스 ID를, mount는 마운트 지점을, network는 네트워크 스택을, user는 사용자와 그룹 ID를, IPC는 프로세스 간 통신을, cgroup은 cgroup 계층의 시야를 격리합니다. 가장 먼저 생긴 것은 mount namespace로 리눅스 커널 2.4.19에 들어왔습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 12px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10px; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .chip { fill: #f5edda; }
    .chip-text { fill: #0d0d0d; font-size: 9.5px; font-weight: 700; font-family: 'Menlo', 'Consolas', monospace; }
  </style>

  <rect width="680" height="360" fill="#0d0d0d"/>

  <text class="head" x="40" y="32">namespace는 무엇을 격리하는가</text>

  <!-- 1행 -->
  <rect class="box" x="40" y="44" width="195" height="62" rx="4"/>
  <text class="box-title" x="56" y="66">UTS</text>
  <text class="box-detail" x="56" y="84">호스트명 · 도메인명</text>
  <rect class="chip" x="56" y="90" width="60" height="14" rx="3"/>
  <text class="chip-text" x="60" y="101">--uts</text>

  <rect class="box" x="245" y="44" width="195" height="62" rx="4"/>
  <text class="box-title" x="261" y="66">PID</text>
  <text class="box-detail" x="261" y="84">보이는 프로세스 ID</text>
  <rect class="chip" x="261" y="90" width="60" height="14" rx="3"/>
  <text class="chip-text" x="265" y="101">--pid</text>

  <rect class="box" x="450" y="44" width="190" height="62" rx="4"/>
  <text class="box-title" x="466" y="66">Mount</text>
  <text class="box-detail" x="466" y="84">마운트 지점</text>
  <rect class="chip" x="466" y="90" width="70" height="14" rx="3"/>
  <text class="chip-text" x="470" y="101">--mount</text>

  <!-- 2행 -->
  <rect class="box" x="40" y="118" width="195" height="62" rx="4"/>
  <text class="box-title" x="56" y="140">Network</text>
  <text class="box-detail" x="56" y="158">네트워크 스택</text>
  <rect class="chip" x="56" y="164" width="60" height="14" rx="3"/>
  <text class="chip-text" x="60" y="175">--net</text>

  <rect class="box" x="245" y="118" width="195" height="62" rx="4"/>
  <text class="box-title" x="261" y="140">User</text>
  <text class="box-detail" x="261" y="158">사용자 · 그룹 ID</text>
  <rect class="chip" x="261" y="164" width="60" height="14" rx="3"/>
  <text class="chip-text" x="265" y="175">--user</text>

  <rect class="box" x="450" y="118" width="190" height="62" rx="4"/>
  <text class="box-title" x="466" y="140">IPC</text>
  <text class="box-detail" x="466" y="158">프로세스 간 통신</text>
  <rect class="chip" x="466" y="164" width="60" height="14" rx="3"/>
  <text class="chip-text" x="470" y="175">--ipc</text>

  <!-- 3행 -->
  <rect class="box" x="40" y="192" width="195" height="62" rx="4"/>
  <text class="box-title" x="56" y="214">Cgroup</text>
  <text class="box-detail" x="56" y="232">cgroup 계층의 시야</text>
  <rect class="chip" x="56" y="238" width="70" height="14" rx="3"/>
  <text class="chip-text" x="60" y="249">--cgroup</text>

  <rect class="box" x="245" y="192" width="395" height="62" rx="4"/>
  <text class="box-title" x="261" y="214">가장 먼저 생긴 것은 mount</text>
  <text class="box-detail" x="261" y="232">Linux 2.4.19 에 도입</text>
  <text class="box-detail" x="261" y="248">Plan 9 에서 유래</text>

  <text class="hint" x="40" y="288">종류마다 하나씩 속한다</text>
  <text class="hint" x="40" y="308">목록은 lsns로 본다</text>
  <text class="hint" x="40" y="328">root로 실행해야 전체가 보인다</text>
</svg>

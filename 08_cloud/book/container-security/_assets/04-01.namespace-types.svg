<title id="dt">프로세스는 일곱 종류의 namespace 에 각각 하나씩 속합니다</title><desc id="dd">프로세스 하나에서 UTS, Process ID, Mount points, Network, User and group IDs, IPC, Control groups 일곱 갈래가 나온다. 종류마다 호스트명, 프로세스 ID, 마운트 지점, 네트워크 스택, 사용자와 그룹 ID, 프로세스 간 통신, cgroup 계층을 따로 보게 만든다. 이 편에서 unshare 로 직접 만드는 것은 UTS, PID, mount 세 종류다.</desc>
<rect width="984" height="652" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 04-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로세스는 일곱 종류의 namespace 에 각각 하나씩 속합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">파란 행은 이 편에서 unshare 로 직접 만들어 보는 종류, 나머지는 소개만 합니다.</text>
<text x="388" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">종류</text>
<text x="572" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">격리하는 대상</text>
<text x="772" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">이 편의 실습</text>
<line x1="254" y1="338" x2="312" y2="338" stroke="#5E6B7E" stroke-width="1.3"/>
<line x1="312" y1="146" x2="312" y2="530" stroke="#5E6B7E" stroke-width="1.3"/>
<path d="M 312 146 L 368 146" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 312 210 L 368 210" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 312 274 L 368 274" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 312 338 L 368 338" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 312 402 L 368 402" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 312 466 L 368 466" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 312 530 L 368 530" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="372" y="120" width="576" height="52" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="388" y="151.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">UTS</text>
<text x="572" y="151.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">호스트명과 도메인명</text>
<text x="772" y="151.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">unshare --uts sh</text>
<rect x="372" y="184" width="576" height="52" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="388" y="215.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">Process ID</text>
<text x="572" y="215.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">보이는 프로세스 ID</text>
<text x="772" y="215.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">unshare --pid --fork</text>
<rect x="372" y="248" width="576" height="52" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="388" y="279.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">Mount points</text>
<text x="572" y="279.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">마운트 지점</text>
<text x="772" y="279.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">unshare --mount sh</text>
<rect x="372" y="312" width="576" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="388" y="343.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">Network</text>
<text x="572" y="343.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">네트워크 스택</text>
<rect x="372" y="376" width="576" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="388" y="407.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">User and group IDs</text>
<text x="572" y="407.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">사용자와 그룹 ID</text>
<rect x="372" y="440" width="576" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="388" y="471.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">IPC</text>
<text x="572" y="471.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">프로세스 간 통신</text>
<rect x="372" y="504" width="576" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="388" y="535.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">Control groups</text>
<text x="572" y="535.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">cgroup 계층의 시야</text>
<rect x="36" y="288" width="216" height="100" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="144.0" y="320" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">프로세스</text>
<text x="144.0" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">종류마다 정확히 하나</text>
<text x="144.0" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">부팅 직후엔 종류별 1개</text>
<text x="144.0" y="420" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">전체 목록 확인</text>
<text x="144.0" y="440" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">sudo lsns</text>
<line x1="12" y1="588" x2="936" y2="588" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="610" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="600" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="610" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로세스</text>
<rect x="196" y="600" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="218" y="610" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 편에서 실습</text>
<rect x="344" y="600" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="366" y="610" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소개만</text>
</svg>
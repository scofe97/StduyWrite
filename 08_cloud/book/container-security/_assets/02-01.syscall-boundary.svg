<svg viewBox="0 0 660 380" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>유저 공간과 커널 공간의 경계와 시스템 콜</title>
  <desc>앱은 유저 공간에서 돌며 커널보다 낮은 권한을 갖습니다. 파일을 읽거나 네트워크로 통신하거나 시각을 알아내는 일조차 직접 하지 못하고 커널에 대신 해 달라고 요청해야 합니다. 그 요청 통로가 시스템 콜 인터페이스입니다. 앱 개발자는 보통 glibc나 Go의 syscall 패키지 같은 상위 추상화를 거치므로 시스템 콜을 직접 다루는 일이 드뭅니다. 한 호스트의 모든 컨테이너가 같은 커널에 시스템 콜을 보낸다는 점이 보안상 중요합니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 12.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10px; }
    .zone { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .boundary { stroke: #b8b3ad; stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .call { fill: #3a3632; font-size: 10px; font-family: 'Menlo', 'Consolas', monospace; }
    .caution-title { fill: #0d0d0d; font-size: 12.5px; font-weight: 700; }
    .caution-detail { fill: #0d0d0d; font-size: 10px; }
  </style>

  <rect width="660" height="380" fill="#0d0d0d"/>

  <defs>
    <marker id="ch" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <text class="zone" x="40" y="32">유저 공간 — 낮은 권한</text>

  <!-- 컨테이너 A -->
  <rect class="box" x="40" y="48" width="180" height="58" rx="4"/>
  <text class="box-title" x="56" y="72">컨테이너 A의 앱</text>
  <text class="box-detail" x="56" y="90">상위 추상화 경유</text>

  <!-- 컨테이너 B -->
  <rect class="box" x="240" y="48" width="180" height="58" rx="4"/>
  <text class="box-title" x="256" y="72">컨테이너 B의 앱</text>
  <text class="box-detail" x="256" y="90">상위 추상화 경유</text>

  <!-- 호스트 프로세스 -->
  <rect class="box" x="440" y="48" width="180" height="58" rx="4"/>
  <text class="box-title" x="456" y="72">호스트의 일반 프로세스</text>
  <text class="box-detail" x="456" y="90">같은 방식으로 호출</text>

  <path class="arrow" d="M130,106 L130,150" marker-end="url(#ch)"/>
  <path class="arrow" d="M330,106 L330,150" marker-end="url(#ch)"/>
  <path class="arrow" d="M530,106 L530,150" marker-end="url(#ch)"/>

  <!-- 경계 -->
  <path class="boundary" d="M40,160 L620,160"/>
  <text class="hint" x="620" y="176" text-anchor="end">시스템 콜 인터페이스 · 300여 종</text>

  <!-- syscall 예시 -->
  <rect class="box" x="40" y="190" width="580" height="56" rx="4"/>
  <text class="box-title" x="56" y="212">시스템 콜 예</text>
  <text class="call" x="56" y="232">read · write · open · execve · chown · clone</text>

  <path class="arrow" d="M330,246 L330,272" marker-end="url(#ch)"/>

  <text class="zone" x="40" y="292">커널 공간 — 높은 권한</text>

  <!-- 커널 — 주의 -->
  <rect x="40" y="300" width="580" height="58" rx="4" fill="rgb(212,168,83)"/>
  <text class="caution-title" x="56" y="324">주의 · 커널은 하나뿐</text>
  <text class="caution-detail" x="56" y="343">모든 컨테이너가 공유</text>
</svg>

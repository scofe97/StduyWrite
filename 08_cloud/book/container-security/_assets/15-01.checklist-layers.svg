<title id="dt">열아홉 항목은 안쪽에서 바깥으로 다섯 계층이고 런타임이 전부를 가로지른다</title><desc id="dd">컨테이너 실행 권한, 이미지와 공급망, 커널 격리, 컴포넌트 사이 통신, 호스트와 클라우드 순으로 묶고, 런타임 보호와 드리프트 방지는 어느 계층에도 속하지 않고 다섯 계층을 모두 가로지른다.</desc>

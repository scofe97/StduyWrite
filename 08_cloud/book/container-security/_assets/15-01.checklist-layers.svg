<svg viewBox="0 0 700 470" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>체크리스트 19개 항목을 방어 계층으로 묶은 배치</title>
  <desc>저자는 체크리스트를 평평한 목록으로 제시했지만 항목들은 방어 계층별로 묶입니다. 가장 안쪽은 컨테이너 자신의 실행 권한으로 비root 실행과 privileged 플래그 회피와 capability 축소와 읽기 전용 파일시스템과 자원 한계가 여기 듭니다. 그 바깥은 이미지와 공급망으로 베이스 이미지 최소화와 취약점 스캔과 불변 컨테이너와 어드미션 컨트롤이 듭니다. 그 바깥은 커널이 강제하는 격리로 seccomp와 AppArmor와 SELinux 프로파일이 듭니다. 그 바깥은 컴포넌트 사이 통신으로 상호 TLS와 네트워크 정책과 시크릿 전달이 듭니다. 가장 바깥은 호스트와 클라우드로 전용 호스트와 최신 보안 패치와 CSPM 점검과 CIS 벤치마크가 듭니다. 여기에 계층에 속하지 않고 전체를 가로지르는 런타임 축이 있는데 실행 파일 감시와 드리프트 방지가 여기 듭니다. 한 계층이 뚫려도 다음 계층이 남는다는 심층 방어가 이 배치의 취지입니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .ch { fill: #3a3632; font-size: 9px; font-weight: 700; }
    .cnt { fill: #b8b3ad; font-size: 9.5px; font-weight: 700; }
    .cross-title { fill: #0d0d0d; font-size: 11px; font-weight: 700; }
    .cross-detail { fill: #0d0d0d; font-size: 9.5px; }
  </style>

  <rect width="700" height="470" fill="#0d0d0d"/>

  <text class="head" x="40" y="28">안쪽에서 바깥으로</text>

  <rect class="box" x="40" y="40" width="620" height="64" rx="4"/>
  <text class="box-title" x="56" y="61">컨테이너의 실행 권한</text>
  <text class="box-detail" x="56" y="80">비root · cap 축소</text>
  <text class="box-detail" x="56" y="96">privileged 회피 · 자원제한</text>
  <text class="ch" x="596" y="61">2·3·9장</text>
  <text class="cnt" x="596" y="80">5개 항목</text>

  <rect class="box" x="40" y="116" width="620" height="64" rx="4"/>
  <text class="box-title" x="56" y="137">이미지와 공급망</text>
  <text class="box-detail" x="56" y="156">베이스 이미지 최소화</text>
  <text class="box-detail" x="56" y="172">스캔 · 어드미션 컨트롤</text>
  <text class="ch" x="596" y="137">6·7장</text>
  <text class="cnt" x="596" y="156">4개 항목</text>

  <rect class="box" x="40" y="192" width="620" height="64" rx="4"/>
  <text class="box-title" x="56" y="213">커널이 강제하는 격리</text>
  <text class="box-detail" x="56" y="232">seccomp · AppArmor</text>
  <text class="box-detail" x="56" y="248">지원하면 SELinux 까지</text>
  <text class="ch" x="596" y="213">8장</text>
  <text class="cnt" x="596" y="232">2개 항목</text>

  <rect class="box" x="40" y="268" width="620" height="64" rx="4"/>
  <text class="box-title" x="56" y="289">컴포넌트 사이 통신</text>
  <text class="box-detail" x="56" y="308">상호 TLS · 네트워크 정책</text>
  <text class="box-detail" x="56" y="324">시크릿은 임시 파일시스템</text>
  <text class="ch" x="596" y="289">10·11·12장</text>
  <text class="cnt" x="596" y="308">3개 항목</text>

  <rect class="box" x="40" y="344" width="620" height="64" rx="4"/>
  <text class="box-title" x="56" y="365">호스트와 클라우드</text>
  <text class="box-detail" x="56" y="384">전용 호스트 · 패치 유지</text>
  <text class="box-detail" x="56" y="400">CSPM · CIS 벤치마크</text>
  <text class="ch" x="596" y="365">6·14장</text>
  <text class="cnt" x="596" y="384">3개 항목</text>

  <rect x="40" y="420" width="620" height="42" rx="4" fill="rgb(212,168,83)"/>
  <text class="cross-title" x="56" y="441">계층을 가로지르는 런타임</text>
  <text class="cross-detail" x="56" y="456">실행 파일 감시 · 드리프트 방지</text>
</svg>

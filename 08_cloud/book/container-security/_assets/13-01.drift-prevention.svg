<title id="dt">스캔 때 뜬 파일 지문이 런타임 실행의 허가증이 됩니다</title><desc id="dd">스캐너가 이미지 안 파일들의 지문을 떠 목록으로 남기고, 런타임에는 컨테이너가 새 실행 파일을 시작할 때마다 강제 도구가 그 지문과 대조한다. 동일하면 실행하고, 동일하지 않으면 permission denied로 막는다. 이름이 같아도 지문이 다르면 거부된다.</desc>
<rect width="960" height="564" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 13-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스캔 때 뜬 파일 지문이 런타임 실행의 허가증이 됩니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이름만 대조했다면 같은 이름을 붙인 주입 파일이 통과했을 것입니다.</text>
<rect x="16" y="92" width="700" height="112" rx="8" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="6 5"/>
<text x="32" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">스캔 단계 · 배포 전</text>
<rect x="16" y="228" width="928" height="252" rx="8" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="6 5"/>
<text x="32" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">런타임 · 컨테이너 안</text>
<path d="M 228 160 L 260 160" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<path d="M 464 160 L 496 160" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="28" y="132" width="200" height="56" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="44" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">이미지 속 파일</text>
<text x="44" y="176" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">productsearch</text>

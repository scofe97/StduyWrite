<svg viewBox="0 0 700 360" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>드리프트 방지 — 스캔의 지문과 런타임 검사를 잇는 구조</title>
  <desc>컨테이너를 불변으로 다루는 것이 모범 사례입니다. 컨테이너는 이미지에서 생성되고 그 뒤로 내용이 바뀌면 안 됩니다. 애플리케이션 코드에 필요한 실행 파일과 의존성은 그 이미지에 포함돼 있어야 합니다. 앞서 취약점 탐지 관점에서 이를 다뤘는데, 이미지에 포함되지 않은 코드는 취약점을 스캔할 수 없기 때문입니다. 컨테이너를 불변으로 다루면 런타임에 코드 주입을 탐지하는 강력한 선택지가 하나 더 생기는데 그것이 드리프트 방지입니다. 이는 스캔 단계와 런타임 단계의 협력을 필요로 합니다. 스캐너가 스캔의 일부로 이미지 안 파일들의 지문을 뜹니다. 런타임에는 강제 도구가 컨테이너가 새 실행 파일 프로세스를 시작할 때마다 검사를 추가합니다. 이 강제 도구가 실행 파일을 스캔 단계의 파일 지문과 비교하고, 파일이 동일하지 않으면 실행이 허용되지 않아 컨테이너 안에서 권한 거부 오류가 납니다. 파일 이름 목록이 아니라 지문을 쓰기 때문에 공격자가 주입한 실행 파일을 정당한 것으로 위장하는 것을 막을 수 있습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .code { fill: #0d0d0d; font-size: 9.5px; font-weight: 700; font-family: 'Menlo', 'Consolas', monospace; }
    .chip { fill: #f5edda; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .ok-detail { fill: #14521d; font-size: 9.5px; font-weight: 700; }
    .danger-detail { fill: #7a1f1f; font-size: 9.5px; font-weight: 700; }
    .blocked { stroke: #7a1f1f; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
  </style>

  <rect width="700" height="360" fill="#0d0d0d"/>

  <defs>
    <marker id="uh13c" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
    <marker id="rd13c" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#7a1f1f"/>
    </marker>
  </defs>

  <text class="head" x="40" y="30">스캔과 런타임이 협력합니다</text>

  <!-- 스캔 단계 -->
  <rect class="box" x="40" y="42" width="260" height="86" rx="4"/>
  <text class="box-title" x="56" y="63">스캔 단계</text>
  <text class="box-detail" x="56" y="82">이미지 안 파일의 지문을 뜬다</text>
  <text class="box-detail" x="56" y="100">7장의 그 스캔에 얹힌다</text>
  <rect class="chip" x="56" y="108" width="140" height="15" rx="3"/>
  <text class="code" x="60" y="119">file fingerprints</text>

  <path class="arrow" d="M300,85 L358,85" marker-end="url(#uh13c)"/>
  <text class="box-detail" x="304" y="77">지문을 넘김</text>

  <!-- 런타임 단계 -->
  <rect class="box" x="362" y="42" width="298" height="86" rx="4"/>
  <text class="box-title" x="378" y="63">런타임 단계</text>
  <text class="box-detail" x="378" y="82">새 실행 파일이 뜰 때마다 검사</text>
  <text class="box-detail" x="378" y="100">지문과 대조한다</text>
  <text class="box-detail" x="378" y="118">동일하지 않으면 실행 불가</text>

  <!-- 두 갈래 결과 -->
  <text class="head" x="40" y="172">실행 시도가 갈리는 지점</text>

  <rect x="40" y="184" width="300" height="76" rx="4" fill="#cdeccf"/>
  <text class="box-title" x="56" y="205">지문이 일치</text>
  <text class="ok-detail" x="56" y="224">이미지에 있던 그 파일이다</text>
  <text class="ok-detail" x="56" y="244">평소처럼 실행됩니다</text>

  <rect x="360" y="184" width="300" height="76" rx="4" fill="#f2d4d4"/>
  <text class="box-title" x="376" y="205">지문이 다름</text>
  <text class="danger-detail" x="376" y="224">런타임에 주입된 코드다</text>
  <rect class="chip" x="376" y="232" width="150" height="15" rx="3"/>
  <text class="code" x="380" y="243">permission denied</text>

  <path class="blocked" d="M510,260 L510,282" marker-end="url(#rd13c)"/>

  <!-- 이름이 아니라 지문인 이유 -->
  <rect class="box" x="40" y="288" width="620" height="56" rx="4"/>
  <text class="box-title" x="56" y="309">파일 이름이 아니라 지문을 쓰는 이유</text>
  <text class="box-detail" x="56" y="330">이름 위장 수법을 막습니다</text>
</svg>

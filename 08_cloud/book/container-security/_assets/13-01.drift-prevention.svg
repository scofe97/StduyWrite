<text x="44" y="320" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">productsearch</text>
<text x="44" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">스캔 때 지문 기록</text>
<path d="M 340 424 L 496 424" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

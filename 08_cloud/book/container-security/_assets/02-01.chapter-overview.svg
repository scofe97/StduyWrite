<path d="M 508.0 298 L 508.0 348" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 168.0 324 L 168.0 348" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 848.0 324 L 848.0 348" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="520.0" y="317" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">막는 방법</text>
<rect x="60" y="352" width="216" height="64" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="168.0" y="379" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">setcap 한 조각만</text>
<text x="168.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">setuid 대신</text>

<svg viewBox="0 0 660 340" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>ls -l 권한 아홉 글자를 셋씩 끊어 읽기</title>
  <desc>ls -l 이 보여 주는 권한 문자열은 아홉 글자이며 셋씩 세 묶음으로 읽습니다. 첫 묶음은 파일 소유자, 둘째 묶음은 파일이 속한 그룹의 구성원, 셋째 묶음은 그 외 모든 사용자의 권한입니다. 각 묶음 안의 세 자리는 차례로 읽기와 쓰기와 실행을 뜻하며 대시는 그 비트가 꺼져 있다는 표시입니다. 책의 예에서 소유자만 쓸 수 있고, 소유자와 staff 그룹은 실행할 수 있으며, 모두가 읽을 수 있습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 12.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10px; }
    .mono { font-family: 'Menlo', 'Consolas', monospace; }
    .bits { fill: #0d0d0d; font-size: 20px; font-weight: 700; letter-spacing: 3px; }
    .who { fill: #b8b3ad; font-size: 10.5px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .tick { stroke: #b8b3ad; stroke-width: 1.2; fill: none; }
    .chip { fill: #f5edda; }
    .chip-text { fill: #0d0d0d; font-size: 11px; font-weight: 700; }
  </style>

  <rect width="660" height="340" fill="#0d0d0d"/>

  <!-- 원문 ls -l 한 줄 -->
  <text class="hint" x="40" y="34">원문 서술로 복원한 예</text>
  <rect class="box" x="40" y="44" width="580" height="44" rx="4"/>
  <text class="mono bits" x="56" y="74" font-size="14">-rwxr-xr--  liz  staff  myapp</text>

  <!-- 아홉 글자 분해 -->
  <rect class="chip" x="60" y="120" width="120" height="46" rx="4"/>
  <text class="mono bits" x="120" y="152" text-anchor="middle">rwx</text>

  <rect class="chip" x="200" y="120" width="120" height="46" rx="4"/>
  <text class="mono bits" x="260" y="152" text-anchor="middle">r-x</text>

  <rect class="chip" x="340" y="120" width="120" height="46" rx="4"/>
  <text class="mono bits" x="400" y="152" text-anchor="middle">r--</text>

  <text class="who" x="120" y="184" text-anchor="middle">소유자 liz</text>
  <text class="who" x="260" y="184" text-anchor="middle">그룹 staff</text>
  <text class="who" x="400" y="184" text-anchor="middle">그 외 모두</text>

  <path class="tick" d="M60,196 L180,196"/>
  <path class="tick" d="M200,196 L320,196"/>
  <path class="tick" d="M340,196 L460,196"/>

  <!-- 각 자리 의미 -->
  <rect class="box" x="40" y="216" width="580" height="44" rx="4"/>
  <text class="box-title" x="56" y="236">세 자리의 뜻</text>
  <text class="box-detail" x="56" y="252">r 읽기 · w 쓰기 · x 실행</text>

  <text class="hint" x="40" y="288">이 예에서 쓰기는 소유자만</text>
  <text class="hint" x="40" y="306">실행은 소유자와 staff</text>
  <text class="hint" x="340" y="288">읽기는 세 묶음 모두 켜짐</text>
  <text class="hint" x="340" y="306">DAC — 임의 접근 제어</text>
</svg>

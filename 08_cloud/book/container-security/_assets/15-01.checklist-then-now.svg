<svg viewBox="0 0 700 416" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>체크리스트 항목 중 질문은 남고 답이 바뀐 것들</title>
  <desc>체크리스트는 질문 목록이라 항목 자체는 오래 갑니다. 다만 그 질문에 답하는 수단은 여섯 해 사이에 여러 개가 바뀌었습니다. 어드미션 컨트롤 항목은 원문 시점에 PodSecurityPolicy 가 대표 수단이었으나 그것이 제거되고 Pod Security Admission 과 정책 엔진으로 갈렸습니다. seccomp 와 AppArmor 항목은 애노테이션으로 붙이던 것이 securityContext 정식 필드가 됐습니다. 읽기 전용 항목도 PodSecurityPolicy 의 필드에서 securityContext 필드로 옮겨졌습니다. 런타임 도구 항목은 감시만 하던 eBPF 가 BPF LSM 으로 거부까지 하게 됐습니다. 시크릿 항목은 임시 파일시스템 위에 Secrets Store CSI Driver 라는 선택지가 더해졌습니다. 반면 그대로인 것도 있습니다. 비root 실행과 privileged 회피와 capability 축소와 CIS 벤치마크와 전용 호스트는 여섯 해 뒤에도 답이 같습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .same-title { fill: #14521d; font-size: 11px; font-weight: 700; }
    .same-detail { fill: #14521d; font-size: 9.5px; }
    .q { fill: #b8b3ad; font-size: 9.5px; font-weight: 700; }
  </style>

  <rect width="700" height="416" fill="#0d0d0d"/>

  <text class="head" x="40" y="28">질문은 남고 답이 바뀐 것</text>

  <rect class="box" x="40" y="40" width="620" height="230" rx="4"/>

  <text class="q" x="56" y="64">어드미션 컨트롤이 있는가</text>
  <text class="box-detail" x="56" y="82">PSP 제거 → PSA · 정책 엔진</text>

  <text class="q" x="56" y="108">seccomp 를 붙였는가</text>
  <text class="box-detail" x="56" y="126">애노테이션 → 정식 필드</text>

  <text class="q" x="56" y="152">읽기 전용으로 돌리는가</text>
  <text class="box-detail" x="56" y="170">PSP → 컨테이너 필드로</text>

  <text class="q" x="56" y="196">런타임 보호 도구를 쓰는가</text>
  <text class="box-detail" x="56" y="214">감시만 → BPF LSM 이 거부</text>

  <text class="q" x="56" y="240">시크릿을 임시 FS 로 넘기는가</text>
  <text class="box-detail" x="56" y="258">CSI Driver 선택지가 추가</text>

  <text class="head" x="40" y="300">답까지 그대로인 것</text>

  <rect x="40" y="312" width="620" height="76" rx="4" fill="#cdeccf"/>
  <text class="same-title" x="56" y="333">여섯 해가 지나도 같은 답</text>
  <text class="same-detail" x="56" y="352">비root · cap 축소</text>
  <text class="same-detail" x="56" y="370">CIS 점검 · 전용 호스트</text>

  <text class="hint" x="40" y="406">바뀐 쪽 K8s, 그대로 커널</text>
</svg>

<title id="dt">질문은 그대로이고 답은 다섯 항목에서 바뀌었다</title><desc id="dd">어드미션 컨트롤은 PodSecurityPolicy 에서 Pod Security Admission 으로, seccomp·AppArmor 는 애노테이션에서 securityContext 필드로, 읽기 전용은 readOnlyRootFilesystem 으로, 런타임 보호는 관찰만 하던 eBPF 에서 BPF LSM 으로, 시크릿 전달은 Secrets Store CSI Driver 가 더해졌다. 비root·--privileged·capability·CIS 벤치마크·컨테이너 전용 호스트는 답이 같다.</desc>
<rect width="960" height="744" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 15-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">질문은 그대로이고 답은 다섯 항목에서 바뀌었다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">체크리스트 질문별로 원문 시점의 답과 지금의 답을 잇고 바뀐 곳을 꼬리표로 단 도식</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">질문</text>

<title id="dt">1세대는 허용 목록이 고정이고, seccomp-bpf 는 프로세스마다 프로파일로 판정합니다</title><desc id="dd">시스템 콜이 어느 세대 seccomp 에 걸리는지에서 갈라지는 흐름. 1세대(2005)는 sigreturn, exit, read, write 네 개만 허용해 쓸모 있는 일을 거의 못 한다. seccomp-bpf(2012)는 프로세스마다 BPF 프로파일이 시스템 콜 opcode 와 인자를 보고 허용, 오류 반환, 프로세스 종료, 트레이서 호출 중 하나로 판정한다. 아래 띠는 Docker 기본 프로파일이 막는 호스트 시계, 커널 모듈, 커널 키링 시스템 콜이다.</desc>
<rect width="984" height="724" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 08-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">1세대는 허용 목록이 고정이고, seccomp-bpf 는 프로세스마다 프로파일로 판정합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세대가 바뀌며 달라진 것은 판정 단위가 고정 목록에서 프로세스별 프로파일로 옮겨 갔다는 점입니다.</text>

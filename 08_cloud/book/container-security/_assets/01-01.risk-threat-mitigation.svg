<svg viewBox="0 0 660 360" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>리스크와 위협과 완화의 관계</title>
  <desc>리스크는 일어나면 곤란한 문제 그 자체이고, 위협은 그 리스크에 이르는 여러 갈래의 경로이며, 완화는 그 경로를 막는 대응책입니다. 저자의 자동차 키 비유로 보면 차를 도둑맞는 것이 리스크이고, 창문을 깨거나 우편함으로 낚싯대를 넣거나 초인종을 눌러 주의를 돌리는 것이 각각의 위협이며, 키를 눈에 안 띄는 곳에 두는 것이 세 위협을 한꺼번에 막는 완화입니다. 리스크는 조직마다 다르므로 위협의 중요도와 완화의 선택도 함께 달라집니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 12.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10px; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .block { stroke: #b8b3ad; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
  </style>

  <rect width="660" height="360" fill="#0d0d0d"/>

  <defs>
    <marker id="ah5" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <text class="head" x="40" y="34">위협 — 리스크로 가는 경로</text>
  <text class="head" x="620" y="34" text-anchor="end">리스크</text>

  <!-- 위협 3갈래 -->
  <rect class="box" x="40" y="52" width="220" height="46" rx="4"/>
  <text class="box-title" x="54" y="72">창문을 깬다</text>
  <text class="box-detail" x="54" y="89">물리적 침입</text>

  <rect class="box" x="40" y="112" width="220" height="46" rx="4"/>
  <text class="box-title" x="54" y="132">우편함에 낚싯대</text>
  <text class="box-detail" x="54" y="149">경계 우회</text>

  <rect class="box" x="40" y="172" width="220" height="46" rx="4"/>
  <text class="box-title" x="54" y="192">주의를 돌린다</text>
  <text class="box-detail" x="54" y="209">사회공학</text>

  <!-- 완화 게이트 -->
  <path class="block" d="M300,44 L300,226"/>
  <text class="head" x="308" y="130">완화</text>
  <text class="hint" x="308" y="146">키를 숨긴다</text>
  <text class="hint" x="308" y="162">세 경로를 함께 막는다</text>

  <!-- 화살표 -->
  <path class="arrow" d="M260,75 L296,75"/>
  <path class="arrow" d="M260,135 L296,135"/>
  <path class="arrow" d="M260,195 L296,195"/>

  <path class="arrow" d="M304,135 L440,135" marker-end="url(#ah5)"/>

  <!-- 리스크 -->
  <rect class="box" x="450" y="102" width="170" height="66" rx="4"/>
  <text class="box-title" x="464" y="126">차를 도둑맞는다</text>
  <text class="box-detail" x="464" y="144">문제와 그 여파</text>

  <text class="hint" x="40" y="266">리스크는 조직마다 다르다</text>
  <text class="hint" x="40" y="286">은행은 자금 · 이커머스는 부정거래</text>
  <text class="hint" x="40" y="306">유럽은 개인정보 유출에 과징금</text>
  <text class="hint" x="40" y="326">그래서 위협의 우선순위도 달라진다</text>
</svg>

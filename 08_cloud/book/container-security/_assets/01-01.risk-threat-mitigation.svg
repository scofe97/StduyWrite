<title id="dt">완화 하나가 위협 세 경로를 한꺼번에 막습니다</title><desc id="dd">차 키를 훔쳐 차를 몰고 가는 리스크로 가는 길이 셋이다. 창문을 깨고 손을 넣는 길, 우편함에 낚싯대를 넣는 길, 초인종으로 주의를 끈 사이 공범이 들어오는 길이다. 키를 눈에 안 띄는 곳에 두면 세 길이 모두 끊긴다.</desc>
<rect width="984" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DATA-FLOW · 01-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">완화 하나가 위협 세 경로를 한꺼번에 막습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">리스크는 문제 자체, 위협은 거기로 가는 길, 완화는 그 길을 끊는 대응입니다.</text>
<text x="36" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">위협 — 리스크로 가는 길</text>
<text x="544.0" y="108" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">완화</text>
<text x="724" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">리스크</text>
<rect x="464" y="132" width="160" height="264" rx="6" fill="#F08A591F" stroke="#F08A59" stroke-width="1.6"/>
<text x="544.0" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">키를 눈에</text>
<text x="544.0" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">안 띄는 곳에</text>
<text x="544.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">둔다</text>
<rect x="724" y="132" width="224" height="264" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="836.0" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">차 키 도난</text>
<text x="836.0" y="282" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">차를 몰고 감</text>
<rect x="36" y="132" width="332" height="72" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="52" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<text x="202.0" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">창문 깨고 손 넣기</text>
<text x="202.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">유리를 깨고 키를 집음</text>
<path d="M 370 168 L 460 168" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)"/>
<line x1="628" y1="168" x2="720" y2="168" stroke="#5E6B7E" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="36" y="228" width="332" height="72" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="52" y="252" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">2</text>
<text x="202.0" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">우편함에 낚싯대</text>
<text x="202.0" y="282" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">넣어서 키를 끌어냄</text>
<path d="M 370 264 L 460 264" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)"/>
<line x1="628" y1="264" x2="720" y2="264" stroke="#5E6B7E" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="36" y="324" width="332" height="72" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="52" y="348" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">3</text>
<text x="202.0" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">초인종 눌러 주의 끌기</text>
<text x="202.0" y="378" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그 사이 공범이 들어옴</text>
<path d="M 370 360 L 460 360" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)"/>
<line x1="628" y1="360" x2="720" y2="360" stroke="#5E6B7E" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="674.0" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">닿지 못함</text>
<text x="544.0" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">세 길 모두 여기서 끊김</text>
<line x1="12" y1="464" x2="936" y2="464" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="486" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="476" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">리스크</text>
<rect x="183" y="476" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="205" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">위협</text>
<rect x="253" y="476" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="275" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">완화</text>
</svg>
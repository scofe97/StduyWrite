<title id="dt">user namespace 가 컨테이너 안의 root 를 호스트의 비특권 사용자로 바꿉니다</title><desc id="dd">04-02 의 키워드 개념도. 첫 줄은 network namespace 가 lo 하나로 시작해 veth 쌍으로 바깥과 이어지는 흐름이다. 둘째 줄은 user namespace 가 uid_map 의 0 1000 1 로 컨테이너 root 를 호스트의 비특권 사용자에 대응시켜 rootless 컨테이너를 가능하게 하는 흐름이다. 셋째 줄은 IPC namespace 를 ipcs 로 확인하고 커널 4.6 에서 추가된 cgroup namespace 로 이어지는 흐름이다. 넷째 줄은 컨테이너 안 PID 10 이 호스트에서 PID 30591 로 보이고, 그래서 컨테이너 전용 호스트를 권하는 흐름이다.</desc>
<rect width="984" height="664" fill="#0D1117"/>

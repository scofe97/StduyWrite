<title id="dt">컨테이너 보안은 새 경계를 어디에 세우고 어떻게 지킬지의 문제입니다</title><desc id="dd">01-01 의 키워드 개념도. 윗줄은 리스크가 위협을 거쳐 완화로 이어지는 용어 구분이다. 가운데 줄은 공격 벡터 9종이 체이닝으로 이어져 보안 경계를 넘는 모습이다. 아랫줄은 경계의 강도를 정하는 멀티테넌시와 그 판단에 쓰는 보안 원칙이다.</desc>
<rect width="984" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 01-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">컨테이너 보안은 새 경계를 어디에 세우고 어떻게 지킬지의 문제입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

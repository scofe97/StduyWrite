<svg viewBox="0 0 660 430" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>cgroup에 한도를 걸고 프로세스를 배정하는 네 단계</title>
  <desc>먼저 memory 계층 아래에 디렉토리를 만들어 cgroup을 만듭니다. 다음으로 한도 파일에 원하는 바이트 수를 써 넣는데, 커널이 페이지 단위로 반올림하므로 되읽으면 값이 조금 달라집니다. 이어서 프로세스 ID를 cgroup.procs 파일에 써 넣으면 그 프로세스가 이 cgroup의 구성원이 됩니다. 마지막으로 그 프로세스가 한도를 넘으려 하면 커널이 죽입니다. 책의 예에서는 한도가 100킬로바이트 미만이라 ls 명령조차 실행되지 못하고 죽습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 12.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10px; }
    .cmd { fill: #0d0d0d; font-size: 10.5px; font-weight: 700; font-family: 'Menlo', 'Consolas', monospace; }
    .chip { fill: #f5edda; }
    .num { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .danger-title { fill: #7a1f1f; font-size: 12.5px; font-weight: 700; }
    .danger-cmd { fill: #7a1f1f; font-size: 10.5px; font-weight: 700; font-family: 'Menlo', 'Consolas', monospace; }
  </style>

  <rect width="660" height="430" fill="#0d0d0d"/>

  <defs>
    <marker id="hh" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <text class="num" x="34" y="48">1.</text>
  <rect class="box" x="54" y="24" width="566" height="60" rx="4"/>
  <text class="box-title" x="70" y="46">cgroup을 만든다</text>
  <rect class="chip" x="70" y="56" width="220" height="18" rx="3"/>
  <text class="cmd" x="76" y="69">mkdir memory/liz</text>

  <path class="arrow" d="M337,84 L337,102" marker-end="url(#hh)"/>

  <text class="num" x="34" y="126">2.</text>
  <rect class="box" x="54" y="102" width="566" height="76" rx="4"/>
  <text class="box-title" x="70" y="124">한도를 써 넣는다</text>
  <rect class="chip" x="70" y="134" width="290" height="18" rx="3"/>
  <text class="cmd" x="76" y="147">echo 100000 &gt; memory.limit_in_bytes</text>
  <text class="box-detail" x="70" y="170">되읽으면 98304로 맞춰진다</text>

  <path class="arrow" d="M337,178 L337,196" marker-end="url(#hh)"/>

  <text class="num" x="34" y="220">3.</text>
  <rect class="box" x="54" y="196" width="566" height="76" rx="4"/>
  <text class="box-title" x="70" y="218">프로세스를 배정한다</text>
  <rect class="chip" x="70" y="228" width="220" height="18" rx="3"/>
  <text class="cmd" x="76" y="241">echo 29903 &gt; cgroup.procs</text>
  <text class="box-detail" x="70" y="264">PID를 파일에 쓰는 것이 전부다</text>

  <path class="arrow" d="M337,272 L337,290" marker-end="url(#hh)"/>

  <text class="num" x="34" y="314">4.</text>
  <rect x="54" y="290" width="566" height="76" rx="4" fill="#f2d4d4"/>
  <text class="danger-title" x="70" y="312">한도를 넘으면 죽는다</text>
  <rect class="chip" x="70" y="322" width="120" height="18" rx="3"/>
  <text class="danger-cmd" x="76" y="335">$ ls</text>
  <rect class="chip" x="70" y="344" width="120" height="16" rx="3"/>
  <text class="danger-cmd" x="76" y="356">Killed</text>

  <text class="danger-title" x="230" y="337" font-size="11">한도가 100kB 미만이라</text>
  <text class="danger-title" x="230" y="355" font-size="11">ls 조차 실행되지 못한다</text>

  <text class="hint" x="54" y="396">런타임이 대신 해 준다</text>
  <rect class="chip" x="54" y="402" width="180" height="18" rx="3"/>
  <text class="cmd" x="60" y="415">docker run --memory 100M</text>
</svg>

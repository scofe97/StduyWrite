<title id="dt">OWASP 열 가지 리스크 중 컨테이너 고유 수단이 붙는 것은 일곱</title><desc id="dd">인젝션 · XML 외부 엔티티 · XSS 는 막다른 길이고, 나머지는 앞 장의 수단이 붙는다. 가장 자주 나온 권고는 이미지 스캔이다.</desc>

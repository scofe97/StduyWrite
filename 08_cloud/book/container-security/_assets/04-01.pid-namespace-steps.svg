<title id="dt">PID namespace 는 두 번 실패한 원인을 하나씩 메워야 온전히 동작합니다</title><desc id="dd">첫 시도 sudo unshare --pid sh 는 첫 whoami 만 되고 이후 Cannot fork 가 난다. 원인은 sh 가 sudo 의 자식이라는 것이고 --fork 로 고친다. 둘째 시도는 명령은 되지만 ps 가 호스트 프로세스 전체를 보여 준다. 원인은 ps 가 /proc 을 읽는다는 것이고 루트를 바꿔 별도 /proc 을 마운트한다. 셋째 시도는 unshare --pid --fork chroot alpine sh 뒤 mount -t proc proc /proc 로 ps 가 자기 프로세스만 보여 준다.</desc>
<rect width="984" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 04-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">PID namespace 는 두 번 실패한 원인을 하나씩 메워야 온전히 동작합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 번의 실패는 막다른 길이 아니라, 각각 다음 시도가 더할 것을 알려 주는 단서입니다.</text>

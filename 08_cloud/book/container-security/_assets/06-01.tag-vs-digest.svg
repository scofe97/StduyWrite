<title id="dt">태그는 오늘과 내일 다른 이미지를 주고, 다이제스트는 늘 같은 이미지를 줍니다</title><desc id="dd">위쪽 띠는 층 blob 에서 이미지 매니페스트를 거쳐 다이제스트가 나오는 길이다. 아래 시퀀스에서 받는 쪽이 pull :1.0 으로 이미지 A 를 받은 뒤 이미지 관리자가 :1.0 을 이미지 B 로 재태그하면, 내일의 pull :1.0 은 이미지 B 를 돌려주고 pull @sha256 다이제스트는 여전히 이미지 A 를 돌려준다.</desc>
<rect width="984" height="788" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 06-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">태그는 오늘과 내일 다른 이미지를 주고, 다이제스트는 늘 같은 이미지를 줍니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">다이제스트는 이미지 매니페스트의 해시라서 이미지가 바뀌면 달라집니다.</text>

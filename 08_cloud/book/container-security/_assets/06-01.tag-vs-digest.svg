<svg viewBox="0 0 680 380" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>태그로 가리키기와 다이제스트로 가리키기의 차이</title>
  <desc>이미지 주소는 레지스트리 주소와 조직 이름과 저장소 이름으로 시작하고, 마지막에 태그나 다이제스트가 붙습니다. 태그는 사람이 읽기 쉬운 임의의 라벨이라 한 이미지에 여러 개를 붙일 수 있고 다른 이미지로 옮길 수도 있습니다. 그래서 오늘 태그로 받은 것과 내일 받는 것이 같다는 보장이 없습니다. 다이제스트는 이미지 내용의 해시라 내용이 조금이라도 바뀌면 값이 달라지므로 언제 받아도 같은 이미지를 얻습니다. 취약점 스캔 기록처럼 이미지를 유일하게 지목해야 하는 곳에서는 태그로 관리하면 신뢰할 수 없습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 12.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10px; }
    .code { fill: #0d0d0d; font-size: 9.5px; font-weight: 700; font-family: 'Menlo', 'Consolas', monospace; }
    .chip { fill: #f5edda; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .move { stroke: #7a1f1f; stroke-width: 1.6; stroke-dasharray: 5 3; fill: none; }
    .caution-title { fill: #0d0d0d; font-size: 12.5px; font-weight: 700; }
    .caution-detail { fill: #0d0d0d; font-size: 10px; }
  </style>

  <rect width="680" height="380" fill="#0d0d0d"/>

  <defs>
    <marker id="th" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
    <marker id="tm" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#7a1f1f"/>
    </marker>
  </defs>

  <text class="head" x="40" y="30">이미지 주소의 형태</text>

  <rect class="box" x="40" y="42" width="600" height="60" rx="4"/>
  <rect class="chip" x="56" y="54" width="480" height="18" rx="3"/>
  <text class="code" x="62" y="67">registry/organization/repository:tag</text>
  <rect class="chip" x="56" y="76" width="480" height="18" rx="3"/>
  <text class="code" x="62" y="89">registry/organization/repository@sha256:digest</text>

  <!-- 태그 -->
  <text class="head" x="40" y="134">태그 · 움직인다</text>

  <rect x="40" y="146" width="290" height="94" rx="4" fill="rgb(212,168,83)"/>
  <text class="caution-title" x="56" y="168">주의 · 같은 태그가 옮겨 간다</text>
  <rect class="chip" x="56" y="178" width="120" height="18" rx="3"/>
  <text class="code" x="62" y="191">trivy:0.2.1</text>
  <text class="caution-detail" x="56" y="212">한 이미지에 여러 태그를 붙인다</text>
  <text class="caution-detail" x="56" y="230">오늘과 내일이 같다는 보장이 없다</text>

  <!-- 다이제스트 -->
  <text class="head" x="360" y="134">다이제스트 · 고정된다</text>

  <rect class="box" x="360" y="146" width="280" height="94" rx="4"/>
  <text class="box-title" x="376" y="168">내용의 해시라 안 바뀐다</text>
  <rect class="chip" x="376" y="178" width="200" height="18" rx="3"/>
  <text class="code" x="382" y="191">trivy@sha256:4c0b03c2...</text>
  <text class="box-detail" x="376" y="212">내용이 바뀌면 해시도 바뀐다</text>
  <text class="box-detail" x="376" y="230">언제 받아도 같은 이미지</text>

  <path class="move" d="M120,246 L120,266" marker-end="url(#tm)"/>
  <path class="arrow" d="M470,246 L470,266" marker-end="url(#th)"/>

  <!-- 판단 -->
  <rect class="box" x="40" y="272" width="600" height="66" rx="4"/>
  <text class="box-title" x="56" y="294">어느 쪽을 쓸지는 목적이 정한다</text>
  <text class="box-detail" x="56" y="314">패치 자동 수령엔 태그</text>
  <text class="box-detail" x="56" y="330">유일 지목엔 다이제스트</text>

  <text class="hint" x="40" y="364">태그 기록은 재스캔 판단 불가</text>
</svg>

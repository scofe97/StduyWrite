<title id="dt">디렉토리를 만들면 커널이 그 안을 cgroup 파일로 채웁니다</title><desc id="dd">/sys/fs/cgroup 아래에 자원 종류마다 계층이 있고, memory 계층에서 mkdir memory/liz 로 cgroup liz 를 만들면 커널이 memory.limit_in_bytes · cgroup.procs 같은 쓰기 파일과 memory.usage_in_bytes · memory.max_usage_in_bytes 같은 읽기 통계 파일을 채운다. 컨테이너를 시작하면 런타임이 docker 아래에 컨테이너 ID 이름의 cgroup 을 만든다.</desc>
<rect width="984" height="476" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TREE · 03-01 §2~3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">디렉토리를 만들면 커널이 그 안을 cgroup 파일로 채웁니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">디렉토리 하나가 cgroup 하나이고, 값을 쓰는 파일이 곧 조작 수단입니다.</text>
<text x="256" y="104" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">자원 종류마다 계층</text>

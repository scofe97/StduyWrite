<svg viewBox="0 0 700 400" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Kubernetes 기본 시크릿이 충족하는 기준과 남는 구멍</title>
  <desc>Kubernetes 를 쓴다면 기본 시크릿 지원이 이 장 앞부분의 기준 상당수를 충족합니다. 시크릿이 독립된 자원으로 만들어지므로 그것을 쓰는 애플리케이션 코드의 생애주기에 묶이지 않습니다. 저장 시 암호화가 가능하지만 기본 활성이 아니라 명시적으로 켜야 합니다. 구성 요소 사이 전송 중에는 암호화되는데, 이는 Kubernetes 구성 요소 사이에 안전한 연결이 있어야 가능하고 대부분의 배포판에서는 기본적으로 그렇습니다. 환경 변수 방식뿐 아니라 파일 방식도 지원해서 메모리에 유지되고 디스크에 절대 쓰이지 않는 임시 파일시스템에 파일로 마운트합니다. RBAC 을 설정해 사용자가 시크릿을 설정할 수는 있지만 다시 읽지는 못하게 쓰기 전용 권한을 줄 수 있습니다. 다만 기본적으로 시크릿 값은 etcd 에 base64 로 인코딩될 뿐 암호화되지 않은 채 저장됩니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .code { fill: #0d0d0d; font-size: 9.5px; font-weight: 700; font-family: 'Menlo', 'Consolas', monospace; }
    .chip { fill: #f5edda; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .ok-tag { fill: #14521d; font-size: 9.5px; font-weight: 700; }
    .warn-title { fill: #0d0d0d; font-size: 11px; font-weight: 700; }
    .warn-detail { fill: #0d0d0d; font-size: 9.5px; }
  </style>

  <rect width="700" height="400" fill="#0d0d0d"/>

  <text class="head" x="40" y="30">기본 지원이 충족하는 것</text>

  <rect class="box" x="40" y="42" width="196" height="88" rx="4"/>
  <text class="box-title" x="56" y="63">독립된 자원</text>
  <text class="box-detail" x="56" y="82">앱 코드 생애주기와 분리</text>
  <text class="box-detail" x="56" y="100">따로 만들고 따로 바꾼다</text>
  <text class="ok-tag" x="56" y="120">기준 충족</text>

  <rect class="box" x="252" y="42" width="196" height="88" rx="4"/>
  <text class="box-title" x="268" y="63">파일 마운트 지원</text>
  <text class="box-detail" x="268" y="82">메모리 임시 파일시스템</text>
  <text class="box-detail" x="268" y="100">디스크에 쓰이지 않는다</text>
  <text class="ok-tag" x="268" y="120">선호 방식 지원</text>

  <rect class="box" x="464" y="42" width="196" height="88" rx="4"/>
  <text class="box-title" x="480" y="63">RBAC 쓰기 전용</text>
  <text class="box-detail" x="480" y="82">설정은 하되 다시 못 읽게</text>
  <text class="box-detail" x="480" y="100">사람에게 최소 노출</text>
  <text class="ok-tag" x="480" y="120">기준 충족</text>

  <!-- 남는 구멍 -->
  <text class="head" x="40" y="164">주의할 두 지점</text>

  <rect x="40" y="176" width="300" height="94" rx="4" fill="rgb(212,168,83)"/>
  <text class="warn-title" x="56" y="197">저장 시 암호화는 기본이 아닙니다</text>
  <text class="warn-detail" x="56" y="216">직접 켜야 합니다</text>
  <rect class="chip" x="56" y="224" width="180" height="15" rx="3"/>
  <text class="code" x="60" y="235">--encryption-provider-config</text>
  <text class="warn-detail" x="56" y="256">안 켜면 etcd 에 base64 로</text>

  <rect x="360" y="176" width="300" height="94" rx="4" fill="rgb(212,168,83)"/>
  <text class="warn-title" x="376" y="197">전송 암호화는 전제가 붙습니다</text>
  <text class="warn-detail" x="376" y="216">구성 요소 사이 연결이</text>
  <text class="warn-detail" x="376" y="234">안전해야 성립합니다</text>
  <text class="warn-detail" x="376" y="256">대개 배포판 기본값이긴 합니다</text>

  <!-- 전용 솔루션 -->
  <rect class="box" x="40" y="288" width="620" height="76" rx="4"/>
  <text class="box-title" x="56" y="309">기업이 전용 솔루션을 고르는 이유</text>
  <text class="box-detail" x="56" y="328">인증서 순환 시 갱신을 피한다</text>
  <text class="box-detail" x="56" y="346">여러 클러스터 공유 · 감사 표준화</text>

  <text class="hint" x="40" y="388">base64 는 암호화가 아닙니다</text>
</svg>

<title id="dt">Kubernetes Secret 은 다섯 기준 중 넷을 채우고 저장 시 암호화가 남습니다</title><desc id="dd">사용자가 만든 Secret 은 독립된 자원으로 etcd 에 base64 로 저장되고, 전송 중 암호화를 거쳐 노드의 tmpfs 파일로 컨테이너에 마운트된다. 독립된 생애주기, 전송 중 암호화, 파일 방식, 최소 노출 네 기준은 충족하고 저장 시 암호화는 기본으로 꺼져 있다.</desc>
<rect width="960" height="464" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 12-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Kubernetes Secret 은 다섯 기준 중 넷을 채우고 저장 시 암호화가 남습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">etcd 에 base64 로만 저장되는 것이 구멍이고, 켠다 해도 복호화 키를 호스트에 두지 않아야 합니다</text>

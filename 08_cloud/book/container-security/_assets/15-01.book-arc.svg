<svg viewBox="0 0 700 336" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>맺음말이 되짚는 책 전체의 네 갈래</title>
  <desc>저자는 맺음말에서 독자가 네 가지를 얻었기를 바란다고 적습니다. 첫째는 컨테이너가 무엇인가에 대한 튼튼한 멘탈 모델인데 이것이 있어야 배포를 어떻게 지킬지 논의할 수 있고 일반 컨테이너로 격리가 모자랄 때 다른 선택지를 고를 수 있습니다. 둘째는 컨테이너가 서로 그리고 바깥과 어떻게 통신하는지에 대한 이해인데 여기서 가장 중요한 것은 컨테이너가 배포의 단위일 뿐 아니라 보안의 단위이기도 하다는 점입니다. 셋째는 계층 방어가 침해 상황에서 도움이 된다는 감각인데 공격자가 취약점 하나를 이용해도 넘지 못할 벽이 더 남아 있고 계층이 많을수록 공격 성공 가능성이 낮아집니다. 넷째는 십사장에서 본 것처럼 가장 흔히 악용되는 웹 공격에 컨테이너 고유의 예방 조치를 붙일 수 있다는 것입니다. 다만 저자는 그 십대 목록이 배포의 모든 약점을 덮지 않는다고 덧붙이며 일장의 컨테이너 위협 모델과 부록의 체크리스트로 돌아가 보라고 권합니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .ch { fill: #3a3632; font-size: 9px; font-weight: 700; }
    .back-title { fill: #0d0d0d; font-size: 11px; font-weight: 700; }
    .back-detail { fill: #0d0d0d; font-size: 9.5px; }
  </style>

  <rect width="700" height="336" fill="#0d0d0d"/>

  <text class="head" x="40" y="28">저자가 남기를 바란 네 가지</text>

  <rect class="box" x="40" y="40" width="305" height="88" rx="4"/>
  <text class="box-title" x="56" y="61">컨테이너의 멘탈 모델</text>
  <text class="box-detail" x="56" y="80">무엇이 컨테이너를 만드는가</text>
  <text class="box-detail" x="56" y="98">모자라면 다른 선택지로</text>
  <text class="ch" x="288" y="61">2~5·8장</text>

  <rect class="box" x="355" y="40" width="305" height="88" rx="4"/>
  <text class="box-title" x="371" y="61">통신 방식의 이해</text>
  <text class="box-detail" x="371" y="80">배포 단위이자</text>
  <text class="box-detail" x="371" y="98">보안 단위이기도 하다</text>
  <text class="ch" x="612" y="61">10·11장</text>

  <rect class="box" x="40" y="140" width="305" height="88" rx="4"/>
  <text class="box-title" x="56" y="161">계층 방어의 감각</text>
  <text class="box-detail" x="56" y="180">뚫려도 넘을 벽이 남는다</text>
  <text class="box-detail" x="56" y="198">많을수록 성공률이 낮다</text>
  <text class="ch" x="288" y="161">책 전체</text>

  <rect class="box" x="355" y="140" width="305" height="88" rx="4"/>
  <text class="box-title" x="371" y="161">웹 공격에 붙는 조치</text>
  <text class="box-detail" x="371" y="180">흔한 공격엔 예방 수단이</text>
  <text class="box-detail" x="371" y="198">열 가지가 전부는 아니다</text>
  <text class="ch" x="612" y="161">14장</text>

  <rect x="40" y="244" width="620" height="76" rx="4" fill="rgb(212,168,83)"/>
  <text class="back-title" x="56" y="265">저자가 되돌아가라 권하는 곳</text>
  <text class="back-detail" x="56" y="284">1장 위협 모델 — 공격 벡터 목록</text>
  <text class="back-detail" x="56" y="302">부록 체크리스트 — 취약점 자문</text>
</svg>

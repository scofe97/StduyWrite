<svg viewBox="0 0 700 400" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>시크릿이 갖춰야 할 성질과 순환 참조 문제</title>
  <desc>시크릿의 가장 뚜렷한 성질은 접근이 허용된 사람이나 대상만 볼 수 있어야 한다는 것입니다. 보통 시크릿 데이터를 암호화하고 복호화 키를 볼 권한이 있는 주체에게만 공유해 이를 보장합니다. 저장할 때도 암호화된 형태여야 하고, 저장소에서 쓰이는 곳으로 옮길 때도 암호화되어 네트워크에서 엿볼 수 없어야 합니다. 이상적으로는 암호화되지 않은 상태로 디스크에 절대 쓰이지 않아야 하며, 애플리케이션이 평문 버전을 필요로 할 때는 메모리에만 두는 것이 최선입니다. 또한 더 이상 신뢰할 수 없게 됐을 때 무효화하는 폐기 능력과, 주기적으로 바꾸는 순환 능력이 필요합니다. 시크릿의 생애주기는 그것을 쓰는 구성 요소의 생애주기와 독립적이어야 합니다. 그래야 시크릿이 바뀔 때 구성 요소를 다시 빌드하고 배포하지 않아도 됩니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .warn-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .warn-detail { fill: #0d0d0d; font-size: 9.5px; }
    .loop { stroke: rgb(212,168,83); stroke-width: 1.5; fill: none; }
  </style>

  <rect width="700" height="400" fill="#0d0d0d"/>

  <defs>
    <marker id="uh12" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
    <marker id="am12" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <text class="head" x="40" y="30">세 구간 모두 암호화되어야 합니다</text>

  <rect class="box" x="40" y="42" width="196" height="70" rx="4"/>
  <text class="box-title" x="56" y="63">저장 중</text>
  <text class="box-detail" x="56" y="82">암호화된 형태로 둔다</text>
  <text class="box-detail" x="56" y="100">저장소 접근자 전부가 보면 안 됨</text>

  <path class="arrow" d="M236,77 L268,77" marker-end="url(#uh12)"/>

  <rect class="box" x="272" y="42" width="196" height="70" rx="4"/>
  <text class="box-title" x="288" y="63">이동 중</text>
  <text class="box-detail" x="288" y="82">네트워크에서 엿볼 수 없게</text>
  <text class="box-detail" x="288" y="100">전송 구간도 암호화</text>

  <path class="arrow" d="M468,77 L500,77" marker-end="url(#uh12)"/>

  <rect class="box" x="504" y="42" width="156" height="70" rx="4"/>
  <text class="box-title" x="520" y="63">사용 중</text>
  <text class="box-detail" x="520" y="82">평문은 메모리에만</text>
  <text class="box-detail" x="520" y="100">디스크에 쓰지 않는다</text>

  <!-- 순환 참조 -->
  <rect x="40" y="130" width="620" height="76" rx="4" fill="rgb(212,168,83)"/>
  <text class="warn-title" x="56" y="151">암호화가 끝이 아닙니다</text>
  <text class="warn-detail" x="56" y="171">받는 쪽엔 복호화 키가 필요합니다</text>
  <text class="warn-detail" x="56" y="189">그 키도 시크릿 — 어떻게 전달합니까</text>

  <text class="warn-detail" x="400" y="171">→ 원래 질문으로 되돌아옵니다</text>

  <!-- 나머지 성질 -->
  <text class="head" x="40" y="240">그 밖에 필요한 것</text>

  <rect class="box" x="40" y="252" width="196" height="90" rx="4"/>
  <text class="box-title" x="56" y="273">폐기와 순환</text>
  <text class="box-detail" x="56" y="292">신뢰를 잃으면 무효화한다</text>
  <text class="box-detail" x="56" y="310">주기적으로 바꾼다</text>
  <text class="box-detail" x="56" y="332">사람은 힘들지만 SW 는 괜찮다</text>

  <rect class="box" x="252" y="252" width="196" height="90" rx="4"/>
  <text class="box-title" x="268" y="273">독립된 생애주기</text>
  <text class="box-detail" x="268" y="292">쓰는 구성 요소와 분리</text>
  <text class="box-detail" x="268" y="310">시크릿이 바뀌어도</text>
  <text class="box-detail" x="268" y="332">다시 빌드하지 않는다</text>

  <rect class="box" x="464" y="252" width="196" height="90" rx="4"/>
  <text class="box-title" x="480" y="273">최소 노출</text>
  <text class="box-detail" x="480" y="292">사람에겐 쓰기 전용이 흔하다</text>
  <text class="box-detail" x="480" y="310">한번 만들면 읽을 일이 없다</text>
  <text class="box-detail" x="480" y="332">필요한 컨테이너에만 준다</text>

  <text class="hint" x="40" y="378">시크릿을 볼 사람은 더 적어야 합니다</text>
</svg>

<title id="dt">공격 벡터 9종은 생애주기 네 단계에 걸치고 실행 단계에 가장 몰립니다</title><desc id="dd">컨테이너 생애주기는 코드, 이미지 빌드, 레지스트리 보관, 실행의 네 단계다. 코드에 1번, 빌드에 2·3번, 레지스트리에 4번 공급망 공격이 있고, 실행 단계에는 설정·호스트·시크릿·네트워킹·이스케이프 다섯이 몰린다. 카드 끝의 장 번호는 책이 그 주제를 다루는 곳이다.</desc>
<rect width="984" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PROCESS · 01-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">공격 벡터 9종은 생애주기 네 단계에 걸치고 실행 단계에 가장 몰립니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">카드의 번호는 책이 부르는 벡터 순서, 장 번호는 그 주제를 본격적으로 다루는 장입니다.</text>
<rect x="36" y="108" width="204" height="56" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="52" y="130" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">단계 1</text>
<text x="138.0" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">코드</text>
<text x="138.0" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">개발자가 씀</text>
<path d="M 242 136 L 268 136" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="36" y="188" width="204" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="52" y="208" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">1</text>
<text x="70" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">취약한 애플리케이션 코드</text>
<text x="70" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이미지 스캐닝 · 7장</text>

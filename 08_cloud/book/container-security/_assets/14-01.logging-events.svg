<svg viewBox="0 0 700 380" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>운영 배포에서 남겨야 할 컨테이너 이벤트 일곱 가지</title>
  <desc>OWASP 사이트는 침해가 식별되기까지 평균 거의 200일이 걸린다는 무서운 통계를 공유합니다. 충분한 관찰과 예상치 못한 동작에 대한 경보를 결합하면 그 기간을 극적으로 줄일 수 있어야 합니다. 어떤 운영 배포에서든 남겨야 할 컨테이너 이벤트가 있습니다. 컨테이너 시작과 종료 이벤트는 이미지의 신원과 호출한 사용자를 포함해 기록합니다. 시크릿에 대한 접근을 기록합니다. 권한의 변경을 기록합니다. 컨테이너 페이로드의 변경은 코드 주입을 시사할 수 있으므로 기록합니다. 인바운드와 아웃바운드 네트워크 연결을 기록합니다. 볼륨 마운트는 나중에 민감한 것으로 드러날 마운트를 분석하기 위해 기록합니다. 네트워크 연결 시도나 파일 쓰기나 사용자 권한 변경 시도가 실패한 것도 기록하는데, 공격자가 시스템을 정찰하고 있다는 신호일 수 있기 때문입니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .warn-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .warn-detail { fill: #0d0d0d; font-size: 9.5px; }
    .ok-detail { fill: #14521d; font-size: 9.5px; font-weight: 700; }
    .ch { fill: #3a3632; font-size: 9px; font-weight: 700; }
  </style>

  <rect width="700" height="380" fill="#0d0d0d"/>

  <!-- 200일 통계 -->
  <rect x="40" y="30" width="620" height="56" rx="4" fill="rgb(212,168,83)"/>
  <text class="warn-title" x="56" y="51">침해 발견까지 평균 200일 가까이</text>
  <text class="warn-detail" x="56" y="72">관찰과 경보로 크게 줄일 수 있다</text>

  <text class="head" x="40" y="112">남겨야 할 이벤트</text>

  <rect class="box" x="40" y="124" width="200" height="70" rx="4"/>
  <text class="box-title" x="56" y="145">컨테이너 시작·종료</text>
  <text class="box-detail" x="56" y="164">이미지의 신원과</text>
  <text class="box-detail" x="56" y="182">호출한 사용자까지</text>

  <rect class="box" x="252" y="124" width="200" height="70" rx="4"/>
  <text class="box-title" x="268" y="145">시크릿 접근</text>
  <text class="box-detail" x="268" y="164">누가 무엇을 읽었는지</text>
  <text class="box-detail" x="268" y="182">12장의 그 시크릿</text>

  <rect class="box" x="464" y="124" width="196" height="70" rx="4"/>
  <text class="box-title" x="480" y="145">권한 변경</text>
  <text class="box-detail" x="480" y="164">모든 권한 수정</text>
  <text class="box-detail" x="480" y="182">권한 상승의 신호</text>

  <rect class="box" x="40" y="206" width="200" height="70" rx="4"/>
  <text class="box-title" x="56" y="227">페이로드 변경</text>
  <text class="box-detail" x="56" y="246">코드 주입을 시사한다</text>
  <text class="box-detail" x="56" y="264">13장 드리프트 방지</text>

  <rect class="box" x="252" y="206" width="200" height="70" rx="4"/>
  <text class="box-title" x="268" y="227">네트워크 연결</text>
  <text class="box-detail" x="268" y="246">인바운드와 아웃바운드</text>
  <text class="box-detail" x="268" y="264">10장의 그 트래픽</text>

  <rect class="box" x="464" y="206" width="196" height="70" rx="4"/>
  <text class="box-title" x="480" y="227">볼륨 마운트</text>
  <text class="box-detail" x="480" y="246">나중에 민감한 것으로</text>
  <text class="box-detail" x="480" y="264">드러날 수 있어서</text>

  <!-- 실패 기록 -->
  <rect class="box" x="40" y="288" width="620" height="56" rx="4"/>
  <text class="box-title" x="56" y="309">실패한 시도도 남깁니다</text>
  <text class="box-detail" x="56" y="330">실패는 정찰의 신호일 수 있습니다</text>

  <text class="hint" x="40" y="366">사후 보고보다 사전 차단이 낫습니다</text>
</svg>

<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">공유하는 것이 많을수록 격리가 약하고, 컨테이너와 가상머신 사이가 이 책의 경계입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칸 색은 그 자원을 이웃과 공유하는지를 뜻합니다. 위쪽일수록 약한 격리입니다.</text>

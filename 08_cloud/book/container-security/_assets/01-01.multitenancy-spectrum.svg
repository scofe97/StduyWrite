<title id="dt">공유하는 것이 많을수록 격리가 약하고, 컨테이너와 가상머신 사이가 이 책의 경계입니다</title><desc id="dd">다섯 가지 배치를 격리가 약한 쪽에서 강한 쪽으로 세웠다. 공유 머신과 컨테이너는 커널과 물리 머신을 함께 쓰고, 가상머신부터 커널이 분리되며, 전용 VM 과 베어메탈에서 물리 머신까지 분리된다.</desc>

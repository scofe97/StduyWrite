<title id="dt">공격은 보안 경계를 하나씩 넘으며 진행되고, 컨테이너가 root 면 세 번째 단계가 사소해집니다</title><desc id="dd">공격자는 의존성 취약점으로 컨테이너 안에서 코드를 실행하는 것으로 시작한다. 컨테이너 밖으로 나가는 출구는 이스케이프 취약점과 안전하지 않은 설정 둘이고, 하나만 열려 있어도 호스트에 닿는다. 컨테이너가 root 로 돌고 있었다면 호스트 root 를 얻는 단계가 사소해진다.</desc>
<rect width="984" height="372" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 01-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">공격은 보안 경계를 하나씩 넘으며 진행되고, 컨테이너가 root 면 세 번째 단계가 사소해집니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">점선이 단계 사이의 보안 경계입니다. 경계가 많을수록 목표에 닿기 어렵습니다.</text>
<rect x="22" y="120" width="196" height="104" rx="20" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="120.0" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">1</text>
<text x="120.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">컨테이너 안 코드 실행</text>
<text x="120.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">의존성 취약점 · 원격</text>
<path d="M 222 172 L 264 172" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<line x1="244.0" y1="100" x2="244.0" y2="270" stroke="#F0616D" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="215.0" y="270" width="58.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="244.0" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">경계 1</text>
<rect x="270" y="120" width="196" height="104" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="368.0" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">2</text>
<text x="368.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">컨테이너 밖으로</text>
<text x="368.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이스케이프 취약점</text>
<text x="368.0" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">또는 안전하지 않은 설정</text>
<path d="M 470 172 L 512 172" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<line x1="492.0" y1="100" x2="492.0" y2="270" stroke="#F0616D" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="463.0" y="270" width="58.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="492.0" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">경계 2</text>
<rect x="518" y="120" width="196" height="104" rx="6" fill="#F08A591F" stroke="#F08A59" stroke-width="1.6"/>
<text x="616.0" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">3</text>
<text x="616.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">호스트 root 획득</text>
<text x="616.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">컨테이너가 root 면 사소</text>
<path d="M 718 172 L 760 172" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<line x1="740.0" y1="100" x2="740.0" y2="270" stroke="#F0616D" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="711.0" y="270" width="58.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="740.0" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">경계 3</text>
<rect x="766" y="120" width="196" height="104" rx="20" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="864.0" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">4</text>
<text x="864.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">닿는 모든 것</text>
<text x="864.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">호스트</text>

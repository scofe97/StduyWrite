<title id="dt">ps 를 격리하려면 PID namespace 에 새 루트와 proc 마운트를 겹쳐야 합니다</title><desc id="dd">04-01 의 키워드 개념도. 첫 줄은 namespace 종류 중 UTS 를 unshare --uts sh 로 만들어 호스트명을 바꾸는 흐름이다. 둘째 줄은 unshare --pid 의 Cannot fork 와 --fork 뒤에도 호스트 프로세스가 보이는 ps 가 /proc 으로 이어지는 흐름이다. 셋째 줄은 chroot alpine 으로 루트를 바꾼 뒤 mount -t proc proc /proc 를 하면 ps 가 자기 프로세스만 보여 주는 흐름이다. 넷째 줄은 같은 구조가 mount namespace 의 bind 마운트에도 되풀이되는 흐름이다.</desc>
<rect width="984" height="664" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 04-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">ps 를 격리하려면 PID namespace 에 새 루트와 proc 마운트를 겹쳐야 합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

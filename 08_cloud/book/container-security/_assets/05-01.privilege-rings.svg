<title id="dt">하이퍼바이저가 들어오면 커널은 Ring 1 로 내려가고, VT-x 가 Ring 0 을 돌려줍니다</title><desc id="dd">권한 링 넷(Ring -1, 0, 1, 3) 과 구성 셋(일반 구성, 하이퍼바이저, 하드웨어 가상화) 의 격자. 일반 구성에서 커널은 Ring 0 이고 유저 공간은 Ring 3 이다. 하이퍼바이저가 Ring 0 을 차지하면 게스트 커널은 Ring 1 로 내려간다. VT-x 는 하이퍼바이저를 Ring -1 인 VMX root mode 로 올려 게스트 커널이 Ring 0 을 되찾게 한다.</desc>
<rect width="936" height="472" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">MATRIX · 05-01 §1 · §3 · §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">하이퍼바이저가 들어오면 커널은 Ring 1 로 내려가고, VT-x 가 Ring 0 을 돌려줍니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 커널이 구성에 따라 Ring 0, Ring 1, Ring 0 으로 옮겨 앉고, 하이퍼바이저는 Ring 0 에서 Ring -1 로 올라갑니다.</text>

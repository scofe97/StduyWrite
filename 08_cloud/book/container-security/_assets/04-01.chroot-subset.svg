<svg viewBox="0 0 680 400" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>루트를 바꾸면 프로세스가 파일시스템의 일부만 보게 된다</title>
  <desc>호스트의 파일시스템은 슬래시에서 시작하는 하나의 트리입니다. 그중 한 디렉토리를 새 루트로 지정하면 그 프로세스에게는 그 디렉토리가 슬래시가 됩니다. 파일시스템에서 루트보다 위로 올라갈 방법이 없으므로, 그 프로세스는 원래 트리의 윗부분에 접근할 수 없게 됩니다. 다만 chroot는 옛 루트를 마운트 지점을 통해 여전히 접근 가능한 상태로 남겨 두므로, 실제 런타임은 mount namespace를 활용해 옛 루트를 아예 마운트 해제하는 pivot_root를 씁니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 12.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10px; }
    .path { fill: #0d0d0d; font-size: 11px; font-weight: 700; font-family: 'Menlo', 'Consolas', monospace; }
    .dim { fill: #3a3632; font-size: 10.5px; font-family: 'Menlo', 'Consolas', monospace; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .tree { stroke: #b8b3ad; stroke-width: 1.2; fill: none; }
    .cut { stroke: #7a1f1f; stroke-width: 1.6; stroke-dasharray: 6 3; fill: none; }
    .caution-title { fill: #0d0d0d; font-size: 12px; font-weight: 700; }
    .caution-detail { fill: #0d0d0d; font-size: 10px; }
  </style>

  <rect width="680" height="400" fill="#0d0d0d"/>

  <text class="head" x="40" y="32">호스트가 보는 트리</text>

  <rect class="box" x="40" y="44" width="270" height="34" rx="4"/>
  <text class="path" x="56" y="66">/</text>

  <path class="tree" d="M70,78 L70,96 L280,96"/>
  <path class="tree" d="M110,96 L110,110"/>
  <path class="tree" d="M200,96 L200,110"/>
  <path class="tree" d="M280,96 L280,110"/>

  <rect class="box" x="60" y="114" width="100" height="30" rx="4"/>
  <text class="dim" x="110" y="134" text-anchor="middle">/etc</text>

  <rect class="box" x="170" y="114" width="60" height="30" rx="4"/>
  <text class="dim" x="200" y="134" text-anchor="middle">/bin</text>

  <rect class="box" x="240" y="114" width="80" height="30" rx="4"/>
  <text class="dim" x="280" y="134" text-anchor="middle">/home</text>

  <path class="tree" d="M280,144 L280,162"/>
  <rect class="box" x="215" y="166" width="130" height="30" rx="4"/>
  <text class="dim" x="280" y="186" text-anchor="middle">alpine</text>

  <!-- 경계선 -->
  <path class="cut" d="M40,214 L340,214"/>
  <text class="hint" x="40" y="232">이 위로는 올라갈 수 없게 된다</text>

  <!-- 컨테이너가 보는 트리 -->
  <text class="head" x="380" y="32">프로세스가 보는 트리</text>

  <rect class="box" x="380" y="44" width="260" height="34" rx="4"/>
  <text class="path" x="396" y="66">/</text>
  <text class="hint" x="560" y="66">= alpine</text>

  <path class="tree" d="M410,78 L410,96 L610,96"/>
  <path class="tree" d="M450,96 L450,110"/>
  <path class="tree" d="M540,96 L540,110"/>
  <path class="tree" d="M610,96 L610,110"/>

  <rect class="box" x="400" y="114" width="100" height="30" rx="4"/>
  <text class="dim" x="450" y="134" text-anchor="middle">/etc</text>

  <rect class="box" x="510" y="114" width="60" height="30" rx="4"/>
  <text class="dim" x="540" y="134" text-anchor="middle">/bin</text>

  <rect class="box" x="580" y="114" width="60" height="30" rx="4"/>
  <text class="dim" x="610" y="134" text-anchor="middle">/proc</text>

  <text class="hint" x="380" y="176">이미지 안에 없는 실행 파일은</text>
  <text class="hint" x="380" y="194">아예 실행할 수 없습니다</text>
  <text class="hint" x="380" y="232">bash가 없으면 못 쓴다</text>

  <!-- 하단 주의 -->
  <rect x="40" y="256" width="600" height="60" rx="4" fill="rgb(212,168,83)"/>
  <text class="caution-title" x="56" y="278">주의 · 옛 루트가 남는다</text>
  <text class="caution-detail" x="56" y="298">마운트 지점으로 접근된다</text>

  <rect class="box" x="40" y="326" width="600" height="52" rx="4"/>
  <text class="box-title" x="56" y="348">런타임은 pivot_root를 쓴다</text>
  <text class="box-detail" x="56" y="366">옛 루트를 마운트 해제한다</text>
</svg>

<svg viewBox="0 0 700 380" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>호스트 root 가 두 경로 모두에서 시크릿을 읽어 내는 방법</title>
  <desc>시크릿이 마운트된 파일로 전달되든 환경 변수로 전달되든 호스트의 root 사용자는 접근할 수 있습니다. 파일에 담겨 있다면 그 파일은 호스트 파일시스템 어딘가에 존재합니다. 임시 디렉토리에 있더라도 root 는 접근할 수 있습니다. Kubernetes 노드에서 마운트된 임시 파일시스템 목록을 뽑으면 kubelet 아래 파드별 시크릿 볼륨 경로가 그대로 드러나고, 그 디렉토리 이름을 써서 root 는 어렵지 않게 안의 시크릿 파일에 접근합니다. 환경 변수에 담긴 시크릿을 뽑아내는 것도 거의 같은 수준으로 간단합니다. 컨테이너 안에서 도는 프로세스의 ID 를 찾은 뒤 proc 디렉토리 아래 environ 파일을 읽으면 모든 환경 변수가 나옵니다. 미리 암호화하면 낫지 않을까 싶겠지만 복호화 키를 컨테이너에 어떻게 넣을지 생각하면 같은 문제로 돌아옵니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .code { fill: #0d0d0d; font-size: 9.5px; font-weight: 700; font-family: 'Menlo', 'Consolas', monospace; }
    .chip { fill: #f5edda; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .arrow { stroke: #7a1f1f; stroke-width: 1.5; fill: none; }
    .danger-title { fill: #7a1f1f; font-size: 11.5px; font-weight: 700; }
    .danger-detail { fill: #7a1f1f; font-size: 9.5px; }
  </style>

  <rect width="700" height="380" fill="#0d0d0d"/>

  <defs>
    <marker id="rd12" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#7a1f1f"/>
    </marker>
  </defs>

  <text class="head" x="40" y="30">두 경로 모두 뚫립니다</text>

  <!-- 파일 경로 -->
  <rect class="box" x="40" y="42" width="280" height="120" rx="4"/>
  <text class="box-title" x="56" y="63">파일로 전달한 경우</text>
  <text class="box-detail" x="56" y="82">메모리 임시 파일시스템이어도</text>
  <text class="box-detail" x="56" y="100">호스트 어딘가에는 존재합니다</text>
  <rect class="chip" x="56" y="110" width="150" height="15" rx="3"/>
  <text class="code" x="60" y="121">mount -t tmpfs</text>
  <text class="box-detail" x="56" y="142">kubelet 아래 파드별 경로가</text>
  <text class="box-detail" x="56" y="156">그대로 드러납니다</text>

  <!-- 환경 변수 경로 -->
  <rect class="box" x="380" y="42" width="280" height="120" rx="4"/>
  <text class="box-title" x="396" y="63">환경 변수로 전달한 경우</text>
  <text class="box-detail" x="396" y="82">프로세스 ID 를 먼저 찾고</text>
  <rect class="chip" x="396" y="90" width="110" height="15" rx="3"/>
  <text class="code" x="400" y="101">ps -C sh</text>
  <text class="box-detail" x="396" y="122">그 프로세스의 환경을 읽습니다</text>
  <rect class="chip" x="396" y="130" width="200" height="15" rx="3"/>
  <text class="code" x="400" y="141">cat /proc/&lt;PID&gt;/environ</text>
  <text class="box-detail" x="396" y="158">4장에서 본 그 디렉토리</text>

  <path class="arrow" d="M180,168 L180,196" marker-end="url(#rd12)"/>
  <path class="arrow" d="M520,168 L520,196" marker-end="url(#rd12)"/>

  <rect x="40" y="200" width="620" height="60" rx="4" fill="#f2d4d4"/>
  <text class="danger-title" x="56" y="221">root 는 백지 수표를 갖습니다</text>
  <text class="danger-detail" x="56" y="242">컨테이너와 시크릿을 포함해서입니다</text>

  <!-- 왜 암호화가 답이 아닌가 -->
  <rect class="box" x="40" y="276" width="300" height="70" rx="4"/>
  <text class="box-title" x="56" y="297">미리 암호화하면 되지 않나</text>
  <text class="box-detail" x="56" y="316">복호화 키를 컨테이너에 넣어야 한다</text>
  <text class="box-detail" x="56" y="334">그 키를 어떻게 넣을 것인가</text>

  <rect class="box" x="360" y="276" width="300" height="70" rx="4"/>
  <text class="box-title" x="376" y="297">그래서 얻는 결론</text>
  <text class="box-detail" x="376" y="316">무단 root 접근을 막는 것이 핵심</text>
  <text class="box-detail" x="376" y="334">컨테이너 root 가 위험한 이유</text>
</svg>

<svg viewBox="0 0 680 380" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>veth 쌍으로 컨테이너 network ns를 바깥과 잇는다</title>
  <desc>새 network namespace를 만들면 루프백 인터페이스 하나만 있고 그것마저 DOWN 상태라 아무 데도 통신할 수 없습니다. 바깥으로 가는 길을 주려면 가상 이더넷 인터페이스 쌍을 만듭니다. 비유하자면 케이블 하나의 두 끝인데, 한 끝은 컨테이너의 namespace에 꽂고 다른 끝은 기본 namespace에 꽂습니다. 양쪽 끝을 모두 UP 상태로 올리고 각각에 IP 주소를 주면 비로소 서로 통신할 수 있습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 12.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10px; }
    .iface { fill: #0d0d0d; font-size: 10.5px; font-weight: 700; font-family: 'Menlo', 'Consolas', monospace; }
    .chip { fill: #f5edda; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .cable { stroke: #b8b3ad; stroke-width: 2.5; fill: none; }
    .ns-line { stroke: #b8b3ad; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
    .caution-title { fill: #0d0d0d; font-size: 12px; font-weight: 700; }
    .caution-detail { fill: #0d0d0d; font-size: 10px; }
  </style>

  <rect width="680" height="380" fill="#0d0d0d"/>

  <text class="head" x="40" y="32">컨테이너 network ns</text>
  <text class="head" x="640" y="32" text-anchor="end">기본 namespace</text>

  <path class="ns-line" d="M340,20 L340,240"/>

  <!-- 좌: 컨테이너 -->
  <rect class="box" x="40" y="46" width="270" height="76" rx="4"/>
  <text class="box-title" x="56" y="68">처음엔 lo 하나뿐</text>
  <rect class="chip" x="56" y="78" width="130" height="18" rx="3"/>
  <text class="iface" x="62" y="91">lo · DOWN</text>
  <text class="box-detail" x="56" y="112">아무 데도 통신할 수 없다</text>

  <!-- 우: 호스트 -->
  <rect class="box" x="370" y="46" width="270" height="76" rx="4"/>
  <text class="box-title" x="386" y="68">호스트의 기본 namespace</text>
  <text class="box-detail" x="386" y="90">여기에 다른 쪽 끝을 꽂는다</text>

  <!-- veth 쌍 -->
  <rect class="box" x="40" y="146" width="150" height="52" rx="4"/>
  <rect class="chip" x="56" y="156" width="60" height="18" rx="3"/>
  <text class="iface" x="62" y="169">ve1</text>
  <text class="box-detail" x="56" y="190">netns 28586</text>

  <rect class="box" x="490" y="146" width="150" height="52" rx="4"/>
  <rect class="chip" x="506" y="156" width="60" height="18" rx="3"/>
  <text class="iface" x="512" y="169">ve2</text>
  <text class="box-detail" x="506" y="190">netns 1</text>

  <!-- 케이블 -->
  <path class="cable" d="M190,180 L490,180"/>
  <text class="hint" x="340" y="158" text-anchor="middle">가상 이더넷 쌍</text>
  <text class="hint" x="340" y="204" text-anchor="middle">케이블의 두 끝</text>

  <!-- 주의: UP 필요 -->
  <rect x="40" y="222" width="600" height="56" rx="4" fill="rgb(212,168,83)"/>
  <text class="caution-title" x="56" y="244">주의 · 양쪽 끝을 다 올려야 한다</text>
  <text class="caution-detail" x="56" y="264">만든 직후에는 DOWN 상태입니다</text>

  <!-- IP 부여 -->
  <rect class="box" x="40" y="288" width="600" height="60" rx="4"/>
  <text class="box-title" x="56" y="310">IP를 줘야 트래픽이 흐른다</text>
  <rect class="chip" x="56" y="320" width="230" height="18" rx="3"/>
  <text class="iface" x="62" y="333">ip addr add 192.168.1.100/24</text>
  <text class="box-detail" x="300" y="333">라우팅 테이블도 함께 격리됩니다</text>
</svg>

<text x="672.0" y="302.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">L3 · L4</text>
<rect x="776" y="100" width="152" height="56" rx="6" fill="#8B98A91A" stroke="#8B98A9" stroke-width="1.2"/>

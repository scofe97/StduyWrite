<title id="dt">서비스 메시는 L5~L7, 네트워크 정책은 L3·L4 에서 막아 서로 겹치지 않습니다</title><desc id="dd">위에서 아래로 L7 애플리케이션, L4 전송, L3 네트워크, L2 데이터 링크, L1 물리. 서비스 메시는 L5~L7 의 사이드카 프록시, 네트워크 정책은 L3 와 L4 의 netfilter 규칙에서 동작하고, API 방화벽과 WAF 는 L7 에서 동작한다.</desc>
<rect width="960" height="572" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LAYERS · 10-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서비스 메시는 L5~L7, 네트워크 정책은 L3·L4 에서 막아 서로 겹치지 않습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">계층마다 오가는 것과 주소가 다르고, 보안 수단은 그 계층에 걸립니다.</text>
<rect x="48" y="100" width="496" height="56" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="64" y="122" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">L7</text>
<text x="64" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">애플리케이션</text>
<text x="528" y="124" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">웹 요청 · REST API</text>
<text x="528" y="144" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">URL · DNS</text>
<rect x="48" y="220" width="496" height="56" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="64" y="242" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">L4</text>
<text x="64" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">전송</text>
<text x="528" y="244" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">TCP · UDP 패킷</text>

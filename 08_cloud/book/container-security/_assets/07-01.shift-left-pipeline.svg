<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">스캔은 빌드 직후 게이트부터 걸고, 걸린 취약점은 개발자가 재빌드해 고칩니다</title><desc id="dd">이미지가 개발자 데스크톱, 빌드 직후, 레지스트리, 어드미션 컨트롤 네 지점을 지나며 각 지점에서 스캔한다. 빌드 직후에는 심각도가 기준을 넘으면 빌드가 실패하고, 어드미션 컨트롤은 스캔 안 된 이미지의 배포를 거부한다. 취약점이 나오면 개발자가 패치된 버전으로 이미지를 다시 빌드한다.</desc>
<rect width="960" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 07-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스캔은 빌드 직후 게이트부터 걸고, 걸린 취약점은 개발자가 재빌드해 고칩니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽에서 걷어낼수록 수정이 빠르고 쌉니다.</text>
<path d="M 28 112 L 932 112" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="28" y="96" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">코드 작성</text>
<text x="932" y="96" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">운영 배포</text>
<rect x="395.0" y="102" width="170.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="480" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">늦을수록 수정 비용 증가</text>
<rect x="91.0" y="102" width="170.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="176" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">컨테이너: 개발자 재빌드</text>
<rect x="747.0" y="102" width="146.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="820" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">전통: 보안팀 수작업</text>
<rect x="28" y="136" width="200" height="148" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">개발자 데스크톱</text>
<text x="44" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">로컬 빌드를 직접 스캔</text>
<line x1="44" y1="208" x2="212" y2="208" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="44" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">푸시하기 전에</text>
<text x="44" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">스스로 고칠 기회</text>
<path d="M 230 188 L 260 188" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="264" y="136" width="200" height="148" rx="6" fill="#F08A591F" stroke="#F08A59" stroke-width="1.4"/>
<text x="280" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">빌드 직후</text>
<text x="280" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이미지 빌드 직후 스캔 단계</text>
<line x1="280" y1="208" x2="448" y2="208" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="280" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">심각도가 기준을 넘으면</text>
<text x="280" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">빌드를 실패시킴</text>
<path d="M 466 188 L 496 188" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="500" y="136" width="200" height="148" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="516" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">레지스트리</text>
<text x="516" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">푸시된 이미지 재스캔</text>
<line x1="516" y1="208" x2="684" y2="208" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="516" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">재빌드 없이 묵은 이미지의</text>
<text x="516" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">새 취약점 (24시간 주기)</text>
<path d="M 702 188 L 732 188" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="736" y="136" width="200" height="148" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="752" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">어드미션 컨트롤</text>
<text x="752" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">스캔 통과 이미지만 배포</text>
<line x1="752" y1="208" x2="920" y2="208" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="752" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이 검사가 없으면</text>
<text x="752" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">스캐너 우회가 쉬움</text>
<rect x="28" y="316" width="200" height="48" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<path d="M 128.0 286 L 128.0 312" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="128.0" y="345" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">소스 저장소에 푸시</text>
<rect x="264" y="316" width="200" height="48" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<path d="M 364.0 286 L 364.0 312" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="364.0" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">빌드 실패</text>
<text x="364.0" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">배포 자체를 막음</text>
<rect x="500" y="316" width="200" height="48" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<path d="M 600.0 286 L 600.0 312" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="600.0" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">새 취약점 발견</text>
<text x="600.0" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">정기 재스캔</text>
<rect x="736" y="316" width="200" height="48" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<path d="M 836.0 286 L 836.0 312" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="836.0" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">배포 거부</text>
<text x="836.0" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">스캔 안 된 이미지</text>
<rect x="28" y="404" width="908" height="48" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="480" y="434" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">취약점 발견 → 개발자가 의존성을 올려 이미지 재빌드</text>
<path d="M 364.0 366 L 364.0 400" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 600.0 366 L 600.0 400" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 836.0 366 L 836.0 400" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 28 428 L 12 428 L 12 210 L 24 210" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<line x1="12" y1="476" x2="912" y2="476" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="498" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="488" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소스 푸시</text>
<rect x="209" y="488" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="231" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">차단</text>
<rect x="279" y="488" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="301" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재스캔 결과</text>
<rect x="401" y="488" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="423" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재빌드</text>
<rect x="484" y="488" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="506" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">빌드 직후 게이트</text>
</svg>
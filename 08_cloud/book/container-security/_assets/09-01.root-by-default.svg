<text x="886.0" y="192.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">rootless 매핑</text>
<rect x="36" y="292" width="204" height="80" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>

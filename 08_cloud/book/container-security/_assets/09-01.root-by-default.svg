<title id="dt">비root 가 띄워도 user namespace 가 없으면 컨테이너의 root 는 호스트의 root 입니다</title><desc id="dd">docker run -it alpine sh 를 비root 사용자 vagrant 가 실행하면 root 로 도는 Docker 데몬이 컨테이너를 대신 만든다. 사용자 ID 를 지정하면 호스트에서도 그 UID 로 보이고, user namespace 가 있으면 호스트 비root 로 매핑된다. 둘 다 없으면 ps -fC sleep 에 root 가 찍힌다.</desc>
<rect width="984" height="472" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 09-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">비root 가 띄워도 user namespace 가 없으면 컨테이너의 root 는 호스트의 root 입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">사용자 ID 지정과 user namespace 두 판단을 모두 지나쳐야 호스트에서 root 로 끝납니다.</text>

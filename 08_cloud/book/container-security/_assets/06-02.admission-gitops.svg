<title id="dt">어드미션은 배포 직전에 막고 GitOps 는 직접 접근을 없앱니다</title><desc id="dd">사용자는 Git 에만 체크인하고 오퍼레이터가 클러스터를 고친다. 배포 요청은 어드미션 컨트롤러의 다섯 검사를 통과해야 컨테이너로 실행된다.</desc>
<rect width="1000" height="532" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 06-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">어드미션은 배포 직전에 막고 GitOps 는 직접 접근을 없앱니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">스캔을 건너뛴 이미지를 가리키는 배포도 어드미션에서 멈춥니다.</text>

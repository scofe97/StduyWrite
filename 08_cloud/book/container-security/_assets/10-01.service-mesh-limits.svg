<title id="dt">서비스 메시는 사이드카가 있는 파드의 서비스 경로만 지키고, 나머지는 보완 수단이 맡습니다</title><desc id="dd">왼쪽: 사이드카가 주입된 두 파드의 앱 컨테이너가 사이드카 프록시를 거쳐 상호 TLS 로 통신하고, 프록시는 L5~L7 정책을 강제한다. 오른쪽: 사이드카가 없는 파드는 보호 범위 밖이고, 침해된 파드가 서비스 IP 를 거치지 않고 보내는 직접 트래픽은 기저 인프라를 지키지 못한다. 각각 주입 확인 도구와 L3·L4 네트워크 정책이 보완한다.</desc>
<rect width="960" height="456" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 10-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서비스 메시는 사이드카가 있는 파드의 서비스 경로만 지키고, 나머지는 보완 수단이 맡습니다</text>

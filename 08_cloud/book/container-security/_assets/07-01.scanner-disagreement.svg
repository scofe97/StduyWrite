<svg viewBox="0 0 700 400" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>같은 이미지를 스캔해도 도구마다 결과가 다른 다섯 가지 이유</title>
  <desc>정보 출처가 다르면 결과가 다릅니다. 배포판 보안 피드를 안 읽고 NVD 만 쓰면 오탐이 늘어납니다. 출처가 낡은 경우도 있습니다. 배포판이 취약점 보고 방식을 바꾸면 옛 피드만 읽는 스캐너는 갱신을 놓칩니다. 고치지 않기로 한 취약점을 결과에 넣을지는 도구 개발자의 판단이라 정책이 갈립니다. 하위 패키지 문제도 있습니다. 문서 하위 패키지만 깔렸는데 전체가 깔렸다고 가정하면 있을 수 없는 취약점을 보고합니다. 패키지 이름 차이도 원인입니다. 소스 이름과 실제 바이너리 이름이 다르면 놓치는 미탐이 생깁니다. 그래서 정답인 결과 집합이라는 것은 없습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .code { fill: #0d0d0d; font-size: 9.5px; font-weight: 700; font-family: 'Menlo', 'Consolas', monospace; }
    .chip { fill: #f5edda; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .tag-fp { fill: #7a1f1f; font-size: 9.5px; font-weight: 700; }
    .tag-fn { fill: #10243a; font-size: 9.5px; font-weight: 700; }
    .caution-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .caution-detail { fill: #0d0d0d; font-size: 9.5px; }
  </style>

  <rect width="700" height="400" fill="#0d0d0d"/>

  <text class="head" x="40" y="30">한 이미지, 여러 스캐너, 다른 답</text>

  <!-- 1 -->
  <rect class="box" x="40" y="42" width="200" height="88" rx="4"/>
  <text class="box-title" x="56" y="62">정보 출처가 다르다</text>
  <text class="box-detail" x="56" y="80">배포판 피드를 읽는가</text>
  <text class="box-detail" x="56" y="96">NVD 만 쓰면 오탐이 는다</text>
  <text class="box-detail" x="56" y="112">Red Hat 은 피드가 둘</text>
  <text class="tag-fp" x="56" y="126">→ 오탐</text>

  <!-- 2 -->
  <rect class="box" x="250" y="42" width="200" height="88" rx="4"/>
  <text class="box-title" x="266" y="62">출처가 낡았다</text>
  <text class="box-detail" x="266" y="80">배포판이 보고 방식을 바꿔도</text>
  <text class="box-detail" x="266" y="96">옛 피드만 읽으면 못 따라간다</text>
  <rect class="chip" x="266" y="104" width="150" height="15" rx="3"/>
  <text class="code" x="270" y="115">alpine-secdb → aports</text>

  <!-- 3 -->
  <rect x="460" y="42" width="200" height="88" rx="4" fill="rgb(212,168,83)"/>
  <text class="caution-title" x="476" y="62">고치지 않기로 한 것</text>
  <text class="caution-detail" x="476" y="80">관리자가 수정을 포기한 건</text>
  <text class="caution-detail" x="476" y="96">보여 줄까 감출까</text>
  <text class="caution-detail" x="476" y="112">도구마다 정책이 갈린다</text>
  <text class="caution-detail" x="476" y="126">조치할 수 없기 때문입니다</text>

  <!-- 4 -->
  <rect class="box" x="40" y="146" width="200" height="88" rx="4"/>
  <text class="box-title" x="56" y="166">하위 패키지</text>
  <text class="box-detail" x="56" y="184">문서만 깔렸는데</text>
  <text class="box-detail" x="56" y="200">전체가 깔렸다고 가정한다</text>
  <rect class="chip" x="56" y="204" width="120" height="15" rx="3"/>
  <text class="code" x="60" y="215">bind → bind-docs</text>
  <text class="tag-fp" x="56" y="230">→ 오탐</text>

  <!-- 5 -->
  <rect class="box" x="250" y="146" width="200" height="88" rx="4"/>
  <text class="box-title" x="266" y="166">패키지 이름 차이</text>
  <text class="box-detail" x="266" y="184">소스 이름과 바이너리 이름이</text>
  <text class="box-detail" x="266" y="200">아예 다를 수 있다</text>
  <rect class="chip" x="266" y="204" width="168" height="15" rx="3"/>
  <text class="code" x="270" y="215">shadow → login · passwd</text>
  <text class="tag-fn" x="266" y="230">→ 미탐</text>

  <!-- 결론 -->
  <rect class="box" x="460" y="146" width="200" height="88" rx="4"/>
  <text class="box-title" x="476" y="166">스캐너 자체의 버그</text>
  <text class="box-detail" x="476" y="184">도구에도 결함이 있고</text>
  <text class="box-detail" x="476" y="200">피드 데이터에도 흠이 있다</text>
  <text class="box-detail" x="476" y="216">오탐과 미탐 양쪽에</text>

  <rect class="box" x="40" y="252" width="620" height="58" rx="4"/>
  <text class="box-title" x="56" y="274">그래서 저자의 결론</text>
  <text class="box-detail" x="56" y="294">정답인 결과 집합은 없다</text>
  <text class="box-detail" x="266" y="294">그래도 없는 것보다는 낫다</text>
  <text class="box-detail" x="476" y="294">받아들일 것은 화이트리스트로</text>

  <text class="hint" x="40" y="358">내 배포판 피드를 읽는가</text>
</svg>

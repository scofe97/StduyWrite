<title id="dt">maxSkew 는 zone 을 고르고, required anti-affinity 는 롤링을 막습니다</title><desc id="dd">장면 1 에서 zone-a 에 app bar Pod 2개, zone-b 에 1개가 있을 때 새 Pod 를 zone-a 에 놓으면 3 대 1 로 skew 2 가 되어 maxSkew 1 을 넘으므로 DoNotSchedule 이 거부하고, zone-b 에 놓으면 2 대 2 로 통과합니다. 장면 2 에서는 노드 둘, replica 2, required anti-affinity 환경의 롤링 업데이트에서 surge Pod 가 놓일 노드가 없어 Pending 이 됩니다.</desc>

<svg viewBox="0 0 900 400" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>스케줄러를 앱에서 플랫폼으로 옮기면 무엇이 사라지는가</title>
  <desc>이 장 전체의 구조를 한 장으로 요약합니다. 위쪽은 스케줄러를 앱 안에 두는 전통적 방식입니다. 앱 인스턴스마다 스케줄러가 함께 들어 있어서 인스턴스를 여럿 띄우면 같은 시각에 모두 발동해 작업이 중복 실행됩니다. 이것을 막으려면 하나만 활성이 되도록 리더 선출을 붙여야 하고 락 인프라와 중복 방지 로직이 앱의 책임이 됩니다. 하루 한 번 파일을 복사하는 단순한 서비스가 분산 시스템 문제를 떠안게 되는 지점입니다. 아래쪽은 CronJob으로 스케줄을 플랫폼에 맡긴 방식입니다. 스케줄은 클러스터 바깥의 CronJob 컨트롤러가 관리하고 정해진 시각마다 Job을 하나 만들며 그 Job이 Pod를 띄워 작업을 수행합니다. 앱 컨테이너에는 비즈니스 로직만 남고 실행의 단일성과 고가용성은 플랫폼이 책임집니다. 다만 대가도 있습니다. 실행이 매번 새 Pod라 앱 컨텍스트를 새로 띄우는 비용이 들고 중복 실행과 미실행과 병렬 실행과 취소 같은 코너 케이스는 여전히 컨테이너 코드가 대비해야 합니다.</desc>

  <rect width="900" height="400" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">스케줄을 앱 밖으로 옮깁니다</text>

  <!-- ============ BEFORE : scheduler inside app ============ -->
  <text x="24" y="62" fill="#f44336" font-size="11" font-weight="700">앱 안에 두면</text>

  <rect x="140" y="48" width="150" height="52" fill="#0d0d0d" stroke="#f2d4d4"/>
  <text x="215" y="68" text-anchor="middle" fill="#f2d4d4" font-size="10" font-weight="700">앱 인스턴스 1</text>
  <text x="215" y="86" text-anchor="middle" fill="#f2d4d4" font-size="9">스케줄러 내장</text>

  <rect x="140" y="106" width="150" height="52" fill="#0d0d0d" stroke="#f2d4d4"/>
  <text x="215" y="126" text-anchor="middle" fill="#f2d4d4" font-size="10" font-weight="700">앱 인스턴스 2</text>
  <text x="215" y="144" text-anchor="middle" fill="#f2d4d4" font-size="9">스케줄러 내장</text>

  <path d="M 294 74 L 330 92" stroke="#f44336" stroke-width="2" marker-end="url(#rm)"/>
  <path d="M 294 132 L 330 114" stroke="#f44336" stroke-width="2" marker-end="url(#rm)"/>

  <rect x="336" y="86" width="190" height="34" fill="#f2d4d4"/>
  <text x="431" y="108" text-anchor="middle" fill="#7a1f1f" font-size="11" font-weight="700">같은 시각에 중복 발동</text>

  <path d="M 530 103 L 566 103" stroke="#f44336" stroke-width="2" marker-end="url(#rm)"/>

  <rect x="572" y="86" width="304" height="34" fill="#0d0d0d" stroke="#f44336" stroke-dasharray="4 3"/>
  <text x="724" y="108" text-anchor="middle" fill="#f44336" font-size="10" font-weight="700">리더 선출을 앱이 떠안습니다</text>

  <line x1="24" y1="182" x2="876" y2="182" stroke="#4a4640"/>

  <!-- ============ AFTER : CronJob ============ -->
  <text x="24" y="218" fill="#66bb6a" font-size="11" font-weight="700">CronJob 으로 옮기면</text>

  <rect x="140" y="204" width="150" height="52" fill="rgb(212,168,83)"/>
  <text x="215" y="224" text-anchor="middle" fill="#0d0d0d" font-size="11" font-weight="700">CronJob</text>
  <text x="215" y="242" text-anchor="middle" fill="#0d0d0d" font-size="9" font-family="'JetBrains Mono', monospace">schedule</text>

  <path d="M 294 230 L 330 230" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <text x="312" y="222" text-anchor="middle" fill="rgb(212,168,83)" font-size="8" font-weight="700">시각마다</text>

  <rect x="336" y="213" width="150" height="34" fill="#dceaf7"/>
  <text x="411" y="235" text-anchor="middle" fill="#10243a" font-size="11" font-weight="700">Job 을 하나 만듦</text>

  <path d="M 490 230 L 526 230" stroke="#5b9bd5" stroke-width="2" marker-end="url(#bm)"/>

  <rect x="532" y="213" width="150" height="34" fill="#cdeccf"/>
  <text x="607" y="235" text-anchor="middle" fill="#14521d" font-size="11" font-weight="700">Pod 가 작업 수행</text>

  <path d="M 686 230 L 722 230" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>

  <rect x="728" y="213" width="148" height="34" fill="#cdeccf"/>
  <text x="802" y="235" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">끝나면 종료</text>

  <!-- what remains in the app -->
  <rect x="140" y="266" width="346" height="34" fill="#0d0d0d" stroke="#66bb6a"/>
  <text x="313" y="288" text-anchor="middle" fill="#66bb6a" font-size="10" font-weight="700">앱에는 비즈니스 로직만</text>

  <rect x="532" y="266" width="344" height="34" fill="#0d0d0d" stroke="#b8b3ad"/>
  <text x="704" y="288" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">단일성 · HA 는 플랫폼이</text>

  <!-- caveat -->
  <rect x="24" y="316" width="852" height="34" fill="#f5edda"/>
  <text x="44" y="338" fill="#0d0d0d" font-size="10" font-weight="700">코너 케이스는 여전히 남습니다</text>

  <rect x="24" y="358" width="852" height="30" fill="rgb(212,168,83)"/>
  <text x="450" y="377" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">컨테이너는 멱등해야 합니다</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="rm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#f44336"/>
    </marker>
    <marker id="bm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#5b9bd5"/>
    </marker>
    <marker id="gm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 880 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Observe-Analyze-Act 조정 루프</title>
  <desc>Kubernetes Patterns 그림 27-1의 재현입니다. 컨트롤러는 API 서버가 발행하는 리소스 변경 이벤트를 관찰합니다. 관찰한 실제 상태와 선언된 목표 상태의 차이를 판단한 뒤, API 서버를 호출해 그 차이를 줄이는 조작을 수행합니다. API 서버의 변경은 kubelet과 kube-proxy 같은 노드 컴포넌트에 전달되고, 노드 컴포넌트가 애플리케이션 런타임을 실제로 관리합니다. 애플리케이션 런타임의 상태 변화는 다시 API 서버를 통해 이벤트가 되어 컨트롤러의 관찰로 돌아옵니다. 이 순환이 끊이지 않고 도는 것이 조정 루프이며, 목표 상태와 현재 상태가 어긋날 때마다 컨트롤러가 둘을 다시 맞춥니다.</desc>

  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="rg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#66bb6a"/>
    </marker>
  </defs>

  <rect width="880" height="430" fill="#0d0d0d"/>
  <text x="24" y="32" fill="#e8e4df" font-size="15">조정 루프 3단계</text>

  <!-- API server -->
  <rect x="60" y="80" width="220" height="72" fill="#dceaf7"/>
  <text x="170" y="108" text-anchor="middle" fill="#10243a" font-size="12" font-weight="700">API 서버</text>
  <text x="170" y="128" text-anchor="middle" fill="#10243a" font-size="9">리소스 변경 이벤트 발행</text>
  <text x="170" y="143" text-anchor="middle" fill="#10243a" font-size="9">watch=true</text>

  <!-- Controller -->
  <rect x="520" y="72" width="290" height="88" fill="#cdeccf"/>
  <text x="665" y="98" text-anchor="middle" fill="#14521d" font-size="12" font-weight="700">Controller</text>
  <text x="665" y="120" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">2. Analyze</text>
  <text x="665" y="138" text-anchor="middle" fill="#14521d" font-size="9">목표 상태와 차이 계산</text>
  <text x="665" y="152" text-anchor="middle" fill="#14521d" font-size="9">단일 replica로 배포</text>

  <!-- observe arrow -->
  <path d="M280 100 L510 100" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ra)"/>
  <text x="395" y="92" text-anchor="middle" fill="rgb(212,168,83)" font-size="10" font-weight="700">1. Observe</text>

  <!-- act arrow -->
  <path d="M510 134 L286 134" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#rg)"/>
  <text x="395" y="150" text-anchor="middle" fill="#66bb6a" font-size="10" font-weight="700">3. Act</text>

  <!-- node components -->
  <rect x="60" y="230" width="220" height="72" fill="#dceaf7"/>
  <text x="170" y="258" text-anchor="middle" fill="#10243a" font-size="11" font-weight="700">노드 컴포넌트</text>
  <text x="170" y="278" text-anchor="middle" fill="#10243a" font-size="9">kubelet</text>
  <text x="170" y="292" text-anchor="middle" fill="#10243a" font-size="9">kube-proxy</text>

  <!-- bidirectional api <-> node -->
  <path d="M170 158 L170 224" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ra)" marker-start="url(#ra)"/>

  <!-- application runtime (stacked) -->
  <rect x="546" y="248" width="240" height="66" fill="#f2d4d4"/>
  <rect x="538" y="240" width="240" height="66" fill="#f2d4d4"/>
  <rect x="530" y="232" width="240" height="66" fill="#f2d4d4"/>
  <text x="650" y="260" text-anchor="middle" fill="#7a1f1f" font-size="11" font-weight="700">애플리케이션 런타임</text>
  <text x="650" y="280" text-anchor="middle" fill="#7a1f1f" font-size="9">Pod · 컨테이너</text>
  <text x="650" y="294" text-anchor="middle" fill="#7a1f1f" font-size="9">실제 상태가 여기 있음</text>

  <path d="M280 266 L524 266" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#rg)"/>
  <text x="400" y="258" text-anchor="middle" fill="#66bb6a" font-size="10" font-weight="700">4. Manage</text>

  <!-- feedback: runtime state -> api server -> observe again -->
  <path d="M650 314 L650 370 L40 370 L40 116 L54 116" fill="none" stroke="#66bb6a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#rg)"/>
  <text x="360" y="388" text-anchor="middle" fill="#66bb6a" font-size="9">5. 변화가 다시 이벤트로</text>
</svg>

<svg viewBox="0 0 880 350" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>v1.17에서 DaemonSet 배치 경로가 nodeName에서 nodeAffinity로 바뀐 변화</title>
  <desc>DaemonSet Pod가 노드에 놓이는 경로가 Kubernetes v1.17에서 어떻게 달라졌는지 비교합니다. 이전 방식에서는 DaemonSet 컨트롤러가 Pod의 nodeName 필드를 직접 설정해 스케줄러를 건너뛰고 노드에 바로 배치했습니다. 스케줄러 없이도 뜰 수 있어 클러스터 부트스트랩에 유리했지만, 노드에 자원이 부족하면 컨트롤러가 Pod를 만들지 못하고 preemption 같은 조치도 취할 수 없었습니다. 또한 스케줄링 로직이 컨트롤러와 스케줄러 양쪽에 중복되어 유지보수가 어려웠고 affinity와 preemption 같은 새 스케줄러 기능도 쓸 수 없었습니다. v1.17 이후에는 컨트롤러가 nodeAffinity를 설정하고 기본 스케줄러가 배치를 담당합니다. 스케줄러가 필수 의존이 되는 대신 taint와 toleration, Pod 우선순위, preemption을 DaemonSet이 함께 얻습니다.</desc>

  <rect width="880" height="350" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">배치 경로가 바뀐 지점</text>

  <!-- ===== BEFORE ===== -->
  <text x="24" y="60" fill="#b8b3ad" font-size="12" font-weight="700">v1.17 이전 · nodeName</text>

  <rect x="24" y="72" width="150" height="44" fill="#dceaf7"/>
  <text x="99" y="99" text-anchor="middle" fill="#10243a" font-size="11" font-weight="700">DaemonSet 컨트롤러</text>

  <path d="M 178 94 L 232 94" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <text x="205" y="86" text-anchor="middle" fill="rgb(212,168,83)" font-size="9" font-weight="700">nodeName</text>

  <rect x="236" y="72" width="150" height="44" fill="#cdeccf"/>
  <text x="311" y="99" text-anchor="middle" fill="#14521d" font-size="11" font-weight="700">노드에 직접 배치</text>

  <rect x="420" y="66" width="180" height="56" fill="#0d0d0d" stroke="#b8b3ad" stroke-dasharray="4 3"/>
  <text x="510" y="89" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">스케줄러</text>
  <text x="510" y="107" text-anchor="middle" fill="#b8b3ad" font-size="10">건너뜀</text>

  <text x="620" y="86" fill="#66bb6a" font-size="10" font-weight="700">스케줄러 전에도 뜹니다</text>
  <text x="620" y="106" fill="#f44336" font-size="10" font-weight="700">자원 부족이면 못 만듭니다</text>

  <!-- problems -->
  <rect x="24" y="132" width="832" height="52" fill="#f2d4d4"/>
  <text x="44" y="152" fill="#7a1f1f" font-size="11" font-weight="700">이 방식의 문제</text>
  <text x="44" y="171" fill="#7a1f1f" font-size="10">preemption 불가 · 중복</text>

  <!-- arrow down -->
  <path d="M 440 190 L 440 212" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <text x="452" y="206" fill="rgb(212,168,83)" font-size="10" font-weight="700">v1.17</text>

  <!-- ===== AFTER ===== -->
  <text x="24" y="238" fill="rgb(212,168,83)" font-size="12" font-weight="700">v1.17 이후 · affinity</text>

  <rect x="24" y="250" width="150" height="44" fill="#dceaf7"/>
  <text x="99" y="277" text-anchor="middle" fill="#10243a" font-size="11" font-weight="700">DaemonSet 컨트롤러</text>

  <path d="M 178 272 L 232 272" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <text x="205" y="264" text-anchor="middle" fill="rgb(212,168,83)" font-size="9" font-weight="700">nodeAffinity</text>

  <rect x="236" y="250" width="150" height="44" fill="rgb(212,168,83)"/>
  <text x="311" y="277" text-anchor="middle" fill="#0d0d0d" font-size="11" font-weight="700">기본 스케줄러</text>

  <path d="M 390 272 L 444 272" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>

  <rect x="448" y="250" width="150" height="44" fill="#cdeccf"/>
  <text x="523" y="277" text-anchor="middle" fill="#14521d" font-size="11" font-weight="700">노드에 배치</text>

  <rect x="620" y="244" width="236" height="56" fill="#f5edda"/>
  <text x="640" y="266" fill="#0d0d0d" font-size="10" font-weight="700">얻은 것</text>
  <text x="640" y="286" fill="#0d0d0d" font-size="10">taint · preemption</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
  </defs>
</svg>

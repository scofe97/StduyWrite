<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Namespace와 NetworkPolicy의 서로 다른 경계</title>
  <desc id="desc">하나의 클러스터에서 production과 staging Namespace가 이름과 quota를 나누고 NetworkPolicy가 Pod 간 통신을 허용하거나 거부하는 모습</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#66bb6a"/></marker></defs>
  <rect width="960" height="390" fill="#0d0d0d"/>
  <text x="48" y="54" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="26" font-weight="700">Namespace는 소속 경계, NetworkPolicy는 통신 규칙</text>
  <text x="48" y="82" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="15">Namespace를 나눠도 통신은 기본으로 차단되지 않습니다.</text>
  <rect x="48" y="112" width="864" height="228" rx="18" fill="#121211" stroke="#4a4640" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="74" y="144" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="700">SHARED CLUSTER</text>
  <rect x="82" y="166" width="350" height="144" rx="14" fill="#151817" stroke="#d4a853" stroke-width="2"/>
  <text x="106" y="196" fill="#d4a853" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="700">NAMESPACE · production</text>
  <rect x="106" y="214" width="142" height="48" rx="8" fill="#25372a"/><text x="121" y="244" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="15">payments-api</text>
  <rect x="266" y="214" width="142" height="48" rx="8" fill="#24211b"/><text x="282" y="235" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="14">ResourceQuota</text><text x="282" y="253" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="12">CPU · memory</text>
  <text x="106" y="289" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="13">이름·권한·자원 총량의 범위</text>
  <rect x="528" y="166" width="350" height="144" rx="14" fill="#151817" stroke="#5e728d" stroke-width="2"/>
  <text x="552" y="196" fill="#9ab7d6" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="700">NAMESPACE · staging</text>
  <rect x="552" y="214" width="142" height="48" rx="8" fill="#1b2737"/><text x="567" y="244" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="15">payments-api</text>
  <rect x="712" y="214" width="142" height="48" rx="8" fill="#21181a"/><text x="728" y="235" fill="#f44336" font-family="Pretendard, Arial, sans-serif" font-size="14">NetworkPolicy</text><text x="728" y="253" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="12">ingress · egress</text>
  <path d="M432 238H514" stroke="#f44336" stroke-width="3" stroke-dasharray="6 5"/><path d="M467 224l14 28M481 224l-14 28" stroke="#f44336" stroke-width="3"/>
  <text x="407" y="368" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="14">NetworkPolicy가 selector로 허용 경로를 명시합니다.</text>
</svg>

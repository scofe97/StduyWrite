<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Java 백그라운드 작업과 Kubernetes 실행 프리미티브</title>
  <desc id="desc">유한한 병렬 작업은 Job, 주기 실행은 CronJob, 모든 노드의 상주 작업은 DaemonSet으로 대응시키는 그림</desc>
  <rect width="960" height="360" fill="#0d0d0d"/>
  <text x="48" y="54" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="26" font-weight="700">백그라운드 실행 책임을 어디에 둘까?</text>
  <text x="48" y="82" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="15">Java 내부 실행기를 클러스터의 작업 프리미티브로 옮길 수 있습니다.</text>
  <text x="64" y="124" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="14" font-weight="700">JAVA PROCESS</text>
  <text x="567" y="124" fill="#d4a853" font-family="Pretendard, Arial, sans-serif" font-size="14" font-weight="700">KUBERNETES</text>
  <g font-family="Pretendard, Arial, sans-serif">
    <rect x="48" y="142" width="372" height="48" rx="9" fill="#171614" stroke="#2a2520"/><text x="72" y="173" fill="#e8e4df" font-size="17">ThreadPoolExecutor</text><text x="282" y="173" fill="#8a8580" font-size="14">유한 병렬 작업</text>
    <path d="M438 166H534" stroke="#d4a853" stroke-width="2"/><path d="M534 166l-9-5v10z" fill="#d4a853"/>
    <rect x="552" y="142" width="360" height="48" rx="9" fill="#25372a"/><text x="576" y="173" fill="#e8e4df" font-size="17" font-weight="700">Job</text><text x="680" y="173" fill="#8a8580" font-size="14">완료될 때까지 실행</text>
    <rect x="48" y="211" width="372" height="48" rx="9" fill="#171614" stroke="#2a2520"/><text x="72" y="242" fill="#e8e4df" font-size="17">ScheduledExecutorService</text><text x="299" y="242" fill="#8a8580" font-size="14">주기 실행</text>
    <path d="M438 235H534" stroke="#d4a853" stroke-width="2"/><path d="M534 235l-9-5v10z" fill="#d4a853"/>
    <rect x="552" y="211" width="360" height="48" rx="9" fill="#24211b"/><text x="576" y="242" fill="#e8e4df" font-size="17" font-weight="700">CronJob</text><text x="693" y="242" fill="#8a8580" font-size="14">Job을 일정에 맞춰 생성</text>
    <rect x="48" y="280" width="372" height="48" rx="9" fill="#171614" stroke="#2a2520"/><text x="72" y="311" fill="#e8e4df" font-size="17">daemon thread</text><text x="282" y="311" fill="#8a8580" font-size="14">상주 보조 작업</text>
    <path d="M438 304H534" stroke="#d4a853" stroke-width="2"/><path d="M534 304l-9-5v10z" fill="#d4a853"/>
    <rect x="552" y="280" width="360" height="48" rx="9" fill="#1b2737"/><text x="576" y="311" fill="#e8e4df" font-size="17" font-weight="700">DaemonSet</text><text x="705" y="311" fill="#8a8580" font-size="14">각 노드에 하나씩 배치</text>
  </g>
</svg>

<svg viewBox="0 0 900 380" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>스크레이프 한 번에 어댑터 안에서 벌어지는 일</title>
  <desc>Example 17-1의 구성에서 Prometheus가 값을 한 번 긁어갈 때 어떤 순서로 일이 벌어지는지를 보입니다. 왼쪽 아래 메인 앱 컨테이너는 자기 리듬대로 난수를 만들고 걸린 시간을 커스텀 형식으로 로그 파일에 계속 씁니다. 이 동작은 스크레이프와 무관하게 늘 일어납니다. 가운데 emptyDir 볼륨이 그 파일을 담고 있고 두 컨테이너가 같은 경로로 이 볼륨을 마운트합니다. 오른쪽에서 Prometheus 서버가 9889 포트로 요청을 보내면 어댑터 컨테이너가 그 순간 로그 파일을 읽어 Prometheus 형식으로 변환해 응답합니다. 즉 변환은 미리 해 두는 것이 아니라 요청이 올 때마다 일어납니다. 아래쪽은 이 구조에서 각 컨테이너가 무엇을 아는지 정리한 것입니다. 메인 앱은 자기 로그 형식만 알고 Prometheus라는 존재를 모릅니다. 어댑터는 로그 형식과 Prometheus 형식을 둘 다 알고 그 사이를 번역합니다. 포트도 각각 8080과 9889로 나뉘어 있어 서비스 트래픽과 메트릭 수집이 섞이지 않습니다.</desc>

  <rect width="900" height="380" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">요청이 올 때마다 번역합니다</text>

  <!-- Pod boundary -->
  <rect x="24" y="56" width="600" height="144" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-dasharray="5 4"/>
  <text x="40" y="76" fill="rgb(212,168,83)" font-size="10" font-weight="700">Pod</text>

  <!-- main app -->
  <rect x="44" y="90" width="200" height="56" fill="#dceaf7"/>
  <text x="144" y="112" text-anchor="middle" fill="#10243a" font-size="11" font-weight="700">random-generator</text>
  <text x="144" y="130" text-anchor="middle" fill="#10243a" font-size="9" font-family="'JetBrains Mono', monospace">:8080</text>

  <path d="M 248 118 L 282 118" stroke="#5b9bd5" stroke-width="2" marker-end="url(#bm)"/>
  <text x="265" y="110" text-anchor="middle" fill="#5b9bd5" font-size="8" font-weight="700">계속 씁니다</text>

  <!-- volume -->
  <rect x="286" y="90" width="140" height="56" fill="rgb(212,168,83)"/>
  <text x="356" y="112" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">emptyDir</text>
  <text x="356" y="130" text-anchor="middle" fill="#0d0d0d" font-size="9" font-family="'JetBrains Mono', monospace">random.log</text>

  <path d="M 466 118 L 432 118" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>
  <text x="449" y="110" text-anchor="middle" fill="#66bb6a" font-size="8" font-weight="700">그때 읽습니다</text>

  <!-- adapter -->
  <rect x="470" y="90" width="134" height="56" fill="#cdeccf"/>
  <text x="537" y="112" text-anchor="middle" fill="#14521d" font-size="11" font-weight="700">adapter</text>
  <text x="537" y="130" text-anchor="middle" fill="#14521d" font-size="9" font-family="'JetBrains Mono', monospace">:9889</text>

  <text x="144" y="172" text-anchor="middle" fill="#b8b3ad" font-size="9">스크레이프와 무관하게</text>
  <text x="144" y="188" text-anchor="middle" fill="#b8b3ad" font-size="9">자기 리듬대로 씁니다</text>

  <text x="537" y="172" text-anchor="middle" fill="#b8b3ad" font-size="9">요청이 와야</text>
  <text x="537" y="188" text-anchor="middle" fill="#b8b3ad" font-size="9">변환이 일어납니다</text>

  <!-- prometheus -->
  <path d="M 660 118 L 626 118" stroke="#f44336" stroke-width="2" marker-end="url(#rm)"/>
  <text x="643" y="82" text-anchor="middle" fill="#f44336" font-size="9" font-weight="700">scrape</text>

  <rect x="664" y="90" width="212" height="56" fill="#0d0d0d" stroke="#f2d4d4"/>
  <text x="770" y="112" text-anchor="middle" fill="#f2d4d4" font-size="11" font-weight="700">Prometheus</text>
  <text x="770" y="130" text-anchor="middle" fill="#f2d4d4" font-size="9">주기적으로 긁어갑니다</text>

  <line x1="24" y1="252" x2="876" y2="252" stroke="#4a4640"/>

  <!-- who knows what -->
  <text x="24" y="278" fill="#e8e4df" font-size="12" font-weight="700">누가 무엇을 아는가</text>

  <rect x="24" y="290" width="418" height="48" fill="#dceaf7"/>
  <text x="44" y="310" fill="#10243a" font-size="10" font-weight="700">메인 앱 · 자기 로그 형식만</text>
  <text x="44" y="328" fill="#10243a" font-size="9">Prometheus 를 모릅니다</text>

  <rect x="458" y="290" width="418" height="48" fill="#cdeccf"/>
  <text x="478" y="310" fill="#14521d" font-size="10" font-weight="700">adapter · 양쪽 형식 모두</text>
  <text x="478" y="328" fill="#14521d" font-size="9">그 사이를 번역합니다</text>

  <rect x="24" y="346" width="852" height="26" fill="rgb(212,168,83)"/>
  <text x="450" y="364" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">포트가 갈려 트래픽이 안 섞입니다</text>

  <defs>
    <marker id="bm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#5b9bd5"/>
    </marker>
    <marker id="gm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
    <marker id="rm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#f44336"/>
    </marker>
  </defs>
</svg>

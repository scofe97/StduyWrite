<svg viewBox="0 0 880 340" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>라벨을 실행 중 바꿨을 때 환경변수와 downwardAPI 볼륨의 반응 차이</title>
  <desc>Pod가 돌고 있는 동안 사용자가 라벨을 바꿨을 때 두 주입 방식이 어떻게 달라지는지 시간 순서로 보입니다. 위쪽 환경변수 경로에서는 Pod 시작 시점에 값이 확정되어 컨테이너 환경에 박히고, 이후 라벨이 바뀌어도 환경변수는 옛 값을 그대로 유지합니다. 새 값을 보려면 Pod를 재시작해야 합니다. 아래쪽 downwardAPI 볼륨 경로에서는 값이 파일로 마운트되어 있어 라벨이 바뀌면 kubelet이 파일 내용을 갱신합니다. 다만 파일이 갱신되는 것과 앱이 새 값을 쓰는 것은 다른 문제라서, 앱이 파일 변경을 감지하고 다시 읽는 로직을 갖추지 않으면 여전히 재시작이 필요할 수 있습니다.</desc>

  <rect width="880" height="340" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">실행 중 라벨을 바꾸면</text>

  <text x="130" y="56" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">Pod 시작</text>
  <text x="420" y="56" text-anchor="middle" fill="rgb(212,168,83)" font-size="10" font-weight="700">라벨 변경</text>
  <text x="700" y="56" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">앱이 읽는 값</text>

  <!-- ===== env row ===== -->
  <text x="24" y="86" fill="#dceaf7" font-size="12" font-weight="700">환경변수</text>

  <rect x="24" y="96" width="212" height="56" fill="#dceaf7"/>
  <text x="130" y="118" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">시작 시점에 확정</text>
  <rect x="46" y="126" width="168" height="18" fill="#f7fbff"/>
  <text x="130" y="139" text-anchor="middle" fill="#10243a" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace">tier=web</text>

  <path d="M 240 124 L 314 124" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <rect x="318" y="96" width="204" height="56" fill="#f5edda"/>
  <text x="420" y="118" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">라벨이 바뀝니다</text>
  <rect x="336" y="126" width="168" height="18" fill="#fdf3df"/>
  <text x="420" y="139" text-anchor="middle" fill="#0d0d0d" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace">tier=api</text>

  <path d="M 526 124 L 600 124" stroke="#b8b3ad" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <rect x="604" y="96" width="252" height="56" fill="#f2d4d4"/>
  <text x="730" y="118" text-anchor="middle" fill="#7a1f1f" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">tier=web</text>
  <text x="730" y="139" text-anchor="middle" fill="#7a1f1f" font-size="10" font-weight="700">옛 값 · 재시작 필요</text>

  <line x1="24" y1="176" x2="856" y2="176" stroke="#2a2a2a"/>

  <!-- ===== volume row ===== -->
  <text x="24" y="204" fill="#cdeccf" font-size="12" font-weight="700">downwardAPI 볼륨</text>

  <rect x="24" y="214" width="212" height="56" fill="#cdeccf"/>
  <text x="130" y="236" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">파일로 마운트</text>
  <rect x="46" y="244" width="168" height="18" fill="#e6f7e7"/>
  <text x="130" y="257" text-anchor="middle" fill="#14521d" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace">/pod-info/labels</text>

  <path d="M 240 242 L 314 242" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <rect x="318" y="214" width="204" height="56" fill="#f5edda"/>
  <text x="420" y="236" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">kubelet이 갱신</text>
  <rect x="336" y="244" width="168" height="18" fill="#fdf3df"/>
  <text x="420" y="257" text-anchor="middle" fill="#0d0d0d" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace">tier=api</text>

  <path d="M 526 242 L 600 242" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>

  <rect x="604" y="214" width="252" height="56" fill="#cdeccf"/>
  <text x="730" y="236" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">tier=api</text>
  <text x="730" y="257" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">새 값이 보입니다</text>

  <!-- caveat -->
  <rect x="24" y="290" width="832" height="40" fill="#f2d4d4"/>
  <text x="44" y="315" fill="#7a1f1f" font-size="10" font-weight="700">앱이 파일 변경을 감지해야 합니다</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b8b3ad"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 900 520" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>EnvVar Configuration — 환경변수로 설정을 외부화하는 가장 단순한 방법</title>
  <desc>Kubernetes Patterns 19장. EnvVar Configuration은 설정을 앱에서 외부화하는 가장 단순한 방법으로, 12-factor 매니페스토가 권장합니다. 모든 OS·언어가 환경변수를 지원해 보편적입니다. 선언 방법은 Dockerfile ENV(빌드타임 기본값), docker run -e(런타임 오버라이드), Pod spec env(리터럴 값, configMapKeyRef, secretKeyRef 위임)입니다. 부가 기능으로 downward API(14장), envFrom 일괄 임포트, dependent variables($(IP):$(PORT) 참조, 앞서 정의된 것만 해석)가 있습니다. 한계 — 환경변수는 안전하지 않고(로그 유출), 값이 많아지면 관리가 불가능하며, 여러 수준에서 설정 가능해 파편화되고, 시작 전에만 설정 가능해 실행 중 변경 불가입니다. 이 불변성은 단점이자 장점(설정도 불변으로, 새 복사본으로 롤링 업데이트)입니다. 복잡한 설정엔 Configuration Resource·Immutable Configuration·Configuration Template이 대안입니다.</desc>

  <rect x="0" y="0" width="900" height="520" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16">EnvVar Configuration — 설정 외부화의 가장 단순한 방법</text>
  <text x="24" y="57" fill="rgb(138,133,128)" font-size="11">12-factor 권장. <tspan fill="#e8e4df">모든 OS·언어가 지원해 보편적.</tspan> 빌드타임 기본값을 런타임에 오버라이드하는 것이 전형적 패턴.</text>

  <!-- declaration ways -->
  <text x="24" y="86" fill="#e8e4df" font-size="12">선언 방법 — 빌드타임에서 런타임으로</text>
  <rect x="24" y="96" width="276" height="72" fill="#dceaf7"/>
  <text x="36" y="116" fill="#10243a" font-size="10" font-weight="700">Dockerfile ENV</text>
  <text x="36" y="133" fill="#10243a" font-size="8.5">빌드타임 하드코딩 기본값.</text>
  <text x="36" y="147" fill="#10243a" font-size="8.5">ENV SEED "1349093094"</text>
  <text x="36" y="161" fill="#10243a" font-size="8.5">Java: System.getenv("SEED")</text>

  <rect x="312" y="96" width="276" height="72" fill="#cdeccf"/>
  <text x="324" y="116" fill="#14521d" font-size="10" font-weight="700">docker run -e</text>
  <text x="324" y="133" fill="#14521d" font-size="8.5">런타임 오버라이드.</text>
  <text x="324" y="147" fill="#14521d" font-size="8.5">-e SEED="147110834325"</text>
  <text x="324" y="161" fill="#14521d" font-size="8.5">이미지 밖에서 파라미터 교체.</text>

  <rect x="600" y="96" width="276" height="72" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="612" y="116" fill="rgb(212,168,83)" font-size="10" font-weight="700">Pod spec env</text>
  <text x="612" y="133" fill="#e8e4df" font-size="8.5">value: 리터럴</text>
  <text x="612" y="147" fill="#e8e4df" font-size="8.5">valueFrom.configMapKeyRef</text>
  <text x="612" y="161" fill="#e8e4df" font-size="8.5">valueFrom.secretKeyRef (위임)</text>

  <!-- bonus features -->
  <text x="24" y="192" fill="#e8e4df" font-size="12">부가 기능</text>
  <rect x="24" y="202" width="418" height="72" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="36" y="222" fill="rgb(212,168,83)" font-size="10" font-weight="700">dependent variables</text>
  <text x="36" y="240" fill="#e8e4df" font-size="8.5">$(...) 로 앞서 정의된 env 참조.</text>
  <text x="36" y="254" fill="#e8e4df" font-size="8.5">MY_URL: "https://$(IP):$(PORT)"</text>
  <text x="36" y="268" fill="#e57373" font-size="8.5">⚠ 뒤에 정의된 변수를 참조하면 리터럴로 남음(순서 주의).</text>

  <rect x="458" y="202" width="418" height="72" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="470" y="222" fill="rgb(212,168,83)" font-size="10" font-weight="700">downward API · envFrom</text>
  <text x="470" y="240" fill="#e8e4df" font-size="8.5">downward API(14장): fieldRef로 Pod IP 등 주입.</text>
  <text x="470" y="254" fill="#e8e4df" font-size="8.5">envFrom: ConfigMap/Secret 전체를 일괄 임포트.</text>
  <text x="470" y="268" fill="#e8e4df" font-size="8.5">command에서도 $(OUTPUT_FILE) 형태로 치환 가능.</text>

  <!-- limitations -->
  <text x="24" y="298" fill="#e8e4df" font-size="12">한계 — 단순한 경우에만 적합</text>
  <rect x="24" y="308" width="418" height="98" fill="#f2d4d4"/>
  <text x="36" y="328" fill="#7a1f1f" font-size="10" font-weight="700">환경변수의 약점</text>
  <text x="36" y="346" fill="#7a1f1f" font-size="8.5">• 안전하지 않음 — 로그에 유출될 수 있음(Secret도 env로는 평문).</text>
  <text x="36" y="360" fill="#7a1f1f" font-size="8.5">• 값이 많아지면 관리 불가능.</text>
  <text x="36" y="374" fill="#7a1f1f" font-size="8.5">• 여러 수준에서 설정 → 파편화, 추적·디버깅 어려움.</text>
  <text x="36" y="388" fill="#7a1f1f" font-size="8.5">• 시작 전에만 설정 — 실행 중 변경 불가.</text>
  <text x="36" y="402" fill="#7a1f1f" font-size="8.5">Spring Boot 프로필을 이미지에 넣으면 설정과 앱이 강결합.</text>

  <rect x="458" y="308" width="418" height="98" fill="#cdeccf"/>
  <text x="470" y="328" fill="#14521d" font-size="10" font-weight="700">불변성은 장점이기도</text>
  <text x="470" y="346" fill="#14521d" font-size="8.5">실행 중 변경 불가 = 설정도 불변.</text>
  <text x="470" y="362" fill="#14521d" font-size="8.5">설정 바꾸려면 컨테이너를 버리고</text>
  <text x="470" y="376" fill="#14521d" font-size="8.5">새 복사본을 롤링 업데이트로 띄움.</text>
  <text x="470" y="392" fill="#14521d" font-size="8.5">→ 늘 정의된·알려진 설정 상태.</text>

  <!-- default values + next -->
  <rect x="24" y="418" width="852" height="42" fill="#f5edda"/>
  <text x="36" y="437" fill="#0d0d0d" font-size="9.5" font-weight="700">기본값 주의: 사후 변경이 어려움(재빌드·사용자 놀람). 시맨틱 버저닝의 major 변경 수준.</text>
  <text x="36" y="453" fill="#0d0d0d" font-size="9.5">90% 확신이 없으면 기본값을 아예 두지 말고 없으면 에러로 조기 실패시킴(비밀번호·DB 연결이 그런 후보 — 명시가 문서 역할도).</text>

  <rect x="24" y="470" width="852" height="30" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="36" y="489" fill="#e8e4df" font-size="9.5">복잡한 설정엔 다음 세 패턴이 대안 — <tspan fill="rgb(212,168,83)" font-weight="700">Configuration Resource(20장) · Immutable Configuration(21장) · Configuration Template(22장)</tspan>.</text>
</svg>

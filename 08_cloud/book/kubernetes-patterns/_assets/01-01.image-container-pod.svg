<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">이미지, 컨테이너, Pod의 관계</title>
  <desc id="desc">재사용 가능한 컨테이너 이미지가 실행 중인 컨테이너가 되고, Pod가 하나 이상의 컨테이너를 같은 실행 경계로 묶는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d4a853"/></marker>
  </defs>
  <rect width="960" height="360" fill="#0d0d0d"/>
  <text x="48" y="54" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="26" font-weight="700">정의에서 실행 경계까지</text>
  <text x="48" y="82" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="15">비유는 역할을 이해하기 위한 지도이며, Pod 안 컨테이너는 별도 프로세스입니다.</text>
  <rect x="48" y="126" width="216" height="166" rx="14" fill="#171614" stroke="#2a2520" stroke-width="2"/>
  <rect x="72" y="150" width="54" height="54" rx="10" fill="#d4a853"/>
  <path d="M88 166h22v22H88z M94 160h22v22H94z" fill="#0d0d0d" opacity=".8"/>
  <text x="72" y="235" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="21" font-weight="700">Container image</text>
  <text x="72" y="260" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="15">재사용 가능한 실행 정의</text>
  <text x="72" y="281" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="15">class와 닮은 비유</text>
  <path d="M284 209H356" stroke="#d4a853" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="297" y="193" fill="#d4a853" font-family="Pretendard, Arial, sans-serif" font-size="14">실행</text>
  <rect x="376" y="126" width="216" height="166" rx="14" fill="#171614" stroke="#2a2520" stroke-width="2"/>
  <circle cx="414" cy="177" r="27" fill="#66bb6a"/>
  <path d="M404 177h20M414 167v20" stroke="#0d0d0d" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="235" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="21" font-weight="700">Container</text>
  <text x="400" y="260" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="15">이미지를 실행한 프로세스</text>
  <text x="400" y="281" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="15">object와 닮은 비유</text>
  <path d="M612 209H684" stroke="#d4a853" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="622" y="193" fill="#d4a853" font-family="Pretendard, Arial, sans-serif" font-size="14">묶음</text>
  <rect x="704" y="108" width="208" height="202" rx="16" fill="#151817" stroke="#d4a853" stroke-width="2"/>
  <text x="728" y="143" fill="#d4a853" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="700">POD</text>
  <rect x="728" y="160" width="160" height="43" rx="8" fill="#25372a"/>
  <text x="746" y="187" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="16">app container</text>
  <rect x="728" y="214" width="160" height="43" rx="8" fill="#24211b"/>
  <text x="746" y="241" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="16">helper container</text>
  <text x="728" y="283" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="14">배치·생애주기 경계</text>
</svg>

<svg viewBox="0 0 900 400" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>제각각인 형식이 어댑터를 거쳐 하나로 수렴합니다</title>
  <desc>책의 Figure 17-1이 보이는 구도를 요약합니다. 왼쪽에 서로 다른 기술로 만들어진 세 서비스가 있습니다. 자바로 짜인 서비스는 JMX로 메트릭을 내놓고 파이썬 서비스는 자체 형식을 쓰며 레거시 서비스는 커스텀 로그 파일만 남깁니다. 셋의 형식이 모두 달라서 모니터링 도구가 그대로는 다룰 수 없습니다. 가운데에서 각 Pod마다 붙은 어댑터 컨테이너가 그 형식을 읽어 하나의 표준 형식으로 번역합니다. 세 어댑터가 내놓는 결과는 모두 같은 프로토콜과 같은 형식이라 오른쪽 모니터링 서버에는 세 서비스가 구별 없이 똑같이 보입니다. 아래쪽은 이 구조에서 중요한 점입니다. 메인 앱 컨테이너는 어느 것도 모니터링 도구의 존재를 모릅니다. 각자 원래 형식대로 쓸 뿐이고 도구에 맞추는 일은 전적으로 어댑터가 맡습니다. 그래서 모니터링 도구를 바꾸어도 앱은 그대로 두고 어댑터만 갈아 끼우면 됩니다.</desc>

  <rect width="900" height="400" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">형식이 달라도 같게 보입니다</text>

  <text x="120" y="60" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">제각각인 앱</text>
  <text x="404" y="60" text-anchor="middle" fill="rgb(212,168,83)" font-size="10" font-weight="700">adapter 가 번역</text>
  <text x="760" y="60" text-anchor="middle" fill="#cdeccf" font-size="10" font-weight="700">하나로 보입니다</text>

  <!-- row 1 : Java -->
  <rect x="24" y="76" width="192" height="40" fill="#dceaf7"/>
  <text x="120" y="93" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">Java 서비스</text>
  <text x="120" y="108" text-anchor="middle" fill="#10243a" font-size="9">JMX 형식</text>

  <path d="M 220 96 L 254 96" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <rect x="258" y="76" width="140" height="40" fill="rgb(212,168,83)"/>
  <text x="328" y="101" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">adapter</text>

  <path d="M 402 96 L 436 96" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>

  <!-- row 2 : Python -->
  <rect x="24" y="132" width="192" height="40" fill="#ddd4f0"/>
  <text x="120" y="149" text-anchor="middle" fill="#2d1f52" font-size="10" font-weight="700">Python 서비스</text>
  <text x="120" y="164" text-anchor="middle" fill="#2d1f52" font-size="9">자체 형식</text>

  <path d="M 220 152 L 254 152" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <rect x="258" y="132" width="140" height="40" fill="rgb(212,168,83)"/>
  <text x="328" y="157" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">adapter</text>

  <path d="M 402 152 L 436 152" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>

  <!-- row 3 : legacy -->
  <rect x="24" y="188" width="192" height="40" fill="#f2d4d4"/>
  <text x="120" y="205" text-anchor="middle" fill="#7a1f1f" font-size="10" font-weight="700">레거시 서비스</text>
  <text x="120" y="220" text-anchor="middle" fill="#7a1f1f" font-size="9">커스텀 로그 파일</text>

  <path d="M 220 208 L 254 208" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <rect x="258" y="188" width="140" height="40" fill="rgb(212,168,83)"/>
  <text x="328" y="213" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">adapter</text>

  <path d="M 402 208 L 436 208" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>

  <!-- unified band -->
  <rect x="440" y="76" width="180" height="152" fill="#cdeccf"/>
  <text x="530" y="142" text-anchor="middle" fill="#14521d" font-size="11" font-weight="700">같은 형식</text>
  <text x="530" y="162" text-anchor="middle" fill="#14521d" font-size="9" font-family="'JetBrains Mono', monospace">HTTP</text>

  <path d="M 624 152 L 658 152" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>

  <rect x="662" y="76" width="214" height="152" fill="#0d0d0d" stroke="#cdeccf"/>
  <text x="769" y="140" text-anchor="middle" fill="#cdeccf" font-size="11" font-weight="700">모니터링 서버</text>
  <text x="769" y="160" text-anchor="middle" fill="#cdeccf" font-size="9">구별하지 않습니다</text>

  <line x1="24" y1="256" x2="876" y2="256" stroke="#4a4640"/>

  <!-- key point -->
  <rect x="24" y="272" width="418" height="52" fill="#0d0d0d" stroke="#b8b3ad"/>
  <text x="44" y="294" fill="#e8e4df" font-size="10" font-weight="700">앱은 도구를 모릅니다</text>
  <text x="44" y="313" fill="#b8b3ad" font-size="9">원래 형식대로 쓸 뿐입니다</text>

  <rect x="458" y="272" width="418" height="52" fill="#0d0d0d" stroke="#b8b3ad"/>
  <text x="478" y="294" fill="#e8e4df" font-size="10" font-weight="700">도구를 바꾸면</text>
  <text x="478" y="313" fill="#b8b3ad" font-size="9">adapter 만 갈아 끼웁니다</text>

  <rect x="24" y="334" width="852" height="28" fill="rgb(212,168,83)"/>
  <text x="450" y="353" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">복잡성을 인터페이스 뒤로 숨깁니다</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="gm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
  </defs>
</svg>

<title id="dt">분단되면 ReplicaSet 은 잠시 둘이 됩니다</title><desc id="dd">같은 Pod 를 세 장면으로 봅니다. 처음에는 Node A 에서 Pod 하나가 돕니다. Node A 가 끊기면 NotReady 가 되고 unreachable taint 가 붙지만 Pod 는 계속 돕니다. tolerationSeconds 300초가 지나 축출하면 ReplicaSet 은 Node B 에 새 Pod 를 만들어 둘이 되고, StatefulSet 은 옛 Pod 종료를 확인할 때까지 기다립니다.</desc>

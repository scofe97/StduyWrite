<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">replicas: 1 이라도 새 Pod 는 옛 Pod 의 종료를 확인하기 전에 뜰 수 있습니다</text>

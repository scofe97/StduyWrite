<title id="dt">descheduler 가 놀고 있는 자원을 다시 쓸 수 있게 만듭니다</title><desc id="dd">Fig 6-2 의 값입니다. Node A 는 CPU 4코어를 모두 쓰고 메모리 12GB 중 4GB 가 stranded 로 남고, Node B 는 CPU 1코어와 메모리 3GB 가 비어 있습니다. descheduler 가 Node A 의 Pod 하나(cpu 1, memory 2GB, 예시)를 축출하면 A 에 CPU 1코어가 비어 남은 메모리를 다시 쓸 수 있고, 축출된 Pod 는 스케줄러가 다시 놓습니다.</desc>

<svg viewBox="0 0 860 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Service 이름이 clusterIP 로 해석되는 경로</title>
  <desc>소비자 Pod 가 Service 를 짧은 이름으로 호출했을 때 그 이름이 clusterIP 로 바뀌는 경로입니다. 소비자 Pod 안의 애플리케이션이 random-generator 라는 짧은 이름으로 요청을 보내면, Pod 의 etc resolv.conf 에 적힌 설정을 참조합니다. 이 파일에는 Service 이름 목록이 아니라 질의할 DNS 서버 주소인 nameserver 와 짧은 이름에 붙여 볼 접미사 목록인 search, 그리고 접미사를 붙일지 판단하는 기준인 options ndots 세 줄만 들어 있습니다. ndots 값이 5 이므로 점이 다섯 개 미만인 짧은 이름은 search 접미사를 앞에서부터 차례로 붙여 시도하며, 같은 네임스페이스의 Service 라면 첫 접미사인 default.svc.cluster.local 을 붙인 시도에서 바로 응답을 받습니다. 질의를 받는 쪽은 CoreDNS 이고 Service 이름과 주소의 대응 관계는 CoreDNS 가 들고 있습니다. CoreDNS 는 A 레코드로 clusterIP 를 돌려줍니다. 다만 headless Service 인 경우에는 여기서 경로가 갈려, 가상 IP 가 없으므로 clusterIP 대신 백킹 Pod 들의 실제 IP 가 그대로 응답됩니다. 이름 해석이 끝나면 애플리케이션은 목적지 IP 를 얻은 상태가 되고, 소스는 자기 Pod IP 이고 목적지는 clusterIP 인 패킷이 만들어져 커널로 넘어갑니다. 그 뒤 커널에서 일어나는 주소 변환은 별도 문서인 K8s 패킷 여정에서 다룹니다.</desc>

  <defs>
    <marker id="qa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="qg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#66bb6a"/>
    </marker>
  </defs>

  <rect width="860" height="400" fill="#0d0d0d"/>
  <text x="24" y="32" fill="#e8e4df" font-size="14">이름 해석</text>

  <!-- consumer pod -->
  <rect x="30" y="60" width="360" height="248" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="46" y="82" fill="#5b9bd5" font-size="11" font-weight="700">소비자 Pod</text>
  <text x="374" y="82" text-anchor="end" fill="#b8b3ad" font-size="10">10.244.1.5</text>

  <rect x="50" y="96" width="320" height="40" fill="#cdeccf"/>
  <text x="62" y="112" fill="#14521d" font-size="10" font-weight="700">1. 짧은 이름으로 호출</text>
  <rect x="62" y="117" width="296" height="15" fill="#e6f7e7"/>
  <text x="70" y="129" fill="#14521d" font-size="8" font-weight="700">http://random-generator/</text>

  <path d="M210 142 L210 156" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#qg)"/>

  <rect x="50" y="162" width="320" height="82" fill="#f5edda"/>
  <text x="62" y="178" fill="#0d0d0d" font-size="10" font-weight="700">2. /etc/resolv.conf</text>
  <rect x="62" y="184" width="296" height="15" fill="#fdf3df"/>
  <text x="70" y="196" fill="#0d0d0d" font-size="8" font-weight="700">nameserver 10.96.0.10</text>
  <rect x="62" y="202" width="296" height="15" fill="#fdf3df"/>
  <text x="70" y="214" fill="#0d0d0d" font-size="7.5" font-weight="700">search default.svc.cluster.local svc.cluster.local</text>
  <rect x="62" y="220" width="296" height="15" fill="#fdf3df"/>
  <text x="70" y="232" fill="#0d0d0d" font-size="8" font-weight="700">options ndots:5</text>

  <path d="M210 250 L210 264" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#qg)"/>

  <rect x="50" y="270" width="320" height="24" fill="#dceaf7"/>
  <rect x="62" y="274" width="296" height="15" fill="#eef6fc"/>
  <text x="70" y="286" fill="#10243a" font-size="7.5" font-weight="700">random-generator.default.svc.cluster.local</text>

  <!-- coredns -->
  <rect x="470" y="60" width="360" height="140" fill="#dceaf7"/>
  <text x="486" y="84" fill="#10243a" font-size="11" font-weight="700">3. CoreDNS</text>
  <text x="814" y="84" text-anchor="end" fill="#10243a" font-size="10">10.96.0.10</text>

  <rect x="486" y="100" width="328" height="18" fill="#eef6fc"/>
  <text x="496" y="113" fill="#10243a" font-size="8" font-weight="700">random-generator.default.svc.cluster.local</text>

  <rect x="486" y="126" width="328" height="18" fill="#eef6fc"/>
  <text x="496" y="139" fill="#10243a" font-size="8" font-weight="700">응답  A  10.109.72.32</text>

  <rect x="486" y="156" width="328" height="30" fill="#f5edda"/>
  <text x="496" y="169" fill="#0d0d0d" font-size="9" font-weight="700">headless 이면</text>
  <rect x="582" y="160" width="222" height="15" fill="#fdf3df"/>
  <text x="590" y="172" fill="#0d0d0d" font-size="8" font-weight="700">Pod IP 목록</text>
  <text x="496" y="182" fill="#0d0d0d" font-size="8">12 장</text>

  <path d="M376 200 L464 130" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#qa)"/>
  <text x="420" y="152" text-anchor="middle" fill="rgb(212,168,83)" font-size="9">질의</text>

  <path d="M464 155 L376 225" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#qa)"/>
  <text x="424" y="206" text-anchor="middle" fill="rgb(212,168,83)" font-size="9">clusterIP</text>

  <!-- outcome -->
  <rect x="470" y="220" width="360" height="88" fill="#cdeccf"/>
  <text x="486" y="242" fill="#14521d" font-size="10" font-weight="700">4. 패킷 생성</text>
  <rect x="486" y="250" width="328" height="16" fill="#e6f7e7"/>
  <text x="496" y="262" fill="#14521d" font-size="8" font-weight="700">src  10.244.1.5</text>
  <rect x="486" y="270" width="328" height="16" fill="#e6f7e7"/>
  <text x="496" y="282" fill="#14521d" font-size="8" font-weight="700">dst  10.109.72.32:80</text>
  <text x="486" y="300" fill="#14521d" font-size="9">여기까지가 이름 해석</text>

  <!-- boundary -->
  <path d="M30 330 L830 330" fill="none" stroke="#b8b3ad" stroke-width="1" stroke-dasharray="5,4"/>

  <rect x="30" y="344" width="800" height="40" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1"/>
  <text x="46" y="362" fill="#b8b3ad" font-size="10" font-weight="700">이 아래는 커널의 주소 변환 영역</text>
  <rect x="290" y="350" width="240" height="16" fill="#f5edda"/>
  <text x="300" y="362" fill="#0d0d0d" font-size="8" font-weight="700">netfilter · conntrack</text>
  <text x="46" y="378" fill="#b8b3ad" font-size="9">02_os/networking/01-02</text>
</svg>

<svg viewBox="0 0 920 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Pod 안에서 공유되는 경계와 독립적인 경계</title>
  <desc>한 Pod의 컨테이너 A와 B는 같은 네트워크 네임스페이스와 명시적으로 마운트한 공유 Volume을 함께 쓰지만, 환경변수와 루트 파일시스템은 각각 독립적입니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/></marker>
  </defs>
  <rect width="920" height="470" fill="#0d0d0d"/>
  <text x="30" y="40" fill="#e8e4df" font-size="18" font-weight="700">Pod는 함께 배치되지만, 모든 런타임 상태를 자동 공유하지는 않습니다</text>
  <text x="30" y="66" fill="rgb(138,133,128)" font-size="12">같은 Pod의 협력은 공유 네트워크와 명시적 Volume에서 나오며, 컨테이너 자체는 별도 프로세스입니다.</text>

  <rect x="30" y="92" width="860" height="330" rx="14" fill="rgb(20,20,20)" stroke="rgb(212,168,83)" stroke-width="2"/>
  <text x="56" y="125" fill="rgb(212,168,83)" font-size="15" font-weight="700">Pod</text>

  <rect x="65" y="154" width="328" height="182" rx="10" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="88" y="185" fill="#e8e4df" font-size="15" font-weight="700">Container A</text>
  <rect x="90" y="208" width="278" height="42" rx="6" fill="rgba(244,67,54,0.12)" stroke="#f44336"/>
  <text x="108" y="234" fill="#e8e4df" font-size="12">독립: 환경변수 · 루트 파일시스템</text>
  <rect x="90" y="262" width="278" height="50" rx="6" fill="rgb(17,29,43)" stroke="rgb(42,37,32)"/>
  <text x="108" y="284" fill="#e8e4df" font-size="12">프로세스 A</text>
  <text x="108" y="303" fill="rgb(138,133,128)" font-size="11">애플리케이션 서버</text>

  <rect x="527" y="154" width="328" height="182" rx="10" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="550" y="185" fill="#e8e4df" font-size="15" font-weight="700">Container B</text>
  <rect x="552" y="208" width="278" height="42" rx="6" fill="rgba(244,67,54,0.12)" stroke="#f44336"/>
  <text x="570" y="234" fill="#e8e4df" font-size="12">독립: 환경변수 · 루트 파일시스템</text>
  <rect x="552" y="262" width="278" height="50" rx="6" fill="rgb(17,29,43)" stroke="rgb(42,37,32)"/>
  <text x="570" y="284" fill="#e8e4df" font-size="12">프로세스 B</text>
  <text x="570" y="303" fill="rgb(138,133,128)" font-size="11">로그·프록시 보조 기능</text>

  <rect x="410" y="143" width="100" height="92" rx="10" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="460" y="172" text-anchor="middle" fill="#e8e4df" font-size="12" font-weight="700">공유 네트워크</text>
  <text x="460" y="195" text-anchor="middle" fill="rgb(212,168,83)" font-size="11">Pod IP</text>
  <text x="460" y="216" text-anchor="middle" fill="rgb(212,168,83)" font-size="11">localhost · 포트</text>
  <line x1="393" y1="190" x2="410" y2="190" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="527" y1="190" x2="510" y2="190" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="348" width="260" height="48" rx="10" fill="rgba(102,187,106,0.13)" stroke="#66bb6a"/>
  <text x="460" y="371" text-anchor="middle" fill="#e8e4df" font-size="13" font-weight="700">공유 Volume</text>
  <text x="460" y="388" text-anchor="middle" fill="#66bb6a" font-size="10">두 컨테이너가 같은 Volume을 마운트한 경우만</text>
  <line x1="220" y1="336" x2="330" y2="370" stroke="#66bb6a" stroke-width="2" marker-end="url(#green-arrow)"/>
  <line x1="700" y1="336" x2="590" y2="370" stroke="#66bb6a" stroke-width="2" marker-end="url(#green-arrow)"/>

  <text x="30" y="452" fill="rgb(138,133,128)" font-size="12">결론: 같이 배치·시작·종료할 이유가 있고 공유 네트워크 또는 Volume이 필요할 때만 여러 컨테이너를 한 Pod에 둡니다.</text>
</svg>

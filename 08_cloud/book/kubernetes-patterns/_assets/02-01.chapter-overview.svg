<title id="dt">Pod 선언 한 장이 걷는 길</title><desc id="dd">한 Pod 의 requests, limits, priorityClassName 이 입장, 배치, 기동, 압박, 계획 여섯 단계에서 서로 다른 주체에게 읽힙니다. 선언 값은 그대로이고 읽는 주체와 결과가 바뀝니다.</desc>
<rect width="1000" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES PATTERNS · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Pod 선언 한 장이 걷는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">requests cpu 100m · memory 200Mi, limits memory 200Mi, priorityClassName high-priority 를 한 Pod 에 적은 경우</text>
<rect x="24" y="104" width="136" height="220" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="92" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">1 선언</text>

<title id="dt">effect 셋은 이미 도는 Pod 를 다르게 다룹니다</title><desc id="dd">행은 taint 의 effect 셋이고 열은 Pod 의 처지 셋입니다. NoSchedule 은 새 Pod 의 배치만 막고 이미 도는 Pod 는 그대로 두며, PreferNoSchedule 은 새 Pod 의 점수만 낮춥니다. NoExecute 만 이미 도는 Pod 를 축출하고, toleration 에 tolerationSeconds 300 이 있으면 300초 뒤에 축출합니다.</desc>
<rect width="960" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES PATTERNS · 06-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">effect 셋은 이미 도는 Pod 를 다르게 다룹니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이미 도는 Pod 를 내보내는 effect 는 NoExecute 하나뿐입니다</text>
<text x="360" y="104" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">새 Pod</text>
<text x="360" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">toleration 없음</text>
<text x="596" y="104" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">이미 도는 Pod</text>
<text x="596" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">toleration 없음</text>
<text x="832" y="104" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">toleration 있는 Pod</text>
<text x="832" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">tolerationSeconds: 300</text>

<svg viewBox="0 0 880 330" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>생애주기 제어 수단이 노력과 보장을 맞바꾸며 올라가는 순서</title>
  <desc>컨테이너 생애주기를 제어하는 세 가지 수단이 노력과 보장을 맞바꾸며 단계적으로 올라가는 관계를 보입니다. 가장 가벼운 것은 생애주기 훅으로 컨테이너 단위에서 postStart와 preStop 명령을 실행하며, 노력은 적지만 실행 순서나 실행 자체가 보장되지 않습니다. 다음은 init 컨테이너로 Pod 단위에서 순차 실행되고 완료까지 실행되며 모든 앱 컨테이너보다 먼저 끝나야 하지만, 사이드카를 허용하지 않는다는 한계가 있습니다. 가장 무거운 것은 supervisor 데몬을 주입해 컨테이너의 entrypoint를 감싸는 Commandlet 패턴으로, init 컨테이너가 supervisor를 공유 볼륨에 복사하고 주 컨테이너가 원래 명령 대신 그것을 실행합니다. Tekton이나 Argo처럼 Pod를 프로그래밍적으로 만들고 사이드카를 포함한 순차 실행이 필요한 플랫폼이 이 방식을 씁니다.</desc>

  <rect width="880" height="330" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">노력과 보장을 맞바꾸는 세 단계</text>

  <!-- step 1 -->
  <rect x="24" y="52" width="250" height="96" fill="#cdeccf"/>
  <text x="44" y="76" fill="#14521d" font-size="12" font-weight="700">1. 생애주기 훅</text>
  <text x="44" y="97" fill="#14521d" font-size="10">컨테이너 단위</text>
  <rect x="44" y="106" width="210" height="20" fill="#e6f7e7"/>
  <text x="149" y="120" text-anchor="middle" fill="#14521d" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace">postStart · preStop</text>
  <text x="44" y="141" fill="#7a1f1f" font-size="10" font-weight="700">실행 보장 없음</text>

  <path d="M 278 100 L 316 100" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <!-- step 2 -->
  <rect x="320" y="52" width="250" height="96" fill="#dceaf7"/>
  <text x="340" y="76" fill="#10243a" font-size="12" font-weight="700">2. init 컨테이너</text>
  <text x="340" y="97" fill="#10243a" font-size="10">Pod 단위 · 순차 · 완료까지</text>
  <rect x="340" y="106" width="210" height="20" fill="#f7fbff"/>
  <text x="445" y="120" text-anchor="middle" fill="#10243a" font-size="9" font-weight="700">앱 컨테이너보다 먼저</text>
  <text x="340" y="141" fill="#7a1f1f" font-size="10" font-weight="700">사이드카 불가</text>

  <path d="M 574 100 L 612 100" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <!-- step 3 -->
  <rect x="616" y="52" width="240" height="96" fill="rgb(212,168,83)"/>
  <text x="636" y="76" fill="#0d0d0d" font-size="12" font-weight="700">3. supervisor 주입</text>
  <text x="636" y="97" fill="#0d0d0d" font-size="10">entrypoint 재작성</text>
  <rect x="636" y="106" width="200" height="20" fill="#fdf3df"/>
  <text x="736" y="120" text-anchor="middle" fill="#0d0d0d" font-size="9" font-weight="700">Commandlet 패턴</text>
  <text x="636" y="141" fill="#0d0d0d" font-size="10" font-weight="700">Tekton · Argo 가 사용</text>

  <!-- axis -->
  <path d="M 24 172 L 856 172" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="24" y="190" fill="#b8b3ad" font-size="10">노력 적음 · 보장 약함</text>
  <text x="856" y="190" text-anchor="end" fill="#b8b3ad" font-size="10">노력 큼 · 보장 강함 · 재사용</text>

  <!-- how supervisor injection works -->
  <text x="24" y="222" fill="#e8e4df" font-size="12" font-weight="700">supervisor 주입 방식</text>

  <rect x="24" y="234" width="196" height="52" fill="#dceaf7"/>
  <text x="122" y="256" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">init 컨테이너</text>
  <text x="122" y="274" text-anchor="middle" fill="#10243a" font-size="9">supervisor 복사</text>

  <path d="M 224 260 L 268 260" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>

  <rect x="272" y="234" width="196" height="52" fill="#cdeccf"/>
  <text x="370" y="256" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">공유 emptyDir 볼륨</text>
  <text x="370" y="274" text-anchor="middle" fill="#14521d" font-size="9" font-family="'JetBrains Mono', monospace">/var/run/wrapper</text>

  <path d="M 472 260 L 516 260" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>

  <rect x="520" y="234" width="336" height="52" fill="#f5edda"/>
  <text x="540" y="254" fill="#0d0d0d" font-size="10" font-weight="700">주 컨테이너가 실행</text>
  <text x="540" y="274" fill="#0d0d0d" font-size="9">원래 명령은 그 인자가 됩니다</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b8b3ad"/>
    </marker>
  </defs>
</svg>

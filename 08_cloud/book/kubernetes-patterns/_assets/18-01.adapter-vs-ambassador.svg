<svg viewBox="0 0 900 380" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>어댑터와 앰배서더는 같은 부모에서 반대 방향으로 갈립니다</title>
  <desc>사이드카의 두 특화 패턴이 방향에서 어떻게 대칭인지를 한 장으로 비교합니다. 가운데 세로선을 기준으로 왼쪽이 바깥세상이고 오른쪽이 앱입니다. 위쪽 줄은 Adapter입니다. 바깥에 있는 모니터링 서버 같은 소비자가 요청을 보내면 어댑터가 그것을 받아 앱의 출력을 통일된 형식으로 바꿔 응답합니다. 화살표가 바깥에서 앱 쪽으로 들어오므로 inbound이고 서버 앞에 서는 reverse proxy입니다. 아래쪽 줄은 Ambassador입니다. 앱이 캐시나 레지스트리 같은 외부 의존을 부르려 할 때 앰배서더가 그 호출을 대신 받아 바깥으로 내보냅니다. 화살표가 앱에서 바깥으로 나가므로 outbound이고 클라이언트를 대신하는 forward proxy입니다. 두 화살표가 정확히 반대를 가리키는 것이 이 그림의 요점입니다. 맨 아래는 둘의 공통점으로 어느 쪽이든 메인 앱 컨테이너는 그대로 두고 특수 로직만 별도 컨테이너로 격리한다는 점이 같습니다.</desc>

  <rect width="900" height="380" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">화살표가 정반대입니다</text>

  <!-- column headers -->
  <text x="150" y="62" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">바깥세상</text>
  <text x="700" y="62" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">앱</text>

  <!-- center divider -->
  <line x1="450" y1="70" x2="450" y2="266" stroke="#4a4640" stroke-dasharray="4 4"/>

  <!-- ===== Adapter : inbound ===== -->
  <text x="24" y="100" fill="#5b9bd5" font-size="11" font-weight="700">Adapter</text>
  <text x="24" y="116" fill="#b8b3ad" font-size="9">17장</text>

  <rect x="110" y="82" width="150" height="44" fill="#0d0d0d" stroke="#dceaf7"/>
  <text x="185" y="102" text-anchor="middle" fill="#dceaf7" font-size="10" font-weight="700">모니터링 서버</text>
  <text x="185" y="118" text-anchor="middle" fill="#dceaf7" font-size="9">소비자</text>

  <path d="M 264 104 L 490 104" stroke="#5b9bd5" stroke-width="2" marker-end="url(#bm)"/>
  <text x="377" y="96" text-anchor="middle" fill="#5b9bd5" font-size="9" font-weight="700">들어옵니다 · inbound</text>

  <rect x="494" y="82" width="140" height="44" fill="#dceaf7"/>
  <text x="564" y="102" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">adapter</text>
  <text x="564" y="118" text-anchor="middle" fill="#10243a" font-size="9">reverse proxy</text>

  <rect x="658" y="82" width="218" height="44" fill="#cdeccf"/>
  <text x="767" y="108" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">앱의 출력을 통일합니다</text>

  <line x1="24" y1="152" x2="876" y2="152" stroke="#4a4640"/>

  <!-- ===== Ambassador : outbound ===== -->
  <text x="24" y="196" fill="#66bb6a" font-size="11" font-weight="700">Ambassador</text>
  <text x="24" y="212" fill="#b8b3ad" font-size="9">18장</text>

  <rect x="110" y="178" width="150" height="44" fill="#0d0d0d" stroke="#f5edda"/>
  <text x="185" y="198" text-anchor="middle" fill="#f5edda" font-size="10" font-weight="700">캐시 · 레지스트리</text>
  <text x="185" y="214" text-anchor="middle" fill="#f5edda" font-size="9">외부 의존</text>

  <path d="M 490 200 L 264 200" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>
  <text x="377" y="192" text-anchor="middle" fill="#66bb6a" font-size="9" font-weight="700">나갑니다 · outbound</text>

  <rect x="494" y="178" width="140" height="44" fill="#f5edda"/>
  <text x="564" y="198" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">ambassador</text>
  <text x="564" y="214" text-anchor="middle" fill="#0d0d0d" font-size="9">forward proxy</text>

  <rect x="658" y="178" width="218" height="44" fill="#cdeccf"/>
  <text x="767" y="204" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">앱의 호출을 대신합니다</text>

  <!-- localhost note -->
  <text x="564" y="248" text-anchor="middle" fill="#b8b3ad" font-size="9">앱은 localhost 로만 부릅니다</text>

  <line x1="24" y1="278" x2="876" y2="278" stroke="#4a4640"/>

  <!-- shared -->
  <rect x="24" y="292" width="418" height="44" fill="#0d0d0d" stroke="#b8b3ad"/>
  <text x="44" y="312" fill="#e8e4df" font-size="10" font-weight="700">둘 다 Sidecar 의 특화</text>
  <text x="44" y="329" fill="#b8b3ad" font-size="9">메인 앱은 그대로 둡니다</text>

  <rect x="458" y="292" width="418" height="44" fill="#0d0d0d" stroke="#b8b3ad"/>
  <text x="478" y="312" fill="#e8e4df" font-size="10" font-weight="700">특수 로직만 격리</text>
  <text x="478" y="329" fill="#b8b3ad" font-size="9">단일 목적으로 재사용합니다</text>

  <rect x="24" y="346" width="852" height="26" fill="rgb(212,168,83)"/>
  <text x="450" y="364" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">방향 하나로 갈라집니다</text>

  <defs>
    <marker id="bm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#5b9bd5"/>
    </marker>
    <marker id="gm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
  </defs>
</svg>

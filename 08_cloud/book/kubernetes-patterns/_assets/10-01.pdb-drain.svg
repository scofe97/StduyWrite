<title id="dt">drain 의 축출 요청을 PDB 가 걸러냅니다</title><desc id="dd">kubectl drain 이 노드를 cordon 하고 Pod 마다 Eviction API 를 호출하면 API 서버는 PDB 의 disruptionsAllowed 를 봅니다. replicas 3 에 minAvailable 2 면 하나는 허용하고 다음 요청은 429 로 거부하며, 새 Pod 가 Ready 가 되면 재시도가 통과합니다. replicas 1 에 minAvailable 1 이면 허용 수가 0 이라 429 가 반복되고 drain 이 끝나지 않습니다.</desc>
<rect width="960" height="968" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES PATTERNS · 10-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">drain 의 축출 요청을 PDB 가 걸러냅니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">PDB 는 허용 수만 계산하므로 싱글턴에 걸면 그 Pod 는 축출되지 않습니다</text>

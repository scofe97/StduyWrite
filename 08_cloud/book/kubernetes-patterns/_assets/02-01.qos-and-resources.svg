<title id="dt">무엇을 적었는가가 등급을 정하고, 등급은 축출 순서의 추정치일 뿐입니다</title><desc id="dd">requests 와 limits 를 어떻게 적었는지가 행이고 그 결과가 열입니다. requests 만 적고 limits 를 생략한 가장 흔한 경우도 Burstable 입니다. kubelet 은 QoS 등급으로 축출 순서를 정하지 않고 request 를 넘겼는지를 먼저 봅니다.</desc>
<rect width="884" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES PATTERNS · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">무엇을 적었는가가 등급을 정하고, 등급은 축출 순서의 추정치일 뿐입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">등급은 순서를 결정하지 않습니다 — 1번 기준은 자기 request 를 넘겼는가입니다</text>
<rect x="12" y="96" width="216" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="120" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">무엇을 적었는가</text>
<text x="120" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Pod 의 모든 컨테이너 기준</text>
<rect x="240" y="96" width="196" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="338" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">QoS 등급</text>
<text x="338" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">자동 판정</text>
<rect x="452" y="96" width="196" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="550" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">축출에서 뜻하는 것</text>
<text x="550" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">kubelet 의 1번 기준</text>
<rect x="664" y="96" width="196" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="762" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">한도를 넘기면</text>
<text x="762" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">압축 가능 · 불가</text>
<rect x="12" y="168" width="216" height="60" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="26" y="194" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">requests · limits 없음</text>
<text x="26" y="213" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">아무것도 안 적음</text>
<rect x="240" y="168" width="196" height="60" rx="4" fill="#F0616D10" stroke="#F0616D" stroke-width="0.9"/>
<text x="338" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">Best-Effort</text>
<rect x="452" y="168" width="196" height="60" rx="4" fill="#F0616D10" stroke="#F0616D" stroke-width="0.9"/>
<text x="550" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">request 가 없어 항상 초과</text>
<text x="550" y="213" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D"></text>
<rect x="664" y="168" width="196" height="60" rx="4" fill="#F0616D10" stroke="#F0616D" stroke-width="0.9"/>
<text x="762" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">메모리는 죽습니다</text>
<rect x="12" y="236" width="216" height="60" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="26" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">requests 만 적음</text>
<text x="26" y="281" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">limits 생략 — 가장 흔함</text>
<rect x="240" y="236" width="196" height="60" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="338" y="261" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">Burstable</text>
<text x="338" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">이 책의 권장이 여기입니다</text>
<rect x="452" y="236" width="196" height="60" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="0.9"/>
<text x="550" y="263" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">request 안이면 늦게 나갑니다</text>
<text x="550" y="281" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C"></text>
<rect x="664" y="236" width="196" height="60" rx="4" fill="#E3B34110" stroke="#E3B341" stroke-width="0.9"/>
<text x="762" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">CPU 는 스로틀</text>
<rect x="12" y="304" width="216" height="60" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="26" y="330" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">requests ≠ limits</text>
<text x="26" y="349" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">limits 를 더 크게</text>
<rect x="240" y="304" width="196" height="60" rx="4" fill="#E3B34110" stroke="#E3B341" stroke-width="0.9"/>
<text x="338" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">Burstable</text>
<rect x="452" y="304" width="196" height="60" rx="4" fill="#F0616D10" stroke="#F0616D" stroke-width="0.9"/>
<text x="550" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">넘긴 만큼 먼저 나갑니다</text>
<rect x="664" y="304" width="196" height="60" rx="4" fill="#E3B34110" stroke="#E3B341" stroke-width="0.9"/>
<text x="762" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">limit 까지 자랍니다</text>
<rect x="12" y="372" width="216" height="60" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="26" y="398" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">메모리 requests = limits</text>
<text x="26" y="417" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">CPU limit 은 비움</text>
<rect x="240" y="372" width="196" height="60" rx="4" fill="#E3B34110" stroke="#E3B341" stroke-width="0.9"/>
<text x="338" y="406" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">Burstable</text>
<rect x="452" y="372" width="196" height="60" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="0.9"/>
<text x="550" y="399" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">메모리는 넘길 수 없습니다</text>
<text x="550" y="417" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C"></text>
<rect x="664" y="372" width="196" height="60" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="0.9"/>
<text x="762" y="406" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">CPU 만 스로틀</text>
<rect x="12" y="440" width="216" height="60" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="26" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">CPU · 메모리 모두 같음</text>
<text x="26" y="485" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">둘 다 request = limit</text>
<rect x="240" y="440" width="196" height="60" rx="4" fill="#6A95D810" stroke="#6A95D8" stroke-width="0.9"/>
<text x="338" y="474" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">Guaranteed</text>
<rect x="452" y="440" width="196" height="60" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="0.9"/>
<text x="550" y="474" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">마지막에 나갑니다</text>
<rect x="664" y="440" width="196" height="60" rx="4" fill="#E3B34110" stroke="#E3B341" stroke-width="0.9"/>
<text x="762" y="467" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">CFS 스로틀을 떠안습니다</text>
<text x="762" y="485" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341"></text>
<line x1="12" y1="518" x2="860" y2="518" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">kubelet 이 보는 순서는 ① request 초과 여부 ② Pod Priority ③ 초과량입니다. 등급은 그 결과의 추정치로만 씁니다.</text>
<line x1="12" y1="552" x2="836" y2="552" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="574" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="564" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가장 먼저</text>
<rect x="209" y="564" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="231" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">중간</text>
<rect x="279" y="564" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="301" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">늦게</text>
<rect x="349" y="564" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="371" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">권장 조합</text>
</svg>
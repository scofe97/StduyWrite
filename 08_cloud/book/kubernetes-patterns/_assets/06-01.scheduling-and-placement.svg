<svg viewBox="0 0 900 360" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>새 Pod가 노드에 배정되기까지 거치는 세 단계</title>
  <desc>노드에 아직 배정되지 않은 새 Pod가 스케줄러를 거쳐 노드에 바인딩되기까지의 과정을 보입니다. 스케줄러는 API 서버에서 새 Pod를 가용 노드 목록 및 필터링과 우선순위 정책과 함께 집어 옵니다. 첫 단계인 필터링에서는 자격 없는 노드를 모두 제거하며, Pod의 스케줄링 요구를 만족해 남은 노드를 feasible node라 부릅니다. 두 번째 단계인 스코어링에서는 남은 feasible 노드에 점수를 매기는 함수들을 돌려 가중치 순으로 정렬합니다. 마지막 바인딩 단계에서 스케줄러가 API 서버에 배정 결정을 알리며, 이것이 스케줄링 과정의 주된 산출입니다. 아래쪽에는 스케줄러가 일하기 위한 두 전제를 표시합니다. 노드에 할당 가능한 가용 용량이 있어야 하고, 컨테이너가 request와 limit으로 자원 프로파일을 선언해야 합니다.</desc>

  <rect width="900" height="360" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">새 Pod가 노드에 배정되기까지</text>

  <!-- input -->
  <rect x="24" y="60" width="150" height="70" fill="#dceaf7"/>
  <text x="99" y="86" text-anchor="middle" fill="#10243a" font-size="11" font-weight="700">새 Pod</text>
  <text x="99" y="106" text-anchor="middle" fill="#10243a" font-size="10">노드 미배정</text>
  <text x="99" y="122" text-anchor="middle" fill="#10243a" font-size="9">API 서버에서 집어옴</text>

  <path d="M 178 95 L 222 95" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <!-- stage 1: filtering -->
  <rect x="226" y="60" width="186" height="70" fill="rgb(212,168,83)"/>
  <text x="319" y="84" text-anchor="middle" fill="#0d0d0d" font-size="11" font-weight="700">1. 필터링</text>
  <text x="319" y="103" text-anchor="middle" fill="#0d0d0d" font-size="10">자격 없는 노드 제거</text>
  <rect x="242" y="110" width="154" height="16" fill="#fdf3df"/>
  <text x="319" y="122" text-anchor="middle" fill="#0d0d0d" font-size="9" font-weight="700">남으면 feasible node</text>

  <path d="M 416 95 L 460 95" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <!-- stage 2: scoring -->
  <rect x="464" y="60" width="186" height="70" fill="rgb(212,168,83)"/>
  <text x="557" y="84" text-anchor="middle" fill="#0d0d0d" font-size="11" font-weight="700">2. 스코어링</text>
  <text x="557" y="103" text-anchor="middle" fill="#0d0d0d" font-size="10">점수 매겨 정렬</text>
  <rect x="480" y="110" width="154" height="16" fill="#fdf3df"/>
  <text x="557" y="122" text-anchor="middle" fill="#0d0d0d" font-size="9" font-weight="700">가중치 순</text>

  <path d="M 654 95 L 698 95" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>

  <!-- stage 3: binding -->
  <rect x="702" y="60" width="174" height="70" fill="#cdeccf"/>
  <text x="789" y="84" text-anchor="middle" fill="#14521d" font-size="11" font-weight="700">3. 바인딩</text>
  <text x="789" y="103" text-anchor="middle" fill="#14521d" font-size="10">API 서버에 통보</text>
  <rect x="718" y="110" width="142" height="16" fill="#e6f7e7"/>
  <text x="789" y="122" text-anchor="middle" fill="#14521d" font-size="9" font-weight="700">스케줄링의 주 산출</text>

  <line x1="24" y1="156" x2="876" y2="156" stroke="#2a2a2a"/>

  <!-- prerequisites -->
  <text x="24" y="182" fill="#e8e4df" font-size="12" font-weight="700">스케줄러가 일하기 위한 두 전제</text>

  <rect x="24" y="194" width="410" height="80" fill="#dceaf7"/>
  <text x="44" y="216" fill="#10243a" font-size="11" font-weight="700">노드에 가용 용량</text>
  <rect x="44" y="226" width="370" height="18" fill="#f7fbff"/>
  <text x="229" y="239" text-anchor="middle" fill="#10243a" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace">Allocatable</text>
  <text x="44" y="262" fill="#10243a" font-size="10">Capacity 에서 예약분을 뺍니다</text>

  <rect x="466" y="194" width="410" height="80" fill="#cdeccf"/>
  <text x="486" y="216" fill="#14521d" font-size="11" font-weight="700">컨테이너에 자원 프로파일</text>
  <rect x="486" y="226" width="370" height="18" fill="#e6f7e7"/>
  <text x="671" y="239" text-anchor="middle" fill="#14521d" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace">requests · limits</text>
  <text x="486" y="262" fill="#14521d" font-size="10">배치는 requests 만 봅니다</text>

  <!-- bottom note -->
  <rect x="24" y="292" width="852" height="46" fill="#f5edda"/>
  <text x="44" y="312" fill="#0d0d0d" font-size="11" font-weight="700">배치는 한 번뿐입니다</text>
  <text x="44" y="330" fill="#0d0d0d" font-size="10">과거 배치는 고쳐지지 않습니다</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 900 520" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Self Awareness — downward API로 Pod 메타데이터 주입</title>
  <desc>Kubernetes Patterns 14장. 앱이 자기 자신에 대한 정보(Pod 이름·IP·호스트명·리소스 한계·라벨·어노테이션)를 알아야 할 때, downward API가 그 메타데이터를 환경변수나 파일로 주입합니다. 앱은 Kubernetes API 클라이언트를 쓰지 않고 로컬에서 값을 읽으므로 Kubernetes-agnostic으로 남습니다. fieldRef는 Pod 수준 메타데이터(nodeName·podIP·name·namespace·labels·annotations 등)를, resourceFieldRef는 컨테이너 리소스 스펙(requests/limits의 cpu·memory 등)을 참조합니다. 환경변수 주입은 시작 시점 고정이라 실행 중 라벨·어노테이션 변경을 반영하지 못하지만, downwardAPI 볼륨은 파일로 마운트되어 변경을 반영합니다(앱이 파일 변경을 감지해야 함). 고정된 키 집합만 제공하므로 더 많은 정보가 필요하면 API Server를 직접 조회합니다.</desc>

  <rect x="0" y="0" width="900" height="520" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16">Self Awareness — downward API</text>
  <text x="24" y="57" fill="rgb(138,133,128)" font-size="11">앱이 자기 Pod 메타데이터를 알아야 할 때. <tspan fill="#e8e4df">API 클라이언트 없이</tspan> 로컬 env·파일로 받아 Kubernetes-agnostic 유지.</text>

  <!-- two refs -->
  <rect x="24" y="76" width="418" height="150" fill="#dceaf7"/>
  <text x="36" y="98" fill="#10243a" font-size="12" font-weight="700">fieldRef — Pod 수준 메타데이터</text>
  <text x="36" y="118" fill="#10243a" font-size="9">spec.nodeName · status.hostIP</text>
  <text x="36" y="134" fill="#10243a" font-size="9">metadata.name · metadata.namespace</text>
  <text x="36" y="150" fill="#10243a" font-size="9">status.podIP · spec.serviceAccountName</text>
  <text x="36" y="166" fill="#10243a" font-size="9">metadata.uid</text>
  <text x="36" y="182" fill="#10243a" font-size="9">metadata.labels['key']</text>
  <text x="36" y="198" fill="#10243a" font-size="9">metadata.annotations['key']</text>
  <text x="36" y="217" fill="#7a1f1f" font-size="8.5">labels·annotations만 실행 중 변경 가능(볼륨으로 반영).</text>

  <rect x="458" y="76" width="418" height="150" fill="#cdeccf"/>
  <text x="470" y="98" fill="#14521d" font-size="12" font-weight="700">resourceFieldRef — 컨테이너 리소스</text>
  <text x="470" y="118" fill="#14521d" font-size="9">requests.cpu · limits.cpu</text>
  <text x="470" y="134" fill="#14521d" font-size="9">requests.memory · limits.memory</text>
  <text x="470" y="150" fill="#14521d" font-size="9">requests/limits.hugepages-&lt;size&gt;</text>
  <text x="470" y="166" fill="#14521d" font-size="9">requests/limits.ephemeral-storage</text>
  <text x="470" y="188" fill="#14521d" font-size="8.5">container 지정(env로 쓰면 기본은 현재 컨테이너).</text>
  <text x="470" y="205" fill="#14521d" font-size="8.5">리소스 선언은 2장 Predictable Demands 참조.</text>

  <!-- env vs volume -->
  <text x="24" y="252" fill="#e8e4df" font-size="12">주입 방식 두 가지</text>
  <rect x="24" y="262" width="418" height="118" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="36" y="284" fill="rgb(212,168,83)" font-size="11" font-weight="700">환경변수 (env valueFrom)</text>
  <text x="36" y="303" fill="#e8e4df" font-size="9">POD_IP ← fieldRef status.podIP</text>
  <text x="36" y="318" fill="#e8e4df" font-size="9">MEMORY_LIMIT ← resourceFieldRef limits.memory</text>
  <text x="36" y="337" fill="#e8e4df" font-size="9">시작 시점에 값이 고정됩니다.</text>
  <text x="36" y="356" fill="#e57373" font-size="8.5">⚠ 실행 중 라벨·어노테이션 변경을 반영 못 함</text>
  <text x="36" y="369" fill="#e57373" font-size="8.5">(반영하려면 Pod 재시작).</text>

  <rect x="458" y="262" width="418" height="118" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="470" y="284" fill="rgb(212,168,83)" font-size="11" font-weight="700">downwardAPI 볼륨 (파일 마운트)</text>
  <text x="470" y="303" fill="#e8e4df" font-size="9">/pod-info/labels · /pod-info/annotations</text>
  <text x="470" y="318" fill="#e8e4df" font-size="9">name=value 형식으로 줄마다 기록.</text>
  <text x="470" y="337" fill="#66bb6a" font-size="8.5">✓ 실행 중 라벨·어노테이션 변경을 파일에 반영</text>
  <text x="470" y="356" fill="#e8e4df" font-size="8.5">단, 앱이 파일 변경을 감지·재읽기해야 함.</text>
  <text x="470" y="369" fill="#e8e4df" font-size="8.5">감지 로직 없으면 여전히 재시작 필요.</text>

  <!-- use cases + limit -->
  <rect x="24" y="396" width="852" height="44" fill="#f5edda"/>
  <text x="36" y="415" fill="#0d0d0d" font-size="9.5" font-weight="700">활용: 리소스 한계로 스레드풀·GC·메모리 튜닝 · Pod명/호스트명으로 로깅·메트릭 태깅 · 같은 ns의 특정 라벨 Pod 발견해 클러스터 구성.</text>
  <text x="36" y="432" fill="#0d0d0d" font-size="9.5">비유: AWS EC2 Instance Metadata·ECS API와 같은 계열이되 더 단순.</text>

  <rect x="24" y="452" width="852" height="52" fill="#f2d4d4"/>
  <text x="36" y="471" fill="#7a1f1f" font-size="9.5" font-weight="700">한계: downward API는 고정된 키 집합만 제공합니다.</text>
  <text x="36" y="488" fill="#7a1f1f" font-size="9.5">더 많은 정보(다른 리소스·클러스터 메타데이터)가 필요하면 API Server를 직접 조회해야 합니다 — 클라이언트 라이브러리로 Pod 발견·상태 동기화·모니터링 계측.</text>
</svg>

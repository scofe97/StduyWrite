<title id="dt">선언 두 갈래가 배치와 생사를 정합니다</title><desc id="dd">개발자가 Pod 정의에 미리 적는 선언이 두 갈래로 갈립니다. 런타임 의존성은 다시 둘로 나뉘어 볼륨과 hostPort 는 스케줄 자체를 막고 ConfigMap 과 Secret 은 스케줄은 통과시킨 뒤 기동을 막습니다. 자원 프로파일에서는 requests 가 노드 선택에 쓰이고 requests 와 limits 의 조합이 QoS 등급을 정합니다.</desc>
<rect width="900" height="696" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES PATTERNS · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">선언 두 갈래가 배치와 생사를 정합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">선언하지 않으면 스케줄러는 컨테이너를 속이 안 보이는 상자로 다룹니다</text>
<rect x="24" y="280" width="196" height="72" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="122" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">Pod 정의에 선언</text>
<text x="122" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">개발자가 미리 적습니다</text>
<rect x="268" y="120" width="236" height="72" rx="6" fill="#F0616D10" stroke="#F0616D" stroke-width="1.0"/>
<text x="386" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F0616D">volume · hostPort</text>
<text x="386" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">노드가 제공해야 합니다</text>
<rect x="552" y="120" width="300" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="702" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">스케줄 자체를 막습니다</text>
<text x="702" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">놓을 노드가 없습니다</text>
<path d="M 226 316 C 224 316, 224 156, 260 156" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 510 156 L 544 156" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="268" y="216" width="236" height="72" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>
<text x="386" y="246" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#E3B341">ConfigMap · Secret</text>
<text x="386" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">네임스페이스에 있어야</text>
<rect x="552" y="216" width="300" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="702" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">스케줄은 되고 기동을 막습니다</text>
<text x="702" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">노드에는 올라갑니다</text>
<path d="M 226 316 C 224 316, 224 252, 260 252" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 510 252 L 544 252" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="268" y="344" width="236" height="72" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="386" y="374" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">requests</text>
<text x="386" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">최소 보장 · 합산 대상</text>
<rect x="552" y="344" width="300" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="702" y="374" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">스케줄러가 노드를 고릅니다</text>
<text x="702" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">limits 는 보지 않습니다</text>
<path d="M 226 316 C 224 316, 224 380, 260 380" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 510 380 L 544 380" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="268" y="440" width="236" height="72" rx="6" fill="#F08A5910" stroke="#F08A59" stroke-width="1.0"/>
<text x="386" y="470" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">requests + limits</text>
<text x="386" y="492" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">조합이 등급을 정합니다</text>
<rect x="552" y="440" width="300" height="72" rx="6" fill="#F08A5916" stroke="#F08A59" stroke-width="1.4"/>
<text x="702" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">QoS 등급 · 죽는 순서</text>
<text x="702" y="492" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">kubelet 이 죽입니다</text>
<path d="M 226 316 C 224 316, 224 476, 260 476" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 510 476 L 544 476" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="268" y="106" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">런타임 의존성 — 무엇이 갖춰져야 하는가</text>
<text x="268" y="330" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">자원 프로파일 — 얼마나 필요한가</text>
<line x1="24" y1="540" x2="852" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">여기에 겹쳐 걸리는 두 축</text>
<rect x="268" y="572" width="284" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="410" y="594" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Pod Priority · 선점</text>
<text x="410" y="614" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">스케줄 순서 · QoS 와 별개 축입니다</text>
<rect x="568" y="572" width="284" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="710" y="594" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Quota · LimitRange</text>
<text x="710" y="614" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">네임스페이스 총량과 기본값을 강제합니다</text>
<line x1="12" y1="648" x2="852" y2="648" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="670" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="660" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="670" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스케줄을 막음</text>
<rect x="235" y="660" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="257" y="670" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기동을 막음</text>
<rect x="357" y="660" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="379" y="670" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">배치 입력</text>
<rect x="466" y="660" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="488" y="670" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">생사 순서</text>
</svg>
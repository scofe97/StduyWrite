<svg viewBox="0 0 900 470" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>선언 두 갈래가 배치와 생사를 정하는 전체 흐름</title>
  <desc>이 장 전체의 구조를 한 장으로 요약합니다. 출발점은 개발자가 Pod 정의에 미리 적는 선언이며 두 갈래로 나뉩니다. 왼쪽 갈래는 런타임 의존성으로 볼륨과 hostPort와 ConfigMap과 Secret이 여기 속합니다. 오른쪽 갈래는 자원 프로파일로 CPU와 메모리의 requests와 limits가 여기 속합니다. 런타임 의존성은 두 가지로 갈라져 작용합니다. 볼륨과 hostPort는 어느 노드에 스케줄될 수 있는지를 제약하고 제공할 노드가 없으면 아예 스케줄되지 않습니다. ConfigMap과 Secret은 스케줄은 되게 하지만 기동을 막습니다. 자원 프로파일은 requests가 스케줄러의 노드 선택에 쓰이고 requests와 limits의 조합이 QoS 등급을 정해 kubelet이 자원 부족 때 죽이는 순서를 정합니다. 여기에 두 개의 직교하는 축이 더 걸립니다. Pod Priority는 QoS와 별개로 스케줄되는 순서와 선점에 영향을 주고 ResourceQuota와 LimitRange는 네임스페이스 수준에서 총량과 기본값을 강제합니다. 마지막으로 이 선언들을 서비스별로 합산하면 클러스터 용량 계획의 근거가 됩니다.</desc>

  <rect width="900" height="470" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">선언이 배치와 생사를 정합니다</text>

  <!-- source -->
  <rect x="24" y="52" width="180" height="52" fill="rgb(212,168,83)"/>
  <text x="114" y="74" text-anchor="middle" fill="#0d0d0d" font-size="12" font-weight="700">Pod 정의에 선언</text>
  <text x="114" y="92" text-anchor="middle" fill="#0d0d0d" font-size="10">개발자가 미리 적습니다</text>

  <!-- split arrows -->
  <path d="M 208 78 L 244 78" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <!-- branch 1 : runtime deps -->
  <rect x="248" y="46" width="200" height="30" fill="#dceaf7"/>
  <text x="348" y="66" text-anchor="middle" fill="#10243a" font-size="11" font-weight="700">런타임 의존성</text>

  <rect x="248" y="80" width="200" height="26" fill="#0d0d0d" stroke="#dceaf7"/>
  <text x="348" y="97" text-anchor="middle" fill="#dceaf7" font-size="9" font-family="'JetBrains Mono', monospace">volume · hostPort</text>

  <rect x="248" y="110" width="200" height="26" fill="#0d0d0d" stroke="#dceaf7"/>
  <text x="348" y="127" text-anchor="middle" fill="#dceaf7" font-size="9" font-family="'JetBrains Mono', monospace">ConfigMap · Secret</text>

  <!-- branch 1 outcomes -->
  <path d="M 452 93 L 488 93" stroke="#5b9bd5" stroke-width="2" marker-end="url(#bm)"/>
  <rect x="492" y="76" width="384" height="34" fill="#dceaf7"/>
  <text x="512" y="98" fill="#10243a" font-size="11" font-weight="700">스케줄 자체를 막습니다</text>

  <path d="M 452 123 L 488 123" stroke="#5b9bd5" stroke-width="2" marker-end="url(#bm)"/>
  <rect x="492" y="106" width="384" height="34" fill="#f5edda"/>
  <text x="512" y="128" fill="#0d0d0d" font-size="11" font-weight="700">스케줄은 되고 기동을 막습니다</text>

  <!-- branch 2 : resource profile -->
  <rect x="248" y="168" width="200" height="30" fill="#cdeccf"/>
  <text x="348" y="188" text-anchor="middle" fill="#14521d" font-size="11" font-weight="700">자원 프로파일</text>

  <rect x="248" y="202" width="200" height="26" fill="#0d0d0d" stroke="#cdeccf"/>
  <text x="348" y="219" text-anchor="middle" fill="#cdeccf" font-size="9" font-family="'JetBrains Mono', monospace">requests</text>

  <rect x="248" y="232" width="200" height="26" fill="#0d0d0d" stroke="#cdeccf"/>
  <text x="348" y="249" text-anchor="middle" fill="#cdeccf" font-size="9" font-family="'JetBrains Mono', monospace">requests + limits</text>

  <path d="M 208 183 L 244 183" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <line x1="114" y1="104" x2="114" y2="183" stroke="rgb(212,168,83)" stroke-width="2"/>
  <line x1="114" y1="183" x2="208" y2="183" stroke="rgb(212,168,83)" stroke-width="2"/>

  <!-- branch 2 outcomes -->
  <path d="M 452 215 L 488 215" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>
  <rect x="492" y="198" width="384" height="34" fill="#cdeccf"/>
  <text x="512" y="220" fill="#14521d" font-size="11" font-weight="700">스케줄러가 노드를 고릅니다</text>

  <path d="M 452 245 L 488 245" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>
  <rect x="492" y="228" width="384" height="40" fill="#f2d4d4"/>
  <text x="512" y="246" fill="#7a1f1f" font-size="11" font-weight="700">QoS 등급 · 죽는 순서</text>
  <text x="512" y="261" fill="#7a1f1f" font-size="9">kubelet 이 죽입니다</text>

  <line x1="24" y1="292" x2="876" y2="292" stroke="#4a4640"/>

  <!-- orthogonal axes -->
  <text x="24" y="316" fill="#e8e4df" font-size="12" font-weight="700">여기에 겹쳐 걸리는 두 축</text>

  <rect x="24" y="328" width="418" height="60" fill="#ddd4f0"/>
  <text x="44" y="350" fill="#2d1f52" font-size="11" font-weight="700">Pod Priority · 선점</text>
  <text x="44" y="370" fill="#2d1f52" font-size="10">스케줄 순서 · QoS 와 별개</text>

  <rect x="458" y="328" width="418" height="60" fill="#d2eeea"/>
  <text x="478" y="350" fill="#11453f" font-size="11" font-weight="700">Quota · LimitRange</text>
  <text x="478" y="370" fill="#11453f" font-size="10">네임스페이스 총량과 기본값 강제</text>

  <!-- capacity planning -->
  <rect x="24" y="400" width="852" height="30" fill="#0d0d0d" stroke="#b8b3ad"/>
  <text x="450" y="420" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">합산하면 용량 계획이 됩니다</text>

  <rect x="24" y="436" width="852" height="30" fill="rgb(212,168,83)"/>
  <text x="450" y="456" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">선언 없으면 안 보이는 상자</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="bm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#5b9bd5"/>
    </marker>
    <marker id="gm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
  </defs>
</svg>

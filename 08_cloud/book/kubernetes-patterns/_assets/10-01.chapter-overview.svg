<title id="dt">활성 하나가 교대되기까지</title><desc id="dd">두 줄 모두 장애 뒤에 활성이 하나 더 서야 끝납니다. 앱 밖 줄은 노드 컨트롤러가 Pod 를 축출할 때까지 350초 (50초 + 300초)를 기다리고, 앱 안 줄은 Lease 의 leaseDurationSeconds 15초가 지나면 대기 Pod 가 잠금을 넘겨받습니다. 눈금은 t0 이후만 초 단위이고 장애 전 구간은 단계만 놓았습니다.</desc>

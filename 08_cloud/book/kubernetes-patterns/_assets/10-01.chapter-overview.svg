<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 장애 t0 에서 교대까지: 앱 밖 350초 대 앱 안 15초</text>

<svg viewBox="0 0 900 520" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Configuration Template — 큰 설정을 시작 시 템플릿으로 생성</title>
  <desc>Kubernetes Patterns 22장. Configuration Template은 크고 복잡한 설정을 앱 시작 시 생성하는 패턴입니다. 큰 설정 파일은 환경마다 조금만 다른데, 그걸 통째로 ConfigMap에 넣으면 중복·중첩(YAML 안 YAML) 문제와 1MB 한계가 있습니다. 대신 차이 나는 값만 ConfigMap·환경변수에 저장하고, 시작 시 템플릿 프로세서(Gomplate·Tiller)로 전체 설정 파일을 생성합니다. 두 방법 — Dockerfile ENTRYPOINT에 프로세서를 넣거나, Kubernetes init container로 처리(권장, ConfigMap을 파라미터로 직접 사용). init container 흐름 — /in은 이미지에 담긴 템플릿, /params는 ConfigMap 볼륨(데이터 소스), /out은 처리 결과를 담는 emptyDir로 앱 컨테이너가 마운트합니다. WildFly 예에서 개발/운영은 로그 접두어(DEVELOPMENT:/PRODUCTION:)만 다르며, Deployment 서술자는 그대로 두고 ConfigMap 파라미터만 바꿉니다. DRY — 설정이 모든 환경에서 바뀌면 init의 단일 템플릿만 갱신, 설정 드리프트 위험 없음.</desc>

  <rect x="0" y="0" width="900" height="520" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16">Configuration Template — 시작 시 템플릿으로 큰 설정 생성</text>
  <text x="24" y="57" fill="rgb(138,133,128)" font-size="11">큰 설정 파일은 환경마다 조금만 다름. <tspan fill="#e8e4df">차이 나는 값만</tspan> ConfigMap에 두고, 나머지는 템플릿으로 생성해 중복 제거.</text>

  <!-- problem -->
  <rect x="24" y="76" width="852" height="30" fill="#f2d4d4"/>
  <text x="36" y="95" fill="#7a1f1f" font-size="9.5">큰 설정을 통째로 ConfigMap에 넣으면 — 중첩(YAML 안 YAML) 들여쓰기 지옥, 수십·수백 항목 관리, 1MB 한계, 환경마다 중복.</text>

  <!-- two techniques -->
  <text x="24" y="130" fill="#e8e4df" font-size="12">두 처리 방법</text>
  <rect x="24" y="140" width="418" height="52" fill="#dceaf7"/>
  <text x="36" y="160" fill="#10243a" font-size="10" font-weight="700">Dockerfile ENTRYPOINT</text>
  <text x="36" y="177" fill="#10243a" font-size="8.5">프로세서가 이미지 진입점. 먼저 템플릿 처리 후 앱 시작.</text>
  <text x="36" y="189" fill="#10243a" font-size="8.5">파라미터는 환경변수에서.</text>

  <rect x="458" y="140" width="418" height="52" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="470" y="160" fill="rgb(212,168,83)" font-size="10" font-weight="700">Init Container (권장, 15장)</text>
  <text x="470" y="177" fill="#e8e4df" font-size="8.5">init에서 프로세서가 앱 컨테이너용 설정 생성.</text>
  <text x="470" y="189" fill="#e8e4df" font-size="8.5">ConfigMap을 템플릿 파라미터로 직접 사용.</text>

  <!-- flow diagram -->
  <text x="24" y="216" fill="#e8e4df" font-size="12">Init Container 흐름 — Gomplate 프로세서 (WildFly 예)</text>
  <rect x="24" y="226" width="852" height="120" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>

  <rect x="40" y="242" width="200" height="88" fill="#f5edda"/>
  <text x="52" y="262" fill="#0d0d0d" font-size="10" font-weight="700">init container</text>
  <text x="52" y="280" fill="#0d0d0d" font-size="8.5">/in — 이미지에 담긴 템플릿</text>
  <text x="52" y="293" fill="#0d0d0d" font-size="8.5">(파라미터화된 standalone.xml)</text>
  <text x="52" y="310" fill="#0d0d0d" font-size="8.5">/params — ConfigMap 볼륨</text>
  <text x="52" y="323" fill="#0d0d0d" font-size="8.5">(데이터 소스 logFormat)</text>

  <text x="248" y="290" fill="rgb(212,168,83)" font-size="16">→</text>

  <rect x="272" y="242" width="180" height="88" fill="#dceaf7"/>
  <text x="284" y="262" fill="#10243a" font-size="10" font-weight="700">/out (emptyDir)</text>
  <text x="284" y="280" fill="#10243a" font-size="8.5">처리된 전체 설정 파일.</text>
  <text x="284" y="294" fill="#10243a" font-size="8.5">init와 app이 공유.</text>

  <text x="460" y="290" fill="rgb(212,168,83)" font-size="16">→</text>

  <rect x="484" y="242" width="200" height="88" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="496" y="262" fill="rgb(212,168,83)" font-size="10" font-weight="700">app: WildFly</text>
  <text x="496" y="280" fill="#e8e4df" font-size="8.5">/config를 마운트해</text>
  <text x="496" y="294" fill="#e8e4df" font-size="8.5">완성된 설정 로드.</text>
  <text x="496" y="311" fill="#e8e4df" font-size="8.5">standalone.sh 시작.</text>

  <rect x="700" y="242" width="160" height="88" fill="#cdeccf"/>
  <text x="712" y="262" fill="#14521d" font-size="9.5" font-weight="700">환경 전환</text>
  <text x="712" y="280" fill="#14521d" font-size="8">Deployment는 그대로.</text>
  <text x="712" y="294" fill="#14521d" font-size="8">ConfigMap 파라미터만</text>
  <text x="712" y="307" fill="#14521d" font-size="8">교체(개발/운영 로그</text>
  <text x="712" y="320" fill="#14521d" font-size="8">접두어만 다름).</text>

  <!-- DRY benefit -->
  <rect x="24" y="358" width="852" height="44" fill="#f5edda"/>
  <text x="36" y="377" fill="#0d0d0d" font-size="9.5" font-weight="700">DRY — 큰 설정 파일을 복사·중복 유지하지 않음.</text>
  <text x="36" y="393" fill="#0d0d0d" font-size="9.5">모든 환경의 설정이 바뀌면 init의 단일 템플릿 하나만 갱신. 설정 드리프트 위험 없음.</text>

  <!-- discussion / when -->
  <rect x="24" y="414" width="418" height="90" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="36" y="434" fill="rgb(212,168,83)" font-size="11" font-weight="700">언제 쓰나</text>
  <text x="36" y="453" fill="#e8e4df" font-size="8.5">Configuration Resource(20장) 위에 세워짐.</text>
  <text x="36" y="468" fill="#e8e4df" font-size="8.5">비슷한 복잡 설정으로 여러 환경을 운영할 때.</text>
  <text x="36" y="483" fill="#e8e4df" font-size="8.5">설정 대부분은 공통이고 일부만 환경 의존일 때 완벽.</text>
  <text x="36" y="498" fill="#e57373" font-size="8.5">단, 움직이는 부품이 많아 복잡 — 큰 설정일 때만.</text>

  <rect x="458" y="414" width="418" height="90" fill="#dceaf7"/>
  <text x="470" y="434" fill="#10243a" font-size="11" font-weight="700">디버깅 팁</text>
  <text x="470" y="453" fill="#10243a" font-size="8.5">emptyDir 내용은 노드의</text>
  <text x="470" y="467" fill="#10243a" font-size="8">/var/lib/kubelet/pods/{podid}/volumes/</text>
  <text x="470" y="479" fill="#10243a" font-size="8">kubernetes.io~empty-dir/ 에서 확인.</text>
  <text x="470" y="496" fill="#10243a" font-size="8.5">또는 kubectl exec로 들어가 /config 확인. OpenShift Template은 크기 문제는 미해결.</text>
</svg>

<svg viewBox="0 0 900 470" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>네 전략의 전환 중 인스턴스 구성 변화</title>
  <desc>네 가지 전략에서 전환이 진행되는 동안 어떤 버전의 인스턴스가 몇 개 도는지를 왼쪽에서 오른쪽 시간 순서로 비교합니다. 각 행은 전환 전과 전환 중과 전환 후 세 시점을 보입니다. RollingUpdate 행은 구버전 셋에서 시작해 전환 중에는 구버전 둘과 신버전 둘이 섞여 넷이 되었다가 신버전 셋으로 끝납니다. 전환 중 인스턴스 수가 늘어나는 것이 maxSurge의 효과이고 서비스는 끊기지 않습니다. Recreate 행은 구버전 셋에서 시작해 전환 중에는 아무것도 돌지 않는 빈 구간을 지나 신버전 셋으로 끝납니다. 이 빈 구간이 다운타임입니다. Blue-Green 행은 구버전 셋이 도는 동안 신버전 셋을 미리 띄워 여섯 개가 동시에 존재하고 트래픽만 한쪽에서 다른 쪽으로 넘어간 뒤 구버전을 지웁니다. 최대 인스턴스가 두 배가 되는 지점입니다. Canary 행은 구버전 셋 중 하나만 신버전으로 바꿔 소수에게 노출하고 문제가 없으면 나머지를 마저 바꿉니다. 전환 중 인스턴스 총수는 그대로입니다.</desc>

  <rect width="900" height="470" fill="#0d0d0d"/>

  <text x="24" y="28" fill="#e8e4df" font-size="15" font-weight="700">전환 중 무엇이 도는가</text>

  <!-- column headers -->
  <text x="196" y="56" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">전환 전</text>
  <text x="470" y="56" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">전환 중</text>
  <text x="768" y="56" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">전환 후</text>

  <!-- ============ Row 1 : RollingUpdate ============ -->
  <text x="24" y="88" fill="#66bb6a" font-size="11" font-weight="700">RollingUpdate</text>
  <text x="24" y="104" fill="#b8b3ad" font-size="9">무중단</text>

  <rect x="140" y="74" width="24" height="34" fill="#dceaf7"/>
  <rect x="168" y="74" width="24" height="34" fill="#dceaf7"/>
  <rect x="196" y="74" width="24" height="34" fill="#dceaf7"/>

  <path d="M 236 91 L 272 91" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>

  <rect x="396" y="74" width="24" height="34" fill="#dceaf7"/>
  <rect x="424" y="74" width="24" height="34" fill="#dceaf7"/>
  <rect x="452" y="74" width="24" height="34" fill="#cdeccf"/>
  <rect x="480" y="74" width="24" height="34" fill="#cdeccf"/>
  <text x="516" y="96" fill="#66bb6a" font-size="9" font-weight="700">넷으로 늘어납니다</text>

  <path d="M 660 91 L 696 91" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>

  <rect x="712" y="74" width="24" height="34" fill="#cdeccf"/>
  <rect x="740" y="74" width="24" height="34" fill="#cdeccf"/>
  <rect x="768" y="74" width="24" height="34" fill="#cdeccf"/>

  <line x1="24" y1="126" x2="876" y2="126" stroke="#4a4640"/>

  <!-- ============ Row 2 : Recreate ============ -->
  <text x="24" y="168" fill="#f44336" font-size="11" font-weight="700">Recreate</text>
  <text x="24" y="184" fill="#b8b3ad" font-size="9">다운타임 발생</text>

  <rect x="140" y="154" width="24" height="34" fill="#dceaf7"/>
  <rect x="168" y="154" width="24" height="34" fill="#dceaf7"/>
  <rect x="196" y="154" width="24" height="34" fill="#dceaf7"/>

  <path d="M 236 171 L 272 171" stroke="#f44336" stroke-width="2" marker-end="url(#rm)"/>

  <rect x="396" y="154" width="112" height="34" fill="#0d0d0d" stroke="#f44336" stroke-dasharray="4 3"/>
  <text x="452" y="176" text-anchor="middle" fill="#f44336" font-size="9" font-weight="700">아무것도 없음</text>
  <text x="520" y="176" fill="#f44336" font-size="9" font-weight="700">요청을 못 받습니다</text>

  <path d="M 660 171 L 696 171" stroke="#f44336" stroke-width="2" marker-end="url(#rm)"/>

  <rect x="712" y="154" width="24" height="34" fill="#cdeccf"/>
  <rect x="740" y="154" width="24" height="34" fill="#cdeccf"/>
  <rect x="768" y="154" width="24" height="34" fill="#cdeccf"/>

  <line x1="24" y1="206" x2="876" y2="206" stroke="#4a4640"/>

  <!-- ============ Row 3 : Blue-Green ============ -->
  <text x="24" y="264" fill="#9a86c4" font-size="11" font-weight="700">Blue-Green</text>
  <text x="24" y="280" fill="#b8b3ad" font-size="9">용량 두 배</text>

  <rect x="140" y="252" width="24" height="34" fill="#dceaf7"/>
  <rect x="168" y="252" width="24" height="34" fill="#dceaf7"/>
  <rect x="196" y="252" width="24" height="34" fill="#dceaf7"/>

  <path d="M 236 269 L 272 269" stroke="#9a86c4" stroke-width="2" marker-end="url(#pm)"/>

  <rect x="396" y="232" width="24" height="34" fill="#dceaf7"/>
  <rect x="424" y="232" width="24" height="34" fill="#dceaf7"/>
  <rect x="452" y="232" width="24" height="34" fill="#dceaf7"/>
  <rect x="396" y="272" width="24" height="34" fill="#cdeccf"/>
  <rect x="424" y="272" width="24" height="34" fill="#cdeccf"/>
  <rect x="452" y="272" width="24" height="34" fill="#cdeccf"/>
  <text x="492" y="252" fill="#9a86c4" font-size="9" font-weight="700">여섯이 동시에 존재</text>
  <text x="492" y="292" fill="#9a86c4" font-size="9" font-weight="700">셀렉터로 전환합니다</text>

  <path d="M 660 269 L 696 269" stroke="#9a86c4" stroke-width="2" marker-end="url(#pm)"/>

  <rect x="712" y="252" width="24" height="34" fill="#cdeccf"/>
  <rect x="740" y="252" width="24" height="34" fill="#cdeccf"/>
  <rect x="768" y="252" width="24" height="34" fill="#cdeccf"/>

  <line x1="24" y1="326" x2="876" y2="326" stroke="#4a4640"/>

  <!-- ============ Row 4 : Canary ============ -->
  <text x="24" y="368" fill="rgb(212,168,83)" font-size="11" font-weight="700">Canary</text>
  <text x="24" y="384" fill="#b8b3ad" font-size="9">총수는 그대로</text>

  <rect x="140" y="354" width="24" height="34" fill="#dceaf7"/>
  <rect x="168" y="354" width="24" height="34" fill="#dceaf7"/>
  <rect x="196" y="354" width="24" height="34" fill="#dceaf7"/>

  <path d="M 236 371 L 272 371" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <rect x="396" y="354" width="24" height="34" fill="#dceaf7"/>
  <rect x="424" y="354" width="24" height="34" fill="#dceaf7"/>
  <rect x="452" y="354" width="24" height="34" fill="#cdeccf"/>
  <text x="492" y="376" fill="rgb(212,168,83)" font-size="9" font-weight="700">하나만 신버전입니다</text>

  <path d="M 660 371 L 696 371" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <rect x="712" y="354" width="24" height="34" fill="#cdeccf"/>
  <rect x="740" y="354" width="24" height="34" fill="#cdeccf"/>
  <rect x="768" y="354" width="24" height="34" fill="#cdeccf"/>

  <!-- legend -->
  <rect x="24" y="410" width="24" height="20" fill="#dceaf7"/>
  <text x="56" y="425" fill="#b8b3ad" font-size="10">구버전</text>
  <rect x="120" y="410" width="24" height="20" fill="#cdeccf"/>
  <text x="152" y="425" fill="#b8b3ad" font-size="10">신버전</text>

  <rect x="24" y="438" width="852" height="26" fill="rgb(212,168,83)"/>
  <text x="450" y="455" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">위 둘은 자동 · 아래 둘은 사람</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="gm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
    <marker id="rm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#f44336"/>
    </marker>
    <marker id="pm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#9a86c4"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 760 460" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>확장 스펙트럼 — 리소스 정의와 조정 컴포넌트의 두 축</title>
  <desc>Kubernetes Patterns 그림 28-1의 재현입니다. 세로축은 리소스 정의 수준으로 아래에서 위로 표준 리소스, ConfigMap, CustomResourceDefinition, Aggregated API 순으로 올라갑니다. 가로축은 조정 컴포넌트로 왼쪽이 컨트롤러, 오른쪽이 Operator입니다. 왼쪽 아래의 파란 영역은 표준 리소스와 ConfigMap을 다루는 컨트롤러의 범위이고, 오른쪽 위의 분홍 영역은 CRD와 Aggregated API를 다루는 Operator의 범위입니다. 두 영역을 가르는 경계는 커스텀 리소스를 사용하는지 여부이며, 왼쪽 아래에서 오른쪽 위로 향하는 대각선을 따라 유연성과 복잡도가 함께 증가합니다.</desc>

  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8e4df"/>
    </marker>
    <marker id="dg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">확장 스펙트럼 두 축</text>

  <!-- operator region (upper right): CRD~Aggregated 구간, 경계 오른쪽 -->
  <rect x="300" y="72" width="330" height="180" fill="#f2d4d4"/>
  <!-- controller region (lower left): 표준~ConfigMap 구간, 경계 왼쪽 -->
  <rect x="180" y="192" width="240" height="188" fill="#dceaf7"/>

  <!-- axes -->
  <line x1="180" y1="380" x2="180" y2="60" stroke="#e8e4df" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="180" y1="380" x2="690" y2="380" stroke="#e8e4df" stroke-width="2" marker-end="url(#ax)"/>

  <!-- diagonal complexity -->
  <line x1="180" y1="380" x2="640" y2="80" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#dg)"/>
  <text x="470" y="150" fill="#0d0d0d" font-size="10" font-weight="700">유연성·복잡도 증가</text>

  <!-- y axis labels -->
  <text x="172" y="76" text-anchor="end" fill="#e8e4df" font-size="10">Aggregated API</text>
  <text x="172" y="136" text-anchor="end" fill="#e8e4df" font-size="10">CRD</text>
  <text x="172" y="196" text-anchor="end" fill="#e8e4df" font-size="10">ConfigMap</text>
  <text x="172" y="256" text-anchor="end" fill="#e8e4df" font-size="10">표준 리소스</text>
  <text x="150" y="46" text-anchor="middle" fill="#e8e4df" font-size="11" font-weight="700">리소스 정의</text>

  <!-- y gridlines -->
  <line x1="176" y1="72" x2="184" y2="72" stroke="#e8e4df" stroke-width="2"/>
  <line x1="176" y1="132" x2="184" y2="132" stroke="#e8e4df" stroke-width="2"/>
  <line x1="176" y1="192" x2="184" y2="192" stroke="#e8e4df" stroke-width="2"/>
  <line x1="176" y1="252" x2="184" y2="252" stroke="#e8e4df" stroke-width="2"/>

  <!-- x axis labels -->
  <text x="300" y="400" text-anchor="middle" fill="#e8e4df" font-size="11" font-weight="700">컨트롤러</text>
  <text x="520" y="400" text-anchor="middle" fill="#e8e4df" font-size="11" font-weight="700">Operator</text>
  <text x="640" y="420" text-anchor="middle" fill="#e8e4df" font-size="11" font-weight="700">조정 컴포넌트</text>

  <!-- boundary line -->
  <line x1="420" y1="60" x2="420" y2="380" stroke="#f44336" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="428" y="336" fill="#f44336" font-size="10" font-weight="700">경계</text>
  <text x="428" y="352" fill="#f44336" font-size="9">커스텀 리소스 사용</text>

  <!-- region labels -->
  <text x="300" y="300" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">표준 리소스 조정</text>
  <text x="300" y="318" text-anchor="middle" fill="#10243a" font-size="9">cluster-admin 불필요</text>

  <text x="530" y="100" text-anchor="middle" fill="#7a1f1f" font-size="10" font-weight="700">영속화까지 직접</text>
  <text x="530" y="116" text-anchor="middle" fill="#7a1f1f" font-size="9">APIService 구현</text>
  <text x="530" y="212" text-anchor="middle" fill="#7a1f1f" font-size="10" font-weight="700">도메인 개념을 타입으로</text>
  <text x="530" y="228" text-anchor="middle" fill="#7a1f1f" font-size="9">검증·버전·RBAC 확보</text>
</svg>

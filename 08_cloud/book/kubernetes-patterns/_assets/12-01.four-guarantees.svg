<svg viewBox="0 0 880 330" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>정체성을 토대로 세워지는 StatefulSet의 네 가지 보장</title>
  <desc>StatefulSet이 분산 상태 애플리케이션에 제공하는 네 가지 보장의 의존 구조를 보입니다. 맨 아래에 정체성이 토대로 놓이고, 그 위에 저장소와 네트워킹과 순서가 세워집니다. 정체성은 StatefulSet 이름과 순서 인덱스를 결합해 rg-0 같은 예측 가능한 Pod 이름을 만들며, 저장소는 그 이름으로 logs-rg-0 형태의 PVC 이름을 짓고, 네트워킹은 그 이름을 Service 이름 앞에 붙여 완전한 도메인 이름을 만들고, 순서는 그 인덱스로 스케일 업다운 차례를 정합니다. 각 보장이 정체성에서 무엇을 가져다 쓰는지를 화살표로 표시합니다.</desc>

  <rect width="880" height="330" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">네 가지 보장의 의존 구조</text>

  <!-- three upper blocks -->
  <rect x="24" y="52" width="264" height="112" fill="#dceaf7"/>
  <text x="40" y="76" fill="#10243a" font-size="12" font-weight="700">1. 저장소 Storage</text>
  <text x="40" y="98" fill="#10243a" font-size="10">volumeClaimTemplates</text>
  <text x="40" y="116" fill="#10243a" font-size="10">Pod마다 전용 PVC</text>
  <rect x="40" y="126" width="140" height="22" fill="#f7fbff"/>
  <text x="110" y="141" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">logs-rg-0</text>

  <rect x="308" y="52" width="264" height="112" fill="#cdeccf"/>
  <text x="324" y="76" fill="#14521d" font-size="12" font-weight="700">2. 네트워킹 Networking</text>
  <text x="324" y="98" fill="#14521d" font-size="10">headless Service</text>
  <text x="324" y="116" fill="#14521d" font-size="10">Pod마다 안정 DNS</text>
  <rect x="324" y="126" width="232" height="22" fill="#e6f7e7"/>
  <text x="440" y="141" text-anchor="middle" fill="#14521d" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace">rg-0.random-generator...</text>

  <rect x="592" y="52" width="264" height="112" fill="#f5edda"/>
  <text x="608" y="76" fill="#0d0d0d" font-size="12" font-weight="700">3. 순서 Ordinality</text>
  <text x="608" y="98" fill="#0d0d0d" font-size="10">스케일 업 0 → 위로</text>
  <text x="608" y="116" fill="#0d0d0d" font-size="10">스케일 다운 n-1 → 0</text>
  <rect x="608" y="126" width="140" height="22" fill="#fdf3df"/>
  <text x="678" y="141" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">순차 진행</text>

  <!-- arrows down from identity -->
  <path d="M 156 236 L 156 168" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#up)"/>
  <path d="M 440 236 L 440 168" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#up)"/>
  <path d="M 724 236 L 724 168" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#up)"/>

  <text x="164" y="205" fill="#b8b3ad" font-size="9">이름을 빌려</text>
  <text x="448" y="205" fill="#b8b3ad" font-size="9">이름을 빌려</text>
  <text x="732" y="205" fill="#b8b3ad" font-size="9">인덱스를 빌려</text>

  <!-- foundation: identity -->
  <rect x="24" y="240" width="832" height="66" fill="rgb(212,168,83)"/>
  <text x="44" y="266" fill="#0d0d0d" font-size="13" font-weight="700">4. 정체성 Identity</text>
  <text x="44" y="288" fill="#0d0d0d" font-size="10" font-weight="700">메타 빌딩 블록 · 사전 예측 가능</text>
  <rect x="600" y="256" width="238" height="34" fill="#fdf3df"/>
  <text x="719" y="278" text-anchor="middle" fill="#0d0d0d" font-size="12" font-weight="700" font-family="'JetBrains Mono', monospace">rg + 0 = rg-0</text>

  <defs>
    <marker id="up" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b8b3ad"/>
    </marker>
  </defs>
</svg>

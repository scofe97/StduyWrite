<svg viewBox="0 0 860 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Service 와 Pod 의 생성 순서가 환경변수 주입을 가르는 구조</title>
  <desc>같은 두 작업을 순서만 바꿔 실행했을 때 환경변수 주입 결과가 어떻게 갈리는지 대조한 것입니다. 위쪽 경우는 Service 를 먼저 만들고 그 뒤에 소비자 Pod 를 시작한 경우입니다. Service 생성 시점에 clusterIP 가 배정되고, 뒤이어 Pod 가 시작할 때 kubelet 이 그 시점까지 존재하는 모든 Service 를 훑어 환경변수를 만들어 넣으므로 RANDOM_GENERATOR_SERVICE_HOST 에 clusterIP 값이 들어갑니다. 아래쪽 경우는 소비자 Pod 를 먼저 시작하고 그 뒤에 Service 를 만든 경우입니다. Pod 시작 시점에는 Service 가 아직 없었으므로 환경변수가 만들어지지 않고, 그 뒤 Service 를 만들어 clusterIP 와 iptables 규칙과 DNS 등록이 모두 정상으로 완료되어도 이미 실행 중인 프로세스에는 환경변수가 소급해서 주입되지 않습니다. 리눅스에서 환경변수는 execve 호출 시점에 커널이 프로세스 메모리로 복사하고 그 뒤로는 외부에서 바꿔 넣을 수 없기 때문이며, 이는 Kubernetes 의 제약이 아니라 운영체제의 성질입니다. 따라서 유일한 해결은 Pod 를 재시작해 execve 를 다시 수행하게 하는 것입니다. 다만 아래쪽 경우에도 네트워크 자체는 정상이므로 그 Pod 안에서 DNS 이름으로 호출하면 문제없이 통하며, 끊긴 것은 주소를 알아내는 경로 하나뿐입니다.</desc>

  <defs>
    <marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect width="860" height="340" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="14">생성 순서와 환경변수 주입</text>

  <path d="M40 56 L820 56" fill="none" stroke="#b8b3ad" stroke-width="1" marker-end="url(#ea)"/>
  <text x="820" y="48" text-anchor="end" fill="#b8b3ad" font-size="9">시간</text>

  <!-- Case A -->
  <text x="24" y="92" fill="#66bb6a" font-size="11" font-weight="700">A. Service 먼저</text>

  <rect x="150" y="102" width="180" height="46" fill="#f5edda"/>
  <text x="164" y="120" fill="#0d0d0d" font-size="10" font-weight="700">1. Service 생성</text>
  <rect x="164" y="126" width="152" height="15" fill="#fdf3df"/>
  <text x="172" y="138" fill="#0d0d0d" font-size="8" font-weight="700">clusterIP 10.109.72.32</text>

  <rect x="380" y="102" width="180" height="46" fill="#cdeccf"/>
  <text x="394" y="120" fill="#14521d" font-size="10" font-weight="700">2. Pod 시작</text>
  <text x="394" y="138" fill="#14521d" font-size="9">kubelet 이 훑음</text>

  <rect x="610" y="102" width="220" height="46" fill="#dceaf7"/>
  <text x="624" y="120" fill="#10243a" font-size="10" font-weight="700">env 채워짐</text>
  <rect x="624" y="126" width="192" height="15" fill="#eef6fc"/>
  <text x="632" y="138" fill="#10243a" font-size="7" font-weight="700">..._SERVICE_HOST=10.109.72.32</text>

  <path d="M336 125 L374 125" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ea)"/>
  <path d="M566 125 L604 125" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ea)"/>

  <!-- divider -->
  <path d="M24 172 L836 172" fill="none" stroke="#b8b3ad" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Case B -->
  <text x="24" y="208" fill="#f44336" font-size="11" font-weight="700">B. Pod 먼저</text>

  <rect x="150" y="218" width="180" height="46" fill="#cdeccf"/>
  <text x="164" y="236" fill="#14521d" font-size="10" font-weight="700">1. Pod 시작</text>
  <text x="164" y="254" fill="#14521d" font-size="9">Service 없음</text>

  <rect x="380" y="218" width="180" height="46" fill="#f5edda"/>
  <text x="394" y="236" fill="#0d0d0d" font-size="10" font-weight="700">2. Service 생성</text>
  <rect x="394" y="242" width="152" height="15" fill="#fdf3df"/>
  <text x="402" y="254" fill="#0d0d0d" font-size="8" font-weight="700">clusterIP · DNS 정상</text>

  <rect x="610" y="218" width="220" height="46" fill="#f2d4d4"/>
  <text x="624" y="236" fill="#7a1f1f" font-size="10" font-weight="700">FAIL — env 없음</text>
  <rect x="624" y="242" width="192" height="15" fill="#fbe9e9"/>
  <text x="632" y="254" fill="#7a1f1f" font-size="8" font-weight="700">getenv(...) → null</text>

  <path d="M336 241 L374 241" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ea)"/>
  <path d="M566 241 L604 241" fill="none" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ea)"/>
  <text x="585" y="233" text-anchor="middle" fill="rgb(212,168,83)" font-size="8">소급 없음</text>

  <!-- boundary of what still works -->
  <rect x="150" y="286" width="680" height="34" fill="#cdeccf"/>
  <text x="164" y="300" fill="#14521d" font-size="9" font-weight="700">B 에서도 통하는 것</text>
  <rect x="290" y="291" width="240" height="15" fill="#e6f7e7"/>
  <text x="298" y="303" fill="#14521d" font-size="8" font-weight="700">curl http://random-generator</text>
  <text x="164" y="315" fill="#14521d" font-size="9">DNS 조회 · 직접 호출</text>
</svg>

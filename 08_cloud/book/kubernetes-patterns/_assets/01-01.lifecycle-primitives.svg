<svg xmlns="http://www.w3.org/2000/svg" width="960" height="344" viewBox="0 0 960 344" role="img" aria-labelledby="title desc">
  <title id="title">JVM과 Kubernetes 생애주기 개념의 대응</title>
  <desc id="desc">애플리케이션 시작 전 Init container, 시작 뒤 postStart, 종료 전 preStop 훅의 순서와 JVM 생성 및 종료 훅 비유</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d4a853"/></marker></defs>
  <rect width="960" height="344" fill="#0d0d0d"/>
  <text x="48" y="54" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="26" font-weight="700">생애주기: 비슷한 목적, 다른 실행 단위</text>
  <text x="48" y="82" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="15">Init container는 생성자가 아니라 앱보다 먼저 끝나는 별도 컨테이너입니다.</text>
  <text x="48" y="130" fill="#d4a853" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="700">KUBERNETES POD</text>
  <path d="M140 184H834" stroke="#2a2520" stroke-width="6" stroke-linecap="round"/>
  <path d="M140 184H834" stroke="#d4a853" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="170" cy="184" r="18" fill="#d4a853"/><text x="139" y="225" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="700">Init container</text><text x="132" y="248" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="14">시작 전 준비 후 종료</text>
  <circle cx="400" cy="184" r="18" fill="#66bb6a"/><text x="365" y="225" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="700">app container</text><text x="357" y="248" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="14">주 애플리케이션 실행</text>
  <circle cx="576" cy="184" r="18" fill="#66bb6a"/><text x="545" y="161" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="700">postStart</text><text x="532" y="276" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="14">시작 뒤 훅</text>
  <circle cx="772" cy="184" r="18" fill="#f44336"/><text x="745" y="161" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="700">preStop</text><text x="727" y="276" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="14">종료 전 훅</text>
  <line x1="48" y1="302" x2="912" y2="302" stroke="#2a2520"/>
  <text x="48" y="327" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="14">JVM 비유: 생성자 → 실행 → 종료 훅. 직접적인 1:1 기능 매핑은 아닙니다.</text>
</svg>

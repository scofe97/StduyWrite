<title id="dt">스케줄러는 requests 합만 봅니다</title><desc id="dd">allocatable 1000Mi 노드 두 개에 requests 가 쌓여 있고, requests 200Mi 인 새 Pod 가 들어갈 칸이 노드 A 에는 남고 노드 B 에는 모자랍니다. limits 합은 두 노드 모두 allocatable 을 넘지만 배치 판단에 쓰이지 않습니다.</desc>

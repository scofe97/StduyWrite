<svg viewBox="0 0 880 424" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>내부 디스커버리 네 방식이 트래픽을 보내는 곳</title>
  <desc>Kubernetes Patterns 그림 13-3과 13-4를 확장해 내부 디스커버리 네 방식을 비교한 것입니다. ClusterIP는 selector에 맞는 클러스터 안 Pod로 보냅니다. Manual IP는 selector를 생략하고 Endpoints 리소스를 직접 만들어 클러스터 밖 외부 시스템의 IP로 보냅니다. Manual FQDN은 ExternalName 타입으로 프록시도 가상 IP도 없이 DNS CNAME 별칭만 만들어 외부 도메인을 가리킵니다. Headless Service는 clusterIP를 None으로 두어 가상 IP를 받지 않고 백킹 Pod를 DNS에 직접 등록하므로 개별 Pod에 접근할 수 있으며 StatefulSet에 유용합니다. 네 방식 모두 소비자에게는 같은 Service 이름으로 보이므로, 제공자 구현을 외부에서 클러스터 안으로 옮겨도 클라이언트는 바뀌지 않습니다.</desc>

  <defs>
    <marker id="ia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect width="880" height="424" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">내부 디스커버리 네 방식</text>

  <!-- consumer -->
  <rect x="60" y="76" width="160" height="50" fill="#cdeccf"/>
  <text x="140" y="98" text-anchor="middle" fill="#14521d" font-size="11" font-weight="700">소비자 Pod</text>
  <text x="140" y="116" text-anchor="middle" fill="#14521d" font-size="9">DNS 이름으로 호출</text>

  <!-- 1. ClusterIP -->
  <rect x="300" y="76" width="200" height="50" fill="#f5edda"/>
  <text x="400" y="98" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">ClusterIP</text>
  <text x="400" y="116" text-anchor="middle" fill="#0d0d0d" font-size="9">selector 있음</text>

  <rect x="620" y="76" width="200" height="50" fill="#dceaf7"/>
  <text x="720" y="98" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">클러스터 안 Pod</text>
  <text x="720" y="116" text-anchor="middle" fill="#10243a" font-size="9">가장 흔한 방식</text>

  <path d="M226 101 L294 101" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ia)"/>
  <path d="M506 101 L614 101" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ia)"/>

  <!-- 2. Manual IP -->
  <rect x="300" y="166" width="200" height="50" fill="#f5edda"/>
  <text x="400" y="188" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">Manual IP</text>
  <text x="400" y="206" text-anchor="middle" fill="#0d0d0d" font-size="9">Endpoints 직접 작성</text>

  <rect x="620" y="166" width="200" height="50" fill="#f2d4d4"/>
  <text x="720" y="188" text-anchor="middle" fill="#7a1f1f" font-size="10" font-weight="700">외부 시스템 IP</text>
  <text x="720" y="206" text-anchor="middle" fill="#7a1f1f" font-size="9">클러스터 밖</text>

  <path d="M226 110 L260 110 L260 191 L294 191" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ia)"/>
  <path d="M506 191 L614 191" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ia)"/>

  <!-- 3. Manual FQDN -->
  <rect x="300" y="256" width="200" height="50" fill="#f5edda"/>
  <text x="400" y="278" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">Manual FQDN</text>
  <text x="400" y="296" text-anchor="middle" fill="#0d0d0d" font-size="9">ExternalName</text>

  <rect x="620" y="256" width="200" height="50" fill="#f2d4d4"/>
  <text x="720" y="278" text-anchor="middle" fill="#7a1f1f" font-size="10" font-weight="700">외부 도메인</text>
  <text x="720" y="296" text-anchor="middle" fill="#7a1f1f" font-size="9">DNS CNAME만</text>

  <path d="M226 110 L260 110 L260 281 L294 281" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ia)"/>
  <path d="M506 281 L614 281" fill="none" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ia)"/>
  <text x="560" y="273" text-anchor="middle" fill="rgb(212,168,83)" font-size="9">프록시 없음</text>

  <!-- 4. Headless -->
  <rect x="300" y="346" width="200" height="50" fill="#f5edda"/>
  <text x="400" y="368" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">Headless</text>
  <text x="400" y="386" text-anchor="middle" fill="#0d0d0d" font-size="9">clusterIP None</text>

  <rect x="620" y="346" width="200" height="50" fill="#dceaf7"/>
  <text x="720" y="368" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">개별 Pod DNS</text>
  <text x="720" y="386" text-anchor="middle" fill="#10243a" font-size="9">StatefulSet · 12장</text>

  <path d="M226 110 L260 110 L260 371 L294 371" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ia)"/>
  <path d="M506 371 L614 371" fill="none" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ia)"/>
  <text x="560" y="363" text-anchor="middle" fill="rgb(212,168,83)" font-size="9">가상 IP 없음</text>

  <!-- migration note -->
</svg>

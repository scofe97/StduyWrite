<svg viewBox="0 0 900 390" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>downward API 주입 경로와 API Server 조회 경로의 비교</title>
  <desc>앱이 자기 정보를 얻는 두 경로를 비교합니다. 위쪽 downward API 경로에서는 개발자가 관심 있는 키만 지정하면 Kubernetes가 Pod 명세와 상태에서 값을 동적으로 채워 컨테이너에 환경변수나 파일로 주입합니다. 앱은 로컬에서 그 값을 읽으므로 Kubernetes API 클라이언트가 필요 없고 Kubernetes에 무관한 코드로 남습니다. 아래쪽 API Server 조회 경로에서는 앱이 클라이언트 라이브러리를 써서 API Server에 직접 질의합니다. 자기 Pod 밖의 정보인 다른 Pod나 클러스터 메타데이터가 필요할 때 쓰는 경로이며, 그 대신 앱이 인증과 클라이언트 의존을 떠안습니다. downward API가 고정된 키 집합만 제공한다는 점이 두 경로를 가르는 경계입니다.</desc>

  <rect width="900" height="390" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">앱이 자기 정보를 얻는 두 경로</text>

  <!-- ===== downward API path ===== -->
  <text x="24" y="60" fill="rgb(212,168,83)" font-size="12" font-weight="700">downward API · 주입</text>

  <rect x="24" y="72" width="176" height="82" fill="#dceaf7"/>
  <text x="112" y="94" text-anchor="middle" fill="#10243a" font-size="11" font-weight="700">Pod 명세 · 상태</text>
  <rect x="38" y="104" width="148" height="18" fill="#f7fbff"/>
  <text x="112" y="117" text-anchor="middle" fill="#10243a" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace">status.podIP</text>
  <rect x="38" y="126" width="148" height="18" fill="#f7fbff"/>
  <text x="112" y="139" text-anchor="middle" fill="#10243a" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace">limits.memory</text>

  <path d="M 204 113 L 258 113" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <text x="231" y="105" text-anchor="middle" fill="rgb(212,168,83)" font-size="9" font-weight="700">키만 지정</text>

  <rect x="262" y="72" width="176" height="82" fill="rgb(212,168,83)"/>
  <text x="350" y="99" text-anchor="middle" fill="#0d0d0d" font-size="11" font-weight="700">Kubernetes가</text>
  <text x="350" y="119" text-anchor="middle" fill="#0d0d0d" font-size="11" font-weight="700">값을 채웁니다</text>
  <text x="350" y="140" text-anchor="middle" fill="#0d0d0d" font-size="9">env 또는 volume</text>

  <path d="M 442 113 L 496 113" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <text x="469" y="105" text-anchor="middle" fill="rgb(212,168,83)" font-size="9" font-weight="700">주입</text>

  <rect x="500" y="72" width="200" height="82" fill="#cdeccf"/>
  <text x="600" y="99" text-anchor="middle" fill="#14521d" font-size="11" font-weight="700">컨테이너</text>
  <rect x="516" y="110" width="168" height="30" fill="#e6f7e7"/>
  <text x="600" y="130" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">로컬에서 읽습니다</text>

  <rect x="724" y="72" width="152" height="82" fill="#f5edda"/>
  <text x="800" y="99" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">클라이언트 불필요</text>
  <text x="800" y="122" text-anchor="middle" fill="#0d0d0d" font-size="10">Kubernetes에</text>
  <text x="800" y="139" text-anchor="middle" fill="#0d0d0d" font-size="10">무관한 코드</text>

  <!-- boundary -->
  <rect x="24" y="176" width="852" height="46" fill="#f2d4d4"/>
  <text x="44" y="196" fill="#7a1f1f" font-size="11" font-weight="700">경계 — 고정된 키 집합만 제공합니다</text>
  <text x="44" y="214" fill="#7a1f1f" font-size="10">Pod 밖 정보는 아래 경로로</text>

  <!-- ===== API Server path ===== -->
  <text x="24" y="252" fill="#66bb6a" font-size="12" font-weight="700">API Server · 조회</text>

  <rect x="24" y="264" width="200" height="76" fill="#cdeccf"/>
  <text x="124" y="291" text-anchor="middle" fill="#14521d" font-size="11" font-weight="700">앱 + 클라이언트</text>
  <text x="124" y="312" text-anchor="middle" fill="#14521d" font-size="10">라이브러리 사용</text>

  <path d="M 228 302 L 292 302" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>
  <text x="260" y="294" text-anchor="middle" fill="#66bb6a" font-size="9" font-weight="700">질의</text>

  <rect x="296" y="264" width="200" height="76" fill="#dceaf7"/>
  <text x="396" y="298" text-anchor="middle" fill="#10243a" font-size="11" font-weight="700">API Server</text>
  <text x="396" y="318" text-anchor="middle" fill="#10243a" font-size="10">클러스터 전체 상태</text>

  <path d="M 500 302 L 564 302" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>

  <rect x="568" y="264" width="308" height="76" fill="#f5edda"/>
  <text x="588" y="288" fill="#0d0d0d" font-size="10" font-weight="700">얻는 것</text>
  <text x="588" y="308" fill="#0d0d0d" font-size="10">같은 네임스페이스의 다른 Pod</text>
  <text x="588" y="326" fill="#0d0d0d" font-size="10">클러스터 메타데이터</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
  </defs>
</svg>

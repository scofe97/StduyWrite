<title id="dt">메시지 한 줄의 필드가 응답 두 종류로 갈라진다</title><desc id="dd">host 는 A 응답의 주소가 되고, port·priority·weight 는 SRV 응답의 칸이 된다. 넣지 않은 ttl 은 기본값 300 으로 채워지고, weight 20 은 같은 우선순위 합 대비 백분율인 100 으로 바뀐다.</desc>

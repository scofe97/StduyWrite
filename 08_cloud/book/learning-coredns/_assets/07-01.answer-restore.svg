<title id="dt">질문이 복구되는 자리와 복구되지 않는 자리</title><desc id="dd">정규식 재작성에서 나가는 질의는 바뀌지만 돌아오는 응답의 Question 섹션은 저절로 돌아오지 않는다. answer name 을 적었느냐가 두 갈래를 만든다.</desc>
<rect width="880" height="646" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 07-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">질문이 복구되는 자리와 복구되지 않는 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">빨강 갈래에서 클라이언트가 응답을 버립니다</text>

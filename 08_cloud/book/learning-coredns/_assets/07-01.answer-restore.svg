<text x="580.0" y="365" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">레코드는 정상적으로 찾았다</text>
<rect x="381.7" y="386" width="92.6" height="20" rx="4" fill="#0D1117" stroke="none" stroke-width="0"/>
<rect x="381.7" y="386" width="92.6" height="20" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="428.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">여기서 갈린다</text>

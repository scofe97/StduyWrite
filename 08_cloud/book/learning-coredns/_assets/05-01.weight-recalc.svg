<title id="dt">백분율로 바꾼 뒤 소수점 아래를 버린다</title><desc id="dd">etcd 플러그인은 같은 우선순위 대상들의 가중치 합에 대한 백분율을 구하고 소수점 아래를 버린다. 그래서 둘 이상이면 합이 100 에 못 미칠 수 있고, 하나여도 부동소수 오차로 99 가 나올 수 있다.</desc>

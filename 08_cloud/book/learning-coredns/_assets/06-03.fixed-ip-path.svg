<title id="dt">IP 하나가 모든 파드의 resolv.conf 까지 간다</title><desc id="dd">DNS 서비스의 IP 는 자동 할당이 아니라 클러스터를 만들 때 정한 값이다. kubelet 이 그 값을 받아 자기가 띄우는 파드마다 resolv.conf 의 nameserver 로 쓰므로, Service 의 IP 와 이름은 바뀌면 안 된다.</desc>
<rect width="880" height="408" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">IP 하나가 모든 파드의 resolv.conf 까지 간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 상자가 이름과 IP 를 바꿀 수 없는 자리입니다</text>

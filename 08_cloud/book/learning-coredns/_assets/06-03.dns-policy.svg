<title id="dt">정책 하나가 외부 이름의 출구를 정한다</title><desc id="dd">앱 파드는 기본값 ClusterFirst 로 클러스터 DNS 를 nameserver 로 받는다. CoreDNS 만 Default 로 노드의 resolv.conf 를 받아 외부 이름을 노드의 상류로 내보낸다. CoreDNS 가 ClusterFirst 라면 자기 자신을 nameserver 로 보게 된다.</desc>
<rect width="880" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-03 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">정책 하나가 외부 이름의 출구를 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 행이 CoreDNS 가 Default 를 쓰는 이유입니다</text>
<text x="32" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">파드 · 정책</text>
<text x="262" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">resolv.conf 의 nameserver</text>
<text x="522" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">외부 이름이 가는 곳</text>
<rect x="20" y="132" width="220" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="32" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">앱 파드</text>
<text x="32" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">ClusterFirst · 기본값</text>
<rect x="250" y="132" width="250" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="262" y="162" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">10.7.240.10</text>
<text x="262" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">kube-dns 서비스</text>
<rect x="510" y="132" width="350" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="522" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">CoreDNS 가 받는다</text>
<text x="522" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">forward 로 상류에 넘긴다</text>
<rect x="16" y="212" width="848" height="80" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<rect x="20" y="216" width="220" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="32" y="246" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">CoreDNS 파드</text>
<text x="32" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Default</text>

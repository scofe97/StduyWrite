<title id="dt">고치는 자리마다 질문과 답의 대응이 달라진다</title><desc id="dd">이 장의 도구를 요청에서 무엇을 바꾸는지, 그 뒤 질문과 답의 대응이 어떻게 되는지, 어긋나면 무엇으로 되돌리는지로 나란히 놓았다. 이름은 되돌릴 수 있고 클래스는 되돌릴 수 없다.</desc>
<rect width="880" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 07-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">고치는 자리마다 질문과 답의 대응이 달라진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 행이 되돌릴 길이 없는 자리입니다</text>
<text x="30" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">절</text>
<text x="100" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">도구</text>
<text x="280" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">무엇을 바꾸나</text>
<text x="470" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">질문과 답의 대응</text>
<text x="700" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">되돌리는 법</text>
<rect x="20" y="132" width="60" height="54" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="50.0" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">§1</text>

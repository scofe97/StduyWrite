<title id="dt">clusterIP 한 필드가 가르는 두 경로</title><desc id="dd">두 Service 는 생김새가 거의 같고 clusterIP 값만 다르다. 그 한 필드가 가상 IP 의 유무, kube-proxy 의 관여 여부, 응답하는 A 레코드의 개수를 한꺼번에 바꾼다.</desc>
<rect width="880" height="724" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">clusterIP 한 필드가 가르는 두 경로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 마름모 하나가 아래 여섯 칸을 전부 결정합니다</text>
<rect x="290.0" y="104" width="300" height="48" rx="20" fill="#8B98A912" stroke="#8B98A9" stroke-width="1.2"/>
<text x="440" y="133.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#8B98A9">Service 선언</text>
<path d="M 440 152 L 440 186" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 440 188 L 590.0 230.0 L 440 272 L 290.0 230.0 Z" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="440" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">clusterIP 필드값</text>
<text x="440" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">None 설정 여부</text>
<path d="M 290.0 230.0 L 216 230.0 L 216 316" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="228" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">아니요</text>
<path d="M 590.0 230.0 L 664 230.0 L 664 316" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="652" y="218" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">예</text>
<rect x="48.0" y="318" width="336" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="216" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">가상 IP(VIP) 할당</text>
<text x="216" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">클러스터 전역 안정 주소</text>

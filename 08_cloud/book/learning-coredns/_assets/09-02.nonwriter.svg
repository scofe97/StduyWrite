<title id="dt">nonwriter 가 응답을 가로채는 자리</title><desc id="dd">아래 플러그인에게 진짜 소켓을 그냥 넘기면 그쪽이 클라이언트에게 직접 써 버린다. 가짜를 대신 넘기면 그 응답이 내 손에 남는다.</desc>

<title id="dt">폴링은 간격과 부하를 맞바꾸고, watch 는 둘 다 피한다</title><desc id="dd">3초에 바라는 상태가 바뀐다. 10초 간격 폴링은 7초 뒤에야 알고, 2초 간격은 1초 뒤에 알지만 요청이 네 배다. watch 는 연결 하나를 열어 두고 변경을 밀어 받으므로 바로 안다.</desc>
<rect width="880" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-01 §2</text>

<text x="20" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">회색 점 · API 서버로 가는 폴링 요청 · 간격을 줄일수록 반응은 빨라지고 부하는 커진다</text>

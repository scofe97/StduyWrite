<title id="dt">명세 밖으로 나가면 이식성을 내준다</title><desc id="dd">6장 마지막 구간의 절 일곱을 읽는 순서로 이은 지도. 1~2절이 플러그인 문법이고, 3~7절이 명세 밖 기능들이다.</desc>
<rect width="880" height="744" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-04</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">명세 밖으로 나가면 이식성을 내준다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">4절과 5절이 한 이야기의 문제와 답입니다</text>
<path d="M 420 156.0 L 438 156.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 640.0 208 L 640.0 220 L 220.0 220 L 220.0 230" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 420 284.0 L 438 284.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 640.0 336 L 640.0 348 L 220.0 348 L 220.0 358" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 420 412.0 L 438 412.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 640.0 464 L 640.0 476 L 220.0 476 L 220.0 486" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="20" y="104" width="400" height="104" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="38" y="130" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">§1</text>
<text x="38" y="160" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">문법 전체와 지금 남은 것</text>
<text x="38" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">셋이 사라졌고 예고는 하나였다</text>
<rect x="440" y="104" width="400" height="104" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="458" y="130" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">§2</text>
<text x="458" y="160" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">파드 옵션이 메모리를 가른다</text>
<text x="458" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">가장 안전한 모드가 가장 비싸다</text>
<rect x="20" y="232" width="400" height="104" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="38" y="258" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">§3</text>
<text x="38" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">와일드카드는 명세 밖 편의</text>
<text x="38" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">쓸모가 분명한 자리는 하나뿐</text>
<rect x="440" y="232" width="400" height="104" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="458" y="258" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">§4</text>
<text x="458" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F08A59">점 다섯이 질의를 여섯으로</text>
<text x="458" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">짧은 이름의 값을 바깥 이름이 치른다</text>
<rect x="20" y="360" width="400" height="104" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="38" y="386" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">§5</text>
<text x="38" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F08A59">autopath 가 반복을 옮긴다</text>
<text x="38" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">네트워크에서 서버 안으로</text>
<rect x="440" y="360" width="400" height="104" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="458" y="386" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">§6</text>
<text x="458" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">존 전송과 바깥 노출</text>
<text x="458" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">AXFR 의 한계 넷과 k8s_external</text>
<rect x="20" y="488" width="400" height="104" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="38" y="514" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">§7</text>
<text x="38" y="544" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">레코드를 좁히는 옵션들</text>
<text x="38" y="572" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">명세에서 가장 멀리 나간다</text>
<text x="20" y="632" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">기능마다 값을 두 번 센다 — 무엇을 얻는가, 그 대가로 무엇을 내주는가</text>
<text x="20" y="656" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">대가는 이식성이거나 메모리이거나 둘 다다</text>
<line x1="12" y1="684" x2="832" y2="684" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="706" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="696" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="706" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한 이야기로 이어지는 두 절</text>
</svg>
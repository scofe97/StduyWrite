<title id="dt">레이블을 루트까지 이어 붙인 것이 도메인 이름</title><desc id="dd">이름공간은 루트를 맨 위에 둔 뒤집힌 트리다. 레이블은 노드를 형제와 구분할 뿐이고, 그 노드를 이름공간 전체에서 가리키려면 루트까지의 레이블을 점으로 이어 붙여야 한다.</desc>

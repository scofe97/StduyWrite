<title id="dt">재귀는 첫 서버 혼자 진다</title><desc id="dd">리졸버의 재귀 질의를 받은 서버가 루트, com, google.com 서버에 차례로 반복 질의를 보낸다. 루트와 com 서버는 다음 서버를 가리키는 NS 참조만 돌려주고, 권한 서버에 닿아야 답이 온다.</desc>

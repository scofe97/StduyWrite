<title id="dt">존 데이터를 어디에 둘지가 관리 방식을 정한다</title><desc id="dd">4장의 절 여섯을 읽는 순서로 이은 지도. 1절이 네 갈래의 지도이고, 2~4절이 파일 계열, 5~6절이 파일이 아닌 두 갈래다.</desc>
<rect width="880" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 04-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">존 데이터를 어디에 둘지가 관리 방식을 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">3절의 auto 가 이 장이 3장에 더하는 핵심입니다</text>
<path d="M 420 156.0 L 438 156.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

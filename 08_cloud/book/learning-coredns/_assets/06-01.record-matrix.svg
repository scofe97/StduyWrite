<title id="dt">같은 질문에 두 Service 가 다르게 답한다</title><desc id="dd">hello-world 는 clusterIP 를 가진 Service, headless 는 clusterIP: None 인 Service 다. 레코드 종류마다 무엇이 나오는지 DNS 명세의 규칙과 원서 예의 값으로 채웠다.</desc>
<rect width="880" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 질문에 두 Service 가 다르게 답한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 칸이 이 절이 짚는 차이입니다</text>

<title id="dt">이름은 되돌아오고 클래스는 남는다</title><desc id="dd">CH 클래스로 bind.version 의 TXT 를 물으면 rewrite 가 클래스와 이름을 바꿔 kubernetes 가 답한다. 나갈 때 Question 과 Answer 이름은 되돌아오지만 Answer 의 클래스는 IN 으로 남아 질문의 CH 와 어긋난다.</desc>

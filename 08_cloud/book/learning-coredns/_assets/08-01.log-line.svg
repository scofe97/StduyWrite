<title id="dt">큰따옴표가 요청과 응답을 가른다</title><desc id="dd">기본 로그 한 줄의 칸을 세 묶음으로 나눴다. 앞 두 칸은 누가 보냈는지, 큰따옴표 안은 받은 질의, 큰따옴표 뒤는 돌려준 응답이다. 값은 원서 예시 줄 그대로다.</desc>

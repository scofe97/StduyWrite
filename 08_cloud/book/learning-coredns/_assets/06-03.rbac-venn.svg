<title id="dt">부여된 권한과 실제로 쓰는 권한</title><desc id="dd">바깥 원이 ClusterRole 이 준 자원 다섯, 안쪽 원이 기본 Corefile 이 실제로 쓰는 셋이다. 두 원 사이의 고리가 배포 편의로 미리 준 권한이다.</desc>
<rect width="880" height="740" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">부여된 권한과 실제로 쓰는 권한</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황으로 이름 붙인 둘이 지워도 되는 권한입니다</text>
<circle cx="440" cy="340" r="236" fill="#8B98A90A" stroke="#8B98A9" stroke-width="1.2"/>
<circle cx="440" cy="396" r="156" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.4"/>
<text x="24" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">ClusterRole 이 준 다섯</text>
<text x="24" y="148" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">system:coredns</text>
<text x="856" y="128" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">기본 Corefile 이 쓰는 셋</text>
<text x="856" y="148" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">endpoints · services · namespaces</text>
<rect x="300" y="152" width="280" height="76" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="440" y="180" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F08A59">pods · nodes</text>
<text x="440" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">배포 편의로 미리 준 것</text>
<text x="440" y="356" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#3FB98C">endpoints · services</text>
<text x="440" y="380" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#3FB98C">namespaces</text>
<text x="440" y="408" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">레코드를 만드는 데 실제로 쓴다</text>
<text x="20" y="604" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">nodes 만 동사가 get 이고 나머지 넷은 list · watch 다 — 다섯 어디에도 쓰기 동사가 없다</text>
<text x="20" y="628" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">네임스페이스는 NXDOMAIN 을 줄지 정하는 데 쓰이고 와일드카드 질의에도 필요하다</text>
<text x="20" y="652" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">파드는 pods verified 를 켤 때만 감시가 필요하고, 안 켜면 그 권한을 남길 이유가 없다</text>
<line x1="12" y1="680" x2="832" y2="680" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="702" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="692" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="702" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">지워도 되는 권한</text>
<rect x="261" y="692" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="283" y="702" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기본 설정이 쓰는 집합</text>
</svg>
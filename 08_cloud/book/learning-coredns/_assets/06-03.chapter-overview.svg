<title id="dt">기본 매니페스트의 값은 어디서 왔나</title><desc id="dd">설명 없이 박힌 값마다 출처를 셋으로 갈랐다. 호환은 kube-dns 에서 무중단으로 넘어오려고 정한 값, 동작상 필요는 CoreDNS 가 제대로 돌려면 그래야 하는 값, 배포 편의는 나중에 고치지 않으려고 미리 넣은 값이다.</desc>

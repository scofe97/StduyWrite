<title id="dt">재시작 때 두 인스턴스가 겹치는 구간</title><desc id="dd">SIGUSR1 을 받으면 옛 인스턴스의 OnRestart 뒤에 새 인스턴스가 넘겨받은 소켓으로 뜨고, 옛 인스턴스는 그다음에 멈춘다. 그 사이 두 인스턴스가 같이 산다.</desc>
<rect width="880" height="610" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 09-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">재시작 때 두 인스턴스가 겹치는 구간</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황이 포트를 새로 열면 실패하는 구간입니다</text>
<line x1="220" y1="118" x2="830" y2="118" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="220" y="110" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">시간</text>
<text x="206" y="165" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">옛 Instance</text>
<rect x="240" y="150" width="380" height="24" rx="4" fill="#8B98A920" stroke="#8B98A9" stroke-width="1.2"/>
<text x="206" y="227" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">새 Instance</text>
<rect x="470" y="212" width="350" height="24" rx="4" fill="#8B98A920" stroke="#8B98A9" stroke-width="1.2"/>
<line x1="470" y1="132" x2="470" y2="262" stroke="#F08A59" stroke-width="1.0" stroke-dasharray="4 3"/>
<line x1="620" y1="132" x2="620" y2="262" stroke="#F08A59" stroke-width="1.0" stroke-dasharray="4 3"/>
<line x1="470" y1="262" x2="620" y2="262" stroke="#F08A59" stroke-width="1.4"/>
<text x="545.0" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">두 인스턴스가 같이 산다</text>
<line x1="360" y1="322" x2="360" y2="338" stroke="#F5F5F3" stroke-width="1.4"/>
<text x="360" y="356" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">OnRestart</text>
<text x="360" y="374" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">1. 옛 쪽</text>
<line x1="470" y1="322" x2="470" y2="338" stroke="#F5F5F3" stroke-width="1.4"/>
<text x="470" y="356" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">OnStartup</text>
<text x="470" y="374" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">2. 새 쪽, 뜨기 직전</text>
<line x1="620" y1="322" x2="620" y2="338" stroke="#F5F5F3" stroke-width="1.4"/>
<text x="620" y="356" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">OnShutdown</text>
<text x="620" y="374" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">3. 옛 쪽, 멈춘 직후</text>
<line x1="470" y1="262" x2="470" y2="322" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 3"/>
<line x1="620" y1="262" x2="620" y2="322" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 3"/>
<line x1="360" y1="330" x2="620" y2="330" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="360" y1="174" x2="360" y2="322" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 3"/>
<text x="220" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">새 인스턴스가 못 뜨면 OnRestartFailed 가 불리고 옛 인스턴스가 남는다</text>
<text x="220" y="432" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">OnFinalShutdown 은 재시작에서 불리지 않는다</text>
<rect x="20" y="450" width="840" height="84" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">이 구간에서 포트를 새로 열면 실패한다</text>
<text x="36" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">듣던 소켓은 새 인스턴스로 넘어간다 — 새로 열지 말고 넘겨받기</text>
<text x="36" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">순서의 근거는 coredns/caddy 의 Restart 함수다</text>
<line x1="12" y1="548" x2="832" y2="548" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="570" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="560" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">두 인스턴스가 겹치는 구간</text>
</svg>
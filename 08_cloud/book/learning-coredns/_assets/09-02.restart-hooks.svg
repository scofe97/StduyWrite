<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">재시작 때 두 인스턴스가 겹치는 구간</title><desc id="dd">SIGUSR1 이나 SIGHUP 을 받으면 새 인스턴스가 만들어지고 듣던 소켓의 파일 디스크립터가 넘어간다. 그 사이 두 인스턴스가 같이 산다.</desc>
<rect width="880" height="610" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 09-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">재시작 때 두 인스턴스가 겹치는 구간</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황이 포트를 새로 열면 실패하는 구간입니다</text>
<line x1="220" y1="118" x2="830" y2="118" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="220" y="110" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">시간</text>
<text x="206" y="165" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">옛 Instance</text>
<rect x="240" y="150" width="380" height="24" rx="4" fill="#8B98A920" stroke="#8B98A9" stroke-width="1.2"/>
<text x="206" y="217" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">새 Instance</text>
<rect x="470" y="202" width="350" height="24" rx="4" fill="#8B98A920" stroke="#8B98A9" stroke-width="1.2"/>
<rect x="470" y="140" width="150" height="96" rx="6" fill="#F08A590E" stroke="#F08A59" stroke-width="1.3"/>
<text x="545" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">두 인스턴스가 같이 산다</text>
<line x1="470" y1="268" x2="470" y2="296" stroke="#F08A59" stroke-width="0.8" stroke-dasharray="3 4"/>
<line x1="620" y1="268" x2="620" y2="296" stroke="#F08A59" stroke-width="0.8" stroke-dasharray="3 4"/>
<line x1="470" y1="296" x2="620" y2="296" stroke="#F08A59" stroke-width="1.0"/>
<text x="545" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">이 구간에 재시작 훅 셋이 불린다</text>
<text x="545" y="344" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">OnShutdown · OnStartup · OnRestart</text>
<text x="545" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원서는 셋 사이의 순서를 말하지 않는다</text>
<text x="220" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재시작이 실패하면 OnRestartFailed 도 이 구간에서 불린다</text>
<text x="220" y="424" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">OnFinalShutdown 은 프로세스가 아예 끝날 때만 불린다 — 본문 정오 블록의 교정을 따른 배치다</text>
<rect x="20" y="450" width="840" height="84" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">이 구간에서 포트를 새로 열면 실패한다</text>
<text x="36" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">듣던 소켓은 새 인스턴스로 넘어가므로, 새로 여는 대신 넘겨받는 쪽으로 다뤄야 한다</text>
<text x="36" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원서가 이 순서를 설명하는 문장에는 자기모순이 있다 — 본문 정오 블록 참조</text>
<line x1="12" y1="548" x2="832" y2="548" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="570" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="560" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재시작 훅이 불리는 구간</text>
</svg>
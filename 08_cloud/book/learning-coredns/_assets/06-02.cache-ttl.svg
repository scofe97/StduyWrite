<title id="dt">상한 30 으로 자르고 하한 5 로 받친다</title><desc id="dd">cache 30 은 레코드 TTL 을 30초 위로 넘기지 않게 자를 뿐 늘리지는 않는다. 현행 cache 는 여기에 최소 캐시 기간 5초를 두어, TTL 이 2초인 응답도 5초 동안 캐시에 남긴다.</desc>

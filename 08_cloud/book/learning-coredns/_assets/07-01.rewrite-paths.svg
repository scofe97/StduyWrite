<title id="dt">Question 은 대개 돌아오고 Answer 이름이 갈린다</title><desc id="dd">api.example.com 을 물었을 때 응답에 실리는 이름이다. stop 경로에서는 Question 섹션이 늘 원래대로 돌아오고, Answer 이름은 정확 일치이거나 answer name 을 적었을 때만 돌아온다. 끝까지 continue 이고 응답 규칙이 없으면 Question 도 안 돌아온다.</desc>

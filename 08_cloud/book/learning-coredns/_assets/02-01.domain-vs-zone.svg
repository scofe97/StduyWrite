<title id="dt">도메인은 통째, 존은 위임하고 남은 만큼</title><desc id="dd">바깥 사각형이 도메인이고, 링과 링 사이의 띠 하나가 그 도메인의 존이다. berkeley.edu 도메인은 cs.berkeley.edu 를 품지만 berkeley.edu 존은 그 안쪽을 품지 않는다. 위임한 쪽 존에는 cs.berkeley.edu 를 어디서 찾는지 알려 주는 NS 와, 필요하면 그 서버 주소인 글루만 남는다.</desc>
<rect width="880" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 02-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">도메인은 통째, 존은 위임하고 남은 만큼</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칠한 띠만큼이 berkeley.edu 존입니다</text>
<rect x="40" y="96" width="800" height="344" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="58" y="118" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">edu 도메인</text>
<text x="822" y="118" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">edu 존 · EDUCAUSE 관리</text>
<rect x="72" y="144" width="736" height="264" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="90" y="168" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">berkeley.edu 도메인</text>
<text x="90" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">berkeley.edu 존 · Berkeley IT 관리</text>
<rect x="566.5" y="198" width="223.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="678" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">cs 로 가는 NS · 글루만 남음</text>
<rect x="104" y="240" width="672" height="136" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="122" y="264" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">cs.berkeley.edu 도메인 = 존</text>
<text x="440.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">CS 학과 관리 · 하위 위임 없음</text>
<text x="440.0" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Berkeley IT 관여 없음</text>
<line x1="12" y1="460" x2="832" y2="460" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="482" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

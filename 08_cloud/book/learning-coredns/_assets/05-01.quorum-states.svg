<title id="dt">셋 중 하나를 잃어도 과반이 남는다</title><desc id="dd">etcd 는 절반을 넘는 인스턴스가 살아 서로 통신하는 동안 읽기와 쓰기를 받는다. 세 대면 과반은 둘이므로 한 대 장애는 견디고, 두 대가 죽으면 쿼럼을 잃는다.</desc>

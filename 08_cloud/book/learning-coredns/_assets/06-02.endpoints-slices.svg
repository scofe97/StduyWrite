<title id="dt">파드 하나가 바뀔 때 다시 오는 주소의 수</title><desc id="dd">Endpoints 는 서비스의 주소를 한 객체에 담아 바뀔 때마다 전체를 보낸다. EndpointSlice 는 기본 100개씩 조각으로 나눠 바뀐 조각만 보낸다. 현행 Endpoints 는 1000개를 넘으면 잘린다.</desc>
<rect width="880" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">파드 하나가 바뀔 때 다시 오는 주소의 수</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 막대가 지금 CoreDNS 가 받는 양입니다</text>
<text x="20" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">백엔드 300개 서비스</text>
<text x="250" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">파드 하나가 바뀔 때 다시 보내는 주소</text>
<text x="20" y="165" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Endpoints</text>
<rect x="250.0" y="148" width="54.0" height="24" rx="3" fill="#8B98A940" stroke="#8B98A9" stroke-width="1.1"/>
<text x="314.0" y="165" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">300 · 객체 전체</text>
<text x="20" y="211" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">EndpointSlice</text>
<rect x="250.0" y="194" width="18.0" height="24" rx="3" fill="#8B98A940" stroke="#8B98A9" stroke-width="1.1"/>
<text x="278.0" y="211" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">100 · 바뀐 조각 하나</text>
<text x="20" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">백엔드 3000개 서비스</text>
<text x="250" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">파드 하나가 바뀔 때 다시 보내는 주소</text>
<text x="20" y="295" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Endpoints</text>
<rect x="250.0" y="278" width="180.0" height="24" rx="3" fill="#8B98A940" stroke="#8B98A9" stroke-width="1.1"/>
<text x="260" y="295" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">1000 · 전체 재전송</text>
<rect x="430.0" y="278" width="360.0" height="24" rx="3" fill="none" stroke="#F0616D" stroke-width="1.1" stroke-dasharray="4 4"/>
<text x="442.0" y="295" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">잘린 2000 · 객체에 없음</text>
<text x="20" y="341" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">EndpointSlice</text>
<rect x="250.0" y="324" width="18.0" height="24" rx="3" fill="#F08A5940" stroke="#F08A59" stroke-width="1.1"/>
<text x="278.0" y="341" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">100 · 조각 30개 중 하나</text>
<text x="20" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">조각 하나 · 기본 100 개 · 300 과 3000 은 예시 수 · CoreDNS 는 지금 EndpointSlice 를 감시</text>
<line x1="12" y1="420" x2="832" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="432" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="122" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한 번에 다시 보내는 주소</text>
<rect x="326" y="432" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="348" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1000 에서 잘린 주소</text>
<rect x="539" y="432" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="561" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">지금 CoreDNS 가 받는 양</text>
</svg>
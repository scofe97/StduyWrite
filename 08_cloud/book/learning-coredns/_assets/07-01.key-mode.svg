<title id="dt">SEP 비트가 켜진 키와 꺼진 키가 다 있어야 나뉜다</title><desc id="dd">KSK 는 SEP 비트를 켠 키다. 켠 키와 끈 키가 함께 있을 때만 DNSKEY 는 켠 키로, 나머지는 끈 키로 나눠 서명한다. 그 밖의 조합은 모두 CSK 로 보고 각 키가 전부를 서명한다. v1.5.0 문서도 같은 규칙이다.</desc>
<rect width="880" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 07-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SEP 비트가 켜진 키와 꺼진 키가 다 있어야 나뉜다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 행이 원서가 다루지 않은 경우입니다</text>

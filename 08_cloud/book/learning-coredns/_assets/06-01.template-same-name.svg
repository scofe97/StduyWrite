<title id="dt">템플릿이 이름을 복사한다</title><desc id="dd">파드 템플릿 한 장의 hostname 이 파드 넷에 복사되어 넷이 모두 myhost 라는 같은 이름을 받는다. 그래서 SRV 는 대상 이름이 같은 넷이 한 줄로 합쳐지고, A 레코드는 같은 이름에 IP 만 다른 넷이 남는다.</desc>

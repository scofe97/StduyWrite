<title id="dt">이름을 쪼개 다시 조립하면 답이 된다</title><desc id="dd">match 정규식의 이름 붙은 그룹이 질문 이름을 조각내고, answer 의 Go 템플릿이 그 조각을 다시 잇는다. PTR 쪽은 그룹 이름을 d.c.b.a 순으로 붙여 두 템플릿이 서로의 역함수가 된다.</desc>
<rect width="880" height="430" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 07-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름을 쪼개 다시 조립하면 답이 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 열이 질문 이름에서 떼어 낸 조각입니다</text>
<text x="30" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">물은 이름</text>
<text x="250" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">match 가 잡은 그룹</text>
<text x="400" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">answer 템플릿</text>
<text x="710" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">응답</text>
<rect x="20" y="132" width="200" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="30" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">host-1-2-3-4</text>
<text x="30" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">.example.com.  A</text>
<path d="M 222 174 L 237 174" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="240" y="132" width="130" height="84" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="250" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">a=1  b=2</text>
<text x="250" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">c=3  d=4</text>
<path d="M 372 174 L 387 174" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="390" y="132" width="290" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="400" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">{{ .Group.a }}.{{ .Group.b }}.</text>
<text x="400" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">{{ .Group.c }}.{{ .Group.d }}</text>
<path d="M 682 174 L 697 174" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="700" y="132" width="160" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="710" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">1.2.3.4</text>
<text x="710" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">A 60초</text>
<rect x="20" y="236" width="200" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="30" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">1.2.3.4</text>
<text x="30" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">.in-addr.arpa.  PTR</text>
<path d="M 222 278 L 237 278" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="240" y="236" width="130" height="84" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="250" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">d=1  c=2</text>
<text x="250" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">b=3  a=4</text>
<path d="M 372 278 L 387 278" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="390" y="236" width="290" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="400" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">host-{{ .Group.a }}-{{ .Group.b }}-</text>
<text x="400" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">{{ .Group.c }}-{{ .Group.d }}...</text>
<path d="M 682 278 L 697 278" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="700" y="236" width="160" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="710" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">host-4-3-2-1</text>
<text x="710" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">.example.com.</text>
<text x="20" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">역방향 이름 1.2.3.4.in-addr.arpa · 주소 4.3.2.1 을 뒤집어 적은 것</text>
<line x1="12" y1="380" x2="832" y2="380" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="402" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="392" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">질문 이름에서 떼어 낸 조각</text>
</svg>
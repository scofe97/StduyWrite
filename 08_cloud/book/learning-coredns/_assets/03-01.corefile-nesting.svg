<title id="dt">Corefile 문법이 품는 네 겹과 그 바닥</title><desc id="dd">엔트리 안에 블록이 있고, 블록 안에 지시어가 있고, 지시어의 인자가 길면 다시 중괄호로 감싼다. 그 안에 서브지시어까지는 들어가지만 거기서 끝이다. 중괄호가 실제로 그리는 것은 블록과 여러 줄 인자 두 겹이다.</desc>
<rect width="880" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 03-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Corefile 문법이 품는 네 겹과 그 바닥</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">점선 테두리가 중괄호로 그어지는 겹입니다</text>
<rect x="40" y="96" width="800" height="344" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="58" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">엔트리</text>
<text x="822" y="122" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">라벨 + 정의</text>
<rect x="72" y="144" width="736" height="272" rx="8" fill="#0D1117" stroke="#5E6B7E" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="90" y="170" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">블록</text>
<text x="790" y="170" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">{ 는 라벨 줄 끝 · } 는 홀로 한 줄</text>
<rect x="104" y="192" width="672" height="200" rx="8" fill="#0D1117" stroke="#5E6B7E" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="122" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">지시어와 인자</text>
<text x="758" y="218" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">줄마다 지시어 하나 · 여러 줄 인자는 { }</text>
<rect x="136" y="240" width="608" height="128" rx="8" fill="#F08A590A" stroke="#F08A59" stroke-width="1.4"/>
<text x="154" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">서브지시어</text>
<text x="440" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">새 { } 블록 열기 불가</text>
<text x="440" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">저자의 "작은 자비" · Corefile 문법의 바닥</text>
<line x1="12" y1="456" x2="832" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="478" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="468" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">더 들어갈 수 없는 층</text>
<rect x="300" y="468" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="322" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">중괄호로 그어지는 겹 · 점선</text>
</svg>
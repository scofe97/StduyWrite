<title id="dt">조정 루프는 API 서버에 상태를 쌓는다</title><desc id="dd">컨트롤러는 의도된 상태를 읽고 현실을 관찰해 차이를 메우고, 그 진행을 다시 API 서버에 적는다. 폴링 대신 watch 가 갱신을 밀어 주어 루프가 즉시 다시 돌기 시작한다.</desc>
<rect width="880" height="736" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">조정 루프는 API 서버에 상태를 쌓는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 정거장으로 API 서버가 변경을 밀어 줍니다</text>

<path d="M 285.9 233.3 A 210 210 0 0 1 351.9 185.4" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 440 324.0 L 440 200.0" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)" stroke-dasharray="5 4"/>

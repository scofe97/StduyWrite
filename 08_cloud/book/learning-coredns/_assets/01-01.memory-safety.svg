<title id="dt">칸을 넘는 패킷과 두 언어의 갈림</title><desc id="dd">바깥 DNS 패킷의 길이가 버퍼 칸을 넘을 때 C 서버는 인접 메모리를 덮어써 중단이나 OS 장악으로 이어질 수 있지만, Go 서버(CoreDNS)는 실행 중 범위 검사로 panic을 일으키고 recover()로 수습해 서버를 살린다. 가리키는 곳이 없어진 메모리는 가비지 컬렉터(GC)가 따로 회수한다.</desc>
<rect width="960" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 01-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">칸을 넘는 패킷과 두 언어의 갈림</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">범위 검사가 없는 C는 옆 메모리를 덮고, Go는 범위 검사로 멈추며 CoreDNS가 recover()로 서버를 살립니다</text>
<rect x="28" y="184" width="152" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="104" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">바깥 DNS 패킷</text>
<text x="104" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">길이 N+k</text>
<path d="M 180 216 L 208 216" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="208" y="184" width="152" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="284" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">고정 크기 버퍼</text>
<text x="284" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">칸 N</text>
<path d="M 360 216 L 388 216" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="388" y="184" width="156" height="64" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="466" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">버퍼 칸 넘김</text>
<text x="466" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">길이 N+k &gt; 칸 N</text>
<path d="M 544 216 L 556 216 L 556 152 L 568 152" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<path d="M 544 216 L 556 216 L 556 280 L 568 280" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="560" y="96" width="376" height="112" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="0.8"/>
<text x="572" y="114" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">C 서버 (범위 검사 부재)</text>
<rect x="568" y="124" width="160" height="56" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="648" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">인접 메모리 침범</text>
<text x="648" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">버퍼 오버플로 발생</text>
<path d="M 728 152 L 752 152" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="752" y="124" width="176" height="56" rx="6" fill="#F0616D20" stroke="#F0616D" stroke-width="1.2"/>
<text x="840" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">서버 중단 · OS 장악</text>
<text x="840" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">악용 시 가능한 피해</text>
<rect x="560" y="224" width="376" height="112" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="0.8"/>
<text x="572" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">Go 서버 · CoreDNS (실행 중 검사)</text>
<rect x="568" y="252" width="160" height="56" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="648" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">실행 중 범위 검사</text>
<text x="648" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">런타임 panic 발생</text>
<path d="M 728 280 L 752 280" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="752" y="252" width="176" height="56" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="840" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">recover() 서버 생존</text>
<text x="840" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">질의 실패 · 프로세스 유지</text>
<rect x="28" y="356" width="904" height="120" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="0.9"/>
<text x="44" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">별도 안전장치: 가비지 컬렉터 (GC)</text>
<text x="320" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">dangling pointer 방지 · 버퍼 범위 검사와 무관한 독립 메모리 회수</text>
<rect x="44" y="396" width="248" height="60" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="168" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">가리키는 곳 없는 메모리 식별</text>
<text x="168" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">도달 불가능 객체 추적</text>
<path d="M 292 426 L 324 426" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="324" y="396" width="248" height="60" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="448" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">백그라운드 자동 회수</text>
<text x="448" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">런타임 힙 메모리 정리</text>
<path d="M 572 426 L 604 426" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="604" y="396" width="312" height="60" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="760" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">dangling pointer 차단</text>
<text x="760" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">해제 메모리 오접근 및 훼손 방지</text>
<line x1="12" y1="508" x2="912" y2="508" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="530" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="520" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">칸 넘김 위험</text>
<rect x="235" y="520" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="257" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 방어 및 서버 생존</text>
<rect x="448" y="520" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="470" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핵심 안전장치 (focal)</text>
<rect x="687" y="520" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="709" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">독립 회수 장치 (GC)</text>
</svg>
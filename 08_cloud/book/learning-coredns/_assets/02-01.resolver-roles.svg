<title id="dt">스텁은 묻고 재귀 서버가 답을 완성한다</title><desc id="dd">www.example.com 질의 하나가 앱, 스텁 리졸버, 재귀 서버를 지나 루트·TLD·권한 서버까지 가는 순서. 재귀 서버만 참조를 따라 내려가고, 쿠버네티스에서는 CoreDNS 가 클러스터 이름을 직접 답하고 나머지를 재귀 서버로 넘긴다.</desc>

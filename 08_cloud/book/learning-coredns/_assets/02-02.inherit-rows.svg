<title id="dt">빈칸은 윗줄에서 내려온다</title><desc id="dd">존 파일 네 줄을 다섯 칸으로 펼친 그림이다. 둘째 줄은 NAME 을, 넷째 줄은 NAME 과 TTL 을 생략했고, 그 칸은 바로 윗줄에 적힌 값을 물려받는다. CLASS 는 모든 줄이 IN 으로 적었다.</desc>

<title id="dt">질의 하나가 기본 Corefile 의 어느 줄에서 끝나는가</title><desc id="dd">클러스터 안 이름, 헤드리스, 서비스 IP 와 외부 IP 의 PTR, 외부 이름, 사내 이름을 기본 Corefile 에 차례로 물었을 때 처음 받는 줄과 결과를 적었다. 이 편의 절은 이 여섯 줄을 하나씩 설명한다.</desc>
<rect width="880" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">질의 하나가 기본 Corefile 의 어느 줄에서 끝나는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 행이 나머지를 설명하는 사실입니다</text>
<text x="32" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">질의</text>
<text x="342" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">받는 줄</text>
<text x="522" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">결과</text>
<text x="792" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">절</text>
<rect x="16" y="130" width="848" height="60" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="32" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">orders.default.svc.cluster.local</text>
<text x="32" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">A · 서비스</text>
<text x="342" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">kubernetes</text>
<text x="342" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Services 메모리</text>

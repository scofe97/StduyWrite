<title id="dt">질의 하나가 dnstap 메시지 넷이 된다</title><desc id="dd">CoreDNS 는 클라이언트 질의를 받을 때, 상류에 전달할 때, 상류 응답을 받을 때, 클라이언트에 답할 때 메시지를 하나씩 남긴다. 기본으로는 시각과 주소·포트·프로토콜만 실리고, full 을 붙여야 DNS 메시지 원문이 실린다.</desc>

<text x="20" y="544" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">1~3절 · 손으로 고치는 길이 왜 막히는가 · 4~6절 · CoreDNS 의 답</text>
<text x="20" y="568" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">7절 · etcd 밖의 대안 · 어느 길이든 일반 질의는 TTL 을 기다린다</text>

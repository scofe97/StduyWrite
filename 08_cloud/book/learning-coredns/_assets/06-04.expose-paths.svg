<text x="545.0" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">직접 응답</text>
<rect x="20" y="352" width="840" height="68" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="32" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">외부 이름은 전용 CoreDNS 로 따로 띄운다</text>
<text x="32" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">바깥의 서비스 거부 공격이 클러스터 DNS 를 쓰러뜨리면 클러스터 서비스 상당수가 함께 내려간다</text>
<text x="20" y="448" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">k8s_external 은 kubernetes 플러그인과 함께일 때만 동작 · 상위 존이 NS 로 위임해야 바깥에서 닿는다</text>
<line x1="12" y1="464" x2="832" y2="464" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="486" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="476" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원서 사이드바의 권고</text>

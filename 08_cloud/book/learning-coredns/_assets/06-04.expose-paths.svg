<title id="dt">외부 IP 를 이름으로 알리는 두 길</title><desc id="dd">LoadBalancer 서비스가 외부 IP 를 받은 뒤 그 이름을 바깥에 알리는 길은 둘이다. external DNS 는 바깥 DNS 서버에 레코드를 써 넣고, k8s_external 은 CoreDNS 가 위임받은 존에서 직접 답한다.</desc>
<rect width="880" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-04 §6</text>

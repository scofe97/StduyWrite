<title id="dt">복구는 그룹마다, 로깅은 마지막 그룹이 정한다</title><desc id="dd">복구를 끄는 s.debug 는 리슨 주소가 같은 서버 그룹 단위로 선다. 디버그 로깅은 패키지 전역이라 그룹을 만들 때마다 켜지거나 꺼지고, 그룹을 만드는 순서는 맵 순회라 정해지지 않는다.</desc>
<rect width="880" height="392" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 08-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">복구는 그룹마다, 로깅은 마지막 그룹이 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 열이 실행마다 달라질 수 있는 자리입니다</text>
<text x="20" y="102" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">.:53 { debug ... }</text>
<text x="230" y="102" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">.:5300 { ... }</text>
<text x="32" y="136" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">그룹을 만드는 순서</text>
<text x="242" y="136" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">.:53 panic 복구</text>
<text x="452" y="136" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">.:5300 panic 복구</text>

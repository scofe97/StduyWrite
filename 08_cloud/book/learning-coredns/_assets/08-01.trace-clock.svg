<title id="dt">스팬이 시계 오차로 어긋나 보이는 자리</title><desc id="dd">위는 시계가 맞을 때의 스팬 배치이고, 아래는 호스트 시계가 조금 어긋났을 때다. 요청이 1밀리초에도 못 미치면 나노초 단위 오차가 순서를 뒤집어 보이게 한다.</desc>
<rect width="880" height="578" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 08-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스팬이 시계 오차로 어긋나 보이는 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황이 클라이언트를 떠나기 전에 시작한 것처럼 보이는 스팬입니다</text>
<line x1="250" y1="108" x2="830" y2="108" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="250" y="100" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">시간</text>
<text x="20" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">시계가 맞을 때</text>
<text x="236" y="147" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">client</text>
<rect x="280" y="132" width="470" height="22" rx="4" fill="#3FB98C20" stroke="#3FB98C" stroke-width="1.2"/>
<text x="236" y="187" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">coredns</text>
<rect x="340" y="172" width="350" height="22" rx="4" fill="#3FB98C20" stroke="#3FB98C" stroke-width="1.2"/>
<text x="236" y="227" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">upstream</text>
<rect x="430" y="212" width="190" height="22" rx="4" fill="#3FB98C20" stroke="#3FB98C" stroke-width="1.2"/>
<line x1="250" y1="268" x2="830" y2="268" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="20" y="278" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서버 시계가 조금 빠를 때</text>
<text x="236" y="307" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">client</text>
<rect x="280" y="292" width="470" height="22" rx="4" fill="#8B98A920" stroke="#8B98A9" stroke-width="1.2"/>
<text x="236" y="347" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">coredns</text>
<rect x="262" y="332" width="350" height="22" rx="4" fill="#F08A5920" stroke="#F08A59" stroke-width="1.4"/>
<text x="236" y="387" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">upstream</text>
<rect x="352" y="372" width="190" height="22" rx="4" fill="#8B98A920" stroke="#8B98A9" stroke-width="1.2"/>
<path d="M 280 288 L 280 402" fill="none" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="20" y="414" width="840" height="84" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">점선이 클라이언트가 보낸 시각이고, 서버 스팬이 그 왼쪽에서 시작한다</text>
<text x="36" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">그래도 추적은 쓸모 있는 신호를 준다고 저자들이 적는다</text>
<text x="36" y="484" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">다만 스팬의 절대 시각을 인과의 근거로 삼지 않는 것이 이 주의를 아는 실무적 형태다</text>
<line x1="12" y1="518" x2="832" y2="518" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="540" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="530" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어긋나 보이는 스팬</text>
<rect x="274" y="530" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="296" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시계가 맞을 때</text>
</svg>
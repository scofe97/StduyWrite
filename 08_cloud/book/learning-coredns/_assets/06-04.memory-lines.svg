<title id="dt">객체가 늘수록 두 모드의 메모리가 벌어진다</title><desc id="dd">가로축은 파드와 서비스를 더한 객체 수, 세로축은 CoreDNS 인스턴스 하나의 메모리다. 두 선 모두 원서의 실측점 둘을 지나고, verified 의 기울기가 네 배라서 클러스터가 커질수록 차이가 커진다.</desc>

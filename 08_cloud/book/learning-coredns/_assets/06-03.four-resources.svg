<title id="dt">네 범주가 한 파드로 모인다</title><desc id="dd">권한 묶음은 파드가 API 서버를 읽게 하고, ConfigMap 은 Corefile 을 넣어 주고, Deployment 는 파드를 띄우고, Service 는 트래픽을 파드로 보낸다. Corefile 은 이 넷 가운데 하나일 뿐이다.</desc>

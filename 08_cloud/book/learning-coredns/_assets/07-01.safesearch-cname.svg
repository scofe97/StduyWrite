<title id="dt">CNAME 은 질문을 두고 답만 다른 이름을 가리킨다</title><desc id="dd">Safe Search 강제는 www.google.com 을 forcesafesearch.google.com 의 CNAME 으로 둔다. 응답의 첫 레코드 소유자가 물은 이름 그대로라 대응이 지켜진다. 질문 이름 자체를 바꾸는 정규식 rewrite 는 answer name 없이는 Answer 에 다른 이름이 실린다.</desc>
<rect width="880" height="400" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 07-01 §9</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">CNAME 은 질문을 두고 답만 다른 이름을 가리킨다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 칸이 물은 이름이 그대로 남는 자리입니다</text>
<text x="30" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">방식</text>
<text x="240" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">Question</text>
<text x="490" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">Answer</text>
<rect x="20" y="132" width="200" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="32" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">CNAME 으로 돌림</text>
<text x="32" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Safe Search 강제</text>
<rect x="230" y="132" width="240" height="72" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="242" y="173" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">www.google.com.</text>
<rect x="480" y="132" width="380" height="72" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="492" y="162" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">www.google.com. CNAME</text>
<text x="492" y="184" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">forcesafesearch.google.com.</text>
<rect x="20" y="222" width="200" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="32" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">질문 이름을 바꿈</text>
<text x="32" y="274" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">regex · answer name 없음</text>
<rect x="230" y="222" width="240" height="72" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="242" y="263" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">www.google.com.</text>
<rect x="480" y="222" width="380" height="72" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="492" y="252" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">forcesafesearch.google.com. A</text>
<text x="492" y="274" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">물은 이름과 다른 소유자</text>
<text x="20" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">둘째 행은 비교를 위한 가정 · 실제 Safe Search 강제는 첫째 행 방식</text>
<line x1="12" y1="358" x2="832" y2="358" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

<text x="642.0" y="291.66666666666663" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">116,000 개 → 170Mi</text>

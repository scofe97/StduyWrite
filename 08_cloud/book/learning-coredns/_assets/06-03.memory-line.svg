<title id="dt">170Mi 는 기본 설정에서 116,000 개까지 버틴다</title><desc id="dd">기본 설정 식은 1,000 개마다 1MiB 씩, autopath 를 켠 식은 250 개마다 1MiB 씩 오른다. 두 직선이 170Mi 상한과 만나는 점이 각 설정에서 상한이 버티는 규모의 추정치다.</desc>
<rect width="880" height="572" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-03 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">170Mi 는 기본 설정에서 116,000 개까지 버틴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 점이 기본 설정에서 상한과 만나는 자리입니다</text>

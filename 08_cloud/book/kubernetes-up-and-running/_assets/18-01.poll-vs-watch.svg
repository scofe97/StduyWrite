<title id="dt">폴링은 기다리고 watch 는 열어 둔다</title><desc id="dd">폴링은 지연과 API 서버 부하를 함께 물린다. watch 는 hanging GET 으로 연결을 열어 두고 변화가 생길 때마다 스트림에 써 넣는다.</desc>

<rect x="12" y="578" width="1204" height="60" rx="8" fill="#F08A590E" stroke="#F08A59" stroke-width="1.2"/>
<text x="620.0" y="602" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">completions 를 비워 두면 worker-pool 모드다. 첫 파드가 종료 코드 0 으로 나가는 순간 Job 은 정리에 들어가 새 파드를 만들지 않는다.</text>
<text x="620.0" y="624" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">그래서 다섯은 큐가 빈 것을 각자 확인하고 함께 끝난다 — 하나라도 먼저 나가면 남은 일감을 처리할 워커가 줄어든다.</text>

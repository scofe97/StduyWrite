<title id="dt">셋은 선택지가 아니라 밀려나는 단계다</title><desc id="dd">가장 단순한 것에서 시작해, 그것이 아파지는 지점에서 다음으로 넘어간다. 어디에 설지는 애플리케이션마다 다르고 자라면서 바뀐다.</desc>
<rect width="1240" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES UP AND RUNNING · 21-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">셋은 선택지가 아니라 밀려나는 단계다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원서 21장 — 바뀔 것을 전제로 설계해 두면 대규모 리팩터링을 피한다</text>
<rect x="24" y="138" width="386" height="308" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">01 · 복제 사일로</text>
<text x="390" y="168" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">가장 쉬운 시작</text>
<text x="44" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">모든 리전에 그대로 복사</text>
<line x1="44" y1="208" x2="390" y2="208" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="44" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#3FB98C">얻는 것</text>
<rect x="44" y="244" width="346" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="56" y="261" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">요청이 들어온 리전 안에서 끝까지 처리</text>
<rect x="44" y="276" width="346" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="56" y="293" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">애플리케이션을 크게 바꾸지 않아도 된다</text>
<text x="44" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">다음으로 밀리는 이유</text>
<rect x="44" y="338" width="346" height="56" rx="5" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="217.0" y="362" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">가장 큰 지역에 맞춰 사이징한다</text>
<text x="217.0" y="382" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#E3B341">작은 지역의 복제본이 크게 남는다</text>
<path d="M 412 292.0 L 426 292.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="428" y="138" width="386" height="308" rx="8" fill="#F08A590C" stroke="#F08A59" stroke-width="1.5"/>
<text x="448" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">02 · 리전 샤딩</text>
<text x="794" y="168" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">저자의 강한 권고</text>
<text x="448" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터를 나눠 일부 리전에만</text>
<line x1="448" y1="208" x2="794" y2="208" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="448" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#3FB98C">얻는 것</text>
<rect x="448" y="244" width="346" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="460" y="261" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">전역 복제 비용이 준다</text>
<rect x="448" y="276" width="346" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="460" y="293" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">데이터 위치 규제를 지킬 수 있다</text>
<text x="448" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">다음으로 밀리는 이유</text>
<rect x="448" y="338" width="346" height="56" rx="5" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="621.0" y="362" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">라우팅 계층이 필요해진다</text>
<text x="621.0" y="382" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">라이브러리 말고 별도 마이크로서비스로</text>
<path d="M 816 292.0 L 830 292.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="832" y="138" width="386" height="308" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="852" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">03 · 마이크로서비스 라우팅</text>
<text x="1198" y="168" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">가장 유연하고 가장 비싸다</text>
<text x="852" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서비스마다 자체 LB 와 복제</text>
<line x1="852" y1="208" x2="1198" y2="208" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="852" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#3FB98C">얻는 것</text>
<rect x="852" y="244" width="346" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="864" y="261" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">팀마다 독립적으로 확장·배포한다</text>
<rect x="852" y="276" width="346" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="864" y="293" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">사일로라는 더 큰 모놀리스를 깬다</text>
<text x="852" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">치러야 할 것</text>
<rect x="852" y="338" width="346" height="56" rx="5" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="1025.0" y="362" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">서비스 수만큼 비용이 붙는다</text>
<text x="1025.0" y="382" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">LB 유지 비용과 리전 간 트래픽</text>
<line x1="24" y1="472" x2="1192" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">가운데 칸의 권고가 이 장에서 가장 실무적이다 — 데이터 라우팅을 모든 서비스가 각자 걱정하는 대신 한 서비스가 캡슐화한다. 서비스를 더하는 것이 오히려 단순화다.</text>
<line x1="12" y1="512" x2="1192" y2="512" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="534" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="524" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="534" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">저자가 못 박는 자리</text>
<rect x="287" y="524" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="309" y="534" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">감당되는 비용</text>
<rect x="422" y="524" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="444" y="534" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">가장 큰 대가</text>
</svg>
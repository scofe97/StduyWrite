<title id="dt">아울러야 할 폭이 능력을 눌렀다</title><desc id="dd">코어의 네트워킹은 애플리케이션을 오직 목적지로만 안다. Ingress 가 조금 더 나아가지만, 기존 구현체를 폭넓게 아우르는 공통 API 여야 한다는 과제가 그 능력을 제한했다.</desc>
<rect width="1240" height="622" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES UP AND RUNNING · 15-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">아울러야 할 폭이 능력을 눌렀다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">메시 API 가 코어 밖에서 자란 것은 그 과제의 결과다</text>
<rect x="12" y="118" width="600" height="312" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="36" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">Ingress API</text>
<text x="588" y="148" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">코어 안</text>
<line x1="36" y1="162" x2="588" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">호환해야 하는 것</text>
<line x1="36" y1="214" x2="588" y2="214" stroke="#F08A59" stroke-width="2.0"/>
<line x1="36" y1="207" x2="36" y2="221" stroke="#F08A59" stroke-width="2.0"/>
<line x1="588" y1="207" x2="588" y2="221" stroke="#F08A59" stroke-width="2.0"/>
<text x="36" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">왼쪽 끝 — 베어메탈 네트워크 장비</text>
<text x="36" y="259" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">오른쪽 끝 — 클라우드 네이티브를 염두에 두지 않고 만들어진 퍼블릭 클라우드 API</text>
<text x="312.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">이 폭을 공통 API 하나가 전부 아울러야 한다</text>
<text x="36" y="306" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">그래서 가능한 능력</text>
<rect x="36" y="324" width="552" height="22" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="48" y="339" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">목적지로 보낸다 — label selector 로 고른 파드 집합</text>
<rect x="36" y="352" width="552" height="22" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="48" y="367" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">HTTP 로드밸런서로서 조금 더 나아간다</text>
<rect x="36" y="380" width="552" height="22" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="48" y="395" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">그 너머로 더 해 주는 일은 비교적 적다</text>
<rect x="628" y="118" width="600" height="312" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="652" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">메시 API</text>
<text x="1204" y="148" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">코어 밖 · CRD 로 더한다</text>
<line x1="652" y1="162" x2="1204" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="652" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">호환해야 하는 것</text>
<line x1="652" y1="214" x2="802" y2="214" stroke="#3FB98C" stroke-width="2.0"/>
<line x1="652" y1="207" x2="652" y2="221" stroke="#3FB98C" stroke-width="2.0"/>
<line x1="802" y1="207" x2="802" y2="221" stroke="#3FB98C" stroke-width="2.0"/>
<text x="652" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">클러스터 안쪽 파드 사이만 본다</text>
<text x="820" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">여기까지다 — 기존 인프라와의 호환 의무가 없다</text>
<text x="652" y="306" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">그래서 가능한 능력</text>
<rect x="652" y="324" width="552" height="22" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="664" y="339" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">암호화와 신원 — mTLS 로 모든 파드 사이에 자동으로</text>
<rect x="652" y="352" width="552" height="22" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="664" y="367" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">트래픽 셰이핑 — 10% 는 Y, 90% 는 X 를 선언으로</text>
<rect x="652" y="380" width="552" height="22" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="664" y="395" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">내부 관찰 — 흩어진 요청을 하나로 되맞춘다</text>
<rect x="140" y="464" width="240" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="260" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">바깥세상</text>
<text x="260" y="514" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">HTTP(S) 트래픽</text>
<rect x="500" y="464" width="240" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="620" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클러스터 안</text>
<text x="620" y="514" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클라우드 네이티브 애플리케이션</text>
<rect x="860" y="464" width="240" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="980" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">파드 사이</text>
<text x="980" y="514" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서로 부르는 마이크로서비스</text>
<path d="M 380 498 L 496 498" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 740 498 L 856 498" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="438" y="478" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">Ingress API 가 들여온다</text>
<text x="798" y="478" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">메시 API 가 능력을 더한다</text>
<line x1="12" y1="566" x2="1192" y2="566" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="588" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="578" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">호환 폭이 능력을 누른 자리</text>
<rect x="339" y="578" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="361" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">호환 의무가 없는 자리</text>
</svg>
<text x="24" y="488" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">검증 웹훅은 admission.gatekeeper.sh/ignore 레이블이 붙은 네임스페이스를 건너뛴다. 그 레이블을 아무나 붙일 수 있으면 정책 전체가 우회된다.</text>
<text x="24" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">그래서 레이블을 붙이는 길만 닫고 지킨다 — 가운데 카드가 유일하게 Fail 인 이유다. 원서가 안 보여 준 것이지 없던 것이 아니다.</text>

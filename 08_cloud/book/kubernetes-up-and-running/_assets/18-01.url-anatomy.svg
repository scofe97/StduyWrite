<title id="dt">URL 한 줄에 두 축이 적혀 있다</title><desc id="dd">API 서버는 HTTP 서버이고 클라이언트도 그렇게 본다. 그래서 경로를 읽으면 어느 API 그룹인지와 네임스페이스에 속하는지가 그대로 나온다.</desc>
<rect width="1240" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES UP AND RUNNING · 18-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">URL 한 줄에 두 축이 적혀 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">kind 로컬 클러스터 실측 — kubectl v1.34.1 · 서버 v1.35.0 · kubectl get &lt;리소스&gt; --v=6</text>

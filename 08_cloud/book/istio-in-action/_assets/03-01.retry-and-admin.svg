<text x="428.0" y="514" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">upstream_rq_retry: 3 · upstream_rq_retry_success: 0</text>

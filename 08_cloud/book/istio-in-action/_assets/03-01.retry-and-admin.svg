<line x1="428.0" y1="158" x2="428.0" y2="532" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="730.0" y1="158" x2="730.0" y2="532" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 136.0 192 L 416.0 192" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>

<title id="dt">부록 A 를 읽는 순서</title><desc id="dd">설치를 고르는 판단을 좁은 데서 넓은 데로 놓은 지도. 앞의 둘이 무엇으로 올리는지를 세우고 셋째가 무엇을 골라 올리는지를 세운다. 넷째가 그 둘로 구성을 하나 만들고 마지막이 도구 선택으로 되돌아온다.</desc>
<rect width="880" height="604" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">부록 A 를 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앞의 다섯은 기계가 하는 일이고 §6 만 사람이 고르는 자리입니다</text>

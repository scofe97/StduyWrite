<title id="dt">설치 한 줄이 고른 것들</title><desc id="dd">istioctl install --set profile=demo 한 줄에서 갈래가 둘로 갈라진다. 위 갈래는 무엇으로 올리는지를 고르고 Helm 값에 검증이 없어서 IstioOperator API 가 생겼다. 아래 갈래는 출발점인 프로파일을 고른다. 두 갈래는 컨트롤 플레인과 게이트웨이를 별도 리소스로 나누는 자리에서 만난다. 그 뒤로 이름이 하는 일과 도구 선택이 이어진다.</desc>
<rect width="920" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">설치 한 줄이 고른 것들</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 요소의 관계이고 칩은 그 요소를 다루는 절입니다</text>
<rect x="24" y="226" width="160" height="76" rx="6" fill="#F08A591e" stroke="#F08A59" stroke-width="1.4"/>
<text x="104.0" y="256" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">istioctl install</text>
<text x="104.0" y="276" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">--set profile=demo</text>
<text x="104.0" y="294" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">책 실습의 설치 한 줄</text>
<rect x="340" y="110" width="200" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<rect x="350.18" y="114" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="364" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§1</text>

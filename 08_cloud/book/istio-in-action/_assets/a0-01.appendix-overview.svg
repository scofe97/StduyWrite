<rect x="670" y="284" width="210" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<rect x="680.18" y="288" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="694" y="302" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§4</text>

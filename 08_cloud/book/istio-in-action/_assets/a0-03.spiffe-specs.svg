<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">이름 · 부트스트랩 · 발급 · 결과물이 하나씩</title><desc id="dd">규격 넷은 겹치지 않는 자리를 하나씩 맡는다. 엔드포인트가 데이터 플레인에 서고 API 가 컨트롤 플레인에 서며, 그 둘이 협력해 이름을 문서로 만든다. 색이 붙은 것이 그 결과물이다.</desc>
<rect width="1000" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름 · 부트스트랩 · 발급 · 결과물이 하나씩</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">SPIFFE ID 는 이름이고 SVID 는 그 이름이 서명까지 받은 문서입니다</text>
<rect x="28" y="132" width="280" height="102" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="28" y1="178" x2="308" y2="178" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="44" y="152" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">SPEC · 이름</text>
<text x="44" y="170" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">SPIFFE ID</text>
<text x="44" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">신뢰 도메인 안에서</text>
<text x="44" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서비스를 유일하게 가리킨다</text>
<rect x="28" y="320" width="280" height="124" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<line x1="28" y1="366" x2="308" y2="366" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="44" y="340" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">SPEC · 데이터 플레인</text>
<text x="44" y="358" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Workload Endpoint</text>
<text x="44" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">워크로드 곁에 배포된다</text>
<text x="44" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">신원을 부트스트랩한다</text>
<text x="44" y="428" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">워크로드 증명을 한다</text>
<rect x="400" y="320" width="280" height="102" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<line x1="400" y1="366" x2="680" y2="366" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="416" y="340" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">SPEC · 컨트롤 플레인</text>
<text x="416" y="358" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Workload API</text>
<text x="416" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">CA 키로 CSR 에 서명한다</text>
<text x="416" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 기능을 API 로 연다</text>
<rect x="692" y="132" width="280" height="124" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<line x1="692" y1="178" x2="972" y2="178" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="708" y="152" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">SPEC · 결과물</text>
<text x="708" y="170" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">SVID</text>
<text x="708" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SPIFFE ID 를 담는다</text>
<text x="708" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">유효한 서명을 담는다</text>
<text x="708" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공개 키는 선택</text>
<path d="M 308 178 L 688 178" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="462.5" y="155" width="71" height="18" rx="3" fill="#0D1117"/>
<text x="498" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">인코딩된다</text>
<path d="M 308 380 L 396 380" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="319.0" y="353" width="66" height="18" rx="3" fill="#0D1117"/>
<text x="352" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">CSR 제출</text>
<path d="M 680 380 L 832 380 L 832 262" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<rect x="717.0" y="353" width="78" height="18" rx="3" fill="#0D1117"/>
<text x="756" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">서명해 발급</text>
<text x="28" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">규격은 이름을 SVID 에 인코딩하는 과정과, 두 부품이 협력해 신원을 검증하고 할당하고 확인하는 방법을 함께 정의한다</text>
<line x1="12" y1="524" x2="952" y2="524" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="546" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="536" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">규격이 내놓는 결과물</text>
<rect x="287" y="536" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">협력하는 두 부품</text>
</svg>
<title id="dt">미리 정하지 않았던 것을 나중에 세려면 — 읽는 순서</title><desc id="dd">7장 노트의 절 여덟을 읽는 순서로 이은 지도. 앞의 다섯 절이 이미 있는 값을 꺼내 보는 이야기이고, §6 부터 무엇을 셀지 자체를 바꾸는 이야기로 넘어간다.</desc>
<rect width="880" height="760" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 07-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">미리 정하지 않았던 것을 나중에 세려면 — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앞의 다섯은 꺼내 보는 이야기입니다. §6 부터가 무엇을 셀지 바꾸는 이야기입니다</text>

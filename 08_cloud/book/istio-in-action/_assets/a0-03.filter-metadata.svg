<path d="M 498 220 L 498 298" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="180" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">뽑아서 넣는다</text>
<rect x="692" y="148" width="280" height="292" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>

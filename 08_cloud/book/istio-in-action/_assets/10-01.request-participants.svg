<title id="dt">요청 하나에 넷이 관여하고 하나가 비어 있다</title><desc id="dd">사람이 쓴 리소스를 istiod 가 Envoy 설정으로 번역해 데이터 플레인에 내려보내고, 요청은 게이트웨이와 사이드카를 거쳐 애플리케이션에 닿는다. 색이 붙은 자리가 저자의 예제에서 빠져 있는 리소스다.</desc>
<rect width="1000" height="612" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 10-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">요청 하나에 넷이 관여하고 하나가 비어 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">전부를 디버깅할 시간이 없기 때문에 어디부터 볼지가 이 장의 내용입니다</text>

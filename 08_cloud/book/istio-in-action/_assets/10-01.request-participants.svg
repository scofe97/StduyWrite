<text x="32" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">왼쪽 리소스를 istiod 가 읽어 xDS 로 게이트웨이와 사이드카에 내려보낸다 — 저자의 예제는 그중 하나가 빈 채로 돈다</text>

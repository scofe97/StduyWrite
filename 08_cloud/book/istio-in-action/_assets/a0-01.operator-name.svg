<title id="dt">같은 YAML 이 이름 하나로 갱신이 되기도 새 설치가 되기도 한다</title><desc id="dd">오퍼레이터는 IstioOperator 리소스의 이벤트를 지켜보다가 설치를 그 정의에 맞춘다. 이때 metadata.name 이 갱신 대상을 정한다. 색이 붙은 상태가 이름이 맞았을 때 가는 자리다.</desc>
<rect width="1000" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 YAML 이 이름 하나로 갱신이 되기도 새 설치가 되기도 한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이름이 다르면 컨트롤 플레인이 하나 더 서는데 저자는 그것도 쓸모가 있다고 적습니다</text>
<circle cx="16" cy="250.0" r="6" fill="#F5F5F3"/>
<path d="M 24 250.0 L 46 250.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="48" y="216" width="232" height="68" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="164.0" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">설치가 하나 서 있다</text>
<text x="164.0" y="266" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">name: control-plane</text>
<rect x="440" y="132" width="232" height="68" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="556.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">그 설치가 갱신된다</text>
<text x="556.0" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">accessLogEncoding: JSON</text>
<rect x="440" y="320" width="232" height="68" rx="8" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="556.0" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">둘째 컨트롤 플레인이 선다</text>
<text x="556.0" y="370" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">name: control-plane-2</text>
<path d="M 280 250.0 L 340 250.0" fill="none" stroke="#8B98A9" stroke-width="1.3"/>
<path d="M 340 166.0 L 340 354.0" fill="none" stroke="#8B98A9" stroke-width="1.3"/>
<path d="M 340 166.0 L 438 166.0" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 340 354.0 L 438 354.0" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="329.0" y="135.0" width="78" height="18" rx="3" fill="#0D1117"/>
<text x="368" y="148.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">이름이 같다</text>
<rect x="327.5" y="323.0" width="89" height="18" rx="3" fill="#0D1117"/>
<text x="372" y="336.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">이름이 다르다</text>
<circle cx="700" cy="166.0" r="8" fill="none" stroke="#F5F5F3" stroke-width="1.2"/>
<circle cx="700" cy="166.0" r="5" fill="#F5F5F3"/>
<path d="M 672 166.0 L 688 166.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="740" y="160.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">쓸모가 있는 갈래다</text>
<text x="740" y="182.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">멀티테넌시 · 카나리 업그레이드</text>
<path d="M 736 192.0 L 736 354.0 L 676 354.0" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)" stroke-dasharray="4 3"/>
<text x="28" y="424" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">4 절에서는 이름이 겹치면 앞의 것을 지웠고 여기서는 겹쳐야 갱신된다 — 이름이 설치의 식별자라서 그렇다</text>
<text x="28" y="448" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">설치는 istioctl operator init 한 줄이고 그다음부터는 같은 YAML 을 kubectl apply 로 올린다</text>
<line x1="12" y1="472" x2="952" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="494" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="484" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이름이 맞았을 때 가는 자리</text>
<rect x="339" y="484" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="361" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이름이 어긋났을 때 서는 것</text>

<title id="dt">호출 깊이가 다섯일 때 요청이 늘어나는 모양</title><desc id="dd">저자의 계산 — 사슬이 다섯 단계 깊고 각 단계가 두 번씩 재시도하면 들어온 요청 하나가 끝에서 32개가 된다. 사슬 끝의 자원이 이미 과부하라면 이 추가 부하가 그 자원을 무너뜨린다.</desc>

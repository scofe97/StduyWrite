<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">네 갈래가 같은 증상으로 모인다</title><desc id="dd">저자가 든 성능 요인 넷을 결과 하나에 붙였다. 색이 붙은 뼈대가 저자가 첫 손잡이로 지목한 것이고, 나머지 셋은 그것을 다 돌린 뒤에 본다.</desc>
<rect width="1000" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 11-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">네 갈래가 같은 증상으로 모인다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">변경률만은 우리 손 밖입니다 — 나머지 셋은 설정으로 줄일 수 있습니다</text>
<path d="M 96 328 L 676 328" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="460" y1="328" x2="392" y2="172" stroke="#8B98A9" stroke-width="1.1"/>
<rect x="358.5" y="144" width="67" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="392" y="163" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">변경률</text>
<line x1="436.88" y1="274.96" x2="464.88" y2="274.96" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="472.88" y="278.96" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서비스가 뜨고 진다</text>
<line x1="416.48" y1="228.16" x2="444.48" y2="228.16" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="452.48" y="232.16" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">복제본 수가 바뀐다</text>
<line x1="352" y1="328" x2="284" y2="484" stroke="#8B98A9" stroke-width="1.1"/>
<rect x="237.5" y="484" width="93" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="284" y="503" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">할당 자원</text>
<line x1="328.88" y1="381.04" x2="356.88" y2="381.04" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="364.88" y="385.04" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">CPU 가 먼저 포화된다</text>
<line x1="308.48" y1="427.84000000000003" x2="336.48" y2="427.84000000000003" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="344.48" y="431.84000000000003" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">모자라면 큐에 쌓인다</text>
<line x1="244" y1="328" x2="176" y2="172" stroke="#8B98A9" stroke-width="1.1"/>
<rect x="123.0" y="144" width="106" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="176" y="163" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">워크로드 수</text>
<line x1="220.88" y1="274.96" x2="248.88" y2="274.96" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="256.88" y="278.96" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">갱신 대상이 늘어난다</text>
<line x1="200.48" y1="228.16" x2="228.48" y2="228.16" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="236.48" y="232.16" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">대역폭이 함께 든다</text>
<line x1="136" y1="328" x2="68" y2="484" stroke="#F08A59" stroke-width="1.4"/>
<rect x="21.5" y="484" width="93" height="28" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="68" y="503" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">설정 크기</text>
<line x1="112.88" y1="381.04" x2="140.88" y2="381.04" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="148.88" y="385.04" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">기본은 모두가 모두를 안다</text>
<line x1="92.47999999999999" y1="427.84000000000003" x2="120.47999999999999" y2="427.84000000000003" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="128.48" y="431.84000000000003" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">워크로드당 2MB</text>
<rect x="684" y="280" width="292" height="96" rx="6" fill="#F5F5F307" stroke="#F5F5F344" stroke-width="1.2"/>
<text x="830.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">데이터 플레인이</text>
<text x="830.0" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">제때 갱신되지 않는다</text>
<text x="830.0" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">낡은 설정의 수명이 길어진다</text>
<text x="32" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">저자가 못 박는 문장 — 사이드카 설정을 정의하는 것만으로 이득의 대부분을 얻는다</text>
<text x="32" y="580" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">변경률은 운영자가 정하는 값이 아니다 — 대신 얼마나 묶을지를 정할 수 있다</text>
<line x1="12" y1="608" x2="952" y2="608" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="630" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="620" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저자가 첫 손잡이로 지목한 갈래</text>
<rect x="365" y="620" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="387" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그다음에 보는 갈래</text>
</svg>
<title id="dt">같은 기능이 프로세스 밖으로 나간다</title><desc id="dd">재시도·타임아웃·서킷 브레이킹·디스커버리는 그대로 필요하다. 달라지는 것은 그것이 어디 사는가다. 색이 붙은 줄이 옮겨서 얻는 것이고, 점선으로 비운 위 칸이 애플리케이션에서 빠져나가는 자리다.</desc>

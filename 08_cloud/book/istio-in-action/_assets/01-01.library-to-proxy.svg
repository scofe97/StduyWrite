<text x="32" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">옮겨서 얻는 것 — 언어와 프레임워크 의존성이 사라지고, 처리가 전부 애플리케이션 프로세스 밖에서 일어난다</text>
<text x="32" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">덤으로 얻는 것 — 초당 요청 수 · 실패 건수 · 서킷 브레이킹 발생이 자동으로 관측된다</text>
<text x="32" y="424" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">배포 형태는 사이드카다 — 애플리케이션은 먼저 Envoy 에 요청을 넘기고 그다음은 Envoy 가 처리한다</text>

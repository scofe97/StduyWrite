<title id="dt">istiod 가 xDS 유형마다 몇 번 밀어냈는가</title><desc id="dd">원문 7.2.2 의 pilot_xds_pushes 다섯 줄. 엔드포인트 디스커버리가 가장 잦은 것이 3장의 설명과 맞는다. 파드가 뜨고 지는 일은 리스너나 라우트가 바뀌는 일보다 훨씬 자주 일어난다.</desc>

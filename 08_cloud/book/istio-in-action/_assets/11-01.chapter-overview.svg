<title id="dt">컨트롤 플레인의 성능은 낡은 설정의 수명이다 — 읽는 순서</title><desc id="dd">11장 노트의 절 여덟을 읽는 순서로 이은 지도. 앞의 셋이 무엇이 느려지는지를 세우고, 가운데 둘이 그것을 어떻게 재는지를 정하며, 뒤의 셋이 손잡이를 순서대로 돌린다.</desc>
<rect width="880" height="760" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 11-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">컨트롤 플레인의 성능은 낡은 설정의 수명이다 — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">자원 증설이 마지막인 이유가 이 순서 자체입니다</text>
<path d="M 432 154.0 L 446 154.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 646.0 204 L 646.0 232.0 L 234.0 232.0 L 234.0 258" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 432 310.0 L 446 310.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 646.0 360 L 646.0 388.0 L 234.0 388.0 L 234.0 414" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 432 466.0 L 446 466.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 646.0 516 L 646.0 544.0 L 234.0 544.0 L 234.0 570" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 432 622.0 L 446 622.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="36" y="104" width="396" height="100" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="56" y="132" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">§1</text>
<text x="56" y="160" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">늦은 설정이 유령을 만든다</text>
<text x="56" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">없는 엔드포인트로 보낸다</text>
<rect x="448" y="104" width="396" height="100" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="468" y="132" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">§2</text>
<text x="468" y="160" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">이벤트가 닿기까지 다섯 걸음</text>
<text x="468" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">일부러 늦추는 자리가 둘</text>
<rect x="36" y="260" width="396" height="100" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="56" y="288" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">§3</text>
<text x="56" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">성능을 정하는 네 가지</text>
<text x="56" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">변경률 · 자원 · 수 · 크기</text>
<rect x="448" y="260" width="396" height="100" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="468" y="288" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">§4</text>
<text x="468" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">지연 하나를 세 구간으로</text>
<text x="468" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">어디서 시간을 쓰는가</text>
<rect x="36" y="416" width="396" height="100" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="56" y="444" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">§5</text>
<text x="56" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">포화 · 트래픽 · 오류</text>
<text x="56" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">방향이 처방을 가른다</text>
<rect x="448" y="416" width="396" height="100" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="468" y="444" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">§6</text>
<text x="468" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">기본은 모두가 모두를 안다</text>
<text x="468" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Sidecar 가 2MB 를 깎는다</text>
<rect x="36" y="572" width="396" height="100" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="56" y="600" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">§7</text>
<text x="56" y="628" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">배칭 손잡이 넷</text>
<text x="56" y="654" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">지연 지표가 못 세는 구간</text>
<rect x="448" y="572" width="396" height="100" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="468" y="600" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">§8</text>
<text x="468" y="628" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">자원은 마지막 손잡이</text>
<text x="468" y="654" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">오토스케일링은 아직 안 먹는다</text>
<line x1="12" y1="720" x2="832" y2="720" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="742" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="732" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="742" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이득의 대부분이 나온다고 적은 손잡이</text>
<rect x="404" y="732" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="426" y="742" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 앞뒤로 도는 손잡이</text>
</svg>
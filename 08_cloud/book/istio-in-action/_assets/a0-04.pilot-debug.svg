<title id="dt">메시 상태를 묻는 쪽과 설정을 묻는 쪽</title><desc id="dd">8080 이 여는 엔드포인트는 두 묶음이다. 위는 Pilot 이 아는 메시 상태를, 아래는 Pilot 이 아는 데이터 플레인 설정을 묻는다. 색이 붙은 칸이 10 장의 SYNCED 판정이 실제로 읽는 자리다.</desc>
<rect width="1000" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-04 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">메시 상태를 묻는 쪽과 설정을 묻는 쪽</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">nonce 두 개가 같으면 그 프록시가 최신 설정을 갖고 있다는 뜻입니다</text>
<line x1="0" y1="140" x2="1000" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="20" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">메시 상태</text>
<text x="20" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Pilot 이 아는 것</text>
<line x1="0" y1="268" x2="1000" y2="268" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="20" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">데이터 플레인 설정</text>
<text x="20" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Pilot 이 만든 것</text>
<line x1="0" y1="396" x2="1000" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="180" y1="140" x2="180" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="204" y="164" width="184" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="216" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">/debug/adsz</text>
<text x="216" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클러스터 · 라우트 · 리스너</text>
<rect x="400" y="164" width="184" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="412" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">adsz?push=true</text>
<text x="412" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">모든 프록시에 푸시 발동</text>
<rect x="596" y="164" width="184" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="608" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">/debug/edsz</text>
<text x="608" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 프록시가 아는 엔드포인트</text>
<rect x="792" y="164" width="184" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="804" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">authorizationz</text>
<text x="804" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">네임스페이스의 인가 정책</text>
<rect x="204" y="292" width="184" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="216" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">config_distribution</text>
<text x="216" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">붙은 Envoy 들의 버전 상태</text>
<rect x="400" y="292" width="184" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="412" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">/debug/config_dump</text>
<text x="412" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">생성한 Envoy 설정</text>
<rect x="596" y="292" width="184" height="80" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="608" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">/debug/syncz</text>
<text x="608" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보낸 nonce 와 받은 nonce</text>
<text x="804" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">10 장의 proxy-status 가</text>
<text x="804" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">읽는 것이 왼쪽 칸이다</text>
<path d="M 796 332 L 784 332" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="28" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">kubectl -n istio-system port-forward deploy/istiod 8080 을 걸고 /debug 로 가면 전체 목록이 나온다</text>
<text x="28" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">운영에서는 ENABLE_DEBUG_ON_HTTP=false 로 끄기를 권한다 — 대신 이 엔드포인트를 쓰는 도구가 깨진다</text>
<line x1="12" y1="476" x2="952" y2="476" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="498" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="488" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SYNCED 판정이 읽는 자리</text>
<rect x="352" y="488" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="374" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">나머지 엔드포인트</text>
</svg>
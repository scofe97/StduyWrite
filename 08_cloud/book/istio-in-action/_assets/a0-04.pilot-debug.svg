<title id="dt">메시 상태를 묻는 묶음과 설정을 묻는 묶음</title><desc id="dd">8080 디버그 엔드포인트는 위 레인의 메시 상태 네 개와 아래 레인의 데이터 플레인 설정 세 개로 갈린다. 경로는 모두 /debug/ 아래에 있고 색이 붙은 syncz 가 istioctl proxy-status 의 SYNCED 판정 근거다.</desc>
<rect width="960" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-04 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">메시 상태를 묻는 묶음과 설정을 묻는 묶음</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">nonce 두 개가 같으면 프록시가 최신 설정을 갖고 있습니다</text>
<line x1="0" y1="128" x2="960" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="20" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">메시 상태</text>
<text x="20" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">Pilot 이 아는 것</text>
<line x1="0" y1="264" x2="960" y2="264" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="20" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">데이터 플레인 설정</text>
<text x="20" y="346" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">Pilot 이 만든 것</text>
<line x1="0" y1="400" x2="960" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="176" y1="128" x2="176" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="192" y="152" width="180" height="88" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="204" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">adsz</text>
<text x="204" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">클러스터·라우트·리스너</text>
<rect x="380" y="152" width="180" height="88" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="392" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">adsz?push=true</text>
<text x="392" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">모든 프록시에 푸시 발동</text>
<rect x="568" y="152" width="180" height="88" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="580" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">edsz?proxyID=</text>
<text x="580" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">프록시가 아는 엔드포인트</text>
<rect x="756" y="152" width="180" height="88" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="768" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">authorizationz</text>
<text x="768" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">네임스페이스 인가 정책</text>
<rect x="192" y="288" width="180" height="88" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="204" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">config_distribution</text>
<text x="204" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">Envoy 들의 버전 상태</text>
<rect x="380" y="288" width="180" height="88" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="392" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">config_dump?proxyID=</text>
<text x="392" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">생성한 Envoy 설정</text>
<rect x="568" y="288" width="180" height="88" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="580" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">syncz</text>
<text x="580" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">송신·확인 nonce 비교</text>
<text x="768" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">istioctl proxy-status</text>
<text x="768" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">SYNCED 판정 근거</text>
<path d="M 764 332 L 752 332" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<line x1="12" y1="436" x2="912" y2="436" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="458" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="448" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SYNCED 판정이 읽는 자리</text>
</svg>
<text x="284" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정 가능성이 여기서 나온다</text>
<rect x="418" y="382" width="40" height="16" rx="2" fill="#F5F5F314"/>
<text x="438.0" y="394" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F5F5F3">2 in</text>

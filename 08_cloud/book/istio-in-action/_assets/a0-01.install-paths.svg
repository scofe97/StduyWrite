<title id="dt">셋은 결국 같은 템플릿을 돌린다</title><desc id="dd">설치 도구가 넷이지만 대등한 선택지가 아니다. 셋은 Helm 템플릿이라는 같은 바닥 위에 서 있고, 갈리는 것은 템플릿에 값을 넣기 전에 무엇이 값을 검사하느냐다. 색이 붙은 칸이 그 수렴점이다.</desc>
<rect width="940" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">셋은 결국 같은 템플릿을 돌린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">kubectl 은 이미 만들어진 리소스를 받는 쪽이라 축이 다릅니다</text>
<rect x="40" y="132" width="200" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="56" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">helm</text>
<text x="56" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">차트로 직접 만든다</text>
<rect x="190" y="142" width="40" height="16" rx="2" fill="#F5F5F314"/>
<text x="210.0" y="154" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F5F5F3">0 in</text>
<rect x="268" y="132" width="200" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="284" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">istioctl</text>
<text x="284" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">CRD 로 감싼다</text>
<rect x="418" y="142" width="40" height="16" rx="2" fill="#F5F5F314"/>
<text x="438.0" y="154" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F5F5F3">0 in</text>
<rect x="496" y="132" width="200" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="512" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">istio-operator</text>
<text x="512" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클러스터 안에서 지켜본다</text>

<title id="dt">복제본이 셋이어도 세는 곳은 하나여야 한다</title><desc id="dd">워크로드의 모든 Envoy 가 같은 레이트 리밋 서버를 부르고 그 서버가 공용 저장소를 본다. 색이 붙은 자리가 그 공유점이고, 그것 때문에 복제본 수와 무관하게 한도가 지켜진다.</desc>
<rect width="1000" height="676" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 14-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">복제본이 셋이어도 세는 곳은 하나여야 한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">로컬 방식이었다면 한도가 복제본 수만큼 늘어납니다</text>
<rect x="40" y="140" width="264" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="52" y="152" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="72" y="163" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">POD</text>
<text x="102" y="164" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">catalog 복제본 1</text>
<text x="102" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">app + istio-proxy</text>
<line x1="304" y1="174" x2="404" y2="174" stroke="#6A95D8" stroke-width="1.2"/>
<rect x="40" y="236" width="264" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="52" y="248" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="72" y="259" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">POD</text>
<text x="102" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">catalog 복제본 2</text>
<text x="102" y="278" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">app + istio-proxy</text>
<line x1="304" y1="270" x2="404" y2="270" stroke="#6A95D8" stroke-width="1.2"/>
<rect x="40" y="332" width="264" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="52" y="344" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="72" y="355" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">POD</text>
<text x="102" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">catalog 복제본 3</text>
<text x="102" y="374" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">app + istio-proxy</text>
<line x1="304" y1="366" x2="404" y2="366" stroke="#6A95D8" stroke-width="1.2"/>
<line x1="404" y1="174" x2="404" y2="366" stroke="#6A95D8" stroke-width="1.2"/>
<path d="M 404 270 H 448" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<rect x="452" y="236" width="260" height="68" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<rect x="464" y="248" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="484" y="259" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">RLS</text>
<text x="514" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">레이트 리밋 서버</text>
<text x="514" y="278" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Envoy 레이트 리밋 API 구현</text>
<rect x="736" y="236" width="240" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="748" y="248" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="768" y="259" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">KV</text>
<text x="798" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Redis</text>
<text x="798" y="278" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">카운터 저장 · Memcache 가능</text>
<path d="M 716 270 H 734" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="424" y="258" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">디스크립터</text>
<text x="856" y="220" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">전역 카운터</text>
<rect x="40" y="424" width="924" height="116" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="56" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">디스크립터 — Envoy 용어로 요청의 속성 또는 속성 묶음</text>
<text x="56" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">원격 주소 · 요청 헤더 · 목적지 · 그 밖의 일반적인 요청 속성</text>
<line x1="56" y1="490" x2="944" y2="490" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="56" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">서버가 하는 일 — 보내진 속성을 미리 정의된 집합과 대조하고 카운터를 올린다. 임계를 넘으면 그 요청을 제한한다</text>
<text x="24" y="576" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Envoy 의 레이트 리미팅은 여럿이다 — 네트워크 필터로도, 로컬로도, 전역으로도 된다. 저자가 고르는 것은 전역</text>
<text x="24" y="600" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 콜아웃 구조를 9 장의 외부 인가에서 이미 봤다 — 대신 요청 경로에 홉이 하나 는다</text>
<line x1="12" y1="620" x2="952" y2="620" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="642" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="632" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="642" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">복제본이 공유하는 자리</text>
<rect x="300" y="632" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="322" y="642" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프록시가 보내는 것</text>
</svg>
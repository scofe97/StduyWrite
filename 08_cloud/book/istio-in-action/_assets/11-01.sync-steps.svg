<path d="M 854.0 484 L 902.0 484 L 902.0 504 L 857.0 504" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="912.0" y="490" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">설정 반영</text>
<text x="912.0" y="507" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한 바퀴 끝</text>
<text x="24" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">디바운스는 일을 줄이려고 늦추고, 스로틀은 진행을 빠르게 하려고 동시 수를 줄인다 — 방향이 반대다</text>

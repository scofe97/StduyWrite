<title id="dt">Gateway가 맡는 층과 VirtualService가 맡는 층</title><desc id="dd">OSI 계층으로 쌓은 두 리소스의 책임. 아래 두 층(L4 전송 · L5 세션)은 Gateway 리소스 하나에, 맨 위 L7 은 VirtualService 에 들어간다. 색이 붙은 L4 에서 80·443 밖 포트가 열린다.</desc>
<rect width="1000" height="448" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 04-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Gateway가 맡는 층과 VirtualService가 맡는 층</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원문은 L4·L5 를 Gateway 가, L7 을 VirtualService 가 맡는다고만 쓴다. tls 의 층 배치는 노트의 정리</text>
<rect x="96" y="112" width="816" height="72" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="116" y="154" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">L7</text>
<text x="160" y="154" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">애플리케이션</text>
<text x="296" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">VirtualService</text>
<text x="892" y="155" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Host · 경로 매칭 → 목적지 · 재시도 · 타임아웃</text>
<rect x="96" y="192" width="816" height="72" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="116" y="234" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">L5</text>
<text x="160" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">세션 속성</text>
<text x="296" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">Gateway · tls</text>
<text x="892" y="235" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">SIMPLE · MUTUAL · PASSTHROUGH · SNI</text>
<rect x="96" y="272" width="816" height="72" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="116" y="314" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#F08A59">L4</text>
<text x="160" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">전송</text>
<text x="296" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">Gateway · port · protocol</text>
<text x="892" y="315" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">80 HTTP · 443 HTTPS · 31400 TCP</text>
<path d="M 64 340 V 124" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="64" y="360" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">처리 순서</text>
<line x1="928" y1="196" x2="928" y2="340" stroke="#8B98A9" stroke-width="1.2"/>
<text x="936" y="272" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">Gateway</text>
<text x="936" y="284" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">리소스</text>
<text x="96" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">L6 표현 계층은 저자가 언급하지 않아 비웠고, tls 를 L5 에 둔 것은 노트의 배치입니다</text>
<line x1="12" y1="404" x2="952" y2="404" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="426" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="416" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="426" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">80·443 밖 포트가 열리는 층</text>
</svg>
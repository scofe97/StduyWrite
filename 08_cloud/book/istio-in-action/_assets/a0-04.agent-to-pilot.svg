<title id="dt">답이 온다는 것 자체가 연결이 살아 있다는 뜻이다</title><desc id="dd">15004 로 던진 질의는 xDS 이벤트로 istiod 에 안전하게 전달된다. 그래서 이 왕복은 동기화 상태를 묻는 일이면서 동시에 에이전트와 컨트롤 플레인 사이 연결을 확인하는 일이 된다.</desc>
<rect width="1000" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-04 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">답이 온다는 것 자체가 연결이 살아 있다는 뜻이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">여기서 보이는 것은 Pilot 디버그 엔드포인트가 내놓는 것의 부분집합입니다</text>

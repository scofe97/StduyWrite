<text x="24" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">같은 엔드포인트를 istioctl x internal-debug 로도 쓸 수 있다 — istioctl 에 새로 더해진 것이다</text>

<title id="dt">프로파일마다 켜지는 컴포넌트가 다르다</title><desc id="dd">배포 프로파일 일곱을 행으로, 핵심 컴포넌트 다섯을 열로 놓고 켜지는 칸에 점을 찍었다. default 는 인그레스 게이트웨이와 istiod 를 켜고 demo 는 이그레스 게이트웨이까지 켠다. minimal 은 istiod 만, empty 와 remote 는 컴포넌트를 켜지 않는다. remote 는 그래도 CRD 와 주입 웹훅을 올린다. 색이 붙은 행이 다음 절이 쓰는 프로파일이다.</desc>
<rect width="1000" height="668" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로파일마다 켜지는 컴포넌트가 다르다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">istioctl 로 설치할 때만 프로파일이 컴포넌트까지 고릅니다</text>

<title id="dt">부록 C 를 읽는 순서</title><desc id="dd">앞의 넷이 SPIFFE 규격이고 뒤의 셋이 Istio 의 구현이다. 색이 붙은 칸의 제약 하나가 규격의 나머지 구조를 거의 다 결정하므로, 거기서부터 뒤가 따라 나온다.</desc>
<rect width="880" height="760" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">부록 C 를 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">규격을 먼저 세운 뒤 그 위에 구현을 얹는 순서입니다</text>

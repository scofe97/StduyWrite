<title id="dt">비밀 금지 제약에서 요청 인가까지의 인과 사슬</title><desc id="dd">a0-03 전체 인과 지도. 왼쪽은 비밀 금지 제약에서 Workload Endpoint 와 Workload API, SPIFFE ID 가 나오는 규격 구조다. 가운데는 Istio 가 부품 셋을 배치하고 X.509 SVID 로 auto mTLS 를 세우며 토큰으로 인증서를 부트스트랩하는 과정이다. 오른쪽은 요청마다 두 인증 필터가 filter metadata 를 채우고 인가 필터가 네 단계로 판정하는 흐름이다.</desc>
<rect width="984" height="696" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-03 OVERVIEW</text>

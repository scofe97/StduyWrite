<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 관계, 칩은 해당 절 번호, 왼쪽에서 오른쪽으로 읽습니다.</text>
<text x="24" y="114" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">1. SPIFFE 규격 · 제약</text>

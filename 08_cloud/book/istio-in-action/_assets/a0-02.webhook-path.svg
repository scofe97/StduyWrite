<text x="24" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">라벨이 없으면 이 왕복이 아예 일어나지 않는다 — 파드에 사이드카가 안 붙으면 여기부터 본다</text>

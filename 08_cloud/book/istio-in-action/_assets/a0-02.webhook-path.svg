<title id="dt">부품은 저장되기 전에 끼워진다</title><desc id="dd">kubectl 이 올린 파드 정의가 API 서버에 닿으면, 서버는 MutatingWebhookConfiguration 을 보고 그 이벤트를 istiod 로 보낸다. 고쳐진 정의가 돌아온 뒤에야 데이터스토어에 저장된다.</desc>
<rect width="1000" height="572" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">부품은 저장되기 전에 끼워진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">그래서 라벨을 나중에 붙였다면 이미 뜬 파드는 다시 만들어야 합니다</text>

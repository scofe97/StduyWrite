<title id="dt">신원이 네트워크 위치에서 문서로 옮겨간다</title><desc id="dd">컨트롤 플레인이 워크로드마다 SVID 를 발급하고, 사이드카끼리 그 문서로 서로를 확인한다. IP 는 어디에도 쓰이지 않는다. 색이 붙은 경로가 그 확인이 일어나는 자리다.</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 09-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">신원이 네트워크 위치에서 문서로 옮겨간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">path 를 무엇으로 채울지는 규격이 열어 두었고 Istio 는 서비스 어카운트를 넣습니다</text>
<rect x="60" y="128" width="280" height="116" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="72" y="121" width="84" height="14" fill="#0D1117"/>
<text x="78" y="131" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">ISTIO-SYSTEM</text>
<rect x="412" y="128" width="528" height="180" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="424" y="121" width="90" height="14" fill="#0D1117"/>
<text x="430" y="131" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">ISTIOINACTION</text>
<rect x="88" y="156" width="228" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="202.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">istiod</text>
<text x="202.0" y="206" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">certificate authority</text>
<rect x="440" y="156" width="220" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="550.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">webapp</text>
<text x="550.0" y="206" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">sa/webapp</text>
<rect x="692" y="156" width="220" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="802.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">catalog</text>
<text x="802.0" y="206" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">sa/catalog</text>
<path d="M 200 224 L 200 280 L 552 280 L 552 226" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 552 280 L 804 280 L 804 226" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="232" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">SVID 발급 · 순환</text>
<path d="M 660 190 L 688 190" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="676" y="172" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F08A59">mTLS</text>
<rect x="412" y="348" width="500" height="112" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="432" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">catalog 의 X.509 안에 든 것</text>
<text x="432" y="398" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">X509v3 Subject Alternative Name: critical</text>
<text x="432" y="420" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">URI:spiffe://cluster.local/ns/istioinaction/sa/catalog</text>
<text x="549" y="442" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">trust-domain</text>
<text x="672" y="442" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">path</text>
<line x1="868" y1="224" x2="868" y2="348" stroke="#8B98A9" stroke-width="1.0" stroke-dasharray="3 5"/>
<text x="28" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">인증서 발급과 순환을 사람이 하던 시절의 실수가 값비싼 장애로 이어졌다 — 자동화는 편의가 아니다</text>
<text x="28" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">검증은 /var/run/secrets/istio/root-cert.pem 으로 하고, 서명이 맞으면 한 줄짜리 확인이 나온다</text>
<line x1="12" y1="556" x2="952" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="568" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">워크로드끼리 서로를 확인하는 자리</text>
<rect x="378" y="568" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="400" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">컨트롤 플레인이 내려보내는 것</text>
</svg>
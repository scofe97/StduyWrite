<path d="M 730.0 376 L 730.0 398" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="452" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">여기가</text>
<text x="452" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">빈 자리</text>
<text x="28" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">저자가 적은 또 하나의 이득 — 잘 정의된 API 가 있으면 문서를 보고 설정 가능성을 발견할 수 있다</text>
<text x="28" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앞의 것은 틀린 설정을 막고 뒤의 것은 맞는 설정을 찾게 한다. 둘은 같은 스키마의 다른 얼굴이다</text>
<line x1="12" y1="540" x2="912" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="562" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

<title id="dt">포트 열넷의 두 축과 컨트롤 플레인 질의 경로</title><desc id="dd">사이드카 여덟 포트와 istiod 여섯 포트를 다른 서비스용과 사람·도구용으로 가르고, 도구가 에이전트 15004 를 거쳐 istiod 의 xDS 15012 에 닿는 질의 경로를 함께 보인다. 15020 은 두 구역에 나오는 한 포트라 합은 열넷이다.</desc>
<rect width="960" height="624" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-04 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">포트 열넷의 두 축과 컨트롤 플레인 질의 경로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로 축은 누구를 향해 열렸는가, 세로 축은 누가 여는가, 칩은 해당 절이며 15020 은 한 포트라 합은 열넷입니다</text>
<text x="294" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">다른 서비스 · 워크로드용</text>

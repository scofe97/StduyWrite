<title id="dt">Envoy를 부양하는 네 가지 역할</title><desc id="dd">Kubernetes API 에서 Istio 설정과 서비스 레지스트리를 읽은 istiod 가 xDS 로 설정을, CA 로 인증서를 Envoy 사이드카에 내려보낸다. Envoy 가 내보내는 메트릭과 스팬은 Prometheus 와 Jaeger/Zipkin 으로 간다.</desc>

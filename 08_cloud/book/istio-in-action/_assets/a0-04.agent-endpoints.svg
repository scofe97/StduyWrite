<title id="dt">한 포트가 여섯 엔드포인트를 겸한다</title><desc id="dd">준비 판정 · 메트릭 병합 · 프로세스 종료 · 앱 프로브 대행 · DNS 목록 · 프로파일링이 모두 15020 아래 있다. 색이 붙은 경로는 Istio 개발자용 프로파일링 자리다.</desc>

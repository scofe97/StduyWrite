<title id="dt">두 번째 리소스에서 갈리는 판단 둘</title><desc id="dd">컨트롤 플레인을 깐 뒤 게이트웨이를 따로 더할 때 프로파일과 이름을 각각 골라야 한다. 둘 중 하나만 어긋나도 앞의 설치가 망가진다. 색이 붙은 갈래가 저자가 적은 절차다.</desc>
<rect width="1000" height="752" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">두 번째 리소스에서 갈리는 판단 둘</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">둘 다 지켰을 때만 앞의 설치가 그대로 남습니다</text>
<rect x="100" y="112" width="336" height="60" rx="22" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="268.0" y="140.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">컨트롤 플레인은 이미 깔려 있다</text>
<text x="268.0" y="160.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">profile: demo · name: control-plane</text>
<polygon points="268,212 436,268 268,324 100,268" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="268" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">두 번째의 프로파일이</text>
<text x="268" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">empty 인가</text>
<rect x="572" y="236" width="328" height="64" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="736.0" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">앞의 리소스가 다시 깔린다</text>
<text x="736.0" y="282" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">롤 · CRD · 설정이 재설치된다</text>
<polygon points="268,396 436,452 268,508 100,452" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="268" y="448" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">두 번째의 이름이</text>
<text x="268" y="468" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">앞과 다른가</text>
<rect x="572" y="420" width="328" height="64" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>

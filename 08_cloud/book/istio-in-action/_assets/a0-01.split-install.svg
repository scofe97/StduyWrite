<text x="736.0" y="466" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">컨트롤 플레인 컴포넌트가 사라진다</text>
<rect x="100" y="596" width="336" height="60" rx="22" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>

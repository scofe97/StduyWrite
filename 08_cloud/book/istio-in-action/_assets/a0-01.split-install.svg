<text x="502.0" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">아니오</text>
<text x="502.0" y="438" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">아니오</text>
<text x="288" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<text x="288" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">예</text>
<text x="28" y="688" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">저자가 이 절차를 권하는 이유 — 컨트롤 플레인과 게이트웨이의 생명주기를 나누면 업그레이드가 서로에게 보이지 않는다</text>
<line x1="12" y1="710" x2="952" y2="710" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

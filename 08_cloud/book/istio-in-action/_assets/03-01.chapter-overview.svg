<title id="dt">Envoy가 요청을 넘기고 Istio가 그 Envoy에 설정을 댄다</title><desc id="dd">3장의 줄기 그림. 가운데 데이터 플레인의 Envoy 코어에서 요청이 downstream → Listener → Route → Cluster → upstream 으로 흐른다. 위쪽에서는 정적 설정 파일과 동적 xDS(ADS) 두 길이 설정을 댄다. Istio의 istiod는 Kubernetes API를 읽어 xDS로 설정·디스커버리·인증서를 대 주고, 텔레메트리 연동 설정으로 Envoy 메트릭과 스팬이 Prometheus·Jaeger로 흐르게 한다. 아래쪽에는 앱 잔여 책임(§3), Admin API(:15000, §6), 관측 백엔드(§7)가 이어진다.</desc>
<rect width="984" height="688" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 03-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Envoy가 요청을 넘기고 Istio가 그 Envoy에 설정을 댄다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표는 관계, 칩은 해당 절입니다. 가운데가 요청의 길, 위쪽이 설정과 부양의 길입니다.</text>

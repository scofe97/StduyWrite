<title id="dt">가상 IP로 장애를 가리고 가상 호스팅으로 서비스를 나눈다</title><desc id="dd">직접 인스턴스 IP 매핑은 인스턴스가 죽으면 DNS 갱신 전까지 오류가 이어진다. 도메인 여럿을 하나의 가상 IP와 리버스 프록시로 받고, 프로토콜별 호스트 단서로 각 서비스 풀에 분산한다.</desc>
<rect width="920" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 04-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">가상 IP로 장애를 가리고 가상 호스팅으로 서비스를 나눈다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위쪽은 직접 IP 매핑이 깨지는 장면(빨강), 아래쪽은 가상 IP(코랄)와 가상 호스팅(초록) 대응입니다.</text>
<rect x="24" y="96" width="848" height="116" rx="8" fill="rgba(240,97,109,0.04)" stroke="#F0616D" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="38" y="114" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#F0616D">AVOID · DIRECT INSTANCE IP</text>
<rect x="44" y="130" width="200" height="66" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="144" y="156" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">api.istioinaction.io</text>
<text x="144" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">DNS가 인스턴스 IP 응답</text>

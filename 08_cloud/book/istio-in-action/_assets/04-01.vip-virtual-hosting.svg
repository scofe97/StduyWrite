<text x="438" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">단일 서비스 인스턴스</text>
<text x="438" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">인스턴스 장애 → 즉시 오류</text>
<rect x="632" y="130" width="220" height="66" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="742" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">운영자 수동 DNS 변경</text>
<text x="742" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">전파 지연 · 가용성 저하</text>

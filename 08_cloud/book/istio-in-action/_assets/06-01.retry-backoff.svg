<title id="dt">원 요청과 두 번의 재시도, 그 사이의 백오프</title><desc id="dd">attempts: 2 는 최대 세 번 전달을 뜻한다. 원 요청이 503 을 받으면 25ms 를 기다려 첫 재시도를, 다시 50ms 를 기다려 두 번째 재시도를 보낸다. 마지막이 200 이면 호출자에게는 실패가 보이지 않는다.</desc>
<rect width="920" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 06-01 §5</text>

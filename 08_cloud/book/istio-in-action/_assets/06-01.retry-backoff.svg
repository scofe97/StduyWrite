<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">백오프는 (25ms × 시도 번호)이고 이 대기도 전체 타임아웃을 함께 갉아먹습니다</text>

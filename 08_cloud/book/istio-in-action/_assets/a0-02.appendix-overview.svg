<title id="dt">프록시는 설정을 어떻게 받는가 — 파드와 VM 의 두 길</title><desc id="dd">파드 길과 VM 길은 출발 환경이 다르지만 결국 같은 사이드카 부품 넷에 설정과 신원과 트래픽 경로를 넘긴다. 위쪽 파드 길은 수동·자동 명세 주입과 istio-init 또는 CNI 로 트래픽을 돌리고, 아래쪽 VM 길은 다섯 파일과 cluster.env 를 거쳐 장애 시 직접 수정 고리로 이어진다.</desc>
<rect width="960" height="704" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프록시는 설정을 어떻게 받는가 — 파드와 VM 의 두 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 관계, 칩은 해당 절 번호, 왼쪽에서 오른쪽으로 읽습니다.</text>
<text x="24" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">파드 경로 (쿠버네티스)</text>
<line x1="24" y1="116" x2="636" y2="116" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">VM 경로 (클러스터 밖)</text>
<line x1="24" y1="420" x2="636" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="696" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">공통 목표</text>
<line x1="696" y1="116" x2="936" y2="116" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="24" y="136" width="224" height="88" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<rect x="36.18" y="142" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="50" y="156" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§2</text>
<text x="146.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">수동 주입</text>
<text x="136.0" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">istioctl kube-inject</text>
<text x="136.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">Git · CD 통제</text>
<rect x="24" y="248" width="224" height="88" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<rect x="36.18" y="254" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="50" y="268" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§3</text>
<text x="146.0" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">자동 주입</text>
<text x="136.0" y="296" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">istio-injection=enabled</text>
<text x="136.0" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">웹훅 · 저장 전 주입</text>
<rect x="388" y="192" width="248" height="96" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<rect x="400.18" y="198" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="414" y="212" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§4</text>
<text x="522.0" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">트래픽 돌리기</text>
<text x="512.0" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">istio-init (NET_ADMIN)</text>

<title id="dt">같은 일을 어디서 하느냐가 권한 요구를 바꾼다</title><desc id="dd">왼쪽은 파드마다 init 컨테이너가 규칙을 세우는 배치이고 오른쪽은 노드마다 도는 파드가 대신하는 배치다. 색이 붙은 자리에서 특권 요구가 사라진다.</desc>
<rect width="1000" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 일을 어디서 하느냐가 권한 요구를 바꾼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">OpenShift 프로파일이 이 플러그인을 켜 두는 이유입니다</text>
<text x="248" y="122" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">ISTIO-INIT 배치</text>
<text x="752" y="122" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">CNI 플러그인 배치</text>
<rect x="28" y="148" width="440" height="240" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="141" width="38" height="14" fill="#0D1117"/>
<text x="46" y="151" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">NODE</text>
<rect x="532" y="148" width="440" height="240" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="544" y="141" width="38" height="14" fill="#0D1117"/>
<text x="550" y="151" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">NODE</text>
<rect x="48" y="180" width="196" height="64" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="146.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">파드 A</text>
<text x="146.0" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">init 이 붙는다</text>
<rect x="272" y="180" width="176" height="64" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="360.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">파드 B</text>
<text x="360.0" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">init 이 붙는다</text>
<rect x="48" y="288" width="400" height="64" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="248.0" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">팀마다 특권을 받아야 한다</text>
<text x="248.0" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">테넌트 기준과 부딪힌다</text>
<rect x="552" y="180" width="196" height="64" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="650.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">파드 A</text>
<text x="650.0" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">init 이 없다</text>
<rect x="776" y="180" width="176" height="64" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="864.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">파드 B</text>
<text x="864.0" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">init 이 없다</text>
<rect x="552" y="288" width="400" height="64" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="752.0" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">CNI 파드 하나가 노드에 뜬다</text>
<text x="752.0" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">모든 파드의 규칙을 대신 세운다</text>
<path d="M 146 244 L 146 284" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<path d="M 360 244 L 360 284" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<path d="M 650 352 L 650 248" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 864 352 L 864 248" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 468 268 L 528 268" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="498" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">옮긴다</text>
<text x="28" y="424" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">멀티테넌트 기준 — 한 테넌트가 다른 테넌트를 해칠 수 없어야 한다</text>
<text x="28" y="448" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">권한을 안 주면 워크로드를 못 돌리고 주면 남용될 수 있다. 어느 쪽으로 가도 기준이 깨진다</text>
<text x="28" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">일을 노드로 옮기면 istio-init 자체가 필요 없어지고 그 특권 요구도 함께 사라진다</text>
<line x1="12" y1="500" x2="952" y2="500" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="522" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="512" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">특권 요구가 사라지는 자리</text>
<rect x="326" y="512" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="348" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기준과 부딪히는 자리</text>
<rect x="513" y="512" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="535" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">특권이 필요 없는 파드</text>
</svg>
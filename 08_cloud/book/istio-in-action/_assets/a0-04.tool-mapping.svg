<title id="dt">운영 도구가 뒤에서 부르는 경로와 ControlZ</title><desc id="dd">평소에는 istioctl 이나 Kiali 가 디버그 엔드포인트와 ControlZ 를 대신 부른다. 첫 행이 동기화 확인 경로이고, 셋째 행은 9876 을 여는 ControlZ 경로다.</desc>
<rect width="960" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-04 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">운영 도구가 뒤에서 부르는 경로와 ControlZ</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">도구가 답을 못 줄 때만 엔드포인트를 직접 파고듭니다</text>
<text x="166.0" y="118" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">01 · 운영 도구</text>
<line x1="36" y1="128" x2="296" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="476.0" y="118" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">02 · 전달 경로</text>
<line x1="348" y1="128" x2="604" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="790.0" y="118" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">03 · 조회 대상</text>
<line x1="656" y1="128" x2="924" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="36" y="144" width="260" height="68" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="52" y="172" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">istioctl proxy-status</text>
<text x="52" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">동기화 상태 확인</text>
<rect x="348" y="144" width="256" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="364" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">xDS (15012) 또는 HTTP 8080</text>
<text x="364" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">끄기 전에 대체 경로 확인</text>
<rect x="656" y="144" width="268" height="68" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="672" y="172" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">/debug/syncz</text>
<text x="672" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">nonce 비교 · SYNCED 판정</text>
<path d="M 296 178.0 L 346 178.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 604 178.0 L 654 178.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="36" y="232" width="260" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="52" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Kiali · istioctl</text>
<text x="52" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">메시 시각화 · 분석</text>
<rect x="348" y="232" width="256" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="364" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">8080 HTTP / xDS</text>
<text x="364" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">직접 파고들기 전 1차 창구</text>
<rect x="656" y="232" width="268" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="672" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">그 밖의 /debug/*</text>
<text x="672" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">메시 상태 · 데이터 플레인 설정</text>
<path d="M 296 266.0 L 346 266.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)" stroke-dasharray="4 3"/>
<path d="M 604 266.0 L 654 266.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)" stroke-dasharray="4 3"/>
<rect x="36" y="320" width="260" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="52" y="348" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">istioctl dashboard</text>
<text x="52" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">controlz 하위 명령</text>
<rect x="348" y="320" width="256" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="364" y="348" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">port-forward 9876</text>
<text x="364" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">localhost 인트로스펙션</text>
<rect x="656" y="320" width="268" height="68" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="672" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">ControlZ 웹 UI</text>
<text x="672" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">로깅 스코프 변경 · 프로세스 상태</text>
<path d="M 296 354.0 L 346 354.0" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<path d="M 604 354.0 L 654 354.0" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="36" y="416" width="888" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="52" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">ControlZ 여덟 항목 (주 용도: 로깅 스코프 변경)</text>
<text x="52" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">로깅 스코프 · 메모리 사용량 · 환경변수 · 프로세스 정보 · 명령줄 인자 · 버전 정보 · 메트릭 · 시그널(SIGUSR1)</text>
<line x1="12" y1="508" x2="912" y2="508" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="530" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="520" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SYNCED 판정 핵심 경로</text>
<rect x="339" y="520" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>

<title id="dt">요청은 downstream에서 upstream으로 흐른다</title><desc id="dd">요청이 downstream 에서 Envoy 의 Listener·Route·Cluster 를 차례로 지나 upstream 서비스에 닿는 경로입니다. 색이 붙은 화살표가 Cluster 에서 upstream 으로 넘어가는 지점입니다.</desc>
<rect width="880" height="420" fill="#0D1117"/>

<title id="dt">규격이 정한 변수는 둘뿐이다</title><desc id="dd">spiffe://trust-domain/path 에서 발급자와 워크로드 이름이 갈린다. 그 안쪽 구조는 규격이 열어 두었고 구현자가 채운다. 색이 붙은 링이 Istio 가 채워 넣은 자리다.</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">규격이 정한 변수는 둘뿐이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">ns/ 와 sa/ 는 세 번째 조각이 아니라 path 의 내부 구조입니다</text>
<rect x="40" y="132" width="920" height="300" rx="8" fill="#F5F5F304" stroke="#F5F5F330" stroke-width="1.0"/>
<rect x="60" y="125" width="116" height="14" fill="#0D1117"/>
<text x="68" y="135" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">URI · RFC 3986</text>
<text x="68" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">spiffe:// 스킴 아래 조각 둘</text>
<rect x="84" y="192" width="300" height="200" rx="8" fill="#6A95D80E" stroke="#6A95D8" stroke-width="1.0"/>
<rect x="104" y="185" width="102" height="14" fill="#0D1117"/>
<text x="112" y="195" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">TRUST-DOMAIN</text>
<text x="112" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">신원의 발급자 — 개인 또는 조직</text>
<rect x="432" y="192" width="484" height="200" rx="8" fill="#F5F5F307" stroke="#8B98A9" stroke-width="1.0"/>
<rect x="452" y="185" width="47" height="14" fill="#0D1117"/>
<text x="460" y="195" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">PATH</text>
<text x="460" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 도메인 안에서 워크로드를 가리킨다</text>
<rect x="476" y="256" width="396" height="116" rx="8" fill="#F08A590E" stroke="#F08A59" stroke-width="1.4"/>
<rect x="496" y="249" width="205" height="14" fill="#0D1117"/>
<text x="504" y="259" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">ISTIO 의 선택 · 서비스 어카운트</text>
<text x="504" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">규격이 열어 둔 자리를 이렇게 채운다</text>
<text x="120" y="336" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">cluster.local</text>
<text x="512" y="320" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">ns/istioinaction</text>
<text x="512" y="344" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">sa/catalog</text>
<text x="40" y="476" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">spiffe://cluster.local/ns/istioinaction/sa/catalog</text>
<text x="40" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">path 가 워크로드를 어떻게 가리킬지는 규격이 정하지 않고 구현하는 쪽이 정한다</text>
<line x1="12" y1="520" x2="952" y2="520" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="542" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="532" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">구현자가 채우는 자리</text>
<rect x="287" y="532" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">발급자를 나타내는 조각</text>
</svg>
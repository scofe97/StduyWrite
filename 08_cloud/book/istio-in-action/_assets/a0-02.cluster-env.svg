<title id="dt">열세 줄 안에 메시·클러스터·망 식별자와 신원 재료가 있다</title><desc id="dd">cluster.env 하나가 워크로드의 메타데이터를 전부 진다. 그중 셋이 메시·클러스터·망을 가르는 식별자이고, 세 줄은 신원 URI 의 재료다.</desc>
<rect width="960" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-02 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">열세 줄 안에 메시·클러스터·망 식별자와 신원 재료가 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">점선은 변수와 그 변수가 가리키는 것을 잇습니다.</text>
<rect x="24" y="116" width="488" height="424" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="24" y1="164" x2="512" y2="164" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="136" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">FILE · VM 로컬</text>
<text x="40" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">cluster.env</text>
<text x="40" y="184" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">ISTIO_META_AUTO_REGISTER_GROUP</text>
<text x="336" y="184" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">'forum'</text>
<text x="40" y="212" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">ISTIO_META_CLUSTER_ID</text>
<text x="336" y="212" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">'west-cluster'</text>
<text x="40" y="240" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">ISTIO_META_DNS_CAPTURE</text>
<text x="336" y="240" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">'true'</text>
<text x="40" y="268" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">ISTIO_META_MESH_ID</text>
<text x="336" y="268" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">'usmesh'</text>
<text x="40" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">ISTIO_META_NETWORK</text>
<text x="336" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">'vm-network'</text>
<text x="40" y="324" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ISTIO_META_WORKLOAD_NAME</text>
<text x="336" y="324" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">'forum'</text>
<text x="40" y="352" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ISTIO_NAMESPACE</text>
<text x="336" y="352" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">'forum-services'</text>
<text x="40" y="380" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ISTIO_SERVICE</text>
<text x="336" y="380" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">'forum.forum-services'</text>
<text x="40" y="408" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ISTIO_SERVICE_CIDR</text>
<text x="336" y="408" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">'*'</text>
<text x="40" y="436" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ISTIO_SVC_IP</text>
<text x="336" y="436" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">'138.91.249.118'</text>
<text x="40" y="464" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">POD_NAMESPACE</text>
<text x="336" y="464" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">'forum-services'</text>
<text x="40" y="492" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">SERVICE_ACCOUNT</text>
<text x="336" y="492" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">'forum-sa'</text>
<text x="40" y="520" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">TRUST_DOMAIN</text>
<text x="336" y="520" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">'cluster.local'</text>
<text x="592" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">변수가 가리키는 것</text>
<rect x="592" y="148" width="344" height="60" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="608" y="172" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">clusterName</text>
<text x="608" y="195" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">메시 안에서 클러스터 구분</text>
<path d="M 512 208 L 568 208 L 568 178.0 L 590 178.0" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)" stroke-dasharray="4 3"/>
<rect x="592" y="216" width="344" height="60" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="608" y="240" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">DNS_CAPTURE = 'true'</text>
<text x="608" y="263" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">DNS 질의를 로컬 DNS 프록시로 돌림</text>
<path d="M 512 236 L 556 236 L 556 246.0 L 590 246.0" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)" stroke-dasharray="4 3"/>
<rect x="592" y="284" width="344" height="60" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="608" y="308" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">meshID</text>
<text x="608" y="331" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">하나의 메시로 묶는 값</text>
<path d="M 512 264 L 544 264 L 544 314.0 L 590 314.0" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)" stroke-dasharray="4 3"/>
<rect x="592" y="352" width="344" height="60" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="608" y="376" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">network</text>
<text x="608" y="399" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">같은 망이면 직접 통신</text>
<path d="M 512 292 L 532 292 L 532 382.0 L 590 382.0" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)" stroke-dasharray="4 3"/>
<rect x="592" y="452" width="344" height="72" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="608" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">SPIFFE ID 조합</text>
<text x="608" y="506" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">spiffe://cluster.local/ns/forum-services/sa/forum-sa</text>

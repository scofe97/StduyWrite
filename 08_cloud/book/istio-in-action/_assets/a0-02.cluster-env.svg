<rect x="620" y="272" width="352" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="636" y="298" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">meshID</text>
<text x="636" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">메시 하나로 묶는 값</text>
<path d="M 528 258 L 568 258 L 568 304 L 618 304" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)" stroke-dasharray="4 3"/>
<rect x="620" y="368" width="352" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="636" y="394" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">network</text>
<text x="636" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 망이면 IP 로 곧장 붙는다</text>
<path d="M 528 282 L 584 282 L 584 400 L 618 400" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)" stroke-dasharray="4 3"/>
<text x="620" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">12 장이 세운 식별자 셋</text>
<text x="620" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">DNS_CAPTURE 가 참인 것은 13 장 §5 의</text>
<text x="620" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가로채기를 켜는 스위치다</text>
<text x="28" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">저자가 주석으로 짚은 넷 — 자동 등록 그룹 · 인증 대상 클러스터 · DNS 가로채기 · 소속 망</text>

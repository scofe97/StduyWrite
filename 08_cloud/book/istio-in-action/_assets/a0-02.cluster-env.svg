<title id="dt">열세 줄 안에 12 장의 식별자 셋이 들어 있다</title><desc id="dd">파일 하나가 워크로드의 메타데이터를 전부 진다. 그중 셋이 12 장에서 메시와 클러스터와 망을 가르던 식별자이고, 색이 붙은 줄이 저자가 주석으로 짚은 넷이다.</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-02 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">열세 줄 안에 12 장의 식별자 셋이 들어 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">TRUST_DOMAIN 과 네임스페이스와 서비스 어카운트를 붙이면 9 장의 SPIFFE ID 가 됩니다</text>
<rect x="28" y="128" width="500" height="368" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="28" y1="172" x2="528" y2="172" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="44" y="148" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">FILE · VM 로컬</text>
<text x="44" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">cluster.env</text>
<text x="44" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">ISTIO_META_AUTO_REGISTER_GROUP</text>
<text x="344" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">'forum'</text>
<text x="44" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">ISTIO_META_CLUSTER_ID</text>
<text x="344" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">'west-cluster'</text>
<text x="44" y="238" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">ISTIO_META_DNS_CAPTURE</text>
<text x="344" y="238" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">'true'</text>
<text x="44" y="262" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ISTIO_META_MESH_ID</text>
<text x="344" y="262" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">'usmesh'</text>

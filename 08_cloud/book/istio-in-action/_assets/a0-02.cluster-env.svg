<text x="44" y="478" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">TRUST_DOMAIN</text>
<text x="344" y="478" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">'cluster.local'</text>
<rect x="620" y="176" width="352" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>

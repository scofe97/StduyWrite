<title id="dt">올리는 일과 흘리는 일을 떼어 놓는다</title><desc id="dd">기본값은 둘이 붙어 있다. 올리는 순간 Kubernetes 가 이미 부하를 나눠 보내므로 유료 고객이 새 코드의 첫 시험대가 된다. 색이 붙은 전이가 그 지름길이고, 아래 경로가 저자가 만드는 길이다.</desc>
<rect width="1000" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 02-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">올리는 일과 흘리는 일을 떼어 놓는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">올릴 때 트래픽 정책을 함께 정하지 않았다면 그것은 이미 릴리스입니다</text>
<circle cx="12" cy="252.0" r="6" fill="#F5F5F3"/>
<circle cx="988" cy="252.0" r="8" fill="none" stroke="#F5F5F3" stroke-width="1.2"/>
<circle cx="988" cy="252.0" r="5" fill="#F5F5F3"/>
<path d="M 24 252.0 L 34 252.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 640 252.0 L 682 252.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 964 252.0 L 974 252.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 316 252.0 L 358 252.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 176.0 216 L 176.0 140 L 824.0 140 L 824.0 214" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="500.0" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">정책 없이 올리면 여기로 바로 간다</text>
<rect x="36" y="216" width="280" height="72" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="176.0" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">배포됨</text>
<text x="176.0" y="268" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">kubectl apply · v2 기동</text>
<rect x="360" y="216" width="280" height="72" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500.0" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">릴리스되지 않음</text>
<text x="500.0" y="268" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">VirtualService 전량 v1</text>
<rect x="684" y="216" width="280" height="72" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="824.0" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">일부에게 릴리스</text>
<text x="824.0" y="268" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">x-dark-launch: v2</text>
<text x="338.0" y="190" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">DestinationRule 로 subset 을 가른다</text>
<text x="662.0" y="190" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">헤더 매칭 라우팅</text>
<text x="959.0" y="190" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">비율을 넓힌다</text>
<rect x="36" y="336" width="928" height="104" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="56" y="364" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">저자가 제시하는 단계적 릴리스</text>
<text x="56" y="390" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">내부 직원  -&gt;  비유료 고객  -&gt;  실버 등급 고객  -&gt;  전체</text>
<text x="56" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">등급을 판정하는 주체는 메시가 아니다 — 헤더나 쿠키로 만들어 주는 계층이 앞에 있어야 한다</text>
<text x="32" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">목적은 둘이다 — 프로덕션에서 깨질 확률을 낮추고, 유료 고객이 최전선에 서지 않게 한다</text>
<line x1="12" y1="548" x2="952" y2="548" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="570" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="560" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정책 없이 올렸을 때 가는 길</text>
</svg>
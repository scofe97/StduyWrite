<title id="dt">받아 주는 주체가 있느냐가 응답을 가른다</title><desc id="dd">가용 파드가 0 인 같은 순간인데 경로마다 다른 답이 온다. Ingress 프록시는 자기가 살아 있으니 '보낼 곳이 없다'를 상태 코드로 만들어 돌려줄 수 있다.</desc>
<rect width="900" height="636" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 15-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">받아 주는 주체가 있느냐가 응답을 가른다</text>
<text x="12" y="74" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Recreate 의 가용 0 구간에 요청이 들어왔을 때</text>
<rect x="24" y="96" width="852" height="200" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="36" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Ingress 프록시를 거칠 때</text>
<rect x="44" y="158" width="140" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="114" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="114" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">GET /</text>
<rect x="226" y="158" width="180" height="64" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="316" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">L7 프록시</text>
<text x="316" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">자기는 살아 있음</text>

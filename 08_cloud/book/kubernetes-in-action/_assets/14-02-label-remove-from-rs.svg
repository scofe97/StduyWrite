<title id="dt">label 을 바꾸면 세트에서 빠진다</title><desc id="dd">selector 에 맞는 파드 수를 컨트롤러가 늘 맞추므로, 문제 파드의 label 을 바꿔 selector 에서 빼면 컨트롤러가 대체 파드를 만든다. 문제 파드는 남아 있어 느긋하게 조사할 수 있다.</desc>
<rect width="1220" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 14-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">label 을 바꾸면 세트에서 빠진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">kubectl label po kiada-78j7m rel=debug --overwrite</text>
<rect x="24" y="100" width="570" height="352" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">바꾸기 전 — 3 벌이 모두 세트 안</text>
<text x="309.0" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">selector: app=kiada, rel=stable</text>
<rect x="119.0" y="190" width="380" height="48" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="141.0" y="218" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">kiada-78j7m   rel=stable   1/2 Running</text>
<rect x="119.0" y="252" width="380" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="141.0" y="280" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">kiada-98lmx   rel=stable   2/2 Running</text>
<rect x="119.0" y="314" width="380" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="141.0" y="342" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">kiada-wk99p   rel=stable   2/2 Running</text>
<text x="309.0" y="428" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">컨테이너 하나가 죽었지만 개수는 3 이라 컨트롤러는 가만히 있다</text>
<rect x="626" y="100" width="570" height="352" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="640" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">바꾼 뒤 — 빠진 자리를 컨트롤러가 채운다</text>
<text x="911.0" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">selector: app=kiada, rel=stable</text>
<rect x="721.0" y="190" width="380" height="48" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="743.0" y="218" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">kiada-78j7m   rel=debug    selector 밖</text>
<rect x="721.0" y="252" width="380" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="743.0" y="280" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">kiada-98lmx   rel=stable   2/2 Running</text>
<rect x="721.0" y="314" width="380" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="743.0" y="342" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">kiada-wk99p   rel=stable   2/2 Running</text>
<rect x="721.0" y="376" width="380" height="48" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="743.0" y="404" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">kiada-xtxcl   rel=stable   방금 만들어짐</text>
<text x="911.0" y="428" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">세트 안이 다시 3 벌 · 문제 파드는 살아서 남는다</text>
<text x="24" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">빼낸 파드는 더 이상 ReplicaSet 이 관리하지 않으므로, 조사가 끝나면 직접 지워야 한다. ownerReferences 에서도 ReplicaSet 참조가 제거된다.</text>
<text x="24" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">개수는 맞는데 서비스가 반쪽인 상태를 쿠버네티스가 스스로 알아채지 못하는 것이 왼쪽 장면이다 — 그 공백은 availableReplicas 를 지켜보는 관측이 메운다.</text>
<line x1="12" y1="556" x2="1172" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="568" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">정상 파드</text>
<rect x="209" y="568" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="231" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">문제 파드</text>
<rect x="318" y="568" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="340" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">대체 파드</text>
<rect x="427" y="568" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="449" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">빼낸 파드</text>
</svg>
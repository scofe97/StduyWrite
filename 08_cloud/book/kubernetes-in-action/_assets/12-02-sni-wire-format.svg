<title id="dt">길이가 앞에 붙어 있어 세면 된다</title><desc id="dd">server_name 한 줄이 껍질 셋에 싸여 실린다. 껍질마다 길이를 앞에 다는 형식이라, 암호를 풀지 않아도 어디부터 어디까지가 호스트명인지 셀 수 있다.</desc>
<rect width="1200" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 12-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">길이가 앞에 붙어 있어 세면 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Extension → ServerNameList → ServerName → host_name</text>
<rect x="24" y="100" width="560" height="296" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">중첩 — 바깥부터 안으로</text>
<rect x="56" y="148" width="496" height="216" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="72" y="170" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">Extension</text>
<text x="536" y="170" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">type=0x0000</text>
<rect x="88" y="180" width="432" height="152" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="104" y="202" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">ServerNameList</text>
<text x="504" y="202" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">이름을 여럿 담게</text>
<rect x="120" y="212" width="368" height="88" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="136" y="234" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">ServerName</text>
<text x="472" y="234" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">type=0</text>
<rect x="152" y="244" width="304" height="44" rx="5" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="304" y="272" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">api.example.com</text>
<text x="304" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실제로는 host_name 하나만 쓰인다</text>
<rect x="604" y="100" width="572" height="296" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="618" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">바이트로 펴면</text>
<rect x="632" y="216" width="78" height="56" rx="5" fill="#161B22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="671.0" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">00 00</text>
<text x="671.0" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">확장 타입</text>
<rect x="718" y="216" width="60" height="56" rx="5" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="748.0" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#6A95D8">00 14</text>
<text x="748.0" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">길이</text>
<rect x="786" y="216" width="78" height="56" rx="5" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="825.0" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#6A95D8">00 12</text>
<text x="825.0" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">리스트 길이</text>
<rect x="872" y="216" width="48" height="56" rx="5" fill="#161B22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="896.0" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">00</text>
<text x="896.0" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">이름 타입</text>
<rect x="928" y="216" width="66" height="56" rx="5" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="961.0" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#6A95D8">00 0F</text>
<text x="961.0" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">이름 길이</text>
<rect x="1002" y="216" width="148" height="56" rx="5" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="1076.0" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F08A59">api.example.com</text>
<text x="1076.0" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">값</text>
<text x="890" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">파란 칸이 길이다 — 이 셋만 읽으면</text>
<text x="890" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">호스트명이 어디서 끝나는지 안다</text>
<text x="890" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">프록시가 하는 일이 정확히 이것이다</text>
<text x="24" y="440" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">중첩이 셋인 이유는 이름을 여럿 담을 수 있게 설계했기 때문이다. ServerNameList 라는 이름이 그 흔적인데, 쓰지 않는 유연성 때문에 껍질이 한 겹 더 있는 셈이다.</text>
<text x="24" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">명세가 IP 주소를 금하고 DNS 호스트명만 허용하므로, IP 로 직접 접속하면 SNI 자리가 아예 빈다.</text>
<line x1="12" y1="498" x2="1152" y2="498" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="520" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="510" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">길이 칸</text>
<rect x="196" y="510" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="218" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">호스트명</text>
</svg>
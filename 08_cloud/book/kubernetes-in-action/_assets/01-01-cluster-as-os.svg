<title id="dt">같은 3층 구조가 한 대에서 여러 대로 늘어난 것이다</title><desc id="dd">OS 가 앱과 하드웨어 사이를 중개하듯 쿠버네티스는 앱과 여러 서버 사이를 중개한다. 가운데 층만 바뀌고 위아래 층의 역할은 그대로다.</desc>
<rect width="1000" height="612" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 01-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 3층 구조가 한 대에서 여러 대로 늘어난 것이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앱은 어느 서버가 자원을 내주는지 몰라도 된다 — 그것을 가운데 층이 감춘다</text>
<rect x="24" y="104" width="952" height="452" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">가운데 층이 바뀌었을 뿐 앱이 하는 일은 달라지지 않는다</text>
<text x="270" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">컴퓨터 한 대</text>
<rect x="80" y="224" width="380" height="84" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="96" y="250" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L1</text>
<text x="270" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">애플리케이션</text>
<text x="270" y="282" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">돌려야 할 것</text>
<rect x="80" y="320" width="380" height="84" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.1"/>
<text x="96" y="346" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L2</text>
<text x="270" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">운영체제</text>
<text x="270" y="378" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">앱과 하드웨어를 중개한다 · 프로세스를 스케줄링한다</text>
<rect x="80" y="416" width="380" height="84" rx="6" fill="#8B98A912" stroke="#8B98A9" stroke-width="1.1"/>
<text x="96" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L3</text>
<text x="270" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">CPU · RAM · Disk</text>
<text x="270" y="474" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">한 대의 물리 자원</text>
<text x="730" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">컴퓨터 클러스터 (여러 대)</text>
<rect x="540" y="224" width="380" height="84" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="556" y="250" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L1</text>
<text x="730" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">애플리케이션</text>
<text x="730" y="282" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">돌려야 할 것 — 그대로다</text>
<rect x="540" y="320" width="380" height="84" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.1"/>
<text x="556" y="346" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L2</text>
<text x="730" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">Kubernetes</text>
<text x="730" y="378" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">앱과 클러스터를 중개한다 · 노드에 스케줄링한다</text>
<rect x="540" y="416" width="380" height="84" rx="6" fill="#8B98A912" stroke="#8B98A9" stroke-width="1.1"/>
<text x="556" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L3</text>
<text x="730" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">Server · Server · Server</text>
<text x="730" y="474" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">여러 대의 물리 자원</text>
<path d="M 466 362 L 530 362" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<rect x="465.5" y="353" width="69.0" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="500" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">같은 자리</text>
<text x="36" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">층 수도 역할도 같고 다루는 자원의 개수만 다르다 — 그래서 클러스터의 운영체제라 부른다.</text>
<line x1="12" y1="572" x2="952" y2="572" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="594" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="584" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="594" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">돌려야 할 앱</text>
<rect x="235" y="584" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="257" y="594" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">중개하는 층</text>
</svg>
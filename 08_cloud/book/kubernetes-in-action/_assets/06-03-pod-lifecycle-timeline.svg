<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Pod 생애주기 전체 — 유예 시간은 PreStop 보다 먼저 시작</text>

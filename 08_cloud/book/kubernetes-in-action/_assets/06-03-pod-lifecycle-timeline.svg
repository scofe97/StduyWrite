<title id="dt">Pod 생애주기 전체 — 유예 시간은 PreStop 보다 먼저 시작</title><desc id="dd">스케줄링과 이미지 준비, init 컨테이너를 거쳐 일반 컨테이너와 PostStart 가 시작된다. 삭제 시 deletionGracePeriodSeconds(기본 30s)가 PreStop 보다 먼저 시작되며 SIGTERM 과 정리 시간을 모두 포함한다.</desc>

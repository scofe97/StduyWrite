<title id="dt">같은 결과에 이르는 두 길</title><desc id="dd">파일을 컨테이너에 놓는 일은 같다. init 컨테이너는 그것을 복사로 하고, image 볼륨은 이미지 자체를 볼륨으로 마운트해 복사 단계를 없앤다.</desc>
<rect width="1240" height="664" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 09-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 결과에 이르는 두 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">image 볼륨은 v1.31 alpha · v1.33 beta</text>
<rect x="24" y="100" width="1172" height="216" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">init 컨테이너로 복사</text>
<rect x="90" y="176" width="200" height="84" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="190" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">이미지를 만든다</text>
<text x="190" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">파일을 담아</text>
<rect x="332" y="176" width="200" height="84" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="432" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">init 이 뜬다</text>
<text x="432" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">볼륨을 마운트</text>
<rect x="574" y="176" width="200" height="84" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="674" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">cp 로 복사</text>
<text x="674" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">볼륨에 넣는다</text>
<rect x="816" y="176" width="200" height="84" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="916" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">init 종료</text>
<text x="916" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">본 컨테이너 시작</text>

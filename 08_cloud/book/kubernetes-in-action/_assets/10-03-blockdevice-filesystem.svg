<title id="dt">번호 붙은 칸의 벽과 그 위에 얹힌 대장</title><desc id="dd">블록 디바이스는 같은 크기의 칸이 번호 순으로 늘어선 벽이다. 파일시스템은 그 위에 얹힌 대장으로, 어느 파일이 몇 번 칸에 있는지를 적어 둔다.</desc>
<rect width="1200" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 10-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">번호 붙은 칸의 벽과 그 위에 얹힌 대장</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">리사이즈가 두 층으로 나뉘는 이유가 여기 있다</text>
<rect x="24" y="104" width="1152" height="474" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">벽에 칸을 더 붙여도 대장이 모르면 그 칸을 쓰지 못한다</text>
<rect x="200" y="182" width="936" height="128" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="224" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">파일시스템 — 관리 대장</text>
<text x="224" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이력서.pdf 는 5 · 6 · 7 번 칸에 나눠 들어 있다</text>
<text x="224" y="276" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">빈 칸은 9 번부터다</text>
<text x="1112" y="262" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">이름으로 다룬다</text>
<rect x="200" y="372" width="936" height="128" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="224" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">블록 디바이스 — 번호 붙은 칸의 벽</text>
<rect x="224" y="424" width="74" height="54" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="261" y="457" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">0</text>
<rect x="308" y="424" width="74" height="54" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="345" y="457" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">1</text>
<rect x="392" y="424" width="74" height="54" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="429" y="457" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">2</text>
<rect x="476" y="424" width="74" height="54" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="513" y="457" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">3</text>
<rect x="560" y="424" width="74" height="54" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="597" y="457" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">4</text>
<rect x="644" y="424" width="74" height="54" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.2"/>
<text x="681" y="457" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">5</text>
<rect x="728" y="424" width="74" height="54" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.2"/>
<text x="765" y="457" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">6</text>
<rect x="812" y="424" width="74" height="54" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.2"/>
<text x="849" y="457" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">7</text>
<rect x="896" y="424" width="74" height="54" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="933" y="457" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">8</text>
<rect x="980" y="424" width="74" height="54" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="1017" y="457" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">9</text>
<text x="1112" y="404" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">칸이 몇 개인지만 안다</text>
<path d="M 500 316 L 500 362" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="516" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">5 · 6 · 7 번 칸을 가리킨다</text>
<text x="176" y="256" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">이름</text>
<text x="176" y="446" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">번호</text>
<path d="M 136 412 L 136 276" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="122" y="351" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">추상 ↑</text>
<text x="24" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 벽에 칸을 더 붙여도 대장이 모르면 그 칸을 쓰지 못한다. 리사이즈가 블록 디바이스 확장과 파일시스템 확장 두 단계로 나뉘는 이유다.</text>
<line x1="12" y1="600" x2="1152" y2="600" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="622" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="612" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">대장이 아는 것 — 이름과 그 자리</text>
<rect x="391" y="612" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="413" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">벽이 아는 것 — 칸 번호</text>
</svg>
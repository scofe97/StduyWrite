<title id="dt">여덟 종류 중 여섯이 격리되고 둘은 호스트와 공유된다</title><desc id="dd">컨테이너는 무언가에 감싸인 것이 아니라, 이 네임스페이스들이 동시에 배정된 프로세스다. 격리 여부가 종류마다 다르므로 경계가 딱 떨어지지 않는다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 02-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">여덟 종류 중 여섯이 격리되고 둘은 호스트와 공유된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Docker 기본값 기준이다 — user 를 안 나누므로 안의 root 가 호스트 root 다</text>
<rect x="24" y="104" width="952" height="480" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">격리 여부는 종류마다 다르다 — 그래서 '컨테이너 경계' 가 한 줄로 그어지지 않는다</text>
<rect x="32" y="216" width="222" height="148" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="143" y="250" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#6A95D8">mnt</text>
<rect x="126.0" y="267" width="34.0" height="18" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="143" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">격리</text>
<text x="143" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">파일시스템·마운트 지점</text>
<text x="143" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">자기만의 루트(/) 를 본다</text>
<rect x="270" y="216" width="222" height="148" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="381" y="250" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#6A95D8">pid</text>
<rect x="364.0" y="267" width="34.0" height="18" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="381" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">격리</text>
<text x="381" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로세스 번호</text>
<text x="381" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">안에서 1번부터 새로 센다</text>
<rect x="508" y="216" width="222" height="148" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="619" y="250" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#6A95D8">net</text>
<rect x="602.0" y="267" width="34.0" height="18" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="619" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">격리</text>
<text x="619" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">네트워크 장치·포트</text>
<text x="619" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">자기 eth0·IP·포트를 가진다</text>
<rect x="746" y="216" width="222" height="148" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="857" y="250" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#6A95D8">ipc</text>
<rect x="840.0" y="267" width="34.0" height="18" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="857" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">격리</text>
<text x="857" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로세스 간 통신</text>
<text x="857" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">공유 메모리·큐가 갈린다</text>
<rect x="32" y="380" width="222" height="148" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="143" y="414" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#6A95D8">uts</text>
<rect x="126.0" y="431" width="34.0" height="18" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="143" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">격리</text>
<text x="143" y="476" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트명·도메인명</text>
<text x="143" y="502" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">호스트명이 컨테이너 ID 다</text>
<rect x="270" y="380" width="222" height="148" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="381" y="414" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#6A95D8">cgroup</text>
<rect x="364.0" y="431" width="34.0" height="18" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="381" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">격리</text>
<text x="381" y="476" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">cgroup 루트 디렉터리</text>
<text x="381" y="502" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">자기 cgroup 트리만 본다</text>
<rect x="508" y="380" width="222" height="148" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="619" y="414" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#E3B341">user</text>
<rect x="587.0" y="431" width="64.0" height="18" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="619" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#E3B341">기본 공유</text>
<text x="619" y="476" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사용자·그룹 ID</text>
<text x="619" y="502" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">안 root = 호스트 root</text>
<rect x="746" y="380" width="222" height="148" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="857" y="414" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#E3B341">time</text>
<rect x="825.0" y="431" width="64.0" height="18" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="857" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#E3B341">기본 공유</text>
<text x="857" y="476" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시스템 클록 오프셋</text>
<text x="857" y="502" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">시계를 호스트와 함께 쓴다</text>
<text x="36" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">직접 확인하려면 readlink /proc/1/ns/uts 를 두 컨테이너에서 비교한다 — 번호가 다르면 격리, 같으면 공유다.</text>
<line x1="12" y1="600" x2="952" y2="600" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="622" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="612" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">Docker 기본이 격리하는 것</text>
<rect x="365" y="612" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="387" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">호스트와 공유하는 것</text>

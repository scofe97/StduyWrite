<title id="dt">사용자는 오브젝트만 쓰고, 컨트롤 플레인이 실제를 맞춘다</title><desc id="dd">사용자는 서버를 직접 만지지 않고 spec 을 쓴다. 컨트롤러가 감시 루프로 실제 상태를 그 선언에 맞추고, kubelet 이 배정된 Pod 를 컨테이너로 실행한다.</desc>
<rect width="1000" height="826" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 04-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">사용자는 오브젝트만 쓰고, 컨트롤 플레인이 실제를 맞춘다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">명령이 아니라 원하는 상태의 선언이다 — 그래서 같은 매니페스트를 몇 번 넣어도 같다</text>
<rect x="24" y="104" width="952" height="666" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">API Server 가 유일한 관문이고 etcd 가 유일한 진실의 원천이다</text>
<rect x="80" y="182" width="240" height="76" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="200" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">사용자 · kubectl</text>
<text x="200" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">서버가 아니라 오브젝트를 만진다</text>
<rect x="60" y="292" width="880" height="210" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="76" y="283" width="252" height="18" fill="#0D1117"/>
<text x="86" y="296" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">Control Plane — 원하는 상태에 실제를 맞춘다</text>
<rect x="110" y="346" width="300" height="108" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="260" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">API Server</text>
<text x="260" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">모든 요청의 유일한 관문 · 인증·검증</text>
<rect x="500" y="312" width="280" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="640" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">etcd</text>
<text x="640" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">모든 오브젝트가 저장되는 곳</text>
<rect x="500" y="414" width="280" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="640" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">Scheduler · Controller Manager</text>
<text x="640" y="466" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">spec 을 읽고 status 를 쓴다</text>
<rect x="60" y="542" width="880" height="180" rx="8" fill="#3FB98C06" stroke="#3FB98C" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="76" y="533" width="235" height="18" fill="#0D1117"/>
<text x="86" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">Worker Nodes — 실제로 컨테이너가 도는 곳</text>
<rect x="140" y="592" width="320" height="100" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="300" y="634" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">kubelet · worker 1</text>
<text x="300" y="656" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">배정된 Pod 를 컨테이너로 실행한다</text>
<rect x="540" y="592" width="320" height="100" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="700" y="634" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">kubelet · worker 2</text>
<text x="700" y="656" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">스케일하면 여기에도 분산된다</text>
<path d="M 200 264 L 200 336" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<rect x="143.5" y="311" width="113.0" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="200" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">spec 을 쓴다</text>
<path d="M 416 350 L 490 350" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="435.0" y="341" width="36.0" height="18" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="453" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저장</text>
<path d="M 416 452 L 490 452" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="424.0" y="443" width="58.0" height="18" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="453" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">감시한다</text>
<path d="M 260 508 L 260 582" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)"/>
<rect x="316.0" y="561" width="168.0" height="18" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="400" y="574" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">배정된 Pod 를 감지한다</text>
<path d="M 466 642 L 530 642" fill="none" stroke="#8B98A9" stroke-width="1.4" stroke-dasharray="6 5"/>
<rect x="471.0" y="633" width="58.0" height="18" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="500" y="646" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">분산된다</text>
<text x="36" y="748" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">컨트롤러는 spec(원함)을 읽고 실제와의 간극을 확인해 작업한 뒤 status(실제)를 쓴다 — 그 루프가 계속 돈다.</text>
<line x1="12" y1="786" x2="952" y2="786" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="808" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="798" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="808" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">선언하는 쪽</text>
<rect x="222" y="798" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="244" y="808" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">컨트롤 플레인</text>
<rect x="357" y="798" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="379" y="808" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">워커 노드</text>
</svg>
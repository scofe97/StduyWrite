<title id="dt">condition 넷은 성격이 갈린다 — 한 번 서면 유지 vs 여러 번 바뀜</title><desc id="dd">PodScheduled 와 Initialized 는 한 번 True 가 되면 Pod 의 남은 생애 동안 유지된다. ContainersReady 와 Ready 는 생애 동안 여러 번 바뀐다.</desc>
<rect width="1000" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 06-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">condition 넷은 성격이 갈린다 — 한 번 서면 유지 vs 여러 번 바뀜</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">phase 만 보면 '돌고 있네'지만, conditions 를 봐야 '트래픽 받을 준비는 안 됐네'를 안다</text>
<rect x="24" y="104" width="952" height="396" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">성격이 갈리므로 진단할 때 보는 자리도 다르다</text>
<text x="240" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">① 생성</text>
<text x="348" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">② 스케줄링</text>
<text x="456" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">③ 샌드박스 준비</text>
<text x="564" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">④ init 완료</text>
<text x="672" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">⑤ 컨테이너 준비</text>
<text x="780" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">⑥ gate 통과</text>
<text x="888" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">⑦ 하나가 실패</text>
<line x1="40" y1="184" x2="952" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="40" y="196" width="912" height="132" rx="8" fill="rgba(191,192,192,0.22)" fill-opacity="0.03" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="56" y="187" width="196" height="18" fill="#0D1117"/>
<text x="66" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">한 번 True 가 되면 그대로 유지된다</text>
<rect x="40" y="348" width="912" height="88" rx="8" fill="rgba(191,192,192,0.22)" fill-opacity="0.03" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="56" y="339" width="172" height="18" fill="#0D1117"/>
<text x="66" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">생애 동안 여러 번 바뀔 수 있다</text>
<text x="224" y="222" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">PodScheduled</text>

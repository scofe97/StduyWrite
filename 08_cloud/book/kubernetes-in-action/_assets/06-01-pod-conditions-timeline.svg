<text x="36" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">PodReadyToStartContainers 는 1.29 에서 더해진 다섯 번째다 — 책 표에는 없고 실측(v1.35)에만 보인다.</text>
<text x="36" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">쿠버네티스는 새 관측 축이 필요할 때 기존 것을 바꾸지 않고 목록에 더한다.</text>

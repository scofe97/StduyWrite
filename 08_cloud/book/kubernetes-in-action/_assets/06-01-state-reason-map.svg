<title id="dt">컨테이너 state 는 셋뿐 — 나머지 이름은 전부 reason 이다</title><desc id="dd">state 는 Waiting·Running·Terminated 셋으로 고정돼 있다. CrashLoopBackOff·OOMKilled 처럼 STATUS 칸에서 보는 이름들은 state 가 아니라 그 state 의 reason 필드 값이다.</desc>
<rect width="1000" height="712" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 06-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">컨테이너 state 는 셋뿐 — 나머지 이름은 전부 reason 이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Unknown 은 Pod phase 이지 컨테이너 state 가 아니다 — 둘을 혼동하기 쉽다</text>
<rect x="24" y="104" width="952" height="552" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">state 는 고정 목록이고 reason 은 kubelet 이 정의한다 — 외울 것은 층 구조뿐이다</text>
<circle cx="72" cy="250" r="6" fill="#F5F5F3"/>
<path d="M 82 250 L 110 250" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="96" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시작</text>
<rect x="120" y="208" width="200" height="84" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="220" y="238" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#E3B341">Waiting</text>
<text x="220" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시작을 기다린다</text>
<rect x="400" y="208" width="200" height="84" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="500" y="238" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">Running</text>
<text x="500" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로세스가 돌고 있다</text>
<rect x="680" y="208" width="200" height="84" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="780" y="238" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">Terminated</text>
<text x="780" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로세스가 끝났다</text>
<path d="M 326 250 L 390 250" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="360" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로세스 실행</text>
<path d="M 606 250 L 670 250" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="640" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로세스 종료</text>
<path d="M 886 250 L 920 250" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<circle cx="940" cy="250" r="8" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<circle cx="940" cy="250" r="5" fill="#8B98A9"/>
<path d="M 780 202 L 780 180 L 220 180 L 220 198" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)" stroke-dasharray="6 5"/>
<text x="500" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">↺ 재시작 (restartPolicy 허용 시) — 이때도 Pod phase 는 Running 그대로</text>
<rect x="40" y="336" width="912" height="238" rx="8" fill="rgba(191,192,192,0.22)" fill-opacity="0.03" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">reason — state 가 아니다</text>
<path d="M 220 298 L 220 354" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="112" y="370" width="216" height="40" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="124" y="387" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">ContainerCreating</text>
<text x="124" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">이미지 pull·볼륨 마운트</text>
<rect x="112" y="418" width="216" height="40" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="124" y="435" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">PodInitializing</text>
<text x="124" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">주 컨테이너 미시작 → 05-03</text>
<rect x="112" y="466" width="216" height="40" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="124" y="483" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">CrashLoopBackOff</text>
<text x="124" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">재시작 반복 → 06-02</text>
<rect x="112" y="514" width="216" height="40" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="124" y="531" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">ImagePullBackOff</text>
<text x="124" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">이미지를 못 받음</text>
<path d="M 500 298 L 500 354" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="392" y="370" width="216" height="40" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="404" y="387" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">reason 없음</text>
<text x="404" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">돌고 있으면 그냥 Running</text>
<path d="M 780 298 L 780 354" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="672" y="370" width="216" height="40" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="684" y="387" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">Completed</text>
<text x="684" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">exitCode 0 — 성공</text>
<rect x="672" y="418" width="216" height="40" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="684" y="435" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">Error</text>
<text x="684" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">exitCode ≠ 0 — 실패</text>
<rect x="672" y="466" width="216" height="40" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="684" y="483" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">OOMKilled</text>
<text x="684" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">메모리 초과 · 137</text>
<text x="36" y="604" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">kubectl get 의 STATUS 칸에 뜨는 이름이 대부분 이 reason 이다 — state 이름이 아니다.</text>
<text x="36" y="624" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Terminated 는 이름일 뿐 실패가 아니다 — 성공·실패는 exitCode 와 reason 이 정하고, reason 목록은 대표값이다.</text>
<line x1="12" y1="672" x2="952" y2="672" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="694" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="684" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="694" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">시작 대기</text>
<rect x="209" y="684" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="231" y="694" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">정상</text>
<rect x="279" y="684" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="301" y="694" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">실패</text>
<rect x="349" y="684" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="371" y="694" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">이름이 뜻을 정하지 않는 자리</text>
</svg>
<title id="dt">누가 먼저 만드는가</title><desc id="dd">동적 프로비저닝은 요구가 오면 그때 만든다. 정적 프로비저닝은 운영자가 PV 를 미리 만들어 두고, 나중에 온 PVC 가 그중 맞는 것을 찾아 바인딩된다.</desc>
<rect width="1240" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 10-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">누가 먼저 만드는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이미 있는 스토리지를 클러스터에 들일 때 쓴다</text>
<rect x="24" y="100" width="1172" height="200" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">동적 — 요구가 먼저</text>
<text x="210" y="162" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">개발자</text>
<rect x="90" y="180" width="240" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="210" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">PVC</text>
<text x="210" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">요구를 적는다</text>
<text x="494" y="162" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">미리 정해 둠</text>
<rect x="374" y="180" width="240" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="494" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">StorageClass</text>
<text x="494" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">방법을 고른다</text>
<text x="778" y="162" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">프로비저너</text>
<rect x="658" y="180" width="240" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="778" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">PV</text>
<text x="778" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그때 만들어진다</text>
<path d="M 335 218 L 365 218" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 619 218 L 649 218" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="24" y="324" width="1172" height="200" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="24" y="324" width="4" height="200" rx="2" fill="#F08A59"/>
<text x="38" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">정적 — PV 가 먼저</text>
<text x="210" y="386" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">운영자</text>
<rect x="90" y="404" width="240" height="76" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="210" y="440" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">PV</text>
<text x="210" y="458" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">미리 만들어 둔다</text>
<text x="494" y="386" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">개발자</text>
<rect x="374" y="404" width="240" height="76" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="494" y="440" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">PVC</text>
<text x="494" y="458" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">나중에 요구한다</text>
<text x="778" y="386" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">컨트롤 플레인</text>
<rect x="658" y="404" width="240" height="76" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="778" y="440" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">바인딩</text>
<text x="778" y="458" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">맞는 것을 찾아 묶는다</text>
<path d="M 335 442 L 365 442" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 619 442 L 649 442" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="24" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정적에서는 PVC 의 요구(용량·access mode·클래스)에 맞는 PV 가 없으면 Pending 에 머문다. 동적처럼 없으면 만들어 주는 주체가 없기 때문이다.</text>
<text x="24" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">storageClassName 을 빈 문자열로 두면 동적 프로비저닝을 끄고 미리 만든 PV 만 후보로 삼는다.</text>
<line x1="12" y1="612" x2="1192" y2="612" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="634" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="624" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="634" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">요구가 먼저</text>
<rect x="222" y="624" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="244" y="634" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">실체가 먼저</text>
</svg>
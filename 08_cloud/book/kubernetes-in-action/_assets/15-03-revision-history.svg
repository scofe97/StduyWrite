<text x="24" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">몇 번 업데이트한 클러스터에서 get rs 를 치면 replicas 0 짜리가 줄줄이 보인다. 그게 롤백 이력이다.</text>
<text x="24" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">kubectl rollout undo 는 그 숫자를 반대로 움직인다 — 옛 ReplicaSet 을 다시 올리고 지금 것을 0 으로 내린다.</text>
<text x="24" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">무한정 쌓이지는 않는다. revisionHistoryLimit 이 보관 개수를 정하고 기본값은 10 이다.</text>

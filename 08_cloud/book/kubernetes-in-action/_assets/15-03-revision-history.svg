<title id="dt">revision 은 ReplicaSet 에 저장된다</title><desc id="dd">각 ReplicaSet 이 한 revision 이다. 업데이트가 끝나도 옛 ReplicaSet 을 지우지 않는 이유가 여기 있다 — 롤백이란 그 숫자를 다시 올리는 일이다.</desc>

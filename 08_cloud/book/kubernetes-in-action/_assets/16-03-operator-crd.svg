<title id="dt">사용자가 만지는 것은 하나뿐이다</title><desc id="dd">Operator 는 CRD 로 API 에 오브젝트 타입을 더하고, 그 타입의 인스턴스가 만들어지면 StatefulSet·Service·Secret 을 알아서 만들고 관리한다.</desc>
<rect width="1200" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 16-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">사용자가 만지는 것은 하나뿐이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">MongoDB Operator · 앱을 만든 조직이 관리법을 안다</text>
<rect x="40" y="190" width="260" height="84" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="170" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">CustomResourceDefinition</text>
<text x="170" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">API 에 타입을 더한다</text>
<rect x="360" y="190" width="280" height="84" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">MongoDB 오브젝트</text>
<text x="500" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사용자가 만드는 것</text>
<path d="M 302 232 L 354 232" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="328" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">타입이 생겨야</text>
<rect x="720" y="190" width="220" height="84" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="830" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">Operator</text>
<text x="830" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">커스텀 컨트롤러</text>
<path d="M 642 232 L 716 232" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="679" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">감시한다</text>
<rect x="60" y="340" width="1080" height="152" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="600" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Operator 가 만들고 관리하는 것 — 사용자는 건드리지 않는다</text>
<path d="M 830 274 L 830 380" fill="none" stroke="#3FB98C" stroke-width="1.3"/>
<path d="M 320 380 L 880 380" fill="none" stroke="#3FB98C" stroke-width="1.3"/>
<rect x="200" y="400" width="240" height="68" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="320" y="432" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">StatefulSet</text>
<text x="320" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">파드와 PVC</text>
<path d="M 320 380 L 320 396" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="480" y="400" width="240" height="68" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="600" y="432" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">Service</text>
<text x="600" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">headless · 신원</text>
<path d="M 600 380 L 600 396" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="760" y="400" width="240" height="68" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="880" y="432" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">Secret</text>
<text x="880" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자격 증명</text>
<path d="M 880 380 L 880 396" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<path d="M 40 178 L 40 168 L 640 168 L 640 178" fill="none" stroke="#F08A59" stroke-width="1.2"/>
<text x="340" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">사용자 손이 닿는 곳</text>
<text x="24" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">StatefulSet 은 신원과 볼륨을 되돌려 주지만, 리플리카 셋 초기화나 노드 장애 시 강제 삭제 판단은 여전히 사람 몫이었다. Operator 는 그 도메인 지식을 코드로 옮긴다.</text>
<text x="24" y="568" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">쿠버네티스에 기본 포함되지 않아 별도 설치해야 하고, 보통 앱을 만든 조직이 개발한다.</text>
<line x1="12" y1="592" x2="1152" y2="592" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="614" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="604" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="614" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">선언과 산출물</text>
<rect x="235" y="604" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="257" y="614" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">사용자가 만드는 것</text>
<rect x="409" y="604" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="431" y="614" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">자동화하는 주체</text>
</svg>
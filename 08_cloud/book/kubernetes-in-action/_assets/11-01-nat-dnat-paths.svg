<title id="dt">NAT 가 끼는 곳은 목적지가 정한다</title><desc id="dd">같은 파드에서 출발해도 목적지를 무엇으로 적었느냐에 따라 커널이 하는 일이 갈린다. 파드 IP 는 그대로 지나가고, ClusterIP 는 실제 파드 주소로 바꿔야 비로소 닿는다.</desc>
<rect width="1060" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 11-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">NAT 가 끼는 곳은 목적지가 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왜 curl 은 되는데 ping 은 안 되는가</text>

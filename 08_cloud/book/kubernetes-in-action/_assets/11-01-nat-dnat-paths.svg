<text x="24" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ping 이 안 되는 이유도 여기 있다. DNAT 규칙은 'ClusterIP 와 포트'의 짝에만 걸리는데 ICMP 에는 포트가 없어 어느 규칙에도 맞지 않고, 패킷이 그대로 버려진다.</text>

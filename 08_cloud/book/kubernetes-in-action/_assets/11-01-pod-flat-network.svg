<title id="dt">파드끼리는 NAT 없이 통신한다</title><desc id="dd">노드가 여러 라우터를 사이에 두고 떨어져 있어도, 파드가 보내는 패킷의 출발지·목적지 주소는 홉을 지나며 바뀌지 않는다. 받는 파드는 보낸 파드의 진짜 IP를 출발지로 본다.</desc>
<rect width="1000" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 11-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">파드끼리는 NAT 없이 통신한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">물리 토폴로지는 파드에게 보이지 않는다</text>
<rect x="24" y="100" width="952" height="188" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">파드가 보는 것 — 하나의 flat 네트워크</text>

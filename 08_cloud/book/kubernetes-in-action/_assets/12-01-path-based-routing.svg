<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 620" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">한 호스트 아래에서 경로가 가른다</title><desc id="dd">api.example.com 으로 온 요청을 프록시가 열어 경로를 읽고 규칙에 맞춘다. 무엇에 맞느냐는 path 뿐 아니라 pathType 이 함께 정한다.</desc>
<rect width="1220" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 12-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 호스트 아래에서 경로가 가른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">host: api.example.com</text>
<rect x="40" y="152" width="260" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="170" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">GET /quote</text>
<text x="170" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정확히 그 경로</text>
<rect x="40" y="262" width="260" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="170" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">GET /questions/5</text>
<text x="170" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 아래 경로</text>
<rect x="40" y="372" width="260" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="170" y="408" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">GET /quotes</text>
<text x="170" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">복수형 오타</text>
<path d="M 344 190 L 344 410" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 344 300 L 386 300" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="390" y="254" width="220" height="92" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="500" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">L7 프록시</text>
<text x="500" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">경로를 읽어 맞춘다</text>
<path d="M 302 190 L 344 190" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 302 300 L 344 300" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 302 410 L 344 410" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 612 300 L 668 300" fill="none" stroke="#8B98A9" stroke-width="1.2"/>
<path d="M 668 190 L 668 410" fill="none" stroke="#8B98A9" stroke-width="1.2"/>
<rect x="760" y="158" width="240" height="64" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="880" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">path: /quote</text>
<text x="880" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">pathType: Exact</text>
<path d="M 668 190 L 754 190" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="1040" y="158" width="160" height="64" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="1120" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">quote</text>
<text x="1120" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ClusterIP</text>
<path d="M 1002 190 L 1034 190" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="760" y="268" width="240" height="64" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="880" y="292" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">path: /questions</text>
<text x="880" y="314" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">pathType: Prefix</text>
<path d="M 668 300 L 754 300" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="1040" y="268" width="160" height="64" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="1120" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">quiz</text>
<text x="1120" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ClusterIP</text>
<path d="M 1002 300 L 1034 300" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<path d="M 668 410 L 790 410" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)" stroke-dasharray="5 5"/>
<rect x="810.0" y="397" width="300" height="26" rx="5" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="960" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">어느 규칙에도 안 맞는다</text>
<rect x="330.0" y="438" width="340" height="28" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="457" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">Exact 가 Prefix 를 이긴다 — 순서가 아니라 구체성</text>
<text x="24" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Prefix 는 문자열 접두사가 아니라 경로 요소들의 접두사다. /foo 는 /foo/bar 에는 맞지만 /foobar 에는 맞지 않는다 — 요소가 통째로 다르기 때문이다.</text>
<text x="24" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">구체성이 이기므로 선언 순서를 바꿔도 결과가 같고, '일반 규칙 + 예외' 패턴이 성립한다.</text>
<line x1="12" y1="562" x2="1172" y2="562" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="584" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="574" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="584" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">들어온 요청</text>
<rect x="222" y="574" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="244" y="584" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">잡히는 규칙</text>
<rect x="344" y="574" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="366" y="584" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">안 잡히는 요청</text>
<rect x="492" y="574" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="514" y="584" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">판정 기준</text>
</svg>
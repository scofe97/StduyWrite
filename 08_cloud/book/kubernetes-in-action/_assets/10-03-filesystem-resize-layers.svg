<title id="dt">두 층을 각각 넓혀야 끝난다</title><desc id="dd">PVC 의 용량을 올리면 먼저 밑바탕 블록 디바이스가 커지고, 그다음 그 위 파일시스템이 늘어난 칸을 쓰도록 확장된다. 둘을 하는 주체와 시점이 다르다.</desc>
<rect width="1220" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 10-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">두 층을 각각 넓혀야 끝난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">1Gi → 3Gi</text>
<rect x="24" y="100" width="1172" height="184" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">1 층 — 블록 디바이스</text>
<rect x="70" y="162" width="300" height="84" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="220" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">CSI 컨트롤러</text>
<text x="220" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">PVC 를 고친 직후</text>
<rect x="560" y="162" width="560" height="84" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="840" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">벽에 칸을 더 붙인다</text>
<text x="840" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스토리지 쪽 볼륨이 커진다</text>
<path d="M 372 204 L 552 204" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="24" y="308" width="1172" height="184" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="24" y="308" width="4" height="184" rx="2" fill="#F08A59"/>
<text x="38" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">2 층 — 파일시스템</text>
<rect x="70" y="370" width="300" height="84" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="220" y="410" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">노드의 kubelet · CSI 노드 플러그인</text>
<text x="220" y="428" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 볼륨을 쓰는 파드가 있는 노드에서</text>
<rect x="560" y="370" width="560" height="84" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="840" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">대장이 늘어난 칸을 쓰게 한다</text>
<text x="840" y="428" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">resize2fs 같은 확장</text>
<path d="M 372 412 L 552 412" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="24" y="536" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 파드가 없으면 2 층이 미뤄진다. 파드를 띄워야 그 노드에서 파일시스템 확장이 일어나고, 그때 df 로 본 크기가 비로소 늘어난다.</text>
<text x="24" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">PVC 의 CAPACITY 가 3Gi 인데 컨테이너 안 df 는 1Gi 로 보이는 구간이 이 사이다.</text>
<line x1="12" y1="584" x2="1172" y2="584" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="606" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="596" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">스토리지 쪽</text>
<rect x="222" y="596" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="244" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">노드 쪽</text>
</svg>
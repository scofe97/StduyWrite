<title id="dt">상태는 연속 횟수를 채워야 바뀐다</title><desc id="dd">파드는 준비 안 됨으로 시작한다. probe 는 initialDelaySeconds 가 지난 뒤 periodSeconds 마다 돌고, 실패는 상태를 바꾸지 않는다. successThreshold 만큼 연속 성공해야 명단에 들어온다.</desc>

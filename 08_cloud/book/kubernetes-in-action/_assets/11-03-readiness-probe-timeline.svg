<title id="dt">상태는 연속 횟수를 채워야 바뀐다</title><desc id="dd">probe 는 initialDelaySeconds 가 지난 뒤 periodSeconds 마다 돈다. 한 번의 결과로 상태가 뒤집히지 않고, failureThreshold·successThreshold 만큼 연속돼야 명단에서 빠지거나 들어온다.</desc>

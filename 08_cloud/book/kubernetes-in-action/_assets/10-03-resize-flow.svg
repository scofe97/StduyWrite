<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">숫자가 바뀌는 시점이 서로 다르다</title><desc id="dd">apply 는 즉시 받아들여지지만 그것은 요구가 적힌 것뿐이다. 실제 확장은 두 층에서 차례로 일어나고, 사용자가 보는 값도 그 순서대로 갱신된다.</desc>
<rect width="1240" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 10-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">숫자가 바뀌는 시점이 서로 다르다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">PVC 1Gi → 3Gi</text>
<line x1="160" y1="300" x2="160" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="50" y="196" width="220" height="88" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="160" y="228" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">kubectl apply</text>
<text x="160" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">spec.resources 가 3Gi 로</text>
<line x1="400" y1="300" x2="400" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="290" y="196" width="220" height="88" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="400" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">블록 디바이스 확장</text>
<text x="400" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">CSI 컨트롤러가 볼륨을 키운다</text>
<line x1="640" y1="300" x2="640" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="530" y="196" width="220" height="88" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="640" y="228" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">FileSystemResizePending</text>
<text x="640" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">파드를 기다린다</text>
<line x1="880" y1="300" x2="880" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="770" y="196" width="220" height="88" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="880" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">파일시스템 확장</text>
<text x="880" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">그 노드에서 resize2fs</text>
<line x1="1120" y1="300" x2="1120" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="1010" y="196" width="220" height="88" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="1120" y="228" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">CAPACITY 3Gi</text>
<text x="1120" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">status 가 따라온다</text>
<line x1="120" y1="340" x2="1160" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<path d="M 176 340 L 380 340" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 416 340 L 620 340" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 656 340 L 860 340" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 896 340 L 1100 340" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="640" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">여기서 멈춰 있을 수 있다 — 파드가 없으면 2 층이 시작되지 않는다</text>
<text x="1000" y="440" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">df 로 본 크기가 이때 늘어난다</text>
<text x="24" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 CAPACITY 가 3Gi 인데 컨테이너 안 df 는 1Gi 로 보이는 구간이 생긴다. 둘이 어긋난 것이 아니라 서로 다른 층을 말하고 있다.</text>
<text x="24" y="534" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">줄이는 방향은 지원하지 않는다 — 늘리는 것만 된다.</text>
<line x1="12" y1="560" x2="1192" y2="560" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="582" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="572" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">요구</text>
<rect x="170" y="572" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="192" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">1 층</text>
<rect x="253" y="572" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="275" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">기다리는 구간</text>
<rect x="388" y="572" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="410" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">2 층과 그 결과</text>
</svg>
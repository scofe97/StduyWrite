<title id="dt">네 관문이 순서대로 좁힌다</title><desc id="dd">쿠버네티스 도입 판단은 네 갈래가 독립으로 놓인 것이 아니라 순서대로 좁혀지는 관문이다. 가장 앞에 서는 것은 위치도 관리 주체도 아니라 '애초에 필요한가' 다.</desc>
<rect width="1000" height="980" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 01-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">네 관문이 순서대로 좁힌다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">배포판 판정은 직접 관리하는 두 경로가 모두 지나간다 — 규제로 강제된 쪽과 스스로 고른 쪽</text>
<rect x="24" y="104" width="952" height="820" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">판정을 건너뛰면 뒤 판정의 선택지가 잘못 좁혀진다</text>
<rect x="376" y="108" width="248" height="44" rx="22" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">쿠버네티스 도입 검토</text>
<path d="M 500 154 L 500 182" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 500 192 L 640 240 L 500 288 L 360 240 Z" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">자동화된 관리가 필요한가?</text>
<rect x="716" y="208" width="248" height="64" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="840" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">도입 보류</text>
<text x="840" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">모놀리스 하나 · 마이크로서비스 5개 미만</text>
<path d="M 646 240 L 706 240" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)"/>
<rect x="656.0" y="211" width="44.0" height="18" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="678" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">아니다</text>
<text x="36" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">마이크로서비스 20개를 넘으면</text>
<text x="36" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">확실히 이득이다</text>
<path d="M 500 294 L 500 314" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 500 324 L 640 372 L 500 420 L 360 372 Z" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500" y="376" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">규제상 사내 고정인가?</text>
<rect x="36" y="340" width="248" height="64" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="160" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">온프레미스</text>
<text x="160" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">규제로 강제 — 직접 관리가 따라온다</text>
<path d="M 354 372 L 294 372" fill="none" stroke="#E3B341" stroke-width="1.6" marker-end="url(#warn)"/>
<rect x="300.0" y="343" width="44.0" height="18" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="322" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#E3B341">그렇다</text>
<path d="M 500 426 L 500 446" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 500 456 L 640 504 L 500 552 L 360 504 Z" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500" y="508" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">직접 관리할 여력이 있는가?</text>
<rect x="716" y="472" width="248" height="64" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="840" y="498" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">매니지드 서비스</text>
<text x="840" y="520" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">GKE · AKS · EKS — 커뮤니티가 권장한다</text>
<path d="M 646 504 L 706 504" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)"/>
<rect x="661.0" y="475" width="34.0" height="18" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="678" y="488" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">없다</text>
<rect x="376" y="584" width="248" height="64" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="500" y="610" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">직접 관리</text>
<text x="500" y="632" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">경험자와 먼저 상의한다 — 커뮤니티는 말린다</text>
<path d="M 500 558 L 500 574" fill="none" stroke="#E3B341" stroke-width="1.6" marker-end="url(#warn)"/>
<rect x="529.0" y="559" width="94.0" height="18" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="576" y="572" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#E3B341">있다 · 신중히</text>
<circle cx="500" cy="680" r="4" fill="#F5F5F3"/>
<path d="M 500 648 L 500 674" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 160 404 L 160 680 L 492 680" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)" stroke-dasharray="6 5"/>
<path d="M 500 686 L 500 710" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 500 720 L 640 768 L 500 816 L 360 768 Z" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500" y="772" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">경화된 기본값이 필요한가?</text>
<rect x="76" y="844" width="248" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="200" y="870" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">엔터프라이즈 배포판</text>
<text x="200" y="892" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">OpenShift · Rancher — 한두 버전 뒤</text>
<rect x="676" y="844" width="248" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="800" y="870" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">순정 오픈소스</text>
<text x="800" y="892" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">최신이지만 보안 기본값이 약하다 — 튜닝 필요</text>
<path d="M 354 768 L 200 768 L 200 834" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<path d="M 646 768 L 800 768 L 800 834" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<rect x="273.0" y="739" width="54.0" height="18" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="300" y="752" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">필요하다</text>
<rect x="678.0" y="739" width="44.0" height="18" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="700" y="752" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">아니다</text>
<line x1="12" y1="940" x2="952" y2="940" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="962" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="952" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="962" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">먼저 통과할 관문</text>
<rect x="261" y="952" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="283" y="962" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">도입 보류</text>
<rect x="370" y="952" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="392" y="962" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">부담이 큰 길</text>
<rect x="505" y="952" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="527" y="962" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">권장되는 길</text>
<rect x="627" y="952" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="649" y="962" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">배포판 선택</text>
</svg>
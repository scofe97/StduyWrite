<title id="dt">RWO 볼륨과 maxUnavailable 0 의 순환 대기</title><desc id="dd">RWO 볼륨은 단일 노드에만 붙고 maxUnavailable 0 은 새 파드 준비 전까지 옛 파드를 유지한다. 두 조건이 겹치면 노드가 다를 때 볼륨을 서로 기다리는 교착에 빠진다.</desc>
<rect width="900" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 15-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">RWO 볼륨과 maxUnavailable 0 의 순환 대기</text>
<text x="12" y="74" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">새 파드는 볼륨을 기다리고 · 컨트롤러는 새 파드를 기다리고 · 옛 파드는 볼륨을 놓지 않음</text>
<rect x="280" y="101" width="340" height="58" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="450" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Deployment 컨트롤러</text>
<text x="450" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">maxUnavailable: 0 · 새 파드 Ready 전엔 안 지움</text>
<rect x="36" y="190" width="316" height="270" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="52" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">노드 A (기존 노드)</text>
<text x="52" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">옛 파드 실행 · 볼륨 연결</text>
<rect x="54" y="255" width="280" height="60" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="194" y="277" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">옛 파드 (v1)</text>
<text x="194" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Running · 트래픽 수신 중</text>
<rect x="54" y="372" width="280" height="56" rx="6" fill="#0D1117" stroke="#E3B341" stroke-width="1.2"/>
<text x="194" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">RWO 블록 볼륨 (PVC)</text>
<text x="194" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">단일 노드 제약 · 노드 A 점유</text>
<path d="M 130 372 L 130 323" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="142" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">2 · 옛 파드가 볼륨 점유 (mount)</text>
<rect x="548" y="190" width="316" height="270" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="564" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">노드 B (새 노드)</text>
<text x="564" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">새 파드 스케줄 · 다른 노드</text>
<rect x="566" y="255" width="280" height="60" rx="6" fill="#0D1117" stroke="#F0616D" stroke-width="1.2"/>
<text x="706" y="277" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">새 파드 (v2) · 대기</text>
<text x="706" y="299" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">STATUS Init:0/1 / ContainerCreating</text>
<rect x="566" y="372" width="280" height="56" rx="6" fill="#0D1117" stroke="#F0616D" stroke-width="1.0"/>
<text x="706" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">볼륨 attach 실패</text>
<text x="706" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Multi-Attach error 로 멈춤</text>
<path d="M 706 315 L 706 364" fill="none" stroke="#F0616D" stroke-width="1.2" marker-end="url(#bad)" stroke-dasharray="4 4"/>
<text x="718" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">볼륨 마운트 시도</text>
<rect x="362" y="233" width="176" height="104" rx="8" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="450" y="257" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">순환 대기 (Deadlock)</text>
<text x="450" y="277" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서로 상대 상태를 기다림</text>
<text x="450" y="303" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">600초 경과 시</text>
<text x="450" y="323" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">ProgressDeadlineExceeded</text>
<path d="M 566 400 L 342 400" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="450" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">1 · attach 거부</text>
<text x="450" y="420" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">Multi-Attach error</text>
<path d="M 300 159 L 300 247" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="290" y="172" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">3 · 옛 파드 유지</text>
<text x="290" y="188" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Ready 전엔 안 지움</text>
<rect x="255" y="193" width="90" height="24" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="1.1"/>
<text x="300" y="211" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">✂ 끊는 자리</text>
<path d="M 700 255 L 700 130 L 628 130" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="690" y="172" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">Ready 대기</text>
<text x="690" y="188" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">새 파드 준비 전</text>
<text x="36" y="485" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">교착 없음: 같은 노드에 스케줄 · NFS 등 attachRequired=false</text>
<text x="36" y="507" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">3번을 끊는 세 가지 길: Recreate · maxUnavailable ≥ 1 · 수동 삭제</text>
<line x1="12" y1="532" x2="852" y2="532" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="554" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="90" y="542" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="112" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">옛 파드 실행</text>
<rect x="224" y="542" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="246" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">볼륨 점유</text>
<rect x="330" y="542" width="14" height="14" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="352" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">연결 거부 · 대기</text>
<rect x="506" y="542" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="528" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">3번 끊는 자리</text>
</svg>
<title id="dt">끊기는 것과 이어지는 것</title><desc id="dd">컨테이너가 재시작되면 파일시스템은 이미지 상태로 되돌아간다. 볼륨은 파드에 속해 그 재시작을 넘어 살아남으므로, 남겨야 할 데이터는 볼륨 위에 둔다.</desc>
<rect width="1240" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 09-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">끊기는 것과 이어지는 것</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">emptyDir 볼륨 · 파드가 사라지면 함께 사라진다</text>
<text x="30" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">컨테이너</text>
<rect x="140" y="206" width="300" height="56" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="290.0" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">1 세대</text>
<rect x="480.0" y="206" width="360.0" height="56" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="660.0" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">2 세대 — 재시작</text>
<rect x="880.0" y="206" width="260.0" height="56" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="1010.0" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">3 세대</text>
<text x="460.0" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">✕</text>
<text x="860.0" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">✕</text>
<text x="640" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">재시작할 때마다 파일시스템이 이미지 상태로 되돌아간다</text>
<text x="30" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">볼륨</text>
<rect x="140" y="326" width="1000" height="56" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="640.0" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">한 번 만들어져 파드가 살아 있는 동안 이어진다</text>
<text x="640" y="408" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">컨테이너 재시작을 넘어 데이터가 남는다</text>
<line x1="128" y1="448" x2="1152" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="140" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">파드 시작</text>
<text x="1140" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">파드 삭제</text>
<text x="24" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">emptyDir 은 파드가 사라지면 볼륨도 함께 사라진다. 파드보다 오래 남겨야 하는 데이터는 PersistentVolume 이 맡는다(10 장).</text>
<line x1="12" y1="540" x2="1192" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="562" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="552" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">끊기는 수명</text>
<rect x="222" y="552" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="244" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">이어지는 수명</text>
</svg>
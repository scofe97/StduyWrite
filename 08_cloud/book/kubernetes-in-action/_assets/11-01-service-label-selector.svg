<title id="dt">selector 가 뒤에 설 파드를 고른다</title><desc id="dd">Service 의 selector 와 파드 라벨을 맞춰 본다. 값이 맞으면 다른 라벨이 더 붙어 있어도 들어오고, 값이 다르면 빠진다. 라벨이 같아도 네임스페이스가 다르면 selector 는 보지 못한다.</desc>
<rect width="1014" height="628" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 11-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">selector 가 뒤에 설 파드를 고른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">quote Service · selector 는 app=quote 하나뿐</text>

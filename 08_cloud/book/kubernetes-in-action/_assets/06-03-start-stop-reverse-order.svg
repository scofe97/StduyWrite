<text x="380" y="438" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">05:22:46 SIGTERM</text>
<circle cx="580" cy="452" r="4" fill="#8B98A9"/>
<text x="580" y="420" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">main-a</text>
<text x="580" y="438" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">05:22:47 SIGTERM</text>
<circle cx="780" cy="452" r="6" fill="#F08A59"/>
<text x="780" y="420" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">sidecar</text>
<text x="780" y="438" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">05:22:48 SIGTERM</text>
<path d="M 180 468 L 180 480 L 580 480 L 580 468" fill="none" stroke="#8B98A9" stroke-width="1.2"/>
<text x="380" y="500" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">주 컨테이너끼리는 병렬 — 순서 보장 없음</text>
<path d="M 180 290 L 180 364 L 780 364 L 780 406" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)" stroke-dasharray="6 5"/>
<rect x="363.0" y="355" width="234.0" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="480" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">같은 사이드카 — 맨 앞에서 맨 뒤로</text>
<text x="36" y="528" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">main-a 의 preStop 이 SIGTERM 을 2초 미뤘고(45 → 47), 그 뒤에야 사이드카가 SIGTERM 을 받았다.</text>
<text x="36" y="548" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">사이드카는 주 컨테이너가 다 죽을 때까지 곁을 지킨다 — 로깅·프록시가 그래야 하는 부가 기능이기 때문이다.</text>
<line x1="12" y1="592" x2="952" y2="592" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="614" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="604" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="614" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">사이드카 — 순서가 보장되는 자리</text>
</svg>
<title id="dt">사이드카는 맨 먼저 뜨고 맨 나중에 죽는다</title><desc id="dd">네이티브 사이드카는 주 컨테이너보다 먼저 시작하고, 주 컨테이너가 전부 종료된 뒤에 종료된다. 주 컨테이너끼리의 1~2초 차이는 kubelet 의 생성 시차일 뿐 순서 보장이 아니다.</desc>
<rect width="1000" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 06-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">사이드카는 맨 먼저 뜨고 맨 나중에 죽는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이 순서 보장은 initContainers + restartPolicy: Always 에만 적용된다</text>
<rect x="24" y="104" width="952" height="472" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">일반 containers 에 둔 사이드카는 주 컨테이너와 동급이라 이 순서를 보장받지 못한다</text>
<text x="40" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">▶ 시작</text>
<line x1="140" y1="274" x2="900" y2="274" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

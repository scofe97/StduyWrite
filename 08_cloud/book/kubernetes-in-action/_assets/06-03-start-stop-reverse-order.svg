<circle cx="780" cy="274" r="4" fill="#8B98A9"/>
<text x="780" y="242" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">main-b</text>
<text x="780" y="260" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">05:22:20</text>
<path d="M 580 290 L 580 302 L 780 302 L 780 290" fill="none" stroke="#8B98A9" stroke-width="1.2"/>
<text x="680" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">주 컨테이너끼리는 병렬 — 순서 보장 없음</text>
<text x="40" y="390" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">■ 종료</text>
<line x1="140" y1="452" x2="900" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

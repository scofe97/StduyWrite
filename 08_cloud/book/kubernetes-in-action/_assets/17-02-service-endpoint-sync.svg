<title id="dt">한 번 받아 두고, 그 뒤로는 변경만 받는다</title><desc id="dd">kube-proxy 는 시작할 때 EndpointSlice 목록을 통째로 받아 규칙을 심고, 그 뒤로는 변경 이벤트만 받아 해당 부분을 고친다. 매번 전체를 다시 세지 않는다.</desc>
<rect width="1220" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 17-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 번 받아 두고, 그 뒤로는 변경만 받는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">11-03 의 조각 단위 전송이 여기서 값한다</text>
<rect x="70" y="256" width="260" height="88" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="200" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">API 서버</text>
<text x="200" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">EndpointSlice 를 담는다</text>
<rect x="510" y="256" width="260" height="88" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="640" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">kube-proxy</text>
<text x="640" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노드마다 하나(DaemonSet)</text>
<rect x="920" y="256" width="240" height="88" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="1040" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">커널 규칙</text>
<text x="1040" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">iptables · IPVS · nftables</text>
<path d="M 332 268 L 508 268" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="420" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">① 처음 — 목록 전체</text>
<path d="M 332 332 L 508 332" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)" stroke-dasharray="6 5"/>
<text x="420" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">② 그 뒤 — 변경 이벤트만</text>
<path d="M 772 300 L 918 300" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="845" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">심고 고친다</text>
<text x="610" y="434" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">그래서 파드 하나가 죽고 사는 사건이 규칙 한 줄만 건드린다</text>
<text x="24" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">kube-proxy 도 DaemonSet 으로 도는 노드 에이전트다 — 노드마다 자기 커널 규칙을 손봐야 하기 때문이다. 이 편이 다루는 격리 개방이 그 일을 가능하게 한다.</text>
<text x="24" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">11-03 에서 EndpointSlice 가 조각으로 나뉜 이유가 여기서 값한다 — 변경 하나가 실어 나르는 양이 조각 하나로 좁혀진다.</text>
<line x1="12" y1="548" x2="1172" y2="548" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="570" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="560" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">목록의 출처</text>
<rect x="222" y="560" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="244" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">받아서 옮기는 자</text>
<rect x="383" y="560" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="405" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">실제 규칙</text>
</svg>
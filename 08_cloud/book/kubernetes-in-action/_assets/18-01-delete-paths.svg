<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">지우는 길 셋, 파드의 운명 셋</title><desc id="dd">Job 을 지운다는 같은 말이 파드에 서로 다른 결과를 낸다. 무엇이 회수하느냐와 언제 하느냐가 경로를 가른다.</desc>
<rect width="1240" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 18-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">지우는 길 셋, 파드의 운명 셋</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">완료된 파드를 안 지우면 쌓인다</text>
<rect x="30" y="276" width="240" height="88" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="150" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">완료된 Job</text>
<text x="150" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">파드가 Completed 로 남아 있다</text>
<path d="M 272 320 L 350 320" fill="none" stroke="#5E6B7E" stroke-width="1.2"/>
<path d="M 350 190 L 350 450" fill="none" stroke="#5E6B7E" stroke-width="1.2"/>
<rect x="430" y="152" width="320" height="76" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="450" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">kubectl delete job</text>
<text x="450" y="204" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">사용자가 지운다</text>
<path d="M 350 190 L 424 190" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="800" y="160" width="380" height="60" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="990" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">가비지 컬렉터가 파드까지 회수</text>
<path d="M 752 190 L 794 190" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="430" y="282" width="320" height="76" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="450" y="310" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">--cascade=orphan</text>
<text x="450" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">Job 만 지운다</text>
<path d="M 350 320 L 424 320" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="800" y="290" width="380" height="60" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="990" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">파드가 독립해 남는다</text>
<path d="M 752 320 L 794 320" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#warn)"/>
<rect x="430" y="412" width="320" height="76" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="450" y="440" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">ttlSecondsAfterFinished</text>
<text x="450" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">TTL 컨트롤러가</text>
<path d="M 350 450 L 424 450" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="800" y="420" width="380" height="60" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="990" y="448" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">완료 후 자동으로 지운다</text>
<path d="M 752 450 L 794 450" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<text x="24" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TTL 을 걸어 두면 사람이 잊어도 정리된다. 컨트롤 플레인이 결국 회수하기는 하지만, 공식 문서가 경계하는 것은 그 사이에 쌓이는 파드다.</text>
<text x="24" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">쌓인 파드가 클러스터 성능을 떨어뜨리고 최악의 경우 클러스터를 멈추게 할 수도 있다.</text>
<line x1="12" y1="588" x2="1192" y2="588" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="610" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="600" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="610" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">함께 회수</text>
<rect x="209" y="600" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="231" y="610" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">남겨 둔다</text>
<rect x="318" y="600" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="340" y="610" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">자동 정리</text>
</svg>
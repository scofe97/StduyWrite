<title id="dt">매니페스트 하나가 컨테이너가 되기까지</title><desc id="dd">제출부터 노출까지 여섯 단계가 순서대로 반응한다. 모든 단계가 API Server 를 거치고, 컨트롤러는 오브젝트만 만들 뿐 컨테이너를 직접 띄우지는 않는다.</desc>
<rect width="1400" height="916" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 01-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">매니페스트 하나가 컨테이너가 되기까지</text>

<rect x="56" y="420" width="888" height="152" rx="8" fill="rgba(191,192,192,0.22)" fill-opacity="0.03" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="56" y="408" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">디스크의 레이어 저장소 — 해시가 곧 주소, 실물은 한 벌씩</text>
<rect x="86" y="458" width="220" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="196" y="488" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">a1b2… · c3d4…</text>
<text x="196" y="512" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">nginx 고유 레이어</text>
<rect x="360" y="458" width="280" height="76" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>

<title id="dt">manifest 는 해시 목록이고, 실물은 한 벌씩 있다</title><desc id="dd">두 이미지의 manifest 가 같은 해시를 적어 두면 그 레이어는 디스크에 한 벌만 있고 둘이 함께 가리킨다. 저장도 전송도 이미지가 아니라 레이어 단위로 이뤄진다.</desc>
<rect width="1000" height="688" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">manifest 는 해시 목록이고, 실물은 한 벌씩 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">그래서 두 번째 pull 이 빠르다 — 이미 있는 레이어는 Already exists 로 건너뛴다</text>
<rect x="24" y="104" width="952" height="528" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">manifest 가 같은 해시를 적었다는 것은 내용이 바이트 단위로 같다는 뜻이다</text>
<rect x="50" y="202" width="400" height="116" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="250" y="226" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">nginx:alpine</text>
<text x="70" y="252" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">↳ 91d5cf66…</text>
<text x="430" y="252" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">alpine 베이스</text>
<text x="70" y="274" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">↳ a1b2…</text>
<text x="430" y="274" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">nginx RUN</text>

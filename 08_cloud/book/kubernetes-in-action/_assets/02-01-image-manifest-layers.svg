<text x="500" y="512" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">둘이 함께 가리킨다 — 한 벌만</text>
<rect x="694" y="458" width="220" height="76" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="804" y="488" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">e5f6… · 7a8b…</text>
<text x="804" y="512" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">redis 고유 레이어</text>
<path d="M 196 324 L 196 448" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<path d="M 804 324 L 804 448" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 320 324 L 320 380 L 430 380 L 430 448" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<path d="M 670 324 L 670 380 L 570 380 L 570 448" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<rect x="427.0" y="371" width="146.0" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="500" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">같은 해시 → 한 벌만</text>
<text x="36" y="604" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">pull 하면 manifest 를 먼저 받고 거기 적힌 해시 중 없는 것만 내려받는다 — 이미 있으면 Already exists 로 건너뛴다.</text>

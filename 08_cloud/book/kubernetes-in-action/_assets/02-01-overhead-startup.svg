<title id="dt">게스트 OS 가 자리도 먹고 시간도 먹는다</title><desc id="dd">VM 은 앱마다 게스트 OS 를 하나씩 얹으므로 같은 서버에 들어가는 앱 수가 줄고, 앱을 띄우기 전에 그 OS 를 부팅하는 단계가 먼저 온다. 컨테이너에는 둘 다 없다.</desc>
<rect width="1000" height="752" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">게스트 OS 가 자리도 먹고 시간도 먹는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">오토스케일링·장애 복구처럼 새 인스턴스를 빨리 띄워야 할 때 이 차이가 벌어진다</text>
<rect x="24" y="104" width="952" height="592" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">자리 개수와 단계 개수 — 둘 다 게스트 OS 하나 때문에 갈린다</text>
<text x="40" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">① 같은 서버의 자리를 무엇이 차지하나</text>
<text x="250" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">VM 두 개로 돌릴 때</text>
<rect x="100" y="244" width="300" height="52" rx="5" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="250" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">게스트 OS 1 — 오버헤드</text>
<rect x="100" y="304" width="300" height="52" rx="5" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="250" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">App A</text>
<rect x="100" y="364" width="300" height="52" rx="5" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="250" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">게스트 OS 2 — 오버헤드</text>
<rect x="100" y="424" width="300" height="52" rx="5" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="250" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">App B</text>
<rect x="100" y="484" width="300" height="52" rx="5" fill="#8B98A918" stroke="#8B98A9" stroke-width="1.1"/>
<text x="250" y="516" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트 OS</text>
<text x="690" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">컨테이너로 돌릴 때</text>
<rect x="540" y="244" width="300" height="52" rx="5" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="690" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">App A</text>
<rect x="540" y="304" width="300" height="52" rx="5" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="690" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">App B</text>
<rect x="540" y="364" width="300" height="52" rx="5" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="690" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">App C</text>
<rect x="540" y="424" width="300" height="52" rx="5" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="690" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">App D</text>
<rect x="540" y="484" width="300" height="52" rx="5" fill="#8B98A918" stroke="#8B98A9" stroke-width="1.1"/>
<text x="690" y="516" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트 OS — 하나뿐</text>
<rect x="182.5" y="553" width="135.0" height="18" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="250" y="566" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">같은 자리에 앱은 둘</text>
<rect x="622.5" y="553" width="135.0" height="18" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="690" y="566" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">같은 자리에 앱은 넷</text>
<text x="40" y="600" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">② 앱이 뜨기까지 거치는 단계</text>
<text x="184" y="636" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">VM</text>
<rect x="200" y="620" width="360" height="24" rx="4" fill="#F0616D18" stroke="#F0616D" stroke-width="1.0"/>
<text x="380" y="636" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">게스트 OS 부팅 — 수십 초</text>
<rect x="560" y="620" width="150" height="24" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.0"/>
<text x="635" y="636" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">앱 시작</text>
<text x="724" y="636" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">부팅이 먼저다</text>
<text x="184" y="668" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">컨테이너</text>
<rect x="200" y="652" width="150" height="24" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.0"/>
<text x="275" y="668" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">앱 시작 — 초 이하</text>
<text x="364" y="668" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">부팅 단계가 없다</text>
<line x1="12" y1="712" x2="952" y2="712" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="734" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="724" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="734" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">게스트 OS 가 먹는 몫</text>
<rect x="313" y="724" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="335" y="734" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">앱에 돌아가는 몫</text>

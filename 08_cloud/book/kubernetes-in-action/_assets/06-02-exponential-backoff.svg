<title id="dt">재시작 지연은 두 배씩 늘다가 5분에서 멈춘다</title><desc id="dd">첫 종료는 즉시 재시작되고 그다음부터 10초에서 시작해 매번 두 배가 된다. 300초에서 상한에 닿고, 컨테이너가 10분 동안 정상으로 돌면 지연은 0 으로 리셋된다.</desc>
<rect width="1000" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 06-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">재시작 지연은 두 배씩 늘다가 5분에서 멈춘다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이 대기 상태가 CrashLoopBackOff 다 — state 는 Waiting, reason 이 그 이름이다</text>

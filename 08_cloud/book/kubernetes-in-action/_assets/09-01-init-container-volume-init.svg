<title id="dt">볼륨이 먼저 서고, 그다음 채운다</title><desc id="dd">emptyDir 은 빈 채로 시작하므로 매번 손으로 데이터를 넣게 된다. init 컨테이너가 파일을 볼륨에 미리 복사해 두면 파드가 뜰 때 데이터베이스가 저절로 채워진다.</desc>
<rect width="1240" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 09-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">볼륨이 먼저 서고, 그다음 채운다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">매니페스트에 볼륨을 앞에 적든 뒤에 적든 이 순서다</text>
<rect x="20" y="212" width="216" height="96" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="128" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">① 볼륨이 만들어진다</text>
<text x="128" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">initdb — 빈 디렉터리</text>
<rect x="266" y="212" width="216" height="96" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="374" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">② init 컨테이너 시작</text>
<text x="374" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">볼륨이 먼저 마운트된다</text>
<rect x="512" y="212" width="216" height="96" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="620" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">③ 파일을 볼륨에 복사</text>
<text x="620" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">cp insert-questions.js</text>
<rect x="758" y="212" width="216" height="96" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="866" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">④ init 컨테이너 종료</text>
<text x="866" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">복사가 끝나면 물러난다</text>
<rect x="1004" y="212" width="216" height="96" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="1112" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">⑤ 본 컨테이너 시작</text>
<text x="1112" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">MongoDB 가 그 파일을 읽는다</text>
<path d="M 241 260 L 257 260" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 487 260 L 503 260" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 733 260 L 749 260" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 979 260 L 995 260" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="20" y="348" width="1200" height="52" rx="6" fill="#6A95D80A" stroke="#6A95D8" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="620" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">initdb 볼륨 — 이 구간 내내 같은 디렉터리다</text>
<text x="24" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">init 컨테이너는 파일을 어디서든 가져올 수 있다. Git 저장소를 clone 해도 되고 자기 이미지에 담아 둬도 된다. 여기서는 질문을 담은 이미지를 만들어 cp 로 복사한다.</text>
<text x="24" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">MongoDB 이미지는 시작 시 데이터베이스가 비어 있으면 /docker-entrypoint-initdb.d/ 의 .js·.sh 를 실행한다 — 볼륨을 그 위치에 마운트해 두면 된다.</text>
<line x1="12" y1="510" x2="1192" y2="510" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="532" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="522" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">파일이 옮겨지는 지점</text>
<rect x="287" y="522" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">볼륨</text>
<rect x="357" y="522" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="379" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">읽는 쪽</text>
</svg>
<text x="280" y="480" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">네 조각은 안 바뀌었으니 전송하지 않는다</text>
<text x="24" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">총 IP 는 어느 쪽이나 99 개로 같고 최종 상태도 같다. 달라진 것은 변경 하나가 건드리는 범위가 오브젝트 전체에서 조각 하나로 좁혀졌다는 점이다.</text>

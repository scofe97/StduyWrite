<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">파드 100 개 서비스 · 파드 하나가 죽음 · 노드 100 대</text>

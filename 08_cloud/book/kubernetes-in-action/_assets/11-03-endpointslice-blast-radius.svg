<title id="dt">줄어든 것은 저장량이 아니라 퍼지는 넓이다</title><desc id="dd">watch 는 바뀐 부분만 보내지 않고 오브젝트를 통째로 보낸다. 그래서 오브젝트 크기가 곧 전송 단위가 되고, 파드 하나가 죽고 사는 사소한 사건도 담긴 IP 를 전부 다시 실어 나른다.</desc>

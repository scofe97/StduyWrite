<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">베이스는 하나, 쓰기 레이어는 각자</title><desc id="dd">A 와 B 는 같은 읽기 전용 베이스를 공유하다가, A 가 그 안의 파일을 바꾸는 순간 그 파일만 A 의 쓰기 레이어로 복사된다. B 는 여전히 원본을 보므로 A 의 변경이 새어 나가지 않는다.</desc>
<rect width="1000" height="604" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">베이스는 하나, 쓰기 레이어는 각자</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">공유로 얻는 효율과 격리를 동시에 얻는 장치다 — 건드릴 때만 복사한다</text>
<rect x="24" y="104" width="952" height="444" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">삭제도 마찬가지다 — 쓰기 레이어에 표시만 남고 원본은 아래에 남아 이미지 크기는 줄지 않는다</text>
<text x="270" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">컨테이너 A</text>
<text x="720" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">컨테이너 B</text>
<rect x="70" y="262" width="400" height="76" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.1"/>
<text x="270" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">config.txt (사본)</text>
<text x="270" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">A 의 쓰기 레이어 — 여기서 수정됐다</text>
<rect x="520" y="262" width="400" height="76" rx="6" fill="#8B98A912" stroke="#8B98A9" stroke-width="1.1" stroke-dasharray="6 5"/>
<text x="720" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">비어 있다</text>
<text x="720" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">B 의 쓰기 레이어 — 건드리지 않았다</text>
<rect x="56" y="400" width="888" height="96" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="500" y="438" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">공유 읽기 전용 베이스 레이어 — config.txt (원본, 그대로)</text>
<text x="500" y="462" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">디스크에 한 벌만 있고 두 컨테이너가 함께 본다</text>
<path d="M 270 394 L 270 348" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<rect x="175.0" y="361" width="190.0" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="270" y="374" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">수정하는 순간 그 파일만 복사</text>
<path d="M 720 394 L 720 348" fill="none" stroke="#8B98A9" stroke-width="1.4" stroke-dasharray="6 5"/>
<rect x="636.0" y="361" width="168.0" height="18" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="720" y="374" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">읽기만 한다 — 복사 없음</text>
<text x="36" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">A 가 본 것은 자기 사본이고 B 가 본 것은 원본이다 — 같은 경로인데 서로 다른 파일을 본다.</text>
<line x1="12" y1="564" x2="952" y2="564" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="586" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="576" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="586" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">공유 베이스 (읽기 전용)</text>
<rect x="326" y="576" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="348" y="586" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">복사가 일어난 자리</text>
</svg>
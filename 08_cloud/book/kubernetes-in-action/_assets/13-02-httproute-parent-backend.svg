<title id="dt">위로 붙고 아래로 보낸다</title><desc id="dd">HTTPRoute 는 parentRefs 로 게이트웨이에 붙고 backendRefs 로 서비스에 보낸다. 둘 다 배열이라 게이트웨이 여럿에 붙을 수도, 서비스 여럿으로 나눌 수도 있다.</desc>
<rect width="1120" height="650" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 13-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">위로 붙고 아래로 보낸다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">kiada Gateway 와 kiada Service 를 잇는 가장 단순한 Route</text>
<rect x="410" y="142" width="300" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="560" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">Gateway  kiada</text>
<text x="560" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">플랫폼 팀이 만든 입구</text>
<rect x="380" y="292" width="360" height="112" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="560" y="322" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">HTTPRoute  kiada</text>
<text x="560" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">hostnames: kiada.example.com</text>
<text x="560" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 호스트로 온 요청만 매칭</text>
<rect x="410" y="462" width="300" height="76" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="560" y="498" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">Service  kiada</text>
<text x="560" y="516" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">port: 80</text>
<path d="M 560 288 L 560 222" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="576" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">parentRefs — 이 게이트웨이에 붙는다</text>
<path d="M 560 408 L 560 458" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="576" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">backendRefs — 여기로 보낸다</text>
<text x="180" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">여럿일 수 있다</text>
<text x="180" y="500" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">여럿일 수 있다</text>
<line x1="300" y1="180" x2="404" y2="180" stroke="#8B98A9" stroke-width="0.8" stroke-dasharray="3 5"/>
<line x1="300" y1="500" x2="404" y2="500" stroke="#8B98A9" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="24" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">만든 뒤 YAML 을 보면 없던 필드가 기본값으로 채워진다 — parentRefs 에 kind: Gateway, backendRefs 에 kind: Service·weight: 1, rule 에 모든 요청을 받는 matches 가 붙는다.</text>
<text x="24" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">참조가 특정 kind 로 고정되지 않고 가장 흔한 kind 로 기본값이 잡히는 이 패턴이 Gateway API 를 확장 가능하게 한다.</text>
<line x1="12" y1="602" x2="1072" y2="602" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="624" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="614" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="624" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">붙는 곳·보낼 곳</text>
<rect x="261" y="614" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="283" y="624" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">Route 와 그 참조</text>
</svg>
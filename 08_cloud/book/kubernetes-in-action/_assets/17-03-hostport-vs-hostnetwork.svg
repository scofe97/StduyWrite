<path d="M 619 214 L 649 214" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 903 214 L 933 214" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="610" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">변환 한 번 · 홉 하나</text>
<rect x="24" y="340" width="1172" height="216" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="24" y="340" width="4" height="216" rx="2" fill="#F08A59"/>
<text x="38" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">hostNetwork — 파드가 노드 netns 안에 있다</text>
<rect x="90" y="412" width="240" height="84" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="210" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">노드 포트</text>
<text x="210" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">9090</text>
<rect x="374" y="412" width="240" height="84" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="494" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">컨테이너</text>
<text x="494" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">노드 소켓에 바로</text>
<path d="M 335 454 L 365 454" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="610" y="520" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">변환도 veth 도 없다</text>
<text x="24" y="596" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">대신 hostNetwork 는 그 포트를 노드에서 점유한다. 같은 포트를 쓰는 레플리카를 한 노드에 둘 수 없고, 임의 포트에 바인딩할 수 있어 노출면도 넓다.</text>
<line x1="12" y1="616" x2="1192" y2="616" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="638" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="628" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="638" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">거쳐 간다</text>
<rect x="209" y="628" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="638" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">바로 닿는다</text>

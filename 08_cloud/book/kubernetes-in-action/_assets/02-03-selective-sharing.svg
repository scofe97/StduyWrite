<title id="dt">공유하는 경계는 둘을 함께 감싸고, 격리하는 경계는 따로 감싼다</title><desc id="dd">net·uts 네임스페이스는 두 프로세스를 하나로 묶어 같은 IP·호스트명을 보게 하고, mnt 네임스페이스는 각자를 따로 감싸 파일시스템을 가른다.</desc>
<rect width="1000" height="644" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 02-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">공유하는 경계는 둘을 함께 감싸고, 격리하는 경계는 따로 감싼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">쿠버네티스 Pod 가 바로 이 방식이다 — 그래서 컨테이너 경계가 한 줄로 안 그어진다</text>
<rect x="24" y="104" width="952" height="484" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">경계가 종류마다 다르게 그어지므로 '컨테이너 경계' 는 프로세스마다 딱 겹치지 않는다</text>
<rect x="72" y="208" width="856" height="176" rx="8" fill="#3FB98C08" stroke="#3FB98C" stroke-width="1.4" stroke-dasharray="7 6"/>
<rect x="88" y="199" width="372" height="18" fill="#0D1117"/>
<text x="98" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">net · uts 네임스페이스 — 둘이 함께 쓴다 (같은 eth0 · lo · 호스트명)</text>
<rect x="150" y="254" width="300" height="84" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="300" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">Process 1</text>
<text x="300" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">같은 IP 에 바인딩한다</text>
<rect x="550" y="254" width="300" height="84" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="700" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">Process 2</text>
<text x="700" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">lo 로 P1 과 통신한다</text>
<path d="M 456 296 L 540 296" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)"/>
<rect x="454.5" y="287" width="91.0" height="18" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="500" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">lo 로 통신</text>
<rect x="134" y="412" width="332" height="126" rx="8" fill="#E3B34108" stroke="#E3B341" stroke-width="1.4" stroke-dasharray="7 6"/>
<rect x="148" y="403" width="117" height="18" fill="#0D1117"/>
<text x="158" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">mnt 네임스페이스 A</text>
<rect x="150" y="438" width="300" height="84" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="300" y="472" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">filesystem A</text>
<text x="300" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">이 프로세스만 본다</text>
<rect x="534" y="412" width="332" height="126" rx="8" fill="#E3B34108" stroke="#E3B341" stroke-width="1.4" stroke-dasharray="7 6"/>
<rect x="548" y="403" width="117" height="18" fill="#0D1117"/>
<text x="558" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">mnt 네임스페이스 B</text>
<rect x="550" y="438" width="300" height="84" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="700" y="472" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">filesystem B</text>
<text x="700" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">이 프로세스만 본다</text>
<path d="M 300 344 L 300 402" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 700 344 L 700 402" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="36" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">net·uts 는 겹치고 mnt 는 갈린다 — 겹치는 만큼 한 머신처럼 통신하고, 갈리는 만큼 서로의 파일을 못 본다.</text>
<line x1="12" y1="604" x2="952" y2="604" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="626" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="616" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="626" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">함께 쓰는 경계</text>
<rect x="248" y="616" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="270" y="626" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">각자 쓰는 경계</text>
<rect x="396" y="616" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="418" y="626" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">프로세스</text>
</svg>
<title id="dt">사용자는 spec 을 쓰고 컨트롤러는 status 를 쓴다</title><desc id="dd">한 오브젝트 안에서 쓰는 칸이 갈린다. 사용자는 spec 에 목표를 적고 status 를 읽으며, 컨트롤러는 spec 을 읽어 실제를 맞춘 뒤 status 에 결과를 적는다.</desc>
<rect width="1000" height="724" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 04-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">사용자는 spec 을 쓰고 컨트롤러는 status 를 쓴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">GET·PUT 은 섹션 하나가 아니라 오브젝트 전체를 주고받는다</text>
<rect x="24" y="104" width="952" height="564" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">spec 은 선언된 목표이고 status 는 관측된 결과다 — 컨트롤러는 둘의 차이를 줄인다</text>
<rect x="25" y="246" width="250" height="108" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="150" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">사용자 · kubectl</text>
<text x="150" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">create · apply · get</text>
<text x="150" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">서버가 아니라 오브젝트를 만진다</text>
<rect x="725" y="246" width="250" height="108" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="850" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">Controller</text>
<text x="850" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">watch → compare → act</text>
<text x="850" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">타입마다 전담 컨트롤러가 있다</text>
<rect x="314" y="220" width="372" height="368" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="330" y="211" width="268" height="18" fill="#0D1117"/>
<text x="340" y="224" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">Object Manifest — 네 섹션이 한 객체로 저장된다</text>
<rect x="330" y="252" width="340" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">apiVersion + kind</text>
<text x="500" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">1. Type metadata — 무슨 타입인가</text>
<rect x="330" y="340" width="340" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500" y="370" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">metadata</text>
<text x="500" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">2. Object metadata — 이름·라벨·UID</text>
<rect x="330" y="428" width="340" height="76" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.1"/>
<text x="500" y="458" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">spec</text>
<text x="500" y="482" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">3. Spec — 사용자가 쓰는 원하는 상태</text>
<rect x="330" y="516" width="340" height="76" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="500" y="546" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">status</text>
<text x="500" y="570" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">4. Status — 컨트롤러가 쓰는 실제 상태</text>
<path d="M 281 300 L 300 300 L 300 466 L 320 466" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<rect x="289.59" y="335" width="20.82" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="300" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">①</text>
<path d="M 324 554 L 300 554 L 300 372 L 150 372 L 150 364" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="289.59" y="543" width="20.82" height="18" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="300" y="556" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">④</text>
<path d="M 676 466 L 700 466 L 700 300 L 715 300" fill="none" stroke="#3FB98C" stroke-width="1.8" marker-end="url(#ok)"/>
<rect x="689.59" y="335" width="20.82" height="18" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="700" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">②</text>
<path d="M 850 360 L 850 554 L 680 554" fill="none" stroke="#3FB98C" stroke-width="1.8" marker-end="url(#ok)"/>
<rect x="689.59" y="543" width="20.82" height="18" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="700" y="556" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">③</text>
<text x="36" y="612" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">① 사용자가 spec 을 쓴다   ② 컨트롤러가 spec 을 읽는다   ③ 컨트롤러가 status 를 쓴다   ④ 사용자가 status 를 읽는다</text>
<text x="36" y="636" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">쓰는 칸이 갈려 있어 충돌하지 않는다 — 사용자가 status 를 쓰지 않고 컨트롤러가 spec 을 쓰지 않는다.</text>
<line x1="12" y1="684" x2="952" y2="684" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="706" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="696" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="706" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">사용자가 쓰는 칸</text>
<rect x="261" y="696" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="283" y="706" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">컨트롤러가 쓰는 칸</text>
<rect x="435" y="696" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="457" y="706" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">한 오브젝트</text>
</svg>
<title id="dt">누가 파드 IP를 만들고 누가 명단에 적는가</title><desc id="dd">네 컴포넌트가 각각 한 가지만 맡는다. 스케줄러는 노드를, CNI는 파드 IP를, EndpointSlice 컨트롤러는 명단을, kube-proxy는 길을 맡는다. 이 준비는 요청이 오기 전에 끝나 있고, 요청 때 실제로 도는 것은 커널의 변환뿐이다.</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 11-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">누가 파드 IP를 만들고 누가 명단에 적는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">파드 IP를 실제로 만드는 것은 CNI 하나뿐</text>
<rect x="24" y="100" width="952" height="216" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">준비 — 요청이 오기 전에 끝나 있다</text>
<rect x="40" y="154" width="200" height="108" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="140" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">스케줄러</text>
<text x="140" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">노드를 정한다</text>
<text x="140" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">IP 는 만들지 않음</text>
<rect x="280" y="154" width="200" height="108" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="380" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">CNI 플러그인</text>
<text x="380" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">파드 IP 를 만든다</text>
<text x="380" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">10.244.2.9 발급</text>
<rect x="520" y="154" width="200" height="108" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="620" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">EndpointSlice 컨트롤러</text>
<text x="620" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">명단에 적는다</text>
<text x="620" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">ready 조건을 함께 적는다</text>
<rect x="760" y="154" width="200" height="108" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="860" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">kube-proxy</text>
<text x="860" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">길을 놓는다</text>
<text x="860" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">각 노드에 규칙 설치</text>
<path d="M 246 208 L 270 208" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 486 208 L 510 208" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 726 208 L 750 208" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 520 276 L 520 284 L 960 284 L 960 276" fill="none" stroke="#F08A59" stroke-width="1.2"/>
<path d="M 740 284 L 740 330 L 500 330 L 500 400" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)" stroke-dasharray="5 5"/>
<text x="752" y="306" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">요청 때 실제로 쓰이는 준비는 이 둘</text>
<rect x="24" y="368" width="952" height="180" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">요청 — 그때 일어나는 일</text>
<rect x="45" y="414" width="210" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="150" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">클라이언트 파드</text>
<text x="150" y="468" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">curl http://quote</text>
<rect x="370" y="414" width="260" height="76" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">노드 커널</text>
<text x="500" y="468" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">명단에서 하나 골라 DNAT</text>
<rect x="745" y="414" width="210" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="850" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">파드</text>
<text x="850" y="468" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">10.244.2.9:80</text>
<path d="M 261 452 L 360 452" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 636 452 L 735 452" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="258.36" y="414" width="103.28" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="310" y="428" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">dst 10.96.74.151</text>
<rect x="643.94" y="414" width="92.12" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="690" y="428" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">dst 10.244.2.9</text>
<text x="500" y="522" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">스케줄러·CNI 는 이 경로에 등장하지 않는다 — 이미 끝난 일이다</text>
<line x1="12" y1="568" x2="952" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="590" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

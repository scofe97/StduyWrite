<title id="dt">커널이 몇 개이고 어디에 있는가</title><desc id="dd">베어메탈은 커널 하나를 격리 없이 나눠 쓰고, VM 은 커널을 나눠 강하게 격리하며, 컨테이너는 커널 하나를 공유하면서 격리를 적용한다.</desc>
<rect width="1000" height="748" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널이 몇 개이고 어디에 있는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽으로 갈수록 가볍고 무방비, 오른쪽으로 갈수록 무겁고 강한 격리 — 컨테이너는 그 사이다</text>
<rect x="24" y="104" width="952" height="588" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">컨테이너의 점선은 커널은 공유하되 namespace·cgroup 으로 격리한다는 뜻이다</text>
<rect x="46" y="214" width="88" height="46" rx="5" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="90" y="243" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">App A</text>
<rect x="142" y="214" width="88" height="46" rx="5" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="186" y="243" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">App B</text>
<rect x="238" y="214" width="88" height="46" rx="5" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="282" y="243" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">App C</text>
<text x="186" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">① 베어메탈</text>
<text x="186" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">격리가 없다</text>
<rect x="46" y="268" width="280" height="46" rx="5" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="186" y="295" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">커널 하나 — 격리 없음</text>

<text x="500" y="501" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">하이퍼바이저</text>
<rect x="360" y="526" width="280" height="46" rx="5" fill="#8B98A912" stroke="#8B98A9" stroke-width="1.1"/>
<text x="500" y="555" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">물리 하드웨어</text>
<text x="814" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">③ 컨테이너 셋</text>
<text x="814" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">공유하되 격리한다</text>
<rect x="674" y="214" width="88" height="46" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1" stroke-dasharray="6 5"/>
<text x="718" y="243" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">Ctr A</text>
<rect x="770" y="214" width="88" height="46" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1" stroke-dasharray="6 5"/>
<text x="814" y="243" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">Ctr B</text>
<rect x="866" y="214" width="88" height="46" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1" stroke-dasharray="6 5"/>
<text x="910" y="243" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">Ctr C</text>
<rect x="674" y="268" width="280" height="46" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="814" y="297" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">호스트 커널 하나 — 격리 적용</text>

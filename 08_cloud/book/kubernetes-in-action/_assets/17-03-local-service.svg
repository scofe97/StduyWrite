<title id="dt">이름으로 부르되 노드를 넘지 않는다</title><desc id="dd">internalTrafficPolicy 를 Local 로 두면 그 노드의 엔드포인트만 후보가 된다. 앱은 Service 이름 하나만 알면 되고 노드 IP 를 조합할 필요가 없다.</desc>
<rect width="1220" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 17-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름으로 부르되 노드를 넘지 않는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">다른 노드로 넘기는 길이 아예 없다</text>
<rect x="90" y="176" width="1040" height="180" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="610" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">노드 A — 에이전트 있음</text>
<rect x="140" y="243" width="240" height="66" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="260" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">클라이언트 파드</text>
<text x="260" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">http://agent</text>
<rect x="580" y="243" width="240" height="66" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="700" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">로컬 에이전트</text>
<text x="700" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 노드의 것</text>
<path d="M 382 276 L 578 276" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="1000" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">같은 노드 것으로 간다</text>
<rect x="90" y="392" width="1040" height="180" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="610" y="420" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">노드 C — 에이전트 없음</text>
<rect x="140" y="459" width="240" height="66" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="260" y="490" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">클라이언트 파드</text>
<text x="260" y="508" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">http://agent</text>
<rect x="580.0" y="479" width="240" height="26" rx="5" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="700" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">후보가 없다</text>
<path d="M 382 492 L 578 492" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)" stroke-dasharray="5 5"/>
<text x="1000" y="492" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">엔드포인트 0 개처럼 — 연결 실패</text>
<text x="24" y="596" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 사실상 DaemonSet 전용이다 — 모든 노드에 에이전트가 하나씩 있다는 전제 위에서만 성립한다. 11-03 에서 본 그 성질이 여기서 조건이 된다.</text>
<line x1="12" y1="612" x2="1172" y2="612" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="634" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="624" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="634" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">부르는 쪽</text>
<rect x="209" y="624" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="231" y="634" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">닿는다</text>
<rect x="292" y="624" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="314" y="634" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">막힌다</text>
</svg>
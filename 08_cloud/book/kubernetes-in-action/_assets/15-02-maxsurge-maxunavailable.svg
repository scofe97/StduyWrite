<title id="dt">천장과 바닥 사이에서만 움직인다</title><desc id="dd">maxSurge 는 원하는 수를 얼마나 넘어설 수 있는지를, maxUnavailable 은 얼마나 모자랄 수 있는지를 정한다. 두 값 모두 원하는 복제본 수에 상대적이다.</desc>
<rect width="1220" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 15-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">천장과 바닥 사이에서만 움직인다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">replicas 3 · maxSurge 1 · maxUnavailable 1 → 총합 ≤ 4 · 가용 ≥ 2</text>
<line x1="60" y1="200" x2="1160" y2="200" stroke="#E3B341" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="1150" y="192" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#E3B341">총합 천장 4 = replicas + maxSurge</text>
<line x1="60" y1="396" x2="1160" y2="396" stroke="#3FB98C" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="1150" y="388" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">가용 바닥 2 = replicas − maxUnavailable</text>
<text x="220" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">시작</text>
<rect x="110" y="216" width="220" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="220" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">옛 0.5 × 3</text>
<text x="220" y="268" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">새 0.6 × 0</text>
<rect x="155.0" y="287" width="130" height="26" rx="5" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="220" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">총합 3</text>
<rect x="155.0" y="351" width="130" height="26" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="220" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">가용 3</text>
<text x="480" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">새 +1 · 옛 −1</text>
<rect x="370" y="216" width="220" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="480" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">옛 0.5 × 2</text>
<text x="480" y="268" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">새 0.6 × 2</text>
<rect x="415.0" y="287" width="130" height="26" rx="5" fill="#E3B34114" stroke="#E3B341" stroke-width="1.0"/>
<text x="480" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">총합 4</text>
<rect x="415.0" y="351" width="130" height="26" rx="5" fill="#F08A5914" stroke="#F08A59" stroke-width="1.0"/>
<text x="480" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">가용 2</text>
<text x="740" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">교체 진행</text>
<rect x="630" y="216" width="220" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="740" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">옛 0.5 × 1</text>
<text x="740" y="268" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">새 0.6 × 3</text>
<rect x="675.0" y="287" width="130" height="26" rx="5" fill="#E3B34114" stroke="#E3B341" stroke-width="1.0"/>
<text x="740" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">총합 4</text>
<rect x="675.0" y="351" width="130" height="26" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="740" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">가용 3</text>
<text x="1000" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">옛 −1</text>
<rect x="890" y="216" width="220" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="1000" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">옛 0.5 × 0</text>
<text x="1000" y="268" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">새 0.6 × 3</text>
<rect x="935.0" y="287" width="130" height="26" rx="5" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="1000" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">총합 3</text>
<rect x="935.0" y="351" width="130" height="26" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="1000" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">가용 3</text>
<path d="M 336 266 L 360 266" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 596 266 L 620 266" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 856 266 L 880 266" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="24" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핵심은 값이 원하는 수에 상대적이라는 것이다 — replicas 3 · maxUnavailable 1 인데 현재 5 개면, 가용해야 할 수는 2 개(=3−1)이지 4 개가 아니다.</text>
<text x="24" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">maxSurge 0 · maxUnavailable 1 이면 천장이 3 이라 옛 파드를 먼저 지워야 자리가 나고, maxSurge 1 · maxUnavailable 0 이면 바닥이 3 이라 새 파드를 먼저 띄워야 한다 — 순서가 강제된다.</text>
<line x1="12" y1="516" x2="1172" y2="516" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="528" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">천장에 닿은 단계</text>
<rect x="261" y="528" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="283" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">가용 파드</text>
<rect x="370" y="528" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="392" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">바닥에 닿은 단계</text>
</svg>
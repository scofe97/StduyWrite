<text x="24" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">지연의 크기는 kubelet 의 configMapAndSecretChangeDetectionStrategy 를 따른다 — watch(기본) · ttl 기반 · API 서버 직접 조회 셋이다.</text>
<text x="24" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그리고 이것은 파일 내용의 갱신일 뿐이다. 앱이 파일을 다시 읽지 않으면 실제 동작은 이전 설정을 계속 쓴다.</text>

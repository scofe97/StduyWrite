<title id="dt">파드를 건드리지 않지만 즉시도 아니다</title><desc id="dd">일반 볼륨의 파일 갱신은 파드를 교체하거나 컨테이너를 재시작하지 않고 일어난다. 다만 kubelet 동기화 주기와 캐시 전파만큼 늦는다.</desc>

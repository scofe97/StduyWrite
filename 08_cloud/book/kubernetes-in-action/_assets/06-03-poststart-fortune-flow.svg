<title id="dt">postStart 는 nginx 와 병렬 시작 · exit 0 뒤 서빙</title><desc id="dd">컨테이너 생성 직후 sh -c 로 실행된 postStart hook 이 fortune 결과를 /usr/share/nginx/html/quote 에 쓴다. 실패(exit ≠ 0)하면 컨테이너가 재시작되고, 성공해야 Pod 가 Running 으로 넘어가 HTTP :80 을 서빙한다.</desc>

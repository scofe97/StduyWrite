<title id="dt">Once 의 '하나'는 파드인가 노드인가</title><desc id="dd">Once 계열은 하나가 파드냐 노드냐로 갈리고, Many 계열은 read-write 를 허용하느냐로 갈린다. 이름만 보면 RWOP 와 RWO 가 비슷해 보이지만 제한 단위가 다르다.</desc>
<rect width="920" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 10-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Once 의 '하나'는 파드인가 노드인가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">제한 단위 × 동시 사용</text>
<text x="320" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">파드 단위</text>
<text x="680" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">노드 단위</text>
<text x="80" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">하나만</text>
<text x="80" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">여럿</text>
<rect x="150" y="184" width="340" height="104" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="320" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">ReadWriteOncePod</text>
<text x="320" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">RWOP</text>
<text x="320" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">파드 하나만 마운트</text>
<rect x="510" y="184" width="340" height="104" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="680" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">ReadWriteOnce</text>
<text x="680" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">RWO</text>
<text x="680" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">노드 하나가 붙임 · 같은 노드의 파드는 함께 씀</text>
<rect x="150" y="316" width="340" height="104" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="320" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">ReadWriteMany</text>
<text x="320" y="372" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">RWX</text>
<text x="320" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여러 노드가 동시에 읽고 씀</text>
<rect x="510" y="316" width="340" height="104" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="680" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">ReadOnlyMany</text>
<text x="680" y="372" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">ROX</text>
<text x="680" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여러 노드가 동시에 읽기 전용</text>
<text x="24" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">RWO: 다른 노드의 파드는 Multi-Attach 에러로 ContainerCreating · 같은 노드의 파드는 함께 씀</text>
<text x="24" y="468" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">RWOP: 단일 파드 제한 · 같은 노드라도 둘째 파드는 Pending</text>
<line x1="12" y1="494" x2="872" y2="494" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="516" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="506" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">파드로 좁힌다</text>
<rect x="235" y="506" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="257" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노드가 단위</text>
<rect x="357" y="506" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="379" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여럿이 함께</text>
</svg>
<title id="dt">같은 cat /tmp/ready 인데 실패 기록은 한쪽에만 남는다</title><desc id="dd">기동 20초 동안 파일이 없어 두 probe 다 실패할 명령인데, 이벤트에는 startup 실패 7건만 남고 liveness 실패는 0건이었다. liveness 가 그 구간에 아예 실행되지 않았기 때문이다.</desc>
<rect width="1000" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 06-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 cat /tmp/ready 인데 실패 기록은 한쪽에만 남는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">기동 실패는 startup 이 흡수하고, 뜬 뒤의 빠른 감지는 liveness 가 맡는 분업</text>
<rect x="24" y="104" width="952" height="436" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">활성 구간이 갈리므로 같은 명령이라도 한쪽에만 기록이 남는다</text>
<text x="240" y="196" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">0s</text>
<text x="416" y="196" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">10s</text>
<text x="592" y="196" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">20s</text>
<text x="768" y="196" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">30s</text>
<text x="944" y="196" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">40s</text>
<line x1="40" y1="212" x2="944" y2="212" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="224" y="286" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">startup</text>
<text x="224" y="304" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">period=3s</text>
<rect x="240" y="264" width="352" height="56" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="416" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">실패 7회 — 파일이 없다</text>
<text x="416" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">예산 10 안이라 RESTARTS 는 0</text>
<rect x="592" y="264" width="352" height="56" rx="6" fill="#8B98A912" stroke="#8B98A9" stroke-width="1.1" stroke-dasharray="6 5"/>
<text x="768" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">성공 후 손을 뗀다</text>
<text x="224" y="398" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">liveness</text>
<text x="224" y="416" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">period=5s</text>
<rect x="240" y="376" width="352" height="56" rx="6" fill="#8B98A912" stroke="#8B98A9" stroke-width="1.1" stroke-dasharray="6 5"/>
<text x="416" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">비활성 — 실행되지 않는다</text>
<text x="416" y="418" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">실패 이벤트 0건</text>
<rect x="592" y="376" width="352" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="768" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">5초마다 감시</text>
<path d="M 592 220 L 592 448" fill="none" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="6 5"/>
<rect x="442.0" y="227" width="300.0" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="592" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">/tmp/ready 생성 · startup 성공</text>
<text x="604" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">여기서 liveness 로 인계되고 READY 가 1/1 이 된다</text>
<text x="36" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">startup 의 실패 7건은 예산(failureThreshold 10) 안이라 '아직 뜨는 중'으로 취급돼 컨테이너를 죽이지 않았다</text>
<line x1="12" y1="556" x2="952" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="568" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">실패가 기록된 구간</text>
<rect x="274" y="568" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="296" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">감시 중</text>
<rect x="370" y="568" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="392" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">인계 시점</text>
</svg>
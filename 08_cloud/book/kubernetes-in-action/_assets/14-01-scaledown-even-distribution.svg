<title id="dt">몰린 노드의 것을 먼저 지운다</title><desc id="dd">5 벌을 3 벌로 줄일 때 어느 것을 지우느냐가 분산을 정한다. 복제본이 몰린 노드의 파드를 먼저 지우지 않으면 줄인 뒤에 한 노드에 3 벌이 남을 수 있다.</desc>

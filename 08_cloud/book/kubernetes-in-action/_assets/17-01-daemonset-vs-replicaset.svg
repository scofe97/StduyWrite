<title id="dt">replica 를 세느냐 노드를 세느냐</title><desc id="dd">ReplicaSet 은 정해진 개수를 맞추므로 어느 노드에 몇 개가 가든 상관하지 않는다. DaemonSet 은 노드마다 하나를 맞추므로 노드가 늘면 파드가 따라 는다.</desc>
<rect width="1220" height="676" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 17-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">replica 를 세느냐 노드를 세느냐</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">노드 셋 · replicas 3</text>

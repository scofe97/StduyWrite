<text x="160" y="516" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">노드가 늘면 따라 는다</text>
<text x="24" y="604" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 DaemonSet 에는 replicas 필드가 없다. 개수를 적을 자리가 아니라 어느 노드에 놓을지를 적는 자리(nodeSelector)가 있다.</text>
<line x1="12" y1="628" x2="1172" y2="628" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

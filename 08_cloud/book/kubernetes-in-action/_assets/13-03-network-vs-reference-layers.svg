<text x="587" y="504" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">기본은 막힌다</text>
<text x="587" y="530" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">backendRefs 에 적어도 ResolvedRefs 가 RefNotPermitted 로 False</text>
<text x="24" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">안 막으면 아무 네임스페이스에서 남의 팀 내부 전용 서비스를 backendRefs 에 적어 외부로 노출할 수 있다 — 그리고 소유자는 그 사실을 모른다.</text>

<title id="dt">통신은 되는데 참조는 막힌다</title><desc id="dd">트래픽이 안 흐르는 이유는 네트워크가 막혀서가 아니라 참조 권한이 없어서다. 두 사실이 층이 달라 서로를 설명해 주지 않는다.</desc>
<rect width="1180" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 13-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">통신은 되는데 참조는 막힌다</text>

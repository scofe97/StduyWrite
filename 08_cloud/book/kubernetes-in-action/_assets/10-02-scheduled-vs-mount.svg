<title id="dt">스케줄은 통과하고 마운트에서 걸린다</title><desc id="dd">스케줄러는 오브젝트에 적힌 선언을 본다. 그 경로가 그 노드에 실제로 있는지는 보지 않는다. 실재를 확인하는 것은 그 노드의 kubelet 이고, 그때는 이미 배정이 끝난 뒤다.</desc>
<rect width="1240" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 10-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스케줄은 통과하고 마운트에서 걸린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">node affinity 는 맞는데 경로가 없는 node-local PV</text>
<rect x="20" y="222" width="216" height="96" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="128" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">① PVC 가 PV 에 바인딩</text>
<text x="128" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">용량·모드·클래스가 맞았다</text>
<rect x="266" y="222" width="216" height="96" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="374" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">② 스케줄러가 노드를 고른다</text>
<text x="374" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">PV 의 node affinity 를 본다</text>
<rect x="512" y="222" width="216" height="96" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="620" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">③ PodScheduled: True</text>
<text x="620" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">선언상으로는 문제가 없다</text>
<rect x="758" y="222" width="216" height="96" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="866" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">④ kubelet 이 마운트 시도</text>
<text x="866" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">그 경로가 실제로 있는가</text>
<rect x="1004" y="222" width="216" height="96" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="1112" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">⑤ FailedMount</text>
<text x="1112" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">없다 — 여기서 처음 드러난다</text>
<path d="M 241 270 L 257 270" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 487 270 L 503 270" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 733 270 L 749 270" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 979 270 L 995 270" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 70 222 L 60 222 L 60 318 L 70 318" fill="none" stroke="#5E6B7E" stroke-width="1.2"/>
<line x1="60" y1="270.0" x2="76" y2="270.0" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="82" y="274.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">선언을 본다</text>
<text x="866" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">여기서부터 실재를 본다</text>
<text x="24" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 kubectl get po 의 STATUS 는 ContainerCreating 인데 conditions 에는 PodScheduled: True 가 남는다. 둘이 모순처럼 보이지만 서로 다른 것을 말하고 있다.</text>
<text x="24" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">09-02 의 hostPath type 검사 실패와 같은 모양이다 — 조건은 어느 단계까지 통과했는지를, 이벤트가 왜 멈췄는지를 말한다.</text>
<line x1="12" y1="504" x2="1192" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="526" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="516" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">통과한 단계</text>
<rect x="222" y="516" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="244" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">실재를 보는 자리</text>
<rect x="383" y="516" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="405" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">드러나는 지점</text>
</svg>
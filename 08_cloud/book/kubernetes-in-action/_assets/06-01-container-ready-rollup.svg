<title id="dt">컨테이너별 ready 가 모여야 Pod 전체 Ready 가 선다</title><desc id="dd">컨테이너 하나라도 ready=false 이면 AND 로 종합한 ContainersReady 가 False 가 되고, Pod 전체 Ready 도 False 가 되어 Service 가 이 Pod 로 트래픽을 보내지 않는다.</desc>
<rect width="1000" height="572" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 06-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">컨테이너별 ready 가 모여야 Pod 전체 Ready 가 선다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">하나라도 false 면 위로 전파된다 — READY 1/2 는 그 종합의 표시다</text>
<rect x="24" y="104" width="952" height="412" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">컨테이너 ready 는 각자의 readiness probe(06-02)가 정하고, 종합은 AND 다</text>
<text x="156" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">① 컨테이너별 ready</text>
<text x="480" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">② 종합 — AND</text>
<text x="800" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">③ Pod 전체</text>
<rect x="52" y="198" width="208" height="76" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="156" y="228" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">ready-ok</text>
<text x="156" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">readiness probe 통과</text>
<rect x="52" y="310" width="208" height="76" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="156" y="340" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">ready-fail</text>
<text x="156" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">readiness probe 실패</text>
<rect x="376" y="254" width="208" height="76" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="480" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">ContainersReady</text>
<text x="480" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">하나라도 false 면 False</text>
<rect x="696" y="254" width="208" height="76" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="800" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">Ready</text>
<text x="800" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">Service 가 트래픽을 안 보낸다</text>
<path d="M 266 236 L 300 236" fill="none" stroke="#3FB98C" stroke-width="1.4"/>
<path d="M 266 348 L 300 348" fill="none" stroke="#F0616D" stroke-width="1.4"/>
<path d="M 300 236 L 300 348" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<circle cx="300" cy="292" r="4" fill="#F5F5F3"/>
<path d="M 300 292 L 368 292" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="330.77" y="283" width="34.46" height="18" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="348" y="296" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">AND</text>
<path d="M 590 292 L 688 292" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="640" y="276" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">readiness gate</text>
<rect x="755.8" y="403" width="88.39999999999999" height="18" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="800" y="416" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">READY  1/2</text>
<path d="M 800 336 L 800 400" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.2" stroke-dasharray="4 5"/>
<text x="36" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">둘 다 ready=true 였다면 ContainersReady 도 Ready 도 True 가 되어 READY 2/2 가 되고, 그때만 Service 가 이 Pod 로 트래픽을 보낸다</text>
<line x1="12" y1="532" x2="952" y2="532" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="554" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="544" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">ready=true</text>
<rect x="274" y="544" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="296" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">ready=false 와 그 전파</text>
<rect x="552" y="544" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="574" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">본문이 짚는 자리</text>

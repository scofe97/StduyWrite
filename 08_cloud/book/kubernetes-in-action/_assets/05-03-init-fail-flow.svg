<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 786" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">init 이 exit 0 을 내야 문이 열린다</title><desc id="dd">init 컨테이너가 실패하면 쿠버네티스가 재시도하고, 반복 실패하면 CrashLoopBackOff 에 갇힌다. 그동안 주 컨테이너는 PodInitializing 인 채 시작조차 하지 못한다.</desc>
<rect width="1000" height="786" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 05-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">init 이 exit 0 을 내야 문이 열린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">죽은 init 의 로그는 남는다 — kubectl logs &lt;pod&gt; -c &lt;init 이름&gt; 으로 사인을 본다</text>
<rect x="24" y="104" width="952" height="626" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">문이 열리지 않으면 주 컨테이너는 기다리기만 한다 — Pod 는 살아 있고 로그도 남는다</text>
<rect x="80" y="184" width="240" height="80" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="200" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">init 컨테이너</text>
<text x="200" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">준비 작업을 수행한다</text>
<path d="M 200 326 L 296 372 L 200 418 L 104 372 Z" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="200" y="376" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">exit 0 인가?</text>
<rect x="440" y="332" width="240" height="80" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="560" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">주 컨테이너 시작</text>
<text x="560" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">다음 단계로 넘어간다</text>
<rect x="80" y="462" width="240" height="76" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="200" y="492" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">Init:Error</text>
<text x="200" y="516" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">쿠버네티스가 재시도한다</text>
<rect x="80" y="578" width="240" height="64" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="200" y="602" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">Init:CrashLoopBackOff</text>
<text x="200" y="626" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">반복 실패로 갇힌다</text>
<rect x="500" y="578" width="320" height="64" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="660" y="602" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">주 컨테이너 — waiting</text>
<text x="660" y="626" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">PodInitializing · 시작조차 못 한다</text>
<path d="M 200 270 L 200 316" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 302 372 L 430 372" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)"/>
<rect x="372.54" y="363" width="54.92" height="18" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="400" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">exit 0</text>
<path d="M 200 424 L 200 452" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)"/>
<rect x="240.54" y="439" width="54.92" height="18" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="268" y="452" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">exit 1</text>
<path d="M 200 544 L 200 568" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)"/>
<rect x="254.0" y="547" width="124.0" height="18" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="316" y="560" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">재시도해도 또 실패</text>
<path d="M 326 610 L 490 610" fill="none" stroke="#E3B341" stroke-width="1.6" marker-end="url(#warn)"/>
<path d="M 74 500 L 52 500 L 52 224 L 70 224" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)" stroke-dasharray="6 5"/>
<text x="60" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재시도</text>
<circle cx="880" cy="372" r="8" fill="none" stroke="#3FB98C" stroke-width="1.4"/>
<circle cx="880" cy="372" r="5" fill="#3FB98C"/>
<path d="M 686 372 L 868 372" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="36" y="682" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">정상 전이는 Init:0/2 → Init:1/2 → PodInitializing → Running 이고, 실패는 Init:Error → 재시도 → Init:CrashLoopBackOff 다.</text>
<text x="36" y="706" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">컨테이너가 죽어도 Pod 가 살아 있는 한 로그는 조회된다 — 사인을 찾을 때 먼저 볼 곳이다.</text>
<line x1="12" y1="746" x2="952" y2="746" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="768" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="758" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="768" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">준비 단계</text>
<rect x="209" y="758" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="231" y="768" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">문이 열린 뒤</text>
<rect x="344" y="758" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="366" y="768" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">실패 경로</text>
<rect x="453" y="758" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="475" y="768" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">갇힌 주 컨테이너</text>
<rect x="614" y="758" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="636" y="768" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">판정</text>
</svg>
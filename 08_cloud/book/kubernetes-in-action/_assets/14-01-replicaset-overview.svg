<title id="dt">개수를 맡는 쪽과 노출을 맡는 쪽</title><desc id="dd">ReplicaSet 은 원하는 수만큼 파드를 만들고 그 수를 유지할 뿐이다. 이 파드들을 하나의 대상으로 노출하는 일은 Service 가 맡는다. 그래서 한 서비스를 제공하는 파드 세트는 둘을 짝으로 둔다.</desc>
<rect width="1180" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 14-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">개수를 맡는 쪽과 노출을 맡는 쪽</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">kiada 서비스 · replicas 5</text>
<rect x="60" y="208" width="300" height="208" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="210" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">ReplicaSet</text>
<text x="84" y="274" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">replicas</text>
<text x="84" y="294" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">5</text>
<text x="84" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">selector</text>
<text x="84" y="338" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">app=kiada, rel=stable</text>
<text x="84" y="362" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">template</text>
<text x="84" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">Pod 템플릿 — 이름은 없다</text>
<rect x="470" y="190" width="260" height="244" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="600" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">파드 5 벌</text>
<rect x="500.0" y="237" width="200" height="26" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="600" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">kiada-a0x0</text>
<rect x="500.0" y="275" width="200" height="26" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="600" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">kiada-b1x1</text>
<rect x="500.0" y="313" width="200" height="26" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="600" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">kiada-c2x2</text>
<rect x="500.0" y="351" width="200" height="26" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="600" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">kiada-d3x3</text>
<rect x="500.0" y="389" width="200" height="26" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="600" y="406" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">kiada-e4x4</text>
<rect x="860" y="264" width="220" height="96" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="970" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">Service</text>
<text x="970" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">cluster IP 하나</text>
<path d="M 364 312 L 462 312" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)"/>
<text x="413" y="294" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">이만큼 만들고</text>
<text x="413" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">그 수를 유지한다</text>
<path d="M 858 312 L 740 312" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="799" y="294" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">하나로 묶어</text>
<text x="799" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">노출한다</text>
<rect x="470.0" y="448" width="260" height="28" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="600" y="467" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">노드가 죽어도 이 수를 지킨다</text>
<text x="24" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">파드를 하나만 띄울 때도 직접 만들기보다 ReplicaSet 으로 만드는 편이 낫다. 직접 만든 파드는 그 노드가 죽으면 다시 만들기 전까지 서비스가 멈춘다.</text>
<line x1="12" y1="528" x2="1132" y2="528" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="550" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="540" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="550" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">개수를 맡는다</text>
<rect x="235" y="540" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="257" y="550" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">파드</text>
<rect x="305" y="540" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="327" y="550" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">노출을 맡는다</text>
</svg>
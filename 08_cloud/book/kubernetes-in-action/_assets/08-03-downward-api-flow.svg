<title id="dt">값의 출처가 Pod 오브젝트 자신이다</title><desc id="dd">애플리케이션이 호출하는 REST 엔드포인트가 아니다. Pod 매니페스트의 metadata·spec·status 값을 컨테이너로 주입하는 방식이라 '아래로'라는 이름이 붙었다.</desc>
<rect width="1240" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 08-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">값의 출처가 Pod 오브젝트 자신이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">ConfigMap·Secret 주입과 골격이 같다 — 출처만 다르다</text>
<rect x="60" y="168" width="320" height="268" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="220" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Pod 오브젝트</text>
<rect x="80" y="223" width="280" height="54" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="220" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">metadata</text>
<text x="220" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">name · namespace · labels</text>
<rect x="80" y="291" width="280" height="54" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="220" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">spec</text>
<text x="220" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">nodeName · serviceAccountName</text>
<rect x="80" y="359" width="280" height="54" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="220" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">status</text>
<text x="220" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">podIP · hostIP</text>
<rect x="460" y="218" width="300" height="64" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="610" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">fieldRef</text>
<text x="610" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">Pod 의 일반 메타데이터</text>
<rect x="460" y="308" width="300" height="64" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="610" y="334" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">resourceFieldRef</text>
<text x="610" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">컨테이너의 CPU·메모리 제약</text>
<path d="M 362 290 L 416 290 L 416 262 L 452 262" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 362 350 L 416 350 L 416 340 L 452 340" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="610" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">valueFrom 아래 — configMapKeyRef 가 있던 그 자리</text>
<rect x="830" y="168" width="350" height="268" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="1005" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">컨테이너</text>
<rect x="855" y="231" width="300" height="62" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="1005" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">환경변수</text>
<text x="1005" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">POD_IP · NODE_NAME</text>
<rect x="855" y="335" width="300" height="62" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="1005" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">downwardAPI 볼륨</text>
<text x="1005" y="382" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">파일로도 받는다</text>
<path d="M 762 262 L 848 262" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 762 348 L 800 348 L 800 360 L 848 360" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="24" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이렇게 전달할 수밖에 없는 값이 두 부류다. 하나는 Pod 가 생성·스케줄링되기 전에는 알 수 없는 값 — Pod IP, 노드 이름, Pod 이름 자신이다.</text>
<text x="24" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">다른 하나는 매니페스트의 다른 곳에 이미 적힌 값이다. 컨테이너의 CPU·메모리 할당량이 그렇고, 직접 적으면 같은 값을 두 번 쓰게 된다.</text>
<line x1="12" y1="548" x2="1192" y2="548" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="570" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="560" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">값의 출처</text>
<rect x="209" y="560" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">주입 방식</text>
<rect x="318" y="560" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="340" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">받는 자리</text>
</svg>
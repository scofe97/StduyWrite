<title id="dt">인터페이스는 한 네임스페이스에만 속한다 — 그래서 옮긴다</title><desc id="dd">기본 네임스페이스에 두 개를 만들고, 새 네임스페이스로 옮기고, 표준 이름으로 바꾼 뒤, 그 안에서 프로세스를 실행한다. 프로세스는 그 두 개만 본다.</desc>
<rect width="1000" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 02-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인터페이스는 한 네임스페이스에만 속한다 — 그래서 옮긴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">네트워크 인터페이스만 봐서는 컨테이너인지 VM 인지 베어메탈인지 구별할 수 없다</text>

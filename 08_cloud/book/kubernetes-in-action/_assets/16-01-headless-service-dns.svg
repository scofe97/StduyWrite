<text x="24" y="596" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">③ 의 줄들이 안정된 네트워크 신원이다. 파드가 교체돼도 이름이 같으므로, 다른 멤버와 클라이언트가 번호로 특정 멤버를 부를 수 있다.</text>

<title id="dt">이름-IP 대응표에 줄이 늘어난다</title><desc id="dd">보통의 Service 는 줄이 하나뿐이고 그 하나가 가상 IP 를 가리킨다. headless 로 바꾸면 그 줄이 파드 IP 전부를 가리키고, StatefulSet 과 묶으면 파드마다 줄이 하나씩 더 생긴다.</desc>

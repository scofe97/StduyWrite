<title id="dt">장부에는 삭제 중, 컨테이너는 아직 돌고 있다</title><desc id="dd">노드와 연락이 끊겼는데 그 노드의 파드를 Terminating 으로 바꿀 수 있는 것은, 그 표시가 노드에서 일어나는 일이 아니기 때문이다. deletionTimestamp 는 etcd 안의 기록을 고치는 일이다.</desc>
<rect width="1260" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 14-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">장부에는 삭제 중, 컨테이너는 아직 돌고 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">노드 하나의 네트워크가 끊긴 뒤</text>
<rect x="24" y="100" width="1212" height="168" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">장부 — API 서버가 아는 것</text>
<rect x="120.0" y="176" width="567.0" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="403.5" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">Running — 아직 정상으로 센다</text>
<rect x="687.0" y="176" width="491.39999999999986" height="56" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="932.6999999999999" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">Terminating — deletionTimestamp 가 찍혔다</text>
<rect x="24" y="292" width="1212" height="168" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">실물 — 그 노드에서 실제로</text>
<rect x="120.0" y="368" width="1058.3999999999999" height="56" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="649.1999999999999" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">컨테이너가 계속 돈다 — kubelet 이 지시를 못 받는다</text>
<line x1="108.0" y1="480" x2="1194.3999999999999" y2="480" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="120.0" y1="475" x2="120.0" y2="485" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="120.0" y="502" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">0s</text>
<line x1="309.0" y1="475" x2="309.0" y2="485" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="309.0" y="502" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">100s</text>
<line x1="498.0" y1="475" x2="498.0" y2="485" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="498.0" y="502" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">200s</text>
<line x1="687.0" y1="475" x2="687.0" y2="485" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="687.0" y="502" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">300s</text>
<line x1="876.0" y1="475" x2="876.0" y2="485" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="876.0" y="502" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">400s</text>
<line x1="1065.0" y1="475" x2="1065.0" y2="485" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="1065.0" y="502" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">500s</text>
<line x1="120.0" y1="240" x2="120.0" y2="474" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="128.0" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">네트워크 차단</text>
<line x1="195.6" y1="240" x2="195.6" y2="474" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="203.6" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">Node NotReady</text>
<line x1="687.0" y1="240" x2="687.0" y2="474" stroke="#F08A59" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="695.0" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">taint 축출 · 대체 파드 생성</text>
<path d="M 195.6 521 L 195.6 528 L 687.0 528 L 687.0 521" fill="none" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="441.3" y="546" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">tolerationSeconds 300 — 기본값 5 분</text>
<text x="24" y="584" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 이 구간에 있는 파드를 없애는 길은 셋뿐이다 — Node 오브젝트를 지우거나, kubelet 이 응답을 재개해 스스로 정리하거나, 사용자가 강제 삭제하거나.</text>
<line x1="12" y1="604" x2="1212" y2="604" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="626" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="616" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="626" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">정상으로 셈</text>
<rect x="222" y="616" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="244" y="626" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">실제로 도는 중</text>
<rect x="370" y="616" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="392" y="626" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">삭제 표시</text>
</svg>
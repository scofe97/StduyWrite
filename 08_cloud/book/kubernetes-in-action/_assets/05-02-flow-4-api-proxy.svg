<title id="dt">방법 4 API 서버 프록시 — kubelet 을 건너뛴다</title><desc id="dd">kubectl get --raw 로 API 서버에 요청하면 API 서버가 직접 Pod 로 프록시한다. kubelet 이 경로에 없으므로 홉이 하나 줄고, 마지막으로 붙은 것은 API 서버다.</desc>
<rect width="1000" height="630" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 05-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">방법 4 API 서버 프록시 — kubelet 을 건너뛴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">추가 명령도 port-forward 설정도 필요 없다 — 덜 알려졌지만 빠르다</text>
<rect x="24" y="104" width="952" height="470" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">③ 과 같은 곳에서 출발하지만 kubelet 을 건너뛴다 — 그만큼 Client IP 가 달라진다</text>
<rect x="24" y="198" width="152" height="104" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="100" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">내 노트북</text>
<text x="100" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">kubectl get --raw</text>
<text x="100" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">원래 요청자</text>
<rect x="238" y="182" width="300" height="268" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="254" y="173" width="97" height="18" fill="#0D1117"/>
<text x="264" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">Control Plane</text>
<rect x="263" y="208" width="250" height="84" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="388" y="242" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">API 서버</text>
<text x="388" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">172.18.0.5 · Pod 로 프록시</text>
<rect x="263" y="356" width="250" height="64" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="388" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">etcd · 스케줄러</text>
<text x="388" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">무관</text>
<rect x="586" y="182" width="374" height="268" rx="8" fill="#3FB98C06" stroke="#3FB98C" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="602" y="173" width="224" height="18" fill="#0D1117"/>
<text x="612" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">Worker 노드 — kiada 를 호스팅하는 노드</text>
<rect x="628" y="208" width="290" height="72" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="773" y="226" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">kubelet</text>
<text x="773" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">경로에 없다</text>
<text x="773" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">건너뛴다</text>
<rect x="628" y="340" width="290" height="96" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="773" y="370" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">kiada Pod</text>
<text x="773" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10.244.2.5:8080</text>
<text x="773" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">응답에 Client IP 를 찍는다</text>
<path d="M 182 250 L 255 250" fill="none" stroke="#F08A59" stroke-width="2.0" marker-end="url(#acc)"/>
<rect x="207.59" y="241" width="20.82" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="218" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">①</text>
<path d="M 519 264 L 562 264 L 562 388 L 618 388" fill="none" stroke="#F08A59" stroke-width="2.0" marker-end="url(#acc)"/>
<rect x="551.59" y="317" width="20.82" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="562" y="330" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">②</text>
<line x1="36" y1="470" x2="964" y2="470" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">① 내 노트북 → API 서버   ② API 서버 → kiada Pod (kubelet 을 건너뛴다)</text>
<text x="36" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">마지막으로 kiada 에게 연결을 연 것 = API 서버</text>
<text x="36" y="548" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그래서 Client IP =</text>
<text x="180" y="548" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">172.18.0.5</text>
<text x="275" y="548" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">— 내 노트북은 한 홉 뒤라 보이지 않는다</text>
<line x1="12" y1="590" x2="952" y2="590" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="612" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="602" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="612" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">경로에 있는 것</text>
<rect x="248" y="602" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="270" y="612" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">kiada Pod</text>
<rect x="409" y="602" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="431" y="612" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">마지막 연결자와 그 경로</text>
</svg>
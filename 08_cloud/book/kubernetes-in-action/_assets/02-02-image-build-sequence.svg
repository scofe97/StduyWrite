<text x="24" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">CLI 는 빌드를 하지 않는다 — 컨텍스트를 넘기고 결과를 받을 뿐이다. 그래서 컨텍스트에 불필요한 파일이 있으면 그만큼 전송 비용이 든다.</text>

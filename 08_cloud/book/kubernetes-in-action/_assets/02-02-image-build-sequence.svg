<title id="dt">docker build 가 실제로 시키는 일</title><desc id="dd">docker build 는 CLI 가 직접 이미지를 만드는 것이 아니라 빌드 컨텍스트를 daemon 에 넘기고 결과를 돌려받는 절차다. 지시문 하나가 레이어 하나를 만들고, 마지막 이미지에 태그가 붙는다.</desc>
<rect width="1120" height="714" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 02-02</text>

<title id="dt">ImagePolicyWebhook 이 파드를 판정하는 길</title><desc id="dd">위 레인은 파드 생성 요청이 인증과 인가를 지나 ImagePolicyWebhook 에서 백엔드로 ImageReview 를 보내고 allowed 값에 따라 저장되거나 거절되는 흐름이고, 아래 레인은 연결이나 응답에 실패했을 때 defaultAllow 를 생략하거나 false 로 쓰면 거절하는 흐름이다.</desc>

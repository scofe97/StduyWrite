<title id="dt">열린 포트를 찾아 닫는 순서</title><desc id="dd">ss 로 열린 포트와 프로세스를 찾고, systemctl 로 서비스를 끄고, apt 로 패키지를 지운 뒤 ss 로 다시 확인하는 절차와, 서비스를 없앨 수 없을 때 ufw 로 막는 가지를 그린 도식이다.</desc>
<rect width="880" height="356" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 04-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">열린 포트를 찾아 닫는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">서비스를 없앨 수 있으면 패키지까지 지우고, 없앨 수 없으면 방화벽으로 막습니다</text>
<rect x="12" y="100" width="150" height="84" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="87.0" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">포트 찾기</text>
<text x="87.0" y="160" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ss -ltpn</text>
<path d="M 164 142.0 L 182 142.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="184" y="100" width="150" height="84" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="259.0" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">프로세스 확인</text>
<text x="259.0" y="160" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">systemctl status</text>
<path d="M 336 142.0 L 354 142.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="356" y="100" width="150" height="84" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="431.0" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">서비스 끄기</text>
<text x="431.0" y="160" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">disable --now</text>
<path d="M 508 142.0 L 526 142.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="528" y="100" width="150" height="84" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="603.0" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">패키지 지우기</text>
<text x="603.0" y="160" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">apt purge</text>
<path d="M 680 142.0 L 698 142.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="700" y="100" width="150" height="84" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="775.0" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">다시 확인</text>
<text x="775.0" y="160" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ss -ltpn</text>
<rect x="356" y="238" width="322" height="60" rx="6" fill="#161B22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="517.0" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">방화벽으로 막기</text>
<text x="517.0" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ufw default deny incoming · ufw allow 22/tcp</text>
<path d="M 259.0 186 L 259.0 268 L 354 268" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)" stroke-dasharray="4 4"/>
<rect x="186.0" y="204" width="146.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="259.0" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">없앨 수 없는 서비스</text>
<line x1="12" y1="312" x2="832" y2="312" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="334" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="324" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">확인</text>
<rect x="170" y="324" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="192" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">닫는 조치</text>
<rect x="279" y="324" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="301" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">닫힌 것을 확인</text>
</svg>
<title id="dt">mTLS 로 서로 확인하는 순서</title><desc id="dd">파드 A 가 파드 B 에 연결하면 B 가 자기 인증서와 A 의 인증서 요구를 함께 보내 A 가 CA 서명을 확인하고, A 가 인증서를 보내 B 가 같은 확인을 거친 뒤 암호화된 통신이 시작되는 순서를 두 파드 레인으로 그린 시퀀스 도식이다.</desc>
<rect width="880" height="564" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 05-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">mTLS 로 서로 확인하는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">서버만 증명하는 TLS 와 달리 mTLS 는 클라이언트도 증명해야 연결이 이어집니다</text>
<rect x="24.0" y="104" width="220" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="134.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">파드 A</text>
<text x="134.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">클라이언트 · 인증서 보유</text>
<rect x="612.0" y="104" width="220" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="722.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">파드 B</text>
<text x="722.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">서버 · 인증서 보유</text>
<line x1="134.0" y1="154" x2="134.0" y2="500" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="722.0" y1="154" x2="722.0" y2="500" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 144.0 196 L 710.0 196" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="428.0" y="187" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">연결 요청</text>

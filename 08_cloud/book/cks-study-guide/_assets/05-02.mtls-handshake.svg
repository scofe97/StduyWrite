<text x="428.0" y="378" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">A 의 신원과 공개키</text>
<rect x="638.0" y="400" width="168" height="24" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="722.0" y="417" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">CA 서명 확인</text>
<path d="M 144.0 468 L 710.0 468" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>

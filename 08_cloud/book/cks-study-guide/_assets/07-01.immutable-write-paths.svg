<text x="147.0" y="414" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ConfigMap · Secret</text>
<path d="M 268 398.0 L 306 398.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="308" y="368" width="238" height="60" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="427.0" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">볼륨 마운트</text>
<text x="427.0" y="414" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">이미지 밖의 원본</text>
<path d="M 548 398.0 L 586 398.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="588" y="368" width="238" height="60" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>

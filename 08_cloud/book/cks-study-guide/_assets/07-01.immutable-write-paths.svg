<title id="dt">읽기 전용 루트 파일 시스템에서 쓰기가 거부되거나 허용되는 경로</title><desc id="dd">첫째 레인은 공격자의 쓰기가 읽기 전용 루트 파일 시스템에서 Read-only file system 으로 거부되는 흐름이고, 둘째 레인은 앱이 쓰는 /var/cache/nginx 에 emptyDir 를 붙여 그 경로만 허용하는 흐름이며, 셋째 레인은 설정을 ConfigMap 이나 Secret 볼륨으로 이미지 밖에서 넣어 이미지를 바꾸지 않는 흐름이다.</desc>
<rect width="880" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 07-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">읽기 전용 루트 파일 시스템에서 쓰기가 거부되거나 허용되는 경로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">루트는 읽기 전용으로 잠그고, 쓸 자리와 설정은 볼륨으로 따로 엽니다</text>
<rect x="12" y="96" width="856" height="108" rx="8" fill="#5E6B7E0A" stroke="#5E6B7E" stroke-width="0.9"/>
<text x="24" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">공격자가 쓸 때</text>
<rect x="28" y="128" width="238" height="60" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="147.0" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">공격자의 쓰기</text>
<text x="147.0" y="174" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">touch /x</text>
<path d="M 268 158.0 L 306 158.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="308" y="128" width="238" height="60" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="427.0" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">읽기 전용 루트</text>
<text x="427.0" y="174" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">readOnlyRootFilesystem: true</text>
<path d="M 548 158.0 L 586 158.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="588" y="128" width="238" height="60" rx="6" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="707.0" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">쓰기 거부</text>
<text x="707.0" y="174" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Read-only file system</text>

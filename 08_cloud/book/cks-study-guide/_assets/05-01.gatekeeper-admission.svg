<title id="dt">Gatekeeper 정책이 요청을 막는 길</title><desc id="dd">위 레인은 ConstraintTemplate 에서 CRD 가 만들어지고 Constraint 객체가 생기는 정책 등록 순서이고, 아래 레인은 kubectl 요청이 인증, 인가를 지나 Gatekeeper 웹훅에서 허용 또는 거절되는 요청 판정 순서이다.</desc>

<title id="dt">요청이 거치는 세 관문</title><desc id="dd">클라이언트 요청이 kube-apiserver 에서 인증, 인가, 어드미션 컨트롤을 차례로 통과해 검증을 거친 뒤 etcd 에 저장되는 순서와 각 관문에서 거절될 때의 결과를 그린 흐름도다.</desc>
<rect width="880" height="392" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 03-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">요청이 거치는 세 관문</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">어느 관문에서 막혀도 요청은 저장소에 닿지 못합니다</text>

<text x="110.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Pod 생성 요청</text>
<text x="110.0" y="226" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">kubectl apply</text>
<rect x="250" y="172" width="212" height="72" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="356.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">PodSecurity 어드미션</text>

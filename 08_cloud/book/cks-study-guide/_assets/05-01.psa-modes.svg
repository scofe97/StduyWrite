<title id="dt">위반 파드가 모드별로 처리되는 길</title><desc id="dd">파드 생성 요청이 PodSecurity 어드미션에서 네임스페이스 레이블을 만나 enforce, audit, warn 중 걸린 모드마다 갈라지는 도식이다. enforce 는 파드를 거절하고 audit 은 감사 로그에 기록하며 warn 은 사용자에게 경고한다.</desc>
<rect width="880" height="392" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 05-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">위반 파드가 모드별로 처리되는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">네임스페이스에 건 모드마다 따로 검사해 거절·감사 기록·경고를 함께 낼 수 있습니다</text>

<title id="dt">Trivy 가 이미지에서 취약점을 찾는 길</title><desc id="dd">위 레인은 trivy image 명령이 이미지에서 패키지 목록을 뽑아 취약점 DB 와 대조하고 결과 표를 내는 스캔 흐름이고, 아래 레인은 결과 표에서 심각도와 고친 버전을 읽고 이미지를 교체하거나 파드를 지우는 결과 읽기 흐름이다.</desc>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">층마다 줄이는 대상이 다르고 앞 층이 뚫려도 뒤 층이 피해 범위를 좁힙니다</text>

<title id="dt">노드를 굳히는 네 층</title><desc id="dd">패키지와 서비스, 계정과 권한, 포트와 방화벽, 커널 도구의 네 층이 각각 무엇을 줄이고 어떤 명령을 쓰는지 나란히 보인 도식이다.</desc>
<rect width="880" height="330" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 04-01 SUMMARY</text>

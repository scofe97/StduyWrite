<title id="dt">TLS 종료 지점과 암호화 경계</title><desc id="dd">클라이언트에서 Ingress 컨트롤러까지는 HTTPS 443 으로 오가고, 컨트롤러가 인증서와 키로 TLS 를 끝낸 뒤 Service 와 Pod 까지는 평문 HTTP 80 으로 전달되는 경로를 그린 구조도다.</desc>

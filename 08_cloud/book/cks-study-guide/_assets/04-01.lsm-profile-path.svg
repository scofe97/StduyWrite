<title id="dt">프로파일이 파드에 닿는 길</title><desc id="dd">AppArmor 와 seccomp 두 레인에서 프로파일 파일을 만들고, 노드에 두거나 적재하고, 파드 매니페스트가 가리키고, 컨테이너 시작 때 커널이 적용하는 네 단계를 같은 열에 맞춰 그린 도식이다.</desc>
<rect width="880" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로파일이 파드에 닿는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 도구 모두 프로파일을 노드에 먼저 두고 파드는 이름이나 상대 경로로 가리키기만 합니다</text>

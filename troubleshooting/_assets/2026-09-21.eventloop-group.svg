<title id="dt">루프 하나가 소켓 여럿을 맡고, 그 루프가 여러 개 묶입니다</title><desc id="dd">Netty 의 이벤트 루프는 스레드 하나가 소켓 여럿의 입출력을 돌아가며 처리하는 구조다. 그 루프를 여럿 묶은 것이 그룹이고, 그룹은 클라이언트의 리소스 묶음이 갖는다. 묶음을 여러 벌 만들면 가장 안쪽 스레드 수가 그만큼 곱해진다.</desc>
<rect width="920" height="464" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING CONCEPT · NETTY EVENT LOOP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">루프 하나가 소켓 여럿을 맡고, 그 루프가 여러 개 묶입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">스레드가 늘면 malloc 의 arena 도 함께 늘어납니다</text>
<rect x="24" y="96" width="560" height="296" rx="8" fill="none" stroke="#F5F5F330" stroke-width="1.0"/>
<rect x="56" y="136" width="496" height="240" rx="8" fill="none" stroke="#F5F5F344" stroke-width="1.0"/>
<rect x="88" y="176" width="432" height="184" rx="8" fill="none" stroke="#F5F5F358" stroke-width="1.0"/>
<rect x="120" y="216" width="368" height="128" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="40" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">자바 프로세스</text>
<text x="72" y="160" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">리소스 묶음 · ClientResources</text>
<text x="104" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">이벤트 루프 그룹 · EventLoopGroup</text>
<text x="136" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">이벤트 루프 하나 = 스레드 하나</text>
<text x="136" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">소켓 여럿을 돌아가며 처리</text>
<text x="136" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">힙 바깥 버퍼를 직접 다룬다</text>
<rect x="640" y="104" width="256" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="660" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">묶음 한 벌</text>
<text x="660" y="154" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그룹 1 × 루프 n</text>
<rect x="640" y="196" width="256" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="660" y="224" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">묶음 세 벌</text>
<text x="660" y="246" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그룹 3 × 루프 n</text>
<rect x="640" y="288" width="256" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="660" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">에이전트가 더하는 몫</text>
<text x="660" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">계측 스레드와 할당 경로</text>
<line x1="12" y1="408" x2="872" y2="408" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="430" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="420" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가장 안쪽 = 스레드</text>
<rect x="287" y="420" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="309" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한 벌일 때</text>
<rect x="409" y="420" width="14" height="12" rx="2" fill="#F5F5F322" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="431" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">겹의 경계</text>
</svg>
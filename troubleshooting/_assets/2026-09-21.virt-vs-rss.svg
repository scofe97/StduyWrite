<title id="dt">표시만 해 둔 양과 실제로 붙은 양</title><desc id="dd">프로세스가 주소 공간을 잡아 달라고 하면 커널은 표시만 하고 물리 페이지는 붙이지 않는다. 그 주소에 값을 쓰는 순간 페이지가 붙고 그때부터 RSS 에 들어간다. 컨테이너 한도와 비교되는 것은 아래쪽 값이다.</desc>
<rect width="920" height="360" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING CONCEPT · VIRT AND RSS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">표시만 해 둔 양과 실제로 붙은 양</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 프로세스인데 위는 2.0 GB, 아래는 100 MB 입니다</text>
<text x="48" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">주소 공간에 표시</text>
<text x="48" y="172" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">VIRT · VSZ</text>
<rect x="264" y="128" width="600" height="52" rx="4" fill="none" stroke="#8B98A9" stroke-width="1.0" stroke-dasharray="5,4"/>
<text x="848" y="160" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">2.0 GB</text>
<text x="48" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">물리 페이지가 붙음</text>
<text x="48" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">RSS · RES · VmRSS</text>
<rect x="264" y="216" width="30" height="52" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="310" y="248" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">100 MB</text>
<rect x="701.0" y="238" width="134.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="768" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">한도와 비교되는 쪽</text>
<line x1="12" y1="296" x2="872" y2="296" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="308" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="122" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">표시만 된 자리</text>
<rect x="248" y="308" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="270" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">페이지가 붙은 양</text>
<rect x="409" y="308" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="431" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한도가 보는 값</text>
</svg>
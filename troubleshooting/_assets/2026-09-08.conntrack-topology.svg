<title id="dt">요청이 지나는 경로</title><desc id="dd">집계 서비스가 HAProxy 를 거쳐 하위 서비스로 나가는 구조. 가운데 노드 경계 안에 커널 conntrack 장부가 있고, 나가는 흐름은 모두 여기에 기록된다. 샤딩으로 오른쪽 대상이 두 배가 됐고 사양 축소로 장부는 줄었다.</desc>
<rect width="800" height="446" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-08 A</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">요청이 지나는 경로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바뀐 것은 양 끝이고 줄어든 것은 가운데입니다</text>
<rect x="40" y="108" width="470" height="226" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="54" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">노드 한 대</text>
<text x="54" y="146" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">사양 절반으로 축소</text>
<rect x="68" y="166" width="170" height="62" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="153" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">집계 서비스</text>
<text x="153" y="212" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">10,000 req/s · x4</text>
<rect x="298" y="166" width="170" height="62" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="383" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">HAProxy</text>
<text x="383" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">리셋 카운트 상승</text>
<path d="M 238 197 L 294 197" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>

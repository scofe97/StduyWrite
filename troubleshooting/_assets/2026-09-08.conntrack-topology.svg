<text x="549.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">커넥션</text>
<text x="54" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">나가는 흐름도 장부에 한 줄씩 오릅니다. 대상이 늘면 줄 수가 늘어납니다.</text>

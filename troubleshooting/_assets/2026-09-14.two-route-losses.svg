<title id="dt">두 번의 소실은 성격이 다릅니다</title><desc id="dd">워커 1 의 라우팅 표를 세 시점으로 놓았다. 업그레이드 중인 컨트롤 플레인 노드가 내려가면 그 노드로 가는 줄 하나가 빠지고 나머지는 그대로다. 라벨이 사라져 반사기와의 세션이 끊기면 그 세션으로 배운 줄이 한꺼번에 걷혀 자기 Pod 대역만 남는다.</desc>

<title id="dt">패킷은 언제 어느 자리를 지나는가</title><desc id="dd">들어오는 패킷 하나가 회선에서 애플리케이션까지 가며 만나는 관문들. 관문마다 상한이 있고 넘치면 오른쪽으로 조용히 빠진다. conntrack 은 두 번 개입한다 — 앞에서 조회하고, 맨 끝에서야 장부에 올린다.</desc>
<rect width="800" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-08 A</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">패킷은 언제 어느 자리를 지나는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">장부에 오르는 시점은 조회 시점이 아닙니다</text>

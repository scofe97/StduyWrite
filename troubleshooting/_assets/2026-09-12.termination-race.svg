<title id="dt">종료는 두 갈래로 동시에 갑니다</title><desc id="dd">kubelet 이 컨테이너를 내리는 일과 컨트롤 플레인이 EndpointSlice 에서 빼는 일은 동시에 시작되고 서로를 기다리지 않는다. 앱이 먼저 죽고 전파가 늦으면 그 틈이 502 가 된다.</desc>
<rect width="840" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-12 B</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">종료는 두 갈래로 동시에 갑니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽이 신호 갈래, 오른쪽이 전파 갈래입니다. 둘은 서로 신호를 주고받지 않습니다.</text>
<rect x="24.0" y="118" width="172" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="110.0" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">컨트롤 플레인</text>
<text x="110.0" y="155" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">EndpointSlice</text>
<rect x="222.66666666666663" y="118" width="172" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="308.66666666666663" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">kubelet</text>
<text x="308.66666666666663" y="155" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">노드</text>
<rect x="421.3333333333333" y="118" width="172" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="507.3333333333333" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">셸 PID 1</text>
<text x="507.3333333333333" y="155" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">sh -c</text>
<rect x="620.0" y="118" width="172" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="706.0" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">앱</text>
<text x="706.0" y="155" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">java · 8080</text>
<line x1="110.0" y1="168" x2="110.0" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="308.66666666666663" y1="168" x2="308.66666666666663" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="507.3333333333333" y1="168" x2="507.3333333333333" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="706.0" y1="168" x2="706.0" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 318.66666666666663 190 L 495.3333333333333 190" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="408.0" y="181" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">SIGTERM</text>
<text x="408.0" y="207" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">PID 1 에게만 보냅니다</text>
<path d="M 120.0 190 L 296.66666666666663 190" fill="none" stroke="#5E6B7E" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4 4"/>
<text x="209.33333333333331" y="181" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">Pod 제거 평가</text>
<text x="209.33333333333331" y="207" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 시각에 시작됩니다</text>
<rect x="484.3333333333333" y="250" width="46.0" height="20" rx="4" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="507.3333333333333" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">셸 종료</text>
<text x="599.3333333333333" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">자식에게 전달하지 않습니다</text>
<path d="M 517.3333333333333 320 L 694.0 320" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="606.6666666666666" y="311" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">SIGKILL</text>
<text x="606.6666666666666" y="337" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">PID 1 이 죽으면 커널이 정리합니다</text>
<rect x="690.0" y="366" width="32.0" height="20" rx="4" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="706.0" y="380" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">즉사</text>
<text x="604.0" y="380" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">graceful 코드는 호출되지 않습니다</text>
<text x="110.0" y="376" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">전파는 아직 진행 중</text>
<path d="M 120.0 440 L 694.0 440" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="3 5"/>
<text x="408.0" y="431" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">이 구간의 요청</text>
<text x="408.0" y="457" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프록시는 살아 있고 8080 은 비었습니다 → connection refused → 502</text>
<text x="420" y="596" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">preStop 의 sleep 은 왼쪽 갈래를 늦춰 오른쪽이 끝날 시간을 법니다</text>
<text x="420" y="620" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그 sleep 동안 kubelet 은 SIGTERM 을 아직 보내지 않습니다</text>
</svg>
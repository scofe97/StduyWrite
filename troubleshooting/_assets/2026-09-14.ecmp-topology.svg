<title id="dt">주소 하나를 서버 셋이 나눠 받습니다</title><desc id="dd">IPv6 를 IPv4 터널로 실어 오는 사용자가 인터넷과 경로 중간 라우터를 지나 데이터센터에 닿는다. 서버 셋은 같은 서비스 주소를 내부 BGP 로 광고하고, 경로 비용이 같아진 뒤로 데이터센터 라우터가 TCP 흐름마다 네 값을 해시해 서버 하나를 고른다.</desc>
<rect width="920" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-14 A</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">주소 하나를 서버 셋이 나눠 받습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">지난주 경로 비용을 같게 맞춘 뒤로 데이터센터 라우터가 흐름마다 서버를 고릅니다</text>

<title id="dt">STW 안에 무엇이 들어 있나</title><desc id="dd">관측된 멈춤 1.59초를 구간으로 가른 그림. 실제 수집은 0.12초이고 나머지 1.47초는 GC 로그를 쓰는 write() 가 커널에서 막힌 시간이다. 멈춤을 풀기 전에 로그를 쓰므로 그 대기가 STW 에 포함되고, 로그에는 합계가 GC 멈춤으로 기록된다.</desc>
<rect width="800" height="424" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-09 E</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">STW 안에 무엇이 들어 있나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">GC 가 오래 걸린 것이 아니라 로그를 쓰다 막혔습니다</text>
<text x="134" y="142" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">배경 부하 없음</text>
<rect x="150" y="122" width="42.264150943396224" height="32" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="204.26415094339623" y="143" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">0.25초 미만 — 정상</text>
<text x="134" y="210" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">배경 150MB/s 쓰기</text>
<rect x="150" y="190" width="42.264150943396224" height="32" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="171.1320754716981" y="211" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">0.12</text>
<rect x="192.26415094339623" y="190" width="517.7358490566038" height="32" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="451.13207547169816" y="211" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">1.47초 — write() 가 커널에서 막힘</text>
<line x1="150" y1="234" x2="710" y2="234" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="430.0" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">GC 로그에는 이 합계가 STW 1.59초로 기록됩니다</text>
<text x="134" y="292" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">구간</text>
<text x="150" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">실제 수집 작업</text>
<text x="300" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">로그 쓰기 대기</text>
<text x="12" y="330" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">막히는 이유는 둘입니다. OS 가 내려쓰는 중인 페이지에 다시 쓰려면 기다리고(stable page write),</text>
<text x="12" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">저널링 파일시스템은 새 블록 할당 시 저널 커밋이 끝나야 write() 가 반환됩니다.</text>
<line x1="12" y1="384" x2="752" y2="384" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="406" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="396" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">로그 쓰기가 잡아먹은 시간</text>
<rect x="326" y="396" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="348" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실제 수집</text>
</svg>
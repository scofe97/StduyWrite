<title id="dt">대역과 노드와 Pod</title><desc id="dd">GKE VPC 네이티브 모드에서 Pod 대역 /16 을 잡아 두었고 노드당 Pod 최대치는 110 이다. 노드는 그 대역 안에서 자기 몫을 받아 가고, Pod 는 그 몫 안에서 주소를 받는다.</desc>
<rect width="820" height="408" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-09 D</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">대역과 노드와 Pod</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">문서의 최대치는 Pod 수를 말하지 클러스터 상한을 말하지 않습니다</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 668" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">같은 락 대기, 갈리는 두 경로</title><desc id="dd">가상 스레드가 lock() 에서 기다릴 때 synchronized 블록 밖이면 캐리어에서 내려와 자리를 비우고, 안이면 내려오지 못해 캐리어를 붙든 채 멈춘다. 캐리어 4개가 모두 이렇게 묶이면 락이 풀려도 다음 차례가 올라탈 자리가 없다.</desc>
<rect width="880" height="668" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-10 E</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 락 대기, 갈리는 두 경로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">synchronized 블록 안이냐 밖이냐가 캐리어를 놓느냐를 가릅니다.</text>
<rect x="260" y="100" width="360" height="48" rx="24" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="440" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">가상 스레드가 lock() 에서 기다림</text>
<path d="M 440 148 L 440 176" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="440,180 610,236 440,292 270,236" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="440" y="241" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">synchronized 블록 안인가?</text>
<path d="M 270 236 L 196 236 L 196 324" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 610 236 L 684 236 L 684 324" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="184" y="292" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">아니오 · 블록 밖</text>
<text x="696" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">예 · 블록 안</text>
<rect x="52" y="324" width="288" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="68" y="351" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">캐리어에서 내려옴</text>
<text x="68" y="373" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">park · unmount</text>
<path d="M 196 388 L 196 420" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="52" y="420" width="288" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="68" y="447" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">다른 가상 스레드가 올라탐</text>
<text x="68" y="469" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">캐리어 재사용</text>
<path d="M 196 484 L 196 516" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="52" y="516" width="288" height="64" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="68" y="543" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">캐리어가 남으면 다시 올라타 진행</text>
<text x="68" y="565" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">자리가 돌아 처리량 유지</text>
<rect x="540" y="324" width="288" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="556" y="351" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">내려오지 못함</text>
<text x="556" y="373" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">pinned · 캐리어 붙든 채 park</text>
<path d="M 684 388 L 684 420" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="540" y="420" width="288" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="556" y="447" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">캐리어 4개가 전부 묶임</text>
<text x="556" y="469" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">4 vCPU → 캐리어 4개</text>
<path d="M 684 484 L 684 516" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="540" y="516" width="288" height="64" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="556" y="543" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">다음 차례가 올라탈 자리 없음</text>
<text x="556" y="565" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">락은 비었는데 아무도 못 가져감</text>
<line x1="12" y1="600" x2="832" y2="600" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="440" y="628" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">새 요청의 가상 스레드는 한 줄도 못 돌고 소켓을 쥔 채 쌓입니다 — CLOSE_WAIT 4127</text>
<text x="440" y="652" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">원이 어떻게 닫히는지는 '왜 스스로 풀리지 않는가' 그림이 봅니다.</text>
</svg>
<title id="dt">기다리는 대상이 자기 실행 수단입니다</title><desc id="dd">가상 스레드는 블로킹할 때 캐리어에서 내려와 자리를 내준다. synchronized 안에서는 내려오지 못해 캐리어를 붙든 채 멈춘다. 그 I/O 를 끝낼 작업도 캐리어가 있어야 도는데, 남은 캐리어가 없어 서로를 영원히 기다린다.</desc>
<rect width="840" height="612" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-10 E</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">기다리는 대상이 자기 실행 수단입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽이 정상 경로, 오른쪽이 이 사고의 경로입니다.</text>
<text x="195.0" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">ReentrantLock · 정상</text>
<rect x="52" y="152" width="286" height="62" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="68" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">가상 스레드가 블로킹</text>
<text x="68" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">lock() 안에서 대기</text>
<path d="M 195.0 214 L 195.0 238" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="52" y="238" width="286" height="62" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="68" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">캐리어에서 내려옴</text>
<text x="68" y="284" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">unmount</text>
<path d="M 195.0 300 L 195.0 324" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="52" y="324" width="286" height="62" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="68" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">다른 가상 스레드가 올라탐</text>
<text x="68" y="370" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">캐리어 재사용</text>
<text x="195.0" y="420" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">자리가 돌아 처리량이 유지됩니다</text>
<text x="645.0" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">synchronized · 이 사고</text>
<rect x="502" y="152" width="286" height="62" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="518" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">가상 스레드가 블로킹</text>
<text x="518" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">synchronized 안에서 I/O 대기</text>
<path d="M 645.0 214 L 645.0 238" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="502" y="238" width="286" height="62" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="518" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">내려오지 못함</text>
<text x="518" y="284" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">pinned — 캐리어 점유 유지</text>
<path d="M 645.0 300 L 645.0 324" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="502" y="324" width="286" height="62" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="518" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">캐리어가 전부 소진</text>
<text x="518" y="370" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">새 가상 스레드는 대기열에</text>
<text x="645.0" y="420" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">그 I/O 를 끝낼 작업도 캐리어가 필요합니다</text>
<path d="M 514 436 C 468 436 468 182 494 182" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5 5"/>
<text x="462" y="281.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">영원히</text>
<text x="420" y="480" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">CPU 는 0.7% 입니다 — 캐리어는 점유돼 있으나 일하고 있지 않습니다</text>
<text x="420" y="504" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">부하가 빠져도 안 풀립니다. 재시작만이 답이고, CLOSE_WAIT 는 그 결과로 쌓입니다.</text>
</svg>
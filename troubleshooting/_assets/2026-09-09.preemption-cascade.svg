<title id="dt">설정을 빠뜨린 쪽이 더 높아졌습니다</title><desc id="dd">우선순위 클래스를 도입해도 이미 떠 있던 Pod 에는 소급되지 않는다. 그래서 기존 운영은 0 에 남고, 설정을 빠뜨린 신규는 globalDefault 가 채워 medium 을 받는다. 자원이 부족하면 높은 쪽이 낮은 쪽을 밀어내고, 부활한 Pod 가 또 동료를 민다.</desc>
<rect width="800" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-09 B</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">설정을 빠뜨린 쪽이 더 높아졌습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">globalDefault 는 이미 떠 있는 Pod 에 소급되지 않습니다</text>
<rect x="28" y="108" width="340" height="92" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="46" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">기존 운영 인스턴스</text>
<text x="46" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">클래스 생기기 전에 생성</text>
<text x="46" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">priorityClassName 없음  →  우선순위 0</text>
<rect x="432" y="108" width="340" height="92" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="450" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">새로 배포한 한 벌</text>
<text x="450" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">매니페스트에 설정을 빠뜨림</text>
<text x="450" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">globalDefault 가 채움  →  medium</text>
<text x="400" y="94" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">같은 자원 풀</text>
<text x="28" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">자원이 부족하면 높은 쪽이 낮은 쪽을 밀어냅니다</text>
<rect x="28" y="258" width="172" height="46" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="114.0" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">medium 이 자리를 못 찾음</text>
<path d="M 200 281 L 212 281" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="216" y="258" width="172" height="46" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="302.0" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">0 짜리 운영 Pod 를 선점</text>
<path d="M 388 281 L 400 281" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="404" y="258" width="172" height="46" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="490.0" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">컨트롤러가 다시 만듦</text>
<text x="490.0" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">이제 medium</text>
<path d="M 576 281 L 588 281" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="592" y="258" width="172" height="46" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="678.0" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">또 다른 0 을 선점</text>
<path d="M 678.0 304 L 678.0 324 L 114.0 324 L 114.0 308" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)" stroke-dasharray="4 3"/>
<text x="400" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">자원 총량은 그대로라 계속 돕니다</text>
<rect x="28" y="380" width="744" height="62" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="46" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">상태를 들고 있는 서비스라 종료 중인 인스턴스에는 쓸 수 없습니다</text>
<text x="46" y="426" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">쓸 수 있는 인스턴스가 남지 않아 30분간 쓰기가 멈췄습니다 · PodDisruptionBudget 은 선점을 막지 못합니다</text>
<line x1="12" y1="478" x2="752" y2="478" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="500" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="490" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정을 빠뜨렸는데 더 높아진 쪽</text>
<rect x="365" y="490" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="387" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">밀려나는 쪽</text>
</svg>
<title id="dt">작은 실패가 전면 장애가 되기까지</title><desc id="dd">핵심이 아닌 하위 서비스 하나의 타임아웃이 클러스터 전체 이름 해석을 무너뜨린 경로. 단계마다 배수가 곱해지고, 마지막이 처음으로 되돌아와 스스로를 먹여 살린다. 강조된 CoreDNS 가 끊어진 지점이자 복구가 이뤄진 지점이다.</desc>
<rect width="800" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-08 B</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">작은 실패가 전면 장애가 되기까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">아무도 큰 실수를 하지 않았고 흔한 기본값들이 곱해졌습니다</text>
<rect x="214" y="112" width="320" height="54" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="230" y="135" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">부가 정보 서비스 타임아웃</text>
<text x="230" y="153" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">없어도 되는 의존 하나</text>
<path d="M 374.0 166 L 374.0 181" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>

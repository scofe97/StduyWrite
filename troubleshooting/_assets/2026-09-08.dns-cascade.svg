<text x="230" y="585" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">모든 Pod 가 공유하는 하나</text>
<path d="M 214 571.0 L 188 571.0 L 188 211.0 L 211 211.0" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)" stroke-dasharray="4 3"/>
<text x="176" y="391.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#F0616D" transform="rotate(-90 176 391.0)">이름을 못 찾아 404 가 늘어납니다</text>
<line x1="12" y1="606" x2="752" y2="606" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="628" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

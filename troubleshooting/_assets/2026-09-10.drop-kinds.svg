<title id="dt">드롭은 두 종류입니다</title><desc id="dd">인터페이스 드롭 카운터가 오른다고 포화는 아니다. 커널 문서는 rx_dropped 를 "지원하지 않는 프로토콜" 쪽에 두고, 버퍼 고갈은 포함하지 않아야 한다고 못 박는다. 앱이 멀쩡한지 아픈지가 두 종류를 가르는 첫 갈래다.</desc>
<rect width="840" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-10 A</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">드롭은 두 종류입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 drop 이라도 버린 이유가 다릅니다. 이유가 다르면 처방도 다릅니다.</text>
<rect x="72" y="148" width="328" height="300" rx="8" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="92" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F0616D">포화</text>
<text x="92" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">자리가 없어 못 받았다</text>
<line x1="92" y1="224" x2="380" y2="224" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="92" y="252" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">rx_missed_errors</text>
<text x="92" y="272" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">호스트가 준 버퍼에 안 들어감</text>
<text x="92" y="304" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">rx_fifo_errors</text>
<text x="92" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">장치 FIFO 오버플로</text>
<line x1="92" y1="370" x2="380" y2="370" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="92" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">앱이 아픕니다</text>
<text x="92" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">링 버퍼를 키우거나 CPU 를 봅니다</text>
<rect x="432" y="148" width="328" height="300" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="452" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F08A59">무주지</text>
<text x="452" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">받았는데 줄 데가 없다</text>
<line x1="452" y1="224" x2="740" y2="224" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="452" y="252" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">rx_dropped</text>
<text x="452" y="272" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">모르는 프로토콜 · L2 필터링</text>
<line x1="452" y1="370" x2="740" y2="370" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="452" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">앱은 멀쩡합니다</text>
<text x="452" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">고칠 것이 없을 수 있습니다</text>
<text x="420" y="488" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">앱이 아픈지를 먼저 물으면 두 종류가 갈립니다</text>
<text x="420" y="514" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">2026-09-10 A 문항은 오른쪽이었습니다. 초당 1건씩 규칙적으로 오르는데 아무도 안 아팠습니다.</text>
</svg>
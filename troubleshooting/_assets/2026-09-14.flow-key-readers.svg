<title id="dt">누가 어디까지 읽는가</title><desc id="dd">경로 중간 라우터가 만든 Packet Too Big 한 통은 바깥 IPv6 헤더, ICMPv6 헤더, 인용된 원본 패킷이 겹으로 들어 있고 TCP 포트 둘은 가장 안쪽에 있다. 받는 호스트의 커널과 conntrack 은 인용까지 읽어 원래 흐름을 찾고, 바깥 헤더만 해시하는 ECMP 라우터는 주소 둘만 보고 흐름과 다른 다음 홉을 고른다.</desc>
<rect width="920" height="504" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING CONCEPT · FLOW KEY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">누가 어디까지 읽는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Packet Too Big 한 통에서 흐름을 가르는 포트는 인용된 원본 안쪽에만 있습니다</text>
<path d="M 616 136 L 546 136" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)"/>

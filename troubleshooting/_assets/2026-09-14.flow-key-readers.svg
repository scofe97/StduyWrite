<rect x="52" y="164" width="464" height="240" rx="8" fill="rgba(245,245,245,0.025)" stroke="rgba(245,245,245,0.40)" stroke-width="1.0"/>
<rect x="80" y="224" width="408" height="160" rx="8" fill="rgba(245,245,245,0.035)" stroke="rgba(245,245,245,0.55)" stroke-width="1.0"/>
<rect x="108" y="284" width="352" height="80" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="40" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Packet Too Big 한 통</text>
<text x="40" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">바깥 IPv6 헤더 · 출발지 중간 라우터 · 목적지 서비스 주소</text>
<text x="68" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">ICMPv6 헤더 · 타입 2 · MTU 값</text>
<text x="68" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">포트 칸 없음</text>
<text x="96" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">인용된 원본 · 서버가 보냈던 패킷</text>

<title id="dt">상한은 어디에 몇 개나 있는가</title><desc id="dd">요청 하나가 주문 앱에서 결제 앱까지 가며 지나는 관문들. 이름은 저마다 다르지만 구조는 같다. 상한이 있고, 평소엔 여유가 있고, 몰리면 넘친다. 다른 것은 무엇을 지키려는가와 넘쳤을 때의 태도다.</desc>

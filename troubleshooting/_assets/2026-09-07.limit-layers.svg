<text x="721.0" y="408.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">차면 대기 · 거절</text>
<text x="124" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이름이 다른 것은 지키는 자원과 방향이 달라서입니다. 커널은 말없이 버리고 Envoy 는 503 으로 알려 줍니다.</text>
<text x="124" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">그래서 상한을 올리는 일은 언제나 하류로 부담을 미는 일입니다. 늘리기 전에 받는 쪽이 감당하는지를 먼저 봅니다.</text>

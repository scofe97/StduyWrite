<title id="dt">모두와 맺는 배선과 가운데로 모으는 배선</title><desc id="dd">노드는 자기 Pod 대역을 다른 노드에 알려야 노드를 넘는 Pod 통신이 생긴다. 모두가 모두와 맺으면 세션이 노드 수의 제곱에 비례해 늘고, 몇 대를 반사기로 두면 나머지는 반사기하고만 맺어 노드 수에 비례하는 선까지 내려간다.</desc>

<title id="dt">집계 계층이 부르는 것들</title><desc id="dd">집계 계층 하나가 하위 서비스 여럿을 모아 페이지를 만드는 구조. 호출마다 호스트명을 풀어야 하므로 모든 화살표가 CoreDNS 를 한 번씩 거친다. 약한 것은 부가 정보 하나인데 CoreDNS 는 클러스터 전체가 공유한다.</desc>
<rect width="800" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-08 B</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">집계 계층이 부르는 것들</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">약한 것은 하나이고 공유되는 것은 전부입니다</text>

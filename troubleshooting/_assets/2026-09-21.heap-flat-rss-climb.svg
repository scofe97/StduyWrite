<title id="dt">한 선은 평평하고 다른 선만 한도로 올라갑니다</title><desc id="dd">힙 사용량은 며칠 내내 최대 힙의 40~50% 에 머물렀다. 커널이 세는 값만 조금씩 올라 컨테이너 한도에 닿고, 그 순간 SIGKILL 이 떨어진다. 재시작하면 몇 시간을 버티고 같은 모양이 되풀이된다.</desc>

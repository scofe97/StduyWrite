<title id="dt">브리지가 붙어 있는 링크</title><desc id="dd">컨테이너 몇 개가 br0 브리지에 물려 있고, 그 브리지는 사무실 링크에 붙어 있다. 같은 링크에는 우리 장비만 있는 것이 아니다.</desc>

<title id="dt">같은 자리를 두 번 집습니다</title><desc id="dd">커널은 포트를 배정하는 일과 장부에 적는 일을 두 단계로 한다. 그 틈에 다른 흐름이 같은 포트를 배정받으면, 늦게 도착한 쪽이 장부에 못 들어가고 패킷이 버려진다.</desc>

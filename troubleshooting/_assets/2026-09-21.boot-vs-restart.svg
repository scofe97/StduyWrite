<title id="dt">누가 먼저 표에 손대느냐가 결과를 가릅니다</title><desc id="dd">노드 하나의 라우팅 테이블을 두 순서로 놓았다. 부팅할 때는 networkd 가 먼저 뜨고 CNI 가 뒤에 Pod 대역 줄을 넣어, networkd 가 볼 때 지울 남의 줄이 아직 없다. 돌던 노드에서 자동 업데이트가 networkd 만 다시 띄우면 그때는 CNI 의 줄이 이미 표에 있고, networkd 는 자기 설정에 없는 그 줄을 지운다.</desc>
<rect width="1000" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-21 A</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">누가 먼저 표에 손대느냐가 결과를 가릅니다</text>

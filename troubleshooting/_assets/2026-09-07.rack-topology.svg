<title id="dt">같은 랙의 같은 구성 세 대</title><desc id="dd">동일하게 구성한 사내 API 서버 세 대가 같은 랙에 있다. 그중 한 대에서만 응답 실패율이 0.3% 안팎으로 꾸준히 나온다.</desc>

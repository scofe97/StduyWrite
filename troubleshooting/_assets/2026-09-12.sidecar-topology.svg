<text x="598" y="242" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">127.0.0.1:8080</text>
<text x="404" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">이 마지막 한 칸은 같은 네트워크 네임스페이스라 클러스터 라우팅을 거치지 않습니다</text>
<text x="404" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">그래서 connection refused 는 경로 문제가 아니라 도달했다는 증거입니다</text>

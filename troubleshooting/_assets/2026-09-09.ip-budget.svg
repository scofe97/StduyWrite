<title id="dt">문서의 110 과 실제로 쓰이는 256</title><desc id="dd">노드가 소비하는 것은 Pod 수가 아니라 할당받는 IP 블록이다. GKE 는 Pod 110 개를 담으려고 /24 즉 256 개를 준다. 그래서 /16 에 붙일 수 있는 노드는 595 대가 아니라 256 대에서 끝난다.</desc>

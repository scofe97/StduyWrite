<title id="dt">알림이 연결 없는 서버에 떨어집니다</title><desc id="dd">서버 2 가 보낸 큰 패킷이 좁은 구간 앞에서 버려지고, 그 라우터가 서비스 주소로 Packet Too Big 을 돌려보낸다. 데이터센터 라우터는 포트가 없는 이 알림을 주소 둘로만 해시해 서버 1 로 보내고, 서버 1 은 맞는 연결이 없어 버린다. 서버 2 는 끝내 모르고 같은 크기로 다시 보낸다.</desc>

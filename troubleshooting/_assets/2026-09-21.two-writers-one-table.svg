<title id="dt">라우팅 테이블 하나를 둘이 채웁니다</title><desc id="dd">쿠버네티스 노드 한 대의 안쪽이다. systemd-networkd 는 자기 설정 파일에 적힌 경로를 넣고, CNI 에이전트는 Pod 대역 경로를 같은 표에 넣는다. Pod 사이 트래픽은 그 표를 보고 나간다. 그 옆에 이미지에 든 타이머가 정해진 창에 자동 보안 업데이트를 깨우고, 업데이트는 systemd 패키지를 갈며 networkd 를 다시 띄운다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-21 A</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">라우팅 테이블 하나를 둘이 채웁니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">표는 하나인데 넣는 쪽이 둘이라, 한쪽이 다시 뜰 때 다른 쪽의 줄이 어떻게 되느냐가 갈립니다</text>

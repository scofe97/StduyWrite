<title id="dt">라벨 하나가 사라진 뒤의 다섯 걸음</title><desc id="dd">업그레이드가 컨트롤 플레인 노드에서 옛 라벨을 지우면 그 라벨로 반사기를 고르던 셀렉터가 빈 집합이 된다. 오브젝트는 그대로 남고 로그도 조용한데 BGP 세션이 사라지고, 그 세션으로 배웠던 다른 노드의 Pod 대역 경로가 함께 걷힌다.</desc>
<rect width="920" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING CONCEPT · EMPTY SELECTOR</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">라벨 하나가 사라진 뒤의 다섯 걸음</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">셀렉터가 아무도 못 고르는 것은 에러가 아니라 빈 집합이라 로그에 남지 않습니다</text>
<rect x="48" y="112" width="380" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="68" y="136" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">kubeadm upgrade apply · 1.24</text>
<text x="68" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">컨트롤 플레인 노드에서 옛 라벨 제거</text>
<line x1="428" y1="140" x2="496" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4,3"/>
<rect x="496" y="112" width="376" height="56" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="516" y="136" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">kubectl get nodes -l node-role…/master</text>
<text x="516" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">결과 0 개</text>
<path d="M 238 168 L 238 188" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="48" y="188" width="380" height="56" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="68" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">BGPPeer 셀렉터 · 빈 집합</text>
<text x="68" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">peerSelector 가 고른 노드 0</text>
<line x1="428" y1="216" x2="496" y2="216" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4,3"/>
<rect x="496" y="188" width="376" height="56" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="516" y="212" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">calicoctl get bgppeer -o yaml</text>
<text x="516" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">리소스는 그대로</text>
<path d="M 238 244 L 238 264" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="48" y="264" width="380" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="68" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">BGP 세션 종료</text>
<text x="68" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">반사기와 맺고 있던 피어 소멸</text>
<line x1="428" y1="292" x2="496" y2="292" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4,3"/>
<rect x="496" y="264" width="376" height="56" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="516" y="288" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">calicoctl node status</text>
<text x="516" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">피어 목록 없음</text>
<path d="M 238 320 L 238 340" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="48" y="340" width="380" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="68" y="364" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">경로 철회</text>
<text x="68" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">다른 노드 Pod 대역이 라우팅 표에서 빠짐</text>
<line x1="428" y1="368" x2="496" y2="368" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4,3"/>
<rect x="496" y="340" width="376" height="56" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="516" y="364" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">ip route | grep bird</text>
<text x="516" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">다른 노드 대역 없음</text>
<path d="M 238 396 L 238 416" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="48" y="416" width="380" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="68" y="440" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">노드를 넘는 Pod 통신 단절</text>
<text x="68" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">같은 노드 안은 그대로</text>
<line x1="428" y1="444" x2="496" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4,3"/>
<rect x="496" y="416" width="376" height="56" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="516" y="440" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">이름 해석 · 메트릭 · 웹훅</text>
<text x="516" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">한 뿌리에서 갈라진 증상</text>
<line x1="12" y1="504" x2="872" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="526" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="516" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">업그레이드가 바꾼 것</text>
<rect x="287" y="516" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="309" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아무도 못 고른 집합</text>
<rect x="474" y="516" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="496" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">걷힌 것</text>
</svg>
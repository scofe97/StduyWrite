<title id="dt">Pod 이 바깥으로 나가는 길</title><desc id="dd">여러 Pod 이 각자 다른 주소로 바깥 API 를 호출한다. 노드를 빠져나갈 때 그 주소들은 노드 IP 하나로 바뀌고, 구분을 위해 포트가 하나씩 배정된다.</desc>

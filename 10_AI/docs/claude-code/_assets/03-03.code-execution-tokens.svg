<title id="dt">도구 직접 호출과 코드 실행 방식의 토큰 소비 비교</title><desc id="dd">중간 데이터 모델 통과 방식과 샌드박스 격리 오케스트레이션 방식 간 토큰 소모량 비교</desc>

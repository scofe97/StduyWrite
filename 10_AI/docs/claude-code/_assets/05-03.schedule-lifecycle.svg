<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">로컬 작업은 세션과 함께 멈추고 7일 후 만료되며, API 키가 있으면 /schedule 이 꺼집니다</text>

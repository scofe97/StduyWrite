<title id="dt">로컬 및 클라우드 예약 작업 생명주기와 상태 전이</title><desc id="dd">세션 종속 로컬 반복 작업과 클라우드 예약 작업의 활성화, 중단, 만료 전이와 API 키로 인한 /schedule 비활성</desc>
<rect width="960" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SCHEDULED TASKS · STATE LIFECYCLE</text>

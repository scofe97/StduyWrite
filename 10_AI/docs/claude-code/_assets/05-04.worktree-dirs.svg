<title id="dt">원본 저장소와 격리 워크트리 디렉터리 구조</title><desc id="dd">메인 작업 공간의 변경 충돌을 방지하는 .claude/worktrees 하위 격리 워크트리 및 공유 Git 객체 배치</desc>

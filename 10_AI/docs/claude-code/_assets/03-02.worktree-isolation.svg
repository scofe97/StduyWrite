<title id="dt">git worktree 서브에이전트 작업 격리 및 자동 정리</title><desc id="dd">코드 변경 여부에 따라 임시 워크트리가 자동 삭제되거나 디스크에 보존되는 흐름</desc>
<rect width="920" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">WORKTREE ISOLATION FLOWCHART</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">git worktree 서브에이전트 작업 격리 및 자동 정리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">메인 작업 트리를 오염시키지 않고 변경이 있을 때만 워크트리를 보존합니다</text>
<rect x="316" y="96" width="288" height="40" rx="20" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="460" y="121" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">서브에이전트 실행 (isolation: worktree)</text>
<path d="M 460 136 L 460 164" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="300" y="164" width="320" height="52" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="460" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">전용 워크트리 및 브랜치 생성</text>
<text x="460" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">메인 작업 트리와 분리된 디렉터리</text>
<path d="M 460 216 L 460 244" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="300" y="244" width="320" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="460" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">격리 환경에서 작업 수행</text>
<text x="460" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">파일 읽기·수정·빌드·테스트</text>
<path d="M 460 296 L 460 328" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<polygon points="460,328 572,372 460,416 348,372" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="460" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">코드 변경 발생</text>
<text x="460" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여부 판정</text>
<path d="M 348 372 L 232 372 L 232 428" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="290" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">아니오 (변경 없음)</text>
<rect x="76" y="436" width="312" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="232" y="458" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">임시 워크트리 및 브랜치 자동 삭제</text>
<text x="232" y="476" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">변경 없으면 자동 정리</text>
<path d="M 232 488 L 232 520" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="108" y="520" width="248" height="40" rx="20" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="232" y="545" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">작업 종료 (정리 완료)</text>
<path d="M 572 372 L 688 372 L 688 428" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="630" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">예 (변경 발생)</text>
<rect x="532" y="436" width="312" height="52" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="688" y="458" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">워크트리 보존</text>
<text x="688" y="476" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">변경이 있으면 디스크에 남음</text>
<path d="M 688 488 L 688 520" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)" stroke-dasharray="4 4"/>
<rect x="556" y="520" width="264" height="40" rx="20" fill="#161B22" stroke="#3FB98C" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="688" y="545" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">경로·브랜치 보고 (미확인)</text>
<line x1="12" y1="580" x2="872" y2="580" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="602" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="592" width="14" height="12" rx="2" fill="rgba(191,192,192,0.22)22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="122" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시작·종료</text>
<rect x="209" y="592" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="231" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">격리 실행 단계</text>
<rect x="357" y="592" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="379" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자동 정리</text>
<rect x="466" y="592" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="488" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">변경 있음 · 보존</text>
<rect x="640" y="592" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="662" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">미확인</text>
</svg>
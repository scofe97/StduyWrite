<title id="dt">메인 세션과 서브에이전트의 컨텍스트 토큰 격리</title><desc id="dd">메인 세션의 대화 맥락을 보존하고 서브에이전트가 소모한 수만 토큰 중 요약 결과만 수신하는 구조</desc>
<rect width="920" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTEXT ISOLATION ARCHITECTURE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">메인 세션과 서브에이전트의 컨텍스트 토큰 격리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">하위 작업의 방대한 파일 탐색과 터미널 출력을 격리해 메인 세션의 토큰 고갈을 방지합니다</text>
<rect x="40" y="96" width="840" height="136" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="56" y="102" width="148" height="16" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="130" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">MAIN SESSION ZONE</text>
<rect x="64" y="124" width="344" height="96" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="236" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">사용자 지시 및 작업 계획</text>
<text x="236" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">핵심 목표 수립 · 작업 분할</text>
<text x="236" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">핵심 대화 기록 보존</text>
<rect x="512" y="124" width="344" height="96" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<rect x="541.5" y="136" width="69.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="576" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">토큰 보존</text>
<text x="684" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">메인 컨텍스트 유지</text>

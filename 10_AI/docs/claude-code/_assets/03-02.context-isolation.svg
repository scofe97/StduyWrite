<text x="728" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">검증 결과 반환</text>
<line x1="12" y1="440" x2="872" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

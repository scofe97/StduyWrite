<title id="dt">커널 격리 계층과 보안 프록시 자격 증명 마스킹 아키텍처</title><desc id="dd">호스트 커널 경계부터 샌드박스 센티널 파일, TLS 보안 프록시의 비밀키 치환 및 외부 통신 통제</desc>

<title id="dt">세션 복제와 분기 제어 체계</title><desc id="dd">현재 대화 세션에서 하위 에이전트, 독립 백그라운드 세션, 직접 전환 복사본으로 갈라지는 분기 구조</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SESSION MANAGEMENT · BRANCHING TOPOLOGY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세션 복제와 분기 제어 체계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">명령어에 따라 대화 맥락 상속 범위와 실행 위치 및 결과 회수 여부가 나뉩니다 (/subtask·/fork 는 에이전트 뷰를 켠 경우)</text>

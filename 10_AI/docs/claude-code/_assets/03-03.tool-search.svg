<title id="dt">동적 도구 검색과 alwaysLoad 설정에 따른 컨텍스트 적재 흐름</title><desc id="dd">alwaysLoad 설정 및 ENABLE_TOOL_SEARCH 모드에 따른 도구 명세 적재 분기</desc>
<rect width="920" height="672" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">MCP TOOL SEARCH DECISION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">동적 도구 검색과 alwaysLoad 설정에 따른 컨텍스트 적재 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">컨텍스트 낭비를 막기 위해 온디맨드 검색을 기본으로 하되 핵심 도구는 사전 로드합니다</text>
<rect x="192" y="104" width="176" height="36" rx="18" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="280.0" y="127.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">MCP 도구 적재 판정</text>
<path d="M 280 140 L 280 165" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 280 165.0 L 412.0 190 L 280 215.0 L 148.0 190 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="280" y="195" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">alwaysLoad: true ?</text>
<path d="M 412.0 190 L 558.0 190" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="485.0" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">예</text>
<rect x="558.0" y="167" width="264" height="46" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="690.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">상시 사전 로드 (검색 우회)</text>
<text x="690.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">컨텍스트 항시 유지</text>
<path d="M 280 215 L 280 255" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="294" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">아니오</text>
<path d="M 280 255.0 L 412.0 280 L 280 305.0 L 148.0 280 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="280" y="285" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">ENABLE_TOOL_SEARCH: false ?</text>
<path d="M 412.0 280 L 558.0 280" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="485.0" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">예</text>
<rect x="558.0" y="257" width="264" height="46" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.0"/>
<text x="690.0" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">전체 사전 전송 (검색 비활성)</text>
<text x="690.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">모든 도구 명세 초반 전송</text>
<path d="M 280 305 L 280 345" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="294" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">아니오</text>
<path d="M 280 345.0 L 412.0 370 L 280 395.0 L 148.0 370 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="280" y="375" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">alwaysLoad: false ?</text>
<path d="M 412.0 370 L 558.0 370" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="485.0" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">예</text>
<rect x="558.0" y="347" width="264" height="46" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="690.0" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">지연 적재 강제 (검색 대상)</text>
<text x="690.0" y="382" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">도구 정의 온디맨드 탐색</text>
<path d="M 280 395 L 280 435" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="294" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">아니오</text>
<path d="M 280 435.0 L 412.0 460 L 280 485.0 L 148.0 460 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="280" y="465" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">ENABLE_TOOL_SEARCH: auto ?</text>
<path d="M 412.0 460 L 558.0 460" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="485.0" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">예</text>
<rect x="558.0" y="437" width="264" height="46" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="690.0" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">임계치 기반 적재 (10%)</text>
<text x="690.0" y="472" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">용량 도달 시 지연 전환</text>
<path d="M 280 485 L 280 526" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="294" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">기본값 / true</text>
<rect x="148.0" y="526" width="264" height="46" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="280.0" y="545" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">온디맨드 도구 검색 (기본값)</text>
<text x="280.0" y="561" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">모델 요청 시점에만 명세 로드</text>
<line x1="12" y1="608" x2="872" y2="608" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="630" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="620" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">온디맨드 도구 검색 및 지연 적재 (Focal)</text>
<rect x="482" y="620" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="504" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사전 로드 및 임계치 적재</text>
<rect x="708" y="620" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="730" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">도구 검색 비활성화</text>
</svg>
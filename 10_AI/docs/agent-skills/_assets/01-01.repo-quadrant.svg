<title id="dt">생성물 드리프트 검사와 행동 검증으로 본 스킬 저장소</title><desc id="dd">가로축은 생성물 드리프트 검사 수준, 세로축은 행동 검증 수준을 나타내며 각 저장소의 검증 경계를 사분면에 배치합니다</desc>

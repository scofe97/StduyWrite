<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t7 d7">
<title id="t7">v1.4.188 명령 232개의 영역별 분포</title>
<desc id="d7">열한 개 영역의 명령 수를 가로 막대로 비교한 그래프입니다. 브라우저 자동화가 80개로 가장 길고, 그 막대만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.area{fill:var(--ink);font-size:12px}
.num{fill:var(--muted);font-size:11px}
.bar{fill:var(--info)}
.barA{fill:var(--accent)}
.legend{fill:var(--soft);font-size:10px}
</style>
<rect width="1000" height="480" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">COMMAND MIX · v1.4.188</text>
<text class="kr h1" x="64" y="76">명령 232개가 어디에 몰려 있는가</text>
<text class="kr sub" x="64" y="98">막대 길이는 그 영역의 명령 수입니다. 이 분포가 도구의 성격을 그대로 드러냅니다.</text>

<line x1="336" y1="120" x2="336" y2="424" stroke="var(--rule)" stroke-width="1"/>

<text class="kr area" x="64" y="144">브라우저 자동화</text><rect class="barA" x="336" y="132" width="462" height="16" rx="2"/><text class="mn num" x="810" y="145">77</text>
<text class="kr area" x="64" y="172">오케스트레이션</text><rect class="bar" x="336" y="160" width="174" height="16" rx="2"/><text class="mn num" x="522" y="173">29</text>
<text class="kr area" x="64" y="200">이슈 연동 (Linear)</text><rect class="bar" x="336" y="188" width="162" height="16" rx="2"/><text class="mn num" x="510" y="201">27</text>
<text class="kr area" x="64" y="228">진단 · 상태 · 파일 · 기타</text><rect class="bar" x="336" y="216" width="150" height="16" rx="2"/><text class="mn num" x="498" y="229">25</text>
<text class="kr area" x="64" y="256">모바일 에뮬레이터</text><rect class="bar" x="336" y="244" width="96" height="16" rx="2"/><text class="mn num" x="444" y="257">16</text>
<text class="kr area" x="64" y="284">컴퓨터 유즈</text><rect class="bar" x="336" y="272" width="84" height="16" rx="2"/><text class="mn num" x="432" y="285">14</text>
<text class="kr area" x="64" y="312">프로젝트 · Repo</text><rect class="bar" x="336" y="300" width="72" height="16" rx="2"/><text class="mn num" x="420" y="313">12</text>
<text class="kr area" x="64" y="340">터미널</text><rect class="bar" x="336" y="328" width="66" height="16" rx="2"/><text class="mn num" x="414" y="341">11</text>
<text class="kr area" x="64" y="368">자동화</text><rect class="bar" x="336" y="356" width="42" height="16" rx="2"/><text class="mn num" x="390" y="369">7</text>
<text class="kr area" x="64" y="396">환경 · 원격 런타임</text><rect class="bar" x="336" y="384" width="42" height="16" rx="2"/><text class="mn num" x="390" y="397">7</text>
<text class="kr area" x="64" y="424">워크트리</text><rect class="bar" x="336" y="412" width="42" height="16" rx="2"/><text class="mn num" x="390" y="425">7</text>

<line x1="64" y1="448" x2="936" y2="448" stroke="var(--rule)" stroke-width="1"/>
<text class="kr legend" x="64" y="468">브라우저 계열이 3분의 1에 가깝고, 이슈 연동이 터미널보다 두껍습니다. 티켓에서 PR 까지를 한 흐름으로 보는 설계입니다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="uc vc">
<title id="uc">워크트리가 안 지워질 때 밟는 세 단계</title>
<desc id="vc">미커밋 변경 확인·에이전트 진행 확인·삭제 세 단계를 순서대로 배치한 흐름이며, 두 번째 단계에서 안전장치가 사라졌다는 주의가 붙어 있습니다. 두 번째 단계만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.num{fill:var(--soft);font-size:9px}
.cmd{fill:var(--ink);font-size:11px}
.note{fill:var(--muted);font-size:10px}
.bad{fill:var(--bad);font-size:10px}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
</style>
<rect width="1000" height="300" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">CLEANUP ORDER</text>
<text class="kr h1" x="64" y="76">순서를 지키는 것이 핵심입니다</text>
<text class="kr sub" x="64" y="98">막는 것은 미커밋 변경 하나뿐입니다. 나머지는 사람이 확인해야 합니다.</text>

<rect class="box" x="64" y="144" width="264" height="76" rx="4"/>
<text class="mn num" x="88" y="166">01</text>
<text class="mn cmd" x="88" y="188">git status --short</text>
<text class="kr note" x="88" y="208">있으면 커밋 또는 되돌리기</text>

<path class="arrow" d="M328 182 L368 182"/><path class="arrow" d="M360 177 L368 182 L360 187"/>

<rect x="368" y="136" width="264" height="92" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn num" x="392" y="158">02</text>
<text class="mn cmd" x="392" y="180">orca worktree ps</text>
<text class="kr note" x="392" y="200">아직 일하고 있지는 않은가</text>
<text class="kr bad" x="392" y="218">이제 막아 주지 않습니다 — 사람이 확인</text>

<path class="arrow" d="M632 182 L672 182"/><path class="arrow" d="M664 177 L672 182 L664 187"/>

<rect class="box" x="672" y="144" width="264" height="76" rx="4"/>
<text class="mn num" x="696" y="166">03</text>
<text class="mn cmd" x="696" y="188">orca worktree rm</text>
<text class="kr note" x="696" y="208">지운 뒤 목록으로 재확인</text>

<line x1="64" y1="256" x2="936" y2="256" stroke="var(--rule)" stroke-width="1"/>
<text class="kr bad" x="64" y="278">orchestration reset --all 은 쓰지 않습니다. 조회는 Run 단위지만 초기화는 로컬 DB 전체입니다.</text>
<text class="kr note" x="64" y="294">정리는 태스크를 하나씩 completed 로. 끝나지 않은 것을 완료로 위조하면 후속이 전제 없이 열립니다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="ub vb">
<title id="ub">diagnostics memory 응답 구조와 이 맥북에서 잰 값</title>
<desc id="vb">응답 구조는 원서와 같지만 실제 수치는 크게 달랐음을 두 환경의 값을 나란히 놓아 보인 표입니다. 자기 환경에서 재라는 결론 줄이 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.row{fill:var(--ink);font-size:13px}
.v{fill:var(--info);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="320" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">MEASURE YOUR OWN</text>
<text class="kr h1" x="64" y="76">구조는 같고 값은 다릅니다</text>
<text class="kr sub" x="64" y="98">단위는 바이트입니다. 남의 수치로 동시 실행 수를 정하면 틀립니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">대상</text>
<text class="kr col" x="472" y="148">이 맥북 · v1.4.188</text>
<text class="kr col" x="712" y="148">원서 · Windows</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="kr row" x="64" y="196">앱 전체</text>
<text class="kr v" x="472" y="196">411 MB</text>
<text class="kr v" x="712" y="196">890 MB · 재측정 713 MB</text>

<text class="kr row" x="64" y="232">세션별</text>
<text class="kr v" x="472" y="232">1 · 46 · 81 · 94 MB</text>
<text class="kr v" x="712" y="232">에이전트 446 MB · 셸 8 MB</text>

<rect x="56" y="252" width="888" height="48" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr row" x="64" y="276">결론</text>
<text class="kr note" x="472" y="276">방향만 같습니다 — 에이전트 세션이 셸보다 훨씬 무겁습니다</text>
<text class="kr note" x="472" y="294">동시 실행 수는 자기 환경에서 잰 값으로 정합니다</text>
</svg>

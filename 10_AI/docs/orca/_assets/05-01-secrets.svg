<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="u4 v4">
<title id="u4">비밀정보를 다루는 방법별 실효성</title>
<desc id="v4">파일에서 환경 변수로 옮기거나 워크트리를 나누는 방법은 실효가 없고 짧은 수명·좁은 범위 자격증명과 중계만 효과가 있음을 비교한 표입니다. 효과 있는 항목만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.way{fill:var(--ink);font-size:13px}
.ok{fill:var(--ok);font-size:12px}
.bad{fill:var(--bad);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="340" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">SECRETS</text>
<text class="kr h1" x="64" y="76">위치를 바꾸는 것은 대책이 아닙니다</text>
<text class="kr sub" x="64" y="98">에이전트는 워크트리 안의 파일도, 자기 프로세스의 환경 변수도 그대로 읽습니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">시도</text>
<text class="kr col" x="512" y="148">실효</text>
<text class="kr col" x="656" y="148">왜</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="kr way" x="64" y="196">.env 대신 환경 변수로 옮기기</text>
<text class="kr bad" x="512" y="196">없음</text>
<text class="kr note" x="656" y="196">프로세스 환경 변수를 그대로 읽습니다</text>

<text class="kr way" x="64" y="236">워크트리를 나누기</text>
<text class="kr bad" x="512" y="236">없음</text>
<text class="kr note" x="656" y="236">원본 파일을 그대로 가져갑니다</text>

<text class="kr way" x="64" y="276">스냅샷 마스킹에 기대기</text>
<text class="kr bad" x="512" y="276">부분</text>
<text class="kr note" x="656" y="276">명령줄·셸 이력·프롬프트에는 그대로</text>

<rect x="56" y="292" width="888" height="40" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr way" x="64" y="316">짧은 수명 · 좁은 범위 토큰 · 중계</text>
<text class="kr ok" x="512" y="316">있음</text>
<text class="kr note" x="656" y="316">유출돼도 피해 범위가 작습니다</text>
</svg>

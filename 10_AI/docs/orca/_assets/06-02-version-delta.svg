<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="uh vh">
<title id="uh">v1.4.154 · v1.4.176 · v1.4.188 의 명령 수 변화</title>
<desc id="vh">세 버전에서 전체 명령 수는 늘었지만 오케스트레이션 명령 수는 31에서 29로 줄었음을 보인 표이며, 그 이유가 아래에 적혀 있습니다. 이 노트의 기준 버전 행만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.ver{fill:var(--ink);font-size:13px}
.n{fill:var(--info);font-size:14px;font-weight:600}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="320" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">VERSION DELTA</text>
<text class="kr h1" x="64" y="76">전체는 늘고 오케스트레이션은 줄었습니다</text>
<text class="kr sub" x="64" y="98">은퇴 처리가 두 갈래였기 때문입니다. 하나는 제거, 하나는 스텁으로 잔류.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">기준</text>
<text class="kr col" x="440" y="148">전체</text>
<text class="kr col" x="616" y="148">오케스트레이션</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="mn ver" x="64" y="196">v1.4.154</text>
<text class="kr note" x="64" y="214">원서 앞부분</text>
<text class="kr n" x="440" y="196">206</text>
<text class="kr n" x="616" y="196">16 또는 17</text>
<text class="kr note" x="616" y="214">원서 02-4 와 05-1 이 다르게 적었습니다</text>

<text class="mn ver" x="64" y="252">v1.4.176</text>
<text class="kr note" x="64" y="270">원서 대부분</text>
<text class="kr n" x="440" y="252">223</text>
<text class="kr n" x="616" y="252">31</text>

<rect x="56" y="280" width="888" height="36" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn ver" x="64" y="304">v1.4.188</text>
<text class="kr n" x="440" y="304">232</text>
<text class="kr n" x="616" y="304">29</text>
<text class="kr note" x="712" y="304">run · run-stop 이 스키마에서 사라짐</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 396" role="img" aria-labelledby="t1 d1">
<title id="t1">편집기·대화·작업 관리로 옮겨간 도구의 무게중심</title>
<desc id="d1">IDE·AI 코딩 도구·ADE 세 세대를 화면의 중심·사람의 역할·도구의 역할 세 축으로 비교한 행렬입니다. 마지막 행 ADE만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12)}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.gen{fill:var(--ink);font-size:14px;font-weight:600}
.tool{fill:var(--muted);font-size:11px}
.cell{fill:var(--ink);font-size:13px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="396" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">GENERATION SHIFT</text>
<text class="kr h1" x="64" y="76">도구의 무게중심이 세 번 옮겨갔습니다</text>
<text class="kr sub" x="64" y="98">셋 다 편집기를 갖고 있습니다. 다른 것은 화면의 가장 좋은 자리를 무엇에 내주는가입니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">세대</text>
<text class="kr col" x="308" y="148">화면의 중심</text>
<text class="kr col" x="552" y="148">사람의 역할</text>
<text class="kr col" x="748" y="148">기본 단위</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="kr gen" x="64" y="196">IDE</text>
<text class="kr tool" x="64" y="214">IntelliJ · VS Code</text>
<text class="kr cell" x="308" y="196">편집기</text>
<text class="kr cell" x="552" y="196">코드를 쓴다</text>
<text class="kr cell" x="748" y="196">파일</text>
<line class="hair" x1="64" y1="236" x2="936" y2="236"/>

<text class="kr gen" x="64" y="268">AI 코딩 도구</text>
<text class="kr tool" x="64" y="286">Copilot · Cursor · Claude Code</text>
<text class="kr cell" x="308" y="268">대화</text>
<text class="kr cell" x="552" y="268">코드를 함께 쓴다</text>
<text class="kr cell" x="748" y="268">대화</text>
<line class="hair" x1="64" y1="308" x2="936" y2="308"/>

<rect x="56" y="316" width="888" height="60" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr gen" x="64" y="340">ADE</text>
<text class="kr tool" x="64" y="358">ORCA</text>
<text class="kr cell" x="308" y="340">작업 현황판</text>
<text class="kr cell" x="552" y="340">일을 배분하고 확인한다</text>
<text class="kr cell" x="748" y="340">작업</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="ua va">
<title id="ua">진단 3단 콤보와 각 단계에서 읽는 값</title>
<desc id="va">status·worktree ps·terminal list 세 명령을 순서대로 실행하며 각 단계에서 무엇을 읽는지 보인 흐름입니다. worktree ps 의 preview 단계만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12)}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.cmd{fill:var(--ink);font-size:12px}
.q{fill:var(--muted);font-size:11px}
.note{fill:var(--muted);font-size:10px}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="340" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">TRIAGE IN THREE</text>
<text class="kr h1" x="64" y="76">부품이 나뉘어 있으니 좁혀 갑니다</text>
<text class="kr sub" x="64" y="98">무슨 문제든 이 셋으로 시작합니다. 브라우저 명령만 실패하면 런타임 문제가 아닐 가능성이 높습니다.</text>

<rect class="box" x="64" y="140" width="256" height="88" rx="4"/>
<text class="mn cmd" x="88" y="166">orca status --json</text>
<text class="kr q" x="88" y="188">어느 층이 안 켜졌나</text>
<text class="kr note" x="88" y="208">app → runtime → graph</text>

<path class="arrow" d="M320 184 L360 184"/><path class="arrow" d="M352 179 L360 184 L352 189"/>

<rect x="360" y="132" width="272" height="104" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn cmd" x="384" y="158">orca worktree ps</text>
<text class="kr q" x="384" y="180">어떤 작업이 살아 있나</text>
<text class="kr note" x="384" y="200">preview 가 이 명령의 값어치입니다</text>
<text class="kr note" x="384" y="218">열 개 중 어느 것이 멈췄는지 한눈에</text>

<path class="arrow" d="M632 184 L672 184"/><path class="arrow" d="M664 179 L672 184 L664 189"/>

<rect class="box" x="672" y="140" width="264" height="88" rx="4"/>
<text class="mn cmd" x="696" y="166">orca terminal list --json</text>
<text class="kr q" x="696" y="188">어떤 터미널이 붙어 있나</text>
<text class="kr note" x="696" y="208">lastOutputAt 으로 정체 시간 계산</text>

<line class="hair" x1="64" y1="268" x2="936" y2="268"/>
<text class="kr note" x="64" y="290">live:0 pty:no — 터미널 없음 · live:1 + 프롬프트 — 셸만 있음</text>
<text class="kr note" x="64" y="310">preview 가 질문 화면 — 멈춘 것이 아니라 사람을 기다리는 중</text>
<text class="kr note" x="64" y="330">preview 가 몇 분 전과 같음 — 멈춤 의심</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="tn dn">
<title id="tn">작업 관계에 따라 워크트리·태스크·메시지·게이트 중 무엇이 필요한지</title>
<desc id="dn">작업들 사이에 관계가 없을수록 워크트리만으로 충분하고, 순서·주고받음·사람 승인이 생길수록 태스크와 메시지와 게이트가 차례로 필요해지는 단계 그림입니다. 관계가 없는 단계만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.sit{fill:var(--ink);font-size:13px}
.need{fill:var(--info);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="340" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">WHEN ORCHESTRATION EARNS ITS COST</text>
<text class="kr h1" x="64" y="76">관계가 있을 때만 필요합니다</text>
<text class="kr sub" x="64" y="98">병렬 실행 자체는 격리가 주는 것이지 조율이 주는 것이 아닙니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">작업들 사이의 관계</text>
<text class="kr col" x="600" y="148">필요한 것</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<rect x="56" y="172" width="888" height="48" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr sit" x="64" y="194">관계 없음 — 서로 무관한 일을 동시에</text>
<text class="kr need" x="600" y="194">워크트리만</text>
<text class="kr note" x="64" y="212">여기서 오케스트레이션을 배우는 것은 비용만 늘립니다</text>

<text class="kr sit" x="64" y="252">순서가 있음 — A 가 끝나야 B</text>
<text class="kr need" x="600" y="252">태스크 DAG</text>

<text class="kr sit" x="64" y="288">결과를 주고받아야 함</text>
<text class="kr need" x="600" y="288">메시지</text>

<text class="kr sit" x="64" y="324">중간에 사람 승인이 필요함</text>
<text class="kr need" x="600" y="324">게이트</text>
</svg>

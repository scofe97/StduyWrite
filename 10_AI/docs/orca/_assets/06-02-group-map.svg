<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="ug vg">
<title id="ug">명령 232개가 그룹별로 나뉜 분포</title>
<desc id="vg">상위 그룹 열한 개의 명령 수를 가로 막대로 비교하고, 나머지가 브라우저 조작 동사로 평면 배치돼 있음을 아래에 적은 그래프입니다. 평면 배치된 브라우저 동사 막대만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.g{fill:var(--ink);font-size:12px}
.num{fill:var(--muted);font-size:11px}
.bar{fill:var(--info)}
.barA{fill:var(--accent)}
.note{fill:var(--soft);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="420" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">232 COMMANDS · 69 TOP-LEVEL GROUPS</text>
<text class="kr h1" x="64" y="76">어디를 보면 되는지의 지도</text>
<text class="kr sub" x="64" y="98">외울 대상이 아닙니다. 하고 싶은 일이 속한 묶음만 보면 됩니다.</text>

<line x1="304" y1="120" x2="304" y2="352" stroke="var(--rule)" stroke-width="1"/>

<rect class="barA" x="304" y="128" width="462" height="16" rx="2"/>
<text class="kr g" x="64" y="141">브라우저 계열 (46개 그룹)</text><text class="mn num" x="778" y="141">77</text>
<rect class="bar" x="304" y="156" width="174" height="16" rx="2"/>
<text class="mn g" x="64" y="169">orchestration</text><text class="mn num" x="490" y="169">29</text>
<rect class="bar" x="304" y="184" width="162" height="16" rx="2"/>
<text class="mn g" x="64" y="197">linear</text><text class="mn num" x="478" y="197">27</text>
<rect class="bar" x="304" y="212" width="96" height="16" rx="2"/>
<text class="mn g" x="64" y="225">emulator</text><text class="mn num" x="412" y="225">16</text>
<rect class="bar" x="304" y="240" width="84" height="16" rx="2"/>
<text class="mn g" x="64" y="253">computer</text><text class="mn num" x="400" y="253">14</text>
<rect class="bar" x="304" y="268" width="78" height="16" rx="2"/>
<text class="mn g" x="64" y="281">tab</text><text class="mn num" x="394" y="281">13</text>
<rect class="bar" x="304" y="296" width="66" height="16" rx="2"/>
<text class="mn g" x="64" y="309">terminal</text><text class="mn num" x="382" y="309">11</text>
<rect class="bar" x="304" y="324" width="42" height="16" rx="2"/>
<text class="mn g" x="64" y="337">worktree · project · automations</text><text class="mn num" x="358" y="337">각 7</text>

<line class="hair" x1="64" y1="368" x2="936" y2="368"/>
<text class="kr note" x="64" y="390">브라우저 계열 77 중 43 이 click · fill · snapshot 처럼 한 단어로 최상위에 놓입니다. 다른 영역은 worktree create 처럼 두 단어입니다.</text>
<text class="kr note" x="64" y="408">에이전트가 짧게 쓰도록 만든 배치이고, 이것이 브라우저가 3분의 1에 가까운 이유입니다.</text>
</svg>

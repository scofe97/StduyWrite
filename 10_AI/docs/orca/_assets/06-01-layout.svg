<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 336" role="img" aria-labelledby="ud vd">
<title id="ud">Windows 설치 구성과 macOS 구성의 부품 대응</title>
<desc id="vd">앱 본체·CLI·브라우저 엔진·데스크톱 제어 네 부품이 두 플랫폼에서 각각 어디에 있는지 짝지은 대응표입니다. CLI 행만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12)}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.part{fill:var(--ink);font-size:13px}
.p{fill:var(--muted);font-size:11px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="336" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">INSTALL LAYOUT</text>
<text class="kr h1" x="64" y="76">부품이 하나씩 대응합니다</text>
<text class="kr sub" x="64" y="98">이름만 플랫폼에 맞게 바뀌고 역할은 같습니다. 전부 앱 안에 함께 들어옵니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">부품</text>
<text class="kr col" x="280" y="148">원서 · Windows</text>
<text class="kr col" x="616" y="148">이 맥북 · macOS</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="kr part" x="64" y="196">앱 본체</text>
<text class="mn p" x="280" y="196">%LOCALAPPDATA%\Programs\orca\</text>
<text class="mn p" x="616" y="196">/Applications/Orca.app</text>

<rect x="56" y="212" width="888" height="48" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr part" x="64" y="236">CLI</text>
<text class="mn p" x="280" y="236">resources\bin\orca.exe</text>
<text class="mn p" x="616" y="236">Contents/Resources/bin/orca</text>
<text class="kr note" x="616" y="254">/opt/homebrew/bin/orca 가 여기로 이어지는 링크입니다</text>

<text class="kr part" x="64" y="292">브라우저 엔진</text>
<text class="mn p" x="280" y="292">agent-browser-win32-x64.exe</text>
<text class="mn p" x="616" y="292">agent-browser-darwin-arm64</text>

<text class="kr part" x="64" y="324">데스크톱 제어</text>
<text class="mn p" x="280" y="324">computer-use-windows\</text>
<text class="mn p" x="616" y="324">Orca Computer Use.app (헬퍼)</text>
</svg>

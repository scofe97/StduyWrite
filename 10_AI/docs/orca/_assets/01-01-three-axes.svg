<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t2 d2">
<title id="t2">세 실패에 격리·관측·조율이 하나씩 대응하는 매핑</title>
<desc id="d2">에이전트를 여럿 돌릴 때 무너지는 세 가지가 각각 격리·관측·조율 개념으로, 다시 ORCA의 구현으로 이어지는 세 열 매핑입니다. 격리 행만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--bad:#F0616D;--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.fail{fill:var(--bad);font-size:13px}
.axis{fill:var(--ink);font-size:15px;font-weight:600}
.impl{fill:var(--ink);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
</style>
<rect width="1000" height="400" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">FAILURE → CONCEPT → IMPLEMENTATION</text>
<text class="kr h1" x="64" y="76">무너지는 셋에 하나씩 대응합니다</text>
<text class="kr sub" x="64" y="98">왼쪽은 에이전트가 둘 이상일 때만 생기는 실패이고, 오른쪽은 ORCA가 그 실패를 막는 방식입니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">무너지는 것</text>
<text class="kr col" x="392" y="148">대응 개념</text>
<text class="mn col" x="616" y="148">ORCA 의 구현</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<rect x="56" y="176" width="888" height="64" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr fail" x="64" y="206">같은 파일을 동시에 고친다</text>
<text class="kr note" x="64" y="226">탭을 늘려도 파일은 하나</text>
<path class="arrow" d="M336 202 L376 202"/><path class="arrow" d="M368 197 L376 202 L368 207"/>
<text class="kr axis" x="392" y="206">격리</text>
<text class="kr note" x="392" y="226">isolation</text>
<path class="arrow" d="M560 202 L600 202"/><path class="arrow" d="M592 197 L600 202 L592 207"/>
<text class="kr impl" x="616" y="206">작업마다 독립된 git 워크트리와 브랜치</text>
<text class="kr note" x="616" y="226">파일 충돌만 막습니다. 포트·DB 는 여전히 겹칩니다</text>

<text class="kr fail" x="64" y="278">누가 어디서 멈췄는지 모른다</text>
<text class="kr note" x="64" y="298">탭 다섯 개를 번갈아 눌러야 한다</text>
<path class="arrow" d="M336 274 L376 274"/><path class="arrow" d="M368 269 L376 274 L368 279"/>
<text class="kr axis" x="392" y="278">관측</text>
<text class="kr note" x="392" y="298">observability</text>
<path class="arrow" d="M560 274 L600 274"/><path class="arrow" d="M592 269 L600 274 L592 279"/>
<text class="kr impl" x="616" y="278">워크트리 현황판 · 터미널 읽기 · 상태 훅</text>
<text class="kr note" x="616" y="298">훅은 에이전트 설정 파일에 심습니다</text>

<text class="kr fail" x="64" y="348">순서를 강제할 수 없다</text>
<text class="kr note" x="64" y="368">사람이 자리를 비우면 멈춘다</text>
<path class="arrow" d="M336 344 L376 344"/><path class="arrow" d="M368 339 L376 344 L368 349"/>
<text class="kr axis" x="392" y="348">조율</text>
<text class="kr note" x="392" y="368">orchestration</text>
<path class="arrow" d="M560 344 L600 344"/><path class="arrow" d="M592 339 L600 344 L592 349"/>
<text class="kr impl" x="616" y="348">태스크 의존 관계 · 디스패치 · 결정 게이트</text>
<text class="kr note" x="616" y="368">사람 판단이 필요한 지점에서 멈춰 둡니다</text>
</svg>

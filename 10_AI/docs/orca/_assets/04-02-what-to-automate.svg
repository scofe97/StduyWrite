<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" role="img" aria-labelledby="u2 v2">
<title id="u2">되돌릴 수 있는지로 가르는 자동화 적합성</title>
<desc id="v2">되돌릴 수 있는 작업과 되돌릴 수 없는 작업을 좌우로 나눠 예를 든 비교표이고, 아래에 새 워크트리가 안전장치가 되는 이유가 적혀 있습니다. 되돌릴 수 없는 쪽만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.colOk{fill:var(--ok);font-size:11px;letter-spacing:.06em}
.colBad{fill:var(--bad);font-size:11px;letter-spacing:.06em}
.item{fill:var(--ink);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="356" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">ONE CRITERION</text>
<text class="kr h1" x="64" y="76">되돌릴 수 있는가</text>
<text class="kr sub" x="64" y="98">자동화의 무서운 점은 실수가 한 번으로 끝나지 않고 정기적으로 반복된다는 것입니다.</text>

<line class="hair" x1="64" y1="128" x2="484" y2="128"/>
<text class="kr colOk" x="64" y="148">맡겨도 되는 것 — 되돌릴 수 있음</text>
<line class="hair" x1="64" y1="160" x2="484" y2="160"/>
<text class="kr item" x="64" y="188">상태 요약 · 점검</text>
<text class="kr item" x="64" y="216">의존성 · 취약점 확인</text>
<text class="kr item" x="64" y="244">문서 · 목차 갱신</text>
<text class="kr item" x="64" y="272">테스트 실행과 보고</text>

<rect x="508" y="120" width="436" height="168" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr colBad" x="524" y="148">맡기면 안 되는 것 — 되돌리기 비쌈</text>
<line class="hair" x1="524" y1="160" x2="928" y2="160"/>
<text class="kr item" x="524" y="188">코드를 고쳐 커밋 · 푸시</text>
<text class="kr item" x="524" y="216">배포</text>
<text class="kr item" x="524" y="244">외부로 메시지 보내기</text>
<text class="kr item" x="524" y="272">데이터 삭제 · 정리</text>

<line class="hair" x1="64" y1="312" x2="936" y2="312"/>
<text class="kr note" x="64" y="332">workspaceMode: new_per_run 이 안전장치입니다. 결과가 그 워크트리에 갇힙니다.</text>
<text class="kr note" x="64" y="350">프롬프트에 "커밋해 주세요"를 넣지 않는 것만으로 대부분의 위험이 사라집니다.</text>
</svg>

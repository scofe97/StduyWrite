<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="tr dr">
<title id="tr">게이트 해결부터 커밋까지 남은 여섯 단계</title>
<desc id="dr">게이트를 해결한 뒤 추가 지시·두번째 완료 대기·테스트 확인·리뷰 재배분·리뷰 완료를 거쳐 커밋에 이르는 여섯 단계를 순서대로 늘어놓은 흐름이고, 흔히 여기서 멈추는 지점이 표시돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--bad:#F0616D;--ok:#3FB98C}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.st{fill:var(--ink);font-size:11px}
.num{fill:var(--soft);font-size:9px}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
.bad{fill:var(--bad);font-size:11px}
.ok{fill:var(--ok);font-size:11px}
.note{fill:var(--muted);font-size:10px}
</style>
<rect width="1000" height="320" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">AFTER THE GATE</text>
<text class="kr h1" x="64" y="76">승인은 시작이지 끝이 아닙니다</text>
<text class="kr sub" x="64" y="98">여기서 멈추면 게이트가 승인 도장으로만 남고 판단 이후의 결과는 아무도 보지 않습니다.</text>

<rect class="box" x="64" y="152" width="128" height="52" rx="4"/>
<text class="mn num" x="80" y="172">01</text><text class="kr st" x="80" y="190">게이트 해결</text>
<path class="arrow" d="M192 178 L216 178"/><path class="arrow" d="M208 173 L216 178 L208 183"/>

<rect x="216" y="152" width="128" height="52" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn num" x="232" y="172">02</text><text class="kr st" x="232" y="190">추가 지시 전달</text>
<path class="arrow" d="M344 178 L368 178"/><path class="arrow" d="M360 173 L368 178 L360 183"/>

<rect class="box" x="368" y="152" width="136" height="52" rx="4"/>
<text class="mn num" x="384" y="172">03</text><text class="kr st" x="384" y="190">두 번째 완료 대기</text>
<path class="arrow" d="M504 178 L528 178"/><path class="arrow" d="M520 173 L528 178 L520 183"/>

<rect class="box" x="528" y="152" width="120" height="52" rx="4"/>
<text class="mn num" x="544" y="172">04</text><text class="kr st" x="544" y="190">테스트 확인</text>
<path class="arrow" d="M648 178 L672 178"/><path class="arrow" d="M664 173 L672 178 L664 183"/>

<rect class="box" x="672" y="152" width="120" height="52" rx="4"/>
<text class="mn num" x="688" y="172">05</text><text class="kr st" x="688" y="190">리뷰 재배분</text>
<path class="arrow" d="M792 178 L816 178"/><path class="arrow" d="M808 173 L816 178 L808 183"/>

<rect class="box" x="816" y="152" width="120" height="52" rx="4"/>
<text class="mn num" x="832" y="172">06</text><text class="kr st" x="832" y="190">커밋</text>

<path class="arrow" d="M280 204 L280 232"/><path class="arrow" d="M275 224 L280 232 L285 224"/>
<text class="kr bad" x="216" y="252">흔히 여기서 멈춥니다</text>
<text class="kr note" x="216" y="270">추가 지시는 새 작업을 시작시킨 것입니다</text>

<text class="kr ok" x="672" y="252">리뷰어는 처음 결과만 봤습니다</text>
<text class="kr note" x="672" y="270">추가 변경분은 아직 아무도 안 봤습니다</text>
</svg>

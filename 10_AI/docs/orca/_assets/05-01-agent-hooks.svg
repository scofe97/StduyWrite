<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="u6 v6">
<title id="u6">아는 에이전트 14종 중 이 맥북에서 훅이 설치된 여섯</title>
<desc id="v6">ORCA가 아는 에이전트 14종 가운데 실제로 설정 파일에 훅이 심어진 여섯을 표시한 그림이며, Claude Code 항목이 포함돼 있습니다. Claude Code 항목만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.ag{fill:var(--ink);font-size:12px}
.path{fill:var(--muted);font-size:11px}
.ok{fill:var(--ok);font-size:11px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="340" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">agent hooks status · v1.4.188</text>
<text class="kr h1" x="64" y="76">내 설정 파일에 훅이 들어가 있습니다</text>
<text class="kr sub" x="64" y="98">사이드바의 실시간 진행 표시는 여기서 나옵니다. 아는 에이전트 14종 중 여섯에 설치돼 있었습니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">에이전트</text>
<text class="kr col" x="272" y="148">설정 파일</text>
<text class="kr col" x="784" y="148">상태</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<rect x="56" y="176" width="888" height="36" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn ag" x="64" y="199">claude</text>
<text class="mn path" x="272" y="199">$HOME/.claude/settings.json</text>
<text class="kr ok" x="784" y="199">installed</text>

<text class="mn ag" x="64" y="240">codex</text>
<text class="mn path" x="272" y="240">…/orca/codex-runtime-home/home/hooks.json</text>
<text class="kr ok" x="784" y="240">installed</text>

<text class="mn ag" x="64" y="268">gemini</text>
<text class="mn path" x="272" y="268">$HOME/.gemini/settings.json</text>
<text class="kr ok" x="784" y="268">installed</text>

<text class="mn ag" x="64" y="296">cursor · antigravity · hermes</text>
<text class="kr path" x="272" y="296">각자의 홈 설정 파일 세 곳</text>
<text class="kr ok" x="784" y="296">installed</text>

<line class="hair" x1="64" y1="312" x2="936" y2="312"/>
<text class="kr note" x="64" y="332">나머지 여덟은 not_installed. orca agent hooks off 로 제거할 수 있고, 끄면 진행 표시만 빈약해집니다.</text>
</svg>

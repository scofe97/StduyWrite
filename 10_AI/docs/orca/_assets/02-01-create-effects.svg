<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" role="img" aria-labelledby="t9 d9">
<title id="t9">worktree create 한 줄이 만드는 폴더·브랜치·터미널</title>
<desc id="d9">명령 하나가 폴더·브랜치·터미널 셋을 동시에 만들고 원본 폴더는 그대로 둔다는 것을 보이는 그림입니다. 자동 생성되는 터미널만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.lbl{fill:var(--ink);font-size:13px;font-weight:600}
.note{fill:var(--muted);font-size:10px}
.ok{fill:var(--ok);font-size:11px}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
.legend{fill:var(--soft);font-size:10px}
</style>
<rect width="1000" height="356" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">ONE COMMAND · THREE EFFECTS</text>
<text class="kr h1" x="64" y="76">명령 한 줄이 셋을 만듭니다</text>
<text class="mn sub" x="64" y="98">orca worktree create --repo id:&lt;repoId&gt; --name demo-a --json</text>

<rect class="box" x="64" y="140" width="216" height="88" rx="4"/>
<text class="kr lbl" x="88" y="168">원본 폴더</text>
<text class="mn note" x="88" y="188">$HOME/orca-practice</text>
<text class="kr ok" x="88" y="212">건드려지지 않습니다</text>

<path class="arrow" d="M280 184 L360 152"/><path class="arrow" d="M352 147 L360 152 L354 160"/>
<path class="arrow" d="M280 184 L360 216"/><path class="arrow" d="M352 210 L360 216 L350 217"/>
<path class="arrow" d="M280 184 L360 280"/><path class="arrow" d="M352 273 L360 280 L350 280"/>

<rect class="box" x="360" y="128" width="576" height="52" rx="4"/>
<text class="kr lbl" x="384" y="150">① 폴더</text>
<text class="mn note" x="504" y="150">$HOME/orca/workspaces/orca-practice/demo-a</text>
<text class="kr note" x="384" y="170">원본 옆이 아니라 홈 디렉터리 아래입니다</text>

<rect class="box" x="360" y="192" width="576" height="52" rx="4"/>
<text class="kr lbl" x="384" y="214">② 브랜치</text>
<text class="mn note" x="504" y="214">refs/heads/demo-a</text>
<text class="kr note" x="384" y="234">이름은 --name 값을 그대로 씁니다</text>

<rect x="360" y="256" width="576" height="52" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr lbl" x="384" y="278">③ 터미널</text>
<text class="mn note" x="504" y="278">connected: true</text>
<text class="kr note" x="384" y="298">--agent 를 주지 않아도 하나가 붙습니다</text>

<line x1="64" y1="330" x2="936" y2="330" stroke="var(--rule)" stroke-width="1"/>
<text class="kr legend" x="64" y="350">앱 화면은 전환되지 않습니다. 바로 보려면 --activate, --agent 를 주면 자동 전환됩니다.</text>
</svg>

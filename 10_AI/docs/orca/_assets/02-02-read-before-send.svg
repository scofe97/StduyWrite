<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" role="img" aria-labelledby="te de">
<title id="te">읽고 판별한 뒤에 보내는 3단 절차</title>
<desc id="de">터미널을 먼저 읽고 화면이 무엇인지 판별한 뒤에만 Enter를 보내는 절차와, 판별 결과에 따라 갈리는 세 갈래를 그린 흐름도입니다. 멈추고 사람을 부르는 갈래만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--warn:#E3B341}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.lbl{fill:var(--ink);font-size:13px;font-weight:600}
.note{fill:var(--muted);font-size:10px}
.ok{fill:var(--ok);font-size:12px}
.warn{fill:var(--warn);font-size:12px}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
</style>
<rect width="1000" height="356" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">READ · JUDGE · SEND</text>
<text class="kr h1" x="64" y="76">Enter 는 화면에 뜬 것을 확정합니다</text>
<text class="kr sub" x="64" y="98">무엇이 떠 있는지 모르고 보내면 엉뚱한 승인을 하게 됩니다. 한 줄이 늘어날 뿐입니다.</text>

<rect class="box" x="64" y="140" width="216" height="60" rx="4"/>
<text class="kr lbl" x="88" y="166">① 읽는다</text>
<text class="mn note" x="88" y="184">terminal read --limit 20</text>

<path class="arrow" d="M280 170 L344 170"/><path class="arrow" d="M336 165 L344 170 L336 175"/>

<rect class="box" x="344" y="140" width="200" height="60" rx="4"/>
<text class="kr lbl" x="368" y="166">② 판별한다</text>
<text class="kr note" x="368" y="184">지금 화면이 무엇인가</text>

<path class="arrow" d="M544 158 L616 116"/><path class="arrow" d="M608 112 L616 116 L612 124"/>
<path class="arrow" d="M544 170 L616 196"/><path class="arrow" d="M608 190 L616 196 L606 197"/>
<path class="arrow" d="M544 184 L616 276"/><path class="arrow" d="M608 269 L616 276 L606 275"/>

<rect class="box" x="616" y="92" width="320" height="52" rx="4"/>
<text class="kr ok" x="640" y="114">신뢰 확인이 떠 있다</text>
<text class="mn note" x="640" y="132">send --text "" --enter</text>

<rect class="box" x="616" y="172" width="320" height="52" rx="4"/>
<text class="kr ok" x="640" y="194">이미 작업을 시작했다</text>
<text class="kr note" x="640" y="212">아무것도 보내지 않습니다</text>

<rect x="608" y="252" width="336" height="52" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr warn" x="640" y="274">예상 못 한 다른 질문이다</text>
<text class="kr note" x="640" y="292">멈추고 사람을 부릅니다</text>

<line x1="64" y1="328" x2="936" y2="328" stroke="var(--rule)" stroke-width="1"/>
<text class="kr note" x="64" y="348">v1.4.176 재실측에서는 신뢰 확인이 아예 뜨지 않은 사례도 있었습니다. 그래서 절차를 화면에 따라 가릅니다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t3 d3">
<title id="t3">사람과 에이전트가 같은 CLI를 통해 런타임에 닿는 경로</title>
<desc id="d3">사람은 앱 화면과 CLI 두 경로를 쓰지만 에이전트는 CLI 한 경로만 쓸 수 있고, 두 경로가 같은 런타임으로 모이는 구조입니다. 에이전트 경로만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.lbl{fill:var(--ink);font-size:13px;font-weight:600}
.note{fill:var(--muted);font-size:10px}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
.arrowA{stroke:var(--accent);stroke-width:1.4;fill:none}
.legend{fill:var(--soft);font-size:10px}
</style>
<rect width="1000" height="340" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">WHY CLI IS NOT OPTIONAL</text>
<text class="kr h1" x="64" y="76">에이전트에게는 명령이 유일한 통로입니다</text>
<text class="kr sub" x="64" y="98">사람은 화면과 명령 두 경로를 쓰지만, 에이전트는 마우스를 쓰지 못해 아래 한 경로만 남습니다.</text>

<rect class="box" x="64" y="132" width="176" height="56" rx="4"/>
<text class="kr lbl" x="88" y="158">사람</text>
<text class="kr note" x="88" y="176">클릭과 명령 둘 다</text>

<rect x="64" y="216" width="176" height="56" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr lbl" x="88" y="242">코딩 에이전트</text>
<text class="kr note" x="88" y="260">명령만</text>

<rect class="box" x="380" y="120" width="192" height="56" rx="4"/>
<text class="kr lbl" x="404" y="146">데스크톱 앱 화면</text>
<text class="kr note" x="404" y="164">재현되지 않습니다</text>

<rect class="box" x="380" y="224" width="192" height="56" rx="4"/>
<text class="mn lbl" x="404" y="250">orca CLI</text>
<text class="kr note" x="404" y="268">232개 명령 · 재현됩니다</text>

<rect class="box" x="712" y="172" width="224" height="56" rx="4"/>
<text class="kr lbl" x="736" y="198">ORCA 런타임</text>
<text class="kr note" x="736" y="216">워크트리 · 터미널 · 브라우저</text>

<path class="arrow" d="M240 152 L380 148"/><path class="arrow" d="M372 143 L380 148 L372 153"/>
<path class="arrow" d="M240 168 L380 244"/><path class="arrow" d="M372 237 L380 244 L370 245"/>
<path class="arrowA" d="M240 244 L380 250"/><path class="arrowA" d="M372 245 L380 250 L372 255"/>
<path class="arrow" d="M572 156 L712 190"/><path class="arrow" d="M704 183 L712 190 L702 191"/>
<path class="arrow" d="M572 248 L712 212"/><path class="arrow" d="M704 205 L712 212 L710 202"/>

<line x1="64" y1="300" x2="936" y2="300" stroke="var(--rule)" stroke-width="1"/>
<text class="kr legend" x="64" y="320">주황 경로가 에이전트에게 남은 단 하나의 경로입니다. 그래서 CLI 표면적이 곧 위임 가능한 작업의 범위가 됩니다.</text>
</svg>

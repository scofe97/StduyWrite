<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="tb db">
<title id="tb">파일 상태별로 삭제가 막히는지와 삭제 후 남는지</title>
<desc id="db">커밋됨·수정됨·새 파일·gitignore 네 가지 파일 상태에 대해 git status 노출 여부, 삭제 차단 여부, 삭제 후 생존 여부를 비교한 행렬입니다. gitignore 행만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--bad:#F0616D;--warn:#E3B341}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.state{fill:var(--ink);font-size:13px}
.mn2{font-size:11px}
.ok{fill:var(--ok);font-size:12px}
.bad{fill:var(--bad);font-size:12px}
.warn{fill:var(--warn);font-size:12px}
.mut{fill:var(--muted);font-size:12px}
.hair{stroke:var(--rule);stroke-width:1}
.legend{fill:var(--soft);font-size:10px}
</style>
<rect width="1000" height="400" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">WHAT SURVIVES worktree rm</text>
<text class="kr h1" x="64" y="76">막는 것과 사라지는 것은 다릅니다</text>
<text class="kr sub" x="64" y="98">삭제를 막아 주는 것과 삭제 후 남는 것이 일치하지 않는 줄이 하나 있습니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">파일 상태</text>
<text class="mn col" x="368" y="148">git status 에 보이나</text>
<text class="kr col" x="580" y="148">rm 을 막나</text>
<text class="kr col" x="760" y="148">삭제 후</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="kr state" x="64" y="196">커밋됨</text>
<text class="kr mut" x="368" y="196">아니오</text>
<text class="kr mut" x="580" y="196">아니오</text>
<text class="kr ok" x="760" y="196">브랜치에 남음</text>

<text class="kr state" x="64" y="236">수정됨 (추적 중)</text>
<text class="mn mn2 mut" x="368" y="236">예 · M</text>
<text class="kr bad" x="580" y="236">예</text>
<text class="kr bad" x="760" y="236">사라짐</text>

<text class="kr state" x="64" y="276">새 파일 (추적 안 됨)</text>
<text class="kr mn2 mut" x="368" y="276">예 · ??</text>
<text class="kr bad" x="580" y="276">예</text>
<text class="kr bad" x="760" y="276">사라짐</text>

<rect x="56" y="296" width="888" height="48" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr state" x="64" y="326">.gitignore 에 걸림</text>
<text class="kr bad" x="368" y="326">아니오</text>
<text class="kr bad" x="580" y="326">아니오</text>
<text class="kr bad" x="760" y="326">조용히 사라짐</text>

<line class="hair" x1="64" y1="364" x2="936" y2="364"/>
<text class="kr legend" x="64" y="384">마지막 줄만 세 칸이 모두 위험 쪽입니다. 보이지도 않고 막아 주지도 않으며 함께 사라집니다.</text>
</svg>

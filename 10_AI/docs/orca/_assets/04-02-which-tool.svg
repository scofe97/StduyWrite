<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="tx dx">
<title id="tx">대상에 따라 브라우저 명령과 컴퓨터 유즈를 가르는 기준</title>
<desc id="dx">조작 대상이 무엇이냐에 따라 브라우저 명령과 컴퓨터 유즈 중 어느 것을 쓸지 다섯 줄로 나눈 표입니다. 내장 브라우저 웹 페이지 행만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.tgt{fill:var(--ink);font-size:13px}
.tool{fill:var(--info);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="340" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">PICK BY TARGET</text>
<text class="kr h1" x="64" y="76">대상이 무엇이냐로 갈립니다</text>
<text class="kr sub" x="64" y="98">웹 페이지라면 브라우저 명령이 항상 낫습니다. 컴퓨터 유즈는 거기 닿을 수 없는 곳을 위한 도구입니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">조작 대상</text>
<text class="kr col" x="560" y="148">쓸 것</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<rect x="56" y="176" width="888" height="44" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr tgt" x="64" y="196">ORCA 내장 브라우저의 웹 페이지</text>
<text class="kr tool" x="560" y="196">브라우저 명령</text>
<text class="kr note" x="64" y="214">스냅샷이 짧고 네트워크·콘솔까지 봅니다</text>

<text class="kr tgt" x="64" y="252">일반 데스크톱 앱</text>
<text class="kr tool" x="560" y="252">컴퓨터 유즈</text>
<text class="kr tgt" x="64" y="284">외부 브라우저의 창</text>
<text class="kr tool" x="560" y="284">컴퓨터 유즈</text>
<text class="kr tgt" x="64" y="316">ORCA 앱 자신의 UI · 웹뷰 앱</text>
<text class="kr tool" x="560" y="316">컴퓨터 유즈</text>
</svg>

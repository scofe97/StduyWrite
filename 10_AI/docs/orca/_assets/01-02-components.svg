<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t4 d4">
<title id="t4">앱·런타임·CLI·번들 엔진의 관계와 두 진입 경로</title>
<desc id="d4">데스크톱 앱과 orca CLI가 각각 런타임에 닿고, 런타임이 번들 엔진 셋을 불러 쓰는 구조입니다. 런타임만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12)}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.lbl{fill:var(--ink);font-size:13px;font-weight:600}
.note{fill:var(--muted);font-size:10px}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
.legend{fill:var(--soft);font-size:10px}
</style>
<rect width="1000" height="400" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">COMPONENTS</text>
<text class="kr h1" x="64" y="76">화면과 처리부가 나뉘어 있습니다</text>
<text class="kr sub" x="64" y="98">두 진입 경로가 같은 런타임으로 모입니다. 그래서 창 없이 런타임만 띄우거나 남의 런타임에 붙을 수 있습니다.</text>

<rect class="box" x="64" y="140" width="200" height="60" rx="4"/>
<text class="kr lbl" x="88" y="166">데스크톱 앱</text>
<text class="kr note" x="88" y="184">Electron · 브라우저 내장</text>

<rect class="box" x="64" y="248" width="200" height="60" rx="4"/>
<text class="mn lbl" x="88" y="274">orca CLI</text>
<text class="kr note" x="88" y="292">얇습니다 · 로직 없음</text>

<rect x="380" y="184" width="216" height="80" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr lbl" x="404" y="212">ORCA 런타임</text>
<text class="kr note" x="404" y="232">워크트리 · 터미널 · 태스크</text>
<text class="mn note" x="404" y="250">runtimeId 로 자기를 밝힘</text>

<rect class="box" x="712" y="132" width="224" height="52" rx="4"/>
<text class="kr lbl" x="736" y="154">브라우저 자동화 엔진</text>
<text class="kr note" x="736" y="172">06장 · 별도 설치 없음</text>

<rect class="box" x="712" y="196" width="224" height="52" rx="4"/>
<text class="kr lbl" x="736" y="218">데스크톱 제어 프로바이더</text>
<text class="kr note" x="736" y="236">07장 · 컴퓨터 유즈</text>

<rect class="box" x="712" y="260" width="224" height="52" rx="4"/>
<text class="kr lbl" x="736" y="282">원격 중계</text>
<text class="kr note" x="736" y="300">09장 · 페어링</text>

<path class="arrow" d="M264 176 L380 204"/><path class="arrow" d="M372 197 L380 204 L370 205"/>
<path class="arrow" d="M264 272 L380 244"/><path class="arrow" d="M372 237 L380 244 L370 243"/>
<path class="arrow" d="M596 216 L712 158"/><path class="arrow" d="M704 152 L712 158 L706 166"/>
<path class="arrow" d="M596 224 L712 222"/><path class="arrow" d="M704 217 L712 222 L704 227"/>
<path class="arrow" d="M596 232 L712 286"/><path class="arrow" d="M704 278 L712 286 L702 286"/>

<line x1="64" y1="344" x2="936" y2="344" stroke="var(--rule)" stroke-width="1"/>
<text class="kr legend" x="64" y="364">번들 엔진은 런타임이 필요할 때 불러 씁니다. 사용자가 직접 실행하는 대상이 아닙니다.</text>
<text class="kr legend" x="64" y="382">런타임이 응답하지 않으면 CLI 가 멀쩡해도 할 수 있는 일이 없습니다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 424" role="img" aria-labelledby="tl dl">
<title id="tl">메시지 타입 여덟 개의 방향과 뜻</title>
<desc id="dl">여덟 개 메시지 타입을 방향과 뜻과 함께 한 줄씩 나열한 표입니다. 코디네이터에서 워커로 가는 것은 dispatch 하나뿐이고, worker_done 행만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.ty{fill:var(--ink);font-size:12px}
.dir{fill:var(--info);font-size:11px}
.mean{fill:var(--muted);font-size:11px}
.hair{stroke:var(--rule);stroke-width:1}
.legend{fill:var(--soft);font-size:10px}
</style>
<rect width="1000" height="424" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">EIGHT TYPES · THE VOCABULARY</text>
<text class="kr h1" x="64" y="76">어휘가 여덟 개로 고정돼 있습니다</text>
<text class="kr sub" x="64" y="98">고정돼 있어야 코디네이터가 세고 판정할 수 있습니다. 자유 텍스트로는 안 됩니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">타입</text>
<text class="kr col" x="320" y="148">방향</text>
<text class="kr col" x="520" y="148">의미</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="mn ty" x="64" y="192">dispatch</text><text class="kr dir" x="320" y="192">코디 → 워커</text><text class="kr mean" x="520" y="192">이 일을 해라</text>
<text class="mn ty" x="64" y="220">status</text><text class="kr dir" x="320" y="220">워커 → 코디</text><text class="kr mean" x="520" y="220">지금 이런 상황이다</text>
<text class="mn ty" x="64" y="248">heartbeat</text><text class="kr dir" x="320" y="248">워커 → 코디</text><text class="kr mean" x="520" y="248">살아 있다 · 아직 작업 중</text>

<rect x="56" y="264" width="888" height="36" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn ty" x="64" y="288">worker_done</text><text class="kr dir" x="320" y="288">워커 → 코디</text><text class="kr mean" x="520" y="288">끝냈다 · --outcome 필수, 실패도 포함</text>

<text class="mn ty" x="64" y="328">escalation</text><text class="kr dir" x="320" y="328">워커 → 코디</text><text class="kr mean" x="520" y="328">막혔다, 풀어 달라</text>
<text class="mn ty" x="64" y="356">decision_gate</text><text class="kr dir" x="320" y="356">워커 → 코디</text><text class="kr mean" x="520" y="356">판단이 필요하다</text>
<text class="mn ty" x="64" y="384">merge_ready</text><text class="kr dir" x="320" y="384">워커 → 코디</text><text class="kr mean" x="520" y="384">병합 가능한 상태다</text>
<text class="mn ty" x="64" y="412">handoff</text><text class="kr dir" x="320" y="412">워커 → 워커·코디</text><text class="kr mean" x="520" y="412">소유권을 넘긴다</text>
</svg>

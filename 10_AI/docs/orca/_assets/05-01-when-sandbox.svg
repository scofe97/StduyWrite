<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="u7 v7">
<title id="u7">워크트리로 충분한 구간과 일회용 환경이 필요한 구간</title>
<desc id="v7">개인 PC의 소수 에이전트부터 신뢰할 수 없는 코드를 다루는 경우까지 다섯 상황을 놓고 워크트리로 충분한지 일회용 환경이 필요한지 표시한 표입니다. 필수 구간만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--warn:#E3B341;--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.sit{fill:var(--ink);font-size:12px}
.ok{fill:var(--ok);font-size:12px}
.warn{fill:var(--warn);font-size:12px}
.bad{fill:var(--bad);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="320" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">WHEN YOU ACTUALLY NEED IT</text>
<text class="kr h1" x="64" y="76">대부분은 아직 필요 없습니다</text>
<text class="kr sub" x="64" y="98">다만 필요해지는 조건이 분명합니다. 마지막 줄은 선택이 아니라 필수입니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">상황</text>
<text class="kr col" x="624" y="148">판단</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="kr sit" x="64" y="196">개인 PC 에서 에이전트 1~3개</text>
<text class="kr ok" x="624" y="196">워크트리로 충분</text>

<text class="kr sit" x="64" y="228">에이전트가 전역 환경을 오염시킨다</text>
<text class="kr warn" x="624" y="228">검토할 값어치 있음</text>

<text class="kr sit" x="64" y="260">팀이 같은 환경을 공유해야 한다</text>
<text class="kr warn" x="624" y="260">검토할 값어치 있음</text>

<rect x="56" y="276" width="888" height="40" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr sit" x="64" y="294">신뢰할 수 없는 코드를 다룬다</text>
<text class="kr bad" x="624" y="294">필수</text>
<text class="kr note" x="64" y="310">저장소 안의 파일이 에이전트에게 지시를 심을 수 있고, 워크트리는 그것을 막지 못합니다</text>
</svg>

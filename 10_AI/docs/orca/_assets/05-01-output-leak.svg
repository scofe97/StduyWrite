<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" role="img" aria-labelledby="u5 v5">
<title id="u5">조회 명령별로 함께 노출되는 정보</title>
<desc id="v5">다섯 조회 명령이 각각 의도한 것 외에 무엇을 함께 보여 주는지 나열한 표이고, 아래에 공유 전 지울 항목이 적혀 있습니다. 페어링 코드가 섞이는 명령만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.cmd{fill:var(--ink);font-size:12px}
.leak{fill:var(--muted);font-size:11px}
.bad{fill:var(--bad);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="356" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">WHAT ELSE COMES OUT</text>
<text class="kr h1" x="64" y="76">의도하지 않은 것이 함께 나옵니다</text>
<text class="kr sub" x="64" y="98">이 노트를 쓰는 동안에도 무관한 프로젝트의 워크트리 네 개가 함께 나왔습니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">명령</text>
<text class="kr col" x="392" y="148">함께 나오는 것</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<rect x="56" y="176" width="888" height="44" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn cmd" x="64" y="196">repo list</text>
<text class="kr leak" x="392" y="196">등록한 모든 프로젝트 경로 · 원격 연결 id</text>
<text class="kr bad" x="392" y="214">페어링 코드가 섞이면 그 자체가 실행 권한 유출입니다</text>

<text class="mn cmd" x="64" y="252">worktree ps</text>
<text class="kr leak" x="392" y="252">다른 프로젝트의 워크트리 경로 · 터미널 마지막 줄</text>

<text class="mn cmd" x="64" y="284">diagnostics memory</text>
<text class="kr leak" x="392" y="284">모든 워크트리 경로 · 세션 PID</text>

<text class="mn cmd" x="64" y="316">orchestration inbox · task-list</text>
<text class="kr leak" x="392" y="316">그 우편함·Run 의 메시지와 태스크 명세</text>

<text class="mn cmd" x="64" y="348">computer get-app-state</text>
<text class="kr leak" x="392" y="348">화면에 보이는 모든 것 — 앱 이름 · 열린 파일명</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="tc dc">
<title id="tc">프로젝트·호스트 셋업·Repo 세 층의 관계</title>
<desc id="dc">프로젝트 하나 아래에 기기마다 호스트 셋업이 하나씩, 셋업마다 Repo 폴더가 하나씩 붙는 3계층 스택입니다. 호스트 셋업 층만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12)}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.idx{fill:var(--soft);font-size:9px;letter-spacing:.1em}
.name{fill:var(--ink);font-size:15px;font-weight:600}
.note{fill:var(--muted);font-size:10px}
.cnt{fill:var(--muted);font-size:11px}
</style>
<rect width="1000" height="320" fill="var(--paper)"/>
<text class="mn eyebrow" x="120" y="44">PROJECT · HOST SETUP · REPO</text>
<text class="kr h1" x="120" y="76">repo add 하나가 세 층을 다 만듭니다</text>
<text class="kr sub" x="120" y="98">한 기기에서만 일한다면 project 명령 일곱 개는 쓸 일이 없습니다.</text>

<rect x="120" y="128" width="816" height="56" rx="4" fill="var(--paper2)" stroke="var(--rule)" stroke-width="1"/>
<text class="mn idx" x="144" y="152">L1</text>
<text class="kr name" x="216" y="156">프로젝트</text>
<text class="kr note" x="216" y="172">일감의 논리적 이름</text>
<text class="mn note" x="560" y="156">id: repo:&lt;repoId&gt; 로 자동 생성</text>
<text class="kr cnt" x="840" y="156">1개</text>

<rect x="120" y="192" width="816" height="56" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn idx" x="144" y="216">L2</text>
<text class="kr name" x="216" y="220">호스트 셋업</text>
<text class="kr note" x="216" y="236">특정 기기에서의 실제 위치</text>
<text class="mn note" x="560" y="220">setupMethod: legacy-repo</text>
<text class="kr cnt" x="840" y="220">기기마다 1개</text>

<rect x="120" y="256" width="816" height="56" rx="4" fill="var(--paper2)" stroke="var(--rule)" stroke-width="1"/>
<text class="mn idx" x="144" y="280">L3</text>
<text class="kr name" x="216" y="284">Repo</text>
<text class="kr note" x="216" y="300">그 기기의 실제 폴더</text>
<text class="mn note" x="560" y="284">$HOME/orca-practice</text>
<text class="kr cnt" x="840" y="284">셋업마다 1개</text>
</svg>

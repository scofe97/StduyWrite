<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="u9 v9">
<title id="u9">성공 응답과 오류 응답이 각각 어느 방향으로 어긋나는가</title>
<desc id="v9">성공 응답은 안 됐을 수 있고 오류 응답은 됐을 수 있다는 양방향 어긋남을 좌우로 배치하고, 둘 다 결론이 상태 확인으로 모인다는 것을 보인 그림입니다. 오류 응답 쪽만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.lbl{fill:var(--ink);font-size:13px;font-weight:600}
.ok{fill:var(--ok);font-size:11px}
.bad{fill:var(--bad);font-size:11px}
.note{fill:var(--muted);font-size:10px}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
</style>
<rect width="1000" height="300" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">BOTH DIRECTIONS DRIFT</text>
<text class="kr h1" x="64" y="76">양쪽 다 어긋납니다</text>
<text class="kr sub" x="64" y="98">방향은 반대인데 결론은 같습니다. 응답과 무관하게 상태를 한 번 확인합니다.</text>

<rect class="box" x="64" y="136" width="304" height="72" rx="4"/>
<text class="mn lbl" x="88" y="164">ok: true</text>
<text class="kr bad" x="88" y="186">안 됐을 수 있습니다</text>

<rect x="472" y="136" width="304" height="72" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn lbl" x="496" y="164">runtime_unavailable</text>
<text class="kr ok" x="496" y="186">됐을 수 있습니다</text>
<text class="kr note" x="496" y="204">세 번 연속 오류였는데 셋 다 지워져 있었습니다</text>

<path class="arrow" d="M216 208 L216 244 L500 244"/><path class="arrow" d="M492 239 L500 244 L492 249"/>
<path class="arrow" d="M624 208 L624 244"/>

<rect class="box" x="360" y="252" width="280" height="40" rx="4"/>
<text class="kr lbl" x="384" y="277">상태를 확인한다</text>
</svg>

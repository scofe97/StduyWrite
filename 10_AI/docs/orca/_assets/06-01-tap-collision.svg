<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="ue ve">
<title id="ue">tap 지정 여부에 따라 다른 제품이 잡히는 상황</title>
<desc id="ve">tap 없이 brew 명령을 쓰면 이름만 같은 다른 제품이 잡혀 엉뚱한 버전과 폐기 예고가 나오고, tap을 붙이면 제대로 나오는 대비 그림입니다. tap 없는 쪽만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.cmd{fill:var(--ink);font-size:12px}
.out{fill:var(--muted);font-size:11px}
.bad{fill:var(--bad);font-size:11px}
.ok{fill:var(--ok);font-size:11px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="320" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">NAME COLLISION</text>
<text class="kr h1" x="64" y="76">tap 을 생략하면 다른 제품이 잡힙니다</text>
<text class="kr sub" x="64" y="98">설치된 것은 1.4.188 인데 1.3.1 로 내리라는 화살표가 붙고, 남의 폐기 예고가 함께 나옵니다.</text>

<rect x="56" y="128" width="888" height="88" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn cmd" x="64" y="152">brew info --cask orca</text>
<text class="mn bad" x="64" y="174">==&gt; orca (Orca): 1.4.188 → 1.3.1</text>
<text class="mn out" x="64" y="192">Generate images of interactive plotly charts</text>
<text class="kr bad" x="64" y="210">전혀 다른 제품입니다. upgrade 를 이렇게 쓰면 위험합니다</text>

<rect x="56" y="232" width="888" height="72" rx="4" fill="var(--paper2)" stroke="var(--rule)" stroke-width="1"/>
<text class="mn cmd" x="64" y="256">brew info --cask stablyai/orca/orca</text>
<text class="mn ok" x="64" y="278">==&gt; orca (Orca): 1.4.188 (auto_updates)</text>
<text class="mn out" x="64" y="296">IDE for orchestrating AI coding agents across terminals and worktrees</text>
</svg>

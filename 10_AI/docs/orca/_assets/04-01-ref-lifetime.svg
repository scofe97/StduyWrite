<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="tv dv">
<title id="tv">ref 가 유지되는 조작과 무효가 되는 조작</title>
<desc id="dv">값만 바뀌는 조작에서는 ref가 유지되고 페이지 이동·탭 전환·구조 변경에서는 무효가 된다는 것을 두 묶음으로 나눈 표입니다. 값만 바뀌는 쪽만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.act{fill:var(--ink);font-size:13px}
.ok{fill:var(--ok);font-size:12px}
.bad{fill:var(--bad);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="320" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">REF LIFETIME</text>
<text class="kr h1" x="64" y="76">매번 다시 찍을 필요는 없습니다</text>
<text class="kr sub" x="64" y="98">ref 는 탭 단위입니다. 다른 탭의 같은 번호는 다른 요소입니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">무슨 일이 있었나</text>
<text class="kr col" x="560" y="148">ref</text>
<text class="kr col" x="712" y="148">알려 주는 신호</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<rect x="56" y="176" width="888" height="44" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr act" x="64" y="196">입력·클릭으로 값만 바뀜</text>
<text class="kr ok" x="560" y="196">유지</text>
<text class="kr note" x="712" y="196">재스냅샷 불필요</text>
<text class="kr note" x="64" y="214">로그인 폼을 채우고 눌러도 e1~e5 가 그대로였습니다</text>

<text class="kr act" x="64" y="252">페이지 이동 (goto · 링크)</text>
<text class="kr bad" x="560" y="252">무효</text>
<text class="mn note" x="712" y="252">browser_stale_ref</text>

<text class="kr act" x="64" y="284">탭 전환</text>
<text class="kr bad" x="560" y="284">무효</text>
<text class="mn note" x="712" y="284">browser_stale_ref</text>

<text class="kr act" x="64" y="312">구조가 크게 바뀜 (모달 등)</text>
<text class="kr bad" x="560" y="312">무효</text>
<text class="mn note" x="712" y="312">browser_stale_ref</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 336" role="img" aria-labelledby="td dd">
<title id="td">워크트리 생성 방식에 따라 핸들을 얻는 세 경로</title>
<desc id="dd">에이전트를 함께 띄운 경우·워크트리만 만든 경우·터미널을 따로 만든 경우 각각 핸들이 어느 필드에서 나오는지 비교한 표입니다. terminal create 경로만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.way{fill:var(--ink);font-size:12px}
.field{fill:var(--ink);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.warn{fill:var(--bad);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="336" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">WHERE THE HANDLE COMES FROM</text>
<text class="kr h1" x="64" y="76">핸들은 만든 방식에 따라 다른 자리에 있습니다</text>
<text class="kr sub" x="64" y="98">핸들은 실행마다 새로 생깁니다. 스크립트에 박아 두면 다음 실행에서 깨집니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">만든 방식</text>
<text class="kr col" x="452" y="148">핸들이 있는 자리</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="mn way" x="64" y="196">worktree create --agent claude</text>
<text class="mn field" x="452" y="196">result.agentTerminalHandle</text>
<text class="kr note" x="64" y="214">에이전트를 함께 띄운 경우</text>

<text class="mn way" x="64" y="252">worktree create</text>
<text class="kr field" x="452" y="252">응답에 없음 — terminal list 로 조회</text>
<text class="kr note" x="64" y="270">터미널은 자동으로 붙지만 응답에 안 실립니다</text>

<rect x="56" y="284" width="888" height="44" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn way" x="64" y="306">terminal create</text>
<text class="mn field" x="452" y="306">result.terminal.handle</text>
<text class="kr warn" x="452" y="322">result.handle 이 아닙니다 — 빈 값을 넘기면 terminal_handle_stale</text>
</svg>

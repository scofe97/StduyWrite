<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" role="img" aria-labelledby="tz dz">
<title id="tz">automations create 응답에서 읽어야 할 다섯 필드</title>
<desc id="dz">워크트리 방식·시간대·다음 실행 시각·만회 유예·저장된 표현식 다섯 필드가 각각 무엇을 알려 주는지 정리한 표입니다. 다음 실행 시각 행만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.f{fill:var(--ink);font-size:12px}
.v{fill:var(--info);font-size:11px}
.why{fill:var(--muted);font-size:11px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="372" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">READ THE RESPONSE</text>
<text class="kr h1" x="64" y="76">응답이 동작을 다 알려 줍니다</text>
<text class="kr sub" x="64" y="98">플래그는 --cron 이 아니라 --trigger 입니다. 값으로 프리셋·cron·RRULE 을 받습니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">필드</text>
<text class="kr col" x="336" y="148">실측값</text>
<text class="kr col" x="576" y="148">무엇을 알려 주나</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="mn f" x="64" y="196">workspaceMode</text>
<text class="mn v" x="336" y="196">new_per_run</text>
<text class="kr why" x="576" y="196">실행마다 새 워크트리 — 격리이자 정리 부담</text>

<text class="mn f" x="64" y="236">timezone</text>
<text class="mn v" x="336" y="236">Asia/Seoul</text>
<text class="kr why" x="576" y="236">안 주면 OS 설정을 따릅니다</text>

<rect x="56" y="252" width="888" height="52" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn f" x="64" y="278">nextRunAt</text>
<text class="mn v" x="336" y="278">1787781600000</text>
<text class="kr why" x="576" y="278">사람 시각으로 2026-08-27 07:00 KST</text>
<text class="kr note" x="576" y="296">만든 직후 이 값을 보는 것이 스케줄 실수를 가장 많이 잡습니다</text>

<text class="mn f" x="64" y="332">missedRunGraceMinutes</text>
<text class="mn v" x="336" y="332">720</text>
<text class="kr why" x="576" y="332">놓친 실행을 12시간 안에 한 번만 만회</text>

<text class="mn f" x="64" y="364">rrule</text>
<text class="mn v" x="336" y="364">0 7 * * *</text>
<text class="kr why" x="576" y="364">준 표현식이 그대로 저장됩니다</text>
</svg>

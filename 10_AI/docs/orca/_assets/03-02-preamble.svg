<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="tq dq">
<title id="tq">dispatch 가 워커 프롬프트 앞에 붙이는 규약 블록의 구성</title>
<desc id="dq">주입되는 4648자 규약 블록이 신원·보고·생존신호·질문·정리 다섯 덩어리로 이뤄져 있고 그 뒤에 실제 지시가 붙는 구조를 보인 계층 그림입니다. 보고 규약 덩어리만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12)}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.idx{fill:var(--soft);font-size:9px;letter-spacing:.1em}
.name{fill:var(--ink);font-size:14px;font-weight:600}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="400" fill="var(--paper)"/>
<text class="mn eyebrow" x="120" y="44">INJECTED PREAMBLE · 4,648 CHARS · v1.4.188</text>
<text class="kr h1" x="120" y="76">보고 규약은 배분이 넣어 줍니다</text>
<text class="kr sub" x="120" y="98">태스크 명세에 적을 수 없는 것들입니다. 핸들과 태스크 id 가 이미 채워져 들어옵니다.</text>

<rect x="120" y="128" width="816" height="48" rx="4" fill="var(--paper2)" stroke="var(--rule)" stroke-width="1"/>
<text class="mn idx" x="144" y="150">01</text>
<text class="kr name" x="216" y="152">신원</text>
<text class="kr note" x="400" y="152">코디네이터 핸들 · 자기 태스크 id · 다른 채널로 사람을 찾지 말 것</text>

<rect x="120" y="184" width="816" height="60" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn idx" x="144" y="208">02</text>
<text class="kr name" x="216" y="210">보고</text>
<text class="kr note" x="400" y="204">worker_done 정확히 한 번 · --outcome 필수 · 실패를 산문으로만 남기지 말 것</text>
<text class="kr note" x="400" y="224">본문은 세 문장 요약 · taskId 와 dispatchId 를 둘 다 실을 것</text>

<rect x="120" y="252" width="816" height="48" rx="4" fill="var(--paper2)" stroke="var(--rule)" stroke-width="1"/>
<text class="mn idx" x="144" y="274">03</text>
<text class="kr name" x="216" y="276">생존 신호</text>
<text class="kr note" x="400" y="276">5분마다 heartbeat — 생각 중과 멈춤을 코디네이터가 구분하는 근거</text>

<rect x="120" y="308" width="816" height="48" rx="4" fill="var(--paper2)" stroke="var(--rule)" stroke-width="1"/>
<text class="mn idx" x="144" y="330">04</text>
<text class="kr name" x="216" y="332">질문</text>
<text class="kr note" x="400" y="332">에이전트 자체 질문 UI 금지 — 코디네이터가 못 보고 못 답해 세션이 멈춥니다</text>

<rect x="120" y="364" width="816" height="24" rx="4" fill="var(--paper2)" stroke="var(--rule)" stroke-width="1"/>
<text class="mn idx" x="144" y="380">05</text>
<text class="kr name" x="216" y="382">정리</text>
<text class="kr note" x="400" y="382">보고 후 폴링 금지 · 터미널은 닫지 말 것 (재배분이 옵니다) · 그 뒤에 실제 지시</text>
</svg>

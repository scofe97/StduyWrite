<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" role="img" aria-labelledby="ui vi">
<title id="ui">명령별로 예상과 다른 플래그 이름</title>
<desc id="vi">규칙에서 벗어난 플래그 일곱 가지를 틀리기 쉬운 형태와 맞는 형태로 나란히 놓은 표입니다. 응답 구조 함정 행만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.cmd{fill:var(--ink);font-size:11px}
.bad{fill:var(--bad);font-size:11px}
.ok{fill:var(--ok);font-size:11px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="372" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">FLAG TRAPS</text>
<text class="kr h1" x="64" y="76">규칙에서 벗어난 자리만 모았습니다</text>
<text class="kr sub" x="64" y="98">기억나지 않으면 일부러 틀리게 실행하세요. 대부분 validFlags 가 정답을 알려 줍니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">명령</text>
<text class="kr col" x="424" y="148">틀리기 쉬운 것</text>
<text class="kr col" x="656" y="148">맞는 것</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="mn cmd" x="64" y="192">orchestration gate-resolve</text>
<text class="mn bad" x="424" y="192">--gate</text>
<text class="mn ok" x="656" y="192">--id</text>

<text class="mn cmd" x="64" y="220">repo set-base-ref</text>
<text class="mn bad" x="424" y="220">--base-ref</text>
<text class="mn ok" x="656" y="220">--ref</text>

<text class="mn cmd" x="64" y="248">automations create</text>
<text class="mn bad" x="424" y="248">--cron</text>
<text class="mn ok" x="656" y="248">--trigger</text>

<text class="mn cmd" x="64" y="276">find</text>
<text class="kr bad" x="424" y="276">플래그 생략</text>
<text class="mn ok" x="656" y="276">--action 필수</text>

<text class="mn cmd" x="64" y="304">skills get · vm recipe doctor</text>
<text class="kr bad" x="424" y="304">--skill / id 생략</text>
<text class="kr ok" x="656" y="304">위치 인자로</text>

<rect x="56" y="320" width="888" height="44" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn cmd" x="64" y="342">terminal create 응답</text>
<text class="mn bad" x="424" y="342">result.handle</text>
<text class="mn ok" x="656" y="342">result.terminal.handle</text>
<text class="kr note" x="64" y="358">플래그가 아니라 응답 구조입니다. 빈 값을 넘기면 뒤가 전부 terminal_handle_stale 로 막힙니다</text>
</svg>

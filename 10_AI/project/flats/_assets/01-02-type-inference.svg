<title id="dt">매니페스트 type·kind 및 진입점 결정 알고리즘</title><desc id="dd">flats.json의 명시적 선언을 우선하며 생략 시 번들 파일 구성에 따라 결정론적으로 타입을 추론합니다</desc>

<title id="dt">불변 리비전 누적과 롤백, 쿼터 보존 타임라인</title><desc id="dd">리비전 1~4 생성 후 리비전 3으로 롤백하여 신규 5번을 생성하고 unpinned 항목을 정리하는 순서</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">REVISION TIMELINE · ROLLBACK &amp; QUOTA RETENTION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">불변 리비전 누적과 롤백, 쿼터 보존 타임라인</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">과거 이력은 덮어쓰지 않고 새 리비전으로 누적하며 핀·최신 항목은 자동 삭제에서 보호</text>
<line x1="48" y1="240" x2="912" y2="240" stroke="rgba(191,192,192,0.22)" stroke-width="1.6"/>
<line x1="110" y1="230" x2="110" y2="250" stroke="#8B98A9" stroke-width="2.0"/>
<rect x="55" y="130" width="110" height="80" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>
<text x="110" y="152" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">rev 1</text>
<text x="110" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">kind: created</text>
<text x="110" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">초기 생성</text>

<text x="260" y="152" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">rev 2</text>
<text x="260" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#6A95D8">kind: agent</text>
<text x="260" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">에이전트 수정</text>
<line x1="410" y1="230" x2="410" y2="250" stroke="#E3B341" stroke-width="2.0"/>
<rect x="355" y="130" width="110" height="80" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="410" y="152" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">rev 3</text>
<text x="410" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#E3B341">kind: person</text>
<text x="410" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">사람 편집 확정</text>

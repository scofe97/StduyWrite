<rect x="68" y="358" width="240" height="58" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="80" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="600" fill="#F0616D">1. 100개 초과 시 자동 정리</text>
<text x="80" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">오래된 unpinned 리비전 삭제 (rev 1, 2…)</text>
<rect x="360" y="358" width="240" height="58" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="372" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="600" fill="#E3B341">2. 핀 리비전 (rev 3) 보호</text>
<text x="372" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">리비전 쿼터 미차감 · 자동 삭제 제외</text>
<rect x="650" y="358" width="240" height="58" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="662" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="600" fill="#3FB98C">3. 최신 리비전 (rev 5) 보존</text>
<text x="662" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">쿼터가 1이어도 최신 리비전은 유지</text>

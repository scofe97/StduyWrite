<line x1="750" y1="230" x2="750" y2="250" stroke="#3FB98C" stroke-width="2.0"/>
<rect x="695" y="130" width="110" height="80" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="750" y="152" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">rev 5</text>

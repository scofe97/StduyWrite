<text x="260" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">2. 워커 프로세스</text>
<rect x="482" y="100" width="236" height="380" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="496" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">3. QuickJS VM 풀</text>
<rect x="734" y="100" width="206" height="380" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="748" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">4. SQLite 저장소</text>
<rect x="34" y="136" width="180" height="64" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="46" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">HTTP 요청 인입</text>
<text x="46" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">GET / (:17879)</text>

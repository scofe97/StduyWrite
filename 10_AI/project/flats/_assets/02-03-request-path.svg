<title id="dt">fetch 핸들러와 SQLite 요청 처리 흐름</title><desc id="dd">방문자 요청의 Unix 소켓 수납·VM 풀 할당·동기식 호스트 브리지 호출</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DATA FLOW · FETCH HANDLER PATH</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">fetch 핸들러와 SQLite 요청 처리 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">GET / ──&gt; flats serve ──&gt; worker ServeHTTP ──&gt; jsPool (≤4) ──&gt; host("db.query")</text>
<rect x="20" y="100" width="210" height="380" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="34" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">1. 호스트 인입</text>

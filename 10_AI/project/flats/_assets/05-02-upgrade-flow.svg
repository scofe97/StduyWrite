<text x="430" y="364" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#3FB98C">정지 상태 유지</text>
<rect x="616" y="160" width="158" height="64" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.9"/>
<text x="624" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">서비스 로드</text>

<title id="dt">Flats 호스트 업그레이드 절차</title><desc id="dd">서비스 정지, 전체 백업, 바이너리 교체, 스키마 마이그레이션 및 5대 검증</desc>
<rect width="1000" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">HOST LIFECYCLE · UPGRADE PIPELINE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Flats 호스트 업그레이드 절차</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">다운그레이드 불가에 대비해 정지 후 전체 백업을 선행합니다</text>
<rect x="24" y="104" width="178" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="113.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">1. 정지</text>
<text x="113.0" y="136" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">bootout</text>
<rect x="24" y="152" width="178" height="280" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<path d="M 202 292.0 L 218 292.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="218" y="104" width="178" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="307.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">2. 사전 백업</text>
<text x="307.0" y="136" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">cp -Rp</text>
<rect x="218" y="152" width="178" height="280" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<path d="M 396 292.0 L 412 292.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="412" y="104" width="178" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="501.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">3. 바이너리</text>
<text x="501.0" y="136" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">install.sh</text>
<rect x="412" y="152" width="178" height="280" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<path d="M 590 292.0 L 606 292.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="606" y="104" width="178" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="695.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">4. 기동</text>
<text x="695.0" y="136" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">bootstrap</text>
<rect x="606" y="152" width="178" height="280" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.3"/>
<path d="M 784 292.0 L 800 292.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="800" y="104" width="178" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="889.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">5. 검증</text>
<text x="889.0" y="136" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">5대 확인</text>
<rect x="800" y="152" width="178" height="280" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.3"/>
<rect x="34" y="160" width="158" height="64" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.9"/>
<text x="42" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">launchctl bootout</text>
<text x="42" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#8B98A9">gui/&lt;uid&gt;/serve</text>
<text x="42" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">exit 0 종료</text>
<rect x="34" y="234" width="158" height="64" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="42" y="254" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">포트 해제 확인</text>
<text x="42" y="272" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">lsof LISTEN</text>
<text x="42" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">리스너 없음</text>
<rect x="34" y="308" width="158" height="80" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<text x="42" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">WAL 체크포인트</text>
<text x="42" y="346" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#F5F5F3">-wal/-shm 소멸</text>
<text x="42" y="364" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#3FB98C">단일 DB 수렴</text>
<rect x="228" y="160" width="158" height="64" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<text x="236" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">데이터 복사</text>
<text x="236" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#8B98A9">cp -Rp &lt;data&gt;</text>
<text x="236" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">권한 보존 (0700)</text>
<rect x="228" y="234" width="158" height="64" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.9"/>
<text x="236" y="254" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">동일성 확인</text>
<text x="236" y="272" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#8B98A9">diff -r &lt;원본&gt; &lt;백업&gt;</text>
<text x="236" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">일치 (7.7M)</text>
<rect x="228" y="308" width="158" height="80" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.9"/>
<text x="236" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">비밀 키 포함</text>
<text x="236" y="346" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">secret.key 평문</text>
<text x="236" y="364" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#F5F5F3">.gitignore 제외</text>
<rect x="422" y="160" width="158" height="64" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>

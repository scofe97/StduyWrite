<path d="M 575 152 L 630 152" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="602" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#F0616D">불일치</text>
<path d="M 575 230 L 630 230" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="602" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#3FB98C">매칭</text>
<rect x="36" y="330" width="210" height="150" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="48" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">tailnet 피어 요청 (예시)</text>
<text x="48" y="374" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">&lt;slug&gt;.&lt;tailnet&gt;.ts.net</text>
<rect x="46" y="390" width="190" height="75" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="0.8"/>
<text x="54" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#E3B341">위조 시도 헤더:</text>
<text x="54" y="432" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8.5" font-weight="400" fill="#F0616D">Tailscale-User-Login:</text>
<text x="64" y="450" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F0616D">attacker</text>
<rect x="295" y="330" width="280" height="150" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="310" y="352" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">tsnet.Net.identity</text>
<text x="310" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#E3B341">1. isIdentityHeader 삭제</text>
<text x="310" y="402" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">2. lc.WhoIs(RemoteAddr)</text>
<text x="310" y="426" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">3. !who.Node.IsTagged()</text>
<text x="310" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">4. RFC 2047 Q-인코딩 주입</text>
<rect x="630" y="330" width="330" height="150" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="645" y="352" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">nd.handler.ServeHTTP(w, r)</text>
<text x="645" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">주입된 신원 헤더:</text>
<rect x="645" y="390" width="300" height="50" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="0.8"/>
<text x="655" y="410" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#3FB98C">Tailscale-User-Login: alice@tailnet</text>
<text x="655" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#3FB98C">Tailscale-User-Name: Alice</text>
<text x="645" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#5E6B7E">decided_by 기록 및 전달</text>

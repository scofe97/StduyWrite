<title id="dt">Host 라우팅과 Tailscale 신원</title><desc id="dd">Host 분기와 WhoIs 신원 주입</desc>
<rect width="1000" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DATA FLOW · HOST ROUTING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Host 라우팅과 Tailscale 신원</text>
<rect x="20" y="85" width="960" height="195" rx="8" fill="rgba(245,245,245,0.02)" stroke="#F08A59" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="36" y="107" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">1. 로컬 루프백 (7879)</text>
<rect x="20" y="295" width="960" height="205" rx="8" fill="rgba(245,245,245,0.02)" stroke="#6A95D8" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="36" y="317" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">2. tailnet 노드 (:443)</text>
<rect x="36" y="120" width="210" height="145" rx="6" fill="#F08A5910" stroke="#F08A59" stroke-width="1.0"/>
<text x="48" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">수신 Host 헤더</text>
<rect x="46" y="150" width="190" height="30" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="0.8"/>
<text x="54" y="170" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#3FB98C">try-pod-doc.localhost:7879</text>
<rect x="46" y="185" width="190" height="30" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="0.8"/>
<text x="54" y="205" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#F0616D">evil.example:7879</text>
<rect x="46" y="220" width="190" height="30" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="0.8"/>
<text x="54" y="240" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#E3B341">a.b.localhost:7879</text>
<rect x="295" y="120" width="280" height="145" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="310" y="142" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">local.Net.ServeHTTP</text>
<text x="310" y="168" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">TrimSuffix(".localhost")</text>
<text x="310" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">단일 라벨 검증</text>
<text x="310" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#E3B341">Tailscale-User-* 삭제</text>
<text x="310" y="240" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#3FB98C">hosts[label] 매핑</text>
<rect x="630" y="120" width="330" height="64" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.0"/>
<text x="645" y="142" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">404 Not Found</text>
<text x="645" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8.5" font-weight="400" fill="#F5F5F3">"unknown host; use http://&lt;flat&gt;.localhost:&lt;port&gt;"</text>
<rect x="630" y="196" width="330" height="69" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="645" y="218" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">e.h.ServeHTTP(w, r)</text>
<text x="645" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">try-pod-doc 핸들러 (독립 origin)</text>

<title id="dt">비밀(secret) 암호화 저장 및 워커 주입 데이터 흐름</title><desc id="dd">운영자 설정에서 AES-256-GCM 봉인, flats.db 보관, 스냅샷 복호화 및 워커 전달 파이프라인</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECRETS LIFECYCLE · STORAGE &amp; INJECTION FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">비밀(secret) 암호화 저장 및 워커 주입 데이터 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">비밀값은 OS 환경변수나 인자로 노출되지 않고 오직 표준 입력(stdin)의 JSON 명세로만 안전하게 전달됩니다</text>
<text x="119.0" y="114" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">1. 운영자 입력 및 검증</text>
<text x="119.0" y="132" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">CLI · 콘솔 루프백 전용</text>
<text x="359.0" y="114" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">2. 호스트 키 봉인</text>
<text x="359.0" y="132" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">AES-256-GCM 암호화</text>
<text x="599.0" y="114" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">3. 활성화 시점 복호화</text>
<text x="599.0" y="132" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">captureEnvironment 스냅샷</text>
<text x="839.0" y="114" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">4. 워커 격리 주입</text>
<text x="839.0" y="132" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">stdin JSON 스트림 주입</text>
<rect x="24" y="160" width="190" height="220" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="119.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">SetSecret 권한 통제</text>
<line x1="36" y1="198" x2="202" y2="198" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="34" y="206" width="170" height="76" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.9"/>
<text x="42" y="222" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10.5" font-weight="600" fill="#3FB98C">flats secret set</text>
<text x="42" y="237" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#F5F5F3">ViaCLI · ViaConsole 만 허용</text>
<text x="42" y="251" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="8.2" font-weight="400" fill="#E3B341">헤더 식별 · 로컬 셸 프로세스는 못 막음</text>
<text x="42" y="265" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="8.5" font-weight="400" fill="#8B98A9">이름 ≤64자 · 값 ≤64 KiB</text>
<rect x="34" y="294" width="170" height="72" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.9"/>
<text x="42" y="314" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">SecretNames 조회</text>
<text x="42" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">API · MCP는 이름만 반환</text>
<text x="42" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">평문 값 원격 유출 차단</text>

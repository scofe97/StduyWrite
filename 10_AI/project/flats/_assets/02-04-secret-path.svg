<text x="599.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">스냅샷 캡처 시점</text>
<line x1="516" y1="198" x2="682" y2="198" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="514" y="210" width="170" height="72" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.9"/>
<text x="522" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">반영 시점 (Activation)</text>
<text x="522" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="8.2" font-weight="400" fill="#F5F5F3">배포·재배포·롤백·복원·재시작·미리보기</text>
<text x="522" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#E3B341">실행 중 워커는 즉시 안 바뀜</text>
<rect x="514" y="294" width="170" height="72" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<text x="522" y="314" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">decryptSecrets</text>
<text x="522" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">메모리 상에서만 일시 복호화</text>
<text x="522" y="350" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">newRedactor 로그 마스킹</text>

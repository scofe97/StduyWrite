<line x1="756" y1="198" x2="922" y2="198" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="754" y="210" width="170" height="72" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>

<title id="dt">MCP 수명주기와 Streamable HTTP 메시지 교환</title><desc id="dd">초기화(initialize)부터 도구 목록 조회(tools/list) 및 실행(tools/call)까지의 전송 규격</desc>
<rect width="960" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">MCP · STREAMABLE HTTP PROTOCOL LIFECYCLE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">MCP 수명주기와 Streamable HTTP 메시지 교환</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">모든 JSON-RPC 메시지는 POST /mcp 로 전송되며 상태 비저장(Stateless)으로 도구 메타데이터를 교환합니다</text>

<title id="dt">에이전트 초안 저장부터 콘솔 승인을 거친 공개까지의 데이터 흐름</title><desc id="dd">에이전트의 초안은 비공개로 격리되며 운영자의 버전 동결·배포·공개 승인을 거쳐야만 단계별로 활성화됩니다</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DATA FLOW · AGENT TO PUBLIC PIPELINE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">에이전트 초안 저장부터 콘솔 승인을 거친 공개까지의 데이터 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">에이전트(save_draft) → 루프백 MCP → Private Draft → create_version 대기 → 콘솔 승인 → vN → deploy 승인 → 라이브 → 공개</text>
<rect x="18" y="104" width="172" height="396" rx="8" fill="rgba(255,255,255,0.015)" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="32" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">에이전트 영역</text>
<text x="32" y="140" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">CLI · MCP 클라이언트</text>
<rect x="230" y="104" width="250" height="396" rx="8" fill="rgba(255,255,255,0.015)" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="244" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">격리 작업본 및 버전 동결</text>
<text x="244" y="140" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">루프백 127.0.0.1:7878</text>
<rect x="530" y="104" width="206" height="396" rx="8" fill="rgba(255,255,255,0.015)" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="544" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">로컬 라이브 서빙</text>
<text x="544" y="140" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">루프백 127.0.0.1:7879</text>

<title id="dt">파일 묶음에서 버전 해시를 만드는 결정적 파이프라인</title><desc id="dd">개별 파일 해시 계산, 경로 정렬, NUL 구분 결합을 거쳐 단일 버전 해시를 도출하는 데이터 흐름</desc>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">경로 정렬과 NUL 바이트 구분자로 경계 모호성을 제거하고 동일 내용에 동일 해시를 보장</text>
<text x="119.0" y="114" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">1. 원본 파일 집합</text>

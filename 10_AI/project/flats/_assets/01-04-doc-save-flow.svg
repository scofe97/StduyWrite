<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">승인 없이 live 에 즉시 서빙되며 덮어쓴 편집분은 직전 닫힌 person 리비전에 보존</text>

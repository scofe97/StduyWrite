<title id="dt">MX 우선순위 접속과 실패 시 큐 재시도 흐름</title><desc id="dd">1순위 접속 실패와 2순위 4xx 응답 시 발송 큐에 보관하고 RFC 권고 간격(최소 30분) 후 재시도하는 과정</desc>
<rect width="960" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · MX PRIORITY &amp; QUEUE RETRY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">MX 우선순위 접속과 실패 시 큐 재시도 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">우선순위 10 실패 후 우선순위 20으로 폴백하며 임시 오류 수신 시 로컬 큐에 보관하고 지연 후 다시 1순위부터 시도하는 흐름</text>

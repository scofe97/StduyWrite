<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">수신 MTA의 3단계 발신자 인증과 DMARC 정책 분기</title><desc id="dd">접속 IP와 봉투 주소로 SPF를 확인하고, 서명과 본문으로 DKIM을 검증한 뒤, 헤더 From과의 도메인 정렬로 최종 처리 정책을 결정합니다</desc>
<rect width="960" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · RECEIVER MTA AUTHENTICATION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">수신 MTA의 3단계 발신자 인증과 DMARC 정책 분기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">RFC 7208(SPF), RFC 6376(DKIM), RFC 7489 및 RFC 9989(DMARC) 수신 MTA 판단 기준</text>
<rect x="24" y="100" width="912" height="58" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">수신 메일</text>
<rect x="151.85" y="124" width="116.30000000000001" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="210" y="138" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">IP 198.51.100.1</text>
<rect x="364.11" y="124" width="211.78" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="470" y="138" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">MAIL FROM: bounce@example.com</text>
<rect x="694.5699999999999" y="124" width="170.86" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="780" y="138" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">From: alice@example.com</text>
<path d="M 250 158 L 250 186" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<path d="M 710 158 L 710 186" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="44" y="186" width="412" height="78" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="60" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">1. SPF 검사 (발송 IP 대조)</text>
<text x="60" y="226" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">DNS 질의: TXT example.com</text>
<text x="60" y="244" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">레코드: v=spf1 ip4:198.51.100.0/24 -all</text>
<rect x="345.72" y="216" width="68.56" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="380" y="230" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">SPF pass</text>
<rect x="504" y="186" width="412" height="78" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="520" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">2. DKIM 검사 (전자서명 검증)</text>
<text x="520" y="226" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">DNS 질의: TXT s1._domainkey.example.com</text>
<text x="520" y="244" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">서명 헤더: d=example.com · bh=해시 검증</text>
<rect x="802.31" y="216" width="75.38" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="840" y="230" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">DKIM pass</text>
<path d="M 250 264 L 250 286 L 480 286 L 480 306" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 710 264 L 710 286 L 480 286" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="80" y="306" width="800" height="72" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<text x="480" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">3. DMARC 식별자 정렬 (Identifier Alignment)</text>
<text x="480" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">헤더 From(example.com)과 인증 도메인 대조</text>
<rect x="192.5" y="352" width="135.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="260" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">SPF 정렬 pass</text>
<rect x="627.0" y="352" width="146.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="700" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">DKIM 정렬 pass</text>
<path d="M 250 378 L 250 428" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="190" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">정렬 성공 (Pass)</text>
<path d="M 710 378 L 710 428" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)"/>
<text x="770" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">정렬 실패 (Fail)</text>
<rect x="44" y="428" width="412" height="82" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.4"/>
<text x="250" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">DMARC pass (인증 및 정렬 통과)</text>
<text x="250" y="472" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">거부 정책 미적용 · SMTP 수락</text>
<text x="250" y="492" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이후 평판 및 콘텐츠 필터 평가 단계로</text>
<rect x="504" y="428" width="412" height="82" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="710" y="446" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">DMARC FAIL (도메인 정책 p= 집행)</text>
<rect x="514" y="460" width="118" height="42" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="0.9"/>
<text x="573" y="477" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">p=none</text>
<text x="573" y="493" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">모니터링 배달</text>
<rect x="646" y="460" width="128" height="42" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="0.9"/>
<text x="710" y="477" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">p=quarantine</text>
<text x="710" y="493" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스팸함 격리</text>
<rect x="788" y="460" width="118" height="42" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="0.9"/>
<text x="847" y="477" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">p=reject</text>
<text x="847" y="493" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수신 거부 (550)</text>
<line x1="12" y1="536" x2="912" y2="536" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="558" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="548" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">인증 통과 / 수신</text>
<rect x="274" y="548" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="296" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">식별자 정렬 / 핵심</text>
<rect x="461" y="548" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="483" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">격리 정책</text>
<rect x="570" y="548" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="592" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">인증 실패 / 거부</text>
<rect x="744" y="548" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="766" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">DNS 조회 / 검증</text>
</svg>
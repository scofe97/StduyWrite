<text x="330.0" y="331" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">250-8BITMIME</text>
<text x="330.0" y="357" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">STARTTLS 누락 목록 전달 (변조)</text>
<rect x="100" y="376" width="760" height="396" rx="4" fill="rgba(245,245,245,0.02)" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<rect x="100" y="376" width="40" height="18" rx="2" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="120" y="389" fill="#8B98A9" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">ALT</text>
<text x="116" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">[기회적 TLS 기본 동작 (암호화 실패 시 평문 폴백)]</text>
<path d="M 190 436 L 468 436" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<text x="330.0" y="427" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">MAIL FROM:&lt;alice@example.com&gt;</text>
<text x="330.0" y="453" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평문 전송 (도청 취약)</text>
<path d="M 490 472 L 768 472" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="630.0" y="463" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">MAIL FROM:&lt;alice@example.com&gt;</text>
<text x="630.0" y="489" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수신 서버로 평문 중계</text>
<path d="M 190 508 L 468 508" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<text x="330.0" y="499" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">DATA (본문 평문 노출)</text>
<text x="330.0" y="525" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패킷 스니핑 및 도청 피해</text>
<path d="M 490 544 L 768 544" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="630.0" y="535" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">DATA (본문 전달)</text>
<text x="630.0" y="561" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평문 메일 수신 완료</text>
<line x1="108" y1="576" x2="852" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="116" y="604" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">[MTA-STS enforce 모드 적용 시 (RFC 8461)]</text>
<path d="M 190 626 L 232 626 L 232 646 L 193 646" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="240" y="632" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">MTA-STS 정책 캐시 대조</text>
<text x="240" y="650" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">STARTTLS 미제공 탐지</text>
<path d="M 190 680 L 468 680" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="330.0" y="671" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">QUIT</text>
<text x="330.0" y="697" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평문 전송 거부 및 세션 즉시 중단</text>
<path d="M 490 716 L 768 716" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="630.0" y="707" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">QUIT</text>
<text x="630.0" y="733" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">세션 종료 전달</text>
<path d="M 190 742 L 232 742 L 232 762 L 193 762" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="240" y="748" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">TLS-RPT 실패 기록</text>
<text x="240" y="766" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">하루 단위 집계 보고서에 기록</text>
<line x1="12" y1="820" x2="912" y2="820" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="842" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="832" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="842" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공격 (STRIPTLS)</text>
<rect x="313" y="832" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="335" y="842" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">방어 (MTA-STS)</text>
<rect x="513" y="832" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="535" y="842" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">위험 (도청)</text>
<rect x="648" y="832" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="670" y="842" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보호 (QUIT·기록)</text>

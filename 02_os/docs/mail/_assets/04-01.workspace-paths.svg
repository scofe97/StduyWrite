<title id="dt">Google Workspace 외부 앱 발송 경로 선택</title><desc id="dd">외부 애플리케이션이 Google Workspace 환경에서 메일을 보낼 때 수신자 범위와 인증 지원 여부에 따라 선택하는 세 가지 경로</desc>
<rect width="960" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DECISION FLOW · GOOGLE WORKSPACE OUTBOUND</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Google Workspace 외부 앱 발송 경로 선택</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">수신자 범위(Gmail/Workspace 한정 여부)와 인증 수단(계정 자격 증명 또는 고정 IP)에 따른 발송 경로 결정 흐름</text>
<rect x="130" y="96" width="240" height="36" rx="18" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="250" y="119" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">외부 앱 메일 발송 설정</text>
<path d="M 250 132 L 250 178" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<polygon points="250,178 390,204 250,230 110,204" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="250" y="209" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">외부 일반 도메인 수신자 포함 여부</text>
<path d="M 390 204 L 570 204" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="480" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">Gmail/Workspace 수신자만</text>
<rect x="570" y="177" width="354" height="54" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="586" y="200" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">aspmx.l.google.com:25</text>
<text x="586" y="220" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Restricted SMTP · 인증 불필요 · Gmail/Workspace만</text>
<path d="M 250 230 L 250 286" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="264" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">예</text>
<polygon points="250,286 390,312 250,338 110,312" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="250" y="317" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">계정 인증(앱 비밀번호) 가능 여부</text>
<path d="M 390 312 L 570 312" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="480" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">예 (인증 가능)</text>
<rect x="570" y="285" width="354" height="54" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="586" y="308" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">smtp.gmail.com:587 / 465</text>
<text x="586" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Gmail SMTP · 앱 비밀번호 인증 · 사용자당 일 2,000통</text>
<path d="M 250 338 L 250 394" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="264" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">아니오</text>
<polygon points="250,394 390,420 250,446 110,420" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="250" y="425" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">고정 공인 IP 등록 가능 여부</text>
<path d="M 390 420 L 570 420" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="480" y="410" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">예 (IP 등록)</text>
<rect x="570" y="393" width="354" height="54" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="586" y="416" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">smtp-relay.gmail.com:587 / 465 / 25</text>
<text x="586" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SMTP relay · 고정 IP 허용 · 사용자당 일 10,000명</text>
<path d="M 250 446 L 250 492" fill="none" stroke="#E3B341" stroke-width="1.2" marker-end="url(#warn)"/>
<text x="264" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">아니오</text>
<rect x="120" y="492" width="260" height="36" rx="18" fill="#161B22" stroke="#E3B341" stroke-width="1.0"/>
<text x="250" y="515" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">발송 불가 (인증 또는 IP 등록 필수)</text>
<line x1="12" y1="536" x2="912" y2="536" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="558" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="548" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Gmail/Workspace 수신자만</text>
<rect x="404" y="548" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="426" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">계정 인증 (소규모 발송)</text>
<rect x="630" y="548" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="652" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IP 중계 (대량 릴레이)</text>
<rect x="856" y="548" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="878" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">발송 불가 조건</text>
</svg>
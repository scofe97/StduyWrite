<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">동일한 수신자를 지정하더라도 각 시대마다 클라이언트가 해석하는 주소와 실제 접속 대상이 달라집니다</text>

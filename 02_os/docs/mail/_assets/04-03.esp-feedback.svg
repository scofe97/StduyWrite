<title id="dt">ESP의 비동기 반송·컴플레인 피드백 루프</title><desc id="dd">메일 발송 위임 후 수신 MX의 5xx 거부 또는 사용자 스팸 신고가 발생했을 때 웹훅 이벤트를 통해 앱 DB에 반영되는 흐름</desc>

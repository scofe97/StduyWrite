<text x="42" y="108" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="500" fill="#5E6B7E">ZONE 1 · DOCKER HOST</text>
<rect x="440" y="104" width="296" height="380" rx="8" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="454" y="98" width="172.0" height="14" rx="2" fill="#0D1117"/>
<text x="462" y="108" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="500" fill="#5E6B7E">ZONE 2 · K8S WORKER NODE</text>
<rect x="768" y="104" width="192" height="380" rx="8" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 4"/>

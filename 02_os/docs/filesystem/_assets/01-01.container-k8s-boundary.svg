<title id="dt">컨테이너 rootfs FHS 와 호스트·클러스터 스토리지 경계</title><desc id="dd">왼쪽 Docker 호스트에서는 자유 경로가 바인드 마운트로 컨테이너 rootfs 에 연결되고, 오른쪽 Kubernetes 워커 노드에서는 파드가 노드 밖 클러스터 PVC 를 마운트하며 hostPath 는 노드 로컬 예외로 제한된다.</desc>
<rect width="980" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DOCKER &amp; KUBERNETES · FHS BOUNDARY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">컨테이너 rootfs FHS 와 호스트·클러스터 스토리지 경계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">FHS 는 컨테이너 내부 트리에 적용되고, 호스트 마운트 위치와 노드 독립 PVC 는 별도 규약을 따릅니다</text>
<rect x="20" y="104" width="396" height="380" rx="8" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 4"/>

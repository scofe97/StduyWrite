<text x="790" y="108" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="500" fill="#5E6B7E">CLUSTER STORAGE</text>
<path d="M 218 240 L 218 294" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)"/>
<text x="234" y="272" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="500" fill="#6A95D8">바인드 마운트</text>
<path d="M 588 260 L 588 326" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)" stroke-dasharray="5 4"/>

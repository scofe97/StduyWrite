<title id="dt">/opt 번들의 의존성 격리와 OS 패치 사각지대</title><desc id="dd">왼쪽 배포판 패키지는 /usr/lib 공유 라이브러리를 통해 OS 보안 패치를 일괄 반영받고, 오른쪽 /opt 번들은 자체 라이브러리로 충돌을 피하는 대신 공유 라이브러리 패치가 전파되지 않아 제품 별도 업그레이드가 필요하다.</desc>
<rect width="960" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FHS 3.0 · /USR VS /OPT BUNDLE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">/opt 번들의 의존성 격리와 OS 패치 사각지대</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">자체 번들은 /usr/lib 버전 충돌을 피하는 대신 공유 라이브러리 보안 패치 경로에서 벗어납니다</text>
<rect x="24" y="104" width="408" height="360" rx="8" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 4"/>

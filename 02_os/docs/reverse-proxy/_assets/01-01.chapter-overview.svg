<title id="dt">프록시 체인의 헤더 전달과 신뢰 경계</title><desc id="dd">클라이언트가 보낸 위조 헤더와 프록시가 덧붙인 헤더를 구분하고 신뢰 경계로 실제 클라이언트 IP 를 판별한다.</desc>
<rect width="960" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">02_OS / REVERSE-PROXY · 01-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프록시 체인의 헤더 전달과 신뢰 경계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위조 가능 구간(외부)과 신뢰 검증 구간(사내 프록시), 그리고 안전하게 전달받는 백엔드 애플리케이션</text>

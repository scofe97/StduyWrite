<svg viewBox="0 0 1000 540" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>policy routing — ip rule이 어느 라우팅 테이블을 볼지 고르고, 그 테이블이 next-hop을 정한다</title>
  <desc>리눅스는 라우팅 테이블이 하나가 아니라 여러 개다. 패킷이 나갈 때 먼저 ip rule 목록을 우선순위 순으로 훑어 어느 테이블을 볼지 고른다. 기본 규칙은 우선순위 0에서 local 테이블, 32766에서 main 테이블, 32767에서 default 테이블을 보게 되어 있다. fwmark로 분기하는 패턴에서는 iptables가 패킷에 mark를 박고, ip rule이 그 mark에 해당하는 별도 테이블로 보낸다. 고른 테이블 안에서 목적지에 맞는 항목이 next-hop과 나갈 인터페이스를 최종 결정한다. 이 두 단계, 즉 어느 테이블을 볼지와 그 안에서 어디로 보낼지가 풀리지 않으면 Pod CIDR 라우팅 디버깅이 안 된다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 10.5px; fill: rgb(138,133,128); }
      .stage  { font-size: 12px; font-weight: 800; fill: rgb(212,168,83); }
      .desc   { font-size: 10.5px; font-weight: 600; fill: #e8e4df; }
      .muted  { font-size: 9px; fill: rgb(138,133,128); }
      .mono   { font-size: 9.5px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .tbl    { font-size: 11px; font-weight: 800; fill: #0d0d0d; }
      .darkmono { font-size: 9px; font-weight: 700; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #0d0d0d; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="540" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">policy routing — 두 단계다: 어느 테이블을 볼지, 그 안에서 어디로 보낼지</text>
  <text x="24" y="52" class="sub">라우팅 테이블은 하나가 아니다. ip rule이 테이블을 고르고, 고른 테이블이 next-hop을 정한다.</text>

  <!-- 1단계: ip rule -->
  <text x="24" y="88" class="stage">① ip rule — 우선순위 순으로 훑어 볼 테이블을 고른다</text>
  <rect x="40" y="100" width="410" height="150" rx="10" fill="rgb(24,20,14)" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <rect x="60" y="118" width="370" height="28" rx="4" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="72" y="137" class="mono" style="fill:rgb(138,133,128)">0:      from all lookup local</text>
  <rect x="60" y="150" width="370" height="28" rx="4" fill="rgb(30,26,16)" stroke="rgb(212,168,83)" stroke-width="1.1"/>
  <text x="72" y="169" class="mono" style="fill:rgb(212,168,83)">100:    fwmark 0x100 lookup 100   ← 커스텀</text>
  <rect x="60" y="182" width="370" height="28" rx="4" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="72" y="201" class="mono" style="fill:rgb(138,133,128)">32766:  from all lookup main</text>
  <rect x="60" y="214" width="370" height="28" rx="4" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="72" y="233" class="mono" style="fill:rgb(138,133,128)">32767:  from all lookup default</text>

  <!-- fwmark 설명 -->
  <rect x="480" y="100" width="480" height="150" rx="10" fill="rgb(20,22,26)" stroke="#5b9bd5" stroke-width="1.1"/>
  <text x="500" y="124" class="desc" style="fill:#8fc0ec">fwmark 분기 패턴</text>
  <text x="500" y="146" class="muted">iptables가 패킷에 mark를 박으면, ip rule이 그 mark를 보고</text>
  <text x="500" y="162" class="muted">해당 테이블로 보낸다. Cilium·MetalLB BGP가 이 방식을 쓴다.</text>
  <rect x="500" y="176" width="440" height="26" rx="4" fill="rgb(16,20,28)" stroke="#5b9bd5"/>
  <text x="512" y="194" class="mono" style="fill:#8fc0ec">iptables -t mangle -j MARK --set-mark 0x100</text>
  <rect x="500" y="208" width="440" height="26" rx="4" fill="rgb(16,20,28)" stroke="#5b9bd5"/>
  <text x="512" y="226" class="mono" style="fill:#8fc0ec">ip rule add fwmark 0x100 table 100</text>

  <!-- 화살표 -->
  <line x1="245" y1="250" x2="245" y2="286" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="300" y="272" class="muted" style="fill:rgb(212,168,83)">고른 테이블로 내려감</text>

  <!-- 2단계: 테이블들 -->
  <text x="24" y="312" class="stage">② 고른 테이블이 목적지에 맞는 next-hop을 정한다</text>

  <rect x="40" y="324" width="290" height="150" rx="10" fill="#5b9bd5"/>
  <text x="185" y="348" class="tbl" text-anchor="middle">local (255)</text>
  <rect x="56" y="360" width="258" height="24" rx="4" fill="#dceaf7"/>
  <text x="68" y="377" class="darkmono" style="fill:#10243a">자기 노드 IP 항목</text>
  <text x="185" y="410" class="darkmono" text-anchor="middle">"이 주소는 나야" 판정</text>
  <text x="185" y="440" class="darkmono" text-anchor="middle">우선순위 0 — 가장 먼저</text>

  <rect x="355" y="324" width="290" height="150" rx="10" fill="#66bb6a"/>
  <text x="500" y="348" class="tbl" text-anchor="middle">main (254)</text>
  <rect x="371" y="360" width="258" height="24" rx="4" fill="#e6f7e7"/>
  <text x="383" y="377" class="darkmono" style="fill:#14521d">default via 172.18.0.1 dev eth0</text>
  <rect x="371" y="390" width="258" height="24" rx="4" fill="#e6f7e7"/>
  <text x="383" y="407" class="darkmono" style="fill:#14521d">10.244.0.0/24 dev cni0 (자기 Pod)</text>
  <rect x="371" y="420" width="258" height="24" rx="4" fill="#e6f7e7"/>
  <text x="383" y="437" class="darkmono" style="fill:#14521d">10.244.1.0/24 via 172.18.0.3 (타 노드)</text>
  <text x="500" y="462" class="darkmono" text-anchor="middle">일반 라우팅 — ip route가 보여주는 것</text>

  <rect x="670" y="324" width="290" height="150" rx="10" fill="#d4a853"/>
  <text x="815" y="348" class="tbl" text-anchor="middle">default (253)</text>
  <rect x="686" y="360" width="258" height="24" rx="4" fill="#fdf3df"/>
  <text x="698" y="377" class="darkmono" style="fill:#5a3d0a">보통 비어 있는 폴백</text>
  <text x="815" y="410" class="darkmono" text-anchor="middle">앞 테이블이 못 잡으면</text>
  <text x="815" y="440" class="darkmono" text-anchor="middle">마지막에 참조</text>

  <text x="24" y="504" class="muted">두 단계가 풀리지 않으면 Pod CIDR 라우팅 디버깅이 안 된다. "어느 테이블을 보나(ip rule)"와 "그 안에서 어디로(테이블 항목)"를 나눠 본다.</text>
</svg>

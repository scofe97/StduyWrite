<svg viewBox="0 0 1000 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Linux bridge와 FDB — 여러 veth를 묶는 가상 L2 스위치가 MAC을 학습해 전달한다</title>
  <desc>Linux bridge는 root 네임스페이스에 있는 가상 L2 스위치로 struct net_bridge로 표현되며 안에 forwarding database인 FDB를 갖는다. 여러 Pod의 veth 한쪽 끝이 이 bridge에 꽂히면 같은 L2 도메인이 되어 ARP로 서로를 찾는다. bridge는 어떤 포트에서 어떤 source MAC을 봤는지 FDB에 학습하고, 다음 패킷이 그 MAC으로 향하면 곧장 학습된 포트로 전달한다. 모르는 MAC은 모든 포트로 flooding한다. 같은 노드 두 Pod 사이 통신은 이 bridge 안에서 L2로 끝나고, 다른 노드로 나갈 때만 라우팅 테이블이 uplink로 보낸다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 10.5px; fill: rgb(138,133,128); }
      .ns     { font-size: 11.5px; font-weight: 800; }
      .pod    { font-size: 11px; font-weight: 800; fill: #0d0d0d; }
      .podmono{ font-size: 9px; font-weight: 700; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #0d0d0d; }
      .iface  { font-size: 10px; font-weight: 700; fill: #8fc0ec; }
      .br     { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .desc   { font-size: 10.5px; font-weight: 600; fill: #e8e4df; }
      .muted  { font-size: 9px; fill: rgb(138,133,128); }
      .mono   { font-size: 9px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .fdbrow { font-size: 9px; font-weight: 700; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #0d0d0d; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">Linux bridge와 FDB — MAC을 학습하는 가상 L2 스위치</text>
  <text x="24" y="52" class="sub">여러 veth를 한 bridge에 꽂으면 같은 L2 도메인. 본 적 있는 MAC은 학습된 포트로 직행, 모르는 MAC은 flooding.</text>

  <!-- Pod A -->
  <rect x="40" y="86" width="180" height="70" rx="9" fill="#d4a853"/>
  <text x="130" y="112" class="pod" text-anchor="middle">Pod A</text>
  <text x="130" y="134" class="podmono" text-anchor="middle">eth0 10.244.0.5</text>

  <!-- Pod B -->
  <rect x="40" y="240" width="180" height="70" rx="9" fill="#d4a853"/>
  <text x="130" y="266" class="pod" text-anchor="middle">Pod B</text>
  <text x="130" y="288" class="podmono" text-anchor="middle">eth0 10.244.0.6</text>

  <!-- Pod C -->
  <rect x="40" y="394" width="180" height="70" rx="9" fill="#d4a853"/>
  <text x="130" y="420" class="pod" text-anchor="middle">Pod C</text>
  <text x="130" y="442" class="podmono" text-anchor="middle">eth0 10.244.0.7</text>

  <!-- veth 인터페이스 -->
  <rect x="280" y="98" width="110" height="46" rx="7" fill="rgb(20,22,26)" stroke="#5b9bd5" stroke-width="1.1"/>
  <text x="335" y="120" class="iface" text-anchor="middle">veth-host-A</text>
  <text x="335" y="136" class="muted" text-anchor="middle">port 1</text>
  <rect x="280" y="252" width="110" height="46" rx="7" fill="rgb(20,22,26)" stroke="#5b9bd5" stroke-width="1.1"/>
  <text x="335" y="274" class="iface" text-anchor="middle">veth-host-B</text>
  <text x="335" y="290" class="muted" text-anchor="middle">port 2</text>
  <rect x="280" y="406" width="110" height="46" rx="7" fill="rgb(20,22,26)" stroke="#5b9bd5" stroke-width="1.1"/>
  <text x="335" y="428" class="iface" text-anchor="middle">veth-host-C</text>
  <text x="335" y="444" class="muted" text-anchor="middle">port 3</text>

  <line x1="220" y1="121" x2="276" y2="121" stroke="rgb(212,168,83)" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="248" y="113" class="muted" text-anchor="middle">veth</text>
  <line x1="220" y1="275" x2="276" y2="275" stroke="rgb(212,168,83)" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="220" y1="429" x2="276" y2="429" stroke="rgb(212,168,83)" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- bridge -->
  <rect x="450" y="120" width="240" height="320" rx="12" fill="#66bb6a"/>
  <text x="570" y="150" class="br" text-anchor="middle">cni0 bridge</text>
  <text x="570" y="170" class="podmono" text-anchor="middle">struct net_bridge · 10.244.0.1</text>

  <!-- FDB 테이블 -->
  <rect x="470" y="192" width="200" height="180" rx="8" fill="#e6f7e7" stroke="#14521d" stroke-width="1.2"/>
  <text x="570" y="214" class="fdbrow" text-anchor="middle" style="fill:#14521d">FDB (MAC → port 학습)</text>
  <rect x="484" y="226" width="172" height="30" rx="4" fill="#cdeccf"/>
  <text x="494" y="246" class="fdbrow" style="fill:#14521d">aa:..:A5 → port 1</text>
  <rect x="484" y="262" width="172" height="30" rx="4" fill="#cdeccf"/>
  <text x="494" y="282" class="fdbrow" style="fill:#14521d">bb:..:B6 → port 2</text>
  <rect x="484" y="298" width="172" height="30" rx="4" fill="#cdeccf"/>
  <text x="494" y="318" class="fdbrow" style="fill:#14521d">cc:..:C7 → port 3</text>
  <text x="570" y="352" class="podmono" text-anchor="middle">모르는 MAC은 전 포트 flooding</text>

  <line x1="390" y1="121" x2="446" y2="150" stroke="rgb(212,168,83)" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="390" y1="275" x2="446" y2="275" stroke="rgb(212,168,83)" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="390" y1="429" x2="446" y2="405" stroke="rgb(212,168,83)" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- uplink -->
  <rect x="760" y="250" width="200" height="60" rx="8" fill="rgb(20,22,26)" stroke="#5b9bd5" stroke-width="1.2"/>
  <text x="860" y="276" class="desc" text-anchor="middle" style="fill:#8fc0ec">eth0 uplink</text>
  <text x="860" y="296" class="muted" text-anchor="middle">다른 노드 행 → 라우팅</text>
  <line x1="690" y1="280" x2="756" y2="280" stroke="#66bb6a" stroke-width="2" marker-end="url(#arg)"/>
  <text x="723" y="272" class="muted" text-anchor="middle" style="fill:#66bb6a">L3</text>

  <!-- 결론 -->
  <rect x="40" y="486" width="920" height="46" rx="8" fill="rgb(20,30,22)" stroke="#66bb6a" stroke-width="1.1"/>
  <text x="500" y="508" class="desc" text-anchor="middle" style="fill:#66bb6a">같은 노드 A→B 통신은 bridge 안에서 L2로 끝난다 (EA→veth→FDB 조회→veth→EB). 다른 노드로 갈 때만 uplink로 라우팅.</text>
</svg>

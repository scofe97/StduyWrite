<svg viewBox="0 0 900 600" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>kube-proxy nftables 모드 — 리눅스 구조 위에서 netfilter 안 셋·맵으로 선형 탐색을 없앤다</title>
  <desc>리눅스 구조로 보면 위쪽 사용자 공간의 kube-proxy가 nft 명령으로 규칙을 심고, 이 규칙은 커널 공간의 netfilter 안에 그대로 담긴다. iptables와 같은 netfilter 훅을 쓰지만 규칙 표현을 셋과 맵 자료구조로 다시 설계한 점이 다르다. 조회할 때 목록을 훑지 않고 셋 안에서 해시로 매칭하므로 선형 탐색 자체가 사라진다. IPVS처럼 별도 서브시스템을 끌어들이지 않고 netfilter 하나 안에서 같은 문제를 해결한다는 것이 핵심 차이다. v1.33에서 정식 승격됐고 커널 5.13 이상이 필요하다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .role   { font-size: 11px; font-weight: 700; fill: #66bb6a; }
      .zone   { font-size: 11px; font-weight: 800; }
      .desc   { font-size: 10.5px; font-weight: 600; fill: #e8e4df; }
      .muted  { font-size: 9.5px; fill: rgb(138,133,128); }
      .mono   { font-size: 9.5px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .big    { font-size: 14px; font-weight: 800; fill: #0d0d0d; }
      .badge  { font-size: 12px; font-weight: 800; fill: #0d0d0d; }
      .darkmono { font-size: 9.5px; font-weight: 700; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #0d0d0d; }
      .darkdesc { font-size: 10.5px; font-weight: 700; fill: #0d0d0d; }
    </style>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="600" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">nftables 모드 — netfilter 안에서 셋·맵으로 찾는다</text>
  <text x="24" y="52" class="role">정체 — iptables 자리를 물려받는 정식 후계자</text>

  <!-- USER SPACE -->
  <rect x="24" y="70" width="852" height="80" rx="10" fill="rgb(16,24,18)" stroke="#66bb6a" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="40" y="92" class="zone" style="fill:#66bb6a">USER SPACE (사용자 공간)</text>
  <rect x="40" y="102" width="230" height="38" rx="7" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="155" y="126" class="mono" text-anchor="middle" style="fill:#66bb6a">kube-proxy</text>
  <rect x="300" y="102" width="200" height="38" rx="7" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="400" y="126" class="mono" text-anchor="middle" style="fill:#66bb6a">nft 명령</text>
  <line x1="270" y1="121" x2="296" y2="121" stroke="#66bb6a" stroke-width="1.6" marker-end="url(#arg)"/>
  <text x="540" y="126" class="muted" style="fill:rgb(138,133,128)">규칙을 셋·맵 형태로 심는다</text>

  <line x1="450" y1="150" x2="450" y2="176" stroke="#66bb6a" stroke-width="2" marker-end="url(#arg)"/>

  <!-- KERNEL SPACE -->
  <rect x="24" y="180" width="852" height="312" rx="10" fill="rgb(12,16,22)" stroke="#5b9bd5" stroke-width="1.3"/>
  <text x="40" y="202" class="zone" style="fill:#8fc0ec">KERNEL SPACE (커널 공간)</text>

  <!-- netfilter 하나 안에 다 있음 강조 -->
  <rect x="40" y="216" width="816" height="120" rx="9" fill="rgb(16,24,18)" stroke="#66bb6a" stroke-width="1.4"/>
  <text x="60" y="240" class="desc" style="fill:#66bb6a">netfilter — 별도 서브시스템 없이 이 안에 셋·맵으로 규칙을 담는다</text>

  <rect x="60" y="252" width="230" height="40" rx="7" fill="rgb(20,22,26)" stroke="#66bb6a" stroke-width="1.1"/>
  <text x="175" y="277" class="mono" text-anchor="middle" style="fill:#66bb6a">조회: 10.96.74.151:80</text>

  <rect x="330" y="248" width="300" height="70" rx="9" fill="#66bb6a"/>
  <text x="480" y="278" class="big" text-anchor="middle">set / map 매칭</text>
  <text x="480" y="302" class="darkmono" text-anchor="middle">→ 선형 탐색 자체가 없다</text>
  <line x1="290" y1="272" x2="326" y2="278" stroke="#66bb6a" stroke-width="2" marker-end="url(#arg)"/>

  <rect x="660" y="252" width="176" height="66" rx="8" fill="rgb(20,30,22)" stroke="#66bb6a" stroke-width="1.1"/>
  <text x="748" y="282" class="desc" text-anchor="middle" style="fill:#66bb6a">해시 조회 한 번</text>
  <text x="748" y="304" class="mono" text-anchor="middle" style="fill:#66bb6a">비용 일정</text>
  <line x1="630" y1="283" x2="656" y2="283" stroke="#66bb6a" stroke-width="2" marker-end="url(#arg)"/>

  <!-- 두 특성 -->
  <rect x="40" y="350" width="408" height="58" rx="8" fill="rgb(20,22,26)" stroke="#66bb6a" stroke-width="1"/>
  <text x="244" y="375" class="desc" text-anchor="middle" style="fill:#66bb6a">매칭 비용이 서비스 수와 무관</text>
  <text x="244" y="396" class="muted" text-anchor="middle">iptables의 선형 탐색 문제를 구조적으로 해결</text>

  <rect x="464" y="350" width="392" height="58" rx="8" fill="rgb(20,22,26)" stroke="#66bb6a" stroke-width="1"/>
  <text x="660" y="375" class="desc" text-anchor="middle" style="fill:#66bb6a">외부 서브시스템을 안 끌어들인다</text>
  <text x="660" y="396" class="muted" text-anchor="middle">netfilter 하나로 끝 (IPVS와의 차이)</text>

  <!-- 강조 대비 -->
  <rect x="40" y="420" width="816" height="60" rx="8" fill="rgb(20,30,22)" stroke="#66bb6a" stroke-width="1.1"/>
  <text x="448" y="445" class="desc" text-anchor="middle" style="fill:#66bb6a">구조상 이점 — IPVS는 netfilter 밖 모듈을 빌렸지만, nftables는 같은 성능을 netfilter 안에서 낸다</text>
  <text x="448" y="466" class="muted" text-anchor="middle">그래서 IPVS의 존재 이유를 대체할 수 있었다</text>

  <!-- 상태 -->
  <rect x="24" y="502" width="852" height="46" rx="8" fill="#66bb6a"/>
  <text x="450" y="523" class="badge" text-anchor="middle">v1.33 stable (GA)</text>
  <text x="450" y="541" class="darkdesc" text-anchor="middle">iptables의 성능 한계를 정면으로 겨냥한 후속 구현 · 커널 5.13 이상 필요</text>

  <text x="24" y="576" class="muted">셋·맵 문법(nft set/map)은 01-01 네트워킹 기초의 nftables 절이 SSOT.</text>
</svg>

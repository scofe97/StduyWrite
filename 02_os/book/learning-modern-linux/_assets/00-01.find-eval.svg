<text x="284.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">일반 파일</text>
<path d="M 354 296.0 L 368 296.0" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="372" y="264" width="136" height="64" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="440.0" y="292" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">FAIL</text>
<text x="440.0" y="312" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">이름 끝 .gz</text>
<rect x="528" y="264" width="136" height="64" rx="6" fill="#0D1117" stroke="#5E6B7E" stroke-width="1" stroke-dasharray="4 4"/>

<title id="dt">결국은 선과 공기를 타고 다니는 비트다</title><desc id="dd">7장 첫 구간의 절 여덟을 읽는 순서로 이은 지도. 1~2절이 태도와 뼈대이고, 3~4절이 링크 계층, 5~8절이 인터넷 계층이다.</desc>
<rect width="880" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">결국은 선과 공기를 타고 다니는 비트다</text>

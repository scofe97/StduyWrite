<title id="dt">명령 한 줄이 커널 기능 둘을 대신 불러 준다</title><desc id="dd">Docker 의 개념은 이미지와 컨테이너 둘뿐이다. 그 사이에서 데몬이 하는 일이 이 장 전체의 논점이다.</desc>
<rect width="880" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">명령 한 줄이 커널 기능 둘을 대신 불러 준다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">특별한 것은 재료가 아니라 복잡함을 숨긴 조합입니다</text>
<rect x="32" y="168" width="216" height="76" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="48" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#6A95D8">docker</text>
<text x="48" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">클라이언트 CLI 도구</text>
<rect x="320" y="168" width="240" height="76" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="440.0" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#6A95D8">Docker 데몬</text>
<text x="440.0" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">명령을 받아 연산을 수행한다</text>
<rect x="632" y="168" width="216" height="76" rx="8" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>
<text x="740.0" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">컨테이너 레지스트리</text>
<text x="740.0" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">필요할 때 데몬이 당겨 온다</text>

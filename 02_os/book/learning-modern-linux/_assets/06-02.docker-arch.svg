<text x="52" y="478" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">네임스페이스 · cgroups</text>
<text x="52" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">CoW 파일시스템 · 바인드 마운트</text>

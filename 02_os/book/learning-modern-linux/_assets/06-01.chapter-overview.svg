<title id="dt">먼저 켜지는 것 하나가 나머지 전부를 켠다</title><desc id="dd">6장 앞 절반의 절 아홉을 읽는 순서로 이은 지도. 1~6절이 앱을 띄우는 일이고 7~9절이 앱을 가져오는 일이다.</desc>

<title id="dt">먼저 켜지는 것 하나가 나머지 전부를 켠다</title><desc id="dd">6장 앞 절반의 절 아홉을 읽는 순서로 이은 지도. 1~6절은 앱을 띄우는 일로 펌웨어 · GRUB 2 · /boot 의 커널 · systemd[1] · /run/systemd/system 의 단위 파일 · greeter 타이머를 다루고, 7~9절은 앱을 가져오는 일로 저장소 · yum · apt · 언어별 관리자를 다룬다.</desc>
<rect width="960" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">먼저 켜지는 것 하나가 나머지 전부를 켠다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">3절이 이 노트의 제목이 가리키는 자리 — PID 1</text>
<rect x="24" y="104" width="912" height="248" rx="10" fill="#F5F5F305" stroke="#6A95D8" stroke-width="1" stroke-dasharray="5 4"/>
<text x="920" y="126" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">앱을 띄우는 일 — 무엇을 켤 것인가</text>
<rect x="24" y="372" width="912" height="136" rx="10" fill="#F5F5F305" stroke="#3FB98C" stroke-width="1" stroke-dasharray="5 4"/>
<text x="920" y="394" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">앱을 가져오는 일 — 어디서 받아 올 것인가</text>

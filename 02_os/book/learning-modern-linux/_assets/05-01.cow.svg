<path d="M 104 280 L 268.0 298" fill="none" stroke="#3FB98C" stroke-width="1.2"/>
<rect x="456" y="148" width="400" height="244" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="476" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">2단계 — 파일 2 의 블록 C 를 고침</text>
<text x="476" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">고쳐진 블록만 새로 생기고 A 와 B 는 그대로 공유합니다.</text>
<rect x="480" y="208" width="112" height="32" rx="5" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="536" y="229" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#6A95D8">파일 1</text>
<rect x="480" y="248" width="112" height="32" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="536" y="269" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#3FB98C">파일 2</text>
<rect x="480" y="300" width="80" height="60" rx="6" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>
<text x="520.0" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="17" font-weight="600" fill="#F5F5F3">A</text>
<rect x="570" y="300" width="80" height="60" rx="6" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>
<text x="610.0" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="17" font-weight="600" fill="#F5F5F3">B</text>

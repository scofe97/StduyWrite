<path d="M 536 280 L 610.0 298" fill="none" stroke="#3FB98C" stroke-width="1.2"/>
<path d="M 536 280 L 790.0 298" fill="none" stroke="#F08A59" stroke-width="1.2"/>
<path d="M 432 270 L 448 270" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="24" y="412" width="832" height="62" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="44" y="440" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">같은 베이스 이미지를 쓰는 컨테이너가 여럿이어도 읽기 전용 층은 한 벌이면 됩니다.</text>
<text x="44" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">각 컨테이너가 무언가를 쓰는 순간에만 그 블록이 위쪽 층으로 복사됩니다.</text>
<line x1="12" y1="496" x2="832" y2="496" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="518" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="508" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">파일 1 이 쓰는 블록</text>
<rect x="300" y="508" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="322" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">파일 2 가 쓰는 블록</text>
<rect x="500" y="508" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="522" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실제로 블록이 생기는 곳</text>

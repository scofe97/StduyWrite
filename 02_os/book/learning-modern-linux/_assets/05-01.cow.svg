<title id="dt">복사할 때는 포인터만, 고칠 때에야 블록이 생긴다</title><desc id="dd">저자가 두 단계로 나눠 그린 CoW 를 앞뒤 상태로 놓은 것. 오른쪽에서도 블록 C 는 그대로 있고, 파일 2 만 새 블록으로 옮겨 갔다.</desc>
<rect width="880" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §9</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">복사할 때는 포인터만, 고칠 때에야 블록이 생긴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">빠르고 공간을 덜 쓰는 이유가 이 그림 안에 있습니다</text>
<rect x="24" y="148" width="400" height="244" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">1단계 — 복사</text>
<text x="44" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">실제 블록 대신 블록을 가리키는 포인터만 복사합니다.</text>
<rect x="48" y="208" width="112" height="32" rx="5" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="104" y="229" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#6A95D8">파일 1</text>
<rect x="48" y="248" width="112" height="32" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="104" y="269" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#3FB98C">파일 2</text>
<rect x="48" y="300" width="80" height="60" rx="6" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>
<text x="88.0" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="17" font-weight="600" fill="#F5F5F3">A</text>
<rect x="138" y="300" width="80" height="60" rx="6" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>
<text x="178.0" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="17" font-weight="600" fill="#F5F5F3">B</text>
<rect x="228" y="300" width="80" height="60" rx="6" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>

<text x="700.0" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="17" font-weight="600" fill="#F5F5F3">C</text>
<rect x="750" y="300" width="80" height="60" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.5"/>
<text x="790.0" y="330" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="17" font-weight="600" fill="#F08A59">C′</text>
<text x="790.0" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">새로 생긴 블록</text>
<path d="M 536 240 L 520.0 298" fill="none" stroke="#6A95D8" stroke-width="1.0" stroke-dasharray="4 4"/>
<path d="M 536 240 L 610.0 298" fill="none" stroke="#6A95D8" stroke-width="1.0" stroke-dasharray="4 4"/>

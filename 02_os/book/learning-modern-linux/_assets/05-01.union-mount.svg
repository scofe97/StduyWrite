<title id="dt">겹쳐 놓으면 하나로 보이고, 겹친 자리에서 규칙이 필요해진다</title><desc id="dd">여러 디렉토리를 한 자리에 마운트하면 쓰는 사람에게는 합집합 하나로 보인다. 문제는 같은 이름이 양쪽에 있을 때다.</desc>
<rect width="880" height="688" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §9</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">겹쳐 놓으면 하나로 보이고, 겹친 자리에서 규칙이 필요해진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">상위와 하위라는 말은 마운트의 층 순서를 가리킵니다</text>
<circle cx="436" cy="300" r="120" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<circle cx="606" cy="300" r="120" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.4"/>
<text x="378" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">상위 파일시스템</text>
<text x="664" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">하위 파일시스템</text>
<text x="378" y="294" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">cache/</text>
<text x="378" y="320" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">run.log</text>
<text x="664" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">bin/</text>
<text x="664" y="308" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">lib/</text>
<text x="664" y="334" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">etc/</text>
<text x="521.0" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F08A59">같은 이름</text>
<text x="521.0" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">app.conf</text>
<text x="521.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">어느 쪽이</text>
<text x="521.0" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">보일지</text>
<rect x="32" y="248" width="224" height="104" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="48" y="276" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">쓰는 사람이 보는 것</text>
<text x="48" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">디렉토리 하나</text>
<text x="48" y="322" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">app.conf · cache/ · run.log</text>
<text x="48" y="340" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">bin/ · lib/ · etc/</text>
<path d="M 256 300 L 308 300" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="292" y="448" width="336" height="100" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="312" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F08A59">정해야 하는 규칙 둘</text>
<text x="312" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">파일이 여러 곳에 있을 때 어떻게 할지</text>
<text x="312" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">쓰거나 지우는 것이 무슨 뜻인지</text>
<text x="312" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">저자는 세부에 악마가 있다고 적습니다</text>
<path d="M 521.0 420 L 521.0 446" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)" stroke-dasharray="6 5"/>
<rect x="32" y="568" width="816" height="44" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="52" y="596" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">구현은 넷 — Unionfs · OverlayFS · AUFS · btrfs. 오늘날 Docker 의 기본은 overlay2 입니다.</text>
<line x1="12" y1="628" x2="832" y2="628" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="650" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="640" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="650" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">위에 얹히는 층</text>
<rect x="248" y="640" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="270" y="650" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아래에 깔리는 층</text>
<rect x="409" y="640" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="431" y="650" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">규칙이 필요한 자리</text>
</svg>
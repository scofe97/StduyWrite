<title id="dt">id 한 줄이 커널에 묻고 돌아오기까지</title><desc id="dd">원서가 든 예를 시간순으로 편 것. 사용자가 친 id --user 가 getuid 시스템 콜이 되어 커널에 닿고, 실 사용자 ID 를 받아 돌아온다. 색이 붙은 화살표가 유저 랜드와 커널이 갈리는 한 줄이다.</desc>
<rect width="880" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 01-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">id 한 줄이 커널에 묻고 돌아오기까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이 한 줄이 없으면 자격증명을 앱이 직접 읽어야 합니다</text>

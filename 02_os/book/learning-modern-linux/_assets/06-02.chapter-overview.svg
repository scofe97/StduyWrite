<title id="dt">컨테이너의 새로움은 재료가 아니라 조합에 있다</title><desc id="dd">6장 뒤 절반의 절 일곱을 읽는 순서로 이은 지도. 2~4절이 세 가지 재료이고 5~6절이 그 재료를 감싼 도구, 7절이 같은 재료를 쓰는 다른 쓰임새다.</desc>
<rect width="880" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-02</text>

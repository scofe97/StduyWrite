<title id="dt">컨테이너의 새로움은 재료가 아니라 조합에 있다</title><desc id="dd">6장 뒤 절반의 절 일곱을 읽는 순서로 이은 지도. 칸마다 절 번호와 그 절이 답하는 물음, 그 절이 다루는 실제 명령·경로를 적었다. 2~4절이 재료 셋(네임스페이스·cgroups·CoW)이고 5~6절이 그 재료를 감싼 Docker 와 Dockerfile, 7절이 같은 재료를 쓰는 데스크톱 쪽 관리자다.</desc>

<title id="dt">터미널이 셸을 띄우고 셸이 세션에 붙는다</title><desc id="dd">저자가 alacritty.yml 한 파일로 묶어 둔 구성을 층으로 편 것. 터미널이 띄우는 것은 셸이고, 그 셸이 시작 명령으로 tmux 세션에 붙는 순서다.</desc>
<rect width="880" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-02 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">터미널이 셸을 띄우고 셸이 세션에 붙는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">설정 파일을 Git 에 두면 어느 기계에서든 몇 초 만에 같은 환경이 섭니다</text>
<rect x="76" y="128" width="728" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="94" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">L1</text>
<text x="144" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F5F5F3">Alacritty</text>
<text x="144" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">터미널 · alacritty.yml 을 Git 으로 버전 관리</text>
<path d="M 440.0 204 L 440.0 214" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="76" y="216" width="728" height="76" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="94" y="246" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">L2</text>
<text x="144" y="246" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F5F5F3">fish</text>
<text x="144" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">셸 · program 으로 지정되고 -l -i -c 로 실행된다</text>
<path d="M 440.0 292 L 440.0 302" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="76" y="304" width="728" height="76" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="94" y="334" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">L3</text>
<text x="144" y="334" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F08A59">tmux new-session -A -s zzz</text>
<text x="144" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">있으면 붙고 없으면 만든다 · 이 한 줄이 args 의 마지막</text>
<path d="M 440.0 380 L 440.0 390" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="76" y="392" width="728" height="76" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="94" y="422" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">L4</text>
<text x="144" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">세션 zzz 의 윈도와 페인</text>
<text x="144" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그 안에서 다시 셸들이 돈다</text>
<text x="76" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여기에 tmux-continuum 플러그인이 15분 간격으로 세션을 저장하고 복원합니다.</text>
<text x="76" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">저자는 컴퓨터를 꺼도 다시 켜면 세션·윈도·페인이 거의 그대로 서 있다고 적습니다. 다만 셸 변수는 예외라고 단서를 붙입니다.</text>
<line x1="12" y1="542" x2="832" y2="542" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="564" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="554" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저자가 안심의 근거로 든 층</text>
<rect x="339" y="554" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="361" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">나머지 층</text>
</svg>
<text x="84.0" y="312" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="400" fill="#6A95D8">Linux-VServer</text>
<circle cx="262.0" cy="268" r="6" fill="#6A95D8" stroke="none"/>
<text x="262.0" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#6A95D8">2005</text>
<text x="262.0" y="312" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="400" fill="#6A95D8">OpenVZ</text>
<circle cx="440.0" cy="268" r="6" fill="#6A95D8" stroke="none"/>
<text x="440.0" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#6A95D8">2008</text>
<text x="440.0" y="312" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="400" fill="#6A95D8">LXC</text>

<title id="dt">다섯 도구가 같은 커널 재료 위에 서 있다</title><desc id="dd">Linux-VServer(2001)·OpenVZ(2005)·LXC(2008)·lmctfy(2013)·Docker(2014) 가 모두 커널의 네임스페이스와 cgroups 를 써서 앱을 돌린다. 앞의 넷은 주로 시스템 관리자를 겨냥했다. Docker 는 그 위에 컨테이너 이미지라는 패키징 표준과 docker run 같은 사람 친화적 인터페이스를 얹었고, 이것이 OCI 핵심 명세 셋(런타임·이미지 포맷·배포)의 바탕이 됐다.</desc>
<rect width="880" height="496" fill="#0D1117"/>

<text x="618.0" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#6A95D8">2013</text>
<text x="618.0" y="312" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="400" fill="#6A95D8">lmctfy</text>
<circle cx="796.0" cy="268" r="9" fill="#F08A59" stroke="none"/>
<text x="796.0" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F08A59">2014</text>
<text x="796.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F08A59">Docker</text>
<rect x="64" y="328" width="400" height="96" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="84" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">앞의 넷이 공통으로 가진 것</text>
<text x="84" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">리눅스 커널이 주는 기본 재료를 쓴다는 점입니다.</text>
<text x="84" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">네임스페이스와 cgroups 가 그것입니다.</text>
<text x="84" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">겨냥한 쪽은 개발자보다 시스템 관리자였습니다.</text>
<rect x="480" y="328" width="336" height="96" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">Docker 가 개념 위에 얹은 둘</text>
<text x="500" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">컨테이너 이미지를 통한 표준화된 패키징</text>
<text x="500" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">사람 친화적인 사용자 인터페이스</text>
<text x="500" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">docker run 한 줄이 그 예입니다.</text>
<rect x="64" y="440" width="752" height="40" rx="6" fill="#8B98A914" stroke="#8B98A9" stroke-width="1.2"/>
<text x="84" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이 방식이 오늘날 OCI 핵심 명세 셋의 바탕이 됐습니다 — 런타임 · 이미지 포맷 · 배포.</text>

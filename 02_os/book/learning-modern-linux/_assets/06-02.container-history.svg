<title id="dt">컨테이너는 오래됐고 Docker 는 새롭다</title><desc id="dd">저자가 든 다섯 사건을 시간축에 놓은 것. 앞의 넷은 같은 커널 재료를 쓰면서 주로 시스템 관리자를 겨냥했고, 2014년에 겨냥하는 사람이 바뀐다.</desc>
<rect width="880" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">컨테이너는 오래됐고 Docker 는 새롭다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">재료는 내내 같았고 바뀐 것은 감싸는 방식입니다</text>
<path d="M 64 268 L 816 268" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

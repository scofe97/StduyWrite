<title id="dt">표의 어느 줄에도 맞지 않으면 게이트웨이로 간다</title><desc id="dd">route -n 과 ip route 는 같은 표의 두 표기다. 목적지가 표의 어느 줄에 드느냐가 그 패킷의 다음 걸음을 정한다.</desc>
<rect width="880" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">표의 어느 줄에도 맞지 않으면 게이트웨이로 간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">0.0.0.0 은 명시되지 않았다는 뜻이라 게이트웨이로 갑니다</text>
<rect x="32" y="164" width="216" height="68" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="140.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#6A95D8">패킷 하나</text>
<text x="140.0" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">목적지 IP 를 들고 있다</text>
<rect x="296" y="164" width="552" height="68" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="314" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">192.168.178.0/24</text>
<text x="314" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">같은 네트워크 안</text>
<text x="830" y="204" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">U · wlp1s0 로 직접</text>
<path d="M 248 198 L 272.0 198 L 272.0 198 L 288 198" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="296" y="244" width="552" height="68" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="314" y="272" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">169.254.0.0/16</text>
<text x="314" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">링크 로컬</text>
<text x="830" y="284" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">U · wlp1s0 로 직접</text>
<path d="M 248 198 L 272.0 198 L 272.0 278 L 288 278" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="296" y="324" width="552" height="68" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.5"/>
<text x="314" y="352" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">default (0.0.0.0)</text>
<text x="314" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">그 밖의 모든 곳</text>
<text x="830" y="364" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">UG · 192.168.178.1 로</text>
<path d="M 248 198 L 272.0 198 L 272.0 358 L 288 358" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="32" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#5E6B7E">같은 표의 두 표기</text>
<rect x="32" y="400" width="392" height="92" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="48" y="424" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">route -n</text>
<text x="48" y="446" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">Destination  Gateway        Genmask</text>
<text x="48" y="464" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">0.0.0.0      192.168.178.1  0.0.0.0        UG</text>
<text x="48" y="482" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">192.168.178.0  0.0.0.0      255.255.255.0  U</text>
<rect x="456" y="400" width="392" height="92" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="472" y="424" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">ip route</text>
<text x="472" y="446" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">default via 192.168.178.1 dev wlp1s0</text>
<text x="472" y="464" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">169.254.0.0/16 dev wlp1s0 scope link</text>
<text x="472" y="482" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">192.168.178.0/24 dev wlp1s0 proto kernel</text>
<rect x="32" y="512" width="816" height="44" rx="6" fill="#8B98A914" stroke="#8B98A9" stroke-width="1.2"/>
<text x="52" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이 표를 조작하는 도구가 iptables 이고, 그것이 패킷을 가로채는 데 쓰는 것이 netfilter 입니다.</text>
<line x1="12" y1="576" x2="832" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="588" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패킷</text>
<rect x="170" y="588" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="192" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">직접 보내는 줄</text>
<rect x="318" y="588" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="340" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아무 줄에도 안 맞을 때</text>
</svg>
<title id="dt">디스크 핫애드부터 영구 마운트까지의 6단계 운영 파이프라인</title><desc id="dd">물리 디스크 인식, 파티셔닝, LVM 계층화, 파일시스템 생성, 마운트 및 fstab 등록까지 스토리지를 운영 트리에 편입하는 표준 절차.</desc>
<rect width="880" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">디스크 핫애드부터 영구 마운트까지의 6단계 운영 파이프라인</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">새로 붙일 때는 아래 층(물리)에서 위 층(VFS/마운트)으로 진행</text>
<path d="M 284 204.0 L 300 204.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 570 204.0 L 586 204.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 722.0 288 L 722.0 299 L 150.0 299 L 150.0 308" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 284 394.0 L 300 394.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 570 394.0 L 586 394.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="16" y="120" width="268" height="168" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="32" y="146" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#6A95D8">1. 커널 재스캔</text>
<text x="268" y="146" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">sysfs / rescan</text>
<line x1="30" y1="158" x2="270" y2="158" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="32" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">실행 명령</text>
<rect x="30" y="192" width="240" height="28" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="38" y="210" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">echo 1 &gt; /sys/class/.../rescan</text>
<text x="32" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">생성 결과</text>
<text x="32" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">dmesg 장치 등록 (sdb, loop)</text>
<rect x="302" y="120" width="268" height="168" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="318" y="146" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#6A95D8">2. 파티셔닝</text>
<text x="554" y="146" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">parted / GPT</text>
<line x1="316" y1="158" x2="556" y2="158" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="318" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">실행 명령</text>
<rect x="316" y="192" width="240" height="28" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="324" y="210" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">parted -s /dev/sdb mklabel gpt</text>
<text x="318" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">생성 결과</text>
<text x="318" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">lsblk 파티션 분할 (sdb1, sdb2)</text>
<rect x="588" y="120" width="268" height="168" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="604" y="146" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#3FB98C">3. LVM 계층화</text>
<text x="840" y="146" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">pv · vg · lv</text>
<line x1="602" y1="158" x2="842" y2="158" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="604" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">실행 명령</text>
<rect x="602" y="192" width="240" height="28" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="610" y="210" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">pvcreate -&gt; vgcreate -&gt; lvcreate</text>
<text x="604" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">생성 결과</text>
<text x="604" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">블록 볼륨 생성 (/dev/vg0/data)</text>
<rect x="16" y="310" width="268" height="168" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="32" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#3FB98C">4. 파일시스템 생성</text>
<text x="268" y="336" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">mkfs 포맷</text>
<line x1="30" y1="348" x2="270" y2="348" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="32" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">실행 명령</text>
<rect x="30" y="382" width="240" height="28" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="38" y="400" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">mkfs.ext4 -L datalv /dev/vg0/data</text>
<text x="32" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">생성 결과</text>
<text x="32" y="456" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">슈퍼블록 및 아이노드 테이블 생성</text>
<rect x="302" y="310" width="268" height="168" rx="8" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="318" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F08A59">5. 마운트 연결</text>
<text x="554" y="336" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">mount / 트리 결합</text>
<line x1="316" y1="348" x2="556" y2="348" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="318" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">실행 명령</text>
<rect x="316" y="382" width="240" height="28" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="324" y="400" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">mount /dev/vg0/data /mnt/lv</text>
<text x="318" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">생성 결과</text>
<text x="318" y="456" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">VFS 경로 노출 (/mnt/lv, 182M)</text>
<rect x="588" y="310" width="268" height="168" rx="8" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="604" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F08A59">6. 영구 마운트</text>
<text x="840" y="336" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">fstab 등록</text>
<line x1="602" y1="348" x2="842" y2="348" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="604" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">실행 명령</text>
<rect x="602" y="382" width="240" height="28" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="610" y="400" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">UUID=... /mnt/lv ext4 defaults 0 2</text>
<text x="604" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">생성 결과</text>
<text x="604" y="456" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부팅 시 systemd mount 유닛 자동화</text>
<line x1="12" y1="508" x2="832" y2="508" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="530" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="520" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">하드웨어 / 파티션 계층</text>
<rect x="313" y="520" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="335" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">LVM 볼륨 / 포맷 계층</text>

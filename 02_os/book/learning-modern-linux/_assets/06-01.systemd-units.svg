<text x="96" y="186" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">/lib/systemd/system/</text>
<text x="96" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">패키지가 설치한 단위 · 영속</text>
<rect x="96" y="220" width="436" height="20" rx="4" fill="none" stroke="#5E6B7E" stroke-width="1" stroke-dasharray="4 3"/>
<text x="108" y="235" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">XXXXX.service (예)</text>

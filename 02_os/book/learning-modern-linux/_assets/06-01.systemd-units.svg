<title id="dt">무엇을 언제 어떻게 돌릴지는 단위로 말한다</title><desc id="dd">systemd 에게 지시하는 방법은 단위 하나뿐이다. 겨냥하는 자원에 따라 의미가 갈리고, 파일로 직렬화되어야 systemd 가 알아본다.</desc>
<rect width="880" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">무엇을 언제 어떻게 돌릴지는 단위로 말한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">6절 예제가 쓰는 것은 service 와 timer 둘입니다</text>
<rect x="340" y="148" width="200" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="440.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">단위</text>
<text x="440.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">겨냥하는 자원이 의미를 정한다</text>
<path d="M 440.0 204 L 440.0 232 L 124.0 232 L 124.0 266" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<rect x="24" y="268" width="200" height="92" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="40" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">service</text>
<text x="40" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">서비스나 애플리케이션을</text>
<text x="40" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">어떻게 관리할지 서술한다</text>
<path d="M 440.0 204 L 440.0 232 L 340.0 232 L 340.0 266" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="240" y="268" width="200" height="92" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="256" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">target</text>
<text x="256" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">의존성을 잡는다</text>
<path d="M 440.0 204 L 440.0 232 L 556.0 232 L 556.0 266" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="456" y="268" width="200" height="92" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="472" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">mount</text>
<text x="472" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">마운트 지점을</text>
<text x="472" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">정의한다</text>
<path d="M 440.0 204 L 440.0 232 L 772.0 232 L 772.0 266" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<rect x="672" y="268" width="200" height="92" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="688" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">timer</text>
<text x="688" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">cron 작업 같은 것을 위한</text>
<text x="688" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">타이머를 정의한다</text>
<text x="24" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#5E6B7E">덜 중요하다고 저자가 묶어 둔 것들</text>
<rect x="32.54" y="418" width="54.92" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="60" y="432" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">socket</text>
<rect x="114.53999999999999" y="418" width="54.92" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="142" y="432" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">device</text>
<rect x="186.31" y="418" width="75.38" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="224" y="432" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">automount</text>
<rect x="309.36" y="418" width="41.28" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="330" y="432" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">swap</text>
<rect x="375.36" y="418" width="41.28" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="396" y="432" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">path</text>
<rect x="427.72" y="418" width="68.56" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="462" y="432" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">snapshot</text>
<rect x="535.95" y="418" width="48.1" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="560" y="432" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">slice</text>
<rect x="609.95" y="418" width="48.1" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="634" y="432" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">scope</text>
<text x="24" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#5E6B7E">단위 파일이 놓이는 세 자리</text>
<rect x="24" y="490" width="272" height="66" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="40" y="516" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#6A95D8">/lib/systemd/system</text>
<text x="40" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">패키지가 설치한 단위</text>
<rect x="308" y="490" width="272" height="66" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="324" y="516" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#6A95D8">/etc/systemd/system</text>
<text x="324" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">시스템 관리자가 설정한 단위</text>
<rect x="592" y="490" width="272" height="66" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="608" y="516" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F08A59">/run/systemd/system</text>
<text x="608" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">영속적이지 않은 런타임 수정</text>
<line x1="12" y1="584" x2="832" y2="584" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="606" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="596" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">6절 예제가 쓰는 종류와 자리</text>

<title id="dt">단위는 세 디렉터리에 놓인 파일이고, systemd[1] 이 그것을 읽는다</title><desc id="dd">단위 파일은 /lib/systemd/system(패키지가 설치), /etc/systemd/system(관리자가 설정), /run/systemd/system(재부팅에 사라지는 런타임 수정) 세 자리에 놓인다. §6 예제의 greeter.service(117 바이트)와 greeter.timer(107 바이트)는 /run 쪽에 있다. systemctl daemon-reload 가 세 자리를 다시 읽어 의존성 트리를 다시 만들고, 파일 이름 끝(.service · .timer …)이 단위 종류다.</desc>
<rect width="960" height="760" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">단위는 세 디렉터리에 놓인 파일이고, systemd[1] 이 그것을 읽는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">§6 예제의 두 파일은 재부팅에 사라지는 /run 쪽에 놓였다</text>
<text x="44" y="140" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#F5F5F3">/</text>

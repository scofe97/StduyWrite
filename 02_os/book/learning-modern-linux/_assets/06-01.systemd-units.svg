<rect x="652" y="284" width="268" height="76" rx="8" fill="#161B22" stroke="#F5F5F3" stroke-width="1.2"/>
<text x="668" y="314" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F5F5F3">systemd[1]</text>
<text x="668" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">의존성 트리를 다시 만듦</text>
<text x="652" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">systemctl daemon-reload</text>

<text x="96" y="298" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">/etc/systemd/system/</text>
<text x="96" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">관리자가 설정 · 패키지 갱신에 안 덮임</text>
<rect x="96" y="332" width="436" height="20" rx="4" fill="none" stroke="#5E6B7E" stroke-width="1" stroke-dasharray="4 3"/>
<text x="108" y="347" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">XXXXX.service 고친 판 (예)</text>

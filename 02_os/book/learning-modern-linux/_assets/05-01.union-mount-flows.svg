<title id="dt">copy-up 과 화이트아웃 — 쓰기는 위층에만 남는다</title><desc id="dd">lifeline 넷은 왼쪽부터 컨테이너 A 가 보는 a-view, A 의 위층 a-upper, 공유 이미지 image, 컨테이너 B 가 보는 b-view 다. 위 흐름은 A 가 big.bin(200M) 끝에 한 줄을 덧붙이는 경우다. 위층에 big.bin 이 없어서 image 의 파일을 통째로 a-upper 로 복사(copy-up)하고 그 사본에 덧붙인다. 이후 A 는 위층 사본을 보고, B 는 image 의 원본을 그대로 본다. du 는 a-upper 4.0K 에서 201M 으로 늘고 image 는 201M 그대로다. 아래 흐름은 A 가 /etc/motd 를 지우는 경우다. image 는 읽기 전용이라 지우지 못하고 a-upper/etc/motd 에 장치 번호 0,0 인 문자 장치(화이트아웃)가 생긴다. 이후 A 의 조회는 위층의 화이트아웃에서 멈춰 없음이 되고 아래 image 로 내려가지 않는다. image/etc/motd 22 바이트는 그대로이고 B 는 여전히 motd 를 본다.</desc>
<rect width="880" height="896" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">copy-up 과 화이트아웃 — 쓰기는 위층에만 남는다</text>

<title id="dt">아래에서 위로 — CPU 가 받쳐야 커널이 하이퍼바이저가 된다</title><desc id="dd">가상화 스택을 아래에서 위로 쌓은 것. CPU flags 에 vmx 가 있고, 호스트 리눅스 커널에 kvm_intel 과 kvm 모듈이 올라와 커널이 하이퍼바이저가 된다. 그 위 유저 공간의 VMM 프로세스(QEMU, Firecracker)가 VM 하나를 관리하고, VM 안에는 Virtio 드라이버를 쓰는 게스트 커널과 게스트 프로세스가 돈다. kvm_intel 의 0 은 쓰는 VM 이 아직 없다는 뜻이다.</desc>
<rect width="880" height="744" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 09-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">아래에서 위로 — CPU 가 받쳐야 커널이 하이퍼바이저가 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">KVM 한 층에서 리눅스 커널이 하이퍼바이저가 됩니다</text>

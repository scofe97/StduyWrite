<title id="dt">모든 것이 파일이라는 말은 손잡이가 하나라는 뜻이다</title><desc id="dd">5장 개념 편의 절 여덟을 읽는 순서로 이은 지도. 1~3절이 용어와 링크, 4~5절이 VFS 와 LVM 간접 층, 6~8절이 디렉터리 배치와 가짜 파일시스템 및 CoW · 유니온 마운트다. 카드마다 그 절이 다루는 객체와 그 절 도식에 나오는 실측 값을 붙였다.</desc>

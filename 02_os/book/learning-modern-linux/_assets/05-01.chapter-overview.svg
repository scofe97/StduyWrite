<title id="dt">모든 것이 파일이라는 말은 손잡이가 하나라는 뜻이다</title><desc id="dd">5장 노트의 절 아홉을 읽는 순서로 이은 지도. 1~3절이 용어와 구조, 4~7절이 그 위에 놓인 층과 연산, 8~9절이 블록 장치가 아닌 것과 겹쳐 쌓는 방법이다.</desc>
<rect width="880" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">모든 것이 파일이라는 말은 손잡이가 하나라는 뜻이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">8절이 이 장의 제목이 가리키는 자리입니다</text>

<title id="dt">-mtime 은 나이를 24시간으로 나눈 몫과 비교한다</title><desc id="dd">가로축은 파일이 마지막으로 바뀐 뒤 지난 시간이다. 나이를 24시간으로 나눈 몫이 0, 1, 2, 3 구간을 만들고, -mtime -1 은 몫 0, -mtime 1 은 몫 1, -mtime +1 은 몫 2 이상을 잡는다. 25시간 · 47시간 된 파일은 하루를 넘겼지만 몫이 1 이라 -mtime +1 에 걸리지 않는다.</desc>

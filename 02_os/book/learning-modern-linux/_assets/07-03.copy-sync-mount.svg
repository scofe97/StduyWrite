<title id="dt">사본이 어디에 있느냐가 세 모델을 가른다</title><desc id="dd">복사와 동기화는 양쪽에 사본을 두고 마운트는 사본을 두지 않는다. 그 차이가 오프라인에서 드러난다 — 사본이 있으면 읽히고 없으면 멈춘다.</desc>

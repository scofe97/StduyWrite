<text x="738.0" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">stderr</text>
<text x="738.0" y="360" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">FD 2</text>
<text x="118.0" y="342" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">출력 두 갈래는</text>
<text x="118.0" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">반대편으로 나갑니다</text>
<rect x="24" y="400" width="832" height="100" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="44" y="428" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">기본값을 벗어나게 하는 연산자</text>
<text x="44" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">2&gt; 는 stderr 만 파일로 · 1&gt; 과 &gt; 는 같다(stdout 이 기본) · &amp;&gt; 는 둘 다</text>
<text x="44" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">/dev/null 로 보내면 버린다 · | 는 앞 프로세스의 stdout 을 뒤 프로세스의 stdin 에 잇는다</text>
<text x="24" y="528" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">저자는 stderr 를 화면에서 치우고 파일에 담고 싶을 때를 예로 들며 이 연산자들을 소개합니다.</text>
<line x1="12" y1="548" x2="832" y2="548" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

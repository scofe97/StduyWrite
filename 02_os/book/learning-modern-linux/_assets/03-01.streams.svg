<title id="dt">세 갈래는 기본으로 어디에 붙어 있는가</title><desc id="dd">셸은 모든 프로세스에 파일 서술자 셋을 쥐여 준다. 기본 연결은 키보드와 화면이고, 리다이렉션 연산자가 그 끝을 파일이나 다른 프로세스로 옮긴다.</desc>
<rect width="880" height="604" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세 갈래는 기본으로 어디에 붙어 있는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">2&gt; 가 stderr 만 옮기고, &amp;&gt; 가 둘 다 옮깁니다</text>

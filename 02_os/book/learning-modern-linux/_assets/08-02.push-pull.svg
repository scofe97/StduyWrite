<title id="dt">메트릭을 보내는 쪽과 가져가는 쪽</title><desc id="dd">밀기에서는 앱이 수집기 주소를 알고 UDP 로 보낸다. 끌기에서는 앱이 HTTP 엔드포인트를 열어 두고 Prometheus 가 정해진 간격으로 가져간다.</desc>

<title id="dt">자주 치는 것일수록 짧아야 한다</title><desc id="dd">3장 가운데 구간 노트의 절 여섯을 읽는 순서로 이은 지도. 1~2절이 지금 쓰는 셸에서 손을 덜 쓰는 법이고, 3~4절이 셸 자체를 갈아 끼우는 판단, 5~6절이 터미널을 쪼개 쓰는 법이다.</desc>

<text x="464.0" y="428" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">클라이언트 신원 · 세션 키 사본</text>
<rect x="668.0" y="456" width="108" height="24" rx="12" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>

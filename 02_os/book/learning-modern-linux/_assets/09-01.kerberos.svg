<title id="dt">믿을 수 없는 망 위에서 서로의 신원을 증명하는 네 걸음</title><desc id="dd">클라이언트, KDC, 서비스 셋 사이의 네 걸음을 시간축에 세운 것. 2번 걸음에서 KDC 가 서비스 티켓과 세션 키를 함께 내주고, 3번 걸음의 티켓 안에 클라이언트 신원과 세션 키 사본이 들어 있어 서비스도 같은 세션 키를 쥐게 된다. 4번 걸음은 그 키로 클라이언트를 인증한다. 서비스는 인증자 안의 시각을 자기 시각과 비교해 300초보다 벌어지면 KRB_AP_ERR_SKEW 로 거절한다.</desc>
<rect width="880" height="708" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 09-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">믿을 수 없는 망 위에서 서로의 신원을 증명하는 네 걸음</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세션 키는 2번에서 클라이언트에, 3번의 티켓을 거쳐 서비스에 갑니다</text>
<rect x="24.0" y="104" width="220" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="134.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="134.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">client</text>
<rect x="318.0" y="104" width="220" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="428.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">KDC</text>
<text x="428.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">Key Distribution Center</text>
<rect x="612.0" y="104" width="220" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="722.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서비스</text>
<text x="722.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">service</text>
<line x1="134.0" y1="154" x2="134.0" y2="560" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="428.0" y1="154" x2="428.0" y2="560" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="722.0" y1="154" x2="722.0" y2="560" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 144.0 196 L 416.0 196" fill="none" stroke="#F5F5F3" stroke-width="1.5" marker-end="url(#ar)"/>

<path d="M 712.0 524 L 146.0 524" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="428.0" y="515" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">4 · 세션 키로 클라이언트 인증</text>
<text x="428.0" y="541" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">선택: 같은 키로 서비스도 인증</text>
<rect x="380.0" y="568" width="96" height="24" rx="12" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="428.0" y="585" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">단일 장애점</text>
<rect x="680.0" y="568" width="84" height="24" rx="12" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="722.0" y="585" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">시각 비교</text>
<rect x="24" y="604" width="832" height="32" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="40" y="625" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서버 시각 vs 인증자 안의 시각 · 차 &gt; 300초 → KRB_AP_ERR_SKEW (37, Clock skew too great) · NTP</text>
<line x1="12" y1="660" x2="832" y2="660" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

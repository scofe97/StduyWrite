<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">이름은 지워졌는데 블록은 fd 가 붙잡고 있다</title><desc id="dd">PID 4462(tail -f)의 fd 3 이 /mnt/h/big 의 아이노드를 열고 있다. rm 은 unlink(2)로 디렉터리의 이름 big 만 지워 링크 수가 0 이 되지만, 열린 참조가 남아 64 MiB 데이터 블록은 할당된 채다. du 는 디렉터리 트리를 돌아 1M 만 세고, df 는 슈퍼블록의 할당 블록 수를 읽어 65M Used 를 보인다. : &gt; /proc/4462/fd/3 으로 파일을 비우면 Used 가 1M 으로 떨어진다.</desc>
<rect width="920" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-02 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름은 지워졌는데 블록은 fd 가 붙잡고 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">du 는 이름을 세고 df 는 할당된 블록을 센다 — 이름 없는 열린 파일이 그 차이다</text>
<rect x="24" y="232" width="872" height="256" rx="10" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">/mnt/h 에 마운트된 파일시스템</text>
<path d="M 144.0 198 L 144.0 285" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="154.0" y="276" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">트리를 돎</text>
<path d="M 776.0 198 L 776.0 285" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="786.0" y="276" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">카운터를 읽음</text>
<path d="M 460.0 198 L 460.0 365" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<text x="472.0" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">열린 참조</text>
<line x1="776.0" y1="338" x2="776.0" y2="366" stroke="#E3B341" stroke-width="1.1" stroke-dasharray="3 3"/>
<text x="786.0" y="358" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">64 MiB 포함</text>
<path d="M 586 408 L 653 408" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="620.0" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">포인터</text>
<line x1="266" y1="408" x2="334" y2="408" stroke="#F0616D" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="300.0" y="413" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="400" fill="#F0616D">✕</text>
<rect x="24" y="104" width="240" height="92" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="40" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">du -sm /mnt/h</text>
<text x="40" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="22" font-weight="600" fill="#6A95D8">1M</text>
<text x="40" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이름이 있는 파일만</text>
<rect x="656" y="104" width="240" height="92" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="672" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">df -BM /mnt/h</text>
<text x="672" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="22" font-weight="600" fill="#E3B341">65M Used</text>
<text x="672" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">할당된 블록 전부</text>
<rect x="312" y="104" width="296" height="92" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="328" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">PID 4462</text>
<text x="404" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">tail -f · fd 테이블</text>
<rect x="328" y="144" width="264" height="36" rx="4" fill="#F08A591F" stroke="#F08A59" stroke-width="1.4"/>
<text x="340" y="167" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">3 -&gt; /mnt/h/big (deleted)</text>
<rect x="48" y="288" width="216" height="160" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="62" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">디렉터리 /mnt/h</text>
<rect x="60" y="328" width="192" height="32" rx="4" fill="none" stroke="#5E6B7E" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="74" y="349" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">… 다른 이름</text>
<rect x="60" y="380" width="192" height="32" rx="4" fill="#F0616D14" stroke="#F0616D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="74" y="401" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">big</text>
<line x1="70" y1="396" x2="106" y2="396" stroke="#F0616D" stroke-width="1.4"/>
<text x="118" y="401" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">rm → unlink(2)</text>
<text x="62" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이름만 사라짐</text>
<rect x="336" y="368" width="248" height="80" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="460.0" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">big 의 아이노드</text>
<text x="460.0" y="416" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">링크 수 0</text>
<text x="460.0" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">열린 참조 남음 → 해제 안 됨</text>
<rect x="656" y="288" width="216" height="48" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="764.0" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">슈퍼블록</text>
<text x="764.0" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">할당 블록 카운터</text>
<rect x="656" y="368" width="216" height="80" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<rect x="669.0" y="380" width="22.0" height="24" rx="2" fill="#F0616D33" stroke="#F0616D" stroke-width="0.8"/>
<rect x="693.0" y="380" width="22.0" height="24" rx="2" fill="#F0616D33" stroke="#F0616D" stroke-width="0.8"/>
<rect x="717.0" y="380" width="22.0" height="24" rx="2" fill="#F0616D33" stroke="#F0616D" stroke-width="0.8"/>
<rect x="741.0" y="380" width="22.0" height="24" rx="2" fill="#F0616D33" stroke="#F0616D" stroke-width="0.8"/>
<rect x="765.0" y="380" width="22.0" height="24" rx="2" fill="#F0616D33" stroke="#F0616D" stroke-width="0.8"/>
<rect x="789.0" y="380" width="22.0" height="24" rx="2" fill="#F0616D33" stroke="#F0616D" stroke-width="0.8"/>
<rect x="813.0" y="380" width="22.0" height="24" rx="2" fill="#F0616D33" stroke="#F0616D" stroke-width="0.8"/>
<rect x="837.0" y="380" width="22.0" height="24" rx="2" fill="#F0616D33" stroke="#F0616D" stroke-width="0.8"/>
<text x="764.0" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">데이터 블록 64 MiB</text>
<text x="764.0" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">아직 할당됨</text>
<text x="24" y="524" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">: &gt; /proc/4462/fd/3</text>
<text x="200" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">fd 손잡이로 0바이트로 자름 → df Used 65M → 1M</text>
<text x="24" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">PID·fd·크기·du·df 값은 본문 실측 그대로 · 디렉터리의 다른 이름과 블록 칸 수는 예시</text>
<line x1="12" y1="576" x2="872" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="588" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">du 가 보는 자리</text>
<rect x="274" y="588" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="296" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">df 가 보는 자리</text>
<rect x="448" y="588" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="470" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">붙잡힌 블록</text>
<rect x="570" y="588" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="592" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">회수</text>
</svg>
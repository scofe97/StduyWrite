<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">가상 주소가 물리 주소가 되는 두 갈래</title><desc id="dd">CPU 가 프로세스의 가상 페이지에 닿을 때마다 밟는 경로. TLB 에 있으면 한 걸음이고, 없으면 페이지 테이블을 여러 단계 타고 내려간 뒤 TLB 를 갱신한다.</desc>
<rect width="880" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 02-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">가상 주소가 물리 주소가 되는 두 갈래</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">빠르게 만드는 장치가 아니라 느린 경로를 줄이는 장치입니다</text>
<rect x="128" y="108" width="280" height="44" rx="20" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="268.0" y="135.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">CPU 가 가상 페이지에 접근</text>
<path d="M 268 182.0 L 418.0 216 L 268 250.0 L 118.0 216 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="268" y="221" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">TLB 에 그 매핑이 있나</text>
<path d="M 268 152 L 268 182" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="128" y="316" width="280" height="64" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="268.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">물리 주소를 바로 얻는다</text>
<text x="268.0" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">온칩 조회 한 번</text>
<path d="M 268 250 L 268 316" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<text x="282" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">있다</text>
<rect x="492" y="188" width="296" height="64" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.0"/>
<text x="640.0" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">페이지 테이블을 따라 계산</text>
<text x="640.0" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여러 단계라 그만큼 느리다</text>
<path d="M 418 216 L 492 216" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="455.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">없다</text>
<rect x="492" y="316" width="296" height="64" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.0"/>
<text x="640.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">TLB 를 그 값으로 갱신</text>
<text x="640.0" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">다음 접근은 위쪽 경로로</text>
<path d="M 640 252 L 640 316" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)"/>
<path d="M 492 348 L 408 348" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)"/>
<rect x="60" y="420" width="760" height="120" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="80" y="448" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">페이지는 물리 메모리와 가상 메모리를 같은 크기로 자른 조각입니다</text>
<text x="80" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">전통적으로 기본 크기는 4 KB 였고, 커널 v2.6.3 부터 huge page 를 지원합니다.</text>
<text x="80" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여러 가상 페이지가 각자의 페이지 테이블을 거쳐 같은 물리 페이지를 가리킬 수 있습니다.</text>
<text x="80" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">64비트 리눅스는 프로세스당 128 TB 의 가상 주소 공간과 약 64 TB 의 물리 메모리를 허용합니다.</text>
<line x1="12" y1="564" x2="832" y2="564" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="586" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="576" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="586" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">빠른 경로</text>
<rect x="209" y="576" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="586" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">느린 경로와 그 뒤처리</text>
</svg>
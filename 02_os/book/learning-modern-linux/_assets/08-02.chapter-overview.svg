<title id="dt">자원마다 창이 따로 나 있어 어느 창을 여느냐가 곧 진단이다</title><desc id="dd">8장 둘째 구간의 절 여덟을 읽는 순서로 이은 지도. 2~5절이 리눅스 기본 도구이고 7~8절이 그 위에 얹히는 층이다.</desc>

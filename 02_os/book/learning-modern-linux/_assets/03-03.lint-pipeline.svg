<title id="dt">저장소에 넣기 전에 거치는 손과 도구</title><desc id="dd">스크립트가 사람의 손에서 저장소와 CI 로 넘어가기까지의 절차를 역할 레인으로 가른 것. 저자가 순서를 못 박은 자리는 테스트를 저장소에 넣기 전에 두라는 대목이다.</desc>
<rect width="880" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-03 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">저장소에 넣기 전에 거치는 손과 도구</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">shfmt 가 고친 것은 나중에 shellcheck 가 보고할 일을 미리 없앱니다</text>
<rect x="16" y="132" width="168" height="104" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="32" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">사람</text>
<text x="32" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">손으로 하는 일</text>
<line x1="192" y1="242.0" x2="860" y2="242.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="16" y="248" width="168" height="104" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="32" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">로컬 도구</text>
<text x="32" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">치기 전에 붙이는 것</text>
<line x1="192" y1="358.0" x2="860" y2="358.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="16" y="364" width="168" height="104" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="32" y="408" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">저장소와 CI</text>
<text x="32" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">넣은 뒤 도는 것</text>
<rect x="196" y="146" width="156" height="76" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="274.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">스크립트를 쓴다</text>
<text x="274.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">좋은 관례를 적용하며</text>
<rect x="364" y="262" width="156" height="76" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="442.0" y="288" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">shellcheck · shfmt</text>
<text x="442.0" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">검사하고</text>
<text x="442.0" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">포맷을 자동으로 고친다</text>
<rect x="532" y="262" width="156" height="76" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="610.0" y="288" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">bats</text>
<text x="610.0" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">저장소에 넣기 전에</text>
<text x="610.0" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">테스트한다</text>
<rect x="700" y="378" width="156" height="76" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="778.0" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">저장소와 CI</text>
<text x="778.0" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">GitHub action 으로</text>
<text x="778.0" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">다시 돈다</text>
<path d="M 356 184 L 358 184 L 358 300 L 356 300" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 524 300 L 524 300" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 692 300 L 694 300 L 694 416 L 692 416" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="20" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">bats 는 Bash Automated Testing System 의 줄임말이고, 테스트 파일을 특별한 문법의 bash 스크립트로 정의합니다.</text>
<text x="20" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">테스트 케이스 하나가 설명이 붙은 bash 함수 하나입니다.</text>

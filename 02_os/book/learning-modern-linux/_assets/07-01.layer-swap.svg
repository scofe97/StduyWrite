<title id="dt">위아래를 갈아 끼워도 가운데는 고쳐지지 않는다</title><desc id="dd">각 층은 바로 위와 바로 아래만 알면 되므로, 전송 계층을 TCP 에서 QUIC 으로 바꾸고 링크 계층을 이더넷에서 WiFi 로 바꿔도 인터넷 계층의 코드는 그대로다. 서로를 모르는 것이 곧 교체 가능성이다.</desc>
<rect width="880" height="706" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">위아래를 갈아 끼워도 가운데는 고쳐지지 않는다</text>

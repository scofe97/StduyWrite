<title id="dt">왕복 대기를 줄이려는 시도 넷</title><desc id="dd">TCP 윈도우, HTTP/1.1 파이프라이닝, HTTP/2 멀티플렉싱, HTTP/3 이 각각 무엇을 겹치게 했고 무엇이 남았는지. 층이 다르고 남는 병목이 다르다.</desc>
<rect width="1000" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-03 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">왕복 대기를 줄이려는 시도 넷</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세대마다 겹치게 한 것과 남은 병목이 다릅니다</text>
<line x1="76" y1="320" x2="960" y2="320" stroke="rgba(245,245,245,0.30)" stroke-width="1.0"/>
<line x1="76" y1="316" x2="76" y2="324" stroke="rgba(245,245,245,0.30)" stroke-width="1.0"/>
<text x="76" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">1980</text>
<line x1="281" y1="316" x2="281" y2="324" stroke="rgba(245,245,245,0.30)" stroke-width="1.0"/>
<text x="281" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">1990</text>
<line x1="486" y1="316" x2="486" y2="324" stroke="rgba(245,245,245,0.30)" stroke-width="1.0"/>
<text x="486" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">2000</text>
<line x1="690" y1="316" x2="690" y2="324" stroke="rgba(245,245,245,0.30)" stroke-width="1.0"/>
<text x="690" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">2010</text>
<line x1="895" y1="316" x2="895" y2="324" stroke="rgba(245,245,245,0.30)" stroke-width="1.0"/>
<text x="895" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">2020</text>
<circle cx="96" cy="320" r="4" fill="#6A95D8" stroke="#0D1117" stroke-width="1.5"/>
<line x1="96" y1="252" x2="96" y2="314" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="106" y="174" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">1981 · L4</text>
<text x="106" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">TCP 윈도우 · RFC 793</text>
<text x="106" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">ACK 를 안 기다리고 창만큼 밀어 넣는다</text>
<text x="106" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">남는 것: 세그먼트는 한 줄 — 하나 빠지면 뒤가 선다</text>
<circle cx="465" cy="320" r="4" fill="#8B98A9" stroke="#0D1117" stroke-width="1.5"/>
<line x1="465" y1="326" x2="465" y2="370" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="455" y="370" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">1999 · L7</text>
<text x="455" y="392" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">HTTP/1.1 파이프라이닝 · RFC 2616</text>
<text x="455" y="414" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">요청은 겹치되 응답은 받은 순서대로</text>
<text x="455" y="434" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">앞 응답이 늦으면 뒤가 막힌다 — 대신 연결을 여럿 연다</text>
<circle cx="793" cy="320" r="6" fill="#F08A59" stroke="#0D1117" stroke-width="1.5"/>
<line x1="793" y1="252" x2="793" y2="312" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="783" y="174" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">2015 · L7</text>
<text x="783" y="196" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">HTTP/2 멀티플렉싱 · RFC 7540</text>
<text x="783" y="218" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">프레임마다 스트림 ID 를 붙였다</text>
<text x="783" y="238" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그래서 응답 순서가 자유롭다 — TCP 한 줄은 그대로</text>
<circle cx="936" cy="320" r="4" fill="#6A95D8" stroke="#0D1117" stroke-width="1.5"/>
<line x1="936" y1="326" x2="936" y2="370" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="926" y="370" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">2022 · L4</text>
<text x="926" y="392" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">HTTP/3 · QUIC 위로 · RFC 9114</text>
<text x="926" y="414" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">UDP 위에 스트림을 독립으로 둔다</text>
<text x="926" y="434" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">한 스트림의 손실이 다른 스트림을 막지 않는다</text>
<text x="24" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">인과 방향이 중요합니다. 순서가 없어서 ID 가 나온 것이 아니라, 프레임에 스트림 ID 를 붙였기 때문에 순서가 자유로워졌습니다.</text>
<text x="24" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">왼쪽 셋은 같은 TCP 한 줄 위라 세그먼트 하나가 빠지면 스트림 전부가 함께 섭니다. 그 줄을 UDP 위의 독립 스트림으로 바꾼 것이 QUIC 입니다.</text>
<line x1="12" y1="556" x2="952" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="568" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">L4 전송 계층</text>
<rect x="248" y="568" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="270" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">L7 애플리케이션 계층</text>
<rect x="448" y="568" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="470" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">순서를 푼 열쇠</text>
</svg>
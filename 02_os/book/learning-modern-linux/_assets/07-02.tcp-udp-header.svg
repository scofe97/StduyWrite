<title id="dt">UDP 에 없는 필드가 곧 UDP 가 보장하지 않는 것이다</title><desc id="dd">저자가 꼽은 헤더 필드를 비트 폭 그대로 견준 것. 순서 번호와 확인 응답 번호와 윈도가 빠진 자리가 UDP 의 단순함이자 한계다.</desc>
<rect width="880" height="684" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-02 §2·§3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">UDP 에 없는 필드가 곧 UDP 가 보장하지 않는 것이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">빠진 만큼 위층이 대신 해야 합니다</text>
<text x="32" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#3FB98C">TCP</text>
<text x="110" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">RFC 9293(구 793) · 연결 지향 · 순서와 재전송을 보장</text>
<text x="212" y="196" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">Source port</text>
<rect x="222" y="180" width="128.0" height="24" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="362.0" y="196" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">16 bit</text>
<text x="212" y="230" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">Destination port</text>
<rect x="222" y="214" width="128.0" height="24" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="362.0" y="230" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">16 bit</text>
<text x="212" y="264" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">Sequence number</text>
<rect x="222" y="248" width="256.0" height="24" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.3"/>
<text x="490.0" y="264" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">32 bit</text>
<text x="212" y="298" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">Acknowledgment number</text>
<rect x="222" y="282" width="256.0" height="24" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.3"/>
<text x="490.0" y="298" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">32 bit</text>
<text x="212" y="332" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">Flags</text>
<rect x="222" y="316" width="72.0" height="24" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.3"/>
<text x="306.0" y="332" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">9 bit</text>
<text x="212" y="366" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">Window</text>
<rect x="222" y="350" width="128.0" height="24" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.3"/>
<text x="362.0" y="366" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">16 bit</text>
<text x="212" y="400" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">Checksum</text>
<rect x="222" y="384" width="128.0" height="24" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="362.0" y="400" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">16 bit</text>
<text x="32" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#6A95D8">UDP</text>
<text x="110" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">RFC 768 · 비연결</text>
<text x="212" y="472" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">Source port</text>
<rect x="222" y="456" width="128.0" height="24" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="362.0" y="472" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">16 bit</text>
<text x="212" y="506" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">Destination port</text>
<rect x="222" y="490" width="128.0" height="24" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="362.0" y="506" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">16 bit</text>
<text x="212" y="540" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">Length</text>
<rect x="222" y="524" width="128.0" height="24" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.1"/>
<text x="362.0" y="540" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">16 bit</text>
<text x="212" y="574" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">Checksum</text>
<rect x="222" y="558" width="128.0" height="24" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="362.0" y="574" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">16 bit</text>
<rect x="560" y="176" width="288" height="204" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="580" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">TCP 에만 있는 넷</text>
<text x="580" y="232" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">Sequence number</text>
<text x="580" y="249" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">순서대로 전달</text>
<text x="580" y="272" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">Acknowledgment number</text>
<text x="580" y="289" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">3방향 핸드셰이크의 핵심</text>
<text x="580" y="312" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">Flags</text>
<text x="580" y="329" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">SYN 과 ACK</text>
<text x="580" y="352" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">Window</text>
<text x="580" y="369" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">받을 수 있는 양</text>
<rect x="560" y="396" width="288" height="84" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="580" y="424" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">TCP 에는 방어 장치가 없습니다</text>
<text x="580" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">페이로드가 평문으로 갑니다. 사이의</text>
<text x="580" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">누구든 볼 수 있으니 TLS 1.3 을 씁니다.</text>
<rect x="560" y="496" width="288" height="84" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="580" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">UDP 가 얻는 것</text>
<text x="580" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">오버헤드가 아주 적어 높은 처리량을</text>
<text x="580" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">냅니다. NTP · DHCP · DNS 가 씁니다.</text>
<line x1="12" y1="620" x2="832" y2="620" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="642" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="632" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="642" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">두 프로토콜에 공통</text>
<rect x="274" y="632" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="296" y="642" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCP 에만 있는 것</text>
<rect x="461" y="632" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="483" y="642" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">UDP 고유</text>
<rect x="583" y="632" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="605" y="642" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">암호화가 필요한 이유</text>
</svg>
<rect x="336.0" y="126" width="100.0" height="36" rx="4" fill="#F08A591F" stroke="#F08A59" stroke-width="1.4"/>
<text x="386.0" y="149" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">줄일 몫 (언마운트)</text>

<title id="dt">축소는 위 층부터 — 파일시스템 → LV → VG</title><desc id="dd">ext4 를 언마운트해 먼저 줄이고 그다음 LV 를 줄여 PE 를 VG 에 돌려준다. LV 를 먼저 자르면 파일시스템 뒷부분 블록 그룹이 잘려 영구 손실된다. XFS 는 fsadm 이 축소를 거절한다.</desc>
<rect width="920" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">축소는 위 층부터 — 파일시스템 → LV → VG</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">파일시스템 블록을 앞쪽으로 대피시킨 후 하위 LV 를 줄여야 손실을 막는다</text>
<text x="24" y="141" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">파일시스템</text>
<text x="24" y="157" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">ext4 /mnt/lv</text>
<text x="24" y="197" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">LV</text>
<text x="24" y="213" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">vg0/data</text>
<text x="24" y="253" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">VG · PV</text>
<text x="24" y="269" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">vg0 · PE 풀</text>
<line x1="336.0" y1="118" x2="336.0" y2="280" stroke="#E3B341" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="336.0" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">-L 200M 목표 크기</text>
<path d="M 386.0 166 L 386.0 178" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<path d="M 386.0 222 L 386.0 234" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>

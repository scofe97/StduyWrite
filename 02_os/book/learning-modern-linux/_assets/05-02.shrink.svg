<text x="236.0" y="261" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">계속 쓰는 PE</text>
<rect x="336.0" y="238" width="100.0" height="36" rx="4" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="386.0" y="261" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">Free PE 풀 복귀</text>
<circle cx="460.0" cy="144.0" r="10" fill="#0D1117" stroke="#E3B341" stroke-width="1.2"/>
<text x="460.0" y="148.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">1</text>
<circle cx="460.0" cy="200.0" r="10" fill="#0D1117" stroke="#E3B341" stroke-width="1.2"/>
<text x="460.0" y="204.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">2</text>
<circle cx="460.0" cy="256.0" r="10" fill="#0D1117" stroke="#E3B341" stroke-width="1.2"/>
<text x="460.0" y="260.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">3</text>
<text x="476.0" y="149" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">umount · fsck · resize2fs</text>
<text x="476.0" y="205" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">lvreduce -L 200M</text>
<text x="476.0" y="261" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">VG 의 Free PE 로 전환</text>
<text x="24" y="317" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">거꾸로 자르면</text>
<text x="24" y="333" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">LV 먼저 축소 시</text>
<rect x="136.0" y="302" width="200.0" height="36" rx="4" fill="#161B22" stroke="#8B98A9" stroke-width="1"/>
<text x="236.0" y="325" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">남은 LV 공간 (200M)</text>
<rect x="336.0" y="302" width="100.0" height="36" rx="4" fill="#F0616D1F" stroke="#F0616D" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="386.0" y="325" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">FS 꼬리 블록 절단</text>
<text x="456.0" y="325" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">아이노드 테이블 · 데이터 블록 영구 손실!</text>
<text x="24" y="373" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">XFS 축소 거절</text>
<text x="24" y="389" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">vgx/xfsl</text>
<rect x="136" y="358" width="180" height="36" rx="4" fill="#161B22" stroke="#8B98A9" stroke-width="1"/>
<text x="226" y="381" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">XFS 파일시스템</text>
<text x="332" y="373" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">lvreduce -y -r -L 200M → fsadm: Xfs filesystem shrinking is unsupported.</text>
<text x="332" y="389" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">동적 inode · inode 에 AG 번호 포함(청크 이동 미해결) → 백업 후 재생성만 가능</text>

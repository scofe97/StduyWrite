<text x="100" y="160" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">카운터 — 서비스가 처리한 총 요청 수</text>
<text x="828" y="348" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">게이지 — 지금 돌고 있는 프로세스 수</text>
<text x="24" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">카운터는 0 으로 초기화되는 경우를 빼면 값이 내려가지 않습니다. 그래서 그래프의 기울기가 곧 처리율입니다.</text>
<text x="24" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">게이지는 지금 이 순간의 값이라 오르내립니다. 남은 주 메모리처럼 누적이 뜻을 갖지 않는 대상에 씁니다.</text>
<line x1="12" y1="480" x2="832" y2="480" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

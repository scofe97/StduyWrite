<title id="dt">카운터는 올라가기만 하고 게이지는 오르내린다</title><desc id="dd">저자가 정의한 두 메트릭 종류의 값이 움직이는 모양. 세로축에 단위가 없는 것은 원문에 수치가 없기 때문이고, 여기서 읽을 것은 크기가 아니라 방향이다.</desc>
<rect width="880" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">카운터는 올라가기만 하고 게이지는 오르내린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세 번째 종류인 히스토그램은 시계열이 아니라 분포라 이 그림에 없습니다</text>

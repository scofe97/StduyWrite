<title id="dt">하드 링크는 아이노드를, 심볼릭 링크는 경로를 붙든다</title><desc id="dd">이름 셋이 같은 파일을 가리키는 것처럼 보이지만 실제로 붙드는 대상이 다르다. 그 차이가 stat 출력의 아이노드 번호와 링크 수와 크기 세 곳에 동시에 드러난다.</desc>
<rect width="880" height="612" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">하드 링크는 아이노드를, 심볼릭 링크는 경로를 붙든다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원본을 지우면 둘의 운명이 갈립니다</text>
<rect x="32" y="152" width="224" height="60" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="48" y="178" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">myfile</text>
<text x="48" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">원본 이름</text>
<rect x="32" y="232" width="224" height="60" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="48" y="258" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">somealias</text>
<text x="48" y="278" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">ln myfile somealias</text>
<rect x="32" y="336" width="224" height="60" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="48" y="362" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">somesoftalias</text>
<text x="48" y="382" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">ln -s myfile somesoftalias</text>
<rect x="372" y="152" width="216" height="140" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.3"/>
<text x="480.0" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">아이노드 6302071</text>
<text x="480.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">크기 · 소유자 · 위치</text>
<text x="480.0" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">날짜 · 권한</text>
<rect x="392" y="244" width="176" height="32" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="480.0" y="265" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#3FB98C">Links: 2</text>
<rect x="372" y="336" width="216" height="96" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="480.0" y="364" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13.5" font-weight="600" fill="#F08A59">아이노드 6303540</text>
<text x="480.0" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">내용이 경로 문자열이다</text>
<text x="480.0" y="410" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">Size: 6 · Links: 1</text>
<rect x="664" y="176" width="188" height="92" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="758.0" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">데이터 블록</text>
<text x="758.0" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">실제 바이트가 있는 곳</text>
<path d="M 256 182 L 314 182 L 314 192 L 364 192" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<path d="M 256 262 L 314 262 L 314 242 L 364 242" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<path d="M 256 366 L 314 366 L 314 370 L 364 370" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 588 222 L 656 222" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 480.0 336 L 480.0 300" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)" stroke-dasharray="6 5"/>
<text x="492.0" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">이름으로 다시 찾아간다</text>
<rect x="28" y="452" width="824" height="84" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="48" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">myfile 을 지우면</text>
<text x="48" y="502" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">somealias 는 여전히 같은 아이노드를 붙들고 있어 데이터에 닿습니다.</text>
<text x="48" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">somesoftalias 는 존재하지 않는 경로를 담은 파일로 남습니다.</text>
<line x1="12" y1="568" x2="832" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="590" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="580" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아이노드를 붙드는 이름</text>
<rect x="300" y="580" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="322" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아이노드와 데이터</text>
<rect x="461" y="580" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="483" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">경로를 붙드는 이름</text>
</svg>
<title id="dt">포트가 있어야 서비스를 가리킬 수 있고 이름이 있어야 사람이 기억한다</title><desc id="dd">7장 둘째 구간의 절 일곱을 읽는 순서로 이은 지도. 1~4절이 전송 계층이고 5~7절이 DNS 다.</desc>

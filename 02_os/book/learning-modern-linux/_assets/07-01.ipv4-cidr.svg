<title id="dt">자르는 위치 하나가 네트워크와 호스트를 정한다</title><desc id="dd">IPv4 주소는 32비트 하나다. CIDR 의 뒷부분이 그 32비트를 어디에서 자를지 정하고, 왼쪽이 네트워크 몫, 오른쪽이 호스트 몫이 된다.</desc>
<rect width="880" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">자르는 위치 하나가 네트워크와 호스트를 정한다</text>

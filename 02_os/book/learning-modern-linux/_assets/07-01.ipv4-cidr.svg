<text x="44" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">32비트를 8비트씩 넷으로 — 저자의 예 63.32.106.149</text>

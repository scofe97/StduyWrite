<text x="24" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">묶음은 쓰는 쪽으로 이 노트가 나눔 · 권한·소유는 본문 ls 세 줄만 · 파란 이름은 바이너리라 cat 으로 깨짐</text>

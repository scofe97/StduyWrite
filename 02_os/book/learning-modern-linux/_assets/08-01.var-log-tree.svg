<title id="dt">/var/log 는 무엇이 어디 쌓이는지의 지도다</title><desc id="dd">Debian 계열 /var/log 의 주요 항목 열둘을 쓰는 쪽별로 묶은 지도. syslog·auth.log·kern.log 는 rsyslog 규칙이 이름을 정하고, journal/ 은 journald 가, btmp·lastlog 는 login·init 같은 프로그램이 쓴다. 바이너리 항목은 cat 대신 journalctl·lastb·lastlog 로 읽는다. 소유 그룹은 auth.log 가 adm, btmp 가 utmp, journal/ 이 systemd-journal 이다.</desc>
<rect width="920" height="668" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">/var/log 는 무엇이 어디 쌓이는지의 지도다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">파일 이름을 정하는 것은 커널도 systemd 도 아닌 rsyslog 규칙이다</text>
<text x="24" y="104" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">쓰는 쪽</text>
<text x="704" y="104" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">읽는 명령</text>
<rect x="288" y="116" width="376" height="462" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="304" y="142" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F5F5F3">/var/log/</text>
<text x="400" y="142" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">ls -al 의 주요 항목 열둘</text>
<line x1="298" y1="156" x2="654" y2="156" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="308" y="183.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">syslog</text>
<text x="408" y="183.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">대부분의 시스템 메시지</text>
<text x="308" y="211.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">auth.log</text>
<text x="408" y="211.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">-rw-r----- syslog adm</text>

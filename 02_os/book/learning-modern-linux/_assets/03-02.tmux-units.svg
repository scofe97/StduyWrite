<title id="dt">세션이 윈도를 담고 윈도가 페인을 담는다</title><desc id="dd">tmux 의 세 단위를 큰 것에서 작은 것으로 포갠 것. 세션은 다른 모든 단위를 담는 그릇이고, 실제로 셸이 도는 곳은 가장 안쪽의 페인이다.</desc>
<rect width="880" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-02 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세션이 윈도를 담고 윈도가 페인을 담는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">붙었다 뗄 수 있는 단위는 세션입니다</text>
<rect x="28" y="140" width="800" height="288" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="44" y="132" width="240" height="16" fill="#0D1117"/>
<text x="52" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">세션 — 특정 일에 바친 작업 환경 하나</text>
<rect x="688" y="132" width="128" height="16" fill="#0D1117"/>
<text x="808" y="144" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">tmux new -s test</text>
<rect x="60" y="180" width="376" height="216" rx="8" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>
<text x="76" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">윈도 1</text>
<text x="76" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">브라우저의 탭 같은 것 · 쓰는 것은 선택</text>
<rect x="76" y="248" width="344" height="40" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.3"/>
<text x="90" y="273" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">페인 A</text>
<text x="406" y="273" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">셸 하나가 돈다</text>
<rect x="76" y="296" width="344" height="40" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.3"/>
<text x="90" y="321" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">페인 B</text>
<text x="406" y="321" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">가로로 쪼갠 것</text>
<rect x="76" y="344" width="344" height="40" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.3"/>
<text x="90" y="369" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">페인 C</text>
<text x="406" y="369" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">세로로 쪼갠 것</text>
<rect x="468" y="180" width="336" height="216" rx="8" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>
<text x="484" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">윈도 2</text>
<text x="484" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">세션마다 하나만 두는 경우가 많다</text>
<rect x="484" y="248" width="304" height="136" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.3"/>
<text x="636" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">페인 하나</text>
<text x="636" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">쪼개지 않으면 윈도 전체가</text>
<text x="636" y="342" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">페인 하나입니다</text>
<rect x="28" y="452" width="832" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="48" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">tmux 는 서버로 돌고 내가 보는 셸이 클라이언트다</text>
<text x="48" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그래서 세션을 만들고 들어가고 나오고 없앨 수 있습니다. Ctrl+b 다음 d 로 떼어 두면 나중에 tmux attach -t test 로 다시 붙습니다.</text>
<line x1="12" y1="544" x2="832" y2="544" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="566" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="556" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">담는 것</text>
<rect x="196" y="556" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="218" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실제로 셸이 도는 곳</text>
<rect x="383" y="556" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="405" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 사이 층</text>
</svg>
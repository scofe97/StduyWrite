<rect x="36" y="548" width="804" height="62" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="56" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">bash 호환은 셸마다 판정된 적이 없습니다</text>
<text x="56" y="594" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">원문은 목록 전체에 "항상 bash 호환은 아니다" 라는 단서 한 줄만 붙입니다.</text>

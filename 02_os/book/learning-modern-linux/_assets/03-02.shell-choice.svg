<title id="dt">저자는 두 가지를 물으라 하고 자기 목록에는 답하지 않는다</title><desc id="dd">저자가 셸을 볼 때 던지라고 한 물음을 열로 세우고, 그가 실제로 적은 것만 칸에 넣은 격자. 빈 칸이 아니라 미기재라고 적어 두면 무엇을 직접 확인해야 하는지가 보인다.</desc>
<rect width="880" height="696" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">저자는 두 가지를 물으라 하고 자기 목록에는 답하지 않는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자는 자기가 Fish 를 쓰고 동료들은 zsh 에 만족한다고 밝힙니다</text>
<text x="300.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">저자가 밝힌 초점</text>
<text x="516.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">bash 호환 서술</text>
<text x="732.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">저자가 붙인 특징</text>
<line x1="36" y1="184" x2="840" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<rect x="36" y="200" width="804" height="54" rx="4" fill="#161B22" stroke="none" stroke-width="0"/>
<text x="50" y="232.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">fish</text>
<text x="300.0" y="232.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#5E6B7E">원문 미기재</text>
<text x="516.0" y="232.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#E3B341">일상 입력은 큰 차이 없다</text>
<text x="732.0" y="232.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#3FB98C">저자 본인이 쓰는 셸</text>
<text x="50" y="286.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">zsh</text>

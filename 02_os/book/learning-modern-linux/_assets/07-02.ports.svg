<title id="dt">특권이 필요한 구간은 전체의 1.6% 뿐이다</title><desc id="dd">포트가 16비트라 65,536개다. 그 공간을 저자가 가른 세 구간의 폭을 실제 개수 비율로 그렸다. 낮은 쪽이 좁은데도 이름이 알려진 것은 그 안에 데몬들이 몰려 있기 때문이다.</desc>
<rect width="880" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">특권이 필요한 구간은 전체의 1.6% 뿐이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">1024 미만에 바인딩하려면 상승된 특권이 필요합니다</text>
<rect x="32" y="200" width="12.75" height="132" rx="6" fill="#F08A5920" stroke="#F08A59" stroke-width="1.6"/>
<rect x="44.75" y="200" width="599.25" height="132" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="344.375" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">등록된 포트</text>
<text x="344.375" y="258" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">1024 – 49151</text>
<text x="344.375" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">48,128 개</text>
<text x="344.375" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IANA 가 공개 절차로 관리</text>
<rect x="644.0" y="200" width="204.0" height="132" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="746.0" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">임시 포트</text>
<text x="746.0" y="258" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">49152 – 65535</text>
<text x="746.0" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">16,384 개</text>
<text x="746.0" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">등록할 수 없다 · 자동 할당과 사설</text>
<path d="M 38.375 194 L 38.375 156" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="40" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">잘 알려진 포트 — 0 ~ 1023 · 1,024 개</text>
<text x="40" y="146" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">SSH 서버나 웹 서버 같은 데몬을 위한 자리</text>
<text x="32" y="358" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">전체 65,536 개</text>
<text x="848" y="358" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">16비트</text>
<rect x="32" y="386" width="400" height="76" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="52" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">4장의 capability 가 여기에서 쓰입니다</text>
<text x="52" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">웹 서버에 root 전체를 주는 대신 낮은 포트에 바인딩할</text>
<text x="52" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">권한 하나만 떼어 주면 됩니다.</text>
<rect x="448" y="386" width="400" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="468" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">앱이 접속할 때도 포트가 필요합니다</text>
<text x="468" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">여러분의 앱이 웹 서버에 접속하면 그 앱도 통신의</text>
<text x="468" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">다른 한쪽 끝이라 임시 포트를 하나 받습니다.</text>
<line x1="12" y1="492" x2="832" y2="492" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="514" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="504" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">특권이 필요한 구간</text>
<rect x="274" y="504" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="296" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IANA 가 관리하는 구간</text>
<rect x="500" y="504" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="522" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자동으로 할당되는 구간</text>
</svg>
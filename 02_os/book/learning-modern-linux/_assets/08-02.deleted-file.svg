<text x="208" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">fd 3 으로 크기를 0 으로 자름 → df 200 → 0 · 내용은 못 되살림</text>
<line x1="24" y1="544" x2="56" y2="544" stroke="#5E6B7E" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="68" y="548" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">fd 닫힘(종료 · 재시작) → 마지막 참조가 사라져 해제 · unlink(2)</text>
<text x="24" y="580" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">PID·FD·크기·NLINK·NODE·df 값은 본문 실측 그대로 · lsof 의 USER·TYPE·DEVICE 열은 생략</text>

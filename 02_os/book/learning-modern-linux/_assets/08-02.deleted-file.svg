<title id="dt">이름은 사라졌는데 fd 3 이 200 MiB 를 쥐고 있다</title><desc id="dd">300 MiB tmpfs /data 에 200 MiB app.log 를 만들고 tail -f(PID 3678)로 연 채 rm 했다. ls -la /data 에는 . 와 .. 만 남지만 df -m 은 Used 200 을 보인다. lsof +L1 의 한 줄에서 COMMAND·PID·FD 는 프로세스와 fd 3 을, SIZE/OFF·NLINK·NODE 는 크기 209715200 바이트에 링크 수 0 인 아이노드 2 를, NAME 의 (deleted) 는 디렉터리에서 사라진 이름을 가리킨다. : &gt; /proc/3678/fd/3 으로 크기를 0 으로 자르자 df 가 0 으로 돌아왔다.</desc>
<rect width="920" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름은 사라졌는데 fd 3 이 200 MiB 를 쥐고 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">lsof +L1 한 줄의 열마다 그 값을 가진 객체가 있다 — 공간을 쥔 것은 fd 3 이다</text>
<text x="24" y="108" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">$ lsof +L1</text>

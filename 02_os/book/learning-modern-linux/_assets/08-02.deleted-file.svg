<title id="dt">지운 뒤에도 남는 200MiB</title><desc id="dd">rm 은 이름만 떼고, 파일을 연 프로세스가 있으면 공간이 그대로 남는다. lsof +L1 이 그 파일을 보여 주고, /proc/PID/fd 로 크기를 0 으로 자르거나 fd 가 닫히면 df 가 0 으로 돌아온다.</desc>
<rect width="960" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">지운 뒤에도 남는 200MiB</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">lsof +L1 의 NLINK 0 · (deleted) 줄이 공간을 쥔 프로세스입니다</text>
<rect x="24" y="140" width="192" height="112" rx="8" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="120.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">빈 /data</text>
<text x="120.0" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">파일 없음</text>
<text x="120.0" y="212" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">df 0 MiB</text>
<rect x="264" y="140" width="192" height="112" rx="8" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="360.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">열린 파일</text>
<text x="360.0" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">app.log · NLINK 1</text>
<text x="360.0" y="212" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">tail fd 3</text>
<text x="360.0" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">df 200 MiB</text>
<rect x="504" y="140" width="192" height="112" rx="8" fill="#F08A592E" stroke="#F08A59" stroke-width="1.6"/>
<text x="600.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">지운 열린 파일</text>
<text x="600.0" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">이름 없음 · NLINK 0</text>
<text x="600.0" y="212" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(deleted) · fd 3</text>
<text x="600.0" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">df 200 MiB</text>
<rect x="744" y="140" width="192" height="112" rx="8" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="840.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">0 으로 잘린 파일</text>
<text x="840.0" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">크기 0 · fd 3 유지</text>
<text x="840.0" y="212" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">df 0 MiB</text>
<path d="M 220 196 L 258 196" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="240.0" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">dd · tail -f</text>
<path d="M 460 196 L 498 196" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="480.0" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">rm app.log</text>
<path d="M 700 196 L 738 196" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="720.0" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">: &gt; /proc/3678/fd/3</text>
<rect x="744" y="332" width="192" height="76" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="840.0" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">fd 닫힌 파일</text>
<text x="840.0" y="386" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">df 0 MiB</text>
<path d="M 600.0 256 L 600.0 370 L 738 370" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)" stroke-dasharray="5 4"/>
<text x="612.0" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">프로세스 종료 · 재시작</text>
<text x="612.0" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">unlink(2) 근거</text>
<line x1="12" y1="444" x2="912" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

<text x="24" y="464" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">tmpfs /data · 크기 300 MiB</text>
<rect x="760" y="380" width="136" height="88" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="776" y="402" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">df -m /data</text>
<text x="776" y="430" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#E3B341">Used 200</text>
<text x="776" y="452" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">Avail 100 · 67%</text>

<title id="dt">실행 길 위의 훅에서 트레이스가 나온다</title><desc id="dd">프로세스 하나의 실행은 유저 공간의 함수 호출에서 시스템 콜을 지나 커널 함수로 내려간다. 유저 공간에는 uprobes, 커널에는 kprobes 와 커널 트레이스포인트가 훅으로 걸리고, 시스템 콜이 커널 추적의 트리거가 된다. 훅에서 나온 이벤트가 시간에 걸쳐 트레이스로 쌓이고 strace(디버깅, 오버헤드 주의)·perf(성능 분석)·프로파일러가 그것을 읽는다. 커널 안에서 도는 eBPF 가 추적 구현의 표준이 되리라는 것이 저자의 전망이다.</desc>
<rect width="920" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-02 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">실행 길 위의 훅에서 트레이스가 나온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">추적은 유저 공간 함수 · 시스템 콜 · 커널 함수에 건 훅에서 시간에 걸친 이벤트를 붙잡는다</text>

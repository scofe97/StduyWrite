<title id="dt">첫 전송은 같고 두 번째에서 갈린다</title><desc id="dd">받는 쪽이 비어 있는 첫 회차에는 둘 다 전부 보낸다. 두 번째부터 scp 는 여전히 통째로 보내고 rsync 는 양쪽을 견주어 바뀐 것만 보낸다.</desc>
<rect width="880" height="652" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-03 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">첫 전송은 같고 두 번째에서 갈린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">파일 개수는 설명을 위한 예시입니다</text>
<text x="351.5" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">1차 전송</text>
<text x="694.5" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">2차 전송 — 파일 3개만 고쳤다</text>
<rect x="24" y="172" width="150" height="128" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="99.0" y="224" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#6A95D8">scp</text>
<text x="99.0" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">복사할 뿐이다</text>
<rect x="190" y="172" width="323" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="214" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" font-weight="600" fill="#6A95D8">100개 전부</text>
<text x="214" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">받는 쪽이 비어 있다</text>
<rect x="533" y="172" width="323" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="557" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" font-weight="600" fill="#6A95D8">100개 전부</text>
<text x="557" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">견주지 않으니 통째로 다시</text>
<path d="M 516 236.0 L 529 236.0" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<rect x="24" y="324" width="150" height="128" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="99.0" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#3FB98C">rsync</text>
<text x="99.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">견주고 나서 보낸다</text>
<rect x="190" y="324" width="323" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="214" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" font-weight="600" fill="#3FB98C">100개 전부</text>
<text x="214" y="408" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">받는 쪽이 비어 있다</text>
<rect x="533" y="324" width="323" height="128" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.5"/>
<text x="557" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" font-weight="600" fill="#F08A59">바뀐 3개만</text>
<text x="557" y="408" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">크기나 수정 시각이 다른 것만</text>
<path d="M 516 388.0 L 529 388.0" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<line x1="24" y1="312.0" x2="856" y2="312.0" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="24" y="474" width="832" height="96" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="44" y="502" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">견주는 기준이 무엇인가</text>
<text x="44" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">기본은 quick check 입니다. 크기나 최종 수정 시각이 달라진 파일을 찾고 둘 다 그대로면 건너뜁니다.</text>
<text x="44" y="548" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">-c 를 켜면 크기가 같은 파일의 체크섬까지 견주는데, 그러려면 양쪽이 파일 전체를 읽어야 합니다.</text>
<line x1="12" y1="592" x2="832" y2="592" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="614" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="604" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="614" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">복사만 한다</text>
<rect x="222" y="604" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="244" y="614" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">견주고 보낸다</text>
<rect x="357" y="604" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="379" y="614" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">두 회차가 갈리는 자리</text>
</svg>
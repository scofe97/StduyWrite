<title id="dt">IP 일곱 줄이 정렬되고 세어져 순위가 된다</title><desc id="dd">grep -oE '^[0-9.]+' access.log | sort | uniq -c | sort -rn 의 각 단계를 지난 값. sort 가 같은 IP 를 이웃에 모아야 uniq -c 가 한 덩이로 센다.</desc>

<title id="dt">일곱 개의 커튼과, 그 커튼을 확인하는 파일들</title><desc id="dd">네임스페이스는 온전히 자원 가시성에 관한 것이다. 무엇을 가렸는지 확인하는 방법이 거의 전부 파일을 읽는 일이라는 점이 5장과 이어진다.</desc>
<rect width="880" height="712" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">일곱 개의 커튼과, 그 커튼을 확인하는 파일들</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자는 이 격리가 보안 관점의 단단한 경계는 아니라고 단서를 답니다</text>
<text x="366.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">무엇을 가리는가</text>
<text x="620.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">어디에서 보나</text>
<text x="786.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">커널</text>
<line x1="24" y1="184" x2="832" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<rect x="24" y="196" width="808" height="48" rx="4" fill="#161B22" stroke="none" stroke-width="0"/>
<text x="38" y="225.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">CLONE_NEWNS</text>
<text x="366.0" y="225.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">파일시스템 마운트 지점</text>
<text x="620.0" y="225.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">/proc/$PID/mounts</text>
<text x="786.0" y="225.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">2.4.19</text>
<text x="38" y="273.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">CLONE_NEWUTS</text>
<text x="366.0" y="273.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">호스트명과 NIS 도메인명</text>
<text x="620.0" y="273.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">uname -n</text>
<text x="786.0" y="273.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">2.6.19</text>
<rect x="24" y="292" width="808" height="48" rx="4" fill="#161B22" stroke="none" stroke-width="0"/>
<text x="38" y="321.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">CLONE_NEWIPC</text>
<text x="366.0" y="321.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">System V IPC · POSIX 메시지 큐</text>
<text x="620.0" y="321.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">/proc/sysvipc</text>
<text x="786.0" y="321.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">2.6.19</text>
<text x="38" y="369.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">CLONE_NEWPID</text>
<text x="366.0" y="369.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">PID 번호 공간</text>
<text x="620.0" y="369.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">/proc/$PID/status</text>
<text x="786.0" y="369.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">2.6.24</text>
<rect x="24" y="388" width="808" height="48" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.3"/>
<text x="38" y="417.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F08A59">CLONE_NEWNET</text>
<text x="366.0" y="417.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">장치 · IP · 라우팅 · 포트</text>
<text x="620.0" y="417.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">ip netns list</text>
<text x="786.0" y="417.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">2.6.29</text>
<text x="38" y="465.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">CLONE_NEWUSER</text>
<text x="366.0" y="465.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">안팎의 UID·GID 매핑</text>
<text x="620.0" y="465.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">/proc/$PID/uid_map</text>
<text x="786.0" y="465.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">3.8</text>
<rect x="24" y="484" width="808" height="48" rx="4" fill="#161B22" stroke="none" stroke-width="0"/>
<text x="38" y="513.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">CLONE_NEWCGROUP</text>
<text x="366.0" y="513.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">네임스페이스 안의 cgroups</text>
<text x="620.0" y="513.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">/proc/$PID/cgroup</text>
<text x="786.0" y="513.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">4.6</text>
<line x1="24" y1="538" x2="832" y2="538" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<rect x="24" y="544" width="808" height="72" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="44" y="572" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F08A59">파드가 성립하는 근거가 이 표의 두 줄 차이입니다</text>
<text x="44" y="594" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">한 파드의 컨테이너들은 CLONE_NEWNET 을 공유하므로 localhost 로 서로를 부릅니다.</text>
<text x="44" y="612" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">그런데 CLONE_NEWNS 는 공유하지 않으므로 파일시스템은 따로 봅니다.</text>
<line x1="12" y1="648" x2="832" y2="648" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="670" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="660" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="670" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">관측되는 커널 버전</text>
<rect x="274" y="660" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="296" y="670" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">파드가 공유하는 것</text>
</svg>
<title id="dt">root 냐 아니냐를 쪼개 온 장치들</title><desc id="dd">리눅스가 특권을 둘로만 나누던 자리에 무엇이 언제 들어왔는지를 순서로 편 것. 가로축은 척도가 아니라 도입 순서이고, 각 점의 표기는 원문이 밝힌 그대로다.</desc>
<rect width="880" height="452" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 04-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">root 냐 아니냐를 쪼개 온 장치들</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원문이 둘은 커널 버전으로, 하나는 연도로 밝힙니다</text>
<rect x="297.6" y="170" width="455.67999999999995" height="28" rx="4" fill="#F08A5910" stroke="#F08A59" stroke-width="0.0"/>
<text x="525.44" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">이분법이 잘게 쪼개지는 구간</text>
<line x1="84" y1="184" x2="796" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<circle cx="84.0" cy="184" r="4" fill="#8B98A9"/>
<line x1="84.0" y1="176" x2="84.0" y2="166" stroke="#8B98A9" stroke-width="0.8"/>
<text x="84.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">전통</text>
<text x="84.0" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">root 는 제약이 없다</text>
<circle cx="297.6" cy="184" r="6" fill="#F08A59"/>
<line x1="297.6" y1="192" x2="297.6" y2="202" stroke="#F08A59" stroke-width="0.8"/>
<text x="297.6" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">커널 v2.2</text>
<text x="297.6" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">capability — root 의 특권을 쪼갠다</text>
<circle cx="525.44" cy="184" r="4" fill="#6A95D8"/>
<line x1="525.44" y1="176" x2="525.44" y2="166" stroke="#6A95D8" stroke-width="0.8"/>
<text x="525.44" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">2005년</text>
<text x="525.44" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">seccomp — 쓸 수 있는 시스템 콜을 줄인다</text>
<circle cx="753.28" cy="184" r="4" fill="#3FB98C"/>
<line x1="753.28" y1="192" x2="753.28" y2="202" stroke="#3FB98C" stroke-width="0.8"/>
<text x="753.28" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">커널 v2.6.36</text>
<text x="753.28" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">AppArmor — 강제적 접근 통제</text>
<rect x="16" y="292" width="832" height="60" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="34" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">가장 널리 알려진 강제적 접근 통제 구현은 SELinux 입니다</text>
<text x="34" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">정부 기관의 높은 보안 요구를 맞추려고 개발됐고 규칙이 엄격해 사용성이 떨어집니다. 원문이 도입 시점을 밝히지 않아 축에 두지 않았습니다.</text>
<line x1="12" y1="400" x2="832" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="422" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="412" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">특권을 쪼개는 장치</text>
<rect x="274" y="412" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="296" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시스템 콜을 줄이는 장치</text>
<rect x="487" y="412" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="509" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">강제적 접근 통제</text>
<rect x="648" y="412" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="670" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시점이 없는 것</text>
</svg>
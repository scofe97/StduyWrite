<title id="dt">세션 192 안의 프로세스 그룹 넷</title><desc id="dd">제어 터미널 /dev/pts/0 을 쓰는 세션 SID 192 안에 프로세스 그룹 넷이 들어 있다. PGID 192 는 세션 리더 bash, PGID 194 는 파이프라인 sleep 100 | sleep 101 로 잡 1번, PGID 196 은 sleep 200 으로 잡 2번, PGID 197 은 지금 포그라운드인 ps 다.</desc>
<rect width="960" height="464" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세션 192 안의 프로세스 그룹 넷</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">셸의 잡 하나가 프로세스 그룹 하나이고, 그 그룹들이 세션 하나에 담깁니다</text>
<rect x="20" y="104" width="920" height="296" rx="14" fill="#0D1117" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="38" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">세션 · SID 192</text>
<text x="922" y="132" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">제어 터미널 /dev/pts/0</text>
<rect x="36" y="152" width="210" height="228" rx="10" fill="#6A95D80C" stroke="#6A95D8" stroke-width="1.0"/>
<text x="50" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">프로세스 그룹 · PGID 192</text>
<text x="50" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">세션 리더</text>
<rect x="50" y="212" width="182" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="62" y="238" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">bash -i</text>
<text x="62" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">PID 192 · STAT Ss</text>
<rect x="262" y="152" width="210" height="228" rx="10" fill="#3FB98C0C" stroke="#3FB98C" stroke-width="1.0"/>
<text x="276" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">프로세스 그룹 · PGID 194</text>
<text x="276" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">잡 [1] · 파이프라인</text>
<rect x="276" y="212" width="182" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="288" y="238" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">sleep 100</text>
<text x="288" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">PID 194 · STAT S</text>
<rect x="276" y="292" width="182" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="288" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">sleep 101</text>
<text x="288" y="340" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">PID 195 · STAT S</text>
<text x="367.0" y="288" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">|</text>
<rect x="488" y="152" width="210" height="228" rx="10" fill="#3FB98C0C" stroke="#3FB98C" stroke-width="1.0"/>
<text x="502" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">프로세스 그룹 · PGID 196</text>
<text x="502" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">잡 [2]</text>
<rect x="502" y="212" width="182" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="514" y="238" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">sleep 200</text>
<text x="514" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">PID 196 · STAT S</text>
<rect x="714" y="152" width="210" height="228" rx="10" fill="#F08A590C" stroke="#F08A59" stroke-width="1.5"/>
<text x="728" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">프로세스 그룹 · PGID 197</text>
<text x="728" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">포그라운드 그룹</text>
<rect x="728" y="212" width="182" height="64" rx="6" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="740" y="238" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">ps -o pid,pgid,sid …</text>
<text x="740" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">PID 197 · STAT R+</text>
<line x1="12" y1="416" x2="912" y2="416" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="438" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="428" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">터미널 입력과 Ctrl+C 를 받는 그룹</text>
<rect x="430" y="428" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="452" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">백그라운드 잡</text>
<rect x="565" y="428" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="587" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">세션 리더</text>
</svg>
<text x="24" y="548" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">PID 가 13883 에서 13904 로 바뀐 것이 재시작의 증거입니다. 같은 유닛 이름이지만 프로세스는 다른 것입니다.</text>
<text x="24" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">-u 로 유닛 하나만 걸러 두었기 때문에 이 화면에는 다른 서비스의 줄이 섞이지 않습니다.</text>

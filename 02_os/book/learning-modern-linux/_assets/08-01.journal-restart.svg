<title id="dt">재시작 한 번이 저널에 남기는 순서</title><desc id="dd">systemctl restart apparmor 를 친 뒤 journalctl -f -u apparmor.service 화면에 줄이 쌓이는 순서. 옛 프로세스 apparmor[13883] 가 두 줄을 남기고 끝나고, systemd[1] 가 Stopped 와 Starting 을 남긴 뒤 새 프로세스 apparmor[13904] 를 올린다. 새 프로세스의 ...done. 은 Starting 에서 7초 뒤인 17:10:09 에 온다.</desc>

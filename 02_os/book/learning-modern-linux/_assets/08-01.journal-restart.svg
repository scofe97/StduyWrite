<title id="dt">재시작 한 번이 저널에 남기는 순서</title><desc id="dd">원서가 두 터미널로 나눠 보인 장면을 한 그림으로 세운 것. 왼쪽에서 명령을 치면 오른쪽 터미널의 journalctl -f 에 두 주체의 줄이 섞여 흐른다.</desc>
<rect width="880" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">재시작 한 번이 저널에 남기는 순서</text>

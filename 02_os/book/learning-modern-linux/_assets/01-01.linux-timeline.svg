<text x="625.12" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">컨테이너의 부상</text>
<circle cx="767.52" cy="184" r="4" fill="#3FB98C"/>
<line x1="767.52" y1="192" x2="767.52" y2="202" stroke="#3FB98C" stroke-width="0.8"/>
<text x="767.52" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">2021</text>
<text x="767.52" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서른 살</text>
<rect x="16" y="292" width="832" height="60" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="34" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">전쟁이 끝난 자리에 남은 것은 두 계열이다</text>
<text x="34" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">저자는 요즘 상용 시스템 대부분이 Red Hat 계열 아니면 Debian 계열이라고 적습니다.</text>
<line x1="12" y1="376" x2="832" y2="376" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="398" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

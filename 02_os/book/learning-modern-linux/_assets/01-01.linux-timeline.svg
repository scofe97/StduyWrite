<title id="dt">취미 프로젝트에서 데이터센터의 일꾼까지</title><desc id="dd">원서가 1장에서 세 구간으로 자른 리눅스 약사. 배포판 전쟁이 정점을 찍은 구간과, 저자가 그 전쟁을 끝냈다고 지목한 컨테이너의 등장 시점을 함께 표시한다.</desc>
<rect width="880" height="428" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 01-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">취미 프로젝트에서 데이터센터의 일꾼까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">색이 붙은 점이 저자가 전쟁을 끝냈다고 지목한 힘입니다</text>
<rect x="397.28000000000003" y="170" width="227.83999999999997" height="28" rx="4" fill="#6A95D810" stroke="#6A95D8" stroke-width="0.0"/>
<text x="511.20000000000005" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">배포판 전쟁 — 정점에서 소멸까지</text>
<line x1="84" y1="184" x2="796" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<circle cx="84.0" cy="184" r="4" fill="#8B98A9"/>
<line x1="84.0" y1="176" x2="84.0" y2="166" stroke="#8B98A9" stroke-width="0.8"/>
<text x="84.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">1991-08-25</text>
<text x="84.0" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">comp.os.minix 메일</text>
<circle cx="197.92000000000002" cy="184" r="4" fill="#6A95D8"/>
<line x1="197.92000000000002" y1="192" x2="197.92000000000002" y2="202" stroke="#6A95D8" stroke-width="0.8"/>
<text x="197.92000000000002" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">3년이 채 되기 전</text>
<text x="197.92000000000002" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Linux 1.0.0 · 176,000 LOC 넘김</text>
<circle cx="311.84000000000003" cy="184" r="4" fill="#6A95D8"/>
<line x1="311.84000000000003" y1="176" x2="311.84000000000003" y2="166" stroke="#6A95D8" stroke-width="0.8"/>
<text x="311.84000000000003" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">1990년대</text>
<text x="311.84000000000003" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Red Hat Linux — 첫 상용</text>
<circle cx="468.48" cy="184" r="4" fill="#6A95D8"/>
<line x1="468.48" y1="192" x2="468.48" y2="202" stroke="#6A95D8" stroke-width="0.8"/>

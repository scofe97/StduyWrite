<title id="dt">드라이브에서 아이노드까지 한 줄로 내려간다</title><desc id="dd">드라이브 sda 223.6G 는 파티션 sda1 512M 과 sda2 223.1G 로 나뉜다. sda1 은 vfat 으로 /boot/efi 에 붙고, sda2 위에는 LVM 볼륨 elementary--vg-root 222.1G 와 swap_1 976M 이 놓인다. ext4 로 포맷된 볼륨 안은 앞머리의 슈퍼블록, 아이노드, 데이터 블록으로 이루어진다. stat myfile 의 아이노드 555036 은 크기 · 링크 수 · 권한 · 소유자를 갖지만 이름은 디렉터리 항목이, 내용은 데이터 블록이 갖는다.</desc>

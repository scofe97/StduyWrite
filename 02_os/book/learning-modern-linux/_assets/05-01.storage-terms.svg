<title id="dt">드라이브 안에 파티션, 그 안에 볼륨, 그 앞머리에 메타데이터</title><desc id="dd">저자가 정의한 다섯 용어를 포함 관계로 세운 것. 왼쪽은 저자의 lsblk 출력 그대로이고, 오른쪽은 포맷된 볼륨 하나를 열어 본 것이다.</desc>
<rect width="880" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">드라이브 안에 파티션, 그 안에 볼륨, 그 앞머리에 메타데이터</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">아이노드는 파일 이름과 데이터를 담지 않습니다</text>
<rect x="28" y="148" width="420" height="268" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="44" y="140" width="171" height="16" fill="#0D1117"/>
<text x="52" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">드라이브 — 물리 블록 장치</text>
<rect x="336" y="140" width="100" height="16" fill="#0D1117"/>
<text x="428" y="152" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">sda · 223.6G</text>
<rect x="52" y="180" width="372" height="64" rx="6" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>
<text x="66" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">파티션 sda1</text>
<text x="66" y="228" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">512M · /boot/efi · vfat</text>
<rect x="52" y="260" width="372" height="148" rx="6" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>
<text x="66" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">파티션 sda2</text>
<text x="66" y="306" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">223.1G · 저장 섹터의 집합</text>
<rect x="66" y="318" width="344" height="34" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="80" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">볼륨 elementary--vg-root</text>
<text x="396" y="340" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">222.1G · ext4 · /</text>
<rect x="66" y="360" width="344" height="34" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="80" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">볼륨 elementary--vg-swap_1</text>
<text x="396" y="382" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">976M · [SWAP]</text>
<rect x="480" y="148" width="372" height="268" rx="8" fill="#F08A5906" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="496" y="140" width="157" height="16" fill="#0D1117"/>
<text x="504" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">포맷된 볼륨 하나를 열면</text>
<rect x="500" y="176" width="332" height="96" rx="6" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>
<text x="516" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">슈퍼블록</text>
<text x="516" y="224" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">포맷하면 앞부분에 생기는 특별한 구획</text>
<text x="516" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">파일시스템 종류 · 블록 · 상태</text>
<text x="516" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">블록당 아이노드 수</text>
<rect x="500" y="288" width="332" height="128" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="516" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">아이노드</text>
<text x="516" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">담는다 — 크기 · 소유자 · 위치 · 날짜 · 권한</text>
<text x="516" y="358" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">담지 않는다 — 파일 이름 · 실제 데이터</text>
<text x="516" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">이름은 디렉토리가 갖는다. 그리고 디렉토리란</text>
<text x="516" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">아이노드를 이름에 매핑하는 특별한 일반 파일이다.</text>
<rect x="28" y="452" width="824" height="70" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="48" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">stat 한 번이면 이 계층이 한 화면에 찍힙니다</text>
<text x="48" y="502" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Device 는 어느 볼륨인지를, Inode 는 그 안에서 어느 메타데이터 항목인지를 가리킵니다.</text>
<line x1="12" y1="556" x2="832" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="568" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">드라이브와 파티션</text>
<rect x="261" y="568" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="283" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">볼륨</text>
<rect x="331" y="568" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="353" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 장의 핵심 한 줄</text>

<title id="dt">한 호스트, 포트 셋, 두 컨테이너</title><desc id="dd">한 리눅스 호스트에서 node exporter 는 호스트 프로세스로 :9100 을 열고, Prometheus 와 Grafana 컨테이너는 -p 9090:9090 · -p 3000:3000 으로 호스트 포트에 게시된다. 같은 호스트의 브라우저는 localhost:9090/targets 와 localhost:3000 을 연다. 컨테이너 안의 localhost 는 컨테이너 자신이라 Prometheus 는 172.17.0.1:9100 을 15초마다 긁고, Grafana 는 데이터소스 http://172.17.0.1:9090 으로 Prometheus 에 묻는다.</desc>
<rect width="920" height="652" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-02 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 호스트, 포트 셋, 두 컨테이너</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 172.17.0.1 뒤에서 포트만 다르다 — Grafana 가 묻는 곳은 :9090 이고 :9100 은 node exporter 다</text>
<rect x="24" y="104" width="872" height="408" rx="10" fill="#6A95D808" stroke="#6A95D8" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="40" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">리눅스 호스트 · 한 기계</text>
<rect x="456" y="208" width="416" height="288" rx="8" fill="#3FB98C0A" stroke="#3FB98C" stroke-width="1.1" stroke-dasharray="4 4"/>
<text x="552" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">Docker 컨테이너</text>

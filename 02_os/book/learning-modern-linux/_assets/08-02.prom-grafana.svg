<text x="24" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Prometheus 는 컨테이너 안에서 도니 localhost 로는 호스트에 못 닿습니다. 그래서 Docker 의 기본 브리지 주소를 씁니다.</text>
<text x="24" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">같은 이유로 Prometheus 는 자기 자신을 localhost:9090 으로 긁습니다. 그 localhost 는 컨테이너 안입니다.</text>

<rect x="60" y="424" width="184" height="32" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<text x="70" y="445" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">localhost:3000</text>
<text x="62" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Grafana UI</text>
<text x="356.0" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">호스트 포트</text>
<rect x="304" y="156" width="104" height="40" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.3"/>
<text x="356.0" y="175.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">:9100</text>
<text x="356.0" y="191.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">exporter</text>
<rect x="304" y="264" width="104" height="64" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.3"/>
<text x="356.0" y="295.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">:9090</text>
<text x="356.0" y="311.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">-p 게시</text>
<rect x="304" y="420" width="104" height="40" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.3"/>
<text x="356.0" y="439.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">:3000</text>
<text x="356.0" y="455.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">-p 게시</text>
<rect x="480" y="248" width="376" height="120" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="496" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Prometheus</text>
<text x="842" y="270" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">prom/prometheus:main</text>
<text x="496" y="294" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">-p 9090:9090</text>
<text x="496" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">-v → /etc/prometheus/prometheus.yml</text>
<text x="496" y="340" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">machine → 172.17.0.1:9100</text>
<text x="496" y="360" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">prometheus → localhost:9090</text>
<text x="842" y="360" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">자기 자신</text>
<rect x="480" y="392" width="376" height="88" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="496" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Grafana</text>
<text x="842" y="414" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">grafana/grafana:8.0.3</text>
<text x="496" y="438" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">-p 3000:3000</text>
<text x="496" y="464" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">datasource http://172.17.0.1:9090</text>
<text x="24" y="544" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">컨테이너 안 localhost = 컨테이너 자신 · 호스트 = 172.17.0.1</text>
<text x="24" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">✕ datasource :9100 → node exporter 를 가리킴</text>
<text x="24" y="594" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">포트 · 이미지 · 주소 · 간격은 본문 §8 의 설정과 명령 그대로 · 컨테이너 자체의 IP 는 본문에 없어 생략</text>

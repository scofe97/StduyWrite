<path d="M 410 284 L 476 284" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 258 440 L 300 440" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 410 440 L 476 440" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 520 246 L 520 176 L 412 176" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 302 176 L 260 176" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="466" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">15s /metrics</text>
<path d="M 478 404 L 356 404 L 356 332" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<path d="M 410 312 L 476 312" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)" stroke-dasharray="4 3"/>
<rect x="48" y="144" width="208" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="62" y="168" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">./node_exporter &amp;</text>
<text x="62" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">호스트 프로세스</text>
<rect x="48" y="236" width="208" height="236" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="62" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">웹 브라우저</text>
<rect x="60" y="268" width="184" height="32" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<text x="70" y="289" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">localhost:9090/targets</text>

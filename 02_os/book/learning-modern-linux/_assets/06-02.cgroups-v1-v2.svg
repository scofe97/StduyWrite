<title id="dt">v1 은 컨트롤러마다 트리, v2 는 트리 하나에 컨트롤러 전부</title><desc id="dd">v1 은 CPU 계정·메모리·블록 IO 처럼 컨트롤러가 그때그때 붙으며 계층이 따로 생겼고, 시스템의 모든 태스크가 계층마다 한 칸씩 들었다. v2 는 계층이 하나다. 루트 / 에 컨트롤러 여덟이 붙고, 그 아래 user.slice·system.slice·docker 같은 그룹이 systemd 단위 이름 그대로 매달린다.</desc>

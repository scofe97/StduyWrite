<text x="476" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">Arch · Fedora 31+ · Ubuntu 21.10 은 이미 기본이 v2</text>
<rect x="24" y="448" width="832" height="62" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>

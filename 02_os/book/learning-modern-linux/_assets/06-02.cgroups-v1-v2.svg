<title id="dt">v1 은 계층이 여럿, v2 는 계층 하나에 컨트롤러 전부</title><desc id="dd">v1 은 CPU 계정·메모리·블록 IO 처럼 컨트롤러가 그때그때 붙으며 계층이 따로 생겼다. v2 는 계층이 하나이고 루트 / 에 컨트롤러 여덟이 모두 붙는다.</desc>

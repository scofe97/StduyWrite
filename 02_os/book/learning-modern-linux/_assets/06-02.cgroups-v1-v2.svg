<text x="44" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">5장에서 본 VFS 자료구조 이름이 그대로 자원 제한의 대상으로 나오는 자리입니다.</text>

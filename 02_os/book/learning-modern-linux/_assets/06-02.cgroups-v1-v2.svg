<text x="44" y="188" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#E3B341">cgroups v1</text>
<text x="44" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">필요할 때마다 새로 붙였다</text>
<rect x="48" y="240" width="352" height="38" rx="5" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>
<text x="64" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">계층 1 — cpu · cpuacct</text>
<text x="384" y="264" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">모든 태스크가 여기 한 칸씩</text>
<rect x="48" y="288" width="352" height="38" rx="5" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>
<text x="64" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">계층 2 — memory</text>
<text x="384" y="312" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">모든 태스크가 여기 한 칸씩</text>

<title id="dt">필요할 때마다 붙이던 것을 한 계층으로 다시 썼다</title><desc id="dd">v1 은 프로세스마다 계층이 따로였고 컨트롤러가 그때그때 붙었다. v2 는 계층이 하나이고 모든 컨트롤러가 같은 방식으로 관리된다.</desc>
<rect width="880" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">필요할 때마다 붙이던 것을 한 계층으로 다시 썼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자는 v2 에 집중하라고 적습니다</text>

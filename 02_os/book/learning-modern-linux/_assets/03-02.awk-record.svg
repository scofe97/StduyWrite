<text x="32" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">칸 그대로</text>
<path d="M 400 280 L 414 280" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>

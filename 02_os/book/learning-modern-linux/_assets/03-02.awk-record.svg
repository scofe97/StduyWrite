<title id="dt">awk 가 df 한 줄을 칸으로 나눠 견주는 두 방식</title><desc id="dd">df.txt 3행을 공백 묶음마다 끊어 $1~$6 으로 나눈 뒤, 다섯째 칸을 90 과 견주는 두 식을 나란히 놓은 것. % 가 붙은 칸은 문자열이라 그대로 견주면 앞 글자끼리 비교한다.</desc>
<rect width="880" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">awk 가 df 한 줄을 칸으로 나눠 견주는 두 방식</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 칸도 +0 을 붙이면 숫자로 견줍니다</text>
<text x="32" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">df.txt 3행 · NR=3 · NF=6</text>

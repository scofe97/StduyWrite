<text x="668" y="285" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">거짓</text>
<text x="836" y="285" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">출력 없음</text>
<text x="32" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">숫자 비교</text>
<text x="32" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">+0 으로 변환</text>
<path d="M 400 368 L 414 368" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 632 368 L 646 368" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>

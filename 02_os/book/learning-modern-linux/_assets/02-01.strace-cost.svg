<title id="dt">curl 한 번이 시간을 어디에 쓰는가</title><desc id="dd">원서가 strace -c 로 센 curl 한 번의 시스템 콜 시간 분포. 막대 길이는 전체 시간 대비 비율이고, 맨 아래 막대는 원문 출력에서 줄임표로 생략된 나머지 행을 합쳐 놓은 것이다.</desc>

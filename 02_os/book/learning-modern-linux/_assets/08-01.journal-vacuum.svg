<title id="dt">저널 사용량은 rotate 뒤 vacuum 으로 줄어든다</title><desc id="dd">컨테이너에서 저널을 채운 뒤 --disk-usage, --rotate, --vacuum-size=16M 을 차례로 돌린 값. vacuum 은 보관 파일만 지운다.</desc>
<rect width="880" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §4</text>

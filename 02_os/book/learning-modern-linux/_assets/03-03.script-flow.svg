<title id="dt">예제 스크립트가 밟는 길과 밟지 않는 길</title><desc id="dd">저자의 gh-user-info.sh 를 흐름으로 편 것. 왼쪽이 실제 구현된 경로이고, 오른쪽 회색 칸이 저자가 스스로 남겨 둔 네 가지 숙제다.</desc>
<rect width="880" height="712" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-03 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">예제 스크립트가 밟는 길과 밟지 않는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">검사가 하나뿐이라는 것이 이 예제의 교육적 요점입니다</text>

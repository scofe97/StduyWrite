<title id="dt">지시어 일곱이 층 일곱이 된다</title><desc id="dd">Dockerfile 의 각 줄이 이미지의 층 하나를 만든다. 빌드 시점의 지시어와 런타임의 지시어가 성격이 갈리고, 층으로 남는 것은 앞쪽이다.</desc>
<rect width="880" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-02 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">지시어 일곱이 층 일곱이 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">USER 를 쓰지 않으면 불필요하게 root 로 돕니다</text>
<rect x="32" y="168" width="560" height="48" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="48" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#6A95D8">FROM ubuntu:20.04</text>
<text x="48" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">베이스 이미지 — 명시적 태그로</text>
<text x="24" y="197.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">1</text>
<rect x="32" y="224" width="560" height="48" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>
<text x="48" y="246" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#8B98A9">LABEL org.opencontainers...</text>
<text x="48" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">메타데이터 — 계보를 남긴다</text>
<text x="24" y="253.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">2</text>
<rect x="32" y="280" width="560" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="48" y="302" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#3FB98C">COPY greeter.sh /app/</text>
<text x="48" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">빌드 시점 — 바이너리나 JAR 일 수도</text>
<text x="24" y="309.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">3</text>
<rect x="32" y="336" width="560" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="48" y="358" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#3FB98C">WORKDIR /app</text>
<text x="48" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">빌드 시점 — 작업 디렉토리</text>
<text x="24" y="365.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">4</text>
<rect x="32" y="392" width="560" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="48" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#3FB98C">RUN chown -R 1001:1 /app</text>
<text x="48" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">빌드 시점 — 소유를 옮긴다</text>
<text x="24" y="421.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">5</text>
<rect x="32" y="448" width="560" height="48" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.5"/>
<text x="48" y="470" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F08A59">USER 1001</text>
<text x="48" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">이 줄이 없으면 root 로 돈다</text>
<text x="24" y="477.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">6</text>
<rect x="32" y="504" width="560" height="48" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="48" y="526" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#E3B341">ENTRYPOINT ["/app/greeter.sh"]</text>
<text x="48" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">런타임 — 인자를 덧붙일 수 있다</text>
<text x="24" y="533.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">7</text>
<rect x="624" y="168" width="224" height="148" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="736" y="198" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">docker images</text>
<line x1="640" y1="212" x2="832" y2="212" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="644" y="240" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">greeter:1</text>
<text x="828" y="240" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">72.8MB</text>
<text x="644" y="266" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">ubuntu:20.04</text>
<text x="828" y="266" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">72.8MB</text>
<text x="736" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#3FB98C">더해서 145.6MB 가 아닙니다</text>
<rect x="624" y="336" width="224" height="120" rx="8" fill="#F08A5906" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="7 6"/>
<text x="644" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F08A59">5장의 CoW 가</text>
<text x="644" y="386" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F08A59">여기에서 관측됩니다</text>
<text x="644" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">greeter 가 베이스의 층을</text>
<text x="644" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">공유하고 자기 층만 얹었기</text>
<text x="644" y="448" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">때문입니다.</text>
<rect x="32" y="572" width="816" height="56" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="52" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">원문 정오 — 목록은 ENTRYPOINT 인데 빌드 출력은 CMD 입니다</text>
<text x="52" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">ENTRYPOINT 는 인자를 덧붙이고 CMD 는 명령 자체를 대체합니다. 저자의 설명은 ENTRYPOINT 를 전제합니다.</text>
<line x1="12" y1="648" x2="832" y2="648" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="670" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="660" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="670" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">베이스</text>
<rect x="183" y="660" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="205" y="670" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">빌드 시점 — 층이 된다</text>
<rect x="396" y="660" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="418" y="670" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">런타임</text>
<rect x="479" y="660" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="501" y="670" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">4장의 최소 권한이 착지한 줄</text>
</svg>
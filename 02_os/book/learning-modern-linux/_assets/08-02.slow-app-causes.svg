<title id="dt">느리다는 증상 하나가 세 범주로 갈린다</title><desc id="dd">저자가 든 느린 앱의 원인 후보를 자원 범주로 묶고, 범주마다 이 장에서 여는 창을 가지 끝에 붙인 것. 범주가 정해져야 §2 부터의 명령이 순서를 갖는다.</desc>
<rect width="880" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">느리다는 증상 하나가 세 범주로 갈린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자가 먼저 시험하는 가설은 메모리입니다</text>
<line x1="40" y1="316" x2="694" y2="316" stroke="#F5F5F3" stroke-width="1.4"/>
<path d="M 686 316 L 696 316" fill="none" stroke="#F5F5F3" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="700" y="274.0" width="156" height="84" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="778.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">앱이 느리다</text>
<text x="778.0" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">관측된 증상</text>
<text x="778.0" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">원인이 아니다</text>
<line x1="476" y1="316" x2="408" y2="197" stroke="#F08A59" stroke-width="1.6"/>
<rect x="332.0" y="181.0" width="152" height="32" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="408" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F08A59">메모리</text>
<line x1="453.6" y1="276.8" x2="431.6" y2="276.8" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="425.6" y="272.8" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스왑으로 밀린다 (vmstat)</text>
<line x1="431.2" y1="237.6" x2="409.2" y2="237.6" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="403.2" y="233.6" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">남은 메모리가 적다 (free)</text>
<line x1="364" y1="316" x2="296" y2="435" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="220.0" y="419.0" width="152" height="32" rx="4" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="296" y="440" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#6A95D8">CPU</text>
<line x1="341.6" y1="355.2" x2="319.6" y2="355.2" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="313.6" y="367.2" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실행 대기가 길다 (vmstat r)</text>
<line x1="319.2" y1="394.4" x2="297.2" y2="394.4" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="291.2" y="406.4" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부하 평균이 오른다 (uptime)</text>
<line x1="252" y1="316" x2="184" y2="197" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="108.0" y="181.0" width="152" height="32" rx="4" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="184" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#6A95D8">네트워크 I/O</text>
<line x1="229.6" y1="276.8" x2="207.6" y2="276.8" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="201.6" y="272.8" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">누가 쥐고 있나 (lsof)</text>
<line x1="207.2" y1="237.6" x2="185.2" y2="237.6" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="179.2" y="233.6" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소켓 큐가 쌓인다 (ss)</text>
<text x="24" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">모니터링에서 가장 자주 하는 일은 둘이라고 저자가 적습니다. 하나 이상의 메트릭을 시간에 걸쳐 추적하는 것과, 조건에 알림을 거는 것입니다.</text>
<text x="24" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">범주를 먼저 세워야 그 둘이 무엇을 대상으로 하는지가 정해집니다.</text>
<line x1="12" y1="534" x2="832" y2="534" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="556" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="546" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">증상과 먼저 시험할 가설</text>
<rect x="313" y="546" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="335" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원문이 이름 붙인 원인</text>
<rect x="513" y="546" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="535" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">하위 원인</text>
<rect x="622" y="546" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="644" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">관측 경로</text>
</svg>
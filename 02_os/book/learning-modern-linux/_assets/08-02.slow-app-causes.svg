<text x="40" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">둘째 줄 = 이 노트 컨테이너의 실측값(정상 상태 값 포함) · 디스크 I/O 는 '등등' 자리 → §4 iostat</text>

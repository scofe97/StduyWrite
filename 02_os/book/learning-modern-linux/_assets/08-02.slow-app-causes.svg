<title id="dt">느리다는 증상 하나가 세 범주로 갈린다</title><desc id="dd">느린 앱의 원인 후보를 메모리·CPU·네트워크 I/O 세 범주로 묶고, 하위 원인마다 그것을 보는 명령과 이 노트의 컨테이너에서 그 명령이 보여 준 값을 붙인 것. 메모리는 vmstat si·so 0·0 과 free available 5977 → 5574 MiB, CPU 는 vmstat r 2 와 uptime 1.37 (CPU 8), 네트워크는 ss Recv-Q 5000 과 포트 8000 을 쥔 nc pid 3798. 디스크 I/O 는 저자의 '등등' 자리에 들어가며 §4 iostat 가 연다.</desc>
<rect width="880" height="584" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">느리다는 증상 하나가 세 범주로 갈린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">먼저 시험하는 가설은 메모리입니다</text>

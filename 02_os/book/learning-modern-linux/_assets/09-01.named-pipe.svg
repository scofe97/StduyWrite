<title id="dt">이름이 붙은 파이프는 프로세스보다 오래 산다</title><desc id="dd">명명 파이프 examplepipe 를 세 층으로 나눈 것. 두 프로세스는 파일시스템의 이름 examplepipe 로 파이프를 열고, 문자 x 는 커널 안 pipefs 의 버퍼를 지나 PID 19628 에서 PID 19636 으로 간다. 파일시스템 항목은 크기가 0 이고 두 프로세스가 끝나도 남는다. 아래 띠는 읽는 쪽이 없는 p1 에 쓰려 하면 열기에서 막혀 timeout 이 124 로 끝나는 장면이다.</desc>
<rect width="880" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 09-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름이 붙은 파이프는 프로세스보다 오래 산다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이름은 파일시스템에 남고 데이터는 커널 안에서만 건너갑니다</text>
<rect x="24" y="100" width="832" height="96" rx="8" fill="#161B22" fill-opacity="0.45" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="38" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">유저 공간</text>
<text x="38" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">두 프로세스</text>
<rect x="24" y="212" width="832" height="88" rx="8" fill="#161B22" fill-opacity="0.45" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="38" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">커널</text>
<text x="38" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">pipefs 버퍼</text>
<rect x="24" y="316" width="832" height="88" rx="8" fill="#161B22" fill-opacity="0.45" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="38" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">파일시스템</text>
<text x="38" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">끝나도 남음</text>
<path d="M 176 184 L 176 360 L 392 360" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)" stroke-dasharray="4 3"/>
<path d="M 796 184 L 796 360 L 600 360" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)" stroke-dasharray="4 3"/>
<path d="M 496.0 332 L 496.0 284" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)" stroke-dasharray="4 3"/>
<path d="M 296 184 L 296 256 L 392 256" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)"/>
<path d="M 596 256 L 676 256 L 676 188" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)"/>
<rect x="136" y="112" width="200" height="72" rx="8" fill="#0D1117" stroke="#6A95D8" stroke-width="1.2"/>
<text x="150" y="134" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">PID 19628  [1]</text>
<text x="150" y="154" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">echo "x" &gt; examplepipe</text>
<text x="150" y="173" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">while 루프 · 5초마다</text>
<rect x="636" y="112" width="200" height="72" rx="8" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="650" y="134" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">PID 19636  [2]</text>
<text x="650" y="154" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">cat &lt; examplepipe</text>
<text x="650" y="173" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">터미널에 x · 약 5초마다</text>
<rect x="396" y="228" width="200" height="56" rx="8" fill="#0D1117" stroke="#8B98A9" stroke-width="1.1"/>
<text x="410" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">파이프 버퍼</text>
<text x="582" y="248" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">FIFO</text>
<rect x="460" y="256" width="32" height="20" rx="3" fill="#6A95D822" stroke="#6A95D8" stroke-width="0.9"/>
<text x="476" y="271" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">x</text>
<rect x="504" y="256" width="32" height="20" rx="3" fill="#6A95D822" stroke="#6A95D8" stroke-width="0.9"/>
<text x="520" y="271" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">x</text>
<text x="410" y="271" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">먼저 →</text>
<text x="308" y="246" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">write x</text>
<text x="664" y="246" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">read x</text>
<rect x="396" y="332" width="200" height="56" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="410" y="354" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">examplepipe</text>
<text x="410" y="376" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">prw-rw-r-- 1 mh9 mh9 0</text>
<text x="236" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">경로로 열기</text>
<text x="716" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">경로로 열기</text>
<text x="506.0" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">가리킴</text>
<rect x="24" y="428" width="832" height="96" rx="8" fill="#E3B3410D" stroke="#E3B341" stroke-width="1.2"/>
<text x="38" y="454" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">p1</text>
<text x="38" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">읽는 쪽 없음</text>
<path d="M 336 464 L 392 464" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<path d="M 596 464 L 632 464" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="136" y="444" width="200" height="40" rx="6" fill="#0D1117" stroke="#E3B341" stroke-width="1.0"/>
<text x="236.0" y="469" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">echo x &gt; p1</text>
<rect x="396" y="444" width="200" height="40" rx="6" fill="#0D1117" stroke="#E3B341" stroke-width="1.0"/>
<text x="496.0" y="469" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">열기에서 멈춤</text>
<rect x="636" y="444" width="200" height="40" rx="6" fill="#0D1117" stroke="#E3B341" stroke-width="1.0"/>
<text x="736.0" y="469" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">timeout 2 → 124</text>
<text x="396" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">cat 으로 읽는 쪽을 붙이면 → 바로 0</text>
<text x="24" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">실선 = 데이터 x · 점선 = 경로로 열기 · 버퍼의 x 두 칸은 순서를 보이는 그림</text>
<line x1="12" y1="580" x2="832" y2="580" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="602" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="592" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">쓰는 쪽</text>
<rect x="196" y="592" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="218" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">읽는 쪽</text>
<rect x="292" y="592" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="314" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">남는 이름</text>
<rect x="401" y="592" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="423" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">막히는 조건</text>
</svg>
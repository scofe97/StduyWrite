<title id="dt">이미지 한 벌, 컨테이너 둘</title><desc id="dd">컨테이너 A 와 B 가 같은 image 폴더를 lowerdir 로 겹쳐 마운트한 실제 구조다. 맨 아래 image (etc/motd, usr/big.bin 200M) 는 두 열을 가로지르는 상자 하나이고 du 로 201M 이다. 그 위에 컨테이너마다 upperdir 가 따로 있다. a-upper 에는 A 에서 새로 만든 etc/hello 만 있고, b-upper 는 비어 있으며 둘 다 du 0 이다. 맨 위 a-view 와 b-view 는 각 컨테이너가 보는 / 다. 두 view 의 big.bin 200M 과 motd 는 image 에서 비쳐 보이는 것이지 복사본이 아니고, A 의 hello 만 a-upper 에서 온다.</desc>
<rect width="880" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이미지 한 벌, 컨테이너 둘</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">디스크에는 image 한 벌만 있고, 컨테이너마다 위층(upperdir)만 따로 얹는다</text>

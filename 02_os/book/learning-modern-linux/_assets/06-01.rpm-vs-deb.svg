<title id="dt">이름만 다르고 하는 일은 같다</title><desc id="dd">두 계보를 나란히 놓으면 검색과 설치와 확인이라는 세 동작이 하나씩 짝을 이룬다. 자동 승인 플래그까지 -y 로 같다.</desc>

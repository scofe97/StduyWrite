<title id="dt">SigCgt 0x10203 을 비트 칸으로 풀면 잡는 시그널 넷이 나온다</title><desc id="dd">trap "" TERM; trap : USR1 HUP 전후 bash 의 /proc/PID/status SigCgt. 끝 다섯 자리를 16진 한 자리당 비트 칸 넷으로 풀면 비트 16·9·1·0 이 켜져 있고, 비트 n-1 이 시그널 n 이므로 17 SIGCHLD·10 SIGUSR1·2 SIGINT·1 SIGHUP 을 잡는다. 0x10002 에서 바뀐 비트 9 와 0 이 trap 이 더한 것이다.</desc>
<rect width="880" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 09-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SigCgt 0x10203 을 비트 칸으로 풀면 잡는 시그널 넷이 나온다</text>

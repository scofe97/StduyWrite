<title id="dt">일반적인 연산과 실제 구현을 갈라 놓는 층</title><desc id="dd">같은 open 과 read 가 SSD 로도 가고 /proc 으로도 가는 이유는 그 사이에 층이 하나 있기 때문이다. VFS 는 파일이라는 패러다임 위에서 자원에 접근하는 공통의 방법을 준다.</desc>
<rect width="880" height="636" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">일반적인 연산과 실제 구현을 갈라 놓는 층</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">리눅스에서 파일은 구조 없는 바이트 스트림입니다</text>
<rect x="40" y="148" width="800" height="66" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="60" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">클라이언트 — 시스템 콜</text>
<text x="60" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">파일 관련 시스템 콜만 백 개가 넘습니다. open · read · seek 같은 일반적인 연산입니다.</text>
<path d="M 440.0 214 L 440.0 244" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="40" y="248" width="800" height="96" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.5"/>
<text x="60" y="278" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F08A59">VFS — 커널 안의 추상 층</text>
<text x="60" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#F08A59">일반적인 연산을 실제 구현 세부와 갈라 놓습니다.</text>
<text x="60" y="324" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">자료구조는 include/linux/fs.h — inode · file · dentry · super_block</text>
<path d="M 137.0 344 L 137.0 394" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="40" y="396" width="194" height="92" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="137.0" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">로컬</text>
<text x="137.0" y="448" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">ext3 · XFS · FAT · NTFS</text>
<text x="137.0" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">드라이버로 블록 장치에</text>
<path d="M 339.0 344 L 339.0 394" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="242" y="396" width="194" height="92" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="339.0" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">인메모리</text>
<text x="339.0" y="448" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">tmpfs</text>
<text x="339.0" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">주기억장치에 산다</text>
<path d="M 541.0 344 L 541.0 394" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="444" y="396" width="194" height="92" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="541.0" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">가짜</text>
<text x="541.0" y="448" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">procfs · sysfs</text>
<text x="541.0" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">커널 인터페이스를 감싼다</text>
<path d="M 743.0 344 L 743.0 394" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="646" y="396" width="194" height="92" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>
<text x="743.0" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">네트워크</text>
<text x="743.0" y="448" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">NFS · Samba</text>
<text x="743.0" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">드라이버가 네트워크를 탄다</text>
<rect x="40" y="512" width="800" height="44" rx="6" fill="#8B98A914" stroke="#8B98A9" stroke-width="1.2"/>
<text x="60" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">네트워크 갈래는 드라이버가 네트워크 연산을 포함한다는 이유로 저자가 7장으로 미룹니다.</text>
<line x1="12" y1="576" x2="832" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="588" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">간접이 일어나는 층</text>
<rect x="274" y="588" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="296" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">블록 장치를 쓰는 갈래</text>
<rect x="474" y="588" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="496" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">메모리에 사는 갈래</text>
<rect x="648" y="588" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="670" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">커널을 감싸는 갈래</text>
</svg>
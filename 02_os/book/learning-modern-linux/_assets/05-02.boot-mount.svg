<title id="dt">fstab 한 줄이 마운트 유닛이 되고, nofail 이 의존을 바꾼다</title><desc id="dd">부팅 초기에 systemd-fstab-generator 가 /etc/fstab 의 줄마다 /run/systemd/generator/ 아래에 .mount 유닛을 만든다. nofail 이 없으면 local-fs.target 이 그 유닛을 Requires= 와 Before= 로 묶어, 마운트가 실패하면 타깃도 실패하고 OnFailure=emergency.target 으로 빠진다. nofail 이 있으면 Wants= 로만 이어지고 순서도 없어 부팅이 계속된다.</desc>
<rect width="920" height="896" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">fstab 한 줄이 마운트 유닛이 되고, nofail 이 의존을 바꾼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 실패라도 의존이 Requires= 냐 Wants= 냐에 따라 부팅이 멈추거나 계속된다</text>
<rect x="24" y="104" width="872" height="112" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="40" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">/etc/fstab</text>
<text x="136" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">필드 여섯 개 · 공백으로 구분</text>
<rect x="48" y="144" width="172" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="134.0" y="167" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">UUID=be9ae4e4-…</text>
<text x="134.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">식별자</text>
<rect x="232" y="144" width="104" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="284.0" y="167" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">/mnt/lv</text>
<text x="284.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">마운트 지점</text>
<rect x="348" y="144" width="64" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="380.0" y="167" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">ext4</text>
<text x="380.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">종류</text>
<rect x="424" y="144" width="172" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="512" y="149" width="76" height="26" rx="3" fill="#F08A5924" stroke="#F08A59" stroke-width="1.4"/>
<text x="510" y="167" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">defaults,</text>
<text x="550.0" y="167" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">nofail</text>
<text x="510.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">옵션</text>
<rect x="608" y="144" width="48" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="632.0" y="167" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">0</text>
<text x="632.0" y="200" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">dump</text>
<rect x="668" y="144" width="48" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="692.0" y="167" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">2</text>
<text x="692.0" y="200" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">fsck</text>
<path d="M 84 218 L 84 277" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="96" y="244" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">systemd-fstab-generator</text>
<text x="96" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">부팅 초기 · 줄마다 하나</text>
<rect x="24" y="280" width="420" height="112" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="40" y="304" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">/run/systemd/generator/mnt-lv.mount</text>
<text x="40" y="332" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">[Mount]</text>
<text x="40" y="352" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">Where=/mnt/lv · Type=ext4</text>
<text x="40" y="372" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">Options=defaults,nofail</text>
<text x="468" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">유닛 파일 · 런타임에 생성</text>
<text x="468" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">재부팅마다 fstab 에서 다시 만듦</text>

<text x="238.0" y="663" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">필수 마운트 실패 → 실패</text>
<rect x="130.0" y="736" width="216" height="48" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="238.0" y="757" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">emergency.target</text>
<text x="238.0" y="775" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">emergency 셸 · 부팅 멈춤</text>
<rect x="468" y="448" width="428" height="360" rx="8" fill="#0D1117" stroke="#3FB98C" stroke-width="1.0"/>
<text x="484" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">nofail 있음</text>
<path d="M 642.0 622 L 642.0 547" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)" stroke-dasharray="4 3"/>
<text x="630.0" y="578" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">Wants=</text>
<text x="630.0" y="596" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">순서 없음</text>
<text x="694.0" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">실패가 안 번짐</text>

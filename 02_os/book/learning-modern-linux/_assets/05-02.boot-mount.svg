<title id="dt">fstab 설정이 부팅 마운트로 변환되는 경로와 nofail 분기</title><desc id="dd">systemd-fstab-generator 는 fstab 각 줄을 동적 .mount 유닛으로 변환합니다. 마운트 실패 시 nofail 옵션이 없으면 필수 의존성 실패로 emergency 셸에 떨어집니다.</desc>
<rect width="880" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">fstab 설정이 부팅 마운트로 변환되는 경로와 nofail 분기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">근거: systemd.mount(5) · systemd-fstab-generator(8) · systemd.special(7)</text>
<rect x="40" y="120" width="800" height="64" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="60" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#6A95D8">1. /etc/fstab 설정 파싱</text>
<text x="60" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">UUID=be9ae4e4... /mnt/lv ext4 defaults 0 2 (또는 defaults,nofail)</text>
<text x="820" y="154" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">systemd-fstab-generator(8)</text>
<path d="M 440.0 184 L 440.0 212" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="450.0" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부팅 초기 실행</text>
<rect x="140" y="214" width="600" height="64" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="160" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#3FB98C">2. 동적 마운트 유닛 생성 (/run/systemd/generator/mnt-lv.mount)</text>
<text x="160" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F5F5F3">local-fs.target 에 등록: 기본은 Requires= + Before=, nofail 이면 Wants= 만</text>
<path d="M 440.0 278 L 440.0 306" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="450.0" y="296" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">마운트 수행 (장치 누락 또는 오타 발생 시)</text>
<rect x="240" y="308" width="400" height="56" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="440.0" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#E3B341">마운트 옵션에 nofail 이 지정되었는가?</text>
<text x="440.0" y="352" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">systemd.mount(5) nofail 옵션 평가</text>
<rect x="40" y="400" width="380" height="120" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="60" y="426" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#3FB98C">YES (nofail 있음) — Wants= 로 완화</text>
<text x="60" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">local-fs.target 이 이 마운트를 기다리지 않음</text>
<text x="60" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">마운트가 실패해도 부팅은 계속 -&gt; default.target</text>
<text x="60" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서비스 정상 시작 (필수 아닌 데이터 볼륨 권장)</text>
<rect x="460" y="400" width="380" height="120" rx="8" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="480" y="426" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F0616D">NO (기본값) — Requires= 필수 의존</text>
<text x="480" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">마운트 실패 -&gt; local-fs.target 실패</text>
<text x="480" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">OnFailure=emergency.target -&gt; 응급 셸</text>
<text x="480" y="498" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">조치: 루트가 ro 면 remount,rw 후 fstab 수정</text>
<path d="M 300 364 L 300 382 L 230.0 382 L 230.0 398" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 580 364 L 580 382 L 650.0 382 L 650.0 398" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<line x1="12" y1="552" x2="832" y2="552" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="574" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="564" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 부팅 진행 경로</text>
<rect x="287" y="564" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정 및 평가 계층</text>
<rect x="461" y="564" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="483" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부팅 실패 및 복구 경로</text>
</svg>
<text x="694.0" y="708" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">기다리지 않음</text>
<rect x="574.0" y="496" width="216" height="48" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>
<text x="682.0" y="517" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">mnt-lv.mount</text>
<text x="682.0" y="535" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">장치 없음 · 오타 → 실패</text>
<rect x="574.0" y="624" width="216" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="682.0" y="645" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">local-fs.target</text>
<text x="682.0" y="663" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">원하기만 함 → 성공</text>
<rect x="574.0" y="736" width="216" height="48" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="682.0" y="757" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">부팅 계속</text>
<text x="682.0" y="775" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">마운트 성공·실패와 무관</text>

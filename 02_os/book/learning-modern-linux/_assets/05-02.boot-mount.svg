<path d="M 238.0 420 L 682.0 420 L 682.0 445" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="24" y="448" width="428" height="360" rx="8" fill="#0D1117" stroke="#F0616D" stroke-width="1.0"/>
<text x="40" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">nofail 없음 · 기본</text>
<path d="M 198.0 622 L 198.0 547" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="186.0" y="578" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">Requires=</text>
<text x="186.0" y="596" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">Before=</text>
<path d="M 278.0 546 L 278.0 621" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)"/>
<text x="290.0" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">실패가 번짐</text>
<path d="M 238.0 674 L 238.0 733" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)"/>
<text x="250.0" y="708" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">OnFailure=</text>

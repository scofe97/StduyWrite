<title id="dt">만드는 쪽과 쌓아 두는 쪽과 날라 오는 쪽</title><desc id="dd">apt install 한 줄 뒤에 서 있는 세 자리. 배포판마다 세부가 다르고 서버냐 데스크톱이냐에 따라서도 달라지지만, 이 셋은 어느 공급망에나 공통이다.</desc>
<rect width="880" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">만드는 쪽과 쌓아 두는 쪽과 날라 오는 쪽</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자는 의존성을 최신으로 유지하는 일이 어렵다고 못 박습니다</text>
<rect x="24.0" y="168" width="244" height="148" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="40.0" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14.5" font-weight="600" fill="#6A95D8">소프트웨어 관리자</text>
<line x1="38.0" y1="212" x2="254.0" y2="212" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="40.0" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">개별 개발자 · 오픈소스 프로젝트</text>
<text x="40.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">회사와 독립 소프트웨어 벤더</text>
<text x="40.0" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">산출물을 만들어 패키지로 발행한다</text>
<path d="M 268.0 242.0 L 316.0 242.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="293.0" y="228.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#8B98A9">발행</text>
<rect x="318.0" y="168" width="244" height="148" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="334.0" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14.5" font-weight="600" fill="#3FB98C">저장소</text>
<line x1="332.0" y1="212" x2="548.0" y2="212" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="334.0" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">패키지와 메타데이터를 목록에 올린다</text>
<text x="334.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">패키지가 앱의 의존성을 담는다</text>
<text x="334.0" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">앱 하나를 여러 패키지가 나타낼 수 있다</text>
<path d="M 562.0 242.0 L 610.0 242.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="587.0" y="228.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#8B98A9">조회</text>
<rect x="612.0" y="168" width="244" height="148" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="628.0" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14.5" font-weight="600" fill="#E3B341">도구 — 패키지 관리자</text>
<line x1="626.0" y1="212" x2="842.0" y2="212" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="628.0" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">대상 시스템 쪽에 있다</text>
<text x="628.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">저장소에서 찾고 설치 · 갱신 · 제거</text>
<text x="628.0" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">사람이 지시한 대로 움직인다</text>
<text x="24" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#5E6B7E">소비자</text>
<text x="734.0" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">앱을 쓰는 사람이거나 그를 대신하는 도구</text>
<rect x="24" y="372" width="832" height="96" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="44" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">저자가 어렵다고 적은 자리 — 의존성을 최신으로 유지하는 일</text>
<text x="44" y="428" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">yum install golang 한 줄의 출력이 그 어려움을 숫자로 보입니다.</text>
<text x="60" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">딸려 오는 의존 패키지</text>
<text x="210" y="454" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">101 개</text>
<text x="328" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">내려받는 양</text>
<text x="478" y="454" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">183 M</text>
<text x="596" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">설치 뒤 차지하는 양</text>
<text x="746" y="454" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">624 M</text>
<line x1="12" y1="504" x2="832" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="526" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="516" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">만드는 쪽</text>
<rect x="209" y="516" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="231" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">쌓아 두는 쪽</text>
<rect x="344" y="516" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="366" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">날라 오는 쪽</text>
<rect x="479" y="516" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="501" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어려운 자리</text>
</svg>
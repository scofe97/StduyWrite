<title id="dt">이름을 바꾸면 fd 는 inode 를 따라가고 copytruncate 는 inode 를 남긴다</title><desc id="dd">0.2초마다 한 줄을 붙이는 셸 루프(PID 3502)를 두고 logrotate -f 로 강제 회전한 전후. 이름 바꾸기 방식에서는 app.log 가 새 inode 4132348 을 받지만 fd 1 은 옛 inode 4131778(이제 app.log.1)을 계속 가리켜, 1초 뒤 app.log 는 0 줄, app.log.1 은 20 줄이다. copytruncate 는 app.log 의 inode 4132350 을 그대로 두고 새 inode 4132351 에 다섯 줄을 복사한 뒤 원본을 자른다.</desc>
<rect width="920" height="564" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름을 바꾸면 fd 는 inode 를 따라가고 copytruncate 는 inode 를 남긴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">fd 는 이름이 아니라 inode 를 가리킨다 — 이름을 바꿔도 쓰기는 옛 inode 로 간다</text>

<title id="dt">서버를 믿는 걸음과 나를 증명하는 걸음은 다르다</title><desc id="dd">SSH 접속 한 번에 인증이 두 번 일어난다. 서버가 호스트 키로 자기를 증명하고, 그다음에 내가 공개키로 나를 증명한다. 저자는 뒤의 것만 적는다.</desc>
<rect width="880" height="830" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-03 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서버를 믿는 걸음과 나를 증명하는 걸음은 다르다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">첫 접속의 그 한 걸음이 이 방식의 값이자 구멍입니다</text>
<rect x="24.0" y="104" width="230" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="139.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">사용자</text>
<text x="139.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">터미널 앞</text>
<rect x="313.0" y="104" width="230" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="428.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">ssh 클라이언트</text>
<text x="428.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">~/.ssh</text>
<rect x="602.0" y="104" width="230" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="717.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">sshd 서버</text>
<text x="717.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">원격 22번</text>
<path d="M 149.0 196 L 416.0 196" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="283.5" y="187" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">ssh db</text>
<text x="283.5" y="213" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">접속을 시작한다</text>
<path d="M 438.0 240 L 705.0 240" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="572.5" y="231" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">TCP 22 · 버전 교환</text>
<path d="M 707.0 284 L 440.0 284" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)" stroke-dasharray="5 4"/>
<text x="572.5" y="275" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">호스트 키 제시</text>
<text x="572.5" y="301" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버가 자기를 증명한다</text>
<path d="M 438.0 320 L 486.0 320 L 486.0 340 L 441.0 340" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="496.0" y="326" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">known_hosts 대조</text>
<text x="496.0" y="343" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">적힌 키와 같은가</text>
<rect x="43.0" y="366" width="481.0" height="132" rx="4" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
<rect x="43.0" y="366" width="44" height="16" rx="2" fill="#0D1117" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
<text x="65.0" y="378" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">OPT</text>
<text x="55.0" y="402" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">[처음 보는 호스트]</text>
<path d="M 418.0 424 L 151.0 424" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="283.5" y="415" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">지문 이대로 맞습니까</text>
<path d="M 149.0 470 L 416.0 470" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="283.5" y="461" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">yes</text>
<text x="283.5" y="487" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">known_hosts 에 한 줄이 적힌다</text>
<path d="M 438.0 540 L 705.0 540" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="572.5" y="531" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">세션 키 합의</text>
<text x="572.5" y="557" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기부터 암호화된다</text>
<path d="M 438.0 590 L 705.0 590" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="572.5" y="581" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">공개키로 서명해 보인다</text>
<text x="572.5" y="607" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">내가 나를 증명한다</text>
<path d="M 707.0 640 L 440.0 640" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)" stroke-dasharray="5 4"/>
<text x="572.5" y="631" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">인증 성공 · 셸을 연다</text>
<line x1="139.0" y1="154" x2="139.0" y2="672" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="428.0" y1="154" x2="428.0" y2="672" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="717.0" y1="154" x2="717.0" y2="672" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<rect x="24" y="690" width="832" height="74" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="44" y="716" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">취약한 구간은 첫 접속 한 번뿐입니다</text>
<text x="44" y="738" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그 한 번에 가짜 서버가 끼어들면 그 뒤의 모든 접속이 가짜 키를 믿습니다. 수동적인 엿듣기는 막지만</text>
<text x="44" y="756" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">능동적인 중간자 공격에는 취약하다고 RFC 4251 이 적습니다.</text>
<line x1="12" y1="774" x2="832" y2="774" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="796" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="786" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="796" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버가 자기를 증명한다</text>
<rect x="300" y="786" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="322" y="796" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">내가 나를 증명한다</text>
<rect x="474" y="786" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="496" y="796" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">첫 접속에만 있는 걸음</text>
</svg>
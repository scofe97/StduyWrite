<title id="dt">HTTP API 로 microVM 을 띄우고 격리와 가상 장치를 묶는다</title><desc id="dd">Firecracker 의 구성. 호스트는 HTTP API 로 VMM 에 요청하고, VMM 은 seccomp·cgroups 와 가상 장치·관측 통로를 묶어 KVM 위의 microVM 을 띄웁니다.</desc>

<title id="dt">같은 비트가 파일과 디렉토리에서 다른 것을 허용한다</title><desc id="dd">세 비트가 일반 파일에서와 디렉토리에서 각각 무엇을 허용하는지 갈라 놓은 표. 디렉토리의 x 는 실행이 아니라 검색 권한이다.</desc>
<rect width="896" height="508" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 비트가 파일과 디렉토리에서 다른 것을 허용한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">디렉토리의 x 는 실행이 아니라 들어가기입니다</text>

<text x="430.0" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">스크립트는 r 도 필요</text>
<rect x="580" y="360" width="268" height="76" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="714.0" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">들어가기 · 이름으로 열기</text>
<text x="714.0" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">검색 권한 · cd</text>
<line x1="12" y1="460" x2="848" y2="460" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="482" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

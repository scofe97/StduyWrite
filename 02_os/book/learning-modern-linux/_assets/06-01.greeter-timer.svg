<title id="dt">단위 파일 둘이 로그 한 줄이 되기까지</title><desc id="dd">/run/systemd/system 에 복사한 greeter.timer(OnCalendar=hourly)와 greeter.service(Type=oneshot, ExecStart=/home/mh9/greeter.sh)를 systemd[1] 이 읽는다. 타이머는 active (waiting) 로 14:00:00 을 기다리다가 서비스를 띄우고, greeter.sh[21071] 의 표준 출력 You are awesome! 이 systemd-journald 의 저널로 간다. journalctl -f -u greeter.service 가 그 두 줄을 보여 준다.</desc>
<rect width="960" height="666" fill="#0D1117"/>

<text x="44" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">Debian 계열은 service 단위를 기본으로 활성화하고 시작하지만, Red Hat 계열은 명시적인 systemctl start 와 enable 을 요구합니다.</text>

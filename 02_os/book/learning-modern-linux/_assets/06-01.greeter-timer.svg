<title id="dt">단위 파일 둘이 로그 한 줄이 되기까지</title><desc id="dd">타이머 단위가 서비스 단위를 부르고, 서비스가 셸 스크립트를 돌리고, 그 표준 출력이 그대로 저널에 남는다.</desc>

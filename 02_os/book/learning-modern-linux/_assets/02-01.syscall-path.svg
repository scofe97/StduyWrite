<title id="dt">x86-64 시스템 콜 진입과 복귀 흐름</title><desc id="dd">syscall 로 커널에 진입해 switch 분기를 거쳐 복귀하는 세 걸음.</desc>
<rect width="880" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 02-01 §6</text>

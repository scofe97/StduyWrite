<title id="dt">파일을 여는 요청이 지나는 길</title><desc id="dd">사용자는 프로세스를 띄우고, 프로세스가 낸 요청을 커널이 시스템 콜 입구와 권한 검사에서 두 번 거른 뒤에야 파일에 닿는다. capability 는 권한 검사의 일부를 단위로 건너뛰게 한다.</desc>

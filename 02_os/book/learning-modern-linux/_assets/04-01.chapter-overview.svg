<title id="dt">전부 아니면 전무에서 잘게 쪼개는 쪽으로</title><desc id="dd">4장 노트의 절 일곱을 읽는 순서로 이은 지도. 1~3절이 누가 무엇을 갖는가이고, 4~5절이 그 권한을 파일과 프로세스에서 읽는 법, 6~7절이 이분법을 쪼개는 장치와 관례다.</desc>
<rect width="880" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 04-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">전부 아니면 전무에서 잘게 쪼개는 쪽으로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">6절이 이 장의 제목이 가리키는 자리입니다</text>
<path d="M 420 148.0 L 438 148.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 640.0 192 L 640.0 202 L 220.0 202 L 220.0 210" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 420 256.0 L 438 256.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

<title id="dt">표준을 읽으면 무엇을 비워도 되는지가 보인다</title><desc id="dd">위는 RFC 5424 §6.5 의 예시 한 줄을 필드 경계대로 자른 것이고, 아래는 헤더 일곱 필드를 ABNF 정의와 나란히 놓은 격자다. 오른쪽 열은 그 필드에 NILVALUE 대안이 있어 하이픈 하나로 비울 수 있는지를 뜻하고, 예시 줄에서는 PROCID 와 STRUCTURED-DATA 가 실제로 하이픈으로 비어 있다.</desc>
<rect width="880" height="772" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">표준을 읽으면 무엇을 비워도 되는지가 보인다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">VERSION 은 비울 수 없고 이 형식에서 늘 1 입니다</text>
<text x="24" y="108" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">SYSLOG-MSG = HEADER SP STRUCTURED-DATA [SP MSG]</text>
<rect x="24" y="124" width="43.6" height="32" rx="4" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>

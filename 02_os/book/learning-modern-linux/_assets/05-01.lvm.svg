<text x="736.0" y="218" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">222.10 GiB</text>
<text x="736.0" y="236" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">ext4 · /</text>
<path d="M 536 362 L 640 362 L 640 422 L 536 422 Z" fill="#8B98A922" stroke="none"/>
<rect x="640" y="356" width="192" height="72" rx="8" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>

<title id="dt">물리 볼륨을 풀로 모아 두면 논리 볼륨을 마음대로 자를 수 있다</title><desc id="dd">저자의 실제 설정을 흐름으로 옮긴 것. 물리 볼륨 하나가 볼륨 그룹 하나에 들어가고, 그 그룹에서 논리 볼륨 둘이 나왔다.</desc>
<rect width="880" height="612" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">물리 볼륨을 풀로 모아 두면 논리 볼륨을 마음대로 자를 수 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">논리 볼륨은 쓰는 도중에도 크기를 바꿀 수 있습니다</text>
<path d="M 224 174 L 344 174 L 344 422 L 224 422 Z" fill="#6A95D822" stroke="none"/>
<rect x="48" y="168" width="176" height="260" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="136.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#6A95D8">물리 볼륨</text>
<text x="136.0" y="224" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">PV</text>
<text x="136.0" y="290" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">/dev/sda2</text>
<text x="136.0" y="312" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">223.07 GiB</text>
<text x="136.0" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">파티션이거나</text>
<text x="136.0" y="390" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">드라이브 전체이거나</text>
<rect x="344" y="168" width="192" height="260" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="440.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#3FB98C">볼륨 그룹</text>
<text x="440.0" y="224" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">VG</text>
<text x="440.0" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">elementary-vg</text>
<text x="440.0" y="308" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">#PV 1 · #LV 2</text>
<text x="440.0" y="330" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">VFree 16.00m</text>
<text x="440.0" y="376" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">PV 들이 모여 자원을</text>
<text x="440.0" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">함께 내놓는 풀</text>

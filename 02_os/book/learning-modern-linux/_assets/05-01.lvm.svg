<title id="dt">물리 볼륨을 풀로 모아 두면 논리 볼륨을 자유롭게 분할</title><desc id="dd">물리 볼륨 sda2 가 볼륨 그룹 elementary-vg 로 풀링되고, 그 안에서 root 와 swap_1 두 논리 볼륨으로 나뉘는 Sankey 계층 흐름.</desc>
<rect width="880" height="612" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">물리 볼륨을 풀로 모아 두면 논리 볼륨을 자유롭게 분할</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">VG 에 여유 PE 가 있으면 사용 중에도 확장 가능</text>
<path d="M 224 174 L 344 174 L 344 422 L 224 422 Z" fill="#6A95D822" stroke="none"/>
<rect x="48" y="168" width="176" height="260" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="136.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#6A95D8">물리 볼륨 (PV)</text>
<text x="136.0" y="224" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">Physical Volume</text>
<text x="136.0" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">/dev/sda2</text>
<text x="136.0" y="306" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">223.07 GiB</text>
<text x="136.0" y="328" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">PE Size: 4.00 MiB</text>
<text x="136.0" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">파티션 또는 드라이브 전체</text>
<text x="136.0" y="390" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">단일 물리 블록 장치</text>
<rect x="344" y="168" width="192" height="260" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="440.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#3FB98C">볼륨 그룹 (VG)</text>
<text x="440.0" y="224" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">Volume Group</text>
<text x="440.0" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">elementary-vg</text>
<text x="440.0" y="306" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">#PV 1 · #LV 2</text>
<text x="440.0" y="328" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">VFree: 16.00 MiB (4 PE)</text>
<text x="440.0" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">PV 들의 자원 통합 풀</text>
<text x="440.0" y="390" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">LV 를 나눠 주는 풀</text>

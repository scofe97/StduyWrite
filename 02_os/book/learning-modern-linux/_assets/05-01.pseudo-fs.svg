<title id="dt">파일시스템인 척하며 커널 인터페이스를 감싼다</title><desc id="dd">셋 다 ls 와 cat 으로 읽히지만 뒤에 블록 장치가 없다. 무엇을 감싸느냐가 다르고, 그래서 성격도 다르다.</desc>
<rect width="880" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">파일시스템인 척하며 커널 인터페이스를 감싼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자는 procfs 를 서부 개척지에 빗댑니다</text>
<rect x="340" y="148" width="200" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="440.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">VFS</text>
<text x="440.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">같은 손잡이, 블록 장치 없이</text>
<path d="M 440.0 204 L 440.0 232 L 160.0 232 L 160.0 266" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="24" y="268" width="272" height="176" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="40" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">/proc — procfs</text>
<text x="40" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">유닉스에서 물려받음</text>
<line x1="38" y1="330" x2="282" y2="330" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="40" y="354" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">구조 규칙이 거의 없고 읽기·쓰기 가능</text>
<text x="40" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">PID 별 정보와 마운트 · 네트워크</text>
<text x="40" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">TTY 드라이버 · 메모리 · 업타임</text>
<text x="40" y="426" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">cat /proc/self/status</text>
<path d="M 440.0 204 L 440.0 232 L 448.0 232 L 448.0 266" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="312" y="268" width="272" height="176" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="328" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">/sys — sysfs</text>
<text x="328" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">리눅스 고유, 표준 배치</text>
<line x1="326" y1="330" x2="570" y2="330" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="328" y="354" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">디렉토리 여덟이 표준 배치를 이룹니다</text>
<text x="328" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">block · bus · class · dev</text>
<text x="328" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">devices · firmware · fs · module</text>
<text x="328" y="426" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">ls -al /sys/block/sda/</text>
<path d="M 440.0 204 L 440.0 232 L 736.0 232 L 736.0 266" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="600" y="268" width="272" height="176" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="616" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#E3B341">/dev — devtmpfs</text>
<text x="616" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">저자는 devfs 라 부름</text>
<line x1="614" y1="330" x2="858" y2="330" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="616" y="354" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">블록 장치 · 문자 장치 · 특수 장치</text>
<text x="616" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">/dev/null · /dev/random</text>
<text x="616" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">/dev/tty · /dev/urandom</text>
<text x="616" y="426" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">echo "something" &gt; /dev/tty</text>
<rect x="24" y="476" width="272" height="72" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="40" y="502" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">메모리 정보는 여기에만</text>
<text x="40" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">겹치는 정보가 있지만 저자는 메모리</text>
<text x="40" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">정보가 procfs 에만 있다고 못 박습니다</text>
<path d="M 160.0 444 L 160.0 474" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)" stroke-dasharray="6 5"/>
<rect x="312" y="476" width="560" height="72" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="328" y="502" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">이름이 어긋난 자리</text>
<text x="328" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">저자는 /dev 를 devfs 라 부르지만, 같은 장 앞쪽의 findmnt 출력 첫 줄은</text>
<text x="328" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">udev  devtmpfs  ...  /dev 입니다. 커널이 만들고 그 위에서 udev 가 돕니다.</text>
<line x1="12" y1="584" x2="832" y2="584" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="606" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="596" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">규칙이 느슨한 쪽</text>
<rect x="261" y="596" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="283" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정돈된 쪽</text>
<rect x="370" y="596" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="392" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이름을 확인해야 하는 쪽</text>
<rect x="583" y="596" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="605" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기에만 있는 정보</text>
</svg>
<title id="dt">cipher suite 이름을 네 조각으로 읽는다</title><desc id="dd">원문 예제에서 서버가 고른 TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 를 이름 안의 자리대로 잘랐다. 앞의 TLS 는 접두사이고 WITH 가 키 교환·인증 쪽과 암호·해시 쪽을 가르는 표지다. ECDHE는 서버 개인키만으로 사후 복호화할 수 없다. AES-GCM은 레코드 암호화와 무결성을 보호하고 SHA384는 PRF의 해시다.</desc>
<rect width="960" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">cipher suite 이름을 네 조각으로 읽는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">WITH 앞이 열쇠를 나누는 방법, 뒤가 나눈 열쇠로 하는 일입니다</text>
<text x="468.0" y="158" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384</text>
<text x="468.0" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원문 예제에서 서버가 고른 이름</text>
<rect x="147.5" y="212" width="69" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="182.0" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">TLS</text>
<line x1="182.0" y1="264" x2="182.0" y2="300" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="182.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">접두사</text>
<rect x="224.5" y="212" width="91" height="52" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="270.0" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">ECDHE</text>
<line x1="270.0" y1="264" x2="270.0" y2="300" stroke="#F08A59" stroke-width="1.2"/>
<text x="270.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">키 교환</text>
<rect x="323.5" y="212" width="69" height="52" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="358.0" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">RSA</text>
<line x1="358.0" y1="264" x2="358.0" y2="300" stroke="#6A95D8" stroke-width="1.2"/>
<text x="358.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">인증</text>
<rect x="400.5" y="212" width="80" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="440.5" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">WITH</text>
<line x1="440.5" y1="264" x2="440.5" y2="300" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="440.5" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">가르는 표지</text>
<rect x="488.5" y="212" width="113" height="52" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="545.0" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">AES_256</text>
<line x1="545.0" y1="264" x2="545.0" y2="300" stroke="#3FB98C" stroke-width="1.2"/>
<text x="545.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">256비트 암호</text>
<rect x="609.5" y="212" width="69" height="52" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="644.0" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">GCM</text>
<line x1="644.0" y1="264" x2="644.0" y2="300" stroke="#3FB98C" stroke-width="1.2"/>
<text x="644.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">인증 암호 모드</text>
<rect x="686.5" y="212" width="102" height="52" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="737.5" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">SHA384</text>
<line x1="737.5" y1="264" x2="737.5" y2="300" stroke="#E3B341" stroke-width="1.2"/>
<text x="737.5" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">PRF 해시</text>
<line x1="24" y1="366" x2="912" y2="366" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 6"/>
<text x="24" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">WITH 앞 — 열쇠를 어떻게 나눌 것인가</text>
<text x="24" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">ECDHE: 임시 키 합의 · RSA: 서버 서명</text>
<text x="500" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">WITH 뒤 — 나눈 열쇠로 무엇을 할 것인가</text>
<text x="500" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">AES-GCM: 레코드 보호 · SHA384: PRF 해시</text>
<rect x="269.0" y="448" width="398.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="468.0" y="462" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">ECDHE · DHE: 서버 개인키만으로 사후 복호화 불가</text>
<line x1="12" y1="496" x2="912" y2="496" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="518" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="508" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">키 합의 방식</text>
<rect x="235" y="508" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="257" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버 인증</text>
<rect x="344" y="508" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="366" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">암호화·무결성</text>
<rect x="479" y="508" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="501" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">PRF 해시</text>
</svg>
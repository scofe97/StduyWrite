<path d="M 472 246.0 L 480.0 246.0 L 480.0 154.0 L 484 154.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 636 154.0 L 644.0 154.0 L 644.0 246.0 L 648 246.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 800 338.0 L 808.0 338.0 L 808.0 246.0 L 812 246.0" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<text x="156" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">백로그 크기는 tcp_max_syn_backlog · 기다리는 횟수는 tcp_synack_retries · 자리를 아예 안 잡는 길이 tcp_syncookies 입니다</text>

<title id="dt">SYN 홍수에서 벌어지는 일</title><desc id="dd">공격자·서버·정상 사용자 셋이 같은 시간축 위에서 무엇을 하는지. 서버가 자리를 잡아 두고 기다리는 동안 백로그가 차고, 마지막에 밀려나는 것은 공격자가 아니라 정상 사용자다.</desc>
<rect width="1000" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 07-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SYN 홍수에서 벌어지는 일</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">서버는 규격대로 행동하는데도 무너집니다 — 자리를 미리 잡아 두기 때문입니다</text>
<line x1="156" y1="108" x2="984" y2="108" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="20" y="152.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">공격자</text>
<text x="20" y="169.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">ATTACKER</text>

<title id="dt">B5 · 정적 RSA 에서 빠지는 메시지</title><desc id="dd">키 교환을 정적 RSA 로 고정하면 서버 메시지가 2·11·14 로 끝나 ServerKeyExchange(12) 가 없다. 대신 ClientKeyExchange 가 RSA 로 잠근 비밀 값을 실어 262 바이트로 커진다.</desc>

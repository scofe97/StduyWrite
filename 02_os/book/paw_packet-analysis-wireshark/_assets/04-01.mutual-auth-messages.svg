<title id="dt">상호 인증의 셋은 연달아 오지 않는다</title><desc id="dd">상호 인증에서만 오는 메시지 셋은 기본 흐름 사이사이에 끼어든다. 서버가 ServerHelloDone 앞에서 요구하고, 클라이언트는 ClientKeyExchange 앞뒤로 인증서와 그 인증서의 개인키를 가졌다는 서명을 나눠 보낸다. 인증서가 없으면 빈 Certificate를 보내고, 서버가 인증을 필수로 요구하는지에 따라 계속하거나 중단한다.</desc>
<rect width="960" height="748" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">상호 인증의 셋은 연달아 오지 않는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">TLS 1.2 서명용 클라이언트 인증서의 예입니다. 인증서가 없을 때의 처리는 서버 정책에 따릅니다</text>

<title id="dt">Follow Stream 이 되돌린 바이트</title><desc id="dd">follow,tcp,ascii,2 출력의 세 덩어리. Node 0 이 78바이트를 보내고 Node 1 이 156바이트와 6162바이트로 답한다. 출력에는 Seq·Ack·Win 이 없고 방향별 바이트 수만 남는다.</desc>

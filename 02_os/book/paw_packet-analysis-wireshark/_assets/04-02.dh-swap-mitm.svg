<title id="dt">서명이 없으면 인증서는 통과하고 DH 공개값만 바뀐다</title><desc id="dd">중간자는 서버의 인증서를 그대로 전달해 CA 서명 검증을 통과시킨 뒤 ServerKeyExchange 의 DH 공개값만 자기 값으로 바꾼다. 서명이 없으면 클라이언트와 서버가 각각 중간자와 공유 비밀을 맺는다. 서명이 붙으면 바꾼 값과 서명이 맞지 않아 클라이언트의 서명 검증에서 걸린다.</desc>
<rect width="960" height="764" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서명이 없으면 인증서는 통과하고 DH 공개값만 바뀐다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">TLS 1.2 ECDHE 기준입니다. A 는 ServerKeyExchange 에 서명이 없다고 가정한 경우입니다</text>

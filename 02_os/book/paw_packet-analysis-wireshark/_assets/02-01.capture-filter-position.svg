<title id="dt">캡처 필터가 서는 자리</title><desc id="dd">프레임이 NIC 에서 파일까지 가는 네 단계. 캡처 필터는 커널 단계에서 매칭하므로 여기서 걸러진 프레임은 디스크에 남지 않고, 디스플레이 필터는 파일이 생긴 뒤부터 작동한다.</desc>

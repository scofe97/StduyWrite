<title id="dt">monitor 모드가 더 보는 것</title><desc id="dd">일반 모드는 자기 장비가 주고받는 데이터 프레임만 본다. monitor 모드를 켜면 그 채널에서 오가는 관리·제어 프레임과 남의 유니캐스트까지 어댑터가 올려 준다.</desc>
<rect width="880" height="472" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 06-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">monitor 모드가 더 보는 것</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">안쪽이 일반 모드의 시야이고, 바깥 두 겹이 monitor 모드가 더해 주는 것입니다</text>
<rect x="24" y="104" width="832" height="272" rx="8" fill="#161B22" fill-opacity="0.25" stroke="rgba(191,192,192,0.22)" stroke-opacity="0.30" stroke-width="1.1"/>

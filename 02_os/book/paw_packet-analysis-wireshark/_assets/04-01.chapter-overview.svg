<text x="24" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">범위: 최초 전체 핸드셰이크 · 세션 재개·재협상 제외 · TLS 1.3 은 암호화 경계가 다름</text>

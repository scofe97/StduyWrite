<title id="dt">검증 없는 필터를 커널에서 돌리면</title><desc id="dd">드라이버는 BPF 를 먼저 부르고 필터가 끝나야 제어를 돌려받는다. 검증 없이 붙은 필터 코드가 뒤로 점프해 같은 명령을 반복하면 복귀가 일어나지 않아, 캡처 버퍼로도 프로토콜 스택으로도 프레임이 넘어가지 않는다.</desc>

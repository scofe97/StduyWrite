<title id="dt">A4 — 갱신 둘, 반납 하나</title><desc id="dd">A1 과 같은 DORA(1~6번) 뒤, 시그널로 갱신과 반납을 시킨다. 갱신은 REQUEST 와 ACK 두 개의 유니캐스트이고 ciaddr 에 자기 주소가 들어간다. 반납은 새 트랜잭션 ID 의 RELEASE 하나이며 서버는 답하지 않는다.</desc>
<rect width="940" height="644" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-03 A4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">A4 — 갱신 둘, 반납 하나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주소와 서버를 이미 아는 단계라 외치지 않고 서버에게 바로 보냅니다</text>

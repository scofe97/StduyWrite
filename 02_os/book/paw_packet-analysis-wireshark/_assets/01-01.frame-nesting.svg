<text x="796.0" y="244.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">오류 검사</text>
<rect x="40" y="360" width="696" height="32" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="56" y="381" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">분석기가 받는 범위 · 이더넷 헤더부터 페이로드까지</text>

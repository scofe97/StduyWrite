<title id="dt">프레임이 패킷을 담는 모양</title><desc id="dd">이더넷 프레임 안에 IP 패킷, 그 안에 TCP 세그먼트, 그 안에 페이로드가 들어 있는 포함 관계. 패킷 분석기는 이더넷 헤더부터 페이로드까지 받고 끝의 FCS 는 대개 전달받지 못하며, 애플리케이션에는 페이로드만 올라간다.</desc>
<rect width="880" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 01-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프레임이 패킷을 담는 모양</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">IP 헤더는 MAC 주소 다음 칸이 아니라 프레임 몸통 안에 있습니다 — 분석기는 바깥 봉투째 받습니다</text>
<rect x="24" y="112" width="832" height="224" rx="8" fill="#161B22" fill-opacity="0.25" stroke="rgba(191,192,192,0.22)" stroke-opacity="0.45" stroke-width="1.1"/>
<text x="40" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">이더넷 프레임 · Ethernet II</text>
<rect x="176" y="144" width="560" height="176" rx="8" fill="#161B22" fill-opacity="0.45" stroke="rgba(191,192,192,0.22)" stroke-opacity="0.70" stroke-width="1.1"/>
<text x="192" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">IP 패킷 · IPv4</text>
<rect x="320" y="176" width="400" height="128" rx="8" fill="#161B22" fill-opacity="0.65" stroke="rgba(191,192,192,0.22)" stroke-opacity="1" stroke-width="1.1"/>
<text x="336" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">TCP 세그먼트 · TCP</text>
<rect x="40" y="144" width="120" height="176" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="100.0" y="216.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">이더넷 헤더</text>
<text x="100.0" y="236.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">목적지 MAC</text>

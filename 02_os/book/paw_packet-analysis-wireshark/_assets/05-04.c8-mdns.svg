<title id="dt">C8 — mDNS 는 답까지 그룹에 외친다</title><desc id="dd">질의·응답·알림이 모두 224.0.0.251:5353 그룹으로 간다. 이름의 주인이 직접 답하고 이름 서버는 끼지 않는다. 교환과 상관없는 제3자 캡처에도 셋이 모두 찍힌다.</desc>

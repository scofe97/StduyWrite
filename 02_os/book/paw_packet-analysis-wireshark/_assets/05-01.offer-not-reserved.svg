<title id="dt">OFFER 는 예약이 아니다</title><desc id="dd">서버가 장부에 적지 않은 채 같은 주소를 두 클라이언트에게 제안한다. 둘 다 그 주소로 REQUEST 를 보내면 먼저 도착한 A 만 장부에 적혀 ACK 를 받고, 늦은 B 는 NAK 을 받아 찾기부터 다시 시작한다.</desc>

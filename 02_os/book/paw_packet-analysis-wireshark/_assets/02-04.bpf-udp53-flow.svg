<line x1="540" y1="676" x2="700" y2="676" stroke="#F08A59" stroke-width="1.6"/>
<text x="552" y="668" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오 · jf 19</text>

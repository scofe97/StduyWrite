<rect x="320.0" y="100" width="200" height="36" rx="20" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="420" y="123.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">프레임 도착</text>
<polygon points="420,156 540,184 420,212 300,184" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="420" y="189" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">EtherType = 0x86dd</text>
<text x="24" y="179" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(000) ldh [12]</text>
<text x="24" y="197" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(001) jeq #0x86dd</text>
<polygon points="420,236 540,264 420,292 300,264" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="420" y="269" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">EtherType = 0x800</text>
<text x="24" y="268" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(008) jeq #0x800</text>
<polygon points="420,316 540,344 420,372 300,344" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="420" y="349" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Protocol = 0x11</text>
<text x="24" y="339" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(009) ldb [23]</text>
<text x="24" y="357" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(010) jeq #0x11</text>
<polygon points="420,396 540,424 420,452 300,424" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="420" y="429" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">단편 비트 0x1fff 켜짐</text>
<text x="24" y="419" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(011) ldh [20]</text>
<text x="24" y="437" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(012) jset #0x1fff</text>
<line x1="540" y1="184" x2="640" y2="184" stroke="#8B98A9" stroke-width="1.4"/>
<text x="552" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예 · jt 2</text>
<rect x="640" y="160" width="220" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="750" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">IPv6 쪽 (002)~(007)</text>
<text x="750" y="198" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">포트 [54]·[56] = 0x35</text>
<text x="750" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">맞으면 (018) · 아니면 (019)</text>
<rect x="300" y="480" width="240" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="420" y="502" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">IP 헤더 길이 계산</text>
<text x="420" y="522" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">x = 4*([14]&amp;0xf)</text>
<text x="24" y="510" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(013) ldxb 4*([14]&amp;0xf)</text>
<polygon points="420,568 540,596 420,624 300,596" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="420" y="601" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">[x+14] = 0x35</text>
<text x="24" y="591" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(014) ldh [x + 14]</text>
<text x="24" y="609" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(015) jeq #0x35</text>
<text x="432" y="641.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오 · jf 16</text>

<title id="dt">udp port 53 필터가 프레임 하나를 가르는 길</title><desc id="dd">tcpdump -d 'udp port 53' 이 낸 20줄 가운데 IPv4 쪽 (008)~(018) 의 실행 흐름. EtherType 0x800, Protocol 0x11, 단편 비트, 포트 두 번의 검사를 차례로 거치고 하나라도 어긋나면 (019) ret #0 으로 버려진다. IPv6 쪽 (001)~(007) 은 같은 검사를 포트 54·56 자리에서 한다.</desc>
<rect width="880" height="880" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 02-04 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">udp port 53 필터가 프레임 하나를 가르는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">버림으로 가는 점프는 모두 아래쪽 (019) 으로만 갑니다</text>
<path d="M 420 136 L 420 152" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 420 212 L 420 232" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 420 292 L 420 312" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 420 372 L 420 392" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 420 452 L 420 476" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 420 532 L 420 564" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 420 624 L 420 644" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 420 704 L 420 736" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

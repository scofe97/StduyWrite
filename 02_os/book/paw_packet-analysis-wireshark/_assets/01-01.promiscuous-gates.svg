<title id="dt">promiscuous 가 바꾸는 관문, 못 바꾸는 관문</title><desc id="dd">다른 두 장비 사이의 유니캐스트 프레임이 스위치 MAC 테이블과 NIC MAC 필터 두 관문을 차례로 지나는지 네 조합으로 추적한다. promiscuous 모드는 NIC 필터만 끄고, 스위치 관문을 여는 것은 SPAN(미러) 포트다.</desc>
<rect width="880" height="544" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 01-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">promiscuous 가 바꾸는 관문, 못 바꾸는 관문</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 두 줄은 켜도 결과가 같고, 아래 두 줄에서만 NIC 필터 칸이 갈립니다</text>

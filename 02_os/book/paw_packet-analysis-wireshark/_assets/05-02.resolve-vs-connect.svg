<title id="dt">이름 해석 실패인가, 연결 실패인가</title><desc id="dd">접속이 안 되는 캡처를 위에서부터 판단한다. dns 질의가 보이는지, 응답이 왔는지, 답에 주소가 있는지까지가 이름 해석이고, 그 주소로 보낸 SYN 에 SYN/ACK 가 오는지부터가 연결이다.</desc>
<rect width="880" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름 해석 실패인가, 연결 실패인가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 셋이 이름 해석, 마지막 하나가 연결입니다 — 이름이 안 풀리면 SYN 이 없습니다</text>
<rect x="124.0" y="92" width="240" height="36" rx="20" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="244" y="115.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">접속 실패 캡처를 연다</text>
<path d="M 244 132 L 244 160" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<polygon points="244,164 420,190 244,216 68,190" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="244" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">dns 질의가 보이나?</text>
<path d="M 424 190 L 496.0 190" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="444" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">아니오</text>
<rect x="500.0" y="164.0" width="336" height="52" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="668" y="186.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">선에 안 나간 질의</text>
<text x="668" y="204.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">TTL 안의 캐시 · DoT · DoH</text>
<path d="M 244 220 L 244 244" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="256" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<polygon points="244,248 420,274 244,300 68,274" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="244" y="279" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">질의에 응답이 왔나?</text>
<path d="M 424 274 L 496.0 274" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="444" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">아니오</text>
<rect x="500.0" y="248.0" width="336" height="52" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="668" y="270.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">리졸버에 못 닿음</text>
<text x="668" y="288.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">UDP 53 경로 · 리졸버 주소</text>
<path d="M 244 304 L 244 328" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="256" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<polygon points="244,332 420,358 244,384 68,358" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="244" y="363" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">답에 주소가 있나?</text>
<path d="M 424 358 L 496.0 358" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="444" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">아니오</text>
<rect x="500.0" y="332.0" width="336" height="52" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="668" y="354.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">이름 해석 실패</text>
<text x="668" y="372.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">RCODE 3 이면 그 이름이 없음</text>
<path d="M 244 388 L 244 412" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="256" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<polygon points="244,416 420,442 244,468 68,442" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="244" y="447" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">SYN 에 SYN/ACK 가 왔나?</text>
<path d="M 424 442 L 496.0 442" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="444" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">아니오</text>
<rect x="500.0" y="416.0" width="336" height="52" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="668" y="438.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">연결 실패</text>
<text x="668" y="456.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">RST 면 거절 · 무응답이면 재전송</text>
<path d="M 244 472 L 244 496" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="256" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<line x1="24" y1="400.0" x2="212" y2="400.0" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="4 4"/>
<line x1="292" y1="400.0" x2="856" y2="400.0" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="24" y="392.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">이름 해석</text>
<text x="24" y="420.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">연결</text>
<rect x="104.0" y="500" width="280" height="36" rx="20" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="244" y="523.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">연결 성립 · 다음은 HTTP</text>
<line x1="12" y1="584" x2="832" y2="584" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="606" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="596" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이름 해석이 끝나는 판단</text>
<rect x="313" y="596" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="335" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">선에 안 보임</text>
<rect x="448" y="596" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="470" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원인 후보</text>
<rect x="557" y="596" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="579" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">연결 실패</text>
<rect x="666" y="596" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="688" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상</text>

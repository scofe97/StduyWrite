<title id="dt">A3 · 프레임 9 의 레코드 셋</title><desc id="dd">프레임 9 한 세그먼트에 ClientKeyExchange·ChangeCipherSpec·Finished 세 레코드가 들어 있다. ChangeCipherSpec 까지는 평문이고, 그 다음 레코드부터 보호가 걸려 셋째 레코드의 종류가 읽히지 않는다.</desc>

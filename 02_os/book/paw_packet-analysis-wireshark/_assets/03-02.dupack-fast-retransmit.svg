<title id="dt">중복 ACK 가 쌓여야 빠른 재전송이 걸립니다</title><desc id="dd">가운데 세그먼트 하나가 사라지면 그 뒤 세그먼트가 도착할 때마다 받는 쪽은 같은 확인 번호를 되풀이한다. 보내는 쪽은 그 중복을 세다가 셋째에서 타이머를 기다리지 않고 사라진 세그먼트를 다시 보낸다. 순서는 중복 ACK 가 먼저이고 빠른 재전송이 뒤다.</desc>

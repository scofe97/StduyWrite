<title id="dt">3-way handshake 의 실제 값</title><desc id="dd">normal-connection.pcap 의 세 패킷. 각 메시지 아래가 그 패킷이 실은 시퀀스·확인·윈도우 값이고, 레인 옆 칩이 그 시점의 상태다. 확인 번호는 언제나 상대 시퀀스 + 1 이다.</desc>

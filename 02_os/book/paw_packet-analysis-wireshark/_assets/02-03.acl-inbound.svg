<title id="dt">같은 체크가 목적지 값에도 --source 를 붙입니다</title><desc id="dd">203.0.113.50 이 198.51.100.20 의 22번 포트로 보낸 SYN 에서 Firewall ACL Rules 가 만든 두 줄을 따라간다. Inbound 가 켜져 있으면 출발지 값이든 목적지 값이든 --source 계열 옵션이 붙어, 목적지 포트 줄은 공격 SYN 에 걸리지 않는다.</desc>
<rect width="880" height="412" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 02-03 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 체크가 목적지 값에도 --source 를 붙입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 줄은 공격 SYN 을 막고, 아래 줄은 목적지 값에 출발지 옵션이 붙어 지나보냅니다</text>

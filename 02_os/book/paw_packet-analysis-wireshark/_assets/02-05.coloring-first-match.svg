<title id="dt">색 규칙이 걸리는 순서</title><desc id="dd">SYN 두 개가 같은 규칙 목록을 위에서부터 내려간다. 2번은 14번째 HTTP 에서 멈추고 16번만 17번째 SYN/FIN 에 닿는다.</desc>

<title id="dt">TLS 핸드셰이크의 메시지 순서</title><desc id="dd">원문 two-way-handshake.pcap 의 상호 인증 흐름. 실선은 언제나 오가는 메시지이고 점선은 조건이 맞을 때만 오간다. 마지막 두 쌍이 오간 뒤부터 기록이 암호화된다.</desc>
<rect width="960" height="800" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TLS 핸드셰이크의 메시지 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">점선 넷은 조건부입니다 — 키 교환 방식과 상호 인증 여부가 그 조건입니다</text>

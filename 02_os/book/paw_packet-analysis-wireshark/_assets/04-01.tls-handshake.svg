<text x="468.0" y="752" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">CCS(20): 평문 → Finished(22): 암호화</text>

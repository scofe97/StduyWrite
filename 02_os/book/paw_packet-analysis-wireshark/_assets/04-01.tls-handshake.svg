<title id="dt">TLS 1.2 최초 전체 핸드셰이크의 메시지 순서</title><desc id="dd">인증서 기반 최초 전체 핸드셰이크의 개념도. 네 띠는 보내는 쪽이 바뀌는 단위로 끊은 단계이고, 점선은 조건부 메시지다. 각 방향의 ChangeCipherSpec 자체는 평문이고 다음 Finished부터 암호화된다. 세션 재개와 재협상은 제외한다.</desc>
<rect width="960" height="1016" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TLS 1.2 최초 전체 핸드셰이크의 메시지 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">단계가 바뀔 때마다 보내는 쪽이 바뀝니다. 점선은 조건부이고, 각 방향에서 CCS 는 평문이며 Finished 부터 암호화됩니다</text>
<rect x="24.0" y="104" width="300" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="174.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="174.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">CLIENT</text>

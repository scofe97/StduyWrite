<text x="24" y="880" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">한 단계 = 응답을 기다리지 않고 잇달아 보내는 묶음 · 왕복 두 번</text>

<title id="dt">응답이 요청보다 32바이트 길다</title><desc id="dd">원문 heartbleed.pcap 의 프레임 15 와 16. 두 프레임 모두 레코드 타입 24 인 암호화된 Heartbeat 이고, 열어 볼 수 있는 것은 레코드 길이 하나뿐이다. 그 하나가 유출을 고발한다.</desc>
<rect width="960" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 07-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">응답이 요청보다 32바이트 길다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">암호화되어 있어도 길이 필드는 평문으로 남습니다</text>
<rect x="24.0" y="104" width="300" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="174.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트 · 요청하는 쪽</text>
<text x="174.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">52.1.90.117:49578</text>
<rect x="612.0" y="104" width="300" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="762.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서버 · 취약한 OpenSSL</text>
<text x="762.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10.0.0.3:443</text>
<line x1="174.0" y1="154" x2="174.0" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="762.0" y1="154" x2="762.0" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 184.0 206 L 750.0 206" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="468.0" y="197" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">Heartbeat Request</text>
<text x="468.0" y="223" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">tls.record.length == 112 · 프레임 183바이트</text>
<rect x="683.0" y="248" width="158.0" height="20" rx="4" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="762.0" y="262" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">payload_length 를 안 봄</text>
<path d="M 752.0 310 L 186.0 310" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)"/>
<text x="468.0" y="301" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">Heartbeat Response</text>
<text x="468.0" y="327" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">tls.record.length == 144 · 프레임 215바이트</text>
<rect x="24" y="386" width="420" height="44" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="36" y="404" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">144 − 112 = 32</text>
<text x="36" y="421" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">요청하지 않은 32바이트가 딸려 나왔습니다</text>
<rect x="468" y="386" width="468" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="480" y="404" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">5 + 112 = 117 · 5 + 144 = 149</text>
<text x="480" y="421" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">레코드 헤더 5바이트를 더하면 TCP 길이와 맞습니다</text>
<line x1="12" y1="452" x2="912" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="474" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="464" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">유출이 실린 응답</text>
<rect x="261" y="464" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="283" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">길이 차이</text>

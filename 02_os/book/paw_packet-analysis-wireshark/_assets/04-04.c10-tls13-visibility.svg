<title id="dt">C10 · 같은 1.3 캡처, 두 번 읽기</title><desc id="dd">키 없이 읽으면 handshake.type 이 1 과 2 둘뿐이다. 같은 캡처에 키 로그를 물리면 프레임 6 에서 8·11·15·20 이 함께 드러나고, 프레임 10·11 은 NewSessionTicket(4) 로 읽힌다.</desc>
<rect width="880" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-04 C10</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">C10 · 같은 1.3 캡처, 두 번 읽기</text>

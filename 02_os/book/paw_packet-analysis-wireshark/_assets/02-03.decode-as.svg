<title id="dt">프로토콜은 포트로 정해집니다</title><desc id="dd">Wireshark 는 표준 포트를 근거로 디섹터를 고른다. 비표준 포트에서 도는 서비스는 그 판별에 걸리지 않아 TCP 로만 보이고, Decode-As 가 그 매핑을 사람이 덮어쓰는 경로다.</desc>
<rect width="880" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 02-03 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로토콜은 포트로 정해집니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">복호화가 아니라 해석입니다 — 암호화된 내용은 그대로 남습니다</text>
<path d="M 300 172 L 300 196" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 300 280 L 300 316" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 448 240 L 588 240" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<path d="M 700 280 L 700 316" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<path d="M 300 384 L 300 448" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 700 384 L 700 484 L 452 484" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="150.0" y="108" width="300" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="300" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">프레임이 들어옵니다</text>
<text x="300" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCP 목적지 포트를 읽습니다</text>
<polygon points="300,200 448,240 300,280 152,240" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="300" y="245" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">표준 포트인가?</text>
<rect x="150.0" y="320" width="300" height="64" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="300" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">해당 디섹터로 해석</text>
<text x="300" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">443 이면 TLS 로 펼칩니다</text>
<rect x="552.0" y="200" width="296" height="80" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="700" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">TCP 로만 보입니다</text>
<text x="700" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">4433 의 TLS 는 판별에 안 걸립니다</text>
<rect x="552.0" y="320" width="296" height="64" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="700" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">Analyze | Decode As</text>
<text x="700" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">포트에 디섹터를 손으로 지정</text>
<rect x="150.0" y="452" width="300" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="300" y="476" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Packet Details 에 펼쳐집니다</text>
<text x="300" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">복호화가 아니라 해석입니다</text>
<text x="316" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">예</text>
<text x="474" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">아니오</text>
<line x1="12" y1="540" x2="832" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="562" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="552" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">규칙이 틀리는 판단</text>
<rect x="274" y="552" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="296" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기본 판별이 맞은 경로</text>
<rect x="474" y="552" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="496" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사람이 덮어쓰는 경로</text>
</svg>
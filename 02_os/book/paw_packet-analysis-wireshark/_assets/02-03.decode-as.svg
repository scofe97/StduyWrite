<title id="dt">포트 표와 짐작으로 프로토콜을 정합니다</title><desc id="dd">Wireshark 는 TCP 포트를 포트 표에서 먼저 찾고, 표에 없으면 휴리스틱 디섹터가 패킷 내용으로 짐작한다. 둘 다 빗나가면 TCP 로만 보이고 Decode-As 가 그 매핑을 사람이 덮어쓴다.</desc>
<rect width="880" height="624" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 02-03 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">포트 표와 짐작으로 프로토콜을 정합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">4433 의 TLS 는 휴리스틱이 잡고, 16379 의 Redis 는 Decode As 가 있어야 풀립니다</text>
<path d="M 220 160 L 220 180" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 220 256 L 220 288" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 220 364 L 220 396" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<path d="M 220 464 L 220 488" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<path d="M 360 220 L 456.0 220" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 360 328 L 456.0 328" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 760.0 220 L 800 220 L 800 524 L 764.0 524" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 610 360 L 610 488" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 360.0 524 L 456.0 524" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="80.0" y="100" width="280" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="220" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">프레임 수신</text>
<text x="220" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">TCP 포트 읽기</text>
<polygon points="220,184 360,220 220,256 80,220" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="220" y="225" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">포트 표에 있나?</text>
<polygon points="220,292 360,328 220,364 80,328" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="220" y="333" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">내용으로 짐작되나?</text>

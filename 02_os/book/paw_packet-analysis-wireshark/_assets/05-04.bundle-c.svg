<title id="dt">묶음 C — 이름과 요청</title><desc id="dd">이름 실패와 연결 실패를 캡처에서 가르고, 질의 타입과 CNAME 체인을 읽고, 큰 응답이 TCP 로 넘어가는 순간을 EDNS(0) 로 없애고, 연결 하나에 실린 요청들의 http.time 을 재고, 재조립을 껐다 켜고, 평문 POST 와 CONNECT 터널 안의 ClientHello 를 본 뒤, DoT 와 mDNS 로 넓힌다.</desc>

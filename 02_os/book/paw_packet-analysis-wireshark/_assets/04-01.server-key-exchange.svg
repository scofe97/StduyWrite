<title id="dt">ServerKeyExchange 가 끼는 자리와 안 끼는 자리</title><desc id="dd">같은 구간을 두 경우로 그렸다. 정적 RSA 는 인증서 안의 공개키만으로 클라이언트가 비밀을 만들 수 있어 이 메시지가 오지 않는다. 임시 방식은 회차마다 새 공개값을 만들어 보내야 해서 이 메시지가 필요하고, 그 값이 진짜 서버의 것임을 인증서의 키로 서명해 붙인다.</desc>
<rect width="960" height="720" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">ServerKeyExchange 가 끼는 자리와 안 끼는 자리</text>

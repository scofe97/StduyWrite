<title id="dt">라우터의 두 다리에서 본 같은 DISCOVER</title><desc id="dd">seg-b 쪽 eth1 에서 받은 브로드캐스트 DISCOVER 를 릴레이가 목적지 MAC·출발지 IP·목적지 IP·giaddr 네 칸을 바꿔 seg-a 쪽 eth0 으로 서버에 유니캐스트한다. 서버는 giaddr 가 속한 서브넷의 범위에서 주소를 고른다. giaddr 에 서버 쪽 다리 주소를 적었다면 클라이언트는 자기 세그먼트와 다른 서브넷 주소를 받아 게이트웨이에도 닿지 못한다.</desc>
<rect width="940" height="640" fill="#0D1117"/>

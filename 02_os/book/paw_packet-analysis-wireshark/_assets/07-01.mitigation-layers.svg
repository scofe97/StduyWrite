<title id="dt">완화가 설 수 있는 층</title><desc id="dd">원문이 SYN·ICMP 홍수 완화책으로 나열한 항목들을 층으로 갈라 놓은 것. 같은 공격을 어느 층에서 끊느냐에 따라 아래 층이 처리해야 할 양이 달라진다.</desc>
<rect width="976" height="544" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 07-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">완화가 설 수 있는 층</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원문의 구체적인 손잡이는 거의 전부 커널 층에 있습니다</text>
<rect x="232" y="116" width="688" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="248" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">데이터센터 엣지 · 라우터</text>
<text x="248" y="161" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">네트워크 ACL · rate limit · DoS 보호 장비</text>
<text x="904" y="153" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">여기서 끊으면 안쪽은 아무것도 못 봅니다</text>
<rect x="232" y="188" width="688" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="248" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">로드밸런서</text>
<text x="248" y="233" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">연결을 대신 받아 냅니다</text>
<text x="904" y="225" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">공격은 LB 에서 끝나고 VM 은 남습니다</text>
<rect x="232" y="260" width="688" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="248" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">호스트 방화벽 · netfilter</text>
<text x="248" y="305" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">iptables -A INPUT ... -j DROP</text>
<text x="904" y="297" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Wireshark 의 Firewall ACL Rules 가 만들어 줍니다</text>
<rect x="232" y="332" width="688" height="60" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="248" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">커널 TCP/IP 스택 · sysctl</text>
<text x="248" y="377" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">tcp_syncookies · tcp_synack_retries · icmp_echo_ignore_all</text>
<text x="904" y="369" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">원문의 손잡이가 모여 있는 층입니다</text>
<rect x="232" y="404" width="688" height="60" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="248" y="428" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">애플리케이션</text>
<text x="248" y="449" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">타임아웃 · 동시 접속 상한</text>
<text x="904" y="441" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">여기까지 왔다면 이미 늦습니다</text>
<path d="M 196 124 L 196 460" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="180" y="136" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바깥</text>
<text x="180" y="456" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">안쪽</text>
<text x="24" y="290.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">막는 자리가</text>
<text x="24" y="306.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">아래로 갈수록</text>
<text x="24" y="322.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">쓰는 자원이 늡니다</text>
<line x1="12" y1="484" x2="928" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="506" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="496" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원문의 손잡이가 있는 층</text>
<rect x="313" y="496" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="335" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이미 늦은 층</text>
</svg>
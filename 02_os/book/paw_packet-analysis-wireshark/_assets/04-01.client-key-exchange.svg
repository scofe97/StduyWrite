<title id="dt">같은 메시지, 안에 실리는 것은 정반대</title><desc id="dd">TLS 1.2 최초 전체 핸드셰이크에서 ClientKeyExchange 에 실리는 것은 정적 RSA 에서는 클라이언트가 만든 비밀의 암호문이고, DHE·ECDHE에서는 비밀이 아니라 클라이언트의 공개값이다. 앞의 것은 서버가 개인키로 풀어 얻고, 뒤의 것은 양쪽이 각자 계산해 같은 값에 도달한다.</desc>
<rect width="960" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 메시지, 안에 실리는 것은 정반대</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">TLS 1.2: RSA 는 암호화한 비밀을 보내고, DHE·ECDHE 는 공개값으로 같은 비밀을 계산합니다</text>
<text x="152" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">클라이언트가 한 일</text>
<text x="456" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">ClientKeyExchange 에 실리는 것</text>
<text x="776" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">서버가 하는 일</text>
<text x="24" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">A · 정적 RSA</text>
<rect x="28.0" y="190.0" width="248" height="84" rx="8" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="152" y="222.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">비밀을 직접 만듦</text>
<text x="152" y="246.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">pre_master_secret</text>
<rect x="332.0" y="190.0" width="248" height="84" rx="8" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="456" y="222.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">비밀의 암호문</text>
<text x="456" y="246.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버 RSA 공개키로 암호화</text>
<rect x="652.0" y="190.0" width="248" height="84" rx="8" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="776" y="222.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">개인키로 풀어 꺼냄</text>
<text x="776" y="246.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">받은 값이 곧 비밀</text>
<path d="M 276.0 232 L 324.0 232" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 580.0 232 L 644.0 232" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="24" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">B · DHE · ECDHE</text>
<rect x="28.0" y="354.0" width="248" height="84" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="152" y="386.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">임시 키 쌍을 만듦</text>
<text x="152" y="410.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">비밀은 안 보냄</text>
<rect x="332.0" y="354.0" width="248" height="84" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="456" y="386.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">공개값만</text>
<text x="456" y="410.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이것만으로는 비밀이 안 나옴</text>
<rect x="652.0" y="354.0" width="248" height="84" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="776" y="386.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">자기 임시 키로 계산</text>
<text x="776" y="410.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">양쪽이 각자 도달</text>

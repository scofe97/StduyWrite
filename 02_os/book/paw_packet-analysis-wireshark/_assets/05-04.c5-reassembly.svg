<title id="dt">C5 — 재조립이 바꾸는 http.time 의 끝점</title><desc id="dd">같은 캡처를 두 번 읽는다. 재조립을 끄면 200 OK 가 첫 조각에 찍혀 첫 바이트까지를 재고, 켜면 마지막 조각에 찍혀 마지막 바이트까지를 잰다. 조각 45개는 어느 쪽에서도 남는다.</desc>
<rect width="920" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-04 C5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">C5 — 재조립이 바꾸는 http.time 의 끝점</text>

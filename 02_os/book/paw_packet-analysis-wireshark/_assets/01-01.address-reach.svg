<title id="dt">주소 종류가 정하는 도착 범위</title><desc id="dd">같은 스위치에 붙은 장비 B · 나(분석기) · 그룹 가입자 C 에게 프레임이 복사되는 범위. 유니캐스트는 목적지 포트로만, 브로드캐스트는 모든 포트로 간다. 멀티캐스트는 IGMP 스누핑이 없으면 모든 포트로, 있으면 가입 포트로만 가되 224.0.0.x 대역은 모든 포트로 간다.</desc>

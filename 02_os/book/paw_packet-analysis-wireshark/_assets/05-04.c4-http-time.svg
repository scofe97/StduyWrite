<title id="dt">C4 — http.time 이 재는 구간</title><desc id="dd">연결 하나에 요청 셋이 실린다. http.time 은 요청 프레임에서 짝이 되는 응답 프레임까지이고, 앞의 3-way 는 어느 요청의 값에도 들어가지 않는다.</desc>

<title id="dt">DNS 레코드 타입을 쓰임새로</title><desc id="dd">원문이 dig·nslookup 예제로 드는 레코드 타입을 네 갈래로 묶은 것. 무엇을 알고 싶은지가 정해지면 타입이 정해지고, 타입이 정해지면 필터가 정해진다.</desc>

<title id="dt">캡처 필터가 버린 패킷은 어떤 필터로도 되살릴 수 없습니다</title><desc id="dd">02-01 의 키워드 개념도. 윗줄은 인터페이스 목록에서 이름으로 인터페이스를 고르고 Capture Options 로 받을 프레임을 정하는 흐름이다. 가운데 줄은 캡처 필터가 커널에서 통과한 프레임만 파일로 보내고, 오래 잡을 때는 duration 과 files 조건으로 파일을 나누는 흐름이다. 아랫줄은 Wireshark 가 없는 서버에서 tcpdump -w 로 파일을 뜨는 길과, 안 보일 때 인터페이스 목록 유무로 권한과 모드를 가르는 길이다.</desc>
<rect width="920" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 02-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">캡처 필터가 버린 패킷은 어떤 필터로도 되살릴 수 없습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>
<rect x="16.36" y="130.0" width="35.28" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="34" y="144.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§1~3</text>
<rect x="16.36" y="258.0" width="35.28" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="34" y="272.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§4~5</text>
<rect x="16.36" y="386.0" width="35.28" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="34" y="400.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§6~7</text>
<rect x="64" y="112" width="208" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="168.0" y="139" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">인터페이스 목록</text>
<text x="168.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">네 입구 · 한 화면</text>

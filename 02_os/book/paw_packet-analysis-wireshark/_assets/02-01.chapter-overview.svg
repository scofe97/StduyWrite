<title id="dt">패킷을 잡는 법 — 읽는 순서</title><desc id="dd">2장 캡처 축 노트의 절 일곱을 캡처가 실제로 진행되는 순서로 이은 지도. 시작 화면에서 출발해 인터페이스와 옵션을 지나 필터·파일 분할로 가고, GUI 가 없는 환경과 안 잡힐 때로 닫는다.</desc>
<rect width="880" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">패킷을 잡는 법 — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">네 번째 칸이 이 편의 중심입니다 — 여기서 버린 패킷은 뒤에서 되살릴 수 없습니다</text>
<path d="M 424 152.0 L 444 152.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 648.0 192 V 208 H 224.0 V 220" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

<title id="dt">인증서 발급 세 걸음 — 어느 파일이 누구 손에 놓이는가</title><desc id="dd">CA 가 자기 키 쌍과 자기 서명 인증서를 만들고, 서버가 자기 키 쌍과 CSR 을 만든다. CSR 만 CA 로 건너가 CA 개인키로 서명을 받아 서버 인증서가 되어 돌아온다. 클라이언트는 CA 인증서를 미리 갖고 있다가 핸드셰이크에서 받은 서버 인증서의 CA 서명을 검증한다. 개인키 둘은 어느 경계도 넘지 않는다.</desc>
<rect width="960" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인증서 발급 세 걸음 — 어느 파일이 누구 손에 놓이는가</text>

<title id="dt">검증을 통과한 BPF 필터라면</title><desc id="dd">붙일 때 검증을 통과한 필터는 모든 분기가 앞으로만 가고 ret 명령에서 끝난다. 필터가 끝나면 드라이버가 제어를 돌려받아 프레임을 프로토콜 스택으로 넘기고, 받아들인 사본은 캡처 버퍼를 거쳐 dumpcap 으로 간다.</desc>

<title id="dt">ZeroWindow 가 생기는 자리</title><desc id="dd">세그먼트가 수신 버퍼에 쌓이는 속도가 애플리케이션이 읽어 가는 속도보다 빠르면 버퍼가 찬다. 그때 수신자가 윈도우 0 을 광고하고 송신자는 멈춘다.</desc>

<title id="dt">중복 ACK 이 몰린 6초 칸</title><desc id="dd">문서용 주소로 만든 10초짜리 내려받기 캡처를 1초 간격으로 센 값. 모든 프레임(Graph1)은 평소 4프레임에서 6초 칸에 22프레임으로 뛰고, 같은 칸에서 tcp.analysis.duplicate_ack(Graph2)가 0 에서 10 으로 솟는다.</desc>

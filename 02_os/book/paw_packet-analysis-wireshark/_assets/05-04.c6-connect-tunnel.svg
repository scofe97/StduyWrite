<title id="dt">C6 — 평문 POST 와 CONNECT 터널</title><desc id="dd">폼 값은 평문 HTTP 에 그대로 실린다. 프록시 경유 HTTPS 는 CONNECT 와 200 이 평문이고, 터널은 바이트만 옮기므로 그 안의 ClientHello 도 평문이다. 가리는 것은 그 뒤의 TLS 다.</desc>

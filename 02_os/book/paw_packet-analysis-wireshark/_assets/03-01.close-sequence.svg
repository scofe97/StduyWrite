<title id="dt">종료는 네 번 오갑니다</title><desc id="dd">normal-connection.pcap 의 packet#5·7·8·9. 서버가 먼저 FIN 을 보내 능동 종료가 되고, 클라이언트는 ACK 를 보낸 뒤 자기 FIN 을 보낼 때까지 CLOSE_WAIT 에 머무른다.</desc>

<title id="dt">종료는 네 번 오갑니다</title><desc id="dd">normal-connection.pcap 의 packet#5·7·8·9. 서버가 먼저 FIN 을 보내 능동 종료가 되고, 클라이언트는 #7 로 ACK 를 보낸 뒤 애플리케이션이 close() 를 불러 #8 이 나갈 때까지 CLOSE_WAIT 에 머무른다. 번호는 모두 원문 종료 절의 패킷 목록 스크린샷에 찍힌 값이다.</desc>

<title id="dt">Client Hello 가 내밀고 Server Hello 가 고른다</title><desc id="dd">TLS 1.2 기준으로 필드 셋이 ClientHello 에서 ServerHello 로 건너가며 어떻게 줄어드는지 그렸다. 버전은 클라이언트가 원하는 가장 높은 값 하나와 서버의 최고 버전 중 낮은 쪽이 되고, cipher suite 는 선호 순 목록에서 하나가 되며, 확장은 제안된 것 안에서 응답할 것만 돌아온다. 고를 cipher suite 가 없으면 서버는 handshake_failure Alert 로 끝낸다.</desc>
<rect width="960" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Client Hello 가 내밀고 Server Hello 가 고른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">TLS 1.2 · 목록이 하나로 줄어드는 것은 cipher suite 입니다</text>

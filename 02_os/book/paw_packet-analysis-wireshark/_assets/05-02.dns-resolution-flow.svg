<title id="dt">이름 하나가 풀리는 길</title><desc id="dd">클라이언트 PC 안에서 앱이 stub 리졸버에 이름을 넘기면(1), stub 은 캡처 지점을 지나 재귀 리졸버에 RD=1 질의를 보낸다(2). 재귀 리졸버는 캐시를 먼저 보고(3), 없으면 루트, TLD, 권한 서버를 차례로 물어 위임을 따라간다(4). 권한 서버의 답은 TTL 동안 캐시에 남고, 재귀 리졸버는 RA=1 응답을 돌려준다(5). 클라이언트 캡처에 찍히는 것은 2와 5뿐이다.</desc>
<rect width="960" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름 하나가 풀리는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">클라이언트 PC 에서 잡으면 2 와 5 만 보이고, 4 는 재귀 리졸버 너머에서 오갑니다</text>

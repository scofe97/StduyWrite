<title id="dt">TCP 연결의 상태 전이</title><desc id="dd">원문이 표로 적은 상태 전이를 한 장으로 이은 것. 윗줄이 연결을 여는 경로이고, 아래 두 줄이 닫는 경로다. 먼저 FIN 을 보낸 쪽과 받은 쪽이 서로 다른 상태를 지난다.</desc>
<rect width="1000" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 03-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TCP 연결의 상태 전이</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">닫는 경로가 둘로 갈립니다 — 누가 먼저 FIN 을 보냈는지가 그 갈림길입니다</text>
<path d="M 280 146.0 L 300 146.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="292.0" y="108" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">SYN 송신</text>
<path d="M 512 146.0 L 532 146.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="524.0" y="108" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">SYN,ACK 수신</text>
<path d="M 592.0 172 L 592.0 220 L 176.0 220 L 176.0 260" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="408.0" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">내가 먼저 FIN 송신</text>
<path d="M 280 290.0 L 300 290.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="292.0" y="252" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">ACK 수신</text>
<path d="M 512 290.0 L 532 290.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="524.0" y="252" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">FIN 수신 · ACK 송신</text>
<path d="M 744 290.0 L 764 290.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="756.0" y="252" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2×MSL 경과</text>
<path d="M 688.0 172 L 688.0 244 L 36 244 L 36 434.0 L 68 434.0" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="168" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">상대가 먼저 FIN 송신</text>
<path d="M 280 434.0 L 300 434.0" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="292.0" y="396" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">FIN 송신</text>
<path d="M 512 434.0 L 532 434.0" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="524.0" y="396" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">ACK 수신</text>
<rect x="72" y="120" width="208" height="52" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="176.0" y="142" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">CLOSED</text>
<text x="176.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원문이 "가상의 상태"라 적습니다</text>
<rect x="304" y="120" width="208" height="52" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="408.0" y="142" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">SYN_SENT</text>
<text x="408.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클라이언트가 연결을 시작했습니다</text>
<rect x="536" y="120" width="208" height="52" rx="8" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="640.0" y="142" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">ESTABLISHED</text>
<text x="640.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터를 주고받습니다</text>
<rect x="72" y="264" width="208" height="52" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="176.0" y="286" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">FIN_WAIT-1</text>
<text x="176.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소켓을 닫았습니다</text>
<rect x="304" y="264" width="208" height="52" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="408.0" y="286" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">FIN_WAIT-2</text>
<text x="408.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">상대의 FIN 을 기다립니다</text>
<rect x="536" y="264" width="208" height="52" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="640.0" y="286" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">TIME_WAIT</text>
<text x="640.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">2×MSL 동안 머무릅니다</text>
<rect x="768" y="264" width="208" height="52" rx="8" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="872.0" y="286" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">CLOSED</text>
<text x="872.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">능동 종료 끝</text>
<rect x="72" y="408" width="208" height="52" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="176.0" y="430" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">CLOSE_WAIT</text>
<text x="176.0" y="448" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">애플리케이션이 안 닫았습니다</text>
<rect x="304" y="408" width="208" height="52" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="408.0" y="430" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">LAST_ACK</text>
<text x="408.0" y="448" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">마지막 ACK 를 기다립니다</text>
<rect x="536" y="408" width="208" height="52" rx="8" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="640.0" y="430" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">CLOSED</text>
<text x="640.0" y="448" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수동 종료 끝</text>
<text x="792" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">능동 종료</text>
<text x="792" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">= 먼저 FIN 을 보낸 쪽</text>
<text x="792" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">수동 종료</text>
<text x="792" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">= FIN 을 받은 쪽</text>
<line x1="12" y1="496" x2="952" y2="496" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="518" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="508" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">애플리케이션이 안 닫으면 갇힙니다</text>
<rect x="378" y="508" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="400" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 종점</text>
<rect x="487" y="508" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="509" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수동 종료 경로</text>
</svg>
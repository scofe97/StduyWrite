<title id="dt">A3 — 답이 없을 때 DISCOVER 만 반복</title><desc id="dd">서버의 dnsmasq 를 멈춘 채 클라이언트가 주소를 요청한다. 같은 트랜잭션 ID 의 DISCOVER 가 약 2초 간격으로 네 번 나가고 답은 한 줄도 없다. 꺼진 서버는 없다는 사실을 알릴 수단이 없으므로, 클라이언트가 횟수와 시간이 다 지난 것으로 실패를 판단한다.</desc>

<text x="291.0" y="307" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">200 Connection established</text>
<text x="291.0" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">평문 · 여기부터 터널</text>
<rect x="474.0" y="348" width="189.2" height="24" rx="4" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="568.6" y="365" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">터널 · 바이트를 그대로 넘김</text>
<path d="M 134.0 412 L 780.0 412" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>

<title id="dt">CONNECT 뒤를 가리는 것은 터널이 아니라 TLS</title><desc id="dd">클라이언트가 프록시에게 CONNECT example.com:443 을 평문으로 보내고 200 을 받는다. 그 뒤로 프록시는 받은 바이트를 바꾸지 않고 넘기기만 하고, 그 안으로 TLS 1.2 핸드셰이크가 지나간다. ClientHello 와 SNI, ServerHello 와 인증서는 평문이고 ChangeCipherSpec 다음부터 암호화된다.</desc>
<rect width="940" height="720" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">CONNECT 뒤를 가리는 것은 터널이 아니라 TLS</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">CONNECT 는 프록시에게, SNI 는 서버에게 하는 말입니다 — 캡처는 클라이언트와 프록시 사이에서 떴습니다</text>
<rect x="24.0" y="104" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="124.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="124.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9"></text>
<rect x="358.0" y="104" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="458.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">프록시</text>
<text x="458.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9"></text>
<rect x="692.0" y="104" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="792.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서버</text>
<text x="792.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9"></text>
<text x="124.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">curl</text>
<text x="458.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">127.0.0.1:3128</text>
<text x="792.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">example.com:443</text>
<rect x="144.0" y="164" width="286.0" height="488" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="152.0" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">캡처한 구간</text>
<line x1="124.0" y1="154" x2="124.0" y2="652" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>

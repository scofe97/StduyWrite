<text x="291.0" y="507" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">ClientKeyExchange · CCS</text>
<text x="291.0" y="534" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CCS 는 평문 · 다음 Finished 부터 보호</text>
<path d="M 782.0 568 L 136.0 568" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)" stroke-dasharray="5 4"/>
<text x="291.0" y="559" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">CCS · Finished</text>
<text x="291.0" y="586" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Finished 부터 암호화</text>

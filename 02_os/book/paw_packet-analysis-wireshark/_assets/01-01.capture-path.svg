<title id="dt">분석기가 가로채는 층</title><desc id="dd">받은 프레임이 NIC 드라이버 위에서 두 갈래로 올라가는 다섯 층. 왼쪽 정상 경로는 커널 프로토콜 스택이 헤더를 벗긴 뒤 소켓 API 로 올리고, 오른쪽 분석기 경로는 그 아래 패킷 소켓 · BPF 에서 프레임 사본을 받아 libpcap 과 dumpcap 을 거쳐 GUI · tshark 로 간다.</desc>
<rect width="880" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 01-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">분석기가 가로채는 층</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽이 애플리케이션이 받는 길, 오른쪽이 분석기가 받는 길입니다 — 둘은 프로토콜 스택보다 아래에서 갈라집니다</text>

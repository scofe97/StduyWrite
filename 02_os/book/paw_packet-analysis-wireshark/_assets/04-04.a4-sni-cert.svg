<title id="dt">A4 · SNI 가 인증서를 고른다</title><desc id="dd">접속 주소와 포트는 a.test:4433 하나로 같고 ClientHello 의 SNI 만 a.test·b.test 로 바꾼다. 서버는 그 이름으로 내보낼 인증서를 고르고, cipher suite 은 두 연결이 같다.</desc>
<rect width="880" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-04 A4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">A4 · SNI 가 인증서를 고른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">인증서를 고를 이름은 암호화 전에 와야 하므로 SNI 는 평문입니다</text>
<rect x="24" y="108" width="480" height="264" rx="8" fill="#6A95D80a" stroke="#6A95D8" stroke-width="1.0"/>
<text x="40" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">암호화 시작 전 · 평문</text>

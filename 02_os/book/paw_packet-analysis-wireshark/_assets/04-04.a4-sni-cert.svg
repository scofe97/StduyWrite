<text x="136" y="238" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">ClientHello</text>
<text x="136" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">-servername 만 바꿈</text>
<path d="M 236 248 L 268 248" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<polygon points="380,204 488,248 380,292 272,248" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="380" y="253" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">SNI 값</text>
<path d="M 488 248 L 536 248 L 536 180 L 596 180" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 536 248 L 536 316 L 596 316" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="544" y="172" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">a.test</text>
<text x="544" y="336" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">b.test</text>
<rect x="600.0" y="144" width="256" height="72" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>

<title id="dt">재조립은 http.time 의 끝점을 옮긴다</title><desc id="dd">같은 캡처 파일을 재조립 켬과 끔으로 연 결과를 도착 시각 한 줄 위에 겹친다. 조각 15개는 두 설정에서 똑같이 같은 시각에 도착한다. 끄면 첫 조각 #7 에 HTTP 응답 줄이 붙어 http.time 이 32.352ms 에서 끝나고, 켜면 조각을 다 모은 마지막 조각 #33 에 붙어 32.929ms 에서 끝난다. 차이 0.577ms 는 본문 조각이 전송된 시간이다.</desc>
<rect width="960" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">재조립은 http.time 의 끝점을 옮긴다</text>

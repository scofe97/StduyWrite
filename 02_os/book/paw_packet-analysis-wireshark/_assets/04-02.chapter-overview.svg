<title id="dt">인증서와 두 서명 — 읽는 순서</title><desc id="dd">핸드셰이크 한 번에 서명이 두 번 나온다. 인증서 안의 CA 서명과 ServerKeyExchange 의 서버 서명을 먼저 가르고, 뒤의 서명이 빠졌을 때 무엇이 뚫리는지 본다. 그다음 그 인증서가 만들어지는 세 걸음을 따라가고, 마지막으로 장기 키와 세션 키의 수명을 가른다.</desc>
<rect width="880" height="400" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인증서와 두 서명 — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">TLS 1.2 인증서 기반 핸드셰이크를 기준으로 읽습니다</text>
<rect x="24" y="116" width="400" height="80" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="44" y="148" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">§1</text>
<text x="80" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">서명이 둘인데 이름이 하나</text>
<text x="80" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">주인 보증과 소유 증명</text>
<rect x="448" y="116" width="400" height="80" rx="8" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="468" y="148" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">§2</text>
<text x="504" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">서명을 빼면 뚫리는 자리</text>
<text x="504" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">인증서는 통과 · 값만 교체</text>
<rect x="24" y="228" width="400" height="80" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">§3</text>
<text x="80" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">인증서는 어떻게 만들어지는가</text>
<text x="80" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">키 · CSR · 서명 세 걸음</text>
<rect x="448" y="228" width="400" height="80" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="468" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">§4</text>
<text x="504" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">같은 키 파일과 매번 새 키</text>
<text x="504" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">장기 키와 세션 키의 수명</text>
<path d="M 424 156.0 L 442 156.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 648.0 196 L 648.0 212 L 224.0 212 L 224.0 222" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 424 268.0 L 442 268.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="24" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">범위: TLS 1.2 인증서 기반 · TLS 1.3 은 CertificateVerify 로 자리가 옮겨감</text>
<line x1="12" y1="360" x2="832" y2="360" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="382" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="372" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 편의 중심</text>
<rect x="235" y="372" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="257" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서명이 없을 때</text>

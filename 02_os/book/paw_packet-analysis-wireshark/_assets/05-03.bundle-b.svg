<title id="dt">묶음 B — 어긋나는 경우들</title><desc id="dd">서버 둘이 제안하는 자리, 줄 수 없는 주소를 요청해 NAK 을 받는 자리, 풀이 빈 서버, 남이 먼저 쓰는 주소를 서버와 클라이언트가 각각 걸러내는 자리, 라우터 너머의 릴레이를 차례로 만든다.</desc>

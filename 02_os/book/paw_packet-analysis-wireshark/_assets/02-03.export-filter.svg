<title id="dt">필터가 고른 프레임만 새 파일에 들어갑니다</title><desc id="dd">두 HTTP 연결이 섞인 원본 19 프레임에서, 200 응답 필터는 재조립 결과가 얹힌 10번 한 프레임만 새 파일에 쓰고 응답 머리인 9번은 남긴다. 스트림 번호 필터는 0번 연결의 10 프레임을 모두 쓴다.</desc>

<title id="dt">공개값만 건너가고 비밀값은 남습니다</title><desc id="dd">양쪽이 각자 고른 비밀값은 자기 쪽에 머물고, 선을 건너는 것은 공개값 둘뿐이다. 그 둘을 다 본 도청자도 양쪽이 계산해 낸 같은 값에는 도달하지 못한다.</desc>

<title id="dt">원문 필터에 0줄일 때</title><desc id="dd">트래픽은 오가는데 http 나 dns 필터에 아무것도 안 잡힐 때의 판단. http 는 UDP 443 이면 QUIC, 복호화 전이면 TLS 레코드만, 복호화했는데도 0줄이면 HTTP/2 를 의심한다. dns 는 853 연결이 있으면 DoT, 없으면 443 에 섞인 DoH 나 캐시를 의심한다.</desc>
<rect width="880" height="736" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-02 DEEP DIVE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">원문 필터에 0줄일 때</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">필터가 비었다고 트래픽이 없는 것이 아닙니다 — 버전과 암호화가 필터 이름을 바꿉니다</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">HTTP</text>

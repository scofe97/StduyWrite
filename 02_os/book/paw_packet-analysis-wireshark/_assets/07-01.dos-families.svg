<title id="dt">서비스를 무너뜨리는 네 갈래</title><desc id="dd">원문 7장이 다루는 DoS 갈래를 결과 하나 아래 모은 것. 갈래마다 캡처에서 읽히는 근거가 다르고, 강조한 갈래는 원문의 예제 캡처가 실제로 확인해 주는 하나다.</desc>
<rect width="1000" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 07-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서비스를 무너뜨리는 네 갈래</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">겨냥하는 층은 넷 다 다르지만 남기는 결과는 같습니다</text>
<path d="M 120 300 L 776 300" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="588" y1="300" x2="524" y2="188" stroke="#8B98A9" stroke-width="1.1"/>
<line x1="566.6666666666666" y1="262.6666666666667" x2="534.6666666666666" y2="262.6666666666667" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="530.6666666666666" y="256.6666666666667" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">반쪽 연결이 쌓임</text>
<line x1="545.3333333333334" y1="225.33333333333334" x2="513.3333333333334" y2="225.33333333333334" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="509.33333333333337" y="219.33333333333334" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">FIN·PUSH 가 0</text>
<line x1="456" y1="300" x2="392" y2="412" stroke="#F08A59" stroke-width="1.4"/>
<line x1="434.6666666666667" y1="337.3333333333333" x2="402.6666666666667" y2="337.3333333333333" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="398.6666666666667" y="351.3333333333333" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">echo reply 가 없음</text>
<line x1="413.3333333333333" y1="374.66666666666663" x2="381.3333333333333" y2="374.66666666666663" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="377.3333333333333" y="388.66666666666663" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한 방향 대화 하나</text>
<line x1="324" y1="300" x2="260" y2="188" stroke="#8B98A9" stroke-width="1.1"/>
<line x1="302.6666666666667" y1="262.6666666666667" x2="270.6666666666667" y2="262.6666666666667" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="266.6666666666667" y="256.6666666666667" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 트래픽과 닮음</text>
<line x1="281.3333333333333" y1="225.33333333333334" x2="249.33333333333331" y2="225.33333333333334" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="245.33333333333331" y="219.33333333333334" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">비용이 서버로 쏠림</text>
<line x1="192" y1="300" x2="128" y2="412" stroke="#8B98A9" stroke-width="1.1"/>
<line x1="170.66666666666666" y1="337.3333333333333" x2="138.66666666666666" y2="337.3333333333333" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="134.66666666666666" y="351.3333333333333" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">출발지가 위조됨</text>
<line x1="149.33333333333334" y1="374.66666666666663" x2="117.33333333333334" y2="374.66666666666663" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="113.33333333333334" y="388.66666666666663" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공개 서버가 대신</text>
<rect x="436" y="170" width="176" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="524" y="187" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">L4 · SYN 홍수</text>
<text x="524" y="202" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">tcp.flags.syn</text>
<rect x="304" y="394" width="176" height="36" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="392" y="411" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">L3 · ICMP 홍수</text>
<text x="392" y="426" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">icmp</text>
<rect x="172" y="170" width="176" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="260" y="187" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">L7 · SSL 홍수</text>
<text x="260" y="202" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">tls</text>
<rect x="40" y="394" width="176" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="128" y="411" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">반사·증폭 · DrDoS</text>
<text x="128" y="426" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">udp</text>
<rect x="780" y="268" width="200" height="64" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="880" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">서버가 더 이상</text>
<text x="880" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">요청을 받지 못합니다</text>
<line x1="12" y1="452" x2="952" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="474" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="464" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원문 캡처가 확인한 갈래</text>
<rect x="313" y="464" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="335" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">장이 함께 다루는 갈래</text>

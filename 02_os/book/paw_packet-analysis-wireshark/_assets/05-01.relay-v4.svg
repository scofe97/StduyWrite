<title id="dt">릴레이가 브로드캐스트를 대신 전달한다</title><desc id="dd">세그먼트 A 의 클라이언트가 보낸 DISCOVER 브로드캐스트는 라우터에서 멈춘다. 라우터의 릴레이 에이전트가 giaddr 에 자기 주소를 적어 세그먼트 B 의 서버로 유니캐스트하고, 서버는 giaddr 로 응답해 릴레이가 클라이언트에게 내려 준다.</desc>

<title id="dt">A5 — DHCPv6 의 네 걸음과 두 걸음</title><desc id="dd">위는 기본 SARR 네 걸음과 반납, 아래는 rapid commit 두 걸음이다. 클라이언트는 링크 로컬 주소에서 멀티캐스트 ff02::1:2 로 보내 옆자리에도 찍히고, 서버의 ADVERTISE·REPLY 는 유니캐스트라 dhclient 로그에만 남는다. IPv4 와 달리 걸음마다 트랜잭션 ID 가 새로 매겨진다.</desc>
<rect width="940" height="672" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-03 A5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">A5 — DHCPv6 의 네 걸음과 두 걸음</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">브로드캐스트 자리를 멀티캐스트 ff02::1:2 가 대신합니다</text>
<rect x="100.0" y="104" width="200" height="44" rx="6" fill="#161B22" stroke="#F5F5F3" stroke-width="1.4"/>
<text x="200" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">옆자리</text>
<text x="200" y="140" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">dhcp-neighbor</text>
<rect x="165.5" y="158" width="69.0" height="20" rx="4" fill="#0D1117" stroke="#F5F5F3" stroke-width="0.8"/>
<text x="200" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">캡처 지점</text>
<rect x="380.0" y="104" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="480" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="480" y="140" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">dhclient -6</text>

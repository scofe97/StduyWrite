<title id="dt">IGMP 스누핑 — 가입 보고를 엿봐 가입 포트로만</title><desc id="dd">같은 스위치에 장비 B · 나(분석기) · 그룹 가입자 C 가 붙어 있다. 스누핑이 없으면 그룹 239.1.1.1 의 프레임이 세 포트 모두에 복사된다. 스누핑을 켜면 C 가 라우터에게 보내는 IGMP 가입 보고를 스위치가 엿봐 C 포트를 기록하고, 그 뒤 그룹 프레임을 C 포트로만 보낸다.</desc>
<rect width="880" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 01-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">IGMP 스누핑 — 가입 보고를 엿봐 가입 포트로만</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">스누핑이 없으면 스위치는 가입자를 몰라 멀티캐스트를 모든 포트로 복사합니다</text>

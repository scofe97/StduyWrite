<title id="dt">B1 — 두 제안을 REQUEST 하나가 정리</title><desc id="dd">두 서버가 각각 .137 과 .207 을 제안하고, 클라이언트는 옵션 54 에 첫째 서버를 적은 REQUEST 를 브로드캐스트한다. 둘째 서버는 그 REQUEST 를 듣고도 아무것도 보내지 않으며 임대 기록도 남기지 않는다. 첫째 서버의 OFFER·ACK 는 클라이언트 MAC 앞 유니캐스트라 둘째 서버 캡처에 없다.</desc>

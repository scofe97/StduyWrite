<title id="dt">A1 · 서버는 1순위를 고르지 않는다</title><desc id="dd">ClientHello 가 묶음 28개를 제안하고 1순위는 ECDHE_ECDSA 계열이다. 서버 인증서가 RSA 키라 ECDSA 서명을 할 수 없어, 서버는 그 계열을 건너뛰고 0xc030 을 고른다.</desc>

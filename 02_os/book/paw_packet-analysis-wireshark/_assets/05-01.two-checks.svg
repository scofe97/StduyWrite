<title id="dt">확인은 두 번, 두 장치가 나눠 한다</title><desc id="dd">서버는 OFFER 전에 ICMP 로 주소 X 를 확인하지만 이 확인은 끌 수 있다. 클라이언트는 ACK 뒤 ARP 요청을 브로드캐스트하고, 서버 장부에 없는 수동 설정 장비가 직접 응답하면 DECLINE 을 보낸 뒤 찾기부터 다시 한다.</desc>

<title id="dt">거부와 차단은 선 위에서 갈립니다</title><desc id="dd">위는 그 포트에 LISTEN 이 없어 첫 SYN 에 곧바로 RST 가 돌아오는 경우이고, 아래는 방화벽이 조용히 버려 아무것도 돌아오지 않는 경우다. 아래쪽에서 SYN 을 되풀이하는 주체는 애플리케이션이 아니라 커널이다.</desc>
<rect width="920" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 03-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">거부와 차단은 선 위에서 갈립니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">돌아오는 것이 RST 인가 아무것도 없는가 — 애플리케이션 로그로는 못 가릅니다</text>

<title id="dt">한 캡처의 프로토콜 계층</title><desc id="dd">원문 스크린샷의 값을 그대로 옮긴 것. 총 166,495 프레임이 이더넷에서 시작해 갈라지며, 백분율은 전체 프레임 대비다. 눈에 걸리는 것은 UDP 의 절반 가까이를 차지한 한 줄이다.</desc>

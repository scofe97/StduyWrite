<title id="dt">Alert 번호가 원인의 층을 나눈다</title><desc id="dd">alert 번호는 임의의 식별자가 아니라 구간으로 묶여 있다. 낮은 쪽은 프로토콜 형식과 MAC, 가운데는 핸드셰이크와 인증서, 높은 쪽은 정책과 버전이다. 번호 구간만 봐도 어느 축을 볼지가 정해진다. 심각도는 이 구간과 다른 축이라 항목마다 따로 표시했다.</desc>
<rect width="960" height="800" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Alert 번호가 원인의 층을 나눈다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">번호를 외우지 않아도 구간이 볼 곳을 정해 줍니다</text>

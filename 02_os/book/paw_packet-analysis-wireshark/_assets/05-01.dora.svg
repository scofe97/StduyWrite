<text x="742.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서버</text>
<text x="742.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">UDP 67</text>
<line x1="174.0" y1="154" x2="174.0" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="742.0" y1="154" x2="742.0" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 184.0 200 L 730.0 200" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="458.0" y="191" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">DISCOVER</text>
<text x="458.0" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">option.dhcp==1 · 255.255.255.255 브로드캐스트 · yiaddr 0.0.0.0</text>
<path d="M 732.0 264 L 186.0 264" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="458.0" y="255" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">OFFER</text>
<text x="458.0" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">option.dhcp==2 · yiaddr 10.0.0.106 · 옵션 54 서버 식별자</text>
<path d="M 184.0 328 L 730.0 328" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="458.0" y="319" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">REQUEST</text>
<text x="458.0" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">option.dhcp==3 · 다시 브로드캐스트 · 옵션 54 로 서버를 지목합니다</text>
<path d="M 732.0 392 L 186.0 392" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>

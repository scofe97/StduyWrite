<text x="458.0" y="408" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">option.dhcp==5 · yiaddr 10.0.0.106 확정 · 바인딩을 저장합니다</text>
<rect x="126.5" y="422" width="95.0" height="20" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>

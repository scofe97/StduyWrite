<title id="dt">DORA — IPv4 쪽의 네 메시지</title><desc id="dd">DHCPv4 의 네 메시지 교환. 클라이언트는 아직 주소가 없어 브로드캐스트로 보내고, yiaddr 필드가 0.0.0.0 에서 실제 주소로 채워지는 과정이 이 흐름의 뼈대다.</desc>
<rect width="940" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">DORA — IPv4 쪽의 네 메시지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">yiaddr 필드 하나만 좇아도 어느 단계까지 갔는지가 보입니다</text>
<rect x="24.0" y="104" width="300" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

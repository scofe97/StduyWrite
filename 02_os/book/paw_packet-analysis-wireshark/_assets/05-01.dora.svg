<path d="M 184.0 470 L 232.0 470 L 232.0 490 L 187.0 490" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="242.0" y="476" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">이미 쓰이는 주소면 DECLINE</text>
<text x="242.0" y="493" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정 과정을 처음부터 다시 시작합니다</text>

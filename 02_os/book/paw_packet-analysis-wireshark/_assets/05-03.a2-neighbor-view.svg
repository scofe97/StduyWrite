<title id="dt">A2 — 옆자리 캡처에 남은 세 줄</title><desc id="dd">A1 의 교환 일곱 줄 가운데 옆자리 캡처에 남은 것은 DISCOVER 둘과 REQUEST 하나, 모두 브로드캐스트다. 클라이언트 MAC 앞으로 간 ICMP·OFFER·ACK 와 받은 주소로 나간 ping 은 스위치가 옆자리 포트로 보내지 않아 없다.</desc>

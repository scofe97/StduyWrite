<title id="dt">베낀 인증서와 바꾼 공개키는 서로 다른 자리에서 막힌다</title><desc id="dd">공격자가 할 수 있는 일은 둘이다. 인증서를 그대로 복사하면 서명 검증은 통과하지만 짝이 되는 개인키가 없어, 정적 RSA 에서는 비밀을 풀지 못하고 인증된 ECDHE 에서는 키 교환 파라미터에 서명하지 못한다. 공개키를 자기 것으로 바꾸면 CA 서명이 맞지 않아 첫 검사에서 거절되고 뒤 검사까지 가지 않는다.</desc>
<rect width="960" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">베낀 인증서와 바꾼 공개키는 서로 다른 자리에서 막힌다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">복사하면 개인키가 없고, 바꾸면 CA 서명이 맞지 않습니다</text>
<text x="392" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">처음 갈리는 자리</text>
<path d="M 296.0 156 L 296.0 148 L 488.0 148 L 488.0 156" fill="none" stroke="#F08A59" stroke-width="1.4"/>
<text x="144" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">공격자가 한 일</text>
<text x="392" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">규칙 1 · 인증서 서명 검증</text>
<text x="624" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">규칙 2 · 개인키가 필요한 일</text>
<text x="844" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">결과</text>
<path d="M 260.0 248 L 288.0 248" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 260.0 400 L 288.0 400" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 488.0 248 L 520.0 248" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 720.0 248 L 736.0 248 L 736.0 212 L 748.0 212" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<path d="M 720.0 248 L 736.0 248 L 736.0 284 L 748.0 284" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<path d="M 488.0 400 L 504.0 400 L 504.0 456.0 L 844 456.0 L 844 440.0" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="624" y="476.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">뒤 검사로 가지 않음</text>
<rect x="28.0" y="216.0" width="232" height="64" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="144" y="244.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">인증서를 그대로 복사</text>
<text x="144" y="264.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">원본 바이트 그대로</text>
<rect x="296.0" y="216.0" width="192" height="64" rx="8" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="392" y="244.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">통과</text>
<text x="392" y="264.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서명이 원본 그대로</text>
<rect x="528.0" y="216.0" width="192" height="64" rx="8" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="624" y="244.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">실패</text>
<text x="624" y="264.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">짝이 되는 개인키 없음</text>
<rect x="756.0" y="184.0" width="176" height="56" rx="8" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="844" y="208.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">정적 RSA</text>
<text x="844" y="228.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">비밀을 풀 수 없음</text>
<rect x="756.0" y="256.0" width="176" height="56" rx="8" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="844" y="280.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">인증된 ECDHE</text>
<text x="844" y="300.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서명을 만들 수 없음</text>
<rect x="28.0" y="368.0" width="232" height="64" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="144" y="396.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">공개키를 자기 것으로 교체</text>
<text x="144" y="416.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">개인키는 공격자 것</text>
<rect x="296.0" y="368.0" width="192" height="64" rx="8" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="392" y="396.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">실패</text>
<text x="392" y="416.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CA 서명 불일치</text>
<rect x="528.0" y="368.0" width="192" height="64" rx="8" fill="#0D1117" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="624" y="396.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">도달 안 함</text>
<text x="624" y="416.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">앞에서 멈춤</text>
<rect x="756.0" y="368.0" width="176" height="64" rx="8" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="844" y="396.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">검증 거절</text>
<text x="844" y="416.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">인증서를 받지 않음</text>
<line x1="12" y1="516" x2="912" y2="516" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="528" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">처음 갈리는 자리</text>
<rect x="261" y="528" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="283" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">통과</text>
<rect x="331" y="528" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="353" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">막힘</text>
<rect x="401" y="528" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="423" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">도달 안 함</text>

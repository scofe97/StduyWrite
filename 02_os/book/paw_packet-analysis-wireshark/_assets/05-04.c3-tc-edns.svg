<title id="dt">C3 — TC 표시 뒤 TCP 재질의, EDNS(0) 는 한 번</title><desc id="dd">OPT 기록이 없는 질의에는 서버가 512바이트 한계를 적용해 TC=1 로 답하고 클라이언트가 TCP 로 다시 묻는다. 1232바이트를 알린 질의에는 944바이트 응답이 UDP 한 번에 온다.</desc>

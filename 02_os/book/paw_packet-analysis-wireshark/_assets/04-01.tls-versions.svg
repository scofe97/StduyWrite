<title id="dt">SSL/TLS 버전의 연대</title><desc id="dd">원문 표의 연도와 RFC 를 시간축 위에 놓은 것. 원문 시점(2015)에 폐기된 것은 SSL 둘뿐이었고, 그 뒤 TLS 1.0·1.1 도 폐기됐으며 TLS 1.3 은 초안에서 RFC 8446 으로 확정됐다.</desc>

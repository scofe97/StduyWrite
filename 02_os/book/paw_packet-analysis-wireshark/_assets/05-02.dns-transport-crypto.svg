<title id="dt">전송과 암호화는 다른 축</title><desc id="dd">DNS 를 나르는 네 방식을 암호화 여부와 포트 성격으로 놓았다. UDP 53 과 TCP 53 은 전송만 다를 뿐 둘 다 평문이라 같은 칸에 든다. DoT 는 전용 포트 853 에서 TLS 로 감싸고, DoH 는 HTTPS 로 실려 일반 웹 트래픽과 같은 443 을 쓴다.</desc>
<rect width="880" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-02 DEEP DIVE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">전송과 암호화는 다른 축</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">UDP 53 과 TCP 53 은 같은 칸입니다 — 읽히느냐는 TLS 를 씌웠느냐가 정합니다</text>
<path d="M 440 336 L 440 140" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#soft)"/>
<path d="M 440 336 L 440 532" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#soft)"/>
<path d="M 440 336 L 84 336" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#soft)"/>
<path d="M 440 336 L 796 336" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="440" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">암호화</text>
<text x="440" y="556" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">평문</text>
<text x="72" y="340" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">전용 포트</text>
<text x="808" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">443 공유</text>
<rect x="116" y="160" width="300" height="152" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="132" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">01 · 암호화 / 전용 포트</text>
<text x="132" y="220" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#F5F5F3">DoT</text>
<text x="132" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">TCP 853 · TLS 로 감쌈</text>
<text x="132" y="274" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">포트로 가려냄 · 내용은 못 읽음</text>
<rect x="464" y="160" width="300" height="152" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="480" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">02 · 암호화 / 443 공유</text>
<text x="480" y="220" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#F5F5F3">DoH</text>
<text x="480" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">TCP 443 · HTTPS 안의 DNS</text>
<text x="480" y="274" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">일반 웹 트래픽과 같은 포트</text>
<rect x="116" y="360" width="300" height="152" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="132" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">03 · 평문 / 전용 포트</text>
<text x="132" y="420" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#F08A59">UDP 53 · TCP 53</text>
<text x="132" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">전송만 다름 · 둘 다 평문</text>
<text x="132" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">dns 필터로 질의 이름이 읽힘</text>
<rect x="464" y="360" width="300" height="152" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="480" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">04 · 평문 / 443 공유</text>
<text x="480" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#8B98A9">해당 없음</text>
<text x="480" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">DoH 는 https URI 로만 실림</text>
<text x="480" y="474" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">RFC 8484</text>
<line x1="12" y1="592" x2="832" y2="592" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="614" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="604" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="614" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전송이 달라도 같은 칸</text>
</svg>
<title id="dt">REQUEST 한 번이 선택과 거절을 겸한다</title><desc id="dd">서버 둘이 각자 OFFER 를 보낸다. 클라이언트는 옵션 54 에 서버 1 을 적은 REQUEST 를 한 번 브로드캐스트하고, 서버 1 에게는 요청이, 서버 2 에게는 제안을 거절했다는 통지가 된다.</desc>

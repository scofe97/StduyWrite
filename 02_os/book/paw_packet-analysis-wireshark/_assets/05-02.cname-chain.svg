<title id="dt">질의 한 줄에 답 두 줄 — CNAME 체인</title><desc id="dd">원문 DNS-Packet.pcap 예제. 클라이언트가 이름 서버 8.8.4.4 에 ipv6.google.com 의 AAAA 를 묻고, 응답 섹션에 두 줄이 온다. 첫 줄은 ipv6.google.com 이 별칭이고 정규 이름이 ipv6.l.google.com 이라고 알리고, 둘째 줄이 ipv6.l.google.com 의 AAAA 주소를 준다.</desc>

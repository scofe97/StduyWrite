<title id="dt">http.time 은 어느 구간을 재나</title><desc id="dd">TCP 연결 하나의 시간축. SYN · SYN/ACK · ACK 로 연결을 세우는 왕복은 맨 앞에 한 번뿐이고, 그 연결 위에 요청과 응답의 짝이 여럿 실린다. http.time 은 요청 프레임에서 그 응답 프레임까지의 간격이라 서버가 처리한 시간이 들어 있다.</desc>
<rect width="960" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">http.time 은 어느 구간을 재나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">연결 수립 왕복과 http.time 은 다른 막대입니다 — 둘째 요청 앞에는 SYN 이 없습니다</text>
<text x="232" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">SYN</text>
<line x1="232" y1="132" x2="232" y2="400" stroke="#5E6B7E" stroke-width="0.8" stroke-dasharray="2 5"/>
<text x="312" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">SYN/ACK</text>
<line x1="312" y1="132" x2="312" y2="400" stroke="#5E6B7E" stroke-width="0.8" stroke-dasharray="2 5"/>
<text x="392" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">ACK</text>
<line x1="392" y1="132" x2="392" y2="400" stroke="#5E6B7E" stroke-width="0.8" stroke-dasharray="2 5"/>
<text x="440" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">GET</text>
<line x1="440" y1="132" x2="440" y2="400" stroke="#5E6B7E" stroke-width="0.8" stroke-dasharray="2 5"/>
<text x="616" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">200</text>
<line x1="616" y1="132" x2="616" y2="400" stroke="#5E6B7E" stroke-width="0.8" stroke-dasharray="2 5"/>
<text x="688" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">GET</text>
<line x1="688" y1="132" x2="688" y2="400" stroke="#5E6B7E" stroke-width="0.8" stroke-dasharray="2 5"/>
<text x="848" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">200</text>
<line x1="848" y1="132" x2="848" y2="400" stroke="#5E6B7E" stroke-width="0.8" stroke-dasharray="2 5"/>
<text x="24" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">선 위의 프레임</text>
<line x1="24" y1="132" x2="200" y2="132" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">TCP 연결</text>
<text x="24" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">연결 하나</text>
<rect x="232" y="160" width="664" height="24" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="242" y="177" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">SYN 은 맨 앞 한 번 · 요청마다 오지 않음</text>
<text x="24" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">연결 수립</text>
<text x="24" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">네트워크 왕복 · 연결마다 한 번</text>
<rect x="232" y="224" width="80" height="24" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="242" y="241" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">왕복</text>
<text x="24" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">트랜잭션 1</text>
<text x="24" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">요청 → 응답 · 서버 처리 포함</text>
<rect x="440" y="288" width="176" height="24" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="450" y="305" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">http.time</text>
<text x="24" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">트랜잭션 2</text>
<text x="24" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">앞에 SYN 없음</text>
<rect x="688" y="352" width="160" height="24" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="698" y="369" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">http.time</text>
<line x1="12" y1="440" x2="912" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="462" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="452" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SYN 없이 재는 http.time</text>
<rect x="391" y="452" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="413" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">연결 수립 왕복</text>
<rect x="539" y="452" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="561" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">요청 → 응답</text>
</svg>
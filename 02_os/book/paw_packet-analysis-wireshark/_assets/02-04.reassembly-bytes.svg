<title id="dt">프레임 31 과 32 가 한 HTTP 메시지로 이어집니다</title><desc id="dd">tshark -V 의 Reassembled TCP Segments 블록. 프레임 31 이 payload 0~155(156바이트), 프레임 32 가 156~6317(6162바이트)을 나르고, 둘을 이은 6318바이트에서 HTTP 메시지가 완성된다. 프로토콜 목록에 http 가 붙는 것은 32번부터다.</desc>
<rect width="880" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 02-04 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프레임 31 과 32 가 한 HTTP 메시지로 이어집니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">http 가 처음 붙는 프레임은 메시지가 끝나는 32번입니다</text>

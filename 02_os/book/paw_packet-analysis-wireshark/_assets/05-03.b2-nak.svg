<title id="dt">B2 — 옛 주소 요청에 돌아온 NAK</title><desc id="dd">임대 기록 파일로 옛 주소 .137 을 기억한 dhclient 가 DISCOVER 없이 REQUEST 부터 보낸다. 범위를 옮긴 authoritative 서버는 1ms 뒤 NAK 을 브로드캐스트하고, 클라이언트는 DISCOVER 부터 다시 돌아 .166 을 받는다.</desc>

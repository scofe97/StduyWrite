<title id="dt">패킷이 안 보일 때</title><desc id="dd">인터페이스 목록이 비어 있는 경우와 목록은 있는데 패킷이 안 잡히는 경우는 원인이 다르다. 먼저 목록 유무로 가른 뒤 각각의 조치로 내려간다.</desc>
<rect width="880" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 02-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">패킷이 안 보일 때</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">목록이 비었으면 권한 문제, 목록이 있으면 인터페이스·모드 문제입니다</text>
<path d="M 300 136 L 300 156" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 300 236 L 300 264" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 440 198 L 536 198" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 300 336 L 300 368" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 700 236 L 700 406 L 480 406" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 300 440 L 300 496" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="200.0" y="96" width="200" height="40" rx="20" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="300" y="121.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">패킷이 안 보인다</text>
<polygon points="300,160 440,198 300,236 160,198" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="300" y="203" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">인터페이스 목록이 뜨는가?</text>
<rect x="124.0" y="268" width="352" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="300" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">인터페이스와 트래픽을 확인합니다</text>
<text x="300" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">맞는 인터페이스인가 · 라이브 트래픽이 있는가</text>
<rect x="124.0" y="372" width="352" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="300" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">promiscuous 를 껐다 켭니다</text>
<text x="300" y="416" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자기 것 아닌 프레임을 버리고 있지 않은가</text>

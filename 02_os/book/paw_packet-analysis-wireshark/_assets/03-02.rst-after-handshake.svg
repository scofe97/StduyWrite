<title id="dt">세 번째 자리에 RST 가 오면</title><desc id="dd">원문 RST-01.pcap 이다. SYN 과 SYN,ACK 가 오간 뒤 handshake 를 닫을 ACK 대신 RST 가 왔다. 원문이 드는 설명 셋은 모두 정상적인 소켓 API 사용으로는 나오지 않는 경로를 가리킨다.</desc>
<rect width="920" height="604" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 03-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세 번째 자리에 RST 가 오면</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">정상 소켓 API 로는 안 나오므로 애플리케이션보다 앞단을 먼저 봅니다</text>

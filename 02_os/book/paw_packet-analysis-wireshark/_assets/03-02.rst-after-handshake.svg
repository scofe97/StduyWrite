<text x="448.0" y="187" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">SYN</text>
<path d="M 722.0 240 L 176.0 240" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="448.0" y="231" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">SYN, ACK</text>
<path d="M 174.0 288 L 720.0 288" fill="none" stroke="#5E6B7E" stroke-width="1.5" marker-end="url(#soft)" stroke-dasharray="4,4"/>
<text x="448.0" y="279" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">ACK</text>

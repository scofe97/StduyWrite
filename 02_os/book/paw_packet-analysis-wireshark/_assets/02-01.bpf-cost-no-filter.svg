<title id="dt">커널에서 거르지 않으면</title><desc id="dd">드라이버가 넘긴 프레임을 커널이 조건 없이 모두 캡처 버퍼에 담고, 그 사본이 전부 커널과 사용자 공간의 보호 경계를 넘어 dumpcap 으로 복사된다. 거르기는 사용자 공간에서 뒤늦게 일어나 대부분의 사본은 옮긴 뒤에 버려진다.</desc>

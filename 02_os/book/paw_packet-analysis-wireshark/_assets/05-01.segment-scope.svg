<title id="dt">브로드캐스트가 닿는 범위</title><desc id="dd">세그먼트 A 의 클라이언트가 보낸 브로드캐스트는 스위치가 모든 포트로 복사해 분석기와 이웃 장비에 닿는다. 라우터는 이것을 넘기지 않으므로 세그먼트 B 의 서버에는 닿지 않는다.</desc>
<rect width="940" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">브로드캐스트가 닿는 범위</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">라우터를 거치지 않고 닿는 범위가 세그먼트이고, 라우터가 그 경계입니다</text>
<rect x="24" y="108" width="556" height="312" rx="8" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="6,4"/>
<text x="40" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">세그먼트 A</text>

<title id="dt">BOOTP 위에 얹힌 DHCP</title><desc id="dd">DHCP 는 BOOTP 를 걷어낸 것이 아니라 그 메시지 형식을 전송으로 쓰고 옵션만 더 얹었다. 맨 아래 포트 층을 두 프로토콜이 공유하기 때문에 서버 하나가 양쪽 클라이언트를 모두 받는다. 필터 이름이 오래도록 bootp 였던 것도 이 구조 때문이다.</desc>
<rect width="940" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">BOOTP 위에 얹힌 DHCP</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">공유하는 것은 포트와 메시지 형식, 다른 것은 옵션뿐입니다</text>
<rect x="132" y="120" width="700" height="68" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.5"/>
<text x="116" y="160" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">L3</text>
<text x="156" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">DHCP 옵션 확장</text>
<text x="156" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">RFC 1531(1993) → 2131(1997) · 임대(lease) · 확장 가능한 options</text>
<rect x="132" y="208" width="700" height="68" rx="8" fill="#6A95D80A" stroke="#6A95D8" stroke-width="1.1"/>
<text x="116" y="248" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">L2</text>
<text x="156" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#6A95D8">BOOTP 메시지 형식</text>
<text x="156" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">RFC 951 · 1985 · 제한된 vendor extensions</text>
<rect x="132" y="296" width="700" height="68" rx="8" fill="#3FB98C0A" stroke="#3FB98C" stroke-width="1.1"/>
<text x="116" y="336" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">L1</text>
<text x="156" y="326" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#3FB98C">UDP 67 · 68</text>
<text x="156" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">두 프로토콜이 공유하는 포트</text>
<text x="44" y="140" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">확장 ↑</text>
<line x1="60" y1="152" x2="60" y2="364" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<text x="44" y="368" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">전송 ↓</text>
<text x="24" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">포트가 같아 서버 하나가 BOOTP 클라이언트와 DHCP 클라이언트를 모두 받음</text>
<text x="24" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Wireshark 3.0 — 디섹터 이름이 bootp 에서 dhcp 로 변경 · bootp.dhcp 만 호환 제외</text>
<text x="24" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">DHCPv4 의 rapid commit — DHCPv6 를 본떠 추가된 두 메시지 교환</text>
<line x1="12" y1="516" x2="892" y2="516" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="528" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">DHCP 가 더한 층</text>
<rect x="287" y="528" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전송으로 쓰이는 층</text>
<rect x="461" y="528" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="483" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">양쪽이 공유</text>
</svg>
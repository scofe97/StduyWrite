<title id="dt">A1 — 주소 없는 클라이언트에게 가는 OFFER</title><desc id="dd">서버 쪽 캡처에 찍힌 DORA 네 걸음과 앞뒤 프레임. 클라이언트는 DISCOVER 와 REQUEST 를 브로드캐스트로 외치고, 서버는 아직 IP 가 없는 클라이언트에게 OFFER 와 ACK 를 클라이언트 MAC 앞으로 보낸다. 받은 주소 .137 로 나간 ping 이 마지막 줄이다.</desc>

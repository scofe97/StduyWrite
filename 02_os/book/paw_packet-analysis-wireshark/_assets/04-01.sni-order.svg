<title id="dt">이름이 필요한 때와 이름이 도착하는 때</title><desc id="dd">TLS 1.2 연결에서 일어나는 사건 넷을 순서대로 놓았다. 서버가 인증서를 고르는 때는 암호화보다 앞인데, HTTP 의 Host 헤더는 암호화가 시작된 뒤에야 온다. 위 줄은 이름이 Host 헤더로만 올 때의 어긋남이고, 아래 줄은 ClientHello 의 server_name 확장에 이름을 실어 필요한 때보다 앞서 도착하게 한 해결이다.</desc>
<rect width="960" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름이 필요한 때와 이름이 도착하는 때</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이름이 필요한 때가 암호화보다 앞이라, 이름을 ClientHello 로 옮겼습니다</text>
<text x="200" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">ClientHello</text>
<text x="200" y="146" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">평문</text>
<line x1="200" y1="160" x2="200" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="424" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">인증서 선택</text>
<text x="424" y="146" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Certificate 전송</text>
<line x1="424" y1="160" x2="424" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="648" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">암호화 시작</text>
<text x="648" y="146" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CCS · Finished</text>
<line x1="648" y1="160" x2="648" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="872" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">HTTP 요청</text>
<text x="872" y="146" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Host 헤더</text>
<line x1="872" y1="160" x2="872" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<rect x="648" y="212" width="288" height="92" rx="6" fill="#6A95D80c" stroke="#6A95D8" stroke-width="0.6"/>
<text x="24" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">A · Host 헤더로만</text>
<line x1="188" y1="264" x2="912" y2="264" stroke="#5E6B7E" stroke-width="1.0"/>
<circle cx="200" cy="264" r="4" fill="#8B98A9"/>
<circle cx="424" cy="264" r="6" fill="#F08A59"/>
<circle cx="648" cy="264" r="4" fill="#8B98A9"/>

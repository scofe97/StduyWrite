<circle cx="872" cy="460" r="4" fill="#8B98A9"/>
<text x="660" y="228" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">암호화된 구간</text>

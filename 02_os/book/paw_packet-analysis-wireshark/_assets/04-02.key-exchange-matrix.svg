<title id="dt">키 교환 방식이 정하는 것</title><desc id="dd">Server Hello 에서 고른 cipher suite 의 키 교환 부분이 세 가지를 한꺼번에 정한다. Server Key Exchange 메시지가 오는지, 전방 비밀성이 있는지, 그리고 서버 개인키만으로 복호화가 되는지.</desc>
<rect width="948" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">키 교환 방식이 정하는 것</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">복호화가 되는 칸은 하나뿐이고, 그것은 전방 비밀성이 없다는 뜻이기도 합니다</text>
<text x="32" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">키 교환 방식</text>

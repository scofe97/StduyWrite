<title id="dt">서버마다 제안하고, 클라이언트는 서버를 고른다</title><desc id="dd">SOLICIT 은 멀티캐스트라 링크의 두 서버가 모두 듣고 각자 ADVERTISE 로 제안한다. 클라이언트는 Preference 값이 높은 서버 1 을 골라 그 서버 식별자를 넣은 REQUEST 를 보내고, 식별자가 다른 서버 2 는 그 REQUEST 를 버린다.</desc>

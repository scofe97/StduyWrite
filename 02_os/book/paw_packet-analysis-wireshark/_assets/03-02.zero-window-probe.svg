<title id="dt">창이 열린 소식이 사라져도 풀리는 이유</title><desc id="dd">받는 쪽이 창 0 을 알려 송신이 멈춘다. 애플리케이션이 버퍼를 비운 뒤 보내는 Window Update 는 데이터 없는 ACK 라 사라져도 다시 보내지지 않고, 그러면 두 쪽이 서로를 기다린다. 규격은 그래서 보내는 쪽이 창을 떠보는 패킷을 되풀이하도록 정한다.</desc>
<rect width="920" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 03-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">창이 열린 소식이 사라져도 풀리는 이유</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">알림에 기대지 않고 보내는 쪽이 되풀이해 떠봅니다</text>

<title id="dt">B6 · 서버 개인키가 여는 것</title><desc id="dd">uat:rsa_keys 로 a.test.key 를 물려 두 캡처를 연다. 정적 RSA 캡처는 잠긴 비밀 값을 풀어 요청과 응답이 평문으로 나오고, ECDHE 캡처는 풀 대상이 없어 스트림이 빈다.</desc>
<rect width="880" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-04 B6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">B6 · 서버 개인키가 여는 것</text>

<text x="24" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">vDSO · gettimeofday()</text>
<path d="M 134.0 616 L 176.0 616 L 176.0 632 L 137.0 632" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="188.0" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">vDSO 안에서 답</text>

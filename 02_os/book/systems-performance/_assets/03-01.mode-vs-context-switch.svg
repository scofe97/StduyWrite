<title id="dt">모드 전환과 컨텍스트 전환 — 세 가지 syscall 경로</title><desc id="dd">모든 시스템 콜은 커널에 들어가며 모드 전환을 한다. 블로킹되는 시스템 콜은 기다리는 동안 다른 스레드를 돌리려고 컨텍스트 전환을 더한다. vDSO 로 구현된 호출은 커널에 들어가지 않는다.</desc>
<rect width="928" height="724" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 03-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">모드 전환과 컨텍스트 전환 — 세 가지 syscall 경로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">블로킹 여부가 컨텍스트 전환을 가릅니다</text>

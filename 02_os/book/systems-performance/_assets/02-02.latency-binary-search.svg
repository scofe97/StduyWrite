<title id="dt">지연을 둘로 나눠 큰 쪽만 따라간다</title><desc id="dd">MySQL 쿼리 지연 예에서 매 질문이 지연을 둘로 나누고, 더 큰 쪽(색 칸)만 다시 나눈다. 흐린 칸은 버린 갈래다.</desc>

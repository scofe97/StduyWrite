<rect x="328" y="503" width="14" height="14" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="350" y="515" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">나머지 층</text>

<title id="dt">인터럽트가 도착할 때 누가 CPU 위에 있나</title><desc id="dd">위: MySQL 이 파일을 읽다 디스크를 기다리는 동안 스케줄러가 Java 로 전환하고, 디스크 완료 인터럽트는 MySQL 이 없는 CPU 0 에 도착한다(원서 그림 3.5). 아래: 동기 인터럽트는 원인 명령이 아직 CPU 위에 있다.</desc>
<rect width="960" height="732" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 03-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인터럽트가 도착할 때 누가 CPU 위에 있나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">비동기는 기다리던 스레드가 떠난 뒤에 도착할 수 있습니다</text>

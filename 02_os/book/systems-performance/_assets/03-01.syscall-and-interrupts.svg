<line x1="586.6666666666667" y1="154" x2="586.6666666666667" y2="652" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="824.0" y1="154" x2="824.0" y2="652" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>

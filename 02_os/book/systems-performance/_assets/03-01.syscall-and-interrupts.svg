<path d="M 359.33333333333337 288 L 401.33333333333337 288 L 401.33333333333337 304 L 362.33333333333337 304" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="413.33333333333337" y="294" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">block</text>
<text x="413.33333333333337" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">MySQL 은 sleep</text>
<path d="M 359.33333333333337 340 L 812.0 340" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="586.6666666666667" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">컨텍스트 전환</text>
<text x="586.6666666666667" y="358" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Java 가 CPU 0 을 씀</text>
<path d="M 576.6666666666667 396 L 361.33333333333337 396" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>

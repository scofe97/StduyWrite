<title id="dt">두 요인을 빼도 1GB/s 위에 남는다</title><desc id="dd">최대 구성 2GB/s 에서 프로세서를 둘로, 네트워크 카드를 하나로 줄인 하락을 차례로 곱했다. 끝 막대가 요구 1GB/s 선 위에 남는다.</desc>

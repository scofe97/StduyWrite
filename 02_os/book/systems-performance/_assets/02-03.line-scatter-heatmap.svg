<title id="dt">같은 디스크 I/O, 세 장의 그림</title><desc id="dd">MySQL 서버의 디스크 I/O 지연을 그린 세 시각화가 시간 추이·개별 이상치·몸통 패턴·데이터 규모를 각각 어떻게 다루는지 칸으로 나눴다.</desc>

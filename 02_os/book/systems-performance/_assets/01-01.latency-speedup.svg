<title id="dt">100 ms 쿼리에서 디스크 대기 80 ms 를 없애면</title><desc id="dd">원서 그림 1.3. DB 쿼리 지연 100 ms 가운데 80 ms 는 디스크 읽기를 기다리며 off-CPU 로 블록된 시간이다. 디스크 읽기를 없애면 20 ms 가 남아 최대 5배 빨라진다. IOPS 는 유형과 크기가 섞여 같은 계산을 못 한다.</desc>
<rect width="920" height="456" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 01-01 §6 · FIG 1.3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">100 ms 쿼리에서 디스크 대기 80 ms 를 없애면</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">남는 on-CPU 20 ms 가 개선의 상한을 정합니다</text>
<line x1="216.0" y1="130" x2="216.0" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="216.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0 ms</text>
<line x1="352.0" y1="130" x2="352.0" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="352.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">20 ms</text>
<line x1="488.0" y1="130" x2="488.0" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="488.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">40 ms</text>
<line x1="624.0" y1="130" x2="624.0" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="624.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">60 ms</text>
<line x1="760.0" y1="130" x2="760.0" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="760.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">80 ms</text>
<line x1="896.0" y1="130" x2="896.0" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="896.0" y="124" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">100 ms</text>
<text x="200" y="165" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">DB 쿼리 지연</text>
<rect x="216.0" y="144" width="680.0" height="32" rx="4" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="556.0" y="165" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">100 ms</text>
<text x="200" y="221" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">스레드</text>
<rect x="216.0" y="200" width="136.0" height="32" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="284.0" y="221" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">on-CPU 20</text>
<rect x="352.0" y="200" width="544.0" height="32" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="624.0" y="221" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">off-CPU · 디스크 읽기 대기 80 ms</text>
<text x="200" y="277" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">디스크 읽기 제거 뒤</text>
<rect x="216.0" y="256" width="136.0" height="32" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="284.0" y="277" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">20 ms</text>
<text x="376.0" y="277" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">100 ÷ 20 = 최대 5배</text>
<text x="200" y="355.4" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">IOPS 로 본다면</text>
<rect x="216.0" y="336" width="192" height="32" rx="4" fill="#161B22" stroke="#E3B341" stroke-width="1.0"/>
<text x="312.0" y="357" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">IOPS 80% 감소</text>
<rect x="436.0" y="336" width="192" height="32" rx="4" fill="#161B22" stroke="#E3B341" stroke-width="1.0"/>
<text x="532.0" y="357" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">I/O 하나 크기 10배</text>
<rect x="656.0" y="336" width="192" height="32" rx="4" fill="#161B22" stroke="#E3B341" stroke-width="1.0"/>
<text x="752.0" y="357" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">성능 영향 판단 불가</text>
<path d="M 410.0 352 L 432.0 352" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<path d="M 630.0 352 L 652.0 352" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<line x1="12" y1="400" x2="872" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="422" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="411" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="423" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">디스크 대기 — 없앨 수 있는 몫</text>
<rect x="418" y="411" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="440" y="423" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">남는 on-CPU</text>
<rect x="601" y="411" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="623" y="423" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">개선 뒤</text>
<rect x="709" y="411" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="731" y="423" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">IOPS 의 한계</text>
</svg>
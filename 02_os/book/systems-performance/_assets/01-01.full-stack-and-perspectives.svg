<title id="dt">풀 스택 — 애플리케이션부터 metal 까지</title><desc id="dd">원서 그림 1.1 의 서버 한 대 소프트웨어 스택과 그림 1.2 의 두 분석 관점. 업계 통념의 풀 스택은 맨 위 애플리케이션 환경뿐이지만, 시스템 성능의 풀 스택은 커널과 장치까지 전부다.</desc>

<title id="dt">커널과 디스크는 같은 I/O 를 다르게 잰다</title><desc id="dd">커널은 I/O 를 만든 순간부터, 디스크는 자기 큐에 들어온 순간부터 잰다. 그래서 블록 I/O 서비스 시간과 디스크 요청 시간이 같은 구간을 가리킨다.</desc>
<rect width="976" height="544" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 09-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널과 디스크는 같은 I/O 를 다르게 잰다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">'서비스 시간' 은 OS 가 디스크를 직접 관리하던 시절의 이름입니다</text>
<line x1="140" y1="140" x2="140" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="372" y1="140" x2="372" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="700" y1="140" x2="700" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<text x="140" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">I/O 생성 · 커널 큐</text>
<text x="372" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">디스크로 발행</text>
<text x="700" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">완료 인터럽트</text>
<rect x="140" y="172" width="232" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="128" y="193" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">블록 I/O 대기</text>
<text x="384" y="193" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">커널 큐에서 기다린 시간</text>
<rect x="372" y="216" width="328" height="32" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="360" y="237" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">블록 I/O 서비스</text>
<text x="712" y="237" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">디스크에 맡긴 뒤의 시간</text>
<rect x="140" y="260" width="560" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="128" y="281" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">블록 I/O 요청</text>
<text x="712" y="281" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">커널이 보는 전체</text>
<text x="128" y="337" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">디스크 요청</text>
<rect x="372" y="316" width="109" height="32" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="384" y="337" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6A95D8">온디스크 큐</text>
<rect x="481" y="316" width="219" height="32" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="493" y="337" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">실제 처리</text>
<text x="120" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">온디스크 큐와 실제 처리를 더한 것이 곧 블록 I/O 서비스 시간입니다 — 같은 구간을 양쪽이 다른 이름으로 부릅니다</text>
<text x="120" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">지금 디스크는 자체 큐를 가져, OS 가 보는 서비스 시간에 커널 큐 대기가 섞입니다</text>
<text x="120" y="428" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">그래서 옛 iostat 의 svctm 은 부정확해져 최신판에서 빠졌습니다</text>
<line x1="12" y1="452" x2="928" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="474" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="463" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="475" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">커널과 디스크가 겹쳐 보는 구간</text>
<rect x="403" y="463" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="425" y="475" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">디스크 큐 대기</text>
<rect x="571" y="463" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="593" y="475" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">디스크가 실제로 처리</text>
</svg>
<title id="dt">같은 '지연'이 덮는 구간이 다르다</title><desc id="dd">웹 페이지 로드를 네 단계로 나누고, 지연과 응답 시간이라는 이름이 각각 어느 구간을 덮는지 같은 시간축에 겹쳐 보인다.</desc>
<rect width="928" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 02-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 '지연'이 덮는 구간이 다르다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">막대 길이는 상대 모양 — 원서 그림에 값이 없습니다</text>
<text x="24" y="100" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">단계</text>

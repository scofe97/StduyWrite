<title id="dt">정상 사건 셋이 겹칠 때만 문제가 된다 (가상 예시)</title><desc id="dd">원서 1.5.3 의 장면을 시간축에 옮긴 가상 예시. 사건 셋은 각각 평소에도 일어나는 정상 사건이고, 성능 문제는 세 막대가 겹치는 창에서만 생긴다. 사건 이름은 설명을 위해 붙였다.</desc>
<rect width="920" height="456" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 01-01 §5 · SEC 1.5.3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">정상 사건 셋이 겹칠 때만 문제가 된다 (가상 예시)</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">하나씩 떼어 보면 셋 다 정상이라 어느 것도 근본 원인이 아닙니다</text>

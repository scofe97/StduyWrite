<title id="dt">넓게 보고, 좁히고, 파고든다</title><desc id="dd">드릴다운 세 단계마다 하는 일·범용 도구·Netflix 구현을 같은 칸에 놓았다. 아래 줄은 분석 단계에서 "왜?"를 다섯 번 물은 실화다.</desc>

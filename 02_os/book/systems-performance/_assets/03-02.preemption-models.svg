<title id="dt">세 선점 설정에서 고우선 스레드가 기다리는 시간</title><desc id="dd">커널이 시스템 콜을 처리하는 도중(회색) 고우선 스레드가 깨어난다(세로선). NONE 은 커널이 유저 모드로 돌아갈 때까지, VOLUNTARY 는 다음 논리적 정지점까지 기다리고, PREEMPT 는 임계 구역 밖이면 곧바로 CPU 를 얻는다. 시간축은 상대값이다.</desc>
<rect width="960" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 03-02 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세 선점 설정에서 고우선 스레드가 기다리는 시간</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">기다림이 짧을수록 지연이 줄고, NONE 은 그 대신 처리량을 얻습니다</text>
<text x="268" y="180" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">CONFIG_PREEMPT_NONE</text>
<text x="268" y="198" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">선점 비활성</text>
<rect x="288" y="168" width="480" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="300" y="187" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">커널 · syscall</text>
<rect x="384" y="202" width="384" height="12" rx="3" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="576.0" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">대기</text>
<rect x="768" y="168" width="96" height="28" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="780" y="187" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">고우선 실행</text>
<text x="268" y="276" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">CONFIG_PREEMPT_VOLUNTARY</text>
<text x="268" y="294" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">논리적 정지점에서</text>
<rect x="288" y="264" width="240" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="300" y="283" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">커널 · syscall</text>

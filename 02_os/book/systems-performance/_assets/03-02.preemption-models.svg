<text x="456.0" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">대기</text>
<rect x="528" y="264" width="96" height="28" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="540" y="283" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">고우선 실행</text>

<title id="dt">16MB/s 로는 캐시가 몇 시간에 걸쳐 데워진다</title><desc id="dd">회전 디스크가 랜덤 읽기로 초당 2,000번 × 8KB 만 공급할 때, DRAM 128GB 와 플래시 600GB 가 차오르는 시간을 계산해 그렸다.</desc>
<rect width="928" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 02-01 §10</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">16MB/s 로는 캐시가 몇 시간에 걸쳐 데워진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">원서 p.19 의 스토리지 어플라이언스 · 1GB = 1,000MB 로 계산</text>

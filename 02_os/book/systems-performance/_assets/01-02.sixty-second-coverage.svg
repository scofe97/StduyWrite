<title id="dt">60초 체크리스트가 덮는 자원</title><desc id="dd">원서 표 1.1 의 열 개 명령을 확인할 것에 따라 자원 열에 놓았다. 부하 평균부터 TCP 재전송까지, 60초 안에 시스템 전반 · CPU · 메모리 · 디스크 · 네트워크를 한 번씩 훑는다.</desc>

<title id="dt">성능 활동 11단계와 수명주기</title><desc id="dd">원서 1.3 의 활동 열한 가지를 개발 · 타깃 환경 · 사후 구간으로 나눴다. 클라우드의 canary · blue-green 은 1~5 를 건너뛰고 6 으로 가게 하고, 용량 계획은 설계 단계와 배포 후 모니터링 두 자리에 걸친다.</desc>
<rect width="1000" height="584" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 01-01 §3 · SEC 1.3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">성능 활동 11단계와 수명주기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">타깃 환경에서 드러난 이슈는 개발 단계에서 놓친 것입니다</text>
<rect x="24" y="152" width="360" height="228" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">개발 · 1~5</text>
<text x="368" y="178" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">제품이든 사내 서비스든</text>
<line x1="36" y1="192" x2="372" y2="192" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="56" y="215" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">1</text>
<text x="68" y="215" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">성능 목표 설정 · 모델링</text>
<text x="56" y="251" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">2</text>
<text x="68" y="251" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">프로토타입 성능 특성 파악</text>
<text x="56" y="287" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">3</text>
<text x="68" y="287" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">테스트 환경 성능 분석</text>
<text x="56" y="323" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">4</text>
<text x="68" y="323" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">새 버전 비회귀 테스트</text>
<text x="56" y="359" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">5</text>
<text x="68" y="359" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">릴리스 벤치마킹</text>
<rect x="448" y="152" width="300" height="192" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="464" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">타깃 환경 · 6~9</text>
<text x="732" y="178" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">출시 뒤</text>
<line x1="460" y1="192" x2="736" y2="192" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="480" y="215" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">6</text>
<text x="492" y="215" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">타깃 환경 PoC 테스트</text>
<text x="480" y="251" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">7</text>
<text x="492" y="251" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">프로덕션 성능 튜닝</text>
<rect x="456" y="268" width="284" height="28" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="480" y="287" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">8</text>
<text x="492" y="287" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6A95D8">프로덕션 모니터링</text>
<text x="480" y="323" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">9</text>
<text x="492" y="323" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">프로덕션 이슈 분석</text>
<rect x="780" y="152" width="196" height="120" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="796" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">사후 · 10~11</text>
<text x="960" y="178" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">SRE 함께</text>
<line x1="792" y1="192" x2="964" y2="192" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="812" y="215" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">10</text>
<text x="824" y="215" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">사후 검토</text>
<text x="812" y="251" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">11</text>
<text x="824" y="251" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">성능 도구 개발</text>
<line x1="416" y1="152" x2="416" y2="380" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="416" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">출시</text>
<line x1="28" y1="116" x2="380" y2="116" stroke="#6A95D8" stroke-width="1.2"/>
<line x1="28" y1="116" x2="28" y2="124" stroke="#6A95D8" stroke-width="1.2"/>
<line x1="380" y1="116" x2="380" y2="124" stroke="#6A95D8" stroke-width="1.2"/>
<text x="204.0" y="108" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">용량 계획 · 설계 중 자원 발자국 연구</text>
<line x1="452" y1="116" x2="744" y2="116" stroke="#6A95D8" stroke-width="1.2"/>
<line x1="452" y1="116" x2="452" y2="124" stroke="#6A95D8" stroke-width="1.2"/>
<line x1="744" y1="116" x2="744" y2="124" stroke="#6A95D8" stroke-width="1.2"/>
<text x="598.0" y="108" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">용량 계획 · 배포 후 모니터링으로 예측</text>
<text x="598" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">여기서 나온 이슈 = 개발 단계에서 놓친 것</text>
<path d="M 56 380 L 56 420 L 432 420 L 432 210 L 446 210" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<text x="244" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">클라우드 지름길 · canary · blue-green · 1~5 건너뜀</text>
<path d="M 24 476 L 976 476" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)" stroke-dasharray="4 6"/>
<text x="500" y="498" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">늦을수록 앞선 아키텍처 결정에서 생긴 성능 문제를 고치는 비용 증가</text>
<line x1="12" y1="516" x2="952" y2="516" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="527" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="539" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">클라우드 지름길</text>
<rect x="268" y="527" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="290" y="539" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">용량 계획</text>
<rect x="391" y="527" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="413" y="539" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">놓친 이슈가 드러나는 자리</text>

<title id="dt">자원마다 세 질문, 그리고 다음 자원</title><desc id="dd">자원 목록을 만든 뒤 자원 하나마다 에러·높은 사용률·포화를 차례로 묻는다. 셋 다 아니면 다음 자원으로, 하나라도 예면 그 발견을 조사한 뒤 돌아온다.</desc>

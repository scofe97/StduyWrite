<title id="dt">Extended BPF 구성 — 유저 쪽 도구에서 커널의 이벤트와 출력까지</title><desc id="dd">원서 그림 3.16. 유저 쪽 BPF 도구가 프로그램을 바이트코드로 만들어 넘기면, 커널은 검증기로 안전을 확인한 뒤 BPF 로 적재하고 이벤트에 붙인다. 결과는 per-event 데이터(perf buffer)와 통계 · 스택(map) 두 길로 돌아온다.</desc>

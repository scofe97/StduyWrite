<title id="dt">느린 디스크 — 확인하고 기각하며 좁힌 순서</title><desc id="dd">원서 1.11.1 의 사례. 디스크가 느리다는 티켓에서 출발해 USE · iostat · offcputime 으로 디스크가 DB 를 막는 것을 확인하고, 디스크 에러 · 디스크 이상 · DB 부하 증가 · 단편화를 차례로 기각한 뒤 캐시 적중률에서 원인에 닿는다.</desc>

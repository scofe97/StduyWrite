<title id="dt">동적 계측이 세대마다 바꾼 것</title><desc id="dd">원서 1.7.3 의 연표. 동적 계측은 1990년대 연구에서 시작해 2000년 리눅스 개발, 2004년 kprobes 병합으로 이어졌지만 잘 알려지지 않고 쓰기 어려웠다. 2005년 DTrace 가 쉽고 안전한 도구로 널리 알렸고, 2013년부터 확장된 BPF 가 BCC · bpftrace 를 떠받친다.</desc>

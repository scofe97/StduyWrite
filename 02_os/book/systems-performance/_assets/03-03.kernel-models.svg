<title id="dt">커널 모델별 구성요소의 위치</title><desc id="dd">같은 구성요소가 모델마다 다른 곳에서 돈다. microkernel 은 파일시스템 · 네트워크 스택 · 드라이버를 유저 모드로 내보내 IPC 로 부르고, hybrid 는 성능이 중요한 서비스를 커널로 되돌리며, unikernel 은 모두 한 이미지 · 한 주소 공간에 둔다.</desc>

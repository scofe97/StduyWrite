<title id="dt">유저 스택과 커널 스택</title><desc id="dd">시스템 콜을 실행하는 스레드는 스택이 둘이다. 경계 위의 앱·라이브러리 호출은 유저 스택에, 경계 아래 커널 실행은 별도의 커널 스택에 쌓인다. 오른쪽은 본문의 TCP 전송 커널 스택을 찍힌 순서(leaf-to-root) 그대로 둔 것이다.</desc>
<rect width="960" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 03-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">유저 스택과 커널 스택</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">본문의 스택 여섯 줄은 모두 경계 아래에 있습니다</text>

<title id="dt">한 사이클을 1초로 늘리면</title><desc id="dd">원서 표 2.2 의 대표 아홉 행을 로그 눈금 가로 막대로 그렸다. 눈금 하나가 열 배이고, 막대 끝의 띠는 값의 범위다.</desc>

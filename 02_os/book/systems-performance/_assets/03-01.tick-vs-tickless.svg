<text x="468" y="488" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">8ms</text>
<line x1="532" y1="464" x2="532" y2="472" stroke="#8B98A9" stroke-width="1.0"/>
<text x="532" y="488" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">10ms</text>
<line x1="596" y1="464" x2="596" y2="472" stroke="#8B98A9" stroke-width="1.0"/>
<text x="596" y="488" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">12ms</text>

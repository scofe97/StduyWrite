<title id="dt">tick 지연과 tick 오버헤드</title><desc id="dd">위 두 줄: 1ms 뒤 만료될 타이머가 100Hz tick 에서는 10ms tick 까지 기다리고, 고해상도 타이머는 1ms 에 바로 실행된다. 아래 두 줄: 할 일 없는 CPU 를 250Hz tick 이 4ms 마다 깨우고, tickless 는 다음 인터럽트까지 잠들게 둔다.</desc>
<rect width="976" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 03-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">tick 지연과 tick 오버헤드</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">정해진 간격으로 깨어나면 늦게 깨고, 쓸데없이도 깹니다</text>
<text x="188" y="174" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">100Hz tick</text>
<text x="188" y="192" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">타이머 확인 10ms 마다</text>
<line x1="212" y1="176" x2="852" y2="176" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<circle cx="212" cy="176" r="4" fill="#8B98A9"/>
<circle cx="532" cy="176" r="4" fill="#8B98A9"/>
<circle cx="852" cy="176" r="4" fill="#8B98A9"/>
<line x1="244" y1="160" x2="244" y2="192" stroke="#E3B341" stroke-width="1.4"/>
<text x="244" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">만료 1ms</text>
<rect x="244" y="170" width="288" height="12" rx="3" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<circle cx="532" cy="176" r="6" fill="#F08A59"/>
<text x="544" y="164" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">실행 10ms</text>
<text x="388.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">tick 지연 9ms</text>
<text x="188" y="250" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">고해상도 타이머</text>
<text x="188" y="268" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">만료 시각에 인터럽트</text>
<line x1="212" y1="252" x2="852" y2="252" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="244" y1="236" x2="244" y2="268" stroke="#E3B341" stroke-width="1.4"/>
<circle cx="244" cy="252" r="6" fill="#3FB98C"/>
<text x="256" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">실행 1ms</text>
<text x="188" y="326" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">250Hz tick</text>
<text x="188" y="344" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">idle CPU</text>
<line x1="212" y1="328" x2="852" y2="328" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="212" y="322" width="640" height="12" rx="3" fill="#6A95D810" stroke="#6A95D8" stroke-width="0.8"/>
<circle cx="212" cy="328" r="5" fill="#E3B341"/>

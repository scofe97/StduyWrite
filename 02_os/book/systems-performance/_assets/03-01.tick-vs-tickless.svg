<circle cx="724" cy="328" r="5" fill="#E3B341"/>
<circle cx="852" cy="328" r="5" fill="#E3B341"/>
<text x="864" y="333" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">깨어남 6번</text>
<text x="188" y="402" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">tickless</text>
<text x="188" y="420" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">idle CPU · NO_HZ</text>
<line x1="212" y1="404" x2="852" y2="404" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="212" y="398" width="640" height="12" rx="3" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.0"/>
<text x="864" y="409" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">계속 잠</text>
<line x1="212" y1="468" x2="852" y2="468" stroke="#8B98A9" stroke-width="1.0"/>

<line x1="724" y1="464" x2="724" y2="472" stroke="#8B98A9" stroke-width="1.0"/>
<text x="724" y="488" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">16ms</text>
<line x1="788" y1="464" x2="788" y2="472" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="852" y1="464" x2="852" y2="472" stroke="#8B98A9" stroke-width="1.0"/>
<text x="852" y="488" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">20ms</text>
<line x1="12" y1="508" x2="928" y2="508" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="530" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="519" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="531" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">tick 지연</text>

<title id="dt">예측하고, 결정하고, 재고, 보인다</title><desc id="dd">02-03 의 일곱 절을 네 단계로 묶었다. 모델로 예측하고, 그 예측으로 용량을 정하고, 측정값을 통계로 정량화하고, 시각화로 모양을 보인다.</desc>
<rect width="928" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 02-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">예측하고, 결정하고, 재고, 보인다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">칸마다 절 번호 · 다루는 것 · 답하는 질문</text>
<rect x="24" y="120" width="196" height="196" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="148" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">§1–3</text>
<text x="204" y="148" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">예측</text>
<line x1="40" y1="164" x2="204" y2="164" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="40" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">확장성 프로파일</text>
<text x="40" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">Amdahl · USL</text>
<text x="40" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">큐잉 M/D/1</text>
<text x="40" y="298" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">부하가 늘면?</text>

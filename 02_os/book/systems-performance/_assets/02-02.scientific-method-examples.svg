<title id="dt">같은 다섯 칸, 갈리는 결론</title><desc id="dd">원서 2.5.6 의 예시 셋을 질문·가설·예측·검증·분석 칸에 채웠다. 마지막 칸의 색이 가설의 운명이다.</desc>

<title id="dt">Linux 성능 발전 — 영역별 첫 도입 버전</title><desc id="dd">원서 3.4.1 의 목록에서 영역마다 대표 항목만 골라 첫 도입 버전 위에 놓았다. 가로축은 시간이 아니라 버전 순서이고 시리즈마다 폭이 다르다. 맨 아래 BPF 줄은 3.0 의 JIT 부터 5.3 의 bounded loop 까지 이어진다.</desc>

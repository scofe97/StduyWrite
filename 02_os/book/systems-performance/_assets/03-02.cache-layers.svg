<title id="dt">캐시 열다섯 층 — 위에서 적중하면 디스크까지 내려가지 않는다</title><desc id="dd">원서 표 3.2 의 캐시 층을 확인되는 순서대로 쌓았다. 오른쪽 읽기 요청은 9번 파일시스템 1차 캐시(페이지 캐시)에서 적중해 그 아래 여섯 층과 디스크에 닿지 않는다.</desc>
<rect width="928" height="724" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 03-02 §4</text>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">요청이 멈추는 층이 위일수록 건너뛰는 층이 많습니다</text>

<title id="dt">관측 도구를 꺼내는 다섯 갈래</title><desc id="dd">10-04 가 다루는 다섯 절. 전통 통계에서 BPF 이벤트 트레이싱으로, 마지막에 패킷 캡처로 내려간다.</desc>

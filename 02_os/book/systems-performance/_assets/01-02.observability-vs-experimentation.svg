<title id="dt">도구의 두 갈래 — 관측과 실험</title><desc id="dd">원서 1.7·1.8 의 도구 분류. 관측은 시스템을 건드리지 않고 카운터·프로파일링·트레이싱으로 보고, 실험은 합성 워크로드를 건다. 트레이싱은 다시 정적 계측·동적 계측·BPF 로 갈린다. 잎마다 1장에 나오는 예를 붙였다.</desc>

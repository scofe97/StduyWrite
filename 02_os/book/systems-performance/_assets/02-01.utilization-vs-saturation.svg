<title id="dt">용량을 넘는 일은 큐에 쌓인다</title><desc id="dd">요청된 일을 용량 대비 % 로 늘려 갈 때, 용량 기반 사용률은 100% 에서 멈추고 처리 못 한 일(포화)이 그 뒤로 선형으로 쌓인다.</desc>
<rect width="928" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 02-01 §9</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">용량을 넘는 일은 큐에 쌓인다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">원서 그림 2.8 — 용량 기반 사용률 기준</text>
<line x1="112" y1="368.0" x2="824" y2="368.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="100" y="372.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0%</text>
<line x1="112" y1="244.0" x2="824" y2="244.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="100" y="248.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">50%</text>
<line x1="112" y1="120.0" x2="824" y2="120.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="100" y="124.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">100%</text>
<text x="112.0" y="390" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0%</text>
<text x="290.0" y="390" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">50%</text>
<text x="468.0" y="390" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">100%</text>
<text x="646.0" y="390" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">150%</text>
<text x="824.0" y="390" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">200%</text>
<text x="824" y="412" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">요청된 일 (용량 대비) →</text>
<line x1="112" y1="120" x2="112" y2="368" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="468.0" y1="124" x2="468.0" y2="368" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="476.0" y="136" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">용량 100%</text>
<polyline points="112.0,368.0 468.0,120.0 824.0,120.0" fill="none" stroke="#6A95D8" stroke-width="1.6" stroke-linejoin="round"/>
<polyline points="112.0,368.0 468.0,368.0 824.0,120.0" fill="none" stroke="#F08A59" stroke-width="2.0" stroke-linejoin="round"/>
<text x="268.64" y="229.12" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">사용률</text>
<text x="738.56" y="108.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">더 오르지 않는다</text>
<text x="681.6" y="278.72" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">포화 — 큐에서 기다리는 일</text>
<line x1="12" y1="428" x2="880" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="450" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="439" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="451" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">사용률</text>
<rect x="193" y="439" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="215" y="451" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">포화</text>

<title id="dt">같은 부하에 CPU 를 더 쓰면 천장이 그만큼 낮다</title><desc id="dd">원서 1.11.2 의 사례. 초당 700 요청 고정 부하에서 현 버전은 CPU 32개를 평균 20%, 새 버전은 30% 썼다. 클라이언트를 병렬로 띄워 서버를 CPU 100% 까지 몰자 현 버전 3,500, 새 버전 2,300 요청/초에 닿았다.</desc>
<rect width="920" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 01-02 §8 · SEC 1.11.2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 부하에 CPU 를 더 쓰면 천장이 그만큼 낮다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">700 × 100 ÷ 20 = 3,500 · 700 × 100 ÷ 30 ≈ 2,333</text>
<text x="24" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">고정 부하 700 요청/초의 CPU 사용률</text>
<line x1="72" y1="400.0" x2="384" y2="400.0" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="64" y="404.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0</text>
<line x1="72" y1="340.0" x2="384" y2="340.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="64" y="344.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">10</text>
<line x1="72" y1="280.0" x2="384" y2="280.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="64" y="284.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">20</text>
<line x1="72" y1="220.0" x2="384" y2="220.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="64" y="224.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">30</text>
<line x1="72" y1="160.0" x2="384" y2="160.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="64" y="164.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">40</text>
<text x="64" y="152" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">%</text>
<rect x="120" y="280.0" width="88" height="120.0" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="164.0" y="270.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">20%</text>
<text x="164.0" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">현 버전</text>
<rect x="256" y="220.0" width="88" height="180.0" rx="4" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="300.0" y="210.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">30%</text>
<text x="300.0" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">새 버전</text>
<text x="480" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">서버를 CPU 100% 로 몬 처리량</text>
<line x1="528" y1="400.0" x2="840" y2="400.0" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="520" y="404.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0</text>
<line x1="528" y1="340.0" x2="840" y2="340.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="520" y="344.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">1,000</text>
<line x1="528" y1="280.0" x2="840" y2="280.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="520" y="284.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">2,000</text>
<line x1="528" y1="220.0" x2="840" y2="220.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="520" y="224.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">3,000</text>
<line x1="528" y1="160.0" x2="840" y2="160.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="520" y="164.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">4,000</text>
<text x="520" y="152" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">요청/초</text>
<rect x="576" y="190.0" width="88" height="210.0" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="620.0" y="180.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">3,500</text>
<text x="620.0" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">현 버전</text>
<rect x="712" y="262.0" width="88" height="138.0" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="756.0" y="252.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">2,300</text>
<text x="756.0" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">새 버전</text>
<line x1="528" y1="358.0" x2="840" y2="358.0" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="840" y="152" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">점선 · 단일 스레드 클라이언트의 천장 700</text>
<line x1="12" y1="448" x2="872" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="470" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="459" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="471" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">현 버전</text>
<rect x="208" y="459" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="230" y="471" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">새 버전 — 고정 부하</text>
<rect x="436" y="459" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="458" y="471" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">새 버전 — 회귀가 낮춘 천장</text>

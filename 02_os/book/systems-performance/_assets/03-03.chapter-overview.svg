<title id="dt">선조 커널에서 Linux, 세 주제, 비교까지</title><desc id="dd">03-03 의 일곱 절. syscall 수로 커널을 가늠하고, Unix·BSD·Solaris 의 성능 기능이 Linux 로 모인 과정과 2.5~5.8 의 발전을 본 뒤, systemd·KPTI·Extended BPF 세 주제와 다른 커널 모델·커널 비교로 끝난다.</desc>
<rect width="928" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 03-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">선조 커널에서 Linux, 세 주제, 비교까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">Extended BPF 는 15장까지 이어지는 이 책의 토대입니다</text>

<title id="dt">일반 I/O 스택 — 여덟 층과 파일시스템 우회 경로</title><desc id="dd">원서 그림 3.15. 애플리케이션의 요청은 시스템 콜, VFS, 파일시스템을 지나 블록 장치 인터페이스에 닿고, 볼륨 매니저와 HBA 드라이버를 거쳐 디스크 장치에 도착한다. 관리 도구와 데이터베이스는 시스템 콜에서 블록 장치 인터페이스로 바로 내려가기도 한다.</desc>
<rect width="928" height="732" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 03-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">일반 I/O 스택 — 여덟 층과 파일시스템 우회 경로</text>

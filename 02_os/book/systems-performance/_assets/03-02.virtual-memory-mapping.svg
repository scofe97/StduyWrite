<title id="dt">가상 주소 공간이 RAM 과 스왑으로 매핑된다</title><desc id="dd">두 프로세스의 같은 가상 주소는 서로 다른 RAM 프레임으로 매핑된다. 아직 쓰지 않은 페이지는 매핑이 없고, 오래 쓰지 않은 페이지는 스왑으로 밀려나며, 0 근처는 일부러 비워 둔 무효 영역이다.</desc>

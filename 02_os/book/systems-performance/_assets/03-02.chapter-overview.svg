<title id="dt">커널이 나누는 자원과 깊어지는 장</title><desc id="dd">03-02 의 일곱 절. 메모리·CPU 시간·저장장치(경로와 캐시)·네트워크와 장치를 차례로 보고, 나누는 주체가 여럿일 때 필요한 멀티프로세서·선점과 자원 제어로 끝난다. 행 끝의 장 번호가 그 주제를 깊게 다루는 곳이다.</desc>
<rect width="928" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 03-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널이 나누는 자원과 깊어지는 장</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">주제마다 한 장씩 깊어지므로 여기서는 멘탈 모델까지만 세웁니다</text>

<title id="dt">우선순위 런큐와 CPU — 계산 비율이 높은 스레드가 뒤로 밀린다</title><desc id="dd">ready 스레드 다섯이 CPU 둘을 다툰다. 타임슬라이스를 다 쓴 계산 작업은 계산 비율이 높아 낮은 큐 뒤로 가고, I/O 에서 깨어난 셸은 높은 큐에서 먼저 CPU 를 얻는다.</desc>

<rect x="288" y="242.0" width="140" height="52" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="358.0" y="265.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">ready-to-run</text>
<text x="358.0" y="283.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">런큐에서 대기</text>
<rect x="512" y="242.0" width="140" height="52" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>

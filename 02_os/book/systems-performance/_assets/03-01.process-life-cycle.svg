<title id="dt">프로세스 수명주기 — 다섯 상태와 전이</title><desc id="dd">생성된 프로세스는 Idle 을 거쳐 런큐(ready-to-run)에서 차례를 기다리고, CPU 위(on-proc)에서 선점·블록·종료 셋 중 하나로 나간다. 블록된 프로세스는 깨어나면 CPU 가 아니라 런큐로 돌아간다(원서 그림 3.8, 단순화).</desc>
<rect width="976" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 03-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로세스 수명주기 — 다섯 상태와 전이</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">깨어난 프로세스는 런큐부터 다시 섭니다</text>

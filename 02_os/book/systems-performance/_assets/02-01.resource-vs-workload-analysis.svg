<title id="dt">같은 스택을 반대 방향에서 본다</title><desc id="dd">워크로드 분석은 애플리케이션에서 아래로, 자원 분석은 하드웨어 자원에서 위로 OS 소프트웨어 스택을 본다. 양옆은 각 관점의 대상과 지표다.</desc>

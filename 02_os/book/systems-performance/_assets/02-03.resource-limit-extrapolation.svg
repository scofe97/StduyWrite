<title id="dt">점 하나로 그은 직선이 2,500 에서 벽에 닿는다</title><desc id="dd">초당 1,000 요청에서 CPU 16개가 평균 40% 였다. 요청당 사용량이 일정하다고 보고 직선을 전 CPU 100% 까지 늘이면 2,500 req/s 다.</desc>
<rect width="928" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 02-03 §4</text>

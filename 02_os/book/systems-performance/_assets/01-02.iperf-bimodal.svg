<title id="dt">iperf 초당 처리량의 두 모드</title><desc id="dd">원서 1.8 의 iperf -c ... -i 1 -t 10 출력. 처음 5초는 약 4.8 Gbits/s, 그 뒤는 약 3.2 Gbits/s 로 처리량에 모드가 둘이다. 10초 평균 4.06 Gbits/s 는 어느 모드에도 없는 값이다.</desc>

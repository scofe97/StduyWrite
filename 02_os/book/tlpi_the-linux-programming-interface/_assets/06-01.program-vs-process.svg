<title id="dt">프로그램 파일 하나에서 독립된 프로세스 둘이 뜬다</title><desc id="dd">디스크의 프로그램 파일은 정적 명세이고, 커널이 실행하면 PID 와 자원을 따로 받은 프로세스가 생긴다.</desc>

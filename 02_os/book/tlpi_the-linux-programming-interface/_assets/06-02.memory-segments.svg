<title id="dt">프로세스 가상 메모리 세그먼트 배치</title><desc id="dd">리눅스 x86-32 환경에서 각 프로세스가 바라보는 4GB 가상 주소 공간의 세그먼트 구조와 경계 심볼</desc>
<rect width="940" height="548" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로세스 가상 메모리 세그먼트 배치</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">낮은 주소(0x08048000)부터 높은 주소(0xC0000000 이상)까지의 전형적인 배치 · 주소는 커널 설정과 링크 옵션에 따라 다름</text>
<line x1="26" y1="110" x2="26" y2="450" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 26 120 L 26 104" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="36" y="280" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">가상 주소 증가</text>
<rect x="210" y="110" width="700" height="42" rx="4" fill="#161B22" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="228" y="136.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">커널 공간 (Kernel)</text>
<text x="196" y="135.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">0xC0000000~</text>
<text x="455" y="135.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사용자 접근 차단 · 시스템 콜 실행</text>
<rect x="795.6" y="121.0" width="98.8" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="845" y="135.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">/proc/kallsyms</text>
<rect x="210" y="156" width="700" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="228" y="179.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">인자·환경 변수 (argv, environ)</text>
<text x="196" y="178.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">0xC0000000 직하</text>
<text x="455" y="178.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">명령행 인자 문자열 및 환경 목록</text>
<rect x="817.3" y="164.0" width="55.4" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="845" y="178.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">ARG_MAX</text>
<rect x="210" y="196" width="700" height="52" rx="4" fill="#F08A591F" stroke="#F08A59" stroke-width="1.5"/>
<text x="228" y="227.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">스택 세그먼트 (Stack)</text>
<text x="196" y="226.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">고위 주소 → 저위 주소</text>
<text x="455" y="226.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">함수 프레임 · 지역 변수 · 호출 연결 정보</text>
<rect x="799.0" y="212.0" width="92.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="845" y="226.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">ESP 레지스터</text>
<rect x="210" y="252" width="700" height="40" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="210" y1="252" x2="910" y2="252" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="210" y1="292" x2="910" y2="292" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="228" y="277.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#5E6B7E">미할당 가상 주소 공간</text>
<text x="196" y="276.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">미매핑 영역</text>
<text x="455" y="276.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스택 하향 및 힙 상향 확장 대역</text>
<rect x="789.0" y="262.0" width="112.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="845" y="276.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">SIGSEGV 발생</text>
<rect x="210" y="296" width="700" height="48" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="228" y="325.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">힙 세그먼트 (Heap)</text>
<text x="196" y="324.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">저위 주소 → 고위 주소</text>
<text x="455" y="324.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">동적 메모리 할당 (malloc / brk)</text>
<rect x="798.7" y="310.0" width="92.60000000000001" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="845" y="324.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#6A95D8">program break</text>
<rect x="210" y="348" width="700" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="228" y="371.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">BSS 세그먼트 (Uninitialized)</text>
<text x="196" y="370.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">&amp;edata ~ &amp;end</text>
<text x="455" y="370.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">미초기화 전역·정적 변수 (0 초기화)</text>
<rect x="826.6" y="356.0" width="36.8" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="845" y="370.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#3FB98C">&amp;end</text>
<rect x="210" y="388" width="700" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="228" y="411.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">초기화된 데이터 세그먼트 (Data)</text>
<text x="196" y="410.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">&amp;etext ~ &amp;edata</text>
<text x="455" y="410.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">명시적 초기화된 전역·정적 변수</text>
<rect x="820.4" y="396.0" width="49.2" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="845" y="410.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">&amp;edata</text>
<rect x="210" y="428" width="700" height="40" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="228" y="453.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">텍스트 세그먼트 (Text)</text>
<text x="196" y="452.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">0x08048000~</text>
<text x="455" y="452.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로그램 기계어 코드 (읽기 전용 · 공유 가능)</text>
<rect x="820.4" y="438.0" width="49.2" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="845" y="452.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">&amp;etext</text>
<line x1="210" y1="496" x2="910" y2="496" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 4"/>
<text x="196" y="500" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">0x00000000</text>
<text x="228" y="487" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">미매핑 영역 (NULL 포인터 역참조 방지)</text>
<line x1="12" y1="516" x2="892" y2="516" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="528" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스택 (하향 확장)</text>
<rect x="274" y="528" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="296" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">힙 (상향 확장)</text>
<rect x="435" y="528" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="457" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">BSS 세그먼트</text>
<rect x="583" y="528" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="605" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">커널 보호 영역</text>
</svg>
<title id="dt">명령행 인자와 환경 목록의 전달 흐름</title><desc id="dd">셸이 파싱한 인자 배열과 부모의 환경 목록 사본이 execve 시스템 콜을 거쳐 새 프로세스의 main 진입점까지 전달되는 과정</desc>
<rect width="880" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-03 절 지도</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">명령행 인자와 환경 목록의 전달 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">실제 인자 necho hello world 와 환경 변수 SHELL=/bin/bash 가 전달되는 데이터 흐름</text>
<rect x="24" y="104" width="246" height="280" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="147.0" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">1. 셸 명령 입력 · 파싱</text>
<text x="147.0" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">$ necho hello world</text>
<line x1="36" y1="160" x2="258" y2="160" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="36" y="165" width="222" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="46" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="500" fill="#5E6B7E">명령 파싱</text>
<text x="250" y="182" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">공백 기준 3단어 분리</text>
<rect x="36" y="198" width="222" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="46" y="215" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#5E6B7E">argv[0]</text>
<text x="250" y="215" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">"necho" (프로그램 이름)</text>
<rect x="36" y="231" width="222" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="46" y="248" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#5E6B7E">argv[1]</text>
<text x="250" y="248" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">"hello" (첫째 인자)</text>
<rect x="36" y="264" width="222" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="46" y="281" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#5E6B7E">argv[2]</text>
<text x="250" y="281" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">"world" (둘째 인자)</text>
<rect x="36" y="297" width="222" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="46" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="500" fill="#5E6B7E">부모 환경</text>
<text x="250" y="314" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">SHELL=/bin/bash 외</text>

<title id="dt">PPid 를 따라 올라가면 init 에 닿는다</title><desc id="dd">각 프로세스는 부모의 PID 를 PPid 로 갖고, 부모를 거듭 따라가면 PID 1 인 init 에 닿는다.</desc>
<rect width="960" height="336" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">PPid 를 따라 올라가면 init 에 닿는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">init 에서 sshd, bash, worker 로 이어지는 부모-자식 사슬과 PPid 값</text>
<path d="M 212 158.0 L 258 158.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 452 158.0 L 498 158.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

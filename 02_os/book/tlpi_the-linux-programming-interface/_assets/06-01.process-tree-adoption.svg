<title id="dt">부모 프로세스 사슬과 부모 종료 시 init 입양 전후 비교</title><desc id="dd">프로세스는 init(PID 1)을 뿌리로 하는 트리를 이루며, 부모가 먼저 종료되면 자식은 가장 가까운 subreaper 조상에, 없으면 init에 입양됩니다.</desc>
<rect width="880" height="450" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">부모 프로세스 사슬과 부모 종료 시 init 입양 전후 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">부모 생존 시 정상 사슬(getppid()=1200)과 부모 bash 종료 후 init 직속 입양(getppid()=1) 구조</text>

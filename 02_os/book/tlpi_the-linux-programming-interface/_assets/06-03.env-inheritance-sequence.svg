<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">환경 목록의 상속과 단방향 전달 (one-way and once-only)</title><desc id="dd">자식 프로세스는 생성 시점에 부모의 환경 사본을 한 번만 복사받으며 이후 어느 쪽이 환경을 고쳐도 상대방에게 보이지 않습니다.</desc>
<rect width="880" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">환경 목록의 상속과 단방향 전달 (one-way and once-only)</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">부모 PID 1000 에서 TARGET=alpha 를 export 한 뒤 자식 PID 1001 이 값을 바꿔도 부모에 영향이 없는 흐름</text>
<rect x="24.0" y="104" width="240" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="144.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">부모 프로세스</text>
<text x="144.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">PID 1000 · bash</text>
<rect x="592.0" y="104" width="240" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="712.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">자식 프로세스</text>
<text x="712.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">PID 1001 · subshell / myprog</text>
<line x1="144.0" y1="154" x2="144.0" y2="390" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="712.0" y1="154" x2="712.0" y2="390" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 154.0 160 L 202.0 160 L 202.0 180 L 157.0 180" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="212.0" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">TARGET=alpha 설정 및 export</text>
<text x="212.0" y="183" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">환경 목록에 TARGET=alpha 등록</text>
<rect x="93.0" y="190" width="102.0" height="20" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="144.0" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">TARGET=alpha</text>
<path d="M 154.0 230 L 700.0 230" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="428.0" y="221" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">fork() 시스템 콜 (환경 목록 복사)</text>
<text x="428.0" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부모 환경 사본 1회 전달</text>
<rect x="643.5" y="250" width="137.0" height="20" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="712.0" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">TARGET=alpha (사본)</text>
<path d="M 702.0 285 L 664.0 285 L 664.0 305 L 699.0 305" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="656.0" y="291" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">TARGET=beta 수정 (setenv)</text>
<text x="656.0" y="308" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자식 메모리의 환경 목록만 갱신</text>
<rect x="664.5" y="315" width="95.0" height="20" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="712.0" y="329" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">TARGET=beta</text>
<path d="M 702.0 350 L 156.0 350" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="3 3"/>
<text x="428.0" y="341" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">exit(0) 종료 (자식 주소공간 소멸)</text>
<text x="428.0" y="367" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부모 환경에 전달되는 변경사항 없음</text>
<rect x="75.5" y="365" width="137.0" height="20" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="144.0" y="379" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">TARGET=alpha (불변)</text>
<line x1="12" y1="415" x2="832" y2="415" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="437" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="427" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="437" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부모 환경 상태</text>
<rect x="248" y="427" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="270" y="437" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">복사 및 생성 전달</text>
<rect x="422" y="427" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="444" y="437" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자식 독립 수정</text>
</svg>
<title id="dt">페이지 테이블이 가상 페이지를 프레임에 잇는다</title><desc id="dd">프로세스 A·B 의 같은 가상 페이지가 서로 다른 프레임으로 이어지고, 같은 프로그램의 코드 페이지는 한 프레임을 함께 가리킵니다.</desc>
<rect width="980" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">페이지 테이블이 가상 페이지를 프레임에 잇는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">프레임 번호와 페이지 용도는 설명용 예시입니다.</text>

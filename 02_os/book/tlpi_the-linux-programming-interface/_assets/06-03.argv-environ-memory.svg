<rect x="44" y="298" width="110" height="32" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.9"/>
<text x="54" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">argv[2]</text>
<text x="139" y="318" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">포인터</text>
<rect x="224" y="298" width="180" height="32" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.9"/>
<text x="314" y="318" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">"world\0"</text>
<path d="M 154 314 L 218 314" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="44" y="340" width="110" height="32" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<text x="54" y="360" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">argv[3]</text>

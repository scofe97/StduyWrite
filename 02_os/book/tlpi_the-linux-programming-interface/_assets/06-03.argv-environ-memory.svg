<title id="dt">argv 포인터 배열과 environ 환경 목록의 메모리 배치</title><desc id="dd">인자 목록(argv)과 환경 목록(environ)은 모두 NULL 포인터로 끝나는 포인터 배열이며 각 원소는 널 종료 문자열을 가리킵니다.</desc>
<rect width="880" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-03 §1, §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">argv 포인터 배열과 environ 환경 목록의 메모리 배치</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원서 Figure 6-4 의 necho 인자 구조와 Figure 6-5 의 printenv 환경 변수 목록 구조</text>
<rect x="24" y="104" width="400" height="340" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="224.0" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">인자 목록: argv 포인터 배열과 문자열</text>
<text x="224.0" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">명령: necho hello world (argc = 3)</text>
<line x1="36" y1="160" x2="412" y2="160" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="44" y="172" width="100" height="30" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="94" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">argc</text>
<text x="94" y="197" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">3</text>
<rect x="44" y="214" width="110" height="32" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.9"/>
<text x="54" y="234" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">argv[0]</text>
<text x="139" y="234" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">포인터</text>
<rect x="224" y="214" width="180" height="32" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.9"/>
<text x="314" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">"necho\0"</text>

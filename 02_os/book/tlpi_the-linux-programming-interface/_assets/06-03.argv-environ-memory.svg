<text x="54" y="276" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">argv[1]</text>
<text x="139" y="276" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">포인터</text>
<rect x="224" y="256" width="180" height="32" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.9"/>
<text x="314" y="276" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">"hello\0"</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">environ 은 NAME=value 문자열을 가리키는 포인터 배열이다</title><desc id="dd">전역 변수 environ 이 포인터 배열의 시작을 가리키고, 각 칸은 NAME=value 형태의 널 종료 문자열을 가리킨다. 배열은 NULL 칸으로 끝나고 개수를 담은 변수는 없다.</desc>
<rect width="880" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-03 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">environ 은 NAME=value 문자열을 가리키는 포인터 배열이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽 칸은 포인터, 오른쪽 칸은 NAME=value 문자열입니다. 문자열 순서는 정해져 있지 않습니다.</text>
<rect x="40" y="104" width="200" height="48" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="56" y="134" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">environ</text>
<text x="224" y="134" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">char **</text>
<text x="40" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">포인터 배열</text>
<text x="560" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">가리키는 문자열</text>
<rect x="40" y="204" width="200" height="40" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.9"/>
<text x="56" y="230" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">environ[0]</text>
<path d="M 240 224 L 356 224" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="360" y="204" width="480" height="40" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="600" y="230" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">LOGNAME=mtk\0</text>
<rect x="40" y="256" width="200" height="40" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.9"/>
<text x="56" y="282" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">environ[1]</text>
<path d="M 240 276 L 356 276" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="360" y="256" width="480" height="40" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="600" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">SHELL=/bin/bash\0</text>
<rect x="40" y="308" width="200" height="40" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.9"/>
<text x="56" y="334" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">environ[2]</text>
<path d="M 240 328 L 356 328" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="360" y="308" width="480" height="40" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="600" y="334" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">HOME=/home/mtk\0</text>
<rect x="40" y="360" width="200" height="40" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.9"/>
<text x="56" y="386" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">environ[3]</text>
<path d="M 240 380 L 356 380" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="360" y="360" width="480" height="40" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="600" y="386" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">PATH=/usr/local/bin:/usr/bin:/bin:.\0</text>
<rect x="40" y="412" width="200" height="40" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.9"/>
<text x="56" y="438" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">environ[4]</text>
<path d="M 240 432 L 356 432" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="360" y="412" width="480" height="40" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="600" y="438" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">TERM=xterm\0</text>
<rect x="40" y="464" width="200" height="40" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<text x="56" y="490" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">environ[5]</text>
<line x1="240" y1="484" x2="356" y2="484" stroke="#8B98A9" stroke-width="1.0" stroke-dasharray="3 3"/>
<rect x="360" y="464" width="480" height="40" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="600" y="490" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">NULL — 배열의 끝. 개수 변수는 없음</text>
<line x1="12" y1="564" x2="832" y2="564" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="586" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="576" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="586" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">포인터 칸</text>
<rect x="209" y="576" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="231" y="586" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">환경 문자열</text>
<rect x="331" y="576" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="353" y="586" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">배열 끝</text>
</svg>
<title id="dt">호출마다 스택 프레임이 한 겹 쌓인다</title><desc id="dd">square() 가 실행되는 동안의 스택. main() 이 doCalc() 를, doCalc() 가 square() 를 불렀고 프레임마다 변수와 호출 연결 정보가 든다.</desc>
<rect width="940" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-02 §3</text>

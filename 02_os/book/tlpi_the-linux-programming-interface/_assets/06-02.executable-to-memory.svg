<title id="dt">BSS 는 파일에 크기만 남는다</title><desc id="dd">mem_segments.c 를 컴파일한 실행 파일 ms 와, mbuf 에 초기값을 붙인 mi 가 디스크에서 메모리로 올라가는 과정. 값은 size 와 ls -l 출력이다.</desc>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">초기값이 없는 mbuf 는 BSS 로 가서 파일이 16,280 바이트이고, 초기값이 붙으면 data 로 옮겨 가 파일이 10,256,296 바이트가 됩니다.</text>

<title id="dt">실행할 때마다 배치가 달라집니다</title><desc id="dd">ASLR 이 켜지면 유저 VAS 의 절대 맵이 매 실행 달라진다. 같은 세그먼트가 실행 1 과 실행 2 에서 다른 주소에 놓이고, 이동량은 세그먼트마다 따로 뽑힌 랜덤 페이지 정렬 오프셋이다. heap 만 randomize_va_space 가 2 여야 움직인다.</desc>
<rect width="928" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 07-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">실행할 때마다 배치가 달라집니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">세로 눈금은 상대 위치입니다 — 절대 주소는 매 실행 달라지므로 적지 않았습니다</text>
<text x="340" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">실행 1</text>
<text x="660" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">실행 2</text>
<line x1="340" y1="164" x2="340" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<line x1="660" y1="164" x2="660" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<path d="M 260 456 L 260 176" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="248" y="184" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">높은</text>
<text x="248" y="204" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">주소</text>
<line x1="340" y1="192" x2="660" y2="216" stroke="#3FB98C" stroke-width="1.6"/>
<circle cx="340" cy="192" r="5" fill="#3FB98C"/>
<circle cx="660" cy="216" r="5" fill="#3FB98C"/>
<text x="320" y="197" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">stack</text>
<line x1="340" y1="248" x2="660" y2="236" stroke="#3FB98C" stroke-width="1.6"/>
<circle cx="340" cy="248" r="5" fill="#3FB98C"/>
<circle cx="660" cy="236" r="5" fill="#3FB98C"/>
<text x="320" y="253" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">vDSO 페이지</text>
<line x1="340" y1="304" x2="660" y2="332" stroke="#3FB98C" stroke-width="1.6"/>
<circle cx="340" cy="304" r="5" fill="#3FB98C"/>
<circle cx="660" cy="332" r="5" fill="#3FB98C"/>
<text x="320" y="309" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">공유 라이브러리</text>
<line x1="340" y1="360" x2="660" y2="380" stroke="#3FB98C" stroke-width="1.6"/>
<circle cx="340" cy="360" r="5" fill="#3FB98C"/>
<circle cx="660" cy="380" r="5" fill="#3FB98C"/>
<text x="320" y="365" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">mmap 기반 할당</text>
<line x1="340" y1="444" x2="660" y2="416" stroke="#F08A59" stroke-width="1.6"/>
<circle cx="340" cy="444" r="5" fill="#F08A59"/>
<circle cx="660" cy="416" r="5" fill="#F08A59"/>
<text x="320" y="449" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">heap</text>
<text x="320" y="470" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">값 2 에서만 움직입니다</text>
<text x="684" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">선의 기울기가</text>
<text x="684" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">그 실행에서 뽑힌</text>
<text x="684" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">랜덤 오프셋입니다</text>
<text x="684" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">세그먼트마다</text>
<text x="684" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">따로 뽑습니다</text>
<text x="24" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">sysctl 은 /proc/sys/kernel/randomize_va_space 입니다.</text>
<text x="24" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">0 은 끔, 1 은 mmap·stack·vDSO·공유 라이브러리, 2 는 거기에 heap 까지 랜덤화합니다(기본값).</text>
<text x="24" y="544" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">랜덤화 비트가 많지 않아 엔트로피가 낮습니다 — 통계적 방어일 뿐입니다.</text>
<line x1="12" y1="564" x2="880" y2="564" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="586" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="575" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="587" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">값 1 부터 랜덤화</text>
<rect x="298" y="575" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="320" y="587" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">heap — 값 2 에서만</text>
</svg>
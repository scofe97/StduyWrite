<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 976 648" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">8KB 하나로 길이 갈립니다</title><desc id="dd">kmalloc 은 8바이트부터 8192바이트까지의 kmalloc-N 캐시에서 best-fit 으로 준다. 요청이 8KB 를 넘으면 slab 이 처리하지 않고 그대로 페이지 할당자로 넘기므로, 그 순간부터는 페이지 할당자의 내부 단편화와 4MB 상한을 그대로 물려받는다.</desc>
<rect width="976" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 08-02 §3·§4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">8KB 하나로 길이 갈립니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">8KB 를 넘는 순간 slab 의 이점이 사라집니다</text>
<rect x="336" y="120" width="304" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="488.0" y="154" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">kmalloc(size, gfp)</text>
<rect x="336" y="208" width="304" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="488.0" y="242" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">size 가 8192바이트 이하인가?</text>
<path d="M 488.0 176 L 488.0 202" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="24" y="320" width="280" height="176" rx="8" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="40" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">kmalloc-N 캐시에서 best-fit</text>
<text x="40" y="378" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">8 · 16 · 32 · … · 4k · 8k</text>
<text x="40" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">12바이트 요청 → kmalloc-16</text>
<text x="40" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">16바이트를 받고 4바이트를 버립니다</text>
<text x="40" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">물리 연속 · cacheline 정렬 보장</text>
<path d="M 336 236 L 164.0 236 L 164.0 314" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="305.5" y="225" width="29.0" height="22" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="320.0" y="241" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">예</text>
<rect x="672" y="320" width="280" height="176" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="688" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">페이지 할당자로 그대로 위임</text>
<text x="688" y="378" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">__alloc_pages()</text>
<text x="688" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">order 로 올려 2의 거듭제곱을 줍니다</text>
<text x="688" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">내부 단편화를 그대로 물려받습니다</text>
<text x="688" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">한 번에 최대 4MB — 2^(MAX_ORDER-1)</text>
<path d="M 640 236 L 812.0 236 L 812.0 314" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<rect x="628.5" y="225" width="55.0" height="22" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="656.0" y="241" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">아니오</text>
<text x="24" y="536" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">Raspberry Pi 같은 ARM 에서는 kmalloc-N 이 64바이트부터 시작합니다. 12바이트를 요청해도 64바이트를 받습니다.</text>
<text x="24" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">4MB 가 상한이라고 해서 요청하면 늘 받는 것은 아닙니다. 그 시점 freelist 에 물리 연속 4MB 청크가 남아 있어야 합니다.</text>
<line x1="12" y1="592" x2="928" y2="592" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="614" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="603" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="615" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">호출 지점</text>
<rect x="223" y="603" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="245" y="615" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">slab 이 처리하는 길</text>
<rect x="466" y="603" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="488" y="615" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">갈림길</text>
<rect x="559" y="603" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="581" y="615" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">페이지 할당자로 넘어가는 길</text>
</svg>
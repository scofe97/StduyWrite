<title id="dt">sleep 해도 되는 자리인지가 전부입니다</title><desc id="dd">GFP 플래그는 모든 할당 API 의 첫 인자다. 고르는 기준은 하나 — 지금 이 코드가 sleep 해도 되는 자리인가. 프로세스 컨텍스트이고 sleep 이 안전하면 GFP_KERNEL, 인터럽트나 spinlock 처럼 sleep 이 불가능하면 GFP_ATOMIC 이다. 어기면 머신이 멈추거나 커널이 죽는다.</desc>
<rect width="1000" height="612" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 08-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">sleep 해도 되는 자리인지가 전부입니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">sleep 을 일으키는 것은 결국 schedule() 호출입니다</text>
<rect x="24" y="116" width="268" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="158.0" y="143" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">지금 어느 자리인가</text>
<rect x="308" y="116" width="180" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="398.0" y="143" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">GFP_KERNEL</text>
<rect x="500" y="116" width="180" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="590.0" y="143" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">GFP_ATOMIC</text>
<rect x="692" y="116" width="180" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="782.0" y="143" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">GFP_NOIO</text>
<rect x="24" y="168" width="268" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="195" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">프로세스 컨텍스트 · sleep 안전</text>
<rect x="308" y="168" width="180" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="398.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">씁니다</text>
<rect x="500" y="168" width="180" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="590.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">써도 되나 불필요</text>
<rect x="692" y="168" width="180" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="782.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">I/O 금지 시에만</text>
<rect x="24" y="220" width="268" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="247" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">인터럽트 · atomic 컨텍스트</text>
<rect x="308" y="220" width="180" height="44" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="398.0" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">머신이 멈춥니다</text>
<rect x="500" y="220" width="180" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="590.0" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">이것만 씁니다</text>
<rect x="692" y="220" width="180" height="44" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="782.0" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">안 됩니다</text>
<rect x="24" y="272" width="268" height="44" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="40" y="299" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">spinlock 을 쥐고 있음</text>
<rect x="308" y="272" width="180" height="44" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="398.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">LDV 위반 · deadlock</text>
<rect x="500" y="272" width="180" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="590.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">이것만 씁니다</text>
<rect x="692" y="272" width="180" height="44" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="782.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">안 됩니다</text>
<rect x="24" y="324" width="268" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="351" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">mutex 를 쥐고 있음</text>
<rect x="308" y="324" width="180" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="398.0" y="351" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">씁니다</text>
<rect x="500" y="324" width="180" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="590.0" y="351" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">써도 되나 불필요</text>
<rect x="692" y="324" width="180" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="782.0" y="351" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">I/O 금지 시에만</text>
<rect x="24" y="376" width="268" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="403" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">USB 디바이스 lock 을 쥐고 있음</text>
<rect x="308" y="376" width="180" height="44" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="398.0" y="403" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">LDV 위반</text>
<rect x="500" y="376" width="180" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="590.0" y="403" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">됩니다</text>
<rect x="692" y="376" width="180" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="782.0" y="403" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">이것을 씁니다</text>
<text x="24" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">spinlock 은 쥔 채 sleep 할 수 없고 mutex 는 할 수 있습니다 — 이 차이가 두 줄의 판정을 갈랐습니다.</text>
<text x="24" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">지금이 atomic 인지 모르겠으면 CONFIG_DEBUG_ATOMIC_SLEEP 을 켜고 in_task()·in_atomic() 으로 판별합니다.</text>
<text x="24" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">__GFP_ZERO 를 OR 하면 0 으로 초기화된 메모리를 받습니다. 좋은 관행입니다.</text>
<line x1="12" y1="556" x2="952" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="567" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="579" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">써도 되는 자리</text>
<rect x="268" y="567" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="290" y="579" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">가능하나 권하지 않음</text>
<rect x="481" y="567" width="14" height="14" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="503" y="579" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">쓰면 안 되는 자리</text>
<rect x="679" y="567" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="701" y="579" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">가장 자주 어기는 줄</text>
</svg>
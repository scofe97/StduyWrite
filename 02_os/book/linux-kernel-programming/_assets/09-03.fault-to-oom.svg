<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">커널 로그의 스택을 아래에서 위로 읽으면 이 순서가 그대로 나옵니다</text>

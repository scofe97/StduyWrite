<title id="dt">폴트에서 OOM 까지는 한 줄기입니다</title><desc id="dd">가상 페이지를 만지면 MMU 가 변환을 시도하고, 매핑이 없으면 페이지 폴트 핸들러로 제어가 넘어간다. 핸들러가 정당한 접근이라 판단하면 페이지 할당자에 프레임 하나를 요청한다. 극심한 압박으로 그 프레임을 끝내 못 얻으면 out_of_memory() 가 불리고 누군가 SIGKILL 된다.</desc>
<rect width="1000" height="760" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 09-03 §2</text>

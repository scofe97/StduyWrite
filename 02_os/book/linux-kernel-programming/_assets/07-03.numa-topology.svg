<title id="dt">가까운 노드에서 먼저 가져옵니다</title><desc id="dd">본문의 AMD 서버 예시. 2 소켓 × 8 코어 × 2 hyperthread 로 32 코어, 8GB 뱅크 넷으로 32GB. 커널이 NUMA 노드 4개를 만들고, 스레드가 도는 코어에서 가장 가까운 노드의 free 페이지 프레임부터 씁니다.</desc>
<rect width="976" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 07-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">가까운 노드에서 먼저 가져옵니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">노드가 둘 이상이고 멀티코어면 진짜 NUMA 입니다 — 노드 하나면 UMA 입니다</text>
<rect x="32" y="132" width="416" height="268" rx="10" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="48" y="160" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">소켓 0</text>
<text x="432" y="160" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">코어 8 × 2 HT = 16 스레드</text>
<line x1="48" y1="176" x2="432" y2="176" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="48" y="244" width="184" height="96" rx="8" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="140.0" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">NUMA 노드 0</text>
<text x="140.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">RAM 뱅크 8GB</text>
<text x="140.0" y="322" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">pg_data_t[0]</text>
<rect x="248" y="244" width="184" height="96" rx="8" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="340.0" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">NUMA 노드 1</text>
<text x="340.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">RAM 뱅크 8GB</text>
<text x="340.0" y="322" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">pg_data_t[1]</text>
<rect x="528" y="132" width="416" height="268" rx="10" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="544" y="160" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">소켓 1</text>
<text x="928" y="160" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">코어 8 × 2 HT = 16 스레드</text>
<line x1="544" y1="176" x2="928" y2="176" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="544" y="244" width="184" height="96" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="636.0" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">NUMA 노드 2</text>
<text x="636.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">RAM 뱅크 8GB</text>
<text x="636.0" y="322" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">pg_data_t[2]</text>
<rect x="744" y="244" width="184" height="96" rx="8" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="836.0" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">NUMA 노드 3</text>
<text x="836.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">RAM 뱅크 8GB</text>
<text x="836.0" y="322" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">pg_data_t[3]</text>
<rect x="544" y="172" width="184" height="44" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="636.0" y="199" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">CPU #18 의 스레드</text>
<path d="M 636.0 216 L 636.0 238" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<rect x="697.0" y="223" width="94.0" height="22" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="744.0" y="239" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">가까운 노드</text>
<path d="M 544 194 L 488 194 L 488 372 L 340.0 372 L 340.0 346" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)" stroke-dasharray="5 5"/>
<rect x="454.0" y="289" width="68.0" height="22" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="488" y="305" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">먼 노드</text>
<text x="488" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">소켓 경계</text>
<text x="24" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">가까운 노드에 free 프레임이 없으면 interconnect 너머 다른 노드로 fallback 합니다 — 동작은 하되 느립니다.</text>
<text x="24" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">리눅스는 UMA 도 노드 하나짜리 가짜 NUMA 로 취급합니다. 코드 베이스를 갈래내지 않으려는 설계입니다.</text>
<line x1="12" y1="520" x2="928" y2="520" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="542" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="531" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="543" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">요청이 난 코어</text>
<rect x="268" y="531" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="290" y="543" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">가장 가까운 노드</text>
<rect x="451" y="531" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="473" y="543" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">다른 노드</text>
<rect x="574" y="531" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="596" y="543" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">소켓을 건너는 접근</text>

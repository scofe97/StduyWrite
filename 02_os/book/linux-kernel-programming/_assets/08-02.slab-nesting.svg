<text x="684" y="351" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">작은 할당 낭비 완화</text>
<text x="644" y="392" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">12바이트 요청에 kmalloc-16 이 16바이트를 줍니다</text>
<text x="644" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">페이지 할당자였다면 4KB 였을 자리입니다</text>
<text x="24" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">Jeff Bonwick 이 SunOS 에서 낸 아이디어입니다. 특정 커널 객체가 자주 할당·해제되니 미리 캐시해 두자는 것이었습니다.</text>
<text x="24" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">전통적 heap 할당자는 잦은 할당·해제로 구멍을 만들지만, slab 객체는 캐시로 반납되므로 성능이 유지됩니다.</text>

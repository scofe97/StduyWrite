<title id="dt">페이지 안에 slab, slab 안에 객체</title><desc id="dd">slab 할당자는 페이지 할당자에서 물리 연속 청크를 받아 그것을 같은 크기의 객체로 잘라 둔다. 그래서 slab 을 쓰는 코드도 결국 페이지 할당자에서 메모리를 받는다. 이 계층이 존재하는 이유는 둘 — 자주 쓰는 커널 객체를 미리 캐시하는 것과, 페이지보다 작은 요청의 낭비를 줄이는 것이다.</desc>

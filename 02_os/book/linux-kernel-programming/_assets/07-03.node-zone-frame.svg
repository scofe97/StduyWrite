<title id="dt">물리 RAM 은 3단계로 쪼개집니다</title><desc id="dd">커널은 부팅 시 물리 RAM 을 트리형 계층으로 조직한다. 노드가 물리 RAM 뱅크를 추상화하고, 그 안이 존으로 구획되며, 존은 페이지 프레임으로 이뤄진다. 페이지 프레임은 PFN 으로 추적한다.</desc>
<rect width="928" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 07-03 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">물리 RAM 은 3단계로 쪼개집니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">존 이름과 개수는 부팅 때 커널이 동적으로 정합니다 — 고정 목록이 아닙니다</text>

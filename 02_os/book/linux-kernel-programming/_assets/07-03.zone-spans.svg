<title id="dt">존을 가르는 것은 크기가 아닙니다</title><desc id="dd">한 노드 안의 세 존을 물리 주소 축 위에 실제 비율로 놓았다. ZONE_DMA 는 전체의 0.09% 라 이 눈금에서 보이지 않는데도 별도 존인 이유는, 존을 가르는 기준이 크기가 아니라 그 구간에만 닿을 수 있는 하드웨어가 있다는 사실이기 때문이다.</desc>
<rect width="1000" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 07-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">존을 가르는 것은 크기가 아닙니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">본문 journalctl 출력의 범위를 그대로 옮겼습니다 — 막대 길이는 실제 비율입니다</text>
<text x="24" y="199" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">ZONE_DMA</text>
<rect x="160.00017731258598" y="176" width="3" height="36" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="176.72627235213204" y="199" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">16 MiB · 0.09%  ·  옛 ISA 장치가 닿는 저주소</text>
<text x="24" y="251" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">ZONE_DMA32</text>
<rect x="160.72627235213204" y="228" width="185.19944979367264" height="36" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.1"/>
<text x="361.9257221458047" y="251" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6A95D8">4 GiB · 23.4%  ·  32비트 DMA 가 닿는 범위</text>
<text x="24" y="303" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">ZONE_NORMAL</text>
<rect x="345.9257221458047" y="280" width="606.0742778541953" height="36" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="361.9257221458047" y="303" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">13 GiB · 76.5%  ·  나머지 일반 메모리</text>
<line x1="160" y1="340" x2="952" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="160.0" y1="340" x2="160.0" y2="348" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="160.0" y="366" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0 GiB</text>
<line x1="345.9257221458047" y1="340" x2="345.9257221458047" y2="348" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="345.9257221458047" y="366" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">4 GiB</text>
<line x1="531.8514442916094" y1="340" x2="531.8514442916094" y2="348" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="531.8514442916094" y="366" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">8 GiB</text>
<line x1="717.777166437414" y1="340" x2="717.777166437414" y2="348" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="717.777166437414" y="366" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">12 GiB</text>
<line x1="952" y1="340" x2="952" y2="348" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="952" y="366" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">17.04 GiB</text>
<text x="24" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">물리 주소</text>
<text x="24" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">존 이름과 개수는 부팅 시 커널이 동적으로 정합니다. /proc/buddyinfo 의 맨 왼쪽이 Node 0 하나뿐이면 UMA 입니다.</text>
<text x="24" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">존마다 PFN 범위가 할당되고, 자료 구조는 include/linux/mmzone.h 의 struct zone 입니다.</text>
<text x="24" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">32비트에는 ZONE_HIGHMEM 도 있었습니다 — 하드웨어 제약이 아니라 커널 VAS 가 모자라 생긴 소프트웨어 난점이었습니다.</text>
<line x1="12" y1="472" x2="952" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="494" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="483" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="495" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">보이지 않아도 별도 존</text>
<rect x="328" y="483" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="350" y="495" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">32비트 DMA 범위</text>
<rect x="541" y="483" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="563" y="495" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">일반 메모리</text>
</svg>
<title id="dt">빠른 경로로 빠지거나, 테이블을 걷거나</title><desc id="dd">MMU 의 주소 변환. CPU 캐시와 TLB 는 변환을 건너뛰는 빠른 경로이고, 둘 다 빗나가야 MMU 가 페이지 테이블을 PGD·PUD·PMD·PTE 순으로 걷는다. 걷다 실패하면 fault 가 나는데, 버그인 fault 와 정상인 fault 가 갈린다.</desc>
<rect width="928" height="672" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 07-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">빠른 경로로 빠지거나, 테이블을 걷거나</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">아래로 내려갈수록 비쌉니다 — 페이지 테이블 walk 는 가장 마지막 수단입니다</text>
<rect x="232" y="116" width="280" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="372.0" y="149.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">가상 주소에 접근한다</text>
<rect x="232" y="204" width="280" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="372.0" y="237.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">CPU 캐시에 있나?</text>
<rect x="232" y="292" width="280" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="372.0" y="325.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">TLB 에 변환이 있나?</text>
<rect x="232" y="380" width="280" height="72" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="372.0" y="406" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">MMU 가 페이지 테이블을 걷는다</text>
<text x="372.0" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">PGD → PUD → PMD → PTE</text>
<rect x="232" y="484" width="280" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="372.0" y="517.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">물리 주소가 주소 라인에 실린다</text>
<path d="M 372.0 176 L 372.0 198" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 372.0 264 L 372.0 286" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="280.5" y="265" width="55.0" height="22" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="308.0" y="281" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">아니오</text>
<path d="M 372.0 352 L 372.0 374" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="280.5" y="353" width="55.0" height="22" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="308.0" y="369" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">아니오</text>
<path d="M 372.0 456 L 372.0 478" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="576" y="204" width="328" height="56" rx="8" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="592" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">캐시 안에서 끝난다</text>
<text x="592" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">변환 자체가 필요 없습니다</text>
<rect x="576" y="292" width="328" height="56" rx="8" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="592" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">캐시된 물리 주소를 쓴다</text>
<text x="592" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">테이블을 걷지 않고 건너뜁니다</text>
<rect x="576" y="380" width="328" height="72" rx="8" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="592" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">변환에 실패한다</text>
<text x="592" y="426" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">unmapped — 버그입니다. SIGSEGV 로 죽습니다</text>
<text x="592" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">미할당 — demand paging 이 프레임을 답니다</text>
<path d="M 516 232.0 L 570 232.0" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="529.5" y="199.0" width="29.0" height="22" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="544.0" y="215.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">예</text>
<path d="M 516 320.0 L 570 320.0" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="529.5" y="287.0" width="29.0" height="22" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="544.0" y="303.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">예</text>
<path d="M 516 416.0 L 570 416.0" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="523.0" y="383.0" width="42.0" height="22" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="544.0" y="399.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">실패</text>
<text x="24" y="238" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">cache hit</text>
<text x="24" y="326" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">TLB hit</text>
<text x="24" y="410" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">page table</text>
<text x="24" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">walk</text>
<text x="24" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">베이스 테이블 주소는 가상이 아니라 물리 주소입니다(x86 은 CR3, ARM 은 TTBR0/TTBR1).</text>
<text x="24" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">가상이면 그것을 변환하려고 또 테이블을 걸어야 해 무한 재귀가 됩니다.</text>
<line x1="12" y1="616" x2="880" y2="616" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="638" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="627" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="639" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">빠른 경로</text>
<rect x="223" y="627" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="245" y="639" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">분기</text>
<rect x="301" y="627" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="323" y="639" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">느린 경로 — 이 절의 논점</text>
<rect x="574" y="627" width="14" height="14" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="596" y="639" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">fault</text>
</svg>
<title id="dt">임계값을 넘는 순간 낭비가 튑니다</title><desc id="dd">요청 크기를 조금씩 늘리며 ksize() 로 실제 할당량을 재면 톱니 모양이 나온다. 커널의 실제 크기에 가까워질수록 낭비가 0 으로 떨어지다가, 그 값을 넘는 순간 다음 크기로 점프해 낭비가 100% 가까이 치솟는다. 2,048,100 에서 2% 였던 것이 2,252,900 에서 86% 가 된다.</desc>
<rect width="976" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 08-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">임계값을 넘는 순간 낭비가 튑니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">본문 실측 여섯 점입니다 — 백분율은 원문 표기(버림)를 그대로 옮겼습니다</text>
<line x1="160" y1="440.0" x2="920" y2="440.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="144" y="445.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0%</text>
<line x1="160" y1="370.0" x2="920" y2="370.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="144" y="375.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">25%</text>
<line x1="160" y1="300.0" x2="920" y2="300.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="144" y="305.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">50%</text>
<line x1="160" y1="230.0" x2="920" y2="230.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="144" y="235.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">75%</text>
<line x1="160" y1="160.0" x2="920" y2="160.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="144" y="165.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">100%</text>
<text x="144" y="140" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">낭비율</text>
<line x1="191.66666666666666" y1="440" x2="191.66666666666666" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="191.66666666666666" y="466" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">1.6M</text>
<line x1="318.33333333333337" y1="440" x2="318.33333333333337" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="318.33333333333337" y="466" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">1.8M</text>
<line x1="445.0" y1="440" x2="445.0" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="445.0" y="466" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">2.0M</text>
<line x1="571.6666666666666" y1="440" x2="571.6666666666666" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="571.6666666666666" y="466" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">2.2M</text>
<line x1="698.3333333333334" y1="440" x2="698.3333333333334" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="698.3333333333334" y="466" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">2.4M</text>
<line x1="825.0" y1="440" x2="825.0" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="825.0" y="466" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">2.6M</text>
<text x="920" y="488" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">요청 바이트</text>
<line x1="506.52959999999996" y1="148" x2="506.52959999999996" y2="448" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="516.5296" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">2 MiB — 여기서 할당 단위가 4 MiB 로 올라갑니다</text>
<path d="M 216.05 364.4 L 345.75666666666666 403.6 L 475.46333333333337 434.4 L 506.52959999999996 440.0" fill="none" stroke="#3FB98C" stroke-width="2.0"/>
<path d="M 506.52959999999996 160.0 L 605.1700000000001 199.20000000000002 L 734.8766666666667 244.0 L 864.5833333333334 280.4" fill="none" stroke="#F0616D" stroke-width="2.0"/>
<line x1="506.52959999999996" y1="440.0" x2="506.52959999999996" y2="160.0" stroke="#F0616D" stroke-width="2.0"/>
<circle cx="216.05" cy="364.4" r="5" fill="#3FB98C"/>
<text x="216.05" y="348.4" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">27%</text>
<circle cx="345.75666666666666" cy="403.6" r="5" fill="#3FB98C"/>
<text x="345.75666666666666" y="387.6" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">13%</text>
<circle cx="475.46333333333337" cy="434.4" r="5" fill="#3FB98C"/>
<text x="475.46333333333337" y="418.4" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">2%</text>
<circle cx="605.1700000000001" cy="199.20000000000002" r="5" fill="#F0616D"/>
<text x="605.1700000000001" y="183.20000000000002" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">86%</text>
<circle cx="734.8766666666667" cy="244.0" r="5" fill="#F0616D"/>
<text x="734.8766666666667" y="228.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">70%</text>
<circle cx="864.5833333333334" cy="280.4" r="5" fill="#F0616D"/>
<text x="864.5833333333334" y="264.4" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">57%</text>
<text x="617.1700000000001" y="203.20000000000002" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">2,252,900 → 86%</text>
<text x="24" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">받은 크기는 2,097,152(2 MiB) 아니면 4,194,304(4 MiB) 둘뿐입니다. 그 사이 값은 존재하지 않습니다.</text>
<text x="24" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">ksize() 는 slab 포인터에만 동작합니다. 페이지 할당자 API 의 반환값에는 쓸 수 없습니다.</text>
<text x="24" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">지름길은 하나입니다 — 1페이지 미만이면 slab, 1페이지를 넘으면 이 그래프가 적용됩니다.</text>
<line x1="12" y1="592" x2="928" y2="592" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="614" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="603" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="615" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">다음 임계값에 가까워지는 구간</text>
<rect x="388" y="603" width="14" height="14" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="410" y="615" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">임계값을 넘긴 구간</text>
<rect x="586" y="603" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="608" y="615" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">2 MiB 경계</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 976 696" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">없으면 위에서 빌려 쪼갭니다</title><desc id="dd">드라이버가 128KB 를 요청하면 32 페이지, 곧 order 5 다. order 5 리스트가 비어 있으면 할당자는 실패하지 않고 상위 order 청크를 하나 가져와 반으로 쪼갠다. 쪼갠 두 조각이 buddy block 이고, 한쪽은 요청자에게 다른 쪽은 하위 order 리스트로 간다.</desc>
<rect width="976" height="696" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 08-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">없으면 위에서 빌려 쪼갭니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">청크가 물리 연속이라 반으로 쪼개도 두 조각이 각각 물리 연속입니다</text>
<rect x="248" y="116" width="288" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="392.0" y="149.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">128KB 요청 = 32 페이지 = order 5</text>
<rect x="248" y="204" width="288" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="392.0" y="237.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">order 5 리스트에 청크가 있나?</text>
<rect x="248" y="292" width="288" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="392.0" y="325.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">order 6 리스트에 청크가 있나?</text>
<rect x="248" y="400" width="288" height="72" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="392.0" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">order 6 청크를 반으로 쪼갠다</text>
<text x="392.0" y="446" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">256KB 하나 → 128KB buddy block 둘</text>
<path d="M 392.0 176 L 392.0 198" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 392.0 264 L 392.0 286" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="288.5" y="265" width="55.0" height="22" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="316.0" y="281" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">비었다</text>
<path d="M 392.0 352 L 392.0 394" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="288.5" y="353" width="55.0" height="22" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="316.0" y="369" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">비었다</text>
<rect x="600" y="204" width="352" height="56" rx="8" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="616" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">dequeue 해서 주고 끝난다</text>
<text x="616" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">쪼갤 일이 없습니다</text>
<rect x="600" y="292" width="352" height="56" rx="8" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="616" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">상위 order 로 계속 올라간다</text>
<text x="616" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">order 10 까지 비면 할당 실패 — 드문 일입니다</text>
<path d="M 540 232 L 594 232" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="547.0" y="199" width="42.0" height="22" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="568.0" y="215" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">있다</text>
<path d="M 540 320 L 594 320" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="547.0" y="287" width="42.0" height="22" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="568.0" y="303" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">없다</text>
<line x1="392.0" y1="472" x2="392.0" y2="492" stroke="#F08A59" stroke-width="1.4"/>
<line x1="256" y1="492" x2="544" y2="492" stroke="#F08A59" stroke-width="1.4"/>
<path d="M 256 492 L 256 510" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 544 492 L 544 510" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="136" y="516" width="240" height="56" rx="8" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="256" y="548" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">절반은 요청자에게</text>
<rect x="424" y="516" width="240" height="56" rx="8" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="544" y="548" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6A95D8">절반은 order 5 에 enqueue</text>
<text x="24" y="612" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">해제할 때는 거꾸로입니다. 128KB 를 free 하면 buddy 를 먼저 찾고, 찾으면 256KB 로 병합해 order 6 에 넣습니다 — 이것이 defrag 입니다.</text>
<line x1="12" y1="640" x2="928" y2="640" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="662" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="651" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="663" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">바로 끝나는 길</text>
<rect x="268" y="651" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="290" y="663" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">분기</text>
<rect x="346" y="651" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="368" y="663" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">쪼개는 길 — 이 절의 논점</text>
<rect x="619" y="651" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="641" y="663" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">하위 order 로</text>
</svg>
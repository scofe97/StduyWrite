<title id="dt">가상 주소는 값이 아니라 비트맵입니다</title><desc id="dd">x86_64 는 64비트 중 하위 48비트만 주소에 쓴다. 그 48비트는 PGD·PUD·PMD·PTE 네 인덱스와 페이지 내 offset 으로 갈리고, 남은 상위 16비트는 커널이면 전부 1, 유저면 전부 0 이라 주소만 보고 둘을 가릴 수 있다.</desc>
<rect width="1000" height="492" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 07-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">가상 주소는 값이 아니라 비트맵입니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">칸 너비가 곧 비트 수입니다 — 상위 16비트가 주소의 4분의 1을 차지합니다</text>
<rect x="24" y="116" width="112" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="80.0" y="143" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">비트 구간</text>

<text x="884.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">페이지 내 offset</text>
<rect x="24" y="220" width="112" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="80.0" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">KVA</text>
<text x="80.0" y="257" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">커널에서 본 주소</text>
<rect x="140" y="220" width="204" height="44" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="242.0" y="247" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">1111 1111 1111 1111</text>
<rect x="344" y="220" width="616" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="652.0" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">0xffff … 아래 48비트는 주소마다 다릅니다</text>
<rect x="24" y="272" width="112" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="80.0" y="292" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">UVA</text>
<text x="80.0" y="309" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">유저에서 본 주소</text>
<rect x="140" y="272" width="204" height="44" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="242.0" y="299" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">0000 0000 0000 0000</text>
<rect x="344" y="272" width="616" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="652.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">0x0000 … 아래 48비트는 주소마다 다릅니다</text>
<text x="24" y="354" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">상위 16비트만 보면 KVA 인지 UVA 인지 즉시 갈립니다 — 커널 주소는 0xffff 로, 유저 주소는 0x0000 으로 시작합니다.</text>
<text x="24" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">bit 63 은 페이징 테이블 selector 이기도 합니다 — 설정이면 커널 테이블, 클리어면 프로세스 테이블입니다.</text>
<text x="24" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">9비트 인덱스가 네 번 반복되는 것이 4-level paging 입니다. 마지막 12비트는 4KB 페이지 안의 자리를 가리킵니다.</text>
<line x1="12" y1="436" x2="952" y2="436" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="458" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

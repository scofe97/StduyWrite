<text x="24" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">[vsyscall]·[vdso]·[vvar] 같은 특수 매핑도 보입니다 — 커널 모드 전환 없이 도는 시스템 콜 최적화입니다.</text>

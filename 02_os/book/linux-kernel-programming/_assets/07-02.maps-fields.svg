<title id="dt">maps 한 줄을 일곱으로 가릅니다</title><desc id="dd">/proc/PID/maps 한 줄은 유저 VAS 의 매핑 하나다. 일곱 필드가 각각 무엇을 말하는지와, 익명 매핑일 때 어느 필드가 비는지를 나란히 둔다. inode 가 0 이면 파일이 아니라 익명 매핑이라는 것이 가장 빠른 판별법이다.</desc>
<rect width="1000" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 07-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">maps 한 줄을 일곱으로 가릅니다</text>

<title id="dt">압박이 캐시를 풀고, 풀린 만큼 압박이 줄고</title><desc id="dd">캐시는 성능에 좋지만 필수는 아니다. 자유 메모리가 줄면 kswapd 가 등록된 shrinker 를 불러 캐시를 축소하고, 그렇게 풀린 페이지가 다시 자유 메모리를 늘린다. shrinker 를 등록하지 않은 custom slab cache 는 이 순환에 참여하지 못해, 압박이 와도 커널이 회수하지 못한다.</desc>
<rect width="928" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 09-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">압박이 캐시를 풀고, 풀린 만큼 압박이 줄고</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">등록하지 않으면 이 고리에서 빠집니다 — 그래서 best practice 입니다</text>
<rect x="348" y="116" width="232" height="84" rx="8" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<text x="464.0" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">자유 메모리가 줄어든다</text>
<text x="464.0" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">커널이 압박을 감지합니다</text>
<rect x="668" y="268" width="232" height="84" rx="8" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="784.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">kswapd 가 shrinker 를 부른다</text>
<text x="784.0" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">count_objects() 로 먼저 셉니다</text>
<rect x="348" y="420" width="232" height="84" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="464.0" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">캐시가 객체를 푼다</text>
<text x="464.0" y="478" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">scan_objects() 가 축소합니다</text>
<rect x="28" y="268" width="232" height="84" rx="8" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="144.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">페이지가 돌아온다</text>
<text x="144.0" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">자유 메모리가 늘어납니다</text>
<rect x="388" y="272" width="152" height="76" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="464.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">자유 메모리</text>
<text x="464.0" y="326" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">watermark 기준</text>
<path d="M 580 158 L 784 158 L 784 262" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 784 352 L 784 462 L 586 462" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 348 462 L 144 462 L 144 358" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 144 268 L 144 158 L 342 158" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="24" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">count_objects() 가 0 이나 SHRINK_EMPTY 를 돌려주면 scan_objects() 는 아예 불리지 않습니다.</text>
<text x="24" y="576" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">진행하면 deadlock 이 날 상황이면 scan_objects() 가 SHRINK_STOP 을 돌려 스스로 멈춥니다.</text>
<line x1="12" y1="624" x2="880" y2="624" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="646" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="635" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="647" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">압박 감지</text>
<rect x="223" y="635" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="245" y="647" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">커널이 부르는 쪽</text>
<rect x="406" y="635" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="428" y="647" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">축소 — 이 절의 논점</text>
<rect x="634" y="635" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="656" y="647" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">되돌아오는 메모리</text>
</svg>
<title id="dt">묻는 API 마다 328 이라 답합니다</title><desc id="dd">328바이트 구조로 전용 캐시를 만들면 sizeof·kmem_cache_size·ksize 가 모두 328 을 돌려준다. 그런데 커널이 실제로 뗀 것은 448바이트다. 객체마다 120바이트, 약 27% 가 어디에도 안 보이는 자리에서 사라진다. 정확한 값은 sysfs 의 slab_size 에만 있다.</desc>
<rect width="976" height="624" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 09-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">묻는 API 마다 328 이라 답합니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">막대 길이가 곧 바이트입니다 — 세 API 는 위 막대까지만 압니다</text>
<text x="24" y="168" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">sizeof(struct)</text>
<text x="24" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">컴파일 시점의 구조 크기</text>
<rect x="280" y="152" width="453.92857142857133" height="40" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.1"/>
<text x="296" y="177" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">328 B</text>
<text x="24" y="232" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">kmem_cache_size()</text>
<text x="24" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">캐시에 등록한 객체 크기</text>
<rect x="280" y="216" width="453.92857142857133" height="40" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.1"/>
<text x="296" y="241" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">328 B</text>
<text x="24" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">ksize()</text>
<text x="24" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">slab 포인터로 물어본 크기</text>
<rect x="280" y="280" width="453.92857142857133" height="40" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.1"/>
<text x="296" y="305" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">328 B</text>
<text x="24" y="360" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">slab_size (sysfs)</text>
<text x="24" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">커널이 실제로 뗀 크기</text>
<rect x="280" y="344" width="620.0" height="40" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="296" y="369" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">448 B</text>
<line x1="733.9285714285713" y1="152" x2="733.9285714285713" y2="400" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="733.9285714285713" y="344" width="166.07142857142867" height="40" rx="4" fill="#E3B34122" stroke="#E3B341" stroke-width="1.4"/>
<text x="816.9642857142857" y="369" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#E3B341">120 B · 27%</text>
<text x="721.9285714285713" y="422" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">세 API 가 아는 것은 여기까지입니다</text>
<line x1="280" y1="448" x2="900" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="280.0" y1="448" x2="280.0" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="280.0" y="474" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0</text>
<line x1="457.1428571428571" y1="448" x2="457.1428571428571" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="457.1428571428571" y="474" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">128</text>
<line x1="634.2857142857142" y1="448" x2="634.2857142857142" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="634.2857142857142" y="474" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">256</text>
<line x1="811.4285714285714" y1="448" x2="811.4285714285714" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="811.4285714285714" y="474" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">384</text>
<line x1="900.0" y1="448" x2="900.0" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="900.0" y="474" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">448</text>
<text x="264" y="474" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">바이트</text>
<text x="24" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">더 큰 이유는 셋입니다. 덜 줄 수는 없고, metadata 공간이 필요하며, 가장 가까운 캐시를 쓰기 때문입니다.</text>
<text x="24" y="528" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">정확한 값은 /sys/kernel/slab/&lt;cache&gt;/ 의 object_size 와 slab_size 에 있습니다(root 필요).</text>
<line x1="12" y1="576" x2="928" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="587" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="599" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">세 API 가 답하는 값</text>
<rect x="343" y="587" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="365" y="599" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">실제 할당 — 이 절의 논점</text>
<rect x="616" y="587" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="638" y="599" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">아무도 말해 주지 않는 구간</text>

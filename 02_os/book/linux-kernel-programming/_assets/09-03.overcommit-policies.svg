<title id="dt">얼마나 봐 줄지를 값 하나가 정합니다</title><desc id="dd">리눅스는 메모리를 어느 정도 의도적으로 over-commit 한다. vm.overcommit_memory 값에 따라 같은 요청이 통과하거나 거절되고, 거절되는 자리도 다르다. 0 은 커널이 나중에 OOM killer 로 수습하고, 2 는 malloc 단계에서 미리 막는다.</desc>
<rect width="1000" height="672" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 09-03 §3·§4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">얼마나 봐 줄지를 값 하나가 정합니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">값 2 로 끄면 가용 메모리가 급감해 GUI 로그인조차 안 될 수 있습니다</text>
<rect x="24" y="116" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="136.0" y="143" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">vm.overcommit_memory</text>
<rect x="264" y="116" width="224" height="44" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="376.0" y="136" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">0  GUESS</text>
<text x="376.0" y="153" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">기본값</text>
<rect x="500" y="116" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="612.0" y="136" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">1  ALWAYS</text>
<text x="612.0" y="153" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">항상 허용</text>
<rect x="736" y="116" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="848.0" y="136" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">2  NEVER</text>
<text x="848.0" y="153" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">strict accounting</text>
<rect x="24" y="168" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="195" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">판단 기준</text>
<rect x="264" y="168" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="376.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">RAM + swap 휴리스틱</text>
<rect x="500" y="168" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="612.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">판단하지 않습니다</text>
<rect x="736" y="168" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="848.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">CommitLimit</text>
<rect x="24" y="220" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="247" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">단일 대형 요청</text>
<rect x="264" y="220" width="224" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="376.0" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">거절합니다</text>
<rect x="500" y="220" width="224" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="612.0" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">통과시킵니다</text>
<rect x="736" y="220" width="224" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="848.0" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">거절합니다</text>
<rect x="24" y="272" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="299" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">작은 요청 수만 건</text>
<rect x="264" y="272" width="224" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="376.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">통과시킵니다</text>
<rect x="500" y="272" width="224" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="612.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">통과시킵니다</text>
<rect x="736" y="272" width="224" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="848.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">한도에서 막습니다</text>
<rect x="24" y="324" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="351" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">모자랄 때 어디서 실패하나</text>
<rect x="264" y="324" width="224" height="44" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="376.0" y="351" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">나중에 OOM killer</text>
<rect x="500" y="324" width="224" height="44" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="612.0" y="351" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">나중에 OOM killer</text>
<rect x="736" y="324" width="224" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="848.0" y="351" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">지금 malloc 이</text>
<rect x="24" y="376" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="403" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">본문 실증 결과</text>
<rect x="264" y="376" width="224" height="44" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="376.0" y="403" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">약 1,758MB 쓰고 Killed</text>
<rect x="500" y="376" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="612.0" y="403" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">—</text>
<rect x="736" y="376" width="224" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="848.0" y="403" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">약 820MB 에서 malloc 실패</text>
<text x="24" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">값 2 의 한도는 (전체 RAM − huge TLB) × overcommit_ratio/100 + swap 입니다. ratio 기본값은 50 입니다.</text>
<text x="24" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">820MB 가 1GB 한도보다 작은 이유는 코드가 root 프로세스용 예비 메모리를 남기기 때문입니다.</text>
<text x="24" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">확인은 /proc/meminfo 의 CommitLimit 과 Committed_AS 로 합니다.</text>
<line x1="12" y1="616" x2="952" y2="616" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="638" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="627" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="639" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">통과</text>
<rect x="178" y="627" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="200" y="639" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">거절 · 제약</text>
<rect x="331" y="627" width="14" height="14" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="353" y="639" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">사후 수습</text>
<rect x="454" y="627" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="476" y="639" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">기본값</text>

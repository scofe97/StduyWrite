<path d="M 780 228 L 792 228" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="768.0" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">서빙 가동</text>
<rect x="792" y="108" width="144" height="244" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="806" y="130" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#3FB98C">STEP 5</text>
<text x="864.0" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">요청 처리</text>
<text x="864.0" y="170" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">MiddlewareHandler</text>
<rect x="800" y="182" width="128" height="52" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="806" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">접두사 일치:</text>
<text x="806" y="220" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">404 Not Found 차단</text>

<title id="dt">단일 HTML 요청에서 부속 자원으로 뻗는 트리와 지속 연결</title><desc id="dd">HTML 수신 후 브라우저가 CSS·이미지 등 4개 부속 자원을 요청하며, HTTP/1.1 은 동일한 TCP 연결을 재사용한다.</desc>

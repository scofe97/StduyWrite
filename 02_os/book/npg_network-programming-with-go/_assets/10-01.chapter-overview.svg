<title id="dt">Caddy 는 설정을 API 로 실시간 바꾸고 어댑터와 모듈로 넓힙니다</title><desc id="dd">10-01 의 키워드 개념도. §1~2 줄은 ACME 프로토콜로 인증서를 자동 갱신하고 에지 리버스 프록시로 TLS 를 종단하며 xcaddy 로 커스텀 모듈을 정적 빌드하는 흐름이다. §3 줄은 2019 포트의 관리 API 로 새 JSON 설정을 전송해 사전 검증하고 새 리스너를 열어 원자적으로 리로드하는 제어 평면이다. §4 줄은 caddy.toml 설정 문서를 caddyconfig.Adapter 로 파싱해 Caddy 표준 JSON 으로 변환하는 어댑터 파이프라인이다. §5 줄은 caddy.ModuleInfo 로 모듈을 등록하고 Provisioner 와 Validator 생명주기를 거쳐 MiddlewareHandler 로 HTTP 요청을 가로채는 데이터 평면이다.</desc>
<rect width="984" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 10-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Caddy 는 설정을 API 로 실시간 바꾸고 어댑터와 모듈로 넓힙니다</text>

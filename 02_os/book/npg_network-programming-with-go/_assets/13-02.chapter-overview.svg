<title id="dt">온디맨드 디버깅·와이드 이벤트 로깅·Lumberjack 로그 회전</title><desc id="dd">13-02 의 세 절 핵심 흐름입니다. §1 은 세마포어 파일을 감지해 실행 중 원자 레벨을 바꾸는 온디맨드 디버깅입니다. §2 는 응답 래퍼로 메트릭을 모아 요청 1건을 단일 구조화 로그로 요약하는 와이드 이벤트입니다. §3 은 파일 크기와 보존 기간을 검사해 백업을 보관하고 압축하는 Lumberjack 로그 회전입니다.</desc>

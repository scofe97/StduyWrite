<title id="dt">미들웨어는 감싸고 ServeMux 는 나누며 서버 푸시는 걷어냈습니다</title><desc id="dd">09-02 의 키워드 개념도. §1~2 줄은 func(http.Handler) http.Handler 시그니처로 핸들러를 감싸고 http.TimeoutHandler 가 지정 시간을 감시해 초과 시 ErrHandlerTimeout 으로 후속 쓰기를 차단하는 미들웨어 흐름이다. §3 줄은 http.StripPrefix 로 경로 앞부분을 자르고 RestrictPrefix 로 점 접두사 숨김 파일을 404 차단해 http.FileServer 로 넘기는 파이프라인이다. §4 줄은 http.ServeMux 가 가장 긴 일치 패턴으로 라우팅하고 슬래시 누락 요청을 301 리다이렉트하며 drainAndClose 로 요청 본문을 회수하는 흐름이다. §5 줄은 http.Pusher 로 자원을 선제 전송하던 서버 푸시가 캐시 불일치와 대역폭 경합으로 퇴출되고 103 Early Hints 로 대체된 과정이다.</desc>
<rect width="984" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 09-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">미들웨어는 감싸고 ServeMux 는 나누며 서버 푸시는 걷어냈습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

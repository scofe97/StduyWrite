<title id="dt">zapcore.NewTee 로 묶인 두 코어의 레벨 필터링과 다중 출력 분기</title><desc id="dd">NewTee 로 결합된 복수 코어는 동일한 로그 호출을 각자의 레벨과 인코더로 평가합니다. Debug 엔트리는 파일 코어에서 버려지고 콘솔 코어에만 전달되며, Info 엔트리는 양쪽 코어 모두에서 인코딩되어 출력됩니다.</desc>
<rect width="940" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ZAP TEE CORE FLOW · DATA FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">zapcore.NewTee 로 묶인 두 코어의 레벨 필터링과 다중 출력 분기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">한 번의 호출이 서로 다른 레벨 임계치와 인코더를 가진 두 코어로 동시에 전달됩니다.</text>
<rect x="36" y="120" width="210" height="340" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="52" y="146" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">로그 호출 입력</text>
<text x="52" y="168" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">클론된 zl 인스턴스</text>
<rect x="50" y="190" width="182" height="110" rx="4" fill="#6A95D815" stroke="#6A95D8" stroke-width="1.2"/>
<text x="60" y="216" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">1. zl.Debug(...)</text>
<text x="60" y="238" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">"this is only logged..."</text>
<text x="60" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">심각도: DebugLevel</text>
<rect x="50" y="320" width="182" height="110" rx="4" fill="#3FB98C15" stroke="#3FB98C" stroke-width="1.2"/>
<text x="60" y="346" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">2. zl.Info(...)</text>
<text x="60" y="368" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">"this is logged as..."</text>
<text x="60" y="390" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">심각도: InfoLevel</text>
<rect x="286" y="170" width="160" height="240" rx="6" fill="#F08A5910" stroke="#F08A59" stroke-width="1.2"/>
<text x="366.0" y="200" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">zapcore.NewTee</text>
<text x="366.0" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">코어 복제 결합</text>
<line x1="298" y1="234" x2="434" y2="234" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="366.0" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">모든 엔트리를</text>
<text x="366.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">c1 과 c2 에</text>
<text x="366.0" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">동시 디스패치</text>
<text x="366.0" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">독립 레벨 평가</text>
<path d="M 246 245 L 266 245 L 266 270 L 286 270" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<path d="M 246 375 L 266 375 L 266 310 L 286 310" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="486" y="120" width="418" height="150" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="502" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">코어 1 · 기존 코어 (c1)</text>
<text x="691" y="144" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">JSONEncoder · logFile · InfoLevel</text>
<rect x="502" y="160" width="386" height="44" rx="4" fill="#F0616D12" stroke="#F0616D" stroke-width="0.9"/>
<text x="510" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">Debug 엔트리: InfoLevel 미달 → 차단 (Drop)</text>
<rect x="502" y="212" width="386" height="44" rx="4" fill="#3FB98C12" stroke="#3FB98C" stroke-width="0.9"/>
<text x="510" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">Info 엔트리: 통과 → logFile 에 JSON 기록</text>
<text x="510" y="248" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">{"level":"info","msg":"this is logged as..."}</text>
<rect x="486" y="300" width="418" height="160" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="502" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">코어 2 · 추가 코어 (c2)</text>
<text x="691" y="324" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">Console · os.Stdout · DebugLevel</text>
<rect x="502" y="340" width="386" height="48" rx="4" fill="#6A95D812" stroke="#6A95D8" stroke-width="0.9"/>
<text x="510" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">Debug 엔트리: 통과 → 표준 출력 (콘솔)</text>
<text x="510" y="378" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">DEBUG  this is only logged as console encoding</text>
<rect x="502" y="398" width="386" height="48" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="0.9"/>
<text x="510" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">Info 엔트리: 통과 → 표준 출력 (콘솔)</text>
<text x="510" y="436" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">INFO   this is logged as console encoding and JSON</text>
<path d="M 446 230 L 466 230 L 466 190 L 482 190" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 446 350 L 466 350 L 466 380 L 482 380" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
</svg>
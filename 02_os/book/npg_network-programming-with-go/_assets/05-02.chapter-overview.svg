<title id="dt">net.Conn 으로 상대를 고정하고 MTU 아래로 보내 단편화를 피합니다</title><desc id="dd">05-02 의 키워드 개념도. §1 바인딩 줄은 net.Dial 로 커널에 상대 주소를 등록하고 무핸드셰이크로 net.Conn 을 얻는 흐름이다. §1 필터링 줄은 제3자의 방해 패킷을 커널이 걸러내고 에코 서버의 응답만 client.Read 로 수신하는 과정이다. §2 단편화 줄은 MTU 를 넘는 대형 데이터그램이 IP 조각으로 나뉘어 조각 하나만 잃어도 전체가 폐기되는 위험이다. §2 MTU 실측 줄은 ping DF 플래그로 경로 한계를 확인하고 28바이트 헤더를 뺀 1,472바이트 페이로드 상한을 도출하는 길이다.</desc>
<rect width="984" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 05-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">net.Conn 으로 상대를 고정하고 MTU 아래로 보내 단편화를 피합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

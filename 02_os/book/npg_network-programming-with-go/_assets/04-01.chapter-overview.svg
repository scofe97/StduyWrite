<title id="dt">TCP 는 경계가 없어 읽는 쪽이 메시지를 자릅니다</title><desc id="dd">04-01 의 키워드 개념도. §1 줄은 net.Conn 이 io.ReadWriteCloser 를 구현해 표준 도구와 결합하는 구조다. §2 줄은 고정 버퍼로 읽을 때 conn.Read 가 도착한 만큼만 채우므로 buf[:n] 을 슬라이싱하고 io.EOF 로 마치는 흐름이다. §3 줄은 구분자가 있는 스트림을 bufio.Scanner 와 Split 으로 잘라 온전한 토큰 단위로 추출하는 방식이다. §4 줄은 5바이트 고정 헤더와 MaxPayloadSize 로 메모리 고갈을 막고 io.ReadFull 로 페이로드를 채우는 TLV 구조다. §5 줄은 쓰기 오류 발생 시 Timeout 판별을 거쳐 10초 대기 후 최대 7회까지 재시도하는 복구 루프다.</desc>
<rect width="984" height="768" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 04-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TCP 는 경계가 없어 읽는 쪽이 메시지를 자릅니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

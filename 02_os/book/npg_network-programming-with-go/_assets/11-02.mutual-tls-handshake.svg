<title id="dt">상호 TLS 핸드셰이크와 클라이언트 인증서 검증 시퀀스</title><desc id="dd">서버가 CertificateRequest 를 보내고 클라이언트가 서명을 증명해 양방향 신뢰를 확립합니다</desc>
<rect width="960" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NPG CH.11 — MUTUAL TLS HANDSHAKE SEQUENCE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">상호 TLS 핸드셰이크와 클라이언트 인증서 검증 시퀀스</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">ClientAuth 요구 · CertificateVerify 검증 · RootCAs 와 ClientCAs 교차 신뢰</text>
<rect x="115.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="220" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">TLS 클라이언트</text>
<text x="220" y="139" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Dialer · RootCAs 피닝</text>
<rect x="565.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="670" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">TLS 서버</text>
<text x="670" y="139" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Listener · ClientCAs 검증</text>
<line x1="220" y1="154" x2="220" y2="526" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="670" y1="154" x2="670" y2="526" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<rect x="216" y="160" width="8" height="360" rx="2" fill="#8B98A9" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="666" y="160" width="8" height="360" rx="2" fill="#8B98A9" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<path d="M 230 170 L 658 170" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="445.0" y="161" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">ClientHello</text>
<text x="445.0" y="187" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">key_share · 암호군 제안</text>

<text x="445.0" y="457" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클라이언트 개인키 서명 증명</text>
<path d="M 680 472 L 728 472 L 728 492 L 683 492" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="738" y="478" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">클라이언트 검증</text>
<text x="738" y="495" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ClientCAs 체인 및 IP·SAN 대조</text>
<path d="M 230 524 L 660 524" fill="none" stroke="#3FB98C" stroke-width="2.0" marker-end="url(#ok)"/>
<path d="M 660 524 L 230 524" fill="none" stroke="#3FB98C" stroke-width="2.0" marker-end="url(#ok)"/>
<text x="445.0" y="516" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">Application Data (상호 인증 암호화 통신)</text>

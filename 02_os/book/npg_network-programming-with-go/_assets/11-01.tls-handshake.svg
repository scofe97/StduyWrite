<title id="dt">TLS 1.3 핸드셰이크와 키 교환 및 세션 키 생성 순서</title><desc id="dd">클라이언트와 서버가 임시 ECDHE 키 공유를 교환해 세션 대칭 키를 유도하고 암호화 통신을 엽니다.</desc>
<rect width="880" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · TLS 1.3 1-RTT HANDSHAKE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TLS 1.3 핸드셰이크와 키 교환 및 세션 키 생성 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">TLS 1.3 은 단 1-RTT 만에 키 교환과 서버 인증 및 핸드셰이크 완료를 마칩니다.</text>

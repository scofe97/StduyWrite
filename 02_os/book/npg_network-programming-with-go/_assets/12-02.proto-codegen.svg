<title id="dt">proto 서비스 정의와 protoc-gen-go-grpc 코드 생성</title><desc id="dd">housework.proto 의 service RobotMaid 를 protoc 가 두 플러그인으로 넘겨 housework.pb.go 와 housework_grpc.pb.go 를 만들고, housework_grpc.pb.go 에서 클라이언트 쪽 RobotMaidClient·NewRobotMaidClient 와 서버 쪽 RobotMaidServer·UnimplementedRobotMaidServer·RegisterRobotMaidServer 가 나옵니다.</desc>

<title id="dt">tls.NewListener 래핑과 지연 핸드셰이크 처리 단계</title><desc id="dd">일반 TCP 소켓을 TLS 리스너로 감싸고 첫 Read/Write 에서 지연 핸드셰이크를 거쳐 에코를 처리합니다.</desc>
<rect width="960" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PROCESS · TLS SERVER LISTENER &amp; HANDSHAKE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">tls.NewListener 래핑과 지연 핸드셰이크 처리 단계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Go 의 tls.Conn 은 Accept 가 아닌 첫 I/O 호출에서 실제 TLS 핸드셰이크를 협상합니다.</text>

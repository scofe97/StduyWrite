<title id="dt">커널이 보증하는 피어 자격 증명으로 접속 프로세스를 인증합니다</title><desc id="dd">07-02 의 키워드 개념도. §1 줄은 커널이 보증하는 SO_PEERCRED 소켓 옵션을 conn.File() 과 GetsockoptUcred 로 질의해 위조 불가능한 피어 자격 증명을 얻는 기저다. §2 줄은 전달받은 문자열 그룹 이름을 user.LookupGroup 으로 조회해 빠른 판정이 가능한 map[string]struct{} 집합으로 구축하는 인가 목록이다. §3 줄은 s.AcceptUnix() 로 수락한 접속마다 auth.Allowed 로 피어 UID 가 사용자 DB 에서 속한 그룹을 대조해 Welcome 또는 연결 종료로 가르는 서버 루프다. §4 줄은 nc -U 로 소켓에 접속하고 sudo -g 로 기본 그룹을 바꿔도 그 그룹은 판정에서 빠지고 UID 의 사용자 DB 소속으로 인가가 정해지는지 시험하는 검증이다.</desc>
<rect width="984" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 07-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널이 보증하는 피어 자격 증명으로 접속 프로세스를 인증합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

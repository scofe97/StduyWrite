<title id="dt">요청 계측부터 단일 구조화 와이드 이벤트 로그 기록까지</title><desc id="dd">미들웨어가 ResponseWriter 를 감싸 상태 코드와 길이를 기록하고, 핸들러가 끝난 뒤 필드를 모아 한 줄의 로그를 작성합니다.</desc>
<rect width="980" height="720" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · WIDE EVENT MIDDLEWARE</text>

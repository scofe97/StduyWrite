<title id="dt">동일한 로그 엔트리가 JSON 인코더와 콘솔 인코더를 통과할 때의 출력 비교</title><desc id="dd">동일한 EncoderConfig 와 로그 엔트리라도 인코더 종류에 따라 기계 분석용 JSON 형식과 터미널 가독용 탭 구분 콘솔 텍스트로 완전히 다르게 직렬화됩니다.</desc>
<rect width="940" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ZAP ENCODING COMPARISON · PROCESS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">동일한 로그 엔트리가 JSON 인코더와 콘솔 인코더를 통과할 때의 출력 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">입력 엔트리는 동일하며 인코더 구현체에 의해 출력 줄의 구조가 결정됩니다.</text>
<rect x="36" y="130" width="240" height="310" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.2"/>
<text x="56" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">공통 로그 엔트리</text>
<text x="56" y="178" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">zapcore.Entry + Fields</text>
<line x1="50" y1="190" x2="262" y2="190" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="56" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Level</text>
<text x="56" y="232" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">InfoLevel</text>
<text x="56" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Name</text>
<text x="56" y="276" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">"example"</text>
<text x="56" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Message</text>
<text x="56" y="320" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">"test info message"</text>
<text x="56" y="346" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Caller</text>
<text x="56" y="364" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">"npg13-1/zap_test.go:44"</text>
<text x="56" y="390" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Field</text>
<text x="56" y="408" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">version: "go1.25.1"</text>
<rect x="320" y="130" width="190" height="310" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="415.0" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">EncoderConfig 적용</text>
<text x="415.0" y="176" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">MessageKey: "msg"</text>
<text x="415.0" y="194" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">LevelKey: "level"</text>
<text x="415.0" y="212" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">CallerKey: "caller"</text>
<rect x="336" y="236" width="158" height="80" rx="4" fill="#3FB98C15" stroke="#3FB98C" stroke-width="1.1"/>
<text x="415.0" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">NewJSONEncoder</text>
<text x="415.0" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">키-값 구조화 직렬화</text>
<rect x="336" y="336" width="158" height="80" rx="4" fill="#F08A5915" stroke="#F08A59" stroke-width="1.1"/>
<text x="415.0" y="364" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">NewConsoleEncoder</text>
<text x="415.0" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">탭 구분 텍스트 직렬화</text>
<path d="M 276 276 L 336 276" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 276 376 L 336 376" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="550" y="130" width="354" height="140" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="566" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">JSON 인코더 출력 (기계 파싱 및 중앙 수집)</text>
<rect x="566" y="170" width="322" height="82" rx="4" fill="#3FB98C12" stroke="#3FB98C" stroke-width="0.9"/>
<text x="574" y="194" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">{"level":"info","name":"example",</text>
<text x="574" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">"caller":"npg13-1/zap_test.go:44",</text>
<text x="574" y="234" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">"msg":"test info message","version":"go1.25.1"}</text>
<rect x="550" y="290" width="354" height="140" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="566" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">콘솔 인코더 출력 (사람 가독 및 터미널 모니터링)</text>
<rect x="566" y="330" width="322" height="82" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="0.9"/>
<text x="574" y="354" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">info → example → npg13-1/zap_test.go:44 →</text>
<text x="574" y="374" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">test info message → {"version": "go1.25.1"}</text>
<text x="574" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">필드 간 구분자: \t (탭 문자)</text>

<title id="dt">인증서 피닝 클라이언트와 첫 RPC 때 열리는 연결</title><desc id="dd">클라이언트가 서버 자신의 인증서 cert.pem 을 읽어 그것 하나만 담은 풀을 RootCAs 로 넘기고, grpc.NewClient 로 연결 객체만 만든 뒤 첫 RPC 에서 TCP·TLS 1.3·HTTP/2 를 열어 할 일 표를 찍는 순서입니다.</desc>
<rect width="940" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PROCESS · PINNED GRPC CLIENT FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인증서 피닝 클라이언트와 첫 RPC 때 열리는 연결</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">피닝은 CA 가 아니라 서버 자신의 cert.pem 을 믿는 일이고, 연결은 첫 RPC 때 열립니다.</text>
<rect x="50" y="120" width="260" height="110" rx="8" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="63.4" y="130" width="45.2" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="86" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#6A95D8">STEP 1</text>
<text x="195.0" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">서버 인증서 읽기</text>
<line x1="65" y1="162" x2="295" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="70" y="186" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#6A95D8">os.ReadFile("cert.pem")</text>
<text x="70" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버 자신의 인증서 PEM</text>
<rect x="340" y="120" width="260" height="110" rx="8" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="353.4" y="130" width="45.2" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="376" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#6A95D8">STEP 2</text>
<text x="485.0" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">인증서 하나만 담은 풀</text>
<line x1="355" y1="162" x2="585" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="360" y="186" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#6A95D8">AppendCertsFromPEM(caCert)</text>
<text x="360" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">운영체제 CA 는 넣지 않음</text>
<rect x="630" y="120" width="260" height="110" rx="8" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<rect x="643.4" y="130" width="45.2" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="666" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#3FB98C">STEP 3</text>
<text x="775.0" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">TLS 자격 증명</text>
<line x1="645" y1="162" x2="875" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="650" y="186" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#3FB98C">RootCAs: certPool</text>
<text x="650" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">credentials.NewTLS 로 감쌈</text>
<path d="M 314 175.0 L 334 175.0" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<path d="M 604 175.0 L 624 175.0" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<path d="M 760.0 234 L 760.0 254 L 180.0 254 L 180.0 274" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="50" y="280" width="260" height="110" rx="8" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<rect x="63.4" y="290" width="45.2" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="86" y="304" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#3FB98C">STEP 4</text>
<text x="195.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">연결 객체 만들기</text>
<line x1="65" y1="322" x2="295" y2="322" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="70" y="346" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#3FB98C">grpc.NewClient(addr, …)</text>
<text x="70" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">I/O 없음 · 자격 증명은 필수</text>
<rect x="340" y="280" width="260" height="110" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.1"/>
<rect x="353.4" y="290" width="45.2" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="376" y="304" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F08A59">STEP 5</text>
<text x="485.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">첫 RPC 에서 연결</text>
<line x1="355" y1="322" x2="585" y2="322" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="360" y="346" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#F08A59">rosie.Add(ctx, chores)</text>
<text x="360" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCP · TLS 1.3 · HTTP/2 순서</text>
<rect x="630" y="280" width="260" height="110" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.1"/>
<rect x="643.4" y="290" width="45.2" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="666" y="304" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F08A59">STEP 6</text>
<text x="775.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">할 일 표 찍기</text>
<line x1="645" y1="322" x2="875" y2="322" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="650" y="346" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#F08A59">2  [X]  Wash dishes</text>
<text x="650" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">List 응답을 탭으로 나눠 찍음</text>
<path d="M 314 335.0 L 334 335.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 604 335.0 L 624 335.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<line x1="12" y1="452" x2="892" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="474" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="464" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">믿을 인증서</text>
<rect x="222" y="464" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="244" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자격 증명과 연결 객체</text>
<rect x="422" y="464" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="444" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">RPC 와 출력</text>
</svg>
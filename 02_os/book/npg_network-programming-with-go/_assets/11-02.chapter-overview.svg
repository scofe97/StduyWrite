<title id="dt">상호 TLS 는 직접 만든 인증서로 클라이언트를 검증하고 접속 주소를 맞춥니다</title><desc id="dd">서버가 요구한 클라이언트 인증서를 직접 만들고, 서버가 기본 검증에 접속 주소 대조를 더하며, 거절은 클라이언트의 Read 에서 드러납니다</desc>
<rect width="960" height="340" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NPG CH.11 — 11-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">상호 TLS 는 직접 만든 인증서로 클라이언트를 검증하고 접속 주소를 맞춥니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">절 사이 화살표 위 칩은 다음 절로 넘어가는 값입니다</text>
<rect x="20" y="150" width="200" height="110" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="34" y="172" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#5E6B7E">§1</text>

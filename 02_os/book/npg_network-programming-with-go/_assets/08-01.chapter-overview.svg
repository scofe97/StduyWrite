<title id="dt">HTTP 는 URL 로 자원을 가리키고 메서드로 요청하며 상태 코드로 답합니다</title><desc id="dd">08-01 의 키워드 개념도. §1 줄은 scheme://host 로 대상 서버를 지정하고 자원 경로를 전달하되 #fragment 는 요청 줄에서 제외해 브라우저에만 남기는 구조다. §2 줄은 서버 상태를 바꾸지 않는 안전한 메서드와 여러 번 수행해도 결과가 같은 멱등 메서드를 구분하고 비멱등 POST 재시도에는 Idempotency-Key 를 두는 규약이다. §3 줄은 세 자리 상태 코드에 따라 304 캐시 재사용과 4xx 수정을 분기하고 5xx 서버 장애 시 멱등성을 검증해 지수 백오프로 재시도하는 흐름이다. §4 줄은 루트 HTML 수신 후 부속 자원을 연쇄 요청할 때 HTTP/1.1 지속 연결(Keep-Alive)이 단일 TCP 소켓을 재사용해 핸드셰이크 왕복을 줄이는 원리다.</desc>
<rect width="984" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 08-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">HTTP 는 URL 로 자원을 가리키고 메서드로 요청하며 상태 코드로 답합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

<title id="dt">housework 명령 처리 코드와 storage 별칭 뒤의 세 저장 패키지</title><desc id="dd">명령 처리 코드는 storage 별칭의 Load·Flush 만 부르고, storage import 줄로 저장 패키지를 고릅니다. protobuf 로 갈 때는 housework import 도 v1 으로 바꿉니다.</desc>
<rect width="960" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · STORAGE ABSTRACTION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">housework 명령 처리 코드와 storage 별칭 뒤의 세 저장 패키지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">storage.Load 는 io.Reader, storage.Flush 는 io.Writer 를 받습니다.</text>
<rect x="200" y="100" width="560" height="72" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="480" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">cmd/housework.go</text>
<text x="480" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">list · add · complete · load · flush</text>
<path d="M 480 172 L 480 216" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<text x="490" y="196" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">storage.Load(df) · storage.Flush(df, chores)</text>
<rect x="140" y="220" width="680" height="80" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="480" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">storage 별칭 (Load · Flush)</text>
<text x="480" y="270" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">Load(r io.Reader) ([]*Chore, error)  |  Flush(w io.Writer, chores []*Chore) error</text>
<text x="480" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">storage ".../json" · ".../gob" · ".../protobuf" 가운데 한 줄</text>
<path d="M 180 300 L 180 344" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<path d="M 480 300 L 480 344" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<path d="M 780 300 L 780 344" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<rect x="60" y="348" width="240" height="76" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.1"/>
<text x="180" y="374" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">json/housework.go</text>
<text x="180" y="394" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">json.NewDecoder(r).Decode</text>
<text x="180" y="410" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">json.NewEncoder(w).Encode</text>
<rect x="360" y="348" width="240" height="76" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.1"/>
<text x="480" y="374" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">gob/housework.go</text>
<text x="480" y="394" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">gob.NewDecoder(r).Decode</text>
<text x="480" y="410" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">gob.NewEncoder(w).Encode</text>
<rect x="660" y="348" width="240" height="76" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.1"/>
<text x="780" y="374" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">protobuf/housework.go</text>
<text x="780" y="394" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">io.ReadAll + proto.Unmarshal</text>
<text x="780" y="410" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">proto.Marshal + w.Write</text>

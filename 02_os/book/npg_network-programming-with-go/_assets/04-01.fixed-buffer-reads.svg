<title id="dt">고정 버퍼 수신과 스트림 분할 읽기</title><desc id="dd">16MB 전송에 대해 512KB 버퍼로 반복 읽으며 n &lt; 버퍼 크기 및 io.EOF 감지</desc>
<rect width="880" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FIXED BUFFER READ</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">고정 버퍼 수신과 스트림 분할 읽기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">수신 소켓 버퍼 준비량에 따른 즉시 반환과 정상 종료 판별</text>
<rect x="24.0" y="96" width="240" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="144.0" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Client (수신측)</text>
<text x="144.0" y="133" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">buf := make([]byte, 1&lt;&lt;19)</text>
<rect x="592.0" y="96" width="240" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="712.0" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Server (송신측)</text>
<text x="712.0" y="133" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">payload := make([]byte, 1&lt;&lt;24)</text>
<line x1="144.0" y1="146" x2="144.0" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="712.0" y1="146" x2="712.0" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<rect x="647.0" y="148" width="130.0" height="20" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="712.0" y="162" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">conn.Write(16MB)</text>
<text x="700.0" y="182" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">16,777,216B 스트림 송신 시작</text>
<rect x="116.0" y="198" width="624.0" height="176" rx="4" fill="rgba(245,245,245,0.02)" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<rect x="116.0" y="198" width="46" height="18" rx="2" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="139.0" y="211" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">LOOP</text>
<text x="172.0" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">[16MB 수신 반복]</text>

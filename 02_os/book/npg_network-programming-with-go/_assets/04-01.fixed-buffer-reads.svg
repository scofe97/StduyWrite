<text x="428.0" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">buf[:n] 완충 소비 · 수신 버퍼 완충 반환</text>

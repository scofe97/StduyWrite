<text x="428.0" y="342" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소켓 버퍼 도착분만 즉시 반환 (블로킹 없이 리턴)</text>

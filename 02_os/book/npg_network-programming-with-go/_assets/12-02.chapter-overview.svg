<title id="dt">gRPC 서비스 정의와 TLS 서버 및 인증서 피닝 클라이언트</title><desc id="dd">12-02 의 개념도입니다. §1 줄은 client.List 호출이 POST /housework.RobotMaid/List 로 가서 grpc-status 0 트레일러와 함께 *Chores 로 돌아오는 길입니다. §2 줄은 service RobotMaid 가 protoc-gen-go-grpc 로 housework_grpc.pb.go 가 되어 RobotMaidServer 와 RobotMaidClient 를 내는 모습입니다. §3 줄은 Rosie 를 등록하고 grpc.Creds(credentials.NewTLS(cfg)) 를 건 grpc.Server 가 localhost:34443 에서 ALPN h2 로 받는 모습입니다. §4 줄은 cert.pem 하나를 RootCAs 로 넘기고 grpc.NewClient 로 만든 연결이 첫 RPC 때 열려 할 일 표를 찍기까지입니다.</desc>
<rect width="984" height="630" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 12-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">gRPC 서비스 정의와 TLS 서버 및 인증서 피닝 클라이언트</text>

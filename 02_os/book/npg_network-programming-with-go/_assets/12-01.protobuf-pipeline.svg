<title id="dt">Protocol Buffers 정의에서 48 B 파일까지</title><desc id="dd">.proto 정의를 protoc 와 protoc-gen-go 로 컴파일해 housework.pb.go 를 만들고, proto.Marshal 로 할 일 세 건을 48 B 로 씁니다.</desc>
<rect width="980" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PROCESS · PROTOCOL BUFFERS PIPELINE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Protocol Buffers 정의에서 48 B 파일까지</text>

<title id="dt">비즈니스 웹 서버와 메트릭 서버의 포트 격리 아키텍처</title><desc id="dd">앱 서버(:8082)는 핸들러와 ConnState로 계측하고 메트릭 서버(:8081)는 스크랩 전용으로 격리합니다</desc>
<rect width="980" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · DUAL-PORT SERVER</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">비즈니스 웹 서버와 메트릭 서버의 포트 격리 아키텍처</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">클라이언트 트래픽과 모니터링 내부 트래픽이 서로 간섭하지 않도록 분리합니다</text>
<rect x="35" y="105" width="400" height="335" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="51" y="129" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">ZONE 1 · 앱 서버 (:8082)</text>
<rect x="53" y="145" width="364" height="72" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="65" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">연결 상태 훅: connStateMetrics</text>
<text x="65" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ConnState (StateNew · StateClosed)</text>
<text x="65" y="203" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">새 연결 +1, 소켓 닫힘 -1 반영</text>
<rect x="53" y="229" width="364" height="98" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.0"/>
<text x="65" y="251" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">비즈니스 핸들러: helloHandler</text>
<text x="65" y="271" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">① 진입: Requests.Add(1)</text>
<text x="65" y="289" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">② 종료: RequestDuration.Observe(s)</text>
<text x="65" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">③ 오류: WriteErrors.Add(1)</text>
<rect x="53" y="339" width="364" height="48" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="65" y="359" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">클라이언트 HTTP GET / 요청 수신</text>
<text x="65" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCP 악수 및 HTTP 요청 본문 처리</text>
<rect x="545" y="105" width="400" height="335" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="561" y="129" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">ZONE 2 · 메트릭 서버 (:8081)</text>
<rect x="563" y="145" width="364" height="72" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="575" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">노출 엔드포인트: /metrics</text>
<text x="575" y="186" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">promhttp.Handler() 바인딩</text>
<text x="575" y="203" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">DefaultGatherer 텍스트 직렬화</text>
<rect x="563" y="229" width="364" height="72" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="575" y="251" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Prometheus 서버 스크랩 수집</text>
<text x="575" y="271" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">④ 주기적 GET /metrics Pull</text>
<text x="575" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">내부 관리망으로만 접근 허용</text>
<rect x="563" y="313" width="364" height="68" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="575" y="333" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">포트 분리 이유 (보안 및 격리)</text>
<text x="575" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">런타임 민감 정보 외부 노출 차단</text>
<text x="575" y="369" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">요청 폭주 시에도 모니터링 보장</text>
<path d="M 435 181 L 545 181" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="490" y="173" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">상태 공유</text>
<path d="M 435 277 L 545 277" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="490" y="269" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">카운터 갱신</text>
<line x1="12" y1="460" x2="932" y2="460" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="482" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="472" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>

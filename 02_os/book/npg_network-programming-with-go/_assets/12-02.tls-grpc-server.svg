<title id="dt">TLS 1.3 ALPN 협상과 Rosie 서버 메서드 실행 순서</title><desc id="dd">Rosie 를 등록한 grpc.Server 가 localhost:34443 에서 TLS 1.3 핸드셰이크로 ALPN h2 를 고르고, HTTP/2 프리페이스와 SETTINGS 를 주고받은 뒤 Add 요청을 받아 Rosie.Add 를 부르는 순서입니다.</desc>
<rect width="880" height="780" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · TLS GRPC SERVER FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TLS 1.3 ALPN 협상과 Rosie 서버 메서드 실행 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">ALPN 으로 h2 를 고른 연결에서만 HTTP/2 프리페이스와 gRPC 요청이 오갑니다.</text>
<rect x="24.0" y="104" width="220" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="134.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">gRPC 클라이언트</text>
<text x="134.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">client.go</text>
<rect x="612.0" y="104" width="220" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="722.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">gRPC 서버</text>
<text x="722.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">localhost:34443</text>
<path d="M 712.0 170 L 682.0 170 L 682.0 190 L 709.0 190" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="674.0" y="176" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">RegisterRobotMaidServer(server, rosie)</text>
<text x="674.0" y="193" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Serve 전에 등록</text>
<path d="M 144.0 232 L 710.0 232" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="428.0" y="223" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">ClientHello</text>
<text x="428.0" y="249" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ALPN 후보 h2 · P-256 키 공유</text>
<path d="M 712.0 284 L 146.0 284" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="428.0" y="275" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">ServerHello</text>
<text x="428.0" y="301" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TLS 1.3 · 여기부터 암호화</text>
<path d="M 712.0 336 L 146.0 336" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<text x="428.0" y="327" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">EncryptedExtensions (ALPN: h2)</text>
<text x="428.0" y="353" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">비어 있으면 클라이언트가 끊음</text>
<path d="M 712.0 388 L 146.0 388" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="428.0" y="379" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">Certificate · CertificateVerify · Finished</text>
<text x="428.0" y="405" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">cert.pem 을 RootCAs 로 확인</text>
<path d="M 144.0 440 L 710.0 440" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="428.0" y="431" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">Finished</text>
<path d="M 144.0 492 L 710.0 492" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="428.0" y="483" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">PRI * HTTP/2.0 + SETTINGS</text>
<text x="428.0" y="509" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클라이언트 프리페이스</text>
<path d="M 712.0 544 L 146.0 544" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="428.0" y="535" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">SETTINGS · SETTINGS ACK</text>
<text x="428.0" y="561" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버 프리페이스 · 양쪽이 ACK</text>
<path d="M 144.0 596 L 710.0 596" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="428.0" y="587" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">POST /housework.RobotMaid/Add</text>
<text x="428.0" y="613" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">DATA 00 00 00 00 1d + Chores 29바이트</text>
<path d="M 712.0 638 L 682.0 638 L 682.0 658 L 709.0 658" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="674.0" y="644" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">Rosie.Add · mu.Lock()</text>
<text x="674.0" y="661" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">r.chores 에 2건 추가</text>
<path d="M 712.0 700 L 146.0 700" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="428.0" y="691" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">HEADERS · DATA · 트레일러</text>
<text x="428.0" y="717" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Response 4바이트 · grpc-status: 0</text>

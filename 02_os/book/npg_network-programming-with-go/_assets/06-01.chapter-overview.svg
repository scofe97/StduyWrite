<title id="dt">TFTP 패킷 네 종이 바이트로 맞물려 UDP 신뢰성을 세웁니다</title><desc id="dd">06-01 의 키워드 개념도. §1 줄은 DatagramSize 516바이트에서 헤더 4바이트를 뺀 512바이트 BlockSize 와 stop-and-wait 신뢰 전송의 기준이다. §2 줄은 ReadReq 구조체가 필드마다 0x00 종단자를 두고 ReadString(0) 으로 파싱하는 요청 규격이다. §3 줄은 Data 구조체가 io.Reader 페이로드를 싣고 d.Block++ 로 번호를 전진시키다 33.5MB 톱니 한계를 만나는 전송 흐름이다. §4 줄은 Ack 가 블록 번호로 수신을 확인하며 오류 발생 시 Err 패킷으로 통신을 즉시 폐기하는 대화의 닫힘이다.</desc>
<rect width="984" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 06-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TFTP 패킷 네 종이 바이트로 맞물려 UDP 신뢰성을 세웁니다</text>

<title id="dt">TLS 핸드셰이크와 CA 신뢰 사슬 및 Go 클라이언트·서버·피닝</title><desc id="dd">11-01 의 키워드 개념도입니다. §1 줄은 핸드셰이크와 공유 비밀 및 세션 키 전방 비밀성입니다. §2 줄은 루트 CA 신뢰 저장소와 인증서 서명 및 세 가지 침해 경로입니다. §3 줄은 기본 클라이언트의 검증 실패, 시험 인증서를 믿는 ts.Client() 의 성공, 옆길인 InsecureSkipVerify, TCP 위에 바로 TLS 를 여는 tls.Dialer 입니다. §4 줄은 tls.NewListener 래핑과 첫 I/O 지연 핸드셰이크입니다. §5 줄은 RootCAs 명시 지정과 믿을 인증서를 그 서버 하나로 좁히는 피닝입니다.</desc>

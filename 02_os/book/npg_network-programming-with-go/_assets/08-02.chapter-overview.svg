<title id="dt">본문을 끝까지 읽고 닫아야 재사용하고 context 로 끊습니다</title><desc id="dd">08-02 의 키워드 개념도. §1 줄은 http.Head 로 본문 없이 헤더만 받아 본문을 먼저 닫은 뒤 Date 로 로컬 시각 오차를 측정하는 기본 클라이언트 흐름이다. §2 줄은 응답 본문 resp.Body 가 소켓에 남지 않도록 io.Discard 로 EOF 까지 소진하고 닫아 TCP 연결을 재사용하는 규약이다. §3 줄은 타임아웃 없는 DefaultClient 의 영구 블로킹을 NewRequestWithContext 와 5초 데드라인으로 방어하는 취소 제어다. §4 줄은 req.Close = true 로 Connection: close 헤더를 보내고 Transport.DisableKeepAlives 로 전역 풀링을 끄는 세션 정리다. §5 줄은 json.NewEncoder 로 버퍼에 직렬화하고 multipart.Writer 로 파트를 조립해 FormDataContentType 을 등록하는 POST 전송이다.</desc>
<rect width="984" height="768" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 08-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">본문을 끝까지 읽고 닫아야 재사용하고 context 로 끊습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

<title id="dt">Gob 파일이 형식 명세 두 메시지 뒤에 값 메시지를 싣는 순서</title><desc id="dd">gob.Encoder 는 []*Chore 와 Chore 의 형식 명세를 먼저 보내고 값 메시지를 보내며, 메시지마다 앞의 1바이트가 길이입니다.</desc>
<rect width="960" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · GOB SELF-DESCRIBING STREAM</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Gob 파일이 형식 명세 두 메시지 뒤에 값 메시지를 싣는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">1 + 13 + 1 + 40 + 1 + 49 = 105 B. 한 Encoder 는 이미 보낸 형식을 다시 보내지 않습니다.</text>
<rect x="24.0" y="104" width="176" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="112.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">gob.Encoder</text>
<text x="112.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Encode(chores)</text>

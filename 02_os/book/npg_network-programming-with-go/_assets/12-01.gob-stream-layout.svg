<text x="824.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">gob.Decoder</text>
<text x="824.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Decode(&amp;chores)</text>
<path d="M 122.0 166 L 170.0 166 L 170.0 186 L 125.0 186" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#ar)"/>

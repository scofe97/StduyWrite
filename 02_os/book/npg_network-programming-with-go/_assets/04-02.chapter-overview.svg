<title id="dt">io.Copy 로 프록시를 잇고 TeeReader 로 엿보며 TCP 핸드셰이크로 핑을 대신합니다</title><desc id="dd">04-02 의 키워드 개념도. 윗줄(§1)은 io.Copy 로 양방향 독립 고루틴을 엮고 CloseWrite 로 FIN 을 넘긴 뒤 conn.Close 로 안전하게 닫는 프록시다. 가운데 줄(§2)은 TeeReader 와 MultiWriter 로 트래픽을 복제하고 nil 에러 반환과 버퍼 채널로 소켓 통신을 보호하는 무침습 관측이다. 아랫줄(§3)은 net.DialTimeout 으로 TCP 3-way 핸드셰이크 경과 시간 dur 을 재고 Timeout 으로 오류를 판별하는 핑 대체 흐름이다.</desc>
<rect width="984" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 04-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">io.Copy 로 프록시를 잇고 TeeReader 로 엿보며 TCP 핸드셰이크로 핑을 대신합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

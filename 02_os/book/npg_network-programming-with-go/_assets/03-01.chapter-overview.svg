<title id="dt">세션은 핸드셰이크로 열고 창으로 속도를 맞추며 FIN 으로 닫습니다</title><desc id="dd">03-01 의 키워드 개념도. 윗줄은 패킷 손실과 혼잡을 재전송과 전송률 조절로 극복해 결함 없는 바이트 흐름을 만드는 길이다. 둘째 줄은 net.Dial 호출 뒤에서 3-way 핸드셰이크로 세션을 열고 순서 번호와 누적 ACK 로 데이터를 추적하는 흐름이다. 셋째 줄은 수신 버퍼와 Window Size 로 전송 속도를 묶고 Zero Window 로 멈춰 세우는 슬라이딩 윈도다. 넷째 줄은 conn.Close 로 시작하는 양방향 FIN·ACK 교환과 TIME_WAIT 대기를 거쳐 세션을 안전하게 정리하는 정상 종료다.</desc>
<rect width="984" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 03-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세션은 핸드셰이크로 열고 창으로 속도를 맞추며 FIN 으로 닫습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

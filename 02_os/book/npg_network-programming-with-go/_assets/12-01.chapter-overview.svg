<title id="dt">직렬화 흐름과 Go 의 세 직렬화 형식 JSON·Gob·protobuf</title><desc id="dd">12-01 의 키워드 개념도입니다. §1 줄은 Chore{…} 를 []byte 로 바꿔 보내고 받는 쪽이 복제본을 만드는 흐름입니다. §2 줄은 storage import 줄만 바꿔 저장 형식을 고르는 housework 앱입니다. §3 줄은 143 B 텍스트로 저장되지만 any 로 풀면 숫자가 float64 가 되는 JSON 입니다. §4 줄은 형식 정보를 값보다 먼저 싣는 105 B 의 Gob 입니다. §5 줄은 .proto 를 protoc 로 컴파일해 여러 언어가 같은 48 B 를 읽는 protobuf 입니다.</desc>
<rect width="984" height="750" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 12-01 OVERVIEW</text>

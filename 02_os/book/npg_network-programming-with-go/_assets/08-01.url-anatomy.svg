<title id="dt">URL 의 다섯 부분과 authority 포함 관계, fragment 경계</title><desc id="dd">URL 은 scheme, authority, path, query, fragment 로 나뉘며 authority 는 사용자정보·호스트·포트를 포함한다.</desc>
<rect width="840" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NPG CHAPTER 8 · UNIFORM RESOURCE LOCATORS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">URL 의 다섯 부분과 authority 포함 관계, fragment 경계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">scheme 과 host 는 필수이며 fragment 는 브라우저 내부 스크롤 식별자입니다</text>
<rect x="24" y="100" width="792" height="38" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">URL 패턴</text>
<text x="114" y="124" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="500" fill="#F5F5F3">scheme://user:password@host:port/path?key1=value1&amp;key2=value2#table_of_contents</text>
<rect x="24" y="150" width="792" height="270" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="172" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">URL 전체 구조</text>
<rect x="36" y="180" width="584" height="226" rx="6" fill="#6A95D808" stroke="#6A95D8" stroke-width="1.0"/>
<text x="50" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">HTTP 요청 대상 (서버로 전송)</text>

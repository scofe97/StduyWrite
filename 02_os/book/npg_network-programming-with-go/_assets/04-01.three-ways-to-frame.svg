<title id="dt">세 가지 메시지 프레이밍</title><desc id="dd">경계 없는 TCP 바이트 스트림을 고정 버퍼, 구분자 스캐너, TLV 로 자르는 세 가지 방식</desc>
<rect width="880" height="480" fill="#0D1117"/>

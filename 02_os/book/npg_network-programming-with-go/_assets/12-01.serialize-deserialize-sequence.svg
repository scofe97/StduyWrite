<title id="dt">구조체를 바이트로 바꿔 보내고 받는 쪽이 복제본을 만드는 순서</title><desc id="dd">구조체는 연결에 그대로 실을 수 없어 []byte 로 인코딩해 쓰고, 받는 쪽은 같은 형식으로 디코딩해 복제본을 만듭니다.</desc>
<rect width="940" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · SERIALIZATION LIFECYCLE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">구조체를 바이트로 바꿔 보내고 받는 쪽이 복제본을 만드는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">net.Conn.Write 는 []byte 만 받으므로 양쪽이 같은 직렬화 형식을 알아야 합니다.</text>
<rect x="24.0" y="104" width="170" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="109.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">송신 프로세스</text>

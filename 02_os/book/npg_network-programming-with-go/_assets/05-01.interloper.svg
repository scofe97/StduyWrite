<title id="dt">단일 UDP 소켓으로 몰리는 다중 송신자 데이터그램</title><desc id="dd">interloper 와 에코 서버의 패킷이 단일 클라이언트 소켓에 도달하는 흐름</desc>
<rect width="840" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NPG CH.5 — UDP INTERLOPER</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">단일 UDP 소켓으로 몰리는 다중 송신자 데이터그램</text>
<rect x="60" y="140" width="180" height="60" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="150.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">제3자 (interloper)</text>
<text x="150.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">interloper.LocalAddr()</text>
<path d="M 240 170 L 360 170 L 360 200 L 440 200" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="265.49" y="145" width="89.02000000000001" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="310" y="159" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">"pardon me"</text>
<rect x="60" y="280" width="180" height="60" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="150.0" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">정상 서버 (serverAddr)</text>
<text x="150.0" y="326" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">echoServerUDP</text>
<path d="M 240 310 L 360 310 L 360 280 L 440 280" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="282.54" y="285" width="54.92" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="310" y="299" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">"ping"</text>
<rect x="440" y="140" width="340" height="200" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>

<title id="dt">Go kit 메트릭 추상화와 Prometheus 계측 서버</title><desc id="dd">13-03 의 5개 절 핵심 흐름입니다. §1 은 백엔드 교체를 지원하는 Go kit metrics 인터페이스와 프로메테우스 어댑터 연동입니다. §2 는 단조 증가하는 카운터와 오르내리는 게이지의 분담입니다. §3 은 고정 버킷 히스토그램과 클라이언트 계산 서머리의 차이입니다. §4 는 비즈니스 핸들러와 메트릭 노출을 다른 포트로 격리하는 이중 HTTP 서버입니다. §5 는 부하 환경에서 전송 계층 복제와 메트릭 덤프 검증입니다.</desc>

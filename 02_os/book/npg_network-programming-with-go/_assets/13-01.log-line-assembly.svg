<title id="dt">log 패키지의 플래그·접두어 결합과 출력 줄 조립 과정</title><desc id="dd">l.Print 호출 시 전달된 메시지에 파일 위치 플래그와 접두어가 결합되어 최종 개행 문자가 붙은 바이트 열로 조립되는 순서입니다.</desc>
<rect width="920" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LOG LINE ASSEMBLY · PROCESS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">log 패키지의 플래그·접두어 결합과 출력 줄 조립 과정</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Lshortfile 과 Lmsgprefix 플래그가 적용되어 접두어 위치가 조정됩니다.</text>

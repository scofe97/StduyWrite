<title id="dt">TCPConn 손잡이로 소켓을 제어하고 누수 버그를 막습니다</title><desc id="dd">04-03 의 키워드 개념도. §1 줄은 net.Conn 에서 *net.TCPConn 구체 타입을 꺼내고 comma-ok 단언으로 이식성을 지키는 흐름이다. §2 줄은 KeepAliveConfig 로 주기와 횟수를 제어해 커널 빈 ACK 탐침으로 죽은 연결을 정리하는 L4 감지다. §3 줄은 SetLinger(0) 으로 미전송 데이터를 폐기하고 RST 세그먼트로 강제 종료하는 동작이다. §4 줄은 SetReadBuffer 호출로 커널 자동 튜닝이 꺼져 처리량이 떨어지는 위험이다. §5 줄은 별개인 두 결함을 나란히 둔다. handle() 블로킹이 부르는 Zero Window 는 수신과 처리를 나눠 피하고, Close 누락이 부르는 CLOSE_WAIT 고착은 defer c.Close() 로 막는다.</desc>

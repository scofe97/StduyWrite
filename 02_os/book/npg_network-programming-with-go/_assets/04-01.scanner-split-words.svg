<rect x="480" y="104" width="174" height="240" rx="8" fill="#F08A5910" stroke="#F08A59" stroke-width="1.4"/>
<text x="496" y="126" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#F08A59">STAGE 3</text>
<text x="567.0" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">ScanWords 분할</text>
<text x="567.0" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F08A59">scanner.Split()</text>

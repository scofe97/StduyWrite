<title id="dt">구분자 기반 프레이밍과 bufio.Scanner 데이터 흐름</title><desc id="dd">공백 구분자 기준 스트림 분할 및 인접 문장부호 유지 단어 토큰 복원</desc>
<rect width="920" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SCANNER DATA FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">구분자 기반 프레이밍과 bufio.Scanner 데이터 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">ScanWords 분할 함수를 통한 네트워크 바이트 스트림의 토큰화</text>
<rect x="24" y="104" width="174" height="240" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="40" y="126" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#6A95D8">STAGE 1</text>
<text x="111.0" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">원시 바이트 송신</text>
<text x="111.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCP 스트림 (53B)</text>
<rect x="34" y="178" width="154" height="114" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="40" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#6A95D8">conn.Write(payload)</text>
<text x="40" y="218" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">"The bigger the</text>
<text x="40" y="236" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3"> interface, the</text>
<text x="40" y="254" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3"> weaker the</text>
<text x="40" y="272" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3"> abstraction."</text>
<text x="111.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">53B 무경계 스트림</text>
<text x="111.0" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">자체 문장부호 부재</text>
<line x1="198" y1="234" x2="252" y2="234" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 240 234 L 252 234" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="225.0" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">53B 전달</text>
<rect x="252" y="104" width="174" height="240" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="268" y="126" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#E3B341">STAGE 2</text>

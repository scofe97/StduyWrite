<title id="dt">이벤트 로그 볼륨을 줄이는 세 축: 레벨·구조화·샘플링</title><desc id="dd">무분별한 로깅은 CPU 와 디스크 I/O 병목을 부르고 탐색을 어렵게 만듭니다. 레벨로 불필요한 저수준 출력을 거르고, 구조화로 필드 검색을 돕고, 샘플링으로 루프 내 반복 폭주를 줄여 최적의 관측 비용을 유지합니다.</desc>
<rect width="880" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">EVENT LOGGING · THREE REDUCTION AXES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이벤트 로그 볼륨을 줄이는 세 축: 레벨·구조화·샘플링</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">외곽 상자는 전체 시스템 이벤트, 내포된 상자들은 로깅 부하를 줄이는 단계별 필터입니다.</text>
<rect x="36" y="100" width="808" height="380" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="52" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">시스템 런타임 전체 이벤트</text>
<text x="276" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">수많은 요청·루프 순회·상태 변화 (과도한 기록 시 I/O 병목)</text>
<rect x="56" y="140" width="500" height="320" rx="6" fill="#6A95D80c" stroke="#6A95D8" stroke-width="1.2"/>
<text x="72" y="164" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">이벤트 로그 (개별 상태 기록)</text>
<rect x="76" y="176" width="460" height="264" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.1"/>
<text x="90" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">축 1 · 레벨 필터링</text>
<text x="226" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">DEBUG 억제 · ERROR / INFO 우선</text>
<rect x="96" y="212" width="420" height="208" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="110" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">축 2 · 구조화 (Key-Value)</text>
<text x="276" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">msg · level · caller 필드 분리</text>
<rect x="116" y="248" width="380" height="152" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.4"/>
<text x="130" y="272" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">축 3 · 샘플링 제어</text>
<text x="266" y="272" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">1초 틱 내 동일 메시지 솎아내기</text>
<rect x="130" y="292" width="352" height="88" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="1.2"/>
<text x="306" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">최종 기록 로그</text>
<text x="306" y="340" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">{"level":"error","msg":"db down"}</text>
<text x="306" y="362" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최소 I/O 부하로 장애 진단 핵심 정보 확보</text>
<rect x="570" y="140" width="266" height="320" rx="6" fill="#5E6B7E10" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="584" y="164" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">메트릭 영역 (집계 수치)</text>
<text x="584" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">개별 사건 문맥 대신 통계 집계</text>
<rect x="578" y="212" width="250" height="68" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="584" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">카운터 (Counter)</text>
<text x="584" y="258" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">requests_total = 1420 (예시)</text>
<rect x="578" y="290" width="250" height="68" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="584" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">게이지 (Gauge)</text>
<text x="584" y="336" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">active_conns = 42 (예시)</text>
<rect x="578" y="368" width="250" height="68" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="584" y="390" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">히스토그램 (Histogram)</text>
<text x="584" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">duration_bucket{le="0.1"} 320 (예시)</text>
</svg>
<title id="dt">net.TCPConn 추출 경로와 제어 손잡이</title><desc id="dd">net.Conn 타입 단언과 TCP 전용 함수(AcceptTCP·DialTCP)를 통한 *net.TCPConn 획득 흐름</desc>

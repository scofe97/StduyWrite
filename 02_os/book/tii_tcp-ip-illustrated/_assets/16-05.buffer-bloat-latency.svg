<title id="dt">버퍼 크기와 링크 속도별 큐 지연 추세 (계산 예시)</title><desc id="dd">버퍼 용량이 커질수록 패킷 손실은 줄어들지만 대기열이 가득 차면 큐잉 지연이 초 단위로 누적됩니다. 특히 저속 업로드 링크에서 수백 킬로바이트 버퍼는 대화형 트래픽 허용 기준선인 150ms 를 크게 초과합니다.</desc>
<rect width="920" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 16-05 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">버퍼 크기와 링크 속도별 큐 지연 추세 (계산 예시)</text>

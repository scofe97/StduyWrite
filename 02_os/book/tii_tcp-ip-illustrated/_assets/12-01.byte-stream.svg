<title id="dt">write 경계는 선을 건너지 못한다</title><desc id="dd">송신 애플리케이션이 10·20·50 바이트로 세 번 쓴 데이터는 TCP 안에서 경계 없는 80 바이트 줄 하나가 되고, 수신 애플리케이션은 그것을 20 바이트씩 네 번 읽는다. 가로 축은 시간이 아니라 스트림 안의 바이트 위치다.</desc>

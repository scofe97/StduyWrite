<title id="dt">persist 타이머의 지수적 백오프 간격 증가</title><desc id="dd">0 창 상태가 지속되면 persist 타이머는 직전 탐침 대비 약 2초, 4초, 8초로 만료 간격을 두 배씩 늘린다. 재전송 타이머와 마찬가지로 망에 과도한 탐침 부하를 주지 않도록 지수 백오프를 적용한다.</desc>

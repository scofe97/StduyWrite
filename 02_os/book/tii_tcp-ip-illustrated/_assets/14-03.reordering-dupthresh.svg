<title id="dt">재정렬 깊이가 중복 ACK 문턱을 넘는가</title><desc id="dd">송신자가 4·5·6(·7) 을 차례로 보냈다. 왼쪽은 4 와 5 가 자리를 바꿔 도착해 중복 ACK 가 하나만 생기고, 문턱 3 에 못 미쳐 무시된다. 오른쪽은 4 가 세 자리 뒤처져 5·6·7 이 먼저 닿고 중복 ACK 가 셋 쌓인다. 송신자는 4 를 빠르게 재전송하고, 늦게 닿은 원본 4 때문에 수신자는 4 를 두 번 받는다. ACK 번호는 원서 그림처럼 이미 도착한 마지막 패킷을 가리킨다.</desc>

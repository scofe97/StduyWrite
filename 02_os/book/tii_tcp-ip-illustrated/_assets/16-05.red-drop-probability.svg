<line x1="110" y1="390.0" x2="840" y2="390.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="98" y="394.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">10% (MaxP)</text>

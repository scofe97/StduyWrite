<title id="dt">평균 큐 길이에 따른 RED 패킷 버림·마킹 확률 (계산 예시)</title><desc id="dd">단기 버스트로 인한 일시적 큐 증가는 버리지 않고 수용하되, 지속적 혼잡으로 평균 큐 길이가 min_th(20)를 넘으면 확률적으로 패킷을 선제 마킹·폐기합니다. max_th(60)를 넘으면 강제 폐기(1.0)로 전환하여 버퍼 완전 고갈을 차단합니다.</desc>
<rect width="920" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 16-05 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">평균 큐 길이에 따른 RED 패킷 버림·마킹 확률 (계산 예시)</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">순간 큐의 버스트는 받아들이고, 평균 큐의 지속 혼잡만 선제적으로 솎아냅니다</text>

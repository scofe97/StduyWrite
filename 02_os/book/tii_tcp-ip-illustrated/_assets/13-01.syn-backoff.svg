<title id="dt">응답 없는 상대에게 SYN 을 다시 보내는 시각</title><desc id="dd">가로 축은 몇 번째 SYN 인지, 세로 축은 첫 SYN 뒤 몇 초에 나갔는지다. 책의 리눅스(2009)는 3초에서 시작해 간격을 매번 두 배로 늘려 SYN 6개를 보내고 약 189초에 포기했다. 커널 7.0.14 실측은 1초 간격으로 다섯 번 보낸 뒤에야 두 배로 늘려 SYN 11개를 보내고 약 134초에 포기했다.</desc>

<title id="dt">손실 회복 중 ACK 순서별 누적 송신 패킷 (계산 예시)</title><desc id="dd">초기 창 W = 16 에서 1개 손실 후 목표 cwnd = 8 로 줄어드는 1 RTT 복구 구간이다(최대 15개 중복 ACK). Reno 는 앞쪽 8개 중복 ACK 동안 송신을 멈췄다가 9번째부터 ACK마다 1개씩(총 7개) 몰아서 보낸다. Rate Halving 은 2 ACK 마다 1 패킷을 보내 전송을 고르게 편다.</desc>

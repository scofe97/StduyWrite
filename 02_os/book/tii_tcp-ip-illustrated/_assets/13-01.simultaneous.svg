<title id="dt">동시 열기와 동시 닫기 — 세그먼트가 엇갈릴 때</title><desc id="dd">왼쪽은 A(포트 7777)와 B(포트 8888)가 서로에게 동시에 능동 열기를 한 경우로, 두 SYN 이 망에서 엇갈린 뒤 각자 SYN,ACK 를 보내 세그먼트가 넷이 된다. 오른쪽은 양쪽이 동시에 FIN 을 보낸 경우로, 세그먼트 수는 보통 닫기와 같은 넷이고 순서만 엇갈린다.</desc>

<title id="dt">지연 ACK 의 타이머 구간과 송신 시점</title><desc id="dd">세그먼트를 받은 수신자는 즉시 ACK 를 보내지 않고 타이머를 켠 뒤 응답 데이터가 생기기를 기다린다. 데이터가 생기면 그 세그먼트에 ACK 를 실어 보내고, 데이터가 없으면 타이머 만료 시 순수 ACK 를 전송한다. 두 번째 전체 크기 세그먼트가 도착하거나 quickack 모드일 때는 지연 없이 즉시 전송한다.</desc>
<rect width="920" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 15-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">지연 ACK 의 타이머 구간과 송신 시점</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">보낼 데이터에 ACK 를 얹으면 대화형 패킷이 넷에서 셋으로 줄어듭니다</text>
<line x1="250.0" y1="126" x2="250.0" y2="434" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 4"/>
<text x="250.0" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">0ms</text>
<line x1="336.0" y1="126" x2="336.0" y2="434" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 4"/>
<text x="336.0" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">40ms</text>
<line x1="465.0" y1="126" x2="465.0" y2="434" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 4"/>
<text x="465.0" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">100ms</text>
<line x1="680.0" y1="126" x2="680.0" y2="434" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 4"/>
<text x="680.0" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">200ms</text>
<rect x="24" y="142" width="210" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">즉시 ACK (quickack)</text>
<text x="36" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">지연 없이 즉시 응답</text>
<rect x="24" y="218" width="210" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">지연 ACK (데이터 편승)</text>
<text x="36" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">응답 데이터에 ACK 결합</text>
<rect x="24" y="294" width="210" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">지연 ACK (타이머 만료)</text>
<text x="36" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터 없어 순수 ACK 전송</text>
<rect x="24" y="370" width="210" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">두 번째 MSS 도착</text>
<text x="36" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">누적 ACK 규정 충족</text>
<line x1="250.0" y1="151" x2="250.0" y2="183" stroke="#6A95D8" stroke-width="2.4"/>
<text x="260.0" y="171.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">도착 즉시 순수 ACK 전송 (지연 0ms)</text>
<rect x="251.0" y="230" width="62.5" height="26" rx="4" fill="#E3B34116" stroke="#E3B341" stroke-width="1.0"/>
<text x="282.25" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">대기</text>
<line x1="314.5" y1="227" x2="314.5" y2="259" stroke="#3FB98C" stroke-width="2.4"/>
<text x="324.5" y="247.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">응답 데이터 발생 · ACK 편승 송신 (예시 시점)</text>
<rect x="251.0" y="306" width="84.0" height="26" rx="4" fill="#E3B34116" stroke="#E3B341" stroke-width="1.0"/>
<text x="293.0" y="323.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">최소 40ms</text>
<rect x="337.0" y="306" width="342.0" height="26" rx="4" fill="#5E6B7E16" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="508.0" y="323.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">대기 구간 (상한 200ms)</text>
<line x1="680.0" y1="303" x2="680.0" y2="335" stroke="#F0616D" stroke-width="2.4"/>
<text x="690.0" y="323.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">타이머 만료 · 순수 ACK 전송 (200ms)</text>
<rect x="251.0" y="382" width="105.5" height="26" rx="4" fill="#E3B34116" stroke="#E3B341" stroke-width="1.0"/>
<text x="303.75" y="399.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">대기</text>
<line x1="357.5" y1="379" x2="357.5" y2="411" stroke="#3FB98C" stroke-width="2.4"/>
<text x="367.5" y="399.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">2번째 전체 MSS 도착 · 즉시 ACK (예시 시점)</text>
<line x1="12" y1="454" x2="872" y2="454" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="476" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="466" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">지연 타이머 대기 구간</text>
<rect x="300" y="466" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="322" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">편승 및 조건 충족 즉시 전송</text>
<rect x="552" y="466" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="574" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">타이머 만료 단독 전송</text>
<rect x="752" y="466" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="774" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">즉시 ACK 모드 전송</text>

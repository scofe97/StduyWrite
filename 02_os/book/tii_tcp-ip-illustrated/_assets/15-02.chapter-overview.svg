<title id="dt">수신 창 제어와 persist 타이머의 재개 흐름</title><desc id="dd">수신자는 버퍼 여유에 따라 창을 광고하고, 버퍼가 차면 0 창으로 송신을 멈춘다. 창 업데이트 유실(가상 시나리오)로 인한 교착을 송신자의 persist 탐침이 해소한다.</desc>
<rect width="920" height="390" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 15-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">수신 창 제어와 persist 타이머의 재개 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">0 창 광고는 송신을 멈추고 persist 탐침은 닫힌 창을 다시 두드립니다</text>
<rect x="24" y="136" width="152" height="136" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="24" y="136" width="152" height="30" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.0"/>
<text x="100.0" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">1. 창 광고</text>
<text x="100.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">정상 수신 여유</text>
<rect x="55.800000000000004" y="208" width="88.39999999999999" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="100.0" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">win = 3000</text>
<text x="100.0" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#F5F5F3">데이터 계속 전송</text>

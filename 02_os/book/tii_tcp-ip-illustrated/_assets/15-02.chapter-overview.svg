<rect x="208" y="136" width="152" height="30" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.0"/>
<text x="284.0" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">2. 버퍼 포화</text>
<text x="284.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">앱 미소비로 포화</text>

<title id="dt">중복 ACK 셋을 세고 바로 다시 보낸다</title><desc id="dd">23801 세그먼트가 버려진 뒤 ACK 23801 이 처음 온 다음에도 같은 번호의 ACK 가 이어진다. 0.853초의 것은 광고 창만 바뀐 창 업데이트라 세지 않고, 0.890 · 0.926 · 0.964초의 셋이 중복 ACK 다. 셋째가 도착하자 송신자는 RTO 만료를 기다리지 않고 0.993초에 23801 을 다시 보낸다. 왼쪽 열은 송신자 쪽 캡처 시각이다.</desc>
<rect width="920" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 14-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">중복 ACK 셋을 세고 바로 다시 보낸다</text>

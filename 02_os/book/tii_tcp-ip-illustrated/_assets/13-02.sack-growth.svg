<title id="dt">구멍 뒤의 섬이 SACK 블록으로 하나씩 늘어난다</title><desc id="dd">수신자가 돌려보낸 ACK 여섯 개를 위에서 아래로 시간순으로 놓았다. ACK 번호는 21721 에 멈춘 채 구멍 뒤에 받은 범위가 블록으로 늘고, 블록이 하나 늘 때마다 IP 길이가 8바이트씩 커진다. 막대 안 숫자는 옵션 안의 순서로, 가장 최근에 받은 블록이 1 이다. 구멍이 메워지면 ACK 번호가 28961 로 뛰고 그 앞의 블록이 목록에서 빠진다.</desc>

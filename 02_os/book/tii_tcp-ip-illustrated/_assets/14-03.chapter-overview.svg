<title id="dt">재전송은 뒤늦은 증거로 다시 판정한다</title><desc id="dd">타이머 만료나 중복 ACK만으로 손실을 확정하지 않는다. 재전송 뒤 돌아온 ACK, 타임스탬프, DSACK으로 손실인지 오탐인지 구분해 응답한다.</desc>
<rect width="920" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 14-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">재전송은 뒤늦은 증거로 다시 판정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">지연·재정렬·복제도 손실과 같은 첫 신호를 만듭니다</text>
<path d="M 460 172 L 460 184" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="232.0" y="112" width="456" height="56" rx="20" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="460" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">RTO 만료 · 중복 ACK</text>
<text x="460" y="157" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">손실을 의심하는 첫 신호</text>
<path d="M 460 252 L 460 264" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="232.0" y="192" width="456" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="460" y="217" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">미확인 바이트 재전송</text>
<text x="460" y="237" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">타이머 또는 빠른 재전송</text>
<rect x="232.0" y="272" width="456" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="460" y="297" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">뒤늦은 ACK · TSecr · DSACK</text>
<text x="460" y="317" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원본과 재전송본을 비교할 증거</text>
<path d="M 460 332 L 460 384" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<polygon points="460,392 550.0,424.0 460,456 370.0,424.0" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="460" y="429.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">실제 손실?</text>
<rect x="24" y="472" width="320" height="56" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="184.0" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">실제 손실</text>
<text x="184.0" y="516" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">구멍 복구 계속</text>
<rect x="576" y="472" width="320" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="736.0" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">오탐</text>
<text x="736.0" y="516" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">불필요한 재전송 영향 완화</text>
<path d="M 370.0 424.0 L 184.0 424.0 L 184.0 464" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<path d="M 550.0 424.0 L 736.0 424.0 L 736.0 464" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="300" y="414.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">예</text>
<text x="620" y="414.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">아니오</text>
</svg>
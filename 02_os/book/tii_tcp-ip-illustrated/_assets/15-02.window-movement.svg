<title id="dt">슬라이딩 윈도 경계의 닫힘과 열림</title><desc id="dd">송신 창의 왼쪽 끝은 ACK 가 도착할 때 오른쪽으로 전진하며 창을 닫고, 오른쪽 끝은 수신자가 새 창을 광고할 때 전진하며 창을 연다. 오른쪽 끝이 왼쪽으로 후퇴하는 창 줄어듦은 강하게 막는다(SHOULD NOT).</desc>

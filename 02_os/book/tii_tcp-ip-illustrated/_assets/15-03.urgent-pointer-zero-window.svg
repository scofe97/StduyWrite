<title id="dt">0 창 상태에서의 긴급 데이터 전송과 위치 포인터</title><desc id="dd">수신 창이 0으로 닫힌 상태에서도 긴급 데이터(URG)는 창 탐침 형태로 즉시 전송될 수 있다. 긴급 포인터는 데이터를 새치기하지 않고 인라인 바이트 스트림상의 첫 비긴급 바이트 위치(6146)를 가리킨다.</desc>
<rect width="920" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 15-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">0 창 상태에서의 긴급 데이터 전송과 위치 포인터</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">긴급 포인터는 새치기가 아니라 바이트 스트림 내 위치 표시(오프셋)입니다</text>

<title id="dt">RTO를 정한 뒤 ACK를 기다리는 과정</title><desc id="dd">RTT 표본으로 평균과 변동 폭을 갱신해 재전송 대기 시간을 정한다. 제때 ACK가 오면 다음 표본을 얻고, 만료되면 다시 보내며 대기 간격을 늘린다.</desc>
<rect width="920" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 14-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">RTO를 정한 뒤 ACK를 기다리는 과정</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">표본 → 추정 → 대기, 그리고 ACK 도착 여부로 갈라집니다</text>
<path d="M 460.0 172 L 460.0 184" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="260" y="112" width="400" height="56" rx="20" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="460.0" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">RTT 표본</text>
<text x="460.0" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보낸 바이트를 덮는 ACK의 왕복 시간</text>
<path d="M 460.0 252 L 460.0 264" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="260" y="192" width="400" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="460.0" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">srtt · rttvar 갱신</text>
<text x="460.0" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평균과 편차를 따로 추정</text>
<path d="M 460.0 332 L 460.0 344" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="260" y="272" width="400" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="460.0" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">RTO 산정</text>
<text x="460.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평균 + 변동 폭에 따른 여유</text>
<rect x="260" y="352" width="400" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="460.0" y="376" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">ACK 대기 타이머</text>
<text x="460.0" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">미확인 데이터가 남아 있는 동안 유지</text>
<rect x="24" y="432" width="408" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="228.0" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">제때 ACK</text>
<text x="228.0" y="476" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">다음 RTT 표본에 반영</text>
<rect x="488" y="432" width="408" height="56" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="692.0" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">RTO 만료</text>
<text x="692.0" y="476" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재전송 · 백오프, 모호한 표본 보류</text>
<path d="M 300 408 L 300 416 L 228.0 416 L 228.0 426" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 620 408 L 620 416 L 692.0 416 L 692.0 426" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
</svg>
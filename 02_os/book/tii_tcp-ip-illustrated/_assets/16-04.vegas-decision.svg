<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">TCP Vegas 의 큐 지연 기반 혼잡 판정 순서도 (수치 흐름 예시)</title><desc id="dd">매 왕복 시간마다 기대 처리량과 실측 처리량의 차이(Diff)로 병목 큐의 패킷 점유량을 추정한다. baseRTT=100ms, RTT=125ms, cwnd=20 예시에서 Diff=4는 β=3을 초과하므로 창을 19로 줄여 버퍼를 비운다.</desc>
<rect width="920" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 16-04 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TCP Vegas 의 큐 지연 기반 혼잡 판정 순서도 (수치 흐름 예시)</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">손실이 나기 전에 버퍼 대기열을 감지해 선제적으로 속도를 조절합니다</text>
<rect x="240" y="106" width="440" height="54" rx="24" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="460" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">왕복 시간(RTT) 및 혼잡 창 관측</text>
<text x="460" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">관측 예시: baseRTT = 100ms, RTT = 125ms, cwnd = 20</text>
<path d="M 460 160 L 460 178" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="220" y="178" width="480" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="460" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">버퍼 대기열 추정 (Diff 계산)</text>
<text x="460" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">Diff = 20 × (1 - 100 / 125) = 4 패킷 적체</text>
<path d="M 460 238 L 460 256" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<polygon points="460,256 610,288 460,320 310,288" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="460" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">대기열 크기 판정 (예: Diff = 4)</text>
<text x="460" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기준 임계값 α = 1, β = 3</text>
<rect x="24" y="356" width="260" height="76" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="154" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">cwnd ← cwnd + 1 (20 → 21)</text>
<text x="154" y="394" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">Diff &lt; 1 (예: RTT=104ms, Diff=0.8)</text>
<text x="154" y="412" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">링크 유휴 방지 (선형 가산)</text>
<rect x="330" y="356" width="260" height="76" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="460" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">cwnd 유지 (20 패킷 유지)</text>
<text x="460" y="394" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">1 ≤ Diff ≤ 3 (예: RTT=110ms, Diff=1.8)</text>
<text x="460" y="412" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">적정 대기열 안정 운용</text>
<rect x="636" y="356" width="260" height="76" rx="6" fill="#E3B34116" stroke="#E3B341" stroke-width="1.5"/>
<text x="766" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">cwnd ← cwnd - 1 (20 → 19)</text>
<text x="766" y="394" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">Diff &gt; 3 (예시 경로: Diff = 4)</text>
<text x="766" y="412" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">큐 지연 해소 (선형 감산)</text>
<path d="M 310 288 L 154 288 L 154 350" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="208" y="280" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">Diff &lt; α</text>
<path d="M 460 320 L 460 350" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="474" y="344" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">α ≤ Diff ≤ β</text>
<path d="M 610 288 L 766 288 L 766 350" fill="none" stroke="#E3B341" stroke-width="1.8" marker-end="url(#warn)"/>
<text x="712" y="280" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">Diff &gt; β (해당)</text>
<line x1="154" y1="432" x2="154" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="460" y1="432" x2="460" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="766" y1="432" x2="766" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="154" y1="452" x2="766" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<path d="M 460 452 L 460 468" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="460" y="482" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">다음 RTT 전송에 갱신 창 적용 (예시 경로: cwnd = 19)</text>
<line x1="12" y1="516" x2="872" y2="516" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="528" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">선형 가산 (Diff &lt; α)</text>
<rect x="352" y="528" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="374" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">창 유지 (α ≤ Diff ≤ β)</text>
<rect x="643" y="528" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="665" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">선형 감산 (Diff &gt; β, 예시)</text>
</svg>
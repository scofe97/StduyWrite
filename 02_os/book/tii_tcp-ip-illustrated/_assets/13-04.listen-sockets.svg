<title id="dt">포트 하나, 소켓 여럿 — 4-tuple 로 갈라진다</title><desc id="dd">위는 와일드카드 주소로 22번 포트에 바인딩한 sshd 다. LISTEN 소켓 하나가 새 SYN 을 받고, 성립한 연결마다 같은 포트 22 를 쓰는 ESTABLISHED 소켓이 따로 생긴다. 들어온 세그먼트는 목적지·출발지의 IP 주소와 포트 네 값으로 어느 소켓에 갈지 정해진다. 아래는 10.0.0.1:8888 에만 바인딩한 서버로, 같은 호스트의 127.0.0.1:8888 로 온 SYN 은 맞는 대기 소켓이 없어 운영체제 TCP 가 RST 로 거절한다.</desc>
<rect width="920" height="608" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 13-04 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">포트 하나, 소켓 여럿 — 4-tuple 로 갈라진다</text>

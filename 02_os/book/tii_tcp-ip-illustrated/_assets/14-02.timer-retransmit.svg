<title id="dt">1401 을 잃었는데 1 을 다시 보내는 타이머</title><desc id="dd">송신자가 1번과 1401번 세그먼트를 보냈고 1401번이 버려졌다. 수신자가 1번의 ACK 를 지연한 것으로 보이는 사이 219ms 가 지나 타이머가 만료되자, 송신자는 미확인 구간의 맨 앞인 1번을 다시 보낸다. 그 ACK 는 중복 ACK 셋과 달리 창을 전진시켜 RTT 추정에 쓰이고, 뒤에 보낸 새 데이터(그림에서 생략)가 만든 중복 ACK 셋은 쓰이지 않는다. 1401번이 마침내 도착하면 ACK 7001 이 모든 데이터를 확인한다.</desc>
<rect width="920" height="796" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 14-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">1401 을 잃었는데 1 을 다시 보내는 타이머</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">타이머는 무엇을 잃었는지 모른 채 맨 앞부터 다시 보냅니다</text>
<rect x="24.0" y="100" width="300" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="174.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">송신자</text>
<text x="174.0" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재전송 타이머 하나</text>
<rect x="572.0" y="100" width="300" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="722.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">수신자</text>
<text x="722.0" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ACK 를 지연할 수 있음</text>
<line x1="174.0" y1="150" x2="174.0" y2="648" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="722.0" y1="150" x2="722.0" y2="648" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>

<title id="dt">수신자 구멍을 찾는 세 가지 신호</title><desc id="dd">순서 밖 데이터는 중복 ACK를 만들고 SACK을 사용할 때 받은 범위도 알린다. 피드백이 없으면 재전송 타이머가 만료될 때 확인되지 않은 데이터부터 다시 보낸다.</desc>
<rect width="920" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 14-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">수신자 구멍을 찾는 세 가지 신호</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">빠른 재전송은 ACK를, 최후의 복구는 타이머를 봅니다</text>
<rect x="260" y="112" width="400" height="56" rx="20" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="460.0" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">수신 측 바이트 구멍</text>
<text x="460.0" y="158" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앞쪽은 비고 뒤쪽 데이터는 도착</text>
<path d="M 460.0 172 L 460.0 208 L 160.0 208 L 160.0 232" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<rect x="24" y="240" width="272" height="88" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="160.0" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">중복 ACK</text>
<text x="160.0" y="291" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 다음 기대 번호 반복</text>
<text x="160.0" y="313" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">빠른 재전송</text>
<path d="M 460.0 172 L 460.0 208 L 460.0 208 L 460.0 232" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="324" y="240" width="272" height="88" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="460.0" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#3FB98C">SACK 블록</text>
<text x="460.0" y="291" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">구멍 뒤 수신 범위 알림</text>
<text x="460.0" y="313" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">선택적 복구</text>
<path d="M 460.0 172 L 460.0 208 L 760.0 208 L 760.0 232" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<rect x="624" y="240" width="272" height="88" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="760.0" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#E3B341">RTO 만료</text>
<text x="760.0" y="291" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">필요한 ACK가 안 돌아옴</text>
<text x="760.0" y="313" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">타이머 재전송</text>

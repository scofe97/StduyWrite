<title id="dt">CUBIC 의 시간 기반 혼잡 창 성장 곡선 (계산 예시)</title><desc id="dd">CUBIC은 W(t)=C(t-K)³+Wmax 공식에 따라 손실 직후 오목하게 빠르게 복구하고, 직전 최대치 Wmax 근처에서 평탄하게 안정성을 유지한 뒤, 볼록하게 가속하며 새 대역폭을 탐색한다(비교선: RTT 100ms 가정).</desc>

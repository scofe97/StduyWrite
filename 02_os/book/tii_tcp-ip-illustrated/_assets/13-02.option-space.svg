<title id="dt">옵션 칸 40바이트를 실제로 채우는 모습</title><desc id="dd">리눅스가 실제로 보낸 세그먼트 둘의 옵션 칸을 바이트 폭 비례로 그렸다. 윗줄 SYN 은 MSS·SACK 허용·Timestamps·NOP·Window Scale 로 20바이트를 쓴다. 아랫줄은 SACK 블록 세 개를 실은 ACK 로, 4바이트 정렬용 NOP 넷과 Timestamps 10바이트에 SACK 26바이트가 더해져 40바이트를 다 채운다. N 은 NOP 이다.</desc>
<rect width="920" height="456" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 13-02 §1 · §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">옵션 칸 40바이트를 실제로 채우는 모습</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Timestamps 를 함께 쓰면 SACK 블록은 세 개가 한도입니다</text>
<line x1="160" y1="120" x2="880" y2="120" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

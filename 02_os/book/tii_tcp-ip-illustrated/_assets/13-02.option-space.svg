<rect x="394" y="280" width="18" height="56" rx="0" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="403.0" y="314" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">N</text>
<rect x="412" y="280" width="468" height="56" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>

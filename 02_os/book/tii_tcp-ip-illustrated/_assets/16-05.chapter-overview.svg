<title id="dt">버퍼블로트·AQM·ECN 4단계 흐름과 공격 방어</title><desc id="dd">대용량 버퍼로 인한 큐잉 지연 폭증을 능동 대기열 관리(AQM)로 조기 감지하고, 명시적 혼잡 통보(ECN)로 패킷 손실 없이 송신 창을 줄이며, 조작된 ACK 로 전송률을 가로채는 수신자 공격을 방어합니다.</desc>

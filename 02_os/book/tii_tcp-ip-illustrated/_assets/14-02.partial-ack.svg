<title id="dt">부분 ACK 가 다음 구멍을 드러낸다</title><desc id="dd">빠른 재전송 직전 송신자가 보낸 가장 높은 순서 번호로 복구 지점 44801 을 기억한다. 23801 을 다시 보낸 뒤 돌아온 ACK 는 26601 이라 앞 구멍은 메워졌지만 복구 지점에는 못 미친다. NewReno 송신자는 이 부분 ACK 를 받자마자 26601 을 다시 보내고, ACK 가 44801 이상이 될 때까지 복구를 이어 간다.</desc>
<rect width="920" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 14-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">부분 ACK 가 다음 구멍을 드러낸다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">SACK 없이는 구멍 하나를 알아내는 데 왕복 하나가 듭니다</text>

<title id="dt">누적 ACK 가 말하지 못하는 구간</title><desc id="dd">수신자가 1–1024 와 2049–3072 를 받았고 그 사이 1025–2048 이 아직 오지 않았다. ACK 번호는 순서대로 받은 끝까지만 셀 수 있어 1025 에서 멈추고, 애플리케이션도 1024 까지만 받는다. 뒤쪽 2049–3072 를 받았다는 사실은 SACK 옵션이 따로 알려야 한다.</desc>
<rect width="920" height="464" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 12-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">누적 ACK 가 말하지 못하는 구간</text>

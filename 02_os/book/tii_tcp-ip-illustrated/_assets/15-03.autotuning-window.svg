<title id="dt">수신 애플리케이션 소비 지연에 따른 광고 창 크기 변화</title><desc id="dd">리눅스 수신자는 ACK 마다 창을 2×MSS 씩 키우지만, 애플리케이션이 20초간 읽기를 멈추면 버퍼가 가득 차 0 창으로 닫힌다. 20.043초에 읽기를 재개하면 창이 다시 열려 최대 67808바이트까지 확장된다.</desc>

<path d="M 762.0 405 L 136.0 405" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)" stroke-dasharray="4 3"/>
<rect x="350.0" y="385" width="196" height="18" fill="#0D1117"/>

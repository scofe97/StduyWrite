<text x="448.0" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">ACK 1 · TCP ECE=1 (에코)</text>
<text x="448.0" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">혼잡 신호 1차 전달 · 송신자가 여기서 한 번 반응</text>

<title id="dt">ECN 무손실 혼잡 신호 교환과 송신 창 축소 순서</title><desc id="dd">송신자가 ECT(0)를 켜서 보내면 병목 라우터는 패킷을 버리지 않고 IP 헤더를 CE(11)로 바꿔 보냅니다. 수신자는 ECE 플래그로 혼잡을 송신자에게 반복 전달하고, 송신자는 cwnd를 절반으로 줄인 뒤 CWR 플래그로 통보하여 ECE 에코를 멈춥니다.</desc>
<rect width="920" height="720" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 16-05 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">ECN 무손실 혼잡 신호 교환과 송신 창 축소 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">패킷 손실 없이 라우터 마킹과 TCP 플래그 피드백으로 감속합니다</text>
<rect x="24.0" y="100" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="124.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">송신자</text>
<text x="124.0" y="137" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">TCP 송신 호스트</text>
<rect x="348.0" y="100" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="448.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">중간 라우터</text>
<text x="448.0" y="137" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">AQM 지원 병목 라우터</text>
<rect x="672.0" y="100" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="772.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">수신자</text>
<text x="772.0" y="137" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">TCP 수신 호스트</text>
<line x1="124.0" y1="150" x2="124.0" y2="650" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>

<title id="dt">망이 만든 사본도 중복 ACK 를 쌓는다</title><desc id="dd">송신자가 3–6 을 보냈고, 망이 3 을 세 번 더 전달했다. 수신자는 원본 3 에 A3 을 보낸 뒤 사본마다 같은 A3 을 되풀이한다. 비 SACK 송신자는 중복 ACK 셋을 5·6 이 먼저 도착한 신호로 읽어 4 를 빠르게 재전송한다. 원본 4·5·6 의 도착은 그리지 않았다. DSACK 을 쓰면 중복 ACK 마다 '3 은 이미 받음' 이 실려 복제임을 가릴 수 있다.</desc>
<rect width="920" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 14-03 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">망이 만든 사본도 중복 ACK 를 쌓는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">중복 ACK 의 원인이 구멍이 아니라 사본일 수 있습니다</text>

<title id="dt">멈춰 기다리기와 창 3 — 같은 RTT 동안 보내는 양</title><desc id="dd">왼쪽은 패킷 하나를 보내고 ACK 가 올 때까지 멈추는 정지-대기, 오른쪽은 ACK 없이 세 개까지 띄우는 창 방식이다. 두 판 모두 왕복 시간 R 은 같고 아래로 기운 선이 패킷(파랑)과 ACK(회색)의 이동이다. RTT 두 번 동안 왼쪽은 2개, 오른쪽은 6개를 보낸다.</desc>

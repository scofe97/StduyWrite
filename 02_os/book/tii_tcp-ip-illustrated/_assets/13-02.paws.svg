<title id="dt">한 바퀴 돈 순서 번호를 타임스탬프가 가려낸다</title><desc id="dd">창 1GB 로 6GB 를 보내며 창마다 타임스탬프를 1 씩 올린다고 하자. 32비트 순서 번호는 4G 에서 0 으로 돌아가므로 E 부터 번호가 겹친다. B 에서 사라진 세그먼트가 F 에 다시 나타나면 순서 번호(1G:2G)만으로는 F 의 새 데이터와 구분되지 않지만, 타임스탬프 2 가 최근 값 6 보다 작아 버려진다. 원서 표 13-2 를 본문 서술로 재구성했다.</desc>

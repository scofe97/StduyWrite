<title id="dt">세 탐지법이 타이머 오탐을 아는 시점</title><desc id="dd">같은 타이머 오탐 한 번을 두고 송신자가 증거를 받는 순서를 가로로 놓았다. Eifel 은 원본에 대한 첫 ACK 의 TSecr 만으로 판정하고, F-RTO 는 첫 ACK 뒤 새 데이터를 보낸 다음 두 번째 ACK 까지 본다. DSACK 은 재전송본이 수신자에 닿은 뒤 그 보고가 돌아와야 한다. 앞의 둘은 Eifel 응답의 SPUR_TO, DSACK 은 LATE_SPUR_TO 에 해당한다. 칸 사이의 실제 시간 간격은 경로마다 다르다.</desc>
<rect width="920" height="456" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 14-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세 탐지법이 타이머 오탐을 아는 시점</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로 축은 시간이 아니라 송신자가 증거를 받는 순서입니다</text>
<text x="260" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">RTO 만료 · 재전송</text>
<text x="260" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TSval T2 저장</text>
<text x="440" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">첫 ACK 도착</text>
<text x="440" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원본에 대한 ACK</text>
<text x="620" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">두 번째 ACK 도착</text>
<text x="620" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">타임아웃 뒤</text>
<text x="800" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">DSACK 도착</text>
<text x="800" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재전송본 수신 뒤</text>
<rect x="12" y="168" width="868" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="194" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Eifel 탐지</text>
<text x="24" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">SPUR_TO</text>
<rect x="12" y="240" width="868" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">F-RTO</text>
<text x="24" y="286" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">SPUR_TO</text>
<rect x="12" y="312" width="868" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">DSACK</text>
<text x="24" y="358" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">LATE_SPUR_TO</text>
<line x1="260" y1="144" x2="260" y2="376" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<line x1="440" y1="144" x2="440" y2="376" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<line x1="620" y1="144" x2="620" y2="376" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<line x1="800" y1="144" x2="800" y2="376" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<rect x="260" y="178" width="180" height="28" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="350.0" y="197" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">TSecr T1 &lt; T2</text>
<rect x="260" y="250" width="360" height="28" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="530.0" y="269" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">두 번째 ACK 도 창 전진</text>
<line x1="440" y1="246" x2="440" y2="282" stroke="#6A95D8" stroke-width="1.6"/>
<text x="440" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">새 데이터 송신</text>
<rect x="260" y="322" width="540" height="28" rx="4" fill="#E3B34114" stroke="#E3B341" stroke-width="1.0"/>
<text x="710.0" y="341" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">중복 범위 보고</text>
<line x1="12" y1="400" x2="872" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="422" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="412" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가장 이른 판정</text>
<rect x="248" y="412" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="270" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ACK 진행으로 판정</text>
<rect x="435" y="412" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="457" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수신자 보고로 판정</text>
</svg>
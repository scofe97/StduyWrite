<rect x="386" y="140" width="164" height="34" rx="8" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.2"/>
<text x="468.0" y="162" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">3단계</text>
<text x="468.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">지연 ACK 편승</text>
<text x="468.0" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">3개 · 총 216B</text>

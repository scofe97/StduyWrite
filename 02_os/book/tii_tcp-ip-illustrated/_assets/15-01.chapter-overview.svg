<title id="dt">대화형 통신에서 지연 ACK 와 Nagle 이 결합하는 과정</title><desc id="dd">사용자의 1바이트 키 입력이 네 세그먼트를 만들고, 지연 ACK 가 에코에 편승해 셋으로 줄이며, Nagle 이 RTT 동안 패킷을 묶는다. 그러나 두 알고리즘이 함께 작동하면 ACK 지연 타이머가 끝날 때까지 데이터 전송이 멈추는 상호 교착이 발생한다.</desc>
<rect width="920" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 15-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">대화형 통신에서 지연 ACK 와 Nagle 이 결합하는 과정</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">오버헤드를 줄이려는 두 최적화가 만나면 타이머 만료까지 멈춥니다</text>
<path d="M 190 245.0 L 202 245.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="26" y="140" width="164" height="210" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="26" y="140" width="164" height="34" rx="8" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.2"/>
<text x="108.0" y="162" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">1단계</text>
<text x="108.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">키 1회 입력</text>
<text x="108.0" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">1바이트 데이터</text>

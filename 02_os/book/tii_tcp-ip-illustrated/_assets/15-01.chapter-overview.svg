<text x="108.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">터미널 문자 'd'</text>
<path d="M 370 245.0 L 382 245.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

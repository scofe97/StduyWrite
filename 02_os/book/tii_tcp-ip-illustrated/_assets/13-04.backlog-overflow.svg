<title id="dt">수락 큐가 차면 FreeBSD 는 SYN 을 무시한다</title><desc id="dd">원서 Listing 13-10 의 순서다. backlog 를 1 로 두고 accept 를 오래 미루는 FreeBSD 서버에 리눅스 클라이언트가 연달아 접속한다. 포트 2461 과 2462 의 handshake 는 서버 TCP 가 곧바로 끝내 두 클라이언트의 connect 가 성공하지만, 서버 애플리케이션은 아직 어느 연결도 받지 않았다. 포트 2463 의 SYN 에는 응답이 없고, 클라이언트는 같은 SYN 을 3·6·12·24·48초 간격으로 다시 보낸다.</desc>

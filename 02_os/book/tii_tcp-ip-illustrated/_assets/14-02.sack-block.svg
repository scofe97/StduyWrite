<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">SACK 은 구멍 너머에 무엇이 있는지 알려 구멍의 크기를 정합니다</text>

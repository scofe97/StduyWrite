<title id="dt">누적 ACK 23801 과 SACK 블록 하나</title><desc id="dd">수신자는 23800 까지 연속으로 받았고 23801–25200 의 1400바이트가 비었으며 그 뒤 25201–26600 을 따로 갖고 있다. 누적 ACK 는 23801 에서 멈추고, SACK 블록 [25201, 26601) 이 섬을 알린다. 오른쪽 경계 26601 은 마지막 받은 바이트가 아니라 그 다음 번호다. 송신자는 두 정보 사이의 구멍만 다시 보내면 된다.</desc>

<title id="dt">SYN 도착부터 accept 까지 — 이 편의 지도</title><desc id="dd">위 줄은 SYN 하나가 서버에서 지나는 단계다. 대기 소켓이 목적지 주소와 포트를 대조하고(§1), 커널 TCP 가 SYN_RCVD 큐와 수락 큐에 연결을 쌓은 뒤(§2), 애플리케이션이 accept() 로 받아 연결별 소켓으로 데이터를 주고받는다. 아래 줄은 주소가 맞지 않을 때의 RST 거절(§1)과, 수립 전 상태를 노리는 SYN flood·열린 연결을 노리는 위조 입력(§3)이 어느 단계에 걸리는지 보인다.</desc>
<rect width="920" height="456" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 13-04</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SYN 도착부터 accept 까지 — 이 편의 지도</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">accept() 앞쪽은 전부 커널 TCP 가 처리합니다</text>
<path d="M 32 128 V 120 H 536 V 128" fill="none" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="284.0" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">커널 TCP · accept 전</text>
<path d="M 560 128 V 120 H 888 V 128" fill="none" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="724.0" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">애플리케이션</text>
<path d="M 186 184.0 L 204 184.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

<title id="dt">표준 TCP 와 HighSpeed TCP 응답 곡선 비교 (계산 예시)</title><desc id="dd">손실률 p가 낮아질수록 표준 TCP(w=1.22/√p)는 창 크기가 완만하게 증가하지만, HSTCP는 p ≤ 10⁻³ 구간에서 기울기 S=-0.835의 가파른 곡선으로 창을 대폭 키워 고속 대역폭을 채운다.</desc>
<rect width="920" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 16-04 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">표준 TCP 와 HighSpeed TCP 응답 곡선 비교 (계산 예시)</text>

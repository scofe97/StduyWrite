<title id="dt">옛 연결의 세그먼트가 새 연결에 떨어질 때</title><desc id="dd">같은 두 주소·두 포트로 연결을 닫았다가 다시 열었다. 옛 연결에서 보낸 세그먼트(seq 1001–1100) 하나가 망에서 늦게 도착한다. 위 판처럼 새 연결의 ISN 이 옛 연결과 같으면 그 번호가 새 창 안에 들어 데이터로 받아들여진다. 아래 판처럼 ISN 을 시간에 따라 띄워 두면 창 밖이라 버려진다. 수치는 설명용 예시다.</desc>
<rect width="920" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 13-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">옛 연결의 세그먼트가 새 연결에 떨어질 때</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">4-tuple 이 같아도 번호 영역이 겹치지 않으면 옛 세그먼트는 새 연결에 섞이지 않습니다</text>
<text x="20" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">ISN 이 같다면</text>
<text x="28" y="154" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">옛 연결</text>

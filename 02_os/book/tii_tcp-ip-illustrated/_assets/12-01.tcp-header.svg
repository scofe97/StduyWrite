<text x="828.0" y="146" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">31</text>
<text x="56" y="185" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">+0</text>
<rect x="72" y="156" width="384" height="48" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="264.0" y="177" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">Source Port</text>

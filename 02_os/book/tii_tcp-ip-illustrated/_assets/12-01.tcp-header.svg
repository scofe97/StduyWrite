<title id="dt">TCP 헤더 20 바이트 — 어느 칸이 반대 방향 이야기인가</title><desc id="dd">원서 그림 12-3 의 배치를 32비트 줄 다섯과 옵션으로 옮겼다. 칸 너비가 비트 수에 비례하고 예약 4비트·플래그 8개는 원서와 RFC 9293 의 셈법이다. 파란 칸(ACK 번호·Window Size·ECE·ACK 비트)은 이 세그먼트를 보낸 쪽이 아니라 반대 방향으로 흐르는 데이터에 관한 값이고, 강조한 포트 두 칸은 IP 헤더의 주소 둘과 합쳐 연결 하나를 가리킨다.</desc>
<rect width="920" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 12-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TCP 헤더 20 바이트 — 어느 칸이 반대 방향 이야기인가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">한 세그먼트가 자기 데이터를 나르면서 반대 방향의 확인과 창 광고를 함께 싣습니다</text>

<title id="dt">복구와 유휴 구간에서 창을 다듬는 흐름</title><desc id="dd">손실 감지 후 SACK으로 무엇을 보낼지 정하고, pipe로 얼마나 보낼지 제어한다. 작은 창은 제한 전송으로 돕고 유휴 연결은 감쇠하며 헛 RTO는 이전 창으로 되돌린다.</desc>
<rect width="920" height="390" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 16-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">복구와 유휴 구간에서 창을 다듬는 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">복구 중 송신량 제어부터 유휴 감쇠와 헛 RTO 복원까지 이어집니다</text>
<rect x="26" y="118" width="268" height="76" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="160.0" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">1. 손실 감지</text>
<text x="160.0" y="163" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">중복 ACK 3개 또는 SACK</text>
<text x="160.0" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#F5F5F3">복구 절차 진입</text>
<path d="M 298 156.0 L 316 156.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="322" y="118" width="268" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="456.0" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">2. 대상 선정</text>
<text x="456.0" y="163" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">SACK 점수판 구멍 탐색</text>
<text x="456.0" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#F5F5F3">선택적 재전송</text>
<path d="M 594 156.0 L 612 156.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="618" y="118" width="268" height="76" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="752.0" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">3. 송신량 제어</text>
<text x="752.0" y="163" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">pipe 추정치 계산</text>
<text x="752.0" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#F5F5F3">cwnd − pipe 송신</text>
<path d="M 752.0 198 L 752.0 238" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<rect x="618" y="246" width="268" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="752.0" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">4. 작은 창 보조</text>
<text x="752.0" y="291" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">제한 전송 메커니즘</text>
<text x="752.0" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#F5F5F3">dupACK 1·2에 새 데이터</text>
<path d="M 614 284.0 L 596 284.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="322" y="246" width="268" height="76" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="456.0" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">5. 유휴 창 감쇠</text>
<text x="456.0" y="291" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CWV 비사용 기간 검증</text>
<text x="456.0" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#F5F5F3">RTO마다 cwnd 반감</text>
<path d="M 318 284.0 L 300 284.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="26" y="246" width="268" height="76" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="160.0" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">6. 헛 RTO 복원</text>
<text x="160.0" y="291" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Eifel 응답 알고리즘</text>
<text x="160.0" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#F5F5F3">축소된 ssthresh 복원</text>
</svg>
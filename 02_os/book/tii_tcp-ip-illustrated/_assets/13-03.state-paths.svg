<title id="dt">TCP의 대표 상태 경로</title><desc id="dd">원서 Figure 13-8·13-9를 경로별로 다시 묶었다. 능동 열기와 수동 열기는 ESTABLISHED에서 만나고, 능동 닫기는 TIME_WAIT를 거친다. 수동 닫기는 LAST_ACK에서 끝나며 동시 닫기는 양쪽 모두 CLOSING과 TIME_WAIT를 거친다.</desc>
<rect width="1000" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 13-03 §1–4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TCP의 대표 상태 경로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 끝점은 상태를 따로 갖고, 먼저 닫은 쪽의 경로가 길어집니다</text>

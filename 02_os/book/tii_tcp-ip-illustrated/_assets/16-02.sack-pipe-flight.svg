<title id="dt">SACK 점수판과 pipe 변수의 송신 제어 흐름</title><desc id="dd">SACK 블록으로 점수판을 갱신해 비행 중인 바이트를 pipe 변수로 추정한다. 점수판은 무엇을 보낼지(손실 구멍) 정하고, cwnd 와 pipe 의 여유분은 얼마나 보낼지 결정한다.</desc>
<rect width="920" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 16-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SACK 점수판과 pipe 변수의 송신 제어 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">SACK 은 전송 대상을 고르고 pipe 와 cwnd 는 네트워크 주입량을 제어합니다</text>
<rect x="24" y="126" width="184" height="230" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="24" y="126" width="184" height="36" rx="6" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.0"/>
<text x="116.0" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">1. 수신 피드백</text>
<rect x="59.5" y="184" width="113.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="116.0" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">누적 ACK 번호</text>
<rect x="54.0" y="220" width="124.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="116.0" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SACK 옵션 블록</text>
<text x="116.0" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#F5F5F3">도착한 범위 알림</text>
<text x="116.0" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">구멍과 수신 분리</text>
<text x="116.0" y="330" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">RFC 2018 규격</text>
<rect x="238" y="126" width="214" height="230" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="238" y="126" width="214" height="36" rx="6" fill="#E3B34122" stroke="#E3B341" stroke-width="1.0"/>
<text x="345.0" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">2. SACK 점수판</text>
<text x="345.0" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">상태 분류 (Scoreboard)</text>
<rect x="250" y="204" width="190" height="30" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="345.0" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">SACKed: 수신 확인 바이트</text>
<rect x="250" y="242" width="190" height="30" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="345.0" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">Lost: DupThresh SACK 손실</text>
<rect x="250" y="280" width="190" height="30" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="345.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">In Flight: 비행 중 추정 바이트</text>
<text x="345.0" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#F5F5F3">재전송 대상 선정</text>
<rect x="482" y="126" width="204" height="230" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="482" y="126" width="204" height="36" rx="6" fill="#F08A5922" stroke="#F08A59" stroke-width="1.0"/>
<text x="584.0" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">3. pipe 변수 계산</text>
<text x="584.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">망 내 비행 데이터 추정</text>
<rect x="494" y="208" width="180" height="52" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="584.0" y="228" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">pipe =</text>
<text x="584.0" y="246" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F08A59">Flight−SACKed−Lost+Rxt</text>
<text x="584.0" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#F5F5F3">손실 제외 및 재전송 가산</text>
<text x="584.0" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실제 망 부하만 계량</text>
<text x="584.0" y="334" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">RFC 6675 알고리즘</text>
<rect x="716" y="126" width="180" height="230" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="716" y="126" width="180" height="36" rx="6" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="806.0" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">4. 송신 결정</text>
<text x="806.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">송신 허용 여부 판정</text>
<rect x="737.62" y="212" width="136.76" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="806.0" y="226" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">cwnd − pipe ≥ SMSS</text>
<text x="806.0" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">여유분만큼 전송</text>
<text x="806.0" y="290" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">1. 손실 구멍 우선 채움</text>
<text x="806.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">2. 없으면 새 데이터 송신</text>
<text x="806.0" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">파이프 버스트 억제</text>
<path d="M 210 241 L 234 241" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 454 241 L 478 241" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

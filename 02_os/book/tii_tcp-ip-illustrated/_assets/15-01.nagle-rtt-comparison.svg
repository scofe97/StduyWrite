<title id="dt">RTT 190ms 환경에서 Nagle 알고리즘 해제와 적용 비교</title><desc id="dd">동일한 190ms RTT 네트워크에서 date 명령을 입력했을 때, Nagle 을 끄면 0.58초 동안 19개 패킷이 즉시 오간다. Nagle 을 켜면 ACK 가 올 때까지 작은 데이터를 묶어 전송하므로 패킷은 11개로 줄지만, 190ms 마다 멈춰 총 0.80초가 걸린다.</desc>

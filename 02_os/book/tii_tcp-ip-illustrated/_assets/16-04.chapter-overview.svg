<rect x="420" y="368" width="236" height="36" rx="4" fill="#3FB98C0C" stroke="#3FB98C" stroke-width="0.7"/>
<text x="430" y="391" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">2 RTT 마다 속도 갱신</text>
<rect x="668" y="368" width="236" height="36" rx="4" fill="#E3B3410C" stroke="#E3B341" stroke-width="0.7"/>
<text x="678" y="391" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">지연 비례 점진 감속</text>

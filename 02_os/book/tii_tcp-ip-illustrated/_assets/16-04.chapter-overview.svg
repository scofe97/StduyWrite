<title id="dt">혼잡 제어 알고리즘 8종 비교 — 신호와 증감 규칙</title><desc id="dd">표준 Reno부터 고속 망 대안과 지연 기반 알고리즘까지 혼잡 신호의 종류, 창 증가 방식, 감소 규칙을 대조 행렬로 정리한다. CUBIC은 현행 Linux 기본값으로 시간 삼차 함수를 쓴다.</desc>
<rect width="940" height="548" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 16-04</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">혼잡 제어 알고리즘 8종 비교 — 신호와 증감 규칙</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">신호가 손실에서 지연·대역폭으로 넓어지고 창 변화가 상수에 묶이지 않습니다</text>
<rect x="12" y="104" width="148" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="86.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">알고리즘</text>
<text x="86.0" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">계열 분류</text>
<rect x="172" y="104" width="236" height="52" rx="6" fill="#2A3140" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="290.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">혼잡 신호</text>
<text x="290.0" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">감지 기준</text>
<rect x="420" y="104" width="236" height="52" rx="6" fill="#2A3140" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="538.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">증가 규칙</text>
<text x="538.0" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">혼잡 회피 중 창 확대</text>
<rect x="668" y="104" width="236" height="52" rx="6" fill="#2A3140" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="786.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">감소 규칙</text>
<text x="786.0" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">혼잡 감지 시 창 축소</text>
<rect x="12" y="168" width="148" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="191" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">표준 (Reno)</text>
<rect x="172" y="168" width="236" height="36" rx="4" fill="#6A95D80C" stroke="#6A95D8" stroke-width="0.7"/>

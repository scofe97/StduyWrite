<text x="430" y="191" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">AIMD (+1 SMSS / RTT)</text>
<rect x="668" y="168" width="236" height="36" rx="4" fill="#E3B3410C" stroke="#E3B341" stroke-width="0.7"/>
<text x="678" y="191" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">반감 (cwnd × 0.5)</text>
<rect x="12" y="208" width="148" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="231" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">HSTCP</text>
<rect x="172" y="208" width="236" height="36" rx="4" fill="#6A95D80C" stroke="#6A95D8" stroke-width="0.7"/>
<text x="182" y="231" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">손실 (큰 창 p ≤ 10⁻³)</text>
<rect x="420" y="208" width="236" height="36" rx="4" fill="#3FB98C0C" stroke="#3FB98C" stroke-width="0.7"/>
<text x="430" y="231" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">동적 가산 (+a(w) / cwnd)</text>
<rect x="668" y="208" width="236" height="36" rx="4" fill="#E3B3410C" stroke="#E3B341" stroke-width="0.7"/>
<text x="678" y="231" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">동적 감쇠 (cwnd × (1 - b(w)))</text>
<rect x="12" y="248" width="148" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="271" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">BIC</text>
<rect x="172" y="248" width="236" height="36" rx="4" fill="#6A95D80C" stroke="#6A95D8" stroke-width="0.7"/>
<text x="182" y="271" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">손실 (Wmax 기억)</text>
<rect x="420" y="248" width="236" height="36" rx="4" fill="#3FB98C0C" stroke="#3FB98C" stroke-width="0.7"/>
<text x="430" y="271" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">이진 탐색 + 가산 상한 Smax</text>
<rect x="668" y="248" width="236" height="36" rx="4" fill="#E3B3410C" stroke="#E3B341" stroke-width="0.7"/>
<text x="678" y="271" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">승수 감소 (cwnd × 0.8)</text>
<rect x="12" y="288" width="148" height="36" rx="4" fill="#F08A5915" stroke="#F08A59" stroke-width="1.2"/>
<text x="24" y="311" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">CUBIC</text>
<rect x="172" y="288" width="236" height="36" rx="4" fill="#F08A5915" stroke="#F08A59" stroke-width="1.2"/>
<text x="182" y="311" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">손실 (손실 사건 · Wmax 기억)</text>
<rect x="420" y="288" width="236" height="36" rx="4" fill="#F08A5915" stroke="#F08A59" stroke-width="1.2"/>
<text x="430" y="311" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">시간 삼차 함수 C(t - K)³</text>
<rect x="668" y="288" width="236" height="36" rx="4" fill="#F08A5915" stroke="#F08A59" stroke-width="1.2"/>
<text x="678" y="311" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">승수 감소 (cwnd × 0.7)</text>
<rect x="12" y="328" width="148" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="351" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Vegas</text>
<rect x="172" y="328" width="236" height="36" rx="4" fill="#6A95D80C" stroke="#6A95D8" stroke-width="0.7"/>
<text x="182" y="351" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">지연 (Diff = Exp - Act)</text>

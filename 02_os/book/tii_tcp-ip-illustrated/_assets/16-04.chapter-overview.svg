<text x="24" y="391" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">FAST</text>
<rect x="172" y="368" width="236" height="36" rx="4" fill="#6A95D80C" stroke="#6A95D8" stroke-width="0.7"/>

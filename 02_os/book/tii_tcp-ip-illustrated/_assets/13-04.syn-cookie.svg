<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 492" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">SYN cookie는 마지막 ACK까지 상태 할당을 미룬다</title><desc id="dd">서버는 SYN에 응답하면서 연결별 상태 대신 복원 가능한 ISN을 보낸다. 마지막 ACK가 돌아오면 cookie를 검증하고 연결 상태를 만든다.</desc>
<rect width="920" height="492" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 13-04 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SYN cookie는 마지막 ACK까지 상태 할당을 미룬다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">수립 전 상태를 순서 번호에 담아 SYN flood 압박을 줄입니다</text>
<path d="M 460.0 168 L 460.0 188" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="156" y="104" width="608" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="180" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">SYN 수신</text>
<text x="180" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">아직 연결별 상태 없음</text>
<path d="M 460.0 260 L 460.0 280" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="156" y="196" width="608" height="60" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="180" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">cookie ISN으로 SYN + ACK</text>
<text x="180" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">시간 · MSS · 4-tuple 해시 인코딩</text>
<path d="M 460.0 352 L 460.0 372" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="156" y="288" width="608" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="180" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">마지막 ACK 수신</text>
<text x="180" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서버 ISN + 1을 돌려받음</text>
<rect x="156" y="380" width="608" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="180" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">cookie 검증 · 상태 할당</text>
<text x="180" y="428" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">유효한 요청을 ESTABLISHED로 전환</text>
</svg>
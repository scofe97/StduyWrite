<title id="dt">마지막 ACK 가 사라지면 FIN 이 다시 온다</title><desc id="dd">능동 닫기 쪽이 보낸 마지막 ACK 가 길에서 사라졌다. 수동 닫기 쪽은 LAST_ACK 에서 확인을 못 받아 자기 FIN 을 다시 보낸다. 능동 닫기 쪽은 아직 TIME_WAIT 에 연결 기록을 갖고 있어 그 FIN 에 ACK 를 다시 보낼 수 있고, 2MSL 이 지난 뒤에야 CLOSED 가 된다. TCP 는 ACK 자체를 재전송하지 않으므로, ACK 를 다시 보내게 만드는 것은 상대의 FIN 재전송이다.</desc>
<rect width="920" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 13-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">마지막 ACK 가 사라지면 FIN 이 다시 온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">ACK 는 재전송되지 않습니다 — 상대의 FIN 재전송에 다시 답할 뿐입니다</text>
<rect x="24.0" y="100" width="300" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="174.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">능동 닫기 쪽</text>
<text x="174.0" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">먼저 close()</text>
<rect x="572.0" y="100" width="300" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="722.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">수동 닫기 쪽</text>
<text x="722.0" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">FIN 을 받은 쪽</text>

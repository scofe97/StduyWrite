<title id="dt">연결의 이름은 4-tuple, 생애는 세 국면</title><desc id="dd">원서 13.7 의 netstat 출력에서 서버 10.0.0.1 의 22번 포트에 같은 호스트 10.0.0.3 의 클라이언트 둘이 붙어 있다. 네 값 가운데 원격 포트만 16137 과 16140 으로 달라 두 연결이 갈린다. 각 연결은 수립 · 데이터 전송 · 종료 세 국면을 저마다 지나며, 시간 축은 순서만 나타낸다.</desc>

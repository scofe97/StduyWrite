<title id="dt">손실 발생 후 Tahoe 와 Reno 의 cwnd 변화 추세 (계산 예시)</title><desc id="dd">동일하게 RTT 8에서 cwnd=20 시점에 3개 중복 ACK 손실이 발생했을 때의 비교다. Tahoe 는 cwnd=1 로 떨어져 느린 시작을 다시 밟지만 Reno 는 빠른 회복을 거쳐 절반인 cwnd=10 에서 곧바로 혼잡 회피를 재개한다.</desc>

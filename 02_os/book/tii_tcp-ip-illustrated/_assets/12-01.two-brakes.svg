<title id="dt">창 W 를 조이는 두 신호</title><desc id="dd">데이터는 송신자에서 라우터를 거쳐 수신자로 간다. 수신자가 못 따라오면 수신자가 창 광고로 직접 알려 주고(명시 신호), 가운데 라우터가 넘칠 때 라우터가 따로 알리지 않으면 송신자가 손실 같은 다른 증거로 짐작한다(암묵 신호). 두 신호 모두 송신자의 창 W 를 줄인다.</desc>
<rect width="920" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 12-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">창 W 를 조이는 두 신호</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">지키는 대상이 다르고 신호의 출처도 다르지만, 손잡이는 W 하나입니다</text>
<rect x="332" y="188" width="256" height="152" rx="8" fill="rgba(245,245,245,0.02)" stroke="#E3B341" stroke-width="0.9" stroke-dasharray="5 4"/>
<text x="344" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">혼잡 제어가 지킴</text>
<rect x="656" y="188" width="248" height="152" rx="8" fill="rgba(245,245,245,0.02)" stroke="#6A95D8" stroke-width="0.9" stroke-dasharray="5 4"/>
<text x="668" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">흐름 제어가 지킴</text>
<path d="M 240 272.0 L 352 272.0" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="298.0" y="262.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">데이터</text>
<path d="M 564 272.0 L 676 272.0" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="622.0" y="262.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">데이터</text>
<path d="M 780.0 188 V 148 H 180.0 V 224" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)" stroke-dasharray="5 4"/>
<text x="500.0" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">창 광고 · 프로토콜 필드 = 명시 신호</text>
<path d="M 460.0 340 V 388 H 100.0 V 320" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)" stroke-dasharray="5 4"/>

<title id="dt">재전송 타이머는 평균보다 크되 너무 크지 않게</title><desc id="dd">맨 윗줄은 송신자가 기다릴 시간 네 조각이 이어져 한 번의 왕복이 되는 모습이고, 그 끝을 평균 RTT 로 삼는다. 둘째·셋째 줄은 이번 왕복이 평균보다 길게 끝난 같은 장면에서 타이머 위치만 다르다. 타이머가 평균이면 ACK 보다 먼저 만료돼 필요 없는 재전송이 나가고, 평균보다 크면 ACK 가 먼저 와 재전송이 없다. 넷째 줄은 패킷이 사라진 장면으로, 타이머가 너무 크면 다시 보내기 전까지 망이 논다. 길이는 측정값이 아니라 순서만 보이는 모식이다.</desc>
<rect width="920" height="504" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 12-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">재전송 타이머는 평균보다 크되 너무 크지 않게</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">타이머가 평균이면 헛되이 다시 보내고, 너무 크면 손실 뒤 망이 오래 놉니다</text>
<text x="216" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">보냄</text>
<text x="536" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">평균 RTT</text>
<text x="872" y="116" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">시간</text>
<rect x="12" y="132" width="868" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">평균적인 왕복</text>
<text x="24" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">기다릴 시간 네 조각</text>
<rect x="12" y="204" width="868" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">타이머 = 평균</text>
<text x="24" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이번 왕복이 더 김</text>
<rect x="12" y="276" width="868" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">타이머 &gt; 평균</text>
<text x="24" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">같은 늦은 왕복</text>
<rect x="12" y="348" width="868" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">타이머가 너무 큼</text>
<text x="24" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">패킷이 사라짐</text>
<line x1="536" y1="124" x2="536" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 4"/>
<rect x="216" y="142" width="80" height="24" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="256.0" y="159.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">송신</text>
<rect x="296" y="142" width="80" height="24" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="336.0" y="159.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">수신 처리</text>
<rect x="376" y="142" width="80" height="24" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="416.0" y="159.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">ACK 귀환</text>
<rect x="456" y="142" width="80" height="24" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="496.0" y="159.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">ACK 처리</text>
<text x="548" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">넷의 합 · 어느 것도 확실히 모름</text>
<rect x="216" y="214" width="400" height="24" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="416.0" y="231.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">이번 왕복 · 끝에서 ACK 도착</text>
<line x1="536" y1="208" x2="536" y2="264" stroke="#E3B341" stroke-width="2.0"/>
<rect x="536" y="242" width="160" height="20" rx="4" fill="#E3B34114" stroke="#E3B341" stroke-width="1.0"/>
<text x="616.0" y="257.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">필요 없는 재전송</text>
<rect x="216" y="286" width="400" height="24" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="416.0" y="303.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">이번 왕복 · 끝에서 ACK 도착</text>
<line x1="648" y1="280" x2="648" y2="336" stroke="#F08A59" stroke-width="2.4"/>
<text x="660" y="303" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">ACK 먼저 · 재전송 없음</text>
<rect x="216" y="358" width="80" height="24" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="256.0" y="375.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">송신</text>
<text x="308" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#F0616D">✕</text>
<rect x="336" y="358" width="520" height="24" rx="4" fill="none" stroke="#F0616D" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="596.0" y="375.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">재전송 전까지 노는 구간</text>
<line x1="856" y1="352" x2="856" y2="408" stroke="#F0616D" stroke-width="2.0"/>
<text x="336" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">타이머가 클수록 길어짐</text>
<line x1="12" y1="448" x2="872" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="470" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="460" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평균보다 큰 타이머</text>
<rect x="274" y="460" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="296" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">왕복 구간</text>
<rect x="383" y="460" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="405" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평균 타이머 · 필요 없는 재전송</text>
<rect x="661" y="460" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="683" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">너무 큰 타이머 · 노는 구간</text>
</svg>
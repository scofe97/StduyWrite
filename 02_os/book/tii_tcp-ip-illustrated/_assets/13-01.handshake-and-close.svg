<title id="dt">연결 하나의 일곱 세그먼트 — 원서 캡처의 실제 값</title><desc id="dd">원서 그림 13-1 의 수립·종료 흐름을 그림 13-5 캡처 값으로 채웠다. 위 세 세그먼트가 3-way handshake 로 양쪽 ISN 을 교환하고, 4.4초 뒤 아래 네 세그먼트가 한 방향씩 닫는다. ACK 번호는 언제나 상대가 다음에 보낼 번호이고 SYN·FIN 은 번호 하나씩을 차지한다.</desc>

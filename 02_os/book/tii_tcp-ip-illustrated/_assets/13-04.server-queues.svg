<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 568" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">SYN부터 accept까지, 서버의 두 대기 단계</title><desc id="dd">SYN을 받은 뒤 SYN_RCVD 상태를 거쳐 마지막 ACK로 연결을 성립시킨다. 완료된 연결은 애플리케이션이 accept를 호출할 때까지 다른 큐에서 기다린다.</desc>
<rect width="920" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 13-04 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SYN부터 accept까지, 서버의 두 대기 단계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">connect 성공과 accept 호출은 서로 다른 시점입니다</text>
<path d="M 460.0 172 L 460.0 188" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="156" y="108" width="608" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="180" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">SYN 수신</text>
<text x="180" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">새 연결 요청</text>
<path d="M 460.0 260 L 460.0 276" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="156" y="196" width="608" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="180" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">SYN_RCVD 큐</text>
<text x="180" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">수립 전 · 마지막 ACK 대기</text>
<path d="M 460.0 348 L 460.0 364" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="156" y="284" width="608" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="180" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">세 번째 ACK</text>
<text x="180" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">3-way handshake 완료</text>
<path d="M 460.0 436 L 460.0 452" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="156" y="372" width="608" height="60" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="180" y="398" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">accept 대기 큐</text>
<text x="180" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">완료 후 · 애플리케이션 수락 대기</text>
<rect x="156" y="460" width="608" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="180" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">accept()</text>
<text x="180" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">애플리케이션에 연결 전달</text>
</svg>
<title id="dt">half-open — 한쪽만 연결을 기억할 때</title><desc id="dd">원서 Listing 13-8 의 순서다. 클라이언트가 foo 5바이트를 보내고 ACK 를 받은 뒤 서버는 케이블을 뽑힌 채 재부팅해 연결 기록을 잃는다. 클라이언트는 그 사이 아무것도 보내지 않아 여전히 ESTABLISHED 로 안다. 재부팅 뒤의 ARP 는 TCP 회복이 아니며, 클라이언트가 같은 연결로 bar 를 보내자 그 4-tuple 을 모르는 서버가 ACK 비트 없는 RST 로 답한다.</desc>
<rect width="920" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 13-03 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">half-open — 한쪽만 연결을 기억할 때</text>

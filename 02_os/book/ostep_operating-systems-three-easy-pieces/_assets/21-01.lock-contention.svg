<title id="dt">B 의 lock 호출은 A 가 unlock 할 때까지 돌아오지 않는다</title><desc id="dd">스레드 A 는 t1 에 락을 얻고 t3 에 unlock 한다. 스레드 B 는 t2 에 lock 을 불러 t3 까지 호출 안에서 기다리고, t3 에 락을 얻어 t5 까지 임계 구역을 지난다. 두 스레드가 락을 쥔 구간은 겹치지 않는다.</desc>
<rect width="880" height="388" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 21-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">B 의 lock 호출은 A 가 unlock 할 때까지 돌아오지 않는다</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">시점 — 순서만 뜻함</text>
<text x="200" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">t1</text>
<text x="332" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">t2</text>
<text x="464" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">t3</text>
<text x="596" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">t4</text>
<text x="728" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">t5</text>
<line x1="24" y1="124" x2="856" y2="124" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">스레드 A</text>
<line x1="24" y1="192" x2="856" y2="192" stroke="rgba(191,192,192,0.22)" stroke-width="0.4"/>
<text x="24" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">스레드 B</text>
<line x1="24" y1="256" x2="856" y2="256" stroke="rgba(191,192,192,0.22)" stroke-width="0.4"/>
<rect x="200" y="148" width="264" height="36" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="332.0" y="171" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">락 얻음 · x = x + 1</text>
<rect x="464" y="148" width="264" height="36" rx="6" fill="#8B98A914" stroke="#8B98A9" stroke-width="1.2"/>
<text x="596.0" y="171" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">락 없이 실행</text>
<rect x="332" y="212" width="132" height="36" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>

<rect x="464" y="212" width="264" height="36" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="596.0" y="235" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">락 얻음 · 임계 구역</text>
<line x1="464" y1="132" x2="464" y2="268" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="294.0" y="282" width="340.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="464" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">t3 A 의 unlock → B 의 lock 반환</text>
<line x1="12" y1="332" x2="832" y2="332" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="354" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

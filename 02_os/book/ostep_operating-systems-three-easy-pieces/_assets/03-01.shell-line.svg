<title id="dt">셸 명령 한 줄은 복제, 파일 번호 조정, 덮어쓰기, 대기로 끝난다</title><desc id="dd">셸(부모)이 fork 를 부르면 커널이 자식을 만들어 부모에게는 자식의 PID 를, 자식에게는 0 을 돌려준다. 자식은 close 와 open 으로 표준 출력을 newfile.txt 로 바꾸고 execvp 로 wc 가 된다. 한편 셸은 wait 를 불러 자식이 끝나기를 기다리고, 자식이 끝나면 wait 가 돌아와 셸은 프롬프트를 다시 보인다.</desc>
<rect width="920" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 03-01 SHELL LINE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">셸 명령 한 줄은 복제, 파일 번호 조정, 덮어쓰기, 대기로 끝난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">명령: wc p3.c &gt; newfile.txt · 부모와 자식 중 누가 먼저 도는지는 스케줄러가 정합니다</text>

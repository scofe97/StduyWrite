<title id="dt">같은 시스템 콜이라도 처리하는 곳이 다르다</title><desc id="dd">일반 컨테이너에서는 앱의 시스템 콜을 호스트 커널이 받아 그대로 처리한다. gVisor 의 systrap 플랫폼에서는 호스트 커널이 시스템 콜을 실행하지 않고 seccomp 필터가 SIGSYS 를 보내 Sentry 가 처리하게 하고, KVM 플랫폼에서는 Sentry 가 게스트 운영체제 자리에서 받는다. 두 경우 모두 Sentry 가 필요한 일만 호스트 커널에 시스템 콜로 요청한다.</desc>

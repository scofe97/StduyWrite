<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">accept-new 는 첫 키를 확인 없이 등록하고 등록된 뒤 바뀐 키는 막는다</title><desc id="dd">상태는 셋이다. 미등록은 known_hosts 에 호스트 키가 없는 상태이고 등록됨은 키가 저장된 상태이며 차단은 저장된 키와 서버의 키가 달라 연결이 막힌 상태다. 미등록에서 BatchMode=yes 로 접속하면 확인할 수 없어 Host key verification failed 로 끝나 미등록에 머문다. accept-new 로 접속하면 Permanently added 가 나오고 등록됨이 된다. 등록된 호스트의 키가 바뀌면 REMOTE HOST IDENTIFICATION HAS CHANGED 경고와 함께 차단된다.</desc>
<rect width="880" height="464" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 45-02 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">accept-new 는 첫 키를 확인 없이 등록하고 등록된 뒤 바뀐 키는 막는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">처음 한 번의 확인이 약한 고리이고, 저장된 뒤의 변경은 크게 경고한다</text>
<rect x="96" y="184" width="200" height="80" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="196.0" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">미등록</text>
<text x="196.0" y="242" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">known_hosts 에 키 없음</text>
<rect x="584" y="184" width="200" height="80" rx="8" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.5"/>
<text x="684.0" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">등록됨</text>
<text x="684.0" y="242" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">known_hosts 에 키 저장</text>
<rect x="584" y="336" width="200" height="80" rx="8" fill="#F0616D14" stroke="#F0616D" stroke-width="1.5"/>
<text x="684.0" y="370" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">차단</text>
<text x="684.0" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">저장된 키와 서버 키가 다름</text>
<circle cx="48" cy="224.0" r="6" fill="#F5F5F3"/>
<path d="M 56 224.0 L 92 224.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 298 224.0 L 580 224.0" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="440.0" y="214.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">accept-new / Permanently added</text>
<path d="M 160.0 184 C 160.0 132, 232.0 132, 232.0 182" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="196.0" y="122" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">BatchMode=yes / Host key verification failed.</text>
<path d="M 684.0 266 L 684.0 332" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)"/>
<text x="670.0" y="300" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">서버의 호스트 키가 바뀜 /</text>
<text x="670.0" y="320" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">REMOTE HOST IDENTIFICATION HAS CHANGED</text>
</svg>
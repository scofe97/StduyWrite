<title id="dt">암호는 키에서 깨지고 OS 는 키를 숨길 수 없는 선 안에서 암호를 쓴다</title><desc id="dd">44-02 의 키워드 개념도. 왼쪽 세 길은 키가 새거나 후보가 줄거나 시드가 예측되어 키가 깨지는 경로이고 네 번째는 무작위로 키를 만드는 대응이며, 모두 가운데 키로 모인다. 키 아래는 OS 가 키를 쥔 기계에서는 OS 로부터 데이터를 숨길 수 없다는 못 넘는 선이다. 그 선을 지나서도 암호가 쓸모 있는 자리는 비밀번호 해시, 네트워크 전송, 저장 데이터 암호화 셋이다. 키에서는 개인 키로 서명한 capability 가 오른쪽으로 나간다. 바닥은 키를 적은 곳에 짧은 시간만 적은 상대에게 둔다는 원칙이다.</desc>
<rect width="1000" height="780" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 44-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">암호는 키에서 깨지고 OS 는 키를 숨길 수 없는 선 안에서 암호를 쓴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표에 붙은 글자는 두 요소의 관계, 칩은 그 요소를 다루는 절, 왼쪽에서 가운데를 거쳐 오른쪽으로 읽습니다.</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">키가 새거나 약해지는 길</text>
<line x1="24" y1="120" x2="232" y2="120" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="352" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">키의 비밀</text>
<line x1="352" y1="120" x2="616" y2="120" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="768" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">OS 가 암호를 쓰는 자리</text>
<line x1="768" y1="120" x2="976" y2="120" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="352" y="148" width="264" height="316" rx="8" fill="#F08A591e" stroke="#F08A59" stroke-width="1.6"/>

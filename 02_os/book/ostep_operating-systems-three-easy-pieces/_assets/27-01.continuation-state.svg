<title id="dt">job_t 는 읽는 중 상태에서 off 를 늘리며 파일 끝까지 돈다</title><desc id="dd">FILE 요청이 들어오면 job_t 에 소켓 sd 와 읽은 위치 off=0 을 적고 읽는 중 상태가 된다. aio_read 가 끝나 읽은 바이트 수 n 이 0 보다 크면 소켓에 쓰고 off 를 n 만큼 늘려 다시 읽는 일을 25회 반복한다. n 이 0 이면 닫힘 상태가 되어 소켓과 파일을 닫는다. 아래 줄은 400,001 바이트 파일에서 off 가 바뀐 값이다.</desc>
<rect width="880" height="444" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 27-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">job_t 는 읽는 중 상태에서 off 를 늘리며 파일 끝까지 돈다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">읽다 만 자리와 응답할 소켓이 job_t 에 남아 다음 완료 핸들러가 이어받습니다</text>
<rect x="200" y="164" width="300" height="96" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="350.0" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">읽는 중</text>
<text x="350.0" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">job_t { sd, off }</text>
<text x="350.0" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">used = 1</text>
<rect x="644" y="180" width="208" height="64" rx="8" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="748.0" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#3FB98C">닫힘</text>
<text x="748.0" y="230" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">used = 0</text>
<circle cx="44" cy="212.0" r="6" fill="#F5F5F3"/>
<path d="M 52 212.0 L 196 212.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="122" y="198.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">FILE 요청</text>
<text x="122" y="234.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">off = 0</text>
<path d="M 502 212.0 L 640 212.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="572.0" y="190.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">n = 0</text>
<text x="572.0" y="206.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">/ close</text>
<path d="M 280 162 L 280 120 L 420 120 L 420 160" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="350.0" y="98" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">n &gt; 0 / write(sd), off += n</text>
<text x="350.0" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">aio_read 재호출 · 25회</text>
<text x="20" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">off 값(400,001 바이트 파일)</text>

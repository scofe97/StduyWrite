<path d="M 414 336.0 L 436 336.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="440" y="316" width="112" height="40" rx="6" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="496.0" y="341" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">…</text>

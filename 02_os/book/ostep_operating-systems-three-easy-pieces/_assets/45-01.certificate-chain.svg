<text x="436" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">예</text>
<rect x="270" y="464" width="300" height="40" rx="20" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.6"/>
<text x="420" y="489" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">OK · 공개 키를 사이트 이름에 묶음</text>

<title id="dt">인증서는 미리 가진 CA 공개 키로 서명을 확인해 사이트 키를 믿게 한다</title><desc id="dd">받는 쪽은 사이트에서 인증서를 받아 그 안의 서명을 미리 설치된 CA 공개 키로 확인한다. 서명이 맞으면 인증서에 든 공개 키를 사이트 이름에 묶어 믿고, 서명이 맞지 않으면 인증서를 거부한다. CA 공개 키는 소프트웨어와 함께 설치되어 있어야 하므로 이 확인은 미리 가진 키에서 출발한다.</desc>
<rect width="880" height="392" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 45-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인증서는 미리 가진 CA 공개 키로 서명을 확인해 사이트 키를 믿게 한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">공개 키는 비밀이 아니므로 누구의 키인지를 서명으로 확인합니다</text>
<rect x="24" y="104" width="200" height="76" rx="6" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="124.0" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">인증서 수신</text>
<text x="124.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이름·공개 키·서명</text>
<path d="M 226 142.0 L 302 142.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="304" y="104" width="200" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="404.0" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">서명 확인</text>
<text x="404.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CA 공개 키로 검증</text>
<path d="M 506 142.0 L 582 142.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="584" y="104" width="200" height="76" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.4"/>
<text x="684.0" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">사이트 공개 키 확보</text>
<text x="684.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서명 일치 시 키가 묶임</text>
<rect x="24" y="240" width="200" height="76" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="124.0" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">미리 설치된 CA 공개 키</text>
<text x="124.0" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">소프트웨어에 포함</text>
<path d="M 226 278.0 L 374.0 278.0 L 374.0 183" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="584" y="240" width="200" height="76" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="684.0" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">인증서 거부</text>
<text x="684.0" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">신뢰하지 않음</text>
<path d="M 434.0 183 L 434.0 278.0 L 582 278.0" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="467.0" y="254.0" width="86.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="510.0" y="268.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">서명 불일치</text>
<line x1="12" y1="352" x2="832" y2="352" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="374" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="364" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="122" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">받는 쪽이 얻는 것</text>
<rect x="274" y="364" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="296" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">확인하는 연산</text>
<rect x="409" y="364" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="431" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">믿게 되는 결과</text>
<rect x="557" y="364" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="579" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">미리 있어야 하는 것</text>
<rect x="744" y="364" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="766" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">거부</text>
</svg>
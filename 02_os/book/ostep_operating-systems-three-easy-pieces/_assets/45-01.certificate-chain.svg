<title id="dt">서명이 미리 가진 CA 키로 확인되면 공개 키를 믿고 아니면 거부한다</title><desc id="dd">받는 쪽은 사이트에서 server.crt 를 받아 두 가지를 차례로 묻는다. 먼저 발급자 루트가 미리 설치돼 있는지 묻고, 없으면 error 20 으로 거부한다. 있으면 그 루트 공개 키로 tbsCertificate 의 서명이 확인되는지 묻고, 맞지 않으면 error 7 로 거부한다. 둘 다 통과하면 OK 이고 인증서 속 공개 키를 사이트 이름에 묶어 믿는다. 루트 공개 키는 소프트웨어와 함께 설치돼 있어야 하므로 이 확인은 미리 가진 키에서 출발한다.</desc>
<rect width="880" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 45-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서명이 미리 가진 CA 키로 확인되면 공개 키를 믿고 아니면 거부한다</text>
<rect x="300" y="96" width="240" height="40" rx="20" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="420" y="121" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">server.crt 수신</text>
<path d="M 420 138 L 420 190" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="442.6" y="158" width="162.79999999999998" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="524" y="172" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">issuer: CN=Demo Root</text>
<polygon points="420,194 552,236 420,278 288,236" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="420" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">발급자 루트가</text>
<text x="420" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">설치돼 있나?</text>
<polygon points="420,330 552,372 420,414 288,372" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="420" y="370" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">서명이 루트 키로</text>
<text x="420" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">확인되나?</text>
<path d="M 420 280 L 420 326" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="428" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">예</text>

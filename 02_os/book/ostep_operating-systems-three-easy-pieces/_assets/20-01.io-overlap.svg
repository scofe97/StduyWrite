<text x="184" y="335" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">스레드 2</text>
<rect x="364" y="312" width="160" height="36" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>

<title id="dt">스레드가 둘이면 한 스레드의 입출력 대기 동안 다른 스레드가 계산한다</title><desc id="dd">스레드 하나짜리 프로그램은 계산, 입출력 대기, 계산 순으로 이어져 대기 구간 동안 CPU 를 쓰지 못한다. 스레드 둘이면 스레드 1 이 입출력을 기다리는 동안 스레드 2 가 계산하고, 스레드 2 가 기다리는 동안 스레드 1 이 이어서 계산해 대기 구간이 계산으로 채워진다.</desc>
<rect width="920" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">GANTT · 20-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스레드가 둘이면 한 스레드의 입출력 대기 동안 다른 스레드가 계산한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로가 시간 순서입니다. 막대 길이는 개념 표시이고 실제 시간이 아닙니다.</text>
<text x="200" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">스레드 하나</text>
<text x="184" y="147" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">스레드 1</text>
<rect x="200" y="124" width="160" height="36" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="280.0" y="147" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">계산</text>

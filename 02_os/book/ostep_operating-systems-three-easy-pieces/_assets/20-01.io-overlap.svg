<text x="444" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">1 의 대기 구간을 2 의 계산이 채움</text>
<line x1="12" y1="420" x2="872" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

<title id="dt">wait 는 락을 놓고 잠들고 깨어난 뒤 락을 다시 잡는다</title><desc id="dd">대기 스레드가 lock 을 얻고 ready 를 확인한 뒤 cond_wait 로 락을 놓고 잠든다. 신호 스레드가 락을 얻어 ready 를 1 로 바꾸고 cond_signal 을 부른 뒤 unlock 한다. 대기 스레드는 락을 다시 얻고 wait 에서 돌아와 ready 를 다시 확인한다.</desc>
<rect width="880" height="948" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 21-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">wait 는 락을 놓고 잠들고 깨어난 뒤 락을 다시 잡는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">락 보유자가 바뀌는 순서와 ready 를 확인하는 자리를 따라간다.</text>

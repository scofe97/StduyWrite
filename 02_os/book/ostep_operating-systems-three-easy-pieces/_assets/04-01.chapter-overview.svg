<line x1="288" y1="270" x2="428" y2="270" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="24" y="398" width="140" height="84" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="34.18" y="402" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="48" y="416" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§1</text>
<text x="94.0" y="438" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">직접 실행</text>

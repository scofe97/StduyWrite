<title id="dt">직접 실행이 낳는 두 문제를 모드·trap 과 타이머·문맥 교환이 나눠 푼다</title><desc id="dd">04-01 의 키워드 개념도. 왼쪽 직접 실행은 빠르지만 그동안 운영체제 코드가 돌지 않아 통제를 잃는다. 여기서 두 문제가 갈라진다. 위 갈래는 프로그램이 위험한 일을 하는 문제이고 사용자 모드와 시스템 콜 trap 이 막는다. 아래 갈래는 CPU 를 쥔 프로그램에게서 제어를 되찾는 문제이고 타이머 인터럽트로 되찾은 뒤 문맥 교환으로 프로세스를 바꾼다. 책의 모델에서 두 갈래는 부팅 때 깔아 둔 같은 trap table 을 거쳐 커널에 들어간다. 주황 틀이 속도는 직접 실행으로 얻고 통제는 미리 깔아 둔 길로 지키는 제한된 직접 실행이다. 위쪽의 gVisor 는 시스템 콜을 받는 쪽을 Sentry 로 바꾸고, 아래쪽은 인터럽트 중첩과 비용 측정이라는 곁가지다.</desc>
<rect width="984" height="796" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 04-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">직접 실행이 낳는 두 문제를 모드·trap 과 타이머·문맥 교환이 나눠 푼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 요소의 관계, 칩은 그 요소를 다루는 절, 왼쪽에서 오른쪽으로 읽습니다.</text>
<text x="24" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">출발</text>

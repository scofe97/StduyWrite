<title id="dt">표준 출력을 닫고 파일을 열면 1번이 파일을 가리킨다</title><desc id="dd">fork 직후 자식의 파일 번호 0 1 2 는 부모와 같아 0 은 키보드, 1 과 2 는 화면을 가리킨다. close 로 표준 출력을 닫으면 1번이 비고, 이어서 open 이 가장 낮은 빈 번호 1 을 받아 1번이 newfile.txt 를 가리킨다. exec 으로 wc 가 되어도 파일 번호 표는 그대로라 wc 의 출력은 파일로 간다.</desc>

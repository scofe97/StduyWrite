<title id="dt">반환값 변수가 어디에 있느냐가 join 뒤의 운명을 정한다</title><desc id="dd">위 줄은 mythread 의 스택에 둔 oops 의 주소를 돌려주는 경우로, 반환 때 프레임이 해제되어 main 은 해제된 자리를 읽는다. 아래 줄은 Malloc 으로 heap 에 둔 rvals 를 돌려주는 경우로, 프레임이 해제돼도 값이 남아 main 이 읽고 free 한다.</desc>
<rect width="880" height="456" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 21-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">반환값 변수가 어디에 있느냐가 join 뒤의 운명을 정한다</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">스택 변수의 주소를 돌려줌 — 위험</text>
<rect x="24" y="124" width="172" height="96" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="110.0" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">1 할당</text>
<line x1="36" y1="162" x2="184" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="110.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">oops 는 mythread 의</text>
<text x="110.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">스택 프레임 안</text>
<path d="M 196 172 L 244 172" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="244" y="124" width="172" height="96" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="330.0" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">2 반환</text>
<line x1="256" y1="162" x2="404" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="330.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">return &amp;oops</text>
<text x="330.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">스택 주소를 돌려줌</text>
<path d="M 416 172 L 464 172" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="464" y="124" width="172" height="96" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="550.0" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">3 프레임 해제</text>
<line x1="476" y1="162" x2="624" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="550.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">oops 의 자리가</text>
<text x="550.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">해제됨</text>
<path d="M 636 172 L 684 172" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="684" y="124" width="172" height="96" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="770.0" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">4 main 이 읽음</text>
<line x1="696" y1="162" x2="844" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="770.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">해제된 자리를 가리키는</text>
<text x="770.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">포인터를 따라감</text>
<text x="24" y="272" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">heap 변수의 주소를 돌려줌 — 정상</text>
<rect x="24" y="284" width="172" height="96" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="110.0" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">1 할당</text>
<line x1="36" y1="322" x2="184" y2="322" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="110.0" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">Malloc 으로 heap 에</text>
<text x="110.0" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">myret_t 를 받음</text>
<path d="M 196 332 L 244 332" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="244" y="284" width="172" height="96" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="330.0" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">2 반환</text>
<line x1="256" y1="322" x2="404" y2="322" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="330.0" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">return rvals</text>
<text x="330.0" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">heap 주소를 돌려줌</text>
<path d="M 416 332 L 464 332" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="464" y="284" width="172" height="96" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="550.0" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">3 프레임 해제</text>
<line x1="476" y1="322" x2="624" y2="322" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="550.0" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">스택 프레임은 사라져도</text>
<text x="550.0" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">heap 값은 그대로</text>
<path d="M 636 332 L 684 332" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="684" y="284" width="172" height="96" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="770.0" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">4 main 이 읽음</text>
<line x1="696" y1="322" x2="844" y2="322" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="770.0" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">x=1, y=2 를 읽은 뒤</text>
<text x="770.0" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">free(rvals)</text>
<line x1="12" y1="400" x2="832" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="422" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

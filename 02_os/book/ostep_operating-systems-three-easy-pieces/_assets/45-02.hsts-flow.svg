<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 592" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">HSTS 호스트의 http 주소는 https 로 바뀌고 오류는 연결을 끊는다</title><desc id="dd">클라이언트가 http 주소를 열 때 알려진 HSTS 호스트의 도메인이면 스킴을 https 로 바꾼다. 보안 전송을 세우다 경고든 치명적이든 어떤 오류를 만나도 연결을 끊고, 오류가 없으면 https 로 통신한다. 클라이언트가 아직 모르는 HSTS 호스트에 http 로 요청하면 보안이 걸리지 않으므로 HSTS 호스트인 서버가 평문 요청에 https 주소로 가는 영구 리다이렉트를 돌려주라고 권고한다.</desc>
<rect width="1000" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 45-02 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">HSTS 호스트의 http 주소는 https 로 바뀌고 오류는 연결을 끊는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">알려진 HSTS 호스트에는 클라이언트가 https 만 쓰고, HSTS 호스트인 서버는 평문 요청에 리다이렉트를 권고받는다</text>
<rect x="124.0" y="104.0" width="232" height="40" rx="20" fill="#161B22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="240" y="129" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">http:// 주소를 열려 함</text>
<path d="M 240 144 L 240 180" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<polygon points="240,180 372,232 240,284 108,232" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="240" y="237" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">알려진 HSTS 호스트인가?</text>
<path d="M 374 232 L 436 232" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="405" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<rect x="440" y="196" width="200" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="540.0" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">https 로 바꿈</text>
<text x="540.0" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">URI 스킴을 교체</text>
<path d="M 540 268 L 540 324" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="552" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">보안 전송을 세움</text>
<polygon points="540,324 640,376 540,428 440,376" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.4"/>
<text x="540" y="381" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">오류가 있는가?</text>
<path d="M 642 376 L 700 376" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="671" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<rect x="704" y="340" width="240" height="72" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.4"/>
<text x="824.0" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">연결을 끊음</text>
<text x="824.0" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">경고든 치명이든 모든 오류</text>
<path d="M 540 430 L 540 476" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="552" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<rect x="440" y="480" width="200" height="72" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.4"/>
<text x="540.0" y="508" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">https 로 통신</text>
<text x="540.0" y="532" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">보호된 연결을 씀</text>
<path d="M 240 286 L 240 332" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="252" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<rect x="120" y="336" width="240" height="72" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.4"/>
<text x="240.0" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">http 로 요청</text>
<text x="240.0" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">보안이 걸리지 않은 채 통신</text>
<path d="M 240 410 L 240 456" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="252" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">HSTS 호스트인 서버가 응답</text>
<rect x="120" y="460" width="240" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="240.0" y="488" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">영구 리다이렉트</text>
<text x="240.0" y="512" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">https 주소로 보내라고 권고</text>
</svg>
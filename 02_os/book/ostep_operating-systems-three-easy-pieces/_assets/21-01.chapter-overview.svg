<title id="dt">스레드 하나가 지나는 다섯 단계</title><desc id="dd">pthread 라이브러리의 함수를 만든다, 기다린다, 막는다, 알린다, 빌드한다의 다섯 단계로 묶어 보인다. 단계마다 함수 하나, 그 함수가 받치는 개념, 그 내용을 다루는 절이 같은 칸에 놓인다.</desc>

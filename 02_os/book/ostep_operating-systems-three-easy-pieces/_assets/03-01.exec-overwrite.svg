<title id="dt">exec 은 프로세스를 새로 만들지 않고 안의 프로그램만 바꾼다</title><desc id="dd">exec 호출 전의 자식은 p3 의 코드와 정적 데이터, 힙, 스택을 가진 PID 29384 프로세스다. 호출 뒤에도 PID 는 29384 이고 열린 파일도 그대로다. 코드와 정적 데이터는 wc 의 것으로 덮어써지고 힙과 스택은 다시 초기화된다.</desc>

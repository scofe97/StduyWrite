<title id="dt">끝난 자식은 부모가 wait() 로 회수할 때까지 zombie 로 남는다</title><desc id="dd">자식이 끝나면 운영체제는 자식의 항목을 zombie 상태로 남겨 반환값을 보관한다. 부모가 wait() 를 부르면 운영체제가 자식의 반환값을 부모에게 건네고, 그 뒤 자식의 항목과 관련 자료구조를 정리한다.</desc>
<rect width="920" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 02-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">끝난 자식은 부모가 wait() 로 회수할 때까지 zombie 로 남는다</text>
<rect x="80" y="100" width="160" height="40" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="160" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">자식</text>
<line x1="160" y1="140" x2="160" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="380" y="100" width="160" height="40" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="460" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">운영체제</text>
<line x1="460" y1="140" x2="460" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="680" y="100" width="160" height="40" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="760" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">부모</text>
<line x1="760" y1="140" x2="760" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 4"/>
<path d="M 162 176 L 456 176" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="310.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">종료 + 반환값</text>
<rect x="380" y="204" width="160" height="52" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="460" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">자식 항목: zombie</text>
<text x="460" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">반환값은 보관 중</text>
<path d="M 758 304 L 464 304" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="610.0" y="294" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">wait()</text>
<path d="M 462 344 L 756 344" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)"/>
<text x="610.0" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">자식의 반환값</text>
<rect x="380" y="372" width="160" height="52" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="460" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">자식 항목 정리</text>
<text x="460" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">자료구조를 비움</text>

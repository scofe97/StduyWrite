<title id="dt">가능한 키가 줄면 키 길이는 소용없다</title><desc id="dd">무차별 대입으로 키를 찾을 때 시도해야 하는 횟수를 10의 거듭제곱 눈금으로 그린 가로 막대 세 줄이다. 결함 때문에 가능한 키가 32가지로 줄면 6번째 시도에서 찾고, 시각을 시드로 쓴 키는 후보 126개 중 118번째에서 찾는다. 무작위로 만든 AES-128 키는 평균 1.7×10^38 번을 시도해야 하고 초당 1조 번이어도 약 5.4×10^18 년이 걸린다.</desc>
<rect width="880" height="428" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 44-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">가능한 키가 줄면 키 길이는 소용없다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">막대 길이는 시도 횟수의 자릿수 — 짧은 두 막대가 키 선택이 무너진 경우</text>
<line x1="264.0" y1="96" x2="264.0" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="264.0" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">1번</text>
<line x1="406.0" y1="96" x2="406.0" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="406.0" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">10^10</text>
<line x1="548.0" y1="96" x2="548.0" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="548.0" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">10^20</text>
<line x1="690.0" y1="96" x2="690.0" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="690.0" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">10^30</text>
<line x1="832.0" y1="96" x2="832.0" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="832.0" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">10^40</text>
<text x="548.0" y="408" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">시도 횟수 (로그 눈금)</text>
<text x="248" y="124" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">결함으로 줄어든 키</text>
<text x="248" y="144" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">가능한 키 32가지</text>
<rect x="264" y="112" width="21.373129692142665" height="28" rx="3" fill="#F08A5920" stroke="#F08A59" stroke-width="1.4"/>
<text x="268" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">6번째 시도에 발견 · 0초</text>
<text x="248" y="212" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">시각을 시드로 쓴 키</text>
<text x="248" y="232" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">후보 시각 126개</text>
<rect x="264" y="200" width="29.825261740669394" height="28" rx="3" fill="#8B98A91F" stroke="#8B98A9" stroke-width="1.0"/>
<text x="268" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">118번째 시도에 발견 · 2초</text>
<text x="248" y="300" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">무작위 AES-128 키</text>
<text x="248" y="320" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">평균 2^127 번 시도</text>
<rect x="264" y="288" width="542.8774941804237" height="28" rx="3" fill="#8B98A91F" stroke="#8B98A9" stroke-width="1.0"/>
<text x="268" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">1.7×10^38 번 · 초당 1조 번이면 약 5.4×10^18 년</text>
</svg>
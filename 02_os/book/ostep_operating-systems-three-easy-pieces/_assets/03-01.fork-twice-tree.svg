<title id="dt">fork() 두 번: 1개 → 2개 → 4개, A 는 B 와 D 의 부모, B 는 C 의 부모</title><desc id="dd">fork 를 두 번 이어 부르면 프로세스가 1개에서 2개, 4개로 늘고 A 가 B 와 D 의 부모, B 가 C 의 부모가 되는 프로세스 트리. 시작 시점에 프로세스 A 가 있고, 첫째 fork() 에서 A 가 자식 B 를 만들어 2개가 된다. 둘째 fork() 는 A 와 B 가 각각 불러 A 가 자식 D 를, B 가 자식 C 를 만들어 4개가 된다. 네 프로세스 A B C D 는 각각 hello 를 한 번씩 찍어 모두 네 번 찍히며, 순서는 스케줄러가 정한다.</desc>

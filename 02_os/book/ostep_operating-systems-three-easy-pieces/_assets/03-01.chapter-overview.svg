<title id="dt">fork 는 복제하고 exec 은 덮어쓰며 그 사이에서 환경이 바뀐다</title><desc id="dd">03-01 의 키워드 개념도. 1행은 fork 가 부모를 복제해 자식을 만들고 반환값으로 부모와 자식을 가르는 흐름이다. 2행은 부모가 wait 로 막혀 있다가 자식이 끝나면 돌아와 출력 순서가 고정되는 흐름이다. 3행은 자식이 exec 으로 다른 프로그램이 되는 흐름이다. 4행은 자식이 열린 파일을 바꾼 뒤 exec 을 불러 리다이렉션이 되는 흐름이다. 5행은 kill 로 시그널을 보내고 사용자 개념이 보낼 수 있는 대상을 정하는 흐름이다.</desc>
<rect width="984" height="672" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 03-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">fork 는 복제하고 exec 은 덮어쓰며 그 사이에서 환경이 바뀐다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>
<rect x="19.560000000000002" y="130.0" width="28.88" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="34" y="144.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">§1</text>

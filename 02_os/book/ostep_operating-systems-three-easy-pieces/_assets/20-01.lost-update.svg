<title id="dt">읽은 값을 쓰기 전에 전환이 끼어들면 두 번 더해도 한 번만 반영된다</title><desc id="dd">카운터가 50 일 때 스레드 1 이 값을 eax 로 읽고 1 을 더해 eax 가 51 이 된 뒤 전환이 일어난다. 스레드 2 도 50 을 읽고 51 을 만들어 카운터에 51 을 쓴다. 스레드 1 이 다시 돌면서 자기 eax 51 을 카운터에 쓰므로 최종 값은 52 가 아니라 51 이다.</desc>

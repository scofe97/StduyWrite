<title id="dt">사용자는 비밀번호로, 사이트는 공개 키로 자신을 증명한다</title><desc id="dd">왼쪽 존은 사용자 수천 명이고 오른쪽 존은 웹 사이트 하나다. 사용자에서 사이트로 가는 화살표는 사용자마다 다른 ID 와 비밀번호를 싣고, 아는 쪽은 사용자와 사이트 둘뿐이다. 사이트에서 사용자로 가는 화살표는 모두에게 같은 공개 키 하나를 싣고, 개인 키를 가진 쪽은 사이트뿐이다.</desc>
<rect width="880" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 45-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">사용자는 비밀번호로, 사이트는 공개 키로 자신을 증명한다</text>
<rect x="12" y="96" width="276" height="252" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="24" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">사용자 수천 명</text>
<rect x="592" y="96" width="276" height="252" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="604" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">웹 사이트 하나</text>
<rect x="28" y="132" width="244" height="56" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="44" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">user1</text>
<text x="44" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">비밀번호 hunter2</text>

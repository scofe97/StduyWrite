<title id="dt">암호는 키 하나에 비밀을 걸고, 해시는 그 비용을 줄인다</title><desc id="dd">한 행이 한 절이다. 첫 행은 OS 의 통제가 닿지 않는 데이터를 대칭 암호로 감싸고 변조 검출을 덧붙이는 흐름이다. 둘째 행은 대칭 키 배포 문제를 공개 키와 개인 키로 푸는 흐름이고 공개 키의 출처 확인이 새 문제로 남는다. 셋째 행은 느린 서명의 비용을 해시만 서명해서 줄이는 흐름이다.</desc>
<rect width="984" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 44-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">암호는 키 하나에 비밀을 걸고, 해시는 그 비용을 줄인다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로 화살표의 라벨이 노드 사이의 관계이고, 왼쪽 칩이 절 번호이다.</text>

<title id="dt">같은 비밀번호도 솔트가 다르면 해시가 달라진다</title><desc id="dd">세 번의 실행이 같은 비밀번호 hunter2 를 해시한다. 첫째와 둘째는 솔트 aaaaaaaa 를 쓰고 출력이 서로 같다. 셋째는 솔트 bbbbbbbb 를 쓰고 출력의 앞자리가 5crrZL 로 첫째의 n5EoGx 와 다르다.</desc>

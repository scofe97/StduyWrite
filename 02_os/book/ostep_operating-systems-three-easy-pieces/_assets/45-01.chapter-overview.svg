<line x1="190" y1="398" x2="774" y2="398" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="24" y="272" width="132" height="84" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="34.18" y="276" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="48" y="290" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§1</text>
<text x="90.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">원격 기계</text>

<title id="dt">개인 키로 확인하든 비밀번호로 확인하든 메시지 하나에서 멈춘다</title><desc id="dd">45-01 의 키워드 개념도. 왼쪽 원격 기계에서는 비트만 보여 상대가 누구인지 확인해야 한다. 위 갈래는 개인 키로 확인하는 길이다. 공개 키는 비밀이 아니어서 인증서가 이름과 키를 서명으로 묶고, 그 서명은 CA 공개 키로 확인하며, 그 키는 미리 설치된 것에서 신뢰가 출발한다. 아래 갈래는 비밀번호로 확인하는 길이다. 암호화한 통로로 보내고 사이트는 솔트 붙은 느린 해시만 저장한다. 두 길은 오른쪽에서 같은 한계에 닿는다. 확인되는 것은 지금 받은 메시지 하나의 진위뿐이고, 이후의 메시지를 묶는 TLS 와 세션 인증은 다음 편의 몫이다.</desc>
<rect width="1000" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 45-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">개인 키로 확인하든 비밀번호로 확인하든 메시지 하나에서 멈춘다</text>
<text x="190" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">개인 키로 확인</text>
<line x1="190" y1="134" x2="774" y2="134" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

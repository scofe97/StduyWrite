<title id="dt">A 에서 B 로 바꾸는 타이머 인터럽트 한 번에 저장 둘, 복원 둘이 일어난다</title><desc id="dd">프로세스 A 가 타이머 인터럽트로 끊기면 하드웨어가 A 의 사용자 레지스터를 A 의 커널 스택에 저장하고, 운영체제의 swtch 가 커널 레지스터를 A 의 프로세스 구조에 저장한다. 이어서 swtch 가 B 의 프로세스 구조에서 커널 레지스터를 복원하고 B 의 커널 스택으로 바꾸며, return-from-trap 이 B 의 커널 스택에서 사용자 레지스터를 복원해 B 를 실행한다.</desc>
<rect width="920" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">A 에서 B 로 바꾸는 타이머 인터럽트 한 번에 저장 둘, 복원 둘이 일어난다</text>
<text x="144.0" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">A 쪽 커널 메모리</text>
<text x="776.0" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">B 쪽 커널 메모리</text>
<rect x="24" y="150" width="240" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="144.0" y="174" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">k-stack(A)</text>
<text x="144.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">사용자 레지스터 · PC</text>
<rect x="24" y="400" width="240" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="144.0" y="424" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">proc_t(A)</text>
<text x="144.0" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">커널 레지스터(context)</text>
<rect x="656" y="150" width="240" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="776.0" y="174" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">k-stack(B)</text>
<text x="776.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">사용자 레지스터 · PC</text>
<rect x="656" y="400" width="240" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="776.0" y="424" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">proc_t(B)</text>
<text x="776.0" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">커널 레지스터(context)</text>
<rect x="340" y="244" width="240" height="96" rx="6" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="460.0" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">CPU 레지스터</text>
<text x="460.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">지금 실행 중인 쪽의 값</text>
<text x="460.0" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">A 가 쓰던 값 → B 가 쓸 값</text>
<path d="M 340 266 L 144.0 266 L 144.0 206" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="158.0" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">1. 하드웨어가 저장</text>
<path d="M 340 318 L 144.0 318 L 144.0 398" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)"/>
<text x="158.0" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">2. swtch 가 저장</text>
<path d="M 776.0 400 L 776.0 318 L 580 318" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)"/>
<text x="762.0" y="342" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">3. swtch 가 복원</text>
<path d="M 776.0 206 L 776.0 266 L 580 266" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="762.0" y="252" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">4. return-from-trap 이 복원</text>
<rect x="418.0" y="366" width="316.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="576.0" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">3 번에서 스택이 k-stack(B) 로 바뀜</text>
<line x1="12" y1="536" x2="872" y2="536" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="558" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="548" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">하드웨어가 옮김</text>
<rect x="248" y="548" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="270" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">운영체제(swtch)가 옮김</text>
<rect x="487" y="548" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="509" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">CPU 레지스터</text>
</svg>
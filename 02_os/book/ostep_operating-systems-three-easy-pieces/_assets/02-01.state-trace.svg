<title id="dt">한쪽이 I/O 를 기다리는 동안 다른 쪽이 CPU 를 쓴다</title><desc id="dd">위 표는 CPU 만 쓰는 두 프로세스로, Process0 이 시각 4 에 끝난 뒤에야 Process1 이 시각 5~8 에 돈다. 아래 표는 Process0 이 시각 3 에 I/O 를 시작해 4~6 동안 Blocked 이고 그동안 Process1 이 돌며, 시각 7 에 I/O 가 끝나 Process0 은 Ready 가 된다.</desc>

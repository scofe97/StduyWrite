<line x1="291.42857142857144" y1="180" x2="291.42857142857144" y2="244" stroke="#8B98A9" stroke-width="0.9" stroke-dasharray="4 4"/>
<line x1="812.2666666666667" y1="180" x2="812.2666666666667" y2="244" stroke="#8B98A9" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="285.42857142857144" y="264" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">300 ms · TIME 도착</text>
<text x="818.2666666666667" y="264" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">약 2,009 ms · 응답</text>
<line x1="12" y1="284" x2="832" y2="284" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="306" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="296" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="122" y="306" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">루프가 서 있는 구간</text>
<rect x="287" y="296" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="306" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TIME 핸들러</text>
<rect x="435" y="296" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="457" y="306" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">B 가 기다린 구간</text>

<text x="212.0" y="155" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">SLOW 핸들러 · sleep(2)</text>
<rect x="809.5238095238095" y="136" width="8" height="28" rx="2" fill="#6A95D840" stroke="#6A95D8" stroke-width="1.1"/>
<text x="825.5238095238095" y="155" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">TIME</text>

<title id="dt">SLOW 핸들러가 끝날 때까지 TIME 요청은 기다린다</title><desc id="dd">시간 축은 0 ms 에서 2,100 ms 까지다. 이벤트 루프 행에서는 SLOW 핸들러가 sleep(2) 로 0 ms 부터 2,000 ms 까지 서 있다. 클라이언트 B 는 300 ms 에 TIME 요청을 보냈지만 루프가 다음 이벤트를 꺼내지 못해, 약 2,009 ms 에 응답을 받았고 대기는 1,709 ms 였다.</desc>
<rect width="880" height="340" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 27-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SLOW 핸들러가 끝날 때까지 TIME 요청은 기다린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">핸들러 하나가 자는 동안 루프의 모든 요청이 밀립니다</text>
<line x1="200" y1="108" x2="840" y2="108" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="200.0" y1="104" x2="200.0" y2="112" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="200.0" y="98" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">0 ms</text>
<line x1="352.3809523809524" y1="104" x2="352.3809523809524" y2="112" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="352.3809523809524" y="98" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">500 ms</text>
<line x1="504.76190476190476" y1="104" x2="504.76190476190476" y2="112" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="504.76190476190476" y="98" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">1,000 ms</text>
<line x1="657.1428571428571" y1="104" x2="657.1428571428571" y2="112" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="657.1428571428571" y="98" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">1,500 ms</text>
<line x1="809.5238095238095" y1="104" x2="809.5238095238095" y2="112" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="809.5238095238095" y="98" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">2,000 ms</text>
<text x="20" y="153" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">이벤트 루프(evsrv)</text>

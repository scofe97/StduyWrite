<title id="dt">보관함 키는 RAM 에서만 살았다가 잊힌다</title><desc id="dd">상태는 둘이다. 잠김은 RAM 에 키가 없는 상태이고 열림은 RAM 에 키가 있어 복호할 수 있는 상태다. passphrase 가 맞으면 잠김에서 열림으로 가고, 틀리면 bad decrypt 가 나와 잠김에 머문다. 열림에서는 복호 요청마다 평문을 돌려주고, 로그아웃이나 종료나 보관함 응용 종료 때 키를 폐기해 잠김으로 돌아간다.</desc>
<rect width="880" height="332" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 44-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">보관함 키는 RAM 에서만 살았다가 잊힌다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">키는 디스크에 쓰지 않는다 — 열림 상태가 길수록 편하지만 자리를 비운 단말이 위험하다</text>
<rect x="96" y="184" width="200" height="80" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="196.0" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">잠김</text>
<text x="196.0" y="242" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">RAM 에 키가 없음</text>
<rect x="584" y="184" width="200" height="80" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.5"/>
<text x="684.0" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">열림</text>
<text x="684.0" y="242" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">RAM 에 키가 있음</text>
<circle cx="48" cy="224.0" r="6" fill="#F5F5F3"/>
<path d="M 56 224.0 L 92 224.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 298 212 L 580 212" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="440.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">passphrase 일치 / 키를 RAM 에 둠</text>
<path d="M 582 236 L 300 236" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">로그아웃 · 종료 · 보관함 종료 / 키 폐기</text>
<path d="M 160.0 184 C 160.0 132, 232.0 132, 232.0 182" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="196.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">passphrase 불일치 / bad decrypt</text>
<path d="M 648.0 184 C 648.0 132, 720.0 132, 720.0 182" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="684.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">복호 요청 / 평문 반환</text>
<rect x="574.0" y="290" width="220.0" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="684.0" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">자리를 비운 단말은 누구나 사용</text>
</svg>
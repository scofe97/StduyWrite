<title id="dt">인자 네 개가 새 스레드의 칸이 되는 길</title><desc id="dd">main 이 pthread_create(&amp;p, NULL, mythread, &amp;args) 를 부르면 첫째 인자는 핸들 칸, 둘째는 기본 속성, 셋째는 첫 실행 함수, 넷째는 새 스레드가 받는 void 포인터가 된다. 넷째 줄에서 main 의 args 주소가 그대로 건너간다.</desc>

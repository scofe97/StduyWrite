<title id="dt">세 가지 포워딩의 수신 지점과 목적지</title><desc id="dd">09-01 의 개념도입니다. 첫 줄은 클라이언트가 포트를 열고 서버가 목적지에 연결하는 local 포워딩입니다. 둘째 줄은 서버가 포트를 열고 클라이언트 쪽이 목적지에 연결하는 remote 포워딩입니다. 셋째 줄은 클라이언트가 SOCKS 프록시로 포트를 열고 서버가 요청이 정한 주소에 연결하는 dynamic 포워딩입니다.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 546" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">서버가 -R 을 거절하면 ExitOnForwardFailure 가 ssh 의 행동을 정한다</title><desc id="dd">ssh -N -R 요청이 서버에 닿으면 서버의 허락 여부에 따라 갈립니다. 허락하면 수신 포트가 열립니다. 거절되면 ExitOnForwardFailure 값에 따라 갈립니다. yes 이면 Error 와 종료 코드 255 로 즉시 끝나고, no(기본값)이면 Warning 을 내고 포워딩 없는 연결이 남습니다.</desc>
<rect width="984" height="546" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 09-01 FORWARD FAILURE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서버가 -R 을 거절하면 ExitOnForwardFailure 가 ssh 의 행동을 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">갈림길은 둘입니다. 서버의 허락 여부, 그리고 ssh 의 ExitOnForwardFailure 입니다.</text>
<rect x="160" y="104" width="280" height="40" rx="20" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="300.0" y="128.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">ssh -N -R 2224:127.0.0.1:18099</text>
<path d="M 300 144 L 300 176" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<polygon points="300,180 448,224 300,268 152,224" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="300" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서버가 -R 을 허락하나?</text>
<text x="300" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">AllowTcpForwarding</text>
<path d="M 452 224 L 556 224" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)"/>
<text x="504" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">예</text>
<rect x="560" y="204" width="320" height="40" rx="20" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="720.0" y="228.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">서버에 수신 포트가 열림</text>
<path d="M 300 268 L 300 296" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<text x="292" y="288" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<polygon points="300,296 448,340 300,384 152,340" fill="#F08A591F" stroke="#F08A59" stroke-width="1.4"/>
<text x="300" y="338" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">ExitOnForwardFailure</text>
<text x="300" y="356" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">= yes ?</text>
<path d="M 452 340 L 516 340" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)"/>
<text x="484" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">예</text>
<rect x="520" y="308" width="432" height="64" rx="20" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="736.0" y="337.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">Error: remote port forwarding failed for listen port 2224</text>
<text x="736.0" y="356.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">종료 코드 255 · 연결 종료</text>
<path d="M 300 384 L 300 420" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<text x="292" y="408" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<rect x="84" y="420" width="432" height="64" rx="20" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<text x="300.0" y="449.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">Warning: remote port forwarding failed for listen port 2224</text>
<text x="300.0" y="468.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">포워딩 없는 연결이 남음 · -N 이면 셸도 없는 빈 연결</text>
<line x1="12" y1="498" x2="936" y2="498" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="520" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="510" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">포워딩 성공</text>
<rect x="222" y="510" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="244" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">연결이 남음</text>
<rect x="344" y="510" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="366" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ssh 가 종료</text>
<rect x="492" y="510" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="514" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">본문이 짚는 갈림길</text>
</svg>
<title id="dt">안쪽이 먼저 건 연결 위로 바깥의 요청이 들어온다</title><desc id="dd">NAT 뒤 안쪽 장비의 ssh 클라이언트가 공개 서버의 sshd 로 연결을 먼저 걸고(1), 서버가 수신 포트를 엽니다(2). 서버 안의 curl 요청이 수신 포트에 닿으면(3) 서버가 forwarded-tcpip 채널을 열어 같은 연결로 되돌려 보냅니다(4). 클라이언트가 안쪽 서비스에 연결해 요청을 넘깁니다(5).</desc>
<rect width="984" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 09-01 REVERSE TUNNEL</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">안쪽이 먼저 건 연결 위로 바깥의 요청이 들어온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">NAT 는 안에서 밖으로 건 연결만 지나갑니다. 번호는 일이 일어나는 순서입니다.</text>

<title id="dt">ssh -R 한 줄이 만드는 연결 1개와 채널 3개</title><desc id="dd">공개 서버에서는 요청 3건이 수신 포트 하나로 들어옵니다. 세 요청은 SSH 연결 1개 위의 forwarded-tcpip 채널 0·1·2 로 나뉘어 NAT 뒤 안쪽 장비의 ssh 클라이언트로 갑니다. 클라이언트는 안쪽 서비스에 연결 3개를 따로 맺습니다.</desc>
<rect width="984" height="450" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 09-01 REMOTE CHANNELS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">ssh -R 한 줄이 만드는 연결 1개와 채널 3개</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">채널 번호는 양 끝이 따로 매기므로 안쪽 번호와 서버 쪽 번호가 다를 수 있습니다.</text>

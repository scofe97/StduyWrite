<title id="dt">키와 값의 타입 ID 가 맵 덤프의 필드 이름이 된다</title><desc id="dd">BPF_MAP_CREATE 는 btf_fd=3 과 함께 키 타입 ID 1, 값 타입 ID 4 를 따로 넘기고, 커널은 u32 와 user_msg_t 를 맵에 붙여 두며, bpftool 은 그 타입으로 값을 풀어 찍는다.</desc>
<rect width="1000" height="428" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 05-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">키와 값의 타입 ID 가 맵 덤프의 필드 이름이 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 맵 config 의 한 항목이 세 번 모양을 바꿉니다</text>
<rect x="100.0" y="100" width="232" height="24" rx="12" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="216.0" y="117" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">01 BPF_MAP_CREATE</text>
<rect x="408.0" y="100" width="232" height="24" rx="12" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="524.0" y="117" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">02 커널 안 config 맵</text>
<rect x="722.0" y="100" width="232" height="24" rx="12" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="838.0" y="117" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">03 bpftool map dump</text>
<rect x="12" y="140" width="976" height="96" fill="#F5F5F3" fill-opacity="0.025"/>
<text x="24" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">키</text>
<text x="24" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">값</text>
<rect x="100" y="156" width="232" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="216.0" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">btf_key_type_id=1</text>
<text x="216.0" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">btf_fd=3 의 BTF</text>
<rect x="408" y="156" width="232" height="64" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="524.0" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">[1] u32</text>
<text x="524.0" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">TYPEDEF · 4바이트</text>
<rect x="716" y="156" width="244" height="64" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="838.0" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">"key": 501</text>
<text x="838.0" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">u32 로 해석</text>
<path d="M 334 188 L 402 188" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<path d="M 642 188 L 710 188" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="100" y="252" width="232" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="216.0" y="280" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">btf_value_type_id=4</text>
<text x="216.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">btf_fd=3 의 BTF</text>
<rect x="408" y="252" width="232" height="64" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="524.0" y="280" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">[4] user_msg_t</text>
<text x="524.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">STRUCT · 12바이트</text>
<rect x="716" y="252" width="244" height="64" rx="6" fill="#F08A591F" stroke="#F08A59" stroke-width="1.4"/>
<text x="838.0" y="280" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">"message": "Hi user 501!"</text>
<text x="838.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">char 12칸 문자열</text>
<path d="M 334 284 L 402 284" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<path d="M 642 284 L 710 284" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<line x1="12" y1="372" x2="952" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="394" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="384" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호출 인자</text>
<rect x="209" y="384" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="231" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">커널이 쥔 타입</text>
<rect x="357" y="384" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="379" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">필드 이름이 붙은 출력</text>
</svg>
<title id="dt">소스 한 줄은 세 번의 읽기가 되고 오브젝트에 재배치 기록이 남는다</title><desc id="dd">BPF_CORE_READ 한 줄이 bpf_core_read 셋으로 펼쳐지고, 각각이 헬퍼 호출과 clang 내장으로 바뀌어 오브젝트의 .BTF.ext 에 재배치 기록을 남긴다.</desc>
<rect width="960" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 05-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">소스 한 줄은 세 번의 읽기가 되고 오브젝트에 재배치 기록이 남는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">맨 아래 층의 기록은 적재 때 libbpf 가 사용합니다</text>
<text x="24" y="144" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L1</text>
<rect x="84" y="108" width="840" height="64" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.1"/>
<text x="104" y="146" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">소스</text>
<text x="344" y="146" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">d = BPF_CORE_READ(a, b, c, d)</text>
<path d="M 504 174 L 504 202" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="24" y="240" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L2</text>
<rect x="84" y="204" width="840" height="64" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.1"/>
<text x="104" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">libbpf 매크로</text>
<text x="344" y="224" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">bpf_core_read(&amp;b, 8, &amp;a-&gt;b)</text>
<text x="344" y="242" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">bpf_core_read(&amp;c, 8, &amp;b-&gt;c)</text>
<text x="344" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">bpf_core_read(&amp;d, 8, &amp;c-&gt;d)</text>
<path d="M 504 270 L 504 298" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="24" y="336" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L3</text>
<rect x="84" y="300" width="840" height="64" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.6"/>
<text x="104" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">헬퍼와 clang 내장</text>
<text x="344" y="329" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">bpf_probe_read_kernel(dst, sz,</text>
<text x="344" y="347" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">  (const void *)__builtin_preserve_access_index(src))</text>
<path d="M 504 366 L 504 394" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="24" y="432" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L4</text>
<rect x="84" y="396" width="840" height="64" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.1"/>
<text x="104" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">오브젝트 .BTF.ext</text>
<text x="344" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CO-RE 재배치 기록</text>
<line x1="12" y1="500" x2="912" y2="500" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="522" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="512" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소스·매크로</text>
<rect x="222" y="512" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="244" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">clang 내장</text>
<rect x="370" y="512" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="392" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">오브젝트 기록</text>

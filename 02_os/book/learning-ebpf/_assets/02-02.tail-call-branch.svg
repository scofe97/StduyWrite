<text x="380" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">hello()</text>
<text x="380" y="212" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">opcode = ctx-&gt;args[1]</text>
<rect x="260" y="244" width="240" height="56" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="380" y="268" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">syscall.call(ctx, opcode)</text>
<text x="380" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">→ bpf_tail_call</text>

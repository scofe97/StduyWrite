<title id="dt">sys_enter 하나가 항목에 따라 갈라진다</title><desc id="dd">hello() 가 opcode 로 syscall 배열을 조회해 tail call 하고, 항목이 없을 때만 호출자가 계속 실행되어 Another syscall 을 찍는다.</desc>
<rect width="960" height="848" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 02-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">sys_enter 하나가 항목에 따라 갈라진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">prog array 항목 등록 여부와 시스템 콜 번호별 분기</text>

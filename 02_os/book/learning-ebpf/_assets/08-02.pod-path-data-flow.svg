<title id="dt">Pod 로 가는 패킷은 iptables 경로에서 스택을 두 번, eBPF 경로에서 한 번 지난다</title><desc id="dd">바깥 패킷이 eth0 에서 호스트 스택의 iptables·conntrack 규칙을 순서대로 훑고(O(n)) veth 를 건너 Pod 스택을 지나 앱에 닿는다. eBPF 경로는 NodePort 로 들어온 패킷을 eth0 의 XDP·TC 에서 서비스 맵 해시 조회(O(1))로 백엔드에 잇고, Host-Routing 이 켜져 있으면 호스트 스택을 건너뛰고 Pod 스택을 한 번 지난다.</desc>
<rect width="988" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 08-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Pod 로 가는 패킷은 iptables 경로에서 스택을 두 번, eBPF 경로에서 한 번 지난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 패킷이 거치는 스택 횟수와 규칙 조회 비용이 다릅니다</text>

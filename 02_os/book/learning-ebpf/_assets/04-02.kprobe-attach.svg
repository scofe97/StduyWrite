<title id="dt">perf 이벤트 fd 7 에 프로그램 6 을 붙인다</title><desc id="dd">hello-buffer-config.py 가 perf_event_open 으로 kprobe 이벤트 fd 7 을 받고 ioctl 두 번으로 프로그램 6 을 붙여 켠다. 다른 프로세스가 execve 를 부르면 fd 7 의 kprobe 가 프로그램 6 을 실행한다.</desc>

<title id="dt">들어오는 패킷 하나가 XDP 와 TC 의 판정을 차례로 거친다</title><desc id="dd">패킷은 NIC 의 오프로드 XDP, 드라이버의 네이티브 XDP, sk_buff 생성, TC ingress, 네트워크 스택 순으로 지난다. XDP 의 판정은 XDP_ABORTED 0, XDP_DROP 1, XDP_PASS 2, XDP_TX 3, XDP_REDIRECT 4 이고 TC 의 판정은 TC_ACT_OK 0, TC_ACT_SHOT 2, TC_ACT_REDIRECT 7 이다. 나가는 쪽은 TC egress 만 있다.</desc>
<rect width="1000" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 08-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">들어오는 패킷 하나가 XDP 와 TC 의 판정을 차례로 거친다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">판정마다 패킷이 멈추거나 되돌아가는 자리가 다릅니다</text>
<rect x="32" y="112" width="152" height="72" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="108.0" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">NIC</text>

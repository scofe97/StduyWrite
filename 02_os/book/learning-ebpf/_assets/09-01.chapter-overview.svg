<title id="dt">openat 과 fchmodat 이 내려가는 길 위의 판정 지점 셋</title><desc id="dd">syscall 입구는 인자를 읽어도 커널이 읽을 때 바뀔 수 있다. fd_install 은 파일 구조체가 채워진 뒤, security_path_chmod 는 inode 를 바꾸기 직전에 불린다. 결과는 허용 · EPERM · SIGKILL · 이벤트 넷이다.</desc>

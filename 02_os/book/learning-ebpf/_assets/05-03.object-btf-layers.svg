<text x="360" y="165" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">@ 0x2c0</text>
<text x="896" y="165" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">타입 · 문자열</text>
<rect x="96" y="192" width="816" height="68" rx="4" fill="#F08A591F" stroke="#F08A59" stroke-width="1.4"/>

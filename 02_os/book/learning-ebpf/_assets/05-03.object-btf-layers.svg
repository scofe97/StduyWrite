<title id="dt">readelf 가 보여 준 BTF 계열 섹션 넷</title><desc id="dd">hello-buffer-config.bpf.o 의 섹션 [10] .BTF 는 오프셋 0x2c0, [12] .BTF.ext 는 0xb18, [11] .rel.BTF 는 0xe50, [13] .rel.BTF.ext 는 0xea0 에 있고 CO-RE 재배치는 .BTF.ext 에 든다.</desc>
<rect width="960" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 05-03 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">readelf 가 보여 준 BTF 계열 섹션 넷</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">파일 오프셋이 작은 섹션이 위, CO-RE 재배치는 둘째 층</text>

<title id="dt">스켈레톤 구조체가 거치는 네 상태와 전이 함수</title><desc id="dd">열림에서는 skel-&gt;rodata 와 skel-&gt;data 가 사용자 메모리라 초기값을 쓸 수 있고, __load 뒤에는 .data 와 .bss 가 맵과 mmap 으로 공유되며 .rodata 는 frozen 이 되고, __attach 로 execve 에 붙고, __destroy 로 해제된다.</desc>
<rect width="960" height="436" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 05-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스켈레톤 구조체가 거치는 네 상태와 전이 함수</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">초기값은 열림에서, 적재 뒤 쓰기는 .data · .bss 만</text>

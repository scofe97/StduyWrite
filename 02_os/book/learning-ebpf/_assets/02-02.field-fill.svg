<title id="dt">헬퍼가 채운 값이 항목 하나로 모여 화면 한 줄이 된다</title><desc id="dd">hello() 는 pid·uid·command·message 를 헬퍼로 data_t 에 채우고, perf_submit 이 그 36바이트를 output 에 밀면 print_event 가 한 줄로 찍는다.</desc>

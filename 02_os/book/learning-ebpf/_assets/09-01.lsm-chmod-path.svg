<title id="dt">chmod 한 번이 훅을 거쳐 EPERM 이나 notify_change 로 간다</title><desc id="dd">chmod · fchmodat · fchmodat2 는 do_fchmodat 으로, fchmod 는 vfs_fchmod 로 들어가 모두 chmod_common 에서 만난다. 거기서 security_path_chmod 가 LSM 을 차례로 부르고 bpf 프로그램이 -EPERM 을 돌려주면 모드는 바뀌지 않는다.</desc>

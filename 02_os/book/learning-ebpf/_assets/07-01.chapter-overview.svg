<title id="dt">execve 한 번이 지나는 길에 프로그램 여섯이 붙는다</title><desc id="dd">execve 는 sys_enter_execve tracepoint, __x64_sys_execve, 커널 함수 do_execve, sched_process_exec tracepoint 를 차례로 지나고, 각 지점에 붙은 프로그램 여섯이 모두 같은 perf 버퍼 output 으로 값을 보낸다. do_execve 는 v7.0 에서 없어졌다.</desc>
<rect width="960" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 07-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">execve 한 번이 지나는 길에 프로그램 여섯이 붙는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">지점마다 유형이 다르고 출구는 하나입니다</text>

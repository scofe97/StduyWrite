<title id="dt">fexit 프로그램은 인자와 반환값을 함께 받고 kretprobe 는 반환값만 받는다</title><desc id="dd">호출자가 do_unlinkat(dfd, name) 을 부르면 트램펄린이 fentry 프로그램에 dfd·name 을 넘기고 본문을 실행한다. 본문이 ret 을 돌려주면 트램펄린이 fexit 프로그램에 dfd·name·ret 을 넘기고, kretprobe 프로그램은 ret 만 받는다.</desc>
<rect width="960" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 07-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">fexit 프로그램은 인자와 반환값을 함께 받고 kretprobe 는 반환값만 받는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 함수 끝에서 받는 값이 다릅니다</text>

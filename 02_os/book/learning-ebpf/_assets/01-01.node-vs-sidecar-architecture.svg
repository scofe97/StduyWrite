<title id="dt">사이드카 프록시 모델과 노드 커널 eBPF 모델의 구조 비교</title><desc id="dd">사이드카는 프록시에 닿으려 커널 네트워크 스택을 한 번 더 지나지만 eBPF 는 단일 커널에서 모든 컨테이너를 봅니다</desc>

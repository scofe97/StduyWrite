<title id="dt">입구 프로그램이 맵에 넣은 파일 이름 포인터를 출구 프로그램이 꺼낸다</title><desc id="dd">openat 한 번이 입구 tracepoint 에서 인자를 맵에 적고, 출구 tracepoint 가 맵의 포인터로 이름을 읽어 반환값과 합쳐 한 줄을 출력한다.</desc>

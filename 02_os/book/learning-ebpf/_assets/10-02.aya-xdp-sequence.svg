<title id="dt">Rust 두 크레이트가 하나의 XDP 프로그램을 빌드하고 붙인다</title><desc id="dd">xdp-hello-ebpf 를 rustc 와 bpf-linker 가 ELF 로 만들고, xdp-hello 가 그 ELF 를 포함해 읽어 load 와 attach 를 부른다. 패킷이 오면 xdp_hello 가 로그를 남기고 XDP_PASS 를 돌려준다.</desc>
<rect width="960" height="752" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 10-02 §3</text>

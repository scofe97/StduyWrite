<title id="dt">BCC 는 기계마다 컴파일하고 CO-RE 는 한 번 컴파일해 고쳐 싣는다</title><desc id="dd">BCC 는 대상 기계마다 clang 과 커널 헤더로 실행할 때 컴파일한다. CO-RE 는 빌드 기계에서 한 번 컴파일한 오브젝트를 대상 기계의 libbpf 가 커널 BTF 와 비교해 오프셋을 고쳐 싣는다.</desc>
<rect width="960" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 05-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">BCC 는 기계마다 컴파일하고 CO-RE 는 한 번 컴파일해 고쳐 싣는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 오브젝트를 여러 대상 기계에 보냅니다</text>

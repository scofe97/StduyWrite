<title id="dt">BPF_PROG_RUN 은 repeat 번 돌려 반환값을, bpf_stats 는 횟수와 시간을 준다</title><desc id="dd">위 갈래는 사용자 공간이 가짜 패킷과 repeat 를 bpf() 로 넘겨 커널에서 실행하고 retval 과 duration 을 받는다. 아래 갈래는 sysctl 로 통계를 켜고 bpftool 이 run_time_ns 와 run_cnt 를 읽는다.</desc>

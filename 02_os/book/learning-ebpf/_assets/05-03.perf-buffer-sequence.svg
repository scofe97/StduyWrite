<title id="dt">고정 경로 맵을 잡고 perf 버퍼 콜백으로 이벤트를 받는다</title><desc id="dd">find-map 은 bpf_obj_get 으로 고정된 맵의 fd 를 받아 이름을 읽고, hello-buffer-config 는 perf_buffer__new 로 CPU 마다 링을 열어 두고 perf_buffer__poll 이 돌려준 레코드를 handle_event 콜백으로 받아 한 줄을 찍는다.</desc>

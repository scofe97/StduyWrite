<title id="dt">관측한 syscall 번호가 seccomp 프로파일 JSON 이 된다</title><desc id="dd">훅은 컨테이너 init 의 mount namespace 안 syscall 을 처음 보는 번호만 사용자 공간으로 올리고, 컨테이너가 끝나면 그 목록을 허용 이름으로 한 JSON 을 쓴다. 런타임이 다음 시작에 적재하면 목록에 없는 reboot 은 ERRNO 가 된다.</desc>
<rect width="960" height="760" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 09-01 §2</text>

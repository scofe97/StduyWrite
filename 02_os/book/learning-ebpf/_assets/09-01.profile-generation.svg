<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">관측한 호출이 허용 목록이 되고 나머지는 EPERM 이 됩니다</text>

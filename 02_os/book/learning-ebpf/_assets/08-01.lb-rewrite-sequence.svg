<title id="dt">로드밸런서는 주소를 고쳐 쓰고 XDP_TX 로 같은 인터페이스에 되돌린다</title><desc id="dd">client 172.17.0.4 가 LB 172.17.0.5 로 보낸 TCP 패킷을 LB 의 eth0 XDP 프로그램이 src 를 .5, dst 를 .2 또는 .3 으로 고치고 h_dest[5] 를 같은 숫자로 바꾼 뒤 XDP_TX 로 되돌린다. 백엔드의 응답 src .2 dst .5 는 src .5 dst .4 로 고쳐 같은 방식으로 되돌린다.</desc>
<rect width="960" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 08-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">로드밸런서는 주소를 고쳐 쓰고 XDP_TX 로 같은 인터페이스에 되돌린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">요청은 백엔드로, 응답은 클라이언트로 같은 인터페이스에서 되돌아갑니다</text>

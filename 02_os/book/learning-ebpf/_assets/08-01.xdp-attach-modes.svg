<title id="dt">XDP 는 NIC · 드라이버 · 일반 경로 세 자리에서 돌 수 있다</title><desc id="dd">아래 NIC 의 오프로드 XDP 는 xdpoffload 로 호스트 CPU 를 쓰지 않고, 드라이버의 네이티브 XDP 는 xdpdrv 로 sk_buff 가 만들어지기 전에 돌며, 일반 경로의 xdpgeneric 은 sk_buff 가 만들어진 뒤에 돈다. lo 에 xdp 로 붙인 hello 는 폴백으로, 컨테이너 eth0 에 xdpgeneric 으로 붙인 로드밸런서는 지정으로 일반 경로에 있다.</desc>
<rect width="1000" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 08-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">XDP 는 NIC · 드라이버 · 일반 경로 세 자리에서 돌 수 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">어디서 판정하느냐가 attach type 을 정합니다</text>
<text x="100" y="112" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">attach type</text>
<text x="916" y="112" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">판정 자리</text>
<rect x="88" y="120" width="840" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="100" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">—</text>

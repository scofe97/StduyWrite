<title id="dt">C 소스는 빌드 때 바이트코드로 바이너리에 묻히고, 실행 때 Go 코드가 맵을 읽는다</title><desc id="dd">kprobe.c 의 맵과 프로그램 이름이 go generate 로 Go 파일 두 쌍이 되고, go build 가 바이트코드를 단일 바이너리에 담는다. 실행하면 적재 · 부착 · 읽기를 거쳐 sys_execve 횟수를 찍는다.</desc>
<rect width="960" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 10-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">C 소스는 빌드 때 바이트코드로 바이너리에 묻히고, 실행 때 Go 코드가 맵을 읽는다</text>

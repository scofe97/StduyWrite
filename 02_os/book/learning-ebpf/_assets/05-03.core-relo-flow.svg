<title id="dt">relo #0 이 insn #1 의 오프셋을 다시 쓰기까지</title><desc id="dd">오브젝트의 재배치 레코드 relo #0 이 type_id 24 와 접근 문자열 0:0:0 을 가리키고, libbpf 가 vmlinux BTF 의 [205] struct user_pt_regs 를 후보로 찾아 regs[0] 의 오프셋 0 을 확인한 뒤 insn #1 의 off 를 0 에서 0 으로 쓴다.</desc>

<title id="dt">맵 종류는 키가 무엇이고 무엇에 쓰이는지로 묶인다</title><desc id="dd">BPF 맵은 배열 계열, 해시 계열, 특수 목적, 객체 참조 네 묶음으로 나뉜다. 해시 계열에는 per-CPU 와 LRU 변형이 있고 배열에도 per-CPU 변형이 있다. 이 편의 예제는 HASH 를 쓴다.</desc>
<rect width="920" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 02-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">맵 종류는 키가 무엇이고 무엇에 쓰이는지로 묶인다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">per-CPU 변형은 배열과 해시 양쪽에 있습니다</text>

<title id="dt">execve 를 낸 UID 가 메시지를 고른다</title><desc id="dd">UID 501 과 0 은 config 에 항목이 있어 그 메시지를 쓰고, 항목이 없는 UID 1 은 기본 메시지 Hello World 를 쓴다.</desc>

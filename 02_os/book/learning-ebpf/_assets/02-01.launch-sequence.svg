<title id="dt">적재에서 첫 출력 한 줄까지</title><desc id="dd">hello.py 가 BCC 로 C 문자열을 컴파일하고, attach_kprobe 가 프로그램을 bpf() 로 적재해 execve 의 kprobe 에 붙인다. 다른 터미널에서 ls 를 실행하면 execve 가 불리고 hello() 가 돌아 trace_pipe 에 한 줄이 쓰이며, trace_print 가 그 줄을 화면에 낸다.</desc>

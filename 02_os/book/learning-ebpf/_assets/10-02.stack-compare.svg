<title id="dt">libbpf 를 거치는 둘과 bpf() 를 직접 부르는 둘</title><desc id="dd">libbpfgo 는 CGo 와 libbpf 를, libbpf-rs 는 libbpf-sys 와 libbpf 를 거쳐 bpf() 에 닿는다. ebpf-go 와 Aya 는 libbpf 없이 직접 닿는다. 커널 쪽 언어는 Aya 만 Rust 이다.</desc>

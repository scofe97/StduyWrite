<title id="dt">tc_pingpong 은 요청을 응답으로 고쳐 되돌리고 원본은 버린다</title><desc id="dd">pingbox 172.17.0.2 의 ICMP type 8 요청이 docker0 172.17.0.1 의 TC ingress 에 도착하면 tc_pingpong 이 MAC 과 IP 를 맞바꾸고 type 을 0 으로 바꾼 뒤 bpf_clone_redirect 로 복제본을 같은 인터페이스로 내보내고 원본은 TC_ACT_SHOT 으로 버린다. ping 이 아닌 패킷은 TC_ACT_OK 로 스택에 간다.</desc>
<rect width="1000" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 08-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">tc_pingpong 은 요청을 응답으로 고쳐 되돌리고 원본은 버린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">복제본이 응답이 되고 원본은 스택에 닿지 않습니다</text>

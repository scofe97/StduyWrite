<title id="dt">mprotect 한 번이 file_mprotect 훅에서 EPERM 으로 끝난다</title><desc id="dd">프로세스의 mprotect(시스템 콜 번호 10)가 do_mprotect_pkey 에서 security_file_mprotect 를 부르고, 훅에 붙은 mprotect_audit 가 힙이면 -EPERM 을 돌려 시스템 콜이 EPERM 으로 실패한다.</desc>
<rect width="960" height="740" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 07-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">mprotect 한 번이 file_mprotect 훅에서 EPERM 으로 끝난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">반환값이 음수 errno 면 커널은 mprotect 를 진행하지 않습니다</text>

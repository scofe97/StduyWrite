<title id="dt">fd 번호표와 커널 객체, BTF 를 가리키는 두 화살표</title><desc id="dd">프로세스의 fd 3·4·5·6 은 각각 BTF·output 맵·config 맵·hello 프로그램을 가리킨다. config 는 btf_fd=3, hello 는 prog_btf_fd=3 으로 같은 BTF 를 가리킨다.</desc>

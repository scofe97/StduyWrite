<title id="dt">perf 버퍼는 호출이 CPU 마다 반복되고 링 버퍼는 한 번이다</title><desc id="dd">perf 버퍼는 perf_event_open · ioctl ENABLE · BPF_MAP_UPDATE_ELEM 이 CPU 수만큼 반복되고 ppoll 이 fd 네 개를 매번 넘긴다. 링 버퍼는 맵을 만들고 epoll 에 한 번 등록한 뒤 epoll_pwait 로 기다린다.</desc>
<rect width="960" height="548" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 04-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">perf 버퍼는 호출이 CPU 마다 반복되고 링 버퍼는 한 번이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 일을 하는 두 길의 호출 수</text>

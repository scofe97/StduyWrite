<title id="dt">헤더를 하나 읽을 때마다 data_end 를 넘지 않는지 먼저 증명한다</title><desc id="dd">패킷 버퍼는 data 에서 data_end 까지다. 이더넷 헤더는 0~13 바이트로 h_proto 가 12~13 에 있고 값은 0x0800 이다. IP 헤더는 14~33 바이트로 protocol 이 오프셋 23 에 있고 값은 1 이다. data+14 가 data_end 이하여야 이더넷 헤더를, data+34 가 data_end 이하여야 IP 헤더를 읽을 수 있다.</desc>

<title id="dt">CO-RE 다섯 요소가 빌드 기계와 대상 기계에 놓이는 자리</title><desc id="dd">빌드 기계에서는 vmlinux.h 와 clang -g 가 .BTF 를 품은 오브젝트를 만들고 bpftool gen skeleton 이 스켈레톤을 더한다. 대상 기계에서는 libbpf 가 /sys/kernel/btf/vmlinux 와 오브젝트의 BTF 를 맞대어 오프셋을 고친 뒤 싣는다.</desc>

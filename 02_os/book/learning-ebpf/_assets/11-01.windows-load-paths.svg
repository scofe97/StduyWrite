<title id="dt">같은 ELF 가 세 갈래로 적재되고 HVCI 를 켠 릴리스 환경에서는 네이티브만 돈다</title><desc id="dd">my_program 의 ELF 는 PREVAIL 검증 뒤 bpf2c 로 서명된 .sys 가 되거나, eBPFSvc 가 uBPF 로 JIT 하거나, 디버그 빌드에서만 인터프리터로 돈다.</desc>
<rect width="960" height="516" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 11-01 §2</text>

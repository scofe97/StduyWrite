<title id="dt">BTF 가 쓰이는 자리는 넷이다</title><desc id="dd">BTF 는 CO-RE 재배치에 오프셋을 대 주고, 맵 덤프를 필드 이름으로 풀어 찍게 하고, 소스 줄을 덤프와 verifier 로그에 끼우게 하고, 스핀 락 필드의 위치를 알려 준다.</desc>
<rect width="960" height="516" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 05-01 §2</text>

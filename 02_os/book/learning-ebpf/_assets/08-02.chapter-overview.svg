<title id="dt">노드 한 대 안에서 uprobe 와 Cilium 프로그램이 붙는 자리</title><desc id="dd">Pod 네임스페이스의 앱과 libssl 의 SSL_read·SSL_write 에 uprobe·uretprobe 가 붙는다. 호스트 네임스페이스에서는 Pod veth 의 lxc*, cilium_host, cilium_vxlan, 물리 장치에 TC 가, 물리 장치에 XDP 가, 소켓 층에 cgroup connect·sendmsg·recvmsg 프로그램이 붙고, 이 프로그램들은 IP cache·Policy·Service Load Balancer·Connection Tracking 맵과 패킷 메타데이터를 공유한다.</desc>
<rect width="960" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 08-02</text>

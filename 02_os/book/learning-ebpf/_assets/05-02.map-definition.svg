<title id="dt">맵 속성은 매크로가 펼친 타입에 실려 .maps 섹션 BTF 가 된다</title><desc id="dd">my_config 의 선언 네 줄이 타입 이름과 배열 크기로 펼쳐지고, libbpf 가 .maps 섹션의 BTF 를 읽어 BPF_MAP_CREATE 의 인자를 채운다.</desc>
<rect width="960" height="444" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 05-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">맵 속성은 매크로가 펼친 타입에 실려 .maps 섹션 BTF 가 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">type 의 값 1 은 배열 크기에 실립니다</text>
<text x="24" y="104" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">선언</text>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">execve 가 불릴 때마다 hello() 가 돌고 결과는 예제마다 다른 통로로 돌아옵니다</text>

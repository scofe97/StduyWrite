<title id="dt">두 예제가 같은 execve kprobe 에 프로그램을 올리고 결과를 다른 길로 받는다</title><desc id="dd">사용자 공간의 hello.py 와 hello-map.py 가 각자 hello() 를 컴파일해 적재하고 execve 의 kprobe 에 붙인다. execve 가 불릴 때마다 hello() 가 돌고, 결과는 hello.py 에서는 trace_pipe 로, hello-map.py 에서는 counter_table 로 사용자 공간에 돌아온다.</desc>
<rect width="920" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 02-01</text>

<title id="dt">C 소스에서 바이트코드 오프셋과 디스어셈블리로의 변환</title><desc id="dd">C 소스 세 블록과 12개 바이트코드 슬롯 및 역어셈블 대응 관계</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 03-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">C 소스에서 바이트코드 오프셋과 디스어셈블리로의 변환</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">C 소스 줄 · 8바이트 슬롯 오프셋 · opcode 바이트 · 역어셈블 해석</text>
<rect x="24" y="110" width="304" height="160" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="38" y="134" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">bpf_printk()</text>
<text x="38" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">bpf_printk("Hello World %d", counter);</text>
<rect x="24" y="274" width="304" height="96" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="38" y="298" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">counter++</text>
<text x="38" y="320" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">counter++;</text>
<rect x="24" y="374" width="304" height="61" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="38" y="398" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">return</text>
<text x="38" y="420" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">return XDP_PASS;</text>
<rect x="348" y="110" width="584" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="358" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">0:</text>
<text x="392" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">18 (LD_IMM64)</text>
<text x="538" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">r6 = 0 ll</text>
<text x="920" y="128" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">전역 변수 counter 맵 자리 (2슬롯)</text>
<rect x="348" y="143" width="584" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="358" y="161" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">2:</text>
<text x="392" y="161" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">61 (LDX_MEM)</text>
<text x="538" y="161" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">r3 = *(u32 *)(r6 + 0)</text>
<text x="920" y="161" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">counter 값 읽기</text>
<rect x="348" y="176" width="584" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="358" y="194" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">3:</text>
<text x="392" y="194" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">18 (LD_IMM64)</text>
<text x="538" y="194" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">r1 = 0 ll</text>
<text x="920" y="194" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">형식 문자열 맵 자리 (2슬롯)</text>
<rect x="348" y="209" width="584" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="358" y="227" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">5:</text>
<text x="392" y="227" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">b7 (ALU64|MOV)</text>
<text x="538" y="227" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">r2 = 15</text>
<text x="920" y="227" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">형식 문자열 14B + NUL 1B</text>
<rect x="348" y="242" width="584" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="358" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">6:</text>
<text x="392" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">85 (CALL)</text>
<text x="538" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">call 6</text>
<text x="920" y="260" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">헬퍼 bpf_trace_printk 호출</text>
<rect x="348" y="275" width="584" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="358" y="293" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">7:</text>
<text x="392" y="293" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">61 (LDX_MEM)</text>
<text x="538" y="293" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">r1 = *(u32 *)(r6 + 0)</text>
<text x="920" y="293" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">counter 값 다시 읽기</text>
<rect x="348" y="308" width="584" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="358" y="326" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">8:</text>
<text x="392" y="326" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">07 (ALU64|ADD)</text>
<text x="538" y="326" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">r1 += 1</text>
<text x="920" y="326" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">카운터 1 증가</text>
<rect x="348" y="341" width="584" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="358" y="359" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">9:</text>
<text x="392" y="359" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">63 (STX_MEM)</text>
<text x="538" y="359" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">*(u32 *)(r6 + 0) = r1</text>
<text x="920" y="359" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">증가된 값 메모리 저장</text>
<rect x="348" y="374" width="584" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="358" y="392" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">10:</text>
<text x="392" y="392" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">b7 (ALU64|MOV)</text>
<text x="538" y="392" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">r0 = 2</text>
<text x="920" y="392" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">XDP_PASS 반환값</text>
<rect x="348" y="407" width="584" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="358" y="425" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">11:</text>
<text x="392" y="425" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">95 (EXIT)</text>
<text x="538" y="425" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">exit</text>
<text x="920" y="425" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">프로그램 실행 종료</text>
<path d="M 330 190 L 344 190" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<path d="M 330 322 L 344 322" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<path d="M 330 404 L 344 404" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<line x1="12" y1="474" x2="912" y2="474" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="496" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="486" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">bpf_printk · 5명령 7슬롯</text>
<rect x="404" y="486" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="426" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">counter++ · 3명령 3슬롯</text>
<rect x="695" y="486" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="717" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">return · 2명령 2슬롯</text>

<title id="dt">call pc+7 은 오프셋 8 로 가서 exit 로 돌아온다</title><desc id="dd">hello 의 0번 call 이 다음 명령 1 에 7 을 더한 오프셋 8 의 get_opcode 로 가고, exit 가 1번으로 돌려보낸다.</desc>
<rect width="960" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 03-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">call pc+7 은 오프셋 8 로 가서 exit 로 돌아온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">프레임 0 과 프레임 1 이 한 호출에서 주고받는 명령</text>
<rect x="72" y="100" width="176" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="160" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">hello</text>
<text x="160" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프레임 0 · raw_tp</text>
<rect x="392" y="100" width="176" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="480" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">get_opcode</text>
<text x="480" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프레임 1 · noinline</text>
<rect x="712" y="100" width="176" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="800" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">bpf_trace_printk</text>
<text x="800" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">커널 헬퍼</text>
<line x1="160" y1="150" x2="160" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="480" y1="150" x2="480" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="800" y1="150" x2="800" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 170 196 L 468 196" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<rect x="269.36" y="173" width="101.28" height="18" fill="#0D1117"/>
<text x="320.0" y="187" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">0: call pc+7</text>
<rect x="263.4" y="201" width="113.2" height="18" fill="#0D1117"/>
<text x="320.0" y="213" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1 + 7 = 오프셋 8</text>
<path d="M 490 258 L 538 258 L 538 278 L 493 278" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="548" y="264" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">8: r0 = *(u64 *)(r1 +8)</text>
<text x="548" y="281" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">args[1] · 바이트 오프셋 8</text>
<path d="M 470 340 L 172 340" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)" stroke-dasharray="5 4"/>
<rect x="287.96" y="317" width="64.08" height="18" fill="#0D1117"/>
<text x="320.0" y="331" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">9: exit</text>
<rect x="273.08" y="345" width="93.84" height="18" fill="#0D1117"/>
<text x="320.0" y="357" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">r0 = args[1]</text>
<path d="M 170 402 L 218 402 L 218 422 L 173 422" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="228" y="408" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">1: r1 = map[id:193][0]+0</text>
<text x="228" y="425" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">3: r2 = 12 · 4: r3 = r0</text>
<path d="M 170 484 L 788 484" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="384.72" y="461" width="190.56" height="18" fill="#0D1117"/>
<text x="480.0" y="475" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">5: call bpf_trace_printk</text>
<rect x="436.49" y="489" width="87.02000000000001" height="18" fill="#0D1117"/>
<text x="480.0" y="501" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Syscall: %d</text>
<path d="M 170 546 L 218 546 L 218 566 L 173 566" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="228" y="552" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">6: r0 = 0 · 7: exit</text>
<text x="228" y="569" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프레임 0 종료</text>
<line x1="12" y1="600" x2="912" y2="600" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="622" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="612" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">함수 호출</text>
<rect x="209" y="612" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="231" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">복귀</text>
<rect x="279" y="612" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="301" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프레임 안 명령</text>
<rect x="427" y="612" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="449" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">헬퍼 호출</text>

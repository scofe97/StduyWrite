<title id="dt">fd_install 에서 일치하면 monitor 는 알리고 enforce 는 죽인다</title><desc id="dd">cat 이 /etc/shadow 를 열면 커널이 file 을 채운 뒤 fd_install(3, file) 을 부르고 kprobe 가 Tetragon 프로그램을 돌린다. monitor 는 이벤트만 올려 open 이 이미 끝난 뒤 도착하고, enforce 는 같은 자리에서 SIGKILL 을 보내 사용자 공간으로 돌아가기 전에 프로세스를 끝낸다.</desc>
<rect width="960" height="840" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 09-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">fd_install 에서 일치하면 monitor 는 알리고 enforce 는 죽인다</text>

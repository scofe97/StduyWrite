<text x="652" y="170" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">"/etc/shadow"</text>
<rect x="764" y="378" width="168" height="56" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="848" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">filename 복사</text>
<text x="848" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">"/etc/shadow" 열림</text>
<path d="M 260 266 L 260 322 L 366 322" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 456 350 L 456 406 L 758 406" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)" stroke-dasharray="5 4"/>
<path d="M 736 154 L 848 154 L 848 376" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)"/>
<rect x="549.0" y="378" width="118.0" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="608" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">TOCTOU 창</text>
<line x1="24" y1="480" x2="936" y2="480" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="508" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">seccomp-bpf</text>
<text x="150" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">포인터 안 읽음 → 창 없음</text>

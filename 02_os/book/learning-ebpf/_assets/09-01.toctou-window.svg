<title id="dt">읽은 값과 복사된 값 사이의 창</title><desc id="dd">대상 스레드 A 가 openat 을 부르면 입구의 eBPF 가 filename 을 읽어 정책을 통과시킨다. 그 뒤 커널이 복사하기 전에 스레드 B 가 같은 메모리를 덮어쓰면 커널은 덮어쓴 경로를 연다.</desc>
<rect width="960" height="584" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 09-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">읽은 값과 복사된 값 사이의 창</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 메모리가 두 번 읽히는 사이에 값이 바뀝니다</text>
<line x1="24" y1="112" x2="936" y2="112" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="24" y1="196" x2="936" y2="196" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="24" y1="280" x2="936" y2="280" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="24" y1="364" x2="936" y2="364" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="24" y1="448" x2="936" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">공격 스레드 B</text>
<text x="24" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">같은 메모리 접근</text>
<text x="24" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">대상 스레드 A</text>
<text x="24" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">openat 호출</text>
<text x="24" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">eBPF</text>
<text x="24" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">sys_enter</text>
<text x="24" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">커널</text>
<text x="24" y="424" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">인자 복사</text>
<rect x="176" y="210" width="168" height="56" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="260" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">openat</text>
<text x="260" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">filename → "/tmp/x"</text>
<rect x="372" y="294" width="168" height="56" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="456" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">filename 읽기</text>
<text x="456" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">"/tmp/x" · 통과</text>

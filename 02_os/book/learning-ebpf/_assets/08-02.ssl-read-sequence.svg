<title id="dt">진입 probe 가 buf 를 맵에 맡기고 반환 probe 가 같은 키로 평문을 꺼낸다</title><desc id="dd">SSL_read(s, buf, num) 가 불리면 진입 probe 가 PT_REGS_PARM2 의 buf 를 active_ssl_read_args_map 에 pid_tgid 키로 update 한다. 라이브러리가 복호화해 buf 를 채우고 반환하면 반환 probe 가 같은 키로 lookup 해 process_SSL_data 를 부르고, 평문 data_len 바이트(최대 MAX_DATA_SIZE)를 tls_events 로 perf_submit 한 뒤 delete 한다.</desc>

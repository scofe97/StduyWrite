<title id="dt">프로그램 유형이 컨텍스트와 반환값과 헬퍼를 한꺼번에 정한다</title><desc id="dd">kprobe 는 pt_regs 를 받고 0 이나 1 을 돌려 이벤트 기록 여부를 정하며, tracepoint 는 이벤트 레코드를, tracing 은 함수 인자를, XDP 는 xdp_md 를 받고 패킷 처리 방식을 돌려준다. XDP 전용 헬퍼 bpf_xdp_adjust_head 는 kprobe 에서 쓸 수 없다.</desc>
<rect width="960" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 07-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로그램 유형이 컨텍스트와 반환값과 헬퍼를 한꺼번에 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">유형마다 받는 구조체와 돌려주는 값이 다릅니다</text>

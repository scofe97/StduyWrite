<title id="dt">union bpf_attr 안의 명령별 구조체와 돌려받은 값</title><desc id="dd">같은 attr 자리에 BPF_MAP_CREATE·BPF_PROG_LOAD·BPF_MAP_UPDATE_ELEM 이 서로 다른 필드 묶음을 채우고, 반환값은 fd 5·6 과 0 이다.</desc>
<rect width="960" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 04-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">union bpf_attr 안의 명령별 구조체와 돌려받은 값</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세 호출이 같은 union 의 다른 구조체를 씁니다</text>
<rect x="16" y="100" width="928" height="232" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="32" y="92" width="124" height="16" fill="#0D1117"/>
<text x="40" y="105" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">union bpf_attr</text>
<rect x="40" y="132" width="280" height="176" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.2"/>
<text x="56" y="160" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">BPF_MAP_CREATE</text>
<text x="56" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">map_type=BPF_MAP_TYPE_HASH</text>
<text x="56" y="216" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">key_size=4</text>
<text x="56" y="240" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">value_size=12</text>
<text x="56" y="264" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">max_entries=10240</text>
<text x="56" y="288" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">btf_fd=3</text>
<path d="M 180 334 L 180 372" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)"/>
<rect x="156.88" y="382" width="46.24" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="180" y="396" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#3FB98C">fd 5</text>
<rect x="336" y="132" width="280" height="176" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.2"/>
<text x="352" y="160" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">BPF_PROG_LOAD</text>
<text x="352" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">prog_type=BPF_PROG_TYPE_KPROBE</text>
<text x="352" y="216" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">insn_cnt=44</text>
<text x="352" y="240" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">license="GPL"</text>
<text x="352" y="264" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">expected_attach_type=0</text>
<text x="352" y="288" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">prog_btf_fd=3</text>
<path d="M 476 334 L 476 372" fill="none" stroke="#E3B341" stroke-width="1.6" marker-end="url(#warn)"/>
<rect x="452.88" y="382" width="46.24" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="476" y="396" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#E3B341">fd 6</text>
<rect x="632" y="132" width="280" height="176" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.2"/>
<text x="648" y="160" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">BPF_MAP_UPDATE_ELEM</text>
<text x="648" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">map_fd=5</text>
<text x="648" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">key=포인터</text>
<text x="648" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">value=포인터</text>
<text x="648" y="264" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">flags=BPF_ANY (0)</text>
<path d="M 772 334 L 772 372" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)"/>
<rect x="760.97" y="382" width="22.060000000000002" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="772" y="396" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#6A95D8">0</text>

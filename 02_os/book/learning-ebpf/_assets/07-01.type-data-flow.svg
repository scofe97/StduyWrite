<title id="dt">두 kprobe 는 다른 헬퍼로 읽어 같은 data.path 를 채운다</title><desc id="dd">__x64_sys_execve 의 pathname 은 사용자 공간 포인터라 bpf_probe_read_user_str 로, do_execve 의 filename 은 커널 구조체라 BPF_CORE_READ 와 bpf_probe_read_kernel_str 로 읽는다. 둘 다 data.path 에 /bin/ls 가 들어가 bpf_perf_event_output 으로 나간다. do_execve 는 v7.0 에서 제거됐다.</desc>
<rect width="1000" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 07-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">두 kprobe 는 다른 헬퍼로 읽어 같은 data.path 를 채운다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">읽는 헬퍼가 포인터의 주소 공간을 따라갑니다</text>

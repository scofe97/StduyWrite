<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">hello.bpf.o 의 두 섹션이 맵 두 개와 명령 둘로 이어집니다</text>

<title id="dt">전역 변수와 문자열은 두 배열 맵에 산다</title><desc id="dd">counter 는 맵 165 의 값 4B 로, 형식 문자열은 맵 166 의 값 15B 로 적재되고 명령이 맵을 가리켜 읽고 쓴다.</desc>
<rect width="960" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 03-02 §3</text>

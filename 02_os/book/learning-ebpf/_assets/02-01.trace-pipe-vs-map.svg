<title id="dt">trace_pipe 는 하나라 줄이 섞이고 맵은 프로그램마다 따로 만든다</title><desc id="dd">위쪽은 프로그램 A 와 B 가 bpf_trace_printk 로 같은 trace_pipe 에 쓴 문자열이 한 흐름으로 섞이는 모습이다. 아래쪽은 같은 두 프로그램이 각자 만든 맵에 쓰고 사용자 공간이 필요한 맵만 골라 읽는 모습이다.</desc>
<rect width="920" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 02-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">trace_pipe 는 하나라 줄이 섞이고 맵은 프로그램마다 따로 만든다</text>

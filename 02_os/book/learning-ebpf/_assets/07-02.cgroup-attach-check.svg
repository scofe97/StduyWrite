<title id="dt">CGROUP_SOCK 적재는 attach type 을 채운 뒤 네 자리만 통과시킨다</title><desc id="dd">expected_attach_type 이 0 이면 bpf_prog_load_fixup_attach_type 이 BPF_CGROUP_INET_SOCK_CREATE 로 채우고, bpf_prog_load_check_attach 의 switch 가 네 값만 0 으로 통과시키고 나머지는 -EINVAL 로 거부한다.</desc>

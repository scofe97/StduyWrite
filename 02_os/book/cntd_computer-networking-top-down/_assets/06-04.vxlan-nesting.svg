<title id="dt">이더넷 프레임을 UDP 에 담아 IP 로 나릅니다</title><desc id="dd">서니베일의 호스트가 방갈로르의 MAC 주소로 보낸 이더넷 프레임이, VTEP 두 끝 사이 터널을 지나 그대로 도착한다.</desc>
<rect width="1000" height="530" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 6.5.2 · VXLAN</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이더넷 프레임을 UDP 에 담아 IP 로 나릅니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">구성과 수치는 원문 §6.5.2 · Figure 6.30 그대로입니다</text>
<rect x="40" y="116" width="240" height="108" rx="7" fill="#161B22" stroke="#3FB98C55" stroke-width="1.2"/>
<text x="160" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">서니베일 이더넷</text>
<text x="160" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">호스트 A</text>
<text x="160" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">목적지 MAC 은 호스트 B</text>
<text x="160" y="210" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">VTEP x</text>
<rect x="720" y="116" width="240" height="108" rx="7" fill="#161B22" stroke="#3FB98C55" stroke-width="1.2"/>
<text x="840" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">방갈로르 이더넷</text>
<text x="840" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">호스트 B</text>
<text x="840" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">원래 프레임 그대로 받습니다</text>
<text x="840" y="210" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">VTEP y</text>
<rect x="304" y="116" width="392" height="108" rx="7" fill="#6A95D80E" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">IP 망 — 안에 무엇이 든지 모릅니다</text>
<text x="500" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">VTEP y 를 목적지로 하는</text>
<text x="500" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평범한 IP 데이터그램 하나로 보입니다</text>
<path d="M 284 170 L 300 170" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 700 170 L 716 170" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="40" y="264" width="920" height="168" rx="7" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500.0" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">IP 데이터그램 — 목적지는 VTEP y</text>
<rect x="80" y="300" width="840" height="116" rx="7" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500.0" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">UDP 데이터그램</text>
<rect x="120" y="336" width="760" height="64" rx="7" fill="#F08A591E" stroke="#F08A59" stroke-width="1.5"/>
<text x="500.0" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">VXLAN 헤더 + 원래 이더넷 프레임 전체</text>
<text x="500" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">출발지 MAC A · 목적지 MAC B 가 그대로 들어 있습니다</text>
<line x1="24" y1="452" x2="952" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">VXLAN 헤더의 24 비트 VNI 가 확장 LAN 마다 1600 만 개의 VXLAN 을 식별합니다. 802.1Q VLAN 이 12 비트 식별자로 4,096 개에 묶인 것과 대비됩니다.</text>
<line x1="12" y1="490" x2="952" y2="490" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="512" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="502" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바깥이 통째로 삼키는 것</text>
<rect x="313" y="502" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="335" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">감싸는 계층</text>
<rect x="435" y="502" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="457" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">두 이더넷 세그먼트</text>
</svg>
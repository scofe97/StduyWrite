<title id="dt">TLS 는 내용을 가리지 그 사실을 가리지 않습니다</title><desc id="dd">출발지 주소는 사이트에 그대로 제시되고 목적지 주소는 ISP 가 엿본다. 그래서 프록시를 겹친다.</desc>
<rect width="1000" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 8.9.1 · ANONYMITY AND PRIVACY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TLS 는 내용을 가리지 그 사실을 가리지 않습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세 요구와 TOR 의 사슬 구조는 원문 곁상자의 것입니다</text>
<text x="24" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">TLS 만 썼을 때 — 셋 중 둘이 실패합니다</text>
<rect x="24" y="144" width="304" height="60" rx="6" fill="#F0616D16" stroke="#F0616D" stroke-width="1.2"/>
<text x="176" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">사이트에 내 IP 를 안 드러내기</text>
<text x="176" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">실패</text>
<rect x="348" y="144" width="304" height="60" rx="6" fill="#F0616D16" stroke="#F0616D" stroke-width="1.2"/>
<text x="500" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">ISP 가 방문을 모르게</text>
<text x="500" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">실패</text>
<rect x="672" y="144" width="304" height="60" rx="6" fill="#3FB98C16" stroke="#3FB98C" stroke-width="1.2"/>
<text x="824" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">ISP 가 데이터를 못 보게</text>
<text x="824" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">성공</text>
<text x="24" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">프록시 하나 + TLS</text>
<rect x="24" y="252" width="152" height="64" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="100" y="290" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">나</text>
<rect x="216" y="252" width="152" height="64" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="292" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">프록시</text>
<text x="292" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">TLS 로 감쌈</text>
<rect x="408" y="252" width="152" height="64" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="484" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">사이트</text>
<text x="484" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">프록시 IP 만 봅니다</text>
<path d="M 178 284 L 212 284" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 370 284 L 404 284" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="608" y="252" width="368" height="64" rx="7" fill="#E3B34114" stroke="#E3B341" stroke-width="1.3"/>
<text x="792" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">프록시는 전부 압니다</text>
<text x="792" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">내 IP · 사이트 IP · 오가는 평문</text>
<text x="24" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">TOR — 담합하지 않는 프록시 셋을 무작위로</text>
<rect x="24" y="368" width="136" height="56" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="92" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">나</text>
<rect x="200" y="368" width="136" height="56" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.3"/>
<text x="268" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">프록시 1</text>
<rect x="376" y="368" width="136" height="56" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.3"/>
<text x="444" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">프록시 2</text>
<rect x="552" y="368" width="136" height="56" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.3"/>
<text x="620" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">프록시 3</text>
<rect x="728" y="368" width="136" height="56" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="796" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">사이트</text>
<path d="M 162 396 L 196 396" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<path d="M 338 396 L 372 396" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<path d="M 514 396 L 548 396" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<path d="M 690 396 L 724 396" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<text x="24" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">담합하지 않는다면 내 IP 와 목적지 사이에 통신이 있었다는 것을 아무도 모릅니다.</text>
<text x="24" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">마지막 프록시와 서버 사이는 평문이지만, 그 프록시는 평문을 주고받는 IP 가 누구인지 모릅니다.</text>
<line x1="12" y1="516" x2="952" y2="516" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="528" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실패하는 요구</text>
<rect x="235" y="528" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="257" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">되는 요구</text>
<rect x="344" y="528" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="366" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프록시 하나의 한계</text>
<rect x="518" y="528" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="540" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사슬</text>
</svg>
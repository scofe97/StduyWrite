<title id="dt">AS 경계를 그으면 두 문제가 풀립니다</title><desc id="dd">위 그림과 같은 라우터를 자율 시스템으로 묶은 뒤의 구조. 같은 AS 안은 그 AS 가 고른 라우팅 프로토콜이, AS 사이는 BGP 가 맡는다. 아래 두 칸이 규모와 관리 자율성 문제가 풀리는 방식이다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.3 · AUTONOMOUS SYSTEMS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">AS 경계를 그으면 두 문제가 풀립니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 그림과 같은 라우터를 자율 시스템으로 묶었습니다. 아래 두 칸은 위 그림의 두 칸에 한 줄씩 대응합니다.</text>

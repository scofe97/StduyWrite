<title id="dt">미리 만나지 않아도 비밀을 보낼 수 있습니다</title><desc id="dd">밥의 공개키는 온 세상이 가져다 쓴다. 그런데도 열 수 있는 사람은 개인키를 쥔 밥뿐이다.</desc>
<rect width="1000" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 8.2.2 · PUBLIC KEY CRYPTOGRAPHY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">미리 만나지 않아도 비밀을 보낼 수 있습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">기호와 흐름은 원문 Figure 8.6 의 것입니다</text>
<text x="380.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">1 · 공개키를 가져옴</text>
<text x="612.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">2 · 공개키로 잠금</text>
<text x="844.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">3 · 개인키로 엶</text>
<line x1="264" y1="132" x2="960" y2="132" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="24" y="140" width="216" height="88" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="132" y="189.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">앨리스</text>
<rect x="270" y="152" width="220" height="64" rx="4" fill="#6A95D820" stroke="#6A95D8" stroke-width="1.2"/>
<text x="380.0" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">밥의 공개키 K_B+</text>
<text x="380.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">를 받아 옵니다</text>
<rect x="502" y="152" width="220" height="64" rx="4" fill="#6A95D820" stroke="#6A95D8" stroke-width="1.2"/>
<text x="612.0" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">K_B+(m) 을</text>
<text x="612.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">계산해 보냅니다</text>
<rect x="734" y="152" width="220" height="64" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="24" y="240" width="216" height="88" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="132" y="289.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">밥</text>
<rect x="270" y="252" width="220" height="64" rx="4" fill="#3FB98C20" stroke="#3FB98C" stroke-width="1.2"/>
<text x="380.0" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">K_B+ 를 온</text>
<text x="380.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">세상에 내놓습니다</text>
<rect x="502" y="252" width="220" height="64" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="734" y="252" width="220" height="64" rx="4" fill="#3FB98C20" stroke="#3FB98C" stroke-width="1.2"/>
<text x="844.0" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">K_B-(K_B+(m)) = m</text>
<text x="844.0" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">을 계산합니다</text>
<rect x="24" y="340" width="216" height="88" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="132" y="389.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">트루디</text>
<rect x="270" y="352" width="220" height="64" rx="4" fill="#F0616D20" stroke="#F0616D" stroke-width="1.2"/>
<text x="380.0" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">K_B+ 를 똑같이</text>
<text x="380.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">가질 수 있습니다</text>
<rect x="502" y="352" width="220" height="64" rx="4" fill="#F0616D20" stroke="#F0616D" stroke-width="1.2"/>
<text x="612.0" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">암호문을 볼</text>
<text x="612.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">수 있습니다</text>
<rect x="734" y="352" width="220" height="64" rx="4" fill="#F0616D20" stroke="#F0616D" stroke-width="1.2"/>
<text x="844.0" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">K_B- 가 없어</text>
<text x="844.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">열지 못합니다</text>
<rect x="24" y="456" width="952" height="60" rx="8" fill="#F08A5916" stroke="#F08A59" stroke-width="1.4"/>
<text x="44" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">순서를 뒤집어도 같은 결과가 나옵니다</text>
<text x="44" y="504" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">K_B-(K_B+(m)) = K_B+(K_B-(m)) = m  —  이 대칭이 뒤에서 디지털 서명이 됩니다</text>
<line x1="12" y1="536" x2="952" y2="536" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="558" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="548" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앨리스</text>
<rect x="183" y="548" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="205" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">밥</text>
<rect x="240" y="548" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="262" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">트루디</text>
<rect x="323" y="548" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="345" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">뒤집기</text>
</svg>
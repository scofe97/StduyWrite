<title id="dt">떠난 자리가 공짜가 되어 다시 그리로 몰립니다</title><desc id="dd">네 노드가 고리를 이루고 x·y·z 가 모두 w 로 보내는 망에서 링크 비용을 그 링크의 부하와 같게 두면, 트래픽이 두 상태를 회차마다 오가며 멈추지 않는다.</desc>
<rect width="1000" height="730" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.2.1 · ROUTE OSCILLATION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">떠난 자리가 공짜가 되어 다시 그리로 몰립니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">링크 비용이 곧 그 링크가 지금 나르는 양입니다 — 비면 싸지고 몰리면 비싸집니다</text>
<rect x="20" y="150" width="440" height="360" rx="10" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="240" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">회차 N — 반시계로 쏠림</text>
<line x1="240" y1="220" x2="86" y2="330" stroke="#6A95D8" stroke-width="1.1"/>
<line x1="86" y1="330" x2="240" y2="440" stroke="#6A95D8" stroke-width="1.1"/>
<line x1="240" y1="440" x2="394" y2="330" stroke="#F08A59" stroke-width="2.8"/>
<line x1="394" y1="330" x2="240" y2="220" stroke="#F08A59" stroke-width="2.8"/>
<rect x="218" y="204" width="44" height="32" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="240" y="225" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">w</text>
<rect x="64" y="314" width="44" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="86" y="335" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">x</text>
<rect x="372" y="314" width="44" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="394" y="335" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">z</text>
<rect x="218" y="424" width="44" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="240" y="445" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">y</text>
<text x="240" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">목적지</text>
<text x="372" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">몰려서 비쌈</text>
<text x="108" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">비어서 공짜</text>
<text x="240" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시계 쪽이 비어 공짜 · 다음 회차에 다들 그리로 감</text>
<rect x="540" y="150" width="440" height="360" rx="10" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="760" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">회차 N+1 — 시계로 쏠림</text>
<line x1="760" y1="220" x2="606" y2="330" stroke="#F08A59" stroke-width="2.8"/>
<line x1="606" y1="330" x2="760" y2="440" stroke="#F08A59" stroke-width="2.8"/>
<line x1="760" y1="440" x2="914" y2="330" stroke="#6A95D8" stroke-width="1.1"/>
<line x1="914" y1="330" x2="760" y2="220" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="738" y="204" width="44" height="32" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="760" y="225" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">w</text>
<rect x="584" y="314" width="44" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="606" y="335" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">x</text>
<rect x="892" y="314" width="44" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="914" y="335" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">z</text>
<rect x="738" y="424" width="44" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="760" y="445" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">y</text>
<text x="760" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">목적지</text>
<text x="628" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">몰려서 비쌈</text>
<text x="892" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">비어서 공짜</text>
<text x="760" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이번엔 반시계가 비어 공짜 · 그다음 회차에 되돌아감</text>
<path d="M 474 300 L 526 300" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)"/>
<path d="M 526 344 L 474 344" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)"/>
<text x="500" y="290" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">한 회차</text>
<text x="500" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">마다 뒤집힘</text>
<rect x="300" y="528" width="400" height="34" rx="7" fill="#F0616D12" stroke="#F0616D" stroke-width="1.3"/>
<text x="500" y="550" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">지금 싸다 = 곧 비싸진다</text>
<text x="20" y="596" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">y 가 시계로 옮기면 x-w 링크가 그만큼 비싸지고, 비어 버린 y-z·z-w 는 그 순간 싸짐 · 다음 회차에 그것을 본 셋이 다 같이 되돌아감</text>
<text x="20" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 값 → 같은 판단 → 함께 이동 → 옮겨 간 자리가 곧바로 비싸짐</text>
<text x="20" y="640" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">처방은 링크 광고 시각에 무작위를 섞는 것 · 따로 돌기 시작해도 결국 발이 맞아 버리기 때문입니다(자기 동기화).</text>
<line x1="12" y1="672" x2="952" y2="672" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="694" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="684" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="694" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">몰려서 비싸진 링크</text>
<rect x="274" y="684" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="296" y="694" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">비어서 공짜가 된 링크</text>
<rect x="474" y="684" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="496" y="694" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">회차마다 뒤집힘</text>
</svg>
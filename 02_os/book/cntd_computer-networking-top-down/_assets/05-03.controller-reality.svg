<title id="dt">컨트롤러는 서버 위에서 도는 소프트웨어입니다</title><desc id="dd">논리적으로 중앙인 SDN 컨트롤러가 실제로는 여러 서버에 흩어져 상태를 복제하고, 스위치에게는 하나의 서비스로 보이는 배치. 서버끼리는 합의로 이야기하고, 스위치와는 남향 인터페이스로 이야기한다.</desc>

<text x="620" y="368" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">OpenFlow</text>
<text x="12" y="584" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">스위치는 서버가 몇 대인지 모릅니다. 하나의 컨트롤러와 이야기한다고 여깁니다.</text>
<text x="12" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">서버를 나누는 이유는 장애 대비와 성능입니다. 쓰기를 한 서버가 맡는 이 모양은 여러 구현 가운데 하나입니다.</text>

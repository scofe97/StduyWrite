<line x1="24" y1="336" x2="892" y2="336" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="358" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 무선 링크는 신뢰 전달을 두고, 광·동축·트위스티드페어 같은 저오류 링크는 두지 않습니다. 저오류 링크에서는 그 기능이 불필요한 오버헤드가 됩니다.</text>

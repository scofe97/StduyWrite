<title id="dt">고치는 자리가 되돌아가는 거리를 정합니다</title><desc id="dd">무선 링크에서 비트가 뒤집혔을 때, 링크 계층이 그 자리에서 고치면 한 칸을 되돌아가고 트랜스포트가 고치면 여섯 칸을 되돌아간다.</desc>

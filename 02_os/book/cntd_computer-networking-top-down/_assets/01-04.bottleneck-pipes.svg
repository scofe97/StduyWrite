<title id="dt">처리량은 가장 좁은 곳의 폭입니다</title><desc id="dd">원문 1.4.4 의 두 예. 링크 둘이면 좁은 쪽 1 Mbps 가 처리량이고, 코어 링크 5 Mbps 를 열이 나누면 내 몫 0.5 Mbps 가 접속 링크 1 Mbps 보다 좁아져 병목이 코어로 옮겨 간다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 01-04 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">처리량은 가장 좁은 곳의 폭입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">띠의 굵기가 초당 흐르는 양입니다. 위아래 그림의 눈금은 같습니다</text>
<text x="24" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">링크 둘만 있을 때 — 처리량은 좁은 쪽</text>
<text x="226.0" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">보내는 쪽 링크</text>
<text x="506.0" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">가운데 링크</text>
<text x="786.0" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">받는 쪽</text>
<path d="M 232 210 C 366.0 210 366.0 226 500 226 L 500 250 C 366.0 250 366.0 234 232 234 Z" fill="#8B98A9" opacity="0.18"/>
<path d="M 512 226 C 646.0 226 646.0 226 780 226 L 780 250 C 646.0 250 646.0 250 512 250 Z" fill="#8B98A9" opacity="0.18"/>
<path d="M 232 186 C 366.0 186 366.0 186 500 186 L 500 210 C 366.0 210 366.0 210 232 210 Z" fill="#F08A59" opacity="0.28"/>
<path d="M 512 186 C 646.0 186 646.0 186 780 186 L 780 210 C 646.0 210 646.0 210 512 210 Z" fill="#F08A59" opacity="0.28"/>
<rect x="220" y="186" width="12" height="48" fill="#F5F5F3"/>
<rect x="500" y="186" width="12" height="24" fill="#F5F5F3"/>
<rect x="500" y="226" width="12" height="24" fill="#F5F5F3"/>
<rect x="780" y="186" width="12" height="24" fill="#F5F5F3"/>
<rect x="780" y="226" width="12" height="24" fill="#F5F5F3"/>
<text x="210" y="214.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서버 링크 Rs</text>
<text x="210" y="229.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">2 Mbps</text>
<text x="506.0" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">접속 링크 Rc</text>
<text x="506.0" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">1 Mbps</text>
<text x="506.0" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Rs 의 남는 폭</text>
<text x="506.0" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1 Mbps 놀림</text>
<text x="802" y="202.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트 처리량</text>
<text x="802" y="217.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">min{2, 1} = 1 Mbps</text>
<text x="802" y="242.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">쓰이지 않음</text>
<text x="802" y="257.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">1 Mbps</text>
<text x="24" y="306" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">코어 링크를 열이 나눌 때 — 병목이 코어로 옮겨 감</text>
<text x="226.0" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">보내는 쪽 링크</text>
<text x="506.0" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">가운데 링크</text>
<text x="786.0" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">받는 쪽</text>
<path d="M 232 374 C 366.0 374 366.0 390 500 390 L 500 498 C 366.0 498 366.0 482 232 482 Z" fill="#8B98A9" opacity="0.18"/>
<path d="M 512 390 C 646.0 390 646.0 390 780 390 L 780 498 C 646.0 498 646.0 498 512 498 Z" fill="#8B98A9" opacity="0.18"/>
<path d="M 232 362 C 366.0 362 366.0 362 500 362 L 500 374 C 366.0 374 366.0 374 232 374 Z" fill="#F08A59" opacity="0.28"/>
<path d="M 512 362 C 646.0 362 646.0 362 780 362 L 780 374 C 646.0 374 646.0 374 512 374 Z" fill="#F08A59" opacity="0.28"/>
<rect x="220" y="362" width="12" height="120" fill="#F5F5F3"/>
<rect x="500" y="362" width="12" height="12" fill="#F5F5F3"/>
<rect x="500" y="390" width="12" height="108" fill="#F5F5F3"/>
<rect x="780" y="362" width="12" height="12" fill="#F5F5F3"/>
<rect x="780" y="390" width="12" height="108" fill="#F5F5F3"/>
<text x="210" y="426.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">코어 공유 링크 R</text>
<text x="210" y="441.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">5 Mbps · 다운로드 열이 지남</text>
<text x="506.0" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">내 다운로드 몫</text>
<text x="506.0" y="358" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">5 ÷ 10 = 0.5 Mbps</text>
<text x="506.0" y="518" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">다른 아홉의 몫</text>
<text x="506.0" y="532" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">4.5 Mbps</text>
<text x="802" y="372.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">내 접속 링크 Rc 에 0.5 만 흐름</text>
<text x="802" y="387.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Rc 1 Mbps 의 절반</text>
<text x="802" y="448.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">다른 클라이언트 아홉</text>
<text x="802" y="463.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">각 0.5 Mbps</text>
<line x1="12" y1="596" x2="952" y2="596" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="618" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="608" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실제 흐름 — 병목의 폭</text>
<rect x="313" y="608" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="335" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">놀거나 남에게 간 폭</text>
</svg>
<title id="dt">비어 있어도 바로 보내지 않고 세면서 기다립니다</title><desc id="dd">유선과 달리 무선은 보내는 중에 충돌을 못 본다. 그래서 부딪히고 나서 멈추는 대신 부딪힐 일을 줄인다.</desc>
<rect width="940" height="612" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 7.3.1 · CSMA/CA</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">비어 있어도 바로 보내지 않고 세면서 기다립니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">네 단계와 대기 이름은 원문 §7.3.1 의 것입니다</text>
<rect x="24" y="140" width="140" height="76" rx="8" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="94.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">채널 감지</text>
<text x="94.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">보낼 프레임이 생김</text>
<rect x="208" y="140" width="140" height="76" rx="8" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="278.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">DIFS 만큼 대기</text>
<text x="278.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">짧은 고정 시간</text>
<rect x="392" y="140" width="140" height="76" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="462.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">전체 프레임 전송</text>
<text x="462.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">중간에 멈추지 않음</text>
<rect x="576" y="140" width="140" height="76" rx="8" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="646.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">ACK 대기</text>
<text x="646.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">SIFS 뒤 응답이 옴</text>
<rect x="760" y="140" width="140" height="76" rx="8" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="830.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">완료</text>
<text x="830.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">다음 프레임으로</text>
<rect x="208" y="286" width="140" height="76" rx="8" fill="#8B98A912" stroke="#8B98A9" stroke-width="1.2"/>
<text x="278.0" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">백오프 값 선택</text>
<text x="278.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">이진 지수 백오프</text>
<rect x="392" y="286" width="140" height="76" rx="8" fill="#8B98A912" stroke="#8B98A9" stroke-width="1.2"/>
<text x="462.0" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">카운트다운</text>
<text x="462.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">바쁘면 값을 얼립니다</text>
<path d="M 168 178.0 L 204 178.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="186.0" y="166.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">비었음</text>
<path d="M 536 178.0 L 572 178.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 720 178.0 L 756 178.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="738.0" y="166.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">성공</text>
<path d="M 352 324.0 L 388 324.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 352 178.0 L 388 178.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 94.0 220 L 94.0 324.0 L 204 324.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="102.0" y="312.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">바빴음</text>
<path d="M 462.0 282 L 462.0 220" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="472.0" y="255.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">0 이 되면</text>
<path d="M 646.0 220 L 646.0 408 L 278.0 408 L 278.0 366" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)" stroke-dasharray="5 5"/>
<text x="462.0" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">ACK 이 안 오면 더 넓은 구간에서 다시 고릅니다</text>
<rect x="24" y="452" width="880" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">유선의 CSMA/CD 와 갈리는 자리</text>
<text x="44" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보내면서 받을 수 없어 자기 송신에 묻힌 충돌을 못 봅니다. 그래서 한 번 시작하면 끝까지 보냅니다.</text>
<text x="44" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">충돌한 프레임을 통째로 버리므로, 부딪히고 멈추는 대신 세면서 기다려 부딪힐 일을 줄입니다.</text>
<line x1="12" y1="556" x2="892" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="568" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 경로</text>
<rect x="209" y="568" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전송</text>
<rect x="279" y="568" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="301" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">카운트다운 완료</text>
<rect x="427" y="568" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="449" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재시도</text>
</svg>
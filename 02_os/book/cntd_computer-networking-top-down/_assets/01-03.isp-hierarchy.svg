<title id="dt">네트워크의 네트워크 — 구조 5</title><desc id="dd">원문이 구조 1에서 5까지 쌓아 올린 결과. 계층은 성능이 아니라 경제와 정책이 만든 것이고, 위로 갈수록 돈을 받는다. 콘텐츠 제공자는 자기 망을 지어 그 계층을 건너뛴다.</desc>
<rect width="980" height="608" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 01-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">네트워크의 네트워크 — 구조 5</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원문의 표현대로 이 진화의 상당 부분은 성능이 아니라 경제와 국가 정책이 이끌었습니다</text>

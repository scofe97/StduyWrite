<title id="dt">티어 사이 연결을 늘리고 층을 줄입니다</title><desc id="dd">TOR 하나를 티어 2 스위치 여럿에 붙이면 랙 사이에 서로 겹치지 않는 경로가 여럿 생긴다. 그 끝이 잎과 등뼈 두 층짜리 구조다.</desc>

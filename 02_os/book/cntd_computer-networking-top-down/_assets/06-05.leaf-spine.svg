<rect x="24" y="392" width="452" height="92" rx="7" fill="#161B22" stroke="#6A95D844" stroke-width="1.2"/>
<text x="40" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">연결을 늘리면 무엇을 얻나</text>
<line x1="40" y1="424" x2="460" y2="424" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="40" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">·  티어 2 둘 사이에 겹치지 않는 경로가 넷, 합쳐서 400 Gbps 입니다</text>
<text x="40" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">·  용량만이 아니라 경로 다양성 덕분에 신뢰성도 함께 오릅니다</text>
<text x="40" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">·  페이스북은 TOR 하나를 티어 2 열여섯 개에 붙입니다</text>
<rect x="524" y="392" width="452" height="92" rx="7" fill="#161B22" stroke="#F08A5944" stroke-width="1.2"/>
<text x="540" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">층을 줄이면 무엇을 얻나</text>
<line x1="540" y1="424" x2="960" y2="424" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="540" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">·  접근 스위치 너머 통신이 정확히 스위치 두 홉으로 고정됩니다</text>
<text x="540" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">·  용량은 링크 속도를 올리거나 등뼈를 옆으로 더 놓아 늘립니다</text>
<text x="540" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">·  서버끼리 오가는 동서 트래픽이 늘어난 것이 이 변화의 배경입니다</text>
<line x1="24" y1="504" x2="952" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여러 층으로 쌓은 이런 상호 연결망을 Clos 망이라 부릅니다. 전화 교환을 연구한 Charles Clos 의 이름에서 왔습니다.</text>
<line x1="12" y1="542" x2="952" y2="542" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

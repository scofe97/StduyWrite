<title id="dt">경계가 없으면 가정이 두 곳에서 무너집니다</title><desc id="dd">앞 편의 가정을 인터넷 크기로 늘린 모습. AS 경계 없이 모든 라우터가 같은 알고리즘을 돌리고 서로를 알아야 해서, 규모와 관리 자율성 두 곳에서 문제가 생긴다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.3 · BEFORE AUTONOMOUS SYSTEMS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">경계가 없으면 가정이 두 곳에서 무너집니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앞 편의 가정을 인터넷 크기로 늘린 모습입니다. 라우터 배치는 아래 해결 그림과 같고, AS 경계만 아직 없습니다.</text>

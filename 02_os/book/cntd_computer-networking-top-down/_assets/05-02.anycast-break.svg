<title id="dt">주소는 그대로인데 받는 기계가 바뀌면 연결이 끊깁니다</title><desc id="dd">도쿄와 LA 인스턴스가 같은 주소 203.0.113.9 를 광고한다. 경로가 도쿄일 때 맺은 TCP 연결의 상태는 도쿄에만 있다. BGP 가 LA 쪽 경로로 갈아타면 같은 연결의 다음 세그먼트가 상태 없는 LA 에 도착하고, LA 는 맞는 소켓이 없어 리셋을 돌려준다.</desc>
<rect width="1000" height="688" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.4.4 · WHY CDNS AVOID ANYCAST</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">주소는 그대로인데 받는 기계가 바뀌면 연결이 끊깁니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위는 경로가 바뀌기 전, 아래는 바뀐 뒤입니다. 사용자는 아무것도 하지 않았습니다.</text>
<rect x="24" y="104" width="952" height="192" rx="10" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">1. 경로가 바뀌기 전</text>
<path d="M 192 204 L 308 204" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="250" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">연결 맺기</text>
<path d="M 472 196 L 556 196 L 556 172 L 636 172" fill="none" stroke="#3FB98C" stroke-width="1.8" marker-end="url(#ok)"/>
<path d="M 472 212 L 556 212 L 556 244 L 636 244" fill="none" stroke="#8B98A9" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="48" y="176" width="144" height="56" rx="7" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="120.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">사용자</text>
<text x="120.0" y="220" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">198.51.100.7</text>
<rect x="312" y="176" width="160" height="56" rx="7" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="392.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">경로 위 라우터</text>
<text x="392.0" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">최선 경로: 도쿄</text>
<rect x="640" y="144" width="200" height="56" rx="7" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="740.0" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">도쿄 인스턴스</text>
<text x="740.0" y="188" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">203.0.113.9</text>
<rect x="640" y="216" width="200" height="56" rx="7" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="740.0" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">LA 인스턴스</text>
<text x="740.0" y="260" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">203.0.113.9</text>
<rect x="870.0" y="160" width="76" height="24" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="908" y="177" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">소켓 있음</text>
<text x="740" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">LA 광고도 받았지만 지금은 덜 좋은 경로</text>
<text x="500" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">BGP 가 경로를 다시 고름 · 이제 LA 쪽 광고가 이김</text>
<rect x="24" y="328" width="952" height="236" rx="10" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">2. 경로가 바뀐 뒤</text>
<path d="M 192 428 L 308 428" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="250" y="416" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">다음 세그먼트</text>
<path d="M 472 420 L 556 420 L 556 396 L 636 396" fill="none" stroke="#8B98A9" stroke-width="1.4" stroke-dasharray="4 3"/>
<path d="M 472 436 L 556 436 L 556 468 L 636 468" fill="none" stroke="#E3B341" stroke-width="1.8" marker-end="url(#warn)"/>
<rect x="48" y="400" width="144" height="56" rx="7" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="120.0" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">사용자</text>
<text x="120.0" y="444" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">198.51.100.7</text>
<rect x="312" y="400" width="160" height="56" rx="7" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="392.0" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">경로 위 라우터</text>
<text x="392.0" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">최선 경로: LA</text>
<rect x="640" y="368" width="200" height="56" rx="7" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="740.0" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">도쿄 인스턴스</text>
<text x="740.0" y="412" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">203.0.113.9</text>
<rect x="640" y="440" width="200" height="56" rx="7" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="740.0" y="464" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">LA 인스턴스</text>
<text x="740.0" y="484" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">203.0.113.9</text>
<rect x="870.0" y="384" width="76" height="24" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="908" y="401" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">소켓 있음</text>
<rect x="870.0" y="456" width="76" height="24" rx="4" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="908" y="473" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">소켓 없음</text>
<path d="M 740 496 L 740 528 L 120 528 L 120 460" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<text x="430" y="548" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">RST · LA 에 이 연결의 소켓이 없음 (노트의 읽기)</text>
<text x="24" y="596" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">주소는 끝까지 203.0.113.9 하나인데 그 주소를 받는 기계가 도쿄에서 LA 로 바뀌었음</text>
<text x="24" y="620" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">연결 상태는 도쿄 메모리에만 → LA 는 이 세그먼트를 모름 · 사용자에게는 연결 끊김</text>
<line x1="12" y1="640" x2="952" y2="640" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="662" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="652" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="662" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">연결 상태가 있는 곳</text>
<rect x="287" y="652" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="309" y="662" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">BGP 가 새로 고른 경로</text>
<rect x="513" y="652" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="535" y="662" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">상태가 없는 곳</text>
<rect x="661" y="652" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="683" y="662" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">리셋 · 노트의 읽기</text>
<text x="960" y="680" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">KUROSE-ROSS 9E 5.4.4 / RFC 5737</text>
</svg>
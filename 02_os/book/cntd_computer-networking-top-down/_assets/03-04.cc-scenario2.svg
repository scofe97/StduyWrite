<text x="560" y="154" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원래 데이터 λin 에 재전송을 더한 제공 부하 λ'in</text>

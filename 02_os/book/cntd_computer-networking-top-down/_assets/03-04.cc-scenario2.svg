<title id="dt">시나리오 2 — 유한 버퍼는 재전송을 부르고 재전송이 용량을 먹습니다</title><desc id="dd">원문 Figure 3.45·3.46. 같은 제공 부하 R/2 에서 처리량은 가정에 따라 R/2·R/3·R/4 로 갈린다.</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-04 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">시나리오 2 — 유한 버퍼는 재전송을 부르고 재전송이 용량을 먹습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로축은 재전송을 포함한 제공 부하 λ'in 입니다. 세 곡선의 끝값이 원문 수치입니다</text>

<title id="dt">안전하다는 말은 네 가지 요구입니다</title><desc id="dd">하나를 만족시키는 장치가 나머지 셋을 주지 않는다. 그래서 이 장은 절을 나눠 하나씩 맡는다.</desc>
<rect width="1000" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 8.1 · WHAT IS NETWORK SECURITY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">안전하다는 말은 네 가지 요구입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">네 성질과 담당 절은 원문 §8.1 이 직접 적은 것입니다</text>
<text x="24" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">요구</text>
<text x="334.0" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">무엇을 요구하나</text>
<text x="582.0" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">깨지면 벌어지는 일</text>
<text x="788.0" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">다루는 절</text>
<rect x="24" y="176" width="184" height="56" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.4"/>
<text x="116.0" y="208.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">기밀성</text>
<rect x="216" y="176" width="236" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="334.0" y="208.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">보낸 이와 받기로 한 이만 내용을 이해</text>
<rect x="452" y="176" width="260" height="56" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="582.0" y="208.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">도청자가 가로챈 것을 읽습니다</text>
<rect x="712" y="176" width="152" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="788.0" y="208.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">§8.2</text>
<rect x="24" y="240" width="184" height="56" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="116.0" y="272.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">메시지 무결성</text>
<rect x="216" y="240" width="236" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="334.0" y="272.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">오가는 중에 내용이 바뀌지 않음</text>
<rect x="452" y="240" width="260" height="56" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="582.0" y="272.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">바뀐 것을 모르고 받습니다</text>
<rect x="712" y="240" width="152" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="788.0" y="272.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">§8.3</text>
<rect x="24" y="304" width="184" height="56" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="116.0" y="336.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">종단 인증</text>
<rect x="216" y="304" width="236" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="334.0" y="336.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">상대가 정말 그 사람인지 확인</text>
<rect x="452" y="304" width="260" height="56" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="582.0" y="336.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">다른 개체를 상대로 말합니다</text>
<rect x="712" y="304" width="152" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="788.0" y="336.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">§8.4</text>
<rect x="24" y="368" width="184" height="56" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="116.0" y="400.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">운영 보안</text>
<rect x="216" y="368" width="236" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="334.0" y="400.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">조직의 망 자체를 지킴</text>
<rect x="452" y="368" width="260" height="56" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="582.0" y="400.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">웜·정보 유출·구성 탐색·DoS</text>
<rect x="712" y="368" width="152" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="788.0" y="400.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">§8.9</text>
<rect x="24" y="444" width="952" height="108" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">침입자에게 허용된 능력은 둘뿐입니다</text>
<line x1="44" y1="484" x2="956" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="44" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">엿듣기</text>
<text x="44" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">채널의 제어·데이터 메시지를 훔쳐 기록합니다</text>
<text x="516" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">변조 · 삽입 · 삭제</text>
<text x="516" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">메시지나 그 내용을 바꾸거나 넣거나 지웁니다</text>
<text x="24" y="576" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">능력은 둘인데 그것으로 훔쳐보기·사칭·세션 탈취·서비스 거부가 모두 나옵니다.</text>
<line x1="12" y1="596" x2="952" y2="596" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="618" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="608" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 편이 다루는 요구</text>
<rect x="287" y="608" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">뒤 편이 다루는 요구</text>
<rect x="474" y="608" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="496" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">깨졌을 때</text>
<rect x="583" y="608" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="605" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">침입자의 능력</text>

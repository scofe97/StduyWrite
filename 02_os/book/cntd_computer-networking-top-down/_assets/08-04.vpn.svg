<title id="dt">사설망을 사지 않고 공용 인터넷 위에 만듭니다</title><desc id="dd">같은 기관 안에서는 평범한 IPv4 로 오간다. 공용 인터넷을 지나는 구간에서만 IPsec 으로 바꾼다.</desc>
<rect width="1000" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 8.7.1 · VIRTUAL PRIVATE NETWORK</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">사설망을 사지 않고 공용 인터넷 위에 만듭니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">구성과 암호화 구간은 원문 Figure 8.27 의 것입니다</text>
<rect x="24" y="148" width="264" height="132" rx="8" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="156.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">본사</text>
<text x="156.0" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">게이트웨이 라우터</text>
<text x="156.0" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">안에서는 평범한 IPv4</text>
<rect x="368" y="148" width="264" height="132" rx="8" fill="#8B98A912" stroke="#8B98A9" stroke-width="1.2"/>
<text x="500.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">공용 인터넷</text>
<text x="500.0" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평범한 라우터들</text>
<text x="500.0" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">IPsec 인 줄 모르고 전달합니다</text>
<rect x="712" y="148" width="264" height="132" rx="8" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="844.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">지사</text>
<text x="844.0" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">게이트웨이 라우터</text>
<text x="844.0" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">안에서는 평범한 IPv4</text>
<rect x="368" y="320" width="264" height="96" rx="8" fill="#F08A5918" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">출장 영업 사원</text>
<text x="500" y="376" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호텔에서 접속합니다</text>
<text x="500" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노트북 OS 가 복호합니다</text>
<path d="M 292 214 L 360 214" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="326.0" y="200" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">IPsec</text>
<path d="M 640 214 L 704 214" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="672.0" y="200" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">IPsec</text>
<path d="M 300 240 L 336 240 L 336 340 L 364 340" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="316" y="300" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">IPsec</text>
<rect x="24" y="448" width="952" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">게이트웨이가 하는 일</text>
<text x="44" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평범한 IPv4 데이터그램을 IPsec 데이터그램으로 바꿔 인터넷에 내보냅니다. 바깥 헤더는 진짜 IPv4 라 중간 라우터는 평범한 데이터그램으로 처리합니다.</text>
<line x1="12" y1="544" x2="952" y2="544" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="566" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="556" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기관 내부</text>
<rect x="209" y="556" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="231" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">암호화 없이</text>
<rect x="331" y="556" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="353" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">암호화 구간</text>
<rect x="453" y="556" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="475" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공용 구간</text>
</svg>
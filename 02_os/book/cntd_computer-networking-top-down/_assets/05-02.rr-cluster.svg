<title id="dt">리플렉터는 어느 쪽에서 받았는지로 되비출 곳을 정합니다</title><desc id="dd">리플렉터와 그 클라이언트가 클러스터 하나를 이룹니다. 클라이언트에게 받은 경로는 논클라이언트와 다른 클라이언트 모두에게 되비추고, 논클라이언트에게 받은 경로는 클라이언트에게만 되비춥니다. 그래서 클라이언트끼리는 서로 맺지 않아도 되고 논클라이언트끼리는 여전히 그물로 맺어야 합니다.</desc>
<rect width="1000" height="448" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">RFC 4456 §5 · §6 · ROUTE REFLECTION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">리플렉터는 어느 쪽에서 받았는지로 되비출 곳을 정합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">클라이언트는 리플렉터 한 대와만 맺고, 논클라이언트는 자기들끼리 그물을 유지합니다</text>

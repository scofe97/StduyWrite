<text x="304.0" y="353.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">검사 안 함</text>
<rect x="436" y="328" width="176" height="40" rx="5" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="524.0" y="353.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">링크 상태 광고</text>
<text x="772" y="353" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">위조 링크 상태도 수락</text>
<text x="24" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">단순 인증</text>
<text x="24" y="422" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">AuType 1</text>
<rect x="176" y="384" width="256" height="40" rx="5" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="304.0" y="409.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">평문 암호</text>
<rect x="436" y="384" width="176" height="40" rx="5" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="524.0" y="409.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">링크 상태 광고</text>
<text x="772" y="409" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">엿듣기로 암호 노출</text>
<text x="24" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">MD5 인증</text>
<text x="24" y="478" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">AuType 2</text>
<rect x="176" y="440" width="256" height="40" rx="5" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="304.0" y="465.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">Key ID · 순서 번호</text>

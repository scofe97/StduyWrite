<rect x="816" y="576" width="124" height="36" rx="5" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="878.0" y="599.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">다이제스트</text>
<text x="528" y="636" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">같은 키로 재계산 · 실린 값과 같음</text>

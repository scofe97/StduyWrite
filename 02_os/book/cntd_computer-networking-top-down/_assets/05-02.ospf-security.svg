<text x="44" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">위조 · 링크 상태를 바꿈</text>
<rect x="44" y="576" width="124" height="36" rx="5" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="106.0" y="599.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">순서 번호</text>
<rect x="172" y="576" width="156" height="36" rx="5" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="250.0" y="599.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">틀린 링크 상태</text>
<rect x="332" y="576" width="124" height="36" rx="5" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="394.0" y="599.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">다이제스트</text>
<text x="44" y="636" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">같은 키로 재계산 · 실린 값과 다름</text>
<text x="472" y="688" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">폐기</text>

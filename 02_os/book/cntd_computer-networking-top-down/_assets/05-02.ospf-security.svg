<title id="dt">포트가 없는 OSPF 는 인증 값을 자기 패킷에 싣습니다</title><desc id="dd">BGP 는 TCP 포트 179 위에서 돌지만 OSPF 는 IP 위에 직접 실려 전송 계층 헤더와 포트가 없다. 그래서 상대를 확인할 값은 OSPF 헤더의 인증 칸에 들어간다(노트의 읽기). 인증 칸은 기본값이면 검사하지 않고, 단순 인증이면 평문 암호를 싣고, MD5 인증이면 키 번호와 순서 번호를 싣고 패킷 끝에 다이제스트를 붙인다. 받는 라우터는 같은 키로 다시 계산한 값이 다르면 위조로, 순서 번호가 기록보다 작으면 재전송으로 보고 버린다.</desc>
<rect width="1000" height="776" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.3 · OSPF SECURITY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">포트가 없는 OSPF 는 인증 값을 자기 패킷에 싣습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">포트와 인증 칸을 잇는 선은 노트의 읽기, AuType·Key ID·순서 번호 비교는 RFC 2328 부록 D 입니다.</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">1. 캡슐화 · 포트가 들어갈 자리</text>
<text x="24" y="154" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">BGP</text>
<rect x="96" y="128" width="196" height="44" rx="5" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="194.0" y="155.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">IP 헤더</text>
<rect x="296" y="128" width="228" height="44" rx="5" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="410.0" y="155.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">TCP 헤더 · 포트 179</text>
<rect x="528" y="128" width="448" height="44" rx="5" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="752.0" y="155.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">BGP 메시지</text>
<text x="24" y="210" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">OSPF</text>
<rect x="96" y="184" width="196" height="44" rx="5" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="194.0" y="211.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">IP 헤더 · 프로토콜 89</text>
<path d="M 296 184 L 524 184 L 524 228 L 296 228 Z" fill="none" stroke="#8B98A9" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="410.0" y="211.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">TCP·UDP 헤더 없음 · 포트 없음</text>
<rect x="528" y="184" width="228" height="44" rx="5" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="642" y="211" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">OSPF 헤더 · 인증 칸</text>
<rect x="760" y="184" width="216" height="44" rx="5" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="868.0" y="211.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">링크 상태 광고</text>
<path d="M 642 228 L 642 256 L 304 256 L 304 292" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="660" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">상대 확인은 인증 칸에서 · 노트의 읽기</text>
<text x="24" y="280" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">2. 인증 칸 설정 셋</text>
<text x="304" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">OSPF 헤더의 인증 칸</text>
<text x="524" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">OSPF 본문</text>
<text x="684" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">패킷 끝</text>
<text x="772" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">받는 쪽</text>
<text x="24" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">기본값</text>
<text x="24" y="366" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">AuType 0</text>

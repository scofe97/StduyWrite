<rect x="528" y="576" width="124" height="36" rx="5" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="590.0" y="599.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">옛 순서 번호</text>
<rect x="656" y="576" width="156" height="36" rx="5" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>

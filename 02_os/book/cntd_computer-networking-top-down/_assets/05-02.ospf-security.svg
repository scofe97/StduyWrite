<text x="524.0" y="465.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">링크 상태 광고</text>
<rect x="616" y="440" width="136" height="40" rx="5" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="684.0" y="465.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">MD5 다이제스트</text>
<text x="772" y="465" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">같은 키로 재계산 · 비교</text>
<text x="24" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">3. MD5 인증에서 버려지는 두 패킷</text>

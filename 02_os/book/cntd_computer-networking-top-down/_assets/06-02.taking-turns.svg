<title id="dt">차례를 정해 주면 충돌도 빈 슬롯도 없습니다</title><desc id="dd">폴링은 컨트롤러가 차례를 나눠 주고 토큰 패싱은 특별한 프레임 하나가 고정 순서로 돈다. 효율은 오르지만 각각 새 약점이 생긴다.</desc>
<rect width="940" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 6.3.3 · TAKING TURNS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">차례를 정해 주면 충돌도 빈 슬롯도 없습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원문 §6.3.3 의 두 프로토콜입니다</text>
<text x="24" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">폴링 — 컨트롤러가 나눠 줍니다</text>
<rect x="148" y="144" width="160" height="48" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.4"/>
<text x="228" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">컨트롤러 노드</text>
<rect x="40" y="264" width="88" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="291" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">노드 1</text>
<path d="M 228 196 L 228 232 L 84 232 L 84 260" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)" stroke-dasharray="4 5"/>
<text x="84" y="250" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">1</text>
<rect x="144" y="264" width="88" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="188" y="291" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">노드 2</text>
<path d="M 228 196 L 228 232 L 188 232 L 188 260" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)" stroke-dasharray="4 5"/>
<text x="188" y="250" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">2</text>
<rect x="248" y="264" width="88" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="292" y="291" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">노드 3</text>
<path d="M 228 196 L 228 232 L 292 232 L 292 260" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)" stroke-dasharray="4 5"/>
<text x="292" y="250" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">3</text>
<rect x="352" y="264" width="88" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="396" y="291" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">노드 4</text>
<path d="M 228 196 L 228 232 L 396 232 L 396 260" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)" stroke-dasharray="4 5"/>
<text x="396" y="250" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">4</text>
<line x1="492" y1="108" x2="492" y2="408" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="524" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">토큰 패싱 — 특별한 프레임이 돕니다</text>
<rect x="656" y="144" width="88" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="700" y="169" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">노드 1</text>
<rect x="766" y="216" width="88" height="40" rx="6" fill="#F08A591E" stroke="#F08A59" stroke-width="1.5"/>
<text x="810" y="241" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">노드 2</text>
<rect x="656" y="288" width="88" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="700" y="313" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">노드 3</text>
<rect x="546" y="216" width="88" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="590" y="241" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">노드 4</text>
<path d="M 744 164 L 810 164 L 810 212" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<path d="M 810 256 L 810 308 L 748 308" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<path d="M 656 308 L 590 308 L 590 260" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<path d="M 590 212 L 590 164 L 652 164" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<rect x="682.0" y="226" width="36.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="700" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">토큰</text>
<text x="24" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">차례로 돌면서 최대 몇 프레임까지 보내라고 알립니다.</text>
<text x="24" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">·</text>
<text x="38" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">폴링 지연이 붙고, 컨트롤러가 죽으면 채널 전체가 멎습니다</text>
<text x="24" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">·</text>
<text x="38" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">블루투스가 폴링 프로토콜입니다</text>
<text x="524" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">받은 노드는 보낼 것이 있을 때만 붙잡고, 없으면 바로 넘깁니다.</text>
<text x="524" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">·</text>
<text x="538" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">컨트롤러가 없어 분산이고 효율이 높습니다</text>
<text x="524" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">·</text>
<text x="538" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한 노드 고장이나 토큰 분실이 채널을 멈춥니다</text>
<line x1="24" y1="420" x2="892" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">둘 다 랜덤 접속이 못 지킨 조건을 노립니다. M 개 노드가 활성일 때 각자 R/M 에 가까운 처리량을 갖는 것입니다.</text>
<line x1="12" y1="460" x2="892" y2="460" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="482" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="472" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">토큰을 쥔 노드</text>
<rect x="248" y="472" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="270" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">토큰이 도는 길</text>
<rect x="396" y="472" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="418" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">얻는 것</text>
<rect x="492" y="472" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="514" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">새로 생기는 약점</text>
</svg>
<title id="dt">버퍼는 둘, 창은 그중 하나의 빈자리를 적은 숫자입니다</title><desc id="dd">보내는 쪽 A 의 애플리케이션이 send() 로 송신 버퍼에 바이트를 쓰면 TCP 가 세그먼트로 내보내고, 받는 쪽 B 의 수신 버퍼에 쌓인 바이트는 recv() 가 꺼내 간다. 송신 버퍼는 보낸 바이트를 ACK 가 올 때까지 들고 있다. B 는 수신 버퍼의 빈자리 4 를 ACK 의 Window 칸에 실어 보내고, A 는 보냈지만 미확인인 3바이트를 그 숫자 안으로 묶는다.</desc>
<rect width="920" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-04 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">버퍼는 둘, 창은 그중 하나의 빈자리를 적은 숫자입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바이트는 왼쪽 끝으로 들어와 오른쪽 끝으로 나가고, ACK 가 수신 버퍼의 빈자리 수를 되돌려 줍니다</text>
<text x="40" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">보내는 쪽 A</text>

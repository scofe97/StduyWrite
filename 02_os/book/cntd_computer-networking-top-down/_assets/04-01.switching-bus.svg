<title id="dt">버스를 거쳐 — 한 번에 하나씩만 건넙니다</title><desc id="dd">원문 4.2.2 의 둘째 방식. 입력 포트가 스위치 내부용 라벨을 붙여 버스에 실으면 모든 출력 포트가 받되 라벨이 맞는 포트만 보관한다. 버스를 건너는 자리가 하나뿐이라 스위칭 속도가 버스 속도에 묶인다.</desc>

<text x="232" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">셋을 보내려면 슬롯 셋 — 라우팅 프로세서는 거치지 않음</text>

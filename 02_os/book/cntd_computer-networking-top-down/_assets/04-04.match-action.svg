<title id="dt">일치는 세 계층에 걸칩니다</title><desc id="dd">OpenFlow 1.0 이 일치에 쓸 수 있는 12개 값을 계층별로 쌓고, 그 아래에 가능한 동작 셋을 둔 층 그림. 계층화 원칙을 의도적으로 거스르는 지점이 한눈에 보인다.</desc>

<title id="dt">비용이 같은 두 경로에 트래픽을 함께 싣습니다</title><desc id="dd">출발 라우터 u 에서 목적지 z 로 가는 경로가 v 쪽과 w 쪽 둘이고 경로 비용은 둘 다 3 이다. 경로 하나만 고르면 패킷 넷이 모두 v 쪽으로 가고 w 쪽은 빈다. OSPF 는 비용이 같은 경로를 함께 쓸 수 있어 같은 패킷 넷이 두 경로에 나뉘어 실린다. 링크 비용은 예시이고 패킷 개수는 비율이 아니다.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">죽는 자리를 하나씩 옮깁니다</title><desc id="dd">traceroute 가 TTL 을 1 부터 올려 보내며 매번 다른 라우터에서 데이터그램을 죽이고, 그 라우터가 보내는 ICMP 시간 초과로 경로를 알아내는 흐름.</desc>
<rect width="1000" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.6 · TRACEROUTE OVER ICMP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">죽는 자리를 하나씩 옮깁니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이 기계에서 잡은 패킷으로 확인했습니다 — 목적지 포트는 33435 부터 하나씩 올라갑니다</text>
<rect x="24" y="120" width="150" height="66" rx="7" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<text x="99" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">출발지</text>
<text x="99" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">타이머를 겁니다</text>
<rect x="232" y="120" width="176" height="66" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="320" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">라우터 1</text>
<text x="320" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TTL 1 이 여기서 0</text>
<text x="320" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">집 안 게이트웨이</text>
<path d="M 320 186 L 320 232 L 99 232 L 99 190" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)" stroke-dasharray="5 4"/>
<rect x="432" y="120" width="176" height="66" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="520" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">라우터 2</text>
<text x="520" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TTL 2 가 여기서 0</text>
<text x="520" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">ISP 라우터</text>
<path d="M 520 186 L 520 258 L 99 258 L 99 190" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)" stroke-dasharray="5 4"/>
<rect x="632" y="120" width="176" height="66" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="720" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">라우터 3</text>
<text x="720" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TTL 3 이 여기서 0</text>
<text x="720" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">ISP 라우터</text>
<path d="M 720 186 L 720 284 L 99 284 L 99 190" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)" stroke-dasharray="5 4"/>
<rect x="832" y="120" width="144" height="66" rx="7" fill="#161B22" stroke="#3FB98C" stroke-width="1.4"/>
<text x="904" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">목적지</text>
<text x="904" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">쓰지 않는 포트</text>
<path d="M 178 153 L 226 153" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<path d="M 412 153 L 426 153" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<path d="M 612 153 L 626 153" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<path d="M 812 153 L 826 153" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<path d="M 904 186 L 904 320 L 99 320 L 99 190" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)" stroke-dasharray="5 4"/>
<text x="500" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">type 3 code 3 · 포트 도달 불가 — 여기서 멈춥니다</text>
<text x="500" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">type 11 code 0 · 시간 초과 — 라우터 이름과 주소가 실려 옵니다</text>
<rect x="24" y="366" width="952" height="132" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="392" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">이 기계에서 잡은 실제 패킷</text>
<text x="44" y="418" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">IP 192.168.0.124.47535 &gt; 1.1.1.1.33435: UDP, length 12</text>
<text x="44" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">IP (proto ICMP (1), length 68) 192.168.0.1 &gt; 192.168.0.124: ICMP time exceeded in-transit, length 48</text>
<text x="44" y="466" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">    IP (ttl 1, proto UDP (17), length 40) 192.168.0.124.47699 &gt; 1.1.1.1.33435: UDP, length 12</text>
<text x="44" y="488" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">ICMP 48 = 헤더 8 + 인용된 원본 40. 원본 데이터그램이 통째로 실려 왔습니다</text>
<text x="30" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원문은 ICMP 메시지가 문제의 데이터그램의 헤더와 앞 8바이트를 담는다고 적습니다. 그것은 RFC 792 의 최소치이고,</text>
<text x="30" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 라우터는 40바이트 전부를 돌려보냈습니다. 최소치를 규칙으로 읽으면 어긋납니다.</text>
<line x1="12" y1="590" x2="952" y2="590" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="612" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="602" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="612" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">나가는 데이터그램</text>
<rect x="261" y="602" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="283" y="612" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시간 초과 응답</text>
<rect x="409" y="602" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="431" y="612" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">멈춤 신호</text>
</svg>
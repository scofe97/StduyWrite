<title id="dt">쿠키를 받아 두고 다음 연결의 첫 메시지에 데이터를 싣습니다</title><desc id="dd">첫 연결에서는 평범한 3-way 핸드셰이크 도중에 클라이언트가 빠른 열기 쿠키를 요청하고 서버가 SYNACK 에 실어 보낸다. 양쪽이 저장한다. 다음 연결에서는 클라이언트가 그 쿠키와 애플리케이션 데이터를 첫 메시지에 함께 보내므로 데이터가 왕복 한 번을 기다리지 않는다. 다만 클라이언트 쪽의 최적화 가능성일 뿐이고 서버는 정책상 쿠키를 받아들이지 않을 수 있다. 시뮬레이터 프리셋 비교에서 5 MB 전송이 353 ms 와 326 ms 로 갈리고 차이는 31 ms 다.</desc>
<rect width="880" height="904" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-04 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">쿠키를 받아 두고 다음 연결의 첫 메시지에 데이터를 싣습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이전에 통신한 적이 있으면 연결 수립의 1 RTT 를 0 으로 줄일 수 있습니다</text>
<text x="24" y="96" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">첫 연결 · 핸드셰이크 도중에 쿠키를 받아 둠</text>
<rect x="24.0" y="108" width="240" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="144.0" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="144.0" y="145" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">connect()</text>
<rect x="592.0" y="108" width="240" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="712.0" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">서버</text>
<text x="712.0" y="145" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">listen()</text>
<line x1="144.0" y1="158" x2="144.0" y2="792" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="712.0" y1="158" x2="712.0" y2="792" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 154.0 196 L 700.0 196" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="428.0" y="187" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">SYN · 빠른 열기 쿠키 요청</text>
<text x="428.0" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">다음 연결에 쓸 쿠키를 달라는 요청</text>
<path d="M 702.0 248 L 156.0 248" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)" stroke-dasharray="5 4"/>
<text x="428.0" y="239" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">SYNACK · 빠른 열기 쿠키</text>
<text x="428.0" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">다음 연결에 필요한 연결 정보를 부호화한 쿠키</text>
<path d="M 154.0 300 L 700.0 300" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="428.0" y="291" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">ACK</text>
<text x="428.0" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여기까지 평범한 3-way 핸드셰이크 · 연결 수립에 1 RTT</text>
<rect x="104.5" y="332" width="79.0" height="24" rx="4" fill="#0D1117"/>
<rect x="104.5" y="332" width="79.0" height="24" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="144.0" y="349" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">쿠키 저장</text>
<rect x="672.5" y="332" width="79.0" height="24" rx="4" fill="#0D1117"/>
<rect x="672.5" y="332" width="79.0" height="24" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="712.0" y="349" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">쿠키 저장</text>
<line x1="24" y1="376" x2="856" y2="376" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="24" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">다음 연결 · 첫 메시지에 쿠키와 데이터를 함께</text>
<path d="M 154.0 444 L 700.0 444" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="428.0" y="435" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">SYN · 쿠키 + 애플리케이션 데이터</text>
<text x="428.0" y="462" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">데이터가 왕복 한 번을 기다리지 않음</text>
<path d="M 428.0 474 L 428.0 500" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="24" y="504" width="832" height="60" rx="6" fill="#0D1117" stroke="none" stroke-width="0"/>
<rect x="24" y="504" width="832" height="60" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="428.0" y="526" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">왕복 한 번을 덜어 낸 값 · 시뮬레이터 프리셋 · 5 MB 전송</text>
<text x="200" y="548" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">Cold TCP 353 ms</text>
<text x="428.0" y="548" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">Warm TCP 326 ms</text>
<text x="690" y="548" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">차이 31 ms · 왕복 한 번</text>
<rect x="132" y="580" width="592" height="212" rx="4" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="132" y="580" width="48" height="18" rx="2" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="156" y="593" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">ALT</text>
<text x="180" y="620" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">쿠키 수용</text>
<path d="M 702.0 656 L 156.0 656" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)" stroke-dasharray="5 4"/>
<text x="428.0" y="647" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">SYNACK</text>
<text x="428.0" y="674" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">데이터는 이미 서버에 닿음 · 0-RTT</text>
<line x1="140" y1="694" x2="716" y2="694" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="180" y="720" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">서버 정책상 거절</text>
<path d="M 702.0 756 L 156.0 756" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)" stroke-dasharray="5 4"/>
<text x="428.0" y="747" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">SYNACK · 쿠키를 받지 않음</text>
<text x="428.0" y="774" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">클라이언트 쪽의 최적화 가능성일 뿐</text>
<text x="24" y="820" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">흐름 밖 · TCP Fast Open 은 RFC 7413 · 같은 계열이 QUIC · TLS 의 0-RTT</text>
<line x1="12" y1="840" x2="832" y2="840" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="862" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="852" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="862" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">쿠키를 주고받는 자리</text>
<rect x="287" y="852" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="309" y="862" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터를 실은 첫 메시지</text>
<rect x="500" y="852" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="522" y="862" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">왕복 한 번을 던 값</text>
<rect x="687" y="852" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="709" y="862" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버 정책상 거절</text>
</svg>
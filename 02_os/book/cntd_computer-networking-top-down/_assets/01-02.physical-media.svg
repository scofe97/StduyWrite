<title id="dt">비트가 타고 건너는 것</title><desc id="dd">원문 1.2.2 의 매체 분류. 첫 갈림은 파동이 고체 매체를 따라 인도되느냐(유도) 대기와 우주로 퍼지느냐(비유도)다. 경로 위의 구간마다 종류가 달라도 된다.</desc>
<rect width="952" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 01-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">비트가 타고 건너는 것</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 층이 감춘 제약 — MTU·충돌·페이딩 — 이 전부 여기서 나옵니다</text>
<rect x="24" y="281.0" width="148" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="38" y="305.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">물리 매체</text>
<text x="38" y="324.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">송신기와 수신기 사이</text>
<rect x="196" y="196.0" width="164" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="210" y="220.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">유도 매체</text>
<text x="210" y="239.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">고체를 따라 인도</text>
<rect x="196" y="366.0" width="164" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="210" y="390.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">비유도 매체</text>
<text x="210" y="409.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">대기와 우주로 퍼짐</text>
<path d="M 172 309.0 L 184.0 309.0 L 184.0 224.0 L 192 224.0" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)"/>
<path d="M 172 309.0 L 184.0 309.0 L 184.0 394.0 L 192 394.0" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="384" y="128" width="544" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="398" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">꼬임쌍 구리선</text>
<text x="398" y="171" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">LAN 10 Mbps ~ 10 Gbps · 카테고리 6a 는 100 m 까지 10 Gbps · 가장 싸고 흔합니다</text>
<path d="M 360 224.0 L 372.0 224.0 L 372.0 156.0 L 380 156.0" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="384" y="196" width="544" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="398" y="220" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">동축 케이블</text>
<text x="398" y="239" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수백 Mbps · 두 도체가 동심원 · 유도된 공유 매체로 쓸 수 있습니다</text>
<path d="M 360 224.0 L 372.0 224.0 L 372.0 224.0 L 380 224.0" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="384" y="264" width="544" height="56" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="398" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">광섬유</text>
<text x="398" y="307" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수십 ~ 수백 Gbps · 전자기 간섭 면역 · 100 km 까지 저감쇠 · 도청도 극히 어렵습니다</text>
<path d="M 360 224.0 L 372.0 224.0 L 372.0 292.0 L 380 292.0" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="384" y="332" width="544" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="398" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">지상 무선</text>
<text x="398" y="375" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1~2 m · 10~수백 m · 수십 km 셋으로 갈립니다 · 경로 손실과 페이딩을 받습니다</text>
<path d="M 360 394.0 L 372.0 394.0 L 372.0 360.0 L 380 360.0" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="384" y="400" width="544" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="398" y="424" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">위성 무선</text>
<text x="398" y="443" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수백 Mbps · 정지궤도는 36,000 km · 저궤도는 훨씬 가깝습니다</text>
<path d="M 360 394.0 L 372.0 394.0 L 372.0 428.0 L 380 428.0" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)"/>
<text x="24" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">물리 링크의 비용은 자재가 아니라 설치 인건비입니다 — 그래서 건물 지을 때 당장 안 쓸 매체까지 방마다 미리 깔아 둡니다</text>
<line x1="12" y1="508" x2="904" y2="508" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="530" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="520" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">장거리에서 선호되는 매체</text>
</svg>
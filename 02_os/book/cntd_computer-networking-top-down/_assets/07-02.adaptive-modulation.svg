<title id="dt">채널이 나쁘면 덜 욕심냅니다</title><desc id="dd">같은 오류율 목표 아래에서 쓸 수 있는 변조 방식이 SNR 구간마다 다르다. 그래서 변조는 고정이 아니다.</desc>
<rect width="940" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 7.2.2 · ADAPTIVE MODULATION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">채널이 나쁘면 덜 욕심냅니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">경계값 13 과 17 은 원문이 BER 10⁻⁴ 목표에서 든 값입니다</text>

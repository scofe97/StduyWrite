<line x1="557.44" y1="126" x2="557.44" y2="320" stroke="#F08A59" stroke-width="1.0" stroke-dasharray="4 5"/>
<text x="557.44" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F08A59">13 dB</text>

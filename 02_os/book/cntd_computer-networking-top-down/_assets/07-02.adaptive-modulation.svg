<text x="664.96" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F08A59">17 dB</text>
<rect x="24" y="382" width="880" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="408" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">항상 높은 차수를 쓰면 되지 않는 이유</text>
<text x="44" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">차수가 높을수록 성상도의 점이 촘촘해져 잡음과 측정 오차가 더 자주 이웃 심볼로 넘어갑니다.</text>
<text x="44" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 송수신기는 SNR 과 BER 을 재서 서로에게 알리고, 변조 방식 변경을 맞춰야 합니다.</text>

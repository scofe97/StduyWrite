<title id="dt">링크 하나가 끊어지면 여섯 걸음</title><desc id="dd">위 칸은 스위치 s1·s2·s3·s4 와 링크 다섯(s1-s2, s1-s3, s1-s4, s2-s4, s3-s4). s1-s2 가 끊기면 우회로는 s1-s4-s2 이고, 흐름 표가 바뀌는 곳은 s1·s2·s4 셋이며 s3 는 그대로다. s4 는 끊긴 링크에 닿지 않았는데도 표가 바뀐다. 아래 칸은 그 변화를 만드는 SDN 제어 평면의 여섯 걸음. 다익스트라는 스위치 밖의 앱에서 돌고, 스위치는 서로가 아니라 컨트롤러에게만 알린다.</desc>
<rect width="1000" height="944" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.5.3 · LINK-STATE CHANGE</text>

<title id="dt">표를 한 줄 바꿀 때마다 패킷의 운명이 바뀝니다</title><desc id="dd">같은 경로(ns1 → br0 → ns2)에 같은 패킷을 여섯 번 흘려보내고, 흐름 표만 한 줄씩 바꾼다. br0 에 깔린 줄이 무엇이냐에 따라 패킷은 끝까지 가기도 하고, 다리에서 버려지기도 하고, 세어지기만 하기도 한다.</desc>
<rect width="880" height="604" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.3 LAB · FLOW TABLE STATES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">표를 한 줄 바꿀 때마다 패킷의 운명이 바뀝니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽이 표에 든 줄, 오른쪽이 그 패킷이 어디까지 갔는가</text>
<text x="352" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">ns1</text>
<text x="470" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">br0</text>
<text x="588" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">ns2</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">흐름 표에 든 줄</text>
<text x="700" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">어디까지 갔나</text>
<text x="24" y="134" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<text x="40" y="134" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">priority=0 actions=NORMAL</text>

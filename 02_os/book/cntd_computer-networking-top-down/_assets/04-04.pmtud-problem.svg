<title id="dt">알림이 막히면 같은 크기로 되풀이하다 멈춥니다</title><desc id="dd">송신자와 수신자 사이에 방화벽과 터널 입구 라우터가 있고 터널 안쪽 MTU 는 1480 이다. 작은 SYN 은 끝까지 간다. 1500 바이트 패킷은 터널 입구에서 버려지고 라우터가 Packet Too Big 을 돌려보내지만 ICMP 를 막는 방화벽에서 사라진다. 송신자는 같은 1500 바이트를 다시 보내고 또 버려진다.</desc>
<rect width="1000" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">IPV6 · PATH MTU · BLACK HOLE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">알림이 막히면 같은 크기로 되풀이하다 멈춥니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">작은 패킷은 끝까지 가고 큰 패킷만 터널 앞에서 버려집니다. 줄이라는 알림은 방화벽에서 사라집니다</text>

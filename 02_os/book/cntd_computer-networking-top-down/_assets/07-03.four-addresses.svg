<text x="44" y="488" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">내려갈 때 — H1 은 주소 3 을 보고 이 데이터그램을 서브넷에 넣은 라우터 인터페이스를 압니다.</text>
<text x="44" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">올라갈 때 — AP 는 주소 3 을 보고 이더넷 프레임의 목적지 MAC 을 채웁니다. 네 번째 주소는 애드혹용입니다.</text>
<line x1="12" y1="536" x2="892" y2="536" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

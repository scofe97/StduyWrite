<title id="dt">주소가 셋이어야 라우터의 MAC 주소가 살아 건너갑니다</title><desc id="dd">AP 는 3 계층을 모르는 링크 계층 장치다. 그래서 프레임 자체가 라우터 인터페이스의 주소를 들고 다녀야 한다.</desc>
<rect width="940" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 7.3.2 · 802.11 ADDRESS FIELDS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">주소가 셋이어야 라우터의 MAC 주소가 살아 건너갑니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주소 정의와 예시는 원문 Figure 7.27 의 것입니다</text>
<rect x="16" y="100" width="168" height="54" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="100" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">라우터 인터페이스 R1</text>
<text x="100" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">IP 를 압니다</text>

<title id="dt">층마다 봉투를 하나씩 씌웁니다</title><desc id="dd">보내는 호스트에서 애플리케이션 메시지가 아래로 내려가며 층마다 헤더를 하나씩 얻는다. 어느 층에서 보든 패킷은 헤더와 페이로드 둘로 갈리고, 그 페이로드는 대개 위 층에서 온 패킷이다.</desc>
<rect width="960" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 01-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">층마다 봉투를 하나씩 씌웁니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">받는 쪽은 바깥부터 하나씩 뜯습니다 — 그것이 역캡슐화입니다</text>

<text x="24" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">그래서 rdt3.0 의 타임아웃이 만든 중복 패킷을 rdt2.1 이 넣어 둔 순서 번호가 받아 냅니다. 단계가 서로를 떠받칩니다.</text>

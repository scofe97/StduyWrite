<title id="dt">장치는 더해질 뿐 사라지지 않습니다</title><desc id="dd">채널에 결함을 하나 더 허용할 때마다 장치가 하나씩 붙고, 앞 단계의 장치는 그대로 남는다. rdt3.0 이 가진 것은 타이머 하나가 아니라 넷이다.</desc>
<rect width="1000" height="676" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">장치는 더해질 뿐 사라지지 않습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">그래서 rdt3.0 을 이해하려면 앞의 넷을 다 알아야 합니다</text>

<text x="406" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">가진 장치가 없습니다. 되먹임조차 필요 없습니다.</text>

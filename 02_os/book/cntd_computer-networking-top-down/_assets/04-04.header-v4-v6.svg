<title id="dt">주소는 네 배, 헤더는 두 배</title><desc id="dd">IPv4 20바이트와 IPv6 40바이트 헤더를 필드 묶음별 길이로 비교한 막대. IPv6 는 제어 정보 6바이트를 버리고 주소를 8바이트에서 32바이트로 늘렸다.</desc>
<rect width="960" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">HEADER BUDGET · IPV4 20B vs IPV6 40B</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">주소는 네 배, 헤더는 두 배</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">길이 = 바이트 수 · 같은 눈금으로 두 헤더를 나란히 놓았습니다</text>
<line x1="180.0" y1="138" x2="180.0" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="180.0" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">0 B</text>
<line x1="360.0" y1="138" x2="360.0" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="360.0" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">10 B</text>
<line x1="540.0" y1="138" x2="540.0" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="540.0" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">20 B</text>
<line x1="720.0" y1="138" x2="720.0" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="720.0" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">30 B</text>
<line x1="900.0" y1="138" x2="900.0" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="900.0" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">40 B</text>
<text x="168" y="176" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F5F5F3">IPv4</text>
<text x="168" y="195" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">20 바이트</text>
<rect x="180" y="150" width="108.0" height="60" rx="3" fill="#F5F5F312" stroke="#F5F5F3" stroke-width="1.0"/>
<text x="234.0" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">유지된 제어</text>
<text x="234.0" y="195" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">6 B</text>
<rect x="288.0" y="150" width="108.0" height="60" rx="3" fill="#F0616D18" stroke="#F0616D" stroke-width="1.4"/>
<text x="342.0" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">IPv6 가 버림</text>
<text x="342.0" y="195" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">6 B</text>
<rect x="396.0" y="150" width="72.0" height="60" rx="3" fill="#F08A591E" stroke="#F08A59" stroke-width="1.4"/>
<text x="432.0" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">출발지</text>
<text x="432.0" y="195" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">4 B</text>
<rect x="468.0" y="150" width="72.0" height="60" rx="3" fill="#F08A591E" stroke="#F08A59" stroke-width="1.4"/>
<text x="504.0" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">목적지</text>
<text x="504.0" y="195" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">4 B</text>
<text x="168" y="306" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F5F5F3">IPv6</text>
<text x="168" y="325" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">40 바이트</text>
<rect x="180" y="280" width="144.0" height="60" rx="3" fill="#F5F5F312" stroke="#F5F5F3" stroke-width="1.0"/>
<text x="252.0" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">제어</text>
<text x="252.0" y="325" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">8 B</text>
<rect x="324.0" y="280" width="288.0" height="60" rx="3" fill="#F08A591E" stroke="#F08A59" stroke-width="1.4"/>
<text x="468.0" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">출발지 주소</text>
<text x="468.0" y="325" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">16 B</text>
<rect x="612.0" y="280" width="288.0" height="60" rx="3" fill="#F08A591E" stroke="#F08A59" stroke-width="1.4"/>
<text x="756.0" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">목적지 주소</text>
<text x="756.0" y="325" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">16 B</text>
<text x="410" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">버린 6바이트 = 식별자 2 · 플래그와 오프셋 2 · 헤더 체크섬 2</text>
<path d="M 324.0 272 L 324.0 264 L 900.0 264 L 900.0 272" fill="none" stroke="#F08A59" stroke-width="1.2"/>
<text x="612.0" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">주소 32바이트 = 헤더의 80%</text>
<text x="180" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IPv4 의 제어 정보 12바이트 가운데 절반이 사라졌고, 그 자리를 주소가 채웠습니다. 헤더가 고정 길이가 된 것도 여기서 나옵니다.</text>
<line x1="12" y1="424" x2="912" y2="424" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="446" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="436" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">주소</text>
<rect x="170" y="436" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="192" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IPv6 가 버린 필드</text>
<rect x="370" y="436" width="14" height="12" rx="2" fill="#F5F5F322" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="392" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">양쪽이 함께 가진 제어</text>
<text x="920" y="446" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LENGTH = HEADER BYTES · RFC 791 / RFC 8200</text>
</svg>
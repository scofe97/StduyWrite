<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">사건 순서와 지연 정의는 원문 Figure 7.38 의 것입니다</text>

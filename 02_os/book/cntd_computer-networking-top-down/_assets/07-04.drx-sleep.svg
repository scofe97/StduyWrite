<rect x="24" y="446" width="880" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">숫자로 보면 잠을 안 잘 이유가 없습니다</text>
<text x="44" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">LTE 무전기는 보내거나 받거나 기다릴 때 1,000 에서 3,500 mW 를 쓰고, 꺼져 있을 때는 15 mW 미만입니다.</text>
<text x="44" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">인기 앱을 돌리는 4G·5G 기기에서 통신이 쓰는 에너지가 전체의 20 에서 50 퍼센트를 넘습니다.</text>

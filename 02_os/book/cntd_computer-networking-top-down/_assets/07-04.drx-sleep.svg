<title id="dt">짧게 자다가 길게 자고, 그만큼 늦게 깹니다</title><desc id="dd">무전기를 계속 켜 두지 않으려면 잠들어야 한다. 깊이 잘수록 전력은 아끼지만 도착한 패킷이 오래 기다린다.</desc>

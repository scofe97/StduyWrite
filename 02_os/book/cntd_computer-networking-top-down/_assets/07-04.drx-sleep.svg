<text x="24" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">t0  기지국에서 수신 · 활동 타이머 시작</text>
<text x="484" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">t1  타이머 만료 · 짧은 잠으로</text>
<text x="24" y="354" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">t2  긴 잠으로</text>
<text x="484" y="354" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">t3  패킷 도착 · 기지국이 버퍼링</text>
<text x="24" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">t4  긴 주기 끝 · 깨어남</text>
<text x="484" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">t5  전송 수신 · 타이머 재시작</text>
<line x1="607.52" y1="400" x2="830.24" y2="400" stroke="#E3B341" stroke-width="1.8"/>
<line x1="607.52" y1="392" x2="607.52" y2="408" stroke="#E3B341" stroke-width="1.8"/>

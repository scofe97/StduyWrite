<path d="M 560 148 L 560 162" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)" stroke-dasharray="5 5"/>
<text x="24" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">밥은 K_B(K_A(m)) = m 을 계산해 원래 평문을 얻습니다.</text>
<text x="24" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">대칭키 체계에서는 두 열쇠가 같고 둘 다 비밀입니다. 공개키 체계에서는 한쪽을 온 세상이 압니다.</text>

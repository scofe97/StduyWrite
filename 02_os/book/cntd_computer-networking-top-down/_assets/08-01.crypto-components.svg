<title id="dt">알고리즘은 공개돼 있고 비밀은 열쇠에만 있습니다</title><desc id="dd">두 알고리즘 상자는 표준으로 출판돼 누구나 읽을 수 있다. 아래에서 꽂히는 열쇠 둘만 비밀이다.</desc>
<rect width="1000" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 8.2 · CRYPTOGRAPHIC COMPONENTS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">알고리즘은 공개돼 있고 비밀은 열쇠에만 있습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">다섯 자리와 기호는 원문 Figure 8.2 의 것입니다</text>

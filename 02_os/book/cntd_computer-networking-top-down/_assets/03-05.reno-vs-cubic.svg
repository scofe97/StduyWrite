<title id="dt">톱니와 세제곱 곡선</title><desc id="dd">손실 때마다 창을 줄이고 다시 올리는 모양. Reno 는 선형으로 올라가고 CUBIC 은 손실 직전 값 근처까지 빠르게 올라간다.</desc>

<text x="20" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평균 처리량은 0.75 · W / RTT 입니다. 분모에 RTT 가 있어서 왕복이 짧은 연결이 같은 병목에서 더 많이 가져갑니다.</text>

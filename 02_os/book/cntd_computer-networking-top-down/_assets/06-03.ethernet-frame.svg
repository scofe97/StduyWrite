<title id="dt">최소 프레임 72 바이트를 쪼개 보면</title><desc id="dd">데이터 필드가 46 바이트로 최소일 때 프레임 전체가 72 바이트다. 면적이 곧 바이트 수이며, 칸은 크기순으로 놓았다.</desc>
<rect width="940" height="502" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 6.4.2 · ETHERNET FRAME STRUCTURE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">최소 프레임 72 바이트를 쪼개 보면</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바이트 수는 원문 Figure 6.20 그대로입니다</text>
<rect x="24" y="116" width="352" height="268" rx="6" fill="#F08A591E" stroke="#F08A59" stroke-width="1.5"/>
<text x="200.0" y="236.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">데이터</text>
<text x="200.0" y="262.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="20" font-weight="600" fill="#F08A59">46</text>
<text x="200.0" y="284.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최대 1500 까지 늘어납니다</text>
<rect x="380" y="116" width="204" height="84" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="396" y="162.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">프리앰블</text>
<text x="568" y="162.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">8</text>
<rect x="380" y="204" width="204" height="60" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="396" y="238.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">목적지 MAC</text>
<text x="568" y="238.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">6</text>
<rect x="380" y="268" width="204" height="60" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="396" y="302.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">출발지 MAC</text>
<text x="568" y="302.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">6</text>
<rect x="380" y="332" width="204" height="28" rx="4" fill="#8B98A914" stroke="#8B98A9" stroke-width="1.1"/>
<text x="396" y="350.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">CRC</text>
<text x="568" y="350.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">4</text>

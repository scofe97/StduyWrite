<title id="dt">원래 데이터그램이 통째로 안쪽에 들어갑니다</title><desc id="dd">그래서 원래 출발지와 목적지 주소까지 암호화된다. 바깥에서 보이는 것은 터널 양 끝 주소뿐이다.</desc>
<rect width="1000" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 8.7.4 · THE IPSEC DATAGRAM (TUNNEL MODE)</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">원래 데이터그램이 통째로 안쪽에 들어갑니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">필드 구성과 주소와 프로토콜 번호 50 은 원문 Figure 8.29 의 것입니다</text>
<rect x="24" y="144" width="952" height="208" rx="10" fill="#E3B34108" stroke="#E3B341" stroke-width="1.3"/>
<text x="44" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">새 IP 헤더 — 평문으로 나갑니다</text>
<text x="44" y="196" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">200.168.1.100 → 193.68.2.23 · 프로토콜 번호 50</text>
<rect x="56" y="216" width="888" height="120" rx="8" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.2"/>
<text x="76" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">페이로드 — 원문이 부르는 이름은 엔칠라다 + MAC</text>
<rect x="88" y="264" width="128" height="56" rx="6" fill="#3FB98C16" stroke="#3FB98C" stroke-width="1.2"/>
<text x="152.0" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">ESP 헤더</text>
<text x="152.0" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">SPI · 순서 번호</text>
<rect x="232" y="264" width="400" height="56" rx="6" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="432.0" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">원래 IP 데이터그램</text>
<text x="432.0" y="308" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">172.16.1.17 → 172.16.2.48</text>
<rect x="648" y="264" width="152" height="56" rx="6" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="724.0" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">ESP 트레일러</text>
<text x="724.0" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">패딩 · 패드 길이 · 다음 헤더</text>
<rect x="816" y="264" width="112" height="56" rx="6" fill="#3FB98C16" stroke="#3FB98C" stroke-width="1.2"/>
<text x="872.0" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">ESP 인증</text>
<text x="872.0" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">MAC</text>
<rect x="224" y="256" width="584" height="72" rx="6" fill="none" stroke="#F08A59" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="516" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">이 안쪽만 암호화됩니다</text>
<rect x="24" y="376" width="470" height="180" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">R1 이 만드는 순서</text>
<line x1="44" y1="416" x2="474" y2="416" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="44" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1. 원래 데이터그램 뒤에 ESP 트레일러</text>
<text x="44" y="456" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">2. 그 결과를 암호화</text>
<text x="44" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">3. 앞에 ESP 헤더 — 여기까지가 엔칠라다</text>
<text x="44" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">4. 엔칠라다 전체에 MAC 계산</text>
<text x="44" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">5. MAC 을 뒤에 붙여 페이로드 완성</text>
<text x="44" y="528" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">6. 앞에 새 IP 헤더 (보통 20바이트)</text>
<rect x="514" y="376" width="462" height="180" rx="8" fill="#F0616D12" stroke="#F0616D" stroke-width="1.3"/>
<text x="534" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">트루디가 아는 것은 이것뿐입니다</text>
<line x1="534" y1="416" x2="956" y2="416" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="534" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">200.168.1.100 에서 193.68.2.23 으로 간다는 것.</text>
<text x="534" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCP 인지 UDP 인지 ICMP 인지 모릅니다.</text>
<text x="534" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">HTTP 인지 SMTP 인지도 모릅니다.</text>
<text x="534" y="528" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">이 기밀성이 TLS 보다 훨씬 멀리 갑니다.</text>
<line x1="12" y1="580" x2="952" y2="580" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="602" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="592" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평문으로 남는 것</text>
<rect x="261" y="592" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="283" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">페이로드</text>
<rect x="357" y="592" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="379" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">암호화되는 것</text>
<rect x="492" y="592" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="514" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">트루디의 시야</text>
</svg>
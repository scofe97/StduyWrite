<title id="dt">MAC 주소는 홉마다 바뀌고 IP 주소는 그대로입니다</title><desc id="dd">서브넷 1 의 호스트가 서브넷 2 의 호스트로 보낼 때, 첫 프레임의 목적지 MAC 은 최종 목적지가 아니라 첫 홉 라우터의 것이다.</desc>

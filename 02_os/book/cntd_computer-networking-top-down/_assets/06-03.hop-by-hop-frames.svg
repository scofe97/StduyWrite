<text x="24" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">첫 프레임의 목적지 MAC 을 최종 목적지의 것으로 두면 서브넷 1 의 어느 어댑터도 그 프레임을 위로 올리지 않습니다.</text>
<text x="24" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터그램은 그대로 사라집니다. 그래서 첫 홉 라우터 인터페이스의 MAC 을 ARP 로 먼저 알아냅니다.</text>
<text x="24" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">라우터는 포워딩 표로 나갈 인터페이스를 고르고, 그 인터페이스가 새 프레임을 만들어 다시 ARP 로 목적지 MAC 을 얻습니다.</text>
<line x1="12" y1="490" x2="952" y2="490" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

<title id="dt">크로스바 — 줄이 겹치지 않으면 나란히 건넙니다</title><desc id="dd">원문 4.2.2 의 셋째 방식. N 입력과 N 출력을 잇는 2N 개의 버스가 놓이고, 가로와 세로가 만나는 교차점을 패브릭 컨트롤러가 열고 닫는다. 쓰는 줄이 겹치지 않으면 여러 쌍이 동시에 건너므로 버스 방식의 상한을 넘는다.</desc>

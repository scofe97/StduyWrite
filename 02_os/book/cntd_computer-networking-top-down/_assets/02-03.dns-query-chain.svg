<title id="dt">이름 하나에 메시지 여덟 개</title><desc id="dd">원문 Figure 2.17. cse.nyu.edu 가 gaia.cs.umass.edu 의 주소를 얻는 과정. 질의 넷과 응답 넷이 오간다.</desc>

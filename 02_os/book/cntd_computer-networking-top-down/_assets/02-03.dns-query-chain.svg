<text x="203.0" y="529" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">answer</text>
<text x="20" y="592" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가운데 여섯 개가 반복 질의입니다 — 루트도 TLD 도 답을 대신 구해다 주지 않고 다음 단계의 주소만 돌려줍니다.</text>
<text x="20" y="614" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TLD 가 권한 서버를 바로 모르고 중간 서버를 한 단계 더 거치면 메시지가 열 개가 됩니다.</text>

<path d="M 178 376 L 208 376 L 208 306 L 244 306" fill="none" stroke="#3FB98C" stroke-width="1.1" marker-end="url(#ok)" stroke-dasharray="4 5"/>
<rect x="596" y="116" width="320" height="140" rx="7" fill="#161B22" stroke="#6A95D844" stroke-width="1.2"/>
<text x="612" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">소프트웨어가 맡는 일 · 호스트 CPU</text>
<line x1="612" y1="150" x2="900" y2="150" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="612" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  링크 계층 주소 정보를 조립합니다</text>
<text x="612" y="194" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  컨트롤러 하드웨어를 활성화합니다</text>
<text x="612" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  컨트롤러 인터럽트에 응답합니다</text>
<text x="612" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  데이터그램을 네트워크 계층으로 올립니다</text>
<rect x="596" y="272" width="320" height="140" rx="7" fill="#161B22" stroke="#3FB98C44" stroke-width="1.2"/>
<text x="612" y="296" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">하드웨어가 맡는 일 · 어댑터 칩</text>
<line x1="612" y1="306" x2="900" y2="306" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="612" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  데이터그램을 프레임에 담습니다</text>
<text x="612" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  링크 접속 규칙대로 내보냅니다</text>
<text x="612" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  오류 검출 비트를 채우고 검사합니다</text>
<text x="612" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  프레임을 받아 데이터그램을 꺼냅니다</text>
<line x1="24" y1="440" x2="892" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이더넷 기능은 마더보드 칩셋에 통합돼 있거나 값싼 전용 이더넷 칩으로 구현됩니다. 어느 쪽이든 프레이밍·링크 접속·오류 검출은 그 칩 안에서 끝납니다.</text>
<text x="24" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">링크 계층은 이 둘의 조합입니다. 스택에서 소프트웨어가 하드웨어를 만나는 자리가 여기입니다.</text>
<line x1="12" y1="496" x2="892" y2="496" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="518" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="508" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트 CPU 위 소프트웨어</text>
<rect x="339" y="508" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="361" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어댑터 칩 위 하드웨어</text>
<rect x="539" y="508" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="561" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">둘이 만나는 자리</text>

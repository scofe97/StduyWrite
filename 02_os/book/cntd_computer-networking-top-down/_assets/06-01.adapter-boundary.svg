<title id="dt">링크 계층은 칩과 CPU 에 걸쳐 있습니다</title><desc id="dd">프로토콜 스택의 어느 층이 호스트 CPU 위 소프트웨어이고 어느 층이 어댑터 칩 위 하드웨어인지. 링크 계층만 그 경계에 걸친다.</desc>
<rect width="940" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 6.1.2 · WHERE THE LINK LAYER RUNS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">링크 계층은 칩과 CPU 에 걸쳐 있습니다</text>

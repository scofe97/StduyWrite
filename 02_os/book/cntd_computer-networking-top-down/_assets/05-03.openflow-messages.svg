<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">내려가는 넷과 올라오는 셋</title><desc id="dd">OpenFlow 가 컨트롤러와 스위치 사이에서 나르는 메시지. 내려가는 것은 표를 바꾸거나 값을 묻는 명령이고, 올라오는 것은 스위치가 겪은 일의 보고다.</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.5.2 · OPENFLOW MESSAGES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">내려가는 넷과 올라오는 셋</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">TCP 위에서 돌고 기본 포트는 6653 입니다</text>
<rect x="24" y="116" width="952" height="34" rx="6" fill="#F08A590C" stroke="#F08A59" stroke-width="1.2"/>
<text x="500" y="139" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">컨트롤러 → 스위치 · 명령</text>
<rect x="24" y="166" width="224" height="78" rx="7" fill="#161B22" stroke="#F08A5966" stroke-width="1.2"/>
<text x="136" y="194" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">Configuration</text>
<text x="136" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정 값을 묻고 정합니다</text>
<path d="M 136 244 L 136 268" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<rect x="264" y="166" width="224" height="78" rx="7" fill="#161B22" stroke="#F08A5966" stroke-width="1.2"/>
<text x="376" y="194" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">Modify-State</text>
<text x="376" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">흐름 표 항목을 더하고 지우고 고칩니다</text>
<path d="M 376 244 L 376 268" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<rect x="504" y="166" width="224" height="78" rx="7" fill="#161B22" stroke="#F08A5966" stroke-width="1.2"/>
<text x="616" y="194" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">Read-State</text>
<text x="616" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">흐름 표와 포트의 통계·계수기를 모읍니다</text>
<path d="M 616 244 L 616 268" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<rect x="744" y="166" width="224" height="78" rx="7" fill="#161B22" stroke="#F08A5966" stroke-width="1.2"/>
<text x="856" y="194" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">Send-Packet</text>
<text x="856" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">지정한 포트로 패킷 하나를 내보냅니다</text>
<path d="M 856 244 L 856 268" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<rect x="24" y="274" width="952" height="46" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="500" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">OpenFlow 위에서 도는 TCP 연결 · 기본 포트 6653</text>
<path d="M 176 372 L 176 322" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<rect x="24" y="378" width="304" height="78" rx="7" fill="#161B22" stroke="#6A95D866" stroke-width="1.2"/>
<text x="176" y="406" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">Flow-Removed</text>
<text x="176" y="430" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">표 항목이 사라졌음을 알립니다</text>
<path d="M 496 372 L 496 322" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<rect x="344" y="378" width="304" height="78" rx="7" fill="#161B22" stroke="#6A95D866" stroke-width="1.2"/>
<text x="496" y="406" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">Port-status</text>
<text x="496" y="430" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">포트 상태가 바뀌었음을 알립니다</text>
<path d="M 816 372 L 816 322" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<rect x="664" y="378" width="304" height="78" rx="7" fill="#161B22" stroke="#6A95D866" stroke-width="1.2"/>
<text x="816" y="406" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">Packet-in</text>
<text x="816" y="430" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">일치하는 항목이 없던 패킷을 올려보냅니다</text>
<rect x="24" y="472" width="952" height="34" rx="6" fill="#6A95D80C" stroke="#6A95D8" stroke-width="1.2"/>
<text x="500" y="495" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">스위치 → 컨트롤러 · 보고</text>
<text x="30" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Packet-in 이 4장의 이야기와 이어집니다. 흐름 표에 일치하는 항목이 없는 패킷을 컨트롤러로 보내는 동작이,</text>
<text x="30" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">일치 실패를 폐기가 아니라 질문으로 바꿉니다.</text>
<line x1="12" y1="576" x2="952" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="588" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">내려가는 명령</text>
<rect x="235" y="588" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="257" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">올라오는 보고</text>
</svg>
<text x="960" y="748" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">KUROSE-ROSS 9E DV PSEUDOCODE L9-L19</text>

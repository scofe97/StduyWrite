<title id="dt">바퀴는 표를 고쳐 쓰며 돕니다</title><desc id="dd">거리 벡터 알고리즘의 주 루프. 다섯 정거장이 시계 방향으로 돌고, 그중 셋이 가운데 거리 벡터 표에 기록을 남긴다. 표가 더 바뀌지 않으면 전파가 멈추고 루프는 스스로 조용해진다.</desc>
<rect width="1000" height="780" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.2.2 · DISTANCE-VECTOR LOOP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">바퀴는 표를 고쳐 쓰며 돕니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">멈추라는 신호가 따로 없습니다 — 보낼 것이 없어지면 그냥 멈춥니다</text>

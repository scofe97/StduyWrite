<title id="dt">시험용 패킷이 닿았는지로 크기를 정합니다</title><desc id="dd">문제 도식과 같은 망이고 방화벽은 ICMP 를 막는다. 송신자는 기본 크기 1084 바이트로 보내 통과한다. 1500 바이트 패킷은 터널 입구에서 버려지고 Packet Too Big 은 방화벽에서 막혀 확인 응답이 오지 않는다. 1480 바이트 패킷은 통과해 수신자의 확인 응답이 돌아오고, 송신자는 경로 MTU 를 1480 으로 올린다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP · PLPMTUD · TCP_MTU_PROBING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">시험용 패킷이 닿았는지로 크기를 정합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">방화벽은 그대로 ICMP 를 막습니다. 송신자는 알림을 기다리지 않고 시험용 패킷에 확인 응답이 오는지를 봅니다</text>

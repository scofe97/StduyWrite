<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 815" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">거짓말은 거쳐 가는 이웃 하나에게만 합니다</title><desc id="dd">독 뿌린 역경로가 두 노드 루프는 막고 세 노드 고리는 못 막는 이유. 거짓말은 자기가 지금 거쳐 가는 이웃 한 쪽으로만 가고, 반대 방향은 열려 있다.</desc>
<rect width="1000" height="815" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.2.2 · POISONED REVERSE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">거짓말은 거쳐 가는 이웃 하나에게만 합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">막는 방향과 정보가 도는 방향이 서로 반대입니다</text>
<text x="24" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">두 노드가 맞물린 루프 — 막힘</text>
<line x1="24" y1="142" x2="976" y2="142" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="3 6"/>
<rect x="168.0" y="190" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="210" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">y</text>
<rect x="478.0" y="190" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="520" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">z</text>
<rect x="788.0" y="190" width="84" height="40" rx="7" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="830" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">x</text>
<text x="830" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">목적지</text>
<line x1="252" y1="210" x2="478" y2="210" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="562" y1="210" x2="788" y2="210" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<path d="M 474 195 L 256 195" fill="none" stroke="#F0616D" stroke-width="1.7" marker-end="url(#bad)" stroke-dasharray="5 4"/>
<text x="365" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">D_z(x) = 무한대  (거짓말)</text>
<path d="M 566 225 L 784 225" fill="none" stroke="#3FB98C" stroke-width="1.7" marker-end="url(#ok)"/>
<text x="675" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">z 는 실제로 y 를 거침</text>
<text x="24" y="278" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">z 는 x 로 갈 때 y 경유 → y 에게 "x 까지 무한대" 광고 · y 는 z 를 거칠 생각을 하지 않음</text>
<text x="24" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 c(y,x) 가 올라도 y 는 직통 값을 그대로 쓰고, z 는 곧장 자기 직통으로 옮겨 감 · 2 씩 오르는 왕복이 생기지 않음</text>
<text x="24" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">세 노드가 고리를 이루면 — 뚫림</text>
<line x1="24" y1="452" x2="976" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="3 6"/>
<rect x="168.0" y="500" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="210" y="526" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">y</text>
<rect x="478.0" y="500" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="520" y="526" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">z</text>
<rect x="788.0" y="500" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="830" y="526" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">w</text>
<line x1="252" y1="520" x2="478" y2="520" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="562" y1="520" x2="788" y2="520" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="210" y1="540" x2="210" y2="582" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="210" y1="582" x2="830" y2="582" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="830" y1="582" x2="830" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="520" y="574" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">고리가 닫힘</text>
<path d="M 566 505 L 784 505" fill="none" stroke="#F0616D" stroke-width="1.7" marker-end="url(#bad)" stroke-dasharray="5 4"/>
<text x="675" y="494" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">z 가 막은 상대는 w</text>
<path d="M 474 535 L 256 535" fill="none" stroke="#3FB98C" stroke-width="1.7" marker-end="url(#ok)"/>
<text x="365" y="554" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">y 에게는 유한한 값 그대로 광고</text>
<text x="24" y="616" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">y 가 z 를 거친다는 사실 자체가 z 가 y 에게 유한한 값을 줬다는 뜻 · 그 광고를 막는 쪽이 없습니다 — z 가 입을 막은 상대는 w 이지 y 가 아니기 때문</text>
<text x="24" y="638" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">w → z 와 y → w 도 같은 이유로 열려 있어, 잘못된 값이 고리를 거꾸로 한 바퀴 돌아 제자리로 옴</text>
<rect x="300" y="700" width="400" height="32" rx="7" fill="#F0616D12" stroke="#F0616D" stroke-width="1.3"/>
<text x="500" y="721" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">거짓말은 한 방향, 정보는 반대 방향</text>
<line x1="12" y1="752" x2="952" y2="752" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="774" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="764" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="774" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">무한대라는 거짓말</text>
<rect x="261" y="764" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="283" y="774" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">막히지 않은 광고</text>
<rect x="422" y="764" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="444" y="774" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">목적지</text>
</svg>
<title id="dt">알림이 닿으면 1480 으로 줄여 통과합니다</title><desc id="dd">문제 도식과 같은 망에서 방화벽이 ICMP 를 통과시킨다. 작은 패킷은 끝까지 간다. 1500 바이트 패킷이 터널 입구에서 버려지고 라우터가 MTU 1480 을 적은 Packet Too Big 을 돌려보낸다. 알림이 방화벽을 지나 송신자에게 닿고, 송신자는 경로 MTU 추정을 1480 으로 낮춘 뒤 1480 바이트로 보내 수신자까지 통과한다.</desc>
<rect width="1000" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">IPV6 · PATH MTU DISCOVERY · RFC 8201</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">알림이 닿으면 1480 으로 줄여 통과합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 그림과 같은 망입니다. 달라진 것은 방화벽이 알림을 통과시킨다는 한 가지입니다</text>

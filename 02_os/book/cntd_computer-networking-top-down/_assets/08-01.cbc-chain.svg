<title id="dt">앞 블록의 결과가 다음 블록의 무작위가 됩니다</title><desc id="dd">블록마다 무작위를 보내면 대역폭이 두 배가 된다. 그래서 무작위는 맨 앞 한 번만 보내고 그다음은 직전 암호문을 쓴다.</desc>
<rect width="1000" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 8.2.1 · CIPHER BLOCK CHAINING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">앞 블록의 결과가 다음 블록의 무작위가 됩니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">평문과 IV 와 세 암호문 블록은 원문 예제의 값입니다</text>
<text x="24" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">독립 암호화 — 같은 평문이 같은 암호문이 됩니다</text>
<rect x="172" y="152" width="132" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="238.0" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">010</text>
<path d="M 238.0 204 L 238.0 230" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="172" y="234" width="132" height="48" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.2"/>
<text x="238.0" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">101</text>
<rect x="360" y="152" width="132" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="426.0" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">010</text>
<path d="M 426.0 204 L 426.0 230" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="360" y="234" width="132" height="48" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.2"/>
<text x="426.0" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">101</text>
<rect x="548" y="152" width="132" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="614.0" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">010</text>
<path d="M 614.0 204 L 614.0 230" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="548" y="234" width="132" height="48" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.2"/>
<text x="614.0" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">101</text>
<text x="24" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">평문</text>
<text x="24" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">암호문</text>
<text x="744" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">반복이 그대로 보입니다</text>
<line x1="24" y1="272" x2="976" y2="272" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">CBC — 직전 암호문을 섞어 넣습니다</text>
<rect x="24" y="320" width="116" height="48" rx="6" fill="#F08A5920" stroke="#F08A59" stroke-width="1.4"/>
<text x="82" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">IV = c(0)</text>
<text x="82" y="360" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">001</text>
<text x="82" y="390" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">평문으로 보냅니다</text>
<rect x="196" y="320" width="220" height="104" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="306.0" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">m(1)=010</text>
<text x="306.0" y="370" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">⊕ 앞 값 → 011</text>
<text x="306.0" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">K_S 통과</text>
<rect x="224" y="440" width="164" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.3"/>
<text x="306.0" y="468" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">c(1)=100</text>
<path d="M 306.0 426 L 306.0 436" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 142 344 L 190 344" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 340.0 462 L 432 462 L 432 344 L 442 344" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="448" y="320" width="220" height="104" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="558.0" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">m(2)=010</text>
<text x="558.0" y="370" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">⊕ 앞 값 → 110</text>
<text x="558.0" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">K_S 통과</text>
<rect x="476" y="440" width="164" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.3"/>
<text x="558.0" y="468" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">c(2)=000</text>
<path d="M 558.0 426 L 558.0 436" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 592.0 462 L 684 462 L 684 344 L 694 344" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="700" y="320" width="220" height="104" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="810.0" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">m(3)=010</text>
<text x="810.0" y="370" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">⊕ 앞 값 → 010</text>
<text x="810.0" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">K_S 통과</text>
<rect x="728" y="440" width="164" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.3"/>
<text x="810.0" y="468" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">c(3)=101</text>
<path d="M 810.0 426 L 810.0 436" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="24" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">받는 쪽은 c(i) 를 복호해 m(i) ⊕ c(i−1) 을 얻고, 이미 아는 c(i−1) 을 다시 걷어 평문을 복원합니다.</text>
<text x="24" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IV 가 평문으로 나가도 열쇠 K_S 를 모르면 복호할 수 없고, 추가로 나가는 것은 이 한 블록뿐입니다.</text>
<line x1="12" y1="560" x2="952" y2="560" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="582" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="572" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">반복이 드러남</text>
<rect x="235" y="572" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="257" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">연쇄 뒤 암호문</text>
<rect x="383" y="572" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="405" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한 번만 보내는 IV</text>
<rect x="570" y="572" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="592" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">열쇠로 하는 일</text>
</svg>
<title id="dt">광고를 막으면 그 길로는 아무도 보내지 않습니다</title><desc id="dd">백본 A·B·C 와 액세스 W·X·Y 로 된 같은 망에서 두 장면을 본다. 장면 1 에서 X 는 X-C-Y 를 B 에게 광고하지 않아 B 의 Y 행 트래픽이 X 를 지나지 않는다. 장면 2 에서 B 는 A 에게서 배운 W 행 경로를 고객 X 에게만 알리고 C 에게는 알리지 않아, C 가 B 를 거쳐 W 로 보내지 않는다.</desc>
<rect width="1000" height="604" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.4.5 · TRANSIT POLICY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">광고를 막으면 그 길로는 아무도 보내지 않습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 망에서 두 장면을 봅니다. 파란 화살표는 광고, 빨간 점선은 막은 광고, 초록은 그 결과 트래픽이 타는 길입니다.</text>

<title id="dt">라우터는 안에서 무엇을 하는가 — 여섯 박자로 읽는 지도</title><desc id="dd">04-01 편의 전체 구조. 포워딩 테이블을 누가 채우는가라는 물음에서 출발해, 망이 무엇을 약속하는지, 상자 안의 네 부분, 조회와 스위칭을 거쳐 일치 후 동작이라는 추상에 닿는다.</desc>
<rect width="1000" height="406" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 04-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">라우터는 안에서 무엇을 하는가 — 여섯 박자로 읽는 지도</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">누가 채우나 → 무엇을 약속하나 → 상자 안 넷 → 조회 → 옮김 → 하나의 틀</text>
<text x="83.66666666666667" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§1</text>
<rect x="12.0" y="132" width="143.33333333333334" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="83.66666666666667" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">두 평면</text>
<line x1="26.0" y1="182" x2="141.33333333333334" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="83.66666666666667" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">테이블을 누가 채우나</text>
<text x="24.0" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 전통: 라우터 안</text>
<text x="24.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· SDN: 원격 컨트롤러</text>
<text x="24.0" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 5장으로 이어짐</text>
<path d="M 157.33333333333334 230.0 L 168.33333333333334 230.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="243.0" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§2</text>
<rect x="171.33333333333334" y="132" width="143.33333333333334" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="243.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">서비스 모델</text>
<line x1="185.33333333333334" y1="182" x2="300.6666666666667" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="243.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">망은 무엇을 약속하나</text>
<text x="183.33333333333334" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 후보는 다섯</text>
<text x="183.33333333333334" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 고른 것은 최선 노력</text>
<text x="183.33333333333334" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 위가 메운다</text>
<path d="M 316.6666666666667 230.0 L 327.6666666666667 230.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="402.33333333333337" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§3</text>
<rect x="330.6666666666667" y="132" width="143.33333333333334" height="196" rx="6" fill="#F08A5910" stroke="#F08A59" stroke-width="1.4"/>
<text x="402.33333333333337" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">네 부분</text>
<line x1="344.6666666666667" y1="182" x2="460.0" y2="182" stroke="#F08A5944" stroke-width="0.9"/>
<text x="402.33333333333337" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">상자 안의 넷</text>
<text x="342.6666666666667" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 입력·패브릭·출력</text>
<text x="342.6666666666667" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 라우팅 프로세서</text>
<text x="342.6666666666667" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 셋은 나노초</text>
<path d="M 476.0 230.0 L 487.0 230.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="561.6666666666666" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§4</text>
<rect x="490.0" y="132" width="143.33333333333334" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="561.6666666666666" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">조회</text>
<line x1="504.0" y1="182" x2="619.3333333333334" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="561.6666666666666" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">접두로 찾는다</text>
<text x="502.0" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 항목 넷이면 된다</text>
<text x="502.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 긴 접두가 이긴다</text>
<text x="502.0" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· TCAM 한 클록</text>
<path d="M 635.3333333333334 230.0 L 646.3333333333334 230.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="721.0" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§5</text>
<rect x="649.3333333333334" y="132" width="143.33333333333334" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="721.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">스위칭</text>
<line x1="663.3333333333334" y1="182" x2="778.6666666666667" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="721.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">옮기는 방법 셋</text>
<text x="661.3333333333334" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 메모리 B/2</text>
<text x="661.3333333333334" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 버스 하나씩</text>
<text x="661.3333333333334" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 크로스바 나란히</text>
<path d="M 794.6666666666667 230.0 L 805.6666666666667 230.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="880.3333333333334" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§6</text>
<rect x="808.6666666666667" y="132" width="143.33333333333334" height="196" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.4"/>
<text x="880.3333333333334" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">일치 후 동작</text>
<line x1="822.6666666666667" y1="182" x2="938.0000000000001" y2="182" stroke="#3FB98C44" stroke-width="0.9"/>
<text x="880.3333333333334" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">장치들의 공통 틀</text>
<text x="820.6666666666667" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 라우터·스위치</text>
<text x="820.6666666666667" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 방화벽·NAT</text>
<text x="820.6666666666667" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 04-04 로</text>
<text x="500.0" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">강조된 칸이 이 편의 축입니다 — 데이터 평면은 나노초, 제어 평면은 초. 그 차이가 나머지 절을 설명합니다.</text>
<line x1="12" y1="362" x2="952" y2="362" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

<title id="dt">채널이 좋은 기기를 밀어줄 것인가, 고르게 나눌 것인가</title><desc id="dd">무선에서는 누구에게 보내느냐가 총 처리량을 바꾼다. 그래서 스케줄러 선택이 곧 성능 정책이다.</desc>
<rect width="940" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 7.3.5 · MAC SCHEDULING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">채널이 좋은 기기를 밀어줄 것인가, 고르게 나눌 것인가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">네 알고리즘의 성격 판정은 원문 §7.3.5 의 서술입니다</text>
<line x1="130" y1="110" x2="130" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="130" y1="452" x2="582" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="130" y1="287.0" x2="570" y2="287.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 6"/>
<line x1="350.0" y1="452" x2="350.0" y2="122" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 6"/>
<text x="350.0" y="478" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">채널 상태를 보는 정도</text>
<text x="120" y="456" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">낮음</text>
<text x="570" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E"></text>
<text x="34" y="279.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">처리량 공평성</text>
<text x="34" y="299.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">위쪽이 더 고름</text>
<circle cx="191.60000000000002" cy="313.4" r="9" fill="#6A95D844" stroke="#6A95D8" stroke-width="1.6"/>
<text x="191.60000000000002" y="289.4" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">RR</text>
<text x="191.60000000000002" y="341.4" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">순번은 고르지만</text>
<circle cx="517.2" cy="395.9" r="9" fill="#F0616D44" stroke="#F0616D" stroke-width="1.6"/>
<text x="517.2" y="371.9" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">MT</text>
<text x="517.2" y="423.9" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">총량 최대, 공평 없음</text>
<circle cx="332.4" cy="155.0" r="9" fill="#3FB98C44" stroke="#3FB98C" stroke-width="1.6"/>
<text x="332.4" y="131.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">BET</text>
<text x="332.4" y="183.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">처리량을 고르게</text>
<circle cx="508.4" cy="214.4" r="9" fill="#F08A5944" stroke="#F08A59" stroke-width="1.6"/>
<text x="508.4" y="190.4" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">PF</text>
<text x="508.4" y="242.4" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">둘 사이의 균형</text>
<rect x="620" y="122" width="284" height="330" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="640" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">무엇을 최대로 만드는가</text>
<line x1="640" y1="160" x2="884" y2="160" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="640" y="184" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">RR</text>
<text x="640" y="204" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">기기마다 같은 수의 자원 블록</text>
<text x="640" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">채널도 QoS 도 안 봅니다</text>
<text x="640" y="250" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">MT</text>
<text x="640" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">보고된 채널 품질이 가장 좋은 기기</text>
<text x="640" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">한 기기가 다 가져갈 수 있습니다</text>
<text x="640" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">BET</text>
<text x="640" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">평균 처리량이 가장 낮은 기기</text>
<text x="640" y="354" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">지수 가중 이동 평균을 씁니다</text>
<text x="640" y="382" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">PF</text>
<text x="640" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">기대 처리량을 평균 처리량으로 나눈 값</text>
<text x="640" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">높은 쪽에 자원 블록을 줍니다</text>
<rect x="24" y="500" width="880" height="62" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">표준은 스케줄링 알고리즘을 정하지 않습니다</text>
<text x="44" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">3GPP 도 WiFi 표준도 이것을 규정하지 않아서, 사업자와 장비 회사가 서로를 가르는 비법으로 씁니다.</text>
<line x1="12" y1="576" x2="892" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="588" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">채널 무관</text>
<rect x="209" y="588" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="231" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">총량 우선</text>
<rect x="318" y="588" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="340" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공평 우선</text>
<rect x="427" y="588" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="449" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">균형</text>
</svg>
<title id="dt">셋 중 둘만 고를 수 있습니다</title><desc id="dd">IoT 기술은 넓은 커버리지와 낮은 에너지와 높은 데이터율 가운데 둘을 강조한다. 셋을 다 강조하는 것은 없다.</desc>
<rect width="940" height="604" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 7.6.3 · IOT NETWORKING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">셋 중 둘만 고를 수 있습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세 축과 그룹 구분은 원문 Figure 7.51 의 것입니다</text>
<path d="M 290.0 246.5 L 327.7 311.8 L 252.3 311.8 Z" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<path d="M 290.0 204.2 L 364.3 332.9 L 215.7 332.9 Z" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<path d="M 290.0 162.0 L 400.9 354.0 L 179.1 354.0 Z" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="290" y1="290" x2="290.0" y2="162.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="290.0" y="132.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">넓은 커버리지</text>
<line x1="290" y1="290" x2="400.85125168440817" y2="354.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="438.9563694509235" y="369.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">높은 데이터율</text>
<line x1="290" y1="290" x2="179.14874831559183" y2="354.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="141.04363054907654" y="369.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">낮은 에너지</text>
<path d="M 290.0 259.3 L 334.3 315.6 L 185.8 350.2 Z" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.8"/>
<path d="M 290.0 169.7 L 314.4 304.1 L 192.5 346.3 Z" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.8"/>
<path d="M 290.0 174.8 L 392.0 348.9 L 261.2 306.6 Z" fill="#F08A5922" stroke="#F08A59" stroke-width="1.8"/>
<rect x="560" y="138" width="344" height="268" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="580" y="164" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">원문이 묶은 세 그룹</text>
<line x1="580" y1="176" x2="884" y2="176" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="580" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">짧은 거리 · 저에너지</text>
<text x="580" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">802.11ah — 100 kbps 대에서 5~10 Mbps,</text>
<text x="580" y="235" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">900 MHz 비면허, 중계로 1 km 까지</text>
<text x="580" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">BLE · Zigbee — 802.15.4 위에서 저속</text>
<text x="580" y="283" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">넓은 지역 · 저에너지</text>
<text x="580" y="301" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">LoRaWAN — 채널당 0.3~50 kbit/s,</text>
<text x="580" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">902~928 MHz, 별의 별 위상</text>
<text x="580" y="335" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">NB-IoT — 200 kHz 채널, 약 250 kbps</text>
<text x="580" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">넓은 지역 · 고속</text>
<text x="580" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">LTE-M — NB-IoT 의 다섯 배 채널 폭,</text>
<text x="580" y="401" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">기지국 간 이동성을 받칩니다</text>
<rect x="24" y="436" width="880" height="82" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">그래서 승자 독식이 안 됩니다</text>
<text x="44" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어느 기술도 세 축을 다 강조하지 못하므로, 맥락에 따라 다른 답이 채택될 것으로 원문은 봅니다.</text>
<text x="44" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">쓰임이 워낙 갈리고 시장이 커서 경쟁 기술이 여럿 남아 있습니다.</text>
<line x1="12" y1="542" x2="892" y2="542" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="564" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="554" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">짧은 거리 · 저에너지</text>
<rect x="300" y="554" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="322" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">넓은 지역 · 저에너지</text>
<rect x="500" y="554" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="522" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">넓은 지역 · 고속</text>
</svg>
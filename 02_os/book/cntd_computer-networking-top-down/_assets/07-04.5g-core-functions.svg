<title id="dt">제어는 여럿이 나눠 맡고 데이터는 하나가 다 나릅니다</title><desc id="dd">5G 코어는 기능 단위로 쪼개진 서비스 모음이다. 그중 사용자 데이터를 나르는 것은 UPF 하나뿐이다.</desc>
<rect width="940" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 7.4.1 · 5G CORE NETWORK FUNCTIONS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">제어는 여럿이 나눠 맡고 데이터는 하나가 다 나릅니다</text>

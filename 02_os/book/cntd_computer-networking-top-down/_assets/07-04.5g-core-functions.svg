<text x="44" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">왜 코어망이 셀룰러에만 있는가</text>
<text x="44" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1G·2G 는 전화망이었고 3G 도 주로 전화망이었습니다. 신원·이동성·로밍·과금이 처음부터 필요했습니다.</text>
<text x="44" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그때 인터넷에는 그런 서비스가 없었고, 지금도 일반 ISP 에는 없습니다. 그 차이가 코어망으로 남았습니다.</text>

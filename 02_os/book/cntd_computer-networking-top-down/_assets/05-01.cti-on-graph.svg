<title id="dt">다음 홉이 서로를 가리키면 패킷이 갇힙니다</title><desc id="dd">x 를 목적지로 두고 y 와 z 의 다음 홉을 화살표로 그린 세 컷. 링크 비용이 오른 뒤 두 화살표가 마주 보며 라우팅 루프가 되고, z 가 직통으로 돌아설 때 풀린다.</desc>
<rect width="1000" height="800" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.2.2 · COUNT TO INFINITY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">다음 홉이 서로를 가리키면 패킷이 갇힙니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표는 x 로 가려고 그 노드가 고른 다음 홉입니다 — 마주 보면 패킷이 둘 사이를 오갑니다</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">1. 사고 직전 — 각자 제 갈 길로 감</text>
<line x1="24" y1="122" x2="976" y2="122" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="3 6"/>
<rect x="148" y="150" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="190" y="176" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">y</text>
<rect x="458" y="150" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="176" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">z</text>
<rect x="768" y="150" width="84" height="40" rx="7" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="810" y="176" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">x</text>
<text x="810" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">목적지</text>
<line x1="232" y1="170" x2="458" y2="170" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="542" y1="170" x2="768" y2="170" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="345" y="162" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<text x="655" y="162" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">50</text>
<line x1="190" y1="190" x2="190" y2="228" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="190" y1="228" x2="810" y2="228" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="810" y1="228" x2="810" y2="190" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="220" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">4</text>
<path d="M 190 194 L 190 224 L 810 224 L 810 194" fill="none" stroke="#3FB98C" stroke-width="1.7" marker-end="url(#ok)"/>
<path d="M 454 183 L 236 183" fill="none" stroke="#3FB98C" stroke-width="1.7" marker-end="url(#ok)"/>
<text x="190" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">D_y(x) = 4</text>
<text x="500" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">D_z(x) = 5</text>
<text x="24" y="280" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">y 는 직통 링크로 바로 감 · z 는 y 를 거쳐 5  · 화살표가 마주 보지 않음</text>
<text x="24" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">2. c(y,x) 가 60 으로 오릅니다 — 두 화살표가 마주 봄</text>
<line x1="24" y1="342" x2="976" y2="342" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="3 6"/>
<rect x="148" y="370" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="190" y="396" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">y</text>
<rect x="458" y="370" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="396" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">z</text>
<rect x="768" y="370" width="84" height="40" rx="7" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="810" y="396" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">x</text>
<text x="810" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">목적지</text>
<line x1="232" y1="390" x2="458" y2="390" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="542" y1="390" x2="768" y2="390" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="345" y="382" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<text x="655" y="382" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">50</text>
<line x1="190" y1="410" x2="190" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="190" y1="448" x2="810" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="810" y1="448" x2="810" y2="410" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="440" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">60</text>
<path d="M 236 377 L 454 377" fill="none" stroke="#F0616D" stroke-width="1.7" marker-end="url(#bad)"/>
<path d="M 454 403 L 236 403" fill="none" stroke="#F0616D" stroke-width="1.7" marker-end="url(#bad)"/>
<text x="190" y="474" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">D_y(x) = 6</text>
<text x="500" y="474" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">D_z(x) = 7</text>
<text x="24" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">y 는 z 의 5 를 믿고 min{60, 1+5} = 6 을 냄 · 그런데 z 는 여전히 y 를 거침 · x 로 갈 패킷이 둘 사이를 오감</text>
<text x="24" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">3. z 가 직통으로 돌아섭니다 — 루프가 풀림</text>
<line x1="24" y1="562" x2="976" y2="562" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="3 6"/>
<rect x="148" y="590" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="190" y="616" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">y</text>
<rect x="458" y="590" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="616" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">z</text>
<rect x="768" y="590" width="84" height="40" rx="7" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="810" y="616" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">x</text>
<text x="810" y="580" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">목적지</text>
<line x1="232" y1="610" x2="458" y2="610" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="542" y1="610" x2="768" y2="610" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="345" y="602" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<text x="655" y="602" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">50</text>
<line x1="190" y1="630" x2="190" y2="668" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="190" y1="668" x2="810" y2="668" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="810" y1="668" x2="810" y2="630" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="660" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">60</text>
<path d="M 236 597 L 454 597" fill="none" stroke="#3FB98C" stroke-width="1.7" marker-end="url(#ok)"/>
<path d="M 546 610 L 764 610" fill="none" stroke="#3FB98C" stroke-width="1.7" marker-end="url(#ok)"/>
<text x="190" y="694" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">D_y(x) = 51</text>
<text x="500" y="694" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">D_z(x) = 50</text>
<text x="24" y="720" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">y 경유 값이 직통 50 을 넘는 순간 z 가 방향 전환 · 그때까지 둘은 번갈아 2 씩 올렸음</text>
<line x1="12" y1="752" x2="952" y2="752" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="774" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="764" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="774" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">지금 쓰는 다음 홉</text>
<rect x="274" y="764" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="296" y="774" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">마주 보는 루프</text>
<rect x="422" y="764" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="444" y="774" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">목적지</text>
</svg>
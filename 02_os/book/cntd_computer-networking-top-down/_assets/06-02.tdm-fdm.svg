<title id="dt">미리 잘라 나눠 주면 부딪히지 않습니다</title><desc id="dd">TDM 은 시간을 잘라 슬롯을 배정하고 FDM 은 주파수를 잘라 대역을 배정한다. 충돌은 사라지지만 혼자 보낼 때도 자기 몫에 묶인다.</desc>

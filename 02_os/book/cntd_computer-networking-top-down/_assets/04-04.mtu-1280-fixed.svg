<rect x="759.8" y="388" width="160.4" height="24" rx="4" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="840" y="405" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">패킷당 200 B 덜 실음</text>

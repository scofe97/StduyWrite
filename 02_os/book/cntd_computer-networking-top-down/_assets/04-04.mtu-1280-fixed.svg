<title id="dt">1280 을 넘지 않으면 어느 경로든 들어맞습니다</title><desc id="dd">문제 도식과 같은 망이고 방화벽은 ICMP 를 막는다. 송신자가 경로 MTU 를 1280 으로 고정하고 1280 바이트로 보내면 방화벽과 터널 입구를 모두 지나 Packet Too Big 이 생기지 않는다. 모든 IPv6 링크는 1280 이상이라 탐색이 필요 없다. 대신 이 경로가 허락하는 1480 바이트는 쓰지 않아 패킷마다 200 바이트를 덜 싣는다.</desc>
<rect width="1000" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">IPV6 · MINIMUM MTU 1280</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">1280 을 넘지 않으면 어느 경로든 들어맞습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">방화벽은 그대로 ICMP 를 막습니다. 송신자가 처음부터 1280 을 넘지 않게 보냅니다</text>

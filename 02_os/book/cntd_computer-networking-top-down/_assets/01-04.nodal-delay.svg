<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 976 452" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">라우터 하나에서 겪는 네 지연</title><desc id="dd">패킷이 노드 하나를 지나며 차례로 겪는 성분. 넷을 더한 것이 노드 지연이고, 네 성분은 각각 다른 것에 달려 있어 같이 움직이지 않는다.</desc>
<rect width="976" height="452" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 01-04 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">라우터 하나에서 겪는 네 지연</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가변인 것은 큐잉 하나뿐입니다 — 나머지 셋은 조건이 같으면 값이 같습니다</text>
<rect x="24" y="140" width="216" height="132" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="38" y="154" width="22" height="18" rx="9" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="49" y="167" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">01</text>
<text x="70" y="167" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">처리 지연</text>
<text x="38" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">d(proc)</text>
<text x="38" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">헤더를 보고 나갈 링크를 정하고</text>
<text x="38" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">비트 오류를 검사합니다</text>
<text x="38" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">마이크로초 이하</text>
<path d="M 240 206.0 L 256 206.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="260" y="140" width="216" height="132" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<rect x="274" y="154" width="22" height="18" rx="9" fill="#F08A59" stroke="#F08A59" stroke-width="1"/>
<text x="285" y="167" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#0D1117">02</text>
<text x="306" y="167" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">큐잉 지연</text>
<text x="274" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">d(queue)</text>
<text x="274" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앞서 도착해 기다리는</text>
<text x="274" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패킷 수에 달렸습니다</text>
<text x="274" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">마이크로초 ~ 밀리초</text>
<path d="M 476 206.0 L 492 206.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="496" y="140" width="216" height="132" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="510" y="154" width="22" height="18" rx="9" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="521" y="167" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">03</text>
<text x="542" y="167" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">전송 지연</text>
<text x="510" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">d(trans) = L/R</text>
<text x="510" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패킷 길이와 링크 전송률.</text>
<text x="510" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">거리와는 무관합니다</text>
<text x="510" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">마이크로초 ~ 밀리초</text>
<path d="M 712 206.0 L 728 206.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="732" y="140" width="216" height="132" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="746" y="154" width="22" height="18" rx="9" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="757" y="167" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">04</text>
<text x="778" y="167" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">전파 지연</text>
<text x="746" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">d(prop) = d/s</text>
<text x="746" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">거리와 매체의 전파 속도.</text>
<text x="746" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패킷 길이와는 무관합니다</text>
<text x="746" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">광역망에서 밀리초</text>
<text x="24" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">d(nodal) = d(proc) + d(queue) + d(trans) + d(prop)</text>
<text x="24" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전송 지연은 라우터가 패킷을 밀어내는 시간이고 전파 지연은 비트 하나가 건너가는 시간입니다 — 둘은 서로 다른 것에 달려 있습니다</text>
<line x1="12" y1="392" x2="928" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="404" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패킷마다 달라지는 성분</text>
<rect x="300" y="404" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="322" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">조건이 같으면 값이 같은 성분</text>
</svg>
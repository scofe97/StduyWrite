<title id="dt">양쪽 상태를 한 흐름에 놓으면</title><desc id="dd">클라이언트가 능동 열기와 먼저 닫기를 맡는 경우. 세 번 교환해 세우고 네 번 교환해 허물며, 세그먼트 하나가 오갈 때마다 어느 한쪽의 상태가 바뀐다.</desc>
<rect width="1000" height="860" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-04 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">양쪽 상태를 한 흐름에 놓으면</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칩이 그 시점의 상태입니다. TIME_WAIT 는 먼저 닫은 쪽에만 생깁니다</text>
<rect x="24.0" y="104" width="230" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="139.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="139.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">능동 열기 · 먼저 닫음</text>
<rect x="722.0" y="104" width="230" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="837.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서버</text>
<text x="837.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">수동 열기 · 나중에 닫음</text>
<line x1="139.0" y1="154" x2="139.0" y2="732" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="837.0" y1="154" x2="837.0" y2="732" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<rect x="109.0" y="162" width="60.0" height="20" rx="4" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="139.0" y="176" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">CLOSED</text>
<rect x="807.0" y="162" width="60.0" height="20" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="837.0" y="176" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">LISTEN</text>
<rect x="102.0" y="196" width="74.0" height="20" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="139.0" y="210" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">SYN_SENT</text>
<path d="M 149.0 236 L 825.0 236" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="488.0" y="227" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">SYN  seq=client_isn</text>
<rect x="800.0" y="256" width="74.0" height="20" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="837.0" y="270" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">SYN_RCVD</text>
<path d="M 827.0 302 L 151.0 302" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="488.0" y="293" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">SYNACK  seq=server_isn  ack=client_isn+1</text>
<rect x="91.5" y="322" width="95.0" height="20" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="139.0" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">ESTABLISHED</text>
<path d="M 149.0 366 L 825.0 366" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="488.0" y="357" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">ACK  ack=server_isn+1</text>
<text x="488.0" y="383" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 세그먼트부터 데이터를 실을 수 있음</text>
<rect x="789.5" y="400" width="95.0" height="20" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="837.0" y="414" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">ESTABLISHED</text>
<text x="488.0" y="452" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">… 데이터 교환 …</text>
<rect x="95.0" y="478" width="88.0" height="20" rx="4" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="139.0" y="492" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">FIN_WAIT_1</text>
<path d="M 149.0 518 L 825.0 518" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<text x="488.0" y="509" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">FIN</text>
<rect x="793.0" y="538" width="88.0" height="20" rx="4" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="837.0" y="552" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">CLOSE_WAIT</text>
<path d="M 827.0 582 L 151.0 582" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<text x="488.0" y="573" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">ACK</text>
<text x="488.0" y="599" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버 애플리케이션이 close() 할 때까지 CLOSE_WAIT 에 머뭄</text>
<rect x="95.0" y="616" width="88.0" height="20" rx="4" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="139.0" y="630" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">FIN_WAIT_2</text>
<path d="M 827.0 660 L 151.0 660" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<text x="488.0" y="651" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">FIN</text>
<rect x="800.0" y="680" width="74.0" height="20" rx="4" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="837.0" y="694" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">LAST_ACK</text>
<rect x="98.5" y="680" width="81.0" height="20" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="139.0" y="694" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">TIME_WAIT</text>
<path d="M 149.0 722 L 825.0 722" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="488.0" y="713" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">ACK</text>
<rect x="807.0" y="742" width="60.0" height="20" rx="4" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="837.0" y="756" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">CLOSED</text>
<rect x="109.0" y="742" width="60.0" height="20" rx="4" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="139.0" y="756" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">CLOSED</text>
<text x="217.0" y="756" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">2×MSL 뒤</text>
<line x1="12" y1="816" x2="952" y2="816" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="838" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="828" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>

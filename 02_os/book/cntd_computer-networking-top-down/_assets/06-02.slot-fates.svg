<title id="dt">슬롯 100 개 중 37 개만 일합니다</title><desc id="dd">활성 노드가 많을 때 슬롯 ALOHA 의 슬롯은 셋 중 하나가 된다. 성공 37, 빈 슬롯 37, 충돌 26. 면적이 곧 비중이다.</desc>
<rect width="940" height="522" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 6.3.2 · SLOTTED ALOHA EFFICIENCY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">슬롯 100 개 중 37 개만 일합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원문이 제시한 1/e = 0.37 과 26 퍼센트 그대로입니다</text>
<rect x="24" y="116" width="204" height="280" rx="6" fill="#F08A591E" stroke="#F08A59" stroke-width="1.6"/>
<text x="126.0" y="250.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">성공</text>
<text x="126.0" y="274.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="20" font-weight="600" fill="#F08A59">37</text>
<rect x="232" y="116" width="352" height="160" rx="6" fill="#8B98A914" stroke="#8B98A9" stroke-width="1.1"/>
<text x="408.0" y="192.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">빈 슬롯 — 아무도 안 보냈습니다</text>
<text x="408.0" y="216.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="400" fill="#8B98A9">37</text>
<rect x="232" y="280" width="352" height="116" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="408.0" y="332.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">충돌 — 둘 이상이 겹쳤습니다</text>
<text x="408.0" y="356.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="400" fill="#F0616D">26</text>
<rect x="624" y="116" width="292" height="132" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="640" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">무엇을 얻고 무엇을 잃었나</text>
<line x1="640" y1="150" x2="900" y2="150" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="640" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">·</text>
<text x="654" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">혼자 보낼 때는 채널 전부 R 을 씁니다</text>
<text x="640" y="194" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">·</text>
<text x="654" y="194" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">충돌 감지도 재전송도 노드가 직접 합니다</text>
<text x="640" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">·</text>
<text x="654" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">붐비면 실효 속도가 0.37 R 로 떨어집니다</text>
<rect x="624" y="264" width="292" height="132" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="640" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">슬롯을 없애면 절반이 됩니다</text>
<line x1="640" y1="298" x2="900" y2="298" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="640" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">슬롯 ALOHA</text>
<text x="900" y="322" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">1/e = 0.37</text>
<text x="640" y="346" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">순수 ALOHA</text>
<text x="900" y="346" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">1/(2e) = 0.18</text>
<text x="640" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">완전한 분산의 값입니다</text>
<line x1="24" y1="424" x2="892" y2="424" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">100 Mbps 슬롯 ALOHA 시스템을 사서 총 80 Mbps 를 기대한 관리자는 실제로 37 Mbps 아래를 받습니다.</text>
<text x="24" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">채널이 프레임 하나를 100 Mbps 로 보내는 것과 장기 처리량은 다른 이야기입니다.</text>
<line x1="12" y1="482" x2="892" y2="482" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="504" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="494" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">성공한 슬롯</text>
<rect x="222" y="494" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="244" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">빈 슬롯</text>
<rect x="318" y="494" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="340" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">충돌한 슬롯</text>
<rect x="440" y="494" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="462" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">순수 ALOHA</text>
</svg>
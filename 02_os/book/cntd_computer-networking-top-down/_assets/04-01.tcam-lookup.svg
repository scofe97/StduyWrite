<title id="dt">하나씩 훑느냐, 전부가 동시에 손을 드느냐</title><desc id="dd">5.12 나노초 안에 백만 줄을 뒤져야 한다. 주소로 묻는 보통 메모리는 줄마다 한 클록을 쓰므로 항목이 백만 개면 클록도 백만 번이고, 접두를 담을 방법도 없다. 내용으로 묻는 TCAM 은 모든 항목이 동시에 비교해 한 클록에 답한다.</desc>
<rect width="880" height="424" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">하나씩 훑느냐, 전부가 동시에 손을 드느냐</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">찾는 주소 …0001 1000 1010 을 두 방식에 똑같이 물었을 때</text>
<text x="24" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">보통 메모리 (RAM)</text>
<text x="24" y="142" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">주소로 묻는다 — “3번지에 뭐 있어?”</text>
<rect x="24" y="164" width="232" height="26" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="36" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">1번지  …00010</text>
<text x="272" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">✗</text>
<text x="300" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">1 클록</text>
<rect x="24" y="196" width="232" height="26" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="36" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">2번지  …00011000</text>
<text x="272" y="214" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#E3B341">✓</text>
<text x="300" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#E3B341">2 클록</text>
<rect x="24" y="228" width="232" height="26" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="36" y="246" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">3번지  …00011</text>
<text x="272" y="246" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#E3B341">✓</text>
<text x="300" y="246" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#E3B341">3 클록</text>
<text x="36" y="278" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">…</text>
<text x="300" y="278" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">…</text>
<rect x="24" y="292" width="368" height="46" rx="5" fill="#F0616D0A" stroke="#F0616D" stroke-width="1.2"/>
<text x="40" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">항목 백만 개 → 클록 백만 번</text>
<text x="40" y="330" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">저장 비트는 0·1 둘뿐 → 접두 표현 불가</text>
<text x="456" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">TCAM</text>
<text x="456" y="142" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">내용으로 묻는다 — “이 값 어디 있어?”</text>
<rect x="456" y="164" width="128" height="52" rx="4" fill="#161B22" stroke="#F0616D" stroke-width="0.9"/>
<text x="520" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">…00010</text>
<text x="520" y="202" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">*******</text>
<text x="520" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">✗ 불일치</text>
<rect x="596" y="164" width="128" height="52" rx="4" fill="#161B22" stroke="#3FB98C" stroke-width="0.9"/>
<text x="660" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">…00011000</text>
<text x="660" y="202" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">****</text>
<text x="660" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">✓ 24비트</text>
<rect x="736" y="164" width="128" height="52" rx="4" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="800" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">…00011</text>
<text x="800" y="202" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">*******</text>
<text x="800" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">✓ 21비트</text>
<rect x="456" y="250" width="400" height="26" rx="5" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="476" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">모든 항목이 동시에 비교 — 한 클록</text>
<rect x="456" y="292" width="400" height="46" rx="5" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="472" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">여럿이 맞으면 가장 긴 쪽 — 최장 접두 일치</text>
<text x="472" y="330" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">저장 비트 0·1·* — * 가 “신경 안 씀” → 접두를 통째로</text>
<text x="456" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">→ 출력 인터페이스 1</text>
<line x1="12" y1="380" x2="832" y2="380" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="402" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="392" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한 클록에 답</text>
<rect x="235" y="392" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="257" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최장 접두로 채택</text>
<rect x="396" y="392" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="418" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클록을 더 씀</text>
<rect x="531" y="392" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="553" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">불일치·표현 불가</text>

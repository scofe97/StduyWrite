<title id="dt">네트워킹은 가장 큰 비용이 아닙니다</title><desc id="dd">대규모 데이터센터 비용에서 네트워킹은 15 퍼센트다. 그런데도 전체 비용을 낮추고 성능을 끌어올리는 열쇠는 네트워킹 혁신이라고 원문이 못박는다.</desc>
<rect width="940" height="524" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 6.6.1 · WHERE THE MONEY GOES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">네트워킹은 가장 큰 비용이 아닙니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">비율은 원문 §6.6.1 의 수치 그대로입니다</text>
<rect x="24" y="116" width="248" height="280" rx="6" fill="#F08A591E" stroke="#F08A59" stroke-width="1.5"/>
<text x="148.0" y="236.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">호스트</text>
<text x="148.0" y="264.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="22" font-weight="600" fill="#F08A59">45 %</text>
<text x="148.0" y="290.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">3 ~ 4 년마다 교체합니다</text>
<rect x="276" y="116" width="308" height="124" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="430.0" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">인프라</text>
<text x="430.0" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#6A95D8">25 %</text>
<text x="430.0" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">변압기 · UPS · 발전기 · 냉각</text>
<rect x="276" y="244" width="308" height="72" rx="6" fill="#8B98A914" stroke="#8B98A9" stroke-width="1.1"/>
<text x="430.0" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">전기료</text>
<text x="430.0" y="292" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#8B98A9">15 %</text>
<text x="430.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">끌어 쓰는 전력</text>
<rect x="276" y="320" width="308" height="72" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="430.0" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">네트워킹</text>
<text x="430.0" y="368" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#3FB98C">15 %</text>
<text x="430.0" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">스위치 · 라우터 · 부하 분산기 · 외부 회선</text>
<rect x="624" y="116" width="292" height="132" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="640" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">일벌은 호스트입니다</text>
<line x1="640" y1="150" x2="900" y2="150" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="640" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  피자 상자를 닮은 블레이드입니다</text>
<text x="640" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  랙 하나에 보통 20 ~ 40 대를 쌓습니다</text>
<text x="640" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  CPU · 메모리 · 디스크를 갖습니다</text>
<rect x="624" y="264" width="292" height="132" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="640" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">랙 꼭대기에 TOR 스위치</text>
<line x1="640" y1="298" x2="900" y2="298" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="640" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  랙 안 호스트와 다른 스위치를 잇습니다</text>
<text x="640" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  호스트는 40 또는 100 Gbps 로 붙습니다</text>
<text x="640" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  호스트마다 내부 IP 주소를 받습니다</text>
<line x1="24" y1="424" x2="892" y2="424" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터센터 설계는 기업 기밀입니다. 2024 년 기준 대규모 데이터센터 건설 비용은 수억 달러에서 10 억 달러를 넘습니다.</text>
<text x="24" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">장비 비용은 일회성 구매와 전력 같은 운영비를 같은 잣대로 보려고 상각한 값입니다.</text>
<line x1="12" y1="484" x2="892" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="506" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="496" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가장 큰 몫</text>
<rect x="222" y="496" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="244" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설비</text>
<rect x="292" y="496" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="314" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">성능의 열쇠</text>
<rect x="414" y="496" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="436" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전력</text>
</svg>
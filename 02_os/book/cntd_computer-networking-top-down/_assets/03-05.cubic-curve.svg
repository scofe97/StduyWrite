<title id="dt">CUBIC — 손실 직전까지는 빨리, 그 근처에서는 천천히</title><desc id="dd">원문 Figure 3.54 의 모양. 손실 뒤 창은 Wmax 를 향해 세제곱 곡선으로 돌아오고, K 근처에서 평평해졌다가 K 를 넘으면 다시 빨리 는다. Reno 의 직선과 대조.</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-05 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">CUBIC — 손실 직전까지는 빨리, 그 근처에서는 천천히</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로축은 손실 뒤 흐른 시간, 세로축은 혼잡 창입니다. 눈금은 원문처럼 두지 않았습니다</text>

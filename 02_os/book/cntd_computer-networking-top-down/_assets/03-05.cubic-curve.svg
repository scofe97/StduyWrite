<text x="403.52" y="278.79999999999995" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Wmax 근처에서 조심스럽게 더듬음</text>
<text x="653.12" y="158.40000000000003" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">K 를 넘으면 다시 빨리</text>
<text x="653.12" y="175.2" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">혼잡 수준이 달라졌다면 새 지점을 찾음</text>

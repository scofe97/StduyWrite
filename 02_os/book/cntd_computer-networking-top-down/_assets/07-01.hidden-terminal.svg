<text x="556" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">그래서 벌어지는 일</text>
<line x1="556" y1="190" x2="884" y2="190" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="560" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">1</text>
<text x="580" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">A 와 C 가 각각 B 에게 보내려 합니다.</text>
<text x="560" y="240" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">2</text>
<text x="580" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">둘 다 채널을 들어 보고 비었다고 판단합니다.</text>
<text x="560" y="266" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">3</text>
<text x="580" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서로의 송신이 검출 문턱 아래라 안 들립니다.</text>
<text x="560" y="292" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">4</text>
<text x="580" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">두 신호가 B 에서 겹쳐 둘 다 못 받습니다.</text>
<rect x="24" y="358" width="880" height="62" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.3"/>
<text x="44" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">충돌은 보내는 쪽이 아니라 받는 쪽에서 일어납니다</text>
<text x="44" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 유선의 CSMA/CD 처럼 "들어 보고 비었으면 보낸다"만으로는 무선에서 충돌을 못 막습니다.</text>
<text x="24" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">원문은 같은 결과를 낳는 두 번째 배치도 듭니다 — A 와 C 사이가 건물 같은 장애물로 물리적으로 막힌 경우입니다.</text>
<line x1="12" y1="462" x2="892" y2="462" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="484" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

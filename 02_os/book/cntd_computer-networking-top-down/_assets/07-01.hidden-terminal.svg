<title id="dt">둘 다 조용하다고 판단하고 동시에 말합니다</title><desc id="dd">경로 손실 때문에 A 와 C 는 서로를 못 듣는다. 그런데 둘의 신호는 B 에서 겹친다.</desc>
<rect width="940" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 7.2.1 · HIDDEN TERMINALS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">둘 다 조용하다고 판단하고 동시에 말합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">노드 배치와 청취 관계는 원문 Figure 7.6 의 것입니다</text>
<text x="24" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">가로 = 듣는 쪽 · 세로 = 말하는 쪽</text>

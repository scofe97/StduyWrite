<title id="dt">줄이라는 알림은 네 자리에서 사라집니다</title><desc id="dd">문제 도식과 같은 망에서 1500 바이트 패킷이 터널 입구에서 버려진다. 그 뒤 Packet Too Big 이 송신자에게 닿지 못하는 경우가 넷이다. A 라우터가 알림을 만들지 않는다. B 방화벽이 모든 ICMP 를 막는다. C 상태 추적 장비가 알림의 출발지 주소만 보고 모르는 흐름이라 버린다. D ECMP 앞단이 알림을 연결이 없는 다른 서버로 보낸다. 넷 모두 송신자에게는 블랙홀 연결로 보인다.</desc>
<rect width="1000" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ICMP · BLACK HOLE · WHERE ALERTS VANISH</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">줄이라는 알림은 네 자리에서 사라집니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">큰 패킷이 버려진 뒤, 알림이 만들어지지 않거나 막히거나 버려지거나 엉뚱한 서버로 갑니다</text>

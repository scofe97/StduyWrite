<title id="dt">RAN 에서 시작해 코어에서 끝납니다</title><desc id="dd">핸드오버는 판단과 전환과 갱신 세 국면으로 나뉜다. 데이터가 끊기지 않도록 옛 기지국이 잠시 중계까지 맡는다.</desc>
<rect width="940" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 7.5.3 · 5G HANDOVER</text>

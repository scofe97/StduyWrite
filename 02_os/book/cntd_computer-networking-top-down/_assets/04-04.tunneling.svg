<title id="dt">IPv6 를 IPv4 안에 넣어 건너보냅니다</title><desc id="dd">IPv6 노드 둘 사이에 IPv4 라우터가 끼어 있을 때 IPv6 데이터그램을 IPv4 데이터그램의 적재량 자리에 넣어 나르는 터널링. 아래 세 줄은 같은 데이터가 구간마다 어떤 모습인지 보여준다.</desc>
<rect width="960" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">IPV4-TO-IPV6 TRANSITION · TUNNELING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">IPv6 를 IPv4 안에 넣어 건너보냅니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">터널 안 라우터는 자기가 IPv4 데이터그램 하나를 나른다고만 압니다</text>
<text x="30" y="100" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">IPv6 를 아는 세상</text>
<rect x="336" y="94" width="278" height="206" rx="10" fill="#F5F5F305" stroke="#8B98A9" stroke-width="1.1" stroke-dasharray="5 5"/>
<text x="475" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">터널 — 이 안은 IPv4 만 압니다</text>
<rect x="30" y="116" width="130" height="54" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="95.0" y="140" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">A</text>
<text x="95.0" y="158" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IPv6 호스트</text>
<rect x="190" y="116" width="130" height="54" rx="7" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<text x="255.0" y="140" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">B</text>
<text x="255.0" y="158" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">터널 입구</text>
<rect x="348" y="228" width="120" height="54" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="408.0" y="252" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">C</text>
<text x="408.0" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IPv4 라우터</text>
<rect x="486" y="228" width="120" height="54" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="546.0" y="252" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">D</text>
<text x="546.0" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IPv4 라우터</text>
<rect x="640" y="116" width="130" height="54" rx="7" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<text x="705.0" y="140" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">E</text>
<text x="705.0" y="158" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">터널 출구</text>
<rect x="800" y="116" width="130" height="54" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="865.0" y="140" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">F</text>
<text x="865.0" y="158" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IPv6 호스트</text>
<path d="M 160 143 L 186 143" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 320 143 L 334 143 L 334 255 L 344 255" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 468 255 L 482 255" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 606 255 L 620 255 L 620 143 L 636 143" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 770 143 L 796 143" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="30" y="371" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">B 가 만든 것</text>
<rect x="200" y="344" width="240" height="44" rx="5" fill="#161B22" stroke="#8B98A966" stroke-width="0.9"/>
<text x="320.0" y="371" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">IPv6 헤더 40B</text>
<rect x="440" y="344" width="490" height="44" rx="5" fill="#161B22" stroke="#8B98A966" stroke-width="0.9"/>
<text x="685.0" y="371" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">데이터</text>
<text x="30" y="439" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">터널 안에서</text>
<rect x="200" y="412" width="120" height="44" rx="5" fill="#161B22" stroke="#F08A5966" stroke-width="1.4"/>
<text x="260.0" y="439" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">IPv4 헤더 20B</text>
<rect x="320" y="412" width="240" height="44" rx="5" fill="#161B22" stroke="#8B98A966" stroke-width="0.9"/>
<text x="440.0" y="439" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">IPv6 헤더 40B</text>
<rect x="560" y="412" width="370" height="44" rx="5" fill="#161B22" stroke="#8B98A966" stroke-width="0.9"/>
<text x="745.0" y="439" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">데이터</text>
<text x="30" y="507" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">E 가 꺼낸 것</text>
<rect x="200" y="480" width="240" height="44" rx="5" fill="#161B22" stroke="#8B98A966" stroke-width="0.9"/>
<text x="320.0" y="507" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">IPv6 헤더 40B</text>
<rect x="440" y="480" width="490" height="44" rx="5" fill="#161B22" stroke="#8B98A966" stroke-width="0.9"/>
<text x="685.0" y="507" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">데이터</text>
<text x="260" y="406" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">protocol = 41</text>
<text x="30" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IPv4 헤더의 프로토콜 번호 41 이 "적재량은 IPv6 데이터그램"이라는 표시입니다. 바꿔야 하는 장비는 터널 양 끝 둘뿐입니다.</text>
<line x1="12" y1="576" x2="912" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="588" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">터널 양 끝이 감싸고 벗깁니다</text>
<rect x="352" y="588" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="374" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그대로 지나는 구간</text>
<text x="920" y="598" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">KUROSE-ROSS 9E FIG 4.27 · IANA PROTO 41</text>
</svg>
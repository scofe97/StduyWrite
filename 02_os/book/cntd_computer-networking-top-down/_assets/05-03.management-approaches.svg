<title id="dt">장비를 하나씩 다루던 둘, 망 전체를 설정하는 하나</title><desc id="dd">CLI · SNMP/MIB · NETCONF/YANG 을 주로 하는 일, 다루는 단위, 전송, 설정·규모 네 축으로 견준 행렬. 앞의 둘은 장비를 하나씩 다루고, NETCONF 는 여러 장비에 걸친 원자적 연산으로 망 전체의 설정을 다룬다.</desc>

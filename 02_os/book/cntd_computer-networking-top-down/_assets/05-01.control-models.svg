<title id="dt">표를 채우는 배선이 둘입니다</title><desc id="dd">라우터마다 제어와 논리적 중앙 제어를 같은 라우터 넷 위에 나란히 그린 비교. 왼쪽은 라우팅 컴포넌트끼리 대화해 자기 전달 표를 채우고, 오른쪽은 컨트롤러가 계산한 표를 제어 에이전트가 받아 넣기만 한다.</desc>

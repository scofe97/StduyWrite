<text x="44" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 값은 상한입니다. 아무리 영리하게 부호화하고 변조해도 이보다 많이 받을 수 없습니다.</text>
<text x="44" y="488" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">원문이 든 실무 최소 SNR — WiFi 는 20 dB 안팎, LTE 는 변조 방식에 따라 −5 에서 18 dB.</text>

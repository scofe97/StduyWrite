<text x="600.0" y="176.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">더 넣을수록 더 나감</text>
<text x="754.0" y="248.8" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">더 넣어도 처리량은 그대로</text>
<text x="929.0" y="384.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">손실 기반은 여기서야 물러섬</text>
<text x="24" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">BBR 은 RTT 와 병목 대역폭을 직접 재서 이 꺾임점을 추정하고, 전송 중인 양을 거기에 맞춤</text>
<text x="24" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">짧은 주기로 가속·순항·감속을 돌고, 긴 주기로 파이프를 비워 더 낮은 RTT 가 있는지 살핌</text>

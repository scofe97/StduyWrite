<title id="dt">BBR — 파이프가 딱 차는 지점을 숫자로 잡습니다</title><desc id="dd">전송 중 데이터 양을 늘리면 처리량은 대역폭·지연 곱까지만 오르고, 그 뒤로는 RTT 만 는다. 손실 기반은 오른쪽 끝 버퍼가 넘칠 때야 물러서고, BBR 은 꺾임점에 머문다.</desc>
<rect width="1000" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-05 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">BBR — 파이프가 딱 차는 지점을 숫자로 잡습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 판의 가로축이 같음. 세로 점선이 대역폭·지연 곱, 파이프가 딱 차는 자리입니다</text>

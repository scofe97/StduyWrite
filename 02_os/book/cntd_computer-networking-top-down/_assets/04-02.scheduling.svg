<text x="20" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">WFQ 는 라운드 로빈을 일반화해 클래스마다 가중치를 줍니다. 클래스 i 는 최소한 R × w_i / Σw_j 를 받습니다.</text>
<text x="20" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">넷 다 일 보존 규율이라 보낼 패킷이 있는 한 링크를 놀리지 않습니다. FIFO 의 빈 구간은 보낼 것이 없어서입니다.</text>

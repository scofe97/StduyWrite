<title id="dt">열쇠 공간을 키워도 통계가 깨뜨립니다</title><desc id="dd">가로 막대는 열쇠 후보의 개수를 상용로그로 잰 것이다. 셋째 막대가 무너진 자리를 보여 준다.</desc>
<rect width="940" height="684" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 8.2.1 · CLASSICAL CIPHERS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">열쇠 공간을 키워도 통계가 깨뜨립니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">25 · 26! · 10^9 배 감소는 원문 서술이고 19! 은 검산값입니다</text>
<text x="200" y="200" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">카이사르</text>
<text x="200" y="218" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">이동량 k 하나</text>
<rect x="216" y="180" width="29.424100377728546" height="44" rx="5" fill="#F0616D16" stroke="#F0616D" stroke-width="1.1"/>
<text x="228" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">25 가지 — 손으로도 다 해 봅니다</text>
<text x="200" y="284" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">단일문자</text>
<text x="200" y="302" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">26 자리의 순열</text>
<rect x="216" y="264" width="560.0" height="44" rx="5" fill="#6A95D816" stroke="#6A95D8" stroke-width="1.1"/>
<text x="228" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">약 4.03×10^26 — 전수 조사는 불가능합니다</text>
<text x="200" y="368" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">이름 둘이 새면</text>
<text x="200" y="386" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">일곱 자리가 확정된 뒤</text>
<rect x="216" y="348" width="359.6102379065121" height="44" rx="5" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="228" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">약 1.22×10^17 — 10^9 배 줄었습니다</text>
<line x1="216" y1="440" x2="776" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="216.0" y1="436" x2="216.0" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="216.0" y="460" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">10^0</text>
<line x1="321.24092663203675" y1="436" x2="321.24092663203675" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="321.24092663203675" y="460" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">10^5</text>
<line x1="426.4818532640735" y1="436" x2="426.4818532640735" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="426.4818532640735" y="460" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">10^10</text>
<line x1="531.7227798961103" y1="436" x2="531.7227798961103" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="531.7227798961103" y="460" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">10^15</text>
<line x1="636.963706528147" y1="436" x2="636.963706528147" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="636.963706528147" y="460" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">10^20</text>
<line x1="742.2046331601838" y1="436" x2="742.2046331601838" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="742.2046331601838" y="460" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">10^25</text>
<text x="496.0" y="484" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">열쇠 후보의 개수 (상용로그 축)</text>
<rect x="24" y="508" width="892" height="96" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="536" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">크기가 안전을 만들지 않습니다</text>
<line x1="44" y1="548" x2="896" y2="548" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="44" y="572" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">영어에서 e 와 t 가 글자 출현의 13퍼센트와 9퍼센트를 차지하고 in · it · the · ion · ing 이 자주 붙어 나옵니다.</text>
<text x="44" y="592" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">본문에 bob 과 alice 가 있다고 짐작만 해도 26 자리 중 일곱이 확정됩니다. 둘째 막대가 셋째로 내려앉습니다.</text>
<line x1="12" y1="624" x2="892" y2="624" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="646" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="636" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="646" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">통계 없이도 깨짐</text>
<rect x="261" y="636" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="283" y="646" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전수 조사로는 못 깸</text>
<rect x="448" y="636" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="470" y="646" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">통계가 깨뜨린 뒤</text>
</svg>
<title id="dt">버퍼는 SR 처럼, 확인은 GBN 처럼</title><desc id="dd">1~5 를 보내는데 2 가 사라진 흐름. 순서 밖 3·4·5 는 버퍼에 두지만 따로 확인하지 않고, 중복 ACK 셋에 2 하나만 다시 보낸 뒤 ACK 5 하나로 셋을 함께 확인한다.</desc>
<rect width="1000" height="780" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-03 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">버퍼는 SR 처럼, 확인은 GBN 처럼</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">ACK n 은 이 절의 표기대로 n 까지 받았다는 뜻입니다. 오른쪽 칸이 받는 쪽의 수신 버퍼입니다</text>
<rect x="35" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="140" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">보내는 쪽</text>
<text x="140" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">송신 버퍼 · 확인 전까지 들고 있음</text>
<line x1="140" y1="154" x2="140" y2="640" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<rect x="455" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="560" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">받는 쪽</text>
<text x="560" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수신 버퍼 · 순서 밖도 보관</text>
<line x1="560" y1="154" x2="560" y2="640" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 150 228 L 548 228" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="350.0" y="219" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">seq 1</text>
<path d="M 550 290 L 152 290" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="350.0" y="281" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">ACK 1</text>
<text x="350.0" y="307" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1 까지 받았음</text>
<line x1="150" y1="352" x2="334.0" y2="352" stroke="#F0616D" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="350.0" y="356" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="700" fill="#F0616D">✕</text>
<text x="245.0" y="343" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">seq 2</text>
<text x="374.0" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">유실</text>
<line x1="150" y1="409" x2="548" y2="409" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="150" y1="419" x2="548" y2="419" stroke="#8B98A9" stroke-width="1.0"/>
<path d="M 150 414 L 548 414" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="350.0" y="401" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">seq 3 · 4 · 5</text>
<text x="350.0" y="435" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">셋 다 순서 밖 · 버리지 않고 버퍼에 둠</text>
<line x1="550" y1="471" x2="152" y2="471" stroke="#6A95D8" stroke-width="1.0"/>
<line x1="550" y1="481" x2="152" y2="481" stroke="#6A95D8" stroke-width="1.0"/>
<path d="M 550 476 L 152 476" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="350.0" y="463" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">ACK 1 × 3 (중복)</text>
<text x="350.0" y="497" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">3·4·5 를 따로 확인하지 않고 1 을 되풀이함</text>
<path d="M 150 538 L 548 538" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="350.0" y="529" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">seq 2 (재전송)</text>
<text x="350.0" y="555" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">중복 셋을 보고 송신 버퍼의 2 하나만 다시 보냄 · 3·4·5 는 안 보냄</text>
<path d="M 550 600 L 152 600" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="350.0" y="591" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">ACK 5</text>
<text x="350.0" y="617" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">구멍이 메워져 버퍼의 3·4·5 까지 한 번에 확인함</text>
<rect x="660" y="384" width="316" height="118" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="674" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">수신 버퍼 · 3·4·5 가 온 뒤</text>
<rect x="674" y="420" width="58" height="36" rx="5" fill="none" stroke="#F0616D" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="703.0" y="443" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">2</text>
<rect x="742" y="420" width="58" height="36" rx="5" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="771.0" y="443" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">3</text>
<rect x="810" y="420" width="58" height="36" rx="5" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="839.0" y="443" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">4</text>
<rect x="878" y="420" width="58" height="36" rx="5" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="907.0" y="443" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">5</text>
<text x="674" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">2 자리만 비어 있고 셋은 들고 있습니다 (SR 쪽)</text>
<path d="M 572 414 L 646 414 L 646 443 L 658 443" fill="none" stroke="#5E6B7E" stroke-width="1.0" marker-end="url(#soft)" stroke-dasharray="3 4"/>
<rect x="660" y="508" width="316" height="118" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="674" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">수신 버퍼 · 2 가 온 뒤</text>
<rect x="674" y="544" width="58" height="36" rx="5" fill="#F08A5922" stroke="#F08A59" stroke-width="1.2"/>
<text x="703.0" y="567" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">2</text>
<rect x="742" y="544" width="58" height="36" rx="5" fill="#F08A5922" stroke="#F08A59" stroke-width="1.2"/>
<text x="771.0" y="567" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">3</text>
<rect x="810" y="544" width="58" height="36" rx="5" fill="#F08A5922" stroke="#F08A59" stroke-width="1.2"/>
<text x="839.0" y="567" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">4</text>
<rect x="878" y="544" width="58" height="36" rx="5" fill="#F08A5922" stroke="#F08A59" stroke-width="1.2"/>
<text x="907.0" y="567" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">5</text>
<text x="674" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">구멍이 메워져 2~5 를 한 번에 위층으로</text>
<path d="M 572 538 L 646 538 L 646 567 L 658 567" fill="none" stroke="#5E6B7E" stroke-width="1.0" marker-end="url(#soft)" stroke-dasharray="3 4"/>
<text x="20" y="672" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">순수 GBN 이라면 받는 쪽이 3·4·5 를 버리고, 보내는 쪽은 2 의 타임아웃 뒤 2·3·4·5 를 전부 다시 보냄</text>
<text x="20" y="694" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">순수 SR 이라면 받는 쪽이 3·4·5 를 각각 확인함 · TCP 는 버퍼는 SR 처럼, 확인은 GBN 처럼 함</text>
<line x1="12" y1="736" x2="952" y2="736" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="758" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="748" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="758" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">GBN 쪽 — 누적·중복 ACK</text>
<rect x="365" y="748" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="387" y="758" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SR 쪽 — 순서 밖 버퍼링</text>
<rect x="604" y="748" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="626" y="758" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재전송</text>
<rect x="687" y="748" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="709" y="758" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">유실·구멍</text>
</svg>
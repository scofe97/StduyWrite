<title id="dt">하나가 나가면 하나가 들어옵니다</title><desc id="dd">원문 Figure 4.10 의 ACK 클록킹. 가정용 라우터의 출력 큐에서 세그먼트가 하나 나가고 한 RTT 뒤 그 ACK 가 세그먼트를 하나 더 불러들여 같은 큐에 넣으므로, 손실이 없는데도 큐 길이가 줄지 않고 지연이 그대로 남는다.</desc>

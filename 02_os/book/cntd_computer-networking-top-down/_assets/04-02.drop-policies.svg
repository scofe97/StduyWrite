<title id="dt">언제 손대느냐가 세 정책을 가릅니다</title><desc id="dd">버퍼가 차오르는 축 위에 세 정책의 개입 시점을 놓았다. AQM 은 버퍼가 차기 전에 표시하거나 미리 버리고, 꼬리 버리기와 이미 선 것 빼내기는 버퍼가 찬 뒤에만 반응하므로 지연이 이미 최대일 때 송신자가 알아챈다.</desc>

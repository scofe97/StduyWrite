<title id="dt">판정은 방문 망이 아니라 고향 망이 합니다</title><desc id="dd">기기의 신원과 암호 정보가 SIM 과 고향 망에만 있기 때문이다. 4G 에서 방문 망이 하던 역할이 옮겨 왔다.</desc>

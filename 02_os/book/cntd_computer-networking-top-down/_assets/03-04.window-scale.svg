<title id="dt">칸은 그대로 두고 읽는 법을 바꿉니다</title><desc id="dd">연결을 세울 때 SYN 과 SYNACK 에 윈도우 스케일 옵션이 한 번 실려 양쪽이 배수를 기억한다. 그 뒤 데이터 구간에서 세그먼트의 Window 칸은 여전히 16비트 숫자 그대로이고, 받는 쪽이 그 숫자에 기억해 둔 배수를 곱해 읽는다. 같은 칸 값 24,576 이 배수 ×1 에서는 24,576 byte 로, ×128 에서는 3 MiB 로 읽힌다. 대가는 창이 배수 단위로만 표현된다는 것이다.</desc>
<rect width="880" height="820" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-04 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">칸은 그대로 두고 읽는 법을 바꿉니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">필요한 창은 대역폭 × RTT 이고 1 Gbps × 30 ms 면 3.75 MB 라 16비트 칸의 64 KiB 를 넘습니다</text>
<text x="24" y="96" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">연결 수립 · 배수를 한 번만 주고받음</text>
<rect x="24.0" y="108" width="240" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="144.0" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">보내는 쪽</text>
<text x="144.0" y="145" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">클라이언트</text>
<rect x="592.0" y="108" width="240" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="712.0" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">받는 쪽</text>
<text x="712.0" y="145" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서버</text>
<line x1="144.0" y1="158" x2="144.0" y2="468" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="712.0" y1="158" x2="712.0" y2="468" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 154.0 196 L 700.0 196" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="428.0" y="187" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">SYN · Window Scale 옵션</text>
<text x="428.0" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">내 창에 곱할 배수 · 2 의 거듭제곱 지수</text>
<path d="M 702.0 248 L 156.0 248" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)" stroke-dasharray="5 4"/>
<text x="428.0" y="239" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">SYNACK · Window Scale 옵션</text>
<text x="428.0" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서버도 자기 배수를 실어 답함</text>
<rect x="87.0" y="280" width="114.0" height="24" rx="4" fill="#0D1117"/>
<rect x="87.0" y="280" width="114.0" height="24" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="144.0" y="297" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">배수 ×128 기억</text>
<rect x="655.0" y="280" width="114.0" height="24" rx="4" fill="#0D1117"/>
<rect x="655.0" y="280" width="114.0" height="24" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="712.0" y="297" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">배수 ×128 기억</text>
<line x1="24" y1="320" x2="856" y2="320" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="24" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">데이터 구간 · 칸은 16비트 숫자 그대로</text>
<path d="M 154.0 384 L 700.0 384" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="428.0" y="375" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">데이터 세그먼트</text>
<text x="428.0" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">창 안의 미확인 구간만큼만 보냄</text>
<path d="M 702.0 440 L 156.0 440" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)" stroke-dasharray="5 4"/>
<text x="428.0" y="431" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">ACK · Window = 24,576</text>
<text x="428.0" y="458" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">칸은 늘지 않음 · 적는 숫자도 그대로</text>
<path d="M 428.0 472 L 428.0 504" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="24" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">같은 칸 값 하나 · 배수에 따라 다른 창</text>
<rect x="24" y="532" width="248" height="48" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="148.0" y="552" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Window 칸</text>
<text x="148.0" y="570" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">24,576</text>
<path d="M 272 556 L 304 556" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="312" y="532" width="176" height="48" rx="6" fill="#8B98A914" stroke="#8B98A9" stroke-width="1.2"/>
<text x="400.0" y="562" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#8B98A9">배수 ×1</text>
<path d="M 488 556 L 520 556" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="528" y="532" width="304" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="680.0" y="552" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">받는 쪽이 읽은 창</text>
<text x="680.0" y="570" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">24,576 byte</text>
<rect x="24" y="592" width="248" height="48" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="148.0" y="612" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Window 칸</text>
<text x="148.0" y="630" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">24,576</text>
<path d="M 272 616 L 304 616" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="312" y="592" width="176" height="48" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="400.0" y="622" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">배수 ×128</text>
<path d="M 488 616 L 520 616" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="528" y="592" width="304" height="48" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="680.0" y="612" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">받는 쪽이 읽은 창</text>
<text x="680.0" y="630" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">3 MiB</text>
<path d="M 680.0 640 L 680.0 668" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="528" y="670" width="304" height="42" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="680.0" y="688" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">대가 · 창은 128 byte 단위로만</text>
<text x="680.0" y="705" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">granularity</text>
<text x="24" y="736" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">흐름 밖 · 헤더 칸 확장은 막힌 길 · 뒤의 Checksum · Urgent Pointer 가 밀려 옛 구현이 깨짐</text>
<line x1="12" y1="756" x2="832" y2="756" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="778" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="768" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="778" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">배수와 창 값이 실리는 자리</text>

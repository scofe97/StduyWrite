<title id="dt">라우터의 네 부분</title><desc id="dd">원문 Figure 4.4. 입력 포트·스위칭 패브릭·출력 포트는 하드웨어이고 라우팅 프로세서만 소프트웨어다. 입력 링크의 패킷 간격이 곧 입력 포트가 쓸 수 있는 시간 예산이다.</desc>
<rect width="1000" height="812" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 04-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">라우터의 네 부분</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">패킷은 5.12 ns 마다 들어오고, 판단은 그 사이에 끝나야 합니다</text>
<rect x="24" y="100" width="928" height="76" rx="8" fill="#6A95D808" stroke="#6A95D8" stroke-width="1" stroke-dasharray="4 4"/>
<text x="36" y="94" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">제어 평면 — 밀리초에서 초 · 소프트웨어</text>
<rect x="290" y="112" width="420" height="52" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="500" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">라우팅 프로세서</text>
<text x="500" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">라우팅 프로토콜 · 링크 상태 반응 · 컨트롤러 통신 · 관리</text>
<path d="M 500 176 L 500 224" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)" stroke-dasharray="5 4"/>
<text x="512" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">포워딩 테이블을 라인 카드로 복사</text>
<rect x="24" y="228" width="928" height="176" rx="8" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="36" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">데이터 평면 — 나노초 · 하드웨어</text>
<text x="40" y="272" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">100 Gbps · 64바이트</text>
<rect x="40" y="285" width="32" height="22" rx="3" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<rect x="112" y="285" width="32" height="22" rx="3" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<rect x="184" y="285" width="32" height="22" rx="3" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<line x1="40" y1="315" x2="40" y2="335" stroke="#F08A59" stroke-width="1.0"/>
<line x1="112" y1="315" x2="112" y2="335" stroke="#F08A59" stroke-width="1.0"/>
<line x1="40" y1="325" x2="112" y2="325" stroke="#F08A59" stroke-width="1.0"/>
<text x="76" y="352" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">5.12 ns</text>
<path d="M 220 296 L 252 296" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<rect x="256" y="258" width="176" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="344" y="286" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">입력 포트</text>
<text x="344" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">종단 · 링크 층 · 조회</text>
<path d="M 436 296 L 468 296" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="472" y="258" width="176" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="560" y="286" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">스위칭 패브릭</text>
<text x="560" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">라우터 안의 망</text>
<path d="M 652 296 L 684 296" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="688" y="258" width="176" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="776" y="286" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">출력 포트</text>
<text x="776" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">저장 · 스케줄 · 송신</text>
<path d="M 868 296 L 900 296" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="908" y="285" width="32" height="22" rx="3" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<path d="M 344 338 L 344 432" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)" stroke-dasharray="5 4"/>
<text x="356" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">이 안을 시간으로 펼치면</text>
<rect x="24" y="440" width="928" height="264" rx="8" fill="#F08A5906" stroke="#F08A59" stroke-width="1" stroke-dasharray="4 4"/>
<text x="36" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">입력 포트 안 — 다음 데이터그램이 오기 전에 끝나야 하는 일</text>
<rect x="88" y="496" width="264" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="220.0" y="518" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<text x="220.0" y="540" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">물리 층 종단</text>
<text x="220.0" y="560" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">링크 층 처리</text>
<rect x="352" y="496" width="264" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="484.0" y="518" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">2</text>
<text x="484.0" y="540" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">헤더 검사</text>
<text x="484.0" y="560" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">버전 · 체크섬 · TTL</text>
<rect x="616" y="496" width="264" height="72" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="748.0" y="518" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">3</text>
<text x="748.0" y="540" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">포워딩 테이블 조회</text>
<text x="748.0" y="560" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">최장 접두 일치</text>
<line x1="88" y1="592" x2="880" y2="592" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="88" y1="584" x2="88" y2="600" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="880" y1="584" x2="880" y2="600" stroke="#8B98A9" stroke-width="1.0"/>
<text x="88" y="616" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0 ns</text>
<text x="880" y="616" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">5.12 ns</text>
<line x1="880" y1="476" x2="880" y2="584" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="872" y="470" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">다음 데이터그램 도착</text>
<text x="88" y="646" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">칸 너비는 균등 분할 — 원문은 단계별 비용을 말하지 않음</text>
<text x="88" y="668" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">합 &gt; 5.12 ns → 뒤 패킷이 입력에서 밀림 · 포트 N 개면 파이프라인도 N 배</text>
<text x="88" y="690" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">셋 다 하드웨어 · 제어 평면만 소프트웨어 (밀리초~초)</text>
<line x1="12" y1="768" x2="952" y2="768" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="790" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="780" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="790" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">5.12 ns 예산과 조회</text>
<rect x="326" y="780" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="348" y="790" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">제어 평면 — 초</text>
<rect x="487" y="780" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="509" y="790" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터 평면 — 나노초</text>
</svg>
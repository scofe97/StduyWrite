<text x="306.0" y="212.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">합이 R 을 넘어 손실</text>
<text x="312.0" y="287.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">둘 다 절반 — 원점 쪽으로</text>
<text x="258.0" y="416.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">차이가 매번 절반씩 줄어듭니다</text>
<text x="20" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">더하기는 방향이 45도로 고정이고 나누기는 원점 쪽으로 당깁니다. 당기는 동작이 두 값의 차이를 절반으로 줄이므로 공평선 위에서 오르내리게 됩니다.</text>
<text x="20" y="534" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">현실에서는 깨집니다 — 왕복 시간이 다르거나, UDP 가 섞이거나, 한 앱이 병렬 연결을 여럿 열면 몫이 크게 갈립니다.</text>
<line x1="12" y1="568" x2="952" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="590" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

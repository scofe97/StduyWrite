<text x="844" y="333" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">role-readonly@crm</text>
<text x="24" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">deployer 의 인증서는 role-operator@billing 하나뿐이라 강조한 한 줄에서만 통과한다</text>
<text x="24" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">admin 파일의 role-admin@… 는 CA 가 어떤 신원에게도 발급하지 않는다</text>

<title id="dt">principal 이 역할 계정을 연다 — 확인 세 칸</title><desc id="dd">sshd 는 서명한 CA, 로그인 계정 이름, 그 계정의 principal 파일을 차례로 보고 마지막에 기간을 본다. 아래는 두 호스트의 파일 내용이다.</desc>
<rect width="880" height="452" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LAMPSON LAB · 04-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">principal 이 역할 계정을 연다 — 확인 세 칸</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">계정 이름은 로그인하는 쪽이 고르고, principal 은 CA 가 정한다 — 둘이 파일에서 만난다</text>
<rect x="24" y="96" width="232" height="100" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">1 서명</text>
<text x="40" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">user_ca.pub 의 CA 가</text>
<text x="40" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서명했는가</text>
<path d="M 260 146.0 L 300 146.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

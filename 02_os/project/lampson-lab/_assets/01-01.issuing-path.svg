<title id="dt">uid 에서 세션까지 — 값이 바뀌는 다섯 칸</title><desc id="dd">프로세스의 uid 가 SVID, X5C 토큰, SSH 인증서를 거쳐 역할 계정 세션이 된다. 화살표 위는 일하는 쪽, 아래는 거기서 걸리는 계정.</desc>
<rect width="880" height="392" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LAMPSON LAB · 01-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">uid 에서 세션까지 — 값이 바뀌는 다섯 칸</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">요청에는 신원을 적는 칸이 없다 — 첫 화살표에서 커널이 uid 를 확인한다</text>
<rect x="12" y="150" width="140" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="24" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">1 프로세스</text>
<text x="24" y="204" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">uid 1001</text>
<text x="24" y="226" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">deployer 계정</text>
<rect x="192" y="150" width="140" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="204" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">2 SVID</text>
<text x="204" y="204" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">spiffe://lab/</text>
<text x="204" y="226" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">client/deployer</text>
<text x="204" y="248" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">수명 5분</text>
<rect x="372" y="150" width="140" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="384" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">3 X5C 토큰</text>
<text x="384" y="204" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">SVID 를 첨부</text>
<text x="384" y="226" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">SVID 키로 서명</text>
<text x="384" y="248" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">공개키와 함께 전송</text>
<rect x="552" y="150" width="140" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="564" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">4 SSH 인증서</text>
<text x="564" y="204" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">KeyID = SPIFFE ID</text>
<text x="564" y="226" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">role-operator</text>
<text x="564" y="248" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">@billing · ≤ 5분</text>
<rect x="732" y="150" width="140" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="744" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">5 세션</text>
<text x="744" y="204" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">operator@</text>
<text x="744" y="226" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">host-billing</text>
<text x="744" y="248" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">uid 1001(operator)</text>
<path d="M 155 214.0 L 188 214.0" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<line x1="172.0" y1="206.0" x2="172.0" y2="130" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="172.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">spire-agent</text>
<text x="172.0" y="108" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">커널에 uid 확인</text>
<line x1="172.0" y1="222.0" x2="172.0" y2="308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="172.0" y="326" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">intruder</text>
<text x="172.0" y="344" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">no identity issued</text>
<path d="M 335 214.0 L 368 214.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="352.0" y1="206.0" x2="352.0" y2="130" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="352.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">lab-ssh-cert</text>
<text x="352.0" y="108" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SVID 키로 서명</text>
<path d="M 515 214.0 L 548 214.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="532.0" y1="206.0" x2="532.0" y2="130" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="532.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">step-ca</text>
<text x="532.0" y="108" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">매핑이 principal 결정</text>
<line x1="532.0" y1="222.0" x2="532.0" y2="308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="532.0" y="326" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">stranger</text>
<text x="532.0" y="344" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">no SSH mapping</text>
<path d="M 695 214.0 L 728 214.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="712.0" y1="206.0" x2="712.0" y2="130" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="712.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">sshd</text>
<text x="712.0" y="108" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">CA 서명 · principal 확인</text>
<line x1="712.0" y1="222.0" x2="712.0" y2="308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="712.0" y="326" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">admin@</text>
<text x="712.0" y="344" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Permission denied</text>
<text x="12" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">거부는 사유가 남는다 — 마지막 줄은 각 걸음에서 계정이 받는 응답 문구다</text>
</svg>
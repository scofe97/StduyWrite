<title id="dt">검색 하나가 단건 조회까지 멈춘 흐름</title><desc id="dd">fakeinv 백엔드의 느린 검색 쿼리가 공유 창구 32칸을 채워 5ms 단건 조회까지 30초 손님 타임아웃으로 무너진 흐름</desc>
<rect width="960" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SWIMLANE · CH08 I1 DIAGNOSIS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">검색 하나가 단건 조회까지 멈춘 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">검색 지연 주입 뒤 공유 일꾼 32칸이 잠식되고, 단건 조회가 8초 주기로 밀리다 전면 타임아웃으로 이어집니다.</text>

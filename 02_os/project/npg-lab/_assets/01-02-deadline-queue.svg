<title id="dt">요청 기한 15초 안의 줄 대기·백엔드 처리 시간축</title><desc id="dd">줄 대기 약 7초와 백엔드 처리 8초가 요청 기한 15초 경계에 걸려, 7초 안에 칸을 얻은 검색은 200 으로 끝나고 7초를 넘겨 기다린 검색은 15초에 504 UT 로 끝나 백엔드 일이 헛일이 되는 시간축</desc>
<rect width="960" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TIMELINE · CH08 DEADLINE &amp; QUEUE TIMEOUT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">요청 기한 15초 안의 줄 대기·백엔드 처리 시간축</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">줄 대기 약 7초와 백엔드 8초가 15초 기한에 걸려, 7초를 넘겨 기다린 검색은 504 UT 로 끝나고 백엔드 일은 헛일이 됩니다.</text>
<rect x="96" y="116" width="720" height="28" rx="4" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="456" y="135" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">프록시 요청 전체 기한 15s (context.WithTimeout)</text>
<rect x="96" y="160" width="326.4" height="44" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="259.2" y="187" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">줄 대기 7s 미만</text>
<rect x="422.4" y="160" width="384.0" height="44" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="614.4" y="187" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">백엔드 처리 8s → 14.8s 에 200</text>
<text x="84" y="187" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">200</text>
<rect x="96" y="212" width="348.0" height="44" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="270.0" y="239" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">줄 대기 7s 넘게</text>
<rect x="444.0" y="212" width="372.0" height="44" rx="6" fill="#F0616D20" stroke="#F0616D" stroke-width="1.4"/>
<text x="630.0" y="239" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">백엔드 처리 중 15s 에 손님 이탈 · 헛일</text>
<text x="84" y="239" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F0616D">UT</text>
<line x1="72" y1="276" x2="888" y2="276" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="96" y1="272" x2="96" y2="280" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="96" y="295" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">0s (도착)</text>
<line x1="432" y1="272" x2="432" y2="280" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="432" y="295" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">약 7s (전달)</text>
<line x1="816" y1="108" x2="816" y2="280" stroke="#F08A59" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="816" y="98" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">15s 기한 초과 (504 UT)</text>
<circle cx="816" cy="276" r="8" fill="none" stroke="#F08A59" stroke-width="2.0"/>
<circle cx="816" cy="276" r="5" fill="#F08A59"/>
<text x="816" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">15s (기한)</text>
<rect x="48" y="332" width="864" height="124" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="72" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">리틀의 법칙 L = λW 및 ADR 0012 결정 6</text>
<text x="72" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#5E6B7E">처리량 계산 (초당 처리 건수)</text>
<text x="72" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#F5F5F3">검색 8칸 ÷ 8초 = 처리량 초당 1건</text>
<text x="72" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#8B98A9">k번째 줄 대기시간 W ≈ k초</text>
<text x="364" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#5E6B7E">줄 상한 7 결정 (searchPending)</text>
<text x="364" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#F5F5F3">k + 8 ≤ 15s 기한 경계 조건</text>
<text x="364" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#8B98A9">칸 8 + 줄 7 가득 차면 503 UO</text>
<text x="648" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#5E6B7E">실측 경계 결과 (ch08 I1)</text>
<text x="648" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">대기 7s + 처리 8s ≈ 15s 경계</text>
<text x="648" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#F0616D">성공 200 (0.53/s) · UT (0.48/s)</text>
<line x1="12" y1="476" x2="912" y2="476" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="498" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="488" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">줄 대기 구간</text>
<rect x="235" y="488" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="257" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">백엔드 처리</text>
<rect x="357" y="488" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="379" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">15s 기한선 (focal)</text>
<rect x="596" y="488" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="618" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기한 넘긴 헛일</text>
</svg>
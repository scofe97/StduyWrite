<title id="dt">Caddy 모듈 등록부와 조립 파이프라인</title><desc id="dd">정적 컴파일 시점의 전역 표 등록과 실행 시점의 JSON 핸들러 인스턴스 조립 흐름</desc>
<rect width="960" height="492" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PROCESS · CADDY MODULE REGISTRY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Caddy 모듈 등록부와 조립 파이프라인</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바이너리 빌드 때 전역 표에 모듈을 등록하고, 실행 때 JSON 설정으로 인스턴스를 조립합니다.</text>

<title id="dt">프로세스 재시작 소켓 공백과 관리 API 무중단 교체 비교</title><desc id="dd">재시작 시 소켓 공백 3.0초 동안 refused 최대 97,183건 발생과 관리 API SO_REUSEPORT 무중단 교체의 수치 비교 시간축</desc>
<rect width="960" height="492" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TIMELINE · RELOAD VS RESTART</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로세스 재시작 소켓 공백과 관리 API 무중단 교체 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">재시작은 듣는 소켓 공백 동안 연결 거절을 유발하나, 관리 API /load 는 소켓 중첩으로 무중단을 달성합니다.</text>
<rect x="24" y="116" width="132" height="92" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="90" y="146" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">재시작 방식</text>
<text x="90" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">SIGTERM 수신</text>
<text x="90" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">문 닫고 공사</text>
<rect x="24" y="288" width="132" height="108" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="90" y="318" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">관리 API /load</text>
<text x="90" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">SO_REUSEPORT</text>
<text x="90" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">전체 50~97ms</text>
<line x1="168" y1="246" x2="936" y2="246" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="184" y1="242" x2="184" y2="250" stroke="#5E6B7E" stroke-width="0.8"/>
<circle cx="184" cy="246" r="4" fill="#8B98A9"/>
<text x="184" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">0s</text>
<line x1="360" y1="242" x2="360" y2="250" stroke="#5E6B7E" stroke-width="0.8"/>
<circle cx="360" cy="246" r="4" fill="#5E6B7E"/>
<text x="360" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">1.0s</text>
<line x1="536" y1="242" x2="536" y2="250" stroke="#5E6B7E" stroke-width="0.8"/>
<circle cx="536" cy="246" r="4" fill="#5E6B7E"/>
<text x="536" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">2.0s</text>
<line x1="712" y1="242" x2="712" y2="250" stroke="#5E6B7E" stroke-width="0.8"/>
<circle cx="712" cy="246" r="4" fill="#3FB98C"/>
<text x="712" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">3.0s</text>
<line x1="888" y1="242" x2="888" y2="250" stroke="#5E6B7E" stroke-width="0.8"/>
<circle cx="888" cy="246" r="4" fill="#8B98A9"/>
<text x="888" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">4.0s</text>
<text x="212" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">재시작 경과</text>
<rect x="184" y="116" width="528" height="92" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.6"/>
<text x="448" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">소켓 공백 약 3.0초</text>
<text x="448" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">커널 즉각 RST 회신 (0.1ms)</text>
<text x="448" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">refused 최대 97,183/s</text>
<rect x="724" y="116" width="212" height="92" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="830" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">새 프로세스 바인드</text>
<text x="830" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">포트 :8000 수락</text>
<text x="830" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">성공 1,269/s</text>
<rect x="184" y="288" width="248" height="108" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="308" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">새 서버 선행 기동</text>
<text x="308" y="338" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">SO_REUSEPORT 바인드</text>
<text x="308" y="362" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">소켓 추가 (:8000)</text>
<text x="308" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">공백 0ms</text>
<path d="M 432 342 L 448 342" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="448" y="288" width="236" height="108" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="566" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">소켓 겹침</text>
<text x="566" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">새 연결 즉시 수락</text>
<text x="566" y="362" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">옛 서버 드레인</text>
<text x="566" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">요청 완수 후 종료</text>
<path d="M 684 342 L 700 342" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="700" y="288" width="236" height="108" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.4"/>
<text x="818" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">무중단 교체 완료</text>
<text x="818" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">교체 97ms · 50ms</text>
<text x="818" y="362" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">refused 0건</text>
<text x="818" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">성공 약 1,500/s</text>
<line x1="12" y1="428" x2="912" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="450" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="440" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소켓 공백 (focal)</text>
<rect x="313" y="440" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="335" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 성공</text>
<rect x="422" y="440" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="444" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소켓 중첩</text>
<rect x="531" y="440" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="553" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재시작 경고</text>

<title id="dt">배포 드레인 20초와 종료 코드 분기 시간축</title><desc id="dd">종료 신호 t=0 에서 새 연결을 거절하고, 업스트림 최장 기한 15초보다 긴 20초 드레인 기한 동안 요청을 마친 뒤 제때 끝나면 exit 0, 기한 초과 시 exit 1 로 알리는 시간축</desc>
<rect width="960" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TIMELINE · DEPLOYMENT DRAIN &amp; EXIT CODE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">배포 드레인 20초와 종료 코드 분기 시간축</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">드레인은 가장 긴 요청(업스트림 15초)보다 길어야 하며, Shutdown 기한 초과 시 exit 1 로 배포 도구에 실패를 알립니다.</text>
<rect x="80" y="116" width="520" height="32" rx="4" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="340" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">드레인 허용 구간 20s (Server.Shutdown)</text>
<rect x="80" y="156" width="390" height="32" rx="4" fill="#E3B34114" stroke="#E3B341" stroke-width="1.0"/>
<text x="275" y="177" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">가장 긴 요청 상한 15s (업스트림 기한)</text>
<rect x="80" y="196" width="52" height="32" rx="4" fill="#5E6B7E24" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="106" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">refused</text>
<rect x="132" y="196" width="44" height="32" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.0"/>
<text x="186" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">실측 3.68s 에 처리 중 등록 완료 (끊김 0건)</text>
<line x1="60" y1="264" x2="900" y2="264" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="80" y1="260" x2="80" y2="268" stroke="#5E6B7E" stroke-width="0.8"/>
<circle cx="80" cy="264" r="4" fill="#8B98A9"/>
<text x="80" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">0s</text>
<text x="80" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">새 연결 거절</text>
<text x="80" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">SIGTERM 수신</text>
<line x1="132" y1="260" x2="132" y2="268" stroke="#5E6B7E" stroke-width="0.8"/>
<circle cx="132" cy="264" r="4" fill="#5E6B7E"/>
<text x="132" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">2s</text>
<text x="132" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">옛 1.99s 잘림</text>
<line x1="470" y1="260" x2="470" y2="268" stroke="#5E6B7E" stroke-width="0.8"/>
<circle cx="470" cy="264" r="4" fill="#E3B341"/>
<text x="470" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">15s</text>
<text x="470" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">업스트림 15s</text>
<text x="470" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">가장 긴 요청 상한</text>
<line x1="600" y1="108" x2="600" y2="264" stroke="#F08A59" stroke-width="1.8" stroke-dasharray="4 3"/>
<line x1="600" y1="328" x2="600" y2="350" stroke="#F08A59" stroke-width="1.8" stroke-dasharray="4 3"/>
<circle cx="600" cy="264" r="8" fill="none" stroke="#F08A59" stroke-width="2.0"/>
<circle cx="600" cy="264" r="5" fill="#F08A59"/>
<text x="600" y="98" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">드레인 기한 20s</text>
<text x="600" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">20s</text>
<text x="600" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">드레인 20s</text>
<text x="600" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">종료 분기</text>
<line x1="860" y1="260" x2="860" y2="268" stroke="#5E6B7E" stroke-width="0.8"/>
<circle cx="860" cy="264" r="4" fill="#6A95D8"/>
<text x="860" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">30s</text>
<text x="860" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6A95D8">쿠버네티스 30s</text>
<text x="860" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">강제 종료 상한</text>
<path d="M 600 350 L 320 350 L 320 368" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="180" y="368" width="280" height="48" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.2"/>
<text x="320" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">제때 완료 (≤20s): 정상 종료</text>
<text x="320" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">끊긴 요청 0건 · exit 0</text>
<path d="M 600 350 L 740 350 L 740 368" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="600" y="368" width="280" height="48" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.2"/>
<text x="740" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">기한 초과 (&gt;20s): ctx.Err()</text>
<text x="740" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">잔여 요청 로그 · exit 1</text>
<rect x="60" y="432" width="840" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="80" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">리허설 J4 실측과 ADR 0014 서열</text>
<text x="80" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">고치기 전(드레인 2s): 1.99s 잘림 · 손님 eof 2건 · exit 0 착시</text>
<text x="80" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">고친 뒤(드레인 20s): 3.68s 완료 · 손님 eof 0건 · 정상 exit 0 달성</text>
<line x1="12" y1="524" x2="912" y2="524" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="546" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="536" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">드레인 기한 20s</text>
<rect x="274" y="536" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="296" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 exit 0</text>
<rect x="435" y="536" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="457" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최장 기한 15s</text>
<rect x="596" y="536" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="618" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">초과 exit 1</text>
<rect x="757" y="536" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="779" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">k8s 상한 30s</text>
</svg>
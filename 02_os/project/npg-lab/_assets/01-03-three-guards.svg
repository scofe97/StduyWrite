<title id="dt">다운스트림 층이 막는 세 자리와 요청 흐름</title><desc id="dd">손님·프록시·백엔드 세 레인 위에서 몸통 읽기·응답 쓰기·배포 드레인이 각 장애를 통제하고 흐름을 완수하는 구조</desc>
<rect width="960" height="492" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SWIMLANE · DOWNSTREAM THREE GUARDS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">다운스트림 층이 막는 세 자리와 요청 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">몸통 읽기는 408 CT 로 끊고, 응답 쓰기는 504 누락을 막으며, 드레인은 배포 중 요청을 완수합니다.</text>
<line x1="24" y1="92" x2="936" y2="92" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="24" y1="104" x2="936" y2="104" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="24" y1="200" x2="936" y2="200" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="24" y1="308" x2="936" y2="308" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="24" y1="404" x2="936" y2="404" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="152" y1="104" x2="152" y2="404" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">손님</text>
<text x="36" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">npgload</text>
<text x="36" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">리버스 프록시</text>
<text x="36" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">npgproxy</text>
<text x="36" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">백엔드</text>
<text x="36" y="372" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">fakeinv</text>
<rect x="168" y="120" width="160" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="248" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">요청 전송 (몸통)</text>
<text x="248" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">2초에 1B 느린 손님</text>
<path d="M 248 180 L 248 218" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="168" y="218" width="160" height="72" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="248" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">가드 1 · 몸통 읽기 (J1)</text>
<text x="248" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">읽기 틈 10s · 최소 1KB/s</text>
<text x="248" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">하한 미달 408 CT 차단</text>
<path d="M 328 254 L 380 254 L 380 332" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="354" y="242" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 전달</text>
<rect x="380" y="332" width="156" height="56" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="0.9"/>
<text x="458" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">백엔드 검색 20s 지연</text>
<text x="458" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">업스트림 15s 기한 만료</text>
<path d="M 536 360 L 580 360 L 580 290" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="612" y="344" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">504 UT</text>
<rect x="480" y="216" width="220" height="74" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.6"/>
<text x="590" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">가드 2 · 응답 쓰기 (J2)</text>
<text x="590" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">쓰기 틈 10s (대기 중 미작동)</text>
<text x="590" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">15.0s 에 504 전송 보장</text>
<path d="M 700 253 L 736 253" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="736" y="216" width="188" height="74" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="830" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">가드 3 · 배포 드레인 (J4)</text>
<text x="830" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">드레인 20s (15s 초과)</text>
<text x="830" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">진행 요청 완수 (exit 0)</text>
<path d="M 830 216 L 830 180" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="870" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">응답 전달</text>
<rect x="736" y="120" width="188" height="60" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="830" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">응답 안전 수신</text>
<text x="830" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">504 · 201 (단절 방지)</text>
<line x1="12" y1="428" x2="912" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="450" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="440" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">응답 쓰기 보호</text>
<rect x="248" y="440" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="270" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">느린 손님 차단</text>
<rect x="396" y="440" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="418" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">배포 드레인 완수</text>
<rect x="557" y="440" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="579" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 수신</text>
<rect x="666" y="440" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="688" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실패 코드</text>

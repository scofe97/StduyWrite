<title id="dt">고친 뒤 연결 일생</title><desc id="dd">동시 50 요청 중 24개는 풀의 연결을 쓰고 26개는 프록시 안에서 기다리며, 응답을 마친 연결이 닫히지 않고 풀로 돌아와 기다리던 요청에 바로 넘어가는 흐름</desc>
<rect width="960" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · CH08 I3 FIX</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">고친 뒤 연결 일생</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">빈 연결 상한과 동시 연결 상한을 24 로 맞추었으므로 연결이 닫히지 않고 돌아와 재사용됩니다.</text>
<rect x="24" y="140" width="120" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84.0" y="175.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">동시 50 요청</text>
<text x="84.0" y="194.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">60초 부하</text>
<rect x="184" y="140" width="160" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="264.0" y="175.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">사용 중 24칸</text>
<text x="264.0" y="194.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">칸 24 안에서 왕복</text>
<rect x="384" y="140" width="168" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="468.0" y="175.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">본문 닫기</text>
<text x="468.0" y="194.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">연결을 풀에 반환</text>
<rect x="592" y="140" width="160" height="76" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.6"/>
<text x="672.0" y="175.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">빈 연결 풀 24</text>

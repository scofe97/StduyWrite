<title id="dt">유휴 연결 경합의 시간축과 재시도 분기</title><desc id="dd">백엔드가 응답을 보낸 시각 t0 기준으로 close 와 FIN 도착 사이 틈에 보낸 요청이 EOF 를 만나고, GET 은 새 연결로 다시 가며 POST 는 502 로 끝나는 시간축</desc>
<rect width="960" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TIMELINE · CH08 I2 RACE WINDOW · ms FROM t0</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">유휴 연결 경합의 시간축과 재시도 분기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">백엔드가 t0+1000 에 닫고 FIN 이 t0+1100 에 닿는 틈에 보낸 요청은 EOF 를 만나고, GET 만 새 연결로 다시 갑니다.</text>

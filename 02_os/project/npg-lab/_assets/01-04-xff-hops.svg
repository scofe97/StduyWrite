<title id="dt">전달 헤더 신뢰 경계와 위치 기반 신뢰 우회</title><desc id="dd">앞단 Caddy 와 npgproxy 가 앞 홉을 믿지 않아 가짜 헤더를 지우는 기본 판과, 단일 머신에서 IP 신뢰 부여 시 가짜 주소가 맨 뒤 fakeinv 까지 통과하는 우회</desc>

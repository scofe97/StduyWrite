<title id="dt">고친 뒤 요청 경로</title><desc id="dd">검색은 프록시 줄 7칸을 넘으면 503 UO 로 거절되고, 단건 조회는 24칸 풀로 백엔드 창구 32칸에 닿아 초당 50건 모두 200 이 되는 경로</desc>

<title id="dt">인증서 사슬 구조와 자동 갱신 규칙</title><desc id="dd">신뢰의 뿌리부터 도메인까지 이어지는 인증서 사슬과 certmagic 자동 갱신 메커니즘</desc>
<rect width="960" height="492" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TREE · CERTIFICATE CHAIN &amp; RENEWAL</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인증서 사슬 구조와 자동 갱신 규칙</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">루트가 서명을 중간 CA 에 위임하고, 일상 발급은 7일 중간 CA 가 맡습니다.</text>
<line x1="24" y1="92" x2="936" y2="92" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="56" y="116" width="360" height="60" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="236" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">루트 CA (3600일)</text>
<text x="236" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">운영은 오프라인 권장</text>
<path d="M 236 176 L 236 212" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="244" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">서명 (위임)</text>
<rect x="56" y="212" width="360" height="60" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.6"/>
<text x="236" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">중간 CA (7일)</text>
<text x="236" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">일상 발급 대리 (온라인)</text>

<title id="dt">I2 장애 관측 신호와 가설 검증 흐름</title><desc id="dd">간헐적 POST 502 장애에서 수집한 8단계 관측 신호와 가설의 채택·폐기 판정 과정</desc>
<rect width="960" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · CH08 I2 DIAGNOSIS</text>

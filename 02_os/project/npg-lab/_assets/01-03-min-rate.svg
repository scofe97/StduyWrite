<circle cx="540.0" cy="379.9" r="4" fill="#F08A59"/>
<circle cx="650.0" cy="379.9" r="4" fill="#F08A59"/>
<text x="375.0" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">느린 손님 전송선 (2초에 1B)</text>

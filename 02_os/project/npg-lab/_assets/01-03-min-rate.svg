<line x1="100" y1="328.8" x2="760" y2="328.8" stroke="rgba(191,192,192,0.22)" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="88" y="332.8" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2 KB</text>
<line x1="100" y1="277.6" x2="760" y2="277.6" stroke="rgba(191,192,192,0.22)" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="88" y="281.6" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">4 KB</text>
<line x1="100" y1="226.4" x2="760" y2="226.4" stroke="rgba(191,192,192,0.22)" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="88" y="230.4" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">6 KB</text>
<line x1="100" y1="175.2" x2="760" y2="175.2" stroke="rgba(191,192,192,0.22)" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="88" y="179.2" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">8 KB</text>
<line x1="100" y1="124.0" x2="760" y2="124.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.5" stroke-dasharray="3 4"/>
<text x="88" y="128.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10 KB</text>

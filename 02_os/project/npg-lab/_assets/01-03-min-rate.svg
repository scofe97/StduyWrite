<text x="230" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">전송 틈 2s &lt; 10s 로 매번 갱신 · 미차단</text>

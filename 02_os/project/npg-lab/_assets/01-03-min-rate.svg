<title id="dt">느린 손님 전송과 최소 속도 하한선의 408 CT 차단</title><desc id="dd">2초에 1바이트씩 흘리는 느린 손님은 틈 시계로 끊지 못하고, 10초 시점에 최소 속도 1KB/s 하한선에 미달하여 408 CT 로 차단되는 추세</desc>
<rect width="960" height="492" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINE CHART · CH09 J1 MIN-RATE &amp; 408 CT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">느린 손님 전송과 최소 속도 하한선의 408 CT 차단</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">틈 시계는 2초 간격마다 갱신되어 차단하지 못하지만, 10초 뒤 최소 속도 미달로 408 CT 가 발동합니다.</text>
<line x1="24" y1="92" x2="936" y2="92" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="100" y1="380.0" x2="760" y2="380.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.5" stroke-dasharray="3 4"/>

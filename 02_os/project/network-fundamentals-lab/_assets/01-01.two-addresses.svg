<title id="dt">주소가 둘인 이유</title><desc id="dd">L3 와 L2 두 층이 각각 맡는 주소 · 장비 · 유효 범위. 모든 IP 통신은 아래층 프레임에 실려 나간다.</desc>
<rect width="880" height="384" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NETWORK FUNDAMENTALS LAB · 01-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">주소가 둘인 이유</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위층은 구간을 넘어 목적지를 찾고, 아래층은 구간 안에서 건넨다</text>
<rect x="24" y="104" width="832" height="96" rx="8" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.3"/>
<text x="44" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#6A95D8">L3 · IP 계층</text>
<text x="44" y="160" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">IP 주소 · 라우터</text>
<text x="44" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">10.10.10.1 — 봉투에 적힌 주소</text>
<text x="836" y="160" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">구간을 넘어 목적지를 찾는다</text>
<rect x="24" y="248" width="832" height="96" rx="8" fill="#F08A5910" stroke="#F08A59" stroke-width="1.3"/>
<text x="44" y="278" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">L2 · 이더넷 계층</text>
<text x="44" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">MAC 주소 · 스위치</text>
<text x="44" y="326" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">aa:c1:ab:… — 옆방까지 건네는 손</text>
<text x="836" y="304" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">같은 구간 안에서만 유효하다</text>
<path d="M 144 200 V 244" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="160" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">모든 IP 통신은 결국 L2 프레임에 실린다</text>
<text x="24" y="368" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">IP 는 아는데 MAC 을 모르면? — 그 물음이 01장 ARP 다</text>
</svg>
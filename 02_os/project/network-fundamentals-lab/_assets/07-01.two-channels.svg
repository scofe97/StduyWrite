<title id="dt">ping 과 서비스, 두 채널의 네 조합</title><desc id="dd">진단 채널(ICMP)과 서비스 채널(TCP)은 중간 장비가 다르게 다룰 수 있다. 네 칸 중 대각선만 직관과 맞는다.</desc>
<rect width="880" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NETWORK FUNDAMENTALS LAB · 07-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">ping 과 서비스, 두 채널의 네 조합</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">대각선이 아닌 두 칸이 이 편과 앞 편이 다루는 자리다</text>
<text x="320.0" y="96" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">서비스 채널 (curl · nc) 성공</text>
<text x="676.0" y="96" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">서비스 채널 실패</text>
<text x="140" y="172.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">ping 성공</text>
<text x="140" y="312.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">ping 실패</text>
<rect x="150" y="110" width="340" height="124" rx="8" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.2"/>
<text x="168" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#3FB98C">정상</text>
<text x="168" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">두 채널이 다 산다</text>
<rect x="506" y="110" width="340" height="124" rx="8" fill="#E3B34110" stroke="#E3B341" stroke-width="1.2"/>
<text x="524" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#E3B341">포트·프로세스를 본다</text>
<text x="524" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">경로는 성립하는데 종단이 안 받는다</text>
<text x="524" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">08편 — refused · 리스너 없음</text>
<rect x="150" y="250" width="340" height="124" rx="8" fill="#F0616D10" stroke="#F0616D" stroke-width="1.2"/>
<text x="168" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F0616D">ICMP 가 막혔다</text>
<text x="168" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서버는 멀쩡한데 모니터링이 죽었다고 한다</text>
<text x="168" y="346" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">15편 — 이 편 §2</text>
<rect x="506" y="250" width="340" height="124" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="524" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">경로를 본다</text>
<text x="524" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">두 채널이 함께 죽었으면 아래층이다</text>
<text x="524" y="346" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">04·05편 — 라우팅·블랙홀</text>
<text x="24" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">ping 은 서비스의 생사가 아니라 ICMP 의 생사를 알려 준다 — 최종 판정은 서비스 채널로</text>
</svg>
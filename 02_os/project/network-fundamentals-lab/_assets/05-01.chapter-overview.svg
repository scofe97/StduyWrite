<title id="dt">연결은 양 끝만의 일이 아니다 — 읽는 순서</title><desc id="dd">08·09·10·11편을 묶은 노트의 절 넷. 연결이 맺히고 유지되고 재작성되는 국면마다 다른 지문이 나온다.</desc>
<rect width="880" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NETWORK FUNDAMENTALS LAB · 05-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">연결은 양 끝만의 일이 아니다 — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">마지막 절이 앞의 셋을 합성한다 — 저자가 11편을 그렇게 설계했다</text>

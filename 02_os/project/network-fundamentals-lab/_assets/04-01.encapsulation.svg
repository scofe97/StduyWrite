<title id="dt">VXLAN 캡슐의 안과 밖</title><desc id="dd">원래 이더넷 프레임이 UDP 와 IP 로 감싸여 라우팅된 망을 여행한다. 중간 라우터는 바깥만 보고 안쪽은 모른다.</desc>
<rect width="880" height="424" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NETWORK FUNDAMENTALS LAB · 04-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">VXLAN 캡슐의 안과 밖</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바깥은 라우팅되는 L3 세계, 안쪽은 호스트들이 믿는 L2 세계</text>
<rect x="24" y="112" width="832" height="172" rx="10" fill="#6A95D808" stroke="#6A95D8" stroke-width="1.3"/>
<text x="44" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">outer — underlay 를 여행하는 UDP 패킷</text>
<rect x="44" y="156" width="96" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="92.0" y="181" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">EthII</text>
<rect x="150" y="156" width="132" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="216.0" y="181" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">IP 10.7.x</text>
<rect x="292" y="156" width="132" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="358.0" y="181" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">UDP :4789</text>
<rect x="434" y="156" width="124" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="496.0" y="181" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">VXLAN vni</text>
<rect x="44" y="210" width="792" height="66" rx="8" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.3"/>
<text x="60" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">inner — 원래 프레임 그대로</text>
<rect x="60" y="244" width="92" height="24" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="106.0" y="261" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">EthII</text>
<rect x="162" y="244" width="188" height="24" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="256.0" y="261" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">IP 192.168.100.x</text>
<rect x="360" y="244" width="120" height="24" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="420.0" y="261" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">payload</text>
<text x="820" y="261" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">ARP·브로드캐스트도 여기 실린다</text>
<rect x="24" y="308" width="404" height="62" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="42" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">중간 라우터</text>
<text x="42" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">UDP 패킷 하나로만 본다 — 안은 모른다</text>
<rect x="452" y="308" width="404" height="62" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="470" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">목적지 VTEP</text>
<text x="470" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">vni 가 자기 것일 때만 껍질을 벗긴다</text>
<text x="24" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">outer 50바이트가 캡슐의 비용이다 — 14 + 20 + 8 + 8</text>
</svg>
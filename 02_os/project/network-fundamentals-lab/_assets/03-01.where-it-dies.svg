<title id="dt">같은 타임아웃, 다른 소멸 지점</title><desc id="dd">h1 에서 h2 로 가는 경로 위에서 세 고장이 각각 다른 자리에 패킷을 죽인다. 발신자가 보는 증상만으로는 갈리지 않는다.</desc>
<rect width="880" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NETWORK FUNDAMENTALS LAB · 03-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 타임아웃, 다른 소멸 지점</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">캡처를 어디에 꽂느냐가 세 고장을 가른다</text>
<rect x="24" y="112" width="178" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="113.0" y="136" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">h1</text>
<text x="113.0" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">10.4.1.10</text>
<rect x="242" y="112" width="178" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="331.0" y="136" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">r1</text>
<text x="331.0" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">게이트웨이</text>
<rect x="460" y="112" width="178" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="549.0" y="136" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">r2</text>
<text x="549.0" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">리턴 없음</text>
<rect x="678" y="112" width="178" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="767.0" y="136" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">h2</text>
<text x="767.0" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">10.4.2.10</text>
<path d="M 202 140 L 238 140" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 420 140 L 456 140" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 638 140 L 674 140" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="24" y="100" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">포워드 — 완주한다</text>
<path d="M 767.0 168 V 202 H 549.0 V 178" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)"/>
<rect x="582.5" y="192" width="157.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="661.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">리턴은 r2 에서 죽는다</text>
<rect x="24" y="252" width="264" height="128" rx="8" fill="#F0616D10" stroke="#F0616D" stroke-width="1.2"/>
<text x="40" y="280" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">리턴 라우트 누락</text>
<text x="40" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">r2 의 테이블에 h1 대역 없음</text>
<text x="40" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">h2 에 꽂으면 보인다</text>
<text x="40" y="358" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">request 도달 · reply 발신 · r2 반송</text>
<rect x="310" y="252" width="264" height="128" rx="8" fill="#E3B34110" stroke="#E3B341" stroke-width="1.2"/>
<text x="326" y="280" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">ip_forward=0</text>
<text x="326" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">r1 이 라우터이길 그만둠</text>
<text x="326" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">r1 에 꽂아야 보인다</text>
<text x="326" y="358" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">h2 는 0 패킷 · r1 에만 request</text>
<rect x="596" y="252" width="264" height="128" rx="8" fill="#5E6B7E10" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="612" y="280" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#5E6B7E">기본 게이트웨이 누락</text>
<text x="612" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">h1 커널이 보내기 전에 거절</text>
<text x="612" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">캡처가 필요 없다</text>
<text x="612" y="358" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">타임아웃이 아니라 즉시 에러</text>
<text x="24" y="432" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">즉시 에러는 내 테이블에 길이 없다는 뜻이고, 타임아웃은 보냈는데 소식이 없다는 뜻이다</text>
</svg>
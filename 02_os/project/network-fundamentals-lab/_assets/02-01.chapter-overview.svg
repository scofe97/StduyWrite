<title id="dt">같은 세그먼트 안에서만 통한다 — 읽는 순서</title><desc id="dd">01·02·03편을 묶은 노트의 절 셋. 무엇이 '같은 L2' 를 정하는지가 절마다 갱신된다.</desc>
<rect width="880" height="300" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NETWORK FUNDAMENTALS LAB · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 세그먼트 안에서만 통한다 — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">케이블은 필요조건일 뿐 — 마스크가 정하고, 그다음 태그가 정한다</text>
<path d="M 285 179.0 L 305 179.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

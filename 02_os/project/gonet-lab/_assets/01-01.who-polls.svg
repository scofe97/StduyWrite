<title id="dt">어떤 기다림이 스레드를 쥐는가</title><desc id="dd">소켓은 Go 가 논블로킹으로 만들어 netpoller 에 올리므로 기다리는 goroutine 이 IO wait 로 잠들고 스레드를 반납한다. 디스크 파일은 epoll 이 등록을 거부하고, os.Stdin 은 이미 논블로킹일 때만 등록되며, syscall 직접 호출과 cgo 는 런타임을 거치지 않으므로 셋 다 syscall 상태로 스레드를 쥔 채 기다린다. gonet client 의 stdin 이 셋째 줄이다.</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 01-01 WHO POLLS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">어떤 기다림이 스레드를 쥐는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">netpoller 에 올라간 줄만 스레드를 돌려줍니다.</text>
<rect x="24" y="120" width="256" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="152.0" y="147.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">소켓 net.Conn</text>
<text x="152.0" y="166.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Go 가 논블로킹으로 만듦</text>
<path d="M 286 150.0 L 350 150.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="356" y="120" width="256" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="484.0" y="147.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">netpoller 에 등록</text>
<text x="484.0" y="166.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">EAGAIN 이면 재움</text>
<path d="M 618 150.0 L 682 150.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="688" y="120" width="256" height="60" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="816.0" y="147.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">[IO wait]</text>
<text x="816.0" y="166.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">스레드 반납</text>

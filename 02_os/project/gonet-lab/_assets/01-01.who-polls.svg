<rect x="688" y="204" width="256" height="60" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>
<text x="816.0" y="231.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">[syscall]</text>
<text x="816.0" y="250.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">스레드를 쥠</text>

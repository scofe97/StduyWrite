<text x="152.0" y="315.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">os.Stdin</text>
<text x="152.0" y="334.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">터미널은 보통 블로킹</text>
<path d="M 286 318.0 L 350 318.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="356" y="288" width="256" height="60" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.6"/>
<text x="484.0" y="315.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">NewFile 은 이미 논블로킹일 때만</text>

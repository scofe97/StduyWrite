<title id="dt">deadline 을 한 번 걸 때와 계속 밀 때</title><desc id="dd">입력이 5·20·35초에 오는 가상 연결에 30초 deadline 을 건 두 방식을 비교한 도식. 접속 때 한 번만 걸면 30초에 끊겨 35초의 입력을 받지 못한다. 받을 때마다 지금부터 30초 뒤로 밀면 마지막 입력인 35초에서 30초가 지난 65초에 끊긴다.</desc>
<rect width="960" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">GANTT · 01-01 DEADLINE KINDS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">deadline 을 한 번 걸 때와 계속 밀 때</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가상 시나리오입니다. 입력은 5·20·35초에 오고, 제한은 30초입니다.</text>
<text x="220.0" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">0초 · 접속</text>
<line x1="220.0" y1="128" x2="220.0" y2="352" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="475.0" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">30초</text>
<line x1="475.0" y1="128" x2="475.0" y2="352" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="772.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">65초</text>
<line x1="772.5" y1="128" x2="772.5" y2="352" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="900.0" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">80초</text>
<line x1="900.0" y1="128" x2="900.0" y2="352" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<line x1="220" y1="128" x2="900.0" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="164" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">입력</text>
<rect x="257.5" y="150" width="10" height="20" rx="2" fill="#6A95D840" stroke="#6A95D8" stroke-width="1.2"/>
<text x="262.5" y="188" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">5초</text>
<rect x="385.0" y="150" width="10" height="20" rx="2" fill="#6A95D840" stroke="#6A95D8" stroke-width="1.2"/>
<text x="390.0" y="188" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">20초</text>
<rect x="512.5" y="150" width="10" height="20" rx="2" fill="#6A95D840" stroke="#6A95D8" stroke-width="1.2"/>
<text x="517.5" y="188" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">35초</text>
<text x="24" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">한 번만 건 deadline</text>
<text x="24" y="254" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">접속 때 30초 뒤로</text>
<rect x="220" y="226" width="255.0" height="24" rx="4" fill="#F0616D12" stroke="#F0616D" stroke-width="1.0"/>
<text x="232" y="243" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">30초에 끊김</text>
<text x="525.5" y="243" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">35초 입력을 못 받음</text>
<text x="24" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">받을 때마다 민 deadline</text>
<text x="24" y="326" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">받을 때마다 30초 뒤로</text>
<rect x="220" y="298" width="552.5" height="24" rx="4" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.0"/>
<text x="232" y="315" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">마지막 입력 뒤 30초가 지나 끊김</text>
<line x1="12" y1="372" x2="912" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="394" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="384" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">입력</text>
<rect x="170" y="384" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="192" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">idle timeout</text>
<rect x="370" y="384" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="392" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수명 제한이 돼 버림</text>

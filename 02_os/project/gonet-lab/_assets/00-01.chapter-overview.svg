<title id="dt">코드 한 줄에서 FD 까지</title><desc id="dd">gonet 서버의 소켓 수명을 생성·접속·종료 세 단계로 나누고, 단계마다 Go 코드와 그 아래 syscall, 커널에 남는 것을 같은 자리에 둔 지도. 생성은 listener FD 하나, 접속은 연결마다 FD 하나를 남기고, 종료는 두 소켓을 따로 닫는다. 맨 아래 칩은 그 단계를 다루는 절이다.</desc>

<title id="dt">클라이언트 A·B·C 를 받는 두 서버</title><desc id="dd">TCP 서버는 listener 하나와 클라이언트마다 연결 소켓 하나, goroutine 하나를 둔다. UDP 서버는 소켓 하나로 셋을 모두 받고 ReadFrom 이 데이터와 함께 보낸 쪽 주소를 돌려준다. 떠났다는 신호가 없으므로 앱이 주소별 마지막 시각을 적어 두고 오래 조용한 항목을 타이머로 지운다.</desc>

<title id="dt">클라이언트 셋이 보낸 것이 서버에 닿는 길</title><desc id="dd">TCP 에서는 A, B, C 가 보낸 세그먼트가 4-tuple 에 따라 연결 소켓 셋으로 갈라지고 연결마다 goroutine 이 붙으며, 떠날 때는 FIN 이 EOF 로 알려 준다. UDP 에서는 셋의 데이터그램이 소켓 하나의 대기열에 주소를 달고 줄 서고, ReadFrom 이 주소와 함께 꺼내며, 떠났다는 신호가 없어 앱이 타이머로 지운다.</desc>
<rect width="960" height="472" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 02-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">클라이언트 셋이 보낸 것이 서버에 닿는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">TCP 는 상대마다 갈래가 생기고, UDP 는 한 줄로 모였다가 주소로만 구분됩니다.</text>

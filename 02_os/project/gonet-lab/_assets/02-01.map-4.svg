<title id="dt">1~6 을 보냈는데 손실과 뒤바뀜이 끼면</title><desc id="dd">UDP 로 1 부터 6 을 보낼 때 선로에서 4 가 사라지면 받는 쪽 대기열에는 빠진 채 1 2 3 5 6 이 쌓이고, 5 가 4 를 추월하면 도착한 순서 그대로 1 2 3 5 4 6 이 쌓인다. 커널은 어느 쪽도 알리지 않으며, 본문에 번호를 넣은 앱만 빠짐과 뒤바뀜을 알아채 재정렬하거나 버린다.</desc>

<title id="dt">main 이 돌아가면 프로그램이 끝납니다</title><desc id="dd">§1 예제의 두 goroutine 실행 구간을 시간 막대로 그린 도식. Sleep 이 있으면 main 이 goroutine B 의 출력 뒤까지 살아 있어 B 가 끝까지 돈다. Sleep 이 없으면 main 이 먼저 돌아가 프로그램이 끝나고, 아직 출력 전인 B 도 함께 잘린다.</desc>
<rect width="960" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">GANTT · 00-03 MAIN EXIT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">main 이 돌아가면 프로그램이 끝납니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 두 줄은 Sleep 이 있을 때, 아래 두 줄은 Sleep 이 없을 때입니다.</text>
<text x="220" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">시작</text>
<line x1="220" y1="128" x2="220" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="420" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">go 문</text>
<line x1="420" y1="128" x2="420" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="620" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">B 가 출력할 때</text>
<line x1="620" y1="128" x2="620" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="820" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Sleep 끝</text>
<line x1="820" y1="128" x2="820" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<line x1="220" y1="128" x2="820" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="164" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">main</text>
<text x="24" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Sleep 있음</text>
<rect x="220" y="154" width="600" height="24" rx="4" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="232" y="171" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">A 출력 · Sleep</text>
<text x="24" y="216" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">goroutine B</text>
<text x="24" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Sleep 있음</text>
<rect x="420" y="206" width="200" height="24" rx="4" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.0"/>
<text x="432" y="223" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">B 출력까지 끝남</text>
<line x1="24" y1="256" x2="920" y2="256" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="292" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">main</text>
<text x="24" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Sleep 없음</text>
<rect x="220" y="282" width="300.0" height="24" rx="4" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="232" y="299" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">A 출력 · return</text>
<text x="24" y="344" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">goroutine B</text>
<text x="24" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Sleep 없음</text>
<rect x="420" y="334" width="100.0" height="24" rx="4" fill="#E3B34112" stroke="#E3B341" stroke-width="1.0"/>
<text x="432" y="351" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">잘림</text>
<line x1="520.0" y1="336" x2="620" y2="336" stroke="#E3B341" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="628" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">출력하지 못함</text>
<line x1="520.0" y1="264" x2="520.0" y2="384" stroke="#F0616D" stroke-width="1.6"/>
<text x="528.0" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">프로그램 종료</text>
<line x1="12" y1="412" x2="912" y2="412" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="434" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="424" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">main</text>
<rect x="196" y="424" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="218" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">끝까지 돈 goroutine</text>
<rect x="435" y="424" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="457" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">잘린 goroutine</text>
<rect x="635" y="424" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="657" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로그램 종료</text>
</svg>
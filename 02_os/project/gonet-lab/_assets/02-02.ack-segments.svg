<title id="dt">서로의 바이트를 ACK 하는 양쪽</title><desc id="dd">TCP 는 양쪽이 각자 보내는 바이트에 번호를 따로 매긴다. 설명을 위해 클라이언트 번호는 1 부터, 서버 번호는 501 부터 센다. SEQ 는 내가 보내는 바이트의 번호이고 ACK 는 상대 바이트를 어디까지 받았는지다. 서버는 echo 데이터에 ACK 7 을 얹어 클라이언트의 1~6 을 받았다고 알리고, 클라이언트는 곧 보낼 데이터가 없으면 본문 0 바이트 세그먼트로 ACK 507 만 보내 서버의 501~506 을 받았다고 알린다. 본문이 없으므로 번호를 쓰지 않아 뒤이은 msg2 도 SEQ 7 로 시작한다.</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 02-02 ACK SEGMENTS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서로의 바이트를 ACK 하는 양쪽</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">SEQ = 내 바이트 번호, ACK = 상대 바이트를 어디까지 빈틈없이 받았나(누적 ACK). 빈자리가 없어 SACK 은 붙지 않습니다.</text>
<rect x="24.0" y="104" width="240" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="144.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="144.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9"></text>
<rect x="672.0" y="104" width="240" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="792.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서버</text>
<text x="792.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9"></text>
<text x="144.0" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">번호 1 부터</text>
<text x="792.0" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">번호 501 부터</text>
<line x1="144.0" y1="154" x2="144.0" y2="470" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="792.0" y1="154" x2="792.0" y2="470" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 154.0 200 L 780.0 200" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="468.0" y="191" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">SEQ 1 · ACK 501 · 본문 msg1 6B</text>
<text x="468.0" y="219" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">클라이언트 1~6 을 보냄</text>
<path d="M 782.0 276 L 156.0 276" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="468.0" y="267" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">SEQ 501 · ACK 7 · 본문 echo 6B</text>
<text x="468.0" y="295" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서버 501~506 을 보내며 클라이언트 1~6 받음을 얹음</text>
<path d="M 154.0 352 L 780.0 352" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="468.0" y="343" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">SEQ 7 · ACK 507 · 본문 0B</text>
<text x="468.0" y="371" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">ACK 만: 서버 501~506 받음 · 번호를 쓰지 않음</text>
<path d="M 154.0 428 L 780.0 428" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="468.0" y="419" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">SEQ 7 · ACK 507 · 본문 msg2 6B</text>
<text x="468.0" y="447" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">다음 데이터에 얹음 · 그래서 다시 SEQ 7</text>
</svg>
<title id="dt">꼬리에서 사라진 100 이 되살아나는 세 갈래</title><desc id="dd">100 뒤로 101 이 도착하면 ACK 100 과 SACK 101 이 증거가 되어 RACK 이 곧 판정한다. 100 이 마지막이면 SACK 이 없어 증거가 없으므로 PTO 가 지난 뒤 TLP 탐침을 보내 ACK 를 끌어낸다. 탐침마저 사라지면 돌아오는 것이 없어 최소 200ms 인 RTO 가 끝나야 재전송한다.</desc>

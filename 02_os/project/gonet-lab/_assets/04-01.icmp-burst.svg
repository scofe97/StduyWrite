<title id="dt">닫힌 UDP 포트 1,000개, 몰아서 묻기와 고르게 묻기</title><desc id="dd">대상 커널은 같은 출발지에 port unreachable 을 6개까지 몰아 보내고, 그 뒤로는 1초에 1개만 보낸다. 1초 안에 1,000개를 물으면 ICMP 는 7개쯤만 돌아오고 나머지 993개는 무응답이 되어 open|filtered 로 잘못 적힌다. 1초에 1개씩 물으면 전부 ICMP 를 받지만 1,000초가 걸린다. lo 에는 이 대상별 제한이 없다.</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">닫힌 UDP 포트 1,000개, 몰아서 묻기와 고르게 묻기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">커널의 토큰 버킷 규칙(inetpeer 버스트 6 · icmp_ratelimit 1000ms)으로 계산한 값입니다. 실측은 Phase 3 에서 합니다.</text>
<text x="231.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">보내는 방식</text>

<title id="dt">ss 가 보여 준 소켓 줄</title><desc id="dd">클라이언트 셋을 붙인 채 ss 를 돌리자 UDP 서버는 UNCONN 한 줄이었고 UDP 클라이언트 셋은 connect 로 상대를 적어 ESTAB 이었다. TCP 서버는 LISTEN 한 줄과 연결마다 ESTAB 한 줄씩 넷이었고, 클라이언트 쪽 줄은 로컬과 상대를 뒤집은 한 쌍이었다.</desc>

<title id="dt">FD 표는 프로세스마다 하나씩</title><desc id="dd">gonet 프로세스 셋의 FD 표를 나란히 놓은 도식. 세 프로세스 모두 처음 만든 소켓이 4 번이고, 클라이언트 1 과의 연결은 클라이언트 쪽 4 번과 서버 쪽 5 번, 클라이언트 2 와의 연결은 클라이언트 쪽 4 번과 서버 쪽 10 번으로 한 연결의 두 끝이 서로 다른 번호를 가진다. 클라이언트의 3 번은 관측하지 않았다.</desc>

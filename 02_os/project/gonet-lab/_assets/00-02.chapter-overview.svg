<title id="dt">서버 한 번의 수명을 따라 읽은 다섯 장면</title><desc id="dd">gonet 서버를 strace 아래에서 띄우고 끄는 동안의 다섯 장면을 시간 순서로 놓은 지도. 뜨기는 socket·bind·listen, 기다리기는 accept4 의 EAGAIN, FD 쥐기는 /proc/pid/fd, 닫기는 kill -INT 뒤의 close, 닫힌 뒤는 FIN-WAIT-2 와 CLOSE-WAIT 를 보고, 각 장면이 문서의 §1~§5 에 대응한다.</desc>
<rect width="960" height="316" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TIMELINE · 00-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서버 한 번의 수명을 따라 읽은 다섯 장면</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">눈금마다 그 장면에서 본 출력과, 그것을 읽는 절을 적었습니다.</text>
<line x1="48" y1="200" x2="912" y2="200" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<rect x="94" y="194" width="12" height="12" rx="2" fill="#5E6B7E40" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="100" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">뜨기</text>
<text x="100" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">socket · bind · listen</text>
<rect x="21.0" y="226" width="158.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="100" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">§1 strace 읽기</text>
<rect x="284" y="194" width="12" height="12" rx="2" fill="#5E6B7E40" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="290" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">기다리기</text>
<text x="290" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">accept4 = EAGAIN</text>
<rect x="241.0" y="226" width="98.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="290" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">§2 논블로킹</text>
<rect x="474" y="194" width="12" height="12" rx="2" fill="#F08A5940" stroke="#F08A59" stroke-width="1.2"/>
<text x="480" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">FD 쥐기</text>
<text x="480" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">/proc/&lt;pid&gt;/fd</text>
<rect x="431.0" y="226" width="98.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="480" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">§3 FD 표</text>
<rect x="664" y="194" width="12" height="12" rx="2" fill="#5E6B7E40" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="670" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">닫기</text>
<text x="670" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">kill -INT → close</text>
<rect x="597.0" y="226" width="146.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="670" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">§4 코드 close</text>
<rect x="854" y="194" width="12" height="12" rx="2" fill="#5E6B7E40" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="860" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">닫힌 뒤</text>
<text x="860" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">FIN-WAIT-2 · CLOSE-WAIT</text>
<rect x="793.0" y="226" width="134.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="860" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">§5 상태 · 에러</text>
<line x1="12" y1="268" x2="912" y2="268" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="290" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="280" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="290" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가장 많이 막힌 곳</text>
</svg>
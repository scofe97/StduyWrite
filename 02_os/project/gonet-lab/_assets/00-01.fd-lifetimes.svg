<title id="dt">listener FD 와 연결 FD 의 수명</title><desc id="dd">클라이언트 둘이 붙은 gonet 서버에서 FD 세 개가 언제 생기고 닫히는지를 시간 막대로 그린 도식. listener FD 는 종료 신호에, 클라이언트 1 의 연결 FD 는 클라이언트가 보낸 FIN 에, 접속만 걸어 둔 클라이언트 2 의 연결 FD 는 종료 뒤 conns 루프의 close 에 끝이 묶여 있다.</desc>
<rect width="1000" height="388" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">GANTT · 00-01 FD LIFETIMES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">listener FD 와 연결 FD 의 수명</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세 막대의 끝이 서로 다른 사건에 묶여 있습니다.</text>
<text x="200" y="116" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">net.Listen</text>
<line x1="200" y1="128" x2="200" y2="316" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="360" y="116" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">Accept</text>
<line x1="360" y1="128" x2="360" y2="316" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="520" y="116" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">Accept</text>
<line x1="520" y1="128" x2="520" y2="316" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="680" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">클라 1 FIN</text>
<line x1="680" y1="128" x2="680" y2="316" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="840" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">종료 신호</text>
<line x1="840" y1="128" x2="840" y2="316" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<line x1="200" y1="128" x2="960" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="164" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">FD 6 listener</text>
<text x="24" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">remote 없음</text>
<rect x="200" y="156" width="640" height="24" rx="4" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="212" y="173" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">LISTEN · 종료 신호에 ln.Close</text>
<text x="24" y="220" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">FD 7 연결</text>
<text x="24" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">클라이언트 1</text>
<rect x="360" y="212" width="320" height="24" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="372" y="229" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">ESTAB · FIN 받고 defer close</text>
<text x="24" y="276" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">FD 8 연결</text>
<text x="24" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">클라이언트 2 · 접속만</text>
<rect x="520" y="268" width="320" height="24" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="532" y="285" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">ESTAB · conns 루프가 close</text>
<line x1="840" y1="280" x2="960" y2="280" stroke="#E3B341" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="960" y="308" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">루프가 없으면 계속 열림</text>
<line x1="12" y1="344" x2="952" y2="344" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="366" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="356" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">listener</text>
<rect x="248" y="356" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="270" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스스로 닫힌 연결</text>
<rect x="409" y="356" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="431" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버가 닫은 연결</text>
<rect x="570" y="356" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="592" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">닫지 않은 경우</text>
</svg>
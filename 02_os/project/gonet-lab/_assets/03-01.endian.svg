<title id="dt">2바이트 숫자를 어느 자리부터 보내나</title><desc id="dd">보내는 쪽과 받는 쪽 CPU 가 다를 수 있으니 선로에서는 순서를 하나로 정해야 한다. DNS 는 큰 자리부터, 곧 빅엔디언이다. 메모리 순서 그대로 보낸 AAAA(28)는 7168 로 읽혀 1.1.1.1 이 에러 없이 답 0개로 돌려줬다. binary.BigEndian 으로 쓰면 00 1c 로 바르게 간다.</desc>
<rect width="960" height="416" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 03-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">2바이트 숫자를 어느 자리부터 보내나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 줄은 2026-09-29 1.1.1.1 에 일부러 뒤집어 보낸 실측입니다.</text>
<text x="231.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">보낼 값</text>
<text x="231.5" y="132" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">AAAA = 28</text>
<text x="436.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">선로에 쓴 순서</text>
<text x="641.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서버가 읽은 값</text>
<text x="641.5" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">큰 자리부터 읽음</text>
<text x="846.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">결과</text>

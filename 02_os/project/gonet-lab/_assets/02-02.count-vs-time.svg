<title id="dt">같은 뒤바뀜, 두 가지 판정</title><desc id="dd">세그먼트 N 이 10ms 늦고 뒤에 보낸 N+1, N+2, N+3 이 먼저 도착한다. 개수 기준은 뒤 세그먼트 셋이 도착한 3ms 에 N 을 잃었다고 판정해 불필요하게 재전송한다. 시간 기준인 RACK 은 N 을 보낸 뒤 RTT 와 재정렬 창이 지나야 판정하므로, 창이 좁으면 역시 틀리고 DSACK 으로 창이 넓어지면 N 이 도착할 때까지 기다린다.</desc>
<rect width="960" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 02-02 COUNT VS TIME</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 뒤바뀜, 두 가지 판정</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">일반적인 예입니다. 가로축은 N 을 보낸 뒤 흐른 시간입니다.</text>
<text x="24" y="153" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">도착 순서</text>
<line x1="230" y1="148.0" x2="854" y2="148.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="24" y="229" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">개수 기준 (문턱 3)</text>
<line x1="230" y1="224.0" x2="854" y2="224.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="24" y="305" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">RACK · 창 좁음</text>
<line x1="230" y1="300.0" x2="854" y2="300.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="24" y="381" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">RACK · DSACK 뒤 창 넓음</text>
<line x1="230" y1="376.0" x2="854" y2="376.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<rect x="260" y="132" width="44" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="282" y="153" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">N+1</text>
<rect x="312" y="132" width="44" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="334" y="153" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">N+2</text>
<rect x="364" y="132" width="44" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="386" y="153" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">N+3</text>
<rect x="728" y="132" width="44" height="32" rx="5" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="750" y="153" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">N</text>
<line x1="386" y1="164" x2="386" y2="208" stroke="#F0616D" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="328" y="208" width="116" height="32" rx="5" fill="#F0616D10" stroke="#F0616D" stroke-width="1.1"/>
<text x="386" y="229" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">N 재전송</text>
<text x="456" y="229" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">불필요</text>
<rect x="230" y="292" width="260" height="16" rx="4" fill="#F5F5F310" stroke="#F5F5F3" stroke-width="0.8"/>
<text x="360.0" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">RTT + 창</text>
<rect x="498" y="284" width="100" height="32" rx="5" fill="#F0616D10" stroke="#F0616D" stroke-width="1.1"/>
<text x="548" y="305" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">N 재전송</text>
<text x="610" y="305" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">불필요</text>
<rect x="230" y="368" width="572" height="16" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.4"/>
<text x="516.0" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">RTT + 넓어진 창</text>
<line x1="750" y1="164" x2="750" y2="360" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="742" y="406" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">N 도착 · 재전송 없음</text>
<line x1="230" y1="420" x2="854" y2="420" stroke="#5E6B7E" stroke-width="1.0"/>
<line x1="230" y1="416" x2="230" y2="424" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="230" y="438" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">0ms</text>
<line x1="334" y1="416" x2="334" y2="424" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="334" y="438" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2ms</text>
<line x1="438" y1="416" x2="438" y2="424" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="438" y="438" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">4ms</text>
<line x1="542" y1="416" x2="542" y2="424" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="542" y="438" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">6ms</text>
<line x1="646" y1="416" x2="646" y2="424" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="646" y="438" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">8ms</text>
<line x1="750" y1="416" x2="750" y2="424" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="750" y="438" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10ms</text>
<line x1="854" y1="416" x2="854" y2="424" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="854" y="438" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">12ms</text>
</svg>
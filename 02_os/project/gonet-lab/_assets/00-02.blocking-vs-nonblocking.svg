<title id="dt">같은 accept, 누가 기다리나</title><desc id="dd">위 칸은 blocking 소켓의 accept 로, 호출한 스레드가 연결이 올 때까지 커널 안에서 잠든다. 아래 칸은 SOCK_NONBLOCK 소켓의 accept4 로, 커널은 곧바로 EAGAIN 을 돌려주고 Go 런타임이 goroutine 을 재운 채 epoll 에 등록했다가, 연결 도착 알림을 받아 깨운 뒤 accept4 를 다시 불러 FD 5 를 받는다.</desc>
<rect width="960" height="724" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 00-02 BLOCKING VS NONBLOCKING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 accept, 누가 기다리나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 칸은 스레드가 커널에서 잠들고, 아래 칸은 런타임이 goroutine 만 재웁니다.</text>
<rect x="24.0" y="96" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

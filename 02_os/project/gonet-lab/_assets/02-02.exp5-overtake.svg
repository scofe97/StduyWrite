<title id="dt">실험 5: 곧바로 나간 7 의 앞지르기</title><desc id="dd">1ms 간격으로 1 부터 7 을 보냈다. netem 은 75% 를 10ms 늦추고 25% 를 곧바로 보내므로, 이 예에서 7 만 곧바로 나가 7ms 에 도착하고 1~6 은 11~16ms 에 도착한다. 7 이 SACK 되면 RACK 의 첫 조건이 채워지고 창이 10ms 보다 훨씬 좁아 짧은 대기 뒤 늦었을 뿐인 1~6 을 잃었다고 판정해 불필요하게 재전송한다.</desc>

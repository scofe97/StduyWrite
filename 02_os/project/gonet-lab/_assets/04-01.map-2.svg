<title id="dt">패킷이 도착하면 커널이 먼저 소켓을 찾는다</title><desc id="dd">커널은 들어온 패킷마다 받을 소켓을 찾고, 찾은 결과에 따라 앱이 부르지 않아도 답을 보낸다. 연결 중인 TCP 소켓이 있으면 마지막 ACK 를 자동으로 보내고, TCP 소켓이 없으면 RST 를, UDP 소켓이 없으면 ICMP port unreachable 을 돌려보낸다. raw 소켓은 사본을 받을 뿐 TCP 소켓으로 치지 않는다.</desc>
<rect width="960" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 04-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">패킷이 도착하면 커널이 먼저 소켓을 찾는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 두 줄은 스캐너 쪽 커널, 아래 두 줄은 대상 쪽 커널입니다. 네 줄 모두 앱 코드는 아무것도 보내지 않았습니다.</text>
<text x="231.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">도착한 패킷</text>
<text x="436.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">커널이 찾은 소켓</text>
<text x="641.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">커널이 보내는 것</text>
<text x="641.5" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앱 몰래</text>
<text x="846.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">앱이 보는 것</text>
<text x="24" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">CONNECT 중</text>
<text x="24" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스캐너 쪽 커널</text>

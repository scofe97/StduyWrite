<title id="dt">5 가 4 보다 먼저 왔을 때</title><desc id="dd">데이터그램이 1 2 3 5 4 6 순서로 도착했다. 재정렬 버퍼 전략은 5 를 잠시 보관했다가 4 를 처리한 뒤 꺼내 1 부터 6 까지 순서대로 처리한다. 늦으면 버리기 전략은 5 를 먼저 처리하고 뒤늦게 온 4 는 버린다.</desc>

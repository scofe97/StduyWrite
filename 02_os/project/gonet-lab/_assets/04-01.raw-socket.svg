<title id="dt">헤더를 누가 채우나</title><desc id="dd">일반 TCP 소켓에서 앱은 본문만 넘기고 주소·포트·순서 번호·플래그는 커널이 상태에 맞춰 채운다. raw 소켓에서는 앱이 TCP 헤더 20바이트를 직접 써서 넘기고 커널은 IP 헤더만 붙인다. 커널의 TCP 상태 관리를 건너뛰므로 CAP_NET_RAW 권한이 있어야 열 수 있다.</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 04-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">헤더를 누가 채우나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">raw 소켓은 같은 프로토콜 번호의 패킷 사본도 받습니다. 그래서 SYN-ACK 를 스캐너가 읽을 수 있습니다.</text>
<text x="231.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">앱이 넘기는 것</text>

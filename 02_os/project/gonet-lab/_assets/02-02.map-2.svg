<title id="dt">중복 ACK 를 세어 판정하기</title><desc id="dd">4 가 빈 채로 5, 6, 7 이 차례로 도착할 때마다 받는 쪽은 같은 ACK 4 를 되풀이하고, 보내는 쪽은 그 중복을 하나씩 센다. 셋째 중복에서 문턱 3 에 닿아 4 를 곧바로 다시 보낸다. 4 가 늦었을 뿐이면 이 재전송은 불필요한 것이 된다.</desc>

<title id="dt">커널 수신 버퍼와 앱의 buf</title><desc id="dd">도착한 바이트는 먼저 소켓마다 있는 커널 수신 버퍼에 쌓이고, Read 가 그중 최대 32KB 를 앱의 buf 로 옮긴다. 받는 쪽은 ACK 마다 수신 버퍼의 빈 공간을 윈도로 알려, 빈 공간이 0 이 되면 보내는 쪽이 멈춘다.</desc>
<rect width="960" height="340" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 02-01 TWO BUFFERS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널 수신 버퍼와 앱의 buf</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">넘쳐도 버리지 않습니다. 앱 쪽은 다음 Read 로, 보내는 쪽은 윈도 0 으로 기다립니다.</text>
<rect x="24" y="124" width="150" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="99.0" y="153.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">보내는 쪽</text>
<text x="99.0" y="172.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">클라이언트 커널</text>
<path d="M 180 156 L 254 156" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="217.0" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">세그먼트</text>
<rect x="260" y="124" width="240" height="64" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.6"/>
<text x="380.0" y="153.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">수신 버퍼</text>
<text x="380.0" y="172.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">커널 · 소켓마다 · Recv-Q</text>
<path d="M 506 156 L 596 156" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="551.0" y="148" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">Read</text>
<rect x="602" y="124" width="180" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="692.0" y="153.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">buf</text>
<text x="692.0" y="172.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">앱 메모리 · 32KB</text>
<text x="692" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">32KB 넘는 몫은 커널에 남음</text>
<path d="M 380 188 L 380 264 L 99 264 L 99 194" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="240" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">ACK · 윈도 = 수신 버퍼 빈 공간</text>
<text x="240" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">윈도 0 → 보내는 쪽 멈춤</text>
</svg>
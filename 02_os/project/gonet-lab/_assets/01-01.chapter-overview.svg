<title id="dt">조용한 연결이 서버를 멈추기까지</title><desc id="dd">조용한 연결의 핸들러가 Read 에서 기다리면 FD 가 연결마다 쌓이고, 한도에 닿으면 accept4 가 EMFILE 로 실패한다. Accept 루프는 에러 분기의 wg.Wait 에 멈춰 로그도 남기지 않고, 꺼낼 goroutine 이 없어 accept 대기열이 차며, 그 뒤 새 손님의 SYN 은 버려져 시간 초과로 끝난다. 끊을 수 있는 고리는 맨 앞의 Read 다.</desc>
<rect width="960" height="320" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 01-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">조용한 연결이 서버를 멈추기까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽 끝이 원인, 오른쪽 끝이 밖에서 보이는 증상입니다.</text>
<rect x="24" y="128" width="132" height="76" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.6"/>
<text x="90.0" y="163.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">Read 에서 기다림</text>
<text x="90.0" y="182.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">조용한 연결</text>
<path d="M 159 166.0 L 175 166.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="41.0" y="224" width="98.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="90.0" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">§4 끊는 곳</text>
<rect x="178" y="128" width="132" height="76" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>

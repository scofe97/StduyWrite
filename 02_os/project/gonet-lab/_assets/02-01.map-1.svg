<title id="dt">TCP: 두 번 쓴 것이 바이트 한 줄이 되기까지</title><desc id="dd">앱이 hello 와 world 를 두 번 쓰면 송신 버퍼에서 바이트 한 줄로 이어 붙어 경계가 사라진다. 커널은 이 줄을 아무 데서나 잘라 세그먼트로 보내고, 받는 쪽은 번호대로 한 줄로 되맞춘 뒤 Read 가 도착한 만큼 끊어 간다. 줄바꿈 같은 약속을 넣어야 앱이 다시 메시지로 자를 수 있다.</desc>

<title id="dt">같은 포트를 세 방식으로 묻기</title><desc id="dd">CONNECT 는 net.Dial 로 handshake 를 끝까지 맺고 결과를 errno 로 받는다. SYN 스캔은 SYN 하나만 보내고 돌아온 플래그를 직접 읽는다. UDP 스캔은 데이터그램을 보내고 응답 데이터그램이나 ICMP port unreachable 을 기다린다. 막힌 포트는 세 방식 모두 아무것도 돌아오지 않는다.</desc>
<rect width="960" height="544" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 04-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 포트를 세 방식으로 묻기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">열 넷은 순서가 아니라 경우입니다. 같은 질문을 열린·닫힌·막힌 포트에 던졌을 때 돌아오는 것과 판정입니다.</text>
<text x="231.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">보내는 것</text>

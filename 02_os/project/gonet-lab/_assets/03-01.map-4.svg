<title id="dt">512바이트를 넘으면 TC, TCP 로 다시</title><desc id="dd">TXT 질의 셋은 UDP 응답이 질문만 복사한 채 TC=1, ANCOUNT 0 으로 왔다. 같은 질의를 TCP 로 다시 보낼 때는 앞에 길이 2바이트를 붙이고, 응답도 길이 2바이트 뒤에 전체 답이 온다. 61바이트로 끝나는 example.com A 는 TCP 로 갈 필요가 없다.</desc>

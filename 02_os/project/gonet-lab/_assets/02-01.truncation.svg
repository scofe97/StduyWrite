<title id="dt">버퍼 3 바이트에 5 바이트 데이터그램</title><desc id="dd">수신 대기열에 hello 와 world 데이터그램이 덩어리째 있다. 3 바이트 버퍼로 ReadFrom 을 부르면 hello 의 앞 3 바이트만 받고 남은 lo 는 버려지며, 다음 ReadFrom 은 lo 가 아니라 world 를 꺼낸다. 어느 쪽도 에러는 없다. 실험 2 의 결과다.</desc>
<rect width="960" height="400" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 02-01 TRUNCATION</text>

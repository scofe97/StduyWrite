<title id="dt">가짜 응답이 맞혀야 하는 값</title><desc id="dd">경로 위에 있는 공격자는 질의를 직접 보고 ID 와 포트를 베끼므로 무작위 값으로 막을 수 없다. 경로 밖 공격자는 질의를 못 보므로 값을 찍어야 한다. ID 16비트만이면 65,536 가지, 출발지 포트까지 무작위로 고르면 약 18억 가지로 늘어 위조가 크게 어려워진다.</desc>
<rect width="960" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 03-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">가짜 응답이 맞혀야 하는 값</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">포트 수는 Linux 기본 임시 포트 범위 32768 – 60999 의 28,232 개로 셌습니다.</text>
<text x="231.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">질의를 보나</text>

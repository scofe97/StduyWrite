<title id="dt">io.Copy 가 끝나는 조건은 src 가 정합니다</title><desc id="dd">io.Copy(dst, src) 는 src.Read 결과에 따라 갈라진다. 데이터가 오면 dst 에 쓰고 다시 Read 로 돌아가고, EOF 면 nil, 에러면 그 에러를 돌려주며 끝난다. 아무것도 오지 않으면 Read 에서 계속 기다리며 끝나지 않는다.</desc>
<rect width="960" height="452" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 00-03 IO.COPY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">io.Copy 가 끝나는 조건은 src 가 정합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">데이터가 오는 한 위쪽 고리를 돌고, 끝나는 길은 EOF 와 에러 둘뿐입니다.</text>
<rect x="24" y="150" width="176" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="112.0" y="181.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">io.Copy(dst, src)</text>
<rect x="240" y="150" width="150" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="315.0" y="181.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">src.Read</text>
<rect x="430" y="150" width="170" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="515.0" y="181.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">무엇이 왔나</text>
<rect x="646" y="150" width="150" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="721.0" y="181.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">dst.Write</text>

<rect x="648" y="304" width="240" height="60" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.6"/>
<text x="768.0" y="331.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">아무것도 안 옴</text>
<text x="768.0" y="350.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Read 에서 계속 대기</text>
<line x1="12" y1="392" x2="912" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

<title id="dt">RACK 이 4 를 판정하고 배우기까지</title><desc id="dd">7 이 SACK 되면 나중에 보낸 것이 도착했다는 첫 조건이 채워지고, 4 를 보낸 뒤 RTT 와 재정렬 창이 지나면 둘째 조건도 채워져 4 를 잃었다고 보고 재전송한다. 그 뒤 원래의 4 가 도착하면 받는 쪽이 같은 4 를 두 번 받았다고 DSACK 으로 알리고, 보내는 쪽은 창을 넓힌다.</desc>

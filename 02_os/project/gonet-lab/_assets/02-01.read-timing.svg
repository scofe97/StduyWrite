<title id="dt">Read 를 부른 순간이 정하는 r</title><desc id="dd">같은 hello 와 world 두 번의 쓰기라도 서버가 Read 를 부른 순간 커널에 이어서 도착해 있던 바이트 수가 곧 r 이다. h 한 바이트만 왔으면 1, hello 까지면 5, 뒤의 wo 까지면 7, 전부면 10 이다.</desc>

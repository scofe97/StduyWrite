<title id="dt">첫 바이트의 위 두 비트로 가르기</title><desc id="dd">이름 자리의 바이트를 읽을 때 위 두 비트가 00 이면 라벨 길이, 11 이면 압축 포인터다. 포인터는 두 바이트를 차지하고 나머지 14비트가 메시지 첫 바이트부터 센 오프셋이다. 응답의 c0 0c 는 오프셋 12, 곧 질문 칸의 example.com 을 가리킨다.</desc>

<title id="dt">너무 빨리 물으면 넘치는 자리</title><desc id="dd">패킷은 가는 길과 오는 길의 대기열에서 줄을 서고 대기열마다 한도가 있다. 스캐너가 빠지는 속도보다 빨리 넣으면 넘친 패킷이 버려지고, 대상 커널은 같은 출발지에 ICMP 오류를 6개 몰아 보낸 뒤 초당 1개만 보낸다. 어느 쪽이든 스캐너에게는 무응답으로 보여 오판이 늘어난다.</desc>
<rect width="960" height="688" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">너무 빨리 물으면 넘치는 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">값은 OrbStack ubuntu(커널 7.0.14) 기본값입니다. ICMP 대상별 제한은 loopback 에는 걸리지 않습니다.</text>
<text x="231.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">줄 서는 곳</text>

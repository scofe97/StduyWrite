<title id="dt">포트 1,000개를 묻는 데 걸리는 시간과 오판</title><desc id="dd">모든 포트가 무응답이라는 가장 느린 경우를 timeout 1초로 셈했다. 손실은 시도마다·방향마다 독립이라고 가정했다. 시도를 3번으로 늘리면 오판은 줄지만 시간이 세 배가 되고, worker 를 늘리면 기다림이 겹쳐 시간이 준다. 손실 20% 경로에서 열린 포트를 놓칠 확률은 시도 1번이면 36%, 3번이면 약 4.7% 다.</desc>
<rect width="960" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">포트 1,000개를 묻는 데 걸리는 시간과 오판</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">시간은 무응답 포트 1,000개 기준 계산값이고, 오판율은 가는 길·오는 길 각각 20% 손실을 가정한 계산값입니다.</text>
<text x="231.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">설정</text>

<title id="dt">읽는 쪽이 경계를 아는 네 가지 규칙</title><desc id="dd">DNS 메시지에는 구분값이 없다. 고정 길이 필드는 규격이 크기를 정하고, 라벨은 앞의 길이 1바이트로, 이름은 길이 0 으로, 질문과 답 칸은 헤더의 개수로 끝을 알린다. 읽는 쪽은 이 네 규칙만으로 29바이트를 처음부터 끝까지 한 번에 훑는다.</desc>

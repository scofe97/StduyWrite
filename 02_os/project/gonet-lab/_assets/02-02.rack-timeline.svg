<line x1="710" y1="364" x2="710" y2="386" stroke="#3FB98C" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="704" y="400" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">조건 1: 3 도착</text>
<line x1="773.0" y1="336" x2="773.0" y2="386" stroke="#F08A59" stroke-width="1.6"/>

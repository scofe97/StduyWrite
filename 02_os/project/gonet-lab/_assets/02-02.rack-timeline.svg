<title id="dt">2 가 사라졌을 때 문턱과 RACK 의 시각표</title><desc id="dd">1 부터 5 를 1ms 간격으로 보냈고 2 가 사라졌다. RTT 는 10ms, 재정렬 창은 2.5ms 로 둔다. 12ms 에 3 의 SACK 이 오면 RACK 은 2 보다 나중에 보낸 것이 도착했음을 알고 2 의 마감을 보낸 시각 1ms 더하기 RTT 10ms 더하기 창 2.5ms 인 13.5ms 로 잡아 그때 재전송한다. 문턱 방식은 3, 4, 5 의 도착으로 중복 ACK 를 세어 셋째인 14ms 에 재전송한다. 뒤에 3 만 오면 문턱은 멈추고 RTO 를 기다리지만 RACK 은 그대로 13.5ms 에 재전송한다.</desc>
<rect width="960" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 02-02 RACK TIMELINE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">2 가 사라졌을 때 문턱과 RACK 의 시각표</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로축은 보내는 쪽 시각입니다. RTT 10ms, 재정렬 창 2.5ms 로 가정했습니다.</text>
<text x="24" y="139" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">보냄</text>

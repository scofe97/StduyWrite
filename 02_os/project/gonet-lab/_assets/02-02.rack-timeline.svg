<text x="684" y="449" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">문턱: 중복 1 에서 멈춤 → RTO 대기</text>

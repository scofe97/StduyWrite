<text x="24" y="359" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">RACK</text>
<line x1="206" y1="354" x2="878" y2="354" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="24" y="449" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">3 만 왔다면</text>

<text x="710" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">중복 ACK 개수</text>
<rect x="248" y="350" width="525.0" height="10" rx="3" fill="#F5F5F310" stroke="#F5F5F3" stroke-width="0.8"/>

<title id="dt">서버가 안 꺼지는 이유를 푸는 다섯 고리</title><desc id="dd">§1 main goroutine 이 멈추면 프로그램이 끝나지 않고, §2 io.Copy 는 src 가 끝나야 끝나며, §3 defer 는 return 해야 실행되고, §4 WaitGroup 은 Done 이 와야 끝난다. 이 넷이 기다림의 사슬을 만들고 §5 context 가 바깥에서 자원을 닫아 끊는다.</desc>
<rect width="960" height="300" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 00-03 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서버가 안 꺼지는 이유를 푸는 다섯 고리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽 넷이 기다림이 생기는 고리, 오른쪽 끝이 그 사슬을 끊는 도구입니다.</text>
<rect x="24" y="132" width="164" height="76" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>
<text x="106.0" y="167.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#E3B341">§1 main</text>
<text x="106.0" y="186.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">멈추면 안 끝남</text>
<path d="M 192 170.0 L 207 170.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="211" y="132" width="164" height="76" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>
<text x="293.0" y="167.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#E3B341">§2 io.Copy</text>
<text x="293.0" y="186.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">src 가 끝나야 끝남</text>
<path d="M 379 170.0 L 394 170.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="398" y="132" width="164" height="76" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>
<text x="480.0" y="167.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#E3B341">§3 defer</text>
<text x="480.0" y="186.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">return 해야 실행</text>
<path d="M 566 170.0 L 581 170.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="585" y="132" width="164" height="76" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>
<text x="667.0" y="167.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#E3B341">§4 WaitGroup</text>
<text x="667.0" y="186.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Done 이 와야 끝남</text>
<path d="M 753 170.0 L 768 170.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="772" y="132" width="164" height="76" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.6"/>
<text x="854.0" y="167.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">§5 context</text>
<text x="854.0" y="186.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">바깥에서 Close</text>
<line x1="12" y1="248" x2="912" y2="248" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="260" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기다림이 생기는 고리</text>
<rect x="287" y="260" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="309" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사슬을 끊는 도구</text>
</svg>
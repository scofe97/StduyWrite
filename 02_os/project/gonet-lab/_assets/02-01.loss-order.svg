<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">TCP 는 늦게라도 전부, UDP 는 바로 오지만 빠진 채로 받습니다.</text>

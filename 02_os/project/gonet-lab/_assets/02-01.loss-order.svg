<title id="dt">4 가 사라졌을 때 앱이 받는 것</title><desc id="dd">보낸 쪽이 1 부터 6 까지 보냈고 4 가 네트워크에서 사라졌다. TCP 는 4 가 재전송될 때까지 이미 도착한 5 와 6 을 커널에 붙잡아 두어 앱은 1 부터 6 까지 순서대로 받지만 그 사이 기다린다. UDP 는 1 2 3 5 6 을 도착한 대로 바로 넘기고 4 는 끝내 오지 않으며, 빠진 것을 알아채는 일은 앱의 몫이다.</desc>
<rect width="960" height="436" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 02-01 LOSS AND ORDER</text>

<title id="dt">EMFILE 뒤 멈춘 gonet 서버</title><desc id="dd">핸들러 goroutine 들은 조용한 연결의 Read 에서 기다린다. FD 가 다 차 accept4 가 EMFILE 을 돌려주면 Accept 루프는 에러 분기의 wg.Wait 에서 멈춘다. listener 가 열려 있어 커널은 새 손님의 handshake 를 끝내 대기열에 세우지만 꺼내는 goroutine 이 없고, 대기열이 차면 그다음 SYN 을 버려 새 손님은 시간 초과로 끝난다.</desc>

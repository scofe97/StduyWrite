<title id="dt">기다림을 겹치는 worker</title><desc id="dd">무응답 포트 하나에 시도 3번 × timeout 1초, 곧 3초가 든다. 순서대로 물으면 9초 동안 포트 셋을 끝내고, worker 셋이 동시에 물으면 같은 9초에 포트 아홉을 끝낸다. 기다리는 동안 CPU 는 놀고 있으므로 기다림을 겹쳐도 각 포트의 판정은 그대로다.</desc>
<rect width="960" height="456" fill="#0D1117"/>

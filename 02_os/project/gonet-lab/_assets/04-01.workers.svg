<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칸 하나가 3초, 곧 timeout 1초 × 시도 3번입니다. 포트 번호는 순서를 보이려고 붙였습니다.</text>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">표면 변경은 작은 PR로 신속히 개선하고 코어 변경은 설계 정당화와 e2e 재현을 선행합니다</text>

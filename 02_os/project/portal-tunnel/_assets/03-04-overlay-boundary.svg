<title id="dt">Portal과 IVNP 오버레이 소유권 경계</title><desc id="dd">엔드포인트 인가와 임대 수명은 Portal이 소유하고, 게이트웨이에서 인그레스로 이어지는 네트워크 다중 홉 경로는 IVNP가 독립적으로 소유합니다.</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PORTAL-TUNNEL · OVERLAY NETWORKING ARCHITECTURE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Portal과 IVNP 오버레이 소유권 경계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Portal 도메인 (인가·임대·직접 경로) vs IVNP 도메인 (불투명 라우터·내부 홉 순서)의 책임 분리</text>
<rect x="20" y="100" width="590" height="360" rx="8" fill="rgba(245,245,245,0.02)" stroke="#6A95D8" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="34" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">Portal 소유 영역 (엔드포인트 인가 · 임대 · 역방향 수명주기)</text>
<rect x="640" y="100" width="300" height="360" rx="8" fill="rgba(245,245,245,0.02)" stroke="#E3B341" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="654" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">IVNP 소유 영역 (내부 토폴로지 · 암호화 터널 · 홉 순서)</text>

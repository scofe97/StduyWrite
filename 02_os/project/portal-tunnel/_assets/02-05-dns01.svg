<title id="dt">ACME DNS-01 발급과 갱신 — 주문·TXT 게시·검증·원자적 저장</title><desc id="dd">릴레이 매니저가 lego 클라이언트를 통해 와일드카드 주문을 넣고, DNS 제공자에 TXT 챌린지를 게시한 뒤 CA 검증을 거쳐 인증서를 발급받아 저장하며 백그라운드 루프가 갱신을 관리합니다.</desc>

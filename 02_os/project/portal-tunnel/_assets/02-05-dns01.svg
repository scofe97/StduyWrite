<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">ACME DNS-01 발급과 갱신 — 주문·TXT 게시·검증·원자적 저장</text>

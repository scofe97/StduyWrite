<title id="dt">임대 상태 머신과 접근 제어 수명주기</title><desc id="dd">SIWE 챌린지 발급부터 fail-closed 격리, 라우팅 승인, 갱신, 만료 및 포트 유예 정리까지의 전이</desc>
<rect width="960" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PORTAL-TUNNEL · LEASE LIFECYCLE &amp; IDENTITY STATE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">임대 상태 머신과 접근 제어 수명주기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">등록 직후 격리 상태를 거쳐 오케스트레이터 접근 판정 후 라우팅이 활성화됩니다</text>
<circle cx="28" cy="178" r="6" fill="#F5F5F3"/>
<text x="28" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">Start</text>
<rect x="104" y="144" width="200" height="68" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="118" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#6A95D8">CHALLENGE PENDING</text>
<text x="118" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">1. 챌린지 대기</text>
<text x="118" y="201" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TTL 2분 · IP당 32개 한도</text>
<rect x="384" y="144" width="208" height="68" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="398" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#E3B341">REGISTERED (SUSPENDED)</text>
<text x="398" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">2. 등록 격리 (fail-closed)</text>
<text x="398" y="201" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">isRoutable=false · 캐시 분리</text>
<rect x="672" y="144" width="208" height="68" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.4"/>
<text x="686" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#3FB98C">ROUTABLE (ACTIVE)</text>
<text x="686" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">3. 라우팅 활성</text>
<text x="686" y="201" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">isRoutable=true · 트래픽 중계</text>
<rect x="672" y="292" width="208" height="68" rx="8" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="686" y="314" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#F0616D">REVOKED / EXPIRED</text>
<text x="686" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">4. 종료 및 차단</text>
<text x="686" y="349" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">진행 bridge 즉시 취소</text>
<rect x="384" y="292" width="208" height="68" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="398" y="314" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">CLEANUP &amp; GRACE</text>
<text x="398" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">5. 정리 및 유예</text>
<text x="398" y="349" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">DNS 삭제 · 포트 유예 5분</text>
<circle cx="244" cy="326" r="8" fill="none" stroke="#8B98A9" stroke-width="1.2"/>
<circle cx="244" cy="326" r="5" fill="#8B98A9"/>
<text x="244" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">End</text>
<path d="M 36 178 L 104 178" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="70" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">발급 요청</text>
<path d="M 304 178 L 384 178" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="344" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">서명 등록</text>
<path d="M 592 178 L 672 178" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)"/>
<text x="632" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">접근 승인</text>
<path d="M 720 144 L 720 116 L 832 116 L 832 144" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="776" y="110" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">POST /sdk/renew (스트림 유지)</text>
<path d="M 776 212 L 776 292" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="786" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">만료 · unregister · 차단</text>
<path d="M 488 212 L 488 292" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="498" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">미승인 만료 · 거부</text>
<path d="M 672 326 L 592 326" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="632" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">만료 수거</text>
<path d="M 384 326 L 254 326" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="319" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">유예 5분 경과</text>
<line x1="12" y1="436" x2="912" y2="436" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="458" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="448" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">등록·대기</text>
<rect x="209" y="448" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="231" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">격리 (fail-closed)</text>
<rect x="461" y="448" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="483" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">라우팅 활성</text>
<rect x="583" y="448" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="605" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">종료·차단</text>
<rect x="692" y="448" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="714" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">갱신 루프</text>
</svg>
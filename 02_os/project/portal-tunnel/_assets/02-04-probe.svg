<title id="dt">중간자 자가 프로브 — 정직한 패스스루와 악의적 종단 대조</title><desc id="dd">클라이언트와 응답 수신부가 TLS exporter 값을 비교해 릴레이의 무단 종단을 검증합니다.</desc>
<rect width="960" height="780" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PORTAL-TUNNEL · MITM SELF-PROBE SEQUENCE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">중간자 자가 프로브 — 정직한 패스스루와 악의적 종단 대조</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">정직한 중계(상단)는 세션이 하나여서 값이 같고, MITM 종단(하단)은 세션이 갈라져 값이 다릅니다</text>
<marker id="ok_left" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M8 0 L0 4 L8 8 z" fill="#3FB98C"/></marker>
<marker id="bad_left" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M8 0 L0 4 L8 8 z" fill="#F0616D"/></marker>
<rect x="45" y="96" width="190" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="140" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">tunnel (프로브 발신)</text>
<text x="140" y="132" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">probeTLSPassthrough</text>
<rect x="385" y="96" width="190" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="480" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">relay (SNI 라우터)</text>
<text x="480" y="132" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">정직 중계 / MITM 종단</text>
<rect x="725" y="96" width="190" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="820" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">tunnel (응답 수신)</text>
<text x="820" y="132" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">maybeHandleConn</text>
<line x1="140" y1="146" x2="140" y2="720" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="480" y1="146" x2="480" y2="720" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="820" y1="146" x2="820" y2="720" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<rect x="16" y="154" width="928" height="260" rx="6" fill="rgba(63,185,140,0.03)" stroke="#3FB98C" stroke-width="0.9"/>
<text x="28" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">CASE 1: 정직한 릴레이 (TLS 바이너리 패스스루)</text>
<path d="M 150 198 L 468 198" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="193.11" y="180" width="233.78" height="15" fill="#0D1117"/>
<text x="310.0" y="191" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">1. TCP 연결 + reserveProbe(nonce)</text>
<path d="M 152 240 L 808 240" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-start="url(#ok_left)" marker-end="url(#ok)"/>
<rect x="361.35" y="222" width="237.3" height="15" fill="#0D1117"/>
<text x="480.0" y="233" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">2. 단일 TLS 1.3 핸드셰이크 (패스스루)</text>
<path d="M 150 272 L 186 272 L 186 288 L 153 288" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="194" y="278" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">ExportKeyingMaterial (32B) -&gt; E1</text>
<text x="194" y="292" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">Portal-MITM-Probe-v1</text>
<path d="M 150 322 L 808 322" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="380.15999999999997" y="304" width="199.68" height="15" fill="#0D1117"/>
<text x="480.0" y="315" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">3. 16B nonce + 패딩(96~320B)</text>
<path d="M 810 354 L 774 354 L 774 370 L 807 370" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="766" y="360" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">ExportKeyingMaterial (32B) -&gt; E1</text>
<text x="766" y="374" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">Peek(16) 확인 후 계산</text>
<rect x="299.5" y="384" width="361.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="480.0" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">판정: E1 == E1 일치 -&gt; 검증 통과 (패스스루)</text>
<rect x="16" y="434" width="928" height="280" rx="6" fill="rgba(240,97,109,0.03)" stroke="#F0616D" stroke-width="0.9"/>
<text x="28" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">CASE 2: 악의적 릴레이 (중간자 TLS 종단 및 재암호화)</text>
<path d="M 150 478 L 468 478" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="193.11" y="460" width="233.78" height="15" fill="#0D1117"/>
<text x="310.0" y="471" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">1. TCP 연결 + reserveProbe(nonce)</text>
<path d="M 152 518 L 468 518" fill="none" stroke="#E3B341" stroke-width="1.4" marker-start="url(#warn)" marker-end="url(#warn)"/>
<rect x="216.76" y="500" width="186.48000000000002" height="15" fill="#0D1117"/>
<text x="310.0" y="511" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">2a. TLS 세션 A 종단 (복호화)</text>
<path d="M 492 518 L 808 518" fill="none" stroke="#E3B341" stroke-width="1.4" marker-start="url(#warn)" marker-end="url(#warn)"/>
<rect x="551.26" y="500" width="197.48000000000002" height="15" fill="#0D1117"/>
<text x="650.0" y="511" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">2b. TLS 세션 B 수립 (재암호화)</text>
<path d="M 150 554 L 186 554 L 186 570 L 153 570" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<text x="194" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">세션 A Exporter -&gt; E_A (0x8F...)</text>
<text x="194" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">비밀 키 A 도출</text>
<path d="M 150 604 L 808 604" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)" stroke-dasharray="4 3"/>
<rect x="381.81" y="586" width="196.38" height="15" fill="#0D1117"/>
<text x="480.0" y="597" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">3. 프레임 중계 (평문 노출 위험)</text>
<path d="M 810 638 L 774 638 L 774 654 L 807 654" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<text x="766" y="644" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">세션 B Exporter -&gt; E_B (0x3C...)</text>
<text x="766" y="658" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">비밀 키 B 도출</text>
<rect x="211.5" y="676" width="537.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="480.0" y="690" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">판정: E_A != E_B 불일치 -&gt; MITM 적발 (--ban-mitm 시 차단)</text>
</svg>
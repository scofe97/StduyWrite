<title id="dt">TCP 다중화와 QUIC의 패킷 유실 전파 비교</title><desc id="dd">동일한 패킷 손실이 발생했을 때 TCP 단일 스트림 다중화는 무관한 스트림까지 전체 대기시키지만 QUIC은 독립 스트림 오프셋을 통해 유실 스트림만 격리 대기시킵니다.</desc>
<rect width="960" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PORTAL-TUNNEL · HEAD-OF-LINE BLOCKING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TCP 다중화와 QUIC의 패킷 유실 전파 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">단일 TCP 연결 다중화는 패킷 유실 시 모든 스트림이 멈추고 QUIC은 손실 스트림만 격리합니다</text>

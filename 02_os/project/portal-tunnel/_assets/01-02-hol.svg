<text x="40" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">TCP 위 다중화: 단일 바이트 스트림 순서 보장 (HTTP/2 · yamux)</text>
<rect x="110" y="132" width="140" height="36" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

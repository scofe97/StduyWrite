<rect x="724" y="160" width="242" height="94" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="740" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">외부 공개 요청 도착</text>
<text x="740" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">SNI ClientHello 또는 TCP 연결</text>

<rect x="312" y="376" width="336" height="68" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="328" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">Acquire(ctx) 인출</text>
<text x="328" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">close(c.stop) 호출로 유휴 하트비트 중단</text>
<text x="328" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">죽은 소켓 감지 시 폐기 후 다음 연결 인출</text>

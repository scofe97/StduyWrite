<title id="dt">리버스 풀 데이터 흐름 — 연결 사전 개설·대기 풀 보관·클레임 인출</title><desc id="dd">터널 슬롯 루프가 아웃바운드 연결을 공급하고 릴레이 ReversePool 은 최대 8개까지 보관하며 인그레스 요청 시 즉시 인출합니다</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DATA FLOW · REVERSE CONNECTION POOLING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">리버스 풀 데이터 흐름 — 연결 사전 개설·대기 풀 보관·클레임 인출</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">터널 슬롯(2개) → 101 하이잭 → ReversePool(최대 8개) → Acquire 인출 → 클라이언트 브리지</text>
<rect x="20" y="104" width="206" height="396" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="36" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">터널 에이전트 (NAT 내부)</text>
<rect x="296" y="104" width="368" height="396" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="312" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">릴레이 ReversePool (중계 서버)</text>
<rect x="710" y="104" width="270" height="396" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="726" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">공개 인그레스 및 브리지</text>
<rect x="34" y="160" width="178" height="88" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="48" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">작업 슬롯 1 (Slot 1)</text>
<text x="48" y="212" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">runReverseSessionLoop</text>
<text x="48" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">openRaw() 호출 대기</text>
<rect x="34" y="280" width="178" height="88" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="48" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">작업 슬롯 2 (Slot 2)</text>
<text x="48" y="332" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">defaultReadyTarget = 2</text>
<text x="48" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">핸드셰이크·인계 후 보충</text>

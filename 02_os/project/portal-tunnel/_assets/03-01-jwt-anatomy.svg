<title id="dt">JWT 세 부분의 해부와 컴팩트 직렬화 (ES256K / RFC 8812)</title><desc id="dd">Header·Payload·Signature 세 계층이 Base64URL과 점(.)으로 결합되는 토큰 구조</desc>

<title id="dt">터널 생명주기 — 등록·리버스 연결·SNI 클레임·갱신·해제</title><desc id="dd">SDK가 relay API에 SIWE 서명으로 등록해 토큰과 capability를 받고, /sdk/connect로 리버스 연결을 미리 2개 열어 둡니다. 브라우저 ClientHello가 SNI 라우터에 들어오면 0x02와 바인딩으로 세션을 클레임해 종단간 TLS로 전환합니다.</desc>

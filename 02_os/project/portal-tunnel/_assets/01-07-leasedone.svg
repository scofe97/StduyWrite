<title id="dt">LeaseDone 토큰 생명주기 — 재연결 보존과 교체 격리</title><desc id="dd">단순 재연결은 LeaseDone 토큰을 유지해 세션을 잇고, 임대 교체 시 토큰을 무효화해 지연 패킷의 혼입을 원천 차단합니다.</desc>

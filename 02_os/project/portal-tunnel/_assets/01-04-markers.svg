<title id="dt">단일 리버스 연결의 시간선 — 하트비트·0x02 활성화 마커·데이터 패스스루</title><desc id="dd">유휴 중에는 15초마다 0x00 하트비트가 전송되고, 공개 요청 인입 시 0x02 마커와 16바이트 바인딩으로 즉시 활성화됩니다</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · REVERSE CONNECTION FRAMING &amp; MARKERS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">단일 리버스 연결의 시간선 — 하트비트·0x02 활성화 마커·데이터 패스스루</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">시간축: 하이잭 대기 → 15초 주기 하트비트 → 인그레스 인입 → 0x02 바인딩 활성화 → 양방향 스트림</text>

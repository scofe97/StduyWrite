<title id="dt">UDP 데이터그램 경로 — Flow ID 다중화와 QUIC 백홀</title><desc id="dd">클라이언트 패킷을 Flow ID로 사상해 QUIC DATAGRAM으로 전달하고 터널의 로컬 소켓으로 격리 중계합니다.</desc>
<rect width="960" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PORTAL-TUNNEL · UDP MULTIPLEXING DATA FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">UDP 데이터그램 경로 — Flow ID 다중화와 QUIC 백홀</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">단일 QUIC 백홀 안에서 Flow ID를 통해 클라이언트 소켓 문맥을 격리 보존합니다</text>

<title id="dt">보유 자원과 암호학적 신뢰 경계</title><desc id="dd">Relay는 인증서 개인키와 바인딩 표만 쥐고 세션 키를 갖지 못하며, Tunnel은 로컬 세션 키와 평문을 쥐지만 인증서 개인키가 없습니다.</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PORTAL-TUNNEL · KEYLESS TLS BOUNDARY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">보유 자원과 암호학적 신뢰 경계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">인증서 서명 권한과 세션 암호화 키를 분리해 중계 서버의 평문 도청을 차단합니다</text>

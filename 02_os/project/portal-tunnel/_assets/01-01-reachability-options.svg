<title id="dt">외부 인바운드 접근 기술 선택과 실패 조건 분기</title><desc id="dd">공인 IP 보유 여부와 NAT 제어권, NAT 유형(Cone 대 대칭형)에 따른 접근 경로와 최후의 보루인 리버스 터널</desc>
<rect width="960" height="800" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NETWORKING · INBOUND REACHABILITY DECISION FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">외부 인바운드 접근 기술 선택과 실패 조건 분기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">포트 포워딩·UPnP·홀 펀칭이 실패하는 조건과 역방향 터널의 도달 보장 원리</text>
<rect x="160" y="100" width="200" height="36" rx="18" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="260" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">사설망 서버 외부 노출 필요</text>
<path d="M 260 136 L 260 160" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<path d="M 260 160 L 370 190 L 260 220 L 150 190 Z" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="260" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">공인 IP 직접 할당?</text>
<text x="260" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">호스트 NIC 공인 주소</text>
<path d="M 370 190 L 560 190" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="390" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#3FB98C">Yes</text>
<rect x="560" y="166" width="300" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="710" y="185" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">직접 인바운드 수신</text>
<text x="710" y="203" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">방화벽 포트 허용만으로 직접 도달</text>
<path d="M 260 220 L 260 280" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="280" y="235" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#8B98A9">No</text>
<path d="M 260 280 L 370 310 L 260 340 L 150 310 Z" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="260" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">포트 포워딩 가능?</text>
<text x="260" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">공유기 관리 권한 보유</text>

<title id="dt">아웃바운드 SYN 표 등록과 외부 인바운드 차단 흐름</title><desc id="dd">내부에서 나간 SYN 패킷은 NAT 표에 변환 쌍을 생성하여 돌아오는 응답을 맞이하지만, 외부에서 시작된 임의 SYN 패킷은 표에 없어 버려집니다.</desc>

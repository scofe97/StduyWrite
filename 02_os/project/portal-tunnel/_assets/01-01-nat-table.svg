<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NETFILTER · NAT &amp; CONNTRACK STATE SEQUENCE</text>

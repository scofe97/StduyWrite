<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DATA FLOW · DIGITAL SIGNATURE &amp; VERIFICATION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">전자서명과 공개키 복구 검증 파이프라인 (Sign -&gt; Wire -&gt; ecrecover)</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">서버가 공개키를 미리 보관하지 않아도 서명 자체에서 발신자 신원을 수학적으로 복원합니다</text>

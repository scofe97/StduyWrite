<title id="dt">전자서명과 공개키 복구 검증 파이프라인 (Sign -&gt; Wire -&gt; ecrecover)</title><desc id="dd">송신자가 개인키로 서명(r,s,v)을 생성해 전송하면 수신자가 동일 해시에서 공개키를 복원해 주소를 대조합니다</desc>

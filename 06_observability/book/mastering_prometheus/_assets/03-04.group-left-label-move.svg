<svg viewBox="0 0 900 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>group_left 는 오른쪽 라벨을 왼쪽으로 옮깁니다</title>
  <desc>kube_pod_info 와 kube_node_info 를 on 절의 node 라벨로 이어 붙이는 과정을 보인다. 왼쪽에는 파드 시계열 셋이 있고 그중 둘이 같은 노드에 얹혀 있으며, 오른쪽에는 노드 시계열이 노드마다 하나씩 있다. 가운데 on 괄호 node 가 두 쪽을 잇는 열쇠이고, 화살표는 오른쪽에서 왼쪽으로 향해 라벨이 옮겨 가는 방향을 가리킨다. group_left 라는 이름이 그 방향을 그대로 말한다. 옮겨 오는 쪽인 오른쪽은 노드 이름마다 시계열이 정확히 하나여야 하고, 옮겨 가는 쪽인 왼쪽은 여럿이어도 되므로 다대일 매칭이 된다. 결과는 왼쪽 시계열 수 그대로이며 각 시계열에 kubelet_version 과 os_image 라벨이 덧붙는다. 아래에는 곱셈을 쓰는 이유가 적히는데 정보성 메트릭의 값이 언제나 1 이라 곱해도 왼쪽 값이 변하지 않기 때문이다.</desc>
  <defs>
    <marker id="gl-a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(240,150,190)"/>
    </marker>
    <style>
      .t    { fill: #e8e4df; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .dim  { fill: #b8b3ad; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="430" fill="#0d0d0d"/>

  <text x="24" y="34" class="t" font-size="15">group_left · 방향이 이름에</text>

  <!-- 열 제목 -->
  <text x="150" y="72" class="t" font-size="12" font-weight="700" text-anchor="middle">왼쪽 — 라벨을 <tspan fill="rgb(240,150,190)">받는</tspan> 쪽</text>
  <text x="150" y="90" class="mono dim" font-size="10" text-anchor="middle">kube_pod_info</text>
  <text x="750" y="72" class="t" font-size="12" font-weight="700" text-anchor="middle">오른쪽 — 라벨을 <tspan fill="rgb(240,150,190)">주는</tspan> 쪽</text>
  <text x="750" y="90" class="mono dim" font-size="10" text-anchor="middle">kube_node_info</text>

  <!-- 왼쪽 시계열 -->
  <rect x="40" y="106" width="220" height="34" fill="rgba(91,155,213,0.12)" stroke="rgb(91,155,213)"/>
  <text x="52" y="128" class="mono t" font-size="10">pod="exporter-a" node="n1"</text>
  <rect x="40" y="148" width="220" height="34" fill="rgba(91,155,213,0.12)" stroke="rgb(91,155,213)"/>
  <text x="52" y="170" class="mono t" font-size="10">pod="exporter-b" node="n1"</text>
  <rect x="40" y="190" width="220" height="34" fill="rgba(91,155,213,0.12)" stroke="rgb(91,155,213)"/>
  <text x="52" y="212" class="mono t" font-size="10">pod="exporter-c" node="n2"</text>

  <!-- 오른쪽 시계열 -->
  <rect x="640" y="120" width="220" height="40" fill="rgba(102,187,106,0.12)" stroke="rgb(102,187,106)"/>
  <text x="652" y="138" class="mono t" font-size="10">node="n1"</text>
  <text x="652" y="153" class="mono" font-size="9.5" fill="rgb(102,187,106)">kubelet_version, os_image</text>
  <rect x="640" y="176" width="220" height="40" fill="rgba(102,187,106,0.12)" stroke="rgb(102,187,106)"/>
  <text x="652" y="194" class="mono t" font-size="10">node="n2"</text>
  <text x="652" y="209" class="mono" font-size="9.5" fill="rgb(102,187,106)">kubelet_version, os_image</text>

  <!-- 잇는 열쇠 -->
  <rect x="360" y="132" width="180" height="30" rx="6" fill="#0d0d0d" stroke="rgb(212,168,83)"/>
  <text x="450" y="152" class="mono" font-size="11.5" fill="rgb(212,168,83)" text-anchor="middle">on (node)</text>
  <text x="450" y="178" class="dim" font-size="10" text-anchor="middle">값이 같은 것끼리 연결</text>

  <!-- 라벨 이동 화살표: 오른쪽 → 왼쪽. on(node) 상자(360~540, 132~162)를 피해 위·아래로 우회 -->
  <path d="M 632 134 C 560 112 460 108 268 120" fill="none" stroke="rgb(240,150,190)" stroke-width="2" marker-end="url(#gl-a)"/>
  <path d="M 632 148 C 580 118 420 112 268 162" fill="none" stroke="rgb(240,150,190)" stroke-width="2" marker-end="url(#gl-a)"/>
  <path d="M 632 198 C 560 214 420 214 268 208" fill="none" stroke="rgb(240,150,190)" stroke-width="2" marker-end="url(#gl-a)"/>

  <text x="450" y="234" class="t" font-size="11" text-anchor="middle" font-weight="700" fill="rgb(240,150,190)">오른쪽에서 왼쪽으로</text>

  <!-- 매칭 개수 제약 -->
  <rect x="40" y="256" width="820" height="60" rx="6" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="56" y="278" class="t" font-size="11.5" font-weight="700">제약 · 주는 쪽은 하나</text>
  <text x="56" y="298" class="t" font-size="10.5">받는 쪽 <tspan font-weight="700">여럿 OK</tspan> · 주는 쪽 <tspan fill="rgb(240,150,190)">하나</tspan></text>
  <text x="56" y="313" class="dim" font-size="10"><tspan fill="#e8e4df">다대일</tspan> · 결과 수 <tspan fill="#e8e4df">왼쪽 그대로</tspan></text>

  <!-- 곱셈을 쓰는 이유 -->
  <rect x="40" y="330" width="820" height="56" rx="6" fill="rgba(212,168,83,0.10)" stroke="rgb(212,168,83)"/>
  <text x="56" y="352" class="t" font-size="11.5" font-weight="700">왜 하필 곱셈인가</text>
  <text x="56" y="372" class="t" font-size="10.5"><tspan class="mono">_info</tspan> 값은 <tspan font-weight="700">항상 1</tspan></text>

  <text x="24" y="410" class="dim" font-size="10">반대는 <tspan class="mono" fill="#e8e4df">group_right</tspan></text>
</svg>

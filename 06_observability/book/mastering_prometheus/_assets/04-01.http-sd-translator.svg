<svg viewBox="0 0 900 520" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif">
  <title>http_sd 는 사내 인벤토리 앞에 두는 번역기다</title>
  <desc>회사 자체 인벤토리에만 서버 목록이 있으면 Prometheus 는 그 스키마를 모른다. 내장 프로바이더를 만들 수도 없다. 그래서 인벤토리 앞에 URL 하나를 두고 Prometheus 가 아는 JSON 모양으로 목록을 내준다. Prometheus 는 그 URL 을 주기적으로 물어 주소 목록을 받고, 받은 주소마다 따로 스크레이프한다. 번역기가 내놓는 것은 주소 목록뿐이고 메트릭은 여전히 각 앱이 낸다.</desc>
  <rect width="900" height="520" fill="#0d0d0d"/>

  <defs>
    <marker id="h1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
    <marker id="h2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="h3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">http_sd 번역기</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#b8b3ad">아는 모양으로 목록만 냅니다</text>

  <!-- 인벤토리 -->
  <rect x="40" y="80" width="190" height="80" rx="9" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.3"/>
  <text x="58" y="103" font-size="12.5" font-weight="700" fill="#e8e4df">사내 인벤토리 DB</text>
  <text x="58" y="123" font-size="10.5" fill="#b8b3ad">서버 목록의 진실</text>
  <rect x="58" y="132" width="154" height="20" rx="4" fill="#f2d4d4"/>
  <text x="135" y="147" text-anchor="middle" font-size="10" font-weight="700" fill="#7a1f1f">사내 스키마</text>

  <line x1="238" y1="120" x2="278" y2="120" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#h1)"/>

  <!-- 번역기 -->
  <rect x="286" y="74" width="250" height="92" rx="9" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.6"/>
  <text x="304" y="97" font-size="12.5" font-weight="700" fill="rgb(212,168,83)">내가 만드는 번역기</text>
  <rect x="304" y="106" width="214" height="22" rx="4" fill="#fdf3df"/>
  <text x="411" y="122" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">GET /targets</text>
  <text x="304" y="142" font-size="10.5" fill="#b8b3ad">DB 조회 후 JSON 변환</text>
  <text x="304" y="159" font-size="10.5" fill="rgb(212,168,83)">경로는 자유, 모양은 고정</text>

  <line x1="544" y1="120" x2="584" y2="120" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#h2)"/>

  <!-- Prometheus -->
  <rect x="592" y="80" width="268" height="80" rx="9" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="610" y="103" font-size="12.5" font-weight="700" fill="#8ab6e0">Prometheus</text>
  <rect x="610" y="112" width="232" height="20" rx="4" fill="#dceaf7"/>
  <text x="726" y="127" text-anchor="middle" font-size="10" font-weight="700" fill="#10243a">http_sd_configs</text>
  <text x="610" y="150" font-size="10.5" fill="#b8b3ad">60 초마다 다시 물어봅니다</text>

  <!-- 응답 JSON -->
  <rect x="286" y="184" width="574" height="86" rx="9" fill="#fdf3df"/>
  <text x="304" y="206" font-size="11" font-weight="700" fill="#3a2f10">돌려주는 JSON 모양</text>
  <rect x="304" y="216" width="538" height="44" rx="4" fill="#fff9ec"/>
  <text x="318" y="232" font-size="10" fill="#3a2f10">[{ "targets": [ "10.0.1.5:8080", "10.0.1.6:8080" ],</text>
  <text x="318" y="250" font-size="10" fill="#3a2f10">   "labels": { "service": "order-api", "env": "prod" } }]</text>

  <line x1="726" y1="168" x2="726" y2="180" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <line x1="726" y1="180" x2="866" y2="180" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <line x1="866" y1="180" x2="866" y2="226" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#h2)"/>

  <!-- 스크레이프 -->
  <line x1="450" y1="278" x2="450" y2="304" stroke="#66bb6a" stroke-width="1.6" marker-end="url(#h3)"/>
  <text x="466" y="296" font-size="10.5" fill="#b8b3ad">받은 주소마다 따로 긁습니다</text>

  <rect x="200" y="312" width="230" height="72" rx="9" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.4"/>
  <text x="218" y="335" font-size="11.5" font-weight="700" fill="#8fdc93">10.0.1.5:8080</text>
  <rect x="218" y="344" width="194" height="20" rx="4" fill="#e6f7e7"/>
  <text x="315" y="359" text-anchor="middle" font-size="10" font-weight="700" fill="#14521d">/actuator/prometheus</text>
  <text x="218" y="378" font-size="10" fill="#b8b3ad">앱이 자기 값을 냅니다</text>

  <rect x="470" y="312" width="230" height="72" rx="9" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.4"/>
  <text x="488" y="335" font-size="11.5" font-weight="700" fill="#8fdc93">10.0.1.6:8080</text>
  <rect x="488" y="344" width="194" height="20" rx="4" fill="#e6f7e7"/>
  <text x="585" y="359" text-anchor="middle" font-size="10" font-weight="700" fill="#14521d">/actuator/prometheus</text>
  <text x="488" y="378" font-size="10" fill="#b8b3ad">앱이 자기 값을 냅니다</text>

  <!-- 갈리는 지점 -->
  <rect x="40" y="404" width="820" height="96" rx="9" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.3"/>
  <text x="58" y="427" font-size="12" font-weight="700" fill="#8ab6e0">번역기가 하지 않는 일</text>

  <rect x="58" y="438" width="380" height="22" rx="4" fill="#f2d4d4"/>
  <text x="248" y="454" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a1f1f">메트릭을 쏘지 않습니다</text>
  <text x="58" y="478" font-size="10.5" fill="#b8b3ad">목록만 냅니다. 값은 각 앱 몫입니다</text>

  <rect x="452" y="438" width="380" height="22" rx="4" fill="#dceaf7"/>
  <text x="642" y="454" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">방향은 여전히 pull 입니다</text>
  <text x="452" y="478" font-size="10.5" fill="#b8b3ad">물어보러 옵니다</text>
</svg>

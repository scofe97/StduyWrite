<svg viewBox="0 0 900 470" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif">
  <title>Prometheus 와 Alertmanager 의 분업</title>
  <desc>Prometheus 는 알림 룰을 끊임없이 평가하다가 알림이 for 기간을 채우면 그 알림을 Alertmanager 로 넘긴다. 여기까지가 Prometheus 의 책임이며 Prometheus 는 Slack 이나 PagerDuty 로 알림을 직접 보내지 않는다. 그림 왼쪽의 Prometheus 두 대는 고가용성 배포를 나타내며, 서로의 존재를 모르므로 같은 장애를 각각 감지해 중복된 알림을 낸다. 두 대 모두 클러스터의 모든 Alertmanager 인스턴스로 알림을 보내야 하고 그 사이에 로드밸런서를 두면 안 된다. 오른쪽 Alertmanager 는 넘겨받은 알림을 라우팅, 그룹핑, 억제, 침묵 네 단계로 처리한 뒤 발송한다. 라우팅은 알림이 어느 리시버로 갈지 정하는 핵심 단계이고, 그룹핑은 비슷한 알림을 한 통으로 묶으며, 억제는 상위 장애가 살아 있을 때 하위 알림을 죽이고, 침묵은 사람이 지정한 기간 동안 알림을 막는다. 최종 목적지는 Slack, PagerDuty, 이메일 같은 리시버다.</desc>
  <rect width="900" height="470" fill="#0d0d0d"/>

  <defs>
    <marker id="sa1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
    <marker id="sa2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">Prometheus 는 알림을 보내지 않습니다</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#b8b3ad">발화까지가 Prometheus · 실어 나르는 일은 Alertmanager</text>

  <!-- Prometheus 영역 -->
  <rect x="30" y="76" width="300" height="238" rx="10" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.6"/>
  <text x="50" y="100" font-size="13" font-weight="700" fill="#8ab6e0">Prometheus</text>
  <text x="50" y="118" font-size="10.5" fill="#b8b3ad">HA 로 두 대 · 서로를 모릅니다</text>

  <rect x="50" y="132" width="260" height="72" rx="7" fill="#0d0d0d" stroke="#5c544a" stroke-width="1.2"/>
  <text x="66" y="152" font-size="11" font-weight="700" fill="#e8e4df">인스턴스 A</text>
  <rect x="66" y="160" width="110" height="22" rx="4" fill="#dceaf7"/>
  <text x="121" y="176" text-anchor="middle" font-size="10" font-weight="700" fill="#10243a">룰 평가 루프</text>
  <rect x="184" y="160" width="112" height="22" rx="4" fill="#fdf3df"/>
  <text x="240" y="176" text-anchor="middle" font-size="10" font-weight="700" fill="#3a2f10">for 기간 충족</text>
  <text x="66" y="196" font-size="10" fill="#b8b3ad">여기까지가 Prometheus 의 일입니다</text>

  <rect x="50" y="214" width="260" height="72" rx="7" fill="#0d0d0d" stroke="#5c544a" stroke-width="1.2"/>
  <text x="66" y="234" font-size="11" font-weight="700" fill="#e8e4df">인스턴스 B</text>
  <rect x="66" y="242" width="110" height="22" rx="4" fill="#dceaf7"/>
  <text x="121" y="258" text-anchor="middle" font-size="10" font-weight="700" fill="#10243a">룰 평가 루프</text>
  <rect x="184" y="242" width="112" height="22" rx="4" fill="#fdf3df"/>
  <text x="240" y="258" text-anchor="middle" font-size="10" font-weight="700" fill="#3a2f10">for 기간 충족</text>
  <text x="66" y="278" font-size="10" fill="#b8b3ad">같은 장애를 따로 감지합니다</text>

  <!-- 전달 화살표 -->
  <line x1="338" y1="176" x2="392" y2="176" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#sa2)"/>
  <line x1="338" y1="258" x2="392" y2="258" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#sa2)"/>
  <rect x="330" y="196" width="70" height="40" rx="4" fill="#fdf3df"/>
  <text x="365" y="211" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">모든</text>
  <text x="365" y="228" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">인스턴스로</text>

  <!-- Alertmanager 영역 -->
  <rect x="408" y="76" width="462" height="238" rx="10" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <text x="428" y="100" font-size="13" font-weight="700" fill="rgb(212,168,83)">Alertmanager</text>
  <text x="428" y="118" font-size="10.5" fill="#b8b3ad">가십으로 중복 발송을 막습니다</text>

  <rect x="428" y="132" width="200" height="46" rx="6" fill="rgb(212,168,83)"/>
  <text x="528" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d0d0d">① 라우팅</text>
  <text x="528" y="167" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">트리를 걸어 리시버 결정</text>

  <rect x="644" y="132" width="206" height="46" rx="6" fill="#0d0d0d" stroke="#5c544a" stroke-width="1.2"/>
  <text x="747" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e8e4df">② 그룹핑</text>
  <text x="747" y="167" text-anchor="middle" font-size="10" fill="#b8b3ad">비슷한 알림을 한 통으로</text>

  <rect x="428" y="192" width="200" height="46" rx="6" fill="#0d0d0d" stroke="#5c544a" stroke-width="1.2"/>
  <text x="528" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e8e4df">③ 억제</text>
  <text x="528" y="227" text-anchor="middle" font-size="10" fill="#b8b3ad">상위 장애가 하위를 죽임</text>

  <rect x="644" y="192" width="206" height="46" rx="6" fill="#0d0d0d" stroke="#5c544a" stroke-width="1.2"/>
  <text x="747" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e8e4df">④ 침묵</text>
  <text x="747" y="227" text-anchor="middle" font-size="10" fill="#b8b3ad">지정 기간 동안 막음</text>

  <rect x="428" y="252" width="422" height="46" rx="6" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.4"/>
  <text x="470" y="280" font-size="11.5" font-weight="700" fill="#8fd694">⑤ 발송</text>
  <rect x="530" y="262" width="102" height="26" rx="4" fill="#e6f7e7"/>
  <text x="581" y="280" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">Slack</text>
  <rect x="642" y="262" width="102" height="26" rx="4" fill="#e6f7e7"/>
  <text x="693" y="280" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">PagerDuty</text>
  <rect x="754" y="262" width="82" height="26" rx="4" fill="#e6f7e7"/>
  <text x="795" y="280" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">Email</text>

  <!-- 하단 요점 -->
  <rect x="30" y="332" width="840" height="112" rx="9" fill="#0d0d0d" stroke="#5c544a" stroke-width="1.3"/>
  <text x="50" y="356" font-size="12" font-weight="700" fill="#e8e4df">이 경계가 왜 필요한가</text>

  <rect x="50" y="368" width="256" height="60" rx="6" fill="#dceaf7"/>
  <text x="178" y="388" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">정책을 따로 바꿉니다</text>
  <text x="178" y="405" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10243a">발화 조건은 룰이</text>
  <text x="178" y="420" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10243a">발송 정책은 Alertmanager 가</text>

  <rect x="322" y="368" width="256" height="60" rx="6" fill="#fdf3df"/>
  <text x="450" y="388" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">중복을 걷어냅니다</text>
  <text x="450" y="405" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">HA 두 대가 같은 알림을 내도</text>
  <text x="450" y="420" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">사람에게는 한 통만 갑니다</text>

  <rect x="594" y="368" width="256" height="60" rx="6" fill="#f2d4d4"/>
  <text x="722" y="388" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a1f1f">로드밸런서 금지</text>
  <text x="722" y="405" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7a1f1f">받은 알림은 가십하지 않으므로</text>
  <text x="722" y="420" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7a1f1f">한 대라도 못 받으면 구멍입니다</text>
</svg>

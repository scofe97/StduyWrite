<svg viewBox="0 0 880 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>hashmod 으로 스크레이프 잡 샤딩하기</title>
  <desc>각 타깃의 __address__ 라벨을 MD5 해시한 뒤 샤드 수로 나눈 나머지를 __tmp_hash 에 담고, 자기 샤드 번호와 같은 타깃만 keep 한다. 해시가 고르게 나뉜다는 보장은 없어 저자의 환경에서는 8 대 16 으로 갈렸다.</desc>

  <defs>
    <marker id="a6" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="400" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">hashmod 샤딩</text>
  <text x="20" y="56" fill="#e8e4df" font-size="10.5">각자 <tspan font-family="'JetBrains Mono', monospace">keep</tspan> 을 계산</text>

  <!-- 타깃 -->
  <rect x="20" y="96" width="196" height="46" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="34" y="115" fill="#e8e4df" font-size="10.5" font-family="'JetBrains Mono', monospace">instance=node2</text>
  <text x="34" y="132" fill="#e8e4df" font-size="9">타깃 A</text>

  <rect x="20" y="176" width="196" height="46" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="34" y="195" fill="#e8e4df" font-size="10.5" font-family="'JetBrains Mono', monospace">instance=node23</text>
  <text x="34" y="212" fill="#e8e4df" font-size="9">타깃 B</text>

  <line x1="220" y1="119" x2="256" y2="119" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#a6)"/>
  <line x1="220" y1="199" x2="256" y2="199" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#a6)"/>

  <!-- hashmod -->
  <rect x="264" y="96" width="230" height="126" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="379" y="120" fill="#e8e4df" font-size="12" text-anchor="middle">action: hashmod</text>
  <text x="379" y="140" fill="#e8e4df" font-size="9.5" text-anchor="middle">MD5 해시 후 modulus 2</text>
  <text x="379" y="166" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">2865…2374 % 2 = 0</text>
  <text x="379" y="186" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">1398…5935 % 2 = 1</text>
  <text x="379" y="210" fill="#e8e4df" font-size="9.5" text-anchor="middle">→ <tspan font-family="'JetBrains Mono', monospace">__tmp_hash</tspan> 에 담음</text>

  <line x1="498" y1="140" x2="534" y2="128" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#a6)"/>
  <line x1="498" y1="180" x2="534" y2="212" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#a6)"/>

  <!-- 샤드 -->
  <rect x="544" y="90" width="316" height="60" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="560" y="112" fill="#e8e4df" font-size="12">샤드 0</text>
  <text x="560" y="132" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">regex: "0" · action: keep</text>
  <text x="836" y="112" fill="rgb(212,168,83)" font-size="11" text-anchor="end">타깃 8개</text>

  <rect x="544" y="186" width="316" height="60" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="560" y="208" fill="#e8e4df" font-size="12">샤드 1</text>
  <text x="560" y="228" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">regex: "1" · action: keep</text>
  <text x="836" y="208" fill="rgb(212,168,83)" font-size="11" text-anchor="end">타깃 16개</text>

  <text x="544" y="272" fill="#e8e4df" font-size="10">번호는 <tspan font-family="'JetBrains Mono', monospace">0</tspan> 부터 · 균등 보장 없음</text>

  <!-- 하단 주석 -->
  <line x1="20" y1="300" x2="860" y2="300" stroke="rgb(92,84,74)"/>
  <text x="20" y="326" fill="#e8e4df" font-size="11">데이터가 아니라 <tspan fill="rgb(212,168,83)">스크레이프 잡 샤딩</tspan></text>
  <text x="20" y="348" fill="#e8e4df" font-size="10.5">조율 없이 설정으로 미리 정해집니다</text>
  <text x="20" y="374" fill="#e8e4df" font-size="10.5">소스 라벨은 타깃마다 고유해야</text>
</svg>

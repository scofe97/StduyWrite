<svg viewBox="0 0 900 676" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif">
  <title>__meta_ 라벨은 앱이 아니라 SD 프로바이더가 만든다</title>
  <desc>라벨과 메트릭이 각각 어느 단계에서 생기는지 보여 준다. 1단계 서비스 디스커버리에서 프로바이더가 쿠버네티스 API 나 Eureka 레지스트리에 물어보고 그 답을 __address__ 와 __meta_ 라벨로 만든다. 이 단계에서 앱에는 아직 연락조차 가지 않으므로 앱은 __meta_ 의 존재를 모른다. 2단계 relabeling 은 그 __meta_ 를 읽어 keep, drop, replace 를 적용하며 여전히 앱과 무관하다. 3단계 스크레이프에서 처음으로 앱의 엔드포인트에 HTTP GET 을 보내고, 앱은 메트릭 본문만 응답한다. 그 응답에 __meta_ 는 없다. 앱이 __meta_ 에 영향을 주는 유일한 방법은 레지스트리 쪽에 값을 심는 것이다.</desc>
  <rect width="900" height="676" fill="#0d0d0d"/>

  <defs>
    <marker id="l1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
    <marker id="l2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="l3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">라벨은 앱이 만들지 않습니다</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#b8b3ad">앱은 3 단계에서 처음 등장합니다</text>

  <!-- 열 머리 -->
  <text x="250" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b8b3ad">Prometheus 쪽</text>
  <text x="720" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b8b3ad">앱 쪽</text>

  <!-- 1단계 -->
  <rect x="40" y="94" width="420" height="128" rx="9" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.6"/>
  <text x="58" y="117" font-size="12.5" font-weight="700" fill="rgb(212,168,83)">1. 서비스 디스커버리</text>
  <text x="58" y="137" font-size="10.5" fill="#b8b3ad">프로바이더가 레지스트리에 물어봅니다</text>
  <rect x="58" y="146" width="384" height="22" rx="4" fill="#fff9ec"/>
  <text x="250" y="162" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">k8s API · Eureka · EC2</text>
  <text x="58" y="186" font-size="10.5" fill="#b8b3ad">받은 답을 라벨로 만듭니다</text>
  <rect x="58" y="194" width="384" height="22" rx="4" fill="#fdf3df"/>
  <text x="250" y="210" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">__address__ · __meta_* 생성</text>

  <rect x="530" y="94" width="330" height="128" rx="9" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.3"/>
  <rect x="548" y="118" width="294" height="24" rx="4" fill="#f2d4d4"/>
  <text x="695" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#7a1f1f">아무것도 안 합니다</text>
  <text x="548" y="164" font-size="10.5" fill="#b8b3ad">앱에 연락조차 가지 않습니다</text>
  <text x="548" y="184" font-size="10.5" fill="#b8b3ad">__meta_ 가 있는 줄도 모릅니다</text>
  <text x="548" y="207" font-size="10.5" fill="#b8b3ad">레지스트리가 대신 답했습니다</text>

  <line x1="250" y1="230" x2="250" y2="256" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#l2)"/>

  <!-- 2단계 -->
  <rect x="40" y="264" width="420" height="112" rx="9" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.6"/>
  <text x="58" y="287" font-size="12.5" font-weight="700" fill="rgb(212,168,83)">2. relabeling</text>
  <text x="58" y="307" font-size="10.5" fill="#b8b3ad">1 단계가 만든 라벨만 읽습니다</text>
  <rect x="58" y="316" width="384" height="22" rx="4" fill="#fdf3df"/>
  <text x="250" y="332" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">keep · drop · replace</text>
  <text x="58" y="356" font-size="10.5" fill="#b8b3ad">__name__ 은 아직 없습니다</text>
  <text x="290" y="356" font-size="10.5" fill="#e07b7b">메트릭이 없으니까요</text>

  <rect x="530" y="264" width="330" height="112" rx="9" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.3"/>
  <rect x="548" y="288" width="294" height="24" rx="4" fill="#f2d4d4"/>
  <text x="695" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#7a1f1f">여전히 안 합니다</text>
  <text x="548" y="334" font-size="10.5" fill="#b8b3ad">여기서 버려지면</text>
  <text x="548" y="354" font-size="10.5" fill="#b8b3ad">앱은 긁히지도 않습니다</text>

  <line x1="250" y1="384" x2="250" y2="410" stroke="#66bb6a" stroke-width="1.6" marker-end="url(#l3)"/>

  <!-- 3단계 -->
  <rect x="40" y="418" width="420" height="128" rx="9" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.6"/>
  <text x="58" y="441" font-size="12.5" font-weight="700" fill="#8fdc93">3. 스크레이프</text>
  <text x="58" y="461" font-size="10.5" fill="#b8b3ad">이제야 앱에 요청을 보냅니다</text>
  <rect x="58" y="470" width="384" height="22" rx="4" fill="#e6f7e7"/>
  <text x="250" y="486" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">GET /actuator/prometheus</text>
  <text x="58" y="510" font-size="10.5" fill="#b8b3ad">__address__ 주소로 갑니다</text>
  <rect x="58" y="518" width="384" height="22" rx="4" fill="#e6f7e7"/>
  <text x="250" y="534" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">__name__ 이 여기서 생깁니다</text>

  <line x1="470" y1="482" x2="522" y2="482" stroke="#66bb6a" stroke-width="1.6" marker-end="url(#l3)"/>

  <rect x="530" y="418" width="330" height="128" rx="9" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.6"/>
  <rect x="548" y="442" width="294" height="24" rx="4" fill="#e6f7e7"/>
  <text x="695" y="459" text-anchor="middle" font-size="11" font-weight="700" fill="#14521d">여기서 처음 답합니다</text>
  <text x="548" y="488" font-size="10.5" fill="#b8b3ad">내놓는 것은 메트릭 본문뿐</text>
  <rect x="548" y="496" width="294" height="22" rx="4" fill="#f2fbf3"/>
  <text x="695" y="512" text-anchor="middle" font-size="10" font-weight="700" fill="#14521d">jvm_memory_used_bytes 4.2e8</text>
  <text x="548" y="536" font-size="10.5" fill="#e07b7b">이 응답에 __meta_ 는 없습니다</text>

  <!-- 앱이 영향을 주는 유일한 길 -->
  <rect x="40" y="562" width="820" height="98" rx="9" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="58" y="585" font-size="12" font-weight="700" fill="#8ab6e0">앱이 쓸 수 있는 유일한 길</text>
  <rect x="58" y="596" width="360" height="24" rx="4" fill="#dceaf7"/>
  <text x="238" y="613" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">레지스트리 쪽에 값을 심습니다</text>
  <line x1="428" y1="608" x2="462" y2="608" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#l1)"/>
  <rect x="472" y="596" width="360" height="24" rx="4" fill="#dceaf7"/>
  <text x="652" y="613" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">1 단계가 그것을 읽어 갑니다</text>
  <rect x="58" y="626" width="150" height="20" rx="4" fill="#f4f9fd"/>
  <text x="133" y="641" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10243a">k8s annotation</text>
  <rect x="218" y="626" width="230" height="20" rx="4" fill="#f4f9fd"/>
  <text x="333" y="641" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10243a">eureka.instance.metadata-map</text>
  <rect x="458" y="626" width="110" height="20" rx="4" fill="#f4f9fd"/>
  <text x="513" y="641" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10243a">EC2 태그</text>
</svg>

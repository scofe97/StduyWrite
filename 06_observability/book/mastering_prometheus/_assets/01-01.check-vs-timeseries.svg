<svg viewBox="0 0 720 494" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>같은 현실을 체크 기반과 시계열이 각각 무엇으로 기록하는가</title>
  <desc>디스크 사용률이 30에서 82퍼센트까지 오르는 동일한 상황을, 위쪽은 체크 기반이 OK와 WARNING이라는 상태 라벨로 기록하고 아래쪽은 시계열이 숫자와 시각의 쌍으로 기록하는 대비 도식. 체크 기반은 임계치를 넘기 전까지 모두 OK로 같아 과정이 소실되고, 시계열은 기울기가 남아 도달 시점을 예측할 수 있다.</desc>

  <defs>
    <marker id="cvtAmberArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="cvtGrayArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="494" fill="#0d0d0d"/>

  <text x="40" y="34" fill="#e8e4df" font-size="15">같은 현실, 두 가지 기록 방식</text>
  <text x="40" y="54" fill="rgb(138,133,128)" font-size="11">디스크 사용률이 서서히 차오르는 상황 · 경고 임계치 80%</text>

  <!-- 시각 축 라벨 -->
  <text x="150" y="88" fill="rgb(138,133,128)" font-size="10.5" text-anchor="middle">09:00</text>
  <text x="250" y="88" fill="rgb(138,133,128)" font-size="10.5" text-anchor="middle">09:05</text>
  <text x="350" y="88" fill="rgb(138,133,128)" font-size="10.5" text-anchor="middle">09:10</text>
  <text x="450" y="88" fill="rgb(138,133,128)" font-size="10.5" text-anchor="middle">09:15</text>
  <text x="550" y="88" fill="rgb(138,133,128)" font-size="10.5" text-anchor="middle">09:20</text>
  <text x="650" y="88" fill="rgb(138,133,128)" font-size="10.5" text-anchor="middle">09:25</text>

  <!-- 실제 값 -->
  <text x="40" y="118" fill="#e8e4df" font-size="12">실제 값</text>
  <text x="150" y="118" fill="#e8e4df" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">30%</text>
  <text x="250" y="118" fill="#e8e4df" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">40%</text>
  <text x="350" y="118" fill="#e8e4df" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">50%</text>
  <text x="450" y="118" fill="#e8e4df" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">60%</text>
  <text x="550" y="118" fill="#e8e4df" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">78%</text>
  <text x="650" y="118" fill="#e8e4df" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">82%</text>

  <line x1="40" y1="134" x2="680" y2="134" stroke="rgb(42,37,32)" stroke-width="1"/>
  <text x="360" y="152" fill="rgb(138,133,128)" font-size="10.5" text-anchor="middle">↓ 같은 현실을 두 방식이 이렇게 남깁니다</text>

  <!-- ── 체크 기반 ── -->
  <rect x="40" y="168" width="640" height="106" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="56" y="192" fill="#e8e4df" font-size="13">체크 기반 — 종료 코드가 남습니다</text>

  <text x="150" y="222" fill="rgb(138,133,128)" font-size="13" font-family="'JetBrains Mono', monospace" text-anchor="middle">OK</text>
  <text x="250" y="222" fill="rgb(138,133,128)" font-size="13" font-family="'JetBrains Mono', monospace" text-anchor="middle">OK</text>
  <text x="350" y="222" fill="rgb(138,133,128)" font-size="13" font-family="'JetBrains Mono', monospace" text-anchor="middle">OK</text>
  <text x="450" y="222" fill="rgb(138,133,128)" font-size="13" font-family="'JetBrains Mono', monospace" text-anchor="middle">OK</text>
  <text x="550" y="222" fill="rgb(138,133,128)" font-size="13" font-family="'JetBrains Mono', monospace" text-anchor="middle">OK</text>
  <text x="650" y="222" fill="#e8e4df" font-size="13" font-family="'JetBrains Mono', monospace" text-anchor="middle">WARN</text>

  <line x1="118" y1="238" x2="592" y2="238" stroke="rgb(92,84,74)" stroke-dasharray="4 3"/>
  <text x="355" y="258" fill="rgb(138,133,128)" font-size="11" text-anchor="middle">다섯 시점이 모두 같은 글자 — 차오르는 과정이 사라집니다</text>
  <line x1="640" y1="234" x2="620" y2="248" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#cvtGrayArrow)"/>

  <!-- ── 시계열 ── -->
  <rect x="40" y="292" width="640" height="146" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="56" y="314" fill="#e8e4df" font-size="13">시계열 — 숫자와 시각의 쌍이 남습니다</text>

  <!-- 임계치 80% 기준선: y = 412 - 0.80*84 = 344.8 -->
  <line x1="118" y1="345" x2="668" y2="345" stroke="rgb(138,133,128)" stroke-dasharray="4 3"/>
  <text x="112" y="349" fill="rgb(138,133,128)" font-size="10" text-anchor="end">80%</text>

  <!-- 상승 곡선: y = 412 - (값/100)*84 -->
  <polyline points="150,387 250,378 350,370 450,362 550,346 650,343"
            fill="none" stroke="rgb(212,168,83)" stroke-width="2"/>
  <circle cx="150" cy="387" r="3.5" fill="rgb(212,168,83)"/>
  <circle cx="250" cy="378" r="3.5" fill="rgb(212,168,83)"/>
  <circle cx="350" cy="370" r="3.5" fill="rgb(212,168,83)"/>
  <circle cx="450" cy="362" r="3.5" fill="rgb(212,168,83)"/>
  <circle cx="550" cy="346" r="3.5" fill="rgb(212,168,83)"/>
  <circle cx="650" cy="343" r="3.5" fill="rgb(212,168,83)"/>

  <text x="355" y="424" fill="#e8e4df" font-size="11" text-anchor="middle">기울기가 남습니다 — 임계치 도달 시점을 넘기 전에 계산할 수 있습니다</text>

  <!-- 하단 결론 -->
  <rect x="40" y="454" width="640" height="26" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-dasharray="4 3"/>
  <text x="56" y="472" fill="rgb(212,168,83)" font-size="11">핵심</text>
  <text x="98" y="472" fill="#e8e4df" font-size="11">상태 라벨로 압축하면 원본 숫자는 되돌릴 수 없습니다. 경고가 떠도 서서히인지 급증인지 모릅니다.</text>
</svg>

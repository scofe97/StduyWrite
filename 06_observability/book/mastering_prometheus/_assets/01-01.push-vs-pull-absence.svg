<svg viewBox="0 0 720 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>메트릭이 안 올 때 push 와 pull 이 각각 무엇을 말할 수 있는가</title>
  <desc>server-042 에서 메트릭이 오지 않는 같은 상황을 push 모델과 pull 모델이 각각 어떻게 해석하는지 대비한다. push 모델의 중앙 서버는 누가 보내야 하는지 모르므로 앱이 죽었는지, 네트워크가 끊겼는지, 오토스케일로 정상 축소됐는지, 애초에 그런 서버가 있었는지를 구별할 수 없고 네 갈래 물음표로 남는다. 특히 정상 축소된 인스턴스와 죽은 인스턴스가 똑같이 보인다. pull 모델은 서비스 디스커버리로 지금 살아 있어야 하는 대상 목록을 알기 때문에, 목록에 있는데 응답이 없다는 판정이 명확해지고 그 결과가 up 메트릭에 0 으로 자동 기록된다. 부재 자체가 데이터가 되는 것이 pull 이 조용한 실패를 줄이는 기전이다.</desc>

  <defs>
    <marker id="pvpAmberArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="pvpGrayArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="470" fill="#0d0d0d"/>

  <text x="40" y="34" fill="#e8e4df" font-size="15">같은 침묵, 두 가지 해석</text>
  <text x="40" y="54" fill="rgb(138,133,128)" font-size="11">server-042 에서 메트릭이 오지 않습니다 · 이 사실만으로 무엇을 알 수 있는가</text>

  <line x1="40" y1="70" x2="680" y2="70" stroke="rgb(42,37,32)" stroke-width="1"/>

  <!-- ── push ── -->
  <rect x="40" y="88" width="640" height="152" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="56" y="112" fill="#e8e4df" font-size="13">push — 중앙 서버는 누가 보내야 하는지 모릅니다</text>

  <text x="56" y="138" fill="rgb(138,133,128)" font-size="11">받은 것만 알 뿐, 안 온 것이 무엇인지는 알 수 없습니다</text>

  <line x1="360" y1="146" x2="360" y2="162" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#pvpGrayArrow)"/>

  <rect x="56" y="168" width="146" height="34" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="129" y="189" fill="rgb(138,133,128)" font-size="11" text-anchor="middle">앱이 죽었나?</text>

  <rect x="212" y="168" width="146" height="34" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="285" y="189" fill="rgb(138,133,128)" font-size="11" text-anchor="middle">네트워크가 끊겼나?</text>

  <rect x="368" y="168" width="146" height="34" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="441" y="189" fill="rgb(138,133,128)" font-size="11" text-anchor="middle">정상 축소됐나?</text>

  <rect x="524" y="168" width="140" height="34" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="594" y="189" fill="rgb(138,133,128)" font-size="11" text-anchor="middle">원래 있던 서버인가?</text>

  <text x="360" y="224" fill="#e8e4df" font-size="11" text-anchor="middle">넷을 구별할 수 없습니다 — 오토스케일 축소와 장애가 똑같이 보입니다</text>

  <!-- ── pull ── -->
  <rect x="40" y="258" width="640" height="152" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="56" y="282" fill="#e8e4df" font-size="13">pull — 살아 있어야 할 대상 목록을 먼저 압니다</text>

  <rect x="56" y="298" width="270" height="48" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="70" y="317" fill="rgb(138,133,128)" font-size="10.5">서비스 디스커버리가 준 대상 목록</text>
  <text x="70" y="336" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace">server-041 · server-042 · server-043</text>

  <line x1="332" y1="328" x2="376" y2="328" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#pvpAmberArrow)"/>
  <text x="354" y="311" fill="rgb(212,168,83)" font-size="10" text-anchor="middle">긁어 봅니다</text>

  <rect x="386" y="298" width="278" height="48" fill="#0d0d0d" stroke="rgb(212,168,83)"/>
  <text x="400" y="317" fill="rgb(138,133,128)" font-size="10.5">목록에 있는데 응답이 없다 → 판정이 명확합니다</text>
  <text x="400" y="336" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace">up{instance="server-042"} == 0</text>

  <text x="360" y="374" fill="#e8e4df" font-size="11" text-anchor="middle">축소된 인스턴스는 목록에서 함께 빠지므로 장애와 섞이지 않습니다</text>
  <text x="360" y="394" fill="rgb(138,133,128)" font-size="11" text-anchor="middle">죽은 대상도 계속 긁습니다 — 그래야 언제 살아났는지 알 수 있습니다</text>

  <!-- 하단 결론 -->
  <rect x="40" y="426" width="640" height="26" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-dasharray="4 3"/>
  <text x="56" y="444" fill="rgb(212,168,83)" font-size="11">핵심</text>
  <text x="98" y="444" fill="#e8e4df" font-size="11">부재가 데이터가 됩니다. 안 온 것과 없는 것을 가르는 기준은 "무엇이 있어야 하는가"를 아는 쪽에만 있습니다.</text>
</svg>

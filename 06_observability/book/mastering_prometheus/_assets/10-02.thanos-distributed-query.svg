<svg viewBox="0 0 880 480" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Thanos Query 의 두 실행 방식 — 끌어오기와 밀어내기</title>
  <desc>Prometheus PromQL 엔진은 단일 스레드이고 모든 시계열을 Query 노드 메모리로 끌어온 뒤 집계한다. Thanos 자체 엔진은 하위 Query 노드로 집계를 내려보내 부분 결과만 받는다. 다만 평균의 평균은 참된 평균이 아니므로 avg 같은 집계는 내려보낼 수 없다.</desc>

  <defs>
    <marker id="aq" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="480" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">Thanos Query — 시계열을 끌어올까, 집계를 내려보낼까</text>
  <text x="20" y="54" fill="rgb(138,133,128)" font-size="10.5">같은 <tspan font-family="'JetBrains Mono', monospace" fill="#e8e4df">sum(my_metric)</tspan> 을 두 엔진이 전혀 다르게 실행합니다.</text>

  <!-- LEFT: prometheus engine -->
  <text x="20" y="88" fill="rgb(138,133,128)" font-size="11.5">기본 — <tspan font-family="'JetBrains Mono', monospace">--query.promql-engine=prometheus</tspan></text>

  <rect x="20" y="102" width="400" height="150" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>

  <rect x="150" y="116" width="140" height="34" fill="rgb(26,26,26)" stroke="rgb(138,133,128)"/>
  <text x="220" y="137" fill="#e8e4df" font-size="10.5" text-anchor="middle">Thanos Query</text>

  <line x1="90" y1="208" x2="180" y2="156" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ag)"/>
  <line x1="220" y1="208" x2="220" y2="160" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ag)"/>
  <line x1="350" y1="208" x2="260" y2="156" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ag)"/>

  <rect x="44" y="214" width="92" height="28" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="90" y="232" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">Prometheus</text>
  <rect x="174" y="214" width="92" height="28" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="220" y="232" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">Prometheus</text>
  <rect x="304" y="214" width="92" height="28" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="350" y="232" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">Prometheus</text>

  <text x="30" y="272" fill="rgb(138,133,128)" font-size="9.5">· 단일 스레드라 코어를 늘려도 빨라지지 않습니다</text>
  <text x="30" y="290" fill="rgb(138,133,128)" font-size="9.5">· 원시 시계열이 전부 Query 메모리를 지나갑니다</text>

  <!-- RIGHT: thanos engine -->
  <text x="460" y="88" fill="rgb(212,168,83)" font-size="11.5">실험적 — <tspan font-family="'JetBrains Mono', monospace">--query.promql-engine=thanos</tspan></text>

  <rect x="460" y="102" width="400" height="150" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>

  <rect x="590" y="116" width="140" height="34" fill="rgb(26,26,26)" stroke="rgb(212,168,83)"/>
  <text x="660" y="137" fill="#e8e4df" font-size="10.5" text-anchor="middle">최상위 Query</text>

  <line x1="560" y1="208" x2="620" y2="156" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#aq)"/>
  <line x1="760" y1="208" x2="700" y2="156" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#aq)"/>
  <text x="660" y="192" fill="rgb(212,168,83)" font-size="9" text-anchor="middle">부분 합 두 개만 올라옵니다</text>

  <rect x="496" y="214" width="128" height="28" fill="rgb(26,26,26)" stroke="rgb(212,168,83)"/>
  <text x="560" y="232" fill="rgb(212,168,83)" font-size="8.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">sum() 하위 Query</text>
  <rect x="696" y="214" width="128" height="28" fill="rgb(26,26,26)" stroke="rgb(212,168,83)"/>
  <text x="760" y="232" fill="rgb(212,168,83)" font-size="8.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">sum() 하위 Query</text>

  <text x="470" y="272" fill="rgb(138,133,128)" font-size="9.5">· 멀티 스레드이고 집계를 아래로 내려보냅니다</text>
  <text x="470" y="290" fill="rgb(138,133,128)" font-size="9.5">· 문제가 생기면 기본 엔진으로 되돌아갑니다</text>

  <!-- avg caveat -->
  <line x1="20" y1="316" x2="860" y2="316" stroke="rgb(42,37,32)"/>
  <text x="20" y="342" fill="#e8e4df" font-size="12">그런데 <tspan font-family="'JetBrains Mono', monospace" fill="rgb(212,168,83)">avg</tspan> 는 왜 내려보낼 수 없을까요</text>

  <rect x="20" y="358" width="404" height="96" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="36" y="380" fill="rgb(138,133,128)" font-size="9.5">노드 A 의 값 <tspan fill="#e8e4df" font-family="'JetBrains Mono', monospace">[10, 20, 30]</tspan> → 평균 <tspan fill="#e8e4df">20</tspan></text>
  <text x="36" y="400" fill="rgb(138,133,128)" font-size="9.5">노드 B 의 값 <tspan fill="#e8e4df" font-family="'JetBrains Mono', monospace">[100]</tspan> → 평균 <tspan fill="#e8e4df">100</tspan></text>
  <text x="36" y="424" fill="rgb(138,133,128)" font-size="9.5">평균의 평균 = <tspan fill="#e57373" font-weight="700">60</tspan>   ·   참된 평균 = <tspan fill="#66bb6a" font-weight="700">40</tspan></text>
  <text x="36" y="444" fill="rgb(138,133,128)" font-size="9">개수를 모르면 되돌릴 수 없습니다</text>

  <rect x="440" y="358" width="420" height="96" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="456" y="382" fill="#e8e4df" font-size="10.5">그래서 기본 엔진은 <tspan fill="rgb(212,168,83)">일부러</tspan> 전부 끌어옵니다</text>
  <text x="456" y="406" fill="rgb(138,133,128)" font-size="9.5"><tspan font-family="'JetBrains Mono', monospace">sum</tspan> 만 보면 낭비 같지만, <tspan font-family="'JetBrains Mono', monospace">avg</tspan> 같은 집계까지</text>
  <text x="456" y="424" fill="rgb(138,133,128)" font-size="9.5">통계적으로 옳게 답하려면 필요한 설계입니다.</text>
  <text x="456" y="446" fill="rgb(138,133,128)" font-size="9">엔진 교체는 이 정확성을 지키면서 병렬화하려는 시도입니다.</text>
</svg>

<svg viewBox="0 0 860 450" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>chunk 참조 8바이트가 파일 안 한 지점을 찍는 경로</title>
  <desc>시리즈 인덱스 항목이 들고 있는 chunk 참조는 uint64 8바이트다. 상위 4바이트가 세그먼트 파일 번호를, 하위 4바이트가 그 파일 안 바이트 오프셋을 가리킨다. 두 값이 차례로 적용되어 먼저 어느 파일인지 고르고, 그다음 그 파일 안 455 바이트 지점으로 바로 점프한다. 세그먼트 파일 안에는 서로 다른 시계열의 chunk 가 도착 순서대로 뒤섞여 들어가므로 이웃한 chunk 가 같은 시계열일 이유가 없고, 그래서 파일 번호만으로는 원하는 chunk 에 닿지 못한다. 도착한 지점에서 chunk 는 자기 데이터 길이를 varint 로 앞에 달고 인코딩 1바이트, 압축된 샘플, CRC32 4바이트 순으로 이어지므로 길이만큼 잘라내면 chunk 하나가 온전히 나온다.</desc>

  <defs>
    <marker id="cr-amber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="cr-green" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(102,187,106)"/>
    </marker>
    <marker id="cr-red" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(224,108,108)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="450" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">chunk 참조 8바이트가 한 지점을 찍는 경로</text>

  <!-- ===== 1. 인덱스 항목 ===== -->
  <text x="24" y="64" fill="#b8b3ad" font-size="10.5">1. 시리즈 인덱스 항목</text>

  <rect x="24" y="74" width="812" height="58" fill="rgba(212,168,83,0.10)" stroke="rgb(212,168,83)"/>
  <text x="40" y="98" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">{__name__="jvm_memory_bytes_used", pool="G1 Eden Space"}</text>

  <!-- 8바이트 참조 분해 -->
  <rect x="520" y="88" width="140" height="30" fill="rgba(102,187,106,0.20)" stroke="rgb(102,187,106)"/>
  <text x="590" y="107" fill="#e8e4df" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">상위 4B = 000001</text>

  <rect x="672" y="88" width="140" height="30" fill="rgba(224,108,108,0.22)" stroke="rgb(224,108,108)"/>
  <text x="742" y="107" fill="#e8e4df" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">하위 4B = 455</text>

  <text x="440" y="107" fill="#b8b3ad" font-size="9.5" text-anchor="end">chunk 참조 uint64</text>

  <!-- ===== 2. 어느 파일인가 (녹색) ===== -->
  <line x1="590" y1="118" x2="590" y2="150" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#cr-green)"/>
  <text x="600" y="140" fill="rgb(102,187,106)" font-size="9.5">2. 어느 파일</text>

  <text x="24" y="176" fill="#b8b3ad" font-size="10.5">3. 그 파일 안 오프셋으로 점프</text>

  <text x="24" y="200" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace">chunks/000001</text>
  <text x="836" y="200" fill="#b8b3ad" font-size="9.5" text-anchor="end">5.4 MB · chunk 18,610 개</text>

  <!-- 세그먼트 파일 -->
  <rect x="24" y="210" width="812" height="72" fill="#0d0d0d" stroke="rgb(92,84,74)"/>

  <rect x="32" y="222" width="52" height="40" fill="rgba(102,102,102,0.25)" stroke="#b8b3ad"/>
  <text x="58" y="239" fill="#e8e4df" font-size="8.5" text-anchor="middle">헤더</text>
  <text x="58" y="253" fill="#b8b3ad" font-size="8" text-anchor="middle">8 B</text>

  <rect x="90" y="222" width="88" height="40" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <text x="134" y="246" fill="#e8e4df" font-size="8.5" text-anchor="middle">chunk</text>

  <rect x="184" y="222" width="92" height="40" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <text x="230" y="246" fill="#e8e4df" font-size="8.5" text-anchor="middle">chunk</text>

  <!-- 목표 chunk -->
  <rect x="282" y="222" width="94" height="40" fill="rgba(224,108,108,0.38)" stroke="rgb(224,108,108)" stroke-width="2"/>
  <text x="329" y="240" fill="#e8e4df" font-size="8.5" text-anchor="middle">chunk</text>
  <text x="329" y="254" fill="#e8e4df" font-size="8" text-anchor="middle" font-weight="700">찾는 것</text>

  <rect x="382" y="222" width="92" height="40" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <text x="428" y="246" fill="#e8e4df" font-size="8.5" text-anchor="middle">chunk</text>

  <rect x="480" y="222" width="90" height="40" fill="rgba(170,145,215,0.30)" stroke="rgb(170,145,215)"/>
  <text x="525" y="246" fill="#e8e4df" font-size="8.5" text-anchor="middle">chunk</text>

  <rect x="576" y="222" width="92" height="40" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <text x="622" y="246" fill="#e8e4df" font-size="8.5" text-anchor="middle">chunk</text>

  <text x="700" y="246" fill="#b8b3ad" font-size="9.5">… 18,610 개까지</text>

  <!-- 오프셋 눈금 -->
  <text x="90" y="276" fill="#b8b3ad" font-size="8.5" text-anchor="middle">8</text>
  <text x="184" y="276" fill="#b8b3ad" font-size="8.5" text-anchor="middle">203</text>
  <text x="282" y="276" fill="rgb(224,108,108)" font-size="8.5" text-anchor="middle" font-weight="700">455</text>
  <text x="382" y="276" fill="#b8b3ad" font-size="8.5" text-anchor="middle">714</text>
  <text x="480" y="276" fill="#b8b3ad" font-size="8.5" text-anchor="middle">970</text>
  <text x="576" y="276" fill="#b8b3ad" font-size="8.5" text-anchor="middle">1224</text>

  <!-- 오프셋 점프 화살표 -->
  <line x1="742" y1="118" x2="742" y2="164" stroke="rgb(224,108,108)" stroke-width="2"/>
  <line x1="742" y1="164" x2="330" y2="164" stroke="rgb(224,108,108)" stroke-width="2"/>
  <line x1="330" y1="164" x2="330" y2="216" stroke="rgb(224,108,108)" stroke-width="2" marker-end="url(#cr-red)"/>
  <text x="340" y="158" fill="rgb(224,108,108)" font-size="9.5">455 로 점프</text>

  <text x="24" y="298" fill="#b8b3ad" font-size="9.5">색 = 시계열 · 이웃해도 남남</text>

  <!-- ===== 4. 도착 지점의 chunk 배치 ===== -->
  <line x1="24" y1="314" x2="836" y2="314" stroke="rgb(92,84,74)"/>
  <text x="24" y="338" fill="#b8b3ad" font-size="10.5">4. 도착 지점 — chunk 하나의 내부</text>

  <line x1="330" y1="282" x2="330" y2="352" stroke="rgb(224,108,108)" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="24" y="352" width="76" height="44" fill="rgba(224,108,108,0.25)" stroke="rgb(224,108,108)"/>
  <text x="62" y="371" fill="#e8e4df" font-size="9" text-anchor="middle">길이</text>
  <text x="62" y="386" fill="#b8b3ad" font-size="8.5" text-anchor="middle">varint 2B</text>

  <rect x="106" y="352" width="76" height="44" fill="rgba(102,187,106,0.25)" stroke="rgb(102,187,106)"/>
  <text x="144" y="371" fill="#e8e4df" font-size="9" text-anchor="middle">인코딩</text>
  <text x="144" y="386" fill="#b8b3ad" font-size="8.5" text-anchor="middle">1B · 0x01</text>

  <rect x="188" y="352" width="430" height="44" fill="rgba(212,168,83,0.25)" stroke="rgb(212,168,83)"/>
  <text x="403" y="371" fill="#e8e4df" font-size="9" text-anchor="middle">압축된 샘플</text>
  <text x="403" y="386" fill="#b8b3ad" font-size="8.5" text-anchor="middle">252 B</text>

  <rect x="624" y="352" width="76" height="44" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="662" y="371" fill="#e8e4df" font-size="9" text-anchor="middle">CRC32</text>
  <text x="662" y="386" fill="#b8b3ad" font-size="8.5" text-anchor="middle">4B</text>

  <text x="716" y="378" fill="#b8b3ad" font-size="9.5">합 259 B</text>

  <!-- 길이 → 다음 chunk -->
  <path d="M62,400 L62,416 L680,416 L680,402" fill="none" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#cr-amber)"/>
  <text x="360" y="432" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle">길이만큼 잘라내면 끝 · 다음 오프셋 714</text>
</svg>

<svg viewBox="0 0 900 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>head 는 상태 이름입니다 — chunk 하나의 일생</title>
  <desc>head chunk 와 chunk 는 별개 물건이 아니라 같은 것이다. 빈 chunk 가 열려 샘플을 받는 동안에만 head chunk 라 불리고, 120 개가 차서 잘리는 순간 더 이상 head 가 아니다. 잘린 chunk 는 세그먼트 파일에 덧붙고 메모리에는 참조만 남는다. 같은 시계열에는 빈 chunk 가 새로 열려 다시 head 가 된다. 그래서 시계열 하나는 지금 쓰는 활성 chunk 하나와 앞서 잘려 나간 chunk 들의 참조 여럿을 함께 갖는다. head 라는 말은 물건의 종류가 아니라 그 시점의 상태를 가리킨다.</desc>

  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="380" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">&quot;head&quot; 는 물건 이름이 아니라 상태 이름입니다</text>
  <text x="24" y="52" fill="#b8b3ad" font-size="10">chunk 하나의 일생 · 이름만 바뀝니다</text>

  <!-- head 구간 표시 -->
  <rect x="24" y="72" width="392" height="150" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-dasharray="5 4"/>
  <text x="220" y="92" fill="rgb(212,168,83)" font-size="11" text-anchor="middle" font-weight="700">이 구간에서만 &quot;head chunk&quot;</text>

  <!-- 1: 빈 chunk -->
  <rect x="44" y="106" width="160" height="72" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="124" y="128" style="fill:#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">1. 빈 chunk 열림</text>
  <rect x="58" y="138" width="132" height="14" fill="#fdf3df" stroke="#fdf3df"/>
  <text x="124" y="149" style="fill:#7a5a1f" font-size="8" text-anchor="middle">샘플 0 / 120</text>
  <text x="124" y="169" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">쓰기를 받습니다</text>

  <line x1="212" y1="142" x2="240" y2="142" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#c)"/>

  <!-- 2: 쌓는 중 -->
  <rect x="248" y="106" width="160" height="72" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="328" y="128" style="fill:#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">2. 샘플 쌓는 중</text>
  <rect x="262" y="138" width="132" height="14" fill="#fdf3df" stroke="#fdf3df"/>
  <rect x="262" y="138" width="99" height="14" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="328" y="149" style="fill:#0d0d0d" font-size="8" text-anchor="middle">샘플 90 / 120</text>
  <text x="328" y="169" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">여전히 쓰기를 받습니다</text>

  <text x="44" y="204" fill="#b8b3ad" font-size="9">쓰기를 받는 동안에만 head 입니다 — 시계열당 <tspan fill="#e8e4df">한 개뿐</tspan></text>

  <!-- 잘림 경계 -->
  <line x1="432" y1="100" x2="432" y2="222" stroke="#f44336" stroke-width="2"/>
  <text x="432" y="82" fill="#f44336" font-size="10" text-anchor="middle" font-weight="700">120 개 참 → 잘라 냄</text>
  <text x="432" y="96" fill="#b8b3ad" font-size="8.5" text-anchor="middle">여기서 head 자격을 잃습니다</text>

  <!-- 3: 잘린 뒤 -->
  <rect x="470" y="106" width="180" height="72" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="560" y="128" fill="#e8e4df" font-size="10" text-anchor="middle" font-weight="700">3. 그냥 chunk</text>
  <rect x="486" y="138" width="148" height="14" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="560" y="149" style="fill:#10243a" font-size="8" text-anchor="middle">샘플 120 / 120 · 봉인</text>
  <text x="560" y="169" fill="#b8b3ad" font-size="8.5" text-anchor="middle">더는 쓰기를 안 받습니다</text>

  <line x1="658" y1="142" x2="686" y2="142" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#c)"/>

  <!-- 4: 파일로 -->
  <rect x="694" y="106" width="182" height="72" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="785" y="128" style="fill:#10243a" font-size="10" text-anchor="middle" font-weight="700">4. 세그먼트 파일에</text>
  <text x="785" y="146" style="fill:#10243a" font-size="8.5" text-anchor="middle">디스크로 flush</text>
  <text x="785" y="164" style="fill:#10243a" font-size="8.5" text-anchor="middle">메모리엔 참조만</text>

  <text x="470" y="204" fill="#b8b3ad" font-size="9">잘린 뒤에는 <tspan fill="#e8e4df">그냥 chunk</tspan></text>

  <!-- 새 chunk 열림 -->
  <path d="M785,182 L785,252 L124,252 L124,196" fill="none" stroke="#66bb6a" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M121,196 L124,188 L127,196 Z" fill="#66bb6a"/>
  <rect x="248" y="243" width="414" height="17" fill="#0d0d0d"/>
  <text x="455" y="256" fill="#66bb6a" font-size="9.5" text-anchor="middle" font-weight="700">같은 시계열에 빈 chunk 가 새로 열려 다시 1. 로 — 샘플은 0 부터</text>

  <!-- 결과 -->
  <line x1="24" y1="270" x2="876" y2="270" stroke="rgb(92,84,74)"/>
  <text x="24" y="292" fill="#e8e4df" font-size="11.5" font-weight="700">그래서 시계열 하나가 갖는 것</text>

  <rect x="24" y="304" width="240" height="40" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="144" y="322" style="fill:#0d0d0d" font-size="9.5" text-anchor="middle" font-weight="700">head chunk 1 개</text>
  <text x="144" y="336" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">지금 쓰는 것</text>

  <text x="278" y="328" fill="#b8b3ad" font-size="11">+</text>

  <rect x="298" y="304" width="360" height="40" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="478" y="322" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-weight="700">앞서 잘린 chunk 들의 참조 N 개</text>
  <text x="478" y="336" fill="#b8b3ad" font-size="8.5" text-anchor="middle">mmappedChunks[] · 시간이 갈수록 늘어남</text>

  <text x="676" y="328" fill="#b8b3ad" font-size="9.5">&quot;시계열당 chunk 하나&quot; 는</text>
  <text x="676" y="342" fill="#e8e4df" font-size="9.5">활성인 것에 한해서만 맞습니다</text>

  <text x="24" y="368" fill="#b8b3ad" font-size="9.5">소스의 타입은 <tspan font-family="'JetBrains Mono', monospace" fill="#e8e4df">*memChunk</tspan> 하나</text>
</svg>

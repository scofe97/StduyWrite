<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif" role="img">
  <title>Thanos Query 와 Sidecar 로 HA Prometheus 를 하나로 질의하기</title>
  <desc>HA 로 복제한 Prometheus 두 대 옆에 각각 Thanos Sidecar 가 붙는다. Thanos Query 는 두 Sidecar 로 gRPC 쿼리를 동시에 펼쳐 보내고, 돌아온 결과에서 복제본을 구분하던 external label 을 걷어내 같은 시계열을 하나로 합친다. 한 복제본의 데이터에 구멍이 있으면 다른 복제본의 그 구간으로 채운다. 사용자는 두 서버의 존재를 모른 채 Thanos Query 한 곳에만 질의한다.</desc>
  <rect width="760" height="360" fill="#0d0d0d"/>
  <text x="380" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">Thanos Query 의 질의</text>

  <!-- serverA -->
  <rect x="40" y="70" width="230" height="86" rx="10" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="56" y="90" font-size="12" fill="#8ab6e0">serverA</text>
  <rect x="56" y="100" width="120" height="44" rx="6" fill="#dceaf7"/>
  <text x="116" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#10243a">prometheus</text>
  <rect x="186" y="100" width="70" height="44" rx="6" fill="#5b9bd5"/>
  <text x="221" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#e8e4df">Thanos</text>
  <text x="221" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#e8e4df">Sidecar</text>

  <!-- serverB -->
  <rect x="40" y="200" width="230" height="86" rx="10" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="56" y="220" font-size="12" fill="#8ab6e0">serverB</text>
  <rect x="56" y="230" width="120" height="44" rx="6" fill="#dceaf7"/>
  <text x="116" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#10243a">prometheus</text>
  <rect x="186" y="230" width="70" height="44" rx="6" fill="#5b9bd5"/>
  <text x="221" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#e8e4df">Thanos</text>
  <text x="221" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#e8e4df">Sidecar</text>

  <!-- Thanos Query -->
  <rect x="400" y="135" width="150" height="90" rx="12" fill="#66bb6a"/>
  <text x="475" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#0d0d0d">Thanos</text>
  <text x="475" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#0d0d0d">Query</text>

  <!-- User -->
  <circle cx="680" cy="165" r="20" fill="#f5edda"/>
  <rect x="660" y="188" width="40" height="26" rx="8" fill="#f5edda"/>
  <text x="680" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#e8e4df">User</text>

  <!-- arrows: Query <-> sidecars (gRPC) -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/></marker>
  </defs>
  <line x1="400" y1="160" x2="258" y2="122" stroke="#b8b3ad" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="258" y1="122" x2="400" y2="160" stroke="#b8b3ad" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="400" y1="200" x2="258" y2="252" stroke="#b8b3ad" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="258" y1="252" x2="400" y2="200" stroke="#b8b3ad" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="325" y="128" text-anchor="middle" font-size="10" fill="#8ab6e0">gRPC</text>
  <text x="325" y="256" text-anchor="middle" font-size="10" fill="#8ab6e0">gRPC</text>

  <!-- Query <-> User -->
  <line x1="550" y1="180" x2="656" y2="168" stroke="#b8b3ad" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="656" y1="168" x2="550" y2="180" stroke="#b8b3ad" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- dedup note -->
  <rect x="360" y="256" width="360" height="72" rx="8" fill="#e6f7e7"/>
  <text x="375" y="278" font-size="12" font-weight="700" fill="#14521d">중복 제거(dedup)</text>
  <text x="375" y="298" font-size="11.5" fill="#14521d">복제본 라벨을 걷어냄</text>
  <text x="375" y="316" font-size="11.5" fill="#14521d">구멍은 다른 복제본으로 채움</text>
</svg>

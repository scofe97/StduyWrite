<svg viewBox="0 0 880 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>단명 프로세스의 스크레이프는 대부분 헛치고, textfile 을 거치면 전부 명중합니다</title>
  <desc>위쪽은 배치 프로세스를 직접 긁는 경우로, 15초 주기 스크레이프 가운데 배치가 살아 있는 40초 구간에 든 두세 번만 값을 얻고 나머지는 빈 곳을 때린다. 배치가 5초로 짧으면 한 번도 못 긁힐 수 있다. 아래쪽은 배치가 .prom 파일을 남기고 죽은 뒤에도 오래 사는 Node Exporter 가 그 파일을 대신 노출하므로 모든 스크레이프가 값을 얻는다.</desc>

  <defs>
    <marker id="hit" markerWidth="8" markerHeight="8" refX="6" refY="5" orient="auto">
      <path d="M0,0 L6,5 L0,10 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="miss" markerWidth="8" markerHeight="8" refX="6" refY="5" orient="auto">
      <path d="M0,0 L6,5 L0,10 Z" fill="rgb(90,86,82)"/>
    </marker>
    <marker id="misslegend" markerWidth="8" markerHeight="8" refX="6" refY="5" orient="auto">
      <path d="M0,0 L6,5 L0,10 Z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="420" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">단명 프로세스 — 스크레이프는 어디를 때립니까</text>
  <text x="20" y="53" fill="rgb(138,133,128)" font-size="10.5">15초 주기로 긁는 Prometheus 와 새벽 3시에 40초 도는 배치. 하루 스크레이프 5,760회 중 명중은 많아야 두세 번입니다.</text>

  <!-- ================= PANEL 1 : direct scrape ================= -->
  <text x="20" y="88" fill="rgb(212,168,83)" font-size="12">① 배치를 직접 긁을 때 — 03:00 앞뒤를 확대</text>
  <line x1="600" y1="80" x2="600" y2="90" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <text x="612" y="90" fill="rgb(212,168,83)" font-size="9.5">값을 얻은 스크레이프</text>
  <line x1="722" y1="80" x2="722" y2="90" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#misslegend)"/>
  <text x="734" y="90" fill="rgb(138,133,128)" font-size="9.5">헛친 스크레이프</text>

  <!-- alive band -->
  <rect x="243" y="104" width="112" height="66" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="299" y="122" style="fill:rgb(212,168,83)" font-size="10" text-anchor="middle">배치 살아 있음</text>
  <text x="299" y="139" style="fill:#e8e4df" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">03:00:00~40</text>
  <text x="299" y="157" style="fill:rgb(212,168,83)" font-size="10" text-anchor="middle">40초</text>

  <!-- timeline axis -->
  <line x1="20" y1="184" x2="855" y2="184" stroke="rgb(138,133,128)" stroke-width="1.2"/>

  <!-- MISS arrows (before) -->
  <line x1="48"  y1="172" x2="48"  y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="90"  y1="172" x2="90"  y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="132" y1="172" x2="132" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="174" y1="172" x2="174" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="216" y1="172" x2="216" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <!-- HIT arrows (inside band) -->
  <line x1="258" y1="172" x2="258" y2="180" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="300" y1="172" x2="300" y2="180" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="342" y1="172" x2="342" y2="180" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <!-- MISS arrows (after) -->
  <line x1="384" y1="172" x2="384" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="426" y1="172" x2="426" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="468" y1="172" x2="468" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="510" y1="172" x2="510" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="552" y1="172" x2="552" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="594" y1="172" x2="594" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="636" y1="172" x2="636" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="666" y1="176" x2="678" y2="190" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <line x1="674" y1="176" x2="686" y2="190" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <line x1="706" y1="172" x2="706" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="748" y1="172" x2="748" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="790" y1="172" x2="790" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>
  <line x1="832" y1="172" x2="832" y2="180" stroke="rgb(90,86,82)" stroke-width="1.1" marker-end="url(#miss)"/>

  <text x="20" y="203" fill="rgb(138,133,128)" font-size="9.5">02:59 이전 — 아직 안 뜸</text>
  <text x="299" y="203" style="fill:rgb(212,168,83)" font-size="9.5" text-anchor="middle">명중 2~3회</text>
  <text x="620" y="203" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">03:01 이후 다음날 새벽까지 — 약 86,360초 동안 전부 헛침 (⁄⁄ 뒤는 축척이 다릅니다)</text>

  <!-- short-batch callout -->
  <rect x="20" y="218" width="835" height="34" fill="#0d0d0d" stroke="rgb(138,133,128)"/>
  <text x="34" y="240" fill="#e8e4df" font-size="10.5">배치가 5초 만에 끝나면 띠가 눈금 사이에 통째로 들어가 <tspan style="fill:rgb(212,168,83)">명중 0회</tspan> 도 가능합니다. 처리 건수는 <tspan style="fill:#e8e4df">끝나기 직전</tspan> 에 확정되므로 그 순간을 놓치면 최종 결과는 영영 못 봅니다.</text>

  <!-- ================= PANEL 2 : via textfile ================= -->
  <text x="20" y="290" fill="rgb(212,168,83)" font-size="12">② textfile collector 를 거칠 때 — 같은 타임라인</text>

  <!-- batch writes file -->
  <rect x="243" y="304" width="112" height="46" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="299" y="322" style="fill:#e8e4df" font-size="10" text-anchor="middle">배치가 파일을</text>
  <text x="299" y="339" style="fill:rgb(212,168,83)" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">.prom</text>

  <!-- node exporter persistent band -->
  <rect x="20" y="304" width="835" height="46" fill="none" stroke="rgb(212,168,83)" stroke-dasharray="4 3"/>
  <text x="640" y="330" style="fill:rgb(212,168,83)" font-size="10" text-anchor="middle">Node Exporter 는 계속 살아 그 파일을 대신 노출합니다 — 배치가 죽은 뒤에도</text>

  <line x1="20" y1="374" x2="855" y2="374" stroke="rgb(138,133,128)" stroke-width="1.2"/>

  <line x1="48"  y1="354" x2="48"  y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="90"  y1="354" x2="90"  y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="132" y1="354" x2="132" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="174" y1="354" x2="174" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="216" y1="354" x2="216" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="258" y1="354" x2="258" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="300" y1="354" x2="300" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="342" y1="354" x2="342" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="384" y1="354" x2="384" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="426" y1="354" x2="426" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="468" y1="354" x2="468" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="510" y1="354" x2="510" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="552" y1="354" x2="552" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="594" y1="354" x2="594" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="636" y1="354" x2="636" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="666" y1="366" x2="678" y2="380" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <line x1="674" y1="366" x2="686" y2="380" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <line x1="706" y1="354" x2="706" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="748" y1="354" x2="748" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="790" y1="354" x2="790" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>
  <line x1="832" y1="354" x2="832" y2="370" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#hit)"/>

  <text x="437" y="394" style="fill:rgb(212,168,83)" font-size="10" text-anchor="middle">전부 명중 — 대상이 오래 사는 프로세스로 바뀌었기 때문입니다</text>
</svg>

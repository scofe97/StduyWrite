<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="Query Frontend 는 7일 구간 쿼리를 24시간 단위 7개로 쪼개 여러 Thanos Query 인스턴스에 나눠 주고, 결과를 캐시해 겹치는 구간의 후속 쿼리에 재사용한다">
  <rect width="740" height="400" fill="#0d0d0d"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">Query Frontend — 시간 분할과 부분 캐시 재사용</text>

  <defs>
    <marker id="qa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8580"/></marker>
  </defs>

  <!-- incoming query -->
  <rect x="230" y="48" width="280" height="34" rx="7" fill="#f5edda"/>
  <text x="370" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a2f10">sum(my_metric)  지난 7일</text>
  <line x1="370" y1="84" x2="370" y2="104" stroke="#8a8580" stroke-width="1.5" marker-end="url(#qa)"/>

  <!-- frontend -->
  <rect x="250" y="106" width="240" height="34" rx="7" fill="#5b9bd5"/>
  <text x="370" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8e4df">Query Frontend</text>
  <text x="500" y="128" font-size="10.5" fill="#8ab6e0">--query-range.split-interval=24h</text>

  <!-- 7 splits -->
  <text x="40" y="168" font-size="12" font-weight="700" fill="#8ab6e0">24시간 단위 7개로 분할</text>
  <g>
    <rect x="40" y="178" width="86" height="30" rx="5" fill="#dceaf7"/><text x="83" y="198" text-anchor="middle" font-size="11" fill="#10243a">1일차</text>
    <rect x="132" y="178" width="86" height="30" rx="5" fill="#dceaf7"/><text x="175" y="198" text-anchor="middle" font-size="11" fill="#10243a">2일차</text>
    <rect x="224" y="178" width="86" height="30" rx="5" fill="#dceaf7"/><text x="267" y="198" text-anchor="middle" font-size="11" fill="#10243a">3일차</text>
    <rect x="316" y="178" width="86" height="30" rx="5" fill="#dceaf7"/><text x="359" y="198" text-anchor="middle" font-size="11" fill="#10243a">4일차</text>
    <rect x="408" y="178" width="86" height="30" rx="5" fill="#dceaf7"/><text x="451" y="198" text-anchor="middle" font-size="11" fill="#10243a">5일차</text>
    <rect x="500" y="178" width="86" height="30" rx="5" fill="#dceaf7"/><text x="543" y="198" text-anchor="middle" font-size="11" fill="#10243a">6일차</text>
    <rect x="592" y="178" width="86" height="30" rx="5" fill="#dceaf7"/><text x="635" y="198" text-anchor="middle" font-size="11" fill="#10243a">7일차</text>
  </g>

  <line x1="200" y1="216" x2="200" y2="238" stroke="#8a8580" stroke-width="1.5" marker-end="url(#qa)"/>
  <line x1="520" y1="216" x2="520" y2="238" stroke="#8a8580" stroke-width="1.5" marker-end="url(#qa)"/>

  <!-- query instances -->
  <rect x="110" y="240" width="180" height="34" rx="7" fill="#66bb6a"/>
  <text x="200" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#0d0d0d">Thanos Query A</text>
  <rect x="430" y="240" width="180" height="34" rx="7" fill="#66bb6a"/>
  <text x="520" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#0d0d0d">Thanos Query B</text>
  <text x="370" y="292" text-anchor="middle" font-size="11.5" fill="#c9c4be">인스턴스가 늘수록 분할 효과가 커집니다 (복제본 1개 추가 → 약 30s에서 약 15s)</text>

  <!-- cache reuse -->
  <rect x="40" y="308" width="660" height="76" rx="10" fill="#0d0d0d" stroke="#f5c451" stroke-width="1.3"/>
  <text x="58" y="330" font-size="12.5" font-weight="700" fill="#f5c451">부분 캐시 재사용</text>
  <rect x="58" y="340" width="200" height="26" rx="4" fill="#f5edda"/>
  <text x="158" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#3a2f10">최근 24h — 캐시됨</text>
  <rect x="266" y="340" width="200" height="26" rx="4" fill="#f5c451"/>
  <text x="366" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#3a2f10">나머지 24h — 새로 요청</text>
  <text x="480" y="358" font-size="11.5" fill="#c9c4be">48h 요청 시 캐시 안 된 부분만 가져옵니다</text>
  <text x="58" y="378" font-size="10.5" fill="#8a8580">※ 캐싱은 range 쿼리만 지원 (instant 쿼리는 미지원)</text>
</svg>

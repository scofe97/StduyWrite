<svg viewBox="0 0 880 520" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>요청 기반 SLO 와 윈도우 기반 SLO — 이상 트래픽에 대한 회복력</title>
  <desc>요청 기반 SLO 는 좋은 요청과 전체 요청의 비율이라, 짧은 시간의 이상 트래픽 폭증이 실패하면 그 많은 실패 요청이 SLO 를 오래 끌어내린다. 같은 사건이 윈도우 기반 SLO 에서는 나쁜 창 하나로만 계산되므로, 정상 창 몇 개만 지나면 회복된다. 그래서 트래픽이 적거나 폭증이 잦은 서비스에는 윈도우 기반이 낫다.</desc>

  <defs>
    <marker id="ra" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="520" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">같은 사건, 다른 회복 시간 — 이상 트래픽 한 번이 SLO 를 얼마나 오래 끄는가</text>
  <text x="20" y="54" fill="rgb(138,133,128)" font-size="10.5">정상 <tspan fill="#e8e4df">분당 20건</tspan> 서비스에 나쁜 창 하나 동안 <tspan fill="#e8e4df">초당 500건</tspan>이 몰려 전부 실패한 상황을 두 방식이 어떻게 셈하는지 봅니다.</text>

  <!-- shared incident -->
  <rect x="330" y="72" width="220" height="46" fill="#f2d4d4"/>
  <text x="440" y="92" fill="#7a1f1f" font-size="10.5" text-anchor="middle" font-weight="700">나쁜 창 1개 · 실패 폭증</text>
  <text x="440" y="108" fill="#7a1f1f" font-size="9" text-anchor="middle">순간 초당 500건이 전부 실패</text>

  <!-- LEFT: request-based -->
  <rect x="20" y="140" width="400" height="230" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="40" y="166" fill="#e8e4df" font-size="13">요청 기반 (request-based)</text>
  <text x="40" y="188" fill="rgb(138,133,128)" font-size="9.5">좋은 요청 ÷ 전체 요청. 요청마다 한 표씩.</text>

  <rect x="40" y="204" width="360" height="30" fill="#1a1a1a" stroke="rgb(42,37,32)"/>
  <text x="52" y="223" fill="rgb(138,133,128)" font-size="9" font-family="'JetBrains Mono', monospace">1 − (bad / total) × 100</text>

  <text x="40" y="258" fill="rgb(138,133,128)" font-size="9.5">폭증 때 쌓인 실패 요청 수가 압도적이라</text>
  <text x="40" y="276" fill="rgb(138,133,128)" font-size="9.5">이후 정상 요청으로 그걸 희석해야 합니다.</text>

  <rect x="40" y="292" width="360" height="62" fill="#f2d4d4"/>
  <text x="220" y="316" fill="#7a1f1f" font-size="12" text-anchor="middle" font-weight="700">50% 로 돌아오는 데 약 16일</text>
  <text x="220" y="338" fill="#7a1f1f" font-size="9" text-anchor="middle">실패 요청 하나하나가 계속 분모·분자에 남습니다</text>

  <!-- RIGHT: window-based -->
  <rect x="460" y="140" width="400" height="230" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="480" y="166" fill="#e8e4df" font-size="13">윈도우 기반 (window-based)</text>
  <text x="480" y="188" fill="rgb(138,133,128)" font-size="9.5">좋은 창 ÷ 전체 창. 창마다 한 표씩.</text>

  <!-- window blocks -->
  <rect x="480" y="204" width="30" height="30" fill="#cdeccf"/>
  <rect x="514" y="204" width="30" height="30" fill="#cdeccf"/>
  <rect x="548" y="204" width="30" height="30" fill="#f2d4d4"/>
  <rect x="582" y="204" width="30" height="30" fill="#cdeccf"/>
  <rect x="616" y="204" width="30" height="30" fill="#cdeccf"/>
  <rect x="650" y="204" width="30" height="30" fill="#cdeccf"/>
  <text x="694" y="224" fill="rgb(138,133,128)" font-size="9">…한 창은 한 표</text>

  <text x="480" y="258" fill="rgb(138,133,128)" font-size="9.5">창 안에서 실패가 몇 건이든 나쁜 창 <tspan fill="#e8e4df">한 표</tspan>입니다.</text>
  <text x="480" y="276" fill="rgb(138,133,128)" font-size="9.5">폭증의 규모가 계산에 들어오지 않습니다.</text>

  <rect x="480" y="292" width="360" height="62" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="660" y="316" fill="#e8e4df" font-size="12" text-anchor="middle" font-weight="700">95% 로 돌아오는 데 3.75시간</text>
  <text x="660" y="338" fill="rgb(212,168,83)" font-size="9" text-anchor="middle">좋은 창 15개(창당 15분)면 회복</text>

  <line x1="20" y1="392" x2="860" y2="392" stroke="rgb(42,37,32)"/>

  <text x="20" y="418" fill="#e8e4df" font-size="12">그래도 윈도우 기반이 늘 낫지는 않습니다</text>
  <text x="20" y="442" fill="rgb(138,133,128)" font-size="10">실패 요청이 곧 매출 손실인 결제 API 는 <tspan fill="#e8e4df">요청 기반</tspan>이 맞습니다 — 실패 한 건 한 건이 중요하니까요.</text>
  <text x="20" y="462" fill="rgb(138,133,128)" font-size="10">"몇 분 죽었나"가 더 중요한 Prometheus 자체 가용성은 <tspan fill="#e8e4df">윈도우 기반</tspan>이 맞습니다.</text>
  <text x="20" y="488" fill="rgb(138,133,128)" font-size="10">윈도우 기반은 데이터 해상도를 잃습니다 — 15분 창이면 30초마다 긁어도 판정은 15분에 한 번뿐입니다.</text>
  <text x="20" y="508" fill="rgb(138,133,128)" font-size="10">대개 두 방식을 <tspan fill="#e8e4df">섞어</tspan> 씁니다. 서비스 성격에 맞춰 고릅니다.</text>
</svg>

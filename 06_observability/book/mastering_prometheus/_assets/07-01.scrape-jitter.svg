<svg viewBox="0 0 760 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>스크레이프 지터가 블록을 키우는 과정</title>
  <desc>스크레이프 간격이 일정하면 타임스탬프의 델타의 델타가 0이 되어 압축 과정에서 타임스탬프가 사라진다. 간격이 몇 밀리초씩 흔들리면 델타의 델타가 0이 아니게 되어 샘플마다 타임스탬프를 저장해야 하고, 수백만 샘플이 쌓이면 블록마다 기가바이트 단위로 커진다.</desc>

  <rect x="0" y="0" width="760" height="360" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">스크레이프 지터</text>
  <text x="20" y="54" fill="#b8b3ad" font-size="10.5">세 번째부터 <tspan fill="#e8e4df">델타의 델타</tspan>만 저장</text>

  <!-- Row A: 정렬됨 -->
  <text x="20" y="106" fill="#e8e4df" font-size="11">정렬된 스크레이프</text>
  <line x1="170" y1="110" x2="710" y2="110" stroke="rgb(42,37,32)"/>
  <circle cx="170" cy="110" r="4" fill="rgb(212,168,83)"/>
  <circle cx="305" cy="110" r="4" fill="rgb(212,168,83)"/>
  <circle cx="440" cy="110" r="4" fill="rgb(212,168,83)"/>
  <circle cx="575" cy="110" r="4" fill="rgb(212,168,83)"/>
  <circle cx="710" cy="110" r="4" fill="rgb(212,168,83)"/>
  <text x="237" y="98" fill="#b8b3ad" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">30.000s</text>
  <text x="372" y="98" fill="#b8b3ad" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">30.000s</text>
  <text x="507" y="98" fill="#b8b3ad" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">30.000s</text>
  <text x="642" y="98" fill="#b8b3ad" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">30.000s</text>
  <text x="170" y="134" fill="rgb(212,168,83)" font-size="10">ΔΔ = 0 → 타임스탬프 삭제</text>

  <!-- Row B: 지터 -->
  <text x="20" y="186" fill="#e8e4df" font-size="11">지터가 있는 스크레이프</text>
  <line x1="170" y1="190" x2="710" y2="190" stroke="rgb(42,37,32)"/>
  <circle cx="170" cy="190" r="4" fill="#b8b3ad"/>
  <circle cx="308" cy="190" r="4" fill="#b8b3ad"/>
  <circle cx="438" cy="190" r="4" fill="#b8b3ad"/>
  <circle cx="578" cy="190" r="4" fill="#b8b3ad"/>
  <circle cx="708" cy="190" r="4" fill="#b8b3ad"/>
  <text x="239" y="178" fill="#b8b3ad" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">30.003s</text>
  <text x="373" y="178" fill="#b8b3ad" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">29.994s</text>
  <text x="508" y="178" fill="#b8b3ad" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">30.006s</text>
  <text x="643" y="178" fill="#b8b3ad" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">29.996s</text>
  <text x="170" y="214" fill="#e8e4df" font-size="10">ΔΔ ≠ 0 → 샘플마다 저장</text>

  <!-- 결과 -->
  <rect x="20" y="242" width="720" height="66" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="44" y="270" fill="#e8e4df" font-size="12">블록이 커집니다</text>
  <text x="44" y="292" fill="#b8b3ad" font-size="10">수백만 샘플이면 <tspan fill="rgb(212,168,83)" font-size="11">블록마다 GiB</tspan> 단위로 불어납니다</text>

  <text x="740" y="334" text-anchor="end" fill="#b8b3ad" font-size="10.5">기본 <tspan font-family="'JetBrains Mono', monospace" fill="rgb(212,168,83)">2ms</tspan> 안은 자동 정렬</text>
</svg>

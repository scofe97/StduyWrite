<svg viewBox="0 0 900 600" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif">
  <title>relabel 규칙이 후보를 걸러 내는 순서</title>
  <desc>서비스 디스커버리가 내놓은 파드 후보 500 개가 relabel_configs 의 규칙을 위에서 아래로 통과하며 줄어드는 과정이다. 첫 규칙은 keep 액션으로 지정한 라벨을 가진 파드만 남겨 500 개를 120 개로 줄이고, 둘째 규칙은 포트 이름이 http-metrics 인 엔드포인트만 남겨 40 개로 줄인다. 셋째 규칙은 keep 이나 drop 이 아니라 replace 이므로 후보 수를 바꾸지 않고 job 라벨의 값만 긴 자동 생성 이름에서 짧은 이름으로 덮어쓴다. 규칙은 위에서 아래로 차례로 적용되며 앞 규칙이 버린 후보는 뒤 규칙이 보지 못한다. 살아남은 40 개 타깃만 실제로 스크레이프된다.</desc>
  <rect width="900" height="600" fill="#0d0d0d"/>

  <defs>
    <marker id="fa1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
    <marker id="fa2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f44336"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">규칙은 위에서 아래로 후보를 거릅니다</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#b8b3ad">keep 은 수를 replace 는 값을</text>

  <!-- 후보 -->
  <rect x="40" y="76" width="300" height="72" rx="9" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.3"/>
  <text x="60" y="99" font-size="12.5" font-weight="700" fill="#e8e4df">SD 가 낸 후보</text>
  <rect x="60" y="110" width="140" height="24" rx="4" fill="#dceaf7"/>
  <text x="130" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#10243a">파드 500 개</text>
  <text x="212" y="127" font-size="10.5" fill="#b8b3ad">전부 후보입니다</text>

  <line x1="190" y1="156" x2="190" y2="184" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#fa1)"/>

  <!-- 규칙 1 -->
  <rect x="40" y="192" width="470" height="86" rx="9" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.6"/>
  <text x="60" y="215" font-size="12" font-weight="700" fill="rgb(212,168,83)">규칙 1. action: keep</text>
  <rect x="60" y="226" width="290" height="22" rx="4" fill="#fdf3df"/>
  <text x="205" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#3a2f10">__meta_kubernetes_service_label_...</text>
  <text x="60" y="266" font-size="10.5" fill="#b8b3ad">지정한 라벨이 붙은 것만 남깁니다</text>

  <line x1="518" y1="235" x2="556" y2="235" stroke="#f44336" stroke-width="1.4" marker-end="url(#fa2)"/>
  <rect x="564" y="222" width="296" height="26" rx="4" fill="#f2d4d4"/>
  <text x="712" y="240" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a1f1f">380 개 탈락 · 남의 팀 파드</text>

  <line x1="190" y1="286" x2="190" y2="314" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#fa1)"/>
  <rect x="212" y="288" width="128" height="22" rx="4" fill="#dceaf7"/>
  <text x="276" y="304" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">남은 후보 120</text>

  <!-- 규칙 2 -->
  <rect x="40" y="322" width="470" height="86" rx="9" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.6"/>
  <text x="60" y="345" font-size="12" font-weight="700" fill="rgb(212,168,83)">규칙 2. action: keep</text>
  <rect x="60" y="356" width="290" height="22" rx="4" fill="#fdf3df"/>
  <text x="205" y="372" text-anchor="middle" font-size="10" font-weight="700" fill="#3a2f10">__meta_kubernetes_..._port_name</text>
  <text x="60" y="396" font-size="10.5" fill="#b8b3ad">http-metrics 만 남깁니다</text>

  <line x1="518" y1="365" x2="556" y2="365" stroke="#f44336" stroke-width="1.4" marker-end="url(#fa2)"/>
  <rect x="564" y="352" width="296" height="26" rx="4" fill="#f2d4d4"/>
  <text x="712" y="370" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a1f1f">80 개 탈락 · 메트릭 포트 없음</text>

  <line x1="190" y1="416" x2="190" y2="444" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#fa1)"/>
  <rect x="212" y="418" width="128" height="22" rx="4" fill="#dceaf7"/>
  <text x="276" y="434" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">남은 후보 40</text>

  <!-- 규칙 3 -->
  <rect x="40" y="452" width="470" height="86" rx="9" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.6"/>
  <text x="60" y="475" font-size="12" font-weight="700" fill="#8ab6e0">규칙 3. replace</text>
  <rect x="60" y="486" width="290" height="22" rx="4" fill="#dceaf7"/>
  <text x="205" y="502" text-anchor="middle" font-size="10" font-weight="700" fill="#10243a">__meta_..._label_jobLabel</text>
  <text x="60" y="526" font-size="10.5" fill="#b8b3ad">수는 그대로이고 값만 덮어씁니다</text>

  <line x1="518" y1="495" x2="556" y2="495" stroke="#b8b3ad" stroke-width="1.4" marker-end="url(#fa1)"/>
  <rect x="564" y="482" width="296" height="26" rx="4" fill="#e6f7e7"/>
  <text x="712" y="500" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">job = node-exporter</text>

  <!-- 결과 -->
  <rect x="40" y="552" width="820" height="34" rx="9" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.3"/>
  <rect x="60" y="558" width="200" height="22" rx="4" fill="#e6f7e7"/>
  <text x="160" y="574" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">긁을 타깃 40 개</text>
  <text x="276" y="574" font-size="10.5" fill="#b8b3ad">버려진 후보는 뒤로 안 갑니다</text>
</svg>

<svg viewBox="0 0 880 500" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>promtool 과 Pint — 정적 검사와 살아있는 검사</title>
  <desc>promtool 은 규칙 파일을 오프라인에서 문법만 검사한다. 존재하지 않는 메트릭을 물어도 문법이 맞으면 통과시킨다. Pint 는 살아있는 Prometheus 에 붙어 PromQL 을 실제로 평가하므로, 문법은 맞지만 대응하는 시계열이 없는 규칙을 잡아낸다. 같은 규칙 파일이 promtool 은 통과, Pint 는 실패한다.</desc>

  <defs>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="pg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="500" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">같은 규칙 파일, 다른 판정 — promtool 은 통과시키고 Pint 는 잡습니다</text>
  <text x="20" y="54" fill="rgb(138,133,128)" font-size="10.5">차이는 하나입니다. promtool 은 파일만 보고 Pint 는 <tspan fill="#e8e4df">살아있는 Prometheus</tspan> 에 물어봅니다.</text>

  <!-- shared rule -->
  <rect x="330" y="74" width="220" height="52" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="440" y="94" fill="#e8e4df" font-size="10.5" text-anchor="middle">같은 규칙 하나</text>
  <text x="440" y="114" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">probe_success{job="blackbox_ssh"}</text>

  <line x1="380" y1="128" x2="230" y2="168" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#pg)"/>
  <line x1="500" y1="128" x2="650" y2="168" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#pa)"/>

  <!-- LEFT: promtool -->
  <rect x="20" y="176" width="400" height="196" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="40" y="202" fill="#e8e4df" font-size="13" font-family="'JetBrains Mono', monospace">promtool check rules</text>
  <text x="40" y="224" fill="rgb(138,133,128)" font-size="10">파일만 읽습니다. 네트워크 없음.</text>

  <text x="40" y="252" fill="rgb(138,133,128)" font-size="9.5">· YAML 형식이 맞는가</text>
  <text x="40" y="272" fill="rgb(138,133,128)" font-size="9.5">· 필수 키가 다 있는가</text>
  <text x="40" y="292" fill="rgb(138,133,128)" font-size="9.5">· PromQL 문법이 파싱되는가</text>

  <rect x="40" y="308" width="360" height="46" fill="#cdeccf"/>
  <text x="56" y="328" fill="#14521d" font-size="10.5" font-weight="700">SUCCESS: 1 rules found</text>
  <text x="56" y="345" fill="#14521d" font-size="9">문법이 맞으니 통과 — 메트릭이 있는지는 모릅니다</text>

  <!-- RIGHT: pint -->
  <rect x="460" y="176" width="400" height="196" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="480" y="202" fill="#e8e4df" font-size="13" font-family="'JetBrains Mono', monospace">pint lint</text>
  <text x="480" y="224" fill="rgb(138,133,128)" font-size="10">Prometheus 에 붙어 PromQL 을 실제로 평가합니다.</text>

  <text x="480" y="252" fill="rgb(138,133,128)" font-size="9.5">· promtool 이 보는 것 전부 +</text>
  <text x="480" y="272" fill="rgb(212,168,83)" font-size="9.5">· 이 메트릭의 시계열이 실제로 있는가</text>
  <text x="480" y="292" fill="rgb(212,168,83)" font-size="9.5">· 라벨 매칭·집계 라벨 보존이 맞는가</text>

  <rect x="480" y="308" width="360" height="46" fill="#f2d4d4"/>
  <text x="496" y="328" fill="#7a1f1f" font-size="10.5" font-weight="700">Bug: no series for probe_success</text>
  <text x="496" y="345" fill="#7a1f1f" font-size="9">문법은 맞지만 이 메트릭은 서버에 없습니다</text>

  <!-- pint -> prometheus -->
  <line x1="660" y1="372" x2="660" y2="404" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#pa)"/>
  <rect x="560" y="410" width="200" height="34" fill="rgb(26,26,26)" stroke="rgb(212,168,83)"/>
  <text x="660" y="432" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">localhost:9090 (살아있는 서버)</text>

  <!-- bottom line -->
  <line x1="20" y1="460" x2="860" y2="460" stroke="rgb(42,37,32)"/>
  <text x="20" y="482" fill="rgb(138,133,128)" font-size="10">그래서 Pint 는 CI 에서 실행하되 <tspan fill="#e8e4df">로컬 포트포워딩으로 Prometheus 에 닿을 수 있을 때</tspan> 진짜 값을 냅니다. 못 닿으면 이 살아있는 계층만 잃고, 정적 검사는 그대로 남습니다.</text>
</svg>

<svg viewBox="0 0 900 420" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif">
  <title>PSI 의 waiting 과 stalled 가 갈리는 분기 — CPU 에 stalled 가 없는 이유</title>
  <desc>PSI 가 자원 경합 지연을 waiting 과 stalled 두 범주로 가르는 기준을 분기 흐름으로 그린 도식이다. 출발점은 어떤 프로세스가 디스크나 메모리 같은 자원을 기다리느라 진행하지 못하는 상황이다. 여기서 스케줄러가 CPU 에 올릴 다른 일이 있는지를 묻는 분기가 갈린다. 다른 일을 찾아내면 waiting 이며 커널 문서의 some 라인에 해당한다. 이때 CPU 는 놀지 않으므로 비교적 정상이다. 아무 일도 찾지 못하면 stalled 이며 커널 문서의 full 라인에 해당한다. 경합에 막혀 CPU 사이클을 통째로 버리는 상태이므로 대개 심각한 문제의 징후다. 아래쪽은 이 분기가 CPU 자원에서는 성립하지 않는 이유를 보인다. CPU 를 기다린다는 말은 다른 무언가가 이미 CPU 에서 돌고 있다는 뜻이고, 그렇다면 무언가는 진행하고 있으므로 분기의 아니오 쪽으로 갈 수가 없다. 그래서 exporter 는 cpu 와 io 와 ioFull 과 mem 과 memFull 다섯 개의 서술자만 두고 cpuFull 은 만들지 않는다. 커널 문서도 CPU 의 full 은 시스템 수준에서 정의되지 않으며 5.13 이후로는 하위 호환을 위해 0 으로 보고된다고 적는다.</desc>
  <rect width="900" height="420" fill="#0d0d0d"/>

  <defs>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">waiting 과 stalled 갈림</text>

  <!-- 출발 -->
  <rect x="330" y="52" width="240" height="48" rx="6" fill="#dceaf7"/>
  <text x="450" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#10243a">자원을 기다려 진행 못 함</text>
  <text x="450" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#10243a">디스크 · 메모리 경합</text>

  <line x1="450" y1="106" x2="450" y2="128" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#pa)"/>

  <!-- 분기 -->
  <rect x="300" y="134" width="300" height="48" rx="6" fill="rgb(212,168,83)"/>
  <text x="450" y="154" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d0d0d">스케줄러가 다른 일을 찾는가</text>
  <text x="450" y="172" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">CPU 에 올릴 것이 남아 있는가</text>

  <!-- 좌우 분기선 -->
  <line x1="300" y1="158" x2="216" y2="158" stroke="#b8b3ad" stroke-width="1.5"/>
  <line x1="216" y1="158" x2="216" y2="212" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#pa)"/>
  <text x="228" y="196" font-size="11" font-weight="700" fill="#8fd694">찾음</text>

  <line x1="600" y1="158" x2="684" y2="158" stroke="#b8b3ad" stroke-width="1.5"/>
  <line x1="684" y1="158" x2="684" y2="212" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#pa)"/>
  <text x="624" y="196" font-size="11" font-weight="700" fill="#f4736a">못 찾음</text>

  <!-- waiting -->
  <rect x="44" y="218" width="344" height="76" rx="8" fill="#e6f7e7"/>
  <text x="68" y="242" font-size="13" font-weight="700" fill="#14521d">waiting</text>
  <text x="68" y="263" font-size="10.5" font-weight="700" fill="#14521d">CPU 는 놀지 않습니다</text>
  <text x="68" y="282" font-size="10.5" font-weight="700" fill="#14521d">some 라인 · 비교적 정상</text>

  <!-- stalled -->
  <rect x="512" y="218" width="344" height="76" rx="8" fill="#f2d4d4"/>
  <text x="536" y="242" font-size="13" font-weight="700" fill="#7a1f1f">stalled</text>
  <text x="536" y="263" font-size="10.5" font-weight="700" fill="#7a1f1f">CPU 사이클을 통째로 버립니다</text>
  <text x="536" y="282" font-size="10.5" font-weight="700" fill="#7a1f1f">full 라인 · 심각 신호</text>

  <!-- CPU 예외 -->
  <rect x="24" y="316" width="852" height="86" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.6"/>
  <text x="44" y="340" font-size="13" font-weight="700" fill="#8ab6e0">CPU 에는 stalled 가 없음</text>
  <rect x="44" y="360" width="400" height="30" rx="4" fill="#dceaf7"/>
  <text x="244" y="379" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">서술자 5개 · cpuFull 없음</text>
  <rect x="456" y="360" width="400" height="30" rx="4" fill="#f5edda"/>
  <text x="656" y="379" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">psi.rst — 5.13 이후 0</text>
</svg>

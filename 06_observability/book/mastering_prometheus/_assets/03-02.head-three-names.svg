<svg viewBox="0 0 900 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>head 가 붙은 세 이름 — 포함과 이동 관계</title>
  <desc>head 라는 말이 붙은 이름이 셋 있는데 서로 다른 것이다. head 블록은 메모리에 있는 블록 하나로 수집 중인 시계열 전부를 담는다. head chunk 는 그 head 블록 안에서 시계열마다 하나씩 자라는 활성 chunk 이며 역시 메모리에 있다. chunks_head 는 디스크의 디렉토리로, 다 자란 head chunk 가 flush 되어 쌓이는 곳이다. 따라서 head 블록이 head chunk 여럿을 품는 포함 관계이고, head chunk 가 chunks_head 로 내려가는 이동 관계다. head chunk 파일이라는 말은 성립하지 않는다. head chunk 는 메모리에 있고 파일이 되는 순간 그것은 chunks_head 세그먼트이기 때문이다.</desc>

  <rect x="0" y="0" width="900" height="300" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">head 가 붙은 셋은 서로 다릅니다</text>

  <!-- 메모리 영역 -->
  <rect x="24" y="52" width="530" height="150" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="38" y="70" fill="#b8b3ad" font-size="10">메모리</text>

  <!-- head 블록 (바깥) -->
  <rect x="40" y="80" width="498" height="104" fill="#0d0d0d" stroke="rgb(212,168,83)"/>
  <text x="56" y="100" fill="rgb(212,168,83)" font-size="12" font-weight="700">head 블록</text>
  <text x="150" y="100" fill="#b8b3ad" font-size="9">블록 하나 · 수집 중인 시계열 전부</text>

  <!-- head chunk 들 (안쪽 중첩) -->
  <rect x="56" y="112" width="106" height="56" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="109" y="132" style="fill:#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">head chunk</text>
  <text x="109" y="147" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">시계열 A</text>
  <text x="109" y="160" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">목표 120 샘플</text>

  <rect x="172" y="112" width="106" height="56" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="225" y="132" style="fill:#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">head chunk</text>
  <text x="225" y="147" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">시계열 B</text>

  <rect x="288" y="112" width="106" height="56" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="341" y="132" style="fill:#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">head chunk</text>
  <text x="341" y="147" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">시계열 C</text>

  <rect x="404" y="112" width="118" height="56" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="463" y="144" fill="#b8b3ad" font-size="9" text-anchor="middle">… 시계열마다 하나</text>

  <text x="40" y="196" fill="#b8b3ad" font-size="9">바깥이 안을 <tspan fill="#e8e4df">품습니다</tspan> — 포함 관계</text>

  <!-- 이동 화살표 -->
  <line x1="554" y1="140" x2="614" y2="140" stroke="rgb(212,168,83)" stroke-width="2"/>
  <path d="M614,137 L622,140 L614,143 Z" fill="rgb(212,168,83)"/>
  <text x="584" y="130" fill="#b8b3ad" font-size="9" text-anchor="middle">다 차면</text>
  <text x="584" y="158" fill="#b8b3ad" font-size="9" text-anchor="middle">flush</text>

  <!-- 디스크 영역 -->
  <rect x="632" y="52" width="244" height="150" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="646" y="70" fill="#b8b3ad" font-size="10">디스크</text>

  <rect x="648" y="80" width="212" height="104" fill="#0d0d0d" stroke="rgb(212,168,83)"/>
  <text x="664" y="100" fill="rgb(212,168,83)" font-size="12" font-weight="700">chunks_head/</text>
  <text x="664" y="116" fill="#b8b3ad" font-size="9">디렉토리 · 세그먼트 = 조각 파일</text>

  <rect x="664" y="126" width="180" height="18" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="674" y="139" style="fill:#10243a" font-size="8.5" font-family="'JetBrains Mono', monospace">000001  ≤128 MiB</text>
  <rect x="664" y="148" width="180" height="18" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="674" y="161" style="fill:#10243a" font-size="8.5" font-family="'JetBrains Mono', monospace">000002  ≤128 MiB</text>

  <text x="632" y="196" fill="#b8b3ad" font-size="9">안이 밖으로 <tspan fill="#e8e4df">내려갑니다</tspan> — 이동 관계</text>

  <!-- 결론 -->
  <line x1="24" y1="228" x2="876" y2="228" stroke="rgb(92,84,74)"/>
  <rect x="24" y="244" width="72" height="22" fill="#f44336" stroke="#f44336"/>
  <text x="60" y="259" style="fill:#e8e4df" font-size="10" text-anchor="middle" font-weight="700">성립 안 함</text>
  <text x="108" y="259" fill="#e8e4df" font-size="11">&quot;head chunk 파일&quot; 은 없습니다</text>
  <text x="108" y="280" fill="#b8b3ad" font-size="10">파일이 되면 <tspan fill="rgb(212,168,83)">chunks_head 세그먼트</tspan></text>
</svg>

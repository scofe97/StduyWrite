<svg viewBox="0 0 860 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>블록 하나의 파일 구조 — 디렉토리 하나가 독립 데이터베이스</title>
  <desc>데이터 디렉토리 안에서 ULID 이름의 블록 디렉토리 하나를 열면 index 파일, chunks 디렉토리, meta.json, tombstones 네 파일이 나온다. index 는 라벨로 chunk 위치를 찾는 역색인이고, chunks 디렉토리의 세그먼트 파일 하나는 그 자체가 chunk 가 아니라 서로 무관한 수많은 chunk 를 담는다. meta.json 은 블록의 ID 와 시간 범위, 통계를 담고, tombstones 는 읽을 때 무시할 시계열과 시간 범위를 담는다. 네 파일 중 tombstones 만 블록이 디스크에 쓰인 뒤에도 고쳐진다. 네 조각이 한 디렉토리에 모두 들어 있으므로 이 디렉토리 하나만으로 질의에 답할 수 있고, 보존 만료 시 디렉토리를 통째로 지우면 정리가 끝난다.</desc>

  <defs>
    <marker id="ba-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="470" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">블록 하나의 파일 구조</text>

  <!-- ================= 좌측: 실제 디렉토리 트리 ================= -->
  <text x="24" y="66" fill="#b8b3ad" font-size="10.5">디스크 위 실제 배치</text>

  <rect x="24" y="76" width="336" height="290" fill="#0d0d0d" stroke="rgb(92,84,74)"/>

  <text x="40" y="100" fill="#b8b3ad" font-size="10.5" font-family="'JetBrains Mono', monospace">/prometheus/data/</text>

  <!-- 블록 디렉토리 강조 경계 -->
  <rect x="40" y="112" width="304" height="140" fill="rgba(212,168,83,0.08)" stroke="rgb(212,168,83)" stroke-dasharray="5 4"/>

  <text x="52" y="132" fill="rgb(212,168,83)" font-size="10" font-family="'JetBrains Mono', monospace">├─ 01KYPGY9S4.../</text>
  <text x="52" y="152" fill="#e8e4df" font-size="10" font-family="'JetBrains Mono', monospace">│  ├─ index</text>
  <text x="290" y="152" fill="#b8b3ad" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="end">199,817 B</text>
  <text x="52" y="172" fill="#e8e4df" font-size="10" font-family="'JetBrains Mono', monospace">│  ├─ chunks/</text>
  <text x="52" y="192" fill="#e8e4df" font-size="10" font-family="'JetBrains Mono', monospace">│  │  └─ 000001</text>
  <text x="290" y="192" fill="#b8b3ad" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="end">333,513 B</text>
  <text x="52" y="212" fill="#e8e4df" font-size="10" font-family="'JetBrains Mono', monospace">│  ├─ meta.json</text>
  <text x="290" y="212" fill="#b8b3ad" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="end">697 B</text>
  <text x="52" y="232" fill="#e8e4df" font-size="10" font-family="'JetBrains Mono', monospace">│  └─ tombstones</text>
  <text x="290" y="232" fill="#b8b3ad" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="end">9 B</text>

  <text x="52" y="274" fill="#b8b3ad" font-size="10" font-family="'JetBrains Mono', monospace">├─ chunks_head/</text>
  <text x="52" y="294" fill="#b8b3ad" font-size="10" font-family="'JetBrains Mono', monospace">├─ wal/</text>
  <text x="52" y="314" fill="#b8b3ad" font-size="10" font-family="'JetBrains Mono', monospace">├─ lock</text>
  <text x="52" y="334" fill="#b8b3ad" font-size="10" font-family="'JetBrains Mono', monospace">└─ queries.active</text>

  <text x="40" y="356" fill="#b8b3ad" font-size="9.5">점선 = 블록 하나 · 이름은 ULID</text>

  <!-- 연결 화살표 -->
  <line x1="360" y1="182" x2="404" y2="182" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ba-arrow)"/>

  <!-- ================= 우측: 네 파일의 역할 ================= -->
  <text x="416" y="66" fill="#b8b3ad" font-size="10.5">각 파일이 맡는 일</text>

  <!-- 1. index -->
  <rect x="416" y="76" width="420" height="60" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="432" y="100" fill="#e8e4df" font-size="11.5">1. <tspan font-family="'JetBrains Mono', monospace">index</tspan></text>
  <text x="432" y="122" fill="#b8b3ad" font-size="10">라벨 → chunk 위치</text>
  <text x="820" y="122" fill="rgb(212,168,83)" font-size="9.5" text-anchor="end">역색인</text>

  <!-- 2. chunks -->
  <rect x="416" y="146" width="420" height="60" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="432" y="170" fill="#e8e4df" font-size="11.5">2. <tspan font-family="'JetBrains Mono', monospace">chunks/</tspan></text>
  <text x="432" y="192" fill="#b8b3ad" font-size="10">압축된 샘플 덩어리</text>
  <text x="820" y="192" fill="rgb(212,168,83)" font-size="9.5" text-anchor="end">세그먼트 ≤ 512 MiB</text>

  <!-- 3. meta.json -->
  <rect x="416" y="216" width="420" height="60" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="432" y="240" fill="#e8e4df" font-size="11.5">3. <tspan font-family="'JetBrains Mono', monospace">meta.json</tspan></text>
  <text x="432" y="262" fill="#b8b3ad" font-size="10">시간 범위 · 통계</text>
  <text x="820" y="262" fill="#b8b3ad" font-size="9.5" text-anchor="end">컴팩션 이력</text>

  <!-- 4. tombstones -->
  <rect x="416" y="286" width="420" height="60" fill="#0d0d0d" stroke="rgb(224,108,108)"/>
  <text x="432" y="310" fill="#e8e4df" font-size="11.5">4. <tspan font-family="'JetBrains Mono', monospace">tombstones</tspan></text>
  <text x="432" y="332" fill="#b8b3ad" font-size="10">무시할 시계열 · 범위</text>
  <text x="820" y="332" fill="rgb(224,108,108)" font-size="9.5" text-anchor="end">쓴 뒤 고쳐지는 유일</text>

  <!-- ================= 하단: 세그먼트 파일의 속 ================= -->
  <line x1="24" y1="386" x2="836" y2="386" stroke="rgb(92,84,74)"/>

  <text x="24" y="410" fill="#e8e4df" font-size="11">2.의 속 — 파일 하나 ≠ chunk 하나</text>

  <rect x="24" y="422" width="420" height="30" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="34" y="441" fill="#b8b3ad" font-size="9" font-family="'JetBrains Mono', monospace">000001</text>
  <rect x="96" y="428" width="40" height="18" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <rect x="142" y="428" width="40" height="18" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="188" y="428" width="40" height="18" fill="rgba(224,108,108,0.30)" stroke="rgb(224,108,108)"/>
  <rect x="234" y="428" width="40" height="18" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <rect x="280" y="428" width="40" height="18" fill="rgba(170,145,215,0.30)" stroke="rgb(170,145,215)"/>
  <rect x="326" y="428" width="40" height="18" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <text x="378" y="441" fill="#b8b3ad" font-size="9">수만 개 …</text>

  <text x="460" y="435" fill="#b8b3ad" font-size="10">칸 하나 = chunk 하나</text>
  <text x="460" y="452" fill="#b8b3ad" font-size="10">색이 다르면 다른 시계열</text>
</svg>

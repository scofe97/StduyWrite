<svg viewBox="0 0 860 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>단위 테스트의 알림 타임라인 — last_over_time 과 max_over_time 의 발화 시점</title>
  <desc>server1 의 probe_success 는 0분부터 3분까지 1이고 4분부터 0이다. 입력 시계열의 첫 값은 1분이 아니라 0분에 놓인다. last_over_time 은 창의 마지막 값만 보므로 서버가 멈춘 4분에 곧바로 0을 돌려주고, for 기간 5분을 채워 9분에 발화한다. max_over_time 은 5분 창의 최댓값을 보므로 창 안에 값 1이 하나라도 남아 있으면 1을 돌려준다. 마지막 1이 3분에 있고 범위 벡터는 왼쪽이 열린 구간이므로, 창이 3분을 벗어나는 첫 시점인 8분에야 0이 나온다. 거기서 for 5분을 더 채워 13분에 발화한다. 두 함수의 발화 시점 차이는 4분이며 이것이 max_over_time 을 쓸 때 치르는 대가다. promtool test rules v3.13.1 로 실측해 확인했으며, 원문이 적은 9분과 14분은 첫 샘플을 1분에 놓고 세어 한 칸씩 밀린 값이다.</desc>

  <rect x="0" y="0" width="860" height="380" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">서버가 4분에 멈췄을 때 두 함수는 언제 발화하는가</text>
  <text x="20" y="50" fill="#e8e4df" font-size="10.5">입력 시계열의 첫 값은 0분에 놓입니다 — 여기서 한 칸을 밀면 모든 계산이 어긋납니다</text>

  <!-- 경계선: 9분(x=510) last 발화 · 13분(x=670) max 발화 -->
  <line x1="510" y1="92" x2="510" y2="300" stroke="#66bb6a" stroke-width="1" stroke-dasharray="4 4" opacity="0.65"/>
  <line x1="670" y1="92" x2="670" y2="300" stroke="rgb(212,168,83)" stroke-width="1" stroke-dasharray="4 4" opacity="0.65"/>
  <text x="516" y="86" fill="#8fd694" font-size="10">9분 — last_over_time 발화</text>
  <text x="676" y="86" fill="rgb(212,168,83)" font-size="10">13분 — max_over_time 발화</text>

  <!-- 행 1: probe_success -->
  <text x="20" y="116" fill="#e8e4df" font-size="10" font-family="'JetBrains Mono', monospace">probe_success</text>
  <text x="150" y="116" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="190" y="116" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="230" y="116" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="270" y="116" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="310" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="350" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="390" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="430" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="470" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="510" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="550" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="590" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="630" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="670" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="710" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="750" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="790" y="116" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="136" y="136" fill="#e8e4df" font-size="9">0~3분이 1이고 4분부터 0입니다 — 마지막 1은 3분에 있습니다</text>

  <!-- 행 2: last_over_time -->
  <text x="20" y="166" fill="#8fd694" font-size="10" font-family="'JetBrains Mono', monospace">last_over_time [5m]</text>
  <text x="150" y="166" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="190" y="166" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="230" y="166" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="270" y="166" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="310" y="166" fill="#8fd694" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="350" y="166" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="390" y="166" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="430" y="166" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="470" y="166" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="510" y="166" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="550" y="166" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="590" y="166" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="630" y="166" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="670" y="166" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="710" y="166" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="750" y="166" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="790" y="166" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="136" y="186" fill="#8fd694" font-size="9">창의 마지막 값만 보므로 서버가 멈춘 4분에 곧바로 0이 됩니다</text>

  <!-- 행 3: max_over_time -->
  <text x="20" y="216" fill="rgb(212,168,83)" font-size="10" font-family="'JetBrains Mono', monospace">max_over_time [5m]</text>
  <text x="150" y="216" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="190" y="216" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="230" y="216" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="270" y="216" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="310" y="216" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="350" y="216" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="390" y="216" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="430" y="216" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="470" y="216" fill="rgb(212,168,83)" font-size="11" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="510" y="216" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="550" y="216" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="590" y="216" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="630" y="216" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="670" y="216" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="710" y="216" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="750" y="216" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="790" y="216" fill="#e8e4df" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="136" y="236" fill="rgb(212,168,83)" font-size="9">7분까지는 창 (t-5m, t] 안에 3분의 1이 남아 최댓값이 1입니다 — 8분에 벗어납니다</text>

  <!-- 행 4: 알림 상태 두 줄 -->
  <text x="20" y="266" fill="#8fd694" font-size="10">SSHDownLast</text>
  <rect x="136" y="252" width="352" height="20" fill="#0d0d0d" stroke="#5c544a"/>
  <text x="312" y="266" fill="#e8e4df" font-size="10" text-anchor="middle">inactive · pending (for: 5m)</text>
  <rect x="492" y="252" width="320" height="20" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="652" y="266" fill="#0d0d0d" font-size="10" font-weight="700" text-anchor="middle">firing</text>

  <text x="20" y="292" fill="rgb(212,168,83)" font-size="10">SSHDown</text>
  <rect x="136" y="278" width="512" height="20" fill="#0d0d0d" stroke="#5c544a"/>
  <text x="392" y="292" fill="#e8e4df" font-size="10" text-anchor="middle">inactive · pending (for: 5m)</text>
  <rect x="652" y="278" width="160" height="20" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="732" y="292" fill="#0d0d0d" font-size="10" font-weight="700" text-anchor="middle">firing</text>

  <!-- 축 -->
  <line x1="136" y1="312" x2="812" y2="312" stroke="rgb(42,37,32)"/>
  <text x="150" y="330" fill="#e8e4df" font-size="9" text-anchor="middle">0</text>
  <text x="310" y="330" fill="#e8e4df" font-size="9" text-anchor="middle">4</text>
  <text x="470" y="330" fill="rgb(212,168,83)" font-size="9" text-anchor="middle">8</text>
  <text x="510" y="330" fill="#8fd694" font-size="9" text-anchor="middle">9</text>
  <text x="630" y="330" fill="#e8e4df" font-size="9" text-anchor="middle">12</text>
  <text x="670" y="330" fill="rgb(212,168,83)" font-size="9" text-anchor="middle">13</text>
  <text x="790" y="330" fill="#e8e4df" font-size="9" text-anchor="middle">16</text>
  <text x="836" y="330" fill="#e8e4df" font-size="9" text-anchor="middle">분</text>

  <rect x="20" y="346" width="792" height="24" rx="4" fill="#fdf3df"/>
  <text x="32" y="362" fill="#3a2f10" font-size="10.5" font-weight="700">두 발화 시점의 차이 4분이 max_over_time 을 쓸 때 치르는 대가입니다 — promtool test rules v3.13.1 실측</text>
</svg>

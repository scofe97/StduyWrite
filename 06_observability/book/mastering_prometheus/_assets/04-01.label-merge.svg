<svg viewBox="0 0 900 560" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif">
  <title>앱이 보낸 라벨 위에 대상 라벨이 덧붙어 최종 시계열이 된다</title>
  <desc>스크레이프 응답과 저장된 시계열의 라벨 구성을 비교한다. 앱은 error, exception, method, outcome, status, uri 여섯 개 라벨을 붙여 메트릭을 내보낸다. Prometheus 는 그 라벨을 지우지 않고 relabeling 이 만든 대상 라벨 일곱 개를 덧붙인다. job, namespace, pod, container, service, endpoint, instance 가 그것이며 이 일곱 개는 같은 타깃에서 오는 모든 메트릭에 공통으로 붙는다. 메트릭 이름은 __name__ 라벨이 되므로 최종 시계열의 라벨은 여섯 더하기 일곱 더하기 하나로 열네 개다. 값 91 은 앱이 보낸 그대로 바뀌지 않는다.</desc>
  <rect width="900" height="560" fill="#0d0d0d"/>

  <defs>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
    <marker id="m2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">대상 라벨은 덧붙습니다</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#b8b3ad">앱이 보낸 라벨을 지우지 않습니다</text>

  <!-- 스크레이프 응답 -->
  <rect x="40" y="76" width="820" height="122" rx="9" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.6"/>
  <text x="58" y="99" font-size="12.5" font-weight="700" fill="#8fdc93">앱이 보낸 한 줄</text>
  <text x="700" y="99" text-anchor="end" font-size="10.5" fill="#b8b3ad">라벨 6 개</text>

  <rect x="58" y="110" width="784" height="24" rx="4" fill="#e6f7e7"/>
  <text x="450" y="127" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14521d" font-family="'JetBrains Mono', monospace">http_server_requests_seconds_count{error,exception,method,outcome,status,uri} 91</text>

  <text x="58" y="156" font-size="10.5" fill="#b8b3ad">앱이 자기 관심사로 붙인 축입니다</text>
  <rect x="58" y="164" width="126" height="22" rx="4" fill="#f2fbf3"/>
  <text x="121" y="179" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14521d">uri</text>
  <rect x="194" y="164" width="126" height="22" rx="4" fill="#f2fbf3"/>
  <text x="257" y="179" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14521d">status</text>
  <rect x="330" y="164" width="126" height="22" rx="4" fill="#f2fbf3"/>
  <text x="393" y="179" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14521d">method</text>
  <rect x="466" y="164" width="126" height="22" rx="4" fill="#f2fbf3"/>
  <text x="529" y="179" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14521d">outcome</text>
  <rect x="602" y="164" width="120" height="22" rx="4" fill="#f2fbf3"/>
  <text x="662" y="179" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14521d">exception</text>
  <rect x="732" y="164" width="110" height="22" rx="4" fill="#f2fbf3"/>
  <text x="787" y="179" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14521d">error</text>

  <line x1="450" y1="206" x2="450" y2="232" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#m2)"/>
  <text x="466" y="224" font-size="10.5" fill="rgb(212,168,83)">relabeling 결과를 덧붙입니다</text>

  <!-- 대상 라벨 -->
  <rect x="40" y="240" width="820" height="112" rx="9" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.6"/>
  <text x="58" y="263" font-size="12.5" font-weight="700" fill="rgb(212,168,83)">덧붙는 대상 라벨</text>
  <text x="842" y="263" text-anchor="end" font-size="10.5" fill="#b8b3ad">라벨 7 개</text>
  <text x="58" y="283" font-size="10.5" fill="#b8b3ad">같은 타깃의 모든 메트릭에 공통입니다</text>

  <rect x="58" y="292" width="108" height="22" rx="4" fill="#fdf3df"/>
  <text x="112" y="307" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">job</text>
  <rect x="176" y="292" width="108" height="22" rx="4" fill="#fdf3df"/>
  <text x="230" y="307" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">namespace</text>
  <rect x="294" y="292" width="108" height="22" rx="4" fill="#fdf3df"/>
  <text x="348" y="307" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">pod</text>
  <rect x="412" y="292" width="108" height="22" rx="4" fill="#fdf3df"/>
  <text x="466" y="307" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">container</text>
  <rect x="530" y="292" width="108" height="22" rx="4" fill="#fdf3df"/>
  <text x="584" y="307" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">service</text>
  <rect x="648" y="292" width="98" height="22" rx="4" fill="#fdf3df"/>
  <text x="697" y="307" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">endpoint</text>
  <rect x="756" y="292" width="86" height="22" rx="4" fill="#fdf3df"/>
  <text x="799" y="307" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">instance</text>

  <text x="58" y="338" font-size="10.5" fill="#b8b3ad">겹치면 대상 라벨이 이깁니다</text>

  <line x1="450" y1="360" x2="450" y2="386" stroke="#66bb6a" stroke-width="1.6" marker-end="url(#m1)"/>

  <!-- 저장된 시계열 -->
  <rect x="40" y="394" width="820" height="130" rx="9" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.6"/>
  <text x="58" y="417" font-size="12.5" font-weight="700" fill="#8ab6e0">저장된 시계열</text>
  <text x="842" y="417" text-anchor="end" font-size="10.5" fill="#e8e4df">라벨 14 개</text>

  <rect x="58" y="428" width="784" height="24" rx="4" fill="#dceaf7"/>
  <text x="450" y="445" text-anchor="middle" font-size="9" font-weight="700" fill="#10243a" font-family="'JetBrains Mono', monospace">{__name__, error, exception, method, outcome, status, uri, job, namespace, pod, container, service, endpoint, instance} 91</text>

  <rect x="58" y="462" width="250" height="22" rx="4" fill="#f4f9fd"/>
  <text x="183" y="477" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10243a">6 + 7 + 1 = 14</text>
  <rect x="318" y="462" width="250" height="22" rx="4" fill="#f4f9fd"/>
  <text x="443" y="477" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10243a">값 91 은 그대로입니다</text>
  <rect x="578" y="462" width="264" height="22" rx="4" fill="#f4f9fd"/>
  <text x="710" y="477" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10243a">메트릭 이름도 라벨입니다</text>

  <text x="58" y="503" font-size="10.5" fill="#b8b3ad">라벨 수는 메트릭마다 다릅니다</text>
</svg>

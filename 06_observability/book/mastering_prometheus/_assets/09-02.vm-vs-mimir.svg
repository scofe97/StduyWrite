<svg viewBox="0 0 880 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>VictoriaMetrics 와 Mimir — 저장 기질과 HA 중복 제거의 갈림</title>
  <desc>둘 다 remote write 를 받고 PromQL 로 질의되지만, VictoriaMetrics 는 로컬 디스크나 블록 스토리지에만 쓰고 Mimir 는 오브젝트 스토리지에만 쓴다. HA 중복 제거도 갈린다. VictoriaMetrics 는 두 Prometheus 의 external label 이 같아야 하고, Mimir 는 리더를 선출해 비선출 복제본의 데이터를 버린다.</desc>

  <defs>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="gr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="470" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">같은 문제, 두 갈래 답 — 무엇에 쓰느냐가 비용을 가릅니다</text>
  <text x="20" y="54" fill="rgb(138,133,128)" font-size="10.5">둘 다 <tspan font-family="'JetBrains Mono', monospace">remote_write</tspan> 를 받고 PromQL 로 질의됩니다. 갈리는 곳은 <tspan fill="#e8e4df">저장 기질</tspan>과 <tspan fill="#e8e4df">HA 중복 제거</tspan>입니다.</text>

  <!-- Prometheus HA pair -->
  <rect x="20" y="86" width="150" height="90" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="95" y="110" fill="#e8e4df" font-size="11" text-anchor="middle">Prometheus HA</text>
  <text x="95" y="132" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">replica-0</text>
  <text x="95" y="150" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">replica-1</text>
  <text x="95" y="168" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">같은 타깃을 긁습니다</text>

  <line x1="174" y1="112" x2="212" y2="112" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#am)"/>
  <line x1="174" y1="150" x2="212" y2="292" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#am)"/>

  <!-- VictoriaMetrics -->
  <rect x="220" y="80" width="300" height="146" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="236" y="104" fill="rgb(212,168,83)" font-size="12.5">VictoriaMetrics</text>
  <text x="236" y="126" fill="rgb(138,133,128)" font-size="9.5">HA 중복 제거 방식</text>
  <rect x="236" y="136" width="268" height="30" fill="#dceaf7"/>
  <text x="370" y="155" fill="#10243a" font-size="9.5" text-anchor="middle" font-weight="700">두 복제본의 external label 이 같아야 합니다</text>
  <text x="236" y="184" fill="rgb(138,133,128)" font-size="9">그래서 <tspan font-family="'JetBrains Mono', monospace" fill="#e8e4df">prometheus_replica</tspan> 라벨을 지웁니다</text>
  <text x="236" y="204" fill="rgb(138,133,128)" font-size="9">중복 샘플은 저장 단계에서 걸러집니다</text>

  <line x1="524" y1="152" x2="562" y2="152" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#am)"/>

  <rect x="570" y="118" width="290" height="68" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="715" y="142" fill="#e8e4df" font-size="11.5" text-anchor="middle">로컬 디스크 · 블록 스토리지</text>
  <text x="715" y="163" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">EBS 같은 볼륨. 오브젝트 스토리지는 못 씁니다</text>
  <text x="715" y="179" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle">샘플당 약 0.3 바이트 — 저장 효율이 높습니다</text>

  <!-- Mimir -->
  <rect x="220" y="260" width="300" height="146" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="236" y="284" fill="rgb(212,168,83)" font-size="12.5">Grafana Mimir</text>
  <text x="236" y="306" fill="rgb(138,133,128)" font-size="9.5">HA 중복 제거 방식</text>
  <rect x="236" y="316" width="268" height="30" fill="#f5edda"/>
  <text x="370" y="335" fill="#3a2f10" font-size="9.5" text-anchor="middle" font-weight="700">리더를 뽑고 나머지 복제본은 버립니다</text>
  <text x="236" y="364" fill="rgb(138,133,128)" font-size="9">리더가 30초 침묵하면 다른 복제본으로 넘깁니다</text>
  <text x="236" y="384" fill="rgb(138,133,128)" font-size="9">그 사이 데이터는 불가피하게 유실됩니다</text>

  <line x1="524" y1="332" x2="562" y2="332" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#am)"/>

  <rect x="570" y="298" width="290" height="68" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="715" y="322" fill="#e8e4df" font-size="11.5" text-anchor="middle">오브젝트 스토리지</text>
  <text x="715" y="343" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">S3 · GCS · Azure Blob. 로컬 디스크는 평가용뿐</text>
  <text x="715" y="359" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle">샘플당 약 2 바이트 — 대신 훨씬 쌉니다</text>

  <!-- bottom takeaway -->
  <line x1="20" y1="428" x2="860" y2="428" stroke="rgb(42,37,32)"/>
  <text x="20" y="452" fill="rgb(138,133,128)" font-size="10.5">사소해 보이는 저장 기질의 차이가 <tspan fill="#e8e4df">비용과 확장성</tspan>을 가릅니다. 오브젝트 스토리지가 훨씬 싸므로 Mimir 는 같은 값으로 더 오래 보관합니다.</text>
</svg>

<svg viewBox="0 0 900 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>꼬리 지연 — 분포의 오른쪽 끝이 왜 꼬리인가</title>
  <desc>응답 시간 100 건을 빠른 것부터 느린 것까지 늘어놓으면 대부분이 왼쪽 낮은 구간에 몰리고 오른쪽으로 길고 얇게 늘어진다. 이 늘어진 부분이 꼬리다. 평균은 요청이 몰린 왼쪽 근처에 찍혀 꼬리를 반영하지 못하지만, p99 는 꼬리 안쪽에 찍혀 가장 느린 사용자의 경험을 그대로 드러낸다. 꼬리에 있는 요청은 수가 적어 평균에 거의 영향을 주지 못하므로, 평균만 보면 장애를 놓친다.</desc>

  <rect x="0" y="0" width="900" height="360" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">왜 &quot;꼬리&quot; 라고 부르는가</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="10">응답 시간 100 건을 빠른 순으로 늘어놓았을 때의 분포입니다.</text>

  <!-- 축 -->
  <line x1="70" y1="250" x2="820" y2="250" stroke="rgb(92,84,74)"/>
  <line x1="70" y1="90" x2="70" y2="250" stroke="rgb(92,84,74)"/>
  <text x="34" y="120" fill="rgb(138,133,128)" font-size="9">요청</text>
  <text x="34" y="132" fill="rgb(138,133,128)" font-size="9">건수</text>
  <text x="828" y="254" fill="rgb(138,133,128)" font-size="9">느림 →</text>
  <text x="76" y="272" fill="rgb(138,133,128)" font-size="9">빠름</text>

  <!-- 분포 막대: 왼쪽에 몰리고 오른쪽으로 길게 -->
  <rect x="86" y="170" width="26" height="80" fill="rgb(212,168,83)"/>
  <rect x="116" y="120" width="26" height="130" fill="rgb(212,168,83)"/>
  <rect x="146" y="100" width="26" height="150" fill="rgb(212,168,83)"/>
  <rect x="176" y="134" width="26" height="116" fill="rgb(212,168,83)"/>
  <rect x="206" y="168" width="26" height="82" fill="rgb(212,168,83)"/>
  <rect x="236" y="196" width="26" height="54" fill="rgb(212,168,83)"/>
  <rect x="266" y="214" width="26" height="36" fill="rgb(212,168,83)"/>
  <rect x="296" y="226" width="26" height="24" fill="rgb(212,168,83)"/>
  <rect x="326" y="234" width="26" height="16" fill="rgb(212,168,83)"/>
  <rect x="356" y="238" width="26" height="12" fill="rgb(212,168,83)"/>
  <rect x="386" y="241" width="26" height="9" fill="rgb(212,168,83)"/>
  <rect x="416" y="243" width="26" height="7" fill="rgb(212,168,83)"/>
  <rect x="446" y="244" width="26" height="6" fill="rgb(212,168,83)"/>
  <rect x="476" y="245" width="26" height="5" fill="rgb(212,168,83)"/>
  <rect x="506" y="245" width="26" height="5" fill="rgb(212,168,83)"/>
  <rect x="536" y="246" width="26" height="4" fill="rgb(212,168,83)"/>
  <rect x="566" y="246" width="26" height="4" fill="rgb(212,168,83)"/>
  <rect x="596" y="246" width="26" height="4" fill="rgb(212,168,83)"/>
  <rect x="626" y="247" width="26" height="3" fill="rgb(212,168,83)"/>
  <rect x="656" y="247" width="26" height="3" fill="rgb(212,168,83)"/>
  <rect x="686" y="247" width="26" height="3" fill="rgb(212,168,83)"/>
  <rect x="716" y="247" width="26" height="3" fill="rgb(212,168,83)"/>
  <rect x="746" y="248" width="26" height="2" fill="rgb(212,168,83)"/>
  <rect x="776" y="248" width="26" height="2" fill="rgb(212,168,83)"/>

  <!-- 꼬리 영역 표시 -->
  <line x1="386" y1="262" x2="802" y2="262" stroke="#f44336" stroke-width="1.5"/>
  <line x1="386" y1="257" x2="386" y2="267" stroke="#f44336" stroke-width="1.5"/>
  <line x1="802" y1="257" x2="802" y2="267" stroke="#f44336" stroke-width="1.5"/>
  <text x="594" y="284" fill="#f44336" font-size="11" font-weight="700" text-anchor="middle">꼬리 (tail)</text>
  <text x="594" y="300" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">건수는 적지만 가장 오래 기다린 사람들</text>

  <!-- 평균 위치 -->
  <line x1="215" y1="90" x2="215" y2="250" stroke="#dceaf7" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="150" y="70" width="130" height="20" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="215" y="84" style="fill:#10243a" font-size="10" font-weight="700" text-anchor="middle">평균 0.2 초</text>

  <!-- p99 위치 -->
  <line x1="746" y1="90" x2="746" y2="250" stroke="#66bb6a" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="686" y="70" width="120" height="20" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="746" y="84" style="fill:#0d0d0d" font-size="10" font-weight="700" text-anchor="middle">p99 10 초</text>

  <!-- 결론 -->
  <line x1="24" y1="316" x2="876" y2="316" stroke="rgb(92,84,74)"/>
  <text x="24" y="340" fill="#e8e4df" font-size="11">평균은 <tspan fill="#dceaf7" font-weight="700">몰린 쪽</tspan>에 끌려가 꼬리를 못 봅니다. p99 는 <tspan fill="#66bb6a" font-weight="700">꼬리 안</tspan>에 찍혀 가장 나쁜 경험을 드러냅니다.</text>
</svg>

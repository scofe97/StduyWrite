<svg viewBox="0 0 900 450" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>대량 삽입에서 갈리는 것 — 쓰기 증폭</title>
  <desc>메트릭은 초당 수천 건이 끊임없이 들어온다. RDB 에 넣으면 행 하나마다 인덱스 갱신과 WAL 기록과 락 획득이 따라붙어 실제 디스크 작업이 삽입 건수보다 몇 배로 불어난다. 이것을 쓰기 증폭이라 한다. TSDB 는 스크레이프 한 번을 배치 하나로 묶어 커밋하고, 메모리에 덧붙인 뒤 WAL 은 32 킬로바이트 페이지가 찰 때만 내려보낸다. 인덱스는 두 시간에 한 번 블록을 만들 때 한꺼번에 생성하므로 삽입 경로에 인덱스 갱신이 없다. 결과적으로 삽입이 잦을수록 두 방식의 차이가 벌어진다.</desc>

  <defs>
    <marker id="wr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f44336"/>
    </marker>
    <marker id="wg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="450" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">삽입이 잦을수록 벌어집니다 — 쓰기 증폭</text>
  <text x="24" y="52" fill="#b8b3ad" font-size="10">같은 입력 — 시계열 5 만 개 × 15 초 = 초당 3,333 샘플</text>

  <!-- RDB -->
  <text x="24" y="86" fill="#f44336" font-size="12" font-weight="700">RDB — 행 하나마다 딸려 오는 일</text>
  <rect x="24" y="98" width="852" height="132" fill="#0d0d0d" stroke="#f44336"/>

  <rect x="44" y="118" width="120" height="40" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="104" y="134" style="fill:#7a1f1f" font-size="9.5" text-anchor="middle" font-weight="700">INSERT 1 행</text>
  <text x="104" y="149" style="fill:#7a1f1f" font-size="8.5" text-anchor="middle">샘플 하나</text>

  <line x1="172" y1="138" x2="200" y2="138" stroke="#f44336" stroke-width="2" marker-end="url(#wr)"/>

  <rect x="208" y="112" width="150" height="24" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="283" y="128" style="fill:#7a1f1f" font-size="8.5" text-anchor="middle">1. 인덱스 갱신 (B-tree)</text>
  <rect x="208" y="140" width="150" height="24" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="283" y="156" style="fill:#7a1f1f" font-size="8.5" text-anchor="middle">2. WAL 기록</text>
  <rect x="208" y="168" width="150" height="24" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="283" y="184" style="fill:#7a1f1f" font-size="8.5" text-anchor="middle">3. 락 획득·해제</text>

  <text x="376" y="132" fill="#f44336" font-size="10" font-weight="700">삽입 1 건 → 디스크 작업 여러 건</text>
  <text x="376" y="150" fill="#b8b3ad" font-size="9">= <tspan fill="#e8e4df">쓰기 증폭(write amplification)</tspan></text>
  <text x="376" y="168" fill="#b8b3ad" font-size="9">인덱스가 커질수록 페이지 분할도 늘어납니다</text>

  <rect x="628" y="112" width="230" height="80" fill="#f44336" stroke="#f44336"/>
  <text x="743" y="138" style="fill:#e8e4df" font-size="10" text-anchor="middle" font-weight="700">초당 3,333 번</text>
  <text x="743" y="156" style="fill:#e8e4df" font-size="9" text-anchor="middle">앞의 셋을 반복합니다</text>
  <text x="743" y="176" style="fill:#e8e4df" font-size="8.5" text-anchor="middle">멈추지 않는 부하</text>

  <text x="44" y="216" fill="#b8b3ad" font-size="9">배치 INSERT 로 줄여도 <tspan fill="#e8e4df">인덱스 갱신은 행마다</tspan></text>

  <!-- TSDB -->
  <text x="24" y="266" fill="#66bb6a" font-size="12" font-weight="700">TSDB — 스크레이프 한 번이 배치 하나</text>
  <rect x="24" y="278" width="852" height="132" fill="#0d0d0d" stroke="#66bb6a"/>

  <rect x="44" y="298" width="120" height="40" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="104" y="314" style="fill:#0d0d0d" font-size="9.5" text-anchor="middle" font-weight="700">스크레이프 1 회</text>
  <text x="104" y="329" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">샘플 5 만 개</text>

  <line x1="172" y1="318" x2="200" y2="318" stroke="#66bb6a" stroke-width="2" marker-end="url(#wg)"/>

  <rect x="208" y="292" width="150" height="24" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="283" y="308" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">1. 메모리 chunk 에 덧붙임</text>
  <rect x="208" y="320" width="150" height="24" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="283" y="336" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">2. WAL 버퍼에 담기</text>
  <rect x="208" y="348" width="150" height="24" fill="#0d0d0d" stroke="rgb(92,84,74)" stroke-dasharray="3 3"/>
  <text x="283" y="364" fill="#b8b3ad" font-size="8.5" text-anchor="middle">3. 인덱스 — 없음</text>

  <text x="376" y="312" fill="#66bb6a" font-size="10" font-weight="700">커밋 1 번으로 5 만 개를 한꺼번에</text>
  <text x="376" y="330" fill="#b8b3ad" font-size="9">WAL <tspan fill="#e8e4df">write 는 32 KiB 페이지가 찰 때만</tspan> (샘플 ~2,000 개마다)</text>
  <text x="376" y="348" fill="#b8b3ad" font-size="9">인덱스는 <tspan fill="#e8e4df">2 시간에 한 번</tspan> 블록 만들 때 한꺼번에</text>

  <rect x="628" y="292" width="230" height="80" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="743" y="318" style="fill:#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">15 초에 한 번</text>
  <text x="743" y="336" style="fill:#0d0d0d" font-size="9" text-anchor="middle">커밋합니다</text>
  <text x="743" y="356" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">삽입 경로가 거의 비어 있음</text>

  <text x="44" y="396" fill="#b8b3ad" font-size="9">비싼 일은 전부 <tspan fill="#e8e4df">2 시간에 한 번</tspan> 으로</text>

  <!-- 결론 -->
  <line x1="24" y1="424" x2="876" y2="424" stroke="rgb(92,84,74)"/>
  <text x="24" y="444" fill="#b8b3ad" font-size="10">삽입이 <tspan fill="#66bb6a" font-weight="700">잦을수록</tspan> 격차가 커집니다</text>
</svg>

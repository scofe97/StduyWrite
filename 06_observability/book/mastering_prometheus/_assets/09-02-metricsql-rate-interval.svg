<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="rate(x[5m]) 를 계산할 때 PromQL 은 5분 구간 안의 샘플만 보고, MetricsQL 은 구간이 시작되기 직전의 마지막 샘플까지 끌어와 함께 계산한다. 그래서 두 엔진의 결과가 갈린다">
  <rect width="740" height="330" fill="#0d0d0d"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">rate(x[5m]) — PromQL vs MetricsQL 구간 해석</text>

  <!-- shared time axis geometry: interval box from x=250 to x=620 -->
  <!-- PromQL row -->
  <text x="40" y="72" font-size="14" font-weight="700" fill="#8ab6e0">PromQL — 구간 안의 샘플만</text>
  <line x1="60" y1="120" x2="680" y2="120" stroke="#6b6660" stroke-width="1.5"/>
  <text x="688" y="124" font-size="11" fill="#8a8580">time</text>
  <!-- interval shaded region -->
  <rect x="250" y="88" width="370" height="46" fill="#10243a" opacity="0.55"/>
  <line x1="250" y1="84" x2="250" y2="138" stroke="#5b9bd5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="620" y1="84" x2="620" y2="138" stroke="#5b9bd5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="435" y="150" text-anchor="middle" font-size="11" fill="#8ab6e0">[5m] 구간</text>
  <!-- samples: one before interval (grey/excluded), several inside -->
  <circle cx="200" cy="120" r="6" fill="#0d0d0d" stroke="#8a8580" stroke-width="2"/>
  <text x="200" y="104" text-anchor="middle" font-size="10" fill="#8a8580">제외</text>
  <circle cx="290" cy="120" r="6" fill="#5b9bd5"/>
  <circle cx="380" cy="120" r="6" fill="#5b9bd5"/>
  <circle cx="470" cy="120" r="6" fill="#5b9bd5"/>
  <circle cx="560" cy="120" r="6" fill="#5b9bd5"/>

  <!-- MetricsQL row -->
  <text x="40" y="212" font-size="14" font-weight="700" fill="#8fdc93">MetricsQL — 구간 직전 샘플까지 포함</text>
  <line x1="60" y1="260" x2="680" y2="260" stroke="#6b6660" stroke-width="1.5"/>
  <text x="688" y="264" font-size="11" fill="#8a8580">time</text>
  <rect x="250" y="228" width="370" height="46" fill="#14330a" opacity="0.6"/>
  <line x1="250" y1="224" x2="250" y2="278" stroke="#66bb6a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="620" y1="224" x2="620" y2="278" stroke="#66bb6a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="435" y="290" text-anchor="middle" font-size="11" fill="#8fdc93">[5m] 구간</text>
  <!-- the before-sample now included (green, highlighted) -->
  <circle cx="200" cy="260" r="7" fill="#66bb6a"/>
  <text x="200" y="244" text-anchor="middle" font-size="10" font-weight="700" fill="#8fdc93">포함 ★</text>
  <circle cx="290" cy="260" r="6" fill="#66bb6a"/>
  <circle cx="380" cy="260" r="6" fill="#66bb6a"/>
  <circle cx="470" cy="260" r="6" fill="#66bb6a"/>
  <circle cx="560" cy="260" r="6" fill="#66bb6a"/>

  <text x="370" y="318" text-anchor="middle" font-size="11.5" fill="#8a8580">스크레이프 간격이 성길수록 그 한 점의 비중이 커져 두 엔진의 값이 눈에 띄게 갈립니다. 옳고 그름이 아니라 트레이드오프 차이.</text>
</svg>

<svg viewBox="0 0 880 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Thanos 오브젝트 스토리지 블록의 일생</title>
  <desc>Prometheus 의 로컬 압축을 끄면 2시간짜리 블록만 쌓이고, Sidecar 가 compaction.level 이 1 인 블록만 오브젝트 스토리지로 올린다. Compactor 가 그것을 수평 압축해 블록 span 을 키우고, span 이 40시간을 넘으면 5분 해상도로, 10일을 넘으면 1시간 해상도로 다운샘플링한다. 다운샘플링은 원본을 지우지 않고 블록을 새로 만들므로 저장 용량은 오히려 늘어난다.</desc>

  <defs>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="470" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">오브젝트 스토리지 블록의 일생 — 다운샘플링은 용량을 늘립니다</text>
  <text x="20" y="54" fill="rgb(138,133,128)" font-size="10.5">Prometheus 의 로컬 압축을 <tspan fill="#e8e4df">꺼야</tspan> Sidecar 가 블록을 올릴 수 있습니다. 압축은 Compactor 가 대신 맡습니다.</text>

  <!-- 1. Prometheus -->
  <rect x="20" y="86" width="176" height="96" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="108" y="110" fill="#e8e4df" font-size="11.5" text-anchor="middle">① Prometheus</text>
  <text x="108" y="132" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">로컬 압축 비활성</text>
  <text x="108" y="150" fill="rgb(212,168,83)" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">min=max=2h</text>
  <text x="108" y="170" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">2시간 블록만 생깁니다</text>

  <line x1="200" y1="134" x2="238" y2="134" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#at)"/>

  <!-- 2. Sidecar -->
  <rect x="246" y="86" width="176" height="96" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="334" y="110" fill="#e8e4df" font-size="11.5" text-anchor="middle">② Sidecar 가 올림</text>
  <text x="334" y="134" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">이 조건인 블록만 보냅니다</text>
  <rect x="262" y="144" width="144" height="22" fill="#dceaf7"/>
  <text x="334" y="159" fill="#10243a" font-size="9" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', monospace">compaction.level == 1</text>

  <line x1="426" y1="134" x2="464" y2="134" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#at)"/>

  <!-- 3. Compactor horizontal -->
  <rect x="472" y="86" width="196" height="96" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="570" y="110" fill="#e8e4df" font-size="11.5" text-anchor="middle">③ Compactor — 수평 압축</text>
  <text x="570" y="132" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">시간이 겹치지 않는 블록을</text>
  <text x="570" y="150" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">이어 붙여 <tspan fill="#e8e4df">span 을 키웁니다</tspan></text>
  <text x="570" y="170" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">인덱스 하나로 합쳐 작아집니다</text>

  <line x1="672" y1="134" x2="710" y2="134" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#at)"/>

  <rect x="718" y="98" width="142" height="72" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="789" y="122" fill="#e8e4df" font-size="10.5" text-anchor="middle">블록 span 이</text>
  <text x="789" y="142" fill="rgb(212,168,83)" font-size="10.5" text-anchor="middle">40시간을 넘으면</text>
  <text x="789" y="160" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">비로소 다운샘플링 대상</text>

  <!-- downsample chain -->
  <line x1="789" y1="174" x2="789" y2="206" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#at)"/>

  <line x1="20" y1="222" x2="860" y2="222" stroke="rgb(42,37,32)"/>
  <text x="20" y="248" fill="#e8e4df" font-size="12">④ 다운샘플링 — 블록을 <tspan fill="rgb(212,168,83)">지우지 않고 새로 만듭니다</tspan></text>

  <!-- three blocks stacked -->
  <rect x="20" y="266" width="260" height="40" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="34" y="284" fill="#e8e4df" font-size="10" font-family="'JetBrains Mono', monospace">raw</text>
  <text x="34" y="300" fill="rgb(138,133,128)" font-size="9">원본 해상도 — 그대로 남습니다</text>
  <rect x="196" y="274" width="72" height="24" fill="rgb(212,168,83)"/>
  <text x="232" y="290" fill="#0d0d0d" font-size="9" text-anchor="middle" font-weight="700">보관</text>

  <text x="292" y="290" fill="rgb(138,133,128)" font-size="11">＋</text>

  <rect x="316" y="266" width="260" height="40" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="330" y="284" fill="#e8e4df" font-size="10" font-family="'JetBrains Mono', monospace">5m</text>
  <text x="330" y="300" fill="rgb(138,133,128)" font-size="9">span &gt; 40시간이면 생성</text>
  <rect x="492" y="274" width="72" height="24" fill="rgb(212,168,83)"/>
  <text x="528" y="290" fill="#0d0d0d" font-size="9" text-anchor="middle" font-weight="700">추가</text>

  <text x="588" y="290" fill="rgb(138,133,128)" font-size="11">＋</text>

  <rect x="612" y="266" width="248" height="40" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="626" y="284" fill="#e8e4df" font-size="10" font-family="'JetBrains Mono', monospace">1h</text>
  <text x="626" y="300" fill="rgb(138,133,128)" font-size="9">span &gt; 10일이면 생성</text>
  <rect x="776" y="274" width="72" height="24" fill="rgb(212,168,83)"/>
  <text x="812" y="290" fill="#0d0d0d" font-size="9" text-anchor="middle" font-weight="700">추가</text>

  <rect x="20" y="326" width="840" height="52" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="40" y="348" fill="#e8e4df" font-size="11">인덱스 크기는 거의 그대로인데 블록이 셋으로 늘어납니다.</text>
  <text x="40" y="368" fill="rgb(212,168,83)" font-size="10.5">다운샘플링의 목적은 용량 절감이 아니라 <tspan fill="#e8e4df">긴 구간 쿼리의 속도</tspan>입니다. 용량은 두세 배로 늡니다.</text>

  <!-- footnote -->
  <line x1="20" y1="400" x2="860" y2="400" stroke="rgb(42,37,32)"/>
  <text x="20" y="424" fill="rgb(138,133,128)" font-size="10">40시간·10일은 데이터의 <tspan fill="#e8e4df">나이</tspan>가 아니라 블록이 덮는 <tspan fill="#e8e4df">시간 폭(span)</tspan> 입니다. 수평 압축으로 span 이 자라야 다운샘플링이 시작됩니다.</text>
  <text x="20" y="446" fill="rgb(138,133,128)" font-size="10">그래서 <tspan font-family="'JetBrains Mono', monospace" fill="rgb(212,168,83)">--retention.resolution-raw</tspan> 를 40시간보다 짧게 주면 Compactor 가 아예 뜨지 않습니다.</text>
</svg>

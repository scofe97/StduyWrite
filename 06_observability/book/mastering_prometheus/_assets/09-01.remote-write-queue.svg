<svg viewBox="0 0 880 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>remote write 의 큐와 샤드 구조</title>
  <desc>remote write 대상마다 메모리에 큐가 하나 생기고, 큐는 동적인 개수의 샤드로 나뉜다. 각 샤드는 capacity 만큼 샘플을 담고 max_samples_per_send 에 이르면 배치를 보낸다. 샤드 하나라도 가득 차면 Prometheus 는 WAL 읽기를 멈추므로 전체 처리량이 정지한다.</desc>

  <defs>
    <marker id="a9" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="r9" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e57373"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="440" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">remote write — 큐 하나, 샤드 여럿, 그리고 하나가 막으면 전부 멈춥니다</text>
  <text x="20" y="54" fill="rgb(138,133,128)" font-size="10.5">샤드 수는 Prometheus 가 유입 속도를 보고 <tspan fill="#e8e4df">계속 다시 계산</tspan>합니다. 우리가 정하는 것은 상한과 하한뿐입니다.</text>

  <!-- WAL -->
  <rect x="20" y="92" width="104" height="150" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="72" y="120" fill="#e8e4df" font-size="12" text-anchor="middle">WAL</text>
  <text x="72" y="144" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">2시간마다</text>
  <text x="72" y="160" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">잘려 나갑니다</text>
  <text x="72" y="192" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">그 전에 샤드가</text>
  <text x="72" y="207" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">다시 흐르면</text>
  <text x="72" y="224" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle">유실 없습니다</text>

  <line x1="128" y1="150" x2="164" y2="150" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#a9)"/>
  <text x="146" y="140" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">읽기</text>

  <!-- Queue box -->
  <rect x="172" y="80" width="330" height="176" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="337" y="102" fill="#e8e4df" font-size="12" text-anchor="middle">큐 (대상 1개당 1개)</text>

  <!-- shards -->
  <rect x="190" y="118" width="294" height="34" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="204" y="139" fill="rgb(138,133,128)" font-size="10" font-family="'JetBrains Mono', monospace">shard 0</text>
  <rect x="272" y="126" width="120" height="16" fill="rgb(212,168,83)"/>
  <text x="470" y="139" fill="rgb(138,133,128)" font-size="9" text-anchor="end">보내는 중</text>

  <rect x="190" y="160" width="294" height="34" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="204" y="181" fill="rgb(138,133,128)" font-size="10" font-family="'JetBrains Mono', monospace">shard 1</text>
  <rect x="272" y="168" width="160" height="16" fill="#e57373"/>
  <text x="352" y="181" fill="#0d0d0d" font-size="9" text-anchor="middle" font-weight="700">capacity 가득 참</text>

  <rect x="190" y="202" width="294" height="34" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="204" y="223" fill="rgb(138,133,128)" font-size="10" font-family="'JetBrains Mono', monospace">shard 2</text>
  <rect x="272" y="210" width="62" height="16" fill="rgb(212,168,83)"/>
  <text x="470" y="223" fill="rgb(138,133,128)" font-size="9" text-anchor="end">여유 있음</text>

  <!-- block arrow back to WAL: routed outside the queue box -->
  <path d="M337 268 L146 268 L146 168" fill="none" stroke="#e57373" stroke-width="1.6" marker-end="url(#r9)"/>
  <text x="352" y="272" fill="#e57373" font-size="10">샤드 하나가 차면 WAL 읽기가 멈추고 처리량이 0 이 됩니다</text>

  <line x1="506" y1="168" x2="542" y2="168" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#a9)"/>

  <!-- destination -->
  <rect x="550" y="118" width="310" height="76" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="705" y="144" fill="#e8e4df" font-size="12" text-anchor="middle">remote write 대상</text>
  <text x="705" y="168" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">VictoriaMetrics · Mimir · Cortex …</text>
  <text x="705" y="184" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">protobuf + snappy over HTTP</text>

  <!-- send triggers -->
  <text x="550" y="222" fill="#e8e4df" font-size="10.5">배치를 보내는 계기는 둘입니다</text>
  <text x="564" y="242" fill="rgb(138,133,128)" font-size="9.5">① 샤드에 <tspan font-family="'JetBrains Mono', monospace" fill="rgb(212,168,83)">max_samples_per_send</tspan> 만큼 쌓이거나</text>
  <text x="564" y="260" fill="rgb(138,133,128)" font-size="9.5">② <tspan font-family="'JetBrains Mono', monospace" fill="rgb(212,168,83)">batch_send_deadline</tspan> 이 지나거나</text>

  <!-- defaults table -->
  <line x1="20" y1="300" x2="860" y2="300" stroke="rgb(42,37,32)"/>
  <text x="20" y="324" fill="#e8e4df" font-size="11.5">기본값은 책이 쓰인 뒤 바뀌었습니다 (<tspan font-family="'JetBrains Mono', monospace">v2.44.0</tspan>)</text>

  <text x="30" y="352" fill="rgb(138,133,128)" font-size="9.5" font-family="'JetBrains Mono', monospace">설정</text>
  <text x="250" y="352" fill="rgb(138,133,128)" font-size="9.5">책 (v2.26~v2.43)</text>
  <text x="400" y="352" fill="rgb(212,168,83)" font-size="9.5">현재 (v2.44~)</text>
  <line x1="30" y1="360" x2="520" y2="360" stroke="rgb(42,37,32)"/>

  <text x="30" y="378" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">max_shards</text>
  <text x="250" y="378" fill="rgb(138,133,128)" font-size="9.5">200</text>
  <text x="400" y="378" fill="rgb(212,168,83)" font-size="9.5">50</text>

  <text x="30" y="396" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">capacity</text>
  <text x="250" y="396" fill="rgb(138,133,128)" font-size="9.5">2500</text>
  <text x="400" y="396" fill="rgb(212,168,83)" font-size="9.5">10000</text>

  <text x="30" y="414" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">max_samples_per_send</text>
  <text x="250" y="414" fill="rgb(138,133,128)" font-size="9.5">500</text>
  <text x="400" y="414" fill="rgb(212,168,83)" font-size="9.5">2000</text>

  <rect x="560" y="336" width="300" height="86" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="710" y="360" fill="#e8e4df" font-size="10.5" text-anchor="middle">샤드 메모리는 이렇게 늡니다</text>
  <text x="710" y="384" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">샤드 수 × (capacity + max_samples)</text>
  <text x="710" y="408" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">capacity 를 올리면 max_shards 를 내립니다</text>
</svg>

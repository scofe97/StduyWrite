<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="다운샘플링 판정 기준은 데이터의 나이가 아니라 블록이 덮는 시간 폭이다. Prometheus 가 내놓는 2시간 블록은 아무리 오래된 데이터를 담아도 대상이 아니며, 수평 압축이 span 을 40시간 너머로 키운 뒤에야 5m 해상도로 다운샘플링된다">
  <rect width="740" height="400" fill="#0d0d0d"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">다운샘플링 트리거 — 나이가 아니라 블록의 시간 폭</text>

  <defs>
    <marker id="dr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8a8580"/></marker>
  </defs>

  <!-- CASE 1: old but narrow -->
  <rect x="30" y="52" width="330" height="150" rx="10" fill="#0d0d0d" stroke="#8a8580" stroke-width="1.3"/>
  <text x="48" y="76" font-size="13" font-weight="700" fill="#c9c4be">① 오래됐지만 폭이 좁은 블록</text>
  <text x="48" y="96" font-size="11.5" fill="#8a8580">Prometheus 가 갓 올린 2시간 블록</text>
  <!-- narrow block -->
  <rect x="60" y="112" width="46" height="30" rx="4" fill="#dceaf7"/>
  <text x="83" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#10243a">2h</text>
  <text x="120" y="132" font-size="12" fill="#c9c4be">span = 2h  &lt;  40h</text>
  <rect x="60" y="156" width="270" height="30" rx="6" fill="#3a1414"/>
  <text x="195" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#f0a0a0">다운샘플링 안 됨 (데이터가 1년 전이어도)</text>

  <!-- CASE 2: compacted wide -->
  <rect x="380" y="52" width="330" height="150" rx="10" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.3"/>
  <text x="398" y="76" font-size="13" font-weight="700" fill="#8fdc93">② 수평 압축으로 폭이 커진 블록</text>
  <text x="398" y="96" font-size="11.5" fill="#8a8580">2h 블록 여럿을 이어 붙인 결과</text>
  <rect x="410" y="112" width="230" height="30" rx="4" fill="#66bb6a"/>
  <text x="525" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#0d0d0d">span &gt; 40h</text>
  <rect x="410" y="156" width="270" height="30" rx="6" fill="#e6f7e7"/>
  <text x="545" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#14521d">5m 해상도로 다운샘플링 대상</text>

  <!-- order arrow -->
  <line x1="200" y1="220" x2="200" y2="252" stroke="#8a8580" stroke-width="1.6" marker-end="url(#dr)"/>
  <text x="215" y="243" font-size="12" fill="#c9c4be">수평 압축이 먼저</text>

  <!-- pipeline -->
  <rect x="30" y="258" width="680" height="58" rx="10" fill="#f5edda"/>
  <text x="48" y="282" font-size="13" font-weight="700" fill="#3a2f10">순서가 고정된 이유</text>
  <text x="48" y="304" font-size="12" fill="#3a2f10">2h 블록 → [수평 압축] → span 40h 초과 → [다운샘플링 5m] → span 10d 초과 → [다운샘플링 1h]</text>

  <!-- source note -->
  <rect x="30" y="330" width="680" height="56" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.2"/>
  <text x="48" y="352" font-size="11.5" font-weight="700" fill="#8ab6e0">소스 근거 (v0.32.5, cmd/thanos/downsample.go)</text>
  <text x="48" y="372" font-size="11" fill="#c9c4be">if m.MaxTime-m.MinTime &lt; ResLevel1DownsampleRange { continue }  ·  "roughly 2 chunks out of it" 보장</text>
</svg>

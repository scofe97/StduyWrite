<svg viewBox="0 0 880 500" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>블록 하나의 일생</title>
  <desc>블록은 2시간짜리로 태어나 컴팩션으로 합쳐지며 6시간, 18시간, 54시간으로 3배씩 자란다. 컴팩션은 1분마다 계획을 세우는데 겹치는 블록, 다음 단계를 만들 만큼 모인 작은 블록, 툼스톤이 5퍼센트를 넘은 블록 순으로 우선순위를 본다. 한 계획은 세 조건 중 하나만 다룬다. 합쳐질 때는 기존 파일을 고치지 않고 새 블록을 통째로 쓴 뒤 부모 블록 디렉토리를 지우며, 부모의 ULID 는 새 블록 meta.json 의 sources 에 남는다. 보존도 1분마다 도는데 관심사는 삭제다. 시간 임계나 크기 임계 중 먼저 걸리는 쪽이 적용되며, 블록의 최대 시각을 기준으로 오래된 블록부터 폴더째 삭제한다. 삭제가 이렇게 간단한 이유는 블록이 독립된 데이터베이스여서 밖에서 그 안을 가리키는 참조가 없기 때문이다. 사용자 삭제 요청은 이와 달리 블록 일부만 지우는 일이라 툼스톤 표시만 남기고 실제 제거는 컴팩션까지 미룬다.</desc>

  <defs>
    <marker id="cf-amber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="cf-red" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(224,108,108)"/>
    </marker>
    <marker id="cf-gray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="500" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">블록 하나의 일생</text>

  <!-- ===== 상단: 컴팩션 사다리 ===== -->
  <text x="24" y="66" fill="#b8b3ad" font-size="10.5">1. 컴팩션 — 작은 블록을 합쳐 3배씩 키웁니다</text>

  <!-- 2h 블록 셋 -->
  <rect x="24" y="80" width="52" height="40" fill="rgba(212,168,83,0.20)" stroke="rgb(212,168,83)"/>
  <text x="50" y="99" fill="#e8e4df" font-size="9" text-anchor="middle">2h</text>
  <text x="50" y="112" fill="#b8b3ad" font-size="8" text-anchor="middle">L0</text>

  <rect x="82" y="80" width="52" height="40" fill="rgba(212,168,83,0.20)" stroke="rgb(212,168,83)"/>
  <text x="108" y="99" fill="#e8e4df" font-size="9" text-anchor="middle">2h</text>
  <text x="108" y="112" fill="#b8b3ad" font-size="8" text-anchor="middle">L0</text>

  <rect x="140" y="80" width="52" height="40" fill="rgba(212,168,83,0.20)" stroke="rgb(212,168,83)"/>
  <text x="166" y="99" fill="#e8e4df" font-size="9" text-anchor="middle">2h</text>
  <text x="166" y="112" fill="#b8b3ad" font-size="8" text-anchor="middle">L0</text>

  <line x1="200" y1="100" x2="238" y2="100" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#cf-amber)"/>
  <text x="219" y="92" fill="rgb(212,168,83)" font-size="8.5" text-anchor="middle">3개 이상</text>

  <rect x="244" y="80" width="96" height="40" fill="rgba(212,168,83,0.28)" stroke="rgb(212,168,83)"/>
  <text x="292" y="99" fill="#e8e4df" font-size="9.5" text-anchor="middle">6h</text>
  <text x="292" y="112" fill="#b8b3ad" font-size="8" text-anchor="middle">level 2</text>

  <line x1="346" y1="100" x2="380" y2="100" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#cf-amber)"/>

  <rect x="386" y="80" width="120" height="40" fill="rgba(212,168,83,0.34)" stroke="rgb(212,168,83)"/>
  <text x="446" y="99" fill="#e8e4df" font-size="9.5" text-anchor="middle">18h</text>
  <text x="446" y="112" fill="#b8b3ad" font-size="8" text-anchor="middle">level 3</text>

  <line x1="512" y1="100" x2="546" y2="100" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#cf-amber)"/>

  <rect x="552" y="80" width="150" height="40" fill="rgba(212,168,83,0.40)" stroke="rgb(212,168,83)"/>
  <text x="627" y="99" fill="#e8e4df" font-size="9.5" text-anchor="middle">54h</text>
  <text x="627" y="112" fill="#b8b3ad" font-size="8" text-anchor="middle">level 4</text>

  <text x="716" y="97" fill="#b8b3ad" font-size="9">상한 —</text>
  <text x="716" y="111" fill="#b8b3ad" font-size="9">보존의 10% 또는 31일</text>

  <text x="24" y="140" fill="#b8b3ad" font-size="9">부모 ULID 는 <tspan font-family="'JetBrains Mono', monospace" fill="#b8b3ad">sources</tspan> 에</text>

  <!-- ===== 중단: 계획 우선순위 ===== -->
  <line x1="24" y1="158" x2="856" y2="158" stroke="rgb(92,84,74)"/>
  <text x="24" y="182" fill="#b8b3ad" font-size="10.5">2. 1분마다 계획을 세웁니다 — 한 번에 한 조건만</text>

  <rect x="24" y="194" width="264" height="56" fill="rgba(224,108,108,0.14)" stroke="rgb(224,108,108)"/>
  <text x="40" y="215" fill="rgb(224,108,108)" font-size="9.5" font-weight="700">1순위 · 겹치는 블록</text>
  <text x="40" y="235" fill="#b8b3ad" font-size="8.5">겹치면 질의마다 중복 제거가 필요해 비쌉니다</text>

  <rect x="308" y="194" width="264" height="56" fill="rgba(212,168,83,0.14)" stroke="rgb(212,168,83)"/>
  <text x="324" y="215" fill="rgb(212,168,83)" font-size="9.5" font-weight="700">2순위 · 작은 블록이 모임</text>
  <text x="324" y="235" fill="#b8b3ad" font-size="8.5">2h 셋 이상 → 다음 단계로 (위 사다리)</text>

  <rect x="592" y="194" width="264" height="56" fill="rgba(102,187,106,0.14)" stroke="rgb(102,187,106)"/>
  <text x="608" y="215" fill="rgb(102,187,106)" font-size="9.5" font-weight="700">3순위 · 툼스톤 5% 초과</text>
  <text x="608" y="235" fill="#b8b3ad" font-size="8.5">어차피 새로 쓰는 김에 빼고 씁니다</text>

  <!-- ===== 하단: 보존 ===== -->
  <line x1="24" y1="268" x2="856" y2="268" stroke="rgb(92,84,74)"/>
  <text x="24" y="292" fill="#b8b3ad" font-size="10.5">3. 보존 — 역시 1분마다, 관심사는 삭제입니다</text>

  <!-- 시간축 -->
  <text x="24" y="318" fill="#b8b3ad" font-size="9">오래됨</text>
  <text x="856" y="318" fill="#b8b3ad" font-size="9" text-anchor="end">최신</text>

  <rect x="24" y="326" width="96" height="38" fill="rgba(224,108,108,0.28)" stroke="rgb(224,108,108)" stroke-dasharray="4 3"/>
  <text x="72" y="350" fill="#e8e4df" font-size="9" text-anchor="middle">54h</text>

  <rect x="126" y="326" width="96" height="38" fill="rgba(224,108,108,0.28)" stroke="rgb(224,108,108)" stroke-dasharray="4 3"/>
  <text x="174" y="350" fill="#e8e4df" font-size="9" text-anchor="middle">54h</text>

  <line x1="236" y1="318" x2="236" y2="372" stroke="rgb(224,108,108)" stroke-width="2"/>
  <text x="244" y="336" fill="rgb(224,108,108)" font-size="9">보존 컷오프</text>

  <rect x="252" y="326" width="120" height="38" fill="rgba(212,168,83,0.22)" stroke="rgb(212,168,83)"/>
  <text x="312" y="350" fill="#e8e4df" font-size="9" text-anchor="middle">18h</text>

  <rect x="378" y="326" width="120" height="38" fill="rgba(212,168,83,0.22)" stroke="rgb(212,168,83)"/>
  <text x="438" y="350" fill="#e8e4df" font-size="9" text-anchor="middle">18h</text>

  <rect x="504" y="326" width="96" height="38" fill="rgba(212,168,83,0.22)" stroke="rgb(212,168,83)"/>
  <text x="552" y="350" fill="#e8e4df" font-size="9" text-anchor="middle">6h</text>

  <rect x="606" y="326" width="96" height="38" fill="rgba(212,168,83,0.22)" stroke="rgb(212,168,83)"/>
  <text x="654" y="350" fill="#e8e4df" font-size="9" text-anchor="middle">6h</text>

  <rect x="708" y="326" width="52" height="38" fill="rgba(212,168,83,0.20)" stroke="rgb(212,168,83)"/>
  <text x="734" y="350" fill="#e8e4df" font-size="9" text-anchor="middle">2h</text>

  <rect x="766" y="326" width="52" height="38" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="792" y="345" fill="#b8b3ad" font-size="8.5" text-anchor="middle">head</text>
  <text x="792" y="357" fill="#b8b3ad" font-size="7.5" text-anchor="middle">메모리</text>

  <text x="24" y="386" fill="rgb(224,108,108)" font-size="9">← 폴더째 삭제 (rm -r)</text>

  <text x="24" y="410" fill="#b8b3ad" font-size="9.5">판정 기준은 <tspan font-weight="700" fill="#e8e4df">블록의 최대 시각</tspan></text>

  <!-- 두 임계 -->
  <rect x="24" y="424" width="404" height="52" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="40" y="444" fill="#e8e4df" font-size="9.5">시간 임계 · 크기 임계 — <tspan fill="rgb(212,168,83)" font-weight="700">먼저 걸리는 쪽</tspan>이 적용</text>
  <text x="40" y="464" fill="#b8b3ad" font-size="8.5">크기만 설정하면 15일 기본값은 따라오지 않습니다</text>

  <rect x="452" y="424" width="404" height="52" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="468" y="444" fill="#e8e4df" font-size="9.5">삭제가 간단한 이유 — <tspan fill="rgb(102,187,106)" font-weight="700">밖에서 가리키는 참조가 없음</tspan></text>
  <text x="468" y="464" fill="#b8b3ad" font-size="8.5">블록은 독립된 데이터베이스 · chunk 참조는 블록 안에서만 유효</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="Thanos Receive 의 쓰기 쿼럼은 소스상 floor(RF/2)+1 이고 책의 (RF+1)/2 와는 짝수 복제 계수에서 전부 어긋난다. 홀수에서는 일치한다">
  <rect width="740" height="400" fill="#0d0d0d"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">Receive 쓰기 쿼럼 — 소스 vs 책</text>

  <!-- formula row -->
  <rect x="40" y="50" width="310" height="46" rx="8" fill="#66bb6a"/>
  <text x="195" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#0d0d0d">소스 (v0.32.5)</text>
  <text x="195" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#14330a">floor(RF / 2) + 1</text>

  <rect x="390" y="50" width="310" height="46" rx="8" fill="#3a1414"/>
  <text x="545" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#f0a0a0">책</text>
  <text x="545" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#f0a0a0">( RF + 1 ) / 2</text>

  <!-- table header -->
  <text x="70" y="128" font-size="12" font-weight="700" fill="#8a8580">RF</text>
  <text x="200" y="128" font-size="12" font-weight="700" fill="#8fdc93">소스</text>
  <text x="330" y="128" font-size="12" font-weight="700" fill="#f0a0a0">책</text>
  <text x="470" y="128" font-size="12" font-weight="700" fill="#8a8580">판정</text>
  <line x1="55" y1="136" x2="690" y2="136" stroke="#6b6660" stroke-width="1"/>

  <!-- rows: RF 1..6 -->
  <!-- RF1 ok -->
  <text x="70" y="160" font-size="12.5" fill="#c9c4be">1</text>
  <text x="200" y="160" font-size="12.5" fill="#c9c4be">1</text>
  <text x="330" y="160" font-size="12.5" fill="#c9c4be">1</text>
  <text x="470" y="160" font-size="12.5" font-weight="700" fill="#8fdc93">일치 (홀수)</text>
  <!-- RF2 mismatch -->
  <rect x="55" y="168" width="635" height="26" rx="4" fill="#2a1010"/>
  <text x="70" y="186" font-size="12.5" font-weight="700" fill="#e8e4df">2</text>
  <text x="200" y="186" font-size="12.5" font-weight="700" fill="#8fdc93">2</text>
  <text x="330" y="186" font-size="12.5" fill="#f0a0a0">1</text>
  <text x="470" y="186" font-size="12.5" font-weight="700" fill="#f0a0a0">어긋남 (짝수)</text>
  <!-- RF3 ok -->
  <text x="70" y="212" font-size="12.5" fill="#c9c4be">3</text>
  <text x="200" y="212" font-size="12.5" fill="#c9c4be">2</text>
  <text x="330" y="212" font-size="12.5" fill="#c9c4be">2</text>
  <text x="470" y="212" font-size="12.5" font-weight="700" fill="#8fdc93">일치 (홀수) ← 책의 예시</text>
  <!-- RF4 mismatch -->
  <rect x="55" y="220" width="635" height="26" rx="4" fill="#2a1010"/>
  <text x="70" y="238" font-size="12.5" font-weight="700" fill="#e8e4df">4</text>
  <text x="200" y="238" font-size="12.5" font-weight="700" fill="#8fdc93">3</text>
  <text x="330" y="238" font-size="12.5" fill="#f0a0a0">2</text>
  <text x="470" y="238" font-size="12.5" font-weight="700" fill="#f0a0a0">어긋남 (짝수)</text>
  <!-- RF5 ok -->
  <text x="70" y="264" font-size="12.5" fill="#c9c4be">5</text>
  <text x="200" y="264" font-size="12.5" fill="#c9c4be">3</text>
  <text x="330" y="264" font-size="12.5" fill="#c9c4be">3</text>
  <text x="470" y="264" font-size="12.5" font-weight="700" fill="#8fdc93">일치 (홀수)</text>
  <!-- RF6 mismatch -->
  <rect x="55" y="272" width="635" height="26" rx="4" fill="#2a1010"/>
  <text x="70" y="290" font-size="12.5" font-weight="700" fill="#e8e4df">6</text>
  <text x="200" y="290" font-size="12.5" font-weight="700" fill="#8fdc93">4</text>
  <text x="330" y="290" font-size="12.5" fill="#f0a0a0">3</text>
  <text x="470" y="290" font-size="12.5" font-weight="700" fill="#f0a0a0">어긋남 (짝수)</text>

  <!-- conclusion -->
  <rect x="40" y="312" width="660" height="34" rx="7" fill="#f5edda"/>
  <text x="370" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a2f10">홀수 RF 는 언제나 일치 · 짝수 RF 는 소스가 노드를 하나 더 요구합니다</text>

  <!-- exception -->
  <rect x="40" y="356" width="660" height="32" rx="7" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.2"/>
  <text x="56" y="377" font-size="11.5" fill="#8ab6e0">예외 — 이미 복제된 요청(seriesReplicated)이면 쿼럼이 1 로 내려갑니다 (복제 증폭 방지)</text>
</svg>

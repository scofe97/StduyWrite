<svg viewBox="0 0 900 620" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif">
  <title>Prometheus Operator 가 CRD 를 실제 리소스로 만드는 흐름</title>
  <desc>사용자가 Prometheus, Alertmanager, ServiceMonitor, PrometheusRule 커스텀 리소스를 apply 하면 쿠버네티스 API 서버에 저장된다. Operator 는 이 리소스들을 watch 하고 있다가 변경을 감지해 조정 루프를 돈다. Prometheus 리소스는 StatefulSet 으로, ServiceMonitor 는 스크레이프 잡 설정으로, PrometheusRule 은 룰 파일로 번역된다. 번역 결과인 prometheus.yaml 은 Secret 에 저장되고 룰 파일은 ConfigMap 에 저장되며, 두 가지 모두 Prometheus 파드에 볼륨으로 마운트된다. 파드 안의 config-reloader 사이드카가 마운트된 파일의 변경을 감지해 Prometheus 에 재적재를 요청하므로 파드를 다시 시작하지 않아도 설정이 반영된다. 사용자가 CR 을 고칠 때마다 이 루프가 다시 돌기 때문에 설정 파일을 직접 편집할 필요가 없다.</desc>
  <rect width="900" height="620" fill="#0d0d0d"/>

  <defs>
    <marker id="ra1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
    <marker id="ra2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">Operator 조정 루프</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#b8b3ad">CR 을 쓰면 실제 리소스가 생깁니다</text>

  <!-- 1. 사용자 CR -->
  <rect x="36" y="76" width="828" height="92" rx="9" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.6"/>
  <text x="56" y="99" font-size="12.5" font-weight="700" fill="#8fdc93">1. 사용자가 CR 을 apply</text>
  <rect x="56" y="110" width="176" height="24" rx="4" fill="#e6f7e7"/>
  <text x="144" y="127" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">Prometheus</text>
  <rect x="240" y="110" width="176" height="24" rx="4" fill="#e6f7e7"/>
  <text x="328" y="127" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">Alertmanager</text>
  <rect x="424" y="110" width="200" height="24" rx="4" fill="#e6f7e7"/>
  <text x="524" y="127" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">ServiceMonitor</text>
  <rect x="632" y="110" width="212" height="24" rx="4" fill="#e6f7e7"/>
  <text x="738" y="127" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">PrometheusRule</text>
  <text x="56" y="157" font-size="10.5" fill="#b8b3ad">API 서버에 저장만 됩니다</text>

  <line x1="450" y1="176" x2="450" y2="204" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#ra1)"/>
  <text x="466" y="196" font-size="10.5" fill="#b8b3ad">watch</text>

  <!-- 2. Operator -->
  <rect x="36" y="212" width="828" height="76" rx="9" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.6"/>
  <text x="56" y="235" font-size="12.5" font-weight="700" fill="#8ab6e0">2. Operator 가 변경을 감지</text>
  <rect x="56" y="246" width="240" height="24" rx="4" fill="#dceaf7"/>
  <text x="176" y="263" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">있어야 할 상태와 비교</text>
  <text x="312" y="263" font-size="10.5" fill="#b8b3ad">다르면 맞출 때까지 반복합니다</text>

  <line x1="450" y1="296" x2="450" y2="324" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#ra2)"/>
  <text x="466" y="316" font-size="10.5" fill="rgb(212,168,83)">번역</text>

  <!-- 3. 번역 결과 -->
  <rect x="36" y="332" width="828" height="118" rx="9" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.6"/>
  <text x="56" y="355" font-size="12.5" font-weight="700" fill="rgb(212,168,83)">3. 실제 리소스로 번역</text>

  <rect x="56" y="368" width="248" height="60" rx="6" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.1"/>
  <text x="72" y="387" font-size="10.5" fill="#b8b3ad">Prometheus CR</text>
  <rect x="72" y="396" width="216" height="22" rx="4" fill="#fdf3df"/>
  <text x="180" y="412" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">StatefulSet · 파드</text>

  <rect x="316" y="368" width="248" height="60" rx="6" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.1"/>
  <text x="332" y="387" font-size="10.5" fill="#b8b3ad">ServiceMonitor</text>
  <rect x="332" y="396" width="216" height="22" rx="4" fill="#fdf3df"/>
  <text x="440" y="412" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">스크레이프 잡 · Secret</text>

  <rect x="576" y="368" width="268" height="60" rx="6" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.1"/>
  <text x="592" y="387" font-size="10.5" fill="#b8b3ad">PrometheusRule</text>
  <rect x="592" y="396" width="236" height="22" rx="4" fill="#fdf3df"/>
  <text x="710" y="412" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">룰 파일 · ConfigMap</text>

  <line x1="450" y1="458" x2="450" y2="486" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#ra1)"/>
  <text x="466" y="478" font-size="10.5" fill="#b8b3ad">mount</text>

  <!-- 4. 파드 안 -->
  <rect x="36" y="494" width="828" height="80" rx="9" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.3"/>
  <text x="56" y="517" font-size="12.5" font-weight="700" fill="#e8e4df">4. Prometheus 파드</text>
  <rect x="56" y="528" width="224" height="24" rx="4" fill="#f4f9fd"/>
  <text x="168" y="545" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">config-reloader 사이드카</text>
  <rect x="292" y="528" width="200" height="24" rx="4" fill="#f4f9fd"/>
  <text x="392" y="545" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">변경 감지 후 재적재</text>
  <text x="508" y="545" font-size="10.5" fill="#b8b3ad">파드 재시작이 없습니다</text>
  <text x="56" y="566" font-size="10.5" fill="#b8b3ad">설정 파일을 직접 고칠 일이 없습니다</text>

  <!-- 되돌아가는 루프 -->
  <path d="M 36 534 L 20 534 L 20 250 L 36 250" fill="none" stroke="#66bb6a" stroke-width="1.4"/>
  <rect x="36" y="584" width="828" height="26" rx="6" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="56" y="602" font-size="10.5" font-weight="700" fill="#8fdc93">CR 을 고치면 2 단계부터 다시</text>
</svg>

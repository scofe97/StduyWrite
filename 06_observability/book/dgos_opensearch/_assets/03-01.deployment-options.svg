<svg viewBox="0 0 620 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Amazon OpenSearch 배포 옵션 — 관리형 클러스터 vs 서버리스</title>
  <desc>관리형 클러스터는 domain 안에 노드를 두고 내가 rightsizing한다. 서버리스는 노드 대신 컬렉션·OCU로 AWS가 자동 스케일한다. 통제권과 편의성의 트레이드오프.</desc>

  <rect x="0" y="0" width="620" height="420" fill="#0d0d0d"/>
  <text x="24" y="32" fill="#e8e4df" font-size="15" font-weight="600">Amazon OpenSearch 배포 옵션 — 통제권 vs 편의성</text>

  <!-- 통제권 축 -->
  <text x="24" y="58" fill="rgb(138,133,128)" font-size="10">← 내가 더 통제</text>
  <text x="596" y="58" fill="rgb(138,133,128)" font-size="10" text-anchor="end">AWS가 더 관리 →</text>
  <line x1="24" y1="66" x2="596" y2="66" stroke="rgb(42,37,32)" stroke-width="1"/>

  <!-- 관리형 클러스터 (좌) -->
  <rect x="24" y="80" width="284" height="300" fill="rgb(26,26,26)" stroke="rgb(212,168,83)"/>
  <text x="40" y="104" fill="rgb(212,168,83)" font-size="13" font-weight="600">관리형 클러스터 (Service)</text>
  <text x="40" y="124" fill="rgb(138,133,128)" font-size="10">노드·샤드를 내가 rightsizing</text>

  <!-- domain 박스 -->
  <rect x="40" y="138" width="252" height="150" fill="none" stroke="rgb(42,37,32)" stroke-dasharray="4 3"/>
  <text x="52" y="156" fill="#e8e4df" font-size="11">domain</text>
  <rect x="52" y="166" width="110" height="34" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="107" y="187" fill="#e8e4df" font-size="10" text-anchor="middle">데이터 노드</text>
  <rect x="172" y="166" width="108" height="34" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="226" y="187" fill="#e8e4df" font-size="10" text-anchor="middle">매니저 노드</text>
  <rect x="52" y="208" width="110" height="34" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="107" y="229" fill="#e8e4df" font-size="10" text-anchor="middle">코디네이터</text>
  <rect x="172" y="208" width="108" height="34" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="226" y="229" fill="#e8e4df" font-size="10" text-anchor="middle">UltraWarm</text>
  <text x="52" y="266" fill="rgb(138,133,128)" font-size="9">스케일: 수직(리사이즈) · 수평(노드 증감)</text>

  <text x="40" y="312" fill="#e8e4df" font-size="10">✓ 예측 가능한 꾸준한 부하</text>
  <text x="40" y="332" fill="#e8e4df" font-size="10">✓ 노드·샤드 세밀 제어</text>
  <text x="40" y="352" fill="rgb(138,133,128)" font-size="10">유지·패치는 AWS가 담당</text>

  <!-- 서버리스 (우) -->
  <rect x="324" y="80" width="272" height="300" fill="rgb(26,26,26)" stroke="rgb(102,187,106)"/>
  <text x="340" y="104" fill="#66bb6a" font-size="13" font-weight="600">서버리스 (Serverless)</text>
  <text x="340" y="124" fill="rgb(138,133,128)" font-size="10">노드 개념 없음 · AWS가 자동 스케일</text>

  <!-- collection 박스 -->
  <rect x="340" y="138" width="240" height="150" fill="none" stroke="rgb(42,37,32)" stroke-dasharray="4 3"/>
  <text x="352" y="156" fill="#e8e4df" font-size="11">collection</text>
  <rect x="352" y="166" width="216" height="34" fill="rgba(102,187,106,0.13)" stroke="rgb(102,187,106)"/>
  <text x="460" y="187" fill="#e8e4df" font-size="10" text-anchor="middle">컴퓨트 = OCU (1vCPU·6GB RAM)</text>
  <rect x="352" y="208" width="216" height="34" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="460" y="229" fill="#e8e4df" font-size="10" text-anchor="middle">스토리지 = Amazon S3 (분리)</text>
  <text x="352" y="266" fill="rgb(138,133,128)" font-size="9">색인·검색 컴퓨트를 독립 스케일 · 기본 4 OCU</text>

  <text x="340" y="312" fill="#e8e4df" font-size="10">✓ 변동 크고 꾸준한 부하</text>
  <text x="340" y="332" fill="#e8e4df" font-size="10">✓ 운영 부담 최소 · pay-per-use</text>
  <text x="340" y="352" fill="rgb(138,133,128)" font-size="10">최소 OCU는 놀아도 상시 과금</text>

  <!-- 하단 주석 -->
  <text x="24" y="402" fill="rgb(138,133,128)" font-size="10">완전한 저수준 제어(플러그인·opensearch.yml)가 필요하면 → 셀프 호스팅(EC2/EKS)</text>
</svg>

<svg viewBox="0 0 680 500" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>OpenSearch 사이징 체인 — 저장→샤드→CPU→RAM, 요청 fan-out, 스케일링 결정</title>
  <desc>요청이 coordinator 에서 샤드로 fan-out 되고, 사이징은 저장(source/index 1:0.7)에서 샤드(10~50GiB)·CPU(1.5/샤드)·RAM(32GiB heap)으로 결정론적으로 이어지며, POC 실측으로 조율하고 병목(CPU·큐·저장·heap) 위치에 따라 수직/수평 스케일링을 고르는 구조.</desc>

  <rect x="0" y="0" width="680" height="500" fill="#0d0d0d"/>
  <text x="24" y="32" fill="#e8e4df" font-size="15" font-weight="600">스케일링 — 사이징은 저장에서 결정론적으로 흐르고, 실측으로 조율한다</text>

  <defs>
    <marker id="za" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- ① 요청 fan-out -->
  <text x="24" y="58" fill="#e8e4df" font-size="12" font-weight="600">① 요청 fan-out — 각 요청은 primary 샤드 수만큼 곱해진다</text>
  <rect x="24" y="68" width="120" height="44" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="84" y="86" fill="#e8e4df" font-size="10" text-anchor="middle" font-weight="600">coordinator</text>
  <text x="84" y="101" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">파싱·라우팅·집계</text>
  <line x1="144" y1="90" x2="172" y2="90" stroke="rgb(212,168,83)" stroke-width="1.3" marker-end="url(#za)"/>
  <rect x="176" y="70" width="70" height="18" fill="rgba(102,187,106,0.12)" stroke="rgb(102,187,106)"/>
  <text x="211" y="83" fill="rgb(102,187,106)" font-size="8" text-anchor="middle">shard 1</text>
  <rect x="176" y="92" width="70" height="18" fill="rgba(102,187,106,0.12)" stroke="rgb(102,187,106)"/>
  <text x="211" y="105" fill="rgb(102,187,106)" font-size="8" text-anchor="middle">shard 2 …N</text>
  <text x="260" y="82" fill="rgb(138,133,128)" font-size="8.5">bulk: 5p+1r → 10샤드 관여</text>
  <text x="260" y="97" fill="rgb(138,133,128)" font-size="8.5">search: → 5샤드 · _source 2차 fetch</text>
  <rect x="470" y="68" width="186" height="44" fill="rgba(212,168,83,0.10)" stroke="rgb(212,168,83)"/>
  <text x="563" y="85" fill="rgb(212,168,83)" font-size="9" text-anchor="middle" font-weight="600">큐 1000/노드 → HTTP 429</text>
  <text x="563" y="101" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">= 언더스케일 (큐 키우면 지연만↑)</text>

  <!-- ② 사이징 체인 -->
  <text x="24" y="140" fill="#e8e4df" font-size="12" font-weight="600">② 사이징 체인 — 순서 고정: 계산 3단(저장·샤드·CPU) 뒤 판단(RAM)</text>

  <rect x="24" y="152" width="150" height="70" fill="rgba(212,168,83,0.08)" stroke="rgb(42,37,32)"/>
  <text x="99" y="170" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="600">1. 저장</text>
  <text x="34" y="187" fill="rgb(138,133,128)" font-size="8">source/index 1:0.7 (zstd)</text>
  <text x="34" y="201" fill="rgb(138,133,128)" font-size="8">×(1+replica) · ×1.25 여유</text>
  <text x="34" y="215" fill="rgb(138,133,128)" font-size="8">watermark 85/90/95%</text>
  <line x1="174" y1="187" x2="196" y2="187" stroke="rgb(212,168,83)" stroke-width="1.3" marker-end="url(#za)"/>

  <rect x="200" y="152" width="150" height="70" fill="rgba(212,168,83,0.08)" stroke="rgb(42,37,32)"/>
  <text x="275" y="170" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="600">2. 샤드</text>
  <text x="210" y="187" fill="rgb(138,133,128)" font-size="8">색인 ÷ 샤드 크기</text>
  <text x="210" y="201" fill="rgb(138,133,128)" font-size="8">search/vector 10~30GiB</text>
  <text x="210" y="215" fill="rgb(138,133,128)" font-size="8">logs 50GiB · 생성 후 불변</text>
  <line x1="350" y1="187" x2="372" y2="187" stroke="rgb(212,168,83)" stroke-width="1.3" marker-end="url(#za)"/>

  <rect x="376" y="152" width="140" height="70" fill="rgba(212,168,83,0.08)" stroke="rgb(42,37,32)"/>
  <text x="446" y="170" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="600">3. CPU</text>
  <text x="386" y="187" fill="rgb(138,133,128)" font-size="8">active 샤드 × 1.5</text>
  <text x="386" y="201" fill="rgb(138,133,128)" font-size="8">→ 67% util 목표</text>
  <text x="386" y="215" fill="rgb(138,133,128)" font-size="8">피크 80% · 순간 100%</text>
  <line x1="516" y1="187" x2="538" y2="187" stroke="rgb(212,168,83)" stroke-width="1.3" marker-end="url(#za)"/>

  <rect x="542" y="152" width="114" height="70" fill="rgba(102,187,106,0.10)" stroke="rgb(102,187,106)"/>
  <text x="599" y="170" fill="rgb(102,187,106)" font-size="10" text-anchor="middle" font-weight="600">4. RAM (판단)</text>
  <text x="552" y="187" fill="rgb(138,133,128)" font-size="8">heap ≤32GiB</text>
  <text x="552" y="200" fill="rgb(138,133,128)" font-size="8">25샤드/GiB→800</text>
  <text x="552" y="213" fill="rgb(138,133,128)" font-size="8">50:50 heap/off</text>

  <!-- 예제 띠 -->
  <rect x="24" y="230" width="632" height="26" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="34" y="247" fill="rgb(138,133,128)" font-size="8.5">예: Search 175GiB÷10 = 18primary→36샤드→54CPU→438GiB  ·  Logs 700GiB÷50 = 14→28→42CPU  ·  Vector 275÷30 = 20샤드→30CPU+5GiB</text>

  <!-- ③ 최적화·스케일링 -->
  <text x="24" y="282" fill="#e8e4df" font-size="12" font-weight="600">③ 실측 조율 — POC 로 시작, 병목 위치로 스케일 방향 결정</text>

  <rect x="24" y="294" width="200" height="80" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="124" y="311" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-weight="600">POC (실측이 유일한 답)</text>
  <text x="34" y="329" fill="rgb(138,133,128)" font-size="8">bottom-up: 1노드·1샤드 soak</text>
  <text x="44" y="342" fill="rgb(138,133,128)" font-size="8">→ 429까지 올렸다 back off</text>
  <text x="34" y="357" fill="rgb(138,133,128)" font-size="8">top-down: 전체 데이터·쿼리</text>
  <text x="34" y="370" fill="rgb(138,133,128)" font-size="7.5">에러 0·실제 데이터·수시간~수일</text>

  <rect x="232" y="294" width="200" height="80" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="332" y="311" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-weight="600">테넌시 + shard skew</text>
  <text x="242" y="329" fill="rgb(138,133,128)" font-size="8">siloed(분리·폭증) / pooled(효율·</text>
  <text x="242" y="341" fill="rgb(138,133,128)" font-size="8">noisy neighbor) / hybrid</text>
  <text x="242" y="356" fill="rgb(138,133,128)" font-size="8">routing=tenant_id → 단일 샤드</text>
  <text x="242" y="370" fill="rgb(138,133,128)" font-size="7.5">skew 방지: 노드(·AZ 3)의 배수 샤드</text>

  <rect x="440" y="294" width="216" height="80" fill="rgba(212,168,83,0.06)" stroke="rgb(42,37,32)"/>
  <text x="548" y="311" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle" font-weight="600">스케일 — 병목별</text>
  <text x="450" y="329" fill="rgb(138,133,128)" font-size="8">CPU 67%↑ → 수직·수평 아무거나</text>
  <text x="450" y="342" fill="rgb(138,133,128)" font-size="8">큐잉(동시 폭주) → 수평</text>
  <text x="450" y="356" fill="rgb(138,133,128)" font-size="8">저장 부족 → 수직→한계면 수평</text>
  <text x="450" y="370" fill="rgb(138,133,128)" font-size="8">heap 스트레스 → 수평(32GiB 상한)</text>

  <!-- 통찰 띠 -->
  <rect x="24" y="392" width="632" height="30" fill="rgba(102,187,106,0.08)" stroke="rgb(42,37,32)"/>
  <text x="40" y="411" fill="rgb(138,133,128)" font-size="9.5">열쇠: 샤드-CPU 관계가 성공의 가장 중요한 관문 — 각 요청이 샤드로 곱해지므로 샤드 배치가 곧 자원 분배 · 429는 스케일 신호</text>

  <!-- Spring 관점 -->
  <rect x="24" y="428" width="632" height="30" fill="rgba(212,168,83,0.06)" stroke="rgb(42,37,32)"/>
  <text x="40" y="447" fill="rgb(138,133,128)" font-size="9.5">Spring 앱: ① bulk 크기로 fan-out 부하 조절 ② @Routing/withRouting 으로 테넌시 ③ 429에 백오프 협조 — 사이징은 운영</text>

  <!-- 종장 -->
  <rect x="24" y="464" width="632" height="28" fill="rgb(26,26,26)" stroke="rgb(212,168,83)"/>
  <text x="40" y="482" fill="#e8e4df" font-size="9.5">종장: OpenSearch 를 안다 = "이 워크로드에 몇 개의 어떤 노드가 필요한가"를 답할 수 있다 (샤드=2장·검색=5장·벡터=10장·ISM=13장이 여기 수렴)</text>
</svg>

<svg viewBox="0 0 660 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>OpenSearch 고급 쿼리 4축 — 논리 조합·점수 조율·특수 검색·진단</title>
  <desc>leaf 쿼리를 출발점으로, 논리 조합(bool), 점수 조율(boost·dis_max·function_score·rescore), 특수 검색(geo·faceted·percolation), 진단(explain·profile) 네 축으로 확장되는 6장 개념 지도.</desc>

  <rect x="0" y="0" width="660" height="400" fill="#0d0d0d"/>
  <text x="24" y="32" fill="#e8e4df" font-size="15" font-weight="600">고급 쿼리 — leaf 를 조합·조율·역전하는 4축</text>

  <defs>
    <marker id="aq" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- 출발점: leaf 쿼리 (5장) -->
  <rect x="24" y="52" width="150" height="44" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="99" y="74" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">5장 leaf 쿼리</text>
  <text x="99" y="88" fill="#e8e4df" font-size="10" text-anchor="middle">단일 필드 매칭</text>
  <line x1="174" y1="74" x2="212" y2="74" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#aq)"/>

  <!-- ① 논리 조합 -->
  <rect x="220" y="52" width="416" height="70" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="236" y="72" fill="#e8e4df" font-size="12" font-weight="600">① 논리 조합 — bool</text>
  <text x="236" y="91" fill="rgb(138,133,128)" font-size="9.5">must(모두·점수) · should(minimum_should_match·점수) · must_not(제외)</text>
  <text x="236" y="107" fill="rgb(138,133,128)" font-size="9.5">filter(모두·</text>
  <text x="298" y="107" fill="rgb(212,168,83)" font-size="9.5" font-weight="600">점수 미기여 + 캐시</text>
  <text x="392" y="107" fill="rgb(138,133,128)" font-size="9.5">) · 복합 쿼리는 중첩됨</text>

  <!-- ② 점수 조율 -->
  <rect x="24" y="140" width="612" height="88" fill="rgba(212,168,83,0.08)" stroke="rgb(42,37,32)"/>
  <text x="40" y="160" fill="#e8e4df" font-size="12" font-weight="600">② 점수 조율 — 매칭됐다를 넘어 "어떤 순서로 보일까"</text>

  <rect x="40" y="172" width="138" height="44" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="109" y="190" fill="#e8e4df" font-size="10" text-anchor="middle">boost / boosting</text>
  <text x="109" y="205" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">절 가중치·부정 감점</text>

  <rect x="188" y="172" width="138" height="44" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="257" y="190" fill="#e8e4df" font-size="10" text-anchor="middle">dis_max / best_fields</text>
  <text x="257" y="205" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">최고 필드 + tie_breaker</text>

  <rect x="336" y="172" width="138" height="44" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="405" y="190" fill="#e8e4df" font-size="10" text-anchor="middle">function_score</text>
  <text x="405" y="205" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">문서 값·decay·script</text>

  <rect x="484" y="172" width="136" height="44" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="552" y="190" fill="#e8e4df" font-size="10" text-anchor="middle">rescore</text>
  <text x="552" y="205" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">상위 N만 재정렬</text>

  <!-- ③ 특수 검색 -->
  <rect x="24" y="246" width="612" height="88" fill="rgba(102,187,106,0.10)" stroke="rgb(102,187,106)"/>
  <text x="40" y="266" fill="#e8e4df" font-size="12" font-weight="600">③ 특수 검색 — 위치·값 요약·인터페이스 역전</text>

  <rect x="40" y="278" width="186" height="44" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="133" y="296" fill="rgb(102,187,106)" font-size="10" text-anchor="middle" font-weight="600">geospatial</text>
  <text x="133" y="311" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">geo_distance·polygon / grid</text>

  <rect x="236" y="278" width="186" height="44" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="329" y="296" fill="rgb(102,187,106)" font-size="10" text-anchor="middle" font-weight="600">faceted (집계)</text>
  <text x="329" y="311" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">terms → 클릭 시 filter 추가</text>

  <rect x="432" y="278" width="188" height="44" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="526" y="296" fill="rgb(102,187,106)" font-size="10" text-anchor="middle" font-weight="600">percolation (역전)</text>
  <text x="526" y="311" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">쿼리를 색인 · 문서로 질의</text>

  <!-- ④ 진단 (하단 띠) -->
  <rect x="24" y="352" width="612" height="34" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="40" y="373" fill="rgb(138,133,128)" font-size="10">④ 진단: explain(점수 분해) · profile(단계별 타이밍) — 둘 다 지연↑, 프로덕션 금지·디버그 전용</text>
</svg>

<svg viewBox="0 0 680 410" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>OpenSearch 플러그인 지도 — 유형·카탈로그·라이프사이클</title>
  <desc>플러그인 세 유형(bundled·additional·custom)과 주요 플러그인 카탈로그, 노드 부트스트랩 라이프사이클 3단계(installation·initialization·teardown)를 한눈에 정리한 지도.</desc>

  <rect x="0" y="0" width="680" height="410" fill="#0d0d0d"/>
  <text x="24" y="32" fill="#e8e4df" font-size="15" font-weight="600">플러그인 — 코어에 class-load 되는 밀결합 모듈</text>

  <defs>
    <marker id="pm" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- 유형 3종 (좌측 세로) -->
  <text x="24" y="60" fill="#e8e4df" font-size="12" font-weight="600">① 유형</text>
  <rect x="24" y="70" width="180" height="40" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="34" y="88" fill="rgb(212,168,83)" font-size="10" font-weight="600">bundled</text>
  <text x="34" y="103" fill="rgb(138,133,128)" font-size="8.5">배포판 사전 설치 · 즉시</text>

  <rect x="24" y="116" width="180" height="40" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="34" y="134" fill="#e8e4df" font-size="10" font-weight="600">additional</text>
  <text x="34" y="149" fill="rgb(138,133,128)" font-size="8.5">별도 설치 · ingest-attach</text>

  <rect x="24" y="162" width="180" height="40" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="34" y="180" fill="#e8e4df" font-size="10" font-weight="600">custom</text>
  <text x="34" y="195" fill="rgb(138,133,128)" font-size="8.5">사용자 개발 · .zip+descriptor</text>

  <!-- 카탈로그 (우측) -->
  <text x="228" y="60" fill="#e8e4df" font-size="12" font-weight="600">② 주요 플러그인 카탈로그</text>
  <rect x="228" y="70" width="428" height="132" fill="rgba(212,168,83,0.06)" stroke="rgb(42,37,32)"/>

  <rect x="240" y="82" width="130" height="32" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="305" y="96" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle" font-weight="600">SQL</text>
  <text x="305" y="108" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">SQL→DSL 번역</text>

  <rect x="378" y="82" width="130" height="32" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="443" y="96" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle" font-weight="600">Alerting</text>
  <text x="443" y="108" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">조건 기반 알림</text>

  <rect x="516" y="82" width="128" height="32" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="580" y="96" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle" font-weight="600">ISM</text>
  <text x="580" y="108" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">hot→warm→delete</text>

  <rect x="240" y="120" width="130" height="32" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="305" y="134" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle" font-weight="600">Security</text>
  <text x="305" y="146" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">FGAC·TLS (5~10%)</text>

  <rect x="378" y="120" width="130" height="32" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="443" y="134" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle" font-weight="600">Sec Analytics</text>
  <text x="443" y="146" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">SIEM (2.4+)</text>

  <rect x="516" y="120" width="128" height="32" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="580" y="134" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle" font-weight="600">Job Scheduler</text>
  <text x="580" y="146" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">주기 작업</text>

  <rect x="240" y="158" width="130" height="32" fill="rgba(102,187,106,0.13)" stroke="rgb(102,187,106)"/>
  <text x="305" y="172" fill="rgb(102,187,106)" font-size="9.5" text-anchor="middle" font-weight="600">KNN</text>
  <text x="305" y="184" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">벡터·HNSW</text>

  <rect x="378" y="158" width="130" height="32" fill="rgba(102,187,106,0.13)" stroke="rgb(102,187,106)"/>
  <text x="443" y="172" fill="rgb(102,187,106)" font-size="9.5" text-anchor="middle" font-weight="600">Neural Search</text>
  <text x="443" y="184" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">임베딩·RAG (2.9+)</text>

  <rect x="516" y="158" width="128" height="32" fill="rgba(102,187,106,0.13)" stroke="rgb(102,187,106)"/>
  <text x="580" y="172" fill="rgb(102,187,106)" font-size="9.5" text-anchor="middle" font-weight="600">LTR</text>
  <text x="580" y="184" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">랭킹 ML</text>

  <text x="240" y="199" fill="rgb(138,133,128)" font-size="8">앰버=운영·보안 · 초록=ML/벡터(10장 상세)</text>

  <!-- 라이프사이클 3단계 (하단) -->
  <text x="24" y="240" fill="#e8e4df" font-size="12" font-weight="600">③ 라이프사이클 — 노드 부트스트랩 안에서 (핫스왑 불가)</text>

  <rect x="24" y="252" width="185" height="60" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="116" y="274" fill="#e8e4df" font-size="11" text-anchor="middle" font-weight="600">installation</text>
  <text x="116" y="291" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">JAR·의존성을</text>
  <text x="116" y="303" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">plugins 디렉토리에 배치</text>
  <line x1="209" y1="282" x2="233" y2="282" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#pm)"/>

  <rect x="237" y="252" width="185" height="60" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="329" y="274" fill="#e8e4df" font-size="11" text-anchor="middle" font-weight="600">initialization</text>
  <text x="329" y="291" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">Node.java → PluginService</text>
  <text x="329" y="303" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">class-load · DI 주입</text>
  <line x1="422" y1="282" x2="446" y2="282" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#pm)"/>

  <rect x="450" y="252" width="185" height="60" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="542" y="274" fill="#e8e4df" font-size="11" text-anchor="middle" font-weight="600">teardown</text>
  <text x="542" y="291" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">노드 종료 시</text>
  <text x="542" y="303" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">리소스 해제·정리</text>

  <!-- 하단 주의 띠 -->
  <rect x="24" y="328" width="632" height="34" fill="rgba(212,168,83,0.06)" stroke="rgb(42,37,32)"/>
  <text x="40" y="349" fill="rgb(138,133,128)" font-size="9.5">버전 호환: 플러그인 2.5.0 ↔ 코어 2.5.x (semantic versioning) · 안 맞으면 클러스터 불안정/기동 실패</text>

  <text x="24" y="386" fill="rgb(138,133,128)" font-size="10">업데이트 = remove + install + 노드 재시작 (in-place 없음) · 미래: plugin → extensions(느슨한 결합·격리)</text>
</svg>

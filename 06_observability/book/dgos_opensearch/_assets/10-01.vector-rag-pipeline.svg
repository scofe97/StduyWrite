<svg viewBox="0 0 680 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>벡터 검색과 RAG 파이프라인 — 임베딩에서 생성까지</title>
  <desc>텍스트가 임베딩 모델로 벡터화되어 dense·sparse 로 나뉘고, KNN(exact·approximate HNSW·IVF)으로 시맨틱 검색되며, hybrid 로 lexical 과 섞이고, RAG 로 LLM 프롬프트에 붙어 생성으로 이어지는 파이프라인.</desc>

  <rect x="0" y="0" width="680" height="430" fill="#0d0d0d"/>
  <text x="24" y="32" fill="#e8e4df" font-size="15" font-weight="600">벡터 검색과 RAG — 단어가 아니라 의미를, 그리고 생성으로</text>

  <defs>
    <marker id="vr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- 1. 벡터화 -->
  <text x="24" y="58" fill="#e8e4df" font-size="12" font-weight="600">① 벡터화 — LLM 임베딩이 의미를 좌표로</text>
  <rect x="24" y="68" width="150" height="52" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="99" y="88" fill="#e8e4df" font-size="10" text-anchor="middle">텍스트</text>
  <text x="99" y="104" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">문서·쿼리</text>
  <line x1="174" y1="94" x2="198" y2="94" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#vr)"/>

  <rect x="202" y="68" width="160" height="52" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="282" y="88" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="600">임베딩 모델</text>
  <text x="282" y="104" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">백프로파게이션·문맥 학습</text>
  <line x1="362" y1="94" x2="386" y2="94" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#vr)"/>

  <rect x="390" y="68" width="130" height="52" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="455" y="86" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle" font-weight="600">dense 벡터</text>
  <text x="455" y="100" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">모든 차원·일반화</text>
  <text x="455" y="112" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">(과일반화 위험)</text>

  <rect x="526" y="68" width="130" height="52" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="591" y="86" fill="rgb(102,187,106)" font-size="9.5" text-anchor="middle" font-weight="600">sparse 벡터</text>
  <text x="591" y="100" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">~32000 토큰·대부분 0</text>
  <text x="591" y="112" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">단어 직결·정밀</text>

  <!-- 2. 시맨틱 검색 KNN -->
  <text x="24" y="146" fill="#e8e4df" font-size="12" font-weight="600">② 시맨틱 검색 — KNN(벡터 거리로 최근접)</text>
  <rect x="24" y="156" width="200" height="60" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="124" y="176" fill="#e8e4df" font-size="10" text-anchor="middle" font-weight="600">exact KNN</text>
  <text x="124" y="192" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">모든 벡터 비교</text>
  <text x="124" y="205" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">정확·느림 (golden set)</text>

  <rect x="234" y="156" width="200" height="60" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="334" y="174" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="600">approximate KNN</text>
  <text x="334" y="190" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">HNSW(그래프·m·ef)</text>
  <text x="334" y="203" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">IVF(centroid·train)</text>

  <rect x="444" y="156" width="212" height="60" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="550" y="174" fill="#e8e4df" font-size="10" text-anchor="middle" font-weight="600">엔진·플러그인</text>
  <text x="550" y="190" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">FAISS (NMSLib 2.19 deprecated)</text>
  <text x="550" y="203" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">ML Commons · Neural Search</text>

  <!-- 3. hybrid -->
  <rect x="24" y="230" width="632" height="34" fill="rgba(102,187,106,0.10)" stroke="rgb(102,187,106)"/>
  <text x="40" y="251" fill="rgb(102,187,106)" font-size="10" font-weight="600">③ Hybrid:</text>
  <text x="112" y="251" fill="rgb(138,133,128)" font-size="9.5">lexical + vector 최대 5쿼리 블렌딩 · 정규화(min_max·l2) + 결합(arithmetic·geometric·harmonic mean)</text>

  <line x1="340" y1="264" x2="340" y2="286" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#vr)"/>

  <!-- 4. RAG -->
  <text x="24" y="300" fill="#e8e4df" font-size="12" font-weight="600">④ RAG — 검색을 생성의 사실 근거로 (환각 감소)</text>
  <rect x="24" y="310" width="632" height="66" fill="rgba(212,168,83,0.08)" stroke="rgb(42,37,32)"/>

  <rect x="40" y="322" width="132" height="42" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="106" y="340" fill="#e8e4df" font-size="9.5" text-anchor="middle">① 질문</text>
  <text x="106" y="354" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">사용자 → AI 앱</text>
  <line x1="172" y1="343" x2="192" y2="343" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#vr)"/>

  <rect x="196" y="322" width="132" height="42" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="262" y="340" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle" font-weight="600">② 검색</text>
  <text x="262" y="354" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">OpenSearch 질의</text>
  <line x1="328" y1="343" x2="348" y2="343" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#vr)"/>

  <rect x="352" y="322" width="132" height="42" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="418" y="340" fill="#e8e4df" font-size="9.5" text-anchor="middle">③ 프롬프트 증강</text>
  <text x="418" y="354" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">결과를 프롬프트에</text>
  <line x1="484" y1="343" x2="504" y2="343" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#vr)"/>

  <rect x="508" y="322" width="132" height="42" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="574" y="340" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle" font-weight="600">④ 생성</text>
  <text x="574" y="354" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">LLM(Claude 등) 응답</text>

  <text x="24" y="400" fill="rgb(138,133,128)" font-size="10">retrieval_augmented_generation 프로세서 + conversational memory(대화 맥락) + 커넥터(Bedrock·OpenAI·SageMaker)</text>
  <text x="24" y="418" fill="rgb(138,133,128)" font-size="9.5">앰버=벡터/근사/생성 핵심 · 초록=sparse/hybrid(두 세계 혼합) · 통찰: lexical=단어, vector=의미, 정답은 대개 혼합</text>
</svg>

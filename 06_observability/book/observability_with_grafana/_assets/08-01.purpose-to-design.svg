<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>세 질문이 페르소나별 요구를 거쳐 설계 결정이 되는 흐름</title>
  <desc>대시보드를 만들기 전에 청중이 누구인지 그들의 요구가 무엇인지 어디서 보게 되는지 세 질문에 답합니다. 1장의 페르소나 다섯이 그 답을 채우는 재료이며, 각자의 요구가 서로 다른 설계 결정으로 내려옵니다. Ophelia 는 색과 임계값, Pelé 는 내보내기, Masha 는 PDF 리포트를 견디는 배치가 필요합니다.</desc>

  <rect width="880" height="408" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">세 질문이 설계를 정한다</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">답하지 않으면 이야기를 할 수 없다</text>

  <!-- three questions -->
  <rect x="30" y="76" width="820" height="62" rx="8" fill="rgb(212,168,83)"/>
  <text x="50" y="102" fill="#0d0d0d" font-size="13" font-weight="700">만들기 전에 답한다</text>
  <rect x="240" y="88" width="190" height="26" rx="4" fill="#fdf3df"/>
  <text x="252" y="106" fill="#5c4410" font-size="11.5" font-weight="700">청중이 누구인가</text>
  <rect x="444" y="88" width="190" height="26" rx="4" fill="#fdf3df"/>
  <text x="456" y="106" fill="#5c4410" font-size="11.5" font-weight="700">요구는 무엇인가</text>
  <rect x="648" y="88" width="190" height="26" rx="4" fill="#fdf3df"/>
  <text x="660" y="106" fill="#5c4410" font-size="11.5" font-weight="700">어디서 보는가</text>
  <text x="50" y="128" fill="#1a1a1a" font-size="11">세 번째가 자주 빠진다</text>

  <path d="M440 138 L440 158" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- personas -->
  <text x="30" y="180" fill="#e8e4df" font-size="13" font-weight="700">페르소나가 답을 채운다</text>

  <rect x="30" y="192" width="158" height="106" rx="6" fill="#dceaf7"/>
  <text x="42" y="214" fill="#10243a" font-size="12" font-weight="700">Diego</text>
  <text x="42" y="234" fill="#10243a" font-size="10.5">개발자</text>
  <text x="42" y="256" fill="#10243a" font-size="10.5">트래픽 흐름</text>
  <text x="42" y="274" fill="#10243a" font-size="10.5">버그를 깊이 판다</text>

  <rect x="196" y="192" width="158" height="106" rx="6" fill="#dceaf7"/>
  <text x="208" y="214" fill="#10243a" font-size="12" font-weight="700">Ophelia</text>
  <text x="208" y="234" fill="#10243a" font-size="10.5">운영자</text>
  <text x="208" y="256" fill="#10243a" font-size="10.5">한눈에 이해</text>
  <text x="208" y="274" fill="#10243a" font-size="10.5">대형 화면</text>

  <rect x="362" y="192" width="158" height="106" rx="6" fill="#66bb6a"/>
  <text x="374" y="214" fill="#0d0d0d" font-size="12" font-weight="700">Steven</text>
  <text x="374" y="234" fill="#1a1a1a" font-size="10.5">서비스 관리자</text>
  <text x="374" y="256" fill="#1a1a1a" font-size="10.5">전체 시스템 뷰</text>
  <text x="374" y="274" fill="#1a1a1a" font-size="10.5">누가 고치는가</text>

  <rect x="528" y="192" width="158" height="106" rx="6" fill="#dceaf7"/>
  <text x="540" y="214" fill="#10243a" font-size="12" font-weight="700">Pelé</text>
  <text x="540" y="234" fill="#10243a" font-size="10.5">프로덕트</text>
  <text x="540" y="256" fill="#10243a" font-size="10.5">기기별 사용</text>
  <text x="540" y="274" fill="#10243a" font-size="10.5">스프레드시트로</text>

  <rect x="694" y="192" width="156" height="106" rx="6" fill="#dceaf7"/>
  <text x="706" y="214" fill="#10243a" font-size="12" font-weight="700">Masha</text>
  <text x="706" y="234" fill="#10243a" font-size="10.5">관리자</text>
  <text x="706" y="256" fill="#10243a" font-size="10.5">추세와 수용력</text>
  <text x="706" y="274" fill="#10243a" font-size="10.5">PDF 이메일</text>

  <path d="M440 298 L440 318" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>

  <!-- design decisions -->
  <rect x="30" y="322" width="820" height="68" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <text x="50" y="346" fill="#66bb6a" font-size="13" font-weight="700">요구가 설계 결정으로 내려온다</text>

  <rect x="50" y="356" width="252" height="24" rx="4" fill="#e6f7e7"/>
  <text x="62" y="373" fill="#14521d" font-size="11">Ophelia → 색과 임계값</text>
  <rect x="314" y="356" width="252" height="24" rx="4" fill="#e6f7e7"/>
  <text x="326" y="373" fill="#14521d" font-size="11">Pelé → 내보내기</text>
  <rect x="578" y="356" width="254" height="24" rx="4" fill="#e6f7e7"/>
  <text x="590" y="373" fill="#14521d" font-size="11">Masha → PDF 견디는 배치</text>

</svg>

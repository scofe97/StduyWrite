<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>같은 갑문을 기록하는 세 가지 텔레메트리 신호</title>
  <desc>파나마 운하 아구아클라라 갑문 하나를 메트릭은 주기적 수위 숫자로, 로그는 수문 작동 중 벌어진 일을 한 줄씩, 트레이스는 배가 갑문들을 통과한 전체 여정으로 기록합니다. 세 신호는 같은 대상을 서로 다른 시간 단위와 질문으로 남깁니다.</desc>

  <rect width="880" height="430" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">같은 갑문, 세 가지 기록 방식</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">같은 대상, 다른 질문</text>

  <!-- the subject -->
  <rect x="30" y="76" width="820" height="44" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="50" y="104" fill="#e8e4df" font-size="13.5" font-weight="700">아구아클라라 갑문 — 배 통과</text>

  <!-- metrics -->
  <rect x="30" y="140" width="265" height="260" rx="10" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="140" width="265" height="32" rx="10" fill="#66bb6a"/>
  <rect x="30" y="163" width="265" height="9" fill="#66bb6a"/>
  <text x="48" y="163" fill="#0d0d0d" font-size="13.5" font-weight="700">메트릭 — 수위</text>

  <text x="48" y="196" fill="#e8e4df" font-size="12">주기적으로 찍은 숫자</text>
  <rect x="48" y="208" width="229" height="58" rx="4" fill="#e6f7e7"/>
  <text x="58" y="226" fill="#14521d" font-size="9.5" font-family="'JetBrains Mono', monospace">lock_water_level{</text>
  <text x="58" y="240" fill="#14521d" font-size="9.5" font-family="'JetBrains Mono', monospace">  lock="Agua Clara",</text>
  <text x="58" y="254" fill="#14521d" font-size="9.5" font-family="'JetBrains Mono', monospace">  chamber="Lower"}</text>

  <text x="48" y="290" fill="#b8b3ad" font-size="11.5">라벨이 없으면</text>
  <text x="48" y="309" fill="#b8b3ad" font-size="11.5">어느 갑문인지 모른다</text>

  <rect x="48" y="326" width="229" height="56" rx="5" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1"/>
  <text x="58" y="346" fill="#8fd694" font-size="11.5" font-weight="700">답하는 질문</text>
  <text x="58" y="366" fill="#e8e4df" font-size="11.5">이상한가, 아닌가</text>

  <!-- logs -->
  <rect x="308" y="140" width="265" height="260" rx="10" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="308" y="140" width="265" height="32" rx="10" fill="rgb(212,168,83)"/>
  <rect x="308" y="163" width="265" height="9" fill="rgb(212,168,83)"/>
  <text x="326" y="163" fill="#0d0d0d" font-size="13.5" font-weight="700">로그 — 수문 작동</text>

  <text x="326" y="196" fill="#e8e4df" font-size="12">한 줄씩 빠짐없이</text>
  <rect x="326" y="208" width="229" height="58" rx="4" fill="#fdf3df"/>
  <text x="336" y="226" fill="#5c4410" font-size="9" font-family="'JetBrains Mono', monospace">20:32 start motors</text>
  <text x="336" y="240" fill="#5c4410" font-size="9" font-family="'JetBrains Mono', monospace">20:32 motors engaged</text>
  <text x="336" y="254" fill="#5c4410" font-size="9" font-family="'JetBrains Mono', monospace">20:35 gate open</text>

  <text x="326" y="290" fill="#b8b3ad" font-size="11.5">형식을 생산자가 정해</text>
  <text x="326" y="309" fill="#b8b3ad" font-size="11.5">검색어를 알기 어렵다</text>

  <rect x="326" y="326" width="229" height="56" rx="5" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1"/>
  <text x="336" y="346" fill="rgb(212,168,83)" font-size="11.5" font-weight="700">답하는 질문</text>
  <text x="336" y="366" fill="#e8e4df" font-size="11.5">무슨 일이 있었나</text>

  <!-- traces -->
  <rect x="586" y="140" width="264" height="260" rx="10" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="586" y="140" width="264" height="32" rx="10" fill="#5b9bd5"/>
  <rect x="586" y="163" width="264" height="9" fill="#5b9bd5"/>
  <text x="604" y="163" fill="#e8e4df" font-size="13.5" font-weight="700">트레이스 — 통과 여정</text>

  <text x="604" y="196" fill="#e8e4df" font-size="12">처음부터 끝까지 한 묶음</text>

  <rect x="604" y="208" width="228" height="22" rx="4" fill="#dceaf7"/>
  <text x="614" y="223" fill="#10243a" font-size="10.5" font-weight="700">trace ID — 전체 통과</text>
  <rect x="616" y="234" width="216" height="18" rx="3" fill="#a9cbe8"/>
  <text x="626" y="247" fill="#10243a" font-size="9.5">span — 첫 갑문</text>
  <rect x="616" y="255" width="216" height="18" rx="3" fill="#a9cbe8"/>
  <text x="626" y="268" fill="#10243a" font-size="9.5">span — 두 번째 갑문</text>

  <text x="604" y="292" fill="#b8b3ad" font-size="11.5">ID 전달이 빠지면</text>
  <text x="604" y="311" fill="#b8b3ad" font-size="11.5">무관한 조각만 남는다</text>

  <rect x="604" y="326" width="228" height="56" rx="5" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1"/>
  <text x="614" y="346" fill="#8fc0e8" font-size="11.5" font-weight="700">답하는 질문</text>
  <text x="614" y="366" fill="#e8e4df" font-size="11.5">어디서 시간을 썼나</text>
</svg>

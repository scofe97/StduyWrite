<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>데이터가 안 들어올 때 좁혀 가는 세 단계</title>
  <desc>먼저 사용량 표시가 나타나기까지 몇 분에서 한 시간을 기다립니다. 그래도 데이터가 없으면 자격증명 형식을 확인하고, 다음으로 Collector Pod 로그에서 warning 과 error 를 찾고, 마지막으로 디버그 exporter 의 verbosity 를 normal 또는 detailed 로 올립니다. 마지막 단계는 Pod 을 재시작시켜 Pod 이름이 바뀝니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10.5px; }
  </style>

  <rect width="880" height="520" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">데이터가 안 들어올 때</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">위에서 아래로, 싼 확인부터</text>

  <!-- gate: wait -->
  <rect x="30" y="76" width="820" height="52" rx="8" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="50" y="99" fill="#e8e4df" font-size="13" font-weight="700">먼저 — 기다렸는가</text>
  <text x="50" y="118" fill="#b8b3ad" font-size="11.5">몇 분 ~ 한 시간 걸린다</text>

  <path d="M440 128 L440 148" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="30" y="152" width="820" height="96" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="152" width="150" height="96" rx="8" fill="#66bb6a"/>
  <rect x="170" y="152" width="10" height="96" fill="#66bb6a"/>
  <text x="50" y="185" fill="#0d0d0d" font-size="13.5" font-weight="700">1단계</text>
  <text x="50" y="206" fill="#0d0d0d" font-size="12">자격증명 형식</text>
  <text x="50" y="228" fill="#14521d" font-size="11" font-weight="700">가장 흔한 원인</text>

  <text x="200" y="180" fill="#e8e4df" font-size="12.5">토큰은 exporter 셋이 공유한다</text>
  <text x="200" y="202" fill="#e8e4df" font-size="12.5">정책에 쓰기 권한 셋 필요</text>
  <rect x="200" y="212" width="290" height="22" rx="3" fill="#e6f7e7"/>
  <text class="code" x="210" y="227" fill="#14521d">helm upgrade</text>
  <text x="500" y="227" fill="#b8b3ad" font-size="11.5">로 변경을 반영</text>

  <path d="M440 248 L440 268" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="452" y="264" fill="#b8b3ad" font-size="11">맞는데도 안 되면</text>

  <!-- step 2 -->
  <rect x="30" y="272" width="820" height="104" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="30" y="272" width="150" height="104" rx="8" fill="rgb(212,168,83)"/>
  <rect x="170" y="272" width="10" height="104" fill="rgb(212,168,83)"/>
  <text x="50" y="305" fill="#0d0d0d" font-size="13.5" font-weight="700">2단계</text>
  <text x="50" y="326" fill="#0d0d0d" font-size="12">Collector 로그</text>
  <text x="50" y="348" fill="#5c4410" font-size="11" font-weight="700">warning · error</text>

  <text x="200" y="298" fill="#e8e4df" font-size="12.5">전체 Pod 이름이 필요하다</text>
  <rect x="200" y="308" width="500" height="22" rx="3" fill="#fdf3df"/>
  <text class="code" x="210" y="323" fill="#5c4410">kubectl get pods --selector=app.kubernetes.io/instance=owg</text>
  <rect x="200" y="336" width="500" height="22" rx="3" fill="#fdf3df"/>
  <text class="code" x="210" y="351" fill="#5c4410">kubectl logs owg-opentelemetry-collector-...</text>

  <path d="M440 376 L440 396" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="452" y="392" fill="#b8b3ad" font-size="11">그래도 부족하면</text>

  <!-- step 3 -->
  <rect x="30" y="400" width="820" height="100" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="30" y="400" width="150" height="100" rx="8" fill="#5b9bd5"/>
  <rect x="170" y="400" width="10" height="100" fill="#5b9bd5"/>
  <text x="50" y="433" fill="#e8e4df" font-size="13.5" font-weight="700">3단계</text>
  <text x="50" y="454" fill="#e8e4df" font-size="12">디버그 상세도</text>
  <text x="50" y="476" fill="#e8e4df" font-size="11" font-weight="700">OTEL-Creds.yaml</text>

  <text x="200" y="426" fill="#e8e4df" font-size="12.5">normal → detailed 순</text>
  <rect x="200" y="436" width="300" height="22" rx="3" fill="#dceaf7"/>
  <text class="code" x="210" y="451" fill="#10243a">verbosity: basic | normal | detailed</text>

  <rect x="200" y="466" width="620" height="24" rx="4" fill="#f2d4d4"/>
  <text x="212" y="482" fill="#7a1f1f" font-size="11.5" font-weight="700">재배포 시 Pod 이름이 바뀐다</text>
</svg>

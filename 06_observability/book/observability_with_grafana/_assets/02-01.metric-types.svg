<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img">
  <title>메트릭 네 가지 타입</title>
  <desc>Counter·Gauge·Histogram·Summary 네 메트릭 타입이 각각 무엇을 측정하고 어떤 질문에 답하는지 대비합니다.</desc>
  <style>
    .bg { fill: #0d0d0d; }
    .title { fill: #e8e4df; font-size: 17px; font-weight: 700; }
    .sub { fill: #b8b3ad; font-size: 12px; }
    .hd { font-size: 14.5px; font-weight: 700; }
    .note { font-size: 11.5px; }
    .mono { font-size: 11px; }
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 11px; }
    .cap { fill: #b8b3ad; font-size: 11.5px; font-weight: 700; }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="500"/>

  <text class="title" x="30" y="34">메트릭 타입 넷</text>
  <text class="sub" x="30" y="55">값 하나 대 값의 분포</text>

  <text class="cap" x="30" y="84">구조가 단순 — 값 하나</text>
  <text class="cap" x="470" y="84">구조가 복잡 — 분포의 근사</text>

  <!-- Counter -->
  <rect x="30" y="96" width="208" height="176" rx="9" fill="#dceaf7"/>
  <text class="hd" x="48" y="122" fill="#10243a">Counter</text>
  <text class="note" x="48" y="142" fill="#1a1a1a">마지막 증분값. 늘기만 한다.</text>
  <rect x="48" y="154" width="172" height="44" rx="5" fill="#0d0d0d"/>
  <text class="mono" x="60" y="172" fill="#5b9bd5">요청 수 · 완료 작업</text>
  <text class="mono" x="60" y="188" fill="#5b9bd5">보고된 오류 수</text>
  <text class="note" x="48" y="220" fill="#0d0d0d" font-weight="700">rate 함수를 쓸 수 있다</text>
  <text class="note" x="48" y="242" fill="#7a1f1f">⚠ 0 으로 되돌리는 시점이</text>
  <text class="note" x="48" y="259" fill="#7a1f1f">프로토콜마다 다르다</text>

  <!-- Gauge -->
  <rect x="252" y="96" width="208" height="176" rx="9" fill="#dceaf7"/>
  <text class="hd" x="270" y="122" fill="#10243a">Gauge</text>
  <text class="note" x="270" y="142" fill="#1a1a1a">상태의 스냅숏. 오르내린다.</text>
  <rect x="270" y="154" width="172" height="44" rx="5" fill="#0d0d0d"/>
  <text class="mono" x="282" y="172" fill="#5b9bd5">온도 · 큐 적재량</text>
  <text class="mono" x="282" y="188" fill="#5b9bd5">디스크 사용량</text>
  <text class="note" x="270" y="220" fill="#0d0d0d" font-weight="700">유일하게 감소할 수 있다</text>
  <text class="note" x="270" y="242" fill="#1a1a1a">합·평균·최소·최대로</text>
  <text class="note" x="270" y="259" fill="#1a1a1a">묶어야 쓸모가 커진다</text>

  <!-- Histogram -->
  <rect x="474" y="96" width="208" height="176" rx="9" fill="rgb(212,168,83)"/>
  <text class="hd" x="492" y="122" fill="#0d0d0d">Histogram</text>
  <text class="note" x="492" y="142" fill="#1a1a1a">버킷에 담은 개수. 원값을 낸다.</text>
  <rect x="492" y="154" width="172" height="44" rx="5" fill="#fdf3df"/>
  <text class="code" x="504" y="172" fill="#0d0d0d">_count · _sum</text>
  <text class="mono" x="504" y="188" fill="#0d0d0d">le 버킷들</text>
  <text class="note" x="492" y="220" fill="#0d0d0d" font-weight="700">여러 시계열에 걸쳐 합산 가능</text>
  <text class="note" x="492" y="242" fill="#14521d">Prometheus 의</text>
  <text class="note" x="492" y="259" fill="#14521d">histogram_quantile</text>

  <!-- Summary -->
  <rect x="696" y="96" width="174" height="176" rx="9" fill="#f2d4d4"/>
  <text class="hd" x="714" y="122" fill="#7a1f1f">Summary</text>
  <text class="note" x="714" y="142" fill="#1a1a1a">분위수를 미리 계산한다.</text>
  <rect x="714" y="154" width="138" height="44" rx="5" fill="#0d0d0d"/>
  <text class="code" x="726" y="172" fill="#e39b9b">_count · _sum</text>
  <text class="mono" x="726" y="188" fill="#e39b9b">quantile 라벨</text>
  <text class="note" x="714" y="220" fill="#0d0d0d" font-weight="700">범위를 모를 때 유리</text>
  <text class="note" x="714" y="242" fill="#7a1f1f">⚠ 여러 소스에 걸쳐</text>
  <text class="note" x="714" y="259" fill="#7a1f1f">합산할 수 없다</text>

  <!-- comparison strip -->
  <text class="cap" x="30" y="308">한 축으로 보면</text>

  <rect x="30" y="320" width="840" height="30" rx="5" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1"/>
  <text class="note" x="44" y="340" fill="#b8b3ad">기준</text>
  <text class="note" x="330" y="340" fill="#5b9bd5" font-weight="700">Counter</text>
  <text class="note" x="470" y="340" fill="#5b9bd5" font-weight="700">Gauge</text>
  <text class="note" x="610" y="340" fill="rgb(212,168,83)" font-weight="700">Histogram</text>
  <text class="note" x="770" y="340" fill="#e39b9b" font-weight="700">Summary</text>

  <rect x="30" y="354" width="840" height="28" rx="5" fill="#0d0d0d"/>
  <text class="note" x="44" y="373" fill="#e8e4df">증가·감소 모두 가능</text>
  <text class="note" x="330" y="373" fill="#b8b3ad">아니오</text>
  <text class="note" x="470" y="373" fill="#66bb6a" font-weight="700">예</text>
  <text class="note" x="610" y="373" fill="#b8b3ad">아니오</text>
  <text class="note" x="770" y="373" fill="#b8b3ad">아니오</text>

  <rect x="30" y="386" width="840" height="28" rx="5" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1"/>
  <text class="note" x="44" y="405" fill="#e8e4df">분위수 계산 가능</text>
  <text class="note" x="330" y="405" fill="#b8b3ad">아니오</text>
  <text class="note" x="470" y="405" fill="#b8b3ad">아니오</text>
  <text class="note" x="610" y="405" fill="#66bb6a" font-weight="700">예</text>
  <text class="note" x="770" y="405" fill="#66bb6a" font-weight="700">예</text>

  <rect x="30" y="418" width="840" height="28" rx="5" fill="#0d0d0d"/>
  <text class="note" x="44" y="437" fill="#e8e4df">rate 함수 사용</text>
  <text class="note" x="330" y="437" fill="#66bb6a" font-weight="700">예</text>
  <text class="note" x="470" y="437" fill="#b8b3ad">아니오</text>
  <text class="note" x="610" y="437" fill="#b8b3ad">아니오</text>
  <text class="note" x="770" y="437" fill="#b8b3ad">아니오</text>

  <rect x="30" y="450" width="840" height="28" rx="5" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1"/>
  <text class="note" x="44" y="469" fill="#e8e4df">여러 시계열 합산</text>
  <text class="note" x="330" y="469" fill="#66bb6a" font-weight="700">예</text>
  <text class="note" x="470" y="469" fill="#66bb6a" font-weight="700">예</text>
  <text class="note" x="610" y="469" fill="#66bb6a" font-weight="700">예</text>
  <text class="note" x="770" y="469" fill="#e39b9b" font-weight="700">아니오 ←</text>
</svg>

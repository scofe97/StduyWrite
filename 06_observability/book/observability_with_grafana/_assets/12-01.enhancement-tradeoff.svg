<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>기본 구현에 얹는 확장 다섯과 그 대가</title>
  <desc>기본 구현 위에 얹을 수 있는 확장은 프론트엔드 트레이싱과 커스텀 오류와 커스텀 측정과 커스텀 로그와 커스텀 이벤트 다섯입니다. 각각 얻는 것이 다르지만 대가는 셋으로 같습니다. 추가 설정과 추가 개발 노력과 방문자 브라우저에 미치는 더 큰 영향입니다. 마지막 항목이 다른 관측과 프론트엔드 관측을 가르는 지점이며, 남의 기기에서 코드가 돈다는 사실 때문에 유스케이스 판단이 특히 중요합니다. 커스텀 이벤트는 kind 가 event 인 라벨이 붙은 로그로 Loki 에 수집됩니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="880" height="450" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">확장은 남의 기기에서 돈다</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">얻는 것은 다르고 치르는 대가는 같다</text>

  <defs>
    <marker id="d" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f44336"/>
    </marker>
  </defs>

  <!-- baseline -->
  <rect x="30" y="76" width="820" height="44" rx="8" fill="#66bb6a"/>
  <text x="50" y="104" fill="#0d0d0d" font-size="13" font-weight="700">기본 구현 — 여섯 가지가 그냥 온다</text>
  <rect x="560" y="86" width="272" height="24" rx="4" fill="#e6f7e7"/>
  <text x="572" y="103" fill="#14521d" font-size="10.5" font-weight="700">설정 없이 얻는 출발선이다</text>

  <!-- five enhancements -->
  <rect x="30" y="136" width="164" height="118" rx="8" fill="#5b9bd5"/>
  <text x="44" y="160" fill="#e8e4df" font-size="11.5" font-weight="700">프론트 트레이싱</text>
  <text x="44" y="182" fill="#e8e4df" font-size="10">실사용과 백엔드를</text>
  <text x="44" y="198" fill="#e8e4df" font-size="10">더 잘 잇는다</text>
  <rect x="44" y="208" width="136" height="34" rx="4" fill="#f2d4d4"/>
  <text x="54" y="223" fill="#7a1f1f" font-size="10" font-weight="700">OTel SDK 설정</text>
  <text x="54" y="237" fill="#7a1f1f" font-size="9.5">영향 테스트 필수</text>

  <rect x="206" y="136" width="164" height="118" rx="8" fill="rgb(212,168,83)"/>
  <text x="220" y="160" fill="#0d0d0d" font-size="11.5" font-weight="700">커스텀 오류</text>
  <text x="220" y="182" fill="#1a1a1a" font-size="10">오류 처리가 있는</text>
  <text x="220" y="198" fill="#1a1a1a" font-size="10">시스템에 유용하다</text>
  <rect x="220" y="208" width="136" height="34" rx="4" fill="#fdf3df"/>
  <text x="230" y="223" fill="#5c4410" font-size="10" font-weight="700">오류 파이프라인에</text>
  <text x="230" y="237" fill="#5c4410" font-size="9.5">SDK 를 수동 연결</text>

  <rect x="382" y="136" width="164" height="118" rx="8" fill="rgb(212,168,83)"/>
  <text x="396" y="160" fill="#0d0d0d" font-size="11.5" font-weight="700">커스텀 측정</text>
  <text x="396" y="182" fill="#1a1a1a" font-size="10">앱 고유 데이터를</text>
  <text x="396" y="198" fill="#1a1a1a" font-size="10">함께 보낸다</text>
  <rect x="396" y="208" width="136" height="34" rx="4" fill="#fdf3df"/>
  <text x="406" y="223" fill="#5c4410" font-size="10" font-weight="700">측정값 푸시를</text>
  <text x="406" y="237" fill="#5c4410" font-size="9.5">직접 심는다</text>

  <rect x="558" y="136" width="164" height="118" rx="8" fill="rgb(212,168,83)"/>
  <text x="572" y="160" fill="#0d0d0d" font-size="11.5" font-weight="700">커스텀 로그</text>
  <text x="572" y="182" fill="#1a1a1a" font-size="10">보조 메타데이터로</text>
  <text x="572" y="198" fill="#1a1a1a" font-size="10">경험을 이해한다</text>
  <rect x="572" y="208" width="136" height="34" rx="4" fill="#fdf3df"/>
  <text x="582" y="223" fill="#5c4410" font-size="10" font-weight="700">설정과 개발 노력</text>
  <text x="582" y="237" fill="#5c4410" font-size="9.5">둘 다 든다</text>

  <rect x="734" y="136" width="116" height="118" rx="8" fill="#66bb6a"/>
  <text x="748" y="160" fill="#0d0d0d" font-size="11.5" font-weight="700">커스텀 이벤트</text>
  <text x="748" y="182" fill="#1a1a1a" font-size="10">조사와 표현에</text>
  <text x="748" y="198" fill="#1a1a1a" font-size="10">상관관계를 준다</text>
  <rect x="748" y="208" width="88" height="34" rx="4" fill="#e6f7e7"/>
  <text x="756" y="223" fill="#14521d" font-size="9.5" font-weight="700">Loki 로그로</text>
  <text class="code" x="756" y="237" fill="#14521d">kind=event</text>

  <!-- shared cost -->
  <path d="M112 264 L112 288" stroke="#f44336" stroke-width="2" marker-end="url(#d)"/>
  <path d="M288 264 L288 288" stroke="#f44336" stroke-width="2" marker-end="url(#d)"/>
  <path d="M464 264 L464 288" stroke="#f44336" stroke-width="2" marker-end="url(#d)"/>
  <path d="M640 264 L640 288" stroke="#f44336" stroke-width="2" marker-end="url(#d)"/>
  <path d="M792 264 L792 288" stroke="#f44336" stroke-width="2" marker-end="url(#d)"/>

  <rect x="30" y="294" width="820" height="80" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.8"/>
  <text x="50" y="320" fill="#f44336" font-size="13" font-weight="700">대가는 셋으로 같다</text>

  <rect x="50" y="332" width="256" height="28" rx="4" fill="#f2d4d4"/>
  <text x="62" y="351" fill="#7a1f1f" font-size="11" font-weight="700">추가 설정</text>
  <rect x="318" y="332" width="256" height="28" rx="4" fill="#f2d4d4"/>
  <text x="330" y="351" fill="#7a1f1f" font-size="11" font-weight="700">추가 개발 노력</text>
  <rect x="586" y="332" width="246" height="28" rx="4" fill="#f2b8b5"/>
  <text x="598" y="351" fill="#5c1414" font-size="11" font-weight="700">방문자 브라우저 부담</text>

  <!-- verdict -->
  <rect x="30" y="388" width="820" height="46" rx="8" fill="rgb(212,168,83)"/>
  <text x="50" y="417" fill="#0d0d0d" font-size="12.5" font-weight="700">그래도 가치는 크게 오른다</text>
  <rect x="330" y="398" width="502" height="26" rx="4" fill="#fdf3df"/>
  <text x="342" y="416" fill="#5c4410" font-size="11" font-weight="700">유스케이스를 먼저 정한다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>자격증명 세 항목 중 공유되는 것과 신호마다 갈리는 것</title>
  <desc>API 토큰은 로그와 메트릭과 트레이스가 함께 씁니다. 사용자명과 엔드포인트는 신호마다 다릅니다. 엔드포인트 가공은 로그와 메트릭이 URL 끝에 경로를 더하는 반면, 트레이스만 https 스킴을 떼고 포트 443을 붙이는 반대 방향이라 손버릇대로 처리하면 연결 단계에서 실패합니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="880" height="470" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">토큰은 하나, 나머지는 신호마다</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">인증 실패는 대개 이 구분에서 난다</text>

  <!-- shared token -->
  <rect x="30" y="76" width="820" height="62" rx="8" fill="#66bb6a"/>
  <text x="50" y="102" fill="#0d0d0d" font-size="13.5" font-weight="700">Password — 셋이 공유한다</text>
  <text x="50" y="124" fill="#1a1a1a" font-size="12">Write 스코프 셋을 모두</text>
  <rect x="600" y="92" width="234" height="30" rx="4" fill="#e6f7e7"/>
  <text x="612" y="112" fill="#14521d" font-size="11.5" font-weight="700">하나 빠지면 조용히 실패</text>

  <text x="30" y="168" fill="#e8e4df" font-size="13" font-weight="700">신호마다 갈리는 둘</text>

  <!-- logs -->
  <rect x="30" y="182" width="265" height="128" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="182" width="265" height="30" rx="8" fill="#66bb6a"/>
  <rect x="30" y="204" width="265" height="8" fill="#66bb6a"/>
  <text x="48" y="203" fill="#0d0d0d" font-size="13" font-weight="700">로그 — Loki</text>
  <text x="48" y="234" fill="#e8e4df" font-size="12">URL 끝에 경로를 더한다</text>
  <rect x="48" y="244" width="229" height="20" rx="3" fill="#e6f7e7"/>
  <text class="code" x="56" y="258" fill="#14521d">+ /loki/api/v1/push</text>
  <rect x="48" y="270" width="229" height="30" rx="3" fill="#0d0d0d" stroke="rgb(42,37,32)"/>
  <text class="code" x="56" y="290" fill="#b8b3ad">logs-prod-006...net</text>

  <!-- metrics -->
  <rect x="308" y="182" width="265" height="128" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="308" y="182" width="265" height="30" rx="8" fill="#66bb6a"/>
  <rect x="308" y="204" width="265" height="8" fill="#66bb6a"/>
  <text x="326" y="203" fill="#0d0d0d" font-size="13" font-weight="700">메트릭 — Prometheus</text>
  <text x="326" y="234" fill="#e8e4df" font-size="12">URL 끝에 경로를 더한다</text>
  <rect x="326" y="244" width="229" height="20" rx="3" fill="#e6f7e7"/>
  <text class="code" x="334" y="258" fill="#14521d">+ /api/prom/push</text>
  <rect x="326" y="270" width="229" height="30" rx="3" fill="#0d0d0d" stroke="rgb(42,37,32)"/>
  <text class="code" x="334" y="290" fill="#b8b3ad">prometheus-prod-13...net</text>

  <!-- traces (the odd one) -->
  <rect x="586" y="182" width="264" height="128" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="2.2"/>
  <rect x="586" y="182" width="264" height="30" rx="8" fill="#f2b8b5"/>
  <rect x="586" y="204" width="264" height="8" fill="#f2b8b5"/>
  <text x="604" y="203" fill="#5c1414" font-size="13" font-weight="700">트레이스 — Tempo</text>
  <text x="604" y="234" fill="#e8e4df" font-size="12" font-weight="700">반대다 — 떼고 붙인다</text>
  <rect x="604" y="244" width="228" height="20" rx="3" fill="#f2d4d4"/>
  <text class="code" x="612" y="258" fill="#7a1f1f">- https://    + :443</text>
  <rect x="604" y="270" width="228" height="30" rx="3" fill="#0d0d0d" stroke="rgb(42,37,32)"/>
  <text class="code" x="612" y="290" fill="#b8b3ad">tempo-prod-04...net:443</text>

  <!-- warning -->
  <rect x="30" y="330" width="820" height="60" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="50" y="356" fill="#f44336" font-size="13" font-weight="700">앞의 둘과 손버릇이 다르다</text>
  <text x="50" y="377" fill="#e8e4df" font-size="12">https:// 를 남기면 연결 실패</text>

  <!-- endpoint origin -->
  <rect x="30" y="404" width="820" height="46" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="50" y="432" fill="#b8b3ad" font-size="11.5">세 값을 넣는 곳</text>
  <text class="code" x="160" y="432" fill="#b8b3ad">OTEL-Creds.yaml</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>알림 규칙이 세 상태를 오가며 연락처로 전달되는 경로</title>
  <desc>질의가 SLI 를 만들고 임계값이 SLO 가 됩니다. 규칙은 normal 과 pending 과 firing 세 상태를 가지며 평가 주기 1분과 pending 주기 5분 설정에서는 조건 위반 후 1분 안에 pending 으로 5분 안에 firing 으로 갑니다. 발동하면 라벨 매칭으로 알림 정책이 연락처를 고릅니다. 평가 주기를 10초로 낮추면 하루 질의가 1440회에서 8640회로 늘어 자원만 여섯 배 듭니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="880" height="470" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">질의에서 연락처까지</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">SLI 가 질의, SLO 가 임계값</text>

  <!-- query -->
  <rect x="30" y="76" width="820" height="76" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <text x="50" y="100" fill="rgb(212,168,83)" font-size="12.5" font-weight="700">① 질의 = SLI</text>
  <rect x="50" y="110" width="560" height="24" rx="3" fill="#fdf3df"/>
  <text class="code" x="60" y="126" fill="#5c4410">sum(app_frontend_requests_total{status=~"5.."}) / sum(...)</text>
  <text x="628" y="118" fill="#b8b3ad" font-size="11">10분간 5xx 비율</text>
  <text x="628" y="136" fill="#e8e4df" font-size="11">임계값 3 = SLO</text>

  <path d="M440 152 L440 174" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#66bb6a"/>
    </marker>
  </defs>

  <!-- three states -->
  <text x="30" y="196" fill="#e8e4df" font-size="13" font-weight="700">② 세 상태</text>

  <rect x="30" y="206" width="230" height="70" rx="8" fill="#e6f7e7"/>
  <text x="46" y="232" fill="#14521d" font-size="13" font-weight="700">normal</text>
  <text x="46" y="254" fill="#14521d" font-size="11">조건을 지키는 중</text>

  <path d="M264 241 L306 241" stroke="#66bb6a" stroke-width="2.2" marker-end="url(#g)"/>
  <text x="266" y="232" fill="#b8b3ad" font-size="10">1분 안</text>

  <rect x="310" y="206" width="230" height="70" rx="8" fill="#fdf3df"/>
  <text x="326" y="232" fill="#5c4410" font-size="13" font-weight="700">pending</text>
  <text x="326" y="254" fill="#5c4410" font-size="11">위반했지만 지켜보는 중</text>

  <path d="M544 241 L586 241" stroke="#66bb6a" stroke-width="2.2" marker-end="url(#g)"/>
  <text x="546" y="232" fill="#b8b3ad" font-size="10">5분 안</text>

  <rect x="590" y="206" width="260" height="70" rx="8" fill="#f2b8b5"/>
  <text x="606" y="232" fill="#5c1414" font-size="13" font-weight="700">firing</text>
  <text x="606" y="254" fill="#5c1414" font-size="11">상태가 유지되어 발동</text>

  <!-- evaluation cost -->
  <rect x="30" y="290" width="400" height="80" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.8"/>
  <text x="48" y="314" fill="#f44336" font-size="12.5" font-weight="700">평가 주기를 낮추고 싶은 유혹</text>
  <rect x="48" y="324" width="170" height="20" rx="3" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1"/>
  <text x="56" y="338" fill="#e8e4df" font-size="10.5">1분 주기</text>
  <text class="code" x="118" y="338" fill="#e8e4df">1,440 /day</text>
  <rect x="226" y="324" width="186" height="20" rx="3" fill="#f2d4d4"/>
  <text x="234" y="338" fill="#7a1f1f" font-size="10.5" font-weight="700">10초 주기</text>
  <text class="code" x="300" y="338" fill="#7a1f1f">8,640 /day</text>
  <text x="48" y="360" fill="#b8b3ad" font-size="11">자원 여섯 배, 이점은 거의 없다</text>

  <rect x="450" y="290" width="400" height="80" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.8"/>
  <text x="468" y="314" fill="#f44336" font-size="12.5" font-weight="700">주기와 기간의 관계</text>
  <text x="468" y="338" fill="#e8e4df" font-size="11.5">5분마다 평가 + 최근 1분만 질의</text>
  <text x="468" y="360" fill="#b8b3ad" font-size="11">평가 공백이 오류를 가린다</text>

  <!-- routing -->
  <rect x="30" y="384" width="820" height="62" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <text x="50" y="408" fill="#5b9bd5" font-size="12.5" font-weight="700">③ 라벨로 연락처를 고른다</text>
  <rect x="252" y="394" width="180" height="20" rx="3" fill="#dceaf7"/>
  <text class="code" x="260" y="408" fill="#10243a">service_name</text>
  <text x="448" y="408" fill="#e8e4df" font-size="11.5">소스 라벨로 담당 팀에 라우팅</text>
  <text x="50" y="432" fill="#b8b3ad" font-size="11">매칭을 이어가면 양쪽 팀 모두 통보</text>
</svg>

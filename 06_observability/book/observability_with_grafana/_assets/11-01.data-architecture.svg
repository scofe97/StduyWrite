<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>텔레메트리 종류별로 어울리는 데이터와 카디널리티</title>
  <desc>Loki 로그는 문자열 데이터에 맞고 낮은 카디널리티는 색인 필드로 높은 카디널리티는 비색인 필드로 둘 다 감당합니다. Prometheus 와 Mimir 메트릭은 숫자 데이터에 맞고 낮은 중간 카디널리티만 다룹니다. Tempo 트레이스는 복합 데이터로 높은 카디널리티와 시스템을 가로지르는 필드를 감당합니다. 쿠버네티스 라벨과 클라우드 태그는 소유권과 비용 할당을 담아 수집 시 세 신호에 더해집니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="880" height="470" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">무엇을 어디에 담는가</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">카디널리티가 자리를 정한다</text>

  <!-- three signals -->
  <rect x="30" y="76" width="265" height="196" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="30" y="76" width="265" height="30" rx="8" fill="rgb(212,168,83)"/>
  <rect x="30" y="98" width="265" height="8" fill="rgb(212,168,83)"/>
  <text x="48" y="97" fill="#0d0d0d" font-size="13" font-weight="700">Loki 로그</text>
  <text x="48" y="128" fill="#e8e4df" font-size="12" font-weight="700">문자열 데이터</text>
  <rect x="48" y="140" width="229" height="24" rx="4" fill="#fdf3df"/>
  <text x="58" y="157" fill="#5c4410" font-size="10.5" font-weight="700">낮은~중간 → 색인 필드</text>
  <rect x="48" y="168" width="229" height="24" rx="4" fill="#fdf3df"/>
  <text x="58" y="185" fill="#5c4410" font-size="10.5" font-weight="700">높음 → 비색인 필드</text>
  <text x="48" y="212" fill="#b8b3ad" font-size="11">오류·경고 상태</text>
  <text x="48" y="232" fill="#b8b3ad" font-size="11">서비스명·고객 ID</text>
  <text x="48" y="252" fill="#b8b3ad" font-size="11">트레이스로 잇는 링크</text>

  <rect x="308" y="76" width="265" height="196" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="308" y="76" width="265" height="30" rx="8" fill="#66bb6a"/>
  <rect x="308" y="98" width="265" height="8" fill="#66bb6a"/>
  <text x="326" y="97" fill="#0d0d0d" font-size="13" font-weight="700">Prometheus · Mimir</text>
  <text x="326" y="128" fill="#e8e4df" font-size="12" font-weight="700">숫자 데이터</text>
  <rect x="326" y="140" width="229" height="24" rx="4" fill="#e6f7e7"/>
  <text x="336" y="157" fill="#14521d" font-size="10.5" font-weight="700">낮은~중간만</text>
  <rect x="326" y="168" width="229" height="24" rx="4" fill="#f2d4d4"/>
  <text x="336" y="185" fill="#7a1f1f" font-size="10.5" font-weight="700">높은 카디널리티는 안 됨</text>
  <text x="326" y="212" fill="#b8b3ad" font-size="11">처리한 레코드 수</text>
  <text class="code" x="326" y="232" fill="#b8b3ad">GET · POST · PUT</text>
  <text x="326" y="252" fill="#b8b3ad" font-size="11">서비스명·호스트명 라벨</text>

  <rect x="586" y="76" width="264" height="196" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="586" y="76" width="264" height="30" rx="8" fill="#5b9bd5"/>
  <rect x="586" y="98" width="264" height="8" fill="#5b9bd5"/>
  <text x="604" y="97" fill="#e8e4df" font-size="13" font-weight="700">Tempo 트레이스</text>
  <text x="604" y="128" fill="#e8e4df" font-size="12" font-weight="700">복합 데이터</text>
  <rect x="604" y="140" width="228" height="24" rx="4" fill="#dceaf7"/>
  <text x="614" y="157" fill="#10243a" font-size="10.5" font-weight="700">높은 카디널리티 감당</text>
  <rect x="604" y="168" width="228" height="24" rx="4" fill="#dceaf7"/>
  <text x="614" y="185" fill="#10243a" font-size="10.5" font-weight="700">시스템을 가로지른다</text>
  <text x="604" y="212" fill="#b8b3ad" font-size="11">시스템 상태 필드</text>
  <text x="604" y="232" fill="#b8b3ad" font-size="11">속성으로 담는 고객 ID</text>
  <text x="604" y="252" fill="#b8b3ad" font-size="11">트레이스 메트릭 링크</text>

  <!-- labels & tags feed all three -->
  <rect x="30" y="288" width="820" height="76" rx="8" fill="#66bb6a"/>
  <text x="50" y="314" fill="#0d0d0d" font-size="13" font-weight="700">K8s 라벨 · 클라우드 태그</text>
  <rect x="50" y="324" width="380" height="26" rx="4" fill="#e6f7e7"/>
  <text x="62" y="342" fill="#14521d" font-size="11" font-weight="700">소유권 · 비용 할당</text>
  <rect x="446" y="324" width="386" height="26" rx="4" fill="#e6f7e7"/>
  <text x="458" y="342" fill="#14521d" font-size="11" font-weight="700">수집 시 세 신호에 더해진다</text>

  <!-- warning -->
  <rect x="30" y="380" width="820" height="72" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.8"/>
  <text x="50" y="404" fill="#f44336" font-size="13" font-weight="700">조직 고유 필드는 예외다</text>
  <rect x="50" y="414" width="240" height="24" rx="4" fill="#f2d4d4"/>
  <text class="code" x="62" y="431" fill="#7a1f1f">customerID · userID</text>
  <text x="308" y="431" fill="#e8e4df" font-size="11.5">라이브러리가 테스트해 주지 않는다</text>
  <text x="580" y="431" fill="#b8b3ad" font-size="11">나쁜 데이터는 나쁜 결정이 된다</text>
</svg>

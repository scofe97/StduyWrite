<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Loki 의 쓰기·읽기·저장 경로와 컴포넌트</title>
  <desc>쓰기 경로는 Distributor 가 라벨과 타임스탬프와 로그 라인 크기를 검증해 여러 Ingester 로 배치 전송하고, Ingester 는 WAL 에 쓴 뒤 오브젝트 스토리지로 보냅니다. 읽기 경로는 Query frontend 가 큰 쿼리를 여러 Querier 로 분산하고, Querier 는 최신 데이터를 Ingester 에서 오래된 데이터를 오브젝트 스토리지에서 읽습니다. Compactor 가 중복 제거와 삭제를 맡고 Ruler 는 기록 규칙과 알림을 평가하며, 알림 매니저는 Loki 밖에 있습니다.</desc>

  <rect width="880" height="470" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">쓰기·읽기·저장이 갈린다</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">각각 독립적으로 확장된다</text>

  <!-- WRITE -->
  <rect x="30" y="76" width="380" height="150" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="76" width="380" height="30" rx="8" fill="#66bb6a"/>
  <rect x="30" y="98" width="380" height="8" fill="#66bb6a"/>
  <text x="48" y="97" fill="#0d0d0d" font-size="13" font-weight="700">쓰기 경로</text>

  <rect x="48" y="120" width="164" height="42" rx="6" fill="#e6f7e7"/>
  <text x="60" y="139" fill="#14521d" font-size="12.5" font-weight="700">Distributor</text>
  <text x="60" y="155" fill="#14521d" font-size="10.5">샤딩 · 검증</text>

  <rect x="246" y="120" width="146" height="42" rx="6" fill="#e6f7e7"/>
  <text x="258" y="139" fill="#14521d" font-size="12.5" font-weight="700">Ingester</text>
  <text x="258" y="155" fill="#14521d" font-size="10.5">WAL 에 먼저</text>

  <path d="M214 141 L242 141" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>
  <text x="48" y="185" fill="#b8b3ad" font-size="11">라벨·타임스탬프·라인 크기를 검증한다</text>
  <text x="48" y="205" fill="#b8b3ad" font-size="11">여러 ingester 로 배치 전송</text>

  <!-- READ -->
  <rect x="470" y="76" width="380" height="150" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="470" y="76" width="380" height="30" rx="8" fill="#5b9bd5"/>
  <rect x="470" y="98" width="380" height="8" fill="#5b9bd5"/>
  <text x="488" y="97" fill="#e8e4df" font-size="13" font-weight="700">읽기 경로</text>

  <rect x="488" y="120" width="164" height="42" rx="6" fill="#dceaf7"/>
  <text x="500" y="139" fill="#10243a" font-size="12.5" font-weight="700">Query frontend</text>
  <text x="500" y="155" fill="#10243a" font-size="10.5">분산 · 재시도</text>

  <rect x="686" y="120" width="146" height="42" rx="6" fill="#dceaf7"/>
  <text x="698" y="139" fill="#10243a" font-size="12.5" font-weight="700">Querier</text>
  <text x="698" y="155" fill="#10243a" font-size="10.5">LogQL 파싱</text>

  <path d="M654 141 L682 141" stroke="#5b9bd5" stroke-width="2" marker-end="url(#b)"/>
  <text x="488" y="185" fill="#b8b3ad" font-size="11">최신은 ingester 에서</text>
  <text x="488" y="205" fill="#b8b3ad" font-size="11">같은 데이터는 중복 제거한다</text>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#66bb6a"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b9bd5"/>
    </marker>
    <marker id="am" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- ingester <-> querier (최신 데이터) -->
  <path d="M392 141 L466 141" stroke="rgb(212,168,83)" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#am)"/>

  <!-- arrows down to storage -->
  <path d="M319 162 L319 250" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>
  <path d="M759 162 L759 250" stroke="#5b9bd5" stroke-width="2" marker-end="url(#b)"/>

  <!-- STORAGE -->
  <rect x="30" y="256" width="820" height="94" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="30" y="256" width="820" height="30" rx="8" fill="rgb(212,168,83)"/>
  <rect x="30" y="278" width="820" height="8" fill="rgb(212,168,83)"/>
  <text x="48" y="277" fill="#0d0d0d" font-size="13" font-weight="700">저장</text>

  <rect x="48" y="298" width="380" height="38" rx="6" fill="#fdf3df"/>
  <text x="62" y="322" fill="#5c4410" font-size="12.5" font-weight="700">오브젝트 스토리지</text>

  <rect x="452" y="298" width="380" height="38" rx="6" fill="#fdf3df"/>
  <text x="466" y="316" fill="#5c4410" font-size="12.5" font-weight="700">Compactor</text>
  <text x="600" y="316" fill="#5c4410" font-size="10.5">중복 제거 · 오래된 로그 삭제</text>

  <!-- BACKEND -->
  <rect x="30" y="366" width="400" height="76" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="48" y="392" fill="#e8e4df" font-size="12.5" font-weight="700">Ruler</text>
  <text x="48" y="412" fill="#b8b3ad" font-size="11">기록 규칙 — 새 메트릭 생성</text>
  <text x="48" y="430" fill="#b8b3ad" font-size="11">ingester 를 읽는다</text>

  <rect x="450" y="366" width="400" height="76" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="468" y="392" fill="#f44336" font-size="12.5" font-weight="700">알림 매니저는 Loki 밖</text>
  <text x="468" y="412" fill="#e8e4df" font-size="11.5">발생·전송은 Loki 밖 책임</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img">
  <title>로그 형식의 구조화 정도 스펙트럼</title>
  <desc>비구조 평문에서 Logfmt 를 거쳐 JSON 에 이르기까지 로그 형식이 구조화되는 정도와, 구조가 늘수록 파싱은 쉬워지고 용량은 늘어나는 교환 관계를 보입니다.</desc>
  <style>
    .bg { fill: #0d0d0d; }
    .title { fill: #e8e4df; font-size: 17px; font-weight: 700; }
    .sub { fill: #b8b3ad; font-size: 12px; }
    .hd { font-size: 14.5px; font-weight: 700; }
    .lbl { fill: #b8b3ad; font-size: 11.5px; font-weight: 700; }
    .mono { font-size: 11px; }
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 11px; }
    .note { font-size: 11.5px; }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="480"/>

  <text class="title" x="30" y="34">구조화 정도와 파싱 비용</text>
  <text class="sub" x="30" y="55">기계가 읽기 ↔ 사람이 읽기</text>

  <!-- axis -->
  <line x1="30" y1="80" x2="870" y2="80" stroke="#b8b3ad" stroke-width="1.4"/>
  <text class="lbl" x="30" y="98">기계가 읽기 쉬움</text>
  <text class="lbl" x="762" y="98">사람이 읽기 쉬움</text>

  <!-- Structured -->
  <rect x="30" y="112" width="268" height="250" rx="9" fill="#66bb6a"/>
  <text class="hd" x="48" y="138" fill="#0d0d0d">구조화 (Structured)</text>
  <text class="note" x="48" y="158" fill="#1a1a1a">정해진 메시지 형식. 텍스트가 아니라</text>
  <text class="note" x="48" y="175" fill="#1a1a1a">데이터셋으로 다룬다.</text>
  <rect x="48" y="188" width="232" height="96" rx="5" fill="#e6f7e7"/>
  <text class="code" x="60" y="206" fill="#14521d">{</text>
  <text class="code" x="60" y="222" fill="#14521d">  "timestamp": "2023-04-25...",</text>
  <text class="code" x="60" y="238" fill="#14521d">  "message": "User ... logged in",</text>
  <text class="code" x="60" y="254" fill="#14521d">  "log": { "level": "info" }</text>
  <text class="code" x="60" y="270" fill="#14521d">}</text>
  <text class="note" x="48" y="304" fill="#0d0d0d" font-weight="700">얻는 것</text>
  <text class="note" x="48" y="323" fill="#1a1a1a">JSON schema 로 검증</text>
  <text class="note" x="48" y="341" fill="#1a1a1a">→ 스키마를 버전 관리할 수 있다</text>

  <!-- Semi -->
  <rect x="316" y="112" width="268" height="250" rx="9" fill="rgb(212,168,83)"/>
  <text class="hd" x="334" y="138" fill="#0d0d0d">반구조화</text>
  <text class="note" x="334" y="158" fill="#1a1a1a">사람도 읽고 기계도 처리하도록</text>
  <text class="note" x="334" y="175" fill="#1a1a1a">양쪽을 노린다.</text>
  <rect x="334" y="188" width="232" height="96" rx="5" fill="#fdf3df"/>
  <text class="code" x="346" y="212" fill="#0d0d0d">level=info method=GET</text>
  <text class="code" x="346" y="232" fill="#0d0d0d">path=/ host=myserver.me</text>
  <text class="code" x="346" y="252" fill="#0d0d0d">service=4ms status=200</text>
  <text class="mono" x="346" y="272" fill="#7a5c1f">(Logfmt · 표준 없음)</text>
  <text class="note" x="334" y="304" fill="#0d0d0d" font-weight="700">대가</text>
  <text class="note" x="334" y="323" fill="#1a1a1a">필드·이벤트 구분자가 복잡하다</text>
  <text class="note" x="334" y="341" fill="#1a1a1a">→ 정규식 등으로 파싱해야 한다</text>

  <!-- Unstructured -->
  <rect x="602" y="112" width="268" height="250" rx="9" fill="#5b9bd5"/>
  <text class="hd" x="620" y="138" fill="#e8e4df">비구조화 (Unstructured)</text>
  <text class="note" x="620" y="158" fill="#e8e4df">사람이 읽기 좋게 색과 공백을 쓴다.</text>
  <text class="note" x="620" y="175" fill="#e8e4df">그 표현이 기계에겐 걸림돌이 된다.</text>
  <rect x="620" y="188" width="232" height="96" rx="5" fill="#dceaf7"/>
  <text class="code" x="632" y="210" fill="#10243a">2023-04-25 12:15:03 INFO</text>
  <text class="code" x="632" y="228" fill="#10243a">[SVR042] Found 4 children</text>
  <text class="code" x="632" y="246" fill="#7a1f1f">Begin Transaction update</text>
  <text class="code" x="632" y="264" fill="#7a1f1f">Process started.</text>
  <text class="code" x="632" y="278" fill="#7a1f1f">Process completed.</text>
  <text class="note" x="620" y="304" fill="#e8e4df" font-weight="700">기술 부채</text>
  <text class="note" x="620" y="323" fill="#e8e4df">커스텀 파싱 필요</text>
  <text class="note" x="620" y="341" fill="#e8e4df">한다는 의존이 변경을 묶는다</text>

  <!-- bottom insight -->
  <rect x="30" y="380" width="840" height="72" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.6"/>
  <text class="note" x="50" y="404" fill="rgb(212,168,83)" font-weight="700">캡슐화 — 빨간 세 줄</text>
  <text class="note" x="50" y="425" fill="#e8e4df">줄바꿈 기준 → 네 이벤트로 쪼갬</text>
  <text class="note" x="50" y="444" fill="#e8e4df">타임스탬프 기준 → 하나로 묶임</text>
</svg>

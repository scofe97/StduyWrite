<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Grafana IRM 도구 셋이 각각 맡는 구간</title>
  <desc>Alerting 은 규칙을 평가해 알림을 보내며 추가 라이선스 비용이 없습니다. OnCall 은 외부 시스템 알림을 받아 그룹화하고 당직 순번과 에스컬레이션 경로를 관리하며 모바일 앱을 제공합니다. Incident 는 채팅에서 사고를 선언하면 타임라인을 자동 수집해 사후 검토에 씁니다. 세 도구는 알림에서 사람으로 다시 기록으로 이어집니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="880" height="430" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">알림 → 사람 → 기록</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">세 도구가 맡는 구간이 다르다</text>

  <!-- Alerting -->
  <rect x="30" y="76" width="265" height="250" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="76" width="265" height="32" rx="8" fill="#66bb6a"/>
  <rect x="30" y="100" width="265" height="8" fill="#66bb6a"/>
  <text x="48" y="99" fill="#0d0d0d" font-size="13.5" font-weight="700">Alerting</text>

  <rect x="48" y="120" width="229" height="24" rx="4" fill="#e6f7e7"/>
  <text x="58" y="137" fill="#14521d" font-size="11.5" font-weight="700">추가 라이선스 비용 없음</text>

  <text x="48" y="166" fill="#e8e4df" font-size="12">규칙을 평가해 알림을 보낸다</text>

  <text x="48" y="194" fill="#b8b3ad" font-size="11">알림 규칙 · 세 상태</text>
  <text x="48" y="214" fill="#b8b3ad" font-size="11">연락처 · 알림 정책</text>
  <text x="48" y="234" fill="#b8b3ad" font-size="11">묵음 · 그룹 · Admin</text>

  <rect x="48" y="250" width="229" height="60" rx="5" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1"/>
  <text x="58" y="270" fill="#8fd694" font-size="11" font-weight="700">작은 조직엔 이것으로 충분</text>
  <text x="58" y="292" fill="#e8e4df" font-size="11">큰 조직엔 나머지의 토대</text>

  <!-- arrow -->
  <path d="M299 200 L318 200" stroke="rgb(212,168,83)" stroke-width="2.2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- OnCall -->
  <rect x="322" y="76" width="265" height="250" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="322" y="76" width="265" height="32" rx="8" fill="rgb(212,168,83)"/>
  <rect x="322" y="100" width="265" height="8" fill="rgb(212,168,83)"/>
  <text x="340" y="99" fill="#0d0d0d" font-size="13.5" font-weight="700">OnCall</text>

  <rect x="340" y="120" width="229" height="24" rx="4" fill="#fdf3df"/>
  <text x="350" y="137" fill="#5c4410" font-size="11.5" font-weight="700">IRM 라이선스 · Free 3명</text>

  <text x="340" y="166" fill="#e8e4df" font-size="12">사람과 순번을 관리한다</text>

  <text x="340" y="194" fill="#b8b3ad" font-size="11">알림 그룹 · 네 상태</text>
  <text x="340" y="214" fill="#b8b3ad" font-size="11">당직 순번 · 에스컬레이션</text>
  <text x="340" y="234" fill="#b8b3ad" font-size="11">모바일 앱 · 티켓 연계</text>

  <rect x="340" y="250" width="229" height="60" rx="5" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1"/>
  <text x="350" y="270" fill="rgb(212,168,83)" font-size="11" font-weight="700">Jinja2 로 페이로드 파싱</text>
  <text x="350" y="292" fill="#e8e4df" font-size="11">인바운드 통합</text>
  <text class="code" x="434" y="292" fill="#e8e4df">20+</text>

  <!-- arrow -->
  <path d="M591 200 L610 200" stroke="rgb(212,168,83)" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- Incident -->
  <rect x="614" y="76" width="236" height="250" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="614" y="76" width="236" height="32" rx="8" fill="#5b9bd5"/>
  <rect x="614" y="100" width="236" height="8" fill="#5b9bd5"/>
  <text x="632" y="99" fill="#e8e4df" font-size="13.5" font-weight="700">Incident</text>

  <rect x="632" y="120" width="200" height="24" rx="4" fill="#dceaf7"/>
  <text x="642" y="137" fill="#10243a" font-size="11.5" font-weight="700">채팅에서 사고 선언</text>

  <text x="632" y="166" fill="#e8e4df" font-size="12">기록을 모은다</text>

  <text x="632" y="194" fill="#b8b3ad" font-size="11">타임라인 자동 수집</text>
  <text x="632" y="214" fill="#b8b3ad" font-size="11">질의 · 알림 · 패널까지</text>
  <text x="632" y="234" fill="#b8b3ad" font-size="11">Insights — 최근 90일</text>

  <rect x="632" y="250" width="200" height="60" rx="5" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1"/>
  <text x="642" y="270" fill="#8fc0e8" font-size="11" font-weight="700">은 팀이 정기 검토</text>
  <text x="642" y="292" fill="#e8e4df" font-size="11">금 팀에 보고</text>

  <!-- bottom -->
  <rect x="30" y="344" width="820" height="62" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="50" y="368" fill="#e8e4df" font-size="12" font-weight="700">AI·ML 도구</text>
  <text class="code" x="140" y="368" fill="#b8b3ad">Suggestbot · OpenAI · Forecasting · Outlier · Sift</text>
  <text x="50" y="392" fill="#b8b3ad" font-size="11">Sift — 잡음에 묻힌 세부 탐색</text>
</svg>

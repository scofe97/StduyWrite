<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Tempo 의 쓰기·읽기 경로와 trace ID 기준 라우팅</title>
  <desc>Distributor 는 스팬의 trace ID 를 기준으로 올바른 Ingester 로 라우팅합니다. 한 트레이스의 스팬이 같은 Ingester 로 모여야 트레이스로 묶이기 때문이며, 라벨로 샤딩하는 Loki 와 대비됩니다. Ingester 는 스팬을 트레이스로 묶고 블룸 필터와 인덱스를 기록합니다. Metrics generator 는 선택적 컴포넌트라 켜지 않으면 서비스 그래프와 스팬 메트릭 화면이 채워지지 않습니다. Query frontend 는 읽어야 할 블록 기준으로 질의를 샤드로 나눕니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10.5px; }
  </style>

  <rect width="880" height="470" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">trace ID 로 라우팅한다</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">Loki 는 라벨로 샤딩한다</text>

  <!-- WRITE -->
  <rect x="30" y="76" width="820" height="164" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="76" width="820" height="30" rx="8" fill="#66bb6a"/>
  <rect x="30" y="98" width="820" height="8" fill="#66bb6a"/>
  <text x="48" y="97" fill="#0d0d0d" font-size="13" font-weight="700">쓰기 경로</text>

  <rect x="48" y="120" width="180" height="52" rx="6" fill="#e6f7e7"/>
  <text x="60" y="141" fill="#14521d" font-size="12.5" font-weight="700">Distributor</text>
  <text x="60" y="160" fill="#14521d" font-size="10.5">스팬을 받는다</text>

  <path d="M232 146 L272 146" stroke="#66bb6a" stroke-width="2.2" marker-end="url(#g)"/>
  <rect x="240" y="176" width="212" height="22" rx="3" fill="#fdf3df"/>
  <text class="code" x="250" y="191" fill="#5c4410">trace ID</text>
  <text x="308" y="191" fill="#5c4410" font-size="10.5">로 라우팅</text>

  <rect x="276" y="120" width="180" height="52" rx="6" fill="#e6f7e7"/>
  <text x="288" y="141" fill="#14521d" font-size="12.5" font-weight="700">Ingester</text>
  <text x="288" y="160" fill="#14521d" font-size="10.5">스팬을 트레이스로 묶음</text>

  <text x="48" y="214" fill="#b8b3ad" font-size="11">같은 ingester 로 모여야 한다</text>

  <rect x="480" y="120" width="180" height="52" rx="6" fill="#e6f7e7"/>
  <text x="492" y="141" fill="#14521d" font-size="12.5" font-weight="700">블룸 필터 · 인덱스</text>
  <text x="492" y="160" fill="#14521d" font-size="10.5">질의용으로 기록</text>

  <rect x="684" y="120" width="148" height="52" rx="6" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="696" y="141" fill="#e8e4df" font-size="12" font-weight="700">Metrics generator</text>
  <text x="696" y="160" fill="#b8b3ad" font-size="10.5">선택적 컴포넌트</text>
  <rect x="684" y="176" width="148" height="22" rx="3" fill="#f2d4d4"/>
  <text x="694" y="191" fill="#7a1f1f" font-size="10" font-weight="700">끄면 화면이 빈다</text>

  <!-- READ -->
  <rect x="30" y="256" width="820" height="122" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="30" y="256" width="820" height="30" rx="8" fill="#5b9bd5"/>
  <rect x="30" y="278" width="820" height="8" fill="#5b9bd5"/>
  <text x="48" y="277" fill="#e8e4df" font-size="13" font-weight="700">읽기 경로</text>

  <rect x="48" y="300" width="200" height="52" rx="6" fill="#dceaf7"/>
  <text x="60" y="321" fill="#10243a" font-size="12.5" font-weight="700">Query frontend</text>
  <text x="60" y="340" fill="#10243a" font-size="10.5">블록 기준으로 샤드 분할</text>

  <path d="M252 326 L292 326" stroke="#5b9bd5" stroke-width="2.2" marker-end="url(#b)"/>

  <rect x="296" y="300" width="200" height="52" rx="6" fill="#dceaf7"/>
  <text x="308" y="321" fill="#10243a" font-size="12.5" font-weight="700">Querier</text>
  <text x="308" y="340" fill="#10243a" font-size="10.5">데이터를 찾는다</text>

  <rect x="520" y="300" width="312" height="24" rx="4" fill="#dceaf7"/>
  <text x="532" y="317" fill="#10243a" font-size="11">flush 됐으면 백엔드에서</text>
  <rect x="520" y="328" width="312" height="24" rx="4" fill="#dceaf7"/>
  <text x="532" y="345" fill="#10243a" font-size="11">수집 중이면 ingester 에서</text>

  <!-- storage -->
  <rect x="30" y="392" width="820" height="60" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="50" y="416" fill="rgb(212,168,83)" font-size="12.5" font-weight="700">오브젝트 스토리지</text>
  <text class="code" x="230" y="416" fill="#b8b3ad">S3 · GCS · Azure Blob</text>
  <text x="50" y="438" fill="#e8e4df" font-size="11.5">Compactor 가 최적화한다</text>
  <text x="480" y="438" fill="#b8b3ad" font-size="11.5">Loki · Mimir 와 같은 설계</text>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#66bb6a"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b9bd5"/>
    </marker>
  </defs>
</svg>

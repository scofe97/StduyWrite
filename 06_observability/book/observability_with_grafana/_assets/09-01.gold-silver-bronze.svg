<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>금·은·동 지휘 구조의 책임 분담과 정보 흐름</title>
  <desc>영국 응급 서비스의 gold-silver-bronze 지휘 구조입니다. 금 팀은 선임 관리자와 C-suite 로 전략과 미디어와 법적 이슈를 맡고 은 팀의 전술 계획을 승인합니다. 은 팀은 부서 관리자들로 전술 계획과 절차 문서화와 도구 선택을 맡으며 금과 동 사이 정보 통로가 됩니다. 동 팀은 실제 대응 팀으로 운영 통제와 원인 파악과 사후 보고를 맡습니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10.5px; }
  </style>

  <rect width="880" height="470" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">금·은·동 — 층마다 책임이 다르다</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">영국 응급 서비스에서 가져온 구조</text>

  <!-- GOLD -->
  <rect x="30" y="76" width="700" height="110" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="30" y="76" width="170" height="110" rx="8" fill="rgb(212,168,83)"/>
  <text x="48" y="106" fill="#0d0d0d" font-size="14" font-weight="700">Gold — 전략</text>
  <text x="48" y="128" fill="#1a1a1a" font-size="11">선임 관리자 · C-suite</text>
  <rect x="48" y="142" width="134" height="26" rx="4" fill="#fdf3df"/>
  <text x="58" y="159" fill="#5c4410" font-size="10.5" font-weight="700">전술에 끼어들지 않는다</text>

  <text x="222" y="102" fill="#e8e4df" font-size="11.5">전략 수립·검토·전파</text>
  <text x="222" y="122" fill="#e8e4df" font-size="11.5">미디어 전략 · 법적 이슈</text>
  <text x="222" y="142" fill="#e8e4df" font-size="11.5">주주 보고</text>
  <text x="470" y="102" fill="#e8e4df" font-size="11.5">필요한 자원·전문 기술 판단</text>
  <text x="470" y="122" fill="#e8e4df" font-size="11.5">은 팀 전술 계획 승인</text>
  <text x="470" y="142" fill="#e8e4df" font-size="11.5">사후 검토 주재</text>

  <!-- SILVER -->
  <rect x="30" y="200" width="700" height="110" rx="8" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.8"/>
  <rect x="30" y="200" width="170" height="110" rx="8" fill="#d8d3cd"/>
  <text x="48" y="230" fill="#0d0d0d" font-size="14" font-weight="700">Silver — 전술</text>
  <text x="48" y="252" fill="#1a1a1a" font-size="11">여러 부서 관리자</text>
  <rect x="48" y="266" width="134" height="26" rx="4" fill="#f2efeb"/>
  <text x="58" y="283" fill="#3d3833" font-size="10.5" font-weight="700">금과 동 사이 통로</text>

  <text x="222" y="226" fill="#e8e4df" font-size="11.5">전술 계획 수립·상하 전파</text>
  <text x="222" y="246" fill="#e8e4df" font-size="11.5">절차 문서화</text>
  <text x="222" y="266" fill="#e8e4df" font-size="11.5">고객 소통 방식 정의</text>
  <text x="470" y="226" fill="#e8e4df" font-size="11.5">도구 선택</text>
  <text x="470" y="246" fill="#e8e4df" font-size="11.5">핵심 팀 자원 요구 대응</text>
  <text x="470" y="266" fill="#e8e4df" font-size="11.5">사고 중 금 팀에 갱신</text>

  <!-- BRONZE -->
  <rect x="30" y="324" width="700" height="110" rx="8" fill="#0d0d0d" stroke="#c88a4a" stroke-width="1.8"/>
  <rect x="30" y="324" width="170" height="110" rx="8" fill="#e0a877"/>
  <text x="48" y="354" fill="#0d0d0d" font-size="14" font-weight="700">Bronze — 운영</text>
  <text x="48" y="376" fill="#1a1a1a" font-size="11">실제 대응 팀</text>
  <rect x="48" y="390" width="134" height="26" rx="4" fill="#f7e3d2"/>
  <text x="58" y="407" fill="#7a4410" font-size="10.5" font-weight="700">최초 알림부터 사후까지</text>

  <text x="222" y="350" fill="#e8e4df" font-size="11.5">사고의 운영 통제</text>
  <text x="222" y="370" fill="#e8e4df" font-size="11.5">선언 시 은 팀에 통보</text>
  <text x="222" y="390" fill="#e8e4df" font-size="11.5">원인 파악</text>
  <text x="470" y="350" fill="#e8e4df" font-size="11.5">해결 방법 결정</text>
  <text x="470" y="370" fill="#e8e4df" font-size="11.5">전술 계획 안에서 소통</text>
  <text x="470" y="390" fill="#e8e4df" font-size="11.5">사후 보고서·회의</text>

  <!-- information flow -->
  <path d="M756 250 L756 130" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#up)"/>
  <path d="M812 130 L812 250" stroke="#b8b3ad" stroke-width="2" marker-end="url(#dn)"/>
  <path d="M756 374 L756 254" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#up)"/>
  <path d="M812 254 L812 374" stroke="#b8b3ad" stroke-width="2" marker-end="url(#dn)"/>

  <defs>
    <marker id="up" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <text x="748" y="452" fill="rgb(212,168,83)" font-size="11" font-weight="700">보고</text>
  <text x="800" y="452" fill="#b8b3ad" font-size="11" font-weight="700">지시</text>

  <!-- roles at bronze level -->
  <text x="30" y="452" fill="#b8b3ad" font-size="11">동 층의 세 역할</text>
  <text class="code" x="122" y="452" fill="#b8b3ad">Commander · Communications · Technical leader</text>
</svg>

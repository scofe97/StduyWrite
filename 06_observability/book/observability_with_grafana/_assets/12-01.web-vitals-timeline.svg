<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Web Vitals 여섯 지표가 페이지 수명의 어디를 재는가</title>
  <desc>여섯 지표는 페이지 수명의 서로 다른 구간을 잽니다. TTFB 는 요청부터 응답 첫 바이트까지, FCP 는 페이지가 처음 무언가를 그릴 때까지, LCP 는 가장 큰 요소가 그려질 때까지를 재며 여기까지가 로딩 구간입니다. FID 는 첫 상호작용의 지연을, INP 는 세션 전체 상호작용 중 가장 느린 것을 재고, CLS 는 세션 내내 요소가 움직인 정도를 누적합니다. 목표값은 LCP 2.5초 이하, FID 100밀리초 이하, CLS 0.1 이하, TTFB 0.8초 이하, FCP 1.8초 이하, INP 200밀리초 이하입니다. 책은 Core Web Vitals 로 LCP 와 FID 와 CLS 를 들지만 FID 는 2024년 3월 12일 INP 로 대체됐습니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="880" height="500" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">여섯 지표가 재는 구간</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">로딩과 상호작용은 다른 시간축이다</text>

  <defs>
    <marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <!-- loading phase -->
  <rect x="30" y="76" width="820" height="182" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="30" y="76" width="820" height="28" rx="8" fill="rgb(212,168,83)"/>
  <rect x="30" y="96" width="820" height="8" fill="rgb(212,168,83)"/>
  <text x="48" y="96" fill="#0d0d0d" font-size="12.5" font-weight="700">로딩 — 한 번 일어난다</text>

  <line x1="60" y1="128" x2="820" y2="128" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#t)"/>
  <text x="60" y="120" fill="#b8b3ad" font-size="10.5">요청</text>
  <text x="770" y="120" fill="#b8b3ad" font-size="10.5">그리기 완료</text>

  <line x1="60" y1="122" x2="60" y2="134" stroke="#b8b3ad" stroke-width="1.5"/>
  <line x1="260" y1="122" x2="260" y2="134" stroke="#b8b3ad" stroke-width="1.5"/>
  <line x1="460" y1="122" x2="460" y2="134" stroke="#b8b3ad" stroke-width="1.5"/>
  <line x1="820" y1="122" x2="820" y2="134" stroke="#b8b3ad" stroke-width="1.5"/>

  <rect x="60" y="146" width="200" height="46" rx="5" fill="#fdf3df"/>
  <text x="72" y="164" fill="#5c4410" font-size="11.5" font-weight="700">TTFB</text>
  <text x="72" y="182" fill="#5c4410" font-size="10.5">응답 첫 바이트까지</text>
  <rect x="196" y="150" width="56" height="18" rx="3" fill="#fdf3df" stroke="#5c4410" stroke-width="1"/>
  <text class="code" x="204" y="163" fill="#5c4410" font-weight="700">≤ 0.8s</text>

  <rect x="270" y="146" width="190" height="46" rx="5" fill="#fdf3df"/>
  <text x="282" y="164" fill="#5c4410" font-size="11.5" font-weight="700">FCP</text>
  <text x="282" y="182" fill="#5c4410" font-size="10.5">뭐라도 처음 보일 때</text>
  <rect x="396" y="150" width="56" height="18" rx="3" fill="#fdf3df" stroke="#5c4410" stroke-width="1"/>
  <text class="code" x="404" y="163" fill="#5c4410" font-weight="700">≤ 1.8s</text>

  <rect x="470" y="146" width="350" height="46" rx="5" fill="#66bb6a"/>
  <text x="482" y="164" fill="#0d0d0d" font-size="11.5" font-weight="700">LCP — 코어</text>
  <text x="482" y="182" fill="#1a1a1a" font-size="10.5">가장 큰 요소가 다 보일 때</text>
  <rect x="750" y="150" width="56" height="18" rx="3" fill="#e6f7e7"/>
  <text class="code" x="758" y="163" fill="#14521d" font-weight="700">≤ 2.5s</text>

  <rect x="60" y="204" width="760" height="40" rx="5" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1"/>
  <text x="76" y="228" fill="rgb(212,168,83)" font-size="11" font-weight="700">셋 다 방문자가 기다리는 시간이다</text>
  <text x="380" y="228" fill="#b8b3ad" font-size="11">TTFB 만 눈에 안 보인다</text>

  <!-- interaction phase -->
  <rect x="30" y="272" width="820" height="146" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="30" y="272" width="820" height="28" rx="8" fill="#5b9bd5"/>
  <rect x="30" y="292" width="820" height="8" fill="#5b9bd5"/>
  <text x="48" y="292" fill="#e8e4df" font-size="12.5" font-weight="700">상호작용 — 세션 내내 이어진다</text>

  <rect x="48" y="314" width="256" height="86" rx="6" fill="#f2b8b5"/>
  <text x="62" y="336" fill="#5c1414" font-size="11.5" font-weight="700">FID — 옛 코어</text>
  <text x="62" y="356" fill="#5c1414" font-size="10.5">첫 클릭의 처리 지연만</text>
  <rect x="62" y="366" width="60" height="18" rx="3" fill="#f2d4d4"/>
  <text class="code" x="70" y="379" fill="#7a1f1f" font-weight="700">≤ 100ms</text>
  <text x="134" y="379" fill="#5c1414" font-size="10.5" font-weight="700">2024-03 대체됨</text>

  <rect x="318" y="314" width="256" height="86" rx="6" fill="#5b9bd5"/>
  <text x="332" y="336" fill="#e8e4df" font-size="11.5" font-weight="700">INP — 현 코어</text>
  <text x="332" y="356" fill="#e8e4df" font-size="10.5">전체 중 가장 느린 것</text>
  <rect x="332" y="366" width="60" height="18" rx="3" fill="#dceaf7"/>
  <text class="code" x="340" y="379" fill="#10243a">≤ 200ms</text>
  <text x="404" y="379" fill="#e8e4df" font-size="10.5">이상치는 뺀다</text>

  <rect x="588" y="314" width="262" height="86" rx="6" fill="#66bb6a"/>
  <text x="602" y="336" fill="#0d0d0d" font-size="11.5" font-weight="700">CLS — 코어</text>
  <text x="602" y="356" fill="#1a1a1a" font-size="10.5">요소가 움직인 정도 누적</text>
  <rect x="602" y="366" width="52" height="18" rx="3" fill="#e6f7e7"/>
  <text class="code" x="610" y="379" fill="#14521d" font-weight="700">≤ 0.1</text>
  <text x="666" y="379" fill="#1a1a1a" font-size="10.5">유일한 무단위</text>

  <!-- drift note -->
  <rect x="30" y="432" width="820" height="46" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.8"/>
  <text x="50" y="461" fill="#f44336" font-size="12" font-weight="700">책은 FID 를 코어로 든다</text>
  <rect x="264" y="444" width="270" height="24" rx="4" fill="#f2d4d4"/>
  <text x="276" y="461" fill="#7a1f1f" font-size="11" font-weight="700">지금은 LCP · INP · CLS</text>
  <text x="552" y="461" fill="#b8b3ad" font-size="11">책이 예고한 교체가 실제로 일어났다</text>
</svg>

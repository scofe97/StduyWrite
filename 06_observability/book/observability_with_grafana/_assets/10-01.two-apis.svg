<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Cloud API 와 Grafana API 의 관할 범위와 인증 방식</title>
  <desc>Cloud API 는 Grafana Cloud SaaS 설치만 관리하며 접근 정책과 토큰, 스택, 플러그인, 리전을 다룹니다. API keys 는 폐기 예정입니다. Grafana API 는 Grafana 자체를 관리하며 Cloud 와 로컬 설치 양쪽에 쓸 수 있고 대시보드와 폴더, 권한, 팀, 알림을 다룹니다. 인증에서 Grafana API 만 서비스 계정을 추가로 제공하며 애플리케이션은 서비스 계정을 써야 합니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10.5px; }
  </style>

  <rect width="880" height="450" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">API 가 둘로 갈린다</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">프런트엔드가 쓰는 바로 그 API 다</text>

  <!-- Cloud API -->
  <rect x="30" y="76" width="400" height="240" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="30" y="76" width="400" height="32" rx="8" fill="rgb(212,168,83)"/>
  <rect x="30" y="100" width="400" height="8" fill="rgb(212,168,83)"/>
  <text x="48" y="99" fill="#0d0d0d" font-size="13.5" font-weight="700">Cloud API</text>

  <rect x="48" y="120" width="364" height="24" rx="4" fill="#fdf3df"/>
  <text x="58" y="137" fill="#5c4410" font-size="11.5" font-weight="700">SaaS 설치만 관리한다</text>

  <rect x="48" y="152" width="364" height="24" rx="4" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1"/>
  <text class="code" x="58" y="169" fill="#e8e4df">Access policies · tokens</text>
  <rect x="48" y="180" width="364" height="24" rx="4" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1"/>
  <text class="code" x="58" y="197" fill="#e8e4df">Stacks</text>
  <text x="112" y="197" fill="#e8e4df" font-size="11">생성·재시작·데이터 소스</text>
  <rect x="48" y="208" width="364" height="24" rx="4" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1"/>
  <text class="code" x="58" y="225" fill="#e8e4df">Grafana plugins · Regions</text>

  <rect x="48" y="240" width="364" height="26" rx="4" fill="#f2d4d4"/>
  <text x="58" y="258" fill="#7a1f1f" font-size="11" font-weight="700">API keys — 폐기 예정</text>

  <text x="48" y="288" fill="#b8b3ad" font-size="11">토큰은 반드시</text>
  <text class="code" x="128" y="288" fill="#b8b3ad">accessPolicyId</text>
  <text x="228" y="288" fill="#b8b3ad" font-size="11">에 묶인다</text>
  <text x="48" y="306" fill="#b8b3ad" font-size="11">Terraform 이 기능이 더 많다</text>

  <!-- Grafana API -->
  <rect x="450" y="76" width="400" height="240" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="450" y="76" width="400" height="32" rx="8" fill="#5b9bd5"/>
  <rect x="450" y="100" width="400" height="8" fill="#5b9bd5"/>
  <text x="468" y="99" fill="#e8e4df" font-size="13.5" font-weight="700">Grafana API</text>

  <rect x="468" y="120" width="364" height="24" rx="4" fill="#dceaf7"/>
  <text x="478" y="137" fill="#10243a" font-size="11.5" font-weight="700">Cloud 와 로컬 양쪽</text>

  <rect x="468" y="152" width="364" height="24" rx="4" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1"/>
  <text class="code" x="478" y="169" fill="#e8e4df">Dashboard · Folder</text>
  <rect x="468" y="180" width="364" height="24" rx="4" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1"/>
  <text class="code" x="478" y="197" fill="#e8e4df">Permissions · Search · Teams</text>
  <rect x="468" y="208" width="364" height="24" rx="4" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1"/>
  <text class="code" x="478" y="225" fill="#e8e4df">Alerting</text>
  <text x="540" y="225" fill="#e8e4df" font-size="11">Alertmanager 전체</text>

  <rect x="468" y="240" width="364" height="26" rx="4" fill="#dceaf7"/>
  <text x="478" y="258" fill="#10243a" font-size="11" font-weight="700">앱은 서비스 계정을 쓴다</text>

  <text x="468" y="288" fill="#b8b3ad" font-size="11">권한은 숫자다</text>
  <text class="code" x="552" y="288" fill="#b8b3ad">1 View · 2 Edit · 4 Admin</text>
  <text x="468" y="306" fill="#b8b3ad" font-size="11">알림 코드화는 Terraform 만</text>

  <!-- ID vs UID -->
  <rect x="30" y="330" width="820" height="100" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <text x="50" y="354" fill="#66bb6a" font-size="13" font-weight="700">ID 와 UID 를 구분한다</text>

  <rect x="50" y="366" width="390" height="46" rx="5" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1"/>
  <text class="code" x="62" y="386" fill="#e8e4df" font-weight="700">ID</text>
  <text x="92" y="386" fill="#e8e4df" font-size="11.5">특정 설치 안에서만 고유</text>
  <text x="62" y="404" fill="#b8b3ad" font-size="10.5">ID 기반 권한 API 는 폐기</text>

  <rect x="456" y="366" width="376" height="46" rx="5" fill="#e6f7e7"/>
  <text class="code" x="468" y="386" fill="#14521d" font-weight="700">UID</text>
  <text x="504" y="386" fill="#14521d" font-size="11.5" font-weight="700">설치를 넘어 고유</text>
  <text x="468" y="404" fill="#14521d" font-size="10.5">환경을 넘어 가리키려면 이쪽</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>내 애플리케이션을 데모 클러스터에 붙이는 자리</title>
  <desc>k3d 단일 노드 클러스터 안에 이미 배포된 OpenTelemetry Collector 가 OTLP 수신구를 두 개 열어 두고 있습니다. 4317은 gRPC, 4318은 HTTP입니다. 내 애플리케이션을 컨테이너로 패키징해 같은 클러스터에 배포하고 이 두 주소 중 하나로 보내면 됩니다. k3d 는 기본으로 Flannel 과 Traefik 을 쓰므로 다른 CNI 나 인그레스를 전제한 매니페스트는 어긋날 수 있습니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10.5px; }
  </style>

  <rect width="880" height="430" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">내 앱을 붙이는 자리</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">수신구는 이미 열려 있다</text>

  <!-- cluster boundary -->
  <rect x="30" y="76" width="820" height="264" rx="10" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="50" y="100" fill="#5b9bd5" font-size="12.5" font-weight="700">k3d — 단일 노드 클러스터</text>

  <!-- existing demo -->
  <rect x="52" y="116" width="300" height="86" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="70" y="142" fill="#e8e4df" font-size="13" font-weight="700">OpenTelemetry Demo</text>
  <text x="70" y="163" fill="#b8b3ad" font-size="11.5">마이크로서비스 19개 Pod</text>
  <text x="70" y="184" fill="#b8b3ad" font-size="11.5">이미 배포돼 있다</text>

  <!-- my app -->
  <rect x="52" y="220" width="300" height="96" rx="8" fill="#66bb6a"/>
  <text x="70" y="248" fill="#0d0d0d" font-size="13" font-weight="700">내 애플리케이션</text>
  <text x="70" y="270" fill="#1a1a1a" font-size="11.5">컨테이너로 패키징해 배포</text>
  <rect x="70" y="280" width="264" height="22" rx="3" fill="#e6f7e7"/>
  <text class="code" x="80" y="295" fill="#14521d">OTEL_EXPORTER_OTLP_ENDPOINT</text>

  <!-- arrows -->
  <path d="M356 268 L440 268 L440 190 L470 190" fill="none" stroke="#66bb6a" stroke-width="2.2" marker-end="url(#g)"/>
  <path d="M356 159 L440 159 L440 148 L470 148" fill="none" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#s)"/>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#66bb6a"/>
    </marker>
    <marker id="s" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <!-- collector -->
  <rect x="474" y="116" width="354" height="200" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="474" y="116" width="354" height="32" rx="8" fill="rgb(212,168,83)"/>
  <rect x="474" y="140" width="354" height="8" fill="rgb(212,168,83)"/>
  <text x="492" y="139" fill="#0d0d0d" font-size="13" font-weight="700">OTel Collector</text>

  <text x="492" y="172" fill="#e8e4df" font-size="12">OTLP 수신구 두 개</text>

  <rect x="492" y="184" width="318" height="34" rx="5" fill="#fdf3df"/>
  <text class="code" x="504" y="205" fill="#5c4410">4317   gRPC</text>

  <rect x="492" y="226" width="318" height="34" rx="5" fill="#fdf3df"/>
  <text class="code" x="504" y="247" fill="#5c4410">4318   HTTP(s)</text>

  <text x="492" y="284" fill="#b8b3ad" font-size="11.5">브라우저 스팬은 4318 로</text>
  <text x="492" y="304" fill="#b8b3ad" font-size="11.5">→ Grafana Cloud 로</text>

  <!-- caveat -->
  <rect x="30" y="356" width="820" height="56" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="50" y="380" fill="#f44336" font-size="12.5" font-weight="700">k3d 는 의견이 강하다</text>
  <text x="50" y="400" fill="#e8e4df" font-size="12">기본 구성</text>
  <text class="code" x="120" y="400" fill="#e8e4df">Flannel (CNI) · Traefik (ingress)</text>
</svg>

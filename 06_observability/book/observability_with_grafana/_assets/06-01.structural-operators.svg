<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>TraceQL 구조 연산자 세 가지가 고르는 스팬 관계</title>
  <desc>자식 연산자는 바로 아래 직계 자식만 고릅니다. 자손 연산자는 중간에 다른 서비스가 끼어 있어도 트레이스 안 어디든 아래쪽이면 고릅니다. 형제 연산자는 같은 부모를 공유하는 스팬을 고릅니다. 직계만 보는 자식 연산자로는 중간에 checkout 이 끼인 cartservice 를 놓칩니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10.5px; }
  </style>

  <rect width="880" height="400" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">구조 연산자 — 관계로 고른다</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">TraceQL 만의 것</text>

  <!-- child -->
  <rect x="30" y="76" width="265" height="290" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="76" width="265" height="30" rx="8" fill="#66bb6a"/>
  <rect x="30" y="98" width="265" height="8" fill="#66bb6a"/>
  <text x="48" y="97" fill="#0d0d0d" font-size="13" font-weight="700">자식 — 직계만</text>

  <rect x="48" y="120" width="229" height="22" rx="3" fill="#e6f7e7"/>
  <text class="code" x="58" y="135" fill="#14521d">{A} &gt; {B}</text>

  <rect x="84" y="164" width="150" height="30" rx="5" fill="#e6f7e7"/>
  <text x="96" y="184" fill="#14521d" font-size="11.5" font-weight="700">frontend</text>
  <path d="M159 194 L159 220" stroke="#66bb6a" stroke-width="2.2" marker-end="url(#g)"/>
  <rect x="84" y="224" width="150" height="30" rx="5" fill="#e6f7e7"/>
  <text x="96" y="244" fill="#14521d" font-size="11" font-weight="700">productcatalog</text>

  <text x="48" y="288" fill="#e8e4df" font-size="11.5">바로 아래만 걸린다</text>
  <text x="48" y="310" fill="#b8b3ad" font-size="11">한 칸 건너뛰면 안 걸린다</text>

  <!-- descendant -->
  <rect x="308" y="76" width="265" height="290" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="308" y="76" width="265" height="30" rx="8" fill="rgb(212,168,83)"/>
  <rect x="308" y="98" width="265" height="8" fill="rgb(212,168,83)"/>
  <text x="326" y="97" fill="#0d0d0d" font-size="13" font-weight="700">자손 — 어디든 아래</text>

  <rect x="326" y="120" width="229" height="22" rx="3" fill="#fdf3df"/>
  <text class="code" x="336" y="135" fill="#5c4410">{A} &gt;&gt; {B}</text>

  <rect x="362" y="156" width="150" height="26" rx="5" fill="#fdf3df"/>
  <text x="374" y="174" fill="#5c4410" font-size="11.5" font-weight="700">frontend</text>
  <path d="M437 182 L437 200" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="3 2"/>
  <rect x="362" y="204" width="150" height="26" rx="5" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1"/>
  <text x="374" y="222" fill="#b8b3ad" font-size="11">checkout</text>
  <path d="M437 230 L437 248" stroke="rgb(212,168,83)" stroke-width="2.2" marker-end="url(#am)"/>
  <rect x="362" y="252" width="150" height="26" rx="5" fill="#fdf3df"/>
  <text x="374" y="270" fill="#5c4410" font-size="11.5" font-weight="700">cartservice</text>

  <text x="326" y="304" fill="#e8e4df" font-size="11.5">중간에 끼어 있어도 걸린다</text>
  <text x="326" y="326" fill="#b8b3ad" font-size="11">직계만 보면 놓치는 경우</text>

  <!-- sibling -->
  <rect x="586" y="76" width="264" height="290" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="586" y="76" width="264" height="30" rx="8" fill="#5b9bd5"/>
  <rect x="586" y="98" width="264" height="8" fill="#5b9bd5"/>
  <text x="604" y="97" fill="#e8e4df" font-size="13" font-weight="700">형제 — 같은 부모</text>

  <rect x="604" y="120" width="228" height="22" rx="3" fill="#dceaf7"/>
  <text class="code" x="614" y="135" fill="#10243a">{A} ~ {B}</text>

  <rect x="643" y="164" width="150" height="26" rx="5" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1"/>
  <text x="655" y="182" fill="#b8b3ad" font-size="11">같은 부모</text>
  <path d="M690 190 L690 214 L668 214 L668 224" fill="none" stroke="#5b9bd5" stroke-width="2" marker-end="url(#b)"/>
  <path d="M718 190 L718 214 L768 214 L768 224" fill="none" stroke="#5b9bd5" stroke-width="2" marker-end="url(#b)"/>
  <rect x="608" y="228" width="120" height="26" rx="5" fill="#dceaf7"/>
  <text x="618" y="246" fill="#10243a" font-size="11" font-weight="700">frontend</text>
  <rect x="736" y="228" width="96" height="26" rx="5" fill="#dceaf7"/>
  <text x="746" y="246" fill="#10243a" font-size="11" font-weight="700">frontend</text>

  <text x="604" y="288" fill="#e8e4df" font-size="11.5">같은 서비스를 여러 번</text>
  <text x="604" y="310" fill="#b8b3ad" font-size="11">방문한 스팬을 찾는다</text>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#66bb6a"/>
    </marker>
    <marker id="am" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b9bd5"/>
    </marker>
  </defs>
</svg>

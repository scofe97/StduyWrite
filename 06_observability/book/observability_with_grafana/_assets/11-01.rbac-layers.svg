<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>RBAC 가 걸리는 두 곳과 역할 체계</title>
  <desc>RBAC 는 Grafana Cloud 의 스택 관리와 과금에 하나, Grafana 인스턴스의 데이터와 시각화 접근에 하나씩 걸립니다. Cloud 는 Admin 과 Editor 와 Viewer 세 역할을 두며 보기 계열은 대체로 셋 다 되고 관리 계열은 대체로 Admin 만 됩니다. 인스턴스는 기본 역할 위에 고정 역할로 권한을 확장하고 커스텀 역할은 API 로만 만들되 Terraform 으로 관리합니다. Cloud 에서는 조직 대신 스택으로 자원을 분리합니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="880" height="470" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">RBAC 는 두 곳에 걸린다</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">관리하는 것과 쓰는 것은 다른 문제다</text>

  <!-- Cloud -->
  <rect x="30" y="76" width="400" height="200" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="30" y="76" width="400" height="30" rx="8" fill="rgb(212,168,83)"/>
  <rect x="30" y="98" width="400" height="8" fill="rgb(212,168,83)"/>
  <text x="48" y="97" fill="#0d0d0d" font-size="13" font-weight="700">Grafana Cloud</text>
  <text x="48" y="128" fill="#e8e4df" font-size="12">스택 관리와 과금</text>

  <rect x="48" y="140" width="364" height="26" rx="4" fill="#fdf3df"/>
  <text x="58" y="158" fill="#5c4410" font-size="11" font-weight="700">보기 계열 — 대체로 셋 다 된다</text>
  <rect x="48" y="170" width="364" height="26" rx="4" fill="#fdf3df"/>
  <text x="58" y="188" fill="#5c4410" font-size="11" font-weight="700">관리 계열 — 대체로 Admin 만</text>

  <rect x="48" y="204" width="364" height="54" rx="5" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1"/>
  <text x="58" y="223" fill="rgb(212,168,83)" font-size="11" font-weight="700">예외 둘 — Editor 도 되는 것</text>
  <text class="code" x="58" y="243" fill="#e8e4df">Manage stacks · Open support tickets</text>

  <!-- Instance -->
  <rect x="450" y="76" width="400" height="200" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="450" y="76" width="400" height="30" rx="8" fill="#5b9bd5"/>
  <rect x="450" y="98" width="400" height="8" fill="#5b9bd5"/>
  <text x="468" y="97" fill="#e8e4df" font-size="13" font-weight="700">Grafana 인스턴스</text>
  <text x="468" y="128" fill="#e8e4df" font-size="12">데이터와 시각화 접근</text>

  <rect x="468" y="140" width="364" height="26" rx="4" fill="#dceaf7"/>
  <text x="478" y="158" fill="#10243a" font-size="11" font-weight="700">Cloud 든 온프렘이든 적용된다</text>

  <rect x="468" y="172" width="176" height="26" rx="4" fill="#dceaf7"/>
  <text x="478" y="190" fill="#10243a" font-size="10.5">데이터 소스 · 팀</text>
  <rect x="656" y="172" width="176" height="26" rx="4" fill="#dceaf7"/>
  <text x="666" y="190" fill="#10243a" font-size="10.5">대시보드 · 폴더</text>

  <rect x="468" y="204" width="364" height="54" rx="5" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1"/>
  <text x="478" y="223" fill="#8fc0e8" font-size="11" font-weight="700">폴더 단위로 팀에 관리 권한</text>
  <text x="478" y="243" fill="#e8e4df" font-size="11">다른 팀 폴더는 안 준다</text>

  <!-- role hierarchy -->
  <text x="30" y="304" fill="#e8e4df" font-size="13" font-weight="700">역할은 세 층이다</text>

  <rect x="30" y="316" width="265" height="130" rx="8" fill="#66bb6a"/>
  <text x="48" y="342" fill="#0d0d0d" font-size="12.5" font-weight="700">기본 역할</text>
  <text x="48" y="362" fill="#1a1a1a" font-size="10.5">권한 범위가 아주 넓다</text>
  <rect x="48" y="372" width="229" height="24" rx="4" fill="#e6f7e7"/>
  <text class="code" x="58" y="388" fill="#14521d">Admin · Editor · Viewer · None</text>
  <text x="48" y="416" fill="#1a1a1a" font-size="10.5">None 은 서비스 계정용</text>
  <text x="48" y="434" fill="#14521d" font-size="10.5" font-weight="700">최소 권한으로 배정한다</text>

  <rect x="308" y="316" width="265" height="130" rx="8" fill="rgb(212,168,83)"/>
  <text x="326" y="342" fill="#0d0d0d" font-size="12.5" font-weight="700">고정 역할</text>
  <text x="326" y="362" fill="#1a1a1a" font-size="10.5">기본 역할의 권한을 확장</text>
  <rect x="326" y="372" width="229" height="24" rx="4" fill="#fdf3df"/>
  <text x="336" y="388" fill="#5c4410" font-size="10.5" font-weight="700">특정 권한 배정을 담는다</text>
  <text x="326" y="416" fill="#1a1a1a" font-size="10.5">기본 역할 자체가</text>
  <text x="326" y="434" fill="#1a1a1a" font-size="10.5">고정 역할의 기본 묶음</text>

  <rect x="586" y="316" width="264" height="130" rx="8" fill="#5b9bd5"/>
  <text x="604" y="342" fill="#e8e4df" font-size="12.5" font-weight="700">커스텀 역할</text>
  <text x="604" y="362" fill="#e8e4df" font-size="10.5">권한·행동·범위를 직접</text>
  <rect x="604" y="372" width="228" height="24" rx="4" fill="#f2d4d4"/>
  <text x="614" y="388" fill="#7a1f1f" font-size="10.5" font-weight="700">API 로만 만들 수 있다</text>
  <rect x="604" y="404" width="228" height="24" rx="4" fill="#dceaf7"/>
  <text x="614" y="420" fill="#10243a" font-size="10.5" font-weight="700">Terraform 으로 관리</text>
</svg>

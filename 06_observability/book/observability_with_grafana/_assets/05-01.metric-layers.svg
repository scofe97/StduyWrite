<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>이름과 라벨과 값이 만드는 메트릭·시계열·샘플 세 층</title>
  <desc>Prometheus 호환 시스템은 타임스탬프와 키-값 라벨과 샘플 값을 받습니다. 고유한 __name__ 값 하나가 메트릭 하나를 만들고, 고유한 라벨 집합 하나가 시계열 하나를 만들며, 시간이 흐르며 쌓이는 값들이 각기 다른 타임스탬프를 가진 샘플이 됩니다. 라벨의 고유값 개수를 카디널리티라 부르며 높으면 저장 비용이 크게 오릅니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10.5px; }
  </style>

  <rect width="880" height="400" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">무엇이 무엇을 만드는가</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">라벨이 세 층을 만든다</text>

  <!-- layer 1: metric -->
  <rect x="30" y="76" width="820" height="84" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="76" width="200" height="84" rx="8" fill="#66bb6a"/>
  <text x="48" y="106" fill="#0d0d0d" font-size="14" font-weight="700">메트릭</text>
  <text x="48" y="128" fill="#1a1a1a" font-size="11.5">이름 하나</text>

  <text class="code" x="252" y="104" fill="#e8e4df">__name__</text>
  <text x="318" y="104" fill="#e8e4df" font-size="12.5">하나 = 메트릭 하나</text>
  <rect x="252" y="116" width="360" height="24" rx="4" fill="#e6f7e7"/>
  <text class="code" x="262" y="132" fill="#14521d">http_requests_total</text>

  <path d="M440 160 L440 180" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <text x="452" y="176" fill="#b8b3ad" font-size="11">라벨이 갈라 놓는다</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- layer 2: series -->
  <rect x="30" y="184" width="820" height="98" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="30" y="184" width="200" height="98" rx="8" fill="rgb(212,168,83)"/>
  <text x="48" y="214" fill="#0d0d0d" font-size="14" font-weight="700">시계열</text>
  <text x="48" y="236" fill="#1a1a1a" font-size="11.5">라벨 집합 하나</text>

  <text x="252" y="210" fill="#e8e4df" font-size="12.5">고유한 라벨 집합 하나가 시계열 하나</text>
  <rect x="252" y="222" width="360" height="22" rx="3" fill="#fdf3df"/>
  <text class="code" x="262" y="237" fill="#5c4410">{method="GET", status="200"}</text>
  <rect x="252" y="250" width="360" height="22" rx="3" fill="#fdf3df"/>
  <text class="code" x="262" y="265" fill="#5c4410">{method="GET", status="500"}</text>

  <rect x="632" y="222" width="200" height="50" rx="4" fill="#f2d4d4"/>
  <text x="642" y="242" fill="#7a1f1f" font-size="11" font-weight="700">카디널리티가 높으면</text>
  <text x="642" y="260" fill="#7a1f1f" font-size="11" font-weight="700">저장 비용이 크게 오른다</text>

  <path d="M440 282 L440 302" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <text x="452" y="298" fill="#b8b3ad" font-size="11">시간이 쌓는다</text>

  <!-- layer 3: samples -->
  <rect x="30" y="306" width="820" height="76" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="30" y="306" width="200" height="76" rx="8" fill="#5b9bd5"/>
  <text x="48" y="334" fill="#e8e4df" font-size="14" font-weight="700">샘플</text>
  <text x="48" y="356" fill="#e8e4df" font-size="11.5">값 여럿</text>

  <text x="252" y="332" fill="#e8e4df" font-size="12.5">각기 다른 타임스탬프를 가진 값들</text>
  <rect x="252" y="344" width="360" height="24" rx="4" fill="#dceaf7"/>
  <text class="code" x="262" y="361" fill="#10243a">1712... 42   1712... 47   1712... 51</text>
</svg>

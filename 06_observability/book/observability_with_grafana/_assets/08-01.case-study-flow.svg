<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Steven 의 요구 한 문장이 대시보드 두 층이 되는 과정</title>
  <desc>서비스 관리자 Steven 의 요구 한 문장을 최상위 시스템 뷰와 문제 지시자와 상세 정보와 담당자 식별 넷으로 쪼갭니다. 첫 행은 타임라인을 붙인 Stat 으로 왼쪽에서 오른쪽으로 중요한 순서대로 놓고 포화도는 Gauge 로 표현하며 thresholds 와 overrides 와 value mappings 로 시선을 끕니다. 둘째 층은 행 하나를 팀 하나로 삼고 첫 패널을 텍스트 패널로 만들어 연락처를 둡니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="880" height="470" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">요구 한 문장에서 대시보드로</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">Steven — 서비스 관리자</text>

  <!-- requirement -->
  <rect x="30" y="76" width="820" height="54" rx="8" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="50" y="100" fill="#e8e4df" font-size="12">넓은 그림을 보여 주고,</text>
  <text x="252" y="100" fill="rgb(212,168,83)" font-size="12" font-weight="700">누가 해결할 수 있는지</text>
  <text x="396" y="100" fill="#e8e4df" font-size="12">알려 주는 전체 시스템 뷰</text>
  <text x="50" y="120" fill="#b8b3ad" font-size="11">자기 컴퓨터에서 본다</text>

  <path d="M440 130 L440 150" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- four needs -->
  <rect x="30" y="154" width="196" height="52" rx="6" fill="#fdf3df"/>
  <text x="42" y="176" fill="#5c4410" font-size="11.5" font-weight="700">① 최상위 시스템 뷰</text>
  <rect x="238" y="154" width="196" height="52" rx="6" fill="#fdf3df"/>
  <text x="250" y="176" fill="#5c4410" font-size="11.5" font-weight="700">② 문제 지시자</text>
  <rect x="446" y="154" width="196" height="52" rx="6" fill="#fdf3df"/>
  <text x="458" y="176" fill="#5c4410" font-size="11.5" font-weight="700">③ 필요할 때 상세히</text>
  <rect x="654" y="154" width="196" height="52" rx="6" fill="#fdf3df"/>
  <text x="666" y="176" fill="#5c4410" font-size="11.5" font-weight="700">④ 누가 도울 수 있는가</text>

  <path d="M128 206 L128 232" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>
  <path d="M336 206 L336 232" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>
  <path d="M544 206 L544 306 L560 306" fill="none" stroke="#5b9bd5" stroke-width="2" marker-end="url(#b)"/>
  <path d="M752 206 L752 306" stroke="#5b9bd5" stroke-width="2" marker-end="url(#b)"/>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#66bb6a"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b9bd5"/>
    </marker>
  </defs>

  <!-- layer 1 -->
  <rect x="30" y="236" width="470" height="106" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="236" width="470" height="28" rx="8" fill="#66bb6a"/>
  <rect x="30" y="256" width="470" height="8" fill="#66bb6a"/>
  <text x="48" y="256" fill="#0d0d0d" font-size="12.5" font-weight="700">첫 행 — first-look 영역</text>

  <text x="48" y="284" fill="#e8e4df" font-size="11.5">왼쪽에서 오른쪽으로, 중요한 것부터</text>
  <rect x="48" y="294" width="200" height="22" rx="3" fill="#e6f7e7"/>
  <text x="58" y="309" fill="#14521d" font-size="11">Stat + 타임라인</text>
  <rect x="258" y="294" width="224" height="22" rx="3" fill="#e6f7e7"/>
  <text x="268" y="309" fill="#14521d" font-size="11">포화도는 Gauge</text>
  <text class="code" x="48" y="332" fill="#b8b3ad">thresholds · overrides · value mappings</text>

  <!-- layer 2 -->
  <rect x="516" y="236" width="334" height="106" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="516" y="236" width="334" height="28" rx="8" fill="#5b9bd5"/>
  <rect x="516" y="256" width="334" height="8" fill="#5b9bd5"/>
  <text x="534" y="256" fill="#e8e4df" font-size="12.5" font-weight="700">둘째 층 — 상세</text>

  <text x="534" y="284" fill="#e8e4df" font-size="11.5">먼저 묻는다</text>
  <text x="534" y="304" fill="#b8b3ad" font-size="11">이 대시보드에 자리가 있는가</text>
  <text x="534" y="322" fill="#b8b3ad" font-size="11">아니면 드릴다운할 것인가</text>

  <!-- the key trick -->
  <rect x="30" y="358" width="820" height="96" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <text x="50" y="382" fill="rgb(212,168,83)" font-size="13" font-weight="700">④ 를 푸는 방법</text>

  <rect x="50" y="392" width="380" height="46" rx="5" fill="#fdf3df"/>
  <text x="62" y="412" fill="#5c4410" font-size="11.5" font-weight="700">행 하나 = 팀 하나</text>
  <text x="62" y="430" fill="#5c4410" font-size="11">첫 패널 = 텍스트 패널 (연락처)</text>

  <text x="450" y="404" fill="#e8e4df" font-size="11.5">패널 설명으로 데이터를 풀고</text>
  <text x="450" y="424" fill="#e8e4df" font-size="11.5">대시보드 링크로 지원 페이지를 부른다</text>
</svg>

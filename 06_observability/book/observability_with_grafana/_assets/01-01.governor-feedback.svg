<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>원심 조속기의 되먹임 고리와 두 관점</title>
  <desc>증기기관 원심 조속기에서 구동축 회전이 조속기를 돌리고, 조속기가 스로틀을 조절하며, 스로틀이 다시 구동축 회전을 바꾸는 되먹임 고리입니다. 같은 장치를 모니터링은 사전 정의한 회전수 측정으로 보고, 관측 가능성은 외부 출력에서 내부 상태를 추론하는 방식으로 봅니다.</desc>

  <rect width="860" height="400" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">원심 조속기 — 같은 장치, 두 관점</text>

  <!-- feedback loop -->
  <rect x="30" y="60" width="500" height="180" rx="10" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="48" y="84" fill="#b8b3ad" font-size="12">되먹임 고리</text>

  <rect x="60" y="100" width="120" height="46" rx="6" fill="#dceaf7"/>
  <text x="120" y="128" text-anchor="middle" fill="#10243a" font-size="13" font-weight="700">구동축 회전</text>

  <rect x="230" y="100" width="120" height="46" rx="6" fill="#dceaf7"/>
  <text x="290" y="128" text-anchor="middle" fill="#10243a" font-size="13" font-weight="700">조속기</text>

  <rect x="400" y="100" width="110" height="46" rx="6" fill="#dceaf7"/>
  <text x="455" y="128" text-anchor="middle" fill="#10243a" font-size="13" font-weight="700">스로틀</text>

  <path d="M180 123 L226 123" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <path d="M350 123 L396 123" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <path d="M455 146 L455 196 L120 196 L120 150" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <text x="290" y="214" text-anchor="middle" fill="rgb(212,168,83)" font-size="12" font-weight="700">되돌아온다</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- monitoring -->
  <rect x="30" y="264" width="390" height="112" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="30" y="264" width="390" height="30" rx="8" fill="#5b9bd5"/>
  <rect x="30" y="286" width="390" height="8" fill="#5b9bd5"/>
  <text x="46" y="285" fill="#e8e4df" font-size="13" font-weight="700">모니터링</text>
  <text x="46" y="316" fill="#e8e4df" font-size="12.5">측정 대상을 미리 정의한다</text>
  <text x="46" y="338" fill="#b8b3ad" font-size="11.5">구동축 회전수 = 사전 정의된 메트릭</text>
  <text x="46" y="358" fill="#b8b3ad" font-size="11.5">피벗·액추에이터 로드가 제어</text>

  <!-- observability -->
  <rect x="440" y="264" width="390" height="112" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="440" y="264" width="390" height="30" rx="8" fill="rgb(212,168,83)"/>
  <rect x="440" y="286" width="390" height="8" fill="rgb(212,168,83)"/>
  <text x="456" y="285" fill="#0d0d0d" font-size="13" font-weight="700">관측 가능성</text>
  <text x="456" y="316" fill="#e8e4df" font-size="12.5">외부 출력에서 내부 상태를 추론</text>
  <text x="456" y="338" fill="#b8b3ad" font-size="11.5">너무 빠름 → 작동점 조정 오류</text>
  <text x="456" y="358" fill="#b8b3ad" font-size="11.5">너무 느림 → 슬라이딩 링 고착</text>

  <!-- payoff -->
  <rect x="560" y="60" width="270" height="180" rx="10" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="578" y="84" fill="#b8b3ad" font-size="12">관측이 덜어내는 두 가지</text>
  <rect x="578" y="100" width="234" height="52" rx="6" fill="#fdf3df"/>
  <text x="592" y="122" fill="#0d0d0d" font-size="12.5" font-weight="700">사전 정의가 없어도 된다</text>
  <text x="592" y="141" fill="#1a1a1a" font-size="11.5">"너무 빠름"을 안 정해도 안다</text>
  <rect x="578" y="164" width="234" height="52" rx="6" fill="#fdf3df"/>
  <text x="592" y="186" fill="#0d0d0d" font-size="12.5" font-weight="700">전체를 몰라도 된다</text>
  <text x="592" y="205" fill="#1a1a1a" font-size="11.5">증기기관 전체 지식 불필요</text>
</svg>

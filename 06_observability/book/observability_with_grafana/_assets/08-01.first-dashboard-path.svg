<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Explore 의 쿼리가 저장된 대시보드가 되기까지의 경로</title>
  <desc>Explore 에서 Prometheus 데이터 소스를 고르고 메트릭과 라벨 필터로 쿼리를 만든 뒤 Add to dashboard 로 새 대시보드에 담습니다. 처음 만들어진 패널은 범례를 읽기 어렵고 데이터가 의미를 주지 못하며 제목이 데이터와 무관한 세 가지 문제를 가집니다. 패널 편집기에서 제목을 붙이고 Type 을 Range only 로 바꾼 뒤 저장합니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10.5px; }
  </style>

  <rect width="880" height="400" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">Explore 에서 대시보드로</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">문제 있는 화면부터 만들고 고쳐 간다</text>

  <!-- step 1: explore -->
  <rect x="30" y="76" width="250" height="120" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="30" y="76" width="250" height="30" rx="8" fill="#5b9bd5"/>
  <rect x="30" y="98" width="250" height="8" fill="#5b9bd5"/>
  <text x="48" y="97" fill="#e8e4df" font-size="13" font-weight="700">Explore</text>

  <rect x="48" y="118" width="214" height="20" rx="3" fill="#dceaf7"/>
  <text class="code" x="56" y="132" fill="#10243a">app_frontend_requests_total</text>
  <rect x="48" y="144" width="214" height="20" rx="3" fill="#dceaf7"/>
  <text class="code" x="56" y="158" fill="#10243a">target = /api/cart</text>
  <text x="48" y="182" fill="#b8b3ad" font-size="11">Run query</text>

  <path d="M284 136 L322 136" stroke="rgb(212,168,83)" stroke-width="2.2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- step 2: add -->
  <rect x="326" y="76" width="230" height="120" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="344" y="102" fill="#e8e4df" font-size="12.5" font-weight="700">담는 경로</text>
  <text x="344" y="126" fill="#b8b3ad" font-size="11">Add</text>
  <text x="344" y="146" fill="#b8b3ad" font-size="11">→ Add to dashboard</text>
  <text x="344" y="166" fill="#b8b3ad" font-size="11">→ New dashboard</text>
  <text x="344" y="186" fill="#b8b3ad" font-size="11">→ Open dashboard</text>

  <path d="M560 136 L598 136" stroke="rgb(212,168,83)" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- step 3: first panel with problems -->
  <rect x="602" y="76" width="248" height="120" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.8"/>
  <rect x="602" y="76" width="248" height="30" rx="8" fill="#f2b8b5"/>
  <rect x="602" y="98" width="248" height="8" fill="#f2b8b5"/>
  <text x="620" y="97" fill="#5c1414" font-size="13" font-weight="700">첫 화면 — 문제 셋</text>

  <text x="620" y="126" fill="#e8e4df" font-size="11.5">범례를 읽기 어렵다</text>
  <text x="620" y="148" fill="#e8e4df" font-size="11.5">데이터가 의미를 못 준다</text>
  <text x="620" y="170" fill="#e8e4df" font-size="11.5">제목이 데이터와 무관하다</text>

  <path d="M726 196 L726 226" stroke="rgb(212,168,83)" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="738" y="220" fill="#b8b3ad" font-size="11">고친다</text>

  <!-- step 4: edit -->
  <rect x="30" y="230" width="820" height="86" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="230" width="200" height="86" rx="8" fill="#66bb6a"/>
  <text x="48" y="258" fill="#0d0d0d" font-size="13" font-weight="700">패널 편집기</text>
  <text x="48" y="280" fill="#1a1a1a" font-size="11">triple-dots → Edit</text>

  <rect x="252" y="248" width="280" height="24" rx="4" fill="#e6f7e7"/>
  <text x="264" y="265" fill="#14521d" font-size="11.5" font-weight="700">Title</text>
  <text class="code" x="306" y="265" fill="#14521d">Frontend Requests</text>

  <rect x="252" y="280" width="280" height="24" rx="4" fill="#e6f7e7"/>
  <text x="264" y="297" fill="#14521d" font-size="11.5" font-weight="700">Type — Range only</text>

  <text x="552" y="265" fill="#b8b3ad" font-size="11">기본은 둘을 함께 보여준다</text>
  <text x="552" y="285" fill="#b8b3ad" font-size="11">시계열에 단일 값이 섞여 어색하다</text>
  <text x="552" y="305" fill="#e8e4df" font-size="11">Apply 로 대시보드에 반영</text>

  <!-- step 5: save -->
  <rect x="30" y="332" width="820" height="52" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="50" y="354" fill="rgb(212,168,83)" font-size="12.5" font-weight="700">저장</text>
  <text class="code" x="92" y="354" fill="rgb(212,168,83)">Frontend Dashboard</text>
  <text x="50" y="374" fill="#b8b3ad" font-size="11">패널 하나로는 아직 부족하다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>관측 플랫폼의 네 계층과 각 층의 책임 주체</title>
  <desc>데이터 생산 계층은 개발자나 운영 전문가가 관리하며 이 장이 다루지 않습니다. 수집 계층은 전문 운영 팀과 SRE 와 플랫폼 엔지니어가 IaC 와 정적 분석으로 관리합니다. 저장 계층은 대개 전담 제3자가 맡거나 조직 내부라면 수집 계층과 같은 팀이 맡습니다. 시각화 계층은 공유 책임이며 각 팀이 자기 대시보드를 소유하고 수집과 저장을 맡은 팀이 나머지 조직에 권한을 줍니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10.5px; }
  </style>

  <rect width="880" height="450" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">네 층으로 나누면 주인이 정해진다</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">이 장은 뒤의 셋만 다룬다</text>

  <!-- layer 1: excluded -->
  <rect x="30" y="76" width="820" height="76" rx="8" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="30" y="76" width="200" height="76" rx="8" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="48" y="104" fill="#b8b3ad" font-size="13.5" font-weight="700">① 데이터 생산</text>
  <text x="48" y="126" fill="#b8b3ad" font-size="11">애플리케이션·인프라</text>

  <text x="252" y="104" fill="#b8b3ad" font-size="12">개발자 · 운영 전문가</text>
  <text class="code" x="384" y="104" fill="#b8b3ad">Diego · Ophelia</text>
  <text x="252" y="126" fill="#b8b3ad" font-size="11.5">테스트 절차로 검증</text>
  <text class="code" x="376" y="126" fill="#b8b3ad">JSON Schema</text>

  <rect x="620" y="94" width="212" height="40" rx="5" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="632" y="112" fill="#f44336" font-size="11.5" font-weight="700">이 장에서 제외</text>
  <text x="632" y="128" fill="#b8b3ad" font-size="10.5">생산자마다 전략이 다르다</text>

  <!-- layer 2 -->
  <rect x="30" y="164" width="820" height="80" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="164" width="200" height="80" rx="8" fill="#66bb6a"/>
  <text x="48" y="192" fill="#0d0d0d" font-size="13.5" font-weight="700">② 데이터 수집</text>
  <text x="48" y="214" fill="#1a1a1a" font-size="11">Collector · Agent</text>
  <text x="48" y="234" fill="#1a1a1a" font-size="11">프로비저닝된 인프라</text>

  <text x="252" y="192" fill="#e8e4df" font-size="12">전문 운영 팀 · 플랫폼 엔지니어</text>
  <text x="252" y="214" fill="#b8b3ad" font-size="11.5">IaC + 정적 분석으로 검증</text>
  <rect x="620" y="200" width="212" height="26" rx="4" fill="#e6f7e7"/>
  <text class="code" x="632" y="218" fill="#14521d" font-weight="700">Helm · Ansible · Operator</text>

  <!-- layer 3 -->
  <rect x="30" y="256" width="820" height="80" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <rect x="30" y="256" width="200" height="80" rx="8" fill="rgb(212,168,83)"/>
  <text x="48" y="284" fill="#0d0d0d" font-size="13.5" font-weight="700">③ 데이터 저장</text>
  <text x="48" y="306" fill="#1a1a1a" font-size="11">Loki · Mimir · Tempo</text>
  <text x="48" y="326" fill="#1a1a1a" font-size="11">프로비저닝된 인프라</text>

  <text x="252" y="284" fill="#e8e4df" font-size="12">대개 전담 제3자</text>
  <text x="252" y="306" fill="#b8b3ad" font-size="11.5">내부라면 ② 와 같은 팀</text>
  <rect x="620" y="292" width="212" height="26" rx="4" fill="#fdf3df"/>
  <text x="632" y="310" fill="#5c4410" font-size="11" font-weight="700">온프렘 IaC · SaaS 설정</text>

  <!-- layer 4 -->
  <rect x="30" y="348" width="820" height="80" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="30" y="348" width="200" height="80" rx="8" fill="#5b9bd5"/>
  <text x="48" y="376" fill="#e8e4df" font-size="13.5" font-weight="700">④ 데이터 시각화</text>
  <text x="48" y="398" fill="#e8e4df" font-size="11">Grafana</text>
  <text x="48" y="418" fill="#e8e4df" font-size="11">프로비저닝된 인프라</text>

  <text x="252" y="376" fill="#e8e4df" font-size="12" font-weight="700">공유 책임</text>
  <text x="252" y="398" fill="#b8b3ad" font-size="11.5">각 팀이 자기 대시보드를 소유한다</text>
  <text x="252" y="418" fill="#b8b3ad" font-size="11.5">②·③ 팀이 권한을 준다</text>
  <rect x="620" y="384" width="212" height="26" rx="4" fill="#dceaf7"/>
  <text x="632" y="402" fill="#10243a" font-size="11" font-weight="700">Terraform · Ansible</text>
</svg>

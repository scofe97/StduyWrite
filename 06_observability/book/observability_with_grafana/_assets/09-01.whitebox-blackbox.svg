<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>화이트박스와 블랙박스 모니터링이 보는 범위와 각자의 한계</title>
  <desc>화이트박스는 접근 권한이 있는 시스템 안을 봅니다. 요청을 보는 RED 와 내부 상태를 보는 USE 가 상보적이고, golden signals 는 둘과 겹치되 latency 가 성공 여부를 담으며, core web vitals 는 브라우저에서 수집합니다. 블랙박스는 서비스를 미지의 것으로 두고 최종 사용자가 보듯 확인하며 합성 모니터링과 RUM 두 갈래입니다. 화이트박스는 조직 통제 아래만 다루고 블랙박스는 외부 DNS 같은 통제 밖까지 포함해 오탐 위험이 있습니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="880" height="470" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">안에서 보는가, 밖에서 보는가</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">통제 범위가 갈리는 지점</text>

  <!-- WHITE BOX -->
  <rect x="30" y="76" width="440" height="300" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="76" width="440" height="30" rx="8" fill="#66bb6a"/>
  <rect x="30" y="98" width="440" height="8" fill="#66bb6a"/>
  <text x="48" y="97" fill="#0d0d0d" font-size="13" font-weight="700">화이트박스 — 안이 보인다</text>

  <text x="48" y="126" fill="#b8b3ad" font-size="11">접근 권한이 있는 시스템</text>

  <rect x="48" y="138" width="200" height="72" rx="6" fill="#e6f7e7"/>
  <text x="60" y="158" fill="#14521d" font-size="12.5" font-weight="700">RED</text>
  <text class="code" x="60" y="176" fill="#14521d">Rate · Errors · Duration</text>
  <text x="60" y="196" fill="#14521d" font-size="10.5">요청을 본다</text>

  <rect x="256" y="138" width="200" height="72" rx="6" fill="#e6f7e7"/>
  <text x="268" y="158" fill="#14521d" font-size="12.5" font-weight="700">USE</text>
  <text class="code" x="268" y="176" fill="#14521d">Utilization · Saturation</text>
  <text x="268" y="196" fill="#14521d" font-size="10.5">내부 상태를 본다</text>

  <rect x="48" y="220" width="408" height="22" rx="3" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1"/>
  <text x="58" y="235" fill="#8fd694" font-size="11" font-weight="700">둘은 상보적이다</text>

  <rect x="48" y="252" width="200" height="66" rx="6" fill="#dceaf7"/>
  <text x="60" y="272" fill="#10243a" font-size="12.5" font-weight="700">Golden signals</text>
  <text x="60" y="290" fill="#10243a" font-size="10.5">latency 는 성공 여부까지</text>
  <text x="60" y="308" fill="#10243a" font-size="10.5">담는다</text>

  <rect x="256" y="252" width="200" height="66" rx="6" fill="#dceaf7"/>
  <text x="268" y="272" fill="#10243a" font-size="12.5" font-weight="700">Core web vitals</text>
  <text class="code" x="268" y="290" fill="#10243a">LCP · FID · CLS</text>
  <text x="268" y="308" fill="#7a1f1f" font-size="10.5" font-weight="700">FID → INP 로 대체됨</text>

  <rect x="48" y="330" width="408" height="32" rx="4" fill="#e6f7e7"/>
  <text x="58" y="351" fill="#14521d" font-size="11" font-weight="700">조직이 통제하는 것만 다룬다</text>

  <!-- BLACK BOX -->
  <rect x="490" y="76" width="360" height="300" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="490" y="76" width="360" height="30" rx="8" fill="#5b9bd5"/>
  <rect x="490" y="98" width="360" height="8" fill="#5b9bd5"/>
  <text x="508" y="97" fill="#e8e4df" font-size="13" font-weight="700">블랙박스 — 밖에서 본다</text>

  <text x="508" y="126" fill="#b8b3ad" font-size="11">최종 사용자가 보듯 확인</text>

  <rect x="508" y="138" width="324" height="94" rx="6" fill="#dceaf7"/>
  <text x="520" y="158" fill="#10243a" font-size="12.5" font-weight="700">합성 모니터링</text>
  <text x="520" y="176" fill="#10243a" font-size="10.5">연결과 사용자 행동을 흉내</text>
  <rect x="520" y="186" width="300" height="20" rx="3" fill="#a9cbe8"/>
  <text class="code" x="528" y="200" fill="#10243a">HTTP · DNS · TCP · ICMP · gRPC</text>
  <text x="520" y="222" fill="#10243a" font-size="10.5">Cloud 판은 gRPC 만 빠진다</text>

  <rect x="508" y="242" width="324" height="76" rx="6" fill="#dceaf7"/>
  <text x="520" y="262" fill="#10243a" font-size="12.5" font-weight="700">RUM</text>
  <text x="520" y="280" fill="#10243a" font-size="10.5">프론트엔드에 심은 에이전트</text>
  <text x="520" y="300" fill="#10243a" font-size="10.5">실제 사용자 경험이 최초 알림</text>

  <rect x="508" y="330" width="324" height="32" rx="4" fill="#f2d4d4"/>
  <text x="518" y="351" fill="#7a1f1f" font-size="11" font-weight="700">통제 밖까지 봐서 오탐 위험</text>

  <!-- bottom note -->
  <rect x="30" y="390" width="820" height="56" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="50" y="414" fill="rgb(212,168,83)" font-size="12.5" font-weight="700">SLA 준수를 증명해야 한다면</text>
  <text x="50" y="434" fill="#e8e4df" font-size="11.5">제3자 합성 도구가 증명하기 쉽다</text>
</svg>

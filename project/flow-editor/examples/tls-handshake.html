<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Editor</title>
<style>
:root {
  --bg: #0e1116;
  --panel: #161b24;
  --panel-border: #262e3d;
  --node-bg: #1b2230;
  --node-border: #2c3547;
  --node-title: #232c3d;
  --group-bg: rgba(255,255,255,0.02);
  --group-border: #3a465c;
  --text: #dfe4ec;
  --text-muted: #8b94a7;
  --accent: #d4a853;
  --kind-packet: #5b9bd5;
  --kind-signal: #d4a853;
  --kind-data: #66bb6a;
  --kind-error: #e05555;
  --bottleneck: #e05555;
  --active-glow: #7ab8f5;
  --sel-bg: rgba(212,168,83,0.16);
  --sel-border: rgba(212,168,83,0.55);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: "SF Pro", "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--panel-border);
}
header h1 { font-size: 15px; font-weight: 600; }
header .subtitle { font-size: 12px; color: var(--text-muted); }
header .legend { margin-left: auto; display: flex; gap: 12px; font-size: 11px; color: var(--text-muted); align-items: center; }
header .legend svg { vertical-align: -2px; margin-right: 3px; }

#canvas-wrap { flex: 1; position: relative; overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; }
#canvas.panning { cursor: grabbing; }
#hint {
  position: absolute; top: 8px; right: 10px; font-size: 11px; color: var(--text-muted);
  background: rgba(14,17,22,0.7); padding: 4px 8px; border-radius: 4px; pointer-events: none;
}
#float-controls {
  position: absolute; right: 12px; bottom: 12px; z-index: 4;
  display: flex; gap: 6px; align-items: center;
  background: rgba(22,27,36,0.85); border: 1px solid var(--panel-border);
  border-radius: 8px; padding: 6px 8px;
}
#float-controls button {
  background: var(--node-bg); color: var(--text); border: 1px solid var(--node-border);
  border-radius: 5px; padding: 4px 10px; font-size: 12px; cursor: pointer;
}
#float-controls button:hover { border-color: var(--accent); }
#float-controls button:focus-visible { outline: 2px solid var(--active-glow); outline-offset: 1px; }
#float-controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
#speed-label { font-size: 11px; color: var(--text-muted); min-width: 40px; text-align: center; }

/* ---- SVG 노드 ---- */
.node-box { fill: var(--node-bg); stroke: var(--node-border); stroke-width: 1; rx: 6; }
.node { cursor: pointer; }
.node-title-bg { fill: var(--node-title); }
.node-label { fill: var(--text); font-size: 12px; font-weight: 600; }
.node-sublabel { fill: var(--text-muted); font-size: 10px; }
.node-info { fill: #c3cddd; font-size: 10px; }
.mech-badge-bg { fill: rgba(91,155,213,0.14); stroke: rgba(91,155,213,0.4); stroke-width: 0.7; }
.mech-badge-text { fill: #9dc4e8; font-size: 9px; font-weight: 600; }
.node-divider { stroke: var(--node-border); stroke-width: 1; }

/* 레인 — 행위 주체 띠. 노드보다 뒤에 깔리므로 아주 옅게 */
.lane-band { pointer-events: none; }
.lane-band.lane-even { fill: rgba(255,255,255,0.022); }
.lane-band.lane-odd  { fill: rgba(255,255,255,0.005); }
.lane-label {
  fill: var(--text-muted); font-size: 10px; font-weight: 700;
  letter-spacing: 0.08em; pointer-events: none;
}

/* 패킷 계층 스택 — 이 노드를 지난 뒤의 상태 */
.layer-name {
  fill: #7f8ca3; font-size: 9px; font-weight: 700;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.layer-name.chg { fill: var(--accent); }
.layer-fields {
  fill: #b9c4d4; font-size: 9px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.layer-fields.chg { fill: var(--accent); font-weight: 700; }
.layer-fields.locked { fill: #6d7789; font-style: italic; }
.layer-dropped {
  fill: #6d7789; font-size: 8.5px; font-style: italic;
}
.node.role-external .node-box { stroke-dasharray: 5 3; }
.node.role-store .store-line { stroke: var(--node-border); stroke-width: 1; }
.node.active .node-box {
  stroke: var(--active-glow); stroke-width: 1.6;
  filter: drop-shadow(0 0 6px rgba(122,184,245,0.55));
}
.node.panel-open .node-box { stroke: var(--accent); stroke-width: 1.6; }

.group-box { fill: var(--group-bg); stroke: var(--group-border); stroke-width: 1; rx: 8; }
.group-title-bg { fill: rgba(58,70,92,0.25); cursor: pointer; }
.group-label { fill: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; }
.group.collapsed .group-box { fill: var(--node-bg); cursor: pointer; }

.edge-path { fill: none; stroke-width: 1.4; opacity: 0.75; }
.edge-path.panel-open { stroke-width: 2.6; opacity: 1; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; pointer-events: stroke; }
.edge-deco { fill: none; stroke-width: 1.2; }

.port { stroke: var(--bg); stroke-width: 1; }
.particle { pointer-events: none; opacity: 0.8; }

/* ---- 상세 패널 (우측 슬라이드) ---- */
#detail-panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: 520px; max-width: 92vw;
  background: var(--panel); border-left: 1px solid var(--panel-border);
  transform: translateX(102%); transition: transform 0.22s ease;
  display: flex; flex-direction: column; z-index: 5;
}
#detail-panel.open { transform: none; box-shadow: -8px 0 24px rgba(0,0,0,0.35); }
#panel-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-bottom: 1px solid var(--panel-border);
}
#panel-title { font-size: 13px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#panel-head button {
  background: var(--node-bg); color: var(--text); border: 1px solid var(--node-border);
  border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer; flex: 0 0 auto;
}
#panel-head button:focus-visible { outline: 2px solid var(--active-glow); outline-offset: 1px; }
#panel-body { padding: 16px 18px; overflow-y: auto; font-size: 13px; line-height: 1.75; }
#panel-body .meta-line { color: var(--text-muted); font-size: 11.5px; margin-bottom: 10px; }
#panel-body .detail-text { margin-bottom: 12px; color: var(--text); }
#panel-body .detail-text + .detail-text { margin-top: -4px; }
/* 접힘 섹션 — 첫 화면을 짧게, 정보는 접어서 보존 */
.panel-lead { color: var(--text); margin-bottom: 12px; }
details.sec { margin-bottom: 2px; }
.sec-head {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--text-muted); border-bottom: 1px solid var(--panel-border);
  padding: 7px 0 5px; cursor: pointer; list-style: none;
  display: flex; align-items: center; gap: 6px;
}
.sec-head::-webkit-details-marker { display: none; }
.sec-head::before { content: "▸"; font-size: 9px; transition: transform 0.15s; }
details.sec[open] > .sec-head::before { transform: rotate(90deg); }
.sec-head:hover { color: var(--text); }
.sec-head:focus-visible { outline: 2px solid var(--active-glow); outline-offset: 1px; }
.sec-count {
  font-size: 9.5px; font-weight: 600; color: var(--text-muted);
  background: var(--node-bg); border: 1px solid var(--node-border);
  border-radius: 8px; padding: 0 6px; letter-spacing: 0;
}
.sec-body { padding: 9px 0 12px; }
.step-block { margin-bottom: 9px; }
.conn-row {
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  padding: 4px 0; font-size: 11px; border-bottom: 1px dashed rgba(38,46,61,0.6);
}
.conn-kind { font-size: 10px; font-weight: 700; }
.conn-label { color: var(--text-muted); font-size: 10.5px; }
.conn-ratio { color: var(--accent); font-size: 10px; }
button.jump {
  background: var(--node-bg); color: var(--text); border: 1px solid var(--node-border);
  border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer;
}
button.jump:hover { border-color: var(--accent); color: var(--accent); }

/* IN/OUT 2열 대조 — 들어올 때와 나갈 때를 나란히 */
.io-compare {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-bottom: 12px;
}
.io-col {
  border: 1px solid var(--panel-border); border-radius: 6px;
  padding: 7px 8px; min-width: 0; background: rgba(255,255,255,0.015);
}
.io-col-head {
  font-size: 10px; font-weight: 700; color: var(--text-muted);
  letter-spacing: 0.06em; margin-bottom: 5px;
  border-bottom: 1px solid var(--panel-border); padding-bottom: 3px;
}
.io-row {
  font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px;
  line-height: 1.5; padding: 2px 3px; border-radius: 3px;
  word-break: break-all;
}
.io-row .io-layer { color: #7f8ca3; font-weight: 700; margin-right: 5px; }
.io-row .io-fields { color: #b9c4d4; }
.io-row.chg { background: var(--sel-bg); }
.io-row.chg .io-layer, .io-row.chg .io-fields { color: var(--accent); font-weight: 700; }
.io-row.gone { opacity: 0.45; text-decoration: line-through; }
.io-row.added { background: rgba(102,187,106,0.12); }
.io-row.added .io-layer, .io-row.added .io-fields { color: var(--kind-data); }

.mech-section { margin-bottom: 12px; border: 1px solid var(--panel-border); border-radius: 6px; overflow: hidden; }
.mech-head {
  padding: 6px 9px; background: var(--node-title); font-size: 11px; font-weight: 700;
  display: flex; gap: 6px; align-items: center;
}
.mech-type-tag { font-size: 9px; color: var(--text-muted); font-weight: 400; border: 1px solid var(--node-border); border-radius: 8px; padding: 1px 6px; }
.mech-body { padding: 8px 9px; }
.mech-table { width: 100%; border-collapse: collapse; font-size: 11px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.mech-table th { text-align: left; color: var(--text-muted); font-weight: 500; padding: 2px 6px; border-bottom: 1px solid var(--panel-border); }
.mech-table td { padding: 3px 6px; vertical-align: top; }
.mech-table tr.sel td { background: var(--sel-bg); }
.mech-table tr.sel td:first-child { border-left: 2px solid var(--sel-border); }
.mech-note { color: var(--text-muted); font-size: 10px; }
.mech-cand { display: flex; align-items: center; gap: 8px; padding: 3px 2px; font-size: 11px; }
.mech-cand.sel { background: var(--sel-bg); border-radius: 4px; }
.mech-cand .bar-wrap { flex: 1; height: 7px; background: #0c0f14; border-radius: 3px; overflow: hidden; }
.mech-cand .bar { height: 100%; background: var(--kind-packet); }
.mech-cand.sel .bar { background: var(--accent); }
.mech-cand .pct { font-size: 10px; color: var(--text-muted); min-width: 34px; text-align: right; }
.mech-cand .check { color: var(--accent); font-size: 10px; font-weight: 700; }
.mech-rewrite { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; margin-bottom: 3px; }
.mech-rewrite .arrow { color: var(--accent); }
.mech-rewrite .from { color: var(--text-muted); text-decoration: line-through; }
.mech-rewrite .to { color: var(--kind-data); }
.mech-describe {
  font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px;
  background: #0c0f14; border-radius: 4px; padding: 8px; white-space: pre; overflow-x: auto;
}
.mech-describe .line.sel { background: var(--sel-bg); display: inline-block; width: 100%; border-left: 2px solid var(--sel-border); }
.mech-crypt { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
.mech-crypt .mode { font-weight: 700; }
.mech-kv { font-size: 11px; font-family: ui-monospace, Menlo, monospace; color: var(--text-muted); white-space: pre-wrap; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="subtitle" id="subtitle"></span>
  <div class="legend" id="legend" aria-label="포트 종류 범례"></div>
</header>

<div id="canvas-wrap">
  <svg id="canvas" role="img" aria-label="흐름도 캔버스"></svg>
  <div id="hint">노드·엣지 클릭 상세 · 드래그 이동 · 휠 확대/축소 · 그룹 제목 클릭 접기 · Esc 패널 닫기</div>
  <div id="float-controls">
    <button id="btn-motion" aria-pressed="true" aria-label="애니메이션 켜짐">✦ 흐름</button>
    <button id="btn-slower" aria-label="느리게">−</button>
    <span id="speed-label">1.0×</span>
    <button id="btn-faster" aria-label="빠르게">＋</button>
  </div>
  <aside id="detail-panel" aria-label="상세 패널">
    <div id="panel-head">
      <span id="panel-title"></span>
      <button id="btn-panel-close" aria-label="패널 닫기">✕</button>
    </div>
    <div id="panel-body"></div>
  </aside>
</div>

<script>
const FLOW = {
  "meta": {
    "title": "TCP + TLS 1.3 핸드셰이크",
    "subtitle": "연결을 먼저 맺고(TCP 1왕복), 그 위에서 열쇠를 나눠 갖기까지(TLS 1왕복)",
    "mode": "trace",
    "direction": "LR",
    "lanes": [
      {
        "id": "client",
        "label": "CLIENT"
      },
      {
        "id": "server",
        "label": "SERVER"
      }
    ]
  },
  "nodes": [
    {
      "id": "tcp-syn",
      "lane": "client",
      "type": "tcp-segment",
      "role": "process",
      "icon": "⊳",
      "label": "SYN",
      "sublabel": "클라이언트 → 서버",
      "info": [
        "연결을 열자고 먼저 신호를 보냅니다."
      ],
      "detail": "TCP는 데이터를 보내기 전에 양쪽이 서로 준비됐음을 확인합니다. SYN 은 자기 시작 순서번호(seq)를 알리며 대화를 시작하자는 뜻입니다. 이 시점에는 아직 TLS 도, 암호도 없습니다.",
      "ports": {
        "out": [
          {
            "id": "o0",
            "kind": "signal"
          }
        ]
      }
    },
    {
      "id": "tcp-synack",
      "lane": "server",
      "type": "tcp-segment",
      "role": "process",
      "icon": "⊲",
      "label": "SYN-ACK",
      "sublabel": "서버 → 클라이언트",
      "info": [
        "받았다는 확인과 자기 순서번호를 함께 돌려보냅니다."
      ],
      "detail": "서버가 두 가지를 한 번에 합니다. 클라이언트의 SYN 을 받았다는 확인(ACK)과, 자기 쪽 시작 순서번호를 알리는 SYN 입니다. 두 방향의 준비를 한 번의 왕복으로 끝내려는 설계입니다.",
      "ports": {
        "in": [
          {
            "id": "i0",
            "kind": "signal"
          }
        ],
        "out": [
          {
            "id": "o0",
            "kind": "signal"
          }
        ]
      }
    },
    {
      "id": "tcp-ack",
      "lane": "client",
      "type": "tcp-segment",
      "role": "process",
      "icon": "⊳",
      "label": "ACK",
      "sublabel": "클라이언트 → 서버",
      "info": [
        "서버의 순서번호도 받았다고 확인하면 연결이 섭니다."
      ],
      "detail": "세 번째 메시지로 양방향 확인이 끝나고 연결이 ESTABLISHED 상태가 됩니다. 여기까지가 TCP 3-way handshake 이고, 왕복 1회를 썼습니다. TLS 1.3 을 1-RTT 라 부르는 것은 이 TCP 왕복을 뺀 수치라서, 실제로 브라우저가 첫 바이트를 받기까지는 2왕복이 걸립니다.",
      "ports": {
        "in": [
          {
            "id": "i0",
            "kind": "signal"
          }
        ],
        "out": [
          {
            "id": "o0",
            "kind": "signal"
          }
        ]
      }
    },
    {
      "id": "client-hello",
      "lane": "client",
      "type": "tls-message",
      "role": "process",
      "icon": "⊳",
      "label": "ClientHello",
      "sublabel": "클라이언트 → 서버",
      "info": [
        "쓸 수 있는 암호 방식 목록과 자기 키 재료를 함께 보냅니다."
      ],
      "detail": "TLS 1.2까지는 암호 방식을 먼저 합의한 뒤에야 키 재료를 보냈기 때문에 왕복이 한 번 더 필요했습니다. TLS 1.3은 \"어차피 쓸 만한 방식은 몇 개뿐이니 재료를 미리 보내자\"는 판단으로 왕복을 1회로 줄였습니다. 이것이 TLS 1.3이 빨라진 가장 큰 이유입니다.",
      "mechanisms": [
        {
          "type": "table-lookup",
          "title": "제안하는 암호 방식 목록",
          "columns": [
            "cipher suite",
            "설명"
          ],
          "rows": [
            {
              "id": "cs-aes",
              "cells": [
                "TLS_AES_128_GCM_SHA256",
                "가장 널리 쓰이는 기본값"
              ],
              "note": "AES 128비트로 암호화하고 GCM 방식으로 위변조까지 함께 검사합니다."
            },
            {
              "id": "cs-chacha",
              "cells": [
                "TLS_CHACHA20_POLY1305_SHA256",
                "AES 가속기가 없는 기기에서 유리"
              ],
              "note": "모바일처럼 하드웨어 가속이 약한 환경에서 더 빠릅니다."
            }
          ]
        }
      ],
      "ports": {
        "in": [
          {
            "id": "i0",
            "kind": "signal"
          }
        ],
        "out": [
          {
            "id": "o0",
            "kind": "signal"
          }
        ]
      }
    },
    {
      "id": "server-hello",
      "lane": "server",
      "type": "tls-message",
      "role": "decision",
      "icon": "⊲",
      "label": "ServerHello",
      "sublabel": "서버 → 클라이언트",
      "info": [
        "제안받은 목록에서 하나를 고르고, 자기 키 재료를 돌려보냅니다."
      ],
      "detail": "서버가 고른 결과와 자기 키 재료가 클라이언트에게 돌아갑니다. 여기까지 오간 메시지는 전부 평문이지만 안전합니다. 도청자는 양쪽 공개 재료를 모두 볼 수 있어도, 각자가 감춘 비밀값을 모르면 같은 열쇠를 계산할 수 없기 때문입니다.",
      "mechanisms": [
        {
          "type": "weighted-select",
          "title": "암호 방식 선택",
          "candidates": [
            {
              "id": "cs-aes",
              "label": "TLS_AES_128_GCM_SHA256",
              "weight": 1
            },
            {
              "id": "cs-chacha",
              "label": "TLS_CHACHA20_POLY1305_SHA256",
              "weight": 0
            }
          ]
        }
      ],
      "ports": {
        "in": [
          {
            "id": "i0",
            "kind": "signal"
          }
        ],
        "out": [
          {
            "id": "o0",
            "kind": "signal"
          }
        ]
      }
    },
    {
      "id": "server-cert",
      "lane": "server",
      "type": "tls-message",
      "role": "process",

const MECH_LABEL = {

/* 노드 창 안에 다는 메커니즘 배지 — 기호 + 짧은 이름.

function buildLegend() {
  const leg = $("legend");

    leg.appendChild(span);

   패킷 필드를 손으로 적지 않고 layerOps 를 순서대로 적용해 자동으로 얻는다. */

    for (const op of s.layerOps || []) {

        const layer = sim.find(l => l.id === op.layer);
        if (!layer) continue;
        changes.push({ kind: "set", layer: op.layer, layerName: layer.name, field: op.field, from: layer.fields[op.field], to: op.value });
        layer.fields[op.field] = op.value;
      } else if (op.op === "push") {
        sim.unshift({ id: op.layer.id, name: op.layer.name, fields: { ...(op.layer.fields || {}) }, locked: false });
        changes.push({ kind: "push", layer: op.layer.id, layerName: op.layer.name });
      } else if (op.op === "pop") {
        const idx = sim.findIndex(l => l.id === op.layer);
        if (idx >= 0) { changes.push({ kind: "pop", layer: op.layer, layerName: sim[idx].name }); sim.splice(idx, 1); }
      } else if (op.op === "lock" || op.op === "unlock") {
        const layer = sim.find(l => l.id === op.layer);
        if (layer) { layer.locked = op.op === "lock"; changes.push({ kind: op.op, layer: op.layer, layerName: layer.name, note: op.note }); }
      }
    }
    resolvedChanges.push(changes);
    // 이 스텝을 마친 시점의 패킷 상태를 노드에 박제한다 (바뀐 필드 표시 포함)
    const changedFields = new Set(changes.filter(c => c.kind === "set").map(c => `${c.layer}.${c.field}`));
    const changedLayers = new Set(changes.filter(c => c.kind !== "set").map(c => c.layer));
    nodeSnapshot.set(s.at, {
      before,
      layers: sim.map(l => ({ id: l.id, name: l.name, fields: { ...l.fields }, locked: l.locked })),
      changedFields, changedLayers,
      dropped: changes.filter(c => c.kind === "pop").map(c => c.layerName),
    });
  });
}

/* ================= 가시성 계산 ================= */
function ancestorChain(id) {
  const chain = [];

  while (cur) { chain.push(cur.id); cur = cur.parentId ? nodesById[cur.parentId] : null; }
  return chain;
}

function childAtLevel(containerId, nodeId) {

    if (p === containerId) return cur.id;
    cur = p ? nodesById[p] : null;
  }
  return null;
}
function directChildren(containerId) {
  return FLOW.nodes.filter(n => (n.parentId || null) === containerId);

/* ================= 크기·레이아웃 ================= */
/* 폭 근사. 모노스페이스(계층 필드)는 라틴 글자가 0.6em 로 더 넓어 따로 잰다 */

}
/* 레인 — 행위 주체를 교차축에 고정해 왕복을 드러낸다 (UML 시퀀스 다이어그램).

/* 완전한 문장과 패킷 계층이 들어가므로 노드 폭을 정해두고 줄바꿈한다 */

  /* 이 노드를 지난 뒤의 패킷 상태 — layerOps 로 자동 계산된 스냅샷.
     계층마다 필드를 나열하고, 이 노드에서 바뀐 필드만 강조한다 */
  const snap = nodeSnapshot.get(n.id);

  if (snap) {
    for (const l of snap.layers) {
      const fieldText = l.locked
        ? "🔒 암호화되어 볼 수 없음"
        : Object.entries(l.fields).map(([k, v]) => `${k}=${v}`).join("  ");
      // 계층 이름 칸(LAYER_NAME_W)만큼 밀려 시작하므로 그만큼 빼고 줄바꿈한다 (모노스페이스 기준)
      const wrapped = wrapText(fieldText, 9, inner - LAYER_NAME_W, true);
      wrapped.forEach((text, i) => layerRows.push({

        text,
        locked: l.locked,
        changed: !l.locked && Object.keys(l.fields).some(k => snap.changedFields.has(`${l.id}.${k}`)),
        layerChanged: snap.changedLayers.has(l.id),

  }
  return c;
}

function layoutContainer(containerId) {
  const kids = directChildren(containerId);

    } else {

    const t = childAtLevel(containerId, e.target);
    if (s && t && s !== t) { succ[s].add(t); hasPred.add(t); }
  }
  const rank = {};
  function setRank(id, r, seen) {

    }
    seen.delete(id);
  }
  for (const id of kidIds) if (!hasPred.has(id)) setRank(id, 0, new Set());
  for (const id of kidIds) if (rank[id] === undefined) rank[id] = 0;

  const isTB = (FLOW.meta.direction || "LR") === "TB";
  const byRank = {};
  for (const id of kidIds) (byRank[rank[id]] = byRank[rank[id]] || []).push(id);
  const rankKeys = Object.keys(byRank).map(Number).sort((a, b) => a - b);

  const children = {};
  // 레인이 선언돼 있으면 교차축 좌표를 형제 순서가 아니라 레인이 정한다.
  // 레인마다 폭(교차축 크기)을 미리 재서 띠 위치를 고정해야 노드가 같은 줄에 놓인다.

      if (li < 0) continue;

        children[id] = { main, cross: laneAt[li] + (laneSpan[li] - cw) / 2, w: sz.w, h: sz.h, _lane: li };
      } else {
        children[id] = { main, cross, w: sz.w, h: sz.h };

      mainSize = Math.max(mainSize, mw);
    }
    cross -= GAP_NODE;
    for (const id of ids) {

  if (laneList.length) {
    crossMax = Math.max(crossMax, laneAt[laneList.length - 1] + laneSpan[laneList.length - 1]);
  }

  const titleH = containerId ? GROUP_TITLE_H : 0;
  for (const id of Object.keys(children)) {
    const c = children[id];
    // 레인 배치 노드는 이미 절대 교차좌표를 가지므로 rank 중앙 정렬을 적용하지 않는다
    const centered = c._rankCross === null ? c.cross : c.cross + (crossMax - c._rankCross) / 2;
    const x = isTB ? centered : c.main;
    const y = isTB ? c.main : centered;

function computeLayout() {
  layout = {};
  const root = layoutContainer(null);
  (function absolutize(frame, ox, oy) {
    for (const [id, c] of Object.entries(frame.children)) {
      layout[id] = { x: ox + c.x, y: oy + c.y, w: c.w, h: c.h };
      if (c.inner) absolutize(c.inner, ox + c.x, oy + c.y);
    }
  })(root, 0, 0);

/* ================= 포트 위치 ================= */
function computePorts() {
  portPos = {};
  const isTB = (FLOW.meta.direction || "LR") === "TB";
  for (const n of FLOW.nodes) {
    if (visibleOf(n.id) !== n.id) continue;
    if (n.type === "group") continue;
    const rect = layout[n.id]; if (!rect) continue;
    placeDeclaredPorts(n, rect, isTB);
  }
  for (const n of FLOW.nodes) {
    if (n.type !== "group") continue;
    if (visibleOf(n.id) !== n.id) continue;
    const rect = layout[n.id]; if (!rect) continue;
    if (!collapsed.has(n.id)) continue;

function placeDeclaredPorts(n, rect, isTB) {
  for (const side of ["in", "out"]) {
    const list = (n.ports?.[side] || []);
    list.forEach((p, i) => {
      const frac = (i + 1) / (list.length + 1);
      let x, y;
      if (!isTB) { x = side === "in" ? rect.x : rect.x + rect.w; y = rect.y + rect.h * frac; }
      else       { y = side === "in" ? rect.y : rect.y + rect.h; x = rect.x + rect.w * frac; }

    if (vs === g.id && vt !== g.id) outs.push(e);
    if (vt === g.id && vs !== g.id) ins.push(e);
  }
  ins.forEach((e, i) => {
    const frac = (i + 1) / (ins.length + 1);
    portPos[`boundary/${e.id}/in`] = !isTB
      ? { x: rect.x, y: rect.y + rect.h * frac, kind: e.kind }
      : { x: rect.x + rect.w * frac, y: rect.y, kind: e.kind };

  outs.forEach((e, i) => {
    const frac = (i + 1) / (outs.length + 1);
    portPos[`boundary/${e.id}/out`] = !isTB
      ? { x: rect.x + rect.w, y: rect.y + rect.h * frac, kind: e.kind }
      : { x: rect.x + rect.w * frac, y: rect.y + rect.h, kind: e.kind };

  }

  if (portId && portPos[`${nodeId}/${portId}`]) return portPos[`${nodeId}/${portId}`];

/* ================= SVG 렌더 ================= */

let gLanes, gEdges, gNodes, gEdgeHits, gParticles;

      refX: 9, refY: 5, markerWidth: 6, markerHeight: 6,

function render() {

  renderDefs(gRoot);
  gLanes = el("g", {}, gRoot);      // 레인 띠는 가장 뒤 — 그룹·노드에 가리지 않게
  gEdges = el("g", {}, gRoot);
  gNodes = el("g", {}, gRoot);
  gEdgeHits = el("g", {}, gRoot);   // 히트 영역은 노드/그룹 위 — 그룹 박스가 엣지 클릭을 가로채지 않게

/* 레인 띠와 라벨 — 배치된 노드들의 실제 좌표에서 각 레인의 범위를 역산한다 */
function renderLanes() {
  const ls = lanes();
  if (!ls.length) return;
  const isTB = (FLOW.meta.direction || "LR") === "TB";

  const ext = ls.map(() => null);
  for (const n of FLOW.nodes) {
    const li = laneIndexOf(n);
    const r = layout[n.id];
    if (li < 0 || !r) continue;
    const lo = isTB ? r.x : r.y, hi = isTB ? r.x + r.w : r.y + r.h;
    const e = ext[li];

  }

  const th = el("rect", { x: rect.x, y: rect.y, width: rect.w, height: GROUP_TITLE_H, rx: 8, class: "group-title-bg" }, grp);
  const tl = el("text", { x: rect.x + 10, y: rect.y + 15, class: "group-label" }, grp);
  const gi = iconOf(g);
  tl.textContent = `${isCol ? "▸" : "▾"} ${gi ? gi + " " : ""}${g.label}`;
  if (isCol) {

  let lx = rect.x + 9;
  if (ic) {
    const it = el("text", { x: lx, y: rect.y + 16, "font-size": "11" }, grp);
    it.textContent = ic;
    lx += 18;
  }
  const lbl = el("text", { x: lx, y: rect.y + 16, class: "node-label" }, grp);
  lbl.textContent = (role === "decision" ? "◇ " : "") + n.label;

  if (role === "store") {
    el("line", { x1: rect.x, y1: rect.y + TITLE_H + 2, x2: rect.x + rect.w, y2: rect.y + TITLE_H + 2, class: "store-line" }, grp);
    el("line", { x1: rect.x, y1: rect.y + rect.h - 3, x2: rect.x + rect.w, y2: rect.y + rect.h - 3, class: "store-line" }, grp);
  }
  const { infoLines, badges, layerRows } = nodeBody(n);
  let cy = rect.y + TITLE_H + 12;
  if (n.sublabel) {
    const sub = el("text", { x: rect.x + 9, y: cy, class: "node-sublabel" }, grp);
    sub.textContent = n.sublabel;
    cy += 14;
  }
  // 1단 — 설명 문장
  for (const line of infoLines) {
    const it = el("text", { x: rect.x + 9, y: cy, class: "node-info" }, grp);
    it.textContent = line;
    cy += INFO_LH;
  }
  if (infoLines.length) cy += 3;
  // 2단 — 메커니즘 배지
  if (badges.length) {
    let bx = rect.x + 9;
    for (const b of badges) {
      const label = `${b.icon} ${b.short}`;
      const bw = textWidth(label, 9) + 12;
      el("rect", { x: bx, y: cy - 9, width: bw, height: 13, rx: 6.5, class: "mech-badge-bg" }, grp);
      const bt = el("text", { x: bx + 6, y: cy, class: "mech-badge-text" }, grp);
      bt.textContent = label;
      bx += bw + 4;
    }
    cy += 17;
  }
  // 3단 — 이 노드를 지난 뒤의 패킷 계층 상태 (layerOps 로 자동 계산)
  if (layerRows.length) {
    cy += 2;
    el("line", { x1: rect.x + 9, y1: cy, x2: rect.x + rect.w - 9, y2: cy, class: "node-divider" }, grp);
    cy += 11;
    for (const row of layerRows) {
      if (row.name) {
        const nm = el("text", { x: rect.x + 9, y: cy, class: "layer-name" + (row.layerChanged ? " chg" : "") }, grp);
        nm.textContent = row.name;
      }
      const cls = row.dropped ? "layer-dropped" : ("layer-fields" + (row.changed ? " chg" : "") + (row.locked ? " locked" : ""));
      const ft = el("text", { x: rect.x + 9 + LAYER_NAME_W, y: cy, class: cls }, grp);
      ft.textContent = row.text;
      cy += LAYER_LH;
    }
    cy += 4;
  }
  for (const side of ["in", "out"]) {
    for (const p of (n.ports?.[side] || [])) {
      const pos = portPos[`${n.id}/${p.id}`];
      if (pos) grp.appendChild(SHAPE_FN[p.kind](pos.x, pos.y, PORT_R, KIND_COLOR_RAW[p.kind]));
    }
  }
}

function renderEdges() {
  edgePaths = {};
  const isTB = (FLOW.meta.direction || "LR") === "TB";
  for (const e of FLOW.edges) {
    const vs = visibleOf(e.source), vt = visibleOf(e.target);
    if (vs === vt) { edgePaths[e.id] = { hidden: true }; continue; }
    const a = endpointPos(e, "source"), b = endpointPos(e, "target");
    if (!a || !b) { edgePaths[e.id] = { hidden: true }; continue; }
    const off = Math.max(42, (isTB ? Math.abs(b.y - a.y) : Math.abs(b.x - a.x)) / 2);
    const d = !isTB
      ? `M ${a.x} ${a.y} C ${a.x + off} ${a.y}, ${b.x - off} ${b.y}, ${b.x} ${b.y}`
      : `M ${a.x} ${a.y} C ${a.x} ${a.y + off}, ${b.x} ${b.y - off}, ${b.x} ${b.y}`;
    const color = KIND_COLOR_RAW[e.kind];
    const path = el("path", {
      d, class: "edge-path", stroke: color, "data-edge": e.id,
      "marker-end": `url(#arrow-${e.kind})`,
    }, gEdges);
    const len = path.getTotalLength();
    // 넓은 투명 히트 영역 — 엣지 클릭용 (노드 위 레이어)
    const hit = el("path", { d, class: "edge-hit", "data-edge": e.id }, gEdgeHits);
    hit.addEventListener("click", (ev) => { ev.stopPropagation(); openEdgePanel(e.id); });
    edgePaths[e.id] = { el: path, len, hidden: false };
    drawDecoration(e, path, len, color);
  }
}
function drawDecoration(e, path, len, color) {
  if (!e.decoration) return;
  const tangentAt = (l) => {
    const p1 = path.getPointAtLength(Math.max(0, l - 2)), p2 = path.getPointAtLength(Math.min(len, l + 2));
    const dx = p2.x - p1.x, dy = p2.y - p1.y, m = Math.hypot(dx, dy) || 1;
    return { x: dx / m, y: dy / m };
  };
  const perp = (t) => ({ x: -t.y, y: t.x });
  if (e.decoration === "one-to-one") {
    for (const l of [10, len - 10]) {
      const p = path.getPointAtLength(l), t = tangentAt(l), pp = perp(t);
      el("line", { x1: p.x - pp.x * 5, y1: p.y - pp.y * 5, x2: p.x + pp.x * 5, y2: p.y + pp.y * 5,
                   class: "edge-deco", stroke: color }, gEdges);
    }
  } else if (e.decoration === "one-to-many") {
    const l = len - 4, base = len - 14;
    const p = path.getPointAtLength(l), b = path.getPointAtLength(base), t = tangentAt(base), pp = perp(t);
    for (const s of [-1, 0, 1]) {
      el("line", { x1: b.x, y1: b.y, x2: p.x + pp.x * 6 * s, y2: p.y + pp.y * 6 * s,
                   class: "edge-deco", stroke: color }, gEdges);
    }
  } else if (e.decoration === "optional") {
    const p = path.getPointAtLength(12);
    el("circle", { cx: p.x, cy: p.y, r: 4, fill: "none", class: "edge-deco", stroke: color }, gEdges);
  }
}

/* ================= 상시 입자 ================= */
function renderAmbientInit() {
  ambient = [];
  for (const [eid, ep] of Object.entries(edgePaths)) {
    if (ep.hidden) continue;
    const rate = FLOW.stream?.rates?.[eid] || 1;
    const count = Math.max(1, Math.round(ep.len / 150 * Math.min(rate, 3)));
    for (let i = 0; i < count; i++) ambient.push({ eid, off: (ep.len / count) * i });
  }
  drawAmbient(true);
}
function drawAmbient(rebuild) {
  if (rebuild) gParticles.innerHTML = "";
  if (!motionOn) { gParticles.innerHTML = ""; return; }
  ambient.forEach((p, i) => {
    const ep = edgePaths[p.eid]; if (!ep || ep.hidden) return;
    const pos = ep.el.getPointAtLength(p.off % ep.len);
    const kind = edgesById[p.eid].kind;
    let node = gParticles.childNodes[i];
    if (rebuild || !node) {
      node = SHAPE_FN[kind](0, 0, 2.6, KIND_COLOR_RAW[kind]);
      node.classList.add("particle");
      gParticles.appendChild(node);
    }
    node.setAttribute("transform", `translate(${pos.x} ${pos.y})`);
  });
}

/* trace 스텝이 탄 엣지를 찾는다 — 엣지 패널이 "이 구간을 지나는 흐름"을 뽑을 때 쓴다 */
function stepEdgeOf(idx) {
  if (!FLOW.trace || idx <= 0) return null;
  const s = FLOW.trace.steps[idx];
  if (s.via && edgesById[s.via]) return edgesById[s.via];
  const prev = FLOW.trace.steps[idx - 1].at;
  return FLOW.edges.find(e => e.source === prev && e.target === s.at) || null;
}

/* ================= 상세 패널 ================= */
function markPanelTarget() {
  document.querySelectorAll(".node.panel-open").forEach(g => g.classList.remove("panel-open"));
  document.querySelectorAll(".edge-path.panel-open").forEach(g => g.classList.remove("panel-open"));
  if (panelNodeId) {
    const g = document.querySelector(`.node[data-id="${panelNodeId}"]`);
    if (g) g.classList.add("panel-open");
  }
  if (panelEdgeId && edgePaths[panelEdgeId] && !edgePaths[panelEdgeId].hidden) {
    edgePaths[panelEdgeId].el.classList.add("panel-open");
  }
}
function closePanel() {
  panelNodeId = null; panelEdgeId = null;
  $("detail-panel").classList.remove("open");
  markPanelTarget();
}
function nodeSteps(nodeId) {
  if (!FLOW.trace) return [];
  return FLOW.trace.steps.map((s, i) => ({ ...s, _idx: i })).filter(s => s.at === nodeId);
}
function jumpButton(id, label) {
  return `<button class="jump" data-jump="${esc(id)}">${esc(label)}</button>`;
}
function bindJumps() {
  document.querySelectorAll("#panel-body .jump").forEach(b => {
    b.addEventListener("click", () => {
      const id = b.getAttribute("data-jump");
      if (nodesById[id]) openNodePanel(id);
      else if (edgesById[id]) openEdgePanel(id);
    });
  });
}
/* 접힘 섹션 — 첫 화면을 짧게 유지하되 정보는 버리지 않는다 (ArgoCD·n8n 방식).
   어떤 섹션을 열어뒀는지는 세션 동안 기억해, 같은 섹션을 매번 다시 열지 않게 한다. */
const openSections = new Set();
function section(key, title, count, body) {
  if (!body) return "";
  const isOpen = openSections.has(key);
  const hint = count ? ` <span class="sec-count">${count}</span>` : "";
  return `<details class="sec" data-sec="${esc(key)}"${isOpen ? " open" : ""}>
    <summary class="sec-head">${esc(title)}${hint}</summary>
    <div class="sec-body">${body}</div></details>`;
}
function bindSections() {
  document.querySelectorAll("#panel-body details.sec").forEach(d => {
    d.addEventListener("toggle", () => {
      const k = d.getAttribute("data-sec");
      d.open ? openSections.add(k) : openSections.delete(k);
    });
  });
}

function openNodePanel(nodeId) {
  const n = nodesById[nodeId]; if (!n) return;
  panelNodeId = nodeId; panelEdgeId = null;
  const ic = iconOf(n);
  $("panel-title").textContent = `${ic ? ic + " " : ""}${n.label}`;
  let html = `<div class="meta-line">${esc(n.type)}${n.role ? " · " + esc(n.role) : ""}${n.sublabel ? " · " + esc(n.sublabel) : ""}</div>`;

  // 첫 화면 — 이 노드가 무엇을 하는가 한 줄 (노드 창의 info 와 같은 문장)
  if ((n.info || []).length) {
    html += `<p class="panel-lead">${esc(n.info.join(" "))}</p>`;
  }
  if (n.type === "group") {
    html += `<div class="meta-line">내부 노드 ${countDescendants(n.id)}개 · ${collapsed.has(n.id) ? "접힘 (제목 클릭으로 펼침)" : "펼침"}</div>`;
  }
  // 왜 그런가 — 배경 설명은 접어둔다
  if (n.detail) {
    html += section(`${nodeId}:detail`, "왜 그런가", 0, `<p class="detail-text">${esc(n.detail)}</p>`);
  }
  // 여기서 일어나는 일
  const steps = nodeSteps(nodeId);
  if (steps.length) {
    html += section(`${nodeId}:steps`, "여기서 일어나는 일", steps.length,
      steps.map(s => `<div class="step-block">${esc(s.narration)}</div>`).join(""));
  }
  // 패킷 변형 — 들어올 때/나갈 때를 나란히 놓고 바뀐 줄만 강조 (n8n 의 IN/OUT 대조 차용)
  const allChanges = steps.flatMap(s => resolvedChanges[s._idx] || []);
  const snap = nodeSnapshot.get(nodeId);
  if (allChanges.length && snap?.before) {
    html += section(`${nodeId}:io`, "패킷 변형", allChanges.length, renderIoCompare(snap));
  }
  if (allChanges.length) {
    let changeBody = "";
    for (const c of allChanges) {
      if (c.kind === "set") {
        changeBody += `<div class="mech-rewrite">${esc(c.layerName)}.${esc(c.field)}: <span class="from">${esc(c.from)}</span> <span class="arrow">→</span> <span class="to">${esc(c.to)}</span></div>`;
      } else if (c.kind === "pop") {
        changeBody += `<div class="mech-rewrite"><span class="from">[${esc(c.layerName)}]</span> 계층 벗겨짐</div>`;
      } else if (c.kind === "push") {
        changeBody += `<div class="mech-rewrite"><span class="to">[${esc(c.layerName)}]</span> 계층 씌워짐</div>`;
      } else if (c.kind === "lock") {
        changeBody += `<div class="mech-rewrite">🔒 [${esc(c.layerName)}] 암호화${c.note ? " — " + esc(c.note) : ""}</div>`;
      } else if (c.kind === "unlock") {
        changeBody += `<div class="mech-rewrite">🔓 [${esc(c.layerName)}] 복호화</div>`;
      }
    }
    html += section(`${nodeId}:changes`, "무엇이 바뀌었나", allChanges.length, changeBody);
  }
  // 내부 동작
  if ((n.mechanisms || []).length) {
    const sel = new Set(steps.flatMap(s => s.mechanismEvent?.select || []));
    html += section(`${nodeId}:mech`, "내부 동작", n.mechanisms.length,
      n.mechanisms.map(m => renderMechanism(m, sel)).join(""));
  }
  // 연결
  const ins = FLOW.edges.filter(e => e.target === nodeId);
  const outs = FLOW.edges.filter(e => e.source === nodeId);
  if (ins.length || outs.length) {
    let connBody = "";
    for (const e of ins) {
      const from = nodesById[e.source];
      connBody += `<div class="conn-row">⬅ ${jumpButton(e.source, (iconOf(from) ? iconOf(from) + " " : "") + from.label)}
        <span class="conn-kind" style="color:${KIND_COLOR_RAW[e.kind]}">${esc(e.kind)}</span>
        ${e.label ? `<span class="conn-label">${esc(e.label)}</span>` : ""}
        ${e.ratio ? `<span class="conn-ratio">비율 ${esc(e.ratio)}</span>` : ""}
        ${jumpButton(e.id, "엣지")}</div>`;
    }
    for (const e of outs) {
      const to = nodesById[e.target];
      connBody += `<div class="conn-row">➡ ${jumpButton(e.target, (iconOf(to) ? iconOf(to) + " " : "") + to.label)}
        <span class="conn-kind" style="color:${KIND_COLOR_RAW[e.kind]}">${esc(e.kind)}</span>
        ${e.label ? `<span class="conn-label">${esc(e.label)}</span>` : ""}
        ${e.ratio ? `<span class="conn-ratio">비율 ${esc(e.ratio)}</span>` : ""}
        ${jumpButton(e.id, "엣지")}</div>`;
    }
    html += section(`${nodeId}:conn`, "연결", ins.length + outs.length, connBody);
  }
  if (!n.detail && !steps.length && !(n.mechanisms || []).length && !ins.length && !outs.length) {
    html += `<div class="meta-line">상세 정보 없음</div>`;
  }
  $("panel-body").innerHTML = html;
  bindJumps();
  bindSections();
  $("detail-panel").classList.add("open");
  markPanelTarget();
}
function openEdgePanel(edgeId) {
  const e = edgesById[edgeId]; if (!e) return;
  panelEdgeId = edgeId; panelNodeId = null;
  const from = nodesById[e.source], to = nodesById[e.target];
  $("panel-title").textContent = `${from.label} → ${to.label}`;
  let html = `<div class="meta-line">엣지 · <span style="color:${KIND_COLOR_RAW[e.kind]}">${esc(e.kind)}</span>${e.ratio ? " · 비율 " + esc(e.ratio) : ""}</div>`;
  if (e.label) html += `<p class="detail-text">${esc(e.label)}</p>`;
  if (e.decoration) html += `<div class="meta-line">${esc(DECO_LABEL[e.decoration] || e.decoration)}</div>`;
  html += `<div class="conn-row">출발 ${jumpButton(e.source, (iconOf(from) ? iconOf(from) + " " : "") + from.label)}</div>`;
  html += `<div class="conn-row">도착 ${jumpButton(e.target, (iconOf(to) ? iconOf(to) + " " : "") + to.label)}</div>`;
  // 이 엣지를 타는 스텝
  if (FLOW.trace) {
    const rides = FLOW.trace.steps.map((s, i) => ({ s, i })).filter(({ i }) => {
      const edge = stepEdgeOf(i);
      return edge && edge.id === edgeId;
    });
    if (rides.length) {
      html += section(`${edgeId}:rides`, "이 구간을 지나는 흐름", rides.length,
        rides.map(({ s }) => `<div class="step-block">${esc(s.narration)}</div>`).join(""));
    }
  }
  $("panel-body").innerHTML = html;
  bindJumps();
  bindSections();
  $("detail-panel").classList.add("open");
  markPanelTarget();
}
/* 들어올 때 / 나갈 때 패킷 상태를 2열로 대조한다.
   바뀐 것만 보여주면 "안 바뀐 건 뭐였지"를 알 수 없어 비교가 성립하지 않으므로,
   양쪽 전체를 놓고 달라진 줄에만 표시를 준다. */
function renderIoCompare(snap) {
  const fieldsOf = (l) => l.locked
    ? "🔒 암호화되어 볼 수 없음"
    : Object.entries(l.fields).map(([k, v]) => `${k}=${v}`).join("  ");

  const col = (layers, side) => {
    const other = side === "in" ? snap.layers : snap.before;
    const rows = layers.map(l => {
      const twin = other.find(o => o.id === l.id);
      // 짝이 없으면 이 노드에서 씌워졌거나(out 쪽) 벗겨진(in 쪽) 계층이다
      const soloCls = twin ? "" : (side === "in" ? " gone" : " added");
      const changed = twin && (fieldsOf(twin) !== fieldsOf(l));
      return `<div class="io-row${soloCls}${changed ? " chg" : ""}">
        <span class="io-layer">${esc(l.name)}</span>
        <span class="io-fields">${esc(fieldsOf(l))}</span></div>`;
    }).join("");
    return `<div class="io-col">
      <div class="io-col-head">${side === "in" ? "들어올 때" : "나갈 때"}</div>${rows}</div>`;
  };

  return `<div class="io-compare">${col(snap.before, "in")}${col(snap.layers, "out")}</div>`;
}

function renderMechanism(m, sel) {
  const title = esc(m.title || MECH_LABEL[m.type] || m.type);
  let body = "";
  if (m.type === "table-lookup") {
    body = `<table class="mech-table">`;
    if (m.columns) body += `<tr>${m.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>`;
    for (const r of m.rows || []) {
      body += `<tr class="${sel.has(r.id) ? "sel" : ""}">${(r.cells || []).map(c => `<td>${esc(c)}</td>`).join("")}</tr>`;
      if (r.note) body += `<tr class="${sel.has(r.id) ? "sel" : ""}"><td colspan="${(r.cells || []).length}" class="mech-note">${esc(r.note)}</td></tr>`;
    }
    body += `</table>`;
  } else if (m.type === "weighted-select") {
    const total = (m.candidates || []).reduce((s, c) => s + c.weight, 0) || 1;
    body = (m.candidates || []).map(c => {
      const pct = Math.round(c.weight / total * 100);
      const isSel = sel.has(c.id);
      return `<div class="mech-cand ${isSel ? "sel" : ""}">
        <span>${esc(c.label)}</span>
        <span class="bar-wrap"><span class="bar" style="width:${pct}%"></span></span>
        <span class="pct">${pct}%</span>${isSel ? `<span class="check">✓ 선택</span>` : ""}</div>`;
    }).join("");
  } else if (m.type === "rewrite") {
    body = (m.changes || []).map(c =>
      `<div class="mech-rewrite">${esc(c.layer)}.${esc(c.field)}: <span class="from">${esc(c.from)}</span> <span class="arrow">→</span> <span class="to">${esc(c.to)}</span></div>`
    ).join("");
  } else if (m.type === "crypt") {
    body = `<div class="mech-crypt">
      <span class="mode">${m.mode === "decrypt" ? "🔓 복호화" : "🔒 암호화"}</span>
      ${m.cipher ? `<span>암호군: ${esc(m.cipher)}</span>` : ""}
      ${m.layers?.length ? `<span>대상 계층: ${m.layers.map(esc).join(", ")}</span>` : ""}
      ${m.note ? `<span class="mech-note">${esc(m.note)}</span>` : ""}</div>`;
  } else if (m.type === "k8s-resolve") {
    body = `<div class="mech-describe">` + (m.lines || []).map(l => {
      const pad = "  ".repeat(l.indent || 0);
      return `<span class="line ${l.id && sel.has(l.id) ? "sel" : ""}">${pad}${esc(l.text)}</span>`;
    }).join("\n") + `</div>`;
  } else {
    const dump = Object.entries(m).filter(([k]) => k !== "type" && k !== "title")
      .map(([k, v]) => `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`).join("\n");
    body = `<div class="mech-kv">${esc(dump) || "(데이터 없음)"}</div>`;
  }
  return `<div class="mech-section">
    <div class="mech-head">${title}<span class="mech-type-tag">${esc(m.type)}</span></div>
    <div class="mech-body">${body}</div></div>`;
}

/* ================= 애니메이션 루프 ================= */
function tick(ts) {
  if (lastTs === null) lastTs = ts;
  const dt = Math.max(0, Math.min(64, ts - lastTs)); lastTs = ts;  // 음수 dt 방어

  if (motionOn) {
    for (const p of ambient) {
      const ep = edgePaths[p.eid];
      if (ep && !ep.hidden) p.off = (p.off + AMBIENT_SPEED * dt / 1000) % ep.len;
    }
    drawAmbient(false);
  }
  requestAnimationFrame(tick);
}

/* ================= 레이아웃 갱신 ================= */
function relayout(fitView) {
  computeLayout();
  computePorts();
  render();
  if (fitView) fitViewBox();
}

/* ================= viewBox 팬/줌 ================= */
/* 전체가 화면에 들어가도 글씨가 안 읽히면 소용없다.
   최소 가독 배율(1.0×)을 바닥으로 두고, 그보다 더 줄여야 하는 경우엔
   왼쪽 위(흐름 시작점)를 기준으로 맞춘다 — 나머지는 팬으로 본다. */
const MIN_READABLE_SCALE = 1.0;
function fitViewBox() {
  const wrap = document.getElementById("canvas-wrap");
  const cw = wrap.clientWidth, ch = Math.max(1, wrap.clientHeight);
  const ar = cw / ch;
  let { x, y, w, h } = contentBox;
  if (w / h < ar) { const nw = h * ar; x -= (nw - w) / 2; w = nw; }
  else { const nh = w / ar; y -= (nh - h) / 2; h = nh; }
  if (cw / w < MIN_READABLE_SCALE) {
    const nw = cw / MIN_READABLE_SCALE, nh = nw / ar;
    x = contentBox.x; y = contentBox.y + (contentBox.h - nh) / 2;
    w = nw; h = nh;
  }
  viewBox = { x, y, w, h };
  applyViewBox();
}
function applyViewBox() {
  svg.setAttribute("viewBox", `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
}
function bindPanZoom() {
  /* 클릭과 팬 구분: 누른 자리에서 5px 이상 움직여야 팬 시작.
     pointerdown 즉시 캡처하면 click 이 svg 로 리타게팅되어 노드 클릭이 죽는다 (v0.2 버그) */
  let pending = null, panning = false;
  svg.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest?.("button")) return;
    pending = { x: ev.clientX, y: ev.clientY, id: ev.pointerId };
  });
  svg.addEventListener("pointermove", (ev) => {
    if (!pending) return;
    if (!panning) {
      if (Math.hypot(ev.clientX - pending.x, ev.clientY - pending.y) < 5) return;
      panning = true;
      svg.classList.add("panning");
      svg.setPointerCapture(pending.id);
    }
    const sc = viewBox.w / svg.clientWidth;
    viewBox.x -= (ev.clientX - pending.x) * sc;
    viewBox.y -= (ev.clientY - pending.y) * sc;
    pending.x = ev.clientX; pending.y = ev.clientY;
    applyViewBox();
  });
  const end = () => { pending = null; panning = false; svg.classList.remove("panning"); };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
  svg.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const factor = ev.deltaY > 0 ? 1.1 : 1 / 1.1;
    const rect = svg.getBoundingClientRect();
    const mx = viewBox.x + (ev.clientX - rect.left) / rect.width * viewBox.w;
    const my = viewBox.y + (ev.clientY - rect.top) / rect.height * viewBox.h;
    viewBox = {
      x: mx - (mx - viewBox.x) * factor,
      y: my - (my - viewBox.y) * factor,
      w: viewBox.w * factor, h: viewBox.h * factor,
    };
    applyViewBox();
  }, { passive: false });
  svg.addEventListener("dblclick", fitViewBox);
  // 빈 캔버스 클릭 → 패널 닫기
  svg.addEventListener("click", (ev) => {
    if (ev.target === svg || ev.target.id === "g-root") closePanel();
  });
}

/* ================= 컨트롤 ================= */
function setSpeed(s) {
  speed = Math.min(4, Math.max(0.25, s));
  $("speed-label").textContent = speed.toFixed(2).replace(/0$/, "") + "×";
}
function setMotion(on) {
  motionOn = on;
  const b = $("btn-motion");
  b.setAttribute("aria-pressed", String(on));
  b.setAttribute("aria-label", "애니메이션 " + (on ? "켜짐" : "꺼짐"));
  drawAmbient(true);
}
function bindControls() {
  $("btn-faster").addEventListener("click", () => setSpeed(speed * 1.25));
  $("btn-slower").addEventListener("click", () => setSpeed(speed / 1.25));
  $("btn-motion").addEventListener("click", () => setMotion(!motionOn));
  $("btn-panel-close").addEventListener("click", closePanel);
  if (reducedMotion) setMotion(false);

  document.addEventListener("keydown", (ev) => {
    if (ev.target.closest?.("input, textarea")) return;
    if (ev.key === "+" || ev.key === "=") $("btn-faster").click();
    else if (ev.key === "-") $("btn-slower").click();
    else if (ev.key === "0") fitViewBox();
    else if (ev.key === "Escape") closePanel();
  });
  bindPanZoom();
  addEventListener("resize", fitViewBox);
}

init();

</script>
</body>
</html>

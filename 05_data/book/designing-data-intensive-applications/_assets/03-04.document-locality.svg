<title id="dt">문서 저장 locality와 부분 갱신의 전체 재작성</title><desc id="dd">문서는 연속 바이트열로 저장되어 전체 로드 시 locality 이점이 있지만, 일부 필드만 수정해도 문서 전체를 디스크에 다시 써야 한다.</desc>
<rect width="880" height="510" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">03-04 · DATA LOCALITY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">문서 저장 locality와 부분 갱신의 전체 재작성</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">전체 읽기(연속 저장 로드) vs 부분 갱신(전체 로드 → 메모리 수정 → 전체 재작성)</text>
<rect x="24" y="104" width="832" height="120" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">전체 문서 읽기 — 웹 페이지 렌더링</text>
<rect x="259.5" y="116" width="201.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="360" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">연속 저장 locality 이점</text>
<rect x="40" y="148" width="240" height="60" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="160.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">프로필 조회 요청</text>
<text x="160.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">user_id 251 전체 데이터 필요</text>
<rect x="310" y="148" width="240" height="60" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="430.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">디스크 연속 읽기</text>
<text x="430.0" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">연속 바이트열(BSON) 로드</text>
<rect x="580" y="148" width="240" height="60" rx="6" fill="#3FB98C16" stroke="#3FB98C" stroke-width="1.2"/>

<title id="dt">ORM의 N+1 쿼리 문제와 조인 fetch</title><desc id="dd">ORM이 댓글 목록을 1회 조회한 뒤 댓글마다 작성자를 따로 조회해 총 N+1 쿼리가 되는 구조를 보인다.</desc>

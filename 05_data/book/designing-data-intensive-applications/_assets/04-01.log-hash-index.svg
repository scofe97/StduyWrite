<title id="dt">인메모리 해시 인덱스 구조와 네 가지 한계</title><desc id="dd">인메모리 해시 맵이 각 키를 디스크 로그 파일의 바이트 offset에 매핑해 seek 한 번으로 값을 읽지만, 메모리 적재와 비영속의 구조적 한계를 갖는다.</desc>
<rect width="880" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">04-01 · HASH INDEX</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인메모리 해시 인덱스 구조와 네 가지 한계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">인메모리 바이트 offset 매핑 · 1회 디스크 seek 조회 · 네 가지 구조적 제약</text>

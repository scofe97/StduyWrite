<title id="dt">MapReduce 한계와 데이터플로우 엔진의 극복 구조</title><desc id="dd">MapReduce 워크플로우가 잡 사이마다 분산 파일시스템에 복제 기록하고 앞 잡이 끝나야 다음 잡을 시작하는 한계를 데이터플로우 엔진이 단일 잡 연산자 결합과 인메모리 파이프라이닝으로 극복하는 구조 대조.</desc>
<rect width="880" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">11-04 · §1 DATAFLOW ENGINES VS MAPREDUCE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">MapReduce 한계와 데이터플로우 엔진의 극복 구조</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">잡 사이 HDFS 복제 기록 vs 단일 잡 DAG 연산자 결합 · 인메모리 파이프라이닝 · 상주 워커 재사용</text>

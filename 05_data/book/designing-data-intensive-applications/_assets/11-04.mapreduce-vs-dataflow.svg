<text x="248" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">잡 사이 DFS 복제 기록 (파이프라이닝 불가)</text>

<title id="dt">SSTable과 희소 인덱스 구조</title><desc id="dd">인메모리 희소 인덱스는 블록의 첫 키만 유지하고, 디스크 SSTable의 키 정렬 블록을 seek 및 순차 스캔하여 키를 조회한다.</desc>

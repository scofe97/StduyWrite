<title id="dt">단일 머신 Unix와 분산 배치 처리 시스템 대응</title><desc id="dd">단일 머신의 파일시스템, 커널 스케줄러, 파이프 프로세스가 분산 배치의 스토리지, 잡 오케스트레이터, 처리 프레임워크로 대응되는 구조를 층별로 조망한다.</desc>
<rect width="880" height="524" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">11-01 · §5 DISTRIBUTED OS ANALOGY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">단일 머신 Unix와 분산 배치 처리 시스템 대응</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">운영체제 유추 · 파일시스템 vs 분산 스토리지 · 커널 vs 오케스트레이터 · 프로세스 vs 분산 엔진 · 컴퓨트-스토리지 분리</text>

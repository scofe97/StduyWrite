<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">08-04 §3 · XA TRANSACTION ARCHITECTURE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">XA 이기종 분산 트랜잭션 구조와 단일 장애점</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">애플리케이션 서버 내장 코디네이터 라이브러리가 로컬 디스크 로그를 사용하며 단일 장애점과 의심 상태 잠금 장기화를 유발한다.</text>

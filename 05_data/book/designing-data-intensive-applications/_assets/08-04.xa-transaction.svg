<title id="dt">XA 이기종 분산 트랜잭션 구조와 단일 장애점</title><desc id="dd">애플리케이션 프로세스 내장 코디네이터와 로컬 디스크 로그, 드라이버를 경유하는 이기종 참여자 구조와 근본적 한계를 보인다.</desc>

<title id="dt">산업혁명의 공해 극복과 정보화 시대의 데이터 대응</title><desc id="dd">산업혁명이 기술 발전 뒤 매연·아동노동 공해를 규제로 길들였듯, 정보화 시대는 축적된 데이터 공해에 프라이버시 보호와 데이터 최소화로 맞서야 한다.</desc>
<rect width="880" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">14-03 · §2 INDUSTRIAL REVOLUTION ANALOGY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">산업혁명의 공해 극복과 정보화 시대의 데이터 대응</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">기술 발전 · 공해와 어두운 면 · 제도적 안전장치 · 장기적 사회 이득의 4단계 유비 대응</text>
<rect x="28" y="104" width="824" height="36" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="440.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">역사적 유비: 산업혁명이 공해 규제로 사회적 이득을 얻었듯, 정보화 시대는 프라이버시 보호로 데이터 공해에 대응</text>
<rect x="28" y="150" width="824" height="102" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">산업혁명 — 성장과 공해, 오랜 시간 끝의 안전장치</text>
<rect x="38" y="176" width="188" height="64" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<text x="132.0" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">1. 기술·농업 발전</text>
<text x="132.0" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">장기적 경제 성장</text>
<text x="132.0" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">생활 수준의 전반적 향상</text>
<path d="M 228 208.0 L 242 208.0" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="244" y="176" width="188" height="64" rx="6" fill="#0D1117" stroke="#E3B341" stroke-width="0.9"/>
<text x="338.0" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">2. 어두운 면과 공해</text>
<text x="338.0" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">매연 대기오염 · 폐수 오염</text>
<text x="338.0" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">가혹한 노동과 아동 노동</text>
<path d="M 434 208.0 L 448 208.0" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="450" y="176" width="188" height="64" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="0.9"/>
<text x="544.0" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">3. 안전장치 제도화</text>
<text x="544.0" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">환경 보호 규제 · 안전 규약</text>
<text x="544.0" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">아동노동 금지법 · 위생 검사</text>
<path d="M 640 208.0 L 654 208.0" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="656" y="176" width="188" height="64" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<text x="750.0" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">4. 장기적 사회 이득</text>
<text x="750.0" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사업 비용은 상승</text>
<text x="750.0" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">이전으로 돌아가길 원치 않음</text>
<text x="132.0" y="268.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">기술 발전</text>
<text x="338.0" y="268.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">공해 유비 (≈)</text>
<text x="544.0" y="268.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">안전장치</text>
<text x="750.0" y="268.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">사회적 귀결</text>
<rect x="28" y="276" width="824" height="102" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">정보화 시대 — 데이터라는 공해와 프라이버시라는 환경 과제</text>
<rect x="38" y="302" width="188" height="64" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<text x="132.0" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">1. 정보 기술 발전</text>
<text x="132.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">인터넷 · 소프트웨어 자동화</text>
<text x="132.0" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">데이터 저장과 처리</text>
<path d="M 228 334.0 L 242 334.0" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="244" y="302" width="188" height="64" rx="6" fill="#F08A591C" stroke="#F08A59" stroke-width="1.4"/>
<text x="338.0" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">2. 데이터 = 공해</text>
<text x="338.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">컴퓨터 생산 정보 곪으며 잔존</text>
<text x="338.0" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">감시 정상화 · 유출 위험 노출</text>
<path d="M 434 334.0 L 448 334.0" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="450" y="302" width="188" height="64" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="0.9"/>
<text x="544.0" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">3. 프라이버시 과제</text>
<text x="544.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터 최소화 · 수집 억제</text>
<text x="544.0" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">GDPR 규제와 업계 자율 규제</text>
<path d="M 640 334.0 L 654 334.0" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="656" y="302" width="188" height="64" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<text x="750.0" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">4. 건강한 정보 경제</text>
<text x="750.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사람을 인간으로 존중</text>
<text x="750.0" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">신뢰 확립 · 후손의 평가 부응</text>
<rect x="28" y="394" width="824" height="36" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="440.0" y="417" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">Schneier: 정보화 시대의 공해(데이터)와 환경 과제(프라이버시 보호)</text>
<line x1="12" y1="444" x2="832" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="466" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="456" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터 공해 과제 (focal)</text>
<rect x="365" y="456" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="387" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">산업혁명 공해</text>
<rect x="500" y="456" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="522" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">제도적 안전장치</text>
<rect x="648" y="456" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="670" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기술 발전과 귀결</text>

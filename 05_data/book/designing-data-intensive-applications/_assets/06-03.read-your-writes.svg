<title id="dt">read-your-writes 이상 시퀀스</title><desc id="dd">사용자가 댓글을 작성한 직후 복제가 지연된 팔로워에서 조회해 자기 입력이 사라진 것처럼 보이는 현상</desc>
<rect width="880" height="508" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">06-03 · §2 READ-YOUR-WRITES ANOMALY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">read-your-writes 이상 시퀀스</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">댓글 작성(INSERT) · 리더 성공 응답 · 비동기 복제 편차 · stale 팔로워 빈 결과 · 유실 착각</text>

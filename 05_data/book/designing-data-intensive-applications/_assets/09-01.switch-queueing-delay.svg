<title id="dt">스위치 포트 큐잉과 다계층 버퍼 지연 구조</title><desc id="dd">단일 목적지로 집중되는 스위치 큐잉 혼잡과 패킷 교환망의 4단계 버퍼 지연 구조.</desc>

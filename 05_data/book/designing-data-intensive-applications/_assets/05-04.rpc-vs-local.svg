<text x="440.0" y="390" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">가변 지연</text>
<rect x="516" y="356" width="340" height="58" rx="6" fill="#0D1117" stroke="#E3B341" stroke-width="0.9"/>
<text x="532" y="379" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">가변적 지연 변동</text>
<text x="532" y="399" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">1ms 미만 ~ 혼잡·과부하 시 수 초</text>

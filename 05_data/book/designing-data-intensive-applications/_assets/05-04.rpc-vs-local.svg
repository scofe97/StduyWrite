<title id="dt">로컬 함수 호출 대 네트워크 RPC 비교</title><desc id="dd">로컬 함수 호출과 네트워크 RPC 사이의 다섯 가지 차이와 location transparency 의 한계를 견준다.</desc>
<rect width="880" height="604" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">05-04 · RPC LOCATION TRANSPARENCY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">로컬 함수 호출 대 네트워크 RPC 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">예측 가능성 · 타임아웃 · 재시도 중복 · 가변 지연 · 인자 인코딩</text>
<rect x="24" y="104" width="340" height="36" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="194.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">로컬 함수 호출 (Local Call)</text>
<rect x="376" y="104" width="128" height="36" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="440.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">비교 기준</text>
<rect x="516" y="104" width="340" height="36" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="686.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">네트워크 RPC (Remote Call)</text>
<rect x="24" y="152" width="340" height="58" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="40" y="175" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">제어 가능한 성공·실패</text>
<text x="40" y="195" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">매개변수와 로컬 상태에 종속</text>

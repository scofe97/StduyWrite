<text x="532" y="263" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">타임아웃 시 요청 도착 여부 확인 불가</text>

<title id="dt">벡터 인덱스 3종 비교</title><desc id="dd">고차원 벡터는 R-tree 적용이 어려워 전체를 순차 비교하는 flat, 공간을 파티션으로 묶는 IVF, 다층 근접 그래프를 탐색하는 HNSW를 쓴다.</desc>

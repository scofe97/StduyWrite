<title id="dt">정렬 vs 인메모리 집계 선택 기준과 메커니즘</title><desc id="dd">워킹셋 크기와 메모리 용량에 따른 두 집계 방식을 비교한다. 워킹셋이 메모리를 넘을 때 외장 정렬과 디스크 스필이 안정성을 보장하며, 병목은 디스크 순차 읽기다.</desc>
<rect width="880" height="544" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">11-01 · §4 AGGREGATION COMPARISON</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">정렬 vs 인메모리 집계 선택 기준과 메커니즘</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">워킹셋 크기 기준 선택 · 인메모리 O(1) vs 디스크 스필 병합 정렬 · 순차 I/O 읽기 병목</text>
<rect x="28" y="104" width="824" height="36" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="440.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">워킹셋 정의: 로그 파일의 총 행 수가 아니라 고유 키(URL) 수 × 카운터 크기</text>
<rect x="28" y="156" width="404" height="260" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="48" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">인메모리 해시 집계</text>
<text x="412" y="182" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Python defaultdict 방식</text>

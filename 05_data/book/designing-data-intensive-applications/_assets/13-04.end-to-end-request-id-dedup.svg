<title id="dt">요청 ID와 End-to-End 중복 억제 시퀀스</title><desc id="dd">클라이언트가 생성한 UUID 요청 ID가 TCP 계층 단절과 네트워크 재시도를 넘어 데이터베이스 유니크 제약으로 중복 실행을 차단하는 과정을 보인다.</desc>
<rect width="880" height="688" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">13-04 · §1 END-TO-END ARGUMENT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">요청 ID와 End-to-End 중복 억제 시퀀스</text>

<title id="dt">GDPR 동의 요건과 온라인 추적 현실의 비교</title><desc id="dd">EU GDPR 이 요구하는 동의와 본문 §3 이 짚은 추적 서비스 현실을 본문이 GDPR 에 묶은 세 쟁점으로 대조.</desc>
<rect width="880" height="412" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">14-02 · SECTION 3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">GDPR 동의 요건과 온라인 추적 현실의 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">불이익 없는 거부 · 정보에 입각한 동의 · 자유롭게 주어진 동의 대 추적 서비스 현실</text>
<rect x="24" y="100" width="150" height="36" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="99" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">쟁점</text>
<rect x="182" y="100" width="328" height="36" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="346" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">EU GDPR 요구</text>
<rect x="518" y="100" width="338" height="36" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="687" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">온라인 추적 서비스 현실</text>
<rect x="24" y="144" width="150" height="60" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="99" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">거부·철회</text>
<text x="99" y="188" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">without detriment</text>
<rect x="182" y="144" width="328" height="60" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="346" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">불이익 없이 거부·철회</text>
<text x="346" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아니면 자유로운 동의 아님</text>
<rect x="518" y="144" width="338" height="60" rx="4" fill="#F08A5910" stroke="#F08A59" stroke-width="1.1"/>
<text x="687" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">거부는 소수 특권층의 선택지</text>
<text x="687" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사회 참여 필수 · 네트워크 효과 비용</text>
<rect x="24" y="212" width="150" height="60" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="99" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">이해</text>
<text x="99" y="256" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">informed</text>
<rect x="182" y="212" width="328" height="60" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="346" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">정보에 입각한 동의</text>
<text x="346" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">명료하고 쉬운 언어로 요청</text>
<rect x="518" y="212" width="338" height="60" rx="4" fill="#F08A5910" stroke="#F08A59" stroke-width="1.1"/>
<text x="687" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">밝히기보다 가리는 정책</text>
<text x="687" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">동의 안 한 비이용자 데이터까지</text>
<rect x="24" y="280" width="150" height="60" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="99" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">상호성</text>
<text x="99" y="324" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">freely given</text>
<rect x="182" y="280" width="328" height="60" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="346" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">자유롭게 주어진 동의</text>
<text x="346" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">협상 여지 없는 관계면 불성립</text>
<rect x="518" y="280" width="338" height="60" rx="4" fill="#F08A5910" stroke="#F08A59" stroke-width="1.1"/>
<text x="687" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">협상 없는 일방향 추출</text>
<text x="687" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">약관은 서비스가 정함</text>
<line x1="12" y1="356" x2="832" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="378" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="368" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">GDPR 요구</text>
<rect x="235" y="368" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="257" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">추적 서비스 현실 (focal)</text>
</svg>
<title id="dt">유지보수성 전체 지도</title><desc id="dd">운영성과 자동화(§1), 단순성과 추상화(§2), 발전성과 비가역성(§3), 2장 종합(§4)의 흐름과 공통 해법을 조망한다.</desc>

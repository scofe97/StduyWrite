<title id="dt">보조 인덱스와 비유일 키 해소</title><desc id="dd">기본키는 행을 유일 식별하지만 보조 인덱스는 한 키에 여러 행이 대응하므로, postings list나 행 ID 덧붙임으로 유일성을 확보한다.</desc>

<title id="dt">눈송이 스키마의 subdimension 분해</title><desc id="dd">눈송이 스키마는 dimension 테이블의 컬럼을 subdimension 테이블로 더 정규화해 외래 키 다대일(N:1) 관계로 쪼갠다.</desc>

<title id="dt">LSM 저장 엔진의 쓰기·읽기·병합 데이터 흐름</title><desc id="dd">쓰기는 WAL과 memtable에 동시 기록 후 flush되고, 읽기는 memtable부터 최신 세그먼트 순으로 찾으며, 백그라운드 mergesort로 병합한다.</desc>
<rect width="880" height="572" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">04-02 · §2 LSM FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">LSM 저장 엔진의 쓰기·읽기·병합 데이터 흐름</text>

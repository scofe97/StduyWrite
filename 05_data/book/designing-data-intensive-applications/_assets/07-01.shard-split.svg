<rect x="458" y="170" width="172" height="48" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="0.9"/>
<text x="544.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">모든 데이터 새 파일로</text>
<text x="544.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">컴팩션과 비슷한 재작성</text>
<rect x="458" y="226" width="172" height="48" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="0.9"/>
<text x="544.0" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">핫 샤드 분할</text>
<text x="544.0" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">과부하 악화 위험</text>
<path d="M 642 122 L 652 122" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="654" y="104" width="192" height="186" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="688.0" y="112" width="124.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="750.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">04 · 노드 분산</text>
<text x="750.0" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">작은 샤드 재배치</text>
<line x1="666" y1="158" x2="834" y2="158" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="664" y="170" width="172" height="48" rx="4" fill="#3FB98C12" stroke="#3FB98C" stroke-width="0.9"/>
<text x="750.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">작은 샤드들</text>
<text x="750.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여러 노드로 분산</text>

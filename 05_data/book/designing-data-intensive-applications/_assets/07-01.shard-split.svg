<rect x="448" y="104" width="192" height="186" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<rect x="476.5" y="112" width="135.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="544.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">03 · 파일 재작성</text>

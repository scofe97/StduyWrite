<rect x="252" y="170" width="172" height="48" rx="4" fill="#6A95D812" stroke="#6A95D8" stroke-width="0.9"/>
<text x="338.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">하위 범위 둘로 분할</text>
<text x="338.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">각자 연속 키 구간</text>

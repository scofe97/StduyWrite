<title id="dt">키 범위 샤드 분할과 재배치 프로세스</title><desc id="dd">샤드가 설정 크기(HBase 기본 10 GB)나 쓰기 처리량 임계치를 넘으면 하위 범위로 나누고, 새 파일 재작성 비용을 치른 뒤 작은 샤드를 여러 노드로 분산한다.</desc>
<rect width="880" height="430" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">07-01 · §5 PROCESS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">키 범위 샤드 분할과 재배치 프로세스</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">설정 크기·처리량 초과 · 하위 범위 분할 · 새 파일 재작성 · 여러 노드로 분산</text>
<rect x="36" y="104" width="192" height="186" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="64.5" y="112" width="135.0" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="132.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">01 · 임계치 도달</text>
<text x="132.0" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">크기 또는 처리량 초과</text>
<line x1="48" y1="158" x2="216" y2="158" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="46" y="170" width="172" height="48" rx="4" fill="#E3B34112" stroke="#E3B341" stroke-width="0.9"/>
<text x="132.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">설정 크기 초과</text>
<text x="132.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">HBase 기본 10 GB</text>
<rect x="46" y="226" width="172" height="48" rx="4" fill="#E3B34112" stroke="#E3B341" stroke-width="0.9"/>
<text x="132.0" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">쓰기 처리량 임계치 초과</text>
<text x="132.0" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">작은 핫 샤드도 분할</text>

<title id="dt">실수 삭제 시 복제 전파와 백업 스냅샷 복원</title><desc id="dd">실수로 지운 데이터는 삭제가 레플리카로 전파돼 복제로는 살릴 수 없고, 과거 스냅샷을 저장한 백업으로만 복원할 수 있다.</desc>
<rect width="880" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">06-01 · §3 DATA FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">실수 삭제 시 복제 전파와 백업 스냅샷 복원</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">실수 삭제 · 레플리카로 전파 · 모든 사본에서 사라짐 vs 과거 스냅샷 보존 · 백업에서 복원</text>

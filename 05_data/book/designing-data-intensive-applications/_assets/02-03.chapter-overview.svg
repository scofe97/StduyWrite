<title id="dt">신뢰성과 내결함성 전체 지도</title><desc id="dd">결함과 장애의 층위(§1), 내결함성과 결함 주입(§2), 하드웨어(§3)·소프트웨어(§4)·사람(§5)의 결함 대처, 신뢰성의 사회적 영향(§6)을 조망한다.</desc>

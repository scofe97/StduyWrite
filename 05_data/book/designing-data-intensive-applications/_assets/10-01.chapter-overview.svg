<title id="dt">선형성 개념과 구성 원리 전체 지도</title><desc id="dd">선형성 정의(§1), 구성 규칙(§2), 직렬성 비교(§3), 필요 상황(§4), 복제 방법(§5)의 체계.</desc>
<rect width="880" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">10-01 · CHAPTER OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">선형성 개념과 구성 원리 전체 지도</text>

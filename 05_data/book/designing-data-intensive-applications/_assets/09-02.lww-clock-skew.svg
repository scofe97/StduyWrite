<title id="dt">다중 리더 쓰기의 타임스탬프 역전과 LWW 유실 시퀀스</title><desc id="dd">클라이언트 B의 x=2 증분이 인과적으로 나중이지만 클럭 스큐로 작은 타임스탬프가 붙어 조용히 유실되는 과정.</desc>

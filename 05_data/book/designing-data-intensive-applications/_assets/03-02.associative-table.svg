<title id="dt">다대다 관계의 연관 테이블과 양방향 인덱스</title><desc id="dd">다대다 관계는 자족적 문서에 들어가지 않아 연관 테이블(positions)로 관계를 한 곳에만 저장하고, user_id와 org_id 양쪽 보조 인덱스로 양방향 쿼리를 지원한다.</desc>

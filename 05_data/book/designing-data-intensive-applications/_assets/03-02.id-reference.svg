<title id="dt">이름 변경 시 ID 참조와 복제 저장의 갱신 경로</title><desc id="dd">지역 이름이 바뀔 때 비정규화는 모든 사용자 행의 텍스트를 갱신해야 하고 불일치 위험이 따르지만, 정규화는 지역 엔티티 한 곳만 갱신하고 불변 ID 참조는 그대로 유지된다.</desc>
<rect width="880" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">03-02 · §1 ID REFERENCE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름 변경 시 ID 참조와 복제 저장의 갱신 경로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽은 사본 다수 갱신과 불일치 위험, 오른쪽은 단 1곳 갱신과 불변 ID를 통한 일관성 보장입니다.</text>
<rect x="16" y="104" width="416" height="308" rx="6" fill="#0D1117" stroke="#E3B341" stroke-width="1.2"/>
<rect x="448" y="104" width="416" height="308" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="1.4"/>
<text x="32" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">비정규화 — 텍스트 복제 저장</text>
<text x="32" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">각 사용자 행마다 지역명 문자열 직접 저장</text>
<text x="464" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">정규화 — ID 참조와 단일 저장</text>
<text x="464" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사람에게 의미 있는 정보는 한 곳만 저장</text>

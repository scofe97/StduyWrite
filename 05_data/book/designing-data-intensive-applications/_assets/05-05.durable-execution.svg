<title id="dt">durable execution 크래시 복구와 Replay 시퀀스</title><desc id="dd">워크플로우 엔진이 모든 RPC·상태 변경을 WAL 같은 지속 저장소에 로깅하고, 실패한 태스크를 재실행할 때 성공한 호출은 이전 결과로 대신해 exactly-once 의미론을 제공한다.</desc>
<rect width="880" height="752" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">05-05 §1 · DURABLE EXECUTION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">durable execution 크래시 복구와 Replay 시퀀스</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">호출과 로깅 · 입금 전 실패 · 재실행 때 성공한 호출 건너뜀 · 남은 호출 실행</text>

<title id="dt">세 가지 확장 아키텍처</title><desc id="dd">shared-memory는 한 머신을 키우고, shared-disk는 노드들이 디스크를 공유하며, shared-nothing은 노드마다 CPU·RAM·디스크를 가지고 네트워크로 조율한다.</desc>

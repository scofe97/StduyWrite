<title id="dt">공유 로그와 결정론적 상태 머신 복제 흐름</title><desc id="dd">신뢰 가능한 전달과 전체 순서를 보장하는 공유 로그를 통해 모든 복제본이 동일한 최종 상태에 도달한다.</desc>
<rect width="880" height="510" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">10-04 · §3 TOTAL ORDER BROADCAST AND STATE MACHINE REPLICATION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">공유 로그와 결정론적 상태 머신 복제 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">클라이언트 동시 제안 · 공유 로그 전체 순서 고정 · 복제본 결정론적 순차 실행 · 복제본 간 상태 수렴</text>

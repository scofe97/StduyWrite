<title id="dt">연결 인덱스와 R-tree의 2차원 범위 검색</title><desc id="dd">연결 인덱스는 위도만 좁힐 뿐 경도는 전체 띠를 훑어야 하지만, R-tree는 가까운 점을 같은 서브트리에 묶어 위도와 경도를 함께 좁힌다.</desc>
<rect width="880" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">04-06 · §1 MULTIDIMENSIONAL INDEX</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">연결 인덱스와 R-tree의 2차원 범위 검색</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽은 위도 정렬에 따른 1차원 띠 스캔 낭비, 오른쪽은 가까운 점을 묶은 서브트리 단위 탐색입니다.</text>
<rect x="16" y="96" width="416" height="316" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="32" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">연결 인덱스 — (위도, 경도) 단일 축 정렬</text>
<text x="32" y="142" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">위도 구간을 좁혀도 해당 띠의 경도를 전부 스캔</text>
<rect x="448" y="96" width="416" height="316" rx="6" fill="#F08A5910" stroke="#F08A59" stroke-width="1.4"/>
<text x="464" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">R-tree — 가까운 점을 서브트리로 묶음</text>
<text x="464" y="142" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">공간을 나눠 가까운 점을 같은 서브트리에 둠</text>
<rect x="36" y="160" width="376" height="176" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="68" y1="304" x2="392" y2="304" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="392" y="322" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">경도 축</text>
<line x1="68" y1="304" x2="68" y2="176" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="74" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">위도 축</text>
<rect x="72" y="208" width="324" height="56" rx="4" fill="#E3B34116" stroke="#E3B341" stroke-width="1.0"/>
<text x="82" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">위도 일치 띠 (51.4946 ~ 51.5)</text>
<rect x="120" y="236" width="8" height="8" rx="6" fill="#E3B341" stroke="#E3B341" stroke-width="1.0"/>
<text x="124" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">경도 벗어남</text>
<rect x="224" y="230" width="92" height="26" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<rect x="234" y="239" width="8" height="8" rx="6" fill="#3FB98C" stroke="#3FB98C" stroke-width="1.2"/>
<text x="280" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">목표 식당</text>
<rect x="350" y="236" width="8" height="8" rx="6" fill="#E3B341" stroke="#E3B341" stroke-width="1.0"/>
<text x="354" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">경도 벗어남</text>
<rect x="36" y="348" width="376" height="48" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="0.9"/>
<text x="224.0" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">위도 인덱스는 위도 띠 전체 레코드를 반환</text>
<text x="224.0" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">경도 필터링을 위해 무관한 행까지 전부 검사</text>
<rect x="468" y="160" width="376" height="176" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="496" y="180" width="136" height="56" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="564" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">서브트리 A</text>
<text x="564" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">질의 영역 밖 · 건너뜀</text>
<rect x="648" y="196" width="172" height="92" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="734" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">서브트리 B</text>
<rect x="664" y="224" width="140" height="54" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="734" y="242" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">지도 검색 사각형</text>
<rect x="684" y="252" width="8" height="8" rx="6" fill="#3FB98C" stroke="#3FB98C" stroke-width="1.2"/>
<text x="738" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">목표 식당 일치</text>
<rect x="496" y="248" width="136" height="56" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="564" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">서브트리 C</text>
<text x="564" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">질의 영역 밖 · 건너뜀</text>
<rect x="468" y="348" width="376" height="48" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="0.9"/>
<text x="656.0" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">질의 사각형과 겹치지 않는 서브트리는 건너뜀</text>
<text x="656.0" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">위도와 경도 두 차원을 함께 좁힘</text>
<line x1="12" y1="440" x2="832" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="462" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="452" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">질의 사각형 일치</text>
<rect x="261" y="452" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="283" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">R-tree 서브트리 탐색</text>
<rect x="487" y="452" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="509" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">단일 축 낭비 스캔</text>
<rect x="661" y="452" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="683" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">검색 제외 서브트리</text>
</svg>
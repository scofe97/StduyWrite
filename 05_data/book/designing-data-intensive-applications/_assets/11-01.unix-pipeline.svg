<title id="dt">Unix 파이프라인 단계별 데이터 변환 흐름</title><desc id="dd">cat, awk, sort, uniq, head로 이어지는 명령 파이프라인에서 레코드가 추출되고 정렬되며 집계되는 데이터 변환 모습을 추적한다. 정렬을 통한 동일 키 군집화가 핵심이다.</desc>
<rect width="880" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">11-01 · §2 DATA FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Unix 파이프라인 단계별 데이터 변환 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">표준 입출력 파이프 · 필드 추출 · 사전순 정렬 군집화 · 인접 카운트 집계 · 상위 5개 출력</text>
<rect x="28" y="104" width="824" height="36" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="440.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Unix 파이프라인 원리: 단일 책임 명령들을 stdin · stdout 표준 인터페이스로 연결해 데이터 스트림을 순차 처리</text>
<rect x="28" y="156" width="264" height="148" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<rect x="35.5" y="166" width="41.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="56" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">1단계</text>
<text x="88" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">cat access.log</text>
<text x="160.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">로그 파일 행 스트림 방출</text>
<line x1="38" y1="212" x2="282" y2="212" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="36" y="222" width="248" height="70" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="44" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">표준 출력 스트림:</text>
<text x="44" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">216.58.210.78 "GET /css/..."</text>

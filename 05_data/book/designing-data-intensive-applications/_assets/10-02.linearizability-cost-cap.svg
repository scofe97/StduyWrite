<title id="dt">네트워크 파티션 시 선형성과 가용성의 충돌</title><desc id="dd">두 리전 사이 링크 단절 시 팔로워 리전의 요청 거부(CP)와 독립 처리(AP) 선택 구조.</desc>
<rect width="880" height="526" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">10-02 · §1 PARTITION CONFLICT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">네트워크 파티션 시 선형성과 가용성의 충돌</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">단일 리더 구성 · 복제 링크 단절 · 최신성 검증 불가 · CP 요청 거부 · AP 분기 처리</text>
<rect x="24" y="104" width="356" height="208" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">리전 A (Region A) — 리더 데이터센터</text>

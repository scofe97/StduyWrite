<title id="dt">배치·스트림 통합과 DB 언번들링 전체 지도</title><desc id="dd">비동기 파생(§1), 재처리 진화(§2), 람다·카파 통합(§3), DB 언번들링(§4), 연합 vs 언번들드(§5)의 체계.</desc>

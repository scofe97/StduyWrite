<text x="440.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">배치·스트림 단일 엔진 통합 + DB 내부 기능 외부 조합 → 유연하고 유지보수 쉬운 시스템</text>

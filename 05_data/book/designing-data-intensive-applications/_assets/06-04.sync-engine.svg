<title id="dt">sync engine과 local-first 아키텍처</title><desc id="dd">각 기기·탭이 로컬 DB를 리더로 삼아 즉각 응답하고, sync engine을 통해 비동기 복제하는 구조.</desc>
<rect width="880" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">06-04 · SYNC ENGINES &amp; LOCAL-FIRST</text>

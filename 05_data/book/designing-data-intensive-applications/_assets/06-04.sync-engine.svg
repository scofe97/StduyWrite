<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">로컬 DB 리더 동작 · 16ms 즉각 UI 렌더링 · 오프라인 작업 · local-first</text>

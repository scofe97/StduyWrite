<title id="dt">ZooKeeper를 이용한 샤드 매핑 조율</title><desc id="dd">각 노드가 자신을 조율 서비스에 등록하고, ZooKeeper가 권위 있는 샤드→노드 매핑을 유지하며, 라우팅 티어가 이를 구독해 클라이언트 요청을 올바른 노드로 포워드한다.</desc>

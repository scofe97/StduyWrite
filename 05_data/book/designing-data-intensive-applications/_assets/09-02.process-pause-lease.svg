<title id="dt">프로세스 일시 중단 중 리스 만료와 잘못된 쓰기 흐름</title><desc id="dd">시각 확인과 처리 사이 프로세스 멈춤으로 리스가 만료된 뒤에도 자신이 리더라 믿고 쓰기를 수행하는 과정.</desc>
<rect width="880" height="716" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">09-02 · §5 PROCESS PAUSE &amp; LEASE EXPIRATION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로세스 일시 중단 중 리스 만료와 잘못된 쓰기 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">리스 만료 시각 확인 · 15초 멈춤 · 리스 만료 · 다른 노드가 리더 · 만료된 리스로 쓰기</text>
<rect x="220" y="104" width="240" height="36" rx="18" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="340" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">리스 만료 시각 확인</text>
<path d="M 340 140 L 340 168" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 340 170.0 L 460.0 200 L 340 230.0 L 220.0 200 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="340" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">리스 유효?</text>
<path d="M 220.0 200 L 170 200" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)"/>
<rect x="176.5" y="180" width="47.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="200" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">아니오</text>
<rect x="28" y="182" width="142" height="36" rx="18" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="99" y="205" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#6A95D8">처리하지 않음</text>
<path d="M 340 230.0 L 340 256" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<rect x="324.0" y="232" width="80.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="364" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">예 (유효)</text>
<rect x="200" y="256" width="280" height="44" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="340" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">처리 계속 결정</text>
<text x="340" y="290" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">현재 시각 &lt; 리스 만료 시각</text>
<path d="M 340 300 L 340 330" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="190" y="330" width="300" height="48" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.3"/>
<text x="340" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">프로세스 일시 중단 발생 (15초 정지)</text>
<text x="340" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">GC STW · VM 마이그레이션 · I/O 대기</text>
<path d="M 490 354 L 570 354" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<rect x="495.5" y="332" width="69.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="530" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">시간 경과</text>
<rect x="570" y="320" width="280" height="68" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="710" y="342" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">리스 만료</text>
<text x="710" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">다른 노드가 리더가 됨</text>
<path d="M 340 378 L 340 418" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="200" y="418" width="280" height="44" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="340" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">프로세스 실행 재개</text>
<text x="340" y="452" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스레드는 자신이 멈춘 사실을 모름</text>
<path d="M 340 462 L 340 498" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<rect x="190" y="498" width="300" height="46" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="340" y="516" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">만료된 리스로 요청 처리 및 쓰기 실행</text>
<text x="340" y="533" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자신이 리더라고 믿음</text>
<path d="M 710 388 L 710 521 L 490 521" fill="none" stroke="#F0616D" stroke-width="1.2" marker-end="url(#bad)" stroke-dasharray="4 3"/>
<text x="630" y="511" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">두 리더 공존</text>
<path d="M 340 544 L 340 584" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="170" y="584" width="340" height="48" rx="22" fill="#161B22" stroke="#F08A59" stroke-width="1.6"/>
<text x="340" y="602" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">자신이 리더라 믿고 쓰기 수행</text>
<text x="340" y="620" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">리스 만료 뒤의 잘못된 쓰기</text>
<line x1="12" y1="660" x2="832" y2="660" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="682" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="672" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="682" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">잘못된 쓰기 (focal)</text>
<rect x="326" y="672" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="348" y="682" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 판정</text>
<rect x="435" y="672" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="457" y="682" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">진행 단계</text>
<rect x="544" y="672" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="566" y="682" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로세스 정지</text>
<rect x="679" y="672" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="701" y="682" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">리스 만료</text>
</svg>
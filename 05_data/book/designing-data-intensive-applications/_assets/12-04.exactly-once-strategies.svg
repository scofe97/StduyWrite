<title id="dt">스트림 처리 Exactly-Once 4대 달성 전략</title><desc id="dd">스트림은 무한하여 배치처럼 출력을 단순히 버릴 수 없으므로, 마이크로배치·체크포인트·원자적 커밋·멱등성이 각각 다른 방식으로 exactly-once 의미론을 달성하는 구조를 비교한다.</desc>
<rect width="880" height="594" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">12-04 · §3 FAULT TOLERANCE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스트림 처리 Exactly-Once 4대 달성 전략</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">소블록 분할 · 주기적 상태 스냅샷 · 단일 트랜잭션 묶음 · 단조 오프셋 멱등성</text>
<rect x="28" y="104" width="824" height="36" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="440.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F5F5F3">스트림 내결함성의 본질: 무한 입력 환경에서 내부 상태 복구와 외부 부수 효과 제어로 effectively-once 보장</text>
<rect x="28" y="156" width="398" height="144" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="44" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">마이크로배치 (Microbatching)</text>
<rect x="353.95" y="166" width="48.1" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="378" y="180" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">Spark</text>
<text x="44" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소블록 단위 배치 분할</text>
<line x1="40" y1="210" x2="414" y2="210" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="40" y="218" width="374" height="34" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="50" y="239" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">동작 메커니즘</text>
<text x="132" y="239" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">스트림을 약 1초 소블록 단위로 분할 처리</text>
<rect x="40" y="258" width="374" height="34" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="50" y="279" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">가시성 및 제약</text>
<text x="132" y="279" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">블록 완료 시 일괄 가시화 및 윈도우 크기 제약</text>
<rect x="454" y="156" width="398" height="144" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="470" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">체크포인트 (Checkpointing)</text>
<rect x="779.95" y="166" width="48.1" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="804" y="180" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">Flink</text>
<text x="470" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">주기적 연산자 상태 스냅샷</text>
<line x1="466" y1="210" x2="840" y2="210" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="466" y="218" width="374" height="34" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="476" y="239" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">동작 메커니즘</text>
<text x="558" y="239" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">메시지 베리어 기반 주기적 상태 스냅샷 저장</text>
<rect x="466" y="258" width="374" height="34" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="476" y="279" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">복구 및 제약</text>
<text x="558" y="279" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최근 체크포인트부터 재생 및 멱등성 보완 필요</text>
<rect x="28" y="316" width="398" height="144" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="44" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">원자적 커밋 (Atomic Commit)</text>
<rect x="353.95" y="326" width="48.1" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="378" y="340" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">Kafka</text>
<text x="44" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">단일 트랜잭션 일괄 영속화</text>
<line x1="40" y1="370" x2="414" y2="370" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="40" y="378" width="374" height="34" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="50" y="399" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">동작 메커니즘</text>
<text x="132" y="399" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">출력 쓰기 · 메시지 발행 · 상태 갱신 단일 묶음</text>
<rect x="40" y="418" width="374" height="34" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="50" y="439" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">가시성 및 제약</text>
<text x="132" y="439" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">성공 시 일괄 반영 및 내부 트랜잭션 관리</text>
<rect x="454" y="316" width="398" height="144" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="470" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">멱등성 연산 (Idempotence)</text>
<rect x="773.13" y="326" width="61.74" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="804" y="340" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">Trident</text>
<text x="470" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">중복 연산 결과 불변성</text>
<line x1="466" y1="370" x2="840" y2="370" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="466" y="378" width="374" height="34" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="476" y="399" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">동작 메커니즘</text>
<text x="558" y="399" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">단조 증가 오프셋 메타데이터 저장소 병기</text>
<rect x="466" y="418" width="374" height="34" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="476" y="439" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">복구 및 제약</text>
<text x="558" y="439" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">중복 갱신 무효화 및 결정론적 처리 전제</text>
<rect x="28" y="476" width="824" height="44" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.0"/>
<text x="440.0" y="502" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F5F5F3">체크포인트와 크래시 사이 이벤트는 중복 처리될 수 있어 멱등성이나 트랜잭션으로 보완</text>
<line x1="12" y1="542" x2="832" y2="542" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="564" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="554" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">마이크로배치 (§3)</text>
<rect x="287" y="554" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="309" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">체크포인트 (§3)</text>
<rect x="461" y="554" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>

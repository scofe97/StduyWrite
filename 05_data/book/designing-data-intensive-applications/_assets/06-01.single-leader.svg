<title id="dt">단일 리더 복제의 쓰기·읽기 경로와 복제 로그</title><desc id="dd">클라이언트는 모든 쓰기를 단일 리더로 보내 로컬 저장소에 선행 기록하고, 리더는 변경 스트림을 모든 팔로워로 전파하며 읽기 질의는 모든 노드가 분담한다.</desc>

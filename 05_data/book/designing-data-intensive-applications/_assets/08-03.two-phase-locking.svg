<title id="dt">2단계 잠금(2PL)의 상호 차단 규칙과 단계 변화</title><desc id="dd">공유(S)·독점(X) 잠금의 호환성 매트릭스와 취득-해제 2단계 수명주기</desc>
<rect width="880" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">08-03 · §3 TWO-PHASE LOCKING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">2단계 잠금(2PL)의 상호 차단 규칙과 단계 변화</text>

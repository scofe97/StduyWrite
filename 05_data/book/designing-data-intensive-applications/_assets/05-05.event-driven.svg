<title id="dt">메시지 브로커의 큐와 토픽 분배 패턴</title><desc id="dd">메시지 브로커가 비동기 버퍼로 송수신자를 분리하고, 큐(1:1 경쟁 소비자)와 토픽(1:N 발행·구독) 두 가지 분배 패턴으로 메시지를 전달한다.</desc>

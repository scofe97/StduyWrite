<title id="dt">분석용 스키마의 정규화 축과 세 가지 관례</title><desc id="dd">데이터 웨어하우스의 스키마는 정규화 정도에 따라 OBT(dimension 을 fact 에 접음), 별 스키마, 눈송이 스키마(더 정규화)로 나란히 놓인다. 별 스키마가 분석가에게 더 단순해 흔히 선호된다.</desc>
<rect width="880" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">03-03 · CHAPTER OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">분석용 스키마의 정규화 축과 세 가지 관례</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">정규화 수준에 따른 세 관례의 비교</text>
<rect x="28" y="104" width="824" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="44" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">비정규화 (조인 최소화)</text>
<line x1="204" y1="120" x2="324.0" y2="120" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="440.0" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">정규화 수준 (Normalization)</text>
<path d="M 556.0 120 L 672 120" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="836" y="124" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">정규화 (중복 최소화)</text>
<rect x="28" y="148" width="264" height="296" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<rect x="132.54" y="160" width="54.92" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="160.0" y="174" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">§3 OBT</text>
<text x="160.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">단일 넓은 테이블</text>
<text x="160.0" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">완전 비정규화 · One Big Table</text>
<line x1="44" y1="236" x2="276" y2="236" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="44" y="254" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">테이블 구조</text>
<text x="44" y="271" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">단일 테이블 1개 (fact + dimension)</text>
<text x="44" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">조인 방식</text>
<text x="44" y="305" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">조인 사전 계산 (precomputed)</text>
<text x="44" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">컬럼 구성</text>
<text x="44" y="339" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">dimension 정보를 접은 비정규화 컬럼</text>
<text x="44" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">쿼리 특성</text>
<text x="44" y="373" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">조인 없이 조회 · 때로 더 빠름</text>
<rect x="40" y="408" width="240" height="26" rx="4" fill="#E3B34118" stroke="#E3B341" stroke-width="1.0"/>
<text x="160.0" y="425" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">저장 공간 증가 · 조인 제거</text>
<rect x="308" y="148" width="264" height="296" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<rect x="389.0" y="160" width="102.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="440.0" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">§1 별 스키마</text>
<text x="440.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">fact 와 dimension</text>
<text x="440.0" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">dimension 은 문자열 보관 · 흔히 선호</text>
<line x1="324" y1="236" x2="556" y2="236" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="324" y="254" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">테이블 구조</text>
<text x="324" y="271" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">중앙 fact + 둘러싼 dimension</text>
<text x="324" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">조인 방식</text>
<text x="324" y="305" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">fact → dimension 외래 키 1단계</text>
<text x="324" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">컬럼 구성</text>
<text x="324" y="339" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">fact 속성 + dimension 메타데이터</text>
<text x="324" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">쿼리 특성</text>
<text x="324" y="373" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">분석가에게 더 단순</text>
<rect x="320" y="408" width="240" height="26" rx="4" fill="#F08A5918" stroke="#F08A59" stroke-width="1.0"/>
<text x="440.0" y="425" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">정규화는 덜 · 다루기는 단순</text>
<rect x="588" y="148" width="264" height="296" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="658.0" y="160" width="124.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="720.0" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">§2 눈송이 스키마</text>
<text x="720.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">subdimension 분해</text>
<text x="720.0" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">높은 정규화 · snowflake</text>
<line x1="604" y1="236" x2="836" y2="236" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="604" y="254" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">테이블 구조</text>
<text x="604" y="271" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">fact → dimension → subdimension</text>
<text x="604" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">조인 방식</text>
<text x="604" y="305" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">외래 키 2단계 이상 다중 조인</text>
<text x="604" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">컬럼 구성</text>
<text x="604" y="339" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">브랜드 · 카테고리 별도 테이블 분리</text>
<text x="604" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">쿼리 특성</text>
<text x="604" y="373" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">분석가에게 별보다 덜 단순</text>
<rect x="600" y="408" width="240" height="26" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.0"/>
<text x="720.0" y="425" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">더 정규화 · 조인 계층 증가</text>
<rect x="28" y="460" width="824" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="48" y="484" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">핵심 기준</text>
<text x="112" y="484" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">분석 데이터는 바뀌지 않는 이력 · 비정규화의 일관성·쓰기 부담이 덜함</text>
<line x1="12" y1="524" x2="832" y2="524" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="546" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

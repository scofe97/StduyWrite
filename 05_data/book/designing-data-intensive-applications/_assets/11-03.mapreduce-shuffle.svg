<title id="dt">MapReduce 5단계 셔플과 분산 정렬 데이터 흐름</title><desc id="dd">매퍼가 키 해시 기반으로 로컬 파티션 파일을 생성하고 정렬하면, 리듀서가 네트워크를 통해 복사해 병합 정렬(MergeSort)한 뒤 키별 이터레이터로 집계 결과를 출력한다.</desc>
<rect width="880" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">11-03 · §5 MAPREDUCE SHUFFLE ARCHITECTURE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">MapReduce 5단계 셔플과 분산 정렬 데이터 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">HDFS 샤드 입력 · 키 해시 파티셔닝과 로컬 정렬 · 클러스터 전역 네트워크 복사(셔플) · MergeSort 병합 · 리듀서 이터레이터 및 DFS 저장</text>
<rect x="24" y="102" width="832" height="34" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="440.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">MapReduce 셔플 5단계: 키 해시 파티셔닝(1) → 네트워크 복사(2) → MergeSort 병합(3) → 리듀서 호출(4) → DFS 저장(5)</text>
<rect x="24" y="146" width="236" height="316" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="37.5" y="154" width="41.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>

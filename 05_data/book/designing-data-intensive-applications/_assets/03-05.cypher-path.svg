<title id="dt">가변 길이 경로와 그래프 패턴 매칭</title><desc id="dd">WITHIN*0.. 연산자가 서로 다른 깊이의 위치 계층을 순회해 미국과 유럽 목표 정점을 매칭하는 과정</desc>

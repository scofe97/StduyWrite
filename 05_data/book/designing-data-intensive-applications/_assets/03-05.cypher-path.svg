<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">출생지는 1홉, 거주지는 3홉의 WITHIN 간선을 따라가며 동일 정점(Lucy)을 결과로 반환합니다.</text>

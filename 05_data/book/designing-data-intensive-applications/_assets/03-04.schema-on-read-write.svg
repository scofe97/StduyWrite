<title id="dt">구조를 다루는 시점</title><desc id="dd">schema-on-read 는 읽을 때 구조를 해석하고 schema-on-write 는 쓸 때 데이터베이스가 적합성을 보장한다.</desc>
<rect width="880" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">03-04 · SCHEMA ON READ VS WRITE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">구조를 다루는 시점</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">쓰기 · 저장 · 읽기 순서의 비교</text>
<rect x="16" y="104" width="848" height="116" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="32" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">schema-on-read</text>
<text x="32" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">동적(런타임) 타입 체크와 유사</text>
<rect x="304" y="128" width="144" height="68" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="376" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">쓰기</text>
<text x="376" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">임의의 키·값 추가</text>
<rect x="504" y="128" width="144" height="68" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="576" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">저장</text>
<text x="576" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">암묵적 스키마</text>

<title id="dt">클라이언트까지 연장되는 쓰기 경로와 상태 동기화</title><desc id="dd">서버가 상태 변경을 능동 푸시하여 쓰기 경로를 최종 사용자 장치 UI까지 연장하는 상호작용 순서.</desc>
<rect width="880" height="768" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">13-03 · §4 EXTENDING THE WRITE PATH</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">클라이언트까지 연장되는 쓰기 경로와 상태 동기화</text>

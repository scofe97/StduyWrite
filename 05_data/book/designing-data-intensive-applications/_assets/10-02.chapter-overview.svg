<title id="dt">선형성의 비용과 CAP 정리 전체 지도</title><desc id="dd">네트워크 파티션 장애(§1)와 CAP 한계(§2), PACELC(§3), CPU 캐시(§4), 성능 하한(§5)의 체계를 정리한다.</desc>

<title id="dt">분산 actor 프레임워크와 location transparency</title><desc id="dd">액터는 로컬 상태와 한 번에 메시지 하나씩 처리하며, 분산 환경에서 같은 노드든 다른 노드든 같은 메시지 전달 메커니즘을 쓰고 다른 노드면 바이트로 인코딩해 보낸다.</desc>
<rect width="880" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">05-05 §3 · DISTRIBUTED ACTOR ARCHITECTURE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">분산 actor 프레임워크와 location transparency</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 노드 전달 vs 다른 노드 바이트 인코딩과 location transparency</text>
<rect x="24" y="96" width="384" height="292" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="36" y="102" width="160" height="20" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="116" y="116" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">NODE 1 · LOCAL HOST</text>
<rect x="36" y="132" width="164" height="112" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="118" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Actor A</text>
<rect x="44" y="168" width="148" height="28" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="118" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">로컬 상태 (공유 안 함)</text>
<rect x="44" y="202" width="148" height="30" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="118" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">한 번에 메시지 하나</text>
<rect x="232" y="132" width="164" height="112" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="314" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Actor B</text>
<rect x="240" y="168" width="148" height="28" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="314" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">로컬 상태 (공유 안 함)</text>
<rect x="240" y="202" width="148" height="30" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="314" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">한 번에 메시지 하나</text>
<path d="M 200 218 L 232 218" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="216" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">로컬</text>
<rect x="36" y="260" width="360" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="216" y="282" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">같은 노드: 바이트 인코딩 없이 전달</text>
<rect x="36" y="312" width="360" height="60" rx="4" fill="#161B22" stroke="#F08A59" stroke-width="1.0"/>
<text x="110" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">프레임워크</text>
<text x="110" y="356" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">send(Actor C, msg)</text>
<rect x="192" y="320" width="192" height="44" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="288" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">바이트 인코딩</text>
<text x="288" y="354" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">메시지를 바이트로</text>
<path d="M 118 244 L 118 312" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="472" y="96" width="384" height="292" rx="8" fill="#F08A5908" stroke="#F08A59" stroke-width="1.2"/>
<rect x="484" y="102" width="160" height="20" rx="4" fill="#161B22" stroke="#F08A59" stroke-width="0.8"/>
<text x="564" y="116" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F08A59">NODE 2 · REMOTE HOST</text>
<rect x="484" y="312" width="180" height="60" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.9"/>
<text x="574" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">바이트 디코딩</text>
<text x="574" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">바이트 스트림 → 메시지 객체</text>
<rect x="680" y="132" width="164" height="112" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<text x="762" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">Actor C</text>
<rect x="688" y="168" width="148" height="28" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="762" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">로컬 상태 (공유 안 함)</text>
<rect x="688" y="202" width="148" height="30" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="762" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">한 번에 메시지 하나</text>
<rect x="484" y="260" width="360" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="664" y="282" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">다른 노드: 디코딩한 뒤 수신 actor 에 전달</text>
<path d="M 500 312 L 500 218 L 680 218" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 384 342 L 484 342" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<text x="434" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">네트워크</text>
<rect x="24" y="404" width="832" height="48" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="148" y="432" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">location transparency</text>
<text x="510" y="432" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">같은 메시지 전달 방식 · 단일 프로세스에서도 메시지 손실을 가정해 RPC 보다 잘 맞음</text>
<line x1="12" y1="472" x2="832" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="494" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="484" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 노드 전달</text>
<rect x="248" y="484" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="270" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원격 전송 (location transparency)</text>
<rect x="669" y="484" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="691" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">actor 로컬 상태</text>
</svg>
<title id="dt">추적이 감시로 바뀌는 전이 메커니즘</title><desc id="dd">사용자 명시적 입력을 처리하는 서비스 관계가 부수효과 행동 추적과 광고 모델을 거쳐 감시로 전환되는 구조.</desc>
<rect width="880" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">14-02 · SECTION 1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">추적이 감시로 바뀌는 전이 메커니즘</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">명시적 입력과 사용자 중심 처리 · 비즈니스 모델 전환 · 광고주 중심 상세 프로필 구축과 감시 체계</text>
<rect x="24" y="100" width="832" height="104" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="46.0" y="110" width="100.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="96" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">사용자 = 고객</text>
<rect x="40" y="136" width="236" height="54" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="158" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">사용자 명시적 입력</text>
<text x="158" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사용자가 원하는 방식대로 저장·처리</text>
<rect x="322" y="136" width="236" height="54" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="440" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">기능 개선용 행동 추적</text>
<text x="440" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">검색 클릭 랭킹 · 추천 발견</text>
<rect x="604" y="136" width="236" height="54" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="722" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">이해관계 일치</text>
<text x="722" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">추적의 혜택이 사용자에게</text>
<path d="M 276 163 L 322 163" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<path d="M 558 163 L 604 163" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<rect x="160" y="220" width="560" height="40" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<text x="440" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">전환 계기: 무료 서비스 제공과 광고 기반 자금 조달 모델 도입</text>
<line x1="440" y1="204" x2="440" y2="220" stroke="#E3B341" stroke-width="1.2"/>
<path d="M 440 260 L 440 280" fill="none" stroke="#E3B341" stroke-width="1.2" marker-end="url(#warn)"/>
<rect x="24" y="280" width="832" height="108" rx="6" fill="#F08A5908" stroke="#F08A59" stroke-width="1.4"/>
<rect x="63.5" y="290" width="133.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="130" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">광고주 = 실제 고객</text>
<rect x="40" y="318" width="236" height="56" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="158" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">부수효과 행동 추적</text>
<text x="158" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">다른 일을 하는 동안 활동 기록</text>
<rect x="322" y="318" width="236" height="56" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="440" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">마케팅용 프로필 구축</text>
<text x="440" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">추적 데이터의 세밀화 및 장기 보관</text>
<rect x="604" y="318" width="236" height="56" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="722" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">자기 이해와 감시</text>
<text x="722" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사용자 이해는 뒷전 · 충돌 가능</text>
<path d="M 276 346 L 322 346" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)"/>
<path d="M 558 346 L 604 346" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)"/>
<line x1="12" y1="412" x2="832" y2="412" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="434" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="424" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사용자 중심 서비스</text>
<rect x="274" y="424" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="296" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">광고 모델 전환</text>
<rect x="422" y="424" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="444" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">광고 기반 감시 (focal)</text>
</svg>
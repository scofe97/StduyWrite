<title id="dt">Bloom 필터 키 확인 결정 흐름</title><desc id="dd">해시 함수로 비트 배열을 확인하여 0 비트 발견 시 키 부재를 즉시 확정하고 불필요한 디스크 I/O를 건너뛴다.</desc>
<rect width="880" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">04-02 · §3 BLOOM FILTER</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Bloom 필터 키 확인 결정 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">해시 계산(2·9·4번 비트) → 0 비트 여부 분기 → 부재 확정 또는 디스크 블록 검사</text>

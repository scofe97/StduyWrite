<title id="dt">전문 검색 역색인과 비트맵 AND 연산</title><desc id="dd">키워드 질의는 각 단어의 postings list를 찾아 sparse bitmap으로 표현한 뒤, bitwise AND 연산으로 두 단어가 모두 포함된 문서를 찾는다.</desc>

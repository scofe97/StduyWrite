<title id="dt">샤딩 개요와 키 범위 샤딩 전체 지도</title><desc id="dd">샤딩과 복제 결합(§1), 핫스팟과 스큐(§2), 키 범위 샤딩(§3), 핫스팟 우회(§4), 샤드 분할(§5)의 흐름을 조망한다.</desc>
<rect width="880" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">07-01 · CHAPTER OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">샤딩 개요와 키 범위 샤딩 전체 지도</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">단일 노드 용량 한계 극복 · 부하 쏠림 위험 · 백과사전식 키 범위 · 복합 키 접두어 분산 · 임계치 초과 동적 분할</text>
<rect x="28" y="104" width="824" height="36" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="440.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">샤딩의 목적: 각 레코드는 하나의 샤드에 속하고 데이터와 쓰기 처리를 여러 노드에 분산</text>
<rect x="34" y="156" width="152" height="244" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="44.18" y="168" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="58" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§1</text>

<title id="dt">그래프 데이터 모델과 쿼리 언어 지형</title><desc id="dd">속성 그래프와 트리플 스토어의 두 저장 모델, 그리고 Cypher·SQL CTE·SPARQL·Datalog·GraphQL 다섯 질의 방식의 관계</desc>
<rect width="880" height="504" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">03-05 · CHAPTER OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">그래프 데이터 모델과 쿼리 언어 지형</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">윗단은 저장 모델과 쿼리 언어 대응, 아랫단은 클라이언트 관점의 제한적 쿼리 모델입니다.</text>
<rect x="24" y="96" width="396" height="232" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">속성 그래프 계열</text>
<text x="396" y="122" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§1 · §2 · §3</text>
<rect x="40" y="138" width="364" height="48" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="56" y="160" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">§1 속성 그래프 저장 모델</text>
<text x="56" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">정점(id·label·속성) + 간선(꼬리·머리·label·속성)</text>
<rect x="40" y="196" width="364" height="48" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.4"/>
<text x="56" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">§2 Cypher — 선언형 그래프 쿼리</text>
<text x="56" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">화살표 표기 · 가변 길이 경로 (*0..)</text>
<rect x="40" y="254" width="364" height="48" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="56" y="276" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">§3 SQL 재귀 CTE — 관계형 조인</text>
<text x="56" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">WITH RECURSIVE · edges 조인 반복 (31줄)</text>
<rect x="460" y="96" width="396" height="232" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="476" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">트리플 스토어 및 규칙 계열</text>
<text x="832" y="122" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§4 · §5</text>
<rect x="476" y="138" width="364" height="48" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="492" y="160" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">§4 트리플 스토어 모델</text>
<text x="492" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">(주어, 술어, 목적어) 세 부분 문장 · RDF</text>
<rect x="476" y="196" width="364" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="492" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">§4 SPARQL — RDF 선언형 쿼리</text>
<text x="492" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">트리플 패턴 매칭 · Cypher 와 유사한 표현</text>
<rect x="476" y="254" width="364" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="492" y="276" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">§5 Datalog — 규칙 기반 재귀 쿼리</text>
<text x="492" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">기본 사실(fact) → 규칙 정의를 통한 뷰 파생</text>
<line x1="404" y1="162" x2="424" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="2 2"/>
<line x1="456" y1="162" x2="476" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="2 2"/>
<rect x="424" y="150" width="32" height="24" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="440" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">동등</text>
<rect x="24" y="344" width="832" height="80" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="368" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">§6 GraphQL — 클라이언트 UI 질의 계층</text>
<rect x="320" y="355" width="68" height="18" rx="3" fill="#161B22" stroke="#E3B341" stroke-width="0.8"/>
<text x="354" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">의도적 제약</text>
<text x="40" y="390" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">UI 렌더링에 필요한 필드만 담은 JSON 문서를 요청</text>
<text x="40" y="408" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">신뢰할 수 없는 클라이언트 보호 목적: 재귀 탐색 차단 · 임의 검색 불가</text>
<rect x="576" y="356" width="264" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="708" y="378" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">모바일 앱 · 웹 프론트엔드용</text>
<text x="708" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">백엔드 DB 유형(관계형·문서·그래프) 무관</text>
<line x1="12" y1="448" x2="832" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="470" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="460" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핵심 선언형 언어</text>
<rect x="261" y="460" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="283" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저장 모델</text>
<rect x="370" y="460" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="392" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재귀 비용·제약</text>
<rect x="518" y="460" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="540" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">다른 그래프 쿼리 언어</text>

<title id="dt">재처리를 통한 신구 파생 뷰 공존과 점진적 전환</title><desc id="dd">기존 데이터를 새 변환 코드로 재처리해 신구 파생 뷰를 함께 유지하는 점진적 전환</desc>
<rect width="880" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">13-02 · SECTION 2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">재처리를 통한 신구 파생 뷰 공존과 점진적 전환</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">히스토리 재처리 · 3선식 · 신구 뷰 공존 · 점진적 전환 · 모든 단계 되돌릴 수 있음</text>
<rect x="24" y="100" width="832" height="34" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="440.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">철도 3선식(dual gauge) = 두 규격 열차 공존 · 신구 스키마 파생 뷰를 동시에 유지해 점진 전환</text>
<rect x="24" y="146" width="186" height="280" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="34.0" y="156" width="36.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="52" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">원천</text>
<text x="76" y="170" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">원천 데이터</text>
<text x="38" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">누적된 히스토리</text>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">처리 패러다임 구분 · 단일 책임 파이프라인 · 집계 구조와 워킹셋 · 외장 정렬 스필 · 분산 운영체제 유추</text>

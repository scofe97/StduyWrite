<title id="dt">배치 처리 개요와 Unix 도구 전체 지도</title><desc id="dd">처리 방식의 세 갈래(§1)에서 출발해 Unix 파이프라인 원리(§2), 파이프라인과 프로그램 비교(§3), 정렬과 인메모리 집계(§4), 분산 운영체제 유추(§5)로 이어지는 흐름을 조망한다.</desc>

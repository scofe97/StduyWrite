<title id="dt">분산 환경에서 전순서가 깨지는 네 가지 구조적 요인</title><desc id="dd">단일 리더 전순서 로그가 샤딩·지리 분산·마이크로서비스·오프라인 클라이언트에서 깨지는 이유와, 전순서 결정이 합의와 같다는 점.</desc>
<rect width="880" height="498" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">13-01 · §4 THE LIMITS OF TOTAL ORDERING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">분산 환경에서 전순서가 깨지는 네 가지 구조적 요인</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">샤딩 로그 · 지리 분산 · 마이크로서비스 · 오프라인 클라이언트 · 합의 알고리즘 한계</text>

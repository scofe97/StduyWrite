<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 508" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">가장 단순한 데이터베이스의 쓰기와 읽기 흐름</title><desc id="dd">db_set은 파일 끝에 레코드를 순차 추가해 빠르고, db_get은 최신 값을 찾기 위해 파일 전체를 처음부터 순차 스캔한다.</desc>
<rect width="880" height="508" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">04-01 · APPEND-ONLY LOG</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">가장 단순한 데이터베이스의 쓰기와 읽기 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">파일 끝 추가 쓰기 · 전체 파일 스캔 읽기 O(n)</text>
<rect x="24" y="104" width="248" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="36" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">db_set 쓰기 요청</text>
<text x="36" y="144" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">db_set 42 '{...["Exploratorium"]}'</text>
<text x="36" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">키 42 신규 값 전달</text>
<path d="M 272 136 L 396 136" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="334" y="126" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">echo &gt;&gt; database</text>
<rect x="400" y="104" width="456" height="64" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.2"/>
<text x="412" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">파일 끝(EOF) 순차 추가</text>
<text x="412" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">기존 값을 덮어쓰지 않고 파일 끝에 즉시 기록</text>
<text x="412" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">파일 추가 · 일반적으로 효율적</text>
<rect x="24" y="188" width="832" height="144" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">append-only 데이터 파일 (database)</text>
<text x="320" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">줄 단위 키-값 쌍 텍스트 파일 · append-only 시퀀스</text>
<rect x="40" y="220" width="712" height="32" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="61.72" y="226" width="68.56" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="96" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">offset 0</text>
<text x="148" y="240" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">12,{"name":"London","attractions":["Big Ben",...]}</text>
<text x="740" y="240" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">키 12 등록</text>
<rect x="40" y="256" width="712" height="32" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="58.31" y="262" width="75.38" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="96" y="276" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">offset 60</text>
<text x="148" y="276" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">42,{"name":"San Francisco","attractions":["Golden Gate Bridge"]}</text>
<text x="740" y="276" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">키 42 옛 값</text>
<rect x="40" y="292" width="712" height="32" rx="6" fill="#F08A5920" stroke="#F08A59" stroke-width="1.4"/>
<rect x="54.9" y="298" width="82.2" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="96" y="312" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">offset 125</text>
<text x="148" y="312" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">42,{"name":"San Francisco","attractions":["Exploratorium"]}</text>
<text x="740" y="312" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">키 42 최신 버전</text>
<path d="M 788 168 L 788 308 L 756 308" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="776" y="184" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">신규 레코드 부착</text>
<rect x="24" y="352" width="216" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="36" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">db_get 조회 요청</text>
<text x="36" y="396" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">db_get 42</text>
<text x="36" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">키 42 최신값 검색</text>
<path d="M 240 390 L 280 390" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="284" y="352" width="280" height="76" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.2"/>
<text x="296" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">grep 전체 순차 스캔</text>
<text x="296" y="396" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">grep "^42," database</text>
<text x="296" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">파일 처음부터 끝까지 · O(n)</text>
<path d="M 564 390 L 640 390" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="602" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">결과 전달</text>
<rect x="644" y="352" width="212" height="76" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.2"/>
<text x="656" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">tail -n 1 최신값 추출</text>
<text x="656" y="396" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">tail -n 1</text>
<text x="656" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">마지막 등장 레코드 반환</text>
<line x1="12" y1="452" x2="832" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="474" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="464" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최신 레코드 (focal)</text>
<rect x="326" y="464" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="348" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">db_set 쓰기</text>
<rect x="487" y="464" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="509" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">db_get 스캔</text>
<rect x="648" y="464" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="670" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기존 레코드</text>
</svg>
<text x="440.0" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">무중단 업그레이드 막힘</text>
<text x="440.0" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">PostgreSQL · Oracle 물리 복제</text>
<rect x="592" y="158" width="264" height="330" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.4"/>
<text x="724.0" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">logical (row 기반) 로그</text>
<rect x="656.5" y="194" width="135.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="724.0" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">행 단위 변경 이벤트</text>
<line x1="604" y1="216" x2="844" y2="216" stroke="#F08A59" stroke-width="0.8"/>
<rect x="604" y="226" width="240" height="88" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="612" y="246" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">행 단위 변경 레코드</text>
<text x="612" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">삽입 = 모든 열의 새 값</text>
<text x="612" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">삭제 = 행 식별 정보</text>
<text x="612" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">갱신 = 식별 정보 + 바뀐 값</text>
<text x="724.0" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">저장 엔진 내부 구현과 분리</text>

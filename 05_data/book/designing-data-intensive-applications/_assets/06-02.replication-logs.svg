<rect x="361.5" y="194" width="157.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="440.0" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">디스크 블록 바이트 전송</text>
<line x1="320" y1="216" x2="560" y2="216" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="320" y="226" width="240" height="88" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="328" y="246" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">WAL 저수준 기록</text>
<text x="328" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">어느 디스크 블록의</text>
<text x="328" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">어느 바이트가 바뀌었나</text>
<text x="328" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">팔로워가 동일한 파일 생성</text>
<text x="440.0" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">저장 엔진 내부 구조와 강결합</text>

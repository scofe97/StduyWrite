<title id="dt">복제 로그 세 방식의 전송 데이터와 결합도 비교</title><desc id="dd">리더의 쓰기를 팔로워에 보내는 statement, WAL shipping, logical 세 방식의 로그 내용과 결합도 비교.</desc>
<rect width="880" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">06-02 §3 · REPLICATION LOG FORMATS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">복제 로그 세 방식의 전송 데이터와 결합도 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">SQL 문 전송 · 디스크 바이트 · 행 단위 변경과 결합도 분리</text>
<rect x="24" y="104" width="832" height="42" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<rect x="52.0" y="115" width="80.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="92" y="129" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">리더의 쓰기</text>
<text x="480" y="129" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">리더가 처리한 쓰기를 팔로워에 보내는 로그 형태 셋</text>
<rect x="24" y="158" width="264" height="330" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="156.0" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">statement 기반 복제</text>
<rect x="83.0" y="194" width="146.0" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="156.0" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">SQL 문 그대로 전송</text>
<line x1="36" y1="216" x2="276" y2="216" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="36" y="226" width="240" height="88" rx="6" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="44" y="246" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">INSERT · UPDATE · DELETE</text>
<text x="44" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">리더가 실행한 쓰기 문 그대로</text>
<text x="44" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">팔로워가 SQL 파싱·실행</text>
<text x="156.0" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">비결정 함수(NOW, RAND) 불일치</text>
<text x="156.0" y="374" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">autoincrement 순서 의존성</text>

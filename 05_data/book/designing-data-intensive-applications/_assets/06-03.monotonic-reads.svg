<title id="dt">monotonic reads 이상 타임라인</title><desc id="dd">복제 지연 차이가 있는 두 팔로워를 순차 조회할 때 관찰자 시점에서 데이터가 사라지는 시간 역행 현상</desc>
<rect width="880" height="518" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">06-03 · §3 MONOTONIC READS ANOMALY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">monotonic reads 이상 타임라인</text>

<title id="dt">듀얼 라이트 레이스 컨디션과 영구 불일치</title><desc id="dd">두 클라이언트의 쓰기가 데이터베이스와 검색 인덱스에 서로 다른 순서로 도착해 두 시스템이 영구적으로 불일치한다.</desc>

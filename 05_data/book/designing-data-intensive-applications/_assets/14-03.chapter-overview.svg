<title id="dt">데이터의 권력·산업혁명의 교훈·책 종합 전체 지도</title><desc id="dd">데이터의 노동·권력화와 독성 위험(§1), 산업혁명 공해 유비(§2), 데이터 최소화 규제(§3), 14장에서 1장으로의 책 전체 종합(§4)으로 이어지는 체계를 조망한다.</desc>
<rect width="880" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">14-03 · CHAPTER OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">데이터의 권력·산업혁명의 교훈·책 종합 전체 지도</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행동 데이터의 노동과 독성 위험 · 산업혁명 공해 유비 · 데이터 최소화 규제 · 14장에서 1장 책 전체 종합</text>
<rect x="28" y="104" width="824" height="36" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="440.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">데이터는 버려질 배기가스가 아니라 노동이자 권력이며, 동시에 독성 자산</text>
<rect x="28" y="156" width="194" height="252" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<rect x="42.18" y="164" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="56" y="178" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§1</text>
<text x="135.0" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">자산이자 권력</text>
<text x="125.0" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노동과 독성 자산</text>
<line x1="36" y1="208" x2="214" y2="208" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="34" y="220" width="182" height="50" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="125.0" y="241" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">데이터 배기가스 비판</text>
<text x="125.0" y="259" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사용자 활동은 서비스 노동</text>
<rect x="34" y="278" width="182" height="50" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="125.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">감시 능력의 가치화</text>
<text x="125.0" y="317" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터 브로커 매매와 평가</text>
<rect x="34" y="336" width="182" height="50" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="125.0" y="357" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">독성 자산 (새 우라늄)</text>
<text x="125.0" y="375" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">미래 정권 위험과 강제 제출</text>
<rect x="236" y="156" width="194" height="252" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.0"/>
<rect x="250.18" y="164" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="264" y="178" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">§2</text>
<text x="343.0" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">산업혁명의 교훈</text>
<text x="333.0" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공해 유비와 프라이버시</text>
<line x1="244" y1="208" x2="422" y2="208" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="242" y="220" width="182" height="50" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="333.0" y="241" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">산업혁명의 어두운 면</text>
<text x="333.0" y="259" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">매연 · 수질 오염 · 가혹 노동</text>
<rect x="242" y="278" width="182" height="50" rx="4" fill="#E3B34116" stroke="#E3B341" stroke-width="0.9"/>
<text x="333.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">정보화 시대의 공해</text>
<text x="333.0" y="317" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">데이터 = 공해, 곪으며 잔존</text>
<rect x="242" y="336" width="182" height="50" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="333.0" y="357" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">환경 보호와 프라이버시</text>
<text x="333.0" y="375" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사회적 규제로 길들인 장기 이득</text>
<rect x="444" y="156" width="194" height="252" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.0"/>
<rect x="458.18" y="164" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="472" y="178" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">§3</text>
<text x="551.0" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">입법과 자율 규제</text>
<text x="541.0" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터 최소화 vs 빅데이터</text>

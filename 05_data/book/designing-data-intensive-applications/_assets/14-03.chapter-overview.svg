<rect x="450" y="336" width="182" height="50" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="541.0" y="357" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">문화 전환과 자율 규제</text>
<text x="541.0" y="375" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">없는 데이터는 유출 불가</text>
<rect x="652" y="156" width="194" height="252" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<rect x="666.18" y="164" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="680" y="178" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">§4</text>
<text x="759.0" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">책 전체 종합</text>
<text x="749.0" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">14장에서 1장까지</text>
<line x1="660" y1="208" x2="838" y2="208" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="658" y="220" width="182" height="50" rx="4" fill="#F08A5910" stroke="#F08A59" stroke-width="0.9"/>

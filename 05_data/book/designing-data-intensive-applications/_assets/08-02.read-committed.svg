<title id="dt">Read Committed의 더티 읽기 방지 시퀀스</title><desc id="dd">트랜잭션 1의 쓰기는 커밋되기 전까지 트랜잭션 2에 보이지 않고 구 커밋 값 2를 반환한다.</desc>
<rect width="880" height="676" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">08-02 · §1 READ COMMITTED</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Read Committed의 더티 읽기 방지 시퀀스</text>

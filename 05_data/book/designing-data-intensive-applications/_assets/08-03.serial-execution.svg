<title id="dt">인터랙티브 트랜잭션과 저장 프로시저 직렬 실행 비교</title><desc id="dd">네트워크 왕복 대기 지연을 없애고 메모리 내 단일 스레드로 빠르게 완결하는 실행 방식</desc>
<rect width="880" height="524" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">08-03 · §2 SERIAL EXECUTION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인터랙티브 트랜잭션과 저장 프로시저 직렬 실행 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">다단계 네트워크 왕복 · 유휴 대기 · 저장 프로시저 한 번에 제출 · 메모리에서 완결</text>
<rect x="24" y="104" width="832" height="156" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="48.0" y="116" width="124.0" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="110" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">인터랙티브 트랜잭션</text>
<text x="840" y="126" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">다단계 왕복 지연 · 단일 스레드 직렬 처리 불가</text>
<rect x="40" y="148" width="180" height="94" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="130" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">애플리케이션</text>
<text x="130" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">1. SELECT 요청</text>
<text x="130" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">2. 조건 검사(2&gt;=2)</text>
<text x="130" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">3. UPDATE 요청</text>
<rect x="250" y="148" width="270" height="94" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.0"/>
<text x="385" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">네트워크 왕복(RTT) 반복</text>
<text x="385" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">질의 전송 ↔ 결과 수신 대기</text>
<text x="385" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">수신 중 DB 스레드 유휴 대기 발생</text>
<path d="M 220 195 L 250 195" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)"/>
<path d="M 520 195 L 550 195" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)"/>
<rect x="550" y="148" width="290" height="94" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="695" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">데이터베이스 서버</text>
<text x="695" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">단일 스레드 순차 처리 시 병목</text>
<text x="695" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">느린 트랜잭션 하나가 전체를 막음</text>
<rect x="24" y="276" width="832" height="168" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<rect x="31.5" y="288" width="157.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="110" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">저장 프로시저 직렬 실행</text>
<text x="840" y="298" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">한 번에 제출 · 메모리 데이터로 빠르게 실행 (VoltDB · Redis · Datomic)</text>
<rect x="40" y="320" width="200" height="104" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="140" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">애플리케이션</text>
<text x="140" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">전체 로직 한 번에 제출</text>
<text x="140" y="390" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">take_doctor_off_call_if_safe</text>
<text x="140" y="408" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">네트워크 1회 왕복</text>

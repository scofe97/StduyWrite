<title id="dt">검색 인덱스에서 쓰기 경로와 읽기 경로의 수렴</title><desc id="dd">원서 Figure 13-1: 문서 갱신(쓰기 경로)과 질의(읽기 경로)가 파생 데이터셋인 검색 인덱스에서 만난다.</desc>

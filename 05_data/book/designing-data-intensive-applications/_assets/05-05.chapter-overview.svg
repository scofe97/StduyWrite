<title id="dt">워크플로우·이벤트 기반과 5장 종합 지형</title><desc id="dd">서비스 기반 워크플로우의 durable execution, 메시지 브로커의 비동기 버퍼링, 분산 액터 모델을 통한 데이터플로우와 5장 전체의 인코딩·호환성 종합을 보여준다.</desc>

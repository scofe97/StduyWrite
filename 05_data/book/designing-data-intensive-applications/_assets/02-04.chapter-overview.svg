<title id="dt">확장성과 세 가지 아키텍처 전체 지도</title><desc id="dd">부하를 기술하는 차원(§1), 수직·수평 확장 아키텍처 비교(§2), 확장성 원칙과 단순성(§3)을 조망한다.</desc>

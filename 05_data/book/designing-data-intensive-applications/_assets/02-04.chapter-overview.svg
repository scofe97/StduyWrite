<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">부하 차원 정량화 · shared-nothing 선형 확장 잠재력 · 분해와 불필요한 복잡성 회피</text>

<title id="dt">불신뢰 시계와 분산 시스템 시간 문제 전체 지도</title><desc id="dd">두 시계의 특성(§1)에서 출발해 NTP 동기화 한계(§2), 타임스탬프 순서 역전(§3), 신뢰 구간 대기(§4), 프로세스 일시 중단(§5)의 체계를 조망한다.</desc>
<rect width="880" height="638" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">09-02 · CHAPTER OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">불신뢰 시계와 분산 시스템 시간 문제 전체 지도</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">단조 vs 벽시계 · NTP 드리프트와 지연 · LWW 순서 역전 · TrueTime 신뢰 구간 · 프로세스 일시 중단</text>

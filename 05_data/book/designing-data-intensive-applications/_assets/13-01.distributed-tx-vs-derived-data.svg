<title id="dt">분산 트랜잭션과 로그 기반 파생 데이터 비교</title><desc id="dd">분산 트랜잭션의 원자적 커밋 방식과 로그 기반 파생 데이터의 비동기 동기화 방식을 다섯 가지 특성으로 견준다.</desc>
<rect width="880" height="526" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">13-01 · §3 DERIVED DATA VS DISTRIBUTED TRANSACTIONS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">분산 트랜잭션과 로그 기반 파생 데이터 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">일관성 달성 방식 · 읽기 최신성 · 이종 시스템 통합 · 장애 격리 · 운영 복잡도</text>

<title id="dt">비신뢰 네트워크의 6가지 요청·응답 장애 갈래</title><desc id="dd">비동기 패킷망에서 요청과 응답이 유실·지연되는 경로와 송신자의 구분 불가 한계.</desc>
<rect width="880" height="732" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">09-01 · §2 UNRELIABLE NETWORKS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">비신뢰 네트워크의 6가지 요청·응답 장애 갈래</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">요청 유실 · 큐 대기 · 노드 크래시 · GC 일시 중단 · 응답 유실 · 지연 도착</text>

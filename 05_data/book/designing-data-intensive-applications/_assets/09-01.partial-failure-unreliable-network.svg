<text x="722.0" y="401" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">(3) 노드 크래시 · (4) GC 일시 중단</text>

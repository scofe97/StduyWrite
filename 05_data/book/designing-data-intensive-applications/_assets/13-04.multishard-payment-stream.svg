<title id="dt">이벤트 로그와 스트림 처리기로 하는 계좌 이체 (Figure 13-2)</title><desc id="dd">원천 계좌 로그에 최초 요청을 단일 원자적 메시지로 기록하고, 스트림 처리기가 로컬 상태 확인 후 대상·수수료 계좌로 이벤트를 발행하는 무결성 아키텍처를 보인다.</desc>
<rect width="920" height="628" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">13-04 · §3 MULTISHARD STREAM PROCESSING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이벤트 로그와 스트림 처리기로 하는 계좌 이체 (Figure 13-2)</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Figure 13-2 · 최초 요청 기록의 원자성 · 로컬 상태 잔액 예약 · 출금 이벤트는 자기 입력 로그로 · 요청 ID 중복 제거</text>
<rect x="28" y="104" width="864" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="460.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">원자성 = 원천 계좌 로그에 최초 요청 이벤트 기록 (트랜잭션 아님)</text>
<rect x="40" y="156" width="130" height="42" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>

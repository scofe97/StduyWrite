<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">데이터 접근 패턴 → 조건 분기 → 권장 데이터 모델</text>

<title id="dt">문서 모델과 관계형 모델 선택 결정 트리</title><desc id="dd">데이터가 1:N 트리인지, 중첩 항목 ID 참조가 필요한지, 항목 순서 재정렬이 있는지에 따라 모델을 결정한다.</desc>
<rect width="880" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">03-04 · MODEL SELECTION</text>

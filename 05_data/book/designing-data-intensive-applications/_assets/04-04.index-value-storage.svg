<title id="dt">인덱스에 값을 두는 세 가지 방식</title><desc id="dd">실제 행 전체를 인덱스 리프에 저장하는 clustered, 힙 파일의 위치 참조만 두는 heap 방식, 일부 컬럼을 포함하는 covering 인덱스의 저장 구조 비교.</desc>
<rect width="880" height="492" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">04-04 · INDEX VALUE STORAGE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인덱스에 값을 두는 세 가지 방식</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">clustered(행 직접 저장) · heap file(위치 참조) · covering(일부 컬럼 포함)</text>
<rect x="24" y="96" width="264" height="308" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<rect x="82.04" y="108" width="147.92" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="156.0" y="122" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">1. clustered index</text>
<text x="156.0" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">MySQL InnoDB 테이블 기본키</text>
<line x1="38" y1="154" x2="274" y2="154" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="38" y="166" width="236" height="86" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.0"/>
<text x="156.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">인덱스 리프 노드 (B-tree)</text>
<text x="50" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Key:</text>
<text x="92" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">기본키</text>
<text x="50" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Data:</text>
<text x="92" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">행 전체 (모든 컬럼)</text>
<path d="M 56 258 L 56 284" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="70" y="275" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">행·문서·정점을 직접 저장</text>

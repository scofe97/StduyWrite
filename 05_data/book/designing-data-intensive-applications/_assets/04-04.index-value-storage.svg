<text x="436.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">2. heap file 참조</text>
<text x="436.0" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Postgres 가 쓰는 방식</text>
<line x1="318" y1="154" x2="554" y2="154" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="318" y="166" width="236" height="70" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.0"/>

<rect x="598" y="166" width="236" height="86" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="1.0"/>
<text x="716.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">인덱스 리프 (included columns)</text>
<text x="610" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Key:</text>

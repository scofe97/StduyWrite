<title id="dt">ACID와 트랜잭션 개요 전체 지도</title><desc id="dd">트랜잭션이 막는 문제(§1)와 ACID 네 보장(§2~§4), 단일·다중 객체 범위(§5), abort 재시도 함정(§6)의 체계.</desc>

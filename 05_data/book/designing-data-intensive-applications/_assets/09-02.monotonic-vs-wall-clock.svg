<rect x="180" y="444" width="330" height="46" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="200" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">강제 리셋 (뒤로 점프)</text>
<text x="200" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">서버보다 앞서면 뒤로 이동</text>
<rect x="526" y="444" width="330" height="46" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="546" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">슬루잉 (slewing) 가감</text>
<text x="546" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">진행 주파수 미세 가감만 허용</text>

<title id="dt">단조 시계와 벽시계의 특성 및 용도 비교</title><desc id="dd">달력 시각 표현을 위한 벽시계와 경과 시간 측정을 위한 단조 시계의 기준점, 단조성, 주요 용도, 표준 API 비교.</desc>
<rect width="880" height="578" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">09-02 · §1 TWO TYPES OF CLOCKS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">단조 시계와 벽시계의 특성 및 용도 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">단조 시계 vs 벽시계 · 경과 시간 측정 · 불연속 점프 · 단조성 보장 · 로컬 측정 전용</text>
<rect x="180" y="104" width="330" height="54" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="345.0" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">벽시계 (Time-of-Day)</text>
<text x="345.0" y="146" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">CLOCK_REALTIME · currentTimeMillis</text>
<rect x="526" y="104" width="330" height="54" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<text x="691.0" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">단조 시계 (Monotonic)</text>
<text x="691.0" y="146" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">CLOCK_MONOTONIC · nanoTime</text>
<rect x="24" y="174" width="140" height="46" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="94.0" y="201" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">기준 시각과 의미</text>
<rect x="180" y="174" width="330" height="46" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="200" y="194" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">1970-01-01 UTC 기점 에포크 시각</text>
<text x="200" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">달력 시각 표현</text>
<rect x="526" y="174" width="330" height="46" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="546" y="194" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">임의 시작점(부팅 후) 나노초</text>
<text x="546" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">절댓값 자체는 무의미</text>

<text x="94.0" y="255" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">시간 진행과 단조성</text>
<rect x="180" y="228" width="330" height="46" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="200" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">강제 뒤로 점프 가능</text>
<text x="200" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">NTP 동기화·윤초·DST 영향</text>
<rect x="526" y="228" width="330" height="46" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="546" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">항상 앞으로만 단조 증가</text>
<text x="546" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">뒤로 되돌려지지 않음</text>
<rect x="24" y="282" width="140" height="46" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="94.0" y="309" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">주요 적합 용도</text>
<rect x="180" y="282" width="330" height="46" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="200" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">달력 시각 표현</text>
<text x="200" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">직관적인 현재 시각</text>

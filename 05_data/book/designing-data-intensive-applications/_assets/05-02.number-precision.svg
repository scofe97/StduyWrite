<title id="dt">2^53 초과 정수의 JSON 파싱 정밀도 손실과 문자열 우회</title><desc id="dd">2^53 보다 큰 정수를 JavaScript 가 배정밀도 부동소수로 파싱하면 부정확해지고, X 가 post ID 를 숫자와 십진 문자열로 두 번 담아 이를 우회하는 경로를 보인다.</desc>
<rect width="880" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">05-02 · §1 NUMBER PRECISION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">2^53 초과 정수의 JSON 파싱 정밀도 손실과 문자열 우회</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원본 64비트 정수 → JSON API 직렬화 → JavaScript 부동소수 파싱 분기</text>

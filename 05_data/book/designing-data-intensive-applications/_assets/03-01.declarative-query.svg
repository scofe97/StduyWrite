<title id="dt">명령형 루프 대 선언형 쿼리 파이프라인</title><desc id="dd">선언형은 결과 조건만 명시하고 옵티마이저가 인덱스와 조인 순서를 결정해, 쿼리 수정 없이 병렬 실행과 최적화를 얻는다.</desc>
<rect width="880" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">03-01 · DECLARATIVE QUERY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">명령형 루프 대 선언형 쿼리 파이프라인</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">명령형 알고리즘 고정 · 선언형 쿼리 옵티마이저 · 자동 병렬 실행</text>
<rect x="24" y="96" width="192" height="24" rx="4" fill="#E3B34118" stroke="#E3B341" stroke-width="1.0"/>
<text x="120" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">명령형 · Python / Java</text>

<title id="dt">정규화·비정규화 축과 네 절의 설계 선택</title><desc id="dd">정규화(단일 저장·일관성)와 비정규화(복제·읽기 최적화)의 맞바꿈 축 위에 네 절의 핵심 대상과 기법을 배치한다. §2의 맞바꿈이 중심 기준이다.</desc>

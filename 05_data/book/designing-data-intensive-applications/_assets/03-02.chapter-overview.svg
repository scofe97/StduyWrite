<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽은 단일 저장과 일관성, 오른쪽은 복제와 읽기 성능, 네 절은 이 축 위에서 최적점을 찾습니다.</text>

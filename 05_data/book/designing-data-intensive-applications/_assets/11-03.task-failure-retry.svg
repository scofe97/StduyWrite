<title id="dt">태스크 실패 격리와 독립 재실행 흐름</title><desc id="dd">하드웨어 결함이나 Spot 인스턴스 선점으로 태스크가 실패하면 부분 출력을 삭제한 뒤 해당 태스크만 DFS 입력에서 단독 재실행하며, 이미 성공한 다른 태스크는 영향을 받지 않는다.</desc>
<rect width="880" height="462" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">11-03 · §4 MAPREDUCE FAULT TOLERANCE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">태스크 실패 격리와 독립 재실행 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">DFS 입력 불변성 · 무상태 매퍼 멱등 재실행 · 부분 출력 삭제 · 다른 태스크 영향 없는 단독 재시작</text>

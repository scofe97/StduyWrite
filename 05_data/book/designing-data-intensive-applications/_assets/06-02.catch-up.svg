<title id="dt">팔로워 장애와 로컬 로그 기반 catch-up 복구 시퀀스</title><desc id="dd">팔로워가 크래시 후 재기동 시 로컬 로그의 마지막 트랜잭션을 확인하고 리더에 끊긴 동안의 변경을 요청해 적용하고 따라잡는 과정.</desc>

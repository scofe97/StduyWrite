<title id="dt">람다 아키텍처와 카파 아키텍처의 구조 비교</title><desc id="dd">배치·스트림 병렬 운영(람다)과 단일 스트림 엔진 통합(카파)의 구조 비교</desc>
<rect width="880" height="558" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">13-02 · SECTION 3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">람다 아키텍처와 카파 아키텍처의 구조 비교</text>

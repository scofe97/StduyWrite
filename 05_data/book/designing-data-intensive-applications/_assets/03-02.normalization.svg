<title id="dt">비정규화와 정규화의 로고 URL</title><desc id="dd">비정규화는 로고 URL 을 프로필마다 복제하고, 정규화는 조직 엔티티에 한 번 저장한 뒤 프로필이 ID 로 참조한다.</desc>
<rect width="880" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">03-02 · NORMALIZATION</text>

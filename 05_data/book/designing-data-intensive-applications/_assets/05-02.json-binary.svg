<title id="dt">텍스트 JSON과 MessagePack 이진 인코딩 비교</title><desc id="dd">스키마를 규정하지 않는 JSON 이진 변형은 객체 필드명을 데이터에 모두 포함해야 하므로 텍스트 대비 절감량이 제한적이다.</desc>
<rect width="880" height="532" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">05-02 · §3 JSON BINARY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">텍스트 JSON과 MessagePack 이진 인코딩 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">동일 레코드 텍스트(81B) 대 MessagePack(66B) · 필드명 점유 바이트 분석</text>
<rect x="24" y="104" width="832" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="33.5" y="114" width="69.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="68" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">크기 비교</text>
<text x="112" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">동일 레코드 인코딩 바이트 수</text>
<text x="840" y="128" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#5E6B7E">공백 제거 텍스트 대비 15바이트(18.5%) 절감</text>
<line x1="36" y1="140" x2="844" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="44" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">텍스트 JSON</text>
<rect x="174" y="146" width="540" height="18" rx="3" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="726" y="159" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">81 byte</text>
<text x="44" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">MessagePack</text>
<rect x="174" y="172" width="440" height="18" rx="3" fill="#F08A5928" stroke="#F08A59" stroke-width="1.2"/>
<text x="626" y="185" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F08A59">66 byte (필드명 포함 필수)</text>
<rect x="24" y="218" width="832" height="142" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="36.0" y="228" width="80.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="76" y="242" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">바이트 구조</text>
<text x="128" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">MessagePack 인코딩 바이트 스트림 분해</text>
<text x="840" y="242" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#5E6B7E">원서 Figure 5-2 · 앞 수는 타입·길이 바이트</text>
<line x1="36" y1="254" x2="844" y2="254" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="36" y="264" width="116" height="82" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="76.0" y="270" width="36.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="94.0" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">헤더</text>
<text x="94.0" y="306" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">0x83</text>
<text x="94.0" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">3개 필드 객체 (1B)</text>
<rect x="160" y="264" width="218" height="82" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="166" y="272" width="206" height="32" rx="4" fill="#F08A5918" stroke="#F08A59" stroke-width="1.0"/>
<text x="174" y="292" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#F08A59">0xa8 + userName</text>
<text x="364" y="292" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">1+8B</text>
<rect x="166" y="308" width="206" height="32" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="174" y="328" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#3FB98C">0xa6 + "Martin"</text>
<text x="364" y="328" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">문자열 1+6B</text>
<rect x="386" y="264" width="238" height="82" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="392" y="272" width="226" height="32" rx="4" fill="#F08A5918" stroke="#F08A59" stroke-width="1.0"/>
<text x="400" y="292" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#F08A59">0xae + favoriteNumber</text>
<text x="610" y="292" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">1+14B</text>
<rect x="392" y="308" width="226" height="32" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="400" y="328" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#3FB98C">0xcd 0x05 0x39 (1337)</text>
<text x="610" y="328" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">정수 1+2B</text>
<rect x="632" y="264" width="212" height="82" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="638" y="272" width="200" height="32" rx="4" fill="#F08A5918" stroke="#F08A59" stroke-width="1.0"/>
<text x="646" y="292" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#F08A59">0xa9 + interests</text>
<text x="830" y="292" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">1+9B</text>
<rect x="638" y="308" width="200" height="32" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="646" y="328" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#3FB98C">0x92 + 2개 문자열</text>
<text x="830" y="328" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">배열 3+18B</text>
<rect x="24" y="374" width="832" height="88" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="41.5" y="384" width="69.0" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="76" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">비중 분석</text>
<text x="128" y="398" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">MessagePack 66바이트 점유 구성</text>
<text x="840" y="398" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F08A59">스키마가 없어 66B 중 31B 가 필드명</text>
<line x1="36" y1="410" x2="844" y2="410" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="44" y="420" width="372" height="26" rx="3" fill="#F08A5928" stroke="#F08A59" stroke-width="1.2"/>
<text x="230.0" y="437" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F5F5F3">필드명 문자열 31B (47.0%)</text>
<rect x="416" y="420" width="108" height="26" rx="3" fill="#6A95D820" stroke="#6A95D8" stroke-width="1.0"/>
<text x="470.0" y="437" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">타입·길이 9B</text>
<rect x="524" y="420" width="312" height="26" rx="3" fill="#3FB98C20" stroke="#3FB98C" stroke-width="1.0"/>
<text x="680.0" y="437" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F5F5F3">실제 값 데이터 26B (39.4%)</text>
<line x1="12" y1="476" x2="832" y2="476" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="498" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="488" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">필드명 — 스키마 부재로 포함 필수</text>
<rect x="391" y="488" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="413" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실제 값 데이터</text>
<rect x="539" y="488" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="561" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">타입·길이 프리픽스 바이트</text>
</svg>
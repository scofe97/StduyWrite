<title id="dt">CDC 기반 단일 진실 공급원과 파생 데이터플로우</title><desc id="dd">단일 데이터베이스가 쓰기 전순서를 결정하고 CDC 이벤트 로그를 통해 검색 인덱스·DW·캐시로 일관되게 전파된다.</desc>

<title id="dt">인증 기반 복제의 트랜잭션 수명주기와 결정적 검증</title><desc id="dd">클라이언트 트랜잭션 실행부터 쓰기 집합 브로드캐스트, 노드별 독립 인증 및 커밋·롤백 분기 흐름</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">GALERA REPLICATION · CERTIFICATION FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인증 기반 복제의 트랜잭션 수명주기와 결정적 검증</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원격 잠금 없는 로컬 낙관 실행과 커밋 시점의 결정적 인증 테스트 구조</text>
<rect x="36" y="104" width="160" height="172" rx="8" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="116" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#6A95D8">STEP 1</text>
<text x="116" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">로컬 낙관 실행</text>
<text x="116" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">원격 락 배제</text>
<line x1="48" y1="184" x2="184" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="116" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SQL 문 실행</text>
<text x="116" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">로컬 스냅샷 읽기</text>
<text x="116" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원격 잠금 없음</text>
<path d="M 200 190 L 220 190" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="224" y="104" width="160" height="172" rx="8" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="304" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#6A95D8">STEP 2</text>
<text x="304" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">쓰기 집합 생성</text>
<text x="304" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">커밋 시점 수집</text>
<line x1="236" y1="184" x2="372" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="304" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">COMMIT 호출</text>
<text x="304" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">변경 내용·기본 키 수집</text>
<text x="304" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Write-Set 패키징</text>
<path d="M 388 190 L 408 190" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="412" y="104" width="160" height="172" rx="8" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="492" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#6A95D8">STEP 3</text>
<text x="492" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">전역 브로드캐스트</text>
<text x="492" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">GComm 총 순서</text>
<line x1="424" y1="184" x2="560" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="492" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전체 노드 동시 전송</text>
<text x="492" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전역 순번 seqno 부여</text>
<text x="492" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">동일 수신 순서</text>
<path d="M 576 190 L 596 190" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="600" y="104" width="160" height="172" rx="8" fill="#F08A5918" stroke="#F08A59" stroke-width="1.6"/>
<text x="680" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F08A59">STEP 4</text>
<text x="680" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">결정적 인증 검사</text>
<text x="680" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">투표 없는 독립 판정</text>
<line x1="612" y1="184" x2="748" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="680" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">seqno 구간 대조</text>
<text x="680" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기본 키 중복 검사</text>
<text x="680" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노드별 자체 검증</text>
<path d="M 764 190 L 784 190" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="788" y="104" width="160" height="172" rx="8" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="868" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#3FB98C">STEP 5</text>
<text x="868" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">커밋 또는 롤백</text>
<text x="868" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">최종 트랜잭션 확정</text>
<line x1="800" y1="184" x2="936" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="868" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">충돌 없음: 즉시 커밋</text>
<text x="868" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">충돌 감지: 강제 롤백</text>
<text x="868" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Error 1213 반환</text>
<rect x="36" y="296" width="888" height="104" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="52" y="310" width="416" height="76" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="72" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">인증 성공 경로 (동시성 충돌 없음)</text>
<text x="72" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">모든 노드에서 쓰기 집합 적용 대기열 등록 후 커밋</text>
<text x="72" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">추가 네트워크 합의 라운드트립 없이 클라이언트에 성공 반환</text>
<rect x="492" y="310" width="416" height="76" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="512" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">인증 실패 경로 (동일 기본 키 충돌)</text>
<text x="512" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">늦게 인증된 쓰기 집합 즉시 폐기 및 로컬 트랜잭션 강제 롤백</text>
<text x="512" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">클라이언트에 ERROR 1213 교착 상태 예외 반환</text>
<line x1="12" y1="424" x2="912" y2="424" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="446" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="436" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 처리 단계</text>
<rect x="248" y="436" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="270" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핵심 인증 판정</text>
<rect x="396" y="436" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="418" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">커밋 완료</text>
<rect x="505" y="436" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="527" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">인증 충돌 롤백</text>
</svg>
<title id="dt">중간 네트워크 장비의 유휴 연결 추적과 무통보 드롭</title><desc id="dd">상태 저장형 장비의 유휴 만료에 따른 세션 엔트리 침묵 삭제와 고스트 커넥션 발생 흐름</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONNECTION POOL · NETWORK TIMEOUT SEQUENCE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">중간 네트워크 장비의 유휴 연결 추적과 무통보 드롭</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">양 끝 통보 없는 추적 항목 삭제로 생기는 고스트 커넥션과 쿼리 전송 시점의 단절</text>

site_name: StduyWrite
site_url: https://scofe97.github.io/StduyWrite/
docs_dir: write

theme:
  name: material
  language: ko
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: 다크 모드로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: ko

# 문서 간 상대링크(.md·파일명 불일치)가 많아 경고가 다수 발생 → 원본을 고치지
# 않는 방침이므로 경고 수준만 낮춘다(빌드는 계속 진행).
validation:
  links:
    not_found: ignore
  nav:
    omitted_files: ignore

# 사이트에서 뺄 것: 관리용 _폴더 + 학습노트에 섞인 실습 코드·빌드 산출물.
# 문서에 삽입된 이미지(png·svg·gif)는 남긴다.
exclude_docs: |
  _*/
  *.java
  *.kt
  *.kts
  *.class
  *.jar
  *.bin
  *.sh
  *.yaml
  *.yml
  *.xml
  *.properties
  *.prefs
  *.project
  *.classpath
  *.factorypath
  *.iml
  *.gradle
  *.DS_Store

# nav 는 의도적으로 생략: docs_dir(write/) 폴더 구조에서 자동 생성

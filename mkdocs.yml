site_name: StduyWrite
site_url: https://scofe97.github.io/StduyWrite/
docs_dir: write

theme:
  name: material
  language: ko
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: 다크 모드로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: ko

# 문서 간 상대링크(.md·파일명 불일치)가 많아 경고가 다수 발생 → 원본을 고치지
# 않는 방침이므로 경고 수준만 낮춘다(빌드는 계속 진행).
validation:
  links:
    not_found: ignore
  nav:
    omitted_files: ignore

# 사이트에서 뺄 것: 관리용 _폴더 + 학습노트에 섞인 실습 코드·빌드 산출물.
# 문서에 삽입된 이미지(png·svg·gif)는 남긴다.
#
# 순서가 의미를 갖는다 — gitignore 문법이라 나중에 매치된 줄이 이긴다.
# `_*/` 하나만 두면 도식이 사는 `_assets/` 까지 통째로 사라져 본문의 이미지가 전부 404 가 된다.
# 그래서 `_assets/` 를 되살리되, 되살림이 다른 `_` 폴더 *안쪽* 까지 번지지 않게
# 관리용 폴더를 이름으로 다시 뺀다. `_company/_assets/` 같은 자리가 딸려 나오기 때문이다.
# `_*/` 는 여기 없는 새 `_` 폴더를 위한 기본 차단으로 남겨 둔다.
exclude_docs: |
  _*/
  !_assets/
  _archive/
  _books/
  _company/
  _containers/
  _gen/
  _meta/
  _policies/
  _practice/
  _raw/
  _review/
  _src/
  _study/
  _template/
  *.py
  *.tape
  *.java
  *.kt
  *.kts
  *.class
  *.jar
  *.bin
  *.sh
  *.yaml
  *.yml
  *.xml
  *.properties
  *.prefs
  *.project
  *.classpath
  *.factorypath
  *.iml
  *.gradle
  *.DS_Store

# nav 는 의도적으로 생략: docs_dir(write/) 폴더 구조에서 자동 생성

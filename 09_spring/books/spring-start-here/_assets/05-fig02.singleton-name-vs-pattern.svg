<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="Spring singleton과 디자인 패턴 싱글턴 비교 도식">
  <title>Spring singleton은 이름당 유일 — 디자인 패턴 싱글턴(앱당 유일)과 다릅니다</title>
  <desc>디자인 패턴 싱글턴은 앱 메모리에 한 타입당 인스턴스 하나만 둔다. Spring의 singleton 스코프는 이름(bean ID)당 하나라, 같은 타입이라도 이름이 다르면 여러 인스턴스를 가질 수 있다. 예를 들어 commentService1과 commentService2는 같은 CommentService 타입이지만 서로 다른 singleton 인스턴스다</desc>
  <rect x="0" y="0" width="760" height="340" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">"이름당 유일"이지 "앱당 유일"이 아닙니다</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">디자인 패턴 싱글턴과 이름이 같아 헷갈리지만, 유일성의 단위가 다릅니다</text>

  <!-- 좌: 디자인 패턴 싱글턴 -->
  <text x="40" y="92" fill="#f44336" font-size="13" font-weight="bold">디자인 패턴 싱글턴</text>
  <text x="40" y="110" fill="rgb(138,133,128)" font-size="11">= 타입당(앱당) 인스턴스 1개</text>
  <rect x="40" y="126" width="300" height="150" rx="10" fill="rgba(244,67,54,0.08)" stroke="#f44336" stroke-width="1.5"/>
  <text x="60" y="150" fill="#e8e4df" font-size="11">App's memory</text>
  <rect x="110" y="176" width="160" height="60" rx="8" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="190" y="205" fill="#0d0d0d" font-size="12" font-weight="bold" text-anchor="middle">CommentService</text>
  <text x="190" y="223" fill="#0d0d0d" font-size="10" text-anchor="middle">단 하나</text>
  <text x="60" y="264" fill="rgb(138,133,128)" font-size="10">클래스가 스스로 인스턴스 1개만 보장</text>

  <!-- 우: Spring singleton -->
  <text x="420" y="92" fill="#66bb6a" font-size="13" font-weight="bold">Spring singleton 스코프</text>
  <text x="420" y="110" fill="rgb(138,133,128)" font-size="11">= 이름(bean ID)당 인스턴스 1개</text>
  <rect x="420" y="126" width="300" height="150" rx="10" fill="rgba(212,168,83,0.10)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="440" y="150" fill="rgb(212,168,83)" font-size="11" font-weight="bold">Spring Context</text>
  <rect x="440" y="166" width="260" height="44" rx="6" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="570" y="193" fill="#0d0d0d" font-size="12" font-weight="bold" text-anchor="middle">commentService1</text>
  <rect x="440" y="218" width="260" height="44" rx="6" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="570" y="245" fill="#0d0d0d" font-size="12" font-weight="bold" text-anchor="middle">commentService2</text>

  <text x="24" y="304" fill="#e8e4df" font-size="12" font-weight="bold">→ 같은 CommentService 타입이라도 이름이 다르면 별개 singleton 둘</text>
  <text x="24" y="324" fill="rgb(138,133,128)" font-size="11">같은 이름으로 꺼내면 늘 같은 인스턴스 · 이름이 다르면 인스턴스도 다름</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="Spring MVC 아키텍처 컴포넌트와 요청 처리 흐름 도식">
  <title>Spring MVC 컴포넌트 — 우리가 구현하는 건 Controller 하나뿐입니다</title>
  <desc>Spring MVC 아키텍처의 컴포넌트 배치와 HTTP 요청 처리 흐름을 번호 1~7로 나타낸다. 클라이언트 요청이 Tomcat을 거쳐 DispatcherServlet에 들어오고, DispatcherServlet이 HandlerMapping으로 호출할 컨트롤러 액션을 찾은 뒤 Controller를 호출하고, 컨트롤러가 반환한 뷰 이름을 ViewResolver로 렌더링해 응답한다. 다섯 컴포넌트 중 Controller만 개발자가 직접 구현하며(초록으로 강조), 나머지는 Spring Boot가 자동 구성한다</desc>
  <rect x="0" y="0" width="760" height="400" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">Spring MVC 컴포넌트 — Controller만 우리가 구현합니다</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">나머지 넷은 Spring Boot가 자동 구성 · 초록 박스가 유일하게 직접 짜는 컴포넌트입니다</text>

  <!-- 클라이언트 -->
  <rect x="30" y="150" width="90" height="70" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="75" y="182" fill="#e8e4df" font-size="12" text-anchor="middle">클라이언트</text>
  <text x="75" y="200" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">브라우저</text>

  <!-- Tomcat 세로 바 -->
  <rect x="150" y="90" width="46" height="240" rx="4" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="173" y="215" fill="rgb(138,133,128)" font-size="11" text-anchor="middle" transform="rotate(-90 173 215)">Tomcat</text>

  <!-- Spring app 경계 -->
  <rect x="220" y="80" width="510" height="260" rx="8" fill="none" stroke="rgb(60,55,50)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="232" y="100" fill="rgb(138,133,128)" font-size="11">Spring app</text>

  <!-- DispatcherServlet -->
  <rect x="240" y="170" width="140" height="60" rx="6" fill="rgba(212,168,83,0.12)" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <text x="310" y="197" fill="rgb(212,168,83)" font-size="12" font-weight="bold" text-anchor="middle">DispatcherServlet</text>
  <text x="310" y="215" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">front controller</text>

  <!-- HandlerMapping -->
  <rect x="470" y="110" width="150" height="52" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="545" y="141" fill="#e8e4df" font-size="12" text-anchor="middle">HandlerMapping</text>

  <!-- Controller (강조) -->
  <rect x="470" y="184" width="150" height="52" rx="6" fill="rgb(102,187,106)" stroke="#66bb6a" stroke-width="2"/>
  <text x="545" y="209" fill="#0d0d0d" font-size="12" font-weight="bold" text-anchor="middle">Controller</text>
  <text x="545" y="226" fill="#0d0d0d" font-size="9" text-anchor="middle">직접 구현</text>

  <!-- ViewResolver -->
  <rect x="470" y="258" width="150" height="52" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="545" y="289" fill="#e8e4df" font-size="12" text-anchor="middle">ViewResolver</text>

  <!-- 화살표 흐름 -->
  <!-- 1 client→tomcat -->
  <line x1="120" y1="178" x2="150" y2="178" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#a7)"/>
  <circle cx="135" cy="164" r="9" fill="rgb(212,168,83)"/><text x="135" y="168" fill="#0d0d0d" font-size="11" font-weight="bold" text-anchor="middle">1</text>
  <!-- 2 tomcat→dispatcher -->
  <line x1="196" y1="192" x2="240" y2="192" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#a7)"/>
  <circle cx="218" cy="178" r="9" fill="rgb(212,168,83)"/><text x="218" y="182" fill="#0d0d0d" font-size="11" font-weight="bold" text-anchor="middle">2</text>
  <!-- 3 dispatcher→handlermapping -->
  <line x1="382" y1="180" x2="468" y2="140" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#a7)"/>
  <circle cx="430" cy="150" r="9" fill="rgb(212,168,83)"/><text x="430" y="154" fill="#0d0d0d" font-size="11" font-weight="bold" text-anchor="middle">3</text>
  <!-- 4 dispatcher→controller -->
  <line x1="382" y1="205" x2="468" y2="208" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#a7)"/>
  <circle cx="430" cy="199" r="9" fill="rgb(212,168,83)"/><text x="430" y="203" fill="#0d0d0d" font-size="11" font-weight="bold" text-anchor="middle">4</text>
  <!-- 5 dispatcher→viewresolver -->
  <line x1="382" y1="218" x2="468" y2="278" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#a7)"/>
  <circle cx="430" cy="256" r="9" fill="rgb(212,168,83)"/><text x="430" y="260" fill="#0d0d0d" font-size="11" font-weight="bold" text-anchor="middle">5</text>
  <!-- 6 dispatcher→tomcat (응답) -->
  <line x1="240" y1="212" x2="196" y2="212" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#a7)"/>
  <circle cx="218" cy="226" r="9" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/><text x="218" y="230" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">6</text>
  <!-- 7 tomcat→client (응답) -->
  <line x1="150" y1="200" x2="120" y2="200" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#a7)"/>
  <circle cx="135" cy="214" r="9" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/><text x="135" y="218" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">7</text>

  <!-- 단계 설명 -->
  <text x="24" y="366" fill="rgb(138,133,128)" font-size="11">① 요청 → ② DispatcherServlet 진입 → ③ 액션 찾기(HandlerMapping) → ④ 컨트롤러 호출 → ⑤ 뷰 렌더링(ViewResolver) → ⑥⑦ 응답</text>
  <text x="24" y="386" fill="#66bb6a" font-size="11" font-weight="bold">못 찾으면 404 · HandlerMapping은 경로뿐 아니라 HTTP 메서드로도 액션을 찾습니다(8장)</text>

  <defs>
    <marker id="a7" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>
</svg>

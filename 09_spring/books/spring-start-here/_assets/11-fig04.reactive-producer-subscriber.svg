<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="리액티브 앱의 producer subscriber 의존 선언 도식">
  <title>리액티브 — 작업이 producer/subscriber로 의존을 선언하고, 무관한 작업은 병렬로 돕니다</title>
  <desc>리액티브 앱에서 단계가 작업(task)이 되어 서로의 의존을 선언한다. 각 작업은 producer를 반환해 다른 작업이 subscribe하게 하고, subscriber로 다른 작업의 producer에 붙어 결과를 소비한다. total debt를 계산하는 TASK A는 내부 부채를 구하는 TASK C와 외부 부채를 구하는 TASK B에 각각 subscribe한다. B와 C는 서로 의존하지 않으므로 여러 스레드가 동시에 실행할 수 있어, 블로킹 모델의 순차 실행보다 빠르다</desc>
  <rect x="0" y="0" width="760" height="380" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">리액티브 — 작업이 의존을 선언하고, 무관하면 병렬로 돕니다</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">타임라인의 단계가 독립 작업이 됩니다 · producer로 결과를 내고 subscriber로 다른 작업에 붙습니다</text>

  <!-- HTTP request -->
  <rect x="30" y="160" width="110" height="60" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="85" y="194" fill="#e8e4df" font-size="11" text-anchor="middle">HTTP request</text>

  <line x1="140" y1="190" x2="210" y2="190" stroke="#5b9bd5" stroke-width="1.4" marker-end="url(#a11r)"/>
  <text x="175" y="182" fill="#5b9bd5" font-size="9" text-anchor="middle">subscribes</text>

  <!-- TASK A -->
  <rect x="210" y="155" width="150" height="70" rx="6" fill="rgba(212,168,83,0.12)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="285" y="180" fill="rgb(212,168,83)" font-size="12" font-weight="bold" text-anchor="middle">TASK A</text>
  <text x="285" y="198" fill="#e8e4df" font-size="10" text-anchor="middle">total debt 계산</text>
  <text x="285" y="214" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">producer 반환</text>

  <!-- TASK B (외부, 위) -->
  <line x1="360" y1="175" x2="470" y2="120" stroke="#5b9bd5" stroke-width="1.4" marker-end="url(#a11r)"/>
  <text x="410" y="135" fill="#5b9bd5" font-size="9">subscribes</text>
  <rect x="470" y="90" width="160" height="66" rx="6" fill="rgba(102,187,106,0.12)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="550" y="115" fill="#66bb6a" font-size="12" font-weight="bold" text-anchor="middle">TASK B</text>
  <text x="550" y="133" fill="#e8e4df" font-size="10" text-anchor="middle">외부 부채 조회</text>
  <text x="550" y="148" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">producer</text>

  <!-- TASK C (내부, 아래) -->
  <line x1="360" y1="205" x2="470" y2="255" stroke="#5b9bd5" stroke-width="1.4" marker-end="url(#a11r)"/>
  <text x="410" y="245" fill="#5b9bd5" font-size="9">subscribes</text>
  <rect x="470" y="224" width="160" height="66" rx="6" fill="rgba(102,187,106,0.12)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="550" y="249" fill="#66bb6a" font-size="12" font-weight="bold" text-anchor="middle">TASK C</text>
  <text x="550" y="267" fill="#e8e4df" font-size="10" text-anchor="middle">내부 부채 조회</text>
  <text x="550" y="282" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">producer</text>

  <!-- 병렬 표시 -->
  <text x="648" y="130" fill="#66bb6a" font-size="11" font-weight="bold">↕ 서로 무관</text>
  <text x="648" y="150" fill="rgb(138,133,128)" font-size="10">→ 동시 실행</text>
  <text x="648" y="255" fill="#66bb6a" font-size="11" font-weight="bold">↕ 병렬</text>
  <text x="648" y="275" fill="rgb(138,133,128)" font-size="10">스레드 놀지 않음</text>

  <text x="24" y="332" fill="#e8e4df" font-size="12" font-weight="bold">→ B·C는 의존이 없어 여러 스레드가 동시에 처리 · 막히면 다른 작업을 하다 이어서 끝냅니다</text>
  <text x="24" y="352" fill="rgb(138,133,128)" font-size="11">블로킹 모델의 "한 스레드가 한 흐름 순차 실행"과 달리, 더 적은 스레드로 더 많은 요청을 처리합니다</text>

  <defs>
    <marker id="a11r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5b9bd5"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="request 스코프와 session 스코프의 인스턴스 생성 차이 도식">
  <title>request는 요청마다 새 인스턴스, session은 세션당 하나입니다</title>
  <desc>request 스코프와 session 스코프의 인스턴스 생성 차이를 인스턴스 해시로 비교한다. request 스코프는 같은 클라이언트라도 HTTP 요청마다 다른 인스턴스를 만들어 해시가 매번 다르다. session 스코프는 같은 클라이언트의 HTTP 세션 동안 같은 인스턴스를 재사용해 여러 요청이 같은 해시를 공유하고, 다른 클라이언트는 별도 세션이라 다른 인스턴스를 받는다</desc>
  <rect x="0" y="0" width="760" height="400" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">request는 요청마다 새것, session은 세션당 하나</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">인스턴스 해시로 보면 차이가 분명합니다 — 같은 요청 두 번의 해시가 같은가 다른가</text>

  <!-- 좌: request -->
  <text x="40" y="92" fill="#f44336" font-size="13" font-weight="bold">request 스코프</text>
  <text x="40" y="110" fill="rgb(138,133,128)" font-size="11">= 요청마다 다른 인스턴스</text>
  <rect x="40" y="122" width="320" height="250" rx="10" fill="rgba(244,67,54,0.07)" stroke="#f44336" stroke-width="1.5"/>

  <!-- request1 -->
  <rect x="60" y="142" width="120" height="40" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="120" y="167" fill="#e8e4df" font-size="11" text-anchor="middle">Richard 요청1</text>
  <line x1="180" y1="162" x2="240" y2="162" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#a9)"/>
  <rect x="240" y="142" width="100" height="40" rx="6" fill="rgba(244,67,54,0.15)" stroke="#f44336" stroke-width="1.2"/>
  <text x="290" y="167" fill="#e8e4df" font-size="11" text-anchor="middle" font-family="monospace">@56b49ef9</text>

  <!-- request2 -->
  <rect x="60" y="212" width="120" height="40" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="120" y="237" fill="#e8e4df" font-size="11" text-anchor="middle">Richard 요청2</text>
  <line x1="180" y1="232" x2="240" y2="232" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#a9)"/>
  <rect x="240" y="212" width="100" height="40" rx="6" fill="rgba(244,67,54,0.15)" stroke="#f44336" stroke-width="1.2"/>
  <text x="290" y="237" fill="#e8e4df" font-size="11" text-anchor="middle" font-family="monospace">@7aa6eB9</text>

  <text x="60" y="300" fill="#f44336" font-size="12" font-weight="bold">→ 같은 사용자라도 해시가 다름</text>
  <text x="60" y="322" fill="rgb(138,133,128)" font-size="11">요청마다 새 인스턴스 · 요청 끝나면 GC</text>
  <text x="60" y="352" fill="rgb(138,133,128)" font-size="11">민감·일시 데이터(자격 증명)에 적합</text>

  <!-- 우: session -->
  <text x="420" y="92" fill="#66bb6a" font-size="13" font-weight="bold">session 스코프</text>
  <text x="420" y="110" fill="rgb(138,133,128)" font-size="11">= 세션당 하나 (요청들이 공유)</text>
  <rect x="420" y="122" width="316" height="250" rx="10" fill="rgba(102,187,106,0.07)" stroke="#66bb6a" stroke-width="1.5"/>

  <!-- Richard 요청1·2 → 같은 해시 -->
  <rect x="440" y="142" width="120" height="40" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="500" y="167" fill="#e8e4df" font-size="11" text-anchor="middle">Richard 요청1</text>
  <rect x="440" y="192" width="120" height="40" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="500" y="217" fill="#e8e4df" font-size="11" text-anchor="middle">Richard 요청2</text>
  <line x1="560" y1="162" x2="620" y2="182" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#a9)"/>
  <line x1="560" y1="212" x2="620" y2="192" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#a9)"/>
  <rect x="620" y="162" width="100" height="40" rx="6" fill="rgba(102,187,106,0.15)" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="670" y="187" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="monospace">@4be2b62e</text>

  <!-- Daniella → 다른 해시 -->
  <rect x="440" y="252" width="120" height="40" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="500" y="277" fill="#e8e4df" font-size="11" text-anchor="middle">Daniella 요청1</text>
  <line x1="560" y1="272" x2="620" y2="272" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#a9)"/>
  <rect x="620" y="252" width="100" height="40" rx="6" fill="rgba(102,187,106,0.15)" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="670" y="277" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="monospace">@a234be1d</text>

  <text x="440" y="322" fill="#66bb6a" font-size="12" font-weight="bold">→ 같은 세션이면 같은 해시</text>
  <text x="440" y="344" fill="rgb(138,133,128)" font-size="11">다른 사용자는 다른 세션 → 다른 인스턴스</text>
  <text x="440" y="364" fill="rgb(138,133,128)" font-size="11">로그인 상태·장바구니에 적합</text>

  <defs>
    <marker id="a9" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>
</svg>

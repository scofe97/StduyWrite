<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="같은 인터페이스 구현체가 여럿일 때 주입 모호함과 해소 도식">
  <title>같은 인터페이스 구현체가 여럿일 때 — 주입 모호함과 두 해소법</title>
  <desc>CommentNotificationProxy 인터페이스를 두 클래스(CommentPushNotificationProxy·EmailCommentNotificationProxy)가 구현하면, 타입만으로 주입할 때 Spring은 어느 구현을 넣을지 몰라 NoUniqueBeanDefinitionException을 던진다. 해소법은 두 가지로, 기본 하나를 @Primary로 지정하거나 주입 지점마다 @Qualifier로 이름을 지목한다</desc>
  <rect x="0" y="0" width="760" height="400" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">한 인터페이스에 구현체가 둘이면 어느 것을 주입할지 모호합니다</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">타입만으로는 못 고릅니다 — @Primary(기본 하나)나 @Qualifier(지점마다 지목)로 해소합니다</text>

  <!-- 인터페이스 -->
  <rect x="280" y="80" width="200" height="52" rx="6" fill="rgba(212,168,83,0.12)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="380" y="102" fill="rgb(212,168,83)" font-size="12" font-weight="bold" text-anchor="middle">CommentNotificationProxy</text>
  <text x="380" y="120" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">«interface»</text>

  <!-- 두 구현체 -->
  <line x1="330" y1="132" x2="240" y2="164" stroke="rgb(138,133,128)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arGr4)"/>
  <line x1="430" y1="132" x2="520" y2="164" stroke="rgb(138,133,128)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arGr4)"/>
  <text x="380" y="152" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">implements</text>

  <rect x="120" y="166" width="200" height="44" rx="5" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="220" y="192" fill="#e8e4df" font-size="11" text-anchor="middle">CommentPushNotificationProxy</text>

  <rect x="440" y="166" width="200" height="44" rx="5" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="540" y="192" fill="#e8e4df" font-size="11" text-anchor="middle">EmailCommentNotificationProxy</text>

  <!-- 실패 -->
  <rect x="120" y="234" width="520" height="46" rx="6" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="136" y="256" fill="#f44336" font-size="12" font-weight="bold">✗ 타입만으로 주입하면</text>
  <text x="136" y="273" fill="rgb(230,115,107)" font-size="11">NoUniqueBeanDefinitionException — found 2: push, email</text>

  <!-- 두 해소 -->
  <rect x="120" y="296" width="252" height="80" rx="6" fill="rgba(102,187,106,0.12)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="136" y="318" fill="#66bb6a" font-size="12" font-weight="bold">✓ @Primary — 기본 하나</text>
  <text x="136" y="338" fill="#e8e4df" font-size="10">@Component @Primary</text>
  <text x="136" y="354" fill="rgb(138,133,128)" font-size="10">이름 없이 주입 시 이 구현 선택</text>
  <text x="136" y="370" fill="rgb(138,133,128)" font-size="10">라이브러리 구현 대신 내 구현 기본화</text>

  <rect x="388" y="296" width="252" height="80" rx="6" fill="rgba(102,187,106,0.12)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="404" y="318" fill="#66bb6a" font-size="12" font-weight="bold">✓ @Qualifier — 지점마다 지목</text>
  <text x="404" y="338" fill="#e8e4df" font-size="10">@Qualifier("PUSH") / @Qualifier("EMAIL")</text>
  <text x="404" y="354" fill="rgb(138,133,128)" font-size="10">주입 지점마다 다른 구현을 명시</text>
  <text x="404" y="370" fill="rgb(138,133,128)" font-size="10">의도가 코드에 분명히 드러남</text>

  <defs>
    <marker id="arGr4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="OpenFeign이 인터페이스 선언만으로 구현을 채워 주입하는 도식">
  <title>OpenFeign — 인터페이스만 선언하면 구현을 채워 bean으로 줍니다</title>
  <desc>OpenFeign의 동작 원리를 나타낸다. 개발자는 PaymentsProxy 인터페이스만 선언하고 애너테이션으로 호출을 표시한다. OpenFeign이 그 인터페이스를 구현한 클라이언트를 만들어 Spring 컨텍스트에 bean으로 등록하고, 컨트롤러는 다른 bean처럼 이 프록시를 주입받아 결제 서비스의 엔드포인트를 호출한다. 개발자는 구현 코드를 한 줄도 쓰지 않는다</desc>
  <rect x="0" y="0" width="760" height="380" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">OpenFeign — 인터페이스만 선언하면 구현은 채워집니다</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">개발자는 계약(인터페이스)만 정의 · OpenFeign이 구현을 만들어 bean으로 등록합니다</text>

  <!-- The app 경계 -->
  <rect x="24" y="80" width="470" height="280" rx="8" fill="none" stroke="rgb(60,55,50)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="36" y="100" fill="rgb(138,133,128)" font-size="11">The app</text>

  <!-- PaymentsController -->
  <rect x="44" y="120" width="180" height="70" rx="6" fill="rgba(212,168,83,0.12)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="134" y="148" fill="rgb(212,168,83)" font-size="12" font-weight="bold" text-anchor="middle">PaymentsController</text>
  <text x="134" y="168" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="monospace">@PostMapping("/payment")</text>
  <text x="134" y="182" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">프록시를 주입받아 호출</text>

  <line x1="224" y1="155" x2="288" y2="155" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#a11)"/>
  <text x="256" y="147" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">Uses</text>

  <!-- PaymentsProxy interface (강조 영역) -->
  <rect x="288" y="110" width="190" height="230" rx="8" fill="rgba(102,187,106,0.06)" stroke="#66bb6a" stroke-width="1.2"/>
  <rect x="300" y="122" width="166" height="64" rx="6" fill="rgba(102,187,106,0.12)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="383" y="146" fill="#66bb6a" font-size="12" font-weight="bold" text-anchor="middle">PaymentsProxy</text>
  <text x="383" y="164" fill="#e8e4df" font-size="10" text-anchor="middle">«interface»</text>
  <text x="383" y="179" fill="rgb(138,133,128)" font-size="10" text-anchor="middle" font-family="monospace">createPayment()</text>

  <line x1="383" y1="240" x2="383" y2="188" stroke="#66bb6a" stroke-width="1.4" marker-end="url(#a11g)"/>
  <text x="393" y="216" fill="#66bb6a" font-size="10">Implements</text>

  <rect x="300" y="242" width="166" height="80" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="383" y="268" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">OpenFeign client</text>
  <text x="383" y="286" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">구현 (자동 생성)</text>
  <text x="383" y="304" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">bean으로 컨텍스트 등록</text>

  <!-- Payment service -->
  <line x1="466" y1="155" x2="560" y2="155" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#a11)"/>
  <text x="513" y="147" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">Calls</text>
  <text x="560" y="100" fill="#e8e4df" font-size="12" font-weight="bold">Payment service</text>
  <rect x="560" y="120" width="150" height="70" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="635" y="150" fill="#e8e4df" font-size="11" text-anchor="middle" font-family="monospace">POST /payment</text>
  <text x="635" y="170" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">다른 서비스의</text>
  <text x="635" y="184" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">REST 엔드포인트</text>

  <text x="24" y="352" fill="#66bb6a" font-size="12" font-weight="bold">→ 개발자가 짜는 건 인터페이스뿐 · 구현·주입·호출은 OpenFeign이 대신합니다 (10장 애너테이션 그대로 재사용)</text>

  <defs>
    <marker id="a11" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
    <marker id="a11g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#66bb6a"/></marker>
  </defs>
</svg>

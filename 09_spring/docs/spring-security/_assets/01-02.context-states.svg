<title id="dt">같은 SecurityContext 객체가 지우는 동작마다 달라지는 모습</title><desc id="dd">clearContext 는 스레드 쪽 참조만 끊고, setAuthentication(null) 은 객체 안의 인증을 비우며, invalidate 는 세션을 지운다</desc>

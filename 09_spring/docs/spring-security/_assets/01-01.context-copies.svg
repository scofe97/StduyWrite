<title id="dt">같은 SecurityContext가 단계마다 놓이는 자리</title><desc id="dd">세션 속성은 로그아웃 전까지 그대로이고 스레드 로컬은 요청 안에서만 채워진다</desc>
<rect width="964" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PROCESS · ONE SECURITYCONTEXT, TWO PLACES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 SecurityContext가 단계마다 놓이는 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Security 체인 앞, 컨트롤러 직전, 체인 뒤, 로그아웃 뒤 네 시점에 세션 속성과 스레드 로컬이 SecurityContext 를 쥐고 있는지 그린다</text>
<text x="264.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">1 · Security 체인 앞</text>
<text x="456.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">2 · 컨트롤러 직전</text>
<text x="648.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">3 · 체인을 벗어남</text>
<text x="840.0" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">4 · 로그아웃 핸들러 뒤</text>

<title id="dt">경우별 로그인 실패 응답 시간</title><desc id="dd">없는 이메일에서 해시 비교를 건너뛸 때와 가짜 해시를 비교할 때의 응답 시간 차이</desc>
<rect width="960" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BAR · RESPONSE TIMING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">경우별 로그인 실패 응답 시간</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">BCrypt 해시 연산 유무에 따른 응답 지연 분석</text>

<text x="476" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">20</text>
<line x1="570" y1="120" x2="570" y2="330" stroke="rgba(191,192,192,0.12)" stroke-width="0.8"/>
<text x="570" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">30</text>
<line x1="663" y1="120" x2="663" y2="330" stroke="rgba(191,192,192,0.12)" stroke-width="0.8"/>
<text x="663" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">40</text>
<line x1="756" y1="120" x2="756" y2="330" stroke="rgba(191,192,192,0.12)" stroke-width="0.8"/>
<text x="756" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">50</text>
<line x1="850" y1="120" x2="850" y2="330" stroke="rgba(191,192,192,0.12)" stroke-width="0.8"/>
<text x="850" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">60ms</text>
<line x1="290" y1="330" x2="850" y2="330" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

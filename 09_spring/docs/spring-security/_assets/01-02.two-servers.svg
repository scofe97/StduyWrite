<title id="dt">서버가 두 대가 되면 세션이 갈라지는 모습</title><desc id="dd">A 서버에서 만든 세션 ID 는 B 서버의 맵에 없어서 다음 요청이 B 로 가면 로그인이 풀린다</desc>
<rect width="880" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DEPLOYMENT · TWO SERVERS, TWO MEMORIES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서버가 두 대가 되면 세션이 갈라지는 모습</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">각 서버는 자기 JVM 메모리의 sessions 맵과 장부만 안다</text>

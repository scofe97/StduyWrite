<title id="dt">같은 헤더를 기본값과 좁힌 값으로 읽은 결과</title><desc id="dd">RemoteIpValve가 X-Forwarded-For를 오른쪽부터 검증할 때 프록시 신뢰 대역 설정에 따른 클라이언트 IP 판정 비교</desc>
<rect width="960" height="670" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · REMOTE IP VALVE EVALUATION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 헤더를 기본값과 좁힌 값으로 읽은 결과</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Tomcat 11 RemoteIpValve.invoke() 역순 순회 로직 기준</text>

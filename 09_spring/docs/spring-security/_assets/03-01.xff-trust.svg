<text x="560" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Spring 수신 헤더 토막 (연결 상대: 172.18.0.2)</text>

<title id="dt">쿠키의 ID 하나가 로그인 사용자까지 가는 길</title><desc id="dd">JSESSIONID 문자열이 sessions 맵, 속성 맵, SecurityContext 를 차례로 거쳐 LoginUser 에 닿는다</desc>
<rect width="880" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PROCESS · ONE ID TO ONE USER</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">쿠키의 ID 하나가 로그인 사용자까지 가는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">한 요청 안에서 Tomcat 과 Spring 이 이어 하는 조회 네 번</text>

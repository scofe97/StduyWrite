<svg viewBox="0 0 884 250" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>객체 승격 경로 — Eden → Survivor → Old</title>
  <desc>새 객체는 Eden에서 만들어지고, Minor GC를 넘길 때마다 Survivor로 복사되며 age가 오른다. 임계값(기본 15)에 달하면 Old로 승격. Survivor 부족 시 Promotion Failure, 큰 객체는 Old 직행.</desc>
  <defs>
    <style>
      .shead   { font-size: 14px; font-weight: 800; fill: rgb(212,168,83); }
      .sdesc   { font-size: 11px; fill: rgb(180,175,170); }
      .scode   { font-size: 11px; font-weight: 700; fill: rgb(212,168,83); font-family: 'JetBrains Mono', monospace; }
      .slabel  { font-size: 13px; font-weight: 800; fill: #e8e4df; }
      .rlabel  { font-size: 10.5px; fill: rgb(180,175,170); }
      .note    { font-size: 10.5px; fill: rgb(138,133,128); }
      .bad     { font-size: 11px; font-weight: 700; fill: #e57373; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="rgb(212,168,83)"/></marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#e57373"/></marker>
  </defs>
  <rect x="0" y="0" width="884" height="250" fill="#0d0d0d"/>
  <text x="22" y="30" class="shead">③ 객체 승격 경로 — Eden → Survivor → Old</text>
  <text x="22" y="50" class="sdesc">Minor GC를 넘길 때마다 age가 오르고, 임계값(기본 15)에 달하면 구세대로 승격된다</text>

  <!-- main chain -->
  <rect x="22"  y="70" width="118" height="56" rx="6" fill="#1e2a1e" stroke="#4ab080" stroke-width="1.4"/>
  <text x="81"  y="94" class="slabel" text-anchor="middle">new 객체</text>
  <text x="81"  y="113" class="rlabel" text-anchor="middle">생성</text>
  <line x1="140" y1="98" x2="178" y2="98" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="180" y="70" width="118" height="56" rx="6" fill="#1e3a4a" stroke="#4a8ab0" stroke-width="1.4"/>
  <text x="239" y="94" class="slabel" text-anchor="middle">Eden</text>
  <text x="239" y="113" class="rlabel" text-anchor="middle">TLAB 할당</text>
  <line x1="298" y1="98" x2="336" y2="98" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arr)"/>
  <text x="317" y="90" class="note" text-anchor="middle">생존</text>

  <rect x="338" y="70" width="126" height="56" rx="6" fill="#2a2a1a" stroke="rgb(212,168,83)" stroke-width="1.4"/>
  <text x="401" y="94" class="slabel" text-anchor="middle">Survivor</text>
  <text x="401" y="113" class="scode" text-anchor="middle">age = 1</text>
  <line x1="464" y1="98" x2="502" y2="98" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arr)"/>
  <text x="483" y="90" class="note" text-anchor="middle">+1</text>

  <rect x="504" y="70" width="126" height="56" rx="6" fill="#2a2a1a" stroke="rgb(212,168,83)" stroke-width="1.4"/>
  <text x="567" y="94" class="slabel" text-anchor="middle">Survivor</text>
  <text x="567" y="113" class="scode" text-anchor="middle">age++ (S0↔S1)</text>
  <line x1="630" y1="98" x2="668" y2="98" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arr)"/>
  <text x="649" y="88" class="note" text-anchor="middle">≥ 15</text>

  <rect x="670" y="70" width="126" height="56" rx="6" fill="#1e1a2a" stroke="#8a70c0" stroke-width="1.4"/>
  <text x="733" y="94" class="slabel" text-anchor="middle">Old</text>
  <text x="733" y="113" class="rlabel" text-anchor="middle">구세대 승격</text>
  <line x1="733" y1="126" x2="733" y2="156" stroke="#e57373" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- 큰 객체 -->
  <rect x="22" y="150" width="240" height="50" rx="6" fill="#1e1218" stroke="#e57373" stroke-width="1.2"/>
  <text x="142" y="172" class="slabel" text-anchor="middle">큰 객체 (배열·문자열)</text>
  <text x="142" y="190" class="rlabel" text-anchor="middle">PretenureSizeThreshold 초과 → Old 직행</text>

  <!-- Promotion Failure -->
  <rect x="504" y="148" width="292" height="62" rx="6" fill="#2a1414" stroke="#e57373" stroke-width="1.2"/>
  <text x="650" y="170" class="bad" text-anchor="middle">⚠ Promotion Failure</text>
  <text x="650" y="188" class="rlabel" text-anchor="middle">Survivor 부족 → age 미달이어도 Old 강제 승격</text>
  <text x="650" y="203" class="rlabel" text-anchor="middle">Old마저 가득 차면 Full GC 유발</text>
</svg>

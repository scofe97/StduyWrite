<svg viewBox="0 0 884 350" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>카드 테이블 — 세대 간 참조 추적</title>
  <desc>구세대 객체가 신세대를 참조하면 그 카드를 dirty로 표시하고, Minor GC는 dirty 카드만 스캔해 구세대 전체 순회 비용을 없앤다. dirty는 쓰기 장벽이 참조 대입 시 자동으로 찍는다.</desc>
  <defs>
    <style>
      .shead   { font-size: 14px; font-weight: 800; fill: rgb(212,168,83); }
      .sdesc   { font-size: 11px; fill: rgb(180,175,170); }
      .scode   { font-size: 11px; font-weight: 700; fill: rgb(212,168,83); font-family: 'JetBrains Mono', monospace; }
      .slabel  { font-size: 13px; font-weight: 800; fill: #e8e4df; }
      .rlabel  { font-size: 11px; fill: rgb(180,175,170); }
      .note    { font-size: 11px; fill: rgb(138,133,128); }
      .bad     { font-size: 11px; font-weight: 700; fill: #e57373; }
    </style>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="#e57373"/></marker>
  </defs>
  <rect x="0" y="0" width="884" height="350" fill="#0d0d0d"/>
  <text x="22" y="30" class="shead">④ 카드 테이블 — 세대 간 참조 추적</text>
  <text x="22" y="50" class="sdesc">구세대 객체가 신세대를 참조할 때, Minor GC가 그 신세대 객체를 살아 있다고 판정하려면 구세대도 봐야 한다.</text>
  <text x="22" y="68" class="sdesc">구세대 전체를 매번 스캔하면 무거우므로 — 512바이트 단위 카드로 쪼개 *dirty 카드만* 스캔한다.</text>

  <text x="22" y="104" class="slabel">구세대 (512B 단위 카드로 분할)</text>

  <!-- cards: 8개를 폭넓게 -->
  <g>
    <rect x="22"  y="118" width="96" height="48" rx="4" fill="#1e1a2a" stroke="#555" stroke-width="1"/>
    <text x="70"  y="138" class="rlabel" text-anchor="middle">카드 0</text>
    <text x="70"  y="156" class="note" text-anchor="middle">clean</text>
    <rect x="126" y="118" width="96" height="48" rx="4" fill="#2a1a1a" stroke="#e57373" stroke-width="1.8"/>
    <text x="174" y="138" class="rlabel" text-anchor="middle">카드 1</text>
    <text x="174" y="156" class="bad" text-anchor="middle">dirty ★</text>
    <rect x="230" y="118" width="96" height="48" rx="4" fill="#1e1a2a" stroke="#555" stroke-width="1"/>
    <text x="278" y="138" class="rlabel" text-anchor="middle">카드 2</text>
    <text x="278" y="156" class="note" text-anchor="middle">clean</text>
    <rect x="334" y="118" width="96" height="48" rx="4" fill="#1e1a2a" stroke="#555" stroke-width="1"/>
    <text x="382" y="138" class="rlabel" text-anchor="middle">카드 3</text>
    <text x="382" y="156" class="note" text-anchor="middle">clean</text>
    <rect x="438" y="118" width="96" height="48" rx="4" fill="#2a1a1a" stroke="#e57373" stroke-width="1.8"/>
    <text x="486" y="138" class="rlabel" text-anchor="middle">카드 4</text>
    <text x="486" y="156" class="bad" text-anchor="middle">dirty ★</text>
    <rect x="542" y="118" width="96" height="48" rx="4" fill="#1e1a2a" stroke="#555" stroke-width="1"/>
    <text x="590" y="138" class="rlabel" text-anchor="middle">카드 5</text>
    <text x="590" y="156" class="note" text-anchor="middle">clean</text>
    <rect x="646" y="118" width="96" height="48" rx="4" fill="#1e1a2a" stroke="#555" stroke-width="1"/>
    <text x="694" y="138" class="rlabel" text-anchor="middle">카드 6</text>
    <text x="694" y="156" class="note" text-anchor="middle">clean</text>
    <rect x="750" y="118" width="96" height="48" rx="4" fill="#2a1a1a" stroke="#e57373" stroke-width="1.8"/>
    <text x="798" y="138" class="rlabel" text-anchor="middle">카드 7</text>
    <text x="798" y="156" class="bad" text-anchor="middle">dirty ★</text>
  </g>
  <text x="22" y="186" class="note">... 구세대는 수백 MB — 그 안에서 신세대를 가리키는 카드는 소수다.</text>

  <!-- dirty arrows -->
  <line x1="174" y1="166" x2="174" y2="206" stroke="#e57373" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="486" y1="166" x2="486" y2="206" stroke="#e57373" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="798" y1="166" x2="798" y2="206" stroke="#e57373" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- young refs -->
  <rect x="100"  y="210" width="148" height="50" rx="4" fill="#1e3a4a" stroke="#4a8ab0" stroke-width="1"/>
  <text x="174" y="230" class="rlabel" text-anchor="middle">신세대 객체 참조</text>
  <text x="174" y="249" class="scode" text-anchor="middle">→ GC Root에 추가</text>
  <rect x="412" y="210" width="148" height="50" rx="4" fill="#1e3a4a" stroke="#4a8ab0" stroke-width="1"/>
  <text x="486" y="230" class="rlabel" text-anchor="middle">신세대 객체 참조</text>
  <text x="486" y="249" class="scode" text-anchor="middle">→ GC Root에 추가</text>
  <rect x="724" y="210" width="148" height="50" rx="4" fill="#1e3a4a" stroke="#4a8ab0" stroke-width="1"/>
  <text x="798" y="230" class="rlabel" text-anchor="middle">신세대 객체 참조</text>
  <text x="798" y="249" class="scode" text-anchor="middle">→ GC Root에 추가</text>

  <!-- write barrier -->
  <rect x="22" y="280" width="824" height="52" rx="5" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="40" y="302" class="scode">쓰기 장벽 (Write Barrier)</text>
  <text x="40" y="320" class="sdesc">obj.field = other 대입 시 JVM이 자동으로 해당 카드를 dirty 표시 → Minor GC는 dirty 카드만 스캔해 구세대 전수 순회 비용을 없앤다.</text>
  <text x="600" y="302" class="note">구체 구현(OopMap·Safepoint·Remembered Set) → 02-05</text>
</svg>

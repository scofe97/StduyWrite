<svg viewBox="0 0 884 250" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>JVM 힙 레이아웃 — Young과 Old의 분리</title>
  <desc>같은 힙 메모리를 Young(Eden+S0+S1)과 Old로 논리 분할해, 영역마다 다른 알고리즘·다른 빈도로 GC를 수행한다. NewRatio로 비율을 정한다.</desc>
  <defs>
    <style>
      .shead   { font-size: 14px; font-weight: 800; fill: rgb(212,168,83); }
      .sdesc   { font-size: 11px; fill: rgb(180,175,170); }
      .scode   { font-size: 11px; font-weight: 700; fill: rgb(212,168,83); font-family: 'JetBrains Mono', monospace; }
      .slabel  { font-size: 13px; font-weight: 800; fill: #e8e4df; }
      .region  { font-size: 13px; font-weight: 800; fill: #e8e4df; }
      .rlabel  { font-size: 10.5px; fill: rgb(180,175,170); }
    </style>
  </defs>
  <rect x="0" y="0" width="884" height="250" fill="#0d0d0d"/>
  <text x="22" y="30" class="shead">② JVM 힙 레이아웃 — Young과 Old의 분리</text>
  <text x="22" y="50" class="sdesc">같은 힙 메모리를 논리적으로 나눠, 영역마다 다른 알고리즘·다른 빈도로 GC를 수행한다</text>

  <text x="442" y="74" class="rlabel" text-anchor="middle">JVM 힙 (예: -Xmx4g, NewRatio=2 → Young 1/3 · Old 2/3)</text>
  <rect x="22" y="82" width="840" height="130" rx="8" fill="#111" stroke="#444" stroke-width="1.5"/>

  <!-- Young -->
  <rect x="28" y="88" width="360" height="118" rx="5" fill="#1a2a3a" stroke="#4a8ab0" stroke-width="1.4"/>
  <text x="208" y="108" class="region" text-anchor="middle">Young Generation (~1/3)</text>
  <text x="208" y="124" class="rlabel" text-anchor="middle">Minor GC · 자주 · 빠름 · 마크-카피</text>
  <rect x="36"  y="132" width="194" height="66" rx="4" fill="#1e3a4a" stroke="#4a8ab0" stroke-width="1"/>
  <text x="133" y="154" class="slabel" text-anchor="middle">Eden</text>
  <text x="133" y="172" class="scode" text-anchor="middle">80%</text>
  <text x="133" y="189" class="rlabel" text-anchor="middle">새 객체 할당 (TLAB)</text>
  <rect x="238" y="132" width="68" height="66" rx="4" fill="#0f2a1a" stroke="#4ab080" stroke-width="1"/>
  <text x="272" y="154" class="slabel" text-anchor="middle">S0</text>
  <text x="272" y="172" class="scode" text-anchor="middle">10%</text>
  <text x="272" y="189" class="rlabel" text-anchor="middle">비어 있음</text>
  <rect x="314" y="132" width="68" height="66" rx="4" fill="#2a1f0a" stroke="rgb(212,168,83)" stroke-width="1"/>
  <text x="348" y="154" class="slabel" text-anchor="middle">S1</text>
  <text x="348" y="172" class="scode" text-anchor="middle">10%</text>
  <text x="348" y="189" class="rlabel" text-anchor="middle">사용 중</text>

  <!-- Old -->
  <rect x="396" y="88" width="460" height="118" rx="5" fill="#1e1a2a" stroke="#8a70c0" stroke-width="1.4"/>
  <text x="626" y="108" class="region" text-anchor="middle">Old Generation (~2/3)</text>
  <text x="626" y="124" class="rlabel" text-anchor="middle">Full GC · 드물게 · 무거움 · 마크-컴팩트</text>
  <rect x="408" y="132" width="436" height="66" rx="4" fill="#161224" stroke="#8a70c0" stroke-width="1"/>
  <text x="436" y="153" class="slabel">오래 산 객체들</text>
  <text x="436" y="173" class="rlabel">age ≥ MaxTenuringThreshold(기본 15) 도달 또는 Survivor 오버플로 → 승격</text>
  <text x="436" y="190" class="rlabel">CMS는 마크-스윕만 적용(동시 수행) → 단편화 누적 시 Full GC로 지연 컴팩트</text>

  <line x1="388" y1="82" x2="388" y2="212" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="388" y="230" class="scode" text-anchor="middle">-XX:NewRatio=2</text>
</svg>

<title id="dt">멈춤이 길어지는 흐름과, 거기 끼어든 다른 원인</title><desc id="dd">GC 멈춤 에스컬레이션 막대 그림. 괄호 안은 GC 를 부른 이유이고 이것이 원인 범주를 가른다. Allocation Failure 계열은 할당할 자리가 없어 JVM 이 트리거한 것이라 25ms 에서 110ms, 250ms, 5.32초로 길어지는 흐름이 메모리 압박의 근거가 된다. 반면 System.gc() 는 코드가 명시적으로 부른 것이라 이 흐름에 속하지 않는다. 처방도 힙 튜닝이 아니라 그 호출을 없애거나 -XX:+DisableExplicitGC 로 막는 것이다.</desc>
<rect width="800" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING JAVA · 11-03 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">멈춤이 길어지는 흐름과, 거기 끼어든 다른 원인</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">괄호 안이 원인 범주입니다 — System.gc() 는 압박의 증거가 아닙니다</text>
<text x="44" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">메모리 압박의 근거 — JVM 이 트리거한 수집</text>
<text x="44" y="168" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">GC(45)</text>

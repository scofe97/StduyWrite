<path d="M 738 164 L 738 352" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<text x="748" y="255.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">길어지는</text>
<text x="748" y="271.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">추세</text>
<line x1="44" y1="384" x2="756" y2="384" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="408" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">원인 범주가 다름 — 코드가 명시적으로 부른 수집</text>
<text x="44" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">GC(50)</text>
<text x="150" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">System.gc()</text>
<rect x="300" y="426" width="247.26708148207788" height="24" rx="3" fill="#6A95D81C" stroke="#6A95D8" stroke-width="1.0"/>
<text x="559.2670814820779" y="443" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">2.567s</text>
<text x="44" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">처방이 갈립니다 — 힙 튜닝이 아니라 호출 제거 또는 -XX:+DisableExplicitGC</text>
<text x="44" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">라이브러리가 이 호출을 숨기고 있을 수 있어 코드 검색만으로는 안 나옵니다</text>
<text x="44" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">막대 길이는 제곱근 축척 · 50ms 는 휴리스틱 · G1 기본 목표는 MaxGCPauseMillis=200</text>
<line x1="12" y1="536" x2="752" y2="536" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="558" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="548" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">압박 계열의 끝 — 심각</text>
<rect x="313" y="548" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>

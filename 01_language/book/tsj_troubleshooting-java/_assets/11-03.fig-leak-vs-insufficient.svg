<title id="dt">갈림길은 회수가 아니라 바닥입니다</title><desc id="dd">메모리 누수와 메모리 부족을 힙 사용 곡선 두 판으로 가른 그림. 두 경우 모두 GC 가 회수하므로 톱니 모양 자체는 판별 근거가 되지 못한다. 갈라지는 것은 수집 직후 남는 잔량, 곧 바닥선이다. 위 판의 누수는 회차마다 바닥이 오르고(900 → 980 → 1050) 아래 판의 부족은 바닥이 평평하다. 다만 로그 몇 줄로는 어느 쪽도 증명되지 않아 긴 구간의 추세나 힙 덤프가 필요하다.</desc>
<rect width="800" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING JAVA · 11-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">갈림길은 회수가 아니라 바닥입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">둘 다 회수는 됩니다 — 수집 직후 남는 양이 오르는지만 봅니다</text>
<rect x="44" y="102" width="712" height="180" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="64" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">누수 — 바닥이 회차마다 오릅니다</text>
<text x="736" y="122" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">full GC 도 추세를 못 되돌립니다</text>

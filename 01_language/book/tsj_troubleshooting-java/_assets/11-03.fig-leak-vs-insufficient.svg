<text x="44" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">판별에 쓰지 않는 것 — 톱니 모양 · full GC 한 줄의 회수율</text>
<text x="756" y="478" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">확정은 힙 덤프(10장)</text>
<line x1="12" y1="496" x2="752" y2="496" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

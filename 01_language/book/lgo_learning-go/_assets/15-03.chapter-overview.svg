<title id="dt">퍼징은 버티는지를, 벤치마크는 얼마나 드는지를 묻습니다</title><desc id="dd">15-03 의 키워드 개념도. 첫 줄은 f.Add 로 넣은 시드를 퍼저가 비틀어 f.Fuzz 대상에 넣고, 실패한 입력은 testdata/fuzz 에 남아 회귀 테스트가 된다는 것이다. 둘째 줄은 이 노트의 퍼징이 -1 을 0.21초에 찾고, 고친 뒤 \r 이 섞인 빈 줄을 찾고, 다시 고친 뒤 2분 동안 446만 회를 통과했다는 것이다. 셋째 줄은 벤치마크가 -bench·-benchmem 으로 한 번당 시간·바이트·할당 횟수를 재고, 버퍼를 루프 밖으로 옮기면 할당이 서너 번으로 고르게 준다는 것이다. 넷째 줄은 버퍼 1바이트의 할당이 go1.24.4 에서 65,208회, Go 1.25 부터 3회라는 것이다.</desc>

<title id="dt">internal 패키지를 import 할 수 있는 범위</title><desc id="dd">foo/internal 은 부모인 foo 를 뿌리로 하는 트리 안의 코드만 import 할 수 있다. foo 자신, 형제 sibling, 그 아래 sibling/deep 까지 허용되고, 트리 밖인 모듈 루트와 bar 는 use of internal package not allowed 로 막힌다. 원문은 직계 부모와 형제만이라고 적었지만 규칙은 더 넓다.</desc>
<rect width="984" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TREE · 10-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">internal 패키지를 import 할 수 있는 범위</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">점선 안이 foo 를 뿌리로 하는 트리입니다. sibling/deep 은 노트가 더해 확인한 디렉터리입니다.</text>

<title id="dt">select 로 고르고, 고루틴은 끝나는 길을 둡니다</title><desc id="dd">12-02 의 키워드 개념도. 첫 줄은 여러 채널 가운데 준비된 case 를 select 가 무작위로 골라 기아와 교착을 피하고, for 로 감싸 for-select 루프가 되는 흐름이다. 둘째 줄은 채널과 뮤텍스를 내보내지 않고 클로저가 비즈니스 로직을 감싸 동시성을 API 밖에 두는 원칙이다. 셋째 줄은 Go 1.22 부터 루프 변수가 반복마다 새로 생기고, 그 밖의 바뀌는 변수는 매개변수로 복사해 넘긴다는 것이다. 넷째 줄은 끝나지 않는 고루틴이 누수가 되고, ctx.Done() 을 select 에 넣은 뒤 cancel 하면 끝난다는 흐름이다.</desc>
<rect width="984" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 12-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">select 로 고르고, 고루틴은 끝나는 길을 둡니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>
<rect x="23.18" y="130.0" width="21.64" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="34" y="144.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§1</text>

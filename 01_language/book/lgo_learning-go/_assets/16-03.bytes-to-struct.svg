<title id="dt">같은 16바이트를 Data 로 보고 Value 만 바이트 순서를 뒤집습니다</title><desc id="dd">네트워크에서 읽은 16바이트를 unsafe.Pointer 로 Data 구조체로 보면 앞 4바이트가 Value, 다음 10바이트가 Label, 그다음 1바이트가 Active, 마지막 1바이트가 패딩에 겹친다. 네트워크 바이트 순서는 빅 엔디언이라 리틀 엔디언 CPU 는 Value 를 거꾸로 읽는다. bits.ReverseBytes32 로 뒤집으면 8675309 가 되고, Label 은 Phone, Active 는 true 다.</desc>

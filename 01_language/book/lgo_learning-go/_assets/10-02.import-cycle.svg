<title id="dt">서로 import 하면 빌드되지 않습니다</title><desc id="dd">왼쪽 판은 pet 이 person 을, person 이 pet 을 import 한 순환으로 import cycle not allowed 로 실패한다. 가운데 판은 두 패키지를 하나로 합친 해결이고, 오른쪽 판은 순환을 일으키는 항목만 새 패키지로 옮겨 두 패키지가 그쪽만 import 하게 한 해결이다.</desc>
<rect width="984" height="452" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 10-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서로 import 하면 빌드되지 않습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표는 import 방향입니다. 오른쪽 판의 shared 는 설명을 위한 예입니다.</text>
<rect x="36" y="132" width="296" height="256" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="52" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">순환 · 컴파일 오류</text>
<rect x="60" y="188" width="104" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="112" y="213" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">pet</text>
<rect x="204" y="188" width="104" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="213" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">person</text>
<path d="M 164 202 L 200 202" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<path d="M 204 218 L 168 218" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<rect x="60" y="264" width="248" height="36" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="184" y="287" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">import cycle not allowed</text>
<text x="184" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">직접이든 간접이든 되돌아오면 금지</text>
<rect x="348" y="132" width="296" height="256" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="364" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">해결 1 · 하나로 합치기</text>
<rect x="396" y="204" width="200" height="40" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="496" y="229" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">pet + person</text>
<text x="496" y="282" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">너무 잘게 쪼갠 경우</text>
<text x="496" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서로 기대면 한 패키지일 가능성이 큼</text>
<rect x="660" y="132" width="296" height="256" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="676" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">해결 2 · 원인 항목 옮기기</text>
<rect x="684" y="188" width="104" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="736" y="213" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">pet</text>
<rect x="828" y="188" width="104" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="880" y="213" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">person</text>
<rect x="744" y="292" width="128" height="40" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="808" y="317" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">shared</text>
<path d="M 736 228 L 736 312 L 740 312" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<path d="M 880 228 L 880 312 L 876 312" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="808" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">두 패키지가 한쪽만 import</text>
<line x1="12" y1="396" x2="936" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="418" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="408" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">순환 import</text>
<rect x="261" y="408" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="283" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">빌드 실패</text>
<rect x="370" y="408" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="392" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">해결</text>
</svg>
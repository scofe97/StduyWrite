<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 540" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">switch 안의 break 가 빠져나가는 곳</title><desc id="dd">for 블록 안에 switch 블록이 든 예제 4-20 을 두 열로 나란히 그린 그림. 왼쪽은 case 7 의 break 가 switch 만 빠져나가 다음 i 로 이어지므로 8·9 가 계속 찍힌다. 오른쪽은 for 에 loop 라벨을 달고 break loop 로 바꿔, 같은 자리에서 for 블록 밖으로 빠져나가 루프가 끝난다.</desc>
<rect width="984" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · 04-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">switch 안의 break 가 빠져나가는 곳</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 case 7 에서 출발한 break 가 어느 상자 밖으로 나가는지 봅니다.</text>
<rect x="24" y="104" width="448" height="336" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.30)" stroke-width="0.9"/>
<text x="40" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">for i := 0; i &lt; 10; i++</text>
<rect x="48" y="144" width="400" height="176" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.30)" stroke-width="0.9"/>
<text x="64" y="168" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">switch i</text>
<rect x="72" y="184" width="352" height="96" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="88" y="210" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">case 7:</text>
<text x="88" y="234" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">fmt.Println("exit the loop!")</text>
<text x="88" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F0616D">break</text>
<path d="M 400 280 L 400 344" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)"/>
<text x="64" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">다음 i 로 → 8 is boring · 9 is boring</text>
<text x="64" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">switch 만 끝남</text>
<text x="248" y="476" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">for 블록 밖</text>
<rect x="512" y="104" width="448" height="336" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.30)" stroke-width="0.9"/>
<text x="528" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">loop: for i := 0; i &lt; 10; i++</text>
<rect x="536" y="144" width="400" height="176" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.30)" stroke-width="0.9"/>
<text x="552" y="168" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">switch i</text>
<rect x="560" y="184" width="352" height="96" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="576" y="210" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">case 7:</text>
<text x="576" y="234" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">fmt.Println("exit the loop!")</text>
<text x="576" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">break loop</text>
<path d="M 888 280 L 888 456" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="552" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">루프 끝 · exit the loop! 뒤 출력 없음</text>
<text x="552" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">for 까지 끝남</text>
<text x="736" y="476" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">for 블록 밖</text>
<line x1="12" y1="496" x2="936" y2="496" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="518" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="508" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">의도와 다른 착지점</text>
<rect x="274" y="508" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="296" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">의도한 착지점</text>
</svg>
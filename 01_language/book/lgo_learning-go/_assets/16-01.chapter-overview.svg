<title id="dt">리플렉션은 타입 확인을 실행 중으로 미룹니다</title><desc id="dd">16-01 의 키워드 개념도. 첫 줄은 변수에 TypeOf 를 불러 reflect.Type 을 얻고, Kind 가 무엇으로 이뤄졌는지 알려 주며 종류에 맞지 않는 메서드는 패닉을 낸다는 것이다. 둘째 줄은 구조체의 NumField·Field 로 StructField 를 얻어 이름·타입·태그를 읽는다는 것이다. 셋째 줄은 포인터를 ValueOf 에 넘기고 Elem 으로 가서 SetInt 로 원래 변수를 바꾼다는 것이다. 넷째 줄은 reflect.Type 에서 New·MakeSlice 로 새 값을 만들고 Interface 와 타입 단언으로 되돌린다는 것이다. 다섯째 줄은 nil 인 *int 를 담은 인터페이스가 == nil 로는 false 이지만 IsValid·IsNil 로는 값이 nil 임을 안다는 것이다.</desc>

<title id="dt">리플렉션이 위치를, unsafe 가 쓰기를 맡아 막힌 필드에 닿습니다</title><desc id="dd">HasUnexportedField 는 32바이트로 A 가 0, 내보내지 않은 b 가 8, C 가 16 바이트째에 있다. 다른 패키지는 b 를 직접 쓸 수 없지만, 리플렉션의 FieldByName 이 b 의 StructField 와 Offset 8 을 돌려준다. 구조체 포인터를 unsafe.Pointer 로 바꿔 unsafe.Add 로 8 을 더하고 *bool 로 바꾸면 b 에 true 를 쓸 수 있다.</desc>
<rect width="984" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 16-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">리플렉션이 위치를, unsafe 가 쓰기를 맡아 막힌 필드에 닿습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">윗줄은 구조체의 메모리, 아랫줄은 b 의 자리를 찾아 쓰는 순서입니다.</text>
<text x="162" y="165" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">HasUnexportedField</text>
<rect x="177" y="140" width="174" height="40" rx="3" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="264.0" y="165" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">A int</text>
<rect x="353" y="140" width="20" height="40" rx="3" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="363.0" y="165" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">b</text>
<rect x="375" y="141" width="152" height="38" rx="3" fill="none" stroke="#5E6B7E" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="451.0" y="165" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">pad</text>
<rect x="529" y="140" width="350" height="40" rx="3" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="704.0" y="165" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">C string</text>
<text x="176" y="130" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">0</text>
<text x="352" y="130" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">8</text>
<text x="528" y="130" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">16</text>
<text x="880" y="130" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">32</text>
<rect x="28" y="292" width="200" height="60" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="128.0" y="318" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">FieldByName("b")</text>
<text x="128.0" y="338" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">reflect.StructField</text>
<rect x="264" y="292" width="200" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="364.0" y="318" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">sf.Offset == 8</text>
<text x="364.0" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">위치만 알려 줌</text>
<rect x="500" y="292" width="200" height="60" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="600.0" y="318" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">unsafe.Add(start, 8)</text>
<text x="600.0" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">구조체 포인터 + 8</text>
<rect x="736" y="292" width="200" height="60" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.1"/>
<text x="836.0" y="318" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">*(*bool)(pos) = true</text>
<text x="836.0" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">막힌 필드에 씀</text>
<path d="M 230 322.0 L 260 322.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 466 322.0 L 496 322.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 702 322.0 L 732 322.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 836.0 290 L 836.0 256 L 363.0 256 L 363.0 184" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<text x="373.0" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">이 칸을 가리킴</text>

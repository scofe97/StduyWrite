<title id="dt">태그가 열 이름을, Kind 가 칸 변환을 정합니다</title><desc id="dd">윗줄은 읽는 방향이다. csv.ReadAll 이 CSV 텍스트를 [][]string 으로 읽고, Unmarshal 이 머리글로 열 위치를 잡은 뒤 행마다 reflect.New 로 구조체를 만들어 unmarshalOne 으로 채우고 Append 로 붙여 []MyData 를 만든다. 아랫줄은 쓰는 방향이다. Marshal 이 csv 태그로 머리글을, 필드 Kind 로 각 칸을 만들어 [][]string 을 돌려주고 csv.Writer 가 다시 CSV 텍스트로 쓴다.</desc>

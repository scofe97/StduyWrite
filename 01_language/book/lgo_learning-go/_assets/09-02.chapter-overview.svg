<title id="dt">오류를 감싸면 트리가 되고, Is·As 가 그 안을 찾습니다</title><desc id="dd">09-02 의 키워드 개념도. 첫 줄은 fmt.Errorf 의 %w 가 원래 오류를 품은 새 오류를 만들고 errors.Unwrap 이 그것을 꺼내지만, 보통은 Is·As 로 찾는다는 것이다. 둘째 줄은 여러 오류를 errors.Join 으로 묶으면 Unwrap() []error 를 구현하는 오류가 되어 errors.Unwrap 이 nil 을 돌려준다는 것이다. 셋째 줄은 errors.Is 가 트리를 내려가며 == 나 Is 메서드로 값을 찾고, errors.As 가 타입이 맞는 오류를 변수에 꺼낸다는 것이다. 넷째 줄은 이름 붙은 반환 값 err 를 defer 클로저가 한 번에 감싼다는 것이다.</desc>
<rect width="984" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 09-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">오류를 감싸면 트리가 되고, Is·As 가 그 안을 찾습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

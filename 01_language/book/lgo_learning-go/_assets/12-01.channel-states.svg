<title id="dt">채널 상태마다 읽기·쓰기·닫기가 하는 일</title><desc id="dd">원문 표 12-1 을 go1.25.1 에서 여섯 상태로 나눠 확인한 결과. 버퍼 없는 열린 채널은 읽기·쓰기 모두 상대 고루틴을 기다린다. 닫힌 채널은 읽으면 남은 값을, 다 비면 제로 값과 false 를 돌려주고, 쓰거나 다시 닫으면 panic 이다. 버퍼 있는 열린 채널은 비었을 때 읽기가, 가득 찼을 때 쓰기가 기다린다. nil 채널은 읽기·쓰기가 영원히 멈추고 닫으면 panic 이다.</desc>
<rect width="980" height="404" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">MATRIX · 12-01 §3</text>

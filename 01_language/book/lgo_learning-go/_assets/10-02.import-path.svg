<title id="dt">import 경로는 디렉터리를, 부르는 이름은 package 절을 따릅니다</title><desc id="dd">main.go 가 import 한 경로는 go.mod 의 모듈 경로 github.com/learning-go-book-2e/package_example 에 모듈 안의 디렉터리 /do-format 을 붙인 것이다. 그 디렉터리의 formatter.go 첫 줄이 package format 이므로 main 은 do-format 이 아니라 format.Number 로 부른다.</desc>
<rect width="984" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 10-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">import 경로는 디렉터리를, 부르는 이름은 package 절을 따릅니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">디렉터리 이름 do-format 은 Go 식별자가 될 수 없어서 package 절이 format 으로 바꿨습니다.</text>
<rect x="36" y="128" width="640" height="44" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="52" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">github.com/learning-go-book-2e/package_example</text>
<rect x="676" y="128" width="272" height="44" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="692" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">/do-format</text>
<text x="356" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">모듈 경로 · go.mod 의 module 줄</text>
<text x="812" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">모듈 안의 패키지 경로</text>
<rect x="36" y="244" width="176" height="88" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="124" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">import 경로</text>
<text x="124" y="302" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">.../do-format</text>
<path d="M 214 288 L 280 288" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="248" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">가리킴</text>
<rect x="284" y="244" width="176" height="88" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>

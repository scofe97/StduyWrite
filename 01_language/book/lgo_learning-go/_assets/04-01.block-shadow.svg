<title id="dt">블록은 겹겹이 들어 있다</title><desc id="dd">universe 블록이 패키지 블록을, 패키지 블록이 파일 블록을, 파일 블록이 함수 블록을, 함수 블록이 if 블록을 담는 겹 구조. 안쪽 블록은 바깥 블록의 식별자를 쓸 수 있고, 같은 이름을 새로 선언하면 그 블록이 끝날 때까지 바깥 것을 가린다. if 블록의 x := 5 가 함수 블록의 x 를 가리는 것이 예제 4-1 이다.</desc>
<rect width="984" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · 04-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">블록은 겹겹이 들어 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바깥 상자일수록 넓은 블록입니다. 오른쪽 글은 그 블록에 선언된 이름입니다.</text>
<rect x="24" y="104" width="936" height="384" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.30)" stroke-width="0.9"/>
<text x="40" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">universe 블록</text>
<text x="944" y="130" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">true · false · int · string · nil · make</text>
<rect x="48" y="160" width="888" height="320" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.30)" stroke-width="0.9"/>
<text x="64" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">패키지 블록</text>
<text x="920" y="186" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">함수 밖에 선언한 변수 · 상수 · 타입 · 함수</text>
<rect x="72" y="216" width="840" height="256" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.30)" stroke-width="0.9"/>
<text x="88" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">파일 블록</text>
<text x="896" y="242" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">import 한 패키지 이름 fmt</text>
<rect x="96" y="272" width="792" height="192" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.30)" stroke-width="0.9"/>
<text x="112" y="298" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">함수 블록 · main</text>
<text x="872" y="298" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">x := 10  · 매개변수도 여기</text>
<rect x="120" y="328" width="744" height="128" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="136" y="354" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">if 블록</text>
<text x="848" y="354" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">x := 5  → 바깥 x 를 가림</text>
<text x="136" y="388" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">fmt.Println(x) → 5</text>
<text x="136" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">블록이 끝나면 다시 10</text>
<line x1="12" y1="504" x2="936" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="526" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="516" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가리는 선언이 있는 블록</text>
<rect x="313" y="516" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="335" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바깥 블록</text>
</svg>
<title id="dt">cgo 호출 비용은 Go 1.26 에서 줄었지만 여전히 고정비가 큽니다</title><desc id="dd">아무 일도 하지 않는 C 함수를 한 번 부르는 데 든 나노초. 막대는 다섯 번 측정의 중앙값, 가는 세로선은 최솟값에서 최댓값까지다. go1.24.4 26.37ns, go1.25.1 25.49ns 에서 go1.26.8 17.93ns, go1.27.1 19.42ns 로 내려갔다. Go 1.26 릴리스 노트는 cgo 호출의 기본 비용이 약 30% 줄었다고 적는다.</desc>

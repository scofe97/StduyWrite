<title id="dt">같은 코드도 Go 1.25 부터 작은 버퍼는 할당이 사라집니다</title><desc id="dd">FileLen 벤치마크를 버퍼 크기 여섯 가지로 돌린 한 번당 힙 할당 횟수. 빈 점은 go1.24.4, 채운 점은 go1.27.1 이다. 1바이트는 65,208회에서 3회로, 10바이트는 6,525회에서 3회로 줄었고 100바이트 이상은 657 · 70 · 11 · 5회로 같다. Go 1.25 부터 크기가 변수인 작은 make 도 스택에 둘 수 있게 되어, 이 노트의 측정에서는 32바이트까지 힙 할당이 없었다.</desc>

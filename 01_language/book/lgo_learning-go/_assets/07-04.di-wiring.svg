<title id="dt">구체 타입을 아는 곳은 main 뿐이다</title><desc id="dd">의존성 주입 웹 앱의 연결도. LoggerAdapter(LogOutput) 와 SimpleDataStore 는 SimpleLogic 이 필드 타입으로 쓰는 Logger·DataStore 인터페이스를, SimpleLogic 은 컨트롤러를 위해 정의한 Logic 인터페이스를 선언 없이 만족한다. Controller.SayHello 는 메서드 값으로 http.HandleFunc 에 넘어가 http.HandlerFunc 가 된다. 이 모든 연결은 main 이 하며, 다른 구성 요소는 인터페이스만 안다.</desc>

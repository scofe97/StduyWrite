<title id="dt">취소는 닫히는 채널로 전해지고 이유는 Cause 에 남습니다</title><desc id="dd">14-02 의 키워드 개념도. 첫 줄은 WithCancel 이 돌려준 취소 함수를 defer 로 걸고, 부르지 않으면 메모리와 고루틴이 샌다는 것이다. 둘째 줄은 실패한 고루틴이 취소 함수를 부르면 Done 채널이 닫혀 select 가 깨어나고 다른 고루틴의 HTTP 요청도 함께 끝난다는 흐름이다. 셋째 줄은 WithCancelCause 의 취소 함수에 넘긴 첫 오류를 context.Cause 가 돌려주고 두 번째 오류는 덮지 않으며, Err 는 context canceled 라는 것이다.</desc>
<rect width="984" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 14-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">취소는 닫히는 채널로 전해지고 이유는 Cause 에 남습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

<title id="dt">저장소 안에 모듈, 모듈 안에 패키지</title><desc id="dd">저장소는 소스 코드가 놓이는 버전 관리 장소다. 그 안에서 go.mod 가 있는 디렉터리 트리가 모듈이 되며, 모듈은 한 단위로 배포되고 버전이 매겨진다. 모듈 안의 각 디렉터리가 패키지다. 원문 package_example 에서는 루트의 main, math, do-format 디렉터리의 format 패키지가 한 모듈에 들어 있다.</desc>
<rect width="984" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · 10-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">저장소 안에 모듈, 모듈 안에 패키지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가장 바깥이 저장소, 가운데가 모듈, 안쪽 칸이 패키지입니다. 원문은 한 저장소에 모듈 하나를 권합니다.</text>

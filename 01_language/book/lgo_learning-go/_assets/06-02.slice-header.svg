<title id="dt">함수에 넘긴 slice 는 헤더만 복사된다</title><desc id="dd">s := make([]int, 3, 4) 를 세 함수에 차례로 넘긴 상태도. slice 는 길이·용량·포인터 세 필드라 함수에는 이 헤더의 사본이 간다. modify 의 원소 변경은 같은 배열이라 main 에 보인다. appendIn 은 용량 안이라 4 가 같은 배열에 들어가지만 main 의 len 은 3 이라 보이지 않는다. appendOut 은 용량을 넘어 새 배열(cap 8)을 만들므로 그 뒤 s[0] = 99 도 main 에 보이지 않는다.</desc>
<rect width="984" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">STATE · 06-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">함수에 넘긴 slice 는 헤더만 복사된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칸 위 괄호는 main 의 s, 칸 아래 괄호는 함수 안 사본입니다. 점선은 len 을 넘어 cap 까지 닿는 구간입니다.</text>
<rect x="24" y="104" width="924" height="124" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="44" y="134" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">1. modify(s)</text>
<text x="44" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">s[0] = 10</text>

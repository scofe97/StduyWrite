<title id="dt">firstPerson 과 무엇이 되는가</title><desc id="dd">firstPerson{name string; age int} 을 기준으로 다섯 struct 와의 타입 변환·== 비교·대입 가능 여부를 가른 행렬. 필드 이름·순서·타입이 모두 같은 secondPerson 은 변환만 되고, 순서·이름·개수가 다른 셋은 아무것도 안 된다. 필드가 같은 익명 struct 는 변환 없이 비교와 대입까지 된다.</desc>

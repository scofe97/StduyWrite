<title id="dt">모듈 종류에 따라 패키지를 다르게 둡니다</title><desc id="dd">왼쪽은 애플리케이션으로만 쓰는 모듈이다. 루트는 main 패키지로 두고 코드를 최소로 하며 로직은 internal 에 모아 누구도 구현에 기대지 못하게 한다. 오른쪽은 라이브러리 모듈이다. 루트 패키지 이름을 저장소 이름과 맞추고, 딸린 도구는 cmd 아래 바이너리마다 디렉터리를 두며, 모듈 안에서만 나눌 기호는 internal 에 둔다.</desc>
<rect width="984" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TREE · 10-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">모듈 종류에 따라 패키지를 다르게 둡니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">myapp · mylib · mytool 은 설명을 위한 예입니다.</text>
<text x="252" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">애플리케이션 모듈</text>
<text x="732" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">라이브러리 모듈</text>
<line x1="492" y1="124" x2="492" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<rect x="148" y="164" width="208" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="252" y="188" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">myapp/</text>
<text x="252" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">package main · 최소 코드</text>
<rect x="148" y="276" width="208" height="56" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="252" y="300" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">internal/</text>
<text x="252" y="320" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">로직 전부</text>
<line x1="252" y1="220" x2="252" y2="248" stroke="#5E6B7E" stroke-width="1.2"/>
<line x1="252" y1="248" x2="252" y2="248" stroke="#5E6B7E" stroke-width="1.2"/>
<path d="M 252 248 L 252 272" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="628" y="164" width="208" height="56" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="732" y="188" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">mylib/</text>
<text x="732" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">package mylib · 저장소 이름</text>
<rect x="516" y="276" width="208" height="56" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<text x="620" y="300" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">cmd/mytool/</text>
<text x="620" y="320" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">package main · 도구</text>
<rect x="740" y="276" width="208" height="56" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="844" y="300" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">internal/</text>
<text x="844" y="320" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">모듈 안에서만 공유</text>
<line x1="732" y1="220" x2="732" y2="248" stroke="#5E6B7E" stroke-width="1.2"/>
<line x1="620" y1="248" x2="844" y2="248" stroke="#5E6B7E" stroke-width="1.2"/>
<path d="M 620 248 L 620 272" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<path d="M 844 248 L 844 272" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="252" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">main 은 internal 을 부르기만 함</text>
<text x="732" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">import 이름과 패키지 이름이 같음</text>
<line x1="12" y1="428" x2="936" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="450" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="440" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공개 루트 패키지</text>
<rect x="261" y="440" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="283" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">감춘 코드</text>
<rect x="370" y="440" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="392" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바이너리</text>
</svg>
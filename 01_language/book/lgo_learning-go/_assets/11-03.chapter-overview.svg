<title id="dt">파일은 embed 로, 코드는 generate 로 빌드 앞에 준비합니다</title><desc id="dd">11-03 의 키워드 개념도. 윗줄은 지원 파일이 //go:embed 주석을 거쳐 string, []byte, embed.FS 타입의 패키지 수준 변수에 담기고 컴파일 때 단일 바이너리에 들어가는 길이다. 가운데 줄은 기본으로 빠지는 숨김 파일을 dir/* 는 맨 위 디렉터리만, all:dir 는 모든 하위 디렉터리까지 넣는다는 것이다. 아랫줄은 //go:generate 주석을 go generate 가 읽어 protoc 나 stringer 를 실행하고, 만든 소스 코드를 커밋하는 길이다.</desc>
<rect width="984" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 11-03 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">파일은 embed 로, 코드는 generate 로 빌드 앞에 준비합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

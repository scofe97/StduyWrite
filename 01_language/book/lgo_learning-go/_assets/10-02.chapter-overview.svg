<title id="dt">이름의 모양과 디렉터리 위치가 공개 범위를 정합니다</title><desc id="dd">10-02 의 키워드 개념도. 첫 줄은 대문자로 시작한 식별자가 내보내지고, 다른 패키지는 import 경로로 가져오며, 부르는 이름은 패키지 절이 정한다는 것이다. 둘째 줄은 util 같은 이름 대신 기능을 말하는 명사로 짓고, 이름이 겹치면 import 할 때 바꾼다는 것이다. 셋째 줄은 기호 이름으로 시작하는 // 주석을 go doc 과 pkgsite 가 문서로 보여 준다는 것이다. 넷째 줄은 internal 패키지가 부모 트리 안에서만 import 되고 패키지끼리 서로 import 할 수 없다는 것이다. 다섯째 줄은 애플리케이션은 로직을 internal 에, 라이브러리는 루트를 저장소 이름과 같은 패키지로 둔다는 것이다.</desc>

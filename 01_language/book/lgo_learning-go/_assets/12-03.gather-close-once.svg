<title id="dt">처리 고루틴 num 개가 out 에 쓰고, 감시 고루틴이 Wait 뒤에 한 번만 닫습니다</title><desc id="dd">processAndGather 의 구조. 처리 고루틴 num 개가 in 채널을 나눠 읽고 processor 결과를 버퍼 크기 num 인 out 채널에 쓴다. 각 처리 고루틴은 끝날 때 defer wg.Done() 으로 수를 줄인다. 감시 고루틴은 wg.Wait() 로 모두 끝나기를 기다린 뒤 close(out) 을 한 번만 부른다. 함수는 out 을 for-range 로 읽다가 닫히고 비면 모은 result 를 돌려준다.</desc>

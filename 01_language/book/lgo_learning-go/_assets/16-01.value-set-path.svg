<title id="dt">포인터를 넘겨 Elem 으로 가야 값을 바꿀 수 있습니다</title><desc id="dd">윗줄은 성공하는 길이다. 변수 i 의 포인터를 reflect.ValueOf 에 넘기면 종류가 ptr 인 값을 얻고, Elem 으로 가리키는 값에 가면 종류 int 에 CanSet 이 true 다. SetInt(20) 을 부르면 원래 변수 i 가 20 이 된다. 아랫줄은 i 를 그대로 넘긴 길로, 얻은 값은 CanSet 이 false 이고 SetInt 는 unaddressable value 패닉을 낸다.</desc>
<rect width="984" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 16-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">포인터를 넘겨 Elem 으로 가야 값을 바꿀 수 있습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">윗줄은 포인터를 넘긴 길, 아랫줄은 값을 그대로 넘긴 길입니다.</text>
<text x="28" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">포인터를 넘기면</text>
<rect x="28" y="140" width="200" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="128.0" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">reflect.ValueOf(&amp;i)</text>
<text x="128.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Kind() == ptr</text>
<rect x="264" y="140" width="200" height="60" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.4"/>
<text x="364.0" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">.Elem()</text>
<text x="364.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Kind() == int · CanSet true</text>
<rect x="500" y="140" width="200" height="60" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="600.0" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">.SetInt(20)</text>
<text x="600.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가리키는 값을 바꿈</text>
<rect x="736" y="140" width="200" height="60" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="836.0" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">i == 20</text>
<text x="836.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원래 변수가 바뀜</text>
<path d="M 230 170.0 L 260 170.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 466 170.0 L 496 170.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 702 170.0 L 732 170.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="28" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">값을 그대로 넘기면</text>
<rect x="28" y="284" width="200" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="128.0" y="310" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">reflect.ValueOf(i)</text>
<text x="128.0" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사본의 값</text>
<rect x="264" y="284" width="200" height="60" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="364.0" y="310" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">CanSet() == false</text>
<text x="364.0" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">주소를 쓸 수 없음</text>
<rect x="500" y="284" width="200" height="60" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="600.0" y="310" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">.SetInt(20)</text>
<text x="600.0" y="330" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">panic: unaddressable</text>
<path d="M 230 314.0 L 260 314.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 466 314.0 L 496 314.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<line x1="12" y1="384" x2="936" y2="384" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="406" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="396" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Elem 으로 간 값</text>
<rect x="287" y="396" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바꾸기</text>
<rect x="370" y="396" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="392" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">결과</text>
<rect x="440" y="396" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="462" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">막힘</text>
<rect x="510" y="396" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="532" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패닉</text>
</svg>
<title id="dt">테스트도 같은 패키지의 Go 코드이고 go test 가 돌립니다</title><desc id="dd">15-01 의 키워드 개념도. 첫 줄은 테스트 함수가 어긋남을 t.Error 로 알리고 이어서 검사하거나, 뒤 검사가 막히면 t.Fatal 로 그 테스트만 멈춘다는 것이다. 둘째 줄은 TestMain 이 패키지에 한 번 불려 m.Run 으로 테스트 함수를 돌리고, 반환하면 Go 1.15 부터 그 결과로 종료 코드가 정해진다는 것이다. 셋째 줄은 패키지 인자를 주어 돌릴 때(go test . 포함) 통과한 결과가 캐시되고 코드나 testdata 가 바뀌면 다시 돈다는 것이다. 넷째 줄은 패키지 이름에 _test 를 붙이면 내보낸 것만 써서 공개 API 를 시험한다는 것이다. 다섯째 줄은 cmp.Diff 가 어긋난 필드를 보여 주고 IgnoreFields 로 시각 필드를 뺀다는 것이다.</desc>

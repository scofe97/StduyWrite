<title id="dt">같은 Filter 도 리플렉션판은 제네릭판보다 수십 배 느립니다</title><desc id="dd">원소 1,000개 slice 를 거르는 Filter 의 한 번당 나노초. 리플렉션판은 문자열 108,951ns·정수 110,065ns 로, 제네릭판 1,848ns·1,120ns 와 손으로 쓴 판 1,708ns·1,153ns 보다 약 59배와 98배 길다. 리플렉션판은 한 번에 2,219번·2,503번 할당하고 나머지는 한 번 할당한다. 값축은 0 에서 시작한다.</desc>

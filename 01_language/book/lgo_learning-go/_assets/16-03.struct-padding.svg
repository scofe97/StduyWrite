<title id="dt">필드 순서만 바꿔도 패딩이 줄어 구조체가 작아집니다</title><desc id="dd">세 구조체의 메모리 배치를 1바이트 칸으로 그렸다. 색 칸은 필드, 점선 칸은 컴파일러가 넣은 패딩이다. bool 두 개가 int64 앞뒤에 떨어져 있으면 각각 8바이트 칸을 차지해 24바이트가 되고, bool 둘을 모으면 16바이트다. 맨 아래 bool 셋만 있는 구조체는 가장 큰 정렬값이 1이라 패딩 없이 3바이트다. 굵은 세로선은 8바이트 경계다.</desc>

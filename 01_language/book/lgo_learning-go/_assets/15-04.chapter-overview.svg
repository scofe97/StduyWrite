<title id="dt">가짜는 인터페이스 자리에 끼우고 진짜와의 어긋남은 통합 테스트가 봅니다</title><desc id="dd">15-04 의 키워드 개념도. 첫 줄은 Logic 이 인터페이스로 받은 Entities 자리에 임베딩이나 함수 필드로 만든 스텁을 끼워 사례마다 정해 둔 답을 돌려준다는 것이다. 둘째 줄은 RemoteSolver 에 httptest 서버의 URL 을 넘기고, 사례마다 공유 변수로 서버의 응답을 정해 서버 없이 시험한다는 것이다. 셋째 줄은 //go:build integration 파일을 -tags integration 으로 켜 진짜 계산기 서버에 붙이자, 소스로 빌드한 서버의 오류 문구가 달라 case3 이 실패했다는 것이다. 넷째 줄은 다섯 고루틴의 counter++ 를 -race 가 race.go:12 의 레이스로 짚고, 잠금이나 atomic 으로 고친다는 것이다.</desc>

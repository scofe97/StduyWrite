<line x1="372" y1="212" x2="412" y2="212" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="548" y1="212" x2="588" y2="212" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="724" y1="212" x2="764" y2="212" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="60" y="184" width="136" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="128" y="210" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">v1.0.0</text>
<text x="128" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">내려 둔 판</text>
<rect x="236" y="184" width="136" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="304" y="210" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">v1.1.0</text>
<text x="304" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">버그 있음</text>
<rect x="412" y="184" width="136" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="480" y="210" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">v1.1.1</text>
<text x="480" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">v1.1.0 패치</text>
<rect x="588" y="184" width="136" height="56" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="656" y="210" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">v1.2.0</text>
<text x="656" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">함수 추가</text>
<rect x="764" y="184" width="136" height="56" rx="8" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.4"/>
<text x="832" y="210" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">v1.2.1</text>
<text x="832" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">v1.2.0 패치</text>
<rect x="64" y="268" width="128" height="28" rx="4" fill="#E3B34114" stroke="#E3B341" stroke-width="1.0"/>
<text x="128" y="287" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">-u=patch · 그대로</text>

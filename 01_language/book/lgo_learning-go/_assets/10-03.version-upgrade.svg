<text x="392" y="302" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">go get -u=patch</text>
<path d="M 288 242 L 288 332 L 832 332 L 832 244" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="568" y="350" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">go get -u</text>
<rect x="60" y="424" width="320" height="56" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.1"/>
<text x="220" y="450" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">.../simpletax/v2 · v2.0.0</text>
<text x="220" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">API 가 바뀐 판</text>
<text x="404" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">메이저가 바뀌면 import 경로 끝에 /v2</text>
<text x="404" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">다른 패키지라 v1 과 함께 import 할 수 있음</text>

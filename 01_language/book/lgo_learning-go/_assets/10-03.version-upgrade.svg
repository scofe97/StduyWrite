<title id="dt">-u=patch 와 -u 는 올리는 거리가 다릅니다</title><desc id="dd">simpletax 의 v1 판 다섯을 한 줄에 두었다. v1.1.0 에서 go get -u=patch 는 같은 마이너의 패치인 v1.1.1 로, go get -u 는 가장 최신인 v1.2.1 로 올린다. v1.0.0 에서는 같은 마이너의 패치가 없어 -u=patch 로는 그대로다. 아래 v2.0.0 은 모듈 경로가 /v2 로 끝나는 다른 패키지라 v1 과 따로 import 된다.</desc>
<rect width="984" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">STATE · 10-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">-u=patch 와 -u 는 올리는 거리가 다릅니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">v1.1.1·v1.2.0·v1.2.1 은 원문이 가정한 판입니다(실제 목록은 v1.0.0·v1.1.0).</text>

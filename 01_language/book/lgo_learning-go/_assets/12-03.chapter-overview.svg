<title id="dt">채널·select·context·sync 를 조합해 패턴을 만듭니다</title><desc id="dd">12-03 의 키워드 개념도. 첫 줄은 크기가 정해진 버퍼 채널이 고루틴 수만큼 결과를 모으는 재료이자, 토큰으로 요청 수를 제한해 넘치면 거절하는 백프레셔의 재료라는 것이다. 둘째 줄은 select 에 닫힌 채널 대신 nil 을 넣어 case 를 끄고, ctx.Done() 을 넣어 시간 제한을 거는 두 조합이다. 셋째 줄은 sync.WaitGroup 의 Add·Done·Wait 로 모든 고루틴을 기다린 뒤 감시 고루틴이 채널을 한 번만 닫는 흐름이다. 넷째 줄은 sync.Once 가 초기화를 한 번만 하고, Go 1.21 의 OnceValue 가 결과까지 캐시하는 흐름이다.</desc>

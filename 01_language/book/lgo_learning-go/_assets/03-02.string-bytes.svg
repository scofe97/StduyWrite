<title id="dt">문자열 인덱스는 바이트를 센다</title><desc id="dd">문자열 "Hello 🌞" 을 바이트 열 칸으로 펼치고 그 위에 코드 포인트(룬) 일곱 개의 경계를 괄호로 묶은 그림. 해 이모지 하나가 UTF-8 로 네 바이트라서 len 은 10 이다. s[4:7] 은 4·5·6번 바이트를 잘라 이모지의 첫 바이트만 가져오고, s[6:] 은 네 바이트를 모두 가져와 이모지 하나가 된다.</desc>

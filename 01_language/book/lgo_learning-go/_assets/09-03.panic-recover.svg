<title id="dt">div60(0) 에서 panic 이 붙잡히는 순서</title><desc id="dd">반복문의 셋째 값 0 으로 div60 을 부른 한 번을 시간순으로 그린 시퀀스. 60 / 0 에서 panic 이 나면 div60 의 나머지는 실행되지 않고 등록된 defer 만 돈다. defer 안의 recover 가 panic 값 runtime error: integer divide by zero 를 돌려받아 찍으면 panic 은 멈추고, div60 은 정상으로 돌아가 반복문이 6 으로 이어진다.</desc>
<rect width="984" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 09-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">div60(0) 에서 panic 이 붙잡히는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위에서 아래로 시간이 흐릅니다. recover 는 defer 안에서만 panic 을 붙잡습니다.</text>

<title id="dt">모듈이 배포의 단위이고 go.mod 가 그 약속입니다</title><desc id="dd">10-01 의 키워드 개념도. 첫 줄은 저장소가 모듈을 담고 모듈이 디렉터리 단위의 패키지를 담는 세 단계다. 둘째 줄은 go mod init 이 전역으로 유일한 모듈 경로로 go.mod 를 만들고, 그 안의 go 줄이 최소 Go 버전이자 언어 수준이라는 것이다. 셋째 줄은 go 줄이 설치된 Go 보다 새로우면 기본 auto 는 그 버전을 내려받아 빌드하고, GOTOOLCHAIN=local 은 오류로 멈춘다는 것이다. 넷째 줄은 require 의 둘째 묶음에 붙는 // indirect 가 기능 차이 없는 표시라는 것이다.</desc>
<rect width="984" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 10-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">모듈이 배포의 단위이고 go.mod 가 그 약속입니다</text>

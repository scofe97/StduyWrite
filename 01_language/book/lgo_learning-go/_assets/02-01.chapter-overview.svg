<title id="dt">사전 선언 타입 다섯 갈래와 제로 값</title><desc id="dd">Go 에 미리 선언된 타입을 불리언·정수·부동소수점·복소수·문자열 다섯 갈래로 나눈 트리. 1단은 갈래와 그 안의 타입 이름, 2단은 값을 주지 않고 선언했을 때의 제로 값과 리터럴의 기본 타입이다. 정수 갈래의 기본 타입 int 가 이 편에서 가장 자주 쓰는 선택이다.</desc>

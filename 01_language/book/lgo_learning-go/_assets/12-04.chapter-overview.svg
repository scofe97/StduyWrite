<title id="dt">값이 흐르면 채널로, 필드를 나누면 뮤텍스로</title><desc id="dd">12-04 의 키워드 개념도. 첫 줄은 서비스 A 와 B 를 고루틴 둘로 동시에 부르고, 두 결과를 합쳐 서비스 C 에 넘기며, 전체를 50밀리초 안에 끝내는 파이프라인이다. 둘째 줄은 값이 고루틴 여럿을 거치며 변환될 때 채널을 써서 데이터 흐름을 드러내는 경우다. 셋째 줄은 struct 필드를 나눠 읽고 쓰기만 할 때 RWMutex 를 쓰되, Go 의 뮤텍스는 재진입하지 않아 같은 락을 두 번 잡으면 교착이라는 점이다. 넷째 줄은 sync.Map 과 atomic 은 특수한 경우와 전문가용이고, 대개 map 과 RWMutex 로 충분하다는 결론이다.</desc>

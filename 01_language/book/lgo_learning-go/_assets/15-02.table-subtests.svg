<title id="dt">사례 한 줄이 하위 테스트 하나가 되고 이름으로 골라 돌립니다</title><desc id="dd">TestDoMathTable 의 사례 슬라이스 다섯 원소가 t.Run 으로 하위 테스트 다섯이 된다. 결과는 TestDoMathTable/사례이름 으로 따로 보고되고, -run 'TestDoMathTable/bad_division' 은 그 하위 테스트 하나만 돌린다. multiplication 사례는 2 와 2 라 더하기로 잘못 짠 곱셈도 4 를 내어 통과한다.</desc>
<rect width="984" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TREE · 15-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">사례 한 줄이 하위 테스트 하나가 되고 이름으로 골라 돌립니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">사례 이름이 하위 테스트 이름이 됩니다. -run 은 / 로 나뉜 이름의 부분마다 맞춥니다.</text>
<line x1="492" y1="160" x2="492" y2="196" stroke="#5E6B7E" stroke-width="1.0"/>
<line x1="108" y1="196" x2="876" y2="196" stroke="#5E6B7E" stroke-width="1.0"/>
<line x1="108" y1="196" x2="108" y2="232" stroke="#5E6B7E" stroke-width="1.0"/>
<line x1="300" y1="196" x2="300" y2="232" stroke="#5E6B7E" stroke-width="1.0"/>
<line x1="492" y1="196" x2="492" y2="232" stroke="#5E6B7E" stroke-width="1.0"/>
<line x1="684" y1="196" x2="684" y2="232" stroke="#5E6B7E" stroke-width="1.0"/>
<line x1="876" y1="196" x2="876" y2="232" stroke="#5E6B7E" stroke-width="1.0"/>
<rect x="352" y="116" width="280" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="492" y="143" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">TestDoMathTable</text>
<rect x="20" y="232" width="176" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="108" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">addition</text>
<text x="108" y="274" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2 + 2 = 4</text>
<rect x="212" y="232" width="176" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="300" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">subtraction</text>
<text x="300" y="274" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2 - 2 = 0</text>
<rect x="404" y="232" width="176" height="52" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.1"/>
<text x="492" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">multiplication</text>
<text x="492" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">2 * 2 → 4 · 버그 가림</text>
<rect x="596" y="232" width="176" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="684" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">division</text>
<text x="684" y="274" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2 / 2 = 1</text>
<rect x="788" y="232" width="176" height="52" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="876" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">bad_division</text>
<text x="876" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">-run 이 고름</text>
<text x="964" y="328" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">go test -v -run 'TestDoMathTable/bad_division'</text>
<text x="964" y="350" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">→ TestDoMathTable/bad_division 하나만 PASS</text>
<line x1="12" y1="400" x2="936" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="422" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="412" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">-run 이 고른 하위 테스트</text>
<rect x="352" y="412" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="374" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">통과했지만 버그를 가린 사례</text>
</svg>
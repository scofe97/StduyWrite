<title id="dt">파일을 gzip 리더로 감싸도 countLetters 는 io.Reader 만 봅니다</title><desc id="dd">위 줄은 문자열 s 를 strings.NewReader 로 감싼 *strings.Reader, 아래 줄은 my_data.txt.gz 를 os.Open 한 *os.File 을 gzip.NewReader 로 다시 감싼 *gzip.Reader 다. 둘 다 io.Reader 라서 countLetters(r io.Reader) 하나가 같은 코드로 영어 글자 수를 센다. 아래 줄의 정리는 buildGZipReader 가 돌려준 클로저가 gr 과 r 을 차례로 닫아 맡는다.</desc>

<title id="dt">병렬 하위 테스트는 부모 함수가 끝날 때까지 멈췄다가 그때의 d 를 봅니다</title><desc id="dd">TestParallelTable 의 반복문이 사례마다 t.Run 을 부른다. 하위 테스트는 첫 줄의 t.Parallel 에서 멈추고(PAUSE) t.Run 이 돌아와 반복문이 다음 사례로 간다. 세 사례를 다 돌고 부모 테스트 함수가 반환하면 하위 테스트 셋이 다시 돈다(CONT). 이 예제는 반복문이 함수의 끝이다. go 지시어가 1.21 이하면 변수 d 가 하나라 셋 모두 마지막 사례 50 60 을 보고, 1.22 이상이면 반복마다 새 d 라 각자 제 사례를 본다.</desc>
<rect width="960" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 15-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">병렬 하위 테스트는 부모 함수가 끝날 때까지 멈췄다가 그때의 d 를 봅니다</text>

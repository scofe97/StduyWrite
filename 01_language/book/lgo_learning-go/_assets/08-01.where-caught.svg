<text x="336" y="300" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">Push("nope")</text>
<path d="M 436 304 L 474 304" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="476" y="260" width="200" height="88" rx="6" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="576" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">컴파일 오류</text>
<text x="576" y="322" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">untyped string constant</text>
<path d="M 676 304 L 714 304" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="716" y="260" width="200" height="88" rx="6" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="816" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">실행하지 않음</text>
<line x1="12" y1="368" x2="936" y2="368" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

<title id="dt">섞인 타입을 어디서 잡는가</title><desc id="dd">같은 실수, 곧 다른 타입의 값을 한 자료구조에 넣는 코드가 어느 단계에서 잡히는지 두 방식으로 비교한다. any 를 받는 Orderable 트리는 OrderableString 을 넣는 코드를 컴파일러가 통과시키고 실행 중 타입 단언에서 panic 이 난다. 타입 매개변수를 쓴 Stack[int] 는 Push("nope") 를 컴파일 오류로 막아 실행까지 가지 않는다.</desc>
<rect width="984" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PROCESS · 08-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">섞인 타입을 어디서 잡는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 레인은 제네릭 이전의 인터페이스 방식, 아래 레인은 타입 매개변수 방식입니다.</text>
<text x="336" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">코드</text>
<text x="576" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">컴파일</text>
<text x="816" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">실행</text>
<rect x="24" y="148" width="196" height="88" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="122" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">인터페이스 + any</text>
<text x="122" y="208" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">Orderable 트리</text>
<rect x="236" y="148" width="200" height="88" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="336" y="188" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">Insert(OrderableString)</text>
<text x="336" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">OrderableInt 가 든 트리</text>
<path d="M 436 192 L 474 192" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="476" y="148" width="200" height="88" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.0"/>
<text x="576" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">통과</text>
<text x="576" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">타입을 모름</text>

<title id="dt">이름 붙은 결과 변수는 return 이 덮어쓴다</title><desc id="dd">divAndRemainder(5, 2) 한 번의 호출을 시간순으로 그린 시퀀스. 이름 붙은 결과 변수는 제로 값으로 시작하고, 본문이 20·30 을 넣어도 return 문에 적은 값이 결과 변수에 다시 대입된다. 함수가 끝나기 직전 defer 가 결과 변수를 읽고 고칠 수 있으며, 호출자는 그 뒤의 값 2 1 을 받는다.</desc>

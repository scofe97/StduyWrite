<title id="dt">Go 에서 C 로, C 에서 다시 Go 로 부릅니다</title><desc id="dd">main 이 import "C" 앞 주석에 선언한 C 함수 add 를 C.add(3, 2) 로 부른다. example.c 의 add 는 cgo 가 만든 _cgo_export.h 를 포함해 //export 로 내보낸 Go 함수 doubler 를 doubler(3) 으로 부르고 6 을 받는다. add 는 6 에 2 를 더한 8 을 돌려주고 main 이 8 을 찍는다.</desc>

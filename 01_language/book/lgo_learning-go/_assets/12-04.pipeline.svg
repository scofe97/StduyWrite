<title id="dt">A·B 는 동시에, C 는 둘이 모인 뒤에, 모두 50밀리초 안에</title><desc id="dd">GatherAndProcess 는 50밀리초에 시간이 넘는 context 를 만들고 abProcessor.start 로 A 와 B 를 부르는 고루틴 둘을 띄운다. abProcessor.wait 는 select 로 outA 와 outB 를 둘 다 받을 때까지 기다리고, errs 나 ctx.Done() 이 먼저 오면 바로 돌아간다. 둘이 모이면 cProcessor.start 로 C 를 부르는 고루틴을 띄우고 wait 로 outC 를 받아 돌려준다.</desc>

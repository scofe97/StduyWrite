<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 508" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">클로저는 자기 환경을 붙잡고 반환된다</title><desc id="dd">makeMult(2) 와 makeMult(3) 을 한 번씩 부른 결과를 좌우로 나란히 그린 그림. 호출마다 base 가 담긴 환경이 따로 생기고, 반환된 클로저는 그 환경을 붙잡은 채 twoBase·threeBase 변수에 담긴다. 그래서 같은 i 로 불러도 두 함수는 각자의 base 를 곱한다.</desc>
<rect width="984" height="508" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · 05-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">클로저는 자기 환경을 붙잡고 반환된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바깥 상자가 호출 한 번의 환경, 안쪽 상자가 그 환경을 붙잡은 채 반환된 함수입니다.</text>
<rect x="24" y="104" width="448" height="232" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.30)" stroke-width="0.9"/>
<text x="40" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">makeMult(2) 호출이 만든 환경</text>
<rect x="332" y="114" width="116" height="28" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.0"/>
<text x="390" y="133" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">base = 2</text>
<rect x="48" y="160" width="400" height="152" rx="8" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="64" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">반환된 클로저</text>
<text x="64" y="224" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">func(factor int) int {</text>
<text x="88" y="252" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">return base * factor</text>
<text x="64" y="280" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">}</text>
<text x="64" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">base 는 인자가 아니라 붙잡은 변수</text>
<path d="M 248 336 L 248 372" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="108" y="376" width="280" height="36" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="248" y="399" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">twoBase := makeMult(2)</text>
<text x="248" y="440" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">twoBase(0), (1), (2) → 0 · 2 · 4</text>
<rect x="512" y="104" width="448" height="232" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.30)" stroke-width="0.9"/>
<text x="528" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">makeMult(3) 호출이 만든 환경</text>
<rect x="820" y="114" width="116" height="28" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.0"/>
<text x="878" y="133" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">base = 3</text>
<rect x="536" y="160" width="400" height="152" rx="8" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="552" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">반환된 클로저</text>
<text x="552" y="224" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">func(factor int) int {</text>
<text x="576" y="252" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">return base * factor</text>
<text x="552" y="280" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">}</text>
<text x="552" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">base 는 인자가 아니라 붙잡은 변수</text>
<path d="M 736 336 L 736 372" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="596" y="376" width="280" height="36" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="736" y="399" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">threeBase := makeMult(3)</text>
<text x="736" y="440" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">threeBase(0), (1), (2) → 0 · 3 · 6</text>
<line x1="12" y1="460" x2="936" y2="460" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="482" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="472" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">붙잡힌 변수</text>
<rect x="222" y="472" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="244" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클로저와 그것을 담은 변수</text>
</svg>
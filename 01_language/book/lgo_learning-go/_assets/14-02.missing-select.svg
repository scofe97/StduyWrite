<title id="dt">select 보호가 없으면 떠난 main 에게 보내다 멈춥니다</title><desc id="dd">select 보호를 뺀 cancel_error_http 의 모양에서 순서를 강제한 재현. 100ms 에 status 고루틴이 원인을 넘겨 취소하면 main 은 Done 을 보고 루프를 떠나 wg.Wait 에 들어간다. 200ms 에 응답을 받은 delay 고루틴이 ch 에 쓰려 하지만 읽는 쪽이 없어 멈추고, 모든 고루틴이 잠들어 런타임이 deadlock 으로 끝낸다. 기본 클라이언트의 keep-alive 연결이 남아 있으면 그 고루틴이 네트워크를 기다리므로 deadlock 없이 wg.Wait 에서 계속 멈춘다.</desc>
<rect width="984" height="584" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 14-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">select 보호가 없으면 떠난 main 에게 보내다 멈춥니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">100ms·200ms 는 강제한 시점입니다. keep-alive 연결이 남으면 deadlock 없이 멈춥니다.</text>

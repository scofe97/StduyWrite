<title id="dt">io.Reader 는 버퍼를 받아 채우고, 겹쳐서 기능을 더합니다</title><desc id="dd">13-01 의 키워드 개념도. 첫 줄은 호출자가 만든 버퍼를 Read 가 채우고 읽은 수 n 을 돌려주며, 다 읽으면 io.EOF 로 알리는 규약이다. 둘째 줄은 *os.File 을 gzip.NewReader 로 감싸도 io.Reader 라서 countLetters 같은 함수가 코드 변경 없이 읽는 데코레이터다. 셋째 줄은 Reader·Writer·Closer·Seeker 를 묶은 조합 인터페이스로 할 일을 드러내고, 모자란 Close 는 NopCloser 가 임베딩으로 채운다는 것이다.</desc>
<rect width="984" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 13-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">io.Reader 는 버퍼를 받아 채우고, 겹쳐서 기능을 더합니다</text>

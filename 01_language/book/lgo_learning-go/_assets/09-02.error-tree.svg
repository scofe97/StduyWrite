<title id="dt">fileChecker 가 만든 오류 트리</title><desc id="dd">fileChecker 가 돌려준 오류는 세 층이다. 맨 위는 %w 로 감싼 오류, 그 아래는 os.Open 의 *fs.PathError, 맨 아래는 syscall.Errno(ENOENT)다. errors.Is(err, os.ErrNotExist) 는 위에서부터 == 로 비교하다 맨 아래 ENOENT 의 Is 메서드가 ErrNotExist 와 맞다고 답해 true 가 된다. errors.As(err, &amp;pe) 는 둘째 층에서 *fs.PathError 타입이 맞아 그 오류를 pe 에 대입한다.</desc>
<rect width="984" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TREE · 09-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">fileChecker 가 만든 오류 트리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽은 Unwrap 으로 이어진 오류 사슬, 가운데와 오른쪽은 각 층에서 Is·As 가 내린 판정입니다.</text>
<text x="596" y="116" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">errors.Is(err, os.ErrNotExist)</text>
<text x="836" y="116" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">errors.As(err, &amp;pe)</text>
<rect x="36" y="132" width="360" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="56" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">*fmt.wrapError</text>
<text x="56" y="178" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">in fileChecker: open not_here.txt: …</text>
<text x="56" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">fmt.Errorf 의 %w</text>
<path d="M 96 208 L 96 242" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="108" y="230" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Unwrap</text>
<rect x="488" y="150" width="216" height="40" rx="4" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="596" y="175" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">== ErrNotExist? 아님</text>
<rect x="724" y="150" width="224" height="40" rx="4" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="836" y="175" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">*fs.PathError? 아님</text>
<rect x="36" y="244" width="360" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="56" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">*fs.PathError</text>
<text x="56" y="290" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">open not_here.txt: no such file…</text>
<text x="56" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">os.Open 이 돌려준 오류</text>
<path d="M 96 320 L 96 354" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="108" y="342" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Unwrap</text>
<rect x="488" y="262" width="216" height="40" rx="4" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="596" y="287" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">== ErrNotExist? 아님</text>
<rect x="724" y="262" width="224" height="40" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="836" y="287" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">타입 맞음 → pe 에 대입</text>
<rect x="36" y="356" width="360" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="56" y="382" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">syscall.Errno</text>
<text x="56" y="402" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">ENOENT · no such file or directory</text>
<text x="56" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">운영체제 오류 번호</text>
<rect x="488" y="374" width="216" height="40" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="596" y="399" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">Is 메서드 → true</text>
<text x="836" y="399" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">이미 멈춤</text>
<line x1="12" y1="484" x2="936" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="506" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="496" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">일치하지 않음</text>
<rect x="235" y="496" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="257" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">타입이 맞음</text>
<rect x="357" y="496" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="379" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Is 메서드가 맞다고 답함</text>

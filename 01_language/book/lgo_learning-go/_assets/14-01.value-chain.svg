<title id="dt">WithValue 는 감싸고 Value 는 거슬러 찾습니다</title><desc id="dd">Background 를 사용자 값을 담은 자식이 감싸고, 그것을 다시 GUID 값을 담은 자식이 감싼 context 사슬이다. 바깥 context 에서 Value(userKey) 를 부르면 가장 바깥 겹부터 키를 비교하며 안쪽으로 들어가 user 겹에서 jon 을 찾는다. 어느 겹에도 없는 키는 Background 까지 내려가 nil 을 돌려준다. 이 탐색은 선형이라 값을 수십 개 담으면 느려진다.</desc>
<rect width="984" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · 14-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">WithValue 는 감싸고 Value 는 거슬러 찾습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">guidKey · userKey 와 값은 설명을 위한 예입니다. 값은 안쪽으로만 흘러 들어갑니다.</text>
<rect x="36" y="132" width="520" height="280" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="52" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">ctx = contextWithGUID(ctx, …)</text>
<text x="52" y="174" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">guidKey · "abc-123"</text>
<rect x="64" y="204" width="464" height="180" rx="8" fill="#6A95D80d" stroke="#6A95D8" stroke-width="1.1"/>
<text x="80" y="228" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">ctx = ContextWithUser(ctx, "jon")</text>
<text x="80" y="246" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">userKey · "jon"</text>
<rect x="92" y="276" width="408" height="80" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="108" y="300" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">context.Background()</text>
<text x="108" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">값 없음 · 사슬의 끝</text>
<text x="600" y="144" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">ctx.Value(userKey)</text>
<rect x="600" y="164" width="340" height="32" rx="4" fill="#5E6B7E10" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="616" y="185" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">guid 겹 · 키가 다름</text>
<rect x="600" y="208" width="340" height="32" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="616" y="229" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">user 겹 · "jon" 반환</text>
<text x="600" y="284" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">ctx.Value(otherKey)</text>
<rect x="600" y="304" width="340" height="32" rx="4" fill="#5E6B7E10" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="616" y="325" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">guid 겹 · user 겹 · 없음</text>
<rect x="600" y="348" width="340" height="32" rx="4" fill="#F0616D10" stroke="#F0616D" stroke-width="1.0"/>
<text x="616" y="369" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">Background 까지 가서 nil</text>
<line x1="12" y1="424" x2="936" y2="424" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="446" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="436" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">값을 담은 겹</text>
<rect x="235" y="436" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="257" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">찾아낸 곳</text>
<rect x="344" y="436" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="366" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">없으면 nil</text>
</svg>
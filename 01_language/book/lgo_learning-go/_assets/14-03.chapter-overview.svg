<title id="dt">요청 시간은 context 에 적고 아래 호출이 모두 지킵니다</title><desc id="dd">14-03 의 키워드 개념도. 첫 줄은 요청 시간 제한을 WithTimeout 이나 WithDeadline 으로 context 에 적고, 그 context 를 넘긴 HTTP·데이터베이스 호출이 함께 멈춘다는 것이다. 둘째 줄은 자식에 3초를 줘도 부모 2초에 묶여 2초에 끝난다는 것이다. 셋째 줄은 Err 가 명시적 취소면 context.Canceled, 시간 초과면 context.DeadlineExceeded 를 돌려주고 시간 초과일 때는 Cause 도 같다는 것이다. 넷째 줄은 오래 도는 계산이 매 반복 앞에서 context.Cause 를 확인해 스스로 멈춘다는 것이다.</desc>
<rect width="984" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 14-03 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">요청 시간은 context 에 적고 아래 호출이 모두 지킵니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

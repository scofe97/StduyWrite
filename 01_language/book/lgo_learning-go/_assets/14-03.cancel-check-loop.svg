<title id="dt">계산 루프는 매 반복 앞에서 취소를 확인합니다</title><desc id="dd">own_cancellation 의 calcPi 루프. 매 반복 앞에서 context.Cause(ctx) 를 부르고, 오류가 있으면 반복 횟수를 찍은 뒤 지금까지의 합과 오류를 돌려준다. 오류가 없으면 급수의 한 항을 더하거나 빼고 분모를 2 늘려 다시 확인으로 돌아간다. 10초 제한에서는 60,618,656 번 돈 뒤 멈췄다.</desc>
<rect width="984" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 14-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">계산 루프는 매 반복 앞에서 취소를 확인합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">확인을 반복 앞에 두면 취소 뒤 늦어도 한 반복 안에 멈춥니다.</text>
<rect x="136" y="112" width="240" height="40" rx="20" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="137" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">calcPi(ctx) · for {</text>
<path d="M 256 152 L 256 208" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<polygon points="256,208 412,238 256,268 100,238" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="243" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">context.Cause(ctx) != nil ?</text>
<path d="M 412 238 L 536 238" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<text x="456" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">예</text>
<rect x="536" y="210" width="400" height="56" rx="6" fill="#F08A5910" stroke="#F08A59" stroke-width="1.4"/>
<text x="552" y="234" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">return sum, err</text>
<text x="552" y="254" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">cancelled after 60618656 iterations</text>
<path d="M 256 268 L 256 328" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="268" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">아니오</text>
<rect x="116" y="332" width="280" height="56" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="256" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">급수 한 항 더하기·빼기</text>
<text x="256" y="374" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">d += 2 · i++</text>
<path d="M 116 360 L 76 360 L 76 238 L 96 238" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="68" y="324" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">다음 반복</text>
<line x1="12" y1="444" x2="936" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="466" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="456" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>

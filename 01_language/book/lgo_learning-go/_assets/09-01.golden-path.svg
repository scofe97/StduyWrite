<title id="dt">오류는 옆으로 빠지고 본문은 곧게 내려갑니다</title><desc id="dd">main 이 calcRemainderAndMod 를 부른 뒤의 흐름. 돌아온 err 를 if 로 nil 과 비교해, nil 이 아니면 들여쓴 블록에서 오류를 찍고 끝낸다. nil 이면 들여쓰지 않은 본문이 이어져 6 2 를 찍는다. 원문이 황금 경로라 부르는 것이 왼쪽 열이다.</desc>
<rect width="984" height="572" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 09-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">오류는 옆으로 빠지고 본문은 곧게 내려갑니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽 열이 들여쓰지 않은 황금 경로, 오른쪽이 if 안으로 들여쓴 오류 처리입니다.</text>
<rect x="96" y="112" width="320" height="40" rx="20" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="137" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">calcRemainderAndMod(20, 3)</text>
<path d="M 256 152 L 256 216" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="268" y="184" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">remainder, mod, err</text>
<polygon points="256,216 396,246 256,276 116,246" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="251" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">err != nil ?</text>
<path d="M 396 246 L 536 246" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<text x="444" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">예</text>
<rect x="536" y="218" width="400" height="56" rx="6" fill="#F08A5910" stroke="#F08A59" stroke-width="1.2"/>
<text x="552" y="242" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">fmt.Println(err) · os.Exit(1)</text>
<text x="552" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">if 안으로 들여쓴 오류 처리 · 여기서 끝</text>
<path d="M 256 276 L 256 336" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="268" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">아니오</text>
<rect x="96" y="336" width="320" height="56" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="256" y="360" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">fmt.Println(remainder, mod)</text>
<text x="256" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">들여쓰지 않은 본문</text>
<path d="M 256 392 L 256 440" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="176" y="440" width="160" height="40" rx="20" fill="#3FB98C14" stroke="#3FB98C" stroke-width="0.9"/>
<text x="256" y="465" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">6 2</text>
<line x1="80" y1="104" x2="80" y2="488" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 4"/>
<text x="72" y="484" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">황금 경로</text>
<line x1="12" y1="516" x2="936" y2="516" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="528" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">황금 경로</text>
<rect x="209" y="528" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">오류 처리</text>

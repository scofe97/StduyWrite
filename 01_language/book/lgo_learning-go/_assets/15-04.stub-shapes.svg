<title id="dt">임베딩 스텁은 한 구현을 나눠 쓰고 함수 필드 스텁은 사례마다 답을 끼웁니다</title><desc id="dd">Logic 은 Entities 인터페이스를 필드로 받는다. 왼쪽 GetPetNamesStub 은 Entities 를 임베딩해 GetPets 만 구현하고, 구현하지 않은 GetUser 같은 메서드를 부르면 임베딩된 nil 인터페이스 때문에 패닉이 난다. 오른쪽 EntitiesStub 은 메서드마다 같은 시그니처의 함수 필드를 두고 메서드가 그 필드를 부른다. 테이블 테스트는 사례마다 새 EntitiesStub 을 만들어 그 사례의 getPets 를 넣는다.</desc>
<rect width="984" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 15-04 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">임베딩 스텁은 한 구현을 나눠 쓰고 함수 필드 스텁은 사례마다 답을 끼웁니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽은 한 구현에 모든 사례의 답을 넣고, 오른쪽은 사례가 스텁의 답을 정합니다.</text>
<rect x="296" y="104" width="392" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="492.0" y="126" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Logic</text>
<text x="492.0" y="145" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Entities Entities 필드</text>

<title id="dt">빌드 정보는 바이너리에 남고, 대상은 환경 변수와 파일 선택이 정합니다</title><desc id="dd">11-04 의 키워드 개념도. 윗줄은 go build 가 모든 바이너리에 모듈 버전, 빌드 설정, vcs 리비전을 기록하고 go version -m 과 govulncheck -mode binary 가 그것을 읽는 길이다. 둘째 줄은 GOOS 와 GOARCH 로 대상 플랫폼을 정해 교차 컴파일하는 길이고, 셋째 줄은 파일 이름 접미사와 //go:build 태그가 그 대상에 들어갈 파일을 고르는 길이다. 아랫줄은 golang.org/dl 로 go1.19.2 를 ~/sdk 에 받아 시험하고 지우는 길이다.</desc>
<rect width="984" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 11-04 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">빌드 정보는 바이너리에 남고, 대상은 환경 변수와 파일 선택이 정합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

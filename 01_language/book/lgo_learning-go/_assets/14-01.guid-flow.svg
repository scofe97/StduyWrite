<title id="dt">추적 GUID 는 업무 로직을 모른 채 서비스를 건넙니다</title><desc id="dd">클라이언트가 X-GUID 헤더를 붙여 app1 을 부른다. app1 의 tracker.Middleware 가 GUID 를 context 에 담고, 업무 로직 LogicImpl 은 context 만 넘길 뿐 GUID 를 모른다. 주입된 Logger 가 로그 앞에 GUID 를 붙이고, 주입된 Request 데코레이터가 app2 로 나가는 요청에 X-GUID 를 다시 붙인다. app2 의 미들웨어가 그것을 꺼내 같은 GUID 로 로그를 남긴다.</desc>
<rect width="984" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 14-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">추적 GUID 는 업무 로직을 모른 채 서비스를 건넙니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">헤더가 없으면 app1 의 미들웨어가 새 UUID 를 만들고, app2 에도 같은 UUID 가 찍힙니다.</text>
<rect x="196" y="132" width="312" height="332" rx="10" fill="none" stroke="#5E6B7E" stroke-width="1" stroke-dasharray="5 5"/>
<text x="212" y="154" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">app1 · :3000</text>
<rect x="612" y="132" width="312" height="332" rx="10" fill="none" stroke="#5E6B7E" stroke-width="1" stroke-dasharray="5 5"/>
<text x="628" y="154" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">app2 · :4000</text>
<rect x="36" y="180" width="136" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="104" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="104" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">X-GUID 헤더</text>
<rect x="220" y="180" width="264" height="52" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="352" y="202" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">tracker.Middleware</text>
<text x="352" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">context 에 GUID 담기</text>
<rect x="220" y="272" width="264" height="52" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.4"/>
<text x="352" y="294" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">LogicImpl.Process</text>
<text x="352" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">GUID 를 모름 · ctx 만 넘김</text>
<rect x="220" y="364" width="264" height="52" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="352" y="386" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">tracker.Request</text>
<text x="352" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">나가는 요청에 X-GUID</text>
<rect x="636" y="364" width="264" height="52" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="768" y="386" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">tracker.Middleware</text>
<text x="768" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">헤더에서 GUID 꺼냄</text>
<rect x="636" y="272" width="264" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="768" y="294" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">QueryHandler</text>
<text x="768" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Logger 로 로그</text>
<path d="M 174 206 L 216 206" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 352 234 L 352 268" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="362" y="256" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">ctx</text>
<path d="M 352 326 L 352 360" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="362" y="348" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">RequestDecorator</text>
<path d="M 486 390 L 632 390" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="560" y="382" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">X-GUID</text>
<path d="M 768 362 L 768 328" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="196" y="488" width="312" height="32" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="208" y="509" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">GUID: note-guid-123 - starting Process…</text>
<rect x="612" y="488" width="312" height="32" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="624" y="509" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">GUID: note-guid-123 - starting QueryHandler…</text>
<line x1="12" y1="532" x2="936" y2="532" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="554" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="544" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">GUID 를 다루는 tracker</text>
<rect x="378" y="544" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="400" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">GUID 를 모르는 업무 로직</text>
<rect x="630" y="544" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="652" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 GUID</text>
</svg>
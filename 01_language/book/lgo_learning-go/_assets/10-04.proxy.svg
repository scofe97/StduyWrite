<title id="dt">go get 이 모듈을 받고 검증하는 경로</title><desc id="dd">기본으로 go get 은 저장소가 아니라 Google 의 모듈 프록시에 요청한다. 프록시는 캐시에 없으면 원래 저장소에서 받아 사본을 두고 돌려준다. go 도구는 받은 모듈의 해시를 체크섬 데이터베이스의 값과 대조해, 맞지 않으면 설치하지 않는다. GOPRIVATE 에 든 모듈은 프록시를 거치지 않고 비공개 저장소에서 직접 받는다.</desc>
<rect width="984" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 10-04 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">go get 이 모듈을 받고 검증하는 경로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">번호는 순서입니다. 호스트 이름 proxy.golang.org·sum.golang.org 는 노트가 더한 것입니다.</text>
<rect x="24" y="176" width="200" height="88" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="124" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">go get</text>
<text x="124" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">go.sum 에 해시 기록</text>
<rect x="300" y="116" width="336" height="312" rx="10" fill="none" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="316" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">Google 운영</text>
<rect x="332" y="164" width="272" height="88" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="468" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">모듈 프록시</text>
<text x="468" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">proxy.golang.org · 캐시</text>
<rect x="332" y="300" width="272" height="88" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="468" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">체크섬 데이터베이스</text>
<text x="468" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">sum.golang.org · 버전별 해시</text>
<rect x="724" y="164" width="236" height="88" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="842" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">공개 저장소</text>
<text x="842" y="224" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">GitHub · GitLab</text>

<text x="244" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">3 해시 대조</text>
<path d="M 96 264 L 96 456 L 842 456 L 842 422" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)" stroke-dasharray="5 4"/>
<text x="470" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">GOPRIVATE · 프록시를 거치지 않고 직접</text>
<line x1="12" y1="476" x2="936" y2="476" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

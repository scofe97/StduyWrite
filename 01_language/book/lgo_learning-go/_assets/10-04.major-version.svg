<title id="dt">v2 코드는 하위 디렉터리나 브랜치에 둡니다</title><desc id="dd">하위 호환을 깨는 v2 를 낼 때의 두 저장 방식. 왼쪽 하위 디렉터리 방식은 메인 브랜치의 모듈 안에 v2 디렉터리를 만들어 코드를 복사한다. 오른쪽 브랜치 방식은 새 코드를 메인 브랜치에 두고 옛 코드를 v1 브랜치로 옮긴다. 두 방식 모두 새 코드의 go.mod 모듈 경로와 import 가 /v2 로 끝나고, 새 코드가 있는 곳에 v2.0.0 태그를 단다.</desc>
<rect width="984" height="508" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TREE · 10-04 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">v2 코드는 하위 디렉터리나 브랜치에 둡니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">example.com/mod 는 설명을 위한 예입니다. 원문은 새 코드를 브랜치에 두는 반대 배치도 허용합니다.</text>
<rect x="36" y="132" width="448" height="300" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="52" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">하위 디렉터리 방식</text>
<rect x="500" y="132" width="448" height="300" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="516" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">브랜치 방식</text>
<rect x="160" y="180" width="200" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="260" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">메인 브랜치</text>
<text x="260" y="224" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">module example.com/mod</text>
<rect x="56" y="300" width="200" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="156" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">기존 코드</text>
<text x="156" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">v1 · 그대로 둠</text>
<rect x="264" y="300" width="200" height="56" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="364" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">v2/ 디렉터리</text>
<text x="364" y="344" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">module example.com/mod/v2</text>
<line x1="260" y1="236" x2="260" y2="268" stroke="#5E6B7E" stroke-width="1.2"/>
<line x1="156" y1="268" x2="364" y2="268" stroke="#5E6B7E" stroke-width="1.2"/>
<path d="M 156 268 L 156 296" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<path d="M 364 268 L 364 296" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="260" y="412" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">메인 브랜치에 v2.0.0 태그</text>
<rect x="624" y="180" width="200" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="724" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">저장소</text>
<text x="724" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">브랜치 둘</text>
<rect x="520" y="300" width="200" height="56" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<text x="620" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">v1 브랜치</text>
<text x="620" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">옛 코드</text>
<rect x="728" y="300" width="200" height="56" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="828" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">메인 브랜치</text>
<text x="828" y="344" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">module example.com/mod/v2</text>
<line x1="724" y1="236" x2="724" y2="268" stroke="#5E6B7E" stroke-width="1.2"/>
<line x1="620" y1="268" x2="828" y2="268" stroke="#5E6B7E" stroke-width="1.2"/>
<path d="M 620 268 L 620 296" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<path d="M 828 268 L 828 296" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="724" y="412" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">새 코드가 있는 브랜치에 v2.0.0 태그</text>
<line x1="12" y1="452" x2="936" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="474" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="464" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">v2 코드 · 경로가 /v2</text>
<rect x="339" y="464" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="361" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">옛 코드 브랜치</text>

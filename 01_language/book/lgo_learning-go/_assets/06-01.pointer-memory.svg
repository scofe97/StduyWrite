<title id="dt">포인터는 가리키는 값의 주소를 담는다</title><desc id="dd">원문 그림 6-2 의 메모리 배치. x 는 주소 1~4 에 10, y 는 주소 5 에 1(true) 로 놓인다. pointerX 는 주소 6~9 에 값 1, pointerY 는 주소 10~13 에 값 5 를 담아 각각 x 와 y 의 시작 주소를 가리킨다. pointerZ 는 아무것도 가리키지 않아 값이 0(nil) 이다. 포인터는 가리키는 타입과 무관하게 모두 4칸이다.</desc>

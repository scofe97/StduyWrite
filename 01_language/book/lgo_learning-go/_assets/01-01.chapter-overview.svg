<title id="dt">모듈은 한 번, 그 뒤로는 fmt → vet → build</title><desc id="dd">Learning Go 1장의 작업 순서를 네 단계로 나눈 지도. go mod init 으로 모듈을 한 번 만들고, 그 뒤로는 go fmt 가 포맷을 고치고 go vet 이 컴파일되는 버그를 잡고 go build 가 단일 바이너리를 만든다. Makefile 의 make 한 번이 뒤의 세 단계를 이 순서로 묶는다. 맨 아래 칩은 그 단계를 다루는 절이다.</desc>
<rect width="984" height="476" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PROCESS · 01-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">모듈은 한 번, 그 뒤로는 fmt → vet → build</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">단계마다 위 칸이 실행할 명령, 아래 칸이 그 명령이 남기거나 잡는 것입니다.</text>
<text x="242" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">1 모듈</text>
<text x="446" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">2 포맷</text>
<text x="650" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">3 검사</text>
<text x="854" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">4 빌드</text>
<line x1="140" y1="128" x2="956" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="175" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">명령</text>
<line x1="140" y1="212" x2="956" y2="212" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="259" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">결과</text>
<line x1="140" y1="296" x2="956" y2="296" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="140" y1="128" x2="140" y2="296" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="148" y="136" width="188" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="242" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">go mod init</text>
<text x="242" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">hello_world · 한 번</text>
<path d="M 242 204 L 242 220" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="148" y="220" width="188" height="68" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="242" y="250" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">go.mod</text>
<text x="242" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">모듈 이름 · Go 버전 · 의존성</text>
<path d="M 336 170 L 352 170" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="352" y="136" width="188" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="446" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">go fmt ./...</text>
<text x="446" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">빌드 전 · 커밋 전</text>
<path d="M 446 204 L 446 220" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="352" y="220" width="188" height="68" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="446" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">탭 들여쓰기 · 빈 줄 정리</text>
<text x="446" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">중괄호 위치는 못 고침</text>
<path d="M 540 170 L 556 170" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="556" y="136" width="188" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="650" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">go vet ./...</text>
<text x="650" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">빌드 전</text>
<path d="M 650 204 L 650 220" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="556" y="220" width="188" height="68" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>
<text x="650" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">자리표시자 인자 누락</text>
<text x="650" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">컴파일은 통과한 버그</text>
<path d="M 744 170 L 760 170" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="760" y="136" width="188" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="854" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">go build</text>
<text x="854" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이름은 모듈 이름</text>
<path d="M 854 204 L 854 220" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="760" y="220" width="188" height="68" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="854" y="250" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">hello_world</text>
<text x="854" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">VM 없는 단일 바이너리</text>
<line x1="352" y1="312" x2="352" y2="328" stroke="#F08A59" stroke-width="1.4"/>
<line x1="948" y1="312" x2="948" y2="328" stroke="#F08A59" stroke-width="1.4"/>
<line x1="352" y1="328" x2="948" y2="328" stroke="#F08A59" stroke-width="1.4"/>
<text x="650.0" y="352" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">make · fmt → vet → build</text>

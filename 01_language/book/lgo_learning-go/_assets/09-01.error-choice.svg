<title id="dt">어떤 오류를 만들까</title><desc id="dd">원문의 권고를 판단 순서로 엮은 흐름도. 호출자가 오류를 골라 처리할 필요가 없으면 errors.New 나 fmt.Errorf 의 문자열 오류로 충분하다. 원인을 설명할 정보가 더 필요하면 사용자 정의 오류 타입을 만든다. 표준 라이브러리에 같은 뜻의 센티널이 있으면 재사용한다. 그 어느 것도 아니고 더 처리할 수 없는 상태를 알려야 할 때만 새 센티널을 정의하며, 이것은 공개 API 에 대한 약속이 된다.</desc>
<rect width="984" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 09-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">어떤 오류를 만들까</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">판단 순서는 노트가 원문 권고를 엮은 것입니다. 예는 오른쪽, 아니오는 아래로 갑니다.</text>
<rect x="160" y="112" width="192" height="40" rx="20" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">오류를 만들 때</text>
<path d="M 256 152 L 256 170" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<polygon points="256,170 428,200 256,230 84,200" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="205" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">호출자가 골라 처리할 필요 없음?</text>
<path d="M 428 200 L 536 200" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="460" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">예</text>
<rect x="536" y="176" width="400" height="48" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="552" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">errors.New · fmt.Errorf</text>
<text x="552" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">문자열 오류로 충분</text>
<path d="M 256 230 L 256 266" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="268" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">아니오</text>
<polygon points="256,266 428,296 256,326 84,296" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="301" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">원인 설명에 정보가 더 필요?</text>
<path d="M 428 296 L 536 296" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="460" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">예</text>
<rect x="536" y="272" width="400" height="48" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="552" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">사용자 정의 오류 타입</text>
<text x="552" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">StatusErr · 반환 타입은 error</text>
<path d="M 256 326 L 256 362" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="268" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">아니오</text>
<polygon points="256,362 428,392 256,422 84,392" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="397" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">표준 라이브러리에 같은 센티널?</text>
<path d="M 428 392 L 536 392" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="460" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">예</text>
<rect x="536" y="368" width="400" height="48" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>
<text x="552" y="390" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">기존 센티널 재사용</text>
<text x="552" y="408" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">io.EOF · zip.ErrFormat</text>
<path d="M 256 422 L 256 470" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="268" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">아니오</text>
<rect x="124" y="470" width="264" height="44" rx="20" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="256" y="498" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">새 센티널 오류</text>
<text x="404" y="490" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">var ErrX = errors.New(...)</text>
<text x="404" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">공개 API 약속 · == 로 확인</text>
<line x1="12" y1="540" x2="936" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="562" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="552" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">문자열 오류</text>
<rect x="222" y="552" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="244" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사용자 정의 타입</text>
<rect x="383" y="552" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="405" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기존 센티널</text>
<rect x="505" y="552" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="527" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">새 센티널</text>
</svg>
<title id="dt">타임아웃은 직접, 미들웨어는 감싸고, 로그는 구조화로</title><desc id="dd">13-04 의 키워드 개념도. 첫 줄은 Timeout 을 정한 http.Client 가 NewRequestWithContext 로 만든 요청을 Do 로 보내고, Body 를 json.Decoder 로 읽는 흐름이다. 둘째 줄은 타임아웃을 정한 http.Server 가 ServeMux 에 요청을 넘기고, ServeMux 가 GET /hello/{name} 같은 패턴에 맞는 Handler 를 부르는 흐름이다. 셋째 줄은 미들웨어가 http.Handler 를 받아 감싼 Handler 를 돌려주고, ResponseController 가 인터페이스를 바꾸지 않고 선택 기능을 더한다는 것이다. 넷째 줄은 slog 가 핸들러로 텍스트나 JSON 을 고르고, LogAttrs 로 할당을 줄인다는 것이다.</desc>
<rect width="984" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 13-04 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">타임아웃은 직접, 미들웨어는 감싸고, 로그는 구조화로</text>

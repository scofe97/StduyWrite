<title id="dt">고루틴은 런타임이 나눠 태우고 값은 채널로 넘깁니다</title><desc id="dd">12-01 의 키워드 개념도. 첫 줄은 데이터 흐름에 서로 기다리지 않는 단계가 있을 때 동시성을 쓰고, 하드웨어와 알고리즘이 허락할 때만 병렬로 돈다는 것이다. 둘째 줄은 go 키워드로 띄운 고루틴을 Go 런타임 스케줄러가 적은 수의 OS 스레드에 나눠 태우는 모습이다. 셋째 줄은 make 로 만든 채널에 &lt;- 로 값을 주고받고, 쓰는 쪽이 close 하면 읽는 쪽 for-range 가 끝나는 흐름이다.</desc>
<rect width="984" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 12-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">고루틴은 런타임이 나눠 태우고 값은 채널로 넘깁니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>
<rect x="23.18" y="130.0" width="21.64" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="34" y="144.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§1</text>

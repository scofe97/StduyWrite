<title id="dt">Go 는 요구를 만족하는 가장 낮은 버전을 고릅니다</title><desc id="dd">10-03 의 키워드 개념도. 첫 줄은 소스의 import 를 go get ./... 이 훑어 go.mod 와 go.sum 을 채우고, 의존성 소스까지 함께 컴파일해 바이너리 하나를 만든다는 것이다. 둘째 줄은 모듈 경로를 넘긴 go get 은 모두 indirect 로 적고 go mod tidy 가 소스와 맞춘다는 것이다. 셋째 줄은 여러 요구 가운데 모두를 만족하는 가장 낮은 버전 하나를 고르는 최소 버전 선택이다. 넷째 줄은 -u=patch 가 같은 마이너의 패치로, -u 가 가장 최신으로 올린다는 것이다. 다섯째 줄은 메이저 버전이 바뀌면 import 경로 끝에 /v2 가 붙어 다른 패키지가 된다는 것이다.</desc>
<rect width="984" height="808" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 10-03 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Go 는 요구를 만족하는 가장 낮은 버전을 고릅니다</text>

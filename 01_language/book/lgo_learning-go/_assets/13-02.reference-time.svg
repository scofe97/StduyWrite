<title id="dt">기준 시각의 각 자리는 1부터 7까지입니다</title><desc id="dd">Go 의 형식 문자열은 기준 시각 Mon Jan 2 15:04:05 MST 2006 을 원하는 모양으로 적어 만든다. 월 1(01, Jan), 일 2, 시 3(12시간제 03, 24시간제 15), 분 4, 초 5, 연 6(06 또는 2006), 시간대 7(-0700, MST 는 UTC 보다 7시간 늦음)로 차례대로 1부터 7이다. 그래서 01/02 03:04:05PM '06 -0700 으로 외운다.</desc>

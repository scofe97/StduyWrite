<title id="dt">태그로 이름을 정하고, 스트림은 Decoder·Encoder 로</title><desc id="dd">13-03 의 키워드 개념도. 첫 줄은 json:"id" 같은 구조체 태그가 이름·무시·생략을 정하고, 태그는 Marshal·Unmarshal 을 부를 때만 리플렉션으로 읽힌다는 것이다. 둘째 줄은 io.Reader·io.Writer 에 붙는 json.Decoder·Encoder 로 파일이나 HTTP 본문을 바로 읽고 쓰며, 여러 값의 스트림은 io.EOF 까지 Decode 한다는 것이다. 셋째 줄은 기본과 다른 필드를 MarshalJSON 을 가진 타입이나 Dup 임베딩으로 덮어쓰고, 끝내 JSON 용 struct 와 처리용 struct 를 나눈다는 것이다.</desc>
<rect width="984" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 13-03 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">태그로 이름을 정하고, 스트림은 Decoder·Encoder 로</text>

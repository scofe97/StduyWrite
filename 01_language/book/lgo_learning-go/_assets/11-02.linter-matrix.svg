<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칸은 그 줄의 문제를 잡은 검사 이름입니다. 다른 경고는 적지 않았습니다.</text>

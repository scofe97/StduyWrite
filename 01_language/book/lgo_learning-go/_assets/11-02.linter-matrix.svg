<title id="dt">원서 예제 다섯 개를 네 도구가 잡는가</title><desc id="dd">원서 예제 다섯 개를 go vet, staticcheck, revive, golangci-lint 로 직접 돌린 결과. go vet 은 다섯 모두 통과시켰다. staticcheck 는 fmt.Sprintf 한 인자(S1039)와 다시 대입한 err(SA4006)를 잡았다. revive 는 true 가림만 잡았다. golangci-lint 는 설정 없이 첫 줄을 S1039 로, 둘째 줄을 ineffassign 으로 잡았고, x 대입을 읽지 않는 문제는 ineffassign 만 잡았다. true 가림과 지역 변수 가림은 원문의 .golangci.yml 을 줄 때만 잡혔다. 칸은 그 줄의 문제만 보인다. revive 의 패키지 주석 경고와 shadowing 예제의 var b is unused 경고는 적지 않았다.</desc>

<title id="dt">미들웨어가 담은 값을 핸들러가 꺼내 명시적 인자로 넘깁니다</title><desc id="dd">미들웨어는 extractUser 로 쿠키에서 사용자를 꺼내 ContextWithUser 로 context 에 담는다. 컨트롤러는 UserFromContext 로 context 에서 사용자를 복원하고, 업무 로직 BusinessLogic 에는 context 와 함께 user 를 명시적 인자로 직접 넘긴다.</desc>

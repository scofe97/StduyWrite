<title id="dt">대상과 태그에 따라 빌드에 들어가는 파일</title><desc id="dd">파일 네 개로 만든 모듈을 go1.25.1 로 확인한 결과. main.go 는 늘 들어간다. //go:build !gopher 를 단 p.go 는 -tags gopher 일 때만 빠지고, //go:build gopher 를 단 g.go 는 그때만 들어간다. 이름이 _windows_arm64 로 끝나는 파일은 GOOS=windows GOARCH=arm64 일 때만 들어가고 windows/amd64 에서는 빠진다.</desc>

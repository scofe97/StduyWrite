<title id="dt">세 패턴이 숨김 파일을 어디까지 넣는가</title><desc id="dd">embed_hidden 예제의 세 embed.FS 변수가 숨김 파일 두 개를 여는지 go1.25.1 로 돌린 결과. 디렉터리 이름만 준 noHidden 은 둘 다 없다. parent_dir/* 를 준 parentHiddenOnly 는 맨 위 디렉터리의 parent_dir/.hidden 만 넣었다. all:parent_dir 를 준 allHidden 은 child_dir 안의 .hidden 까지 넣었다.</desc>

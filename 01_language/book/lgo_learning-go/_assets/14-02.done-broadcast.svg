<title id="dt">Done 채널 닫힘으로 여러 고루틴이 동시에 깨어납니다</title><desc id="dd">cancelFunc() 호출 한 번으로 context 의 Done 채널이 닫히고, select 로 대기하던 여러 고루틴이 동시에 깨어나는 전파 과정.</desc>

<title id="dt">go 줄이 더 새로우면 무엇으로 빌드할까</title><desc id="dd">go.mod 의 go 줄이 설치된 Go 보다 새 버전을 요구할 때의 판단 순서. Go 1.20 이하가 설치돼 있으면 그 줄을 무시하고 설치된 버전으로 빌드한다. 1.21 이상이면 GOTOOLCHAIN 을 본다. local 이면 설치된 Go 만 쓰므로 오류로 멈춘다. 특정 버전이면 그 버전으로 바꾸는데, 그 버전도 go 줄보다 낮으면 같은 오류로 멈춘다. 기본값 auto 는 go 줄이 요구한 버전을 내려받아 빌드한다.</desc>
<rect width="984" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 10-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">go 줄이 더 새로우면 무엇으로 빌드할까</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">local 과 특정 버전은 toolchain 줄보다 우선하고, 기본 auto 는 toolchain 줄도 따릅니다. 두 오류 경로는 노트가 실행으로 확인했습니다.</text>
<rect x="112" y="112" width="288" height="40" rx="20" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">go 줄이 설치된 Go 보다 새로움</text>
<path d="M 256 152 L 256 170" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<polygon points="256,170 428,200 256,230 84,200" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="205" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">설치된 Go 가 1.20 이하?</text>
<path d="M 428 200 L 536 200" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="460" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">예</text>
<rect x="536" y="176" width="400" height="48" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>
<text x="552" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">go 줄을 무시하고 빌드</text>
<text x="552" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">go 1.N 두 자리 줄일 때</text>
<path d="M 256 230 L 256 266" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="268" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">아니오</text>
<polygon points="256,266 428,296 256,326 84,296" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="301" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">GOTOOLCHAIN=local?</text>
<path d="M 428 296 L 536 296" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="460" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">예</text>
<rect x="536" y="272" width="400" height="48" rx="6" fill="#F08A5910" stroke="#F08A59" stroke-width="1.4"/>
<text x="552" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">오류로 멈춤</text>
<text x="552" y="312" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">go.mod requires go &gt;= 1.26.0</text>
<path d="M 256 326 L 256 362" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="268" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">아니오</text>
<polygon points="256,362 428,392 256,422 84,392" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="256" y="397" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">GOTOOLCHAIN=go1.x.y 같은 버전?</text>
<path d="M 428 392 L 536 392" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="460" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">예</text>
<rect x="536" y="368" width="400" height="48" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="552" y="390" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">그 버전으로 바꿔 빌드</text>
<text x="552" y="408" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">go 줄보다 낮으면 오류로 멈춤</text>
<path d="M 256 422 L 256 470" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<text x="268" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">아니오</text>
<rect x="124" y="470" width="264" height="44" rx="20" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="256" y="498" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">auto: 요구한 버전을 받아 빌드</text>
<text x="404" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Go 1.21 이후의 기본 동작</text>
<line x1="12" y1="540" x2="936" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="562" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="552" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1.20 이하의 동작</text>
<rect x="287" y="552" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">특정 버전</text>
<rect x="396" y="552" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="418" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기본 auto</text>
<rect x="531" y="552" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="553" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">오류로 멈춤</text>
</svg>
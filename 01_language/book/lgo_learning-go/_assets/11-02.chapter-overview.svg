<title id="dt">린터는 코드 모양을, govulncheck 는 의존성을 봅니다</title><desc id="dd">11-02 의 키워드 개념도. 윗줄은 go vet 을 필수로 두고 오탐 적은 staticcheck, 설정 파일로 규칙을 켜는 revive 를 차례로 더하는 도입 순서다. 가운데 줄은 모듈 루트의 .golangci.yml 이 켤 린터를 정하고 golangci-lint 가 ineffassign 같은 50개 넘는 도구를 묶어 돌리는 모습이다. 아랫줄은 govulncheck 가 vuln.go.dev 취약점 데이터베이스를 소스 코드와 바이너리에 대조하는 두 방식이다.</desc>

<title id="dt">타입 항 int 와 ~int 가 받는 타입</title><desc id="dd">타입 항 int 가 받는 집합은 int 하나뿐이다. ~int 는 바탕 타입이 int 인 모든 타입을 받으므로 int 와 함께 type MyInt int 같은 사용자 정의 타입이 들어간다. 그래서 MyInt 는 int 항의 제약을 만족하지 못하고 ~int 항의 제약은 만족한다. 바탕 타입이 다른 int64 나 string 은 어느 쪽에도 들지 않는다.</desc>
<rect width="984" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · 08-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">타입 항 int 와 ~int 가 받는 타입</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바깥 상자가 ~int, 안쪽 상자가 int 의 타입 집합입니다. Age 는 노트가 더한 예입니다.</text>
<rect x="36" y="132" width="616" height="240" rx="10" fill="#6A95D80A" stroke="#6A95D8" stroke-width="1.2"/>
<text x="56" y="160" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">~int · 바탕 타입이 int 인 모든 타입</text>
<rect x="68" y="196" width="232" height="144" rx="8" fill="#3FB98C0A" stroke="#3FB98C" stroke-width="1.2"/>
<text x="88" y="224" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">int · 정확히 int 만</text>
<rect x="108" y="252" width="152" height="40" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="184" y="277" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">int</text>
<rect x="348" y="212" width="136" height="40" rx="6" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="416" y="237" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">MyInt</text>
<text x="416" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">type MyInt int</text>
<rect x="500" y="212" width="136" height="40" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="568" y="237" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">Age</text>
<text x="568" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">type Age int</text>
<text x="184" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">~ 없는 제약도 만족</text>
<text x="492" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">~ 가 없으면 MyInt 는 탈락</text>
<text x="816" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">어느 쪽에도 들지 않음</text>
<rect x="748" y="188" width="136" height="40" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="816" y="213" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F0616D">int64</text>
<rect x="748" y="256" width="136" height="40" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="816" y="281" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F0616D">string</text>
<text x="816" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바탕 타입이 다름</text>
<line x1="12" y1="392" x2="936" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="404" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">int 항</text>
<rect x="209" y="404" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="231" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">~int 항</text>
<rect x="331" y="404" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="353" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">~ 로만 들어오는 타입</text>
<rect x="531" y="404" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="553" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">제외</text>
</svg>
<title id="dt">퍼저가 찾은 실패 입력은 시드 코퍼스로 돌아가 회귀 테스트가 됩니다</title><desc id="dd">시드 코퍼스는 f.Add 로 넣은 값과 testdata/fuzz 아래 파일이다. 퍼저가 코퍼스를 비틀어 f.Fuzz 대상에 넣고, 패닉이나 조건 위반이 없으면 계속 비튼다. 실패하면 입력을 줄여 testdata/fuzz/FuzzParseData 아래 파일로 쓴다. 코드를 고친 뒤 그 파일은 코퍼스의 한 원소가 되어 go test 때마다 도는 회귀 테스트가 된다.</desc>
<rect width="984" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 15-03 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">퍼저가 찾은 실패 입력은 시드 코퍼스로 돌아가 회귀 테스트가 됩니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">윗줄은 퍼징 한 바퀴, 아랫줄은 실패를 고치고 회귀 테스트로 남기는 길입니다.</text>

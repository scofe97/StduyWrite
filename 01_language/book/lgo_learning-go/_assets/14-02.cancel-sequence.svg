<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">status 고루틴의 취소가 delay 고루틴의 요청까지 끊습니다</text>

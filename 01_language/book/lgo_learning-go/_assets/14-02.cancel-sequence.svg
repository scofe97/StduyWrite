<title id="dt">status 고루틴의 취소가 delay 고루틴의 요청까지 끊습니다</title><desc id="dd">cancel_http 한 번을 시간순으로 그린 시퀀스. 두 고루틴이 성공 메시지를 채널로 보내다가 status 고루틴이 500 을 받고 cancelFunc 를 부른다. Done 채널이 닫혀 main 의 select 가 루프를 빠져나오고, delay 고루틴이 기다리던 HTTP 요청은 같은 context 를 따라 context canceled 로 끝나 고루틴도 끝난다.</desc>

<title id="dt">인터페이스 값은 타입과 값 두 칸이다</title><desc id="dd">인터페이스 변수 하나가 담는 두 칸을 세 상태로 나란히 그렸다. 선언만 한 인터페이스는 타입 칸과 값 칸이 모두 비어 nil 과 같다. nil 인 *Counter 를 대입하면 값 칸은 비어도 타입 칸에 *Counter 가 들어가 nil 과 같지 않다. 값이 있는 *Counter 를 대입하면 두 칸이 모두 찬다.</desc>
<rect width="984" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · 07-03 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인터페이스 값은 타입과 값 두 칸이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">== nil 은 두 칸이 모두 비었는지를 봅니다. 오른쪽 상자는 원문에 없는, 노트가 더한 비교용 상태입니다.</text>
<rect x="36" y="176" width="288" height="196" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="180" y="160" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">var incrementer Incrementer</text>
<rect x="56" y="196" width="248" height="52" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="72" y="228" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">타입</text>
<text x="288" y="229" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#5E6B7E">nil</text>
<rect x="56" y="260" width="248" height="52" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="72" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">값</text>
<text x="288" y="293" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#5E6B7E">nil</text>
<text x="180" y="332" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#3FB98C">== nil · true</text>
<text x="180" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">메서드 호출 → panic</text>
<rect x="348" y="176" width="288" height="196" rx="8" fill="#F08A5910" stroke="#F08A59" stroke-width="1.4"/>
<text x="492" y="160" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">incrementer = pointerCounter</text>
<rect x="368" y="196" width="248" height="52" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.0"/>
<text x="384" y="228" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">타입</text>
<text x="600" y="229" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">*Counter</text>
<rect x="368" y="260" width="248" height="52" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="384" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">값</text>
<text x="600" y="293" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#5E6B7E">nil</text>
<text x="492" y="332" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F08A59">== nil · false</text>
<text x="492" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">메서드는 불림 · nil 처리는 메서드 몫</text>
<rect x="660" y="176" width="288" height="196" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="804" y="160" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">incrementer = &amp;Counter{}</text>
<rect x="680" y="196" width="248" height="52" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.0"/>
<text x="696" y="228" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">타입</text>
<text x="912" y="229" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">*Counter</text>
<rect x="680" y="260" width="248" height="52" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.0"/>
<text x="696" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">값</text>
<text x="912" y="293" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">→ Counter{...}</text>
<text x="804" y="332" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#6A95D8">== nil · false</text>
<text x="804" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">메서드 호출 가능</text>
<line x1="12" y1="404" x2="936" y2="404" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="426" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="416" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="426" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">찬 칸</text>
<rect x="183" y="416" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="205" y="426" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">nil 과 같음</text>
<rect x="331" y="416" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="353" y="426" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">nil 처럼 보이지만 아님</text>
</svg>
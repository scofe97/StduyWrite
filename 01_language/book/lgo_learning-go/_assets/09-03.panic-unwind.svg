<title id="dt">panic 은 defer 를 거슬러 실행하고 끝납니다</title><desc id="dd">main 이 f 를, f 가 g 를 부른 호출 사슬에서 g 가 panic 을 낸 경우. g 는 곧바로 끝나고 g 의 defer 가 실행된다. 이어 f 의 나머지는 건너뛰고 f 의 defer 가, 마지막으로 main 의 defer 가 실행된다. recover 가 없으면 프로그램은 메시지와 스택 트레이스를 찍고 끝난다.</desc>
<rect width="984" height="684" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 09-03 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">panic 은 defer 를 거슬러 실행하고 끝납니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">main → f → g 는 설명을 위한 예입니다. recover 가 없을 때의 순서입니다.</text>

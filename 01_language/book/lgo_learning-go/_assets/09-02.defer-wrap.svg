<title id="dt">defer 가 함수 끝에서 err 를 한 번 감쌉니다</title><desc id="dd">DoSomeThings 를 부른 한 번을 시간순으로 그린 시퀀스. doThing2 가 오류를 돌려주면 본문은 감싸지 않고 return "", err 로 끝난다. 함수가 돌아가기 직전 defer 클로저가 이름 붙은 결과 변수 err 가 nil 이 아님을 보고 fmt.Errorf 로 감싸 다시 대입한다. 호출한 쪽은 in DoSomeThings: 가 붙은 오류를 받는다. doThing2 를 실패 지점으로 고른 것은 설명을 위한 예다.</desc>
<rect width="984" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 09-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">defer 가 함수 끝에서 err 를 한 번 감쌉니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위에서 아래로 시간이 흐릅니다. 감싸는 코드는 defer 클로저 한 곳에만 있습니다.</text>
<rect x="36" y="104" width="232" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="152" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">호출한 쪽</text>
<text x="152" y="142" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">DoSomeThings(v1, v2)</text>
<line x1="152" y1="160" x2="152" y2="460" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<rect x="376" y="104" width="232" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="492" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">DoSomeThings 본문</text>
<text x="492" y="142" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(_ string, err error)</text>
<line x1="492" y1="160" x2="492" y2="460" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<rect x="716" y="104" width="232" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="832" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">defer 클로저</text>
<text x="832" y="142" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">if err != nil</text>
<line x1="832" y1="160" x2="832" y2="460" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 160 200 L 482 200" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#soft)"/>
<text x="322.0" y="190" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">DoSomeThings(v1, v2)</text>
<rect x="376" y="246" width="232" height="28" rx="4" fill="#0D1117"/>
<rect x="376" y="246" width="232" height="28" rx="4" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="492" y="265" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">doThing2(val2) → err</text>
<path d="M 500 320 L 822 320" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)"/>
<text x="662.0" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">return "", err · 함수 끝</text>
<text x="662.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">감싸지 않은 채</text>
<rect x="716" y="366" width="232" height="28" rx="4" fill="#0D1117"/>
<rect x="716" y="366" width="232" height="28" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="832" y="385" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">err = fmt.Errorf(…%w)</text>
<path d="M 824 440 L 162 440" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="492.0" y="430" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">in DoSomeThings: + 원래 오류</text>
<text x="492.0" y="460" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이름 붙은 err 가 그대로 반환됨</text>
<line x1="12" y1="484" x2="936" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="506" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="496" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">오류 경로</text>
<rect x="209" y="496" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한 곳에서 감쌈</text>
<rect x="357" y="496" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="379" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호출자가 받는 값</text>

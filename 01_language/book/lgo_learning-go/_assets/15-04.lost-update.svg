<title id="dt">두 고루틴이 같은 값을 읽고 쓰면 한쪽의 증가가 사라집니다</title><desc id="dd">counter++ 는 읽고 더하고 쓰는 세 단계다. 고루틴 A 와 B 가 잠금 없이 같은 값 n 을 읽으면 둘 다 n+1 을 계산해 쓰고, 나중에 쓴 B 가 A 의 결과를 덮어써 counter 는 n+2 가 아니라 n+1 이 된다. 다섯 고루틴이 1,000번씩 늘린 결과가 5,000 보다 작게 나온 까닭이다. go test -race 는 이 읽기와 쓰기를 race.go:12 의 데이터 레이스로 보고한다.</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 15-04 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">두 고루틴이 같은 값을 읽고 쓰면 한쪽의 증가가 사라집니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">n 은 두 고루틴이 읽은 같은 값입니다. 위에서 아래로 시간이 흐릅니다.</text>
<rect x="24.0" y="96" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="129.0" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">고루틴 A</text>
<text x="129.0" y="133" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">counter++</text>

<title id="dt">Go 는 바탕 타입마다 함수를 만든다</title><desc id="dd">제네릭 함수 f 를 다섯 가지 타입 인자로 불렀을 때 컴파일러가 만드는 함수의 대응. 바탕 타입이 같은 int 와 MyInt 는 함수 하나를 함께 쓰고, string 은 따로 하나를 받는다. 포인터 타입 *Adult 와 *Child 는 모두 포인터 모양 함수 하나를 함께 쓴다. 함수를 함께 쓰는 타입들을 구별하려고 컴파일러가 실행 중 조회를 더한다. 구체 타입마다 함수를 만드는 C++ 과 다른 점이며, 원문은 이것을 제네릭 호출이 느려지는 원인으로 든다.</desc>

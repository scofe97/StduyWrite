<title id="dt">context 는 매개변수이고 값은 아래로만 흐릅니다</title><desc id="dd">14-01 의 키워드 개념도. 첫 줄은 context.Background 로 만든 빈 출발점을 감싸 함수의 첫 매개변수 ctx 로 넘기는 흐름이다. 둘째 줄은 HTTP 요청에 붙은 context 를 미들웨어가 꺼내 값을 담고 WithContext 로 새 요청에 붙여 다음 핸들러로 넘기는 흐름이다. 셋째 줄은 내보내지 않은 키 타입으로 값을 담는 ContextWithUser 와 꺼내는 UserFromContext 이고, 꺼낸 값은 명시적 인자로 넘긴다. 넷째 줄은 X-GUID 헤더의 GUID 를 context 에 담아 업무 로직을 모르게 지나 로그와 다음 서비스에 전한다는 것이다.</desc>
<rect width="984" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 14-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">context 는 매개변수이고 값은 아래로만 흐릅니다</text>

<title id="dt">테스트 사례가 공유 변수를 바꾸면 가짜 서버가 그 값으로 답합니다</title><desc id="dd">사례 하나의 흐름. 테스트는 io = d.io 로 공유 변수를 바꾸고 rs.Resolve 를 부른다. RemoteSolver 는 server.URL 로 GET 요청을 보내고, httptest 서버의 핸들러는 공유 변수 io 의 expression 과 쿼리를 비교해 같으면 io.code 와 io.body 를 쓴다. Resolve 가 본문을 float64 로 바꿔 돌려주면 사례가 기대값과 비교한다. io 는 서버 클로저와 사례 클로저가 함께 붙잡은 한 변수다.</desc>
<rect width="960" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 15-04 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">테스트 사례가 공유 변수를 바꾸면 가짜 서버가 그 값으로 답합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위에서 아래로 시간이 흐릅니다. 사례마다 이 흐름이 되풀이됩니다.</text>

<title id="dt">길이는 Duration, 시점은 Time, 형식은 기준 시각</title><desc id="dd">13-02 의 키워드 개념도. 첫 줄은 int64 바탕의 time.Duration 을 time.Hour 같은 타입 있는 상수로 만들고, 300ms 같은 문자열은 ParseDuration 으로 읽는다는 것이다. 둘째 줄은 시간대를 품은 time.Time 을 == 대신 Equal 로 비교하고, 2006-01-02 15:04:05 기준 시각으로 형식을 적는다는 것이다. 셋째 줄은 time.Now 가 단조 시계를 함께 담아 Sub 를 벽시계 변화에서 지키고, After·Tick·NewTicker 채널이 시간 제한과 반복에 쓰인다는 것이다.</desc>
<rect width="984" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 13-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">길이는 Duration, 시점은 Time, 형식은 기준 시각</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

<title id="dt">예제 12-1 은 둘 다 쓰기에서 멈추고, 12-2 는 select 가 읽기를 고릅니다</title><desc id="dd">위는 예제 12-1. 띄운 고루틴은 ch1 에 1 을 쓰고 main 고루틴은 ch2 에 2 를 쓴다. 버퍼 없는 채널이라 둘 다 상대가 읽어 주기를 기다리며 멈추고, 모든 고루틴이 잠들어 런타임이 deadlock 으로 프로그램을 끝낸다. 아래는 예제 12-2. main 고루틴은 ch2 쓰기와 ch1 읽기를 select 로 감싸고, 띄운 고루틴이 ch1 쓰기에서 기다리고 있으니 select 가 읽기를 골라 main: 2 1 을 찍는다. 띄운 고루틴은 ch2 읽기에서 멈춘 채 남는다.</desc>
<rect width="960" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 12-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">예제 12-1 은 둘 다 쓰기에서 멈추고, 12-2 는 select 가 읽기를 고릅니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위는 예제 12-1, 아래는 예제 12-2 입니다. 채널 두 개도 레인으로 그렸습니다.</text>

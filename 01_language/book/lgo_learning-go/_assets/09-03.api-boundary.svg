<title id="dt">panic 은 공개 API 경계 안에서 오류가 됩니다</title><desc id="dd">서드파티용 라이브러리를 만들 때의 구조. 호출 코드가 공개 함수를 부르고 공개 함수가 내부 코드를 부른다. 내부에서 panic 이 나면 공개 함수에 defer 로 둔 recover 가 붙잡아 error 로 바꾸고, 호출 코드는 panic 이 아니라 오류를 받아 어떻게 할지 정한다.</desc>
<rect width="984" height="404" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 09-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">panic 은 공개 API 경계 안에서 오류가 됩니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">점선 안이 라이브러리입니다. panic 이 점선 밖으로 새어 나가지 않게 합니다.</text>
<rect x="376" y="132" width="592" height="196" rx="10" fill="none" stroke="#5E6B7E" stroke-width="1" stroke-dasharray="5 5"/>
<text x="392" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">라이브러리 · 공개 API 경계</text>
<rect x="36" y="168" width="256" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="164" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">호출 코드</text>
<text x="164" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서드파티 사용자</text>
<rect x="400" y="168" width="256" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="528" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">공개 함수</text>
<text x="528" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">(…, error) 를 돌려줌</text>
<rect x="424" y="240" width="208" height="32" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="528" y="261" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">defer … recover()</text>
<rect x="700" y="168" width="240" height="128" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="820" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">내부 코드</text>
<text x="820" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여기서 panic</text>
<path d="M 294 244 L 396 244" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="346" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">호출</text>
<path d="M 658 244 L 696 244" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="678" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">호출</text>
<path d="M 698 272 L 660 272" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<text x="678" y="292" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">panic</text>
<path d="M 398 272 L 296 272" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="346" y="292" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">error</text>
<line x1="12" y1="348" x2="936" y2="348" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="370" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="360" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">panic</text>
<rect x="209" y="360" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">recover 로 붙잡음</text>
<rect x="422" y="360" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="444" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">오류로 전달</text>
</svg>
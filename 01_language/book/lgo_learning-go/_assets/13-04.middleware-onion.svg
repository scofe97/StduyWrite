<title id="dt">바깥 미들웨어부터 요청을 받고, 핸들러가 돌아오면 안쪽부터 정리합니다</title><desc id="dd">terribleSecurity(RequestTimer(handler)) 로 감싼 겹. 요청은 바깥의 terribleSecurity 가 먼저 받아 X-Secret-Password 헤더를 검사하고, 틀리면 401 과 메시지를 쓰고 돌아가 안쪽은 불리지 않는다. 맞으면 RequestTimer 가 시작 시각을 적고 handler 를 부르며, handler 가 Hello! 를 쓰고 돌아오면 RequestTimer 가 slog 로 경로와 걸린 시간을 남긴다.</desc>
<rect width="960" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · 13-04 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">바깥 미들웨어부터 요청을 받고, 핸들러가 돌아오면 안쪽부터 정리합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바깥 겹이 먼저 받고, 안쪽 겹이 먼저 끝납니다.</text>
<rect x="200" y="100" width="736" height="360" rx="10" fill="#6A95D80d" stroke="#6A95D8" stroke-width="1.2"/>
<text x="220" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">terribleSecurity</text>
<text x="220" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">X-Secret-Password 검사 · 틀리면 401 쓰고 반환</text>
<rect x="228" y="170" width="680" height="262" rx="10" fill="#6A95D80d" stroke="#6A95D8" stroke-width="1.2"/>
<text x="248" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">RequestTimer</text>
<text x="248" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">start := time.Now() · 돌아오면 slog.Info(duration)</text>
<rect x="256" y="240" width="624" height="164" rx="10" fill="#3FB98C0d" stroke="#3FB98C" stroke-width="1.2"/>
<text x="276" y="268" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">handler</text>
<text x="276" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9"></text>
<text x="568" y="322" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">w.Write("Hello!\n")</text>
<path d="M 24 300 L 196 300" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<text x="30" y="290" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">GET /hello</text>
<path d="M 198 420 L 30 420" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="30" y="410" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">401 · 비밀번호 틀림</text>
<text x="568" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">200 · Hello!</text>
<line x1="12" y1="480" x2="912" y2="480" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="502" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="492" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="502" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">미들웨어 겹</text>
<rect x="222" y="492" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="244" y="502" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실제 핸들러</text>
<rect x="344" y="492" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="366" y="502" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">안쪽을 부르지 않고 반환</text>

<title id="dt">TestMain 은 패키지 테스트를 한 번 감싸고 Cleanup 은 테스트마다 거꾸로 돕니다</title><desc id="dd">go test 가 TestMain 을 한 번 부른다. TestMain 은 패키지 변수를 준비한 뒤 m.Run 으로 테스트 함수들을 돌린다. 테스트 하나는 t.Cleanup 으로 정리 함수 둘을 등록하고, 본문이 끝나면 t.Context 가 먼저 취소된 뒤 나중에 등록한 정리부터 거꾸로 돈다. m.Run 이 종료 코드를 돌려주면 TestMain 이 정리하고 반환하며, Go 1.15 부터는 반환만 해도 그 값으로 os.Exit 가 불린다.</desc>

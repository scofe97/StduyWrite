<title id="dt">자식에 3초를 줘도 부모의 2초에 끝납니다</title><desc id="dd">parent 는 2초 WithTimeout, child 는 parent 를 감싼 3초 WithTimeout 이다. 두 막대는 각자 받은 기한이다. 2초에 parent 가 끝나면 child 도 함께 끝나므로 child 의 2~3초 구간은 쓰이지 못한다. child.Done() 을 기다린 시간은 2s 로 찍힌다.</desc>
<rect width="984" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">GANTT · 14-03 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">자식에 3초를 줘도 부모의 2초에 끝납니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">막대 길이는 각자 받은 기한, 점선 구간은 부모 때문에 쓰지 못한 기한입니다.</text>

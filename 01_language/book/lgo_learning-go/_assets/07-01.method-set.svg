<text x="428" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">든다</text>
<rect x="584" y="344" width="280" height="44" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.0"/>
<text x="724" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">불린다</text>

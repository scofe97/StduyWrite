<text x="28" y="416" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">nil *Counter</text>
<text x="28" y="433" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">String · 값 리시버</text>
<rect x="288" y="396" width="280" height="44" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.0"/>
<text x="428" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">든다</text>

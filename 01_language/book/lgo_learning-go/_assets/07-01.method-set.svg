<text x="28" y="329" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">String · 값 리시버</text>
<rect x="288" y="292" width="280" height="44" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.0"/>

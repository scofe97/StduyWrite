<title id="dt">메서드 집합과 직접 호출은 다르다</title><desc id="dd">값 인스턴스의 메서드 집합에는 값 리시버 메서드만, 포인터 인스턴스에는 두 리시버 메서드가 모두 든다. 그런데 값 변수로 포인터 리시버 메서드를 부르면 Go 가 주소를 얻어 (&amp;c) 로 바꿔 부르므로 호출은 된다. 이 자동 변환은 문법 편의라 메서드 집합을 바꾸지 않는다. nil 포인터로 값 리시버를 부르면 panic 이고, nil 을 다루게 쓴 포인터 리시버는 그대로 불린다.</desc>
<rect width="912" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">MATRIX · 07-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">메서드 집합과 직접 호출은 다르다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽 열은 인터페이스에 대입할 수 있는지, 오른쪽 열은 변수에서 점으로 부를 수 있는지입니다.</text>
<rect x="12" y="112" width="264" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="144" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">인스턴스 · 메서드</text>
<text x="144" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">리시버 종류</text>
<rect x="288" y="112" width="280" height="52" rx="6" fill="#F5F5F3"/>
<text x="428" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#0D1117">메서드 집합에 드는가</text>
<rect x="584" y="112" width="280" height="52" rx="6" fill="#F5F5F3"/>
<text x="724" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#0D1117">변수로 직접 부르면</text>
<rect x="12" y="188" width="264" height="44" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="28" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">Counter 값</text>
<text x="28" y="225" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">String · 값 리시버</text>

<title id="dt">사례는 데이터로 적고 커버리지는 빠뜨린 줄만 보여 줍니다</title><desc id="dd">15-02 의 키워드 개념도. 첫 줄은 사례 슬라이스의 원소마다 t.Run 으로 하위 테스트를 만들고 -run 으로 하나만 골라 돌린다는 것이다. 둘째 줄은 오류 메시지 문자열 비교는 문구가 바뀌면 깨지므로 errors.Is·As 로 값과 타입을 확인한다는 것이다. 셋째 줄은 병렬 하위 테스트가 반복문 동안 멈췄다가 부모 함수가 반환한 뒤 돌아, go 지시어가 1.21 이하면 모두 마지막 d 를 본다는 것이다. 넷째 줄은 커버리지를 87.5% 에서 100% 로 채워도 곱셈 버그가 남아 있었다는 것이다.</desc>
<rect width="984" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 15-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">사례는 데이터로 적고 커버리지는 빠뜨린 줄만 보여 줍니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

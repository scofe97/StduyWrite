<rect x="530" y="310" width="200" height="84" rx="6" fill="rgba(63,185,140,0.06)" stroke="#3FB98C" stroke-width="0.8"/>
<text x="630" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">Accept 대기열 (완결 큐)</text>
<text x="630" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">용량: listenerBacklog()</text>
<text x="630" y="370" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핸드셰이크 완료 소켓 대기</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">커널 핸드셰이크와 Accept 큐 상태 전이</title><desc id="dd">클라이언트 SYN 부터 커널 대기열을 거쳐 Accept() 소켓 획득까지의 상태 변화</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP HANDSHAKE AND ACCEPT QUEUE STATE TRANSITIONS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널 핸드셰이크와 Accept 큐 상태 전이</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Dial 의 성공은 Accept 호출이 아니라 커널의 핸드셰이크 완료 시점에 확정됩니다</text>
<circle cx="40" cy="208" r="6" fill="#F5F5F3"/>
<path d="M 48 208 L 60 208" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="53" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">Dial() 호출</text>
<rect x="66" y="164" width="168" height="88" rx="8" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="150" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">SYN_SENT</text>
<text x="150" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">클라이언트 SYN 발송</text>
<line x1="76" y1="217" x2="224" y2="217" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="150" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">Dial 블로킹 대기</text>
<path d="M 238 208 L 290 208" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="265" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">SYN 도달</text>
<text x="265" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">SYN-ACK 응답</text>
<rect x="296" y="164" width="168" height="88" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.0"/>
<text x="380" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">SYN_RCVD</text>
<text x="380" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">커널 SYN 대기열 등록</text>
<line x1="306" y1="217" x2="454" y2="217" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="380" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">핸드셰이크 진행 중</text>
<path d="M 468 208 L 530 208" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="500" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">최종 ACK 수신</text>
<text x="500" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">3-way 완료</text>
<rect x="536" y="164" width="168" height="88" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="620" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">ESTABLISHED</text>
<text x="620" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">커널 Accept 큐 진입</text>
<line x1="546" y1="217" x2="694" y2="217" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="620" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">Dial 즉시 성공!</text>
<path d="M 708 208 L 750 208" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="730" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="600" fill="#F08A59">Accept() 호출</text>
<text x="730" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">큐에서 dequeue</text>
<rect x="772" y="164" width="136" height="88" rx="8" fill="#F08A591A" stroke="#F08A59" stroke-width="1.4"/>
<text x="840" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">ACCEPTED</text>
<text x="840" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">net.Conn 반환</text>
<line x1="782" y1="217" x2="898" y2="217" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="840" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">연결 I/O 시작</text>
<path d="M 912 208 L 920 208" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<circle cx="932" cy="208" r="8" fill="none" stroke="#F08A59" stroke-width="1.4"/>
<circle cx="932" cy="208" r="4" fill="#F08A59"/>
<rect x="288" y="310" width="184" height="84" rx="6" fill="rgba(227,179,65,0.06)" stroke="#E3B341" stroke-width="0.8"/>
<text x="380" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">SYN 대기열 (반가상 연결)</text>
<text x="380" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">용량: tcp_max_syn_backlog</text>
<text x="380" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">미완료 SYN 패킷 보관</text>
<line x1="380" y1="256" x2="380" y2="310" stroke="#E3B341" stroke-width="0.8" stroke-dasharray="2 3"/>
<rect x="528" y="310" width="184" height="84" rx="6" fill="rgba(63,185,140,0.06)" stroke="#3FB98C" stroke-width="0.8"/>
<text x="620" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">Accept 대기열 (완성 연결)</text>
<text x="620" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">용량: maxListenerBacklog()</text>
<text x="620" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">핸드셰이크 완료 소켓 대기</text>
<line x1="620" y1="256" x2="620" y2="310" stroke="#3FB98C" stroke-width="0.8" stroke-dasharray="2 3"/>
<line x1="12" y1="425" x2="912" y2="425" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="447" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="437" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="122" y="447" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">미완료 단계</text>
<rect x="222" y="437" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="244" y="447" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SYN 대기열 (반연결)</text>
<rect x="435" y="437" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="457" y="447" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핸드셰이크 완료 · Dial 성공</text>
<rect x="713" y="437" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="735" y="447" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Accept 소켓 획득 (focal)</text>
</svg>
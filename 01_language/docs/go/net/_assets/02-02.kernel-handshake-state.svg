<text x="745.0" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">Accept() 호출</text>
<text x="745.0" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">dequeue</text>
<rect x="790" y="164" width="116" height="88" rx="8" fill="#F08A591A" stroke="#F08A59" stroke-width="1.4"/>
<text x="848" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">ACCEPTED</text>
<text x="848" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">net.Conn 반환</text>
<line x1="800" y1="217" x2="896" y2="217" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="848" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">연결 I/O 시작</text>
<path d="M 910 208 L 930 208" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<circle cx="942" cy="208" r="8" fill="none" stroke="#F08A59" stroke-width="1.4"/>
<circle cx="942" cy="208" r="4" fill="#F08A59"/>
<rect x="300" y="310" width="200" height="84" rx="6" fill="rgba(227,179,65,0.06)" stroke="#E3B341" stroke-width="0.8"/>
<text x="400" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">SYN 대기열 (반연결 큐)</text>
<text x="400" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">용량: tcp_max_syn_backlog</text>
<text x="400" y="370" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Linux 기준 · 미완료 연결</text>

<title id="dt">커널 핸드셰이크와 Accept 큐 상태 전이</title><desc id="dd">클라이언트 SYN 부터 커널 대기열을 거쳐 Accept() 소켓 획득까지의 상태 변화</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP HANDSHAKE AND ACCEPT QUEUE STATE TRANSITIONS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널 핸드셰이크와 Accept 큐 상태 전이</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Dial 의 성공은 Accept 호출이 아니라 커널의 핸드셰이크 완료 시점에 확정됩니다</text>
<circle cx="30" cy="208" r="6" fill="#F5F5F3"/>
<path d="M 38 208 L 94 208" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="69.0" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Dial() 호출</text>
<rect x="100" y="164" width="140" height="88" rx="8" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="170" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">SYN_SENT</text>
<text x="170" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">클라이언트 SYN 발송</text>
<line x1="110" y1="217" x2="230" y2="217" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<text x="170" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Dial 블로킹 대기</text>
<path d="M 244 208 L 324 208" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="285.0" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">SYN 도달</text>
<text x="285.0" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">SYN-ACK 응답</text>

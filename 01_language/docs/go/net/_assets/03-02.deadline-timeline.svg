<title id="dt">SetDeadline 타임라인과 Read 블로킹 구간 비교</title><desc id="dd">1회 설정 시 마감 경과 후 바쁜 루프 발생과 매 Read 직전 갱신의 차이</desc>
<rect width="960" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NET.CONN DEADLINE TIMELINE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SetDeadline 타임라인과 Read 블로킹 구간 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">절대 시각 마감(deadline) 적용 방식에 따른 고루틴 대기 구간과 호출 횟수 대조</text>
<line x1="200" y1="108" x2="200" y2="380" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="200" y="100" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">0ms</text>
<line x1="336" y1="108" x2="336" y2="380" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="336" y="100" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">200ms</text>
<line x1="472" y1="108" x2="472" y2="380" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="472" y="100" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">400ms</text>
<line x1="608" y1="108" x2="608" y2="380" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="608" y="100" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">600ms</text>
<line x1="744" y1="108" x2="744" y2="380" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="744" y="100" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">800ms</text>
<line x1="880" y1="108" x2="880" y2="380" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="880" y="100" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1000ms</text>
<rect x="24" y="128" width="156" height="92" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="102" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">1회만 설정</text>
<text x="102" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">SetReadDeadline(t0+200ms)</text>
<text x="102" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">1초간 19,936,237회 호출</text>
<text x="102" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">CPU 100% 바쁜 루프</text>

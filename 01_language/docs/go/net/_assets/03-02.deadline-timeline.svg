<text x="608" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">os.ErrDeadlineExceeded (1,993만 회/초)</text>
<rect x="24" y="264" width="156" height="92" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>

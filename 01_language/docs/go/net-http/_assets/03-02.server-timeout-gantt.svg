<title id="dt">서버 타임아웃 경계와 Graceful Shutdown 간트</title><desc id="dd">요청 헤더·본문 수신, 핸들러 연산, 응답 쓰기, 유휴 대기 구간별 타임아웃과 Shutdown 동작</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">HTTP SERVER TIMEOUT BOUNDARIES AND SHUTDOWN LIFECYCLE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서버 타임아웃 경계와 Graceful Shutdown 간트</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">서버 타임아웃은 소켓 데드라인으로 강제되며 Shutdown 은 새 연결 차단 후 유휴 전환을 대기합니다</text>
<rect x="210" y="100" width="710" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="270" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">헤더 읽기</text>
<text x="270" y="129" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">readRequest</text>
<text x="395" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">본문 읽기</text>
<text x="395" y="129" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">Body.Read</text>
<line x1="330" y1="100" x2="330" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 3"/>
<text x="540" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">Handler 실행</text>
<text x="540" y="129" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">ServeHTTP</text>
<line x1="460" y1="100" x2="460" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 3"/>
<text x="690" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">응답 쓰기</text>
<text x="690" y="129" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">w.Write</text>
<line x1="620" y1="100" x2="620" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 3"/>
<text x="840" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">유휴 대기</text>
<text x="840" y="129" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">bufr.Peek</text>
<line x1="760" y1="100" x2="760" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 3"/>
<line x1="920" y1="100" x2="920" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 3"/>
<text x="28" y="172" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">ReadHeaderTimeout</text>
<text x="28" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">Server</text>
<rect x="212" y="158" width="116" height="32" rx="5" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="270" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">요청 헤더 수신 완료 제한</text>
<text x="28" y="226" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">ReadTimeout</text>
<text x="28" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">Server</text>
<rect x="212" y="212" width="246" height="32" rx="5" fill="#E3B34114" stroke="#E3B341" stroke-width="1.0"/>
<text x="335" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">헤더부터 요청 본문 전체 수신 제한</text>
<text x="28" y="280" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">WriteTimeout</text>
<text x="28" y="296" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">Server</text>
<rect x="332" y="266" width="426" height="32" rx="5" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="545" y="286" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="600" fill="#F08A59">헤더 수신 직후부터 Handler 실행 및 응답 완료까지 포괄 (focal)</text>
<text x="28" y="334" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">IdleTimeout</text>
<text x="28" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">Server</text>
<rect x="762" y="320" width="156" height="32" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="840" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">Keep-Alive 연결 풀 유휴 보관 한도</text>
<text x="28" y="396" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">Server.Shutdown()</text>
<text x="28" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">우아한 종료 (Graceful)</text>
<rect x="212" y="382" width="548" height="32" rx="5" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="484" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">활성 연결: Listener 닫기 후 진행 중인 요청 완료까지 대기 (또는 ctx 만료)</text>
<rect x="762" y="382" width="158" height="32" rx="5" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.0"/>
<text x="839" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">유휴 연결: 즉시 Close</text>
<line x1="12" y1="470" x2="912" y2="470" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="492" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="482" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">헤더 읽기 타임아웃</text>
<rect x="274" y="482" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="296" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">요청 전체 타임아웃</text>
<rect x="448" y="482" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="470" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핸들러 및 쓰기 타임아웃 (focal)</text>
<rect x="765" y="482" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="787" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">유휴 유지 타임아웃</text>
<rect x="939" y="482" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="961" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Shutdown 생명주기 제어</text>
</svg>
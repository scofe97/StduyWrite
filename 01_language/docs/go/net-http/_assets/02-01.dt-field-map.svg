<title id="dt">DefaultTransport 필드 분류와 기본값</title><desc id="dd">DefaultTransport 필드는 시간을 잰다, 개수를 센다, 길과 프로토콜을 정한다의 세 묶음이며 개수 묶음의 둘은 리터럴에 없어 0 의 기본 동작으로 정해진다</desc>
<rect width="960" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">HTTP DEFAULTTRANSPORT FIELD MAP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">DefaultTransport 필드 분류와 기본값</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">시간·개수·경로 세 묶음으로 나뉘며 개수 묶음의 둘은 리터럴에 없어 0 의 뜻으로 결정됩니다</text>
<rect x="24" y="100" width="912" height="388" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="124" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">DefaultTransport (*Transport)</text>
<text x="916" y="124" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">net/http/transport.go:45-56</text>
<rect x="44" y="136" width="424" height="336" rx="6" fill="#0D1117" stroke="#6A95D8" stroke-width="1.0"/>
<text x="60" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">시간을 잰다 (타임아웃 · 주기 5개)</text>
<line x1="60" y1="170" x2="452" y2="170" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="60" y="178" width="392" height="50" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="72" y="199" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">Dialer.Timeout</text>
<text x="440" y="199" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">30s</text>
<text x="72" y="217" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">소켓 연결 수립 제한</text>
<rect x="60" y="236" width="392" height="50" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="72" y="257" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">TLSHandshakeTimeout</text>
<text x="440" y="257" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">10s</text>
<text x="72" y="275" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">TLS 핸드셰이크 제한</text>
<rect x="60" y="294" width="392" height="50" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="72" y="315" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">ExpectContinueTimeout</text>
<text x="440" y="315" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">1s</text>
<text x="72" y="333" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">100-continue 응답 대기</text>
<rect x="60" y="352" width="392" height="50" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="72" y="373" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">IdleConnTimeout</text>
<text x="440" y="373" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">90s</text>
<text x="72" y="391" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">유휴 연결 보관 후 폐기</text>
<rect x="60" y="410" width="392" height="50" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="72" y="431" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">Dialer.KeepAlive</text>
<text x="440" y="431" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">30s</text>
<text x="72" y="449" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">TCP keepalive 유휴 탐침 시작</text>
<rect x="492" y="136" width="424" height="208" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="1.2"/>
<text x="508" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">개수를 센다 (연결 한도 3개 · focal)</text>
<line x1="508" y1="170" x2="900" y2="170" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="508" y="178" width="392" height="48" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="520" y="199" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">MaxIdleConns</text>
<text x="888" y="199" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">100 (빈 연결, 전 호스트)</text>
<text x="520" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">전체 호스트 유휴 연결 총합</text>
<rect x="508" y="234" width="392" height="48" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="520" y="255" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">MaxIdleConnsPerHost</text>
<text x="888" y="255" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">리터럴에 없음 → 0 → 2</text>
<text x="520" y="272" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">호스트당 기본 2개 보관 (focal)</text>
<rect x="508" y="290" width="392" height="48" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="520" y="311" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">MaxConnsPerHost</text>
<text x="888" y="311" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">리터럴에 없음 → 0 → 무제한</text>
<text x="520" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">호스트당 총 연결 제한 없음 (focal)</text>
<rect x="492" y="356" width="424" height="116" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.0"/>
<text x="508" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">길과 프로토콜을 정한다 (2개)</text>
<line x1="508" y1="390" x2="900" y2="390" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="508" y="396" width="392" height="30" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="520" y="416" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">Proxy</text>
<text x="888" y="416" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">ProxyFromEnvironment</text>
<rect x="508" y="432" width="392" height="30" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="520" y="452" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">ForceAttemptHTTP2</text>
<text x="888" y="452" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">true</text>
<line x1="12" y1="504" x2="912" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="526" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="516" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">리터럴 없음 0 대체 (focal)</text>
<rect x="391" y="516" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="413" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시간 설정 (타임아웃 · 주기)</text>
<rect x="656" y="516" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="678" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">경로 및 프로토콜 설정</text>
</svg>
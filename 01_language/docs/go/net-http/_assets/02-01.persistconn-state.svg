<title id="dt">persistConn 생명주기와 연결 풀 상태 전이</title><desc id="dd">연결 생성부터 활성 I/O, Body 소비 완료 후 유휴 풀 보관 및 재사용/만료 폐기</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PERSISTCONN LIFECYCLE AND STATE TRANSITIONS</text>

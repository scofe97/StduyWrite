<title id="dt">두 KeepAlive 시계: TCP 탐침과 HTTP 풀 타임아웃</title><desc id="dd">이름이 같은 두 KeepAlive는 동작 계층과 시계가 다르다. 풀에 있는 연결은 90s에 먼저 닫히고, 무응답 연결은 TCP 15s 재전송 9회 실패 후 165s에 소켓을 절단한다</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KEEPALIVE TIMERS COMPARISON</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">두 KeepAlive 시계: TCP 탐침과 HTTP 풀 타임아웃</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">응답하는 상대에게 탐침은 30s 마다 가고, 풀의 빈 연결을 닫는 것은 90s 의 IdleConnTimeout 입니다</text>
<rect x="240" y="96" width="660" height="28" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="240" y1="124" x2="240" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="246" y="114" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F5F5F3">0s</text>
<line x1="300" y1="124" x2="300" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="300" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">15s</text>
<line x1="360" y1="124" x2="360" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="360" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F5F5F3">30s</text>
<line x1="420" y1="124" x2="420" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="420" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">45s</text>
<line x1="480" y1="124" x2="480" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="480" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">60s</text>
<line x1="540" y1="124" x2="540" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="540" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">75s</text>
<line x1="600" y1="124" x2="600" y2="396" stroke="#F08A59" stroke-width="1.1" stroke-dasharray="3 3"/>
<text x="600" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F08A59">90s</text>
<line x1="660" y1="124" x2="660" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="660" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">105s</text>
<line x1="720" y1="124" x2="720" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="720" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">120s</text>
<line x1="780" y1="124" x2="780" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="780" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">135s</text>
<line x1="840" y1="124" x2="840" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="840" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">150s</text>
<line x1="900" y1="124" x2="900" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="894" y="114" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F5F5F3">165s</text>
<rect x="24" y="134" width="204" height="134" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">TCP keepalive</text>
<text x="36" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">Dialer.KeepAlive 30s</text>
<text x="36" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">L4 커널 소켓 생존 탐침</text>
<text x="36" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">KeepAliveConfig (15s · 9회)</text>
<text x="36" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">최대 165s 후 커널 절단</text>
<rect x="240" y="144" width="114" height="28" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.1"/>
<text x="297" y="162" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">30s 유휴 대기</text>
<line x1="360" y1="158" x2="600" y2="158" stroke="#6A95D8" stroke-width="1.4"/>
<circle cx="360" cy="158" r="4" fill="#6A95D8" stroke="#0D1117" stroke-width="1.2"/>
<text x="360" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#6A95D8">#1</text>
<circle cx="480" cy="158" r="4" fill="#6A95D8" stroke="#0D1117" stroke-width="1.2"/>
<text x="480" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#6A95D8">#2</text>
<text x="480" y="178" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">정상 응답: 30s 마다 탐침, 90s 에 풀이 닫음</text>
<text x="240" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">무응답 상대 · 풀 밖 연결 (예: 응답을 기다리는 중인 연결)</text>
<rect x="240" y="216" width="100" height="28" rx="4" fill="#5E6B7E14" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="290" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">30s 유휴 대기</text>
<line x1="360" y1="230" x2="900" y2="230" stroke="#E3B341" stroke-width="1.2"/>
<circle cx="360" cy="230" r="4" fill="#6A95D8" stroke="#0D1117" stroke-width="1.2"/>
<text x="360" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#6A95D8">#1</text>
<circle cx="420" cy="230" r="4" fill="#E3B341" stroke="#0D1117" stroke-width="1.2"/>
<text x="420" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#E3B341">#2</text>
<circle cx="480" cy="230" r="4" fill="#E3B341" stroke="#0D1117" stroke-width="1.2"/>
<text x="480" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#E3B341">#3</text>
<circle cx="540" cy="230" r="4" fill="#E3B341" stroke="#0D1117" stroke-width="1.2"/>
<text x="540" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#E3B341">#4</text>
<circle cx="600" cy="230" r="4" fill="#E3B341" stroke="#0D1117" stroke-width="1.2"/>
<text x="600" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#E3B341">#5</text>
<circle cx="660" cy="230" r="4" fill="#E3B341" stroke="#0D1117" stroke-width="1.2"/>
<text x="660" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#E3B341">#6</text>
<circle cx="720" cy="230" r="4" fill="#E3B341" stroke="#0D1117" stroke-width="1.2"/>
<text x="720" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#E3B341">#7</text>
<circle cx="780" cy="230" r="4" fill="#E3B341" stroke="#0D1117" stroke-width="1.2"/>
<text x="780" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#E3B341">#8</text>
<circle cx="840" cy="230" r="4" fill="#E3B341" stroke="#0D1117" stroke-width="1.2"/>
<text x="840" y="222" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#E3B341">#9</text>
<text x="600" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">탐침 9회 (15s 간격)</text>
<line x1="900" y1="218" x2="900" y2="242" stroke="#F0616D" stroke-width="2.0"/>
<rect x="748" y="237" width="152" height="24" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="1.1"/>
<text x="824" y="253" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">30s + 15s×9 = 165s 절단</text>
<rect x="24" y="282" width="204" height="104" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="306" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">HTTP keep-alive</text>
<text x="36" y="326" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">IdleConnTimeout 90s</text>
<text x="36" y="346" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">L7 Transport 유휴 풀</text>
<text x="36" y="364" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">호스트당 빈 연결 2</text>
<rect x="240" y="292" width="356" height="40" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="400" y="317" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">커넥션 풀 유휴 보관 (최대 90s)</text>
<path d="M 420 358 L 420 334" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="420" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">새 요청 도착 시 재사용</text>
<rect x="600" y="288" width="140" height="48" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="1.6"/>
<text x="670" y="308" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">IdleConnTimeout</text>
<text x="670" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">90s 닫음 (focal)</text>
<rect x="744" y="292" width="156" height="40" rx="4" fill="#161B2288" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="822" y="317" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">연결 닫힘 (풀에서 제거)</text>
<line x1="12" y1="422" x2="912" y2="422" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="444" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="80" y="434" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="102" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">HTTP 90s (focal)</text>
<rect x="230" y="434" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="252" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCP 30s 탐침</text>
<rect x="348" y="434" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="370" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCP 15s 재전송 (무응답)</text>
<rect x="535" y="434" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="557" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCP 165s 절단</text>

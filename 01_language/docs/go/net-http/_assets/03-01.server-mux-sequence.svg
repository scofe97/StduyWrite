<title id="dt">Server 연결 수락과 ServeMux 라우팅 시퀀스</title><desc id="dd">Server.Serve 의 Accept 루프부터 conn.serve 고루틴 스폰, 패턴 매칭, Keep-Alive 재사용 흐름</desc>
<rect width="960" height="708" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">HTTP SERVER DISPATCH AND SERVEMUX ROUTING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Server 연결 수락과 ServeMux 라우팅 시퀀스</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Server 는 연결마다 고루틴을 띄우고 conn.serve 는 동일 TCP 소켓으로 후속 요청을 이어 처리합니다</text>

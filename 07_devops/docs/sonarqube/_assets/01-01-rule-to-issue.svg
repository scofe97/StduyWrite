<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%"
     role="img" aria-labelledby="sq-rule-issue-title sq-rule-issue-desc">
  <title id="sq-rule-issue-title">규칙이 깨진 뒤 이슈가 되는 길과 Hotspot 이 되는 길</title>
  <desc id="sq-rule-issue-desc">규칙이 깨지면 대부분은 이슈가 되어 소프트웨어 품질과 심각도를 물려받지만, 위험 여부를 도구가 단정할 수 없는 코드는 Security Hotspot 으로 빠져 사람의 검토를 기다린다. 그래서 Hotspot 규칙에는 품질 영향이 매겨져 있지 않다.</desc>
  <defs>
    <marker id="fc-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8B98A9"/></marker>
    <marker id="fc-arr-accent" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#F08A59"/></marker>
  </defs>

  <rect width="960" height="460" fill="#0D1117"/>
  <text x="40" y="28" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.14em">RULE BROKEN — TWO OUTCOMES</text>

  <path d="M480,76 V96" fill="none" stroke="#8B98A9" stroke-width="1" marker-end="url(#fc-arr)"/>
  <path d="M368,152 H248 Q240,152 240,160 V228" fill="none" stroke="#8B98A9" stroke-width="1" marker-end="url(#fc-arr)"/>
  <path d="M592,152 H712 Q720,152 720,160 V228" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#fc-arr-accent)"/>
  <path d="M240,284 V328" fill="none" stroke="#8B98A9" stroke-width="1" marker-end="url(#fc-arr)"/>
  <path d="M720,284 V328" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#fc-arr-accent)"/>

  <rect x="272" y="128" width="72" height="16" rx="2" fill="#0D1117"/>
  <text x="308" y="140" fill="#8B98A9" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">아니오</text>
  <rect x="616" y="128" width="72" height="16" rx="2" fill="#0D1117"/>
  <text x="652" y="140" fill="#F08A59" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">예</text>

  <rect x="380" y="36" width="200" height="40" rx="20" fill="rgba(245,245,243,0.04)" stroke="rgba(245,245,243,0.28)" stroke-width="1"/>
  <text x="480" y="61" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">규칙이 깨졌다</text>

  <path d="M480,96 L592,152 L480,208 L368,152 Z" fill="rgba(245,245,243,0.04)" stroke="rgba(245,245,243,0.28)" stroke-width="1"/>
  <text x="480" y="148" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">위험 여부가 맥락에</text>
  <text x="480" y="168" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">따라 달라지는가</text>

  <rect x="140" y="228" width="200" height="56" rx="6" fill="rgba(245,245,243,0.04)" stroke="rgba(245,245,243,0.24)" stroke-width="1"/>
  <text x="240" y="254" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">이슈</text>
  <text x="240" y="273" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">java 656 rules</text>

  <rect x="620" y="228" width="200" height="56" rx="6" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
  <text x="720" y="254" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">Security Hotspot</text>
  <text x="720" y="273" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">java 39 rules</text>

  <rect x="140" y="328" width="200" height="48" rx="6" fill="rgba(245,245,243,0.04)" stroke="rgba(245,245,243,0.24)" stroke-width="1"/>
  <text x="240" y="350" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">품질 · 심각도</text>
  <text x="240" y="367" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">inherited from rule</text>

  <rect x="620" y="328" width="200" height="48" rx="6" fill="rgba(245,245,243,0.04)" stroke="rgba(245,245,243,0.24)" stroke-width="1"/>
  <text x="720" y="350" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">사람이 검토</text>
  <text x="720" y="367" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">no impact assigned</text>

  <line x1="40" y1="412" x2="920" y2="412" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
  <text x="40" y="436" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.14em">NOTE</text>
  <text x="108" y="436" fill="#8B98A9" font-size="9" font-family="'Geist Mono',monospace">Hotspot carries no software-quality impact — the review decides whether it is a risk at all</text>
</svg>

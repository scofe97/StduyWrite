<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%"
     role="img" aria-labelledby="sq-ci-seq-title sq-ci-seq-desc">
  <title id="sq-ci-seq-title">커밋에서 파이프라인 판정까지 오가는 메시지</title>
  <desc id="sq-ci-seq-desc">개발자의 푸시가 Jenkins 를 깨우고, Jenkins 가 스캐너를 돌려 리포트를 SonarQube 에 올린다. 서버는 taskId 를 돌려준 뒤 Compute Engine 이 처리를 마치면 웹훅으로 Jenkins 에 통보하고, 그때서야 게이트 스테이지가 풀린다. 웹훅이 없으면 이 마지막 단계가 오지 않아 파이프라인이 타임아웃까지 멈춘다.</desc>
  <defs>
    <marker id="sq-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8B98A9"/></marker>
    <marker id="sq-arr-acc" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#F08A59"/></marker>
    <marker id="sq-arr-ok" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3FB98C"/></marker>
  </defs>

  <rect width="960" height="460" fill="#0D1117"/>
  <text x="40" y="32" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CI ROUND TRIP</text>

  <rect x="40" y="52" width="160" height="36" rx="6" fill="rgba(245,245,243,0.06)" stroke="rgba(245,245,243,0.28)" stroke-width="1"/>
  <text x="120" y="75" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">개발자 · SCM</text>
  <rect x="280" y="52" width="160" height="36" rx="6" fill="rgba(245,245,243,0.06)" stroke="rgba(245,245,243,0.28)" stroke-width="1"/>
  <text x="360" y="75" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">Jenkins</text>
  <rect x="600" y="52" width="160" height="36" rx="6" fill="rgba(245,245,243,0.06)" stroke="rgba(245,245,243,0.28)" stroke-width="1"/>
  <text x="680" y="75" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">SonarQube</text>

  <line x1="120" y1="88" x2="120" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="360" y1="88" x2="360" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="680" y1="88" x2="680" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="4,4"/>

  <path d="M120,128 H352" fill="none" stroke="#8B98A9" stroke-width="1" marker-end="url(#sq-arr)"/>
  <rect x="152" y="106" width="128" height="16" rx="2" fill="#0D1117"/>
  <text x="216" y="118" fill="#8B98A9" font-size="12" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">push · 트리거</text>

  <path d="M360,176 H672" fill="none" stroke="#8B98A9" stroke-width="1" marker-end="url(#sq-arr)"/>
  <rect x="404" y="154" width="220" height="16" rx="2" fill="#0D1117"/>
  <text x="514" y="166" fill="#8B98A9" font-size="12" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">스캐너 실행 → 리포트 업로드</text>

  <path d="M680,216 H368" fill="none" stroke="#8B98A9" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#sq-arr)"/>
  <rect x="452" y="194" width="140" height="16" rx="2" fill="#0D1117"/>
  <text x="522" y="206" fill="#8B98A9" font-size="12" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">taskId 반환</text>

  <path d="M688,248 H744 Q752,248 752,256 V272 Q752,280 744,280 H688" fill="none" stroke="#8B98A9" stroke-width="1" marker-end="url(#sq-arr)"/>
  <text x="768" y="268" fill="#8B98A9" font-size="12" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Compute Engine 처리</text>

  <path d="M680,320 H368" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#sq-arr-acc)"/>
  <rect x="440" y="298" width="168" height="16" rx="2" fill="#0D1117"/>
  <text x="524" y="310" fill="#F08A59" font-size="12" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">webhook 통보 (필수)</text>

  <path d="M368,360 H288 Q280,360 280,368 V376 Q280,384 288,384 H352" fill="none" stroke="#3FB98C" stroke-width="1" marker-end="url(#sq-arr-ok)"/>
  <text x="272" y="368" fill="#3FB98C" font-size="12" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="end">게이트 판정</text>

  <line x1="40" y1="412" x2="920" y2="412" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
  <text x="40" y="436" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.14em">NOTE</text>
  <text x="108" y="436" fill="#8B98A9" font-size="9" font-family="'Geist Mono',monospace">waitForQualityGate does not poll — without the webhook the gate stage waits until timeout</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 484" width="100%" role="img" aria-labelledby="t0601 d0601">
  <title id="t0601">에디션은 누적 포함 관계이며 실습 인스턴스는 가장 안쪽 Community Build 에 있다</title>
  <desc id="d0601">Data Center 가 Enterprise 를, Enterprise 가 Developer 를, Developer 가 Community Build 를 포함한다. 바깥으로 갈수록 기능이 더해지며 각 링에 적힌 항목은 그 단계에서 새로 열리는 것이다.</desc>

  <rect width="960" height="484" fill="#0D1117"/>

  <text x="40" y="44" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.6">EDITIONS / CUMULATIVE SCOPE</text>
  <text x="40" y="72" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="600">바깥 링이 안쪽 링을 전부 포함합니다</text>
  <text x="40" y="94" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">각 링에 적은 것은 그 단계에서 새로 열리는 기능입니다. 과금은 전부 인스턴스당 연간 LOC 용량 기준입니다.</text>

  <rect x="40" y="140" width="880" height="304" rx="8" fill="rgba(245,245,243,0.015)" stroke="rgba(191,192,192,0.30)" stroke-width="1"/>
  <rect x="72" y="176" width="816" height="232" rx="8" fill="rgba(245,245,243,0.025)" stroke="rgba(191,192,192,0.45)" stroke-width="1"/>
  <rect x="104" y="212" width="752" height="144" rx="8" fill="rgba(139,152,169,0.05)" stroke="#8B98A9" stroke-width="1"/>
  <rect x="136" y="248" width="688" height="72" rx="8" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>

  <rect x="52" y="133" width="76" height="14" fill="#0D1117"/>
  <text x="56" y="144" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.12">DATA CENTER</text>

  <rect x="84" y="169" width="72" height="14" fill="#0D1117"/>
  <text x="88" y="180" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.12">ENTERPRISE</text>

  <rect x="116" y="205" width="68" height="14" fill="#0D1117"/>
  <text x="120" y="216" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.12">DEVELOPER</text>

  <rect x="148" y="241" width="196" height="14" fill="#0D1117"/>
  <text x="152" y="252" fill="#F08A59" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.12">COMMUNITY BUILD — 무료 · 실습 대상</text>

  <text x="156" y="282" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">언어 27개 · 커스텀 Quality Profile 과 Gate · SAML · 웹훅 · DevOps 플랫폼 연동</text>
  <text x="156" y="302" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">main 브랜치만 분석합니다. 브랜치와 PR 은 여기서 끊깁니다.</text>

  <text x="124" y="342" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">＋ 브랜치·PR 분석 · injection 취약점 탐지 · C/C++/Swift 등 7개 언어 · Applications · Jira · Slack</text>

  <text x="92" y="380" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">＋ Portfolio · 보안·규제 리포트 · SCIM · 감사 로그 · 토큰 최대 수명 · monorepo · prioritized rules</text>
  <text x="92" y="398" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">＋ Apex·COBOL 등 6개 언어 · 여기서부터 Advanced Security 를 별도 제품으로 구매할 수 있습니다</text>

  <text x="60" y="430" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">＋ 고가용성 · 수평 확장 · Kubernetes 오토스케일링</text>
</svg>

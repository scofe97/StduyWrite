<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%"
     role="img" aria-labelledby="sq-issue-life-title sq-issue-life-desc">
  <title id="sq-issue-life-title">이슈가 처음 발견된 뒤 오가는 상태</title>
  <desc id="sq-issue-life-desc">첫 분석에서 Open 으로 시작한 이슈는 사람이 Accepted 나 False positive 로 옮기거나, 다음 분석에서 검출되지 않으면 서버가 Fixed 로 바꾼다. Accepted 와 False positive 는 다시 Open 으로 되돌릴 수 있다. 업그레이드가 만든 이슈는 조건을 만족하면 In sandbox 로 격리되어 Quality Gate 에서 빠진다.</desc>
  <defs>
    <marker id="st-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8B98A9"/></marker>
    <marker id="st-arr-ok" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3FB98C"/></marker>
    <marker id="st-arr-acc" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#F08A59"/></marker>
  </defs>

  <rect width="960" height="400" fill="#0D1117"/>
  <text x="40" y="32" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.14em">ISSUE LIFECYCLE — 2026.1</text>

  <circle cx="400" cy="44" r="6" fill="#F5F5F3"/>
  <path d="M400,50 V68" fill="none" stroke="#8B98A9" stroke-width="1" marker-end="url(#st-arr)"/>

  <path d="M360,124 V172 Q360,180 352,180 H128 Q120,180 120,188 V212" fill="none" stroke="#8B98A9" stroke-width="1" marker-end="url(#st-arr)"/>
  <path d="M400,124 V212" fill="none" stroke="#8B98A9" stroke-width="1" marker-end="url(#st-arr)"/>
  <path d="M440,124 V172 Q440,180 448,180 H640 Q648,180 648,188 V212" fill="none" stroke="#3FB98C" stroke-width="1" marker-end="url(#st-arr-ok)"/>
  <path d="M480,96 H680" fill="none" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#st-arr-acc)"/>

  <rect x="180" y="158" width="120" height="16" rx="2" fill="#0D1117"/>
  <text x="240" y="170" fill="#8B98A9" font-size="12" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">나중에 고침</text>
  <rect x="484" y="158" width="120" height="16" rx="2" fill="#0D1117"/>
  <text x="544" y="170" fill="#3FB98C" font-size="12" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">검출 안 됨</text>
  <rect x="410" y="188" width="108" height="16" rx="2" fill="#0D1117"/>
  <text x="464" y="200" fill="#8B98A9" font-size="12" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">오탐 판정</text>
  <rect x="512" y="66" width="136" height="16" rx="2" fill="#0D1117"/>
  <text x="580" y="78" fill="#F08A59" font-size="12" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">업그레이드 직후</text>

  <rect x="320" y="68" width="160" height="56" rx="8" fill="rgba(245,245,243,0.06)" stroke="rgba(245,245,243,0.32)" stroke-width="1"/>
  <text x="400" y="94" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">Open</text>
  <text x="400" y="112" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">initial</text>

  <rect x="40" y="212" width="160" height="56" rx="8" fill="rgba(245,245,243,0.04)" stroke="rgba(245,245,243,0.24)" stroke-width="1"/>
  <text x="120" y="238" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">Accepted</text>
  <text x="120" y="256" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">excluded from rating</text>

  <rect x="320" y="212" width="160" height="56" rx="8" fill="rgba(245,245,243,0.04)" stroke="rgba(245,245,243,0.24)" stroke-width="1"/>
  <text x="400" y="238" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">False positive</text>
  <text x="400" y="256" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">excluded from rating</text>

  <rect x="568" y="212" width="160" height="56" rx="8" fill="rgba(63,185,140,0.10)" stroke="rgba(63,185,140,0.55)" stroke-width="1"/>
  <text x="648" y="238" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">Fixed</text>
  <text x="648" y="256" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">purged after 30d</text>

  <rect x="680" y="68" width="160" height="56" rx="8" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
  <text x="760" y="94" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">In sandbox</text>
  <text x="760" y="112" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">out of quality gate</text>

  <text x="40" y="304" fill="#8B98A9" font-size="12" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Accepted · False positive · In sandbox → Open — 권한이 있으면 사람이 언제든 되돌립니다</text>
  <text x="40" y="326" fill="#8B98A9" font-size="12" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Fixed 만 서버가 자동으로 설정하며, 되돌리려면 코드에서 다시 검출되어야 합니다</text>

  <line x1="40" y1="352" x2="920" y2="352" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
  <text x="40" y="376" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.14em">NOTE</text>
  <text x="108" y="376" fill="#8B98A9" font-size="9" font-family="'Geist Mono',monospace">Sandbox only fires on the first analysis after an update, and only for inherited quality profiles</text>
</svg>

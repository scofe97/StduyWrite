<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 484" width="100%" role="img" aria-labelledby="t0602 d0602">
  <title id="t0602">Advanced Security 가 코어 기능이라 묶은 넷은 실제로 서로 다른 에디션 층에 걸쳐 있다</title>
  <desc id="d0602">Community Build 에도 규칙 기반 탐지와 Secrets, IaC 규칙이 실려 있다. Taint Analysis 만 Developer 부터 열린다. 그 위에 Enterprise 의 보안 거버넌스가 있고, Advanced Security 는 Enterprise 를 산 뒤에도 별도로 구매하는 제품이다.</desc>

  <defs>
    <marker id="up-ar" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#5E6B7E"/>
    </marker>
  </defs>

  <rect width="960" height="484" fill="#0D1117"/>

  <text x="40" y="44" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.6">SECURITY CAPABILITY / TIERS</text>
  <text x="40" y="72" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="600">보안 기능은 한 층에 있지 않습니다</text>
  <text x="40" y="94" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">위로 갈수록 비용이 올라갑니다. Advanced Security 문서가 코어라 묶은 넷이 아래 두 층에 걸쳐 있습니다.</text>

  <line x1="72" y1="392" x2="72" y2="144" stroke="#5E6B7E" stroke-width="1" marker-end="url(#up-ar)"/>

  <rect x="96" y="140" width="824" height="64" rx="6" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
  <text x="112" y="160" fill="#F08A59" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.12">SEPARATE PURCHASE</text>
  <text x="112" y="182" fill="#F08A59" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="14" font-weight="600">Advanced Security</text>
  <text x="304" y="182" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">SCA · Advanced SAST</text>
  <text x="904" y="182" text-anchor="end" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9">Enterprise 를 산 뒤 별도 구매</text>

  <rect x="96" y="204" width="824" height="64" rx="6" fill="rgba(139,152,169,0.06)" stroke="#8B98A9" stroke-width="1"/>
  <text x="112" y="224" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.12">ENTERPRISE</text>
  <text x="112" y="246" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="14" font-weight="600">보안 거버넌스</text>
  <text x="304" y="246" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">Security Engine 커스텀 설정 · 보안 리포트</text>
  <text x="904" y="246" text-anchor="end" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9">PCI DSS · OWASP · CWE · STIG · CASA</text>

  <rect x="96" y="268" width="824" height="64" rx="6" fill="rgba(240,97,109,0.06)" stroke="#F0616D" stroke-width="1"/>
  <text x="112" y="288" fill="#F0616D" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.12">DEVELOPER 이상</text>
  <text x="112" y="310" fill="#F0616D" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="14" font-weight="600">Taint Analysis</text>
  <text x="304" y="310" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">함수와 파일을 넘나드는 오염 추적 — injection 탐지</text>
  <text x="904" y="310" text-anchor="end" fill="#F0616D" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9">실측 javasecurity 0건</text>

  <rect x="96" y="332" width="824" height="64" rx="6" fill="rgba(63,185,140,0.06)" stroke="#3FB98C" stroke-width="1"/>
  <text x="112" y="352" fill="#3FB98C" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.12">COMMUNITY BUILD</text>
  <text x="112" y="374" fill="#3FB98C" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="14" font-weight="600">규칙 탐지 · Secrets · IaC</text>
  <text x="304" y="374" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">SAST 규칙 · 하드코딩된 비밀 · 인프라 정의 점검</text>
  <text x="904" y="374" text-anchor="end" fill="#3FB98C" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9">실측 secrets 30 · IaC 135건</text>

  <line x1="40" y1="424" x2="920" y2="424" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="40" y="444" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">아래 두 층은 로컬 인스턴스에서 직접 셌고, 위 두 층은 공식 문서 서술만 근거입니다. 실습으로 확인할 수 없는 영역입니다.</text>
</svg>

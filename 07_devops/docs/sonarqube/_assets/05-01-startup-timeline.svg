<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img" aria-labelledby="t0501 d0501">
  <title id="t0501">SonarQube 기동은 Elasticsearch · Web · Compute Engine 순으로 직렬 진행되며 Elasticsearch 가 전체 시간의 81%를 차지한다</title>
  <desc id="d0501">로컬 Community Build 26.1 인스턴스의 sonar.log 실측. 전체 6분 16초 중 Elasticsearch 기동 대기가 5분 3초, Web 기동이 1분 6초, Compute Engine 기동이 7초다. 앞 프로세스가 올라오기 전에는 다음 프로세스가 시작하지 않는다.</desc>

  <rect width="960" height="400" fill="#0D1117"/>

  <text x="40" y="44" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.6">STARTUP SEQUENCE / MEASURED</text>
  <text x="40" y="72" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="600">기동은 직렬이고 Elasticsearch 가 대부분을 먹는다</text>
  <text x="40" y="94" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">Community Build 26.1.0.118079 · sonar.log 실측 · 총 6분 16초</text>

  <text x="40" y="136" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.2">PROCESS</text>
  <text x="264" y="136" text-anchor="end" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.2">ELAPSED</text>
  <text x="280" y="136" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.2">BOOT ORDER</text>
  <line x1="40" y1="146" x2="920" y2="146" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="40" y="185" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" font-weight="600">Elasticsearch</text>
  <text x="264" y="185" text-anchor="end" fill="#F08A59" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600">5:03</text>
  <rect x="280" y="168" width="516" height="24" rx="4" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
  <text x="292" y="184" fill="#F08A59" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" font-weight="600">전체 기동 시간의 81%</text>

  <text x="40" y="225" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" font-weight="600">Web</text>
  <text x="264" y="225" text-anchor="end" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11">1:06</text>
  <rect x="796" y="208" width="112" height="24" rx="4" fill="rgba(139,152,169,0.15)" stroke="#8B98A9" stroke-width="1"/>

  <text x="40" y="265" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" font-weight="600">Compute Engine</text>
  <text x="264" y="265" text-anchor="end" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11">0:07</text>
  <rect x="908" y="248" width="12" height="24" rx="3" fill="rgba(139,152,169,0.15)" stroke="#8B98A9" stroke-width="1"/>

  <line x1="280" y1="292" x2="920" y2="292" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <line x1="280" y1="288" x2="280" y2="296" stroke="#5E6B7E" stroke-width="1"/>
  <line x1="796" y1="288" x2="796" y2="296" stroke="#5E6B7E" stroke-width="1"/>
  <line x1="920" y1="288" x2="920" y2="296" stroke="#5E6B7E" stroke-width="1"/>

  <text x="280" y="312" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9">18:45:31</text>
  <text x="792" y="312" text-anchor="end" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9">18:50:34</text>
  <text x="920" y="312" text-anchor="end" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9">18:51:47 operational</text>

  <line x1="40" y1="348" x2="920" y2="348" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="40" y="368" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">앞 프로세스가 up 이 되기 전에는 다음 프로세스를 띄우지 않습니다. 그래서 기동 시간 단축은 Elasticsearch 를 손대는 문제입니다.</text>
</svg>

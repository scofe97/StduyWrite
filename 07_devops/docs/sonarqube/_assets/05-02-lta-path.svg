<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img" aria-labelledby="t0502 d0502">
  <title id="t0502">업그레이드 경로에서 LTA 는 건너뛸 수 없는 경유지이며 2025.4 LTA 만 이 경로에서 선택 사항이다</title>
  <desc id="d0502">경로에 LTA 가 하나라도 끼면 각 LTA 를 차례로 거쳐야 한다. 9.9 LTA 에서 2025.1 LTA 로, 다시 2026.1 LTA 로 간다. 공식 문서는 2025.1 LTA 에서 2026.1 LTA 로 직접 갈 수 있다고 명시하므로 그 사이의 2025.4 LTA 는 이 경로에서 선택 사항이 된다.</desc>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8B98A9"/>
    </marker>
    <marker id="ar-info" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6A95D8"/>
    </marker>
    <marker id="ar-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#E3B341"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#0D1117"/>

  <text x="40" y="44" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.6">UPDATE PATH / LTA WAYPOINTS</text>
  <text x="40" y="72" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="600">LTA 는 건너뛸 수 없는 경유지입니다</text>
  <text x="40" y="94" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">경로에 LTA 가 하나라도 끼면 그 LTA 를 차례로 거쳐야 합니다</text>

  <path d="M 358 180 V 140 Q 358 132 366 132 H 838 Q 846 132 846 140 V 174" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#ar-info)"/>
  <rect x="512" y="107" width="180" height="15" fill="#0D1117"/>
  <text x="602" y="119" text-anchor="middle" fill="#6A95D8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9">2025.1 → 2026.1 직접 가능</text>

  <line x1="196" y1="208" x2="276" y2="208" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="440" y1="208" x2="520" y2="208" stroke="#E3B341" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ar-warn)"/>
  <line x1="684" y1="208" x2="764" y2="208" stroke="#E3B341" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ar-warn)"/>

  <rect x="40" y="180" width="148" height="56" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1"/>
  <text x="114" y="205" text-anchor="middle" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" font-weight="600">9.9 LTA</text>
  <text x="114" y="222" text-anchor="middle" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="10">이전 세대</text>

  <rect x="284" y="180" width="148" height="56" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1"/>
  <text x="358" y="205" text-anchor="middle" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" font-weight="600">2025.1 LTA</text>
  <text x="358" y="222" text-anchor="middle" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="10">필수 경유</text>

  <rect x="528" y="180" width="148" height="56" rx="6" fill="rgba(227,179,65,0.06)" stroke="#E3B341" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="602" y="205" text-anchor="middle" fill="#E3B341" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" font-weight="600">2025.4 LTA</text>
  <text x="602" y="222" text-anchor="middle" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="10">경유 선택</text>

  <rect x="772" y="180" width="148" height="56" rx="6" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
  <text x="846" y="205" text-anchor="middle" fill="#F08A59" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" font-weight="600">2026.1 LTA</text>
  <text x="846" y="222" text-anchor="middle" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="10">이 문서의 기준</text>

  <text x="40" y="284" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">비-LTA 버전은 경유지가 아닙니다. 10.6 에서 2025.3 으로 갈 때도 사이의 2025.1 LTA 한 곳에만 멈추면 됩니다.</text>
  <text x="40" y="304" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">LTA 로 올릴 때는 그 LTA 의 최신 패치로 바로 갑니다. 중간 패치를 하나씩 밟을 필요가 없습니다.</text>

  <line x1="40" y1="336" x2="920" y2="336" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <rect x="40" y="352" width="12" height="12" rx="3" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
  <text x="60" y="362" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="10">이 문서의 기준 버전</text>

  <rect x="216" y="352" width="12" height="12" rx="3" fill="rgba(227,179,65,0.06)" stroke="#E3B341" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="236" y="362" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="10">LTA 이지만 이 경로에서는 선택</text>

  <line x1="472" y1="358" x2="496" y2="358" stroke="#6A95D8" stroke-width="1.2"/>
  <text x="504" y="362" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="10">공식 문서가 직접 이동을 명시한 경로</text>
</svg>

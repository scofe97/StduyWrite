<title id="dt">Shadow 요청 복제와 응답 폐기 시퀀스</title><desc id="dd">Istio mirror 프록시가 실트래픽을 v1으로 보내 응답을 반환하고, 같은 요청을 -shadow 헤더로 v2에 비동기 복제해 응답을 폐기한 뒤 결과를 비교하는 시퀀스</desc>

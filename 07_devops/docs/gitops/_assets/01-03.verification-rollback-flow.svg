<title id="dt">카나리 배포의 두 검증 관문과 자동 롤백</title><desc id="dd">setWeight 10 이후 readinessProbe(Health Check)와 AnalysisRun(1분 간격 5회, 5xx &lt; 0.05, failureLimit 2)을 거쳐 50·100% 승격 또는 abort 후 stable 100% 복귀로 갈리는 흐름</desc>

<title id="dt">이미지 빌더 선정과 아키텍처 흐름</title><desc id="dd">두 문제와 세 축 기준에서 6종 빌더 비교와 실행 환경별 선택 흐름</desc>
<rect width="960" height="410" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER · 01-03 OVERVIEW</text>

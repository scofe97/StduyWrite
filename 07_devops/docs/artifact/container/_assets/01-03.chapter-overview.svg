<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">문제 정의에서 분류 축, 도구 비교를 거쳐 환경별 선택에 이르는 4단계 흐름</text>
<text x="129" y="102" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">1단계: 문제 정의</text>

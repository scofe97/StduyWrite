<title id="dt">Harbor Replication (Push·Pull) 과 Proxy Cache 의 구조 비교</title><desc id="dd">Push 복제는 로컬 이벤트를 원격으로 밀어내고, Pull 복제는 로컬 jobservice 가 원격에서 당겨 오며, Proxy Cache 는 클라이언트 pull 시점에 온디맨드로 캐시한다</desc>

<title id="dt">Harbor Proxy Cache 의 pull 판정과 push 차단 순서</title><desc id="dd">캐시 미스 때는 업스트림에서 이미지를 내려받아 저장하고, 캐시 히트 때는 HEAD 요청으로 변경 여부만 확인해 rate limit 소모를 피하며, 업스트림 단절 시에는 캐시본을 반환한다</desc>
<rect width="960" height="756" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DEVOPS · HARBOR · PROXY CACHE FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Harbor Proxy Cache 의 pull 판정과 push 차단 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">HEAD 확인은 Docker Hub pull 횟수를 소모하지 않으며, 직접 push 는 차단됩니다</text>
<rect x="58" y="104" width="204" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="160" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="160" y="142" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">docker / containerd</text>
<rect x="378" y="104" width="204" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="480" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Harbor Proxy Cache</text>
<text x="480" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">프록시 프로젝트</text>
<rect x="698" y="104" width="204" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="800" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">업스트림 레지스트리</text>
<text x="800" y="142" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">Docker Hub · ECR</text>
<rect x="36" y="164" width="888" height="152" rx="4" fill="#161B22" stroke="#6A95D8" stroke-width="0.9"/>

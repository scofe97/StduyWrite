<title id="dt">Values 우선순위와 덮어쓰기 병합 메커니즘</title><desc id="dd">차트 기본값부터 --set까지 단계별 값 변경 경로 및 맵 키 병합과 리스트 대체</desc>
<rect width="960" height="424" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">HELM · VALUES PRECEDENCE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Values 우선순위와 덮어쓰기 병합 메커니즘</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">오른쪽 입력이 이전 값을 덮어씀 · 맵은 키 단위 합침, 리스트는 배열 통째 대체</text>

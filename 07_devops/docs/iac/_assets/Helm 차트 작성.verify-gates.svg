<text x="240" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">dry-run=server (Helm)</text>
<path d="M 335 318 L 518 318" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="426" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">필드 오류</text>
<rect x="520" y="293" width="410" height="50" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="536" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">오류 없이 통과 (미감지)</text>
<text x="536" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Helm 4.1.4 스키마 미검증 · ConfigMap.data 맵 삽입 통과</text>

<rect x="512" y="96" width="424" height="216" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="0.9" stroke-dasharray="5 4"/>
<rect x="528" y="100" width="274" height="14" rx="2" fill="#0D1117"/>
<text x="665" y="111" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Kubernetes 클러스터 (kube-apiserver)</text>

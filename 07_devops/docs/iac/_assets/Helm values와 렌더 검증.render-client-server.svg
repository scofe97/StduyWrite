<title id="dt">사전 렌더링 검증의 클라이언트·서버 모드와 검증 범위</title><desc id="dd">클라이언트 렌더와 서버 렌더의 API 서버 통신 여부 및 검증 가능 범위</desc>
<rect width="960" height="452" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">HELM · CLIENT VS SERVER RENDER</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">사전 렌더링 검증의 클라이언트·서버 모드와 검증 범위</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">클라이언트 렌더는 로컬 완결 · 서버 모드만 API 서버와 통신해 lookup 및 리소스 종류 검증</text>
<rect x="24" y="96" width="424" height="216" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="5 4"/>
<rect x="40" y="100" width="146" height="14" rx="2" fill="#0D1117"/>
<text x="113" y="111" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">로컬 환경 (Helm CLI)</text>
<rect x="40" y="126" width="392" height="74" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="56" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">클라이언트 렌더 (helm template / --dry-run=client)</text>
<text x="56" y="170" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">내장 Go 템플릿 엔진 실행 · API 서버 미접속</text>
<text x="56" y="188" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">lookup: "false" (빈 값) · .Capabilities: 내장 v1.35.0</text>
<rect x="40" y="222" width="392" height="74" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="1.2"/>
<text x="56" y="246" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">서버 렌더 (helm template / install --dry-run=server)</text>
<text x="56" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클러스터 접속 허용 · lookup 및 리소스 종류 질의</text>

<title id="dt">Agent 를 떼어도 남는 요청 통로</title><desc id="dd">Controller 가 Agent 에 빌드를 지시하고 Agent 는 파일 내용과 명령 실행을 Controller 에 요청할 수 있으며 접근 제어가 요청을 통과시키거나 막는다</desc>
<rect width="960" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">JENKINS · AGENT TO CONTROLLER REQUEST PATH</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Agent 를 떼어도 남는 요청 통로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">빌드를 Agent 로 옮겨도 Agent 에서 Controller 로 오는 요청은 접근 제어에서 통과하거나 막힌다</text>

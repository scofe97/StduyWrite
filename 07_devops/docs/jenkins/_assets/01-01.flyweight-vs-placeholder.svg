<title id="dt">Pipeline 빌드 하나가 두 Task 가 되는 순서</title><desc id="dd">Pipeline 빌드는 Controller 의 OneOffExecutor 에서 flyweight task 로 시작하고 node 블록에서 PlaceholderTask 를 큐에 넣어 Agent 의 정규 Executor 하나를 점유한다</desc>

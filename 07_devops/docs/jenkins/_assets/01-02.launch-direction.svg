<title id="dt">Launch method 셋의 연결 방향</title><desc id="dd">inbound 는 Agent 가 Controller 로, SSH 는 Controller 가 Agent 의 sshd 로, 명령 실행은 Controller 위의 명령이 표준 입출력으로 연결을 열고 java 를 시작하는 쪽도 다르다</desc>
<rect width="960" height="624" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">JENKINS · LAUNCH METHOD DIRECTION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Launch method 셋의 연결 방향</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표는 연결을 여는 쪽에서 받는 쪽으로 향하고, 초록 칩은 java 를 시작하는 쪽에 붙습니다</text>

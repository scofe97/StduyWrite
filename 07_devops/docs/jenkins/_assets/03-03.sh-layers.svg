<title id="dt">sh step 실행 계층과 종료 코드 전파</title><desc id="dd">OS 명령부터 Groovy 파이프라인까지의 4계층과 기본 -xe 가 꺼졌을 때 실패가 묻히는 경로</desc>
<rect width="960" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">JENKINS · SH STEP EXECUTION LAYERS</text>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">기본 -xe 는 중간 실패 시 즉시 중단하나 꺼지는 경로에서는 마지막 명령의 0 만 전달됩니다</text>
<text x="44" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">종료 코드 ↑</text>

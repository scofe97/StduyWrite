<title id="dt">input 승인 대기와 실행기 점유 해제</title><desc id="dd">파이프라인 최상위 agent 선언과 input 배치 방식에 따른 국면별 실행기 점유 비교. 최상위 agent any 는 승인 대기 중에도 정규 실행기 슬롯을 독점하여 큐 지연을 일으키지만, 최상위 agent none 과 input 지시어는 실행기 없이 Flyweight Task 로 대기합니다.</desc>
<rect width="936" height="332" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">JENKINS · INPUT &amp; EXECUTOR HOLD</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">input 승인 대기와 실행기 점유 해제</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">최상위 agent any 는 승인 대기 중 슬롯 독점(상단) vs agent none 은 실행기 없이 경량 대기(하단)</text>

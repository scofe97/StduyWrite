<title id="dt">agent 위치에 따른 Executor 점유 구간</title><desc id="dd">최상위 agent any 는 첫 stage 부터 마지막 stage 까지 Executor 하나를 잡고, 최상위 agent none 에 stage 별 agent 를 두면 그 stage 가 도는 동안만 잡으며 input 지시어의 승인 대기는 agent 블록 진입 전이라 잡지 않는다</desc>
<rect width="960" height="384" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">JENKINS · AGENT SCOPE AND EXECUTOR HOLD</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">agent 위치에 따른 Executor 점유 구간</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">승인을 stage 의 input 지시어로 받는 파이프라인에서 Executor 를 잡고 있는 구간입니다</text>
<text x="24" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">stage 순서 →</text>
<rect x="276" y="100" width="200" height="36" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="376" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">Build</text>
<rect x="484" y="100" width="200" height="36" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="584" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">승인 대기 (input)</text>
<rect x="692" y="100" width="200" height="36" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="792" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">Deploy</text>
<rect x="24" y="152" width="912" height="72" rx="8" fill="#F5F5F305" stroke="#F5F5F31A" stroke-width="0.8"/>
<rect x="24" y="236" width="912" height="72" rx="8" fill="#F5F5F305" stroke="#F5F5F31A" stroke-width="0.8"/>
<line x1="480" y1="160" x2="480" y2="300" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="688" y1="160" x2="688" y2="300" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<text x="40" y="186" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">agent any</text>
<text x="40" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">최상위에 선언</text>
<rect x="276" y="168" width="616" height="40" rx="4" fill="#E3B3411F" stroke="#E3B341" stroke-width="1.2"/>
<text x="288" y="193" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Executor 1개 점유</text>
<text x="880" y="193" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">마지막 stage 까지</text>
<rect x="499.0" y="178" width="170.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="584" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">승인 대기 중에도 점유</text>
<text x="40" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">agent none</text>
<text x="40" y="290" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">stage 마다 agent 선언</text>
<rect x="276" y="252" width="200" height="40" rx="4" fill="#3FB98C1F" stroke="#3FB98C" stroke-width="1.2"/>
<text x="288" y="277" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Executor 점유</text>
<rect x="484" y="252" width="200" height="40" rx="4" fill="none" stroke="#8B98A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="584" y="277" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">점유 없음</text>
<rect x="692" y="252" width="200" height="40" rx="4" fill="#3FB98C1F" stroke="#3FB98C" stroke-width="1.2"/>
<text x="704" y="277" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Executor 점유</text>
<line x1="12" y1="336" x2="912" y2="336" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="358" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="348" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="358" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">agent any 점유</text>
<rect x="300" y="348" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="322" y="358" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">stage 별 agent 점유</text>
<rect x="552" y="348" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="574" y="358" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">점유 없음</text>
<rect x="661" y="348" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="683" y="358" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">대기 중 점유</text>
</svg>
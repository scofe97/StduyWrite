<title id="dt">Agent 기계의 프로세스 겹과 옵션이 닿는 길</title><desc id="dd">Controller 의 JVM Options 칸은 Launch agent 때 Agent JVM 의 명령줄에만 닿고, 노드 환경 변수는 빌드마다 셸을 거쳐 빌드 JVM 에 닿는다</desc>

<title id="dt">빌드를 Controller 에서 돌릴 때와 Agent 로 뗀 뒤</title><desc id="dd">Controller 한 곳에서 제어와 빌드를 함께 돌리면 자원 경쟁, 파일 접근, 수직 확장의 세 위험이 생기고 빌드를 Agent 로 떼면 위험이 Agent 쪽으로 옮겨 간다</desc>
<rect width="960" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">JENKINS · CONTROLLER VS AGENT BUILD</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">빌드를 Controller 에서 돌릴 때와 Agent 로 뗀 뒤</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽은 한 프로세스에 모인 제어와 빌드, 오른쪽은 빌드를 Agent 로 뗀 뒤의 같은 일</text>

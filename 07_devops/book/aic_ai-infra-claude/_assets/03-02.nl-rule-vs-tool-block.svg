<svg viewBox="0 0 960 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>자연어 규칙 vs 도구 차단 — 신뢰 수준 대비</title>
  <desc>CLAUDE.md 자연어 규칙은 참조가 보장되지 않는 안내이고, settings.local.json 도구 차단은 명령 자체를 불가능하게 하는 강제. 반드시 지켜야 할 통제는 도구 층위로 내려야 함</desc>
  <rect x="0" y="0" width="960" height="400" fill="#0d0d0d"/>

  <text x="480" y="40" text-anchor="middle" fill="#e8e4df" font-size="15" font-weight="700">같은 의도, 다른 신뢰 수준</text>

  <!-- 왼쪽: 자연어 규칙 -->
  <rect x="30" y="64" width="440" height="300" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5" rx="8"/>
  <text x="250" y="96" text-anchor="middle" fill="#e8e4df" font-size="14" font-weight="700">자연어 규칙 (CLAUDE.md)</text>

  <rect x="54" y="114" width="392" height="56" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="5"/>
  <text x="70" y="138" fill="#e8e4df" font-size="11.5">"kubectl delete를 직접 실행하지 마"</text>
  <text x="70" y="158" fill="#e8e4df" font-size="11.5">"항상 깃을 통해 ArgoCD로 배포해"</text>

  <text x="70" y="198" fill="#e8e4df" font-size="12">성격 — '지켜주세요' 안내</text>
  <text x="70" y="224" fill="#e8e4df" font-size="12">대화 초반에 한 번 읽음</text>

  <rect x="54" y="244" width="392" height="72" fill="#f2d4d4" rx="5"/>
  <text x="70" y="268" font-size="12" font-weight="700" style="fill:#7a1f1f">한계 — 항상 참조되지 않음</text>
  <text x="70" y="290" font-size="11" style="fill:#7a1f1f">긴 작업 중엔 규칙을 잊고 delete 실행 가능</text>
  <text x="70" y="308" font-size="11" style="fill:#7a1f1f">(이때는 ArgoCD selfHeal이 복원)</text>

  <text x="250" y="344" text-anchor="middle" fill="#e8e4df" font-size="11.5">가이드 — 신뢰 수준 낮음</text>

  <!-- 오른쪽: 도구 차단 -->
  <rect x="490" y="64" width="440" height="300" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5" rx="8"/>
  <text x="710" y="96" text-anchor="middle" fill="#e8e4df" font-size="14" font-weight="700">도구 차단 (settings.local.json)</text>

  <rect x="514" y="114" width="392" height="56" fill="rgba(212,168,83,0.15)" stroke="rgb(212,168,83)" rx="5"/>
  <text x="710" y="147" text-anchor="middle" fill="#e8e4df" font-family="'JetBrains Mono',monospace" font-size="11">deny: kubectl delete / apply</text>

  <text x="530" y="198" fill="#e8e4df" font-size="12">성격 — 명령 자체가 불가능</text>
  <text x="530" y="224" fill="#e8e4df" font-size="12">매 호출마다 도구 층위에서 강제</text>

  <rect x="514" y="244" width="392" height="72" fill="#e6f7e7" rx="5"/>
  <text x="530" y="268" font-size="12" font-weight="700" style="fill:#14521d">보장 — 규칙을 잊어도 막힌다</text>
  <text x="530" y="290" font-size="11" style="fill:#14521d">참조 여부와 무관하게 명령이 실행 안 됨</text>
  <text x="530" y="308" font-size="11" style="fill:#14521d">7장에서 이 층위로 격상</text>

  <text x="710" y="344" text-anchor="middle" fill="rgb(212,168,83)" font-size="11.5" font-weight="700">강제 — 신뢰 수준 높음</text>
</svg>

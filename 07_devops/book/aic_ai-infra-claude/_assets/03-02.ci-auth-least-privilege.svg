<svg viewBox="0 0 960 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>CI 서비스 계정 최소 권한과 인증 흐름</title>
  <desc>깃허브 액션 CI가 GCP 서비스 계정 키로 Artifact Registry에만 접근하도록 artifactregistry.writer 하나만 부여하고 GKE·GCS·IAM 접근은 차단하는 최소 권한 설계</desc>
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#0d0d0d"/>

  <!-- GitHub Actions -->
  <rect x="30" y="160" width="180" height="120" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="8"/>
  <text x="120" y="192" text-anchor="middle" fill="#e8e4df" font-size="13" font-weight="700">깃허브 액션 CI</text>
  <rect x="50" y="208" width="140" height="30" fill="#dceaf7" rx="4"/>
  <text x="120" y="228" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" font-weight="700" style="fill:#10243a">GCP_SA_KEY</text>
  <text x="120" y="262" text-anchor="middle" fill="#e8e4df" font-size="11">GitHub Secrets에서 참조</text>

  <line x1="212" y1="220" x2="266" y2="220" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#ar2)"/>
  <text x="239" y="210" text-anchor="middle" fill="rgb(212,168,83)" font-size="10.5">auth@v2</text>

  <!-- 서비스 계정 -->
  <rect x="268" y="150" width="220" height="140" fill="rgba(212,168,83,0.15)" stroke="rgb(212,168,83)" stroke-width="1.5" rx="8"/>
  <text x="378" y="180" text-anchor="middle" fill="#e8e4df" font-size="13" font-weight="700">서비스 계정</text>
  <text x="378" y="200" text-anchor="middle" fill="rgb(212,168,83)" font-family="'JetBrains Mono',monospace" font-size="10.5">github-ci</text>
  <rect x="292" y="216" width="172" height="52" fill="#fdf3df" rx="5"/>
  <text x="378" y="238" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" style="fill:#0d0d0d">roles/</text>
  <text x="378" y="256" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" style="fill:#0d0d0d">artifactregistry.writer</text>

  <!-- 허용: Artifact Registry -->
  <line x1="490" y1="200" x2="560" y2="150" stroke="#66bb6a" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="530" y="160" fill="#66bb6a" font-size="11" font-weight="700">허용</text>
  <rect x="562" y="110" width="180" height="56" fill="#0d0d0d" stroke="#66bb6a" rx="6"/>
  <text x="652" y="136" text-anchor="middle" fill="#e8e4df" font-size="12.5">Artifact Registry</text>
  <text x="652" y="154" text-anchor="middle" fill="#66bb6a" font-size="11">이미지 푸시 ✓</text>

  <!-- 차단: GKE / GCS / IAM -->
  <line x1="490" y1="240" x2="560" y2="290" stroke="#f44336" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="524" y="286" fill="#f44336" font-size="11" font-weight="700">차단 ✕</text>
  <rect x="562" y="250" width="180" height="30" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="5"/>
  <text x="652" y="270" text-anchor="middle" fill="#e8e4df" font-size="11.5">GKE (배포 권한)</text>
  <rect x="562" y="288" width="180" height="30" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="5"/>
  <text x="652" y="308" text-anchor="middle" fill="#e8e4df" font-size="11.5">GCS (스토리지)</text>
  <rect x="562" y="326" width="180" height="30" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="5"/>
  <text x="652" y="346" text-anchor="middle" fill="#e8e4df" font-size="11.5">IAM (권한 부여)</text>

  <!-- 원칙 라벨 -->
  <text x="378" y="330" text-anchor="middle" fill="#e8e4df" font-size="12">CI가 할 일은 이미지 푸시뿐</text>
  <text x="378" y="352" text-anchor="middle" fill="#e8e4df" font-size="12">→ 나머지 권한은 주지 않는다</text>

  <text x="768" y="230" fill="#e8e4df" font-size="12" font-weight="700">최소 권한의 값</text>
  <text x="768" y="256" fill="#e8e4df" font-size="11.5">키가 유출돼도</text>
  <text x="768" y="276" fill="#e8e4df" font-size="11.5">피해 범위가</text>
  <text x="768" y="296" fill="#e8e4df" font-size="11.5">AR 쓰기로 한정</text>
  <text x="768" y="326" fill="#e8e4df" font-size="11">키는 만료 안 됨 —</text>
  <text x="768" y="345" fill="#e8e4df" font-size="11">로테이션 또는 WIF</text>
</svg>

<svg viewBox="0 0 900 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Valkey 설치 choreography — GitOps 경로와 리소스 자리 확보</title>
  <desc>위: replicas 변경을 kubectl patch로 하면 ArgoCD selfHeal이 되돌리므로 Git push 경로로 해야 한다. 아래: Blue/Green replicas 2에 Valkey를 얹으면 CPU가 부족해 6장에서 replicas를 1로 줄여 자리를 비우고 7장에서 노드 추가 후 복원한다.</desc>
  <defs>
    <marker id="icRed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f44336"/></marker>
    <marker id="icGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#66bb6a"/></marker>
    <marker id="icGray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8580"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#0d0d0d"/>

  <!-- ===== 위: 변경 경로 (patch vs Git) ===== -->
  <text x="450" y="34" text-anchor="middle" fill="#e8e4df" font-size="16" font-weight="700">① 변경은 Git으로 — kubectl patch는 되돌려진다</text>
  <text x="450" y="55" text-anchor="middle" fill="#e8e4df" font-size="12">ArgoCD selfHeal이 "깃과 다름"을 감지해 몇 초 안에 원래 값으로 복구</text>

  <!-- 잘못된 경로: kubectl patch -->
  <rect x="55" y="82" width="150" height="46" rx="6" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="130" y="102" text-anchor="middle" font-size="12" font-weight="700" style="fill:#f44336">kubectl patch</text>
  <text x="130" y="119" text-anchor="middle" font-size="10" style="fill:#f44336">클러스터 직접 변경</text>

  <rect x="290" y="82" width="150" height="46" rx="6" fill="#0d0d0d" stroke="#8a8580" stroke-width="1.2"/>
  <text x="365" y="102" text-anchor="middle" font-size="12" style="fill:#e8e4df">ArgoCD selfHeal</text>
  <text x="365" y="119" text-anchor="middle" font-size="10" style="fill:#e8e4df">깃과 다름 감지</text>

  <rect x="525" y="82" width="150" height="46" rx="6" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="600" y="102" text-anchor="middle" font-size="12" font-weight="700" style="fill:#f44336">원래 값으로 복구</text>
  <text x="600" y="119" text-anchor="middle" font-size="10" style="fill:#f44336">변경 무효 · 몇 초 내</text>

  <line x1="205" y1="105" x2="288" y2="105" stroke="#f44336" stroke-width="2" marker-end="url(#icRed)"/>
  <line x1="440" y1="105" x2="523" y2="105" stroke="#8a8580" stroke-width="2" marker-end="url(#icGray)"/>
  <text x="795" y="102" text-anchor="middle" font-size="22" style="fill:#f44336">✕</text>

  <!-- 올바른 경로: Git push -->
  <rect x="55" y="146" width="150" height="46" rx="6" fill="#dceaf7"/>
  <text x="130" y="166" text-anchor="middle" font-size="12" font-weight="700" style="fill:#0d0d0d">git push</text>
  <text x="130" y="183" text-anchor="middle" font-size="10" style="fill:#0d0d0d">rollout.yaml 커밋</text>

  <rect x="290" y="146" width="150" height="46" rx="6" fill="#dceaf7"/>
  <text x="365" y="166" text-anchor="middle" font-size="12" style="fill:#0d0d0d">ArgoCD sync</text>
  <text x="365" y="183" text-anchor="middle" font-size="10" style="fill:#0d0d0d">깃을 원천으로 적용</text>

  <rect x="525" y="146" width="150" height="46" rx="6" fill="#66bb6a"/>
  <text x="600" y="166" text-anchor="middle" font-size="12" font-weight="700" style="fill:#0d0d0d">클러스터 반영</text>
  <text x="600" y="183" text-anchor="middle" font-size="10" style="fill:#0d0d0d">변경 유지됨</text>

  <line x1="205" y1="169" x2="288" y2="169" stroke="#66bb6a" stroke-width="2" marker-end="url(#icGreen)"/>
  <line x1="440" y1="169" x2="523" y2="169" stroke="#66bb6a" stroke-width="2" marker-end="url(#icGreen)"/>
  <text x="795" y="176" text-anchor="middle" font-size="22" style="fill:#66bb6a">✓</text>

  <!-- 구분선 -->
  <line x1="55" y1="222" x2="845" y2="222" stroke="#2a2520" stroke-width="1"/>

  <!-- ===== 아래: 리소스 자리 확보 (replicas 2→1→복원) ===== -->
  <text x="450" y="256" text-anchor="middle" fill="#e8e4df" font-size="16" font-weight="700">② Valkey를 얹을 CPU 자리 — replicas를 잠시 줄인다</text>
  <text x="450" y="277" text-anchor="middle" fill="#e8e4df" font-size="12">e2-medium 2노드에서 Blue/Green 4 Pod + Valkey는 CPU가 빠듯하다</text>

  <!-- 단계 1: 기존 -->
  <rect x="55" y="306" width="220" height="86" rx="6" fill="#f5edda"/>
  <text x="165" y="330" text-anchor="middle" font-size="12" font-weight="700" style="fill:#0d0d0d">6장 진입 전</text>
  <text x="165" y="352" text-anchor="middle" font-size="11" style="fill:#1a1a1a">Blue/Green replicas: 2</text>
  <text x="165" y="371" text-anchor="middle" font-size="11" style="fill:#1a1a1a">active 2 + preview 2 = 4 Pod</text>
  <text x="165" y="387" text-anchor="middle" font-size="10" style="fill:#1a1a1a">Valkey 얹을 여유 부족</text>

  <!-- 단계 2: 축소 (6장) -->
  <rect x="340" y="306" width="220" height="86" rx="6" fill="#dceaf7"/>
  <text x="450" y="330" text-anchor="middle" font-size="12" font-weight="700" style="fill:#0d0d0d">6장 — 자리 비우기</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" style="fill:#1a1a1a">replicas: 2 → 1</text>
  <text x="450" y="371" text-anchor="middle" font-size="11" style="fill:#1a1a1a">Valkey(50m) 배치 공간 확보</text>
  <text x="450" y="387" text-anchor="middle" font-size="10" style="fill:#1a1a1a">git push로 축소</text>

  <!-- 단계 3: 복원 (7장) -->
  <rect x="625" y="306" width="220" height="86" rx="6" fill="#66bb6a"/>
  <text x="735" y="330" text-anchor="middle" font-size="12" font-weight="700" style="fill:#0d0d0d">7장 — 복원</text>
  <text x="735" y="352" text-anchor="middle" font-size="11" style="fill:#0d3a12">노드풀 추가 후</text>
  <text x="735" y="371" text-anchor="middle" font-size="11" style="fill:#0d3a12">replicas: 1 → 2 복원</text>
  <text x="735" y="387" text-anchor="middle" font-size="10" style="fill:#0d3a12">CPU 여유 확보 뒤 되돌림</text>

  <line x1="275" y1="349" x2="338" y2="349" stroke="#8a8580" stroke-width="2" marker-end="url(#icGray)"/>
  <line x1="560" y1="349" x2="623" y2="349" stroke="#8a8580" stroke-width="2" marker-end="url(#icGray)"/>

  <!-- 하단 결론 -->
  <line x1="55" y1="420" x2="845" y2="420" stroke="#2a2520" stroke-width="1"/>
  <text x="450" y="448" text-anchor="middle" fill="rgb(212,168,83)" font-size="13" font-weight="700">모든 변경은 깃을 통한다 — 리소스 축소도 patch가 아니라 git push로</text>
</svg>

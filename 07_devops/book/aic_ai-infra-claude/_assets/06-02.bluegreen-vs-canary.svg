<svg viewBox="0 0 900 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Blue/Green vs Canary — 트래픽 전환 방식 대비</title>
  <desc>왼쪽 Blue/Green은 트래픽을 한 번에 100% 새 버전으로 전환하고, 오른쪽 Canary는 20→50→80→100%로 각 단계 사이 pause를 두고 점진 전환한다</desc>
  <defs>
    <marker id="cvBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#5b9bd5"/></marker>
    <marker id="cvGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#66bb6a"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#0d0d0d"/>

  <!-- 좌: Blue/Green -->
  <text x="220" y="36" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">Blue/Green — 한 번에 100%</text>
  <text x="220" y="57" text-anchor="middle" fill="#8a8580" font-size="12">전환 후 전체가 새 버전에 노출</text>

  <!-- 막대: 0% → 100% 한 번에 -->
  <text x="60" y="110" fill="#8a8580" font-size="12">전환 전</text>
  <rect x="130" y="96" width="240" height="26" rx="4" fill="#5b9bd5"/>
  <text x="250" y="114" text-anchor="middle" font-size="12" style="fill:#e8e4df">v1 (stable) 100%</text>

  <text x="60" y="168" fill="rgb(212,168,83)" font-size="12" font-weight="700">스위치</text>
  <line x1="250" y1="128" x2="250" y2="158" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#cvGreen)"/>

  <text x="60" y="196" fill="#8a8580" font-size="12">전환 후</text>
  <rect x="130" y="182" width="240" height="26" rx="4" fill="#66bb6a"/>
  <text x="250" y="200" text-anchor="middle" font-size="12" style="fill:#0d0d0d">v2 (new) 100%</text>

  <text x="220" y="256" text-anchor="middle" fill="#f44336" font-size="12" font-weight="700">문제가 나면 전체 사용자가 이미 영향</text>
  <text x="220" y="278" text-anchor="middle" fill="#8a8580" font-size="11">자원 2배 · 버전 혼재 없음 · 즉각 롤백</text>

  <!-- 구분선 -->
  <line x1="450" y1="70" x2="450" y2="340" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 우: Canary -->
  <text x="680" y="36" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">Canary — 20→50→80→100%</text>
  <text x="680" y="57" text-anchor="middle" fill="#8a8580" font-size="12">각 단계 pause로 소수부터 관찰</text>

  <!-- 4단 막대: canary 비율 점점 증가 -->
  <!-- step1 20 -->
  <text x="505" y="106" fill="#8a8580" font-size="11">20%</text>
  <rect x="545" y="94" width="60" height="20" rx="3" fill="#66bb6a"/>
  <rect x="605" y="94" width="240" height="20" rx="3" fill="#5b9bd5"/>
  <text x="620" y="88" fill="#8a8580" font-size="10">pause 30s ↓</text>
  <!-- step2 50 -->
  <text x="505" y="146" fill="#8a8580" font-size="11">50%</text>
  <rect x="545" y="134" width="150" height="20" rx="3" fill="#66bb6a"/>
  <rect x="695" y="134" width="150" height="20" rx="3" fill="#5b9bd5"/>
  <text x="710" y="128" fill="#8a8580" font-size="10">pause 30s ↓</text>
  <!-- step3 80 -->
  <text x="505" y="186" fill="#8a8580" font-size="11">80%</text>
  <rect x="545" y="174" width="240" height="20" rx="3" fill="#66bb6a"/>
  <rect x="785" y="174" width="60" height="20" rx="3" fill="#5b9bd5"/>
  <text x="750" y="168" fill="#8a8580" font-size="10">pause 30s ↓</text>
  <!-- step4 100 -->
  <text x="500" y="226" fill="#8a8580" font-size="11">100%</text>
  <rect x="545" y="214" width="300" height="20" rx="3" fill="#66bb6a"/>
  <text x="695" y="229" text-anchor="middle" font-size="11" style="fill:#0d0d0d">v2 승격 완료</text>

  <!-- 범례 -->
  <rect x="545" y="252" width="16" height="12" rx="2" fill="#66bb6a"/>
  <text x="568" y="262" fill="#e8e4df" font-size="11">v2 (canary)</text>
  <rect x="660" y="252" width="16" height="12" rx="2" fill="#5b9bd5"/>
  <text x="683" y="262" fill="#e8e4df" font-size="11">v1 (stable)</text>

  <text x="680" y="290" text-anchor="middle" fill="#66bb6a" font-size="12" font-weight="700">20% 단계에서 문제 → 영향은 5분의 1</text>
  <text x="680" y="311" text-anchor="middle" fill="#8a8580" font-size="11">자원 1.2배 · abort로 즉시 stable 복원</text>

  <!-- 하단 결론 -->
  <line x1="60" y1="345" x2="840" y2="345" stroke="#2a2520" stroke-width="1"/>
  <text x="450" y="374" text-anchor="middle" fill="rgb(212,168,83)" font-size="13" font-weight="700">같은 Rollout CRD에서 strategy만 blueGreen → canary로 바꾼다</text>
  <text x="450" y="398" text-anchor="middle" fill="#8a8580" font-size="11">Blue/Green의 previewService를 Canary의 canaryService로 재사용</text>
</svg>

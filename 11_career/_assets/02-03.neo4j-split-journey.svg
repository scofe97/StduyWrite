<title id="dt">운영 질문 하나가 만드는 질문의 연쇄</title><desc id="dd">Neo4j 한 대의 저장공간이 찼다는 문제에서 출발해, 절반 분할이 만든 서버 간 간선, 지역성과 균등의 충돌, 질의 기록 확인을 거쳐 질문이 '무엇을 함께 둘까' 로 바뀐다. 그 뒤로 분할 방식·슈퍼노드·복제·재분할이 공부 범위로 정해진다.</desc>
<rect width="800" height="830" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">11_CAREER · GREEDYCON · KANG DAEMYUNG</text>

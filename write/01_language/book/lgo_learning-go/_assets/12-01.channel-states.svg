<title id="dt">채널이 지나는 상태와 상태마다 읽기·쓰기·닫기가 하는 일</title><desc id="dd">cap 2 버퍼 채널은 쓰기마다 빔에서 값 하나, 가득으로 가고 읽기마다 되돌아온다. 빔에서 읽기는 쓸 때까지, 가득에서 쓰기는 읽을 때까지 기다린다. 열린 채널을 close 하면 닫힘 상태가 되고, 값이 남았으면 남은 값과 true 를 차례로 돌려준 뒤 닫힘 · 빔이 된다. 버퍼 없는 채널도 close 하면 같은 닫힘 · 빔으로 가며, 여기서 읽기는 제로 값과 false 다. 닫힌 채널에 쓰거나 다시 닫으면 panic, nil 채널은 읽기·쓰기가 영원히 멈추고 닫으면 panic 이다.</desc>
<rect width="1000" height="748" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">STATE · 12-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">채널이 지나는 상태와 상태마다 읽기·쓰기·닫기가 하는 일</text>

<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">값은 Go 에 남고 C 에는 정수 손잡이만 건너갑니다</text>

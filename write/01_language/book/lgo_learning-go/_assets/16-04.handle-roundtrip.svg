<title id="dt">값은 Go 에 남고 C 에는 정수 손잡이만 건너갑니다</title><desc id="dd">Person 에는 포인터를 품은 string 필드가 있어 C 로 그대로 넘길 수 없다. main 이 cgo.NewHandle(p) 로 값을 Go 쪽 핸들 표에 맡기고 정수 손잡이를 받아 C.uintptr_t 로 바꿔 in_c 에 넘긴다. in_c 는 손잡이를 그대로 Go 의 processor 에 넘기고, processor 는 h.Value() 와 타입 단언으로 Person 을 되찾아 찍은 뒤 h.Delete() 로 지운다.</desc>
<rect width="960" height="600" fill="#0D1117"/>

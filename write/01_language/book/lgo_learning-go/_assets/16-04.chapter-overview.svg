<title id="dt">cgo 는 C 라이브러리를 잇는 다리입니다</title><desc id="dd">16-04 의 키워드 개념도. 첫 줄은 main.go 의 import "C" 앞 주석에 쓴 C 함수 add 를 C.add(3, 2) 로 불러 5 를 받는다는 것이다. 둘째 줄은 C 의 add 가 _cgo_export.h 로 //export 한 Go 함수 doubler 를 불러 8 을 돌려준다는 것이다. 셋째 줄은 string 필드가 있는 Person 을 cgo.NewHandle 로 정수 손잡이로 바꿔 C 를 건넌 뒤 h.Value 로 되찾는다는 것이다. 넷째 줄은 빈 C 함수 호출이 go1.25.1 에서 약 26ns, Go 1.26 부터 약 18~19ns 로 줄었지만 cgo 는 성능이 아니라 통합을 위한 도구라는 것이다.</desc>

<title id="dt">panic 은 비상구이고 recover 는 경계에서만 씁니다</title><desc id="dd">09-03 의 키워드 개념도. 첫 줄은 프로그래밍 오류로 panic 이 나면 현재 함수가 끝나고 호출 사슬을 거슬러 defer 들이 실행된 뒤 스택 트레이스를 찍고 프로그램이 끝난다는 것이다. 둘째 줄은 defer 안에서 recover 를 부르면 panic 값을 돌려받고 실행이 이어진다는 것이다. 셋째 줄은 서드파티용 라이브러리의 공개 함수가 recover 로 panic 을 오류로 바꿔 돌려준다는 것이다. 넷째 줄은 Go 오류에 스택 트레이스가 없어 서드파티 라이브러리의 %+v 로 보고, 빌드 경로는 -trimpath 로 가린다는 것이다.</desc>
<rect width="984" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 09-03 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">panic 은 비상구이고 recover 는 경계에서만 씁니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

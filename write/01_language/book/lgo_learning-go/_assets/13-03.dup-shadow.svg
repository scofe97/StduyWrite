<title id="dt">바깥의 DateOrdered string 이 Dup 안의 time.Time 필드를 가립니다</title><desc id="dd">Order.MarshalJSON 안에서 만든 익명 struct tmp 의 구조. tmp 는 json 이름 date_ordered 인 DateOrdered string 필드와 임베딩된 Dup 을 가진다. Dup 은 바탕 타입이 Order 라 ID, Items, DateOrdered, CustomerID 필드는 같지만 메서드는 없다. 이름이 같은 필드는 바깥 것이 이겨 date_ordered 는 RFC822Z 문자열로 나가고, Dup 에 메서드가 없으니 json.Marshal(tmp) 가 MarshalJSON 을 다시 부르지 않아 스택이 넘치지 않는다.</desc>
<rect width="960" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · 13-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">바깥의 DateOrdered string 이 Dup 안의 time.Time 필드를 가립니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바깥 상자가 tmp, 안쪽 상자가 임베딩된 Dup 입니다.</text>
<rect x="24" y="100" width="912" height="380" rx="10" fill="none" stroke="#6A95D8" stroke-width="1.2"/>
<text x="44" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">tmp — 익명 struct</text>
<text x="916" y="126" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">json.Marshal(tmp)</text>
<rect x="48" y="146" width="400" height="70" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="68" y="176" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">DateOrdered string</text>
<text x="68" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">json:"date_ordered" · RFC822Z 로 채움</text>
<text x="472" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">같은 이름이면 바깥 필드가 이김</text>
<rect x="48" y="236" width="864" height="220" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="68" y="262" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Dup — type Dup Order</text>
<text x="892" y="262" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">필드는 같음 · 메서드는 없음</text>
<rect x="72" y="284" width="396" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="92" y="312" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">ID string</text>
<text x="92" y="333" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">json:"id" · 그대로 나감</text>
<rect x="492" y="284" width="396" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="512" y="312" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Items []Item</text>
<text x="512" y="333" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">json:"items" · 그대로 나감</text>
<rect x="72" y="368" width="396" height="64" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="92" y="396" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">DateOrdered time.Time</text>
<text x="92" y="417" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">json 출력에서 무시됨</text>
<rect x="492" y="368" width="396" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="512" y="396" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">CustomerID string</text>
<text x="512" y="417" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">json:"customer_id" · 그대로 나감</text>
<line x1="12" y1="500" x2="912" y2="500" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="522" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="512" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바깥 필드가 이김</text>
<rect x="261" y="512" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="283" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가려져 무시됨</text>
<rect x="396" y="512" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="418" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">임베딩 구조</text>
</svg>
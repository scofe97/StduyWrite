<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">부분 slice 의 append 가 원본을 덮어쓰는 이유</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위는 append 전, 아래는 append 후입니다. 점선은 len 을 넘어 cap 까지 닿는 구간입니다.</text>

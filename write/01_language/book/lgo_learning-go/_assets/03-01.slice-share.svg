<title id="dt">부분 slice 의 append 가 원본을 덮어쓰는 이유</title><desc id="dd">예제 3-6 의 두 가지 생애를 나란히 그린 상태도. 왼쪽은 y := x[:2] 로 잘라 y 의 용량이 x 와 같은 4 라서 append 한 값이 뒷받침 배열의 2번 칸, 곧 x[2] 에 들어간다. 오른쪽은 y := x[:2:2] 로 용량을 2 로 묶어, 같은 append 가 새 배열을 만들고 x 는 그대로 남는다.</desc>

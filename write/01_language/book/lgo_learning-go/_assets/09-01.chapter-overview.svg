<title id="dt">Go 오류는 반환 값이고, 뜻은 값과 타입에 담습니다</title><desc id="dd">09-01 의 키워드 개념도. 첫 줄은 함수가 마지막 반환 값으로 error 를 돌려주고 호출자가 if 로 nil 과 비교해, 오류가 없으면 들여쓰지 않은 황금 경로로 이어가는 흐름이다. 둘째 줄은 errors.New 로 만든 오류에 이름을 붙여 패키지 수준 센티널로 공개하면 호출자가 == 로 확인한다는 것이다. 셋째 줄은 정보를 담은 사용자 정의 오류 타입도 반환 타입은 error 로 두고, 성공이면 그 타입의 변수가 아니라 nil 을 직접 돌려준다는 것이다.</desc>
<rect width="984" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 09-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Go 오류는 반환 값이고, 뜻은 값과 타입에 담습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

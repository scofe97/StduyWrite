<title id="dt">요청의 context 를 꺼내 감싸고 새 요청으로 넘깁니다</title><desc id="dd">요청 도착 시 미들웨어가 req.Context() 로 context 를 꺼내고 값을 더한 새 context 로 감싼다. req.WithContext(ctx) 로 새 요청을 만들어 handler.ServeHTTP 에 넘기면, 핸들러는 context 를 꺼내 logic(ctx, data) 의 첫 매개변수로 전달한다.</desc>
<rect width="984" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 14-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">요청의 context 를 꺼내 감싸고 새 요청으로 넘깁니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위에서 아래로 시간이 흐릅니다. Request 는 불변이므로 WithContext 로 새 요청을 만듭니다.</text>

<title id="dt">%w 여럿으로 묶은 오류는 가지가 셋입니다</title><desc id="dd">fmt.Errorf 에 %w 를 셋 넘겨 만든 오류는 err1·err2·err3 를 가지로 둔 트리다. 이 오류는 Unwrap() []error 를 구현하므로 errors.Unwrap 에 넘기면 감싼 오류 하나가 아니라 nil 이 돌아온다. errors.Is(err, err2) 는 가지를 따라 내려가 err2 를 찾아 true 를 돌려준다.</desc>
<rect width="984" height="524" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TREE · 09-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">%w 여럿으로 묶은 오류는 가지가 셋입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">errors.Join 으로 묶어도 같은 모양입니다. 가지가 여럿이면 errors.Unwrap 은 답하지 않습니다.</text>
<rect x="292" y="132" width="400" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="492" y="160" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">fmt.Errorf("first: %w, second: %w, …")</text>
<text x="492" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Unwrap() []error 를 구현</text>
<line x1="492" y1="208" x2="492" y2="254" stroke="#5E6B7E" stroke-width="1.2"/>
<line x1="200" y1="254" x2="784" y2="254" stroke="#5E6B7E" stroke-width="1.2"/>
<path d="M 200 254 L 200 296" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="72" y="300" width="256" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="200" y="326" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">err1</text>
<text x="200" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">first error</text>
<path d="M 492 254 L 492 296" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="364" y="300" width="256" height="64" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="492" y="326" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">err2</text>
<text x="492" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">second error</text>
<path d="M 784 254 L 784 296" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="656" y="300" width="256" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="784" y="326" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">err3</text>
<text x="784" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">third error</text>
<rect x="716" y="150" width="236" height="40" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="834" y="175" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">errors.Unwrap(err) → nil</text>
<rect x="364" y="396" width="256" height="40" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="492" y="421" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">errors.Is(err, err2) → true</text>

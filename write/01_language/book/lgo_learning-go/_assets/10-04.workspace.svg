<title id="dt">워크스페이스가 참조를 로컬 소스로 푸는 모습</title><desc id="dd">my_workspace 의 go.work 는 workspace_app 과 workspace_lib 을 use 로 묶는다. 그러면 app 의 import 는 GitHub 에 올린 v0.1.0 이 아니라 로컬 workspace_lib 소스로 풀려, 공개 판에 없는 SubNums 까지 쓸 수 있다. GOWORK=off 로 빌드하면 워크스페이스를 끄고 go.mod 의 require 대로 공개 판을 쓴다.</desc>
<rect width="984" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 10-04 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">워크스페이스가 참조를 로컬 소스로 푸는 모습</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">점선 안이 로컬 워크스페이스입니다. go.work 는 커밋하지 않습니다.</text>
<rect x="24" y="116" width="600" height="276" rx="10" fill="none" stroke="#3FB98C" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="40" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">my_workspace · 로컬</text>
<rect x="48" y="164" width="552" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="64" y="191" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">go.work · use ./workspace_app ./workspace_lib</text>
<rect x="48" y="256" width="232" height="96" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="164" y="290" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">workspace_app</text>
<text x="164" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">AddNums · SubNums 호출</text>
<rect x="368" y="256" width="232" height="96" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="484" y="290" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">workspace_lib</text>
<text x="484" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">로컬 소스 · SubNums 있음</text>
<path d="M 280 304 L 366 304" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="324" y="296" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">import</text>
<rect x="708" y="256" width="240" height="96" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="828" y="290" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">GitHub workspace_lib</text>
<text x="828" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">v0.1.0 · SubNums 없음</text>
<path d="M 164 352 L 164 376 L 828 376 L 828 354" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)" stroke-dasharray="4 4"/>
<text x="700" y="370" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">GOWORK=off 일 때만</text>
<line x1="12" y1="412" x2="936" y2="412" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="434" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="424" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">워크스페이스 안 로컬 모듈</text>
<rect x="326" y="424" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="348" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">로컬로 풀리는 import</text>
</svg>
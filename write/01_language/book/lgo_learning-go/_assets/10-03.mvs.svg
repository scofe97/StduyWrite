<title id="dt">최소 버전 선택이 go-isatty 를 고르는 모습</title><desc id="dd">money 는 fatih/color v1.13.0 과 go-colorable v0.1.9 에 기댄다. color 는 go-isatty v0.0.14 를, colorable 은 v0.0.12 를 요구한다. Go 는 두 요구를 모두 만족하는 가장 낮은 버전인 v0.0.14 를 고르고, 그보다 새 최신 v0.0.24 는 누구도 요구하지 않았으니 쓰지 않는다.</desc>
<rect width="984" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 10-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">최소 버전 선택이 go-isatty 를 고르는 모습</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표는 '이 버전 이상을 요구한다'입니다. 고른 버전은 요구들의 최댓값이자 가장 낮은 만족 버전입니다.</text>

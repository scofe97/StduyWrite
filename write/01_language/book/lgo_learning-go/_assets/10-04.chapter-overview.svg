<title id="dt">게시는 저장소와 태그로, 받기는 프록시와 체크섬으로</title><desc id="dd">10-04 의 키워드 개념도. 첫 줄은 모듈을 저장소에 올리는 것만으로 게시하고, 오픈 소스면 루트에 LICENSE 를 두며 Go 커뮤니티는 허용적 라이선스를 선호한다는 것이다. 둘째 줄은 프리릴리스 태그는 자동으로 골라지지 않고, 호환이 깨지면 /v2 경로와 v2.0.0 태그를 쓴다는 것이다. 셋째 줄은 replace 와 exclude 가 내가 쓰는 의존성을 바꾸거나 막고, retract 는 내 모듈을 쓰는 쪽에 특정 버전을 쓰지 말라고 알린다는 것이다. 넷째 줄은 go.work 가 게시하지 않은 모듈을 로컬 소스로 이어 준다는 것이다. 다섯째 줄은 go get 이 프록시에서 받고 체크섬 데이터베이스로 바뀐 버전을 거부한다는 것이다.</desc>

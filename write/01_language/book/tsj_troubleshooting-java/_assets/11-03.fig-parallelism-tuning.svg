<title id="dt">워커 수는 단서이지 결론이 아닙니다</title><desc id="dd">GC 병렬성 판단 흐름도. 로그의 Using N workers of M for evacuation 한 줄은 관측일 뿐이다. G1 은 힙 상태와 처리할 region 양에 따라 상한 안에서 필요한 만큼만 적응적으로 고르므로, 8개 중 2개를 썼다는 것은 그만큼이면 충분했다는 뜻일 수 있다. 과소 할당을 단정하려면 멈춤 시간의 추세와 빈도와 코어 수를 함께 놓아야 한다. 8코어에서 ParallelGCThreads=6 은 상한을 8에서 6으로 낮추므로 늘리려던 의도와 반대로 작동한다.</desc>
<rect width="800" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING JAVA · 11-03 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">워커 수는 단서이지 결론이 아닙니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">G1 은 상한 안에서 적응적으로 고릅니다 — 적게 썼다고 모자란 것이 아닙니다</text>
<rect x="44" y="108" width="712" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="64" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">관측</text>
<text x="64" y="144" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">[gc,task] GC(0) Using 6 workers of 8 for evacuation</text>
<text x="736" y="136" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">gc*=info 로 켜면 나옵니다</text>
<path d="M 400 152 L 400 176" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="200" y="180" width="400" height="52" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="400" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">이 한 줄로는 결론이 안 납니다</text>
<text x="400" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">G1 은 필요한 만큼만 씁니다</text>
<path d="M 400 232 L 400 264" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<text x="412" y="254" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">함께 놓고 봅니다</text>
<rect x="44.0" y="268" width="224" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="156.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">멈춤 시간 추세</text>
<text x="156.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">늘고 있는가</text>
<rect x="288.0" y="268" width="224" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="400.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">GC 빈도</text>
<text x="400.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">잦아지고 있는가</text>
<rect x="532.0" y="268" width="224" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="644.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">코어 수</text>
<text x="644.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">16 워커도 16코어면 정상</text>
<rect x="44" y="356" width="712" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<line x1="400" y1="366" x2="400" y2="406" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="64" y="382" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">-XX:ParallelGCThreads</text>
<text x="64" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">STW 단계 워커 상한 — 기본은 코어 수</text>
<text x="420" y="382" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">-XX:ConcGCThreads</text>
<text x="420" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">동시(백그라운드) 단계 워커 수</text>
<rect x="44" y="428" width="712" height="40" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="64" y="453" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">8코어에서 ParallelGCThreads=6 은 상한을 8에서 6으로 낮춥니다 — 늘리려던 의도와 반대입니다</text>
<line x1="12" y1="472" x2="752" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="494" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="484" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">결론으로 곧장 가지 못하게 막는 자리</text>
<rect x="404" y="484" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="426" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원서 처방이 뒤집히는 자리</text>
</svg>
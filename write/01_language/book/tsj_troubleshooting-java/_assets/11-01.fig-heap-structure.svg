<title id="dt">G1 의 힙은 구역이 아니라 region 입니다</title><desc id="dd">G1 힙 구조 도식. 힙은 균등 크기 region 집합이고 Eden·Survivor·Old 는 고정된 연속 구역이 아니라 region 에 붙는 역할 이름표다. 역할은 수집마다 바뀔 수 있다. humongous 객체는 region 절반을 넘어 Eden 을 거치지 않고 곧바로 humongous region 에 할당된다. 리스팅이 세대를 region 개수로 세는 이유가 이 구조다.</desc>

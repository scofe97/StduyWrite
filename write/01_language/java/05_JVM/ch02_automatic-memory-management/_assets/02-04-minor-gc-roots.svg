<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="880" height="540" fill="#0d0d0d"/>

  <text x="440" y="36" text-anchor="middle" fill="#e8e4df" font-size="20" font-weight="700">Minor GC의 출발점 — 원래 Root + 구세대 dirty 카드</text>
  <text x="440" y="60" text-anchor="middle" fill="#8a8580" font-size="13">신세대만 회수하므로, 구세대→신세대 참조를 놓치면 산 객체를 죽었다 오판. dirty 카드를 임시 Root로 더한다.</text>

  <!-- ===== 원래 GC Root ===== -->
  <rect x="40" y="92" width="170" height="120" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="2"/>
  <text x="125" y="116" text-anchor="middle" fill="#5b9bd5" font-size="14" font-weight="700">① 원래 GC Root</text>
  <rect x="56" y="128" width="138" height="26" rx="3" fill="#dceaf7" stroke="#5b9bd5" stroke-width="1"/>
  <text x="125" y="146" text-anchor="middle" fill="#10243a" font-size="11" font-weight="700">스택 지역변수</text>
  <rect x="56" y="158" width="138" height="26" rx="3" fill="#dceaf7" stroke="#5b9bd5" stroke-width="1"/>
  <text x="125" y="176" text-anchor="middle" fill="#10243a" font-size="11" font-weight="700">static · 상수 · JNI</text>
  <text x="125" y="200" text-anchor="middle" fill="#8a8580" font-size="10">힙 전체를 볼 때의 출발점</text>

  <!-- ===== 구세대 (Old) ===== -->
  <rect x="40" y="250" width="320" height="240" rx="10" fill="#0d0d0d" stroke="#d4a853" stroke-width="1.5"/>
  <text x="56" y="276" fill="#d4a853" font-size="14" font-weight="700">구세대 (Old) — 512B 카드로 분할</text>
  <text x="56" y="296" fill="#8a8580" font-size="10.5">참조 대입마다 쓰기 장벽이 dirty 표시</text>

  <!-- cards grid -->
  <g font-size="11" font-weight="700">
    <!-- clean cards -->
    <rect x="56" y="312" width="84" height="40" rx="3" fill="#15300f" stroke="#3a4450"/>
    <text x="98" y="337" text-anchor="middle" fill="#8a8580">clean</text>
    <rect x="148" y="312" width="84" height="40" rx="3" fill="#15300f" stroke="#3a4450"/>
    <text x="190" y="337" text-anchor="middle" fill="#8a8580">clean</text>
    <!-- dirty card 1 -->
    <rect x="240" y="312" width="104" height="40" rx="3" fill="#f5d76e" stroke="#d4a853" stroke-width="2"/>
    <text x="292" y="330" text-anchor="middle" fill="#1a1a1a">DIRTY</text>
    <text x="292" y="346" text-anchor="middle" fill="#5a4a10" font-size="9.5">oldObj.f = young</text>

    <rect x="56" y="360" width="84" height="40" rx="3" fill="#15300f" stroke="#3a4450"/>
    <text x="98" y="385" text-anchor="middle" fill="#8a8580">clean</text>
    <!-- dirty card 2 -->
    <rect x="148" y="360" width="104" height="40" rx="3" fill="#f5d76e" stroke="#d4a853" stroke-width="2"/>
    <text x="200" y="378" text-anchor="middle" fill="#1a1a1a">DIRTY</text>
    <text x="200" y="394" text-anchor="middle" fill="#5a4a10" font-size="9.5">oldObj.g = young</text>
    <rect x="260" y="360" width="84" height="40" rx="3" fill="#15300f" stroke="#3a4450"/>
    <text x="302" y="385" text-anchor="middle" fill="#8a8580">clean</text>
  </g>
  <text x="56" y="430" fill="#cdeccf" font-size="10.5">Minor GC는 구세대 전체가 아니라 <tspan fill="#f5d76e" font-weight="700">dirty 카드만</tspan> 스캔 →</text>
  <text x="56" y="448" fill="#cdeccf" font-size="10.5">그 카드가 가리키는 신세대 객체를 "살아 있음"에 포함.</text>
  <text x="56" y="470" fill="#8a8580" font-size="10">= 기억 집합(Remembered Set). 전수조사를 피하는 다리.</text>

  <!-- ===== 신세대 (Young) ===== -->
  <rect x="560" y="160" width="280" height="300" rx="10" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="576" y="186" fill="#66bb6a" font-size="14" font-weight="700">신세대 (Young) — Minor GC 회수 대상</text>

  <!-- live young (reached by root) -->
  <circle cx="640" cy="240" r="26" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <text x="640" y="245" text-anchor="middle" fill="#0d3010" font-size="12" font-weight="700">Y1</text>
  <!-- live young (reached by old dirty card) -->
  <circle cx="760" cy="300" r="26" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <text x="760" y="305" text-anchor="middle" fill="#0d3010" font-size="12" font-weight="700">Y2</text>
  <circle cx="660" cy="370" r="26" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <text x="660" y="375" text-anchor="middle" fill="#0d3010" font-size="12" font-weight="700">Y3</text>
  <!-- dead young -->
  <circle cx="780" cy="410" r="22" fill="#f2d4d4" stroke="#e06666" stroke-width="2"/>
  <text x="780" y="415" text-anchor="middle" fill="#7a1f1f" font-size="11" font-weight="700">Y4</text>
  <text x="780" y="445" text-anchor="middle" fill="#e06666" font-size="9.5">아무도 안 가리킴 → 회수</text>

  <!-- arrows: original root -> Y1 (blue) -->
  <defs>
    <marker id="b2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b9bd5"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d4a853"/></marker>
    <marker id="g2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#66bb6a"/></marker>
  </defs>
  <!-- original root box -> Y1 -->
  <line x1="210" y1="150" x2="614" y2="234" stroke="#5b9bd5" stroke-width="2.5" marker-end="url(#b2)"/>
  <text x="400" y="178" fill="#5b9bd5" font-size="10.5" font-weight="700">원래 Root가 직접 도달</text>
  <!-- dirty card1 -> Y2 -->
  <line x1="344" y1="328" x2="734" y2="296" stroke="#d4a853" stroke-width="2.5" marker-end="url(#a2)"/>
  <!-- dirty card2 -> Y3 -->
  <line x1="252" y1="382" x2="636" y2="368" stroke="#d4a853" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="430" y="345" fill="#d4a853" font-size="10.5" font-weight="700">dirty 카드가 가리켜 생존</text>

  <!-- bottom takeaway -->
  <rect x="40" y="500" width="800" height="32" rx="6" fill="#15300f" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="56" y="521" fill="#cdeccf" font-size="11.5" font-weight="700">핵심 — Minor GC의 출발점 = 원래 GC Root(파랑) + dirty 카드가 가리키는 구세대 참조(골드). GC 범위가 좁아지면 Root가 늘어난다.</text>
</svg>

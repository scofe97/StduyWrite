<svg viewBox="0 0 884 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>세 가지 기본 GC 알고리즘 — 마크-스윕·마크-카피·마크-컴팩트</title>
  <desc>마크 단계(도달성 분석)는 공유하고, 이후 빈 공간을 만드는 방식에서 갈라진다. 각 알고리즘을 before→after 블록과 장단점으로 한 줄씩 길게 비교한다.</desc>
  <defs>
    <style>
      .shead   { font-size: 14px; font-weight: 800; fill: rgb(212,168,83); }
      .sdesc   { font-size: 11px; fill: rgb(180,175,170); }
      .slabel  { font-size: 13px; font-weight: 800; fill: #e8e4df; }
      .chip    { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .note    { font-size: 11px; fill: rgb(138,133,128); }
      .bad     { font-size: 11px; font-weight: 700; fill: #e57373; }
      .good    { font-size: 11px; font-weight: 700; fill: #81c784; }
      .stage   { font-size: 10px; font-weight: 700; fill: rgb(180,175,170); }
      .verdict { font-size: 11px; font-weight: 700; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="rgb(212,168,83)"/></marker>
  </defs>
  <rect x="0" y="0" width="884" height="560" fill="#0d0d0d"/>
  <text x="22" y="30" class="shead">① 세 가지 기본 알고리즘</text>
  <text x="22" y="50" class="sdesc">마크 단계(도달성 분석)는 공유 — 이후 빈 공간을 어떻게 만드는지에서 갈라진다 (초록=생존 · 빨강=회수 대상 · 점선=빈칸)</text>

  <!-- ============ 마크-스윕 (라인 1) ============ -->
  <rect x="22" y="66" width="840" height="138" rx="8" fill="#141414" stroke="#3a3a3a" stroke-width="1"/>
  <text x="40" y="92" class="slabel">마크-스윕 (Mark-Sweep)</text>
  <text x="40" y="110" class="note">죽은 객체만 회수하고 그 자리를 빈칸으로 남긴다 (이동 없음)</text>
  <!-- before -->
  <text x="40" y="138" class="stage">마크 후</text>
  <g>
    <rect x="92"  y="124" width="40" height="22" rx="3" fill="#81c784"/><text x="106" y="139" class="chip">A</text>
    <rect x="136" y="124" width="40" height="22" rx="3" fill="#81c784"/><text x="150" y="139" class="chip">B</text>
    <rect x="180" y="124" width="40" height="22" rx="3" fill="#e57373"/><text x="194" y="139" class="chip">C</text>
    <rect x="224" y="124" width="40" height="22" rx="3" fill="#81c784"/><text x="238" y="139" class="chip">D</text>
    <rect x="268" y="124" width="40" height="22" rx="3" fill="#e57373"/><text x="282" y="139" class="chip">E</text>
    <rect x="312" y="124" width="40" height="22" rx="3" fill="#81c784"/><text x="326" y="139" class="chip">F</text>
  </g>
  <line x1="366" y1="135" x2="398" y2="135" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="382" y="126" class="stage" text-anchor="middle">스윕</text>
  <!-- after -->
  <g>
    <rect x="410" y="124" width="40" height="22" rx="3" fill="#81c784"/><text x="424" y="139" class="chip">A</text>
    <rect x="454" y="124" width="40" height="22" rx="3" fill="#81c784"/><text x="468" y="139" class="chip">B</text>
    <rect x="498" y="124" width="40" height="22" rx="3" fill="#1a1a1a" stroke="#555" stroke-dasharray="3,2"/><text x="512" y="139" class="note">_</text>
    <rect x="542" y="124" width="40" height="22" rx="3" fill="#81c784"/><text x="556" y="139" class="chip">D</text>
    <rect x="586" y="124" width="40" height="22" rx="3" fill="#1a1a1a" stroke="#555" stroke-dasharray="3,2"/><text x="600" y="139" class="note">_</text>
    <rect x="630" y="124" width="40" height="22" rx="3" fill="#81c784"/><text x="644" y="139" class="chip">F</text>
  </g>
  <!-- verdict -->
  <text x="40" y="178" class="good">✓ 단순 · 이동 없어 참조 갱신 불필요</text>
  <text x="40" y="196" class="bad">✗ 단편화 누적 · ✗ free list 탐색으로 할당 느림  →  신세대 부적합</text>

  <!-- ============ 마크-카피 (라인 2) ============ -->
  <rect x="22" y="216" width="840" height="138" rx="8" fill="#141414" stroke="#3a3a3a" stroke-width="1"/>
  <text x="40" y="242" class="slabel">마크-카피 (Mark-Copying)</text>
  <text x="40" y="260" class="note">메모리를 둘로 나눠 한쪽만 쓰고, 살아남은 객체만 반대편으로 복사한 뒤 역할 교환</text>
  <text x="40" y="288" class="stage">복사 전</text>
  <g>
    <rect x="92"  y="274" width="40" height="22" rx="3" fill="#81c784"/><text x="106" y="289" class="chip">A</text>
    <rect x="136" y="274" width="40" height="22" rx="3" fill="#81c784"/><text x="150" y="289" class="chip">B</text>
    <rect x="180" y="274" width="40" height="22" rx="3" fill="#e57373"/><text x="194" y="289" class="chip">C</text>
    <rect x="224" y="274" width="40" height="22" rx="3" fill="#81c784"/><text x="238" y="289" class="chip">D</text>
    <rect x="272" y="274" width="80" height="22" rx="3" fill="#1a1a1a" stroke="#555" stroke-dasharray="3,2"/><text x="312" y="289" class="note" text-anchor="middle">비어 있음</text>
  </g>
  <line x1="366" y1="285" x2="398" y2="285" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="382" y="276" class="stage" text-anchor="middle">복사·교환</text>
  <g>
    <rect x="410" y="274" width="80" height="22" rx="3" fill="#1a1a1a" stroke="#555" stroke-dasharray="3,2"/><text x="450" y="289" class="note" text-anchor="middle">비어 있음</text>
    <rect x="498" y="274" width="40" height="22" rx="3" fill="#81c784"/><text x="512" y="289" class="chip">A</text>
    <rect x="542" y="274" width="40" height="22" rx="3" fill="#81c784"/><text x="556" y="289" class="chip">B</text>
    <rect x="586" y="274" width="40" height="22" rx="3" fill="#81c784"/><text x="600" y="289" class="chip">D</text>
    <rect x="630" y="274" width="40" height="22" rx="3" fill="#1a1a1a" stroke="#555" stroke-dasharray="3,2"/><text x="650" y="289" class="note">_</text>
  </g>
  <text x="40" y="328" class="good">✓ 단편화 없음 · ✓ Bump-the-pointer로 할당 빠름</text>
  <text x="40" y="346" class="bad">✗ 메모리 50% 낭비  →  신세대(저생존율 ~10%)에 적합 — Eden+Survivor로 낭비를 10%로 줄임</text>

  <!-- ============ 마크-컴팩트 (라인 3) ============ -->
  <rect x="22" y="366" width="840" height="138" rx="8" fill="#141414" stroke="#3a3a3a" stroke-width="1"/>
  <text x="40" y="392" class="slabel">마크-컴팩트 (Mark-Compact)</text>
  <text x="40" y="410" class="note">살아남은 객체를 한쪽 끝으로 모은 뒤(압축) 그 너머를 회수 — 낭비도 단편화도 없음</text>
  <text x="40" y="438" class="stage">마크 후</text>
  <g>
    <rect x="92"  y="424" width="40" height="22" rx="3" fill="#81c784"/><text x="106" y="439" class="chip">A</text>
    <rect x="136" y="424" width="40" height="22" rx="3" fill="#81c784"/><text x="150" y="439" class="chip">B</text>
    <rect x="180" y="424" width="40" height="22" rx="3" fill="#e57373"/><text x="194" y="439" class="chip">C</text>
    <rect x="224" y="424" width="40" height="22" rx="3" fill="#81c784"/><text x="238" y="439" class="chip">D</text>
    <rect x="268" y="424" width="40" height="22" rx="3" fill="#e57373"/><text x="282" y="439" class="chip">E</text>
    <rect x="312" y="424" width="40" height="22" rx="3" fill="#81c784"/><text x="326" y="439" class="chip">F</text>
  </g>
  <line x1="366" y1="435" x2="398" y2="435" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="382" y="426" class="stage" text-anchor="middle">압축</text>
  <g>
    <rect x="410" y="424" width="40" height="22" rx="3" fill="#81c784"/><text x="424" y="439" class="chip">A</text>
    <rect x="454" y="424" width="40" height="22" rx="3" fill="#81c784"/><text x="468" y="439" class="chip">B</text>
    <rect x="498" y="424" width="40" height="22" rx="3" fill="#81c784"/><text x="512" y="439" class="chip">D</text>
    <rect x="542" y="424" width="40" height="22" rx="3" fill="#81c784"/><text x="556" y="439" class="chip">F</text>
    <rect x="586" y="424" width="84" height="22" rx="3" fill="#1a1a1a" stroke="#555" stroke-dasharray="3,2"/><text x="628" y="439" class="note" text-anchor="middle">빈 공간</text>
  </g>
  <text x="40" y="478" class="good">✓ 단편화 없음 · 낭비 없음 · ✓ 이후 Bump-the-pointer 할당 가능</text>
  <text x="40" y="496" class="bad">✗ 살아있는 객체 전부 이동 + 참조 전부 갱신 → STW 김  →  구세대(고생존율)에 적합</text>

  <!-- bottom -->
  <text x="22" y="534" class="sdesc">셋 다 단독으로는 한계가 분명 — 그래서 자바 힙은 영역(세대)을 나눠 서로 다른 알고리즘을 섞어 쓴다 (§2).</text>
</svg>

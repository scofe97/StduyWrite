<text x="343.3333333333333" y="106" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">5s</text>
<line x1="456.66666666666663" y1="112" x2="456.66666666666663" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 4"/>
<text x="456.66666666666663" y="106" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">10s</text>
<line x1="570.0" y1="112" x2="570.0" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 4"/>
<text x="570.0" y="106" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">15s</text>
<line x1="683.3333333333333" y1="112" x2="683.3333333333333" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 4"/>
<text x="683.3333333333333" y="106" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">20s</text>
<line x1="796.6666666666667" y1="112" x2="796.6666666666667" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 4"/>
<text x="796.6666666666667" y="106" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">25s</text>
<line x1="910.0" y1="112" x2="910.0" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.7" stroke-dasharray="2 4"/>
<text x="910.0" y="106" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">30s</text>

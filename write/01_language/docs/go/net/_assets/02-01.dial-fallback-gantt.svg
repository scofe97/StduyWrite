<text x="236.8" y="339" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">미실행 (선행 연결 성공으로 전체 종료)</text>

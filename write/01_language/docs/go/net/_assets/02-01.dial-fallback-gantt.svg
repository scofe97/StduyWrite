<title id="dt">주소 순차 분할과 IPv6/IPv4 Fast Fallback</title><desc id="dd">주소 4개의 15초 순차 타임아웃 분배와 300ms 지연 후 IPv4 병렬 경합</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DIALER TIMEOUT SPREAD AND FAST FALLBACK</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">주소 순차 분할과 IPv6/IPv4 Fast Fallback</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">총 1분 예산에서 주소당 15초를 배분하며 300ms 뒤 IPv4 가 출발해 먼저 연결을 맺습니다</text>

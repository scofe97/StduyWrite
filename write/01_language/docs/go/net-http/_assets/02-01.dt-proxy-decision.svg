<title id="dt">ProxyFromEnvironment 프록시 결정 흐름</title><desc id="dd">요청마다 스킴과 CGI 환경·루프백·NO_PROXY 규칙을 차례로 검사해 프록시 경유 여부와 직접 연결을 결정합니다</desc>
<rect width="1000" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">HTTP PROXYFROMENVIRONMENT DECISION FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">ProxyFromEnvironment 프록시 결정 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">요청 스킴과 환경 변수를 검사해 직접 연결·CGI 에러·프록시 경유 중 하나를 반환합니다</text>

<title id="dt">0 과 음수(-1)의 필드별 동작 의미 비교</title><desc id="dd">MaxIdleConns, MaxIdleConnsPerHost, MaxConnsPerHost, IdleConnTimeout, ExpectContinueTimeout의 DefaultTransport 값, 0, -1 설정 시 동작 차이</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">HTTP TRANSPORT ZERO AND NEGATIVE MEANINGS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">0 과 음수(-1)의 필드별 동작 의미 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 0과 -1이라도 필드마다 의미가 다르며 MaxIdleConns의 -1은 0과 정반대로 빈 연결을 풀에 남기지 않습니다</text>
<rect x="24" y="104" width="216" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="40" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">제어 필드 (net/http)</text>

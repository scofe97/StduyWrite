<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="HTTP 응답 3요소와 ResponseEntity 제어 도식">
  <title>HTTP 응답은 상태·헤더·본문 셋을 담고, ResponseEntity로 셋 다 정합니다</title>
  <desc>HTTP 응답이 담는 세 요소를 나타낸다. 응답 상태는 요청 결과를 짧게 나타내는 코드(200 OK, 400, 404, 500 등)이고, 응답 헤더는 짧은 데이터, 응답 본문은 큰 데이터다. Spring은 기본 상태를 자동으로 매기지만, ResponseEntity를 반환하면 status로 상태를, header로 헤더를, body로 본문을 한 번에 직접 지정할 수 있다</desc>
  <rect x="0" y="0" width="760" height="380" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">HTTP 응답은 세 가지를 담습니다</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">상태·헤더·본문 — Spring이 기본값을 매기지만 ResponseEntity로 직접 정할 수 있습니다</text>

  <!-- 세 요소 박스 -->
  <rect x="40" y="88" width="220" height="150" rx="10" fill="rgba(212,168,83,0.10)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="150" y="116" fill="rgb(212,168,83)" font-size="14" font-weight="bold" text-anchor="middle">응답 상태</text>
  <text x="150" y="138" fill="rgb(138,133,128)" font-size="11" text-anchor="middle">요청 결과를 짧게</text>
  <rect x="60" y="152" width="180" height="72" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="72" y="174" fill="#66bb6a" font-size="11" font-family="monospace">200 OK · 정상</text>
  <text x="72" y="192" fill="#e8e4df" font-size="11" font-family="monospace">404 · 자원 없음</text>
  <text x="72" y="210" fill="#e8e4df" font-size="11" font-family="monospace">400 · 요청 불일치</text>

  <rect x="280" y="88" width="200" height="150" rx="10" fill="rgba(91,155,213,0.12)" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="380" y="116" fill="#5b9bd5" font-size="14" font-weight="bold" text-anchor="middle">응답 헤더</text>
  <text x="380" y="138" fill="rgb(138,133,128)" font-size="11" text-anchor="middle">짧은 데이터</text>
  <rect x="300" y="152" width="160" height="72" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="312" y="176" fill="#e8e4df" font-size="10" font-family="monospace">continent: Europe</text>
  <text x="312" y="196" fill="#e8e4df" font-size="10" font-family="monospace">capital: Paris</text>
  <text x="312" y="216" fill="rgb(138,133,128)" font-size="10">이름=값 쌍</text>

  <rect x="500" y="88" width="220" height="150" rx="10" fill="rgba(102,187,106,0.12)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="610" y="116" fill="#66bb6a" font-size="14" font-weight="bold" text-anchor="middle">응답 본문</text>
  <text x="610" y="138" fill="rgb(138,133,128)" font-size="11" text-anchor="middle">큰 데이터 (JSON)</text>
  <rect x="520" y="152" width="180" height="72" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="532" y="176" fill="#e8e4df" font-size="10" font-family="monospace">{ "name": "France",</text>
  <text x="532" y="196" fill="#e8e4df" font-size="10" font-family="monospace">  "population": 67 }</text>
  <text x="532" y="216" fill="rgb(138,133,128)" font-size="10">객체→JSON 자동 직렬화</text>

  <!-- ResponseEntity 통합 -->
  <line x1="150" y1="238" x2="290" y2="288" stroke="rgb(138,133,128)" stroke-width="1.2" marker-end="url(#a10b)"/>
  <line x1="380" y1="238" x2="380" y2="288" stroke="rgb(138,133,128)" stroke-width="1.2" marker-end="url(#a10b)"/>
  <line x1="610" y1="238" x2="470" y2="288" stroke="rgb(138,133,128)" stroke-width="1.2" marker-end="url(#a10b)"/>

  <rect x="200" y="292" width="360" height="66" rx="8" fill="rgba(212,168,83,0.12)" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <text x="380" y="316" fill="rgb(212,168,83)" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">ResponseEntity</text>
  <text x="380" y="338" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="monospace">.status(202).header(...).body(c)</text>
  <text x="380" y="352" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">셋을 한 번에 직접 지정</text>

  <defs>
    <marker id="a10b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>
</svg>

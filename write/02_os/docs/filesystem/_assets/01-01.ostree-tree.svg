<title id="dt">OSTree 부팅 루트 계층과 /var 심볼릭 링크 방향</title><desc id="dd">OSTree 부팅 배포본 루트(/ostree/deploy/$stateroot/deploy/$checksum) 아래 읽기 전용 /usr, 3-way merge /etc, 그리고 /var 와 /sysroot 로 향하는 최상위 심볼릭 링크 계층.</desc>
<rect width="980" height="544" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTREE · IMMUTABLE DEPLOYMENT TREE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">OSTree 부팅 루트 계층과 /var 심볼릭 링크 방향</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">최상위 쓰기 경로(/opt·/srv·/home 등)와 /usr/local 은 심볼릭 링크로 보존 영역(/var)과 물리 루트(/sysroot)를 가리킵니다</text>
<path d="M 490 156 L 490 176" fill="none" stroke="#8B98A9" stroke-width="1.3"/>
<path d="M 124 176 L 872 176" fill="none" stroke="#8B98A9" stroke-width="1.3"/>
<path d="M 124 176 L 124 198" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 344 176 L 344 198" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 614 176 L 614 198" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 872 176 L 872 198" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 124 272 L 124 346" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 228 376 L 344 376 L 344 274" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#warn)" stroke-dasharray="4 3"/>
<text x="356" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="500" fill="#E3B341">3-way 입력</text>
<path d="M 228 416 L 458 416" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)" stroke-dasharray="4 3"/>
<text x="344" y="406" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#3FB98C">/usr/local → /var/usrlocal</text>
<path d="M 614 272 L 614 346" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)" stroke-dasharray="4 3"/>
<text x="630" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="500" fill="#3FB98C">심볼릭 링크 대상</text>
<path d="M 872 272 L 872 346" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)" stroke-dasharray="4 3"/>
<text x="856" y="314" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="500" fill="#6A95D8">링크 대상</text>
<rect x="276" y="104" width="428" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="490" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">/  (부팅 배포본 체크아웃)</text>
<text x="490" y="146" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">/ostree/deploy/$stateroot/deploy/$checksum</text>
<rect x="20" y="200" width="208" height="72" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="124" y="228" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F08A59">/usr</text>
<text x="124" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">RO 바인드 · UsrMove</text>
<rect x="244" y="200" width="200" height="72" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="344" y="228" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#E3B341">/etc</text>
<text x="344" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">구/신 /usr/etc + 활성 병합</text>
<rect x="460" y="200" width="308" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="614" y="228" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">/opt·/srv·/home·/root·/mnt</text>
<text x="614" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">최상위 쓰기 심볼릭 링크</text>
<rect x="784" y="200" width="176" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="872" y="228" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F5F5F3">/tmp</text>
<text x="872" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">임시 공간 심볼릭 링크</text>
<rect x="20" y="348" width="208" height="96" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="124" y="376" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">/usr/etc</text>
<text x="124" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">배포본 기본 설정 원본</text>
<line x1="36" y1="406" x2="212" y2="406" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="124" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">/usr/local  (심볼릭 링크)</text>
<rect x="460" y="348" width="308" height="96" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="614" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">/var  (stateroot 공유 · 유지)</text>
<text x="614" y="396" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">/var/opt · srv · roothome · usrlocal · mnt</text>
<text x="614" y="420" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">/var/home (기본 ../sysroot/home 링크)</text>
<rect x="784" y="348" width="176" height="96" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="872" y="374" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">/sysroot  (물리 /)</text>
<text x="872" y="400" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">/sysroot/tmp</text>
<text x="872" y="424" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">/ostree → /sysroot/ostree</text>
<line x1="12" y1="492" x2="932" y2="492" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="514" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="504" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">읽기 전용 /usr</text>
<rect x="274" y="504" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="296" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">3-way merge 설정</text>
<rect x="500" y="504" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="522" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">업그레이드 보존 (/var)</text>
<rect x="739" y="504" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="761" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">물리 루트 (/sysroot)</text>
</svg>
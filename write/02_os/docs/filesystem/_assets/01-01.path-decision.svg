<text x="212" y="129" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">새 소프트웨어 · 데이터</text>
<polygon points="212,172 356,204 212,236 68,204" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>

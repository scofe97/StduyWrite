<text x="480" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">통짜 추가 패키지 · 정적·설정·가변 세 트리</text>

<title id="dt">외부 노출과 관리 주체로 설치 경로 결정</title><desc id="dd">먼저 외부 노출 서비스 데이터(/srv)를 가른 뒤, 배포판 패키지·관리자 로컬 설치·통짜 추가 패키지 순으로 설치 트리를 분기하고 비노출 상태는 /var/lib 로 보내는 흐름도.</desc>
<rect width="920" height="684" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FHS 3.0 · OWNERSHIP &amp; EXPOSURE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">외부 노출과 관리 주체로 설치 경로 결정</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">외부 노출 데이터를 먼저 가르고, 소프트웨어는 관리 주체 순으로 설치 트리를 나눕니다</text>

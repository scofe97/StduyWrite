<text x="480" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">로컬 직접 설치 · OS 업그레이드 보호</text>

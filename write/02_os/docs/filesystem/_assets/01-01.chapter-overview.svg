<title id="dt">FHS 두 축에서 불변 OS·컨테이너 배치까지</title><desc id="dd">1절의 배치 충돌에서 시작해 2절의 FHS 두 축을 딛고 관리 주체, /opt 번들, OSTree 불변 OS, 컨테이너·Kubernetes 경계로 이어지는 전체 흐름 지도.</desc>

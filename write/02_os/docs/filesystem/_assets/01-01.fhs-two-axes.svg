<title id="dt">공유 가능 여부 × 변경 여부 2×2 배치</title><desc id="dd">FHS 3.0 2장이 정의한 공유 가능 여부와 변경 여부 두 축 위의 대표 디렉터리 4개 사분면. 정적·공유 영역(/usr·/opt)이 읽기 전용 마운트 대상이다.</desc>
<rect width="920" height="624" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FHS 3.0 · CHAPTER 2 · TWO AXES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">공유 가능 여부 × 변경 여부 2×2 배치</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가변 데이터를 /var 로 분리해 /usr 읽기 전용 마운트와 백업 주기 분리를 얻습니다</text>
<path d="M 460 332 L 460 128" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 460 332 L 460 536" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 460 332 L 124 332" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 460 332 L 796 332" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="460" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#F5F5F3">STATIC</text>
<text x="460" y="556" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#F5F5F3">VARIABLE</text>
<text x="112" y="336" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#F5F5F3">SHAREABLE</text>
<text x="808" y="336" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="500" fill="#F5F5F3">UNSHAREABLE</text>
<rect x="140" y="148" width="296" height="160" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="160" y="176" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">01 · STATIC / SHAREABLE</text>
<text x="160" y="212" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">/usr · /opt</text>
<text x="160" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="500" fill="#F5F5F3">읽기 전용 마운트 · 호스트 공유</text>
<text x="160" y="280" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">배포판 바이너리 · 라이브러리 · 추가 패키지</text>
<rect x="484" y="148" width="296" height="160" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="504" y="176" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">02 · STATIC / UNSHAREABLE</text>
<text x="504" y="212" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">/etc · /boot</text>
<text x="504" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="500" fill="#F5F5F3">호스트 고유 설정 · 부팅 파일</text>
<text x="504" y="280" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">/etc 실행 바이너리 금지 (스크립트만)</text>
<rect x="140" y="356" width="296" height="160" rx="8" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="160" y="384" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">03 · VARIABLE / SHAREABLE</text>
<text x="160" y="420" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">/var/mail · /var/spool/news</text>
<text x="160" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="500" fill="#F5F5F3">호스트 간 공유 가능한 가변 영역</text>
<text x="160" y="488" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">/var/cache/man 등 공용 스풀 · 캐시</text>
<rect x="484" y="356" width="296" height="160" rx="8" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="504" y="384" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">04 · VARIABLE / UNSHAREABLE</text>
<text x="504" y="420" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">/var/run · /var/lock · /var/log</text>
<text x="504" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="500" fill="#F5F5F3">호스트 고유 실행 상태 · 로그</text>
<text x="504" y="488" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">잦은 쓰기 · 로그·상태 별도 백업</text>
<line x1="12" y1="576" x2="872" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="588" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">읽기 전용 마운트 대상 (정적·공유)</text>
<rect x="404" y="588" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="426" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">/var 가변 데이터 영역</text>
</svg>
<title id="dt">대형 메일 서비스의 인바운드 MX와 제출 창구 분리</title><desc id="dd">Gmail·네이버·Microsoft 365 세 서비스의 인터넷 수신 창구(MX, 포트 25)와 사용자/앱 제출 창구(MSA, 포트 587/465) 분리 구조 (조회일 2026-10-15)</desc>
<rect width="960" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM ARCHITECTURE · INBOUND MX VS CLIENT SUBMISSION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">대형 메일 서비스의 인바운드 MX와 제출 창구 분리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">인터넷에서 들어오는 수신 창구와 사용자가 인증하고 맡기는 제출 창구가 서로 다른 호스트와 포트로 격리된 구조</text>
<rect x="24" y="96" width="912" height="168" rx="8" fill="rgba(245,245,245,0.02)" stroke="#6A95D8" stroke-width="0.9"/>
<text x="40" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">인터넷 수신 창구 · 인바운드 MX (포트 25 · 익명 수신 · 도메인 수신자 전용)</text>
<rect x="24" y="288" width="912" height="192" rx="8" fill="rgba(245,245,245,0.02)" stroke="#3FB98C" stroke-width="0.9"/>
<text x="40" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">사용자 및 앱 제출 창구 · 아웃바운드 MSA (포트 587/465 · 인증 필수 · 외부 인터넷 전송)</text>
<line x1="32" y1="276" x2="340" y2="276" stroke="#E3B341" stroke-width="0.9" stroke-dasharray="4 4"/>
<line x1="620" y1="276" x2="928" y2="276" stroke="#E3B341" stroke-width="0.9" stroke-dasharray="4 4"/>
<rect x="352.0" y="266" width="256.0" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="480" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">호스트 · 포트 · 인증 정책 격리 경계</text>

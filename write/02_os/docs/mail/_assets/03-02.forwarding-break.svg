<title id="dt">전달 과정의 SPF·DKIM 붕괴와 ARC를 통한 인증 보존</title><desc id="dd">포워더를 거치며 발송 IP 변경과 본문 푸터 삽입으로 깨진 SPF·DKIM 증거를 중간 호스트가 봉인해 전달하고 수신자가 로컬 정책으로 평가합니다</desc>

<title id="dt">250 접수 후 다음 홉 실패 시 DSN 반송 경로</title><desc id="dd">게이트웨이가 메일을 250 접수한 뒤 내부 홉에서 550 오류가 발생했을 때 헤더 From이 아닌 봉투 MAIL FROM으로 반송(DSN)을 보내는 흐름</desc>
<rect width="988" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DATA FLOW · BOUNCE DELIVERY PATH</text>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">외부 접수 시점의 봉투 발신자와 헤더 작성자가 다를 때 반송 통지가 봉투 주소로 전달되는 원리</text>

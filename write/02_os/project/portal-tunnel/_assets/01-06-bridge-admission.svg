<text x="505" y="492" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F0616D">No</text>
<rect x="670" y="482" width="200" height="36" rx="18" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="770" y="504" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">연결 닫힘 (HTTP 응답 없음)</text>
<path d="M 360 532 L 360 556" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="378" y="545" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#3FB98C">Yes</text>
<rect x="220" y="556" width="280" height="44" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="360" y="574" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">admitBridge 등록 &amp; Reverse 대기</text>
<text x="360" y="590" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">reverse.Acquire 대기 (≤10초)</text>
<path d="M 360 600 L 360 626" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<path d="M 360 626 L 480 658 L 360 690 L 240 658 Z" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="360" y="651" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">Reverse 획득 &amp; 재검증?</text>
<text x="360" y="667" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">activateBridge 확인</text>

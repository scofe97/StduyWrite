<rect x="210" y="714" width="300" height="44" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<text x="360" y="732" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">activateBridge (소유권 확정)</text>
<text x="360" y="748" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">0x02 마커 및 바인딩 프레임 기록</text>

<rect x="670" y="640" width="200" height="36" rx="18" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="770" y="662" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">연결 닫힘 (HTTP 응답 없음)</text>
<path d="M 360 690 L 360 714" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>

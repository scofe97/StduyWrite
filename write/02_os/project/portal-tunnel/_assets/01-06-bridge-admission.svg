<rect x="230" y="318" width="260" height="42" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="360" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">Lookup(host) 호스트 검색</text>

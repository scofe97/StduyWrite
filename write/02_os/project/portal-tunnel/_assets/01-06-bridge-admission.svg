<text x="360" y="820" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">32KB 청크 · BPS 페이싱 · closeWrite</text>

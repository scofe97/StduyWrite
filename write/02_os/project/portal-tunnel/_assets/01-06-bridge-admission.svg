<rect x="260" y="856" width="200" height="36" rx="18" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>
<text x="360" y="878" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">세션 종료 (half-close 보존)</text>
<line x1="12" y1="912" x2="912" y2="912" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

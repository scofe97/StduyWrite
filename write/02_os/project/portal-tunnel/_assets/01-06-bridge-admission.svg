<title id="dt">공개 연결 인입부터 TCP 브리지 활성화까지의 다단계 관문</title><desc id="dd">검사 대기 슬롯(128)과 테넌트 예산(1024), 임대별 브리지 한도(128) 및 리버스 대기 후 재검증 흐름</desc>
<rect width="960" height="960" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PORTAL-TUNNEL · PUBLIC CONNECTION ADMISSION &amp; BRIDGE FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">공개 연결 인입부터 TCP 브리지 활성화까지의 다단계 관문</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">입장(admit)과 활성화(activate) 사이 10초 대기 중 발생할 수 있는 임대 취소를 2단계 검증으로 방어합니다</text>
<rect x="240" y="104" width="240" height="38" rx="19" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="360" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#6A95D8">PUBLIC TCP INGRESS</text>
<text x="360" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">공개 TCP 연결 인입 (:443 기본)</text>
<path d="M 360 142 L 360 164" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<path d="M 360 164 L 480 196 L 360 228 L 240 196 Z" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="360" y="189" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">검사 슬롯 가용?</text>
<text x="360" y="205" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">inspecting &lt; 128</text>
<path d="M 480 196 L 670 196" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="505" y="188" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F0616D">No</text>
<rect x="670" y="178" width="200" height="36" rx="18" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="770" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">연결 닫힘 (HTTP 응답 없음)</text>
<path d="M 360 228 L 360 252" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="378" y="241" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#3FB98C">Yes</text>

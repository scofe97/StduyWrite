<text x="480.0" y="537" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">테넌트 TLS 핸드셰이크 완료</text>

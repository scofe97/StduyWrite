<title id="dt">Keyless TLS 핸드셰이크와 바인딩 서명 흐름</title><desc id="dd">브라우저의 ClientHello가 들어오면 Relay는 바인딩을 발급해 리버스 소켓으로 전달하고, Tunnel은 로컬에서 세션 키를 생성한 뒤 /v1/sign에서 단일 연결에 묶인 CertificateVerify 서명을 받아 핸드셰이크를 완성합니다.</desc>
<rect width="960" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PORTAL-TUNNEL · KEYLESS TLS HANDSHAKE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Keyless TLS 핸드셰이크와 바인딩 서명 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">인증서 서명만 릴레이에 위임하고 트래픽 세션 키는 터널 내부에서 완성됩니다</text>
<marker id="ok_left" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M8 0 L0 4 L8 8 z" fill="#3FB98C"/></marker>
<rect x="36" y="100" width="168" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="120" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">브라우저</text>
<text x="120" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">공개 클라이언트</text>
<rect x="276" y="100" width="168" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="360" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">relay SNI</text>
<text x="360" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">인그레스 라우터</text>
<rect x="516" y="100" width="168" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="600" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">relay /v1/sign</text>
<text x="600" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">온라인 서명기</text>
<rect x="756" y="100" width="168" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="840" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">tunnel</text>
<text x="840" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">t13server 종단</text>
<line x1="120" y1="150" x2="120" y2="608" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="360" y1="150" x2="360" y2="608" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="600" y1="150" x2="600" y2="608" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="840" y1="150" x2="840" y2="608" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 130 184 L 348 184" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<rect x="142.48" y="164" width="195.04000000000002" height="16" fill="#0D1117"/>
<text x="240.0" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">TLS ClientHello (SNI 호스트)</text>
<path d="M 370 216 L 406 216 L 406 232 L 373 232" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="414" y="222" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">Issue(record.id, helloSpan)</text>
<text x="414" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">16바이트 바인딩 생성</text>
<path d="M 370 270 L 828 270" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="505.12" y="250" width="189.76" height="16" fill="#0D1117"/>

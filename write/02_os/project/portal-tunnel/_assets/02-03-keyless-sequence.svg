<text x="480.0" y="568" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">E2E TLS 암호문 전송 (바이너리 패스스루)</text>

<rect x="547.8" y="274" width="104.4" height="15" fill="#0D1117"/>
<text x="600.0" y="285" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">리버스 연결 활성화</text>
<path d="M 830 320 L 132 320" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<rect x="385.89" y="300" width="188.22" height="16" fill="#0D1117"/>
<text x="480.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">ServerHello (ECDHE 키 교환)</text>
<rect x="416.6" y="324" width="126.8" height="15" fill="#0D1117"/>
<text x="480.0" y="335" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">세션 키 터널 로컬 생성</text>
<path d="M 830 374 L 612 374" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<rect x="669.67" y="354" width="100.66" height="16" fill="#0D1117"/>
<text x="720.0" y="366" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">POST /v1/sign</text>
<rect x="607.0" y="378" width="226.0" height="15" fill="#0D1117"/>
<text x="720.0" y="389" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">핸드셰이크 원문 + binding + lease 토큰</text>
<path d="M 610 410 L 646 410 L 646 426 L 613 426" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="654" y="416" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">ValidateAndConsume</text>
<text x="654" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">lease·hello 검증 및 1회성 소모</text>
<path d="M 610 468 L 828 468" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="627.21" y="448" width="185.58" height="16" fill="#0D1117"/>
<text x="720.0" y="460" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">CertificateVerify 서명 응답</text>
<path d="M 830 522 L 132 522" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>

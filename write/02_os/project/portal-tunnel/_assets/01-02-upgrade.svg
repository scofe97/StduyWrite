<title id="dt">HTTP Upgrade 와 연결 하이재킹 프로토콜 전환</title><desc id="dd">클라이언트와 서버가 Upgrade 헤더와 101 Switching Protocols 응답을 교환한 뒤 소켓 제어권을 가로채 동일한 TCP 연결 위에서 임의의 양방향 바이너리 프레이밍으로 전환합니다.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" role="img" aria-labelledby="t-ph d-ph">
  <title id="t-ph">netpath-lab 국면별 목적, 구현 기능, 개발 키워드</title>
  <desc id="d-ph">여섯 국면을 왼쪽에서 오른쪽으로 놓고 각 국면의 목적, 구현 기능, 개발 키워드를 세 줄로 보여 줍니다. 1국면 측정 모델은 구현이 끝났고 나머지는 대기 중이며, 5국면 프록시 비교는 확장 국면입니다.</desc>

  <defs>
    <pattern id="ph-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#F5F5F3" opacity="0.10"/>
    </pattern>
    <marker id="ph-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#5E6B7E"/>
    </marker>
  </defs>

  <rect width="1000" height="452" fill="#0D1117"/>
  <rect width="1000" height="452" fill="url(#ph-dots)"/>

  <g font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
    <!-- 헤더 -->
    <text x="24" y="30" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.14em">NETPATH-LAB · PHASES</text>
    <text x="24" y="56" fill="#F5F5F3" font-size="20" font-weight="600">측정 모델에서 프록시 비교까지 여섯 국면</text>
    <text x="24" y="76" fill="#8B98A9" font-size="12">1국면 구현 완료 · 4국면까지 완결 · 5국면은 확장</text>

    <!-- 행 라벨 -->
    <text x="24" y="184" fill="#5E6B7E" font-size="12" font-weight="600">목적</text>
    <text x="24" y="264" fill="#5E6B7E" font-size="12" font-weight="600">구현 기능</text>
    <text x="24" y="352" fill="#5E6B7E" font-size="12" font-weight="600">개발 키워드</text>

    <!-- 국면 헤더 사이 화살표 -->
    <line x1="260" y1="118" x2="266" y2="118" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#ph-ar)"/>
    <line x1="404" y1="118" x2="410" y2="118" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#ph-ar)"/>
    <line x1="548" y1="118" x2="554" y2="118" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#ph-ar)"/>
    <line x1="692" y1="118" x2="698" y2="118" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#ph-ar)"/>
    <line x1="836" y1="118" x2="842" y2="118" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#ph-ar)"/>

    <!-- ===== 1 측정 모델 (focal) ===== -->
    <rect x="124" y="96" width="136" height="300" rx="4" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
    <text x="136" y="114" fill="#F08A59" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.12em">PHASE 1</text>
    <text x="136" y="134" fill="#F5F5F3" font-size="14" font-weight="600">측정 모델</text>
    <rect x="200" y="104" width="52" height="16" rx="3" fill="rgba(63,185,140,0.15)" stroke="#3FB98C" stroke-width="1"/>
    <text x="226" y="116" fill="#3FB98C" font-size="10" text-anchor="middle">구현 완료</text>
    <text x="136" y="176" fill="#F5F5F3" font-size="13">실패를 단계별</text>
    <text x="136" y="194" fill="#F5F5F3" font-size="13">값으로 분류</text>
    <text x="136" y="244" fill="#8B98A9" font-size="12">DNS·TCP·HTTP 분해</text>
    <text x="136" y="262" fill="#8B98A9" font-size="12">오류 분류 13종</text>
    <text x="136" y="280" fill="#8B98A9" font-size="12">Result 계약</text>
    <text x="136" y="334" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">httptrace</text>
    <text x="136" y="352" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">errors.Is·As</text>
    <text x="136" y="370" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">context</text>

    <!-- ===== 1.5 TLS ===== -->
    <rect x="268" y="96" width="136" height="300" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
    <text x="280" y="114" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.12em">PHASE 1.5</text>
    <text x="280" y="134" fill="#F5F5F3" font-size="14" font-weight="600">TLS</text>
    <text x="280" y="176" fill="#F5F5F3" font-size="13">인증서 검증</text>
    <text x="280" y="194" fill="#F5F5F3" font-size="13">단계 추가</text>
    <text x="280" y="244" fill="#8B98A9" font-size="12">TLS 단계·훅</text>
    <text x="280" y="262" fill="#8B98A9" font-size="12">x509 오류 분류</text>
    <text x="280" y="280" fill="#8B98A9" font-size="12">--insecure 대조</text>
    <text x="280" y="334" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">crypto/tls</text>
    <text x="280" y="352" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">x509</text>
    <text x="280" y="370" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">ALPN</text>

    <!-- ===== 2 관측 신호 ===== -->
    <rect x="412" y="96" width="136" height="300" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
    <text x="424" y="114" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.12em">PHASE 2</text>
    <text x="424" y="134" fill="#F5F5F3" font-size="14" font-weight="600">관측 신호</text>
    <text x="424" y="176" fill="#F5F5F3" font-size="13">결과를 trace·</text>
    <text x="424" y="194" fill="#F5F5F3" font-size="13">metric·log 로</text>
    <text x="424" y="244" fill="#8B98A9" font-size="12">OTel 어댑터</text>
    <text x="424" y="262" fill="#8B98A9" font-size="12">단계 = child span</text>
    <text x="424" y="280" fill="#8B98A9" font-size="12">로컬 LGTM</text>
    <text x="424" y="334" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">OTel SDK</text>
    <text x="424" y="352" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">histogram</text>
    <text x="424" y="370" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">Collector</text>

    <!-- ===== 3 클러스터 ===== -->
    <rect x="556" y="96" width="136" height="300" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
    <text x="568" y="114" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.12em">PHASE 3</text>
    <text x="568" y="134" fill="#F5F5F3" font-size="14" font-weight="600">클러스터</text>
    <text x="568" y="176" fill="#F5F5F3" font-size="13">여러 노드에서</text>
    <text x="568" y="194" fill="#F5F5F3" font-size="13">같은 대상 측정</text>
    <text x="568" y="244" fill="#8B98A9" font-size="12">DaemonSet 배포</text>
    <text x="568" y="262" fill="#8B98A9" font-size="12">읽기 전용 RBAC</text>
    <text x="568" y="280" fill="#8B98A9" font-size="12">대상 ConfigMap</text>
    <text x="568" y="334" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">Downward API</text>
    <text x="568" y="352" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">EndpointSlice</text>
    <text x="568" y="370" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">client-go</text>

    <!-- ===== 4 장애 카탈로그 ===== -->
    <rect x="700" y="96" width="136" height="300" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
    <text x="712" y="114" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.12em">PHASE 4</text>
    <text x="712" y="134" fill="#F5F5F3" font-size="14" font-weight="600">장애 카탈로그</text>
    <text x="712" y="176" fill="#F5F5F3" font-size="13">장애 재현과</text>
    <text x="712" y="194" fill="#F5F5F3" font-size="13">근거 있는 진단</text>
    <text x="712" y="244" fill="#8B98A9" font-size="12">장애 시나리오 6종</text>
    <text x="712" y="262" fill="#8B98A9" font-size="12">규칙 기반 진단</text>
    <text x="712" y="280" fill="#8B98A9" font-size="12">주입·복구 절차</text>
    <text x="712" y="334" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">NetworkPolicy</text>
    <text x="712" y="352" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">tc netem</text>
    <text x="712" y="370" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">kind</text>

    <!-- ===== 5 프록시 비교 (확장) ===== -->
    <rect x="844" y="96" width="136" height="300" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="856" y="114" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.12em">PHASE 5</text>
    <text x="856" y="134" fill="#F5F5F3" font-size="14" font-weight="600">프록시 비교</text>
    <text x="856" y="176" fill="#F5F5F3" font-size="13">같은 장애를</text>
    <text x="856" y="194" fill="#F5F5F3" font-size="13">세 창으로 비교</text>
    <text x="856" y="244" fill="#8B98A9" font-size="12">sidecar 전후 비교</text>
    <text x="856" y="262" fill="#8B98A9" font-size="12">앱 TLS·mTLS 분리</text>
    <text x="856" y="280" fill="#8B98A9" font-size="12">Hubble 대조</text>
    <text x="856" y="334" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">Istio</text>
    <text x="856" y="352" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">Hubble</text>
    <text x="856" y="370" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">mTLS</text>

    <!-- 행 구분선 -->
    <line x1="24" y1="212" x2="980" y2="212" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
    <line x1="24" y1="300" x2="980" y2="300" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

    <!-- 범례 -->
    <line x1="24" y1="416" x2="980" y2="416" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
    <rect x="24" y="428" width="10" height="10" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
    <text x="40" y="437" fill="#5E6B7E" font-size="12">지금 실습 중인 국면</text>
    <rect x="200" y="428" width="10" height="10" fill="#161B22" stroke="rgba(191,192,192,0.4)" stroke-width="1"/>
    <text x="216" y="437" fill="#5E6B7E" font-size="12">필수 국면</text>
    <rect x="320" y="428" width="10" height="10" fill="#0D1117" stroke="rgba(191,192,192,0.4)" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="336" y="437" fill="#5E6B7E" font-size="12">확장 국면</text>
    <text x="440" y="437" fill="#6A95D8" font-size="12" font-family="'Geist Mono',monospace">mono</text>
    <text x="478" y="437" fill="#5E6B7E" font-size="12">개발 키워드</text>
  </g>
</svg>

<title id="dt">SVID 에서 랩 루트까지 — 서명 체인</title><desc id="dd">랩 루트가 SPIRE 중간 인증서를 서명하고, SPIRE server 의 CA 가 SVID 를 서명한다. step-ca 는 이 체인의 맨 위 하나만 믿는다.</desc>
<rect width="880" height="366" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LAMPSON LAB · 02-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SVID 에서 랩 루트까지 — 서명 체인</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">SPIRE 가 CA 키를 바꿔도 맨 위 랩 루트가 그대로라서 step-ca 설정은 흔들리지 않는다</text>

<title id="dt">로그 한 줄이 가리키는 세 가지</title><desc id="dd">sshd 의 Accepted 줄은 들어온 계정, 인증서를 받은 워크로드, 인증서 한 장을 각각 다른 구간으로 남긴다.</desc>
<rect width="880" height="340" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LAMPSON LAB · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">로그 한 줄이 가리키는 세 가지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Key ID 가 SPIFFE ID 라서 로그만 보고도 어느 워크로드인지 알 수 있다</text>
<rect x="24" y="100" width="832" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="128" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" xml:space="preserve"><tspan fill="#8B98A9" font-weight="400">Accepted publickey for </tspan><tspan fill="#F5F5F3" font-weight="600">operator</tspan><tspan fill="#8B98A9" font-weight="400"> ... ID </tspan><tspan fill="#F08A59" font-weight="600">spiffe://lab/client/deployer</tspan><tspan fill="#8B98A9" font-weight="400"> (serial </tspan><tspan fill="#F5F5F3" font-weight="600">8264256466741114221</tspan><tspan fill="#8B98A9" font-weight="400">)</tspan></text>
<path d="M 218 152 V 164 H 156 V 188" fill="none" stroke="#8B98A9" stroke-width="1.0"/>
<rect x="24" y="188" width="264" height="96" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">operator</text>
<text x="40" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">들어온 역할 계정</text>
<text x="40" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">개인 계정이 없으니 사람 이름이 아니다</text>
<path d="M 390 152 V 164 H 440 V 188" fill="none" stroke="#F08A59" stroke-width="1.0"/>
<rect x="308" y="188" width="264" height="96" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="324" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">Key ID</text>
<text x="324" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">인증서를 받은 워크로드</text>
<text x="324" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">SPIFFE ID 가 그대로 남는다</text>
<path d="M 604 152 V 164 H 724 V 188" fill="none" stroke="#8B98A9" stroke-width="1.0"/>
<rect x="592" y="188" width="264" height="96" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="608" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">serial</text>
<text x="608" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">인증서 한 장</text>
<text x="608" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">발급할 때 찍힌 번호와 맞춘다</text>
<text x="24" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">줄 안의 CA 지문과 접속 주소는 생략했다 — 구간은 실측 줄(AC-18)과 같은 순서다</text>
</svg>
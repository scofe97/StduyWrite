<text x="278.5" y="501" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">no identity issued</text>
<text x="24" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">응답이 갈리는 곳은 entry 표 한 곳이다 — uid 1004 의 행이 없다</text>

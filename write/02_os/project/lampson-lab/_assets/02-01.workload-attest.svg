<text x="278.5" y="401" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">spiffe://lab/client/deployer</text>
<line x1="24" y1="424" x2="856" y2="424" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="440.0" y="446" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">같은 요청을 intruder(uid 1004)가 하면</text>

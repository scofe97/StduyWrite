<title id="dt">호출자는 요청이 아니라 커널이 알려 준다</title><desc id="dd">agent 는 소켓 반대편 프로세스의 uid 를 커널에 묻고 entry 와 맞춘다. 같은 요청에서 uid 가 달라지면 응답만 갈린다.</desc>
<rect width="880" height="548" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LAMPSON LAB · 02-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">호출자는 요청이 아니라 커널이 알려 준다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">요청에는 신원이 없고, uid 는 프로세스가 고를 수 없다</text>

<title id="dt">만료돼도 열린 연결은 남는다 — 읽는 순서</title><desc id="dd">절 넷. 인증서 만료가 막는 것에서 시작해 호스트의 연결 상한, 끊기지 않는 것, 알려진 한계로 이어진다.</desc>
<rect width="880" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LAMPSON LAB · 06-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">만료돼도 열린 연결은 남는다 — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 번째 절이 이 편의 핵심이다 — 만료가 못 닫는 틈을 호스트의 연결 상한이 닫는다</text>

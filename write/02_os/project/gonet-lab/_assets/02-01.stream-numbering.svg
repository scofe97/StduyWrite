<title id="dt">받는 쪽 줄이 하나냐 여럿이냐</title><desc id="dd">스트림 A 와 B 의 조각 A1 B1 A2 B2 를 보냈고 A2 만 사라졌다. TCP 는 받는 쪽에 줄이 하나뿐이라 A2 빈자리 뒤에 있는 B2 도 앱에 넘기지 못한다. QUIC 은 스트림마다 줄이 따로라 A 줄에만 빈자리가 생기고, B 줄은 B1 B2 가 다 차서 앱에 넘어간다.</desc>

<title id="dt">이름 전체 길이 대신 라벨마다 길이</title><desc id="dd">Phase 1 에서 세운 설계는 이름 전체 앞에 길이 11 을 하나 붙였다. 실제 DNS 는 점에서 이름을 잘라 라벨마다 길이 1바이트를 붙이고, 길이 0 인 빈 라벨로 끝낸다. 점은 선로에 오르지 않으므로 같은 이름이 12바이트가 아니라 13바이트가 된다.</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 03-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름 전체 길이 대신 라벨마다 길이</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">라벨 길이 한 바이트는 0 – 63 만 씁니다. 위 두 비트가 비어 있어야 §3 의 압축 포인터와 구별됩니다.</text>
<text x="231.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">입력</text>

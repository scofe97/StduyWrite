<title id="dt">echo 한 번이 지나는 길</title><desc id="dd">소켓 하나에는 수신 버퍼와 송신 버퍼 두 차선이 있고 FD 는 하나다. io.Copy(conn, conn) 은 두 차선 사이를 splice 로 잇느라 커널 안에 pipe 를 하나 두어 연결마다 FD 를 두 개 더 쓴다. 직접 쓴 Read·Write 루프는 프로세스의 buf 를 거쳐 FD 는 소켓 하나뿐이지만 데이터가 커널과 프로세스 사이를 한 번 오간다.</desc>
<rect width="960" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 01-01 SOCKET LANES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">echo 한 번이 지나는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가운데 칸이 pipe 면 연결마다 FD 3 개, buf 면 1 개입니다.</text>
<text x="24" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">io.Copy(conn, conn) — splice</text>

<title id="dt">61바이트 응답을 앞에서부터 읽기</title><desc id="dd">1.1.1.1 이 돌려준 61바이트를 오프셋 순서로 읽는다. 헤더에서 ID 와 QR·RCODE 를 확인하고, 질문 칸이 보낸 질문과 같은지 대조한 뒤, ANCOUNT 2 만큼 답 레코드를 읽는다. 답의 이름은 c0 0c 두 바이트로 오프셋 12 의 example.com 을 가리키고 RDATA 4바이트가 IPv4 주소다.</desc>

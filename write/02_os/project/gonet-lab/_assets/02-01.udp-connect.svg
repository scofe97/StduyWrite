<title id="dt">connect() 가 하는 일</title><desc id="dd">TCP 의 connect 는 SYN, SYN-ACK, ACK 세 세그먼트를 주고받아 양쪽 모두 ESTABLISHED 가 된다. UDP 의 connect 는 패킷을 보내지 않고 클라이언트 소켓에 상대 주소만 적는다. 커널이 그 소켓 상태 칸에 ESTABLISHED 를 넣어 ss 에는 ESTAB 으로 보이지만 서버 소켓은 UNCONN 그대로다.</desc>
<rect width="960" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 02-01 CONNECT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">connect() 가 하는 일</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이름은 같은 ESTAB 이지만, 왼쪽은 양쪽이 합의한 상태이고 오른쪽은 한쪽의 메모입니다.</text>

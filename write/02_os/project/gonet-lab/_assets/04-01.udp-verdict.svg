<title id="dt">UDP 판정과 실제가 어긋나는 곳</title><desc id="dd">UDP 는 열린 포트도 앱이 답하지 않으면 침묵한다. 닫힌 포트는 ICMP 로 답하지만 그 ICMP 가 유실되거나 대상 커널의 응답 제한에 걸리면 역시 침묵이 된다. 그래서 무응답은 open|filtered 로만 적을 수 있고, 그 안에 닫힌 포트까지 섞일 수 있다.</desc>
<rect width="960" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 04-01 §3</text>

<title id="dt">막힌 Read 를 바깥에서 닫아야 사슬이 풀립니다</title><desc id="dd">종료 신호 전에는 핸들러 goroutine 이 연결의 Read 에서, 메인 goroutine 이 Accept 에서 기다린다. 신호로 context 가 취소되면 AfterFunc goroutine 이 listener 를 닫고, Accept 에러로 풀린 메인은 wg.Wait 에서 다시 멈춘다. AfterFunc 가 연결까지 닫으면 Read 에러, io.Copy 반환, defer 의 wg.Done, wg.Wait 반환, main 의 return 이 차례로 풀린다.</desc>
<rect width="960" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 00-03 WAIT CHAIN</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">막힌 Read 를 바깥에서 닫아야 사슬이 풀립니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로선 위가 종료 신호 전, 아래가 신호 뒤에 사슬이 생기고 풀리는 순서입니다.</text>

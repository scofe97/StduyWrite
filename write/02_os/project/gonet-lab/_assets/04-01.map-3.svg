<title id="dt">원인은 다섯, 스캐너가 보는 것은 셋</title><desc id="dd">스캐너가 보는 것은 RST, ICMP, 무응답 셋뿐이다. 닫힌 포트와 REJECT 는 무언가를 돌려보내 증거를 남긴다. DROP, 유실, ICMP 응답 제한은 모두 아무것도 돌려보내지 않아 스캐너 쪽에서는 똑같이 보인다. CONNECT 는 커널이 ICMP 를 ECONNREFUSED 로 바꾸므로 닫힌 포트와 REJECT 를 가르지 못한다.</desc>
<rect width="960" height="688" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 04-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">원인은 다섯, 스캐너가 보는 것은 셋</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가운데 열은 net.Dial 이 돌려주는 결과, 오른쪽 열은 패킷을 직접 읽는 스캐너의 판정입니다.</text>
<text x="231.5" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">실제 원인</text>

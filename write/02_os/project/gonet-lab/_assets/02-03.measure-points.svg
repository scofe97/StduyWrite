<title id="dt">100 개가 가는 길에서 센 곳</title><desc id="dd">phase2-loss 가 번호 붙은 메시지 100 개를 보내면 lo 를 두 번 지나 돌아온다. 손실 20% 에서 UDP 는 가는 길에 22 개, 오는 길에 12 개를 잃어 서버 로그 78 줄, 클라이언트 66 개였고 TCP 는 재전송으로 100 개를 모두 받았다. 뒤바뀜만 건 실험 5 에서 UDP 는 100 개를 뒤섞인 채 받았고 TCP 는 순서를 맞춰 받았지만 불필요한 재전송을 10 번 했다.</desc>

<title id="dt">경계가 죽는 곳과 사는 곳</title><desc id="dd">같은 두 번의 쓰기를 TCP 는 송신 버퍼에서 바이트 한 줄로 이어 붙여 경계를 잃고, 끝까지 한 줄로 흘려 Read 가 아무 데서나 끊는다. UDP 는 쓰기마다 길이를 단 데이터그램을 만들어 패킷 하나로 보내고, 받는 쪽 대기열에도 덩어리째 줄 세워 ReadFrom 이 하나씩 꺼낸다.</desc>
<rect width="960" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOW · 02-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">경계가 죽는 곳과 사는 곳</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">TCP 는 두 번째 칸에서 경계를 잃고, UDP 는 모든 칸에서 덩어리 둘을 유지합니다. len 은 UDP 헤더의 길이 칸(헤더 8 + 본문 5)입니다.</text>
<text x="211.0" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">앱</text>

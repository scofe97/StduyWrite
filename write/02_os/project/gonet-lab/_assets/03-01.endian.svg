<title id="dt">2바이트 숫자를 어느 자리부터 보내나</title><desc id="dd">같은 uint16 이라도 큰 자리 바이트부터 보내면 빅엔디언, 작은 자리부터면 리틀엔디언이다. DNS 는 빅엔디언으로 정했다. 리틀엔디언 순서로 써 버리면 받는 쪽은 바이트를 뒤집어 읽어 다른 숫자를 얻는다. 뒤집힌 AAAA 는 없는 타입 7168 이 되어 1.1.1.1 이 에러 없이 답 0개로 돌려줬고, 뒤집힌 RDLENGTH 를 믿는 디코더는 메시지 밖까지 읽으려 한다.</desc>

<title id="dt">HTTP/1.1 · 2 · 3 에서 막히는 자리</title><desc id="dd">한 페이지를 그리려고 브라우저가 서로 무관한 요청 A(이미지), B(CSS), C(JS) 셋을 보내고, 서버는 응답마다 조각으로 나눠 보낸다. HTTP/1.1 은 응답을 요청 순서대로 통째로 보내 A 가 B 와 C 를 막는다. HTTP/2 는 세 응답의 조각을 한 TCP 연결에 섞어 보내지만 A2 가 사라지면 이미 도착한 B2, C2, A3 도 커널에 묶인다. HTTP/3 은 QUIC 이 스트림마다 따로 순서를 맞춰 A 만 멈춘다.</desc>
<rect width="960" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 02-01 HTTP HOL</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">HTTP/1.1 · 2 · 3 에서 막히는 자리</text>

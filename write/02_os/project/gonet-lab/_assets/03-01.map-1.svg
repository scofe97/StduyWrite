<title id="dt">example.com A 질의 29바이트</title><desc id="dd">서버는 받은 바이트에서 ID·이름·타입이 어디서 끝나는지 알아야 한다. 헤더 12바이트는 ID·플래그·개수 넷이 모두 2바이트 고정이라 규격만으로 끝을 안다. 이름만 길이가 변해 라벨마다 길이를 붙이고 길이 0 으로 끝낸다. 타입과 클래스가 2바이트씩 붙어 모두 29바이트다.</desc>

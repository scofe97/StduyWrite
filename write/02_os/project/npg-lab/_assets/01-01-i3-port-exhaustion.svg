<title id="dt">동시 50 중 48을 닫아 포트를 채우기까지</title><desc id="dd">동시 50 요청 중 48개가 닫혀 TIME_WAIT 60초 동안 누적되고 28,232개 출발 포트가 바닥나 dial 실패(UF 502)로 이어진 흐름</desc>
<rect width="960" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SWIMLANE · CH08 I3 DIAGNOSIS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">동시 50 중 48을 닫아 포트를 채우기까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">요청마다 48개 소켓을 닫아 TIME_WAIT 가 누적되고, 28,232개 포트 고갈로 dial 실패(UF 502)가 발생합니다.</text>
<text x="230" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">1단계: 48 닫힘</text>

<title id="dt">새 설정 반영 국면과 검증 실패 시 옛 설정 유지 전이</title><desc id="dd">새 설정의 본문 해석, Provision 및 Validate, Start 국면과 실패 시 500 반환 및 옛 설정 유지 상태 전이도</desc>
<rect width="960" height="492" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">STATE MACHINE · ATOMIC CONFIG SWAP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">새 설정 반영 국면과 검증 실패 시 옛 설정 유지 전이</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원자 교체는 검증 실패 시 옛 설정을 보존하나, 옛 설정에 결함이 있으면 계속 누출되는 한계를 갖습니다.</text>

<title id="dt">전체 시계 WriteTimeout 과 쓰기 틈 시계의 15초 동작 비교</title><desc id="dd">동일한 백엔드 검색 지연 20초 요청에서 전체 시계는 15초에 소켓을 끊어 504를 삼키고, 쓰기 틈 시계는 대기 중 시계가 돌지 않아 504 응답을 정상 전달하는 시간축</desc>
<rect width="960" height="492" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TIMELINE · CH09 J2 WRITE TIMEOUT VS IDLE GAP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">전체 시계 WriteTimeout 과 쓰기 틈 시계의 15초 동작 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">전체 시계는 백엔드 대기까지 합산해 504 전에 끊기지만, 틈 시계는 쓰기 마디마다 다시 재어 504를 전송합니다.</text>

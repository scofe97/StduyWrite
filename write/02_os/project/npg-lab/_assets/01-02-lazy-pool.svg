<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">게으른 연결 풀과 TIME_WAIT 전이</title><desc id="dd">요청 도착 시점에만 새로 맺고 기본 2칸 초과 반환 시 프록시가 먼저 닫아 TIME_WAIT 60초 동안 출발 포트를 점유하는 상태 머신</desc>
<rect width="960" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">STATE MACHINE · CH08 LAZY POOL &amp; PORT EXHAUSTION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">게으른 연결 풀과 TIME_WAIT 전이</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">기본 보관 2칸을 초과한 연결은 프록시가 능동 종료(FIN)하여 TIME_WAIT 60초 동안 출발 포트(28,232개)를 점유합니다.</text>
<circle cx="32" cy="196" r="6" fill="#F5F5F3"/>
<text x="32" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">시작</text>
<path d="M 40 196 L 72 196" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="76" y="156" width="176" height="80" rx="8" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="164" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#6A95D8">새로 맺음</text>
<text x="164" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#F5F5F3">요청 시점에만 생성</text>
<text x="164" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#8B98A9">미리 채우지 않음</text>
<path d="M 252 196 L 368 196" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="310" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#8B98A9">연결 수립</text>
<rect x="372" y="156" width="176" height="80" rx="8" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="460" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#3FB98C">사용 중</text>
<text x="460" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#F5F5F3">HTTP 왕복 처리</text>
<text x="460" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#8B98A9">동시 50 요청 처리</text>
<path d="M 548 196 L 664 196" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="606" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#8B98A9">반환 [idle &lt; 2]</text>
<rect x="668" y="156" width="176" height="80" rx="8" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="756" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#6A95D8">빈 연결 보관</text>
<text x="756" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#F5F5F3">호스트당 기본 2칸</text>
<text x="756" y="224" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="400" fill="#8B98A9">MaxIdleConnsPerHost</text>
<path d="M 756 156 L 756 120 L 460 120 L 460 152" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="608" y="110" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">다음 요청에 재사용</text>
<path d="M 460 236 L 460 316" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="472" y="280" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">보관 칸 가득 [idle ≥ 2]</text>
<rect x="372" y="320" width="176" height="80" rx="8" fill="#F08A5916" stroke="#F08A59" stroke-width="1.6"/>
<text x="460" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">닫힘 (능동 종료)</text>
<text x="460" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#F5F5F3">초과 48개 소켓 닫음</text>
<text x="460" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#8B98A9">프록시가 FIN 전송</text>
<path d="M 548 360 L 664 360" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="606" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">FIN 전송</text>
<rect x="668" y="320" width="176" height="80" rx="8" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="756" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F0616D">TIME_WAIT</text>
<text x="756" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#F5F5F3">60초 동안 소켓 점유</text>
<text x="756" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#8B98A9">포트 28,232개 고갈</text>
<path d="M 844 360 L 904 360" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="874" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">60초</text>
<circle cx="916" cy="360" r="8" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<circle cx="916" cy="360" r="5" fill="#8B98A9"/>
<text x="916" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">포트 반환</text>
<line x1="12" y1="440" x2="912" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="462" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="452" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 연결·재사용</text>
<rect x="261" y="452" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="283" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">게으른 생성·보관</text>
<rect x="422" y="452" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="444" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보관 초과 닫힘 (focal)</text>
<rect x="674" y="452" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="696" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">포트 고갈 위험</text>
</svg>
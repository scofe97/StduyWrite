<svg viewBox="0 0 1180 660" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>kube-proxy 세 모드의 정체 — iptables·IPVS·nftables가 규칙을 찾는 방식</title>
  <desc>세 모드는 모두 같은 netfilter 훅 위에서 동작하며, 규칙을 표현하고 찾는 방식이 다르다. iptables는 가장 오래된 표준 도구로 규칙을 목록에 담아 위에서 아래로 하나씩 훑기 때문에 서비스가 늘면 비교 횟수도 비례해 늘어난다. IPVS는 원래 리눅스의 4계층 로드밸런서 서브시스템으로, 규칙을 해시 테이블로 들고 있어 서비스 수와 무관하게 조회 시간이 일정하고 라운드로빈 같은 분산 알고리즘을 고를 수 있지만 별도 서브시스템을 끌어들이는 우회로다. nftables는 iptables를 대체하려고 만든 후속 표준으로, 셋과 맵 자료구조로 선형 탐색 문제를 구조적으로 해결한다. 현재 상태는 iptables가 호환성 때문에 기본값이고, nftables는 1.33에서 정식 승격됐으며, IPVS는 1.35에서 폐기 예정으로 표시됐다.</desc>
  <defs>
    <style>
      .title  { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .kind   { font-size: 14px; font-weight: 800; }
      .role   { font-size: 10.5px; font-weight: 700; }
      .desc   { font-size: 10.5px; font-weight: 600; fill: #e8e4df; }
      .muted  { font-size: 9.5px; fill: rgb(138,133,128); }
      .mono   { font-size: 9.5px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .darkmono { font-size: 9.5px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #0d0d0d; }
      .darkdesc { font-size: 10.5px; font-weight: 700; fill: #0d0d0d; }
      .badge  { font-size: 10px; font-weight: 800; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/></marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b9bd5"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="660" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">kube-proxy 세 모드 — 같은 훅 위, 다른 찾기 방식</text>
  <text x="24" y="50" class="sub">셋 다 netfilter 훅 위에서 동작한다. 갈리는 건 규칙을 어떻게 담고 어떻게 찾느냐다.</text>

  <!-- 공통 토대 -->
  <rect x="40" y="72" width="1100" height="42" rx="9" fill="rgb(20,22,26)" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="590" y="98" class="desc" text-anchor="middle" style="fill:rgb(212,168,83)">공통 토대 — netfilter 훅 (PREROUTING · POSTROUTING …). 셋 중 무엇을 쓰든 패킷이 지나는 자리는 같다.</text>
  <line x1="240" y1="114" x2="240" y2="140" stroke="rgb(212,168,83)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <line x1="590" y1="114" x2="590" y2="140" stroke="rgb(212,168,83)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <line x1="940" y1="114" x2="940" y2="140" stroke="rgb(212,168,83)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- iptables -->
  <rect x="40" y="146" width="340" height="404" rx="12" fill="rgb(16,18,22)" stroke="rgb(212,168,83)" stroke-width="1.4"/>
  <text x="62" y="176" class="kind" style="fill:rgb(212,168,83)">iptables</text>
  <text x="62" y="196" class="role" style="fill:rgb(138,133,128)">정체 — 가장 오래된 표준 규칙 도구</text>

  <rect x="62" y="212" width="296" height="34" rx="6" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="76" y="234" class="mono" style="fill:rgb(212,168,83)">규칙을 목록에 담는다</text>

  <text x="62" y="272" class="muted">조회 방식 — 위에서 아래로 하나씩</text>
  <rect x="62" y="282" width="296" height="24" rx="4" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="76" y="299" class="mono" style="fill:rgb(138,133,128)">svc-A ? → 아니오</text>
  <rect x="62" y="310" width="296" height="24" rx="4" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="76" y="327" class="mono" style="fill:rgb(138,133,128)">svc-B ? → 아니오</text>
  <rect x="62" y="338" width="296" height="24" rx="4" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="76" y="355" class="mono" style="fill:rgb(138,133,128)">svc-C ? → 아니오</text>
  <rect x="62" y="366" width="296" height="24" rx="4" fill="rgb(30,20,20)" stroke="#f0b0b0" stroke-width="1.1"/>
  <text x="76" y="383" class="mono" style="fill:#f0b0b0">… 서비스 수만큼 반복</text>

  <rect x="62" y="404" width="296" height="52" rx="7" fill="rgb(30,20,20)" stroke="#f0b0b0" stroke-width="1.1"/>
  <text x="76" y="425" class="desc" style="fill:#f0b0b0">비용이 서비스 수에 비례한다</text>
  <text x="76" y="444" class="muted" style="fill:#f0b0b0">조회도, 규칙 갱신도 함께 느려진다</text>

  <rect x="62" y="472" width="296" height="56" rx="7" fill="#d4a853"/>
  <text x="210" y="494" class="badge" text-anchor="middle" style="fill:#0d0d0d">현재 기본값</text>
  <text x="210" y="514" class="darkmono" text-anchor="middle">호환성 때문에 유지</text>

  <!-- IPVS -->
  <rect x="400" y="146" width="380" height="404" rx="12" fill="rgb(16,18,22)" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="422" y="176" class="kind" style="fill:#8fc0ec">IPVS (IP Virtual Server)</text>
  <text x="422" y="196" class="role" style="fill:rgb(138,133,128)">정체 — 리눅스 L4 로드밸런서를 빌려 온 우회로</text>

  <rect x="422" y="212" width="336" height="34" rx="6" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="436" y="234" class="mono" style="fill:#8fc0ec">규칙을 해시 테이블에 담는다</text>

  <text x="422" y="272" class="muted">조회 방식 — 키로 한 번에</text>
  <rect x="422" y="282" width="336" height="60" rx="7" fill="#5b9bd5"/>
  <text x="590" y="306" class="desc" text-anchor="middle" style="fill:#e8e4df">hash(ClusterIP:포트)</text>
  <text x="590" y="328" class="mono" text-anchor="middle" style="fill:#e8e4df">→ 엔드포인트 즉시 도착</text>

  <rect x="422" y="352" width="336" height="38" rx="7" fill="rgb(20,30,22)" stroke="#66bb6a" stroke-width="1"/>
  <text x="436" y="376" class="desc" style="fill:#66bb6a">서비스가 몇 개든 조회 시간 일정</text>

  <rect x="422" y="400" width="336" height="56" rx="7" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="436" y="421" class="desc">태생이 부하 분산기라 알고리즘을 고른다</text>
  <text x="436" y="440" class="muted">라운드로빈·최소 연결 등 선택 가능</text>

  <rect x="422" y="472" width="336" height="56" rx="7" fill="rgb(30,20,20)" stroke="#f0b0b0" stroke-width="1.3"/>
  <text x="590" y="494" class="badge" text-anchor="middle" style="fill:#f0b0b0">v1.35 deprecated</text>
  <text x="590" y="514" class="muted" text-anchor="middle" style="fill:#f0b0b0">별도 서브시스템 부담이 발목을 잡았다</text>

  <!-- nftables -->
  <rect x="800" y="146" width="340" height="404" rx="12" fill="rgb(16,18,22)" stroke="#66bb6a" stroke-width="1.4"/>
  <text x="822" y="176" class="kind" style="fill:#66bb6a">nftables</text>
  <text x="822" y="196" class="role" style="fill:rgb(138,133,128)">정체 — iptables 자리를 물려받는 후계자</text>

  <rect x="822" y="212" width="296" height="34" rx="6" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="836" y="234" class="mono" style="fill:#66bb6a">규칙을 셋·맵에 담는다</text>

  <text x="822" y="272" class="muted">조회 방식 — 셋 안에서 해시 조회</text>
  <rect x="822" y="282" width="296" height="60" rx="7" fill="#66bb6a"/>
  <text x="970" y="306" class="darkdesc" text-anchor="middle">set / map 매칭</text>
  <text x="970" y="328" class="darkmono" text-anchor="middle">선형 탐색 자체가 없다</text>

  <rect x="822" y="352" width="296" height="38" rx="7" fill="rgb(20,30,22)" stroke="#66bb6a" stroke-width="1"/>
  <text x="836" y="376" class="desc" style="fill:#66bb6a">매칭 비용이 서비스 수와 무관</text>

  <rect x="822" y="400" width="296" height="56" rx="7" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="836" y="421" class="desc">외부 서브시스템을 끌어들이지 않는다</text>
  <text x="836" y="440" class="muted">netfilter 안에서 해결한다는 게 차이</text>

  <rect x="822" y="472" width="296" height="56" rx="7" fill="#66bb6a"/>
  <text x="970" y="494" class="badge" text-anchor="middle" style="fill:#0d0d0d">v1.33 stable (GA)</text>
  <text x="970" y="514" class="darkmono" text-anchor="middle">커널 5.13 이상 필요</text>

  <!-- 결론 -->
  <rect x="40" y="566" width="1100" height="48" rx="10" fill="rgb(16,18,22)" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="62" y="596" class="desc" style="fill:rgb(212,168,83)">한 줄 요약 — iptables는 낡은 표준, IPVS는 부하 분산기를 빌려 온 우회로, nftables는 정식 후계자. "대규모면 IPVS"라는 조언은 수명이 끝났다.</text>

  <text x="24" y="640" class="muted">한계: 리눅스 노드 기준이다. 윈도우 노드는 kernelspace 모드를 따로 쓰며, eBPF(Cilium)는 kube-proxy 자체를 걷어내는 또 다른 선택지다.</text>
</svg>

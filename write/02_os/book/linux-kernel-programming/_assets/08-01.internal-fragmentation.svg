<title id="dt">2의 거듭제곱이 아니면 버려집니다</title><desc id="dd">132KB 를 요청하면 페이지 할당자는 그보다 적게 줄 수 없어 order 7 의 256KB 청크를 준다. 소비자는 앞 132KB 만 쓰고 나머지 124KB, 곧 거의 절반을 버린다. alloc_pages_exact() 는 평소처럼 받은 뒤 초과분을 즉시 free 해 이 낭비를 되돌린다.</desc>
<rect width="976" height="624" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 08-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">2의 거듭제곱이 아니면 버려집니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">막대 길이가 곧 KB 입니다 — 위아래 두 막대의 차이가 버려지는 양입니다</text>
<text x="24" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">요청한 크기</text>
<text x="24" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">실제 필요한 양</text>
<rect x="208.0" y="152" width="360.9375" height="40" rx="4" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.1"/>
<text x="224.0" y="177" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">132 KB</text>
<text x="24" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">받은 크기</text>
<text x="24" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">더 적게는 못 줍니다</text>
<rect x="208.0" y="220" width="700.0" height="40" rx="4" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="224.0" y="245" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">256 KB — order 7</text>
<text x="24" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">버려진 크기</text>
<text x="24" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">쓰지 않는 구간</text>
<rect x="568.9375" y="288" width="339.0625" height="40" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="584.9375" y="313" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">124 KB · 48.4%</text>
<text x="24" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">alloc_pages_exact()</text>
<text x="24" y="392" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">초과분을 free</text>
<rect x="208.0" y="356" width="360.9375" height="40" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="224.0" y="381" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">132 KB</text>
<line x1="208" y1="408" x2="908" y2="408" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="208.0" y1="408" x2="208.0" y2="416" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="208.0" y="434" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0 KB</text>
<line x1="383.0" y1="408" x2="383.0" y2="416" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="383.0" y="434" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">64 KB</text>
<line x1="558.0" y1="408" x2="558.0" y2="416" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="558.0" y="434" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">128 KB</text>
<line x1="733.0" y1="408" x2="733.0" y2="416" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="733.0" y="434" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">192 KB</text>
<line x1="908.0" y1="408" x2="908.0" y2="416" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="908.0" y="434" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">256 KB</text>
<line x1="568.9375" y1="152" x2="568.9375" y2="328" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="576.9375" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">여기까지만 씁니다</text>
<text x="24" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">완화책은 2008년 Timur Tabi 가 기여한 alloc_pages_exact() / free_pages_exact() 쌍입니다.</text>
<text x="24" y="488" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">구현은 단순합니다. __get_free_pages() 로 평소처럼 256KB 를 받은 뒤, 132KB 너머 페이지를 루프 돌며 free 합니다.</text>
<text x="24" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">할당된 메모리는 여전히 물리 연속이고, 한 번에 받을 수 있는 양은 MAX_ORDER 제한을 그대로 받습니다.</text>
<line x1="12" y1="568" x2="928" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="590" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="579" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="591" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">요청</text>
<rect x="178" y="579" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="200" y="591" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">실제 할당</text>
<rect x="301" y="579" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="323" y="591" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">버려지는 양 — 이 절의 논점</text>
<rect x="589" y="579" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="611" y="591" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">되돌린 결과</text>
</svg>
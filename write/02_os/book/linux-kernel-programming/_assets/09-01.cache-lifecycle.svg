<title id="dt">생성자는 alloc 당 한 번이 아닙니다</title><desc id="dd">custom slab cache 의 3단계 수명주기. 모듈 init 에서 캐시를 만들고, 쓰는 동안 객체를 빌렸다 반납하고, exit 에서 캐시를 부순다. 생성자(ctor)는 kmem_cache_alloc() 호출당 한 번이 아니라 캐시가 새 페이지를 받을 때마다 호출되므로, alloc 한 번에 여러 번 도는 일이 흔하다.</desc>
<rect width="976" height="752" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 09-01 §1~§3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">생성자는 alloc 당 한 번이 아닙니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">세 단계 모두 프로세스 컨텍스트에서만 부를 수 있습니다</text>
<rect x="24.0" y="104" width="224" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="136.0" y="125" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">내 모듈</text>
<text x="136.0" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">module</text>
<rect x="364.0" y="104" width="224" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="476.0" y="125" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">slab 계층</text>
<text x="476.0" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">kmem_cache</text>
<rect x="704.0" y="104" width="224" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="816.0" y="125" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">페이지 할당자</text>
<text x="816.0" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">buddy system</text>

<title id="dt">order 하나에 청크가 배로 커집니다</title><desc id="dd">freelist 는 이중 연결 순환 리스트들을 가리키는 포인터 배열이고, 배열 인덱스가 order 다. order N 리스트는 2^N 페이지짜리 물리 연속 청크만 담는다. x86·ARM 의 MAX_ORDER 는 11 이라 order 는 0부터 10, 한 번에 받을 수 있는 최대치가 4MB 다.</desc>
<rect width="976" height="684" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 08-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">order 하나에 청크가 배로 커집니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">4KB 페이지 기준 — 이 배열이 노드:존마다 따로 있습니다</text>
<rect x="96" y="124" width="640" height="32" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="84" y="145" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">order 10</text>
<text x="112" y="145" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">2^10 = 1024 페이지</text>
<text x="328" y="145" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">4 MB</text>
<rect x="492" y="130" width="36" height="20" rx="3" fill="#0D1117" stroke="#F08A59" stroke-width="0.9"/>
<rect x="536" y="130" width="36" height="20" rx="3" fill="#0D1117" stroke="#F08A59" stroke-width="0.9"/>
<rect x="96" y="160" width="640" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="181" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">order 9</text>
<text x="112" y="181" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6A95D8">2^9 = 512 페이지</text>
<text x="328" y="181" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">2 MB</text>
<rect x="492" y="166" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="536" y="166" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="580" y="166" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="96" y="196" width="640" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="217" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">order 8</text>
<text x="112" y="217" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6A95D8">2^8 = 256 페이지</text>
<text x="328" y="217" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">1 MB</text>
<rect x="492" y="202" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="536" y="202" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="580" y="202" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="624" y="202" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="96" y="232" width="640" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="253" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">order 7</text>
<text x="112" y="253" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6A95D8">2^7 = 128 페이지</text>
<text x="328" y="253" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">512 KB</text>
<rect x="492" y="238" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="536" y="238" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="580" y="238" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="624" y="238" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="96" y="268" width="640" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="289" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">order 6</text>
<text x="112" y="289" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6A95D8">2^6 = 64 페이지</text>
<text x="328" y="289" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">256 KB</text>
<rect x="492" y="274" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="536" y="274" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="580" y="274" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="624" y="274" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="96" y="304" width="640" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="325" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">order 5</text>
<text x="112" y="325" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6A95D8">2^5 = 32 페이지</text>
<text x="328" y="325" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">128 KB</text>
<rect x="492" y="310" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="536" y="310" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="580" y="310" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="624" y="310" width="36" height="20" rx="3" fill="#0D1117" stroke="#6A95D8" stroke-width="0.9"/>
<rect x="96" y="340" width="640" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="361" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">order 4</text>
<text x="112" y="361" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">2^4 = 16 페이지</text>
<text x="328" y="361" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">64 KB</text>
<rect x="492" y="346" width="36" height="20" rx="3" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<rect x="536" y="346" width="36" height="20" rx="3" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<rect x="580" y="346" width="36" height="20" rx="3" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<rect x="96" y="376" width="640" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="397" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">order 3</text>
<text x="112" y="397" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">2^3 = 8 페이지</text>
<text x="328" y="397" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">32 KB</text>
<rect x="492" y="382" width="36" height="20" rx="3" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<rect x="536" y="382" width="36" height="20" rx="3" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<rect x="96" y="412" width="640" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="433" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">order 2</text>
<text x="112" y="433" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">2^2 = 4 페이지</text>
<text x="328" y="433" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">16 KB</text>
<rect x="492" y="418" width="36" height="20" rx="3" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<rect x="536" y="418" width="36" height="20" rx="3" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<rect x="96" y="448" width="640" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="469" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">order 1</text>
<text x="112" y="469" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">2^1 = 2 페이지</text>
<text x="328" y="469" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">8 KB</text>
<rect x="492" y="454" width="36" height="20" rx="3" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<rect x="96" y="484" width="640" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="505" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">order 0</text>
<text x="112" y="505" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">2^0 = 1 페이지</text>
<text x="328" y="505" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">4 KB</text>
<rect x="492" y="490" width="36" height="20" rx="3" fill="#0D1117" stroke="#8B98A9" stroke-width="0.9"/>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">청크가 크다</text>
<text x="24" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">청크가 작다</text>
<text x="492" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">상자 하나가 그 리스트에 달린 자유 청크 하나입니다</text>
<text x="24" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">청크마다 물리 연속이 보장됩니다. 그래서 반으로 쪼개도 두 조각이 각각 물리 연속입니다.</text>
<text x="24" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">커널은 노드:존마다 이 배열을 따로 둡니다. 2.6.24 부터는 migration type 으로 한 번 더 쪼개, 4 노드·3 존이면 최대 72개가 됩니다.</text>
<text x="24" y="612" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">현재 상태는 /proc/buddyinfo 로 봅니다. 존 이름 뒤 숫자가 order 0 부터의 청크 개수입니다.</text>
<line x1="12" y1="628" x2="928" y2="628" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="650" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="639" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="651" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">한 번에 받을 수 있는 최대</text>
<rect x="373" y="639" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="395" y="651" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">드라이버가 흔히 쓰는 구간</text>
</svg>
<line x1="356.66666666666663" y1="158" x2="356.66666666666663" y2="584" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="595.3333333333333" y1="158" x2="595.3333333333333" y2="584" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="834.0" y1="158" x2="834.0" y2="584" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<text x="24" y="616" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">커널 VAS 는 VMA 로 관리되지 않아 이 경로로는 안 보입니다 — 그래서 §3 이 LKM 을 씁니다.</text>

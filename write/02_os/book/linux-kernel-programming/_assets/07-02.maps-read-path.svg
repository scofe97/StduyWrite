<title id="dt">maps 한 줄은 VMA 하나에서 나옵니다</title><desc id="dd">cat /proc/self/maps 의 커널 경로. read() 시스템 콜이 VFS 를 거쳐 procfs 콜백으로 라우팅되고, 콜백이 프로세스의 VMA 체인을 순회하며 매핑마다 한 줄씩 만들어 user space 로 보낸다.</desc>
<rect width="976" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 07-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">maps 한 줄은 VMA 하나에서 나옵니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">그래서 maps 줄 수가 곧 그 프로세스의 VMA 개수입니다</text>

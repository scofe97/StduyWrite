<path d="M 824.0 376 L 607.3333333333333 376" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4 4"/>
<text x="714.6666666666666" y="366" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">vm_start · vm_end · vm_flags · vm_file</text>
<path d="M 605.3333333333333 428 L 657.3333333333333 428 L 657.3333333333333 452 L 608.3333333333333 452" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="667.3333333333333" y="435" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">per VMA</text>
<text x="667.3333333333333" y="455" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">매핑 하나가 한 줄이 됩니다</text>

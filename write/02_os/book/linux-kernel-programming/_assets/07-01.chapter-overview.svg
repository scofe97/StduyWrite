<title id="dt">주소가 물리 메모리에 닿기까지</title><desc id="dd">07-01 이 다루는 네 절. 유저와 커널이 한 주소 공간을 나눠 쓰는 VM split 에서 시작해, 64비트 주소가 비트맵이라는 사실을 거쳐, MMU 가 페이지 테이블을 걸어 물리 주소를 얻는 데까지 간다.</desc>
<rect width="928" height="448" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 07-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">주소가 물리 메모리에 닿기까지</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">주소는 절대값이 아니라 MMU 가 읽는 비트맵이라는 것이 이 편의 한 문장입니다</text>
<rect x="24" y="116" width="192" height="180" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="146" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">§1</text>
<text x="200" y="146" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">VM split</text>
<line x1="40" y1="162" x2="200" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="40" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">유저와 커널이 한 공간을</text>
<text x="40" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">User:Kernel 로 나눈다</text>
<rect x="67.66999999999999" y="249" width="104.66000000000001" height="22" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="120.0" y="265" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#6A95D8">PAGE_OFFSET</text>
<rect x="252" y="116" width="192" height="180" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="268" y="146" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">§2</text>
<text x="428" y="146" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">가상 주소</text>
<line x1="268" y1="162" x2="428" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="268" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">절대값이 아니라</text>
<text x="268" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">MMU 가 읽는 비트맵이다</text>
<rect x="303.73" y="249" width="88.54" height="22" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="348.0" y="265" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#6A95D8">UVA · KVA</text>
<rect x="480" y="116" width="192" height="180" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="496" y="146" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">§3</text>
<text x="656" y="146" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">MMU 변환</text>
<line x1="496" y1="162" x2="656" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="496" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">페이지 테이블을 걸어</text>
<text x="496" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">물리 프레임을 찾는다</text>
<rect x="507.55" y="249" width="136.9" height="22" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="576.0" y="265" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">PGD→PUD→PMD→PTE</text>
<rect x="708" y="116" width="192" height="180" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="724" y="146" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">§4</text>
<text x="884" y="146" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">64비트 split</text>
<line x1="724" y1="162" x2="884" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="724" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">48비트로 128TB : 128TB</text>
<text x="724" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">가운데는 거대한 hole 이다</text>
<rect x="743.61" y="249" width="120.78" height="22" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="804.0" y="265" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#6A95D8">non-canonical</text>
<path d="M 222 206.0 L 244 206.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 450 206.0 L 472 206.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 678 206.0 L 700 206.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="24" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">§1 이 공간을 가르고 §2 가 주소의 생김새를 밝히면, §3 의 변환이 그 둘 위에서 성립합니다.</text>
<text x="24" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">§4 는 §1 의 32비트 예시를 64비트 실물 수치로 다시 세우는 자리입니다.</text>
<line x1="12" y1="392" x2="880" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="403" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="415" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">이 편의 논점</text>
<rect x="253" y="403" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="275" y="415" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">나머지 절</text>
</svg>
<title id="dt">probe 에서 받으면 detach 에서 풀립니다</title><desc id="dd">devm_kmalloc·devm_kzalloc 으로 받은 버퍼는 커널의 resource management 프레임워크가 드라이버 detach 또는 모듈 제거 시점에 자동으로 해제한다. 개발자가 해제 코드를 쓰지 않아도 되므로 에러 경로의 누수가 사라진다. 다만 그 자동 해제 시점은 probe 에 묶여 있다.</desc>
<rect width="976" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 08-02 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">probe 에서 받으면 detach 에서 풀립니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">자동 해제 시점이 probe 에 묶여 있어, probe 밖에서 쓰면 의도와 어긋납니다</text>
<rect x="24" y="168" width="208" height="76" rx="8" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="128.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">probe() 진입</text>
<text x="128.0" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">devres 가 추적을 시작합니다</text>
<path d="M 236 206.0 L 258 206.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="264" y="168" width="208" height="76" rx="8" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="368.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">버퍼 보유</text>
<text x="368.0" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">드라이버가 장치를 다루는 동안</text>
<path d="M 476 206.0 L 498 206.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="504" y="168" width="208" height="76" rx="8" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<text x="608.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">detach · 모듈 제거</text>
<text x="608.0" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">프레임워크가 신호를 받습니다</text>
<path d="M 716 206.0 L 738 206.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="744" y="168" width="208" height="76" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="848.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">자동 해제</text>
<text x="848.0" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">해제 코드를 쓸 일이 없습니다</text>
<text x="248.0" y="156" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">devm_kzalloc()</text>
<text x="728.0" y="156" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">자동</text>
<rect x="264" y="344" width="480" height="76" rx="8" fill="#F0616D12" stroke="#F0616D" stroke-width="1.4"/>
<text x="284" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">probe 밖에서 devm_ 을 쓴 경우</text>
<text x="284" y="398" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">해제 시점이 여전히 detach 라, 필요한 시점에 안 풀립니다</text>
<path d="M 128.0 244 L 128.0 382.0 L 258 382.0" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)" stroke-dasharray="5 5"/>
<rect x="87.5" y="317" width="81.0" height="22" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="128.0" y="333" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">가드 위반</text>
<text x="24" y="468" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">devm_kfree() 로 손수 해제할 수는 있습니다. 다만 그렇게 해야 한다면 애초에 managed API 가 잘못된 선택이라는 신호입니다.</text>
<text x="24" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">managed API 는 GPL 라이선스 모듈에만 export 됩니다. devm_kzalloc() 은 devm_kmalloc() 의 얇은 래퍼입니다.</text>
<line x1="12" y1="528" x2="928" y2="528" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="550" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="539" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="551" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">정상 경로</text>
<rect x="223" y="539" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="245" y="551" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">전이 시점</text>
<rect x="346" y="539" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="368" y="551" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">자동 해제 — 이 절의 논점</text>
<rect x="619" y="539" width="14" height="14" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="641" y="551" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">가드 위반</text>
</svg>
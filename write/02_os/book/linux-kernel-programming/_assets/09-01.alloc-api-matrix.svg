<title id="dt">물리 연속이 필요한가가 가릅니다</title><desc id="dd">세 API 를 같은 여섯 축으로 견준다. 우열이 아니라 용도가 다르다. 물리 연속이 필요하면 kmalloc, 4MB 를 넘는 큰 소프트웨어 버퍼면 vmalloc, 크기가 불확실하면 kvmalloc 이 kmalloc 을 먼저 시도하고 실패 시 vmalloc 으로 폴백한다.</desc>
<rect width="1000" height="672" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 09-01 §6·§7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">물리 연속이 필요한가가 가릅니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">kvmalloc 의 칸은 어느 쪽이 성공했는지에 따라 갈립니다</text>
<rect x="24" y="116" width="208" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="128.0" y="143" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">비교 축</text>
<rect x="248" y="116" width="232" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="364.0" y="143" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">kmalloc()</text>
<rect x="492" y="116" width="232" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="608.0" y="143" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">vmalloc()</text>
<rect x="736" y="116" width="232" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="852.0" y="143" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">kvmalloc()</text>
<rect x="24" y="168" width="208" height="44" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="128.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">물리 연속</text>
<rect x="248" y="168" width="232" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="364.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">보장합니다</text>
<rect x="492" y="168" width="232" height="44" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="608.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">보장하지 않습니다</text>
<rect x="736" y="168" width="232" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="852.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">성공한 쪽에 달림</text>
<rect x="24" y="220" width="208" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="128.0" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">가상 연속</text>
<rect x="248" y="220" width="232" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="364.0" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">보장합니다</text>
<rect x="492" y="220" width="232" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="608.0" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">보장합니다</text>
<rect x="736" y="220" width="232" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="852.0" y="247" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">보장합니다</text>
<rect x="24" y="272" width="208" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="128.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">한 번에 받는 크기</text>
<rect x="248" y="272" width="232" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="364.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">최대 4MB</text>
<rect x="492" y="272" width="232" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="608.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">훨씬 큽니다</text>
<rect x="736" y="272" width="232" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="852.0" y="299" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">4MB 를 넘겨도 받습니다</text>
<rect x="24" y="324" width="208" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="128.0" y="351" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">호출 컨텍스트</text>
<rect x="248" y="324" width="232" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="364.0" y="351" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">atomic 도 됩니다</text>
<rect x="492" y="324" width="232" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="608.0" y="351" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">프로세스만</text>
<rect x="736" y="324" width="232" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="852.0" y="351" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">프로세스만</text>
<rect x="24" y="376" width="208" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="128.0" y="403" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">정렬</text>
<rect x="248" y="376" width="232" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="364.0" y="403" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">cacheline 경계</text>
<rect x="492" y="376" width="232" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="608.0" y="403" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">page 경계</text>
<rect x="736" y="376" width="232" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="852.0" y="403" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">성공한 쪽에 달림</text>
<rect x="24" y="428" width="208" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="128.0" y="455" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">virt_to_phys()</text>
<rect x="248" y="428" width="232" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.1"/>
<text x="364.0" y="455" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">됩니다</text>
<rect x="492" y="428" width="232" height="44" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.1"/>
<text x="608.0" y="455" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">안 됩니다</text>
<rect x="736" y="428" width="232" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.1"/>
<text x="852.0" y="455" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">확인하고 써야 합니다</text>
<text x="24" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">kvmalloc 은 무한 retry 를 하지 않아(__GFP_NORETRY|__GFP_NOWARN) 일반 kmalloc 보다 빠를 때도 있습니다.</text>
<text x="24" y="534" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">vmalloc 메모리도 물리 프레임은 즉시 할당됩니다 — 유저 공간 malloc 의 demand paging 과 다릅니다.</text>
<text x="24" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">주소가 vmalloc region 에서 왔는지는 is_vmalloc_addr() 나 /proc/vmallocinfo 로 확인합니다.</text>
<line x1="12" y1="616" x2="952" y2="616" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="638" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="627" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="639" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">이 축에서 유리</text>
<rect x="268" y="627" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="290" y="639" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">조건이 붙음</text>
<rect x="406" y="627" width="14" height="14" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="428" y="639" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">불가</text>
<rect x="484" y="627" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="506" y="639" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">가르는 축</text>

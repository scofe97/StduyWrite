<title id="dt">위에서부터 물으면 하나가 남습니다</title><desc id="dd">커널 할당 엔진은 결국 페이지 할당자 하나이고 그 위에 slab 이 얹힌다. 고르는 기준은 필요한 양과 타입 둘뿐이다. 위에서부터 차례로 물어 내려가면 쓸 API 가 하나로 좁혀지고, 아무 조건에도 안 걸리면 기본값인 kzalloc 이 답이다.</desc>
<rect width="1000" height="704" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 09-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">위에서부터 물으면 하나가 남습니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">1페이지 미만 일반 할당의 1차 선택은 언제나 slab 입니다</text>
<rect x="248" y="120" width="296" height="52" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="396.0" y="151" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">DMA 에 쓸 메모리인가?</text>
<rect x="608" y="120" width="368" height="52" rx="8" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<text x="624" y="142" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">dma_alloc_coherent()</text>
<text x="624" y="161" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">전용 엔진을 씁니다 — slab·page 직접 금지</text>

<text x="24" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">컨텍스트가 atomic 이면 어느 길로 가든 GFP_ATOMIC 입니다. spinlock 을 쥔 채 GFP_KERNEL 은 금지입니다.</text>
<text x="24" y="612" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">slab 으로 받았으면 ksize() 나 sysfs 의 slab_size 로 실제 크기를 확인합니다.</text>

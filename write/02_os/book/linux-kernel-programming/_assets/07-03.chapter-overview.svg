<text x="480.0" y="265" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#6A95D8">/proc/buddyinfo</text>
<rect x="576" y="116" width="176" height="180" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="592" y="146" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">§4</text>
<text x="736" y="146" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">direct-map</text>
<line x1="592" y1="162" x2="736" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="592" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">모든 RAM 을 커널</text>
<text x="592" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">VAS 에 1:1 로 덮습니다</text>
<rect x="611.67" y="249" width="104.66000000000001" height="22" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="664.0" y="265" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">PAGE_OFFSET</text>
<rect x="760" y="116" width="176" height="180" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="776" y="146" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">§5</text>
<text x="920" y="146" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">sparsemem</text>
<line x1="776" y1="162" x2="920" y2="162" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="776" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">페이지마다 구조체</text>
<text x="776" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">하나로 추적합니다</text>
<rect x="827.91" y="249" width="40.18" height="22" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="848.0" y="265" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#6A95D8">PFN</text>
<path d="M 204 206.0 L 202 206.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 388 206.0 L 386 206.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 572 206.0 L 570 206.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 756 206.0 L 754 206.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="24" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">§1~§3 은 물리 쪽에서 RAM 을 나누고, §4 가 그것을 가상 주소로 덮습니다 — 두 세계가 여기서 만납니다.</text>
<text x="24" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">§5 는 그렇게 덮은 페이지를 커널이 무엇으로 세는지를 다룹니다.</text>
<line x1="12" y1="392" x2="928" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

<title id="dt">물리 RAM 을 커널이 나누는 법</title><desc id="dd">07-03 이 다루는 다섯 절. 커널은 부팅 시 물리 RAM 을 노드·존·페이지 프레임 3단계로 조직하고, 그 전부를 PAGE_OFFSET 부터 커널 VAS 에 1:1 로 덮은 뒤, 페이지마다 struct page 하나로 추적한다.</desc>
<rect width="976" height="448" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 07-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">물리 RAM 을 커널이 나누는 법</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">가상 메모리 3부작의 마지막 — 여기까지가 할당 API 의 토대입니다</text>

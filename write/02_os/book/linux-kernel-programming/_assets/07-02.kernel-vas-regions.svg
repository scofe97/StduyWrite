<text x="308.0" y="401" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">VMALLOC_START</text>
<rect x="416" y="372" width="336" height="48" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>

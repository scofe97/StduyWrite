<title id="dt">커널 VAS 는 역할별 영역으로 나뉩니다</title><desc id="dd">x86_64 4-level 페이징의 커널 VAS 레이아웃. 위가 높은 주소이고, 각 영역의 경계는 커널 매크로로 표현되어 LKM 에서 그대로 읽을 수 있다. RAM 을 1:1 로 direct-map 하는 lowmem 이 이 중 핵심이다.</desc>
<rect width="1000" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LINUX KERNEL PROGRAMMING · 07-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널 VAS 는 역할별 영역으로 나뉩니다</text>
<text x="12" y="76" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">주소·크기는 kernel.org v6.1 x86_64 메모리 맵 문서의 값입니다 — 위치는 arch 마다 다릅니다</text>

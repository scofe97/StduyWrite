<title id="dt">프로그램 파일 하나에서 독립된 프로세스 둘이 뜨는 구조</title><desc id="dd">디스크의 실행 파일은 정적 명세이고, 프로세스는 커널이 PID와 독립된 주소 공간 및 자원을 부여한 동적 실체입니다.</desc>
<rect width="880" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-01 §1</text>

<title id="dt">PID 순차 발급과 300번 랩어라운드 재탐색 순환</title><desc id="dd">커널은 PID를 1씩 올리며 발급하다 pid_max에 닿으면 시스템 프로세스가 많이 쓰는 1~299를 건너뛰고 300부터 빈 번호를 다시 찾습니다.</desc>
<rect width="880" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">PID 순차 발급과 300번 랩어라운드 재탐색 순환</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">PID 번호 공간(0~32768)과 pid_max 도달 시 300으로 되돌아가는 순환 재탐색 메커니즘</text>
<rect x="24" y="114" width="832" height="90" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="32" y="122" width="190" height="74" rx="4" fill="#E3B34112" stroke="#E3B341" stroke-width="1.0"/>
<text x="127.0" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">PID 1 ~ 299</text>
<text x="127.0" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">시스템·데몬이 다수 사용</text>
<text x="127.0" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">init(1) · kthreadd(2)</text>
<rect x="234" y="122" width="100" height="74" rx="4" fill="#F08A5920" stroke="#F08A59" stroke-width="1.4"/>
<text x="284.0" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">PID 300</text>
<text x="284.0" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">리셋 기준점</text>
<text x="284.0" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">재탐색 시작</text>
<rect x="346" y="122" width="360" height="74" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="526.0" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">PID 301 ~ 32,767</text>
<text x="526.0" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">순차 발급 및 빈 번호 탐색 구간</text>
<text x="526.0" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">새 프로세스 생성마다 카운터 1씩 증가</text>
<rect x="718" y="122" width="138" height="74" rx="4" fill="#F0616D15" stroke="#F0616D" stroke-width="1.2"/>
<text x="787.0" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">32,768 (pid_max)</text>
<text x="787.0" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">기본 상한 도달</text>
<text x="787.0" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">랩어라운드 트리거</text>
<path d="M 787.0 196 V 236 H 294.0 Q 284.0 236 284.0 226 V 198" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<rect x="302.5" y="226" width="355.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="480" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">상한 도달 시 300으로 랩어라운드 (1~299 건너뜀)</text>
<path d="M 336 159.0 L 342 159.0" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="24" y="270" width="408" height="104" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="36" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">300번 재탐색의 이유 (TLPI 6.2)</text>
<line x1="36" y1="304" x2="416" y2="304" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1~299번 상태</text>
<text x="130" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">상당수를 시스템 데몬이 상시 사용</text>
<text x="36" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1번부터 탐색 시</text>
<text x="130" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">사용 중인 번호를 훑느라 시간 낭비</text>
<text x="36" y="364" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">300번 재탐색 시</text>
<text x="130" y="364" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">빈 번호를 더 빨리 찾음</text>
<rect x="448" y="270" width="408" height="104" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="460" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">현행 커널 한계값 (proc_sys_kernel(5))</text>
<line x1="460" y1="304" x2="840" y2="304" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="460" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">pid_max 기본값</text>
<text x="564" y="324" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">32,768 (최대 할당 가능 PID: 32,767)</text>
<text x="460" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">32비트 아키텍처</text>
<text x="564" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">pid_max 상한 32,768 고정</text>
<text x="460" y="364" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">64비트 아키텍처</text>
<text x="564" y="364" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">최대 2^22 (4,194,304, PID_MAX_LIMIT)</text>
<line x1="12" y1="396" x2="832" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="418" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="408" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">낮은 번호 (1~299)</text>
<rect x="313" y="408" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="335" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재탐색 시작점 (300)</text>
<rect x="526" y="408" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="548" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">일반 발급 구간</text>
<rect x="674" y="408" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="696" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">상한 도달 (32,768)</text>
</svg>
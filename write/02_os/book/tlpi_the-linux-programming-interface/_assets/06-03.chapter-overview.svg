<title id="dt">인자와 환경은 execve() 가 건네고 자식은 환경의 사본을 받는다</title><desc id="dd">06-03 의 키워드 개념도. 1행은 셸이 쪼갠 명령 줄이 argc 와 argv 로 main() 에 건네지고 argv 가 NULL 로 끝난다는 흐름이다. 2행은 인자와 환경 문자열이 스택 위 한 영역에 놓이고 ARG_MAX 한도를 넘으면 execve() 가 E2BIG 로 실패한다는 흐름이다. 3행은 부모의 환경 목록이 자식 생성 때 한 번 복사되고 이후 수정이 서로 보이지 않는다는 흐름이다. 4행은 environ 을 고치는 putenv() 가 포인터를 그대로 등록해 위험하고 setenv() 는 문자열을 복사해 안전하다는 흐름이다.</desc>
<rect width="880" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인자와 환경은 execve() 가 건네고 자식은 환경의 사본을 받는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

<title id="dt">부모 bash 가 죽으면 worker 는 init 에 입양된다</title><desc id="dd">부모 종료 전에는 init 에서 worker 까지 한 줄이고, 종료 뒤에는 bash 가 사라지며 worker 의 부모가 init 으로 바뀐다.</desc>

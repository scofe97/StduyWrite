<title id="dt">프로세스 가상 메모리 세그먼트 배치</title><desc id="dd">리눅스 x86-32 에서 프로세스가 보는 가상 주소 공간. 위쪽이 높은 주소이고 왼쪽 표지는 경계 주소와 심볼이다.</desc>
<rect width="940" height="544" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로세스 가상 메모리 세그먼트 배치</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">책의 x86-32 기준 배치입니다. 주소는 커널 설정과 링크 옵션에 따라 달라집니다.</text>
<rect x="236" y="104" width="690" height="48" rx="0" fill="#161B22" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="252" y="133.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">커널 (Kernel)</text>
<text x="498" y="133.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">프로세스에 매핑되지만 프로그램은 접근 못 함</text>
<rect x="790.12" y="118.0" width="118.16" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="849.2" y="132.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">/proc/kallsyms</text>

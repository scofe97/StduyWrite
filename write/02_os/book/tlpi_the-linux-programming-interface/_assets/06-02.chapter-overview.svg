<title id="dt">프로세스 메모리는 세그먼트로 나뉘고 페이지로 번역된다</title><desc id="dd">06-02 의 키워드 개념도. 1행은 변수의 선언 위치와 초기화 여부가 다섯 세그먼트 중 자리를 정하고 BSS 는 크기만 파일에 남기는 흐름이다. 2행은 가상 페이지가 프로세스마다 하나인 페이지 테이블을 거쳐 물리 프레임에 이어지는 흐름이다. 3행은 함수 호출마다 스택 프레임이 쌓이고 반환하면 제거되는 흐름이다. 4행은 setjmp 가 저장한 스택 포인터와 프로그램 카운터로 longjmp 가 중간 프레임을 파기하는 흐름이다. 5행은 최적화 컴파일러가 점프를 모르고 레지스터 변수를 옛 값으로 되돌리며 volatile 로 막는 흐름이다.</desc>
<rect width="984" height="672" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 06-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로세스 메모리는 세그먼트로 나뉘고 페이지로 번역된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

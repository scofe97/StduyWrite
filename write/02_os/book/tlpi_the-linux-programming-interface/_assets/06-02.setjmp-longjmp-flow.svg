<title id="dt">setjmp 와 longjmp 의 비로컬 점프 흐름</title><desc id="dd">중첩 함수 호출(main → f1 → f2)에서 longjmp(env, 2)를 통해 중간 프레임을 풀고 setjmp 위치로 직접 복귀하는 시퀀스</desc>
<rect width="940" height="530" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TLPI · 06-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">setjmp 와 longjmp 의 비로컬 점프 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">초기 반환값 0으로 정상 흐름을 타고, longjmp 복귀 시 val(2)을 반환받아 에러 처리 케이스로 분기하는 구조</text>
<rect x="50" y="104" width="180" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="140" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">main()</text>
<text x="140" y="139" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">setjmp(env) 타깃 설정 · switch 분기</text>
<rect x="340" y="104" width="180" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="430" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">f1()</text>
<text x="430" y="139" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">중간 함수 (호출 스택 누적)</text>
<rect x="630" y="104" width="180" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="720" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">f2()</text>
<text x="720" y="139" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">에러 발생 지점 · longjmp(env, 2) 호출</text>
<line x1="140" y1="148" x2="140" y2="464" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 4"/>
<line x1="430" y1="148" x2="430" y2="464" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 4"/>
<line x1="720" y1="148" x2="720" y2="464" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 4"/>
<rect x="134" y="160" width="12" height="290" rx="2" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<rect x="425" y="236" width="10" height="104" rx="2" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<rect x="715" y="282" width="10" height="58" rx="2" fill="#161B22" stroke="#E3B341" stroke-width="1.0"/>
<path d="M 146 162 L 186 162 L 186 182 L 148 182" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="194" y="169" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">setjmp(env) == 0</text>
<text x="194" y="185" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">SP · PC 저장 / 초기 반환값 0</text>
<rect x="199.5" y="192" width="111.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="255" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">case 0 실행</text>
<path d="M 146 238 L 425 238" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="285.0" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="500" fill="#6A95D8">f1(argc) 호출</text>
<text x="285.0" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">스택 프레임 f1 생성</text>
<path d="M 435 284 L 715 284" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="575.0" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="500" fill="#E3B341">f2() 호출</text>
<text x="575.0" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">스택 프레임 f2 생성</text>
<path d="M 725 308 L 765 308 L 765 328 L 727 328" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="772" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">longjmp(env, 2)</text>
<text x="772" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">에러 감지 / 비로컬 점프</text>
<path d="M 715 360 L 146 360" fill="none" stroke="#F0616D" stroke-width="1.8" marker-end="url(#bad)" stroke-dasharray="4 3"/>
<text x="430.0" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">스택 언와인딩 (f2, f1 프레임 일괄 파기)</text>
<text x="430.0" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">SP · PC 를 env 저장 값으로 복원</text>
<rect x="380.0" y="376" width="100.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="430" y="390" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">f1 프레임 파기</text>
<rect x="670.0" y="376" width="100.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="720" y="390" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">f2 프레임 파기</text>
<path d="M 146 402 L 186 402 L 186 422 L 148 422" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="194" y="409" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">setjmp(env) == 2</text>
<text x="194" y="425" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">가짜 반환 / val 값 2 반환</text>
<rect x="160.5" y="432" width="199.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="260" y="446" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">case 2 실행 (에러 복구)</text>
<line x1="12" y1="496" x2="892" y2="496" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="518" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="508" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 호출 (f1·f2)</text>
<rect x="313" y="508" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="335" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">비로컬 점프 (longjmp)</text>
<rect x="565" y="508" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="587" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">setjmp 타깃 / 분기</text>
<rect x="791" y="508" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="813" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스택 언와인딩</text>
</svg>
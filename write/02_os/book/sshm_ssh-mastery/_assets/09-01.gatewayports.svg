<title id="dt">서버의 GatewayPorts 가 요청한 수신 주소를 이기거나 따른다</title><desc id="dd">행은 서버의 GatewayPorts 값 no·yes·clientspecified 이고 열은 ssh -R 에 적은 수신 주소(생략·0.0.0.0·127.0.0.1)입니다. 칸은 서버가 실제로 연 주소입니다. no 는 0.0.0.0 을 요청해도 loopback 에만 열고, yes 는 127.0.0.1 을 요청해도 IPv4 와 IPv6 의 모든 주소에 엽니다. clientspecified 는 요청을 따르므로 0.0.0.0 을 요청하면 IPv4 의 모든 주소에만 열고, 주소를 생략하면 loopback 에 엽니다.</desc>
<rect width="984" height="472" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">MATRIX · 09-01 GATEWAYPORTS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서버의 GatewayPorts 가 요청한 수신 주소를 이기거나 따른다</text>

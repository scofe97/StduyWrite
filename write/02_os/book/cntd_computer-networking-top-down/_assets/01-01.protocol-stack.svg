<title id="dt">다섯 층과 거기까지 닿는 장비</title><desc id="dd">인터넷 프로토콜 스택 다섯 층. 층마다 패킷을 부르는 이름이 다르고, 장비마다 구현하는 층이 다르다. 다섯 층을 다 가진 것은 호스트뿐이다.</desc>

<text x="24" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">회선 교환은 수요와 무관하게 미리 떼어 두고 남는 시간은 버려집니다. 패킷 교환은 보낼 것이 있는 사용자끼리만 링크를 나눠 씁니다</text>

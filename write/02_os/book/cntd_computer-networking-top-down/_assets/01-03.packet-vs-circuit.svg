<title id="dt">같은 링크로 몇 명을 받나</title><desc id="dd">원문의 수치 예. 1 Mbps 링크를 쓰는 사용자가 활성일 때 100 kbps 를 내고 활성 확률이 0.1 일 때, 두 방식이 감당하는 사용자 수. 회선 교환은 수요와 무관하게 미리 떼어 두고, 패킷 교환은 필요할 때만 나눠 준다.</desc>
<rect width="1000" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 01-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 링크로 몇 명을 받나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">패킷 교환 쪽이 성능을 거의 그대로 두면서 세 배 넘는 사용자를 받습니다</text>

<title id="dt">1b 는 두 답을 합쳐 전달 표 한 줄을 만듭니다</title><desc id="dd">1c 는 1b 에게 두 가지를 따로 보낸다. iBGP 로는 밖에서 배운 경로와 NEXT-HOP 주소를, OSPF 로는 AS 안의 링크 상태를 보낸다. 1b 는 NEXT-HOP 주소로 OSPF 가 계산한 길을 찾아 전달 표 항목 (x, I) 를 만든다.</desc>
<rect width="1000" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.4.2 · NEXT-HOP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">1b 는 두 답을 합쳐 전달 표 한 줄을 만듭니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">iBGP 는 '어느 출구로'를, OSPF 는 '그 출구까지 어떻게'를 줍니다. 둘은 NEXT-HOP 주소 하나에서 만납니다.</text>
<rect x="24" y="104" width="600" height="152" rx="10" fill="#F5F5F307" stroke="#8B98A988" stroke-width="1.2"/>
<rect x="760" y="104" width="216" height="152" rx="10" fill="#F5F5F307" stroke="#8B98A988" stroke-width="1.2"/>
<text x="40" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">AS1</text>
<text x="776" y="128" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">AS2</text>
<path d="M 460 176 L 196 176" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)" stroke-dasharray="5 4"/>
<text x="328" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">iBGP · 밖에서 배운 경로</text>
<path d="M 460 204 L 196 204" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)"/>
<text x="328" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">OSPF · AS 안의 링크 상태</text>

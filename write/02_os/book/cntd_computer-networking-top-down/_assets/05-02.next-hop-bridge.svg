<text x="836" y="448" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="20" font-weight="600" fill="#F08A59">(x, I)</text>
<text x="836" y="474" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">x 행 패킷은 인터페이스 I 로</text>
<text x="24" y="584" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">iBGP 와 OSPF 는 같은 1c→1b 사이를 오가지만 나르는 것이 다릅니다. 하나는 밖의 접두어, 하나는 안의 지도입니다.</text>

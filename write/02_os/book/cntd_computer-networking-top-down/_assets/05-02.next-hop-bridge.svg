<text x="328" y="346" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">어느 출구로?</text>
<text x="40" y="374" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">접두어  x</text>
<text x="172" y="374" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">AS-PATH  AS2 AS3</text>
<text x="40" y="402" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">NEXT-HOP</text>
<text x="124" y="402" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">10.0.0.2</text>
<rect x="24" y="448" width="320" height="104" rx="8" fill="#3FB98C0C" stroke="#3FB98C" stroke-width="1.0"/>

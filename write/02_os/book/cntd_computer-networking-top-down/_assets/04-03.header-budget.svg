<title id="dt">헤더 20바이트를 무엇이 차지하나</title><desc id="dd">IPv4 헤더 20바이트를 필드 묶음별 면적으로 나눈 트리맵. 주소 두 개가 8바이트로 40%를 차지하고, 포워딩이 실제로 읽는 것은 목적지 4바이트다.</desc>
<rect width="940" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">IPV4 HEADER · 20 BYTES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">헤더 20바이트를 무엇이 차지하나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">면적 = 바이트 수 · 주소 두 개가 8바이트로 헤더의 40%를 차지합니다</text>
<rect x="40.0" y="100" width="284.0" height="204" rx="2" data-share="20.00" fill="#F08A591E" stroke="#F08A59" stroke-width="1.5"/>
<text x="56.0" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">목적지 주소</text>
<text x="56.0" y="150" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">4 B · 20% · byte 16-19</text>
<text x="56.0" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">포워딩이 읽는 유일한 필드</text>
<rect x="328.0" y="100" width="284.0" height="204" rx="2" data-share="20.00" fill="#F5F5F30E" stroke="#F5F5F34D" stroke-width="1.0"/>
<text x="344.0" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">출발지 주소</text>
<text x="344.0" y="150" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">4 B · 20% · byte 12-15</text>
<text x="344.0" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">출발지가 적고 끝까지 그대로</text>
<rect x="616.0" y="100" width="284.0" height="204" rx="2" data-share="20.00" fill="#F5F5F30E" stroke="#F5F5F34D" stroke-width="1.0"/>
<text x="632.0" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">식별자·플래그·오프셋</text>
<text x="632.0" y="150" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">4 B · 20% · byte 4-7</text>
<text x="632.0" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">단편화용. IPv6 가 버린 자리</text>
<rect x="40.0" y="308" width="212.0" height="136" rx="2" data-share="10.00" fill="#E3B34116" stroke="#E3B341" stroke-width="1.3"/>
<text x="56.0" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">헤더 체크섬</text>
<text x="56.0" y="358" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">2 B · 10% · byte 10-11</text>
<text x="56.0" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TTL 이 바뀌면 다시 계산</text>
<rect x="256.0" y="308" width="212.0" height="136" rx="2" data-share="10.00" fill="#E3B34116" stroke="#E3B341" stroke-width="1.3"/>
<text x="272.0" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">TTL · 프로토콜</text>
<text x="272.0" y="358" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">2 B · 10% · byte 8-9</text>
<text x="272.0" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TTL 만 홉마다 1씩 줄어듭니다</text>
<rect x="472.0" y="308" width="212.0" height="136" rx="2" data-share="10.00" fill="#F5F5F30E" stroke="#F5F5F34D" stroke-width="1.0"/>
<text x="488.0" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">전체 길이</text>
<text x="488.0" y="358" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">2 B · 10% · byte 2-3</text>
<text x="488.0" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최대 65,535바이트</text>
<rect x="688.0" y="308" width="212.0" height="136" rx="2" data-share="10.00" fill="#F5F5F30E" stroke="#F5F5F34D" stroke-width="1.0"/>
<text x="704.0" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">버전·길이·서비스유형</text>
<text x="704.0" y="358" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">2 B · 10% · byte 0-1</text>
<text x="704.0" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실측 덤프의 45 00 이 이 자리</text>
<line x1="12" y1="478" x2="892" y2="478" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="500" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="490" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">포워딩이 읽는 필드</text>
<rect x="274" y="490" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="296" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">홉마다 바뀌는 필드</text>
<rect x="448" y="490" width="14" height="12" rx="2" fill="#F5F5F322" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="470" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">출발지가 적고 그대로 가는 필드</text>
<text x="900" y="500" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">AREA = HEADER BYTES · RFC 791 · 20B, NO OPTIONS</text>
</svg>
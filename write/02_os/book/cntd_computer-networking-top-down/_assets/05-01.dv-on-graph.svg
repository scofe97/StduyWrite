<title id="dt">이웃에게 건넨 벡터가 남의 표를 고칩니다</title><desc id="dd">c(x,y)=2 · c(x,z)=7 · c(y,z)=1 인 세 노드에서 거리 벡터가 오가며 x 와 z 의 추정이 7 에서 3 으로 내려가고, 더 보낼 것이 없어 멈추는 세 컷.</desc>
<rect width="1000" height="850" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.2.2 · DISTANCE VECTOR EXCHANGE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이웃에게 건넨 벡터가 남의 표를 고칩니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표는 건네진 거리 벡터입니다 — 값이 바뀐 노드만 다시 건넵니다</text>
<text x="24" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">라운드 0 — 직통 비용만 압니다</text>
<line x1="24" y1="132" x2="976" y2="132" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="3 6"/>
<rect x="146" y="160" width="88" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="190" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">y</text>
<text x="190" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">D_y = [2,0,1]</text>
<rect x="456" y="160" width="88" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">x</text>
<text x="500" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">D_x = [0,2,7]</text>
<rect x="766" y="160" width="88" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="810" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">z</text>
<text x="810" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">D_z = [7,1,0]</text>
<line x1="234" y1="180" x2="456" y2="180" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="544" y1="180" x2="766" y2="180" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="345" y="172" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">2</text>
<text x="655" y="172" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">7</text>
<line x1="190" y1="200" x2="190" y2="236" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="190" y1="236" x2="810" y2="236" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="810" y1="236" x2="810" y2="200" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="228" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<text x="24" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">x 는 z 까지 직통 7 로 알고 있습니다. y 를 거치면 더 싸다는 것을 아직 모릅니다.</text>
<text x="24" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">라운드 1 — 서로 건네고, 받은 값으로 다시 풉니다</text>
<line x1="24" y1="352" x2="976" y2="352" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="3 6"/>
<rect x="146" y="380" width="88" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="190" y="406" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">y</text>
<text x="190" y="370" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">D_y = [2,0,1]</text>
<rect x="456" y="380" width="88" height="40" rx="7" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="406" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">x</text>
<text x="500" y="370" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">D_x = [0,2,3]</text>
<rect x="766" y="380" width="88" height="40" rx="7" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<text x="810" y="406" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">z</text>
<text x="810" y="370" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">D_z = [3,1,0]</text>
<line x1="234" y1="400" x2="456" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="544" y1="400" x2="766" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="345" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">2</text>
<text x="655" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">7</text>
<line x1="190" y1="420" x2="190" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="190" y1="456" x2="810" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="810" y1="456" x2="810" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="448" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<path d="M 238 386 L 452 386" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<path d="M 452 414 L 238 414" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<path d="M 548 386 L 762 386" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<path d="M 762 414 L 548 414" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="24" y="488" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">x 는 y 가 준 [2,0,1] 을 보고 min{2+1, 7+0} = 3 을 냅니다. z 도 같은 이유로 3 이 됩니다. y 만 그대로입니다.</text>
<text x="24" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">라운드 2 — 바뀐 x·z 만 건넵니다</text>
<line x1="24" y1="572" x2="976" y2="572" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="3 6"/>
<rect x="146" y="600" width="88" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="190" y="626" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">y</text>
<text x="190" y="590" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">D_y = [2,0,1]</text>
<rect x="456" y="600" width="88" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="626" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">x</text>
<text x="500" y="590" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">D_x = [0,2,3]</text>
<rect x="766" y="600" width="88" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="810" y="626" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">z</text>
<text x="810" y="590" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">D_z = [3,1,0]</text>
<line x1="234" y1="620" x2="456" y2="620" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="544" y1="620" x2="766" y2="620" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="345" y="612" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">2</text>
<text x="655" y="612" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">7</text>
<line x1="190" y1="640" x2="190" y2="676" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="190" y1="676" x2="810" y2="676" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="810" y1="676" x2="810" y2="640" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="668" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<path d="M 452 606 L 238 606" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<path d="M 548 606 L 762 606" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<path d="M 762 634 L 548 634" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="24" y="708" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">y 는 보낼 것이 없어 가만히 있습니다. 받은 쪽도 값이 바뀌지 않아 여기서 멈춥니다 — 조용한 상태입니다.</text>
<rect x="660" y="700" width="300" height="30" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="810" y="720" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">조용한 상태(quiescent)</text>
<text x="24" y="752" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">최소를 낸 이웃이 그대로 다음 홉입니다. x 가 z 로 갈 때 다음 홉은 z 가 아니라 y 이고, 식을 푸는 순간 답과 전달 표가 함께 나옵니다.</text>
<line x1="12" y1="786" x2="952" y2="786" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="808" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="798" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="808" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">건네진 거리 벡터</text>
<rect x="261" y="798" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="283" y="808" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">값이 바뀐 노드</text>
<rect x="409" y="798" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="431" y="808" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">멈춘 상태</text>
</svg>
<title id="dt">메모리를 거쳐 — 같은 패킷을 두 번 옮깁니다</title><desc id="dd">원문 4.2.2 의 첫 방식. 초기 라우터는 그냥 컴퓨터였고 입출력 포트가 운영체제의 I/O 장치처럼 동작했다. 패킷마다 메모리 쓰기 한 번과 읽기 한 번이 들고, 둘이 같은 공유 버스를 지나므로 처리량이 B/2 아래로 접힌다.</desc>
<rect width="880" height="452" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 04-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">메모리를 거쳐 — 같은 패킷을 두 번 옮깁니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">패킷 하나가 메모리에 한 번 쓰이고 한 번 읽힙니다. 그 두 걸음이 같은 버스를 지납니다.</text>

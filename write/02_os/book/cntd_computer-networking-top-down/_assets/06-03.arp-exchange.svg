<title id="dt">물을 때는 모두에게, 답할 때는 한 명에게</title><desc id="dd">같은 서브넷 안에서 IP 주소에 대응하는 MAC 주소를 알아내는 절차. 질의는 브로드캐스트 프레임에, 응답은 보통 프레임에 실린다.</desc>
<rect width="940" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 6.4.1 · ADDRESS RESOLUTION PROTOCOL</text>

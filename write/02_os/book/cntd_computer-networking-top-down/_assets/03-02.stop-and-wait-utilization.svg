<title id="dt">30밀리초 중 0.008밀리초만 보냅니다</title><desc id="dd">원문의 대륙 횡단 예. 링크는 1 Gbps 인데 정지 후 대기 때문에 유효 처리량이 267 kbps 로 떨어진다.</desc>
<rect width="1000" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">30밀리초 중 0.008밀리초만 보냅니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로 한 칸이 5 밀리초입니다 — 전송 구간은 실제로는 이보다 훨씬 얇습니다</text>
<line x1="250.0" y1="138" x2="250.0" y2="288" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="250.0" y="130" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">0 ms</text>
<line x1="366.6355638496401" y1="138" x2="366.6355638496401" y2="288" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="366.6355638496401" y="130" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">5 ms</text>
<line x1="483.2711276992802" y1="138" x2="483.2711276992802" y2="288" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="483.2711276992802" y="130" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10 ms</text>
<line x1="599.9066915489202" y1="138" x2="599.9066915489202" y2="288" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="599.9066915489202" y="130" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">15 ms</text>
<line x1="716.5422553985604" y1="138" x2="716.5422553985604" y2="288" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="716.5422553985604" y="130" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">20 ms</text>
<line x1="833.1778192482005" y1="138" x2="833.1778192482005" y2="288" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="833.1778192482005" y="130" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">25 ms</text>
<line x1="949.8133830978405" y1="138" x2="949.8133830978405" y2="288" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="949.8133830978405" y="130" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">30 ms</text>
<line x1="250" y1="138" x2="950" y2="138" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="28" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">보내는 중</text>
<rect x="250.0" y="180" width="10" height="24" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="320.0" y="196" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">0 → 0.008 ms</text>
<text x="28" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">전파 · 수신</text>
<rect x="250.18661690215941" y="220" width="349.90669154892026" height="24" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="1.0"/>
<text x="425.1399626766196" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">패킷이 대륙을 건넘</text>
<text x="28" y="278" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">ACK 가 돌아옴</text>
<rect x="600.0933084510797" y="260" width="349.9066915489203" height="24" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="1.0"/>
<text x="775.0466542255399" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">다음 패킷은 그때까지 못 감</text>
<rect x="20" y="310" width="700" height="96" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="338" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">U = (L/R) / (RTT + L/R) = 0.008 / 30.008 = 0.00027</text>
<text x="40" y="362" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">유효 처리량 = 8,000 비트 / 30.008 ms = 267 kbps</text>
<text x="40" y="386" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">1 Gbps 링크를 깔아 놓고 267 kbps 를 씁니다</text>
<text x="20" y="448" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">해법은 창을 여는 것입니다. 셋을 미리 보내면 이용률이 세 배가 되고, 창이 대역폭·지연 곱만큼 크면 링크를 다 씁니다.</text>
<text x="20" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기서는 30 ms 왕복의 1 Gbps 링크라 3.75 메가바이트가 공중에 떠 있어야 링크가 놀지 않습니다.</text>
<line x1="12" y1="508" x2="952" y2="508" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="530" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="520" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실제로 보내는 구간</text>
<rect x="274" y="520" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="296" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기다리는 구간</text>
<rect x="409" y="520" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="431" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">놀고 있는 구간</text>
</svg>
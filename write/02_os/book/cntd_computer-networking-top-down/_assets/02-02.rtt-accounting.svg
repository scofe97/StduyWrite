<text x="20" y="528" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">객체 하나에 2 RTT 가 드는 것은 연결 수립 1 회와 요청·응답 1 회이기 때문입니다. 객체가 11개인 원문 예에서는 22 RTT 대 3 RTT 가 됩니다</text>

<title id="dt">왕복을 세어 보면</title><desc id="dd">기반 HTML 하나와 이미지 두 장을 받을 때 두 방식이 쓰는 왕복 수. 비지속 연결은 객체마다 연결을 새로 세우고, 지속 연결은 한 번 세운 연결을 계속 쓴다.</desc>

<text x="620" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">2017년 명령</text>
<circle cx="620" cy="280" r="4" fill="#8B98A9"/>
<line x1="900" y1="286" x2="900" y2="324" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="952" y="344" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">상당 부분 복원 · 통신 서비스로 재분류</text>
<text x="952" y="362" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">광대역 = 통신 서비스</text>
<circle cx="900" cy="280" r="4" fill="#8B98A9"/>
<text x="24" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">스케줄링은 순서를 정하는 힘이고, 그 힘을 누가 쥐느냐는 기술이 아니라 정책과 법이 정합니다.</text>
<text x="24" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">원문의 말대로 미국에서도 다른 곳에서도 망 중립성의 마지막 장은 아직 쓰이지 않았습니다.</text>

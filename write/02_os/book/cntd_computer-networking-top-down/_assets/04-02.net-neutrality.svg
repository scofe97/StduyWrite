<text x="940" y="306" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">2025</text>
<line x1="140" y1="286" x2="140" y2="324" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="108" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">ISP 가 경쟁 VoIP 를 막다가 중단</text>

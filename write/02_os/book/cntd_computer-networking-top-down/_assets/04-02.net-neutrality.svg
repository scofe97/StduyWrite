<title id="dt">밝은 선은 그어졌다 지워졌다 다시 그어졌습니다</title><desc id="dd">원문 망 중립성 곁상자의 사건들. 명령 이전의 위반 사례 둘과, 2015년 FCC 명령이 2017년에 뒤집혔다가 2024년에 상당 부분 복원되기까지.</desc>
<rect width="1000" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 04-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">밝은 선은 그어졌다 지워졌다 다시 그어졌습니다</text>

<title id="dt">핸드셰이크가 남기는 것은 마스터 비밀 하나입니다</title><desc id="dd">이 국면이 끝나면 둘만 MS 를 안다. 나머지 열쇠는 전부 거기서 유도된다.</desc>
<rect width="940" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 8.6.1 · THE ALMOST-TLS HANDSHAKE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">핸드셰이크가 남기는 것은 마스터 비밀 하나입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">메시지 순서와 네 열쇠는 원문 Figure 8.24 의 것입니다</text>

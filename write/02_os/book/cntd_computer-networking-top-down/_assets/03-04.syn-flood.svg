<title id="dt">SYN 을 받자마자 잡는 자원이 표적입니다</title><desc id="dd">서버는 SYN 을 받으면 연결 변수와 버퍼를 할당하고 SYNACK 를 보낸 뒤 ACK 를 기다린다. 공격자는 그 세 번째 단계를 완성하지 않는 SYN 을 대량으로 보낸다. 반쯤 열린 연결은 종종 1 분 이상 지나서야 정리되므로 그 사이 연결 자리가 차고, 정상 클라이언트는 서비스를 못 받는다.</desc>

<title id="dt">SYN 의 MSS 를 고치면 알림 없이도 들어맞습니다</title><desc id="dd">문제 도식과 같은 망이고 방화벽은 여전히 ICMP 를 막는다. 송신자가 MSS 1440 을 적은 SYN 을 보내면 터널 입구 라우터가 1420 으로 고쳐 수신자에게 넘긴다. 수신자의 SYN-ACK 도 1440 에서 1420 으로 고쳐 송신자에게 간다. 이후 데이터는 세그먼트 1420 에 헤더 60 을 더한 1480 바이트라 터널에 들어맞고 Packet Too Big 이 생기지 않는다.</desc>
<rect width="1000" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP · MSS CLAMPING · TCPMSS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SYN 의 MSS 를 고치면 알림 없이도 들어맞습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">방화벽은 그대로 ICMP 를 막습니다. 달라진 것은 터널 입구가 SYN 의 MSS 를 고친다는 한 가지입니다</text>

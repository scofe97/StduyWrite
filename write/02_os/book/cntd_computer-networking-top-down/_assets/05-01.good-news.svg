<title id="dt">내려가는 소식은 두 번 만에 끝납니다</title><desc id="dd">c(y,x) 가 4 에서 1 로 내려갔을 때 y 가 알리고 z 가 고쳐 알리면 더 바뀔 것이 없어 멈추는 세 컷. 값이 내려가는 방향에서는 아무도 남의 옛 값에 기대지 않는다.</desc>
<rect width="1000" height="830" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.2.2 · GOOD NEWS TRAVELS FAST</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">내려가는 소식은 두 번 만에 끝납니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표는 이웃에게 보낸 알림입니다 — 두 번 오가고 멈춥니다</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">1. 사고 직전</text>
<line x1="24" y1="122" x2="976" y2="122" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="3 6"/>
<rect x="148" y="150" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="190" y="176" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">y</text>
<rect x="458" y="150" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="176" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">z</text>
<rect x="768" y="150" width="84" height="40" rx="7" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="810" y="176" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">x</text>
<text x="810" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">목적지</text>
<line x1="232" y1="170" x2="458" y2="170" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="542" y1="170" x2="768" y2="170" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="345" y="162" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<text x="655" y="162" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">50</text>
<line x1="190" y1="190" x2="190" y2="228" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="190" y1="228" x2="810" y2="228" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="810" y1="228" x2="810" y2="190" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="220" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">4</text>
<text x="190" y="256" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">D_y(x) = 4</text>
<text x="500" y="256" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">D_z(x) = 5</text>
<text x="24" y="282" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">y 는 직통 4 로 갑니다. z 는 y 를 거쳐 5 입니다.</text>
<text x="24" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">2. c(y,x) 가 1 로 내려갑니다 — y 가 알립니다</text>
<line x1="24" y1="342" x2="976" y2="342" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="3 6"/>
<rect x="148" y="370" width="84" height="40" rx="7" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<text x="190" y="396" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">y</text>
<rect x="458" y="370" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="396" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">z</text>
<rect x="768" y="370" width="84" height="40" rx="7" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="810" y="396" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">x</text>
<text x="810" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">목적지</text>
<line x1="232" y1="390" x2="458" y2="390" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="542" y1="390" x2="768" y2="390" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="345" y="382" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<text x="655" y="382" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">50</text>
<line x1="190" y1="410" x2="190" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="190" y1="448" x2="810" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="810" y1="448" x2="810" y2="410" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="440" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">1</text>
<path d="M 236 377 L 454 377" fill="none" stroke="#F08A59" stroke-width="1.7" marker-end="url(#acc)"/>
<text x="345" y="366" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">D_y(x) = 1</text>
<text x="190" y="476" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">D_y(x) = 1</text>
<text x="500" y="476" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">D_z(x) = 5</text>
<text x="24" y="502" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">y 가 min{1+0, 1+5} = 1 을 내고 값이 바뀌었으므로 z 에게 보냅니다.</text>
<text x="24" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">3. z 가 고쳐 알리면 끝납니다</text>
<line x1="24" y1="562" x2="976" y2="562" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="3 6"/>
<rect x="148" y="590" width="84" height="40" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="190" y="616" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">y</text>
<rect x="458" y="590" width="84" height="40" rx="7" fill="#161B22" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="616" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">z</text>
<rect x="768" y="590" width="84" height="40" rx="7" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="810" y="616" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">x</text>
<text x="810" y="580" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">목적지</text>
<line x1="232" y1="610" x2="458" y2="610" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="542" y1="610" x2="768" y2="610" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="345" y="602" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1</text>
<text x="655" y="602" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">50</text>
<line x1="190" y1="630" x2="190" y2="668" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="190" y1="668" x2="810" y2="668" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="810" y1="668" x2="810" y2="630" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="660" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">1</text>
<path d="M 454 623 L 236 623" fill="none" stroke="#F08A59" stroke-width="1.7" marker-end="url(#acc)"/>
<text x="345" y="640" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">D_z(x) = 2</text>
<text x="190" y="696" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">D_y(x) = 1</text>
<text x="500" y="696" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">D_z(x) = 2</text>
<text x="24" y="722" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">z 는 min{50, 1+1} = 2 로 내리고 y 에게 보냅니다. y 는 받아 봐도 바뀔 것이 없어 아무 말도 하지 않습니다.</text>
<text x="24" y="748" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">값이 내려가는 쪽에서는 아무도 남의 옛 값에 기대지 않습니다. 자기 직통이 싸졌다는 사실만으로 답이 정해지므로 두 번의 반복으로 끝납니다.</text>
<line x1="12" y1="772" x2="952" y2="772" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="794" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="784" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="794" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보낸 알림</text>
<rect x="209" y="784" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="794" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">값이 바뀐 노드</text>
<rect x="357" y="784" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>

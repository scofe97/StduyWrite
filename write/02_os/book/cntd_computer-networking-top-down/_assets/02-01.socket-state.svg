<title id="dt">소켓 안에 무엇이 있나</title><desc id="dd">TCP 서버는 환영 소켓 하나와 연결마다 하나씩의 연결 소켓을 갖고, 연결 소켓이 상대 주소·다음 순번·윈도우·재전송 타이머를 담는다. UDP 소켓은 담는 상태가 없어 하나로 다 받고 상대 주소는 패킷마다 실려 온다.</desc>
<rect width="1000" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 02-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">소켓 안에 무엇이 있나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">상태가 상대마다 다르니 소켓도 상대마다 하나입니다</text>

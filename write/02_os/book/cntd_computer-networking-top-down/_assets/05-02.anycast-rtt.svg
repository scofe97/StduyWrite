<rect x="140" y="236" width="550" height="86" rx="6" fill="#0D1117"/>
<text x="154" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">주소 넷을 이 기계에서 재 봤습니다. 주소마다 세계 곳곳에</text>
<text x="154" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">같은 주소를 쓰는 기계가 여럿 있고, 그중 누가 대답할지는</text>
<text x="154" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">BGP 경로 선택이 정합니다.</text>
<text x="30" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">f 와 l 은 국내 인스턴스가 받아 5 ms 안쪽이고, c 는 국내에 인스턴스가 없어 로스앤젤레스까지 갑니다.</text>
<text x="30" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">애니캐스트의 증거는 이 네 칸의 차이가 아니라, 같은 주소가 며칠 사이 다른 기계로 바뀐다는 쪽입니다.</text>

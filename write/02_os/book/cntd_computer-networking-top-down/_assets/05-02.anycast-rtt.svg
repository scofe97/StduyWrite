<title id="dt">주소는 하나, 대답하는 기계는 여럿입니다</title><desc id="dd">루트 DNS 서버 네 곳에 같은 질의를 보내고 응답한 물리 인스턴스와 왕복 시간을 잰 결과. 주소가 가리키는 곳을 BGP 의 경로 선택이 정한다.</desc>

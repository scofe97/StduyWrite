<title id="dt">이름 해석 도중에 넘어갑니다</title><desc id="dd">원문 Figure 2.20. NetCinema 의 권한 서버가 IP 주소 대신 KingCDN 도메인의 이름을 돌려주면서 요청이 CDN 으로 넘어간다.</desc>

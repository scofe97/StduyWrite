<text x="203.0" y="443" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">IP 주소</text>
<text x="203.0" y="469" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">5단계</text>
<path d="M 118.0 512 L 856.0 512" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="312.0" y="503" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">GET /6Y7B23V</text>
<text x="312.0" y="529" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">6단계 — 직접 TCP 연결</text>
<text x="20" y="600" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">DASH 를 쓰면 서버가 먼저 매니페스트를 보내고, 클라이언트가 그 목록에서 청크를 골라 가져갑니다.</text>
<text x="20" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">CDN 이 이 조회로 알게 되는 것은 클라이언트의 주소가 아니라 LDNS 의 주소입니다 — 이 설계의 근본 약점입니다.</text>

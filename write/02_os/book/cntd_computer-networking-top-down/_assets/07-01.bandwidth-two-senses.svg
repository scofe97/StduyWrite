<title id="dt">22 MHz 라고 적고 2 MHz 를 그렸습니다</title><desc id="dd">무선에서 대역폭은 신호가 차지하는 주파수 폭이다. 원문이 든 예의 두 끝 값은 그 폭과 맞지 않는다.</desc>
<rect width="940" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 7.2.1 · SIGNAL BANDWIDTH</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">22 MHz 라고 적고 2 MHz 를 그렸습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주파수 값은 원문 471쪽 서술과 Figure 7.23 에서 그대로 옮겼습니다</text>
<text x="196" y="153" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원문이 적은 두 끝 값</text>

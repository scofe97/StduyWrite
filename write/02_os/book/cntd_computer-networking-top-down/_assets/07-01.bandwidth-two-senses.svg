<text x="44" y="392" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Hz 로 재는 대역폭과 bps 로 재는 전송률은 다른 말입니다</text>
<text x="44" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">폭이 넓을수록 초당 보낼 수 있는 비트가 늘지만, 둘의 관계는 단순 비례가 아닙니다.</text>
<text x="44" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원문의 예 — 20 MHz 폭 802.11n 채널은 최대 72.2 Mbps, 40 MHz 폭은 최대 150 Mbps.</text>
<line x1="12" y1="482" x2="892" y2="482" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

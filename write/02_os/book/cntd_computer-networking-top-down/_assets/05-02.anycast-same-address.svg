<text x="778.0" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">인천 · 09-11</text>
<text x="24" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">주소는 그대로인데 대답한 기계가 바뀝니다.</text>
<text x="24" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">인스턴스마다 같은 주소를 BGP 로 광고합니다. 라우터는 그 광고들을 한 곳으로 가는 여러 경로로 보고 하나를 고릅니다.</text>

<title id="dt">주소 하나 뒤에 기계가 여럿 있습니다</title><desc id="dd">같은 루트 DNS 주소로 여러 날 물었을 때 대답한 기계. 198.41.0.4 는 도쿄의 세 기계가, 192.5.5.241 은 서울과 인천의 기계가 답했다. 인스턴스마다 같은 주소를 BGP 로 광고하고 경로 위 라우터가 그중 하나로 가는 경로를 고르기 때문이다.</desc>

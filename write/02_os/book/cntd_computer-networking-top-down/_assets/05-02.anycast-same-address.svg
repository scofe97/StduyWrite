<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">주소 하나 뒤에 기계가 여럿 있습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 주소로 물어도 BGP 가 고른 경로에 따라 대답하는 기계가 바뀝니다. 이 기계에서 두 날에 걸쳐 잰 기록입니다.</text>

<title id="dt">회차마다 한 노드씩 확정됩니다</title><desc id="dd">u 를 출발지로 다익스트라를 돌릴 때 회차별로 D(v) 와 전임 p(v) 가 어떻게 바뀌는지 보여 주는 표. 회차마다 확정되지 않은 노드 중 가장 싼 것 하나가 N' 에 들어가고, 그 노드를 거쳐 더 싸지는 이웃만 값을 내린다.</desc>

<text x="24" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">칸의 값은 `D(노드), p(노드)` 입니다 — 지금까지 아는 최소 비용과, 그 경로에서 바로 앞에 오는 전임 노드입니다.</text>
<text x="24" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1 회차에 x 가 확정되자 w 가 5 에서 4 로, y 가 무한대에서 2 로 내려갑니다. x 를 거치는 길이 생겼기 때문입니다.</text>
<text x="24" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">2 회차에는 v 와 y 가 나란히 2 입니다. 동점은 임의로 깨며 원문은 y 를 택합니다.</text>
<text x="24" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">끝나고 남는 것은 노드마다의 전임 하나입니다. 전임을 거슬러 올라가 첫 홉만 뽑으면 그게 u 의 전달 표입니다.</text>

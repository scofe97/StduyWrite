<title id="dt">웹 페이지 하나에 프로토콜 열이 붙습니다</title><desc id="dd">Bob 이 학교 이더넷 스위치에 노트북을 꽂고 구글 첫 페이지를 받기까지. 네 국면마다 쓰는 프로토콜과 그때 얻는 것이 다르다.</desc>
<rect width="1000" height="544" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 6.7 · A DAY IN THE LIFE OF A WEB PAGE REQUEST</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">웹 페이지 하나에 프로토콜 열이 붙습니다</text>

<text x="870.0" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">웹 페이지가</text>
<text x="870.0" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">화면에 뜹니다</text>
<line x1="24" y1="442" x2="952" y2="442" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스위치는 1 국면의 첫 프레임에서 Bob 의 MAC 을 배웁니다. 그래서 DHCP 응답은 브로드캐스트가 아니라 그 포트로만 갑니다.</text>
<text x="24" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원문은 이 예에서도 NAT, 무선 접속, 보안 프로토콜, 웹 캐싱, DNS 계층을 뺐다고 밝힙니다. 빼고도 프로토콜이 이만큼입니다.</text>

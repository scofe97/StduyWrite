<title id="dt">포워딩 테이블을 누가 채우는가</title><desc id="dd">원문 Figure 4.2·4.3. 전통 방식은 라우터마다 라우팅 알고리즘이 돌고, SDN 은 원격 컨트롤러가 테이블을 계산해 내려보낸다. 데이터 평면은 둘이 같다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 04-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">포워딩 테이블을 누가 채우는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">달라지는 것은 제어 평면의 자리뿐입니다</text>

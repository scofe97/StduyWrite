<text x="24" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">데이터 평면은 두 방식이 완전히 같습니다. 달라지는 것은 포워딩 테이블을 누가 계산하느냐뿐입니다.</text>
<text x="24" y="562" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">5장이 이 물음을 이어받습니다 — 라우팅 알고리즘은 05-01, 원격 컨트롤러는 05-03 에서.</text>

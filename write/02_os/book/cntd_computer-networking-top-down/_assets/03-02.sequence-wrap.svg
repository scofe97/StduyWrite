<title id="dt">같은 번호를 단 소포가 둘입니다</title><desc id="dd">1 Gbps 로 4 GiB 를 나르면 32비트 순서 공간이 34.36초에 한 바퀴 돈다. 세그먼트 최대 수명 2분보다 짧으므로 옛 사본이 아직 떠 있는 동안 같은 번호가 재사용된다.</desc>
<rect width="1000" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 번호를 단 소포가 둘입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">받는 쪽은 번호만 보므로 먼저 온 쪽이 이깁니다</text>
<line x1="60" y1="306" x2="940" y2="306" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<rect x="80" y="140" width="180" height="96" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.3"/>
<text x="170" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">세그먼트 A</text>
<text x="170" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">seq 1000</text>
<text x="170" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보냈는데 큐에 붙들립니다</text>
<path d="M 170 240 L 170 296" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="330" y="140" width="280" height="96" rx="6" fill="#8B98A912" stroke="#8B98A9" stroke-width="1.3"/>
<text x="470" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">그 사이 4 GiB 를 나릅니다</text>
<text x="470" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">2³² 바이트</text>
<text x="470" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">번호가 0 으로 돌아옵니다</text>
<path d="M 470 240 L 470 296" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="640" y="140" width="220" height="96" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.3"/>
<text x="750" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">세그먼트 B</text>
<text x="750" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">seq 1000</text>
<text x="750" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한 바퀴 돌아 같은 번호</text>
<path d="M 750 240 L 750 296" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="184" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">t = 0</text>
<line x1="170" y1="301" x2="170" y2="311" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="484" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">t = 34.36 s</text>
<line x1="470" y1="301" x2="470" y2="311" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="764" y="296" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">t = 34.4 s</text>
<line x1="750" y1="301" x2="750" y2="311" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<path d="M 170 306 L 170 330 L 545 330 L 545 346" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)" stroke-dasharray="5 5"/>
<text x="330" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">망이 붙들고 있다가 뒤늦게 뱉어 냅니다</text>
<path d="M 750 306 L 750 346" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="430" y="352" width="230" height="100" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.3"/>
<text x="545.0" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">A 가 먼저 도착합니다</text>
<text x="545.0" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 자리에 옛 내용을 넣습니다</text>
<text x="545.0" y="428" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">옛 내용이 들어갑니다</text>
<rect x="700" y="352" width="230" height="100" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.3"/>
<text x="815.0" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">B 가 나중 도착합니다</text>
<text x="815.0" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이미 1000 을 받았다고 봅니다</text>
<text x="815.0" y="428" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">진짜 새것이 버려집니다</text>
<rect x="24" y="486" width="952" height="94" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="44" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">아무도 오류를 못 느낍니다</text>
<text x="44" y="534" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">체크섬은 A 자신에 대해 계산된 것이라 통과하고 ACK 도 정상으로 나가니 재전송이 일어나지 않습니다. 종단 간 검사도 이것은 못 잡습니다.</text>
<text x="44" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">비트가 뒤집힌 것이 아니라 멀쩡한 세그먼트가 엉뚱한 자리에 들어앉은 것이기 때문입니다. 그래서 번호 밖의 축인 타임스탬프가 필요합니다.</text>
<line x1="12" y1="616" x2="952" y2="616" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="638" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="628" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="638" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">옛 사본</text>
<rect x="196" y="628" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="218" y="638" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">새 세그먼트</text>
<rect x="318" y="628" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="340" y="638" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">조용히 지는 자리</text>
<rect x="479" y="628" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="501" y="638" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">PAWS 가 메우는 곳</text>
</svg>
<title id="dt">다중 접속 프로토콜은 세 갈래로 갈립니다</title><desc id="dd">수십 가지 다중 접속 프로토콜을 채널 분할·랜덤 접속·순번 셋 중 하나로 분류할 수 있다. 갈래마다 이상적 조건 중 무엇을 만족하고 무엇을 못 만족하는지가 다르다.</desc>

<title id="dt">큐가 줄지 않습니다</title><desc id="dd">가정용 라우터의 출력 링크. 하나가 나갈 때마다 ACK 가 하나를 불러들여 큐 길이가 그대로 유지된다.</desc>
<rect width="1000" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 04-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">큐가 줄지 않습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">손실은 한 건도 없는데 지연만 일정하게 남습니다</text>
<line x1="230.0" y1="142" x2="230.0" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="230.0" y="134" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">0 ms</text>
<line x1="350.0" y1="142" x2="350.0" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="350.0" y="134" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">80 ms</text>
<line x1="470.0" y1="142" x2="470.0" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="470.0" y="134" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">160 ms</text>
<line x1="590.0" y1="142" x2="590.0" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="590.0" y="134" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">240 ms</text>
<line x1="710.0" y1="142" x2="710.0" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="710.0" y="134" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">320 ms</text>
<line x1="830.0" y1="142" x2="830.0" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="830.0" y="134" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">400 ms</text>
<line x1="950.0" y1="142" x2="950.0" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="950.0" y="134" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">480 ms</text>
<line x1="230" y1="142" x2="950" y2="142" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="28" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">패킷 1~20 전송</text>
<rect x="230.0" y="184" width="600.0" height="22" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="1.0"/>
<text x="842.0" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">20 ms 씩 스무 개</text>
<text x="28" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">첫 ACK 도착</text>
<rect x="830.0" y="224" width="30.0" height="22" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="818.0" y="240" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">이때 21번째를 전송 중</text>
<text x="28" y="282" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">ACK 가 부른 새 패킷</text>
<rect x="830.0" y="264" width="120.0" height="22" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="818.0" y="280" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">나간 만큼 들어옵니다</text>
<text x="28" y="330" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">큐 길이</text>
<circle cx="230.0" cy="290.0" r="4" fill="#8B98A9"/>
<text x="230.0" y="278.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">25</text>
<circle cx="350.0" cy="296.4" r="4" fill="#8B98A9"/>
<text x="350.0" y="284.4" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">21</text>
<circle cx="470.0" cy="302.8" r="4" fill="#8B98A9"/>
<text x="470.0" y="290.8" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">17</text>
<circle cx="590.0" cy="309.2" r="4" fill="#8B98A9"/>
<text x="590.0" y="297.2" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">13</text>
<circle cx="710.0" cy="315.6" r="4" fill="#8B98A9"/>
<text x="710.0" y="303.6" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">9</text>
<circle cx="830.0" cy="322.0" r="4" fill="#F08A59"/>
<text x="830.0" y="310.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">5</text>
<circle cx="950.0" cy="322.0" r="4" fill="#F08A59"/>
<text x="950.0" y="310.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">5</text>
<text x="890.0" y="344.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">여기서부터 줄지 않습니다</text>
<text x="20" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 상태 큐 = 윈도 − 대역폭·지연 곱. 여기서는 25 − 20 = 5 이고, 그 다섯이 만드는 지연이 사라지지 않습니다.</text>
<text x="20" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">파이프는 꽉 차 있고 손실도 없습니다. 그런데 게이머는 100 ms 를 늘 더 기다립니다 — 이것이 버퍼블로트입니다.</text>
<text x="20" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">원문은 RTT 를 200 ms 라 적는데, 그러면 t=200 에 11번째를 전송 중이고 큐가 15 여야 합니다.</text>
<text x="20" y="488" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">원문 자신의 결론인 '21번째·큐 다섯'과 맞는 값은 400 ms 라, 이 그림은 400 ms 로 그렸습니다.</text>
<line x1="12" y1="544" x2="952" y2="544" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="566" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="556" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ACK 가 불러들인 패킷</text>
<rect x="313" y="556" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="335" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">첫 ACK</text>
<rect x="422" y="556" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="444" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전송 구간</text>
</svg>
<text x="12" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">간선은 열 개이고 그 위의 숫자가 비용입니다. 다익스트라도 벨만-포드도 이 그래프 하나를 입력으로 받습니다.</text>
<text x="12" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">u 에서 z 로 가는 단순 경로는 17 개, 그중 최소는 u-x-y-z 의 4 하나뿐이고 차순위는 7 입니다.</text>

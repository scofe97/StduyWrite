<text x="344" y="139" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">C</text>
<line x1="344" y1="152" x2="344" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="3 6"/>

<title id="dt">듣고 보냈는데도 부딪히는 이유</title><desc id="dd">전파에 시간이 걸리기 때문이다. B 가 이미 보내고 있어도 그 비트가 아직 D 에 닿지 않았으면 D 는 채널을 유휴로 듣는다.</desc>
<rect width="940" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 6.3.2 · WHY CARRIER SENSING STILL COLLIDES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">듣고 보냈는데도 부딪히는 이유</text>

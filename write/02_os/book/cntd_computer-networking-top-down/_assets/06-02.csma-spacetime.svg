<text x="456" y="244.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">D 가 충돌을 압니다</text>
<rect x="208" y="284.0" width="16" height="16" rx="3" fill="#F0616D44" stroke="#F0616D" stroke-width="1.4"/>
<text x="232" y="296.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">B 가 충돌을 압니다</text>
<rect x="32" y="340" width="544" height="48" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="44" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">t1 에 D 가 유휴로 들은 것은 착각이 아닙니다. B 의 비트가</text>
<text x="44" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">그때까지 D 에 도착하지 않았습니다.</text>
<rect x="624" y="116" width="292" height="148" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="640" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">충돌 감지를 더하면</text>
<line x1="640" y1="150" x2="900" y2="150" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="640" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  보내는 동안에도 채널을 계속 듣습니다</text>
<text x="640" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  남의 신호 에너지를 감지하면 중단합니다</text>
<text x="640" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  망가진 프레임을 끝까지 보내지 않습니다</text>
<text x="640" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">·  무작위 시간을 기다린 뒤 다시 시도합니다</text>
<rect x="624" y="280" width="292" height="148" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="640" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">이진 지수 백오프</text>
<line x1="640" y1="314" x2="900" y2="314" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="640" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1 회 충돌 뒤</text>
<text x="900" y="338" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">K in {0,1}</text>
<text x="640" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">2 회 충돌 뒤</text>
<text x="900" y="360" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">K in {0..3}</text>
<text x="640" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">3 회 충돌 뒤</text>
<text x="900" y="382" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">K in {0..7}</text>
<text x="640" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">10 회 이상</text>
<text x="900" y="404" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">K in {0..1023}</text>
<line x1="24" y1="452" x2="892" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전파 지연이 길수록 이미 시작된 전송을 못 듣는 노드가 늘어납니다. 그래서 효율이 전파 지연과 전송 시간의 비로 정해집니다.</text>
<text x="24" y="492" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">효율 = 1 / (1 + 5 · d_prop / d_trans) — 전파 지연이 0 에 가까워지면 효율이 1 에 가까워집니다.</text>
<line x1="12" y1="510" x2="892" y2="510" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="532" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">밀어 넣는 일과 건너가는 일은 따로입니다</title><desc id="dd">8,000량짜리 기차가 터널을 지나는 그림. 밀어 넣는 일은 송신 쪽에서만 일어나고 건너가는 일만 반대편에 닿는다. 첫 량이 반대편으로 나올 때까지가 전파 지연이다. 하나를 줄여도 다른 하나는 그대로다.</desc>
<rect width="1000" height="720" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 01-04 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">밀어 넣는 일과 건너가는 일은 따로입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">입구를 넓히는 일과 터널을 짧게 하는 일은 다른 공사입니다</text>
<rect x="24.0" y="104" width="260" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="154.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">송신 라우터</text>
<text x="154.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">터널 입구</text>
<rect x="692.0" y="104" width="260" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="822.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">수신 라우터</text>
<text x="822.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">터널 출구</text>
<line x1="154.0" y1="154" x2="154.0" y2="470" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="822.0" y1="154" x2="822.0" y2="470" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<text x="24" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">① 밀어 넣기</text>
<text x="24" y="252" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">L/R</text>
<path d="M 164.0 252 L 212.0 252 L 212.0 272 L 167.0 272" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="222.0" y="258" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">첫 비트가 링크로</text>
<text x="222.0" y="275" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">t = 0 — 첫 량이 터널로 들어갑니다</text>
<path d="M 164.0 308 L 212.0 308 L 212.0 328 L 167.0 328" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="222.0" y="314" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">마지막 비트가 링크로</text>
<text x="222.0" y="331" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">t = 0.008 ms — 8,000번째 량이 들어갑니다</text>
<line x1="24" y1="348" x2="976" y2="348" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 6"/>
<text x="24" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">② 건너가기</text>
<text x="24" y="400" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">d/s</text>
<path d="M 164.0 400 L 810.0 400" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="488.0" y="391" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">첫 비트 도착</text>
<text x="488.0" y="417" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">t = 15 ms — 3,000 km 를 건너는 데 걸린 시간</text>
<path d="M 164.0 452 L 810.0 452" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="488.0" y="443" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">마지막 비트 도착</text>
<text x="488.0" y="469" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">t = 15.008 ms — 둘의 합</text>
<rect x="24" y="500" width="952" height="92" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="44" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">만드는 시간이 아닙니다</text>
<text x="44" y="548" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패킷은 이미 만들어져 있습니다. 전송 지연은 그 8,000비트를 링크에 한 줄로 밀어 넣는 데 걸리는 시간이고 `8,000 ÷ 10⁹ = 0.008 ms` 입니다.</text>
<text x="44" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">위아래 간격은 순서일 뿐 시간에 비례하지 않습니다. 두 값이 1,875배 차이라 같은 자로 그리면 ① 이 선 하나로 뭉갭니다.</text>
<rect x="24" y="604" width="470" height="56" rx="6" fill="#F08A5910" stroke="#F08A59" stroke-width="1.2"/>
<text x="44" y="628" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">입구를 넓히면 (R↑)</text>
<text x="44" y="648" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">① 만 짧아집니다. 터널 길이는 그대로입니다.</text>
<rect x="506" y="604" width="470" height="56" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.2"/>
<text x="526" y="628" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">터널을 짧게 하면 (d↓)</text>
<text x="526" y="648" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">② 만 짧아집니다. 입구 넓이는 그대로입니다.</text>
<line x1="12" y1="676" x2="952" y2="676" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="698" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="688" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="698" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">밀어 넣는 구간 — 전송 지연</text>
<rect x="352" y="688" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="374" y="698" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">건너가는 구간 — 전파 지연</text>
</svg>
<title id="dt">자원을 언제 잡느냐가 갈림길입니다</title><desc id="dd">정상 3-way 핸드셰이크는 2단계에서 서버가 버퍼와 변수를 잡는다. SYN 쿠키는 그 시점을 없애고 3단계에서 검산으로 대신한다.</desc>
<rect width="1000" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-04 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">자원을 언제 잡느냐가 갈림길입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">SYN 플러드가 통하는 자리가 정확히 2단계의 자원 할당입니다</text>
<rect x="24.0" y="104" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="124.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="124.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">connect()</text>
<rect x="388.0" y="104" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="488.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서버 — 기본</text>
<text x="488.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">자원을 먼저 잡음</text>
<rect x="752.0" y="104" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="852.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서버 — SYN 쿠키</text>
<text x="852.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">아무것도 안 잡음</text>
<line x1="124.0" y1="154" x2="124.0" y2="500" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="488.0" y1="154" x2="488.0" y2="500" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="852.0" y1="154" x2="852.0" y2="500" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 134.0 182 L 476.0 182" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="266.0" y="173" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">SYN  seq=client_isn</text>
<rect x="409.0" y="210" width="158.0" height="20" rx="4" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="488.0" y="224" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">alloc buffers + vars</text>
<path d="M 478.0 268 L 136.0 268" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="266.0" y="259" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">SYNACK  seq=server_isn  ack=client_isn+1</text>
<path d="M 134.0 322 L 476.0 322" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="266.0" y="313" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">ACK  ack=server_isn+1</text>
<text x="266.0" y="339" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기까지 안 오면 반쯤 열린 연결이 남습니다</text>
<path d="M 134.0 396 L 840.0 396" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="398.0" y="387" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">SYN</text>
<rect x="738.0" y="424" width="228.0" height="20" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="852.0" y="438" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">isn = hash(ips, ports, secret)</text>
<path d="M 842.0 470 L 136.0 470" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="398.0" y="461" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">SYNACK  seq=cookie</text>
<path d="M 134.0 512 L 840.0 512" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="398.0" y="503" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">ACK  ack=cookie+1</text>
<text x="398.0" y="529" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 해시를 다시 계산해 검산한 뒤에야 소켓을 만듭니다</text>
<text x="20" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버가 상태를 기억하는 대신 다시 계산할 수 있게 만든 설계입니다. 들고 있어야 할 정보를 상대에게 들려 보내고 돌아올 때 검산합니다.</text>
<text x="20" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ACK 가 안 오면 원래의 가짜 SYN 은 아무 해도 끼치지 않습니다 — 자원을 할당한 적이 없기 때문입니다.</text>
<line x1="12" y1="616" x2="952" y2="616" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="638" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="628" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="638" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">쿠키를 검산하는 자리</text>
<rect x="287" y="628" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="309" y="638" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공격이 노리는 자리</text>
<rect x="461" y="628" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="483" y="638" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 완료</text>
</svg>
<title id="dt">검산한 뒤에야 자원을 잡습니다</title><desc id="dd">서버는 SYN 을 받아도 반쯤 열린 연결을 만들지 않는다. 출발지·목적지 IP 와 포트 번호, 서버만 아는 비밀 수로 해시를 계산해 초기 순서 번호로 삼고 SYNACK 에 실어 보낸다. 쿠키도 그 밖의 어떤 상태도 기억하지 않는다. ACK 가 오면 같은 해시를 다시 계산해 검산한 뒤에야 연결과 소켓을 만들고, ACK 가 오지 않으면 쓴 자원이 없다.</desc>
<rect width="1000" height="652" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-04 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">검산한 뒤에야 자원을 잡습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">기본 경로가 SYN 을 받자마자 잡던 자원을 여기서는 검산 뒤에 잡습니다</text>
<rect x="24.0" y="100" width="236" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="142.0" y="119" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">공격자</text>
<text x="142.0" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">같은 가짜 SYN</text>
<rect x="370.0" y="100" width="236" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="488.0" y="119" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">서버 — SYN 쿠키</text>
<text x="488.0" y="137" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">SYN 에는 할당 없음</text>
<rect x="716.0" y="100" width="236" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="834.0" y="119" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">정상 클라이언트</text>
<text x="834.0" y="137" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">connect()</text>
<line x1="142.0" y1="150" x2="142.0" y2="552" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="488.0" y1="150" x2="488.0" y2="552" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>

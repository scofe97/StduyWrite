<rect x="362.8" y="253" width="250.4" height="26" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="488.0" y="271" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">반쯤 열린 연결을 안 만듦 · 할당 0</text>
<rect x="310.87" y="283" width="354.26" height="21" fill="#0D1117"/>
<text x="488.0" y="296" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">isn = hash(출발지·목적지 IP·포트, 서버 비밀 수)</text>
<path d="M 478.0 342 L 154.0 342" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="315.0" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">SYNACK · seq = 쿠키</text>
<text x="315.0" y="361" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">쿠키도 그 밖의 어떤 상태도 기억 안 함</text>
<path d="M 152.0 404 L 299.0 404" fill="none" stroke="#3FB98C" stroke-width="1.3" stroke-dasharray="3 7"/>
<path d="M 331.0 404 L 476.0 404" fill="none" stroke="#3FB98C" stroke-width="1.3" stroke-dasharray="3 7"/>
<line x1="306.0" y1="395" x2="324.0" y2="413" stroke="#3FB98C" stroke-width="2.0"/>
<line x1="306.0" y1="413" x2="324.0" y2="395" stroke="#3FB98C" stroke-width="2.0"/>
<text x="315.0" y="382" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">ACK 안 옴 · 쓴 자원 0</text>
<rect x="428.4" y="391" width="119.2" height="26" rx="4" fill="#0D1117"/>
<rect x="428.4" y="391" width="119.2" height="26" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="488.0" y="409" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">아무 해도 없음</text>
<path d="M 824.0 452 L 500.0 452" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="661.0" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">ACK · ack = 쿠키 + 1</text>
<text x="661.0" y="471" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">정상 클라이언트가 보내옴</text>
<rect x="381.8" y="491" width="212.4" height="26" rx="4" fill="#0D1117"/>
<rect x="381.8" y="491" width="212.4" height="26" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="488.0" y="509" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">같은 해시를 다시 계산해 검산</text>
<rect x="345.32" y="521" width="285.36" height="21" fill="#0D1117"/>
<text x="488.0" y="534" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">값이 맞으면 그때 비로소 연결과 소켓 생성</text>
<text x="24" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">앞 도식과 공격 입력은 같음 · 달라진 것은 자원을 잡는 시점 하나</text>

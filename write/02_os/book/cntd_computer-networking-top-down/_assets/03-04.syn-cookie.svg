<title id="dt">자원을 언제 잡느냐 하나가 갈림길입니다</title><desc id="dd">위 컷은 기본 서버다. SYN 마다 연결 변수와 버퍼를 할당하고 SYNACK 를 보낸 뒤 ACK 를 기다리는데, 공격자는 세 번째 단계를 완성하지 않는다. 반쯤 열린 연결이 1 분 이상 남아 연결 자리를 채우고 정상 클라이언트는 서비스를 못 받는다. 아래 컷은 같은 공격 입력을 받는 SYN 쿠키 서버다. SYN 에는 아무것도 할당하지 않고 출발지·목적지 IP 와 포트, 서버만 아는 비밀 수로 해시를 계산해 초기 순서 번호로 실어 보낸다. ACK 가 오면 같은 해시를 다시 계산해 검산한 뒤에야 소켓을 만들고, ACK 가 오지 않으면 쓴 자원이 없다.</desc>
<rect width="1000" height="1172" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-04 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">자원을 언제 잡느냐 하나가 갈림길입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">공격 입력은 두 컷이 같습니다 — 다른 것은 서버가 자원을 잡는 시점 하나입니다</text>
<text x="24" y="100" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">기본 · SYN 을 받자마자 자원을 잡는 경로</text>

<text x="24" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">AS 안에 퍼지는 2·4단계(iBGP)에서는 경로가 그대로라, AS-PATH 의 길이는 라우터 홉이 아니라 AS 홉을 셉니다.</text>

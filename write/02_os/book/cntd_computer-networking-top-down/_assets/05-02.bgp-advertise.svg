<title id="dt">접두어 x 가 AS 셋을 건너는 길</title><desc id="dd">AS3 의 접두어 x 가 AS2 를 거쳐 AS1 의 모든 라우터에게 알려지는 네 단계. 1·3단계는 eBGP 로 경계를 넘으며 보낸 쪽 ASN 이 붙고, 2·4단계는 iBGP 로 AS 안에 퍼지며 경로가 그대로다.</desc>
<rect width="1000" height="548" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.4.2 · ADVERTISING A PREFIX</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">접두어 x 가 AS 셋을 건너는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">광고는 AS 가 아니라 라우터가 보냅니다. 번호 순서대로 따라가면 AS-PATH 가 어디서 길어지는지 보입니다.</text>

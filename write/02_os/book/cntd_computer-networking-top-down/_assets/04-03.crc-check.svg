<title id="dt">나머지를 붙여 보내고 받아서 다시 셉니다</title><desc id="dd">이더넷 프레임 끝에 붙는 4바이트 CRC. 보내는 쪽이 데이터를 정해진 수로 나눈 나머지를 붙여 보내면 받는 쪽이 같은 계산을 다시 해 두 값을 맞춰 본다. 어긋나면 그 홉에서 버려지고 위층까지 가지 않는다.</desc>
<rect width="880" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 04-03 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">나머지를 붙여 보내고 받아서 다시 셉니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">링크를 건너다 깨졌는지 그 홉에서 바로 잡아냅니다</text>
<text x="24" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">보내는 쪽</text>
<rect x="24" y="140" width="168" height="38" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="108" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">1 1 0 1 0 1 1 0</text>
<text x="108" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">보낼 데이터</text>
<path d="M 200 159 L 244 159" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="252" y="140" width="132" height="38" rx="5" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="318" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">정해진 수로 나눔</text>
<path d="M 392 159 L 436 159" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="444" y="140" width="108" height="38" rx="5" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="498" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">나머지 101</text>
<path d="M 560 159 L 604 159" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="612" y="140" width="244" height="38" rx="5" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="734" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">1 1 0 1 0 1 1 0 1 0 1</text>
<text x="734" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">뒤에 붙여 보냄</text>
<rect x="24" y="228" width="404" height="116" rx="6" fill="#3FB98C0A" stroke="#3FB98C" stroke-width="1.2"/>
<text x="44" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">무사히 건넜을 때</text>
<rect x="44" y="264" width="244" height="34" rx="5" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="166" y="286" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">1 1 0 1 0 1 1 0 1 0 1</text>
<text x="44" y="320" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">다시 센 나머지 101</text>
<text x="44" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">붙어 온 값과 같음 → 통과</text>

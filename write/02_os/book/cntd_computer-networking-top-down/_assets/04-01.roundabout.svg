<rect x="24" y="512" width="928" height="66" rx="8" fill="#6A95D80A" stroke="#6A95D8" stroke-width="1.2"/>
<text x="48" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">네 번째 물음은 줄 이야기가 아님</text>
<text x="48" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">차마다 우선순위 · 특정 차 진입 차단 → 무엇을 보고 무엇을 할지 (이 편 §6 일치 후 동작)</text>

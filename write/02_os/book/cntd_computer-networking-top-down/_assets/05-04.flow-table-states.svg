<title id="dt">표를 한 줄 바꿀 때마다 패킷의 운명이 바뀝니다</title><desc id="dd">흐름 표의 여섯 상태와 그때 패킷이 어디서 끝나는지. 왼쪽이 표에 든 줄, 가운데가 경로, 오른쪽이 결과다. 초록은 도착, 빨강은 폐기, 노랑은 세어지기는 하지만 도착하지 않는 것이다.</desc>

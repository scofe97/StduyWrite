<title id="dt">UDP 는 없는 것을 세는 편이 빠릅니다</title><desc id="dd">핸드셰이킹·도착 보장·순서 보장·혼잡 제어 넷을 TCP 와 UDP 로 견주고, 없을 때 무슨 일이 되는지를 적었다.</desc>

<text x="632" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">닿는다는 보장이 없습니다</text>
<rect x="24" y="252" width="196" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="122.0" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">순서 보장</text>
<rect x="232" y="252" width="180" height="40" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="322.0" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">있습니다</text>
<rect x="424" y="252" width="180" height="40" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="514.0" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">없습니다</text>
<rect x="616" y="252" width="360" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="632" y="278" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보낸 순서와 다를 수 있습니다</text>
<rect x="24" y="300" width="196" height="40" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="122.0" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">혼잡 제어</text>
<rect x="232" y="300" width="180" height="40" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="322.0" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">있습니다</text>
<rect x="424" y="300" width="180" height="40" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="514.0" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">없습니다</text>
<rect x="616" y="300" width="360" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="632" y="326" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원하는 속도로 밀어 넣습니다</text>
<line x1="24" y1="364" x2="976" y2="364" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="390" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">혼잡 제어는 통신하는 프로세스가 아니라 인터넷 전체의 복리를 위한 서비스입니다. 그래서 그것을 피하려고 UDP 를 고르는 앱이 생깁니다.</text>
<text x="24" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">네 축 가운데 보안은 TCP 도 UDP 도 주지 않아 TLS 를 애플리케이션 층에 얹습니다.</text>
<text x="24" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">처리량 보장과 타이밍 보장은 둘 다 못 주므로 이 표에 행으로 두지 않았습니다.</text>
<text x="24" y="456" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">다만 밀어 넣는 속도가 곧 종단 처리량은 아닙니다. 중간 링크의 용량과 혼잡이 그보다 낮출 수 있습니다.</text>
<line x1="12" y1="508" x2="952" y2="508" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="530" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

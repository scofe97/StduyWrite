<rect x="424" y="204" width="180" height="40" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="514.0" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">없습니다</text>

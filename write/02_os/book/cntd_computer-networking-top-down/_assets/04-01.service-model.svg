<title id="dt">줄 수 있었던 것과 고른 것</title><desc id="dd">원문 4.1.2. 네트워크 층이 줄 수 있었던 서비스 다섯과 인터넷이 고른 최선 노력을 견준다. 인터넷 열이 전부 비어 있는 것이 이 절의 요점이다.</desc>
<rect width="1000" height="532" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 04-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">줄 수 있었던 것과 고른 것</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가장 적게 약속하는 쪽을 골랐습니다 — ATM 열은 원문이 적은 범위만</text>
<rect x="24" y="108" width="300" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="174.0" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">줄 수 있었던 서비스</text>

<rect x="668" y="348" width="308" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="822.0" y="374" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">원문 언급 없음</text>
<line x1="24" y1="412" x2="976" y2="412" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">원문의 말대로 최선 노력은 서비스가 없다는 말의 완곡어법처럼 보입니다. 하나도 배달하지 않는 망도 이 정의를 만족합니다.</text>
<text x="24" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">그런데도 넉넉한 대역폭과 대역폭 적응형 애플리케이션(DASH)을 더하니 쓸 만했다는 것이 원문의 결론입니다.</text>
<line x1="12" y1="488" x2="952" y2="488" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="510" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

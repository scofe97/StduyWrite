<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 576" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">손실은 두 가지 이유로 납니다</title><desc id="dd">라우터 큐가 넘쳐 멀쩡한 패킷이 버려지는 혼잡 손실과, 비트가 깨져 검사에서 버려지는 오류 손실. 둘 다 보내는 쪽에는 ACK 가 안 온다는 한 증상으로만 보이고, 헤더 어디에도 이유가 적히지 않는다.</desc>
<rect width="1000" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-05 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">손실은 두 가지 이유로 납니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 원인이 한 증상으로 모이고, 그 증상에는 원인이 안 적혀 있습니다</text>
<path d="M 170 300 L 777 300" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="460" y1="300" x2="364" y2="132" stroke="#8B98A9" stroke-width="1.2"/>
<line x1="428" y1="244" x2="396" y2="244" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="392" y="240" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">라우터 큐가 꽉 참</text>
<line x1="412" y1="216" x2="380" y2="216" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="376" y="212" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">멀쩡한 패킷을 버림</text>
<line x1="396" y1="188" x2="364" y2="188" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="360" y="184" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">유선 코어에서 대부분</text>
<line x1="300" y1="300" x2="204" y2="468" stroke="#8B98A9" stroke-width="1.2"/>
<line x1="268" y1="356" x2="236" y2="356" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="232" y="368" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">전파·잡음으로 비트가 깨짐</text>
<line x1="252" y1="384" x2="220" y2="384" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="216" y="396" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">체크섬·CRC 불일치로 버림</text>
<line x1="236" y1="412" x2="204" y2="412" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="200" y="424" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">무선 링크에서 흔함</text>
<rect x="304" y="98" width="120" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="364" y="119" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">혼잡 손실</text>
<rect x="144" y="470" width="120" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="204" y="491" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">오류 손실</text>
<rect x="780" y="264" width="200" height="76" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.2"/>
<text x="880" y="286" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">보내는 쪽에 보이는 것</text>
<text x="880" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">ACK 가 안 온다</text>
<text x="880" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">타임아웃 · 중복 ACK 셋</text>
<text x="980" y="364" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">받는 쪽도 순서 번호의 구멍만 봅니다</text>
<text x="980" y="384" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">깨진 세그먼트는 검사에서 버려져 도착 자체가 없던 일이 됩니다</text>
<line x1="12" y1="524" x2="952" y2="524" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="546" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="536" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="122" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">두 원인 — 헤더에 적히지 않음</text>
<rect x="365" y="536" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="387" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보내는 쪽이 보는 하나의 증상</text>
</svg>
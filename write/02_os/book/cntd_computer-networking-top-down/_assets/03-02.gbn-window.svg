<title id="dt">순서 번호 공간의 네 구간</title><desc id="dd">Go-Back-N 송신자가 보는 번호 공간. 가운데 두 열을 합한 크기가 창 N 이고, 창은 ACK 가 올 때마다 오른쪽으로 미끄러진다.</desc>
<rect width="1000" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">순서 번호 공간의 네 구간</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">base = 2 · N = 4 인 순간의 현황입니다</text>
<rect x="30" y="152" width="216" height="300" rx="4" fill="#F5F5F305"/>
<text x="44" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">확인까지 받음</text>
<text x="44" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">[0, base-1]</text>
<line x1="30" y1="210" x2="246" y2="210" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="46" y="226" width="184" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="60" y="250" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">pkt 0</text>
<rect x="46" y="288" width="184" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="60" y="312" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">pkt 1</text>
<rect x="266" y="152" width="216" height="300" rx="4" fill="#F5F5F305"/>
<text x="280" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">보냈지만 미확인</text>
<rect x="430" y="164" width="38" height="18" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1"/>
<text x="449" y="177" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#F08A59">3/4</text>
<text x="280" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">[base, next-1]</text>
<line x1="266" y1="210" x2="482" y2="210" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="282" y="226" width="184" height="52" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="296" y="250" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">pkt 2</text>
<text x="296" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">타임아웃이면 재전송</text>
<rect x="282" y="288" width="184" height="52" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="296" y="312" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">pkt 3</text>
<text x="296" y="330" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">타임아웃이면 재전송</text>
<rect x="282" y="350" width="184" height="52" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="296" y="374" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">pkt 4</text>
<text x="296" y="392" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">타임아웃이면 재전송</text>
<rect x="502" y="152" width="216" height="300" rx="4" fill="#F5F5F305"/>
<text x="516" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">바로 보낼 수 있음</text>
<rect x="666" y="164" width="38" height="18" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1"/>
<text x="685" y="177" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#6A95D8">1/4</text>
<text x="516" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">[next, base+N-1]</text>
<line x1="502" y1="210" x2="718" y2="210" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="518" y="226" width="184" height="52" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="532" y="250" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">pkt 5</text>
<rect x="738" y="152" width="216" height="300" rx="4" fill="#F5F5F305"/>
<text x="752" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">아직 못 씀</text>
<text x="752" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">base+N 이상</text>
<line x1="738" y1="210" x2="954" y2="210" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="754" y="226" width="184" height="52" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="768" y="250" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">pkt 6</text>
<rect x="754" y="288" width="184" height="52" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="768" y="312" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">pkt 7 …</text>
<text x="28" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">창 = 가운데 두 열 = N. 타임아웃이 나면 두 번째 열 전체를 다시 보냅니다 — 이름이 Go-Back-N 인 이유입니다.</text>
<text x="28" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ACK n 은 누적입니다. n 이하가 전부 도착했다는 뜻이라, ACK 하나가 오면 창이 그만큼 통째로 미끄러집니다.</text>
<text x="28" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">창을 N 으로 제한하는 이유는 둘입니다 — 받는 쪽의 버퍼(흐름 제어)와 망의 혼잡(혼잡 제어)입니다.</text>
<line x1="12" y1="556" x2="952" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="568" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">타임아웃 시 전부 재전송</text>
<rect x="313" y="568" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="335" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">확인 완료</text>
<rect x="422" y="568" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="444" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보낼 수 있음</text>
<rect x="557" y="568" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="579" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">잠김</text>
</svg>
<title id="dt">같은 안테나로 확실하게 보낼지, 많이 보낼지</title><desc id="dd">안테나를 여럿 두면 이득이 두 갈래로 갈린다. 같은 정보를 여러 길로 보내거나, 다른 정보를 길마다 나눠 보낸다.</desc>
<rect width="940" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 7.2.1 · MIMO</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 안테나로 확실하게 보낼지, 많이 보낼지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">신호 표기와 두 방식의 이름은 원문 Figure 7.9 의 것입니다</text>
<text x="112.0" y="106" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">보내는 것</text>
<text x="336.0" y="106" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">공중에서 벌어지는 일</text>
<text x="560.0" y="106" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">수신기가 하는 일</text>
<text x="800.0" y="106" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">얻는 것</text>
<rect x="24" y="128" width="176" height="152" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="248" y="128" width="176" height="152" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="472" y="128" width="176" height="152" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="696" y="128" width="208" height="152" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="696" y="128" width="208" height="152" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="40" y="154" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">공간 다이버시티</text>
<text x="40" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">안테나 하나로</text>
<text x="40" y="204" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정보 x 를 한 번</text>
<line x1="288" y1="204.0" x2="384" y2="176.0" stroke="#6A95D8" stroke-width="1.2"/>
<line x1="288" y1="204.0" x2="384" y2="232.0" stroke="#6A95D8" stroke-width="1.2"/>
<circle cx="288" cy="204.0" r="5" fill="#6A95D8"/>
<circle cx="384" cy="176.0" r="5" fill="#6A95D8"/>
<circle cx="384" cy="232.0" r="5" fill="#6A95D8"/>
<text x="288" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">송신</text>
<text x="384" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">수신</text>
<text x="336" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">H 가 진폭과 위상을 바꿉니다</text>
<text x="488" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">위상을 맞춰 더하거나</text>
<text x="488" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SNR 이 큰 쪽을 고릅니다</text>
<text x="712" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 x 를 더 확실하게.</text>
<text x="712" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">다중경로 페이딩에 강해집니다.</text>
<text x="712" y="220" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">속도는 그대로입니다.</text>
<rect x="24" y="300" width="176" height="152" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="248" y="300" width="176" height="152" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="472" y="300" width="176" height="152" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="696" y="300" width="208" height="152" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="696" y="300" width="208" height="152" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="40" y="326" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">공간 다중화</text>
<text x="40" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">안테나 둘로</text>
<text x="40" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">다른 정보 x₁·x₂ 를 함께</text>
<line x1="288" y1="348.0" x2="384" y2="348.0" stroke="#3FB98C" stroke-width="1.2"/>
<line x1="288" y1="348.0" x2="384" y2="404.0" stroke="#3FB98C" stroke-width="1.2"/>
<line x1="288" y1="404.0" x2="384" y2="348.0" stroke="#3FB98C" stroke-width="1.2"/>
<line x1="288" y1="404.0" x2="384" y2="404.0" stroke="#3FB98C" stroke-width="1.2"/>
<circle cx="288" cy="348.0" r="5" fill="#3FB98C"/>
<circle cx="288" cy="404.0" r="5" fill="#3FB98C"/>
<circle cx="384" cy="348.0" r="5" fill="#3FB98C"/>
<circle cx="384" cy="404.0" r="5" fill="#3FB98C"/>
<text x="288" y="440" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">송신</text>
<text x="384" y="440" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">수신</text>
<text x="336" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">H 가 진폭과 위상을 바꿉니다</text>
<text x="488" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">식 둘 · 미지수 둘을</text>
<text x="488" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">풀어 x₁ 과 x₂ 를 분리</text>
<text x="712" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">한 번에 두 줄기가 흐릅니다.</text>
<text x="712" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">링크 속도 자체가 늘어납니다.</text>
<text x="712" y="392" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">경로가 서로 달라야 풉니다.</text>
<path d="M 208 204.0 L 240 204.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 432 204.0 L 464 204.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 656 204.0 L 688 204.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 208 376.0 L 240 376.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 432 376.0 L 464 376.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 656 376.0 L 688 376.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="24" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수신 안테나를 N 개 두면 받는 총 전력이 대략 N 배가 되는 이득은 두 방식에 공통입니다.</text>
<line x1="12" y1="510" x2="892" y2="510" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="532" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="522" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공간 다이버시티</text>
<rect x="248" y="522" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="270" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공간 다중화</text>
<rect x="370" y="522" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="392" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">속도가 늘어나는 쪽</text>
</svg>
<text x="40" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">조직 1 의 주소는 ISP 블록 안에 있지만 다른 ISP 가 더 구체적인 /23 으로 광고합니다. 바깥 라우터는 최장 접두어 일치로 그쪽을 고릅니다.</text>

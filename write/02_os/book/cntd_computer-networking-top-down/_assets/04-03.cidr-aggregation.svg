<title id="dt">여덟 줄이 한 줄로, 예외 하나만 따로</title><desc id="dd">ISP 가 받은 /20 블록이 여덟 조직의 /23 으로 갈라졌다가 바깥 세상에는 두 개의 접두어로만 광고되는 흐름. 리본 두께는 주소 개수에 비례한다.</desc>

<title id="dt">프리픽스가 바뀌면 예약된 두 자리도 옮겨 갑니다</title><desc id="dd">같은 주소 172.16.0.255 와 172.16.1.0 을 /24 와 /23 두 기준으로 나란히 판정한 그림. /24 에서는 브로드캐스트와 네트워크 주소라 못 쓰는 자리인데, /23 에서는 호스트 비트가 전부 0 도 전부 1 도 아니라 평범한 호스트 주소가 된다. 예약 여부를 옥텟 값으로 외우면 프리픽스가 달라질 때 틀린다.</desc>
<rect width="940" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">RFC 1812 · PREFIX BOUNDARY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프리픽스가 바뀌면 예약된 두 자리도 옮겨 갑니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">예약 기준은 옥텟 값이 아니라 호스트 비트가 전부 0 이냐 전부 1 이냐입니다</text>
<rect x="40" y="104" width="420" height="250" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="58" y="132" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">172.16.0.0/24</text>
<text x="442" y="132" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">255.255.255.0</text>
<text x="58" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트 자리 8비트 — 네 번째 옥텟만</text>
<line x1="56" y1="164" x2="444" y2="164" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="58" y="176" width="384" height="34" rx="5" fill="#0D1117" stroke="#F0616D55" stroke-width="1.3"/>
<text x="70" y="191" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">172.16.0.0</text>
<text x="70" y="205" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#5E6B7E">호스트 = 00000000</text>
<text x="430" y="198" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#F0616D">네트워크 주소</text>
<rect x="58" y="216" width="384" height="34" rx="5" fill="#0D1117" stroke="#8B98A955" stroke-width="0.9"/>
<text x="70" y="231" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">172.16.0.1</text>
<text x="70" y="245" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#5E6B7E">호스트 = 00000001</text>
<text x="430" y="238" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">첫 호스트</text>
<rect x="58" y="256" width="384" height="34" rx="5" fill="#0D1117" stroke="#F0616D55" stroke-width="1.3"/>
<text x="70" y="271" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">172.16.0.255</text>
<text x="70" y="285" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#5E6B7E">호스트 = 11111111</text>
<text x="430" y="278" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#F0616D">브로드캐스트</text>
<rect x="58" y="296" width="384" height="34" rx="5" fill="#0D1117" stroke="#8B98A955" stroke-width="0.9"/>
<text x="70" y="311" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">172.16.1.0</text>
<text x="70" y="325" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#5E6B7E">다른 서브넷</text>
<text x="430" y="318" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">경계 밖</text>
<text x="58" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">호스트 254개 · 2^8 − 2</text>
<rect x="490" y="104" width="420" height="250" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="508" y="132" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">172.16.0.0/23</text>
<text x="892" y="132" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">255.255.254.0</text>
<text x="508" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트 자리 9비트 — 세 번째 옥텟 1비트 + 네 번째 8비트</text>
<line x1="506" y1="164" x2="894" y2="164" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="508" y="176" width="384" height="34" rx="5" fill="#0D1117" stroke="#F0616D55" stroke-width="1.3"/>
<text x="520" y="191" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">172.16.0.0</text>
<text x="520" y="205" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#5E6B7E">호스트 = 0 00000000</text>
<text x="880" y="198" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#F0616D">네트워크 주소</text>
<rect x="508" y="216" width="384" height="34" rx="5" fill="#0D1117" stroke="#3FB98C55" stroke-width="1.3"/>
<text x="520" y="231" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">172.16.0.255</text>
<text x="520" y="245" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#5E6B7E">호스트 = 0 11111111</text>
<text x="880" y="238" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#3FB98C">평범한 호스트</text>
<rect x="508" y="256" width="384" height="34" rx="5" fill="#0D1117" stroke="#3FB98C55" stroke-width="1.3"/>
<text x="520" y="271" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">172.16.1.0</text>
<text x="520" y="285" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#5E6B7E">호스트 = 1 00000000</text>
<text x="880" y="278" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#3FB98C">평범한 호스트</text>
<rect x="508" y="296" width="384" height="34" rx="5" fill="#0D1117" stroke="#F0616D55" stroke-width="1.3"/>
<text x="520" y="311" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">172.16.1.255</text>
<text x="520" y="325" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#5E6B7E">호스트 = 1 11111111</text>
<text x="880" y="318" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#F0616D">브로드캐스트</text>
<text x="508" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">호스트 510개 · 2^9 − 2</text>
<rect x="40" y="380" width="870" height="84" rx="8" fill="#F08A5910" stroke="#F08A59" stroke-width="1.2"/>
<text x="58" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">같은 주소, 뒤집힌 판정</text>
<text x="58" y="426" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">172.16.0.255 — /24 에서는 브로드캐스트라 못 쓰고, /23 에서는 호스트 비트에 0 이 섞여 있어 쓸 수 있습니다.</text>
<text x="58" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">172.16.1.0 — /24 에서는 아예 다른 서브넷이고, /23 에서는 같은 서브넷 안의 호스트입니다.</text>
<text x="40" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">확인 — ifconfig 의 broadcast 필드가 계산 결과를 직접 알려 줍니다</text>
<rect x="40" y="490" width="870" height="30" rx="5" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="56" y="509" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">$ ifconfig en0 | grep 'inet '     →     inet 172.16.1.240  netmask 0xfffffe00  broadcast 172.16.1.255</text>
<line x1="12" y1="532" x2="892" y2="532" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="554" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="544" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">RFC 1812 가 금지하는 자리</text>
<rect x="378" y="544" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="400" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">붙일 수 있는 호스트 주소</text>
<rect x="604" y="544" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="626" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">판정이 뒤집히는 주소</text>
<text x="900" y="554" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">EN0 MEASURED 2026-09-18</text>
</svg>
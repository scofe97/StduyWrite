<title id="dt">수신 버퍼는 메모리이고 Window 칸은 숫자입니다</title><desc id="dd">커널의 수신 버퍼에서 안 읽은 바이트를 뺀 여유가 rwnd 이고, 그 숫자가 16비트 Window 칸에 실린다. 윈도우 스케일은 칸을 늘리지 않고 눈금 하나의 뜻을 바꾼다.</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-04 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">수신 버퍼는 메모리이고 Window 칸은 숫자입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칸은 그대로인데 읽는 법이 달라집니다</text>
<line x1="200.0" y1="112" x2="200.0" y2="296" stroke="rgba(245,245,245,0.08)" stroke-width="0.8"/>
<line x1="390.0" y1="112" x2="390.0" y2="296" stroke="rgba(245,245,245,0.08)" stroke-width="0.8"/>

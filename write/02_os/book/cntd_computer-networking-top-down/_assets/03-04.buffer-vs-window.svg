<line x1="200" y1="296" x2="960" y2="296" stroke="rgba(245,245,245,0.20)" stroke-width="1.0"/>
<text x="188" y="148" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">수신 버퍼</text>
<text x="188" y="166" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">실제 메모리 · RcvBuffer</text>
<rect x="200.0" y="128" width="475.0" height="48" rx="4" fill="#0D1117" stroke="none" stroke-width="0"/>
<rect x="200.0" y="128" width="475.0" height="48" rx="4" fill="#8B98A926" stroke="#8B98A9" stroke-width="1.0"/>
<rect x="675.0" y="128" width="285.0" height="48" rx="4" fill="#0D1117" stroke="none" stroke-width="0"/>
<rect x="675.0" y="128" width="285.0" height="48" rx="4" fill="#6A95D826" stroke="#6A95D8" stroke-width="1.0"/>
<text x="437.5" y="157" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">안 읽은 데이터 · 40,960</text>
<text x="817.5" y="157" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">여유 = rwnd · 24,576</text>
<text x="960" y="118" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">합계 65,536</text>
<text x="188" y="236" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Window 칸</text>
<text x="188" y="254" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">TCP 헤더의 16비트 숫자</text>
<rect x="200.0" y="216" width="285.0" height="48" rx="4" fill="#0D1117" stroke="none" stroke-width="0"/>
<rect x="200.0" y="216" width="285.0" height="48" rx="4" fill="#F08A5920" stroke="#F08A59" stroke-width="1.0"/>
<text x="342.5" y="245" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">24,576</text>
<text x="497.0" y="245" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여유를 그대로 적은 숫자 · 최대 65,535</text>
<text x="188" y="324" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">×1 로 읽으면</text>
<text x="200.0" y="324" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">0</text>
<text x="390.0" y="324" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">16 KiB</text>
<text x="580.0" y="324" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">32 KiB</text>
<text x="770.0" y="324" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">48 KiB</text>
<text x="960.0" y="324" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">64 KiB</text>
<text x="188" y="352" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">×128 로 읽으면</text>
<text x="200.0" y="352" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">0</text>
<text x="390.0" y="352" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">2 MiB</text>
<text x="580.0" y="352" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">4 MiB</text>
<text x="770.0" y="352" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">6 MiB</text>
<text x="960.0" y="352" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">8 MiB</text>
<text x="24" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">배수 shift.cnt 는 SYN 에서 한 번 교환하고 그 뒤로는 양쪽이 기억해 곱합니다. 7 이면 ×128 이고, 칸은 16비트 그대로입니다.</text>
<text x="24" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">×128 로 읽으면 눈금 하나가 128 바이트라, 창은 128 바이트 단위로만 표현됩니다.</text>
<line x1="12" y1="516" x2="952" y2="516" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="528" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="122" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">안 읽은 데이터</text>
<rect x="248" y="528" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="270" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여유 = rwnd</text>
<rect x="409" y="528" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="431" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">칸에 적히는 숫자</text>

<title id="dt">무엇을 보고 무엇을 하나</title><desc id="dd">원문이 절을 닫으며 나열한 장치 넷. 목적지 주소를 조회해 출력 포트로 보내는 라우터의 일은 이 일반적 추상의 특수한 경우다.</desc>
<rect width="1000" height="508" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 04-01 §6</text>

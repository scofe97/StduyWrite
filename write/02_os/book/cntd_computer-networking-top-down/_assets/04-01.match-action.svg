<line x1="24" y1="412" x2="976" y2="412" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">전통적 포워딩은 목적지 주소 하나만 봅니다. 일반화 포워딩은 여러 필드를 보는데, 틀은 그대로라 같은 하드웨어 위에 더 많은 정책이 얹힙니다.</text>
<line x1="12" y1="464" x2="952" y2="464" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

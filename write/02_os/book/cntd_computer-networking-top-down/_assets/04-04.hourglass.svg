<title id="dt">허리가 하나라서 자랐습니다</title><desc id="dd">인터넷 프로토콜 스택의 모래시계 그림. 위아래로는 프로토콜이 많고 네트워크 계층에는 IP 하나뿐이며, 그 좁은 허리가 서로 다른 망을 하나로 묶었다.</desc>
<rect width="960" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">THE IP HOURGLASS · RFC 1958</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">허리가 하나라서 자랐습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">목표는 연결성, 도구는 인터넷 프로토콜, 지능은 종단에 — RFC 1958</text>
<path d="M 150 118 L 810 118 L 560 292 L 400 292 Z" fill="#F5F5F30C" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<path d="M 400 340 L 560 340 L 810 508 L 150 508 Z" fill="#F5F5F30C" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<rect x="400" y="292" width="160" height="48" rx="4" fill="#F08A591E" stroke="#F08A59" stroke-width="1.6"/>
<text x="480" y="322" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F08A59">IP</text>
<text x="480" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">애플리케이션 계층</text>
<text x="480" y="172" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">HTTP · SMTP · IMAP · DNS · DASH · BitTorrent · ...</text>
<text x="480" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">트랜스포트 계층</text>
<text x="480" y="236" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">TCP · UDP · QUIC</text>
<text x="480" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">네트워크 계층은 하나뿐입니다</text>
<text x="480" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">링크 계층</text>
<text x="480" y="404" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">Ethernet · WiFi · Cellular · PPP · ...</text>
<text x="480" y="446" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">물리 계층</text>
<text x="480" y="466" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">동축 · 꼬임쌍선 · 광 · 무선</text>
<text x="130" y="168" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">프로토콜이 많습니다</text>
<text x="130" y="424" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">프로토콜이 많습니다</text>
<path d="M 834 316 L 572 316" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<text x="842" y="306" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">미들박스가 이 허리를</text>
<text x="842" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">조금씩 굵게 합니다</text>
<text x="60" y="534" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IP 만 맞추면 되니 이더넷부터 와이파이·셀룰러·광 전송까지 성질이 다른 망이 모두 인터넷의 일부가 됐습니다. Clark 은 이 허리를 걸침 계층이라 부릅니다.</text>
<line x1="12" y1="552" x2="912" y2="552" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="574" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="564" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">모두가 구현해야 하는 하나</text>
</svg>
<title id="dt">패킷 교환에서 TCP/IP 전환까지</title><desc id="dd">원문 1.7 이 적는 사건들. 전화망이 지배하던 시절에 버스트 트래픽을 위해 다른 답을 낸 사람들이 있었고, 그 답이 25년 만에 표준이 됐다.</desc>
<rect width="992" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 01-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">패킷 교환에서 TCP/IP 전환까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칸 사이 간격은 실제 연도 비율입니다 — 1970년대에 몰려 있습니다</text>
<line x1="56" y1="268" x2="936" y2="268" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<line x1="56.0" y1="258" x2="56.0" y2="224" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="56.0" cy="268" r="5" fill="#6A95D8"/>
<rect x="12" y="152" width="176" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="100.0" y="173" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">Kleinrock</text>
<text x="100.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">큐잉 이론으로 패킷 교환이</text>
<text x="100.0" y="209" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">버스트 트래픽에 낫다는 것을 보임</text>
<text x="56.0" y="290" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">1961</text>
<line x1="161.6" y1="268" x2="161.6" y2="312" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="161.6" cy="268" r="5" fill="#6A95D8"/>
<rect x="73.6" y="312" width="176" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="161.6" y="333" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">Baran · Davies</text>
<text x="161.6" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Rand 와 영국 NPL 이</text>
<text x="161.6" y="369" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서로 모른 채 같은 답에 도달</text>
<text x="161.6" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">1964</text>
<line x1="337.6" y1="258" x2="337.6" y2="224" stroke="#8B98A9" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="337.6" cy="268" r="5" fill="#8B98A9"/>
<rect x="249.60000000000002" y="152" width="176" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="337.6" y="173" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">첫 패킷 스위치</text>
<text x="337.6" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노동절 UCLA 설치 · 연말 네 노드</text>
<text x="337.6" y="209" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">첫 원격 로그인이 시스템을 죽임</text>
<text x="337.6" y="290" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">1969</text>
<line x1="443.2" y1="268" x2="443.2" y2="312" stroke="#8B98A9" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="443.2" cy="268" r="5" fill="#8B98A9"/>
<rect x="355.2" y="312" width="176" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="443.2" y="333" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">NCP 와 이메일</text>
<text x="443.2" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">약 15노드 · Kahn 공개 시연</text>
<text x="443.2" y="369" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Tomlinson 이 첫 이메일 작성</text>
<text x="443.2" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">1972</text>
<line x1="513.6" y1="258" x2="513.6" y2="224" stroke="#8B98A9" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="513.6" cy="268" r="5" fill="#8B98A9"/>
<rect x="425.6" y="152" width="176" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="513.6" y="173" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">internetting</text>
<text x="513.6" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Cerf 와 Kahn 이</text>
<text x="513.6" y="209" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">네트워크를 잇는 원리를 세움</text>
<text x="513.6" y="290" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">1974</text>
<line x1="830.4" y1="268" x2="830.4" y2="312" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="830.4" cy="268" r="5" fill="#F08A59"/>
<rect x="742.4" y="312" width="176" height="72" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="830.4" y="333" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">flag day</text>
<text x="830.4" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1월 1일 NCP 에서 TCP/IP 로</text>
<text x="830.4" y="369" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">모든 호스트가 그날 넘어옴</text>
<text x="830.4" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">1983</text>
<line x1="936.0" y1="258" x2="936.0" y2="224" stroke="#3FB98C" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="936.0" cy="268" r="5" fill="#3FB98C"/>
<rect x="804" y="152" width="176" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="892.0" y="173" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">NSFNET</text>
<text x="892.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">백본 56 kbps 로 출발</text>
<text x="892.0" y="209" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">10년 안에 1.5 Mbps</text>
<text x="936.0" y="290" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">1986</text>
<text x="24" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1970년대 말에 TCP·UDP·IP 세 프로토콜이 개념적으로 자리를 잡습니다 — UDP 는 TCP 의 축소판이 아니라 다른 요구에서 갈라져 나온 것입니다</text>
<line x1="12" y1="440" x2="944" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="462" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="452" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">되돌릴 수 없게 방향을 정한 날</text>
<rect x="365" y="452" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="387" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">발명 구간</text>
<rect x="474" y="452" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="496" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">확산 구간</text>
</svg>
<title id="dt">인터리빙이 있고 없고</title><desc id="dd">원문의 수치 예. 큰 비디오 하나와 작은 객체 여덟 개를 한 TCP 연결로 보낼 때, 작은 객체가 전부 도착할 때까지 보내야 하는 프레임 수.</desc>
<rect width="1000" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 02-02 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인터리빙이 있고 없고</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">축을 자르지 않았습니다 — 오른쪽 막대가 거의 안 보이는 것이 이 절의 요점입니다</text>
<line x1="150" y1="404.0" x2="900" y2="404.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="138" y="408.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">0</text>
<line x1="150" y1="349.6" x2="900" y2="349.6" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="138" y="353.6" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">220</text>
<line x1="150" y1="295.2" x2="900" y2="295.2" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="138" y="299.2" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">440</text>
<line x1="150" y1="240.8" x2="900" y2="240.8" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="138" y="244.8" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">660</text>
<line x1="150" y1="186.39999999999998" x2="900" y2="186.39999999999998" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="138" y="190.39999999999998" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">880</text>
<line x1="150" y1="132.0" x2="900" y2="132.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="138" y="136.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">1100</text>
<line x1="150" y1="132" x2="150" y2="404" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="150" y1="404" x2="900" y2="404" stroke="#8B98A9" stroke-width="1.0"/>
<text x="138" y="116" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">보내야 하는 프레임 수</text>
<rect x="210.0" y="152.7709090909091" width="230" height="251.2290909090909" rx="4" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="325.0" y="138.7709090909091" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">1,016 프레임</text>
<text x="325.0" y="434" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">인터리빙 없음</text>
<text x="325.0" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">비디오 1000 프레임을 다 보낸 뒤에야 차례가 옵니다</text>
<rect x="590.0" y="399.5490909090909" width="230" height="4.450909090909079" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="705.0" y="385.5490909090909" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">18 프레임</text>
<text x="705.0" y="434" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">인터리빙 있음</text>
<text x="705.0" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">비디오 프레임 사이사이에 끼워 보냅니다</text>
<text x="20" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">HTTP/2 는 각 메시지를 작은 프레임으로 쪼개 같은 TCP 연결 위에서 번갈아 끼워 넣습니다. 헤더 필드가 한 프레임이 되고 본문이 나머지 프레임이 됩니다.</text>
<text x="20" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 인터리빙이 원문이 말하는 HTTP/2 의 가장 중요한 단일 개선입니다. 다만 트랜스포트 층의 HOL 블로킹은 그대로 남습니다.</text>
<line x1="12" y1="552" x2="952" y2="552" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="574" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="564" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">인터리빙이 만든 값</text>
<rect x="274" y="564" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="296" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">HTTP/1.1 의 한 연결</text>

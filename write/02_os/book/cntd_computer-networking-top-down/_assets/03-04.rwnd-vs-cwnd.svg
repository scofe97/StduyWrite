<rect x="604" y="284" width="296" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="752.0" y="307" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">cwnd · 혼잡 창</text>
<rect x="12" y="324" width="268" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="24" y="347" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">값을 정하는 쪽</text>
<rect x="292" y="324" width="296" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="440.0" y="347" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">받는 쪽이 잰다</text>
<rect x="604" y="324" width="296" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="752.0" y="347" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">보내는 쪽이 추정한다</text>
<rect x="12" y="364" width="268" height="44" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="24" y="391" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">실제로 보낼 수 있는 양</text>
<rect x="292" y="364" width="608" height="44" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="596.0" y="383" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">min{cwnd, rwnd}</text>
<text x="596.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59" opacity="0.85">둘 중 작은 쪽이 한도입니다</text>
<line x1="12" y1="428" x2="900" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

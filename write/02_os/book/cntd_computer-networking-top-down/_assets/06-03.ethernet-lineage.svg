<title id="dt">토폴로지는 세 번 바뀌고 프레임 형식은 그대로입니다</title><desc id="dd">동축 버스에서 허브 성형으로, 다시 스위치 성형으로 옮겨 가는 동안 속도는 세 자릿수로 올랐다. 그 사이 프레임 형식만 바뀌지 않았다.</desc>
<rect width="1000" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 6.4.2 · FIFTY YEARS OF ETHERNET</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">토폴로지는 세 번 바뀌고 프레임 형식은 그대로입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원문이 십년 단위로 적은 시기는 그대로 옮겼습니다</text>
<line x1="40" y1="268" x2="960" y2="268" stroke="rgba(191,192,192,0.22)" stroke-width="1.4"/>
<circle cx="95.19999999999999" cy="268" r="5" fill="#0D1117" stroke="#6A95D8" stroke-width="2"/>
<line x1="95.19999999999999" y1="260" x2="95.19999999999999" y2="228" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="3 4"/>
<text x="95.19999999999999" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">1970년대 중반</text>
<text x="95.19999999999999" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Metcalfe·Boggs 가</text>
<text x="95.19999999999999" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">2.94 Mbps 로 시작</text>
<circle cx="224.0" cy="268" r="5" fill="#0D1117" stroke="#8B98A9" stroke-width="2"/>
<line x1="224.0" y1="276" x2="224.0" y2="308" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="3 4"/>
<text x="224.0" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">1980년대 ~ 1990년대 중반</text>
<text x="224.0" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">동축 버스 토폴로지</text>
<text x="224.0" y="362" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">CSMA/CD 가 필요합니다</text>
<circle cx="444.8" cy="268" r="5" fill="#0D1117" stroke="#8B98A9" stroke-width="2"/>
<line x1="444.8" y1="260" x2="444.8" y2="228" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="3 4"/>
<text x="444.8" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">1990년대 후반</text>
<text x="444.8" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">허브 기반 성형</text>
<text x="444.8" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여전히 브로드캐스트 LAN</text>
<circle cx="619.6" cy="268" r="5" fill="#0D1117" stroke="#3FB98C" stroke-width="2"/>
<line x1="619.6" y1="276" x2="619.6" y2="308" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="3 4"/>
<text x="619.6" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">2000년대 초</text>
<text x="619.6" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">허브를 스위치로 교체</text>
<text x="619.6" y="362" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">충돌이 사라집니다</text>
<circle cx="776.0" cy="268" r="5" fill="#0D1117" stroke="#3FB98C" stroke-width="2"/>
<line x1="776.0" y1="260" x2="776.0" y2="228" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="3 4"/>
<text x="776.0" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">2000년대 중반</text>
<text x="776.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기가비트 표준</text>
<text x="776.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">MAC·프레임 형식 유지</text>
<circle cx="904.8" cy="268" r="5" fill="#0D1117" stroke="#F08A59" stroke-width="2"/>
<line x1="904.8" y1="276" x2="904.8" y2="308" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="3 4"/>
<text x="904.8" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">오늘</text>
<text x="904.8" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">10 · 40 · 100</text>
<text x="904.8" y="362" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">200 · 400 Gbps</text>
<rect x="40" y="116" width="920" height="40" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="500.0" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">거의 50 년 동안 바뀌지 않은 하나 — 이더넷 프레임 형식</text>
<line x1="24" y1="380" x2="952" y2="380" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">속도는 세 자릿수로 올랐고 매체는 동축에서 구리와 광으로 갈렸으며 토폴로지는 버스에서 스위치로 옮겼습니다.</text>
<text x="24" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스위치 기반 LAN 에는 충돌이 없어 MAC 프로토콜조차 필요하지 않습니다. 그래도 이것은 여전히 이더넷입니다.</text>
<line x1="12" y1="438" x2="952" y2="438" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="460" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="450" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바뀌지 않은 것</text>
<rect x="248" y="450" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="270" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시작</text>
<rect x="318" y="450" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="340" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">충돌이 사라진 뒤</text>
</svg>
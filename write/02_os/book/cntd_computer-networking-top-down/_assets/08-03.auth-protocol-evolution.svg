<text x="44" y="432" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">TCP 3-way 핸드셰이크와 같은 얼개입니다</text>
<text x="44" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버가 오래 쓰지 않은 초기 순서 번호를 보내고 그 번호를 담은 ACK 를 기다린 것과 같습니다. 논스는 그 착상을 인증에 옮긴 것입니다.</text>

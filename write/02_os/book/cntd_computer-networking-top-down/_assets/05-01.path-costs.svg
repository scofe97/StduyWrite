<text x="30" y="502" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최소 비용 경로는 u-x-y-z 하나뿐이고 비용 4 입니다. 두 번째로 싼 경로는 7 이라 우연히 맞힐 여지가 넓지 않습니다. 라우팅 알고리즘이 푸는 문제가 바로 이 열거입니다.</text>

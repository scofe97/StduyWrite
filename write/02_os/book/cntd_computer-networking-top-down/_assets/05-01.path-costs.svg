<title id="dt">경로는 열일곱, 최소는 하나입니다</title><desc id="dd">Figure 5.3 에서 u 로부터 z 까지 가는 단순 경로 17개를 전부 열거해 비용순으로 세운 막대. 눈으로 훑어 고른 경로가 최소일 확률이 얼마나 낮은지 보여준다.</desc>

<title id="dt">DNS 서버는 세 부류입니다</title><desc id="dd">루트·TLD·권한 서버의 계층과 각 층의 규모. 로컬 DNS 서버는 이 계층에 속하지 않으면서 실제 질의의 대부분을 받는다.</desc>
<rect width="1000" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 02-03 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">DNS 서버는 세 부류입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위로 갈수록 드물고 아래로 갈수록 많습니다</text>
<polygon points="252.0,128.0 548.0,128.0 605.3333333333334,228.0 194.66666666666666,228.0" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="400" y="174.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">루트 DNS 서버</text>
<text x="400" y="196.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">TLD 서버의 주소를 준다</text>
<line x1="611.3333333333334" y1="178.0" x2="730" y2="178.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="742" y="182.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">13종 · 약 2,000 인스턴스 · 12개 조직</text>
<polygon points="194.66666666666666,228.0 605.3333333333334,228.0 662.6666666666667,328.0 137.33333333333331,328.0" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="400" y="274.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">TLD 서버</text>
<text x="400" y="296.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">권한 서버의 주소를 준다</text>
<line x1="668.6666666666667" y1="278.0" x2="730" y2="278.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="742" y="282.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">com·net·edu·gov 와 모든 국가 코드</text>
<polygon points="137.33333333333331,328.0 662.6666666666667,328.0 720.0,428.0 80.0,428.0" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="400" y="374.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">권한 DNS 서버</text>
<text x="400" y="396.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">자기 조직 호스트의 주소를 준다</text>
<line x1="726.0" y1="378.0" x2="730" y2="378.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="742" y="382.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공개 호스트를 가진 모든 조직</text>
<rect x="64" y="470" width="872" height="62" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">로컬 DNS 서버</text>
<text x="84" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">계층에 엄밀히 속하지 않지만 DNS 구조에 중심적입니다. ISP 마다 하나씩 있고 보통 DHCP 로 주소를 받습니다.</text>
<text x="916" y="496" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">질의 대부분이 여기서 끝납니다</text>
<text x="20" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">캐싱 덕분에 아주 작은 비율의 질의만이 루트 서버까지 갑니다 — 로컬 서버가 TLD 주소를 캐시해 꼭대기를 건너뜁니다.</text>
<line x1="12" y1="556" x2="952" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="568" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">캐싱으로 대개 건너뛰는 층</text>
<rect x="326" y="568" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="348" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">나머지 층</text>
<rect x="435" y="568" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="457" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">계층 밖</text>
</svg>
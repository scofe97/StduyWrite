<title id="dt">트래픽 강도가 1 에 가까워질 때</title><desc id="dd">원문 그림 1.19 와 같은 질적 관계. 가로축은 트래픽 강도 La/R 이고 세로축은 평균 큐잉 지연이다. 강도가 조금만 더 올라도 지연은 훨씬 크게 뛴다.</desc>
<rect width="1000" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 01-04 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">트래픽 강도가 1 에 가까워질 때</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세로축에 눈금이 없는 것은 원문과 같습니다 — 값이 아니라 모양이 요점입니다</text>

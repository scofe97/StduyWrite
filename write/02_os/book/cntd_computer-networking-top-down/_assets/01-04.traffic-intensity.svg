<text x="24" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">원문의 황금률 — 트래픽 강도가 1 을 넘지 않도록 시스템을 설계하십시오. 늘 막히는 도로에 평소보다 조금 더 몰리면 지연이 크게 뛰는 것과 같습니다</text>

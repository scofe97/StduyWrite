<title id="dt">악수가 두 번이냐 한 번이냐</title><desc id="dd">원문 Figure 2.11 의 두 프로토콜 스택. 왼쪽은 TCP 위에 TLS 를 얹은 https, 오른쪽은 UDP 위의 QUIC 이다.</desc>
<rect width="1000" height="628" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 02-02 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">악수가 두 번이냐 한 번이냐</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원문은 TLS 도 QUIC 도 트랜스포트가 아니라 애플리케이션 층의 하위 층으로 놓습니다</text>
<text x="268" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">a. 전통적 보안 HTTP</text>
<rect x="96.0" y="156" width="344" height="144" rx="8" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="104.0" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">애플리케이션 층</text>
<rect x="108.0" y="168" width="320" height="54" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="268" y="201" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">HTTP/1.1 · HTTP/2</text>
<rect x="108.0" y="234" width="320" height="54" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="268" y="267" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">TLS</text>
<rect x="108.0" y="300" width="320" height="54" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="268" y="333" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">TCP</text>
<rect x="108.0" y="366" width="320" height="54" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="268" y="399" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">IP</text>
<text x="700" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">b. QUIC 기반 HTTP/3</text>
<rect x="528.0" y="156" width="344" height="144" rx="8" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="4 4"/>
<text x="536.0" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">애플리케이션 층</text>
<rect x="540.0" y="168" width="320" height="54" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="700" y="201" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">HTTP/3</text>
<rect x="540.0" y="234" width="320" height="54" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="700" y="267" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">QUIC</text>
<rect x="540.0" y="300" width="320" height="54" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="700" y="333" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">UDP</text>
<rect x="540.0" y="366" width="320" height="54" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="700" y="399" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">IP</text>
<text x="268" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">악수 두 번</text>
<text x="268" y="478" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">TCP 연결 수립 뒤에</text>
<text x="268" y="498" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">TLS 키 교환이 따로 옵니다</text>
<text x="700" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">악수 한 번</text>
<text x="700" y="478" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">QUIC 이 TLS 1.3 핸드셰이크를</text>
<text x="700" y="498" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">자기 핸드셰이크에 품습니다</text>
<text x="20" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재접속할 때는 저장해 둔 세션과 암호 파라미터를 써서 0-RTT 로 바로 보낼 수도 있습니다.</text>
<line x1="12" y1="580" x2="952" y2="580" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="602" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="592" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 층이 둘을 하나로 합칩니다</text>
<rect x="352" y="592" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="374" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">나머지 층</text>

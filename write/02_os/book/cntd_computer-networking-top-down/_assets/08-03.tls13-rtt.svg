<title id="dt">목표는 그대로이고 줄어든 것은 왕복입니다</title><desc id="dd">판이 올라가며 바뀐 것은 기밀성·무결성·인증이라는 목표가 아니라 그것을 세우는 데 드는 왕복 수다.</desc>
<rect width="1000" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 8.6.2 · ROUND TRIPS BEFORE DATA</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">목표는 그대로이고 줄어든 것은 왕복입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왕복 수는 원문 §8.6.2 의 서술입니다</text>
<text x="280" y="208" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">이전 판 TLS (TCP 위)</text>
<rect x="300" y="176" width="504" height="52" rx="5" fill="#E3B34116" stroke="#E3B341" stroke-width="1.1"/>
<text x="552.0" y="208" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">3+ RTT</text>
<text x="820" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핸드셰이크에 둘 이상 + TCP 하나</text>
<text x="280" y="284" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">TLS 1.3 (TCP 위)</text>
<rect x="300" y="252" width="336" height="52" rx="5" fill="#6A95D816" stroke="#6A95D8" stroke-width="1.1"/>
<text x="468.0" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">2 RTT</text>
<text x="652" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCP 연결 하나 + TLS 핸드셰이크 하나</text>
<text x="280" y="360" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">TLS 1.3 (QUIC 안)</text>
<rect x="300" y="328" width="168" height="52" rx="5" fill="#3FB98C16" stroke="#3FB98C" stroke-width="1.1"/>
<text x="384.0" y="360" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">1 RTT</text>
<text x="484" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Client Hello 가 QUIC 연결 설정에 실립니다</text>
<text x="280" y="436" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">TLS 1.3 (QUIC · 재방문)</text>
<rect x="300" y="404" width="96" height="52" rx="5" fill="#0D1117" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="348" y="436" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">0 RTT</text>
<text x="412" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앞서 합의한 파라미터를 다시 씁니다</text>
<line x1="300" y1="484" x2="804" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="300" y1="480" x2="300" y2="488" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="300" y="504" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">0</text>
<line x1="468" y1="480" x2="468" y2="488" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="468" y="504" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">1</text>
<line x1="636" y1="480" x2="636" y2="488" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="636" y="504" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">2</text>
<line x1="804" y1="480" x2="804" y2="488" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="804" y="504" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">3</text>
<text x="552.0" y="526" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">데이터를 보내기까지의 왕복 수</text>
<rect x="24" y="546" width="952" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">1 RTT 가 가능한 이유</text>
<text x="44" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Client Hello 가 이미 클라이언트의 DH 공개값을 싣고 갑니다. 서버가 인사와 동시에 마스터 비밀을 만들 수 있어 왕복이 하나로 줄었습니다.</text>
<line x1="12" y1="642" x2="952" y2="642" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="664" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="654" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="664" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이전 판</text>
<rect x="196" y="654" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="218" y="664" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCP 위</text>
<rect x="305" y="654" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="327" y="664" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">QUIC 안</text>
<rect x="427" y="654" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="449" y="664" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재방문</text>
</svg>
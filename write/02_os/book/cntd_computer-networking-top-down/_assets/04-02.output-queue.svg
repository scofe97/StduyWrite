<title id="dt">빨라도 출력에는 줄이 섭니다</title><desc id="dd">원문 Figure 4.9. 패브릭이 아무리 빨라도 출력 링크가 하나뿐이라 단위 시간에 하나만 나간다. 셋이 들어오고 하나가 나가므로 차액 둘이 단위 시간마다 출력 큐에 쌓이고, 메모리가 차면 버려야 한다.</desc>

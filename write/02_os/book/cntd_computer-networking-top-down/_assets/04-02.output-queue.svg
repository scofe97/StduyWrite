<title id="dt">빨라도 출력에는 줄이 섭니다</title><desc id="dd">원문 Figure 4.9. 입력 여럿이 같은 출력 포트로 몰리면 단위 시간에 하나만 내보내는 출력 링크 앞에 줄이 서고, 메모리가 차면 버려야 한다.</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 04-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">빨라도 출력에는 줄이 섭니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">패브릭 속도와 무관하게 링크 하나가 병목입니다</text>
<rect x="40" y="168.0" width="120" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="100.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">입력 포트 1</text>
<text x="100.0" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">단위 시간에 1개</text>
<line x1="162" y1="190" x2="200" y2="190" stroke="#8B98A9" stroke-width="1.2"/>
<rect x="40" y="232.0" width="120" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="100.0" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">입력 포트 2</text>
<text x="100.0" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">단위 시간에 1개</text>
<line x1="162" y1="254" x2="200" y2="254" stroke="#8B98A9" stroke-width="1.2"/>
<rect x="40" y="296.0" width="120" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="100.0" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">입력 포트 3</text>
<text x="100.0" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">단위 시간에 1개</text>
<line x1="162" y1="318" x2="200" y2="318" stroke="#8B98A9" stroke-width="1.2"/>
<line x1="200" y1="190" x2="200" y2="318" stroke="#8B98A9" stroke-width="1.2"/>
<path d="M 200 254 L 250 254" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="256" y="236" width="360" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="268" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">출력 포트 큐</text>
<rect x="276" y="256.0" width="56" height="40" rx="5" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="304.0" y="281.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">p4</text>
<rect x="340" y="256.0" width="56" height="40" rx="5" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="368.0" y="281.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">p3</text>
<rect x="404" y="256.0" width="56" height="40" rx="5" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="432.0" y="281.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">p2</text>
<rect x="468" y="256.0" width="56" height="40" rx="5" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="496.0" y="281.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">p1</text>
<rect x="532" y="256.0" width="56" height="40" rx="5" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="4 3"/>
<text x="560.0" y="281.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">빈 칸</text>
<text x="256" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">도착은 단위 시간에 3개, 나가는 것은 1개 — 줄이 자랍니다</text>
<path d="M 620 254 L 658 254" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="664" y="248" width="160" height="56" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="744.0" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">출력 링크</text>
<text x="744.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">단위 시간에 1개 · R_line</text>
<path d="M 828 254 L 876 254" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="880" y="234" width="80" height="40" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="920" y="259" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">전송됨</text>
<path d="M 600 234 L 600 172.0 L 654 172.0" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)" stroke-dasharray="5 4"/>
<rect x="660" y="152" width="200" height="40" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="760.0" y="177" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">메모리가 차면 버림</text>
<text x="660" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">꼬리 버리기 · 이미 선 것 빼내기</text>
<text x="24" y="428" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">패브릭이 회선의 N 배로 빨라도 출력 링크는 단위 시간에 하나만 내보냅니다. 그 하나가 나가는 동안 N 개가 새로 도착할 수 있습니다.</text>
<text x="24" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">버리는 대신 차기 전에 미리 버리거나 헤더에 표시하는 것이 AQM 입니다 — RED · PIE · CoDel. 그 표시가 03-05 의 ECN 비트입니다.</text>
<text x="24" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">이 줄을 얼마나 길게 둘지가 다음 절의 물음입니다.</text>
<line x1="12" y1="516" x2="952" y2="516" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="528" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">병목 — 출력 링크 하나</text>
<rect x="313" y="528" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="335" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">줄 선 패킷</text>
<rect x="435" y="528" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="457" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">내보냄</text>
<rect x="518" y="528" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="540" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">버림</text>
</svg>
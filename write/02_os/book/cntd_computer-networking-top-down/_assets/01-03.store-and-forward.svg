<title id="dt">저장 후 전달이 만드는 시간표</title><desc id="dd">패킷 세 개가 라우터 하나를 거쳐 목적지로 간다. 라우터는 패킷 전체를 받아야 첫 비트를 내보낼 수 있으므로 링크마다 L/R 씩 밀린다. 마지막 패킷이 도착하는 시각이 4L/R 이다.</desc>
<rect width="980" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 01-03 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">저장 후 전달이 만드는 시간표</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로 한 칸이 L/R 입니다 — 길이 L 비트를 속도 R 인 링크에 밀어 넣는 시간</text>
<line x1="200.0" y1="120" x2="200.0" y2="376" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="200.0" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">0</text>
<line x1="382.5" y1="120" x2="382.5" y2="376" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="382.5" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">L/R</text>
<line x1="565.0" y1="120" x2="565.0" y2="376" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="565.0" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2L/R</text>
<line x1="747.5" y1="120" x2="747.5" y2="376" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="747.5" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">3L/R</text>
<line x1="930.0" y1="120" x2="930.0" y2="376" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="930.0" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">4L/R</text>
<line x1="200" y1="120" x2="930" y2="120" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="12" y="132" width="928" height="120" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">링크 1 · 출발지 → 라우터</text>
<rect x="12" y="252" width="928" height="120" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">링크 2 · 라우터 → 목적지</text>
<text x="24" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">패킷 1</text>
<rect x="200.0" y="148" width="182.5" height="24" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="1.0"/>
<text x="291.25" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">0 → L/R</text>
<text x="24" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">패킷 2</text>
<rect x="382.5" y="188" width="182.5" height="24" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="1.0"/>
<text x="473.75" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">1L/R → 2L/R</text>
<text x="24" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">패킷 3</text>
<rect x="565.0" y="228" width="182.5" height="24" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="1.0"/>
<text x="656.25" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2L/R → 3L/R</text>
<text x="24" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">패킷 1</text>
<rect x="382.5" y="268" width="182.5" height="24" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="1.0"/>
<text x="473.75" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">1L/R → 2L/R</text>
<text x="24" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">패킷 2</text>
<rect x="565.0" y="308" width="182.5" height="24" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="1.0"/>
<text x="656.25" y="324" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2L/R → 3L/R</text>
<text x="24" y="368" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">패킷 3</text>
<rect x="747.5" y="348" width="182.5" height="24" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="838.75" y="364" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">3L/R → 4L/R</text>
<text x="20" y="408" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">링크 N 개를 지나는 패킷 하나는 N·L/R 이 걸립니다(식 1.1). 패킷 P 개라면 (N + P − 1)·L/R 이고, 여기서는 N=2·P=3 이라 4L/R 입니다</text>
<line x1="12" y1="440" x2="932" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="462" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="452" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">마지막 패킷이 도착하는 구간</text>
<rect x="339" y="452" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="361" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">나머지 점유 구간</text>
</svg>
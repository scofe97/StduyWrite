<title id="dt">조회는 오래 됐고 설정이 늦었습니다</title><desc id="dd">망을 관리하는 세 방식을 대상 범위와 주된 쓰임 두 축에 놓은 그림. 장비를 하나씩 다루는 방식이 오래 쓰였고, 망 전체를 한 번에 설정하는 방식이 가장 늦게 왔다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.7 · THREE WAYS TO MANAGE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">조회는 오래 됐고 설정이 늦었습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">RFC 3535 이 지적한 빈자리가 NETCONF 를 낳았습니다</text>
<rect x="240" y="120" width="380" height="380" rx="10" fill="#F5F5F304" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="430.0" y1="120" x2="430.0" y2="500" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="240" y1="310.0" x2="620" y2="310.0" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="430.0" y="106" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">주로 조회에 씁니다</text>
<text x="430.0" y="526" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">주로 설정에 씁니다</text>
<text x="224" y="302.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">장비를</text>
<text x="224" y="320.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">하나씩</text>
<text x="636" y="302.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">망 전체를</text>
<text x="636" y="320.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">한 번에</text>
<rect x="248" y="182" width="176" height="68" rx="8" fill="#6A95D816" stroke="#6A95D8" stroke-width="1.5"/>
<text x="336" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">SNMP / MIB</text>
<text x="336" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1980년대 후반부터</text>
<text x="336" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">MIB 객체를 읽고 씁니다</text>
<rect x="248" y="378" width="176" height="68" rx="8" fill="#E3B34116" stroke="#E3B341" stroke-width="1.5"/>
<text x="336" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">CLI</text>
<text x="336" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사람이 직접 또는 스크립트로</text>
<text x="336" y="464" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">공급자마다 달라 자동화가 어렵습니다</text>
<rect x="440" y="378" width="176" height="68" rx="8" fill="#F08A5916" stroke="#F08A59" stroke-width="1.5"/>
<text x="528" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">NETCONF / YANG</text>
<text x="528" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">RFC 6241 · RFC 6020</text>
<text x="528" y="464" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">여러 장비에 원자적으로 적용합니다</text>
<text x="528" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기는 비어 있습니다</text>
<text x="30" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">RFC 3535 의 2002년 워크숍은 SNMP/MIB 가 장비 감시에는 값어치가 있지만 설정과 규모에서는 모자란다고 짚었습니다.</text>
<text x="30" y="572" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">"운영자가 개별 장비가 아니라 망 전체의 설정에 집중하게 하라"는 요구가 NETCONF 를 낳았습니다.</text>
<line x1="12" y1="596" x2="952" y2="596" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="618" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="608" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정 중심</text>
<rect x="209" y="608" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="231" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">조회 중심</text>
<rect x="318" y="608" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="340" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사람 손</text>
</svg>
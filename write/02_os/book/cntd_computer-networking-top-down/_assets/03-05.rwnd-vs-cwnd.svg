<title id="dt">두 창 중 작은 쪽이 그때그때 병목입니다</title><desc id="dd">rwnd 는 받는 쪽이 알려 주는 창이고 cwnd 는 보내는 쪽이 추측하는 창이다. 실제 전송 한도는 매 순간 둘 중 작은 쪽이며, 어느 쪽이 작은지는 시간에 따라 바뀐다.</desc>

<text x="783.0" y="379.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">min{cwnd, rwnd}</text>
<text x="20" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">rwnd 는 받는 쪽이 헤더에 적어 보낸 숫자라 그쪽 앱이 읽기를 멈추면 뚝 떨어지고, cwnd 는 보내는 쪽이 혼자 올리고 중복 ACK 손실 때 반으로 접습니다.</text>
<text x="20" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보내는 쪽은 매 순간 둘 중 작은 값까지만 내보냅니다. 값은 질적이고, 눈금은 MSS 단위로만 뜻이 있습니다.</text>

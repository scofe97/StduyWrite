<title id="dt">표가 고르면 길이 바뀝니다</title><desc id="dd">패킷 스위치 셋과 호스트 여섯으로 이루어진 예제 망. 첫째 예의 흐름 표는 s3 과 s2 를 잇는 직통 링크를 일부러 비우고 s1 을 거쳐 가게 만든다.</desc>

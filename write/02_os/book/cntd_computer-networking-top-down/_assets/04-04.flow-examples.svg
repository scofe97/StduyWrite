<text x="500" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">표를 계산해 설치하는 것은 원격 컨트롤러입니다</text>
<text x="40" y="548" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">둘째 예는 같은 그림에서 s2 의 표만 바꿔, 들어온 포트 3 과 4 를 서로 다른 링크로 갈라 보냅니다. 목적지가 같으므로 목적지만 보는 규칙으로는 만들 수 없는 동작입니다.</text>

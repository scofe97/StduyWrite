<path d="M 378.0 928 L 596.0 928" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4 3"/>
<text x="488.0" y="918" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">seg 2 재전송</text>
<path d="M 618.0 968 L 836.0 968" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="728.0" y="958" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">밀려 있던 것 일괄 전달</text>
<text x="20" y="1000" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">막힌 자리가 TCP 층으로 내려왔습니다. 바이트 스트림 하나라 스트림 경계를 몰라, 상관없는 스트림까지 붙듭니다.</text>
<line x1="20" y1="1012" x2="952" y2="1012" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="20" y="1038" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">03</text>
<text x="72" y="1038" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">HTTP/3 · QUIC 스트림</text>
<text x="261.41599999999994" y="1038" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">패킷마다 스트림 번호가 박혀 있습니다</text>

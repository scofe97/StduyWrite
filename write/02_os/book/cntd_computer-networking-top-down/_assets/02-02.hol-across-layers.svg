<text x="608.0" y="813" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">seg 3 은 왔지만 못 올려보냄</text>

<text x="728.0" y="514" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">O2 전달</text>
<text x="20" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">막힌 자리는 HTTP 층입니다. 응답을 요청 순서로 묶어 두어, 앞의 큰 객체가 끝나야 뒤가 출발합니다.</text>
<line x1="20" y1="580" x2="952" y2="580" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="20" y="606" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">02</text>
<text x="72" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">HTTP/2 · 프레임 인터리빙</text>
<text x="287.4" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">한 TCP 연결에 세 스트림을 섞습니다</text>

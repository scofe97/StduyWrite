<title id="dt">막히는 자리가 층을 따라 내려갑니다</title><desc id="dd">서버가 보낸 응답이 HTTP 층과 트랜스포트 층을 거쳐 브라우저에 닿기까지. 세 판을 같은 시간축 위에 쌓아, 판마다 어디서 줄이 서는지 대조한다.</desc>
<rect width="1000" height="1536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 02-02 SUMMARY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">막히는 자리가 층을 따라 내려갑니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">1.1 은 HTTP 층에서, 2 는 TCP 층에서 막힙니다. 3 은 그 줄을 끊고 혼잡 윈도만 남깁니다</text>
<rect x="24.0" y="112" width="208" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="128.0" y="133" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">HTTP 송신</text>

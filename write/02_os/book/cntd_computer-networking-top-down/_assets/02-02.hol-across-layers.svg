<text x="728.0" y="1350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">스트림 1 전달</text>
<text x="20" y="1392" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">순서의 줄은 끊겼습니다. 그래도 혼잡 윈도는 경로 단위라, 이 손실 하나가 세 스트림의 전송 속도를 함께 낮춥니다.</text>
<line x1="128.0" y1="166" x2="128.0" y2="1404" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="368.0" y1="166" x2="368.0" y2="1404" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="608.0" y1="166" x2="608.0" y2="1404" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="848.0" y1="166" x2="848.0" y2="1404" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<text x="20" y="1440" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">세 막을 같은 눈으로 읽으면, 판이 바뀔 때마다 막히는 자리가 HTTP 층에서 TCP 층으로, 다시 혼잡 제어로 옮겨 간 것이 보입니다.</text>
<text x="20" y="1464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">애플리케이션 층에서 아무리 잘게 쪼개도 그 아래 층이 다시 묶으면 소용이 없다는 것이 HTTP/3 이 트랜스포트를 갈아치운 이유입니다.</text>
<line x1="12" y1="1488" x2="952" y2="1488" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="1510" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="1500" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="1510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전달됨</text>

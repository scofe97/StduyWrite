<text x="470" y="226" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#8B98A9">R3</text>
<path d="M 330 166 L 330 222 L 452 222" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<text x="400" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">B–D 가 R2 를 가득 채움</text>
<text x="560" y="136" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부하가 커지면 R2 에서 B–D 도착률이 A–C 보다 훨씬 커짐</text>
<text x="560" y="154" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">R2 가 A–C 패킷을 버리면 R1 이 그것을 나른 일이 낭비</text>
<text x="560" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">R1 이 그냥 버리고 놀았어도 망의 형편은 똑같이 나빴을 것</text>

<title id="dt">시나리오 3 — 부하를 올리면 처리량이 오히려 0 으로 갑니다</title><desc id="dd">원문 Figure 3.47·3.48. 두 번째 홉에서 버려지는 패킷은 첫 홉이 쓴 전송 용량을 통째로 낭비한다. 이것이 혼잡 붕괴다.</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-04 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">시나리오 3 — 부하를 올리면 처리량이 오히려 0 으로 갑니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">A–C 는 R1 과 R2 를 지나고, R2 에서 B–D 와 버퍼를 놓고 경쟁합니다</text>

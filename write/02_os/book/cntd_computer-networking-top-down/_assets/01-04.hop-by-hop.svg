<title id="dt">홉마다 같은 넷이 되풀이됩니다</title><desc id="dd">종단 간 지연은 홉마다의 네 성분을 다 더한 값이다. 셋은 홉이 정해지면 값이 정해지고 큐잉만 지날 때마다 다르다. 거리가 갑자기 멀어지면 전파 칸이 통째로 뛴다.</desc>
<rect width="1000" height="714" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 01-04 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">홉마다 같은 넷이 되풀이됩니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">눈금 없는 질적 그림입니다 — 적힌 숫자만 예제 출력이 준 값입니다</text>

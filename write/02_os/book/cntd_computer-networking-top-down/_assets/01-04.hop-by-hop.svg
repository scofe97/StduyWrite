<text x="636" y="276" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">← 이 칸 하나가 열 배를 만듭니다</text>
<text x="636" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">대서양 횡단 광케이블</text>
<text x="752" y="500" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">↑ 큐잉 칸만 지날 때마다 다릅니다 — 그래서 12번이 11번보다 작습니다</text>
<rect x="24" y="532" width="952" height="116" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="44" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">예제 출력이 실제로 보여 주는 것 셋</text>
<text x="44" y="580" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">4번 라우터까지의 세 값 `0.351 · 0.392 · 0.380 ms` 에는 네 성분이 모두 들어 있습니다. 왕복 하나에 넷이 다 섞여 돌아옵니다.</text>
<text x="44" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">`12번`이 `11번`보다 작게 나옵니다. 뒤 홉이 앞 홉보다 빠를 수 있다는 뜻이고, 그렇게 만드는 것은 큐잉 하나뿐입니다.</text>
<text x="44" y="624" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">`7번 7.311 ms` 에서 `8번 77.826 ms` 로 열 배 넘게 뜁니다. 거리가 뛰었기 때문이고, 거리에 달린 성분은 전파 하나입니다.</text>
<line x1="12" y1="670" x2="952" y2="670" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="692" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

<title id="dt">지도는 같고 표는 저마다 다릅니다</title><desc id="dd">같은 링크 상태 지도를 받은 라우터들이 각자 자기를 출발점으로 다익스트라를 돌려 서로 다른 전달 표를 만드는 모습. u·x·y 세 라우터의 표를 나란히 놓았다.</desc>

<title id="dt">AS 안에 다시 경계를 긋습니다</title><desc id="dd">OSPF 가 하나의 AS 를 영역으로 나눈 구조. 링크 상태 브로드캐스트는 영역 안에서만 돌고, 영역을 넘는 경로는 반드시 백본 영역을 거친다.</desc>
<rect width="1000" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.3 · OSPF AREAS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">AS 안에 다시 경계를 긋습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">AS 를 나눈 이유를 AS 안에서 한 번 더 반복합니다</text>
<rect x="40" y="112" width="260" height="96" rx="9" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="170" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">영역 1</text>
<text x="170" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">링크 상태는 여기서만 돕니다</text>
<text x="170" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">각자 다익스트라</text>
<rect x="92" y="232" width="156" height="40" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="1.4"/>
<text x="170" y="257" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">영역 경계 라우터</text>
<path d="M 170 208 L 170 232" fill="none" stroke="#8B98A9" stroke-width="1.2"/>
<path d="M 170 272 L 170 296" fill="none" stroke="#F08A59" stroke-width="1.4"/>
<rect x="370" y="112" width="260" height="96" rx="9" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">영역 2</text>
<text x="500" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자기 영역의 지도만 압니다</text>
<text x="500" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">각자 다익스트라</text>
<rect x="422" y="232" width="156" height="40" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="257" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">영역 경계 라우터</text>
<path d="M 500 208 L 500 232" fill="none" stroke="#8B98A9" stroke-width="1.2"/>
<path d="M 500 272 L 500 296" fill="none" stroke="#F08A59" stroke-width="1.4"/>
<rect x="700" y="112" width="260" height="96" rx="9" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="830" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">영역 3</text>
<text x="830" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">밖은 경계 라우터에게 맡깁니다</text>
<text x="830" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">각자 다익스트라</text>
<rect x="752" y="232" width="156" height="40" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="1.4"/>
<text x="830" y="257" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">영역 경계 라우터</text>
<path d="M 830 208 L 830 232" fill="none" stroke="#8B98A9" stroke-width="1.2"/>
<path d="M 830 272 L 830 296" fill="none" stroke="#F08A59" stroke-width="1.4"/>
<rect x="40" y="296" width="920" height="92" rx="10" fill="#F08A5910" stroke="#F08A59" stroke-width="1.6"/>
<text x="500" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">백본 영역 (area 0)</text>
<text x="500" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">모든 영역 경계 라우터를 반드시 포함합니다</text>
<path d="M 190 370 L 810 370" fill="none" stroke="#6A95D8" stroke-width="1.8" marker-end="url(#info)"/>
<text x="500" y="386" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">영역 1 에서 영역 3 으로 가는 트래픽은 여기를 지납니다</text>
<text x="30" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">라우터는 링크 상태가 바뀔 때마다, 그리고 바뀌지 않아도 최소 30분에 한 번 광고를 다시 뿌립니다.</text>
<text x="30" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">RFC 2328 은 이 주기적 재광고가 링크 상태 알고리즘에 견고함을 더한다고 적습니다.</text>
<text x="30" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">OSPF 메시지는 IP 위에 직접 실리며 상위 프로토콜 번호는 89 입니다.</text>
<line x1="12" y1="500" x2="952" y2="500" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="522" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="512" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">백본과 영역 경계</text>
<rect x="261" y="512" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="283" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">영역을 넘는 경로</text>
<rect x="422" y="512" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="444" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">영역 내부</text>
<text x="960" y="556" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">KUROSE-ROSS 9E 5.3 · RFC 2328</text>
</svg>
<text x="524.0" y="257.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">seg 1</text>
<text x="524.0" y="273.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">스트림 A</text>
<rect x="576" y="240.0" width="88" height="40" rx="5" fill="none" stroke="#F0616D" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="620.0" y="257.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">seg 2</text>
<text x="620.0" y="273.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">빠짐</text>
<rect x="672" y="240.0" width="88" height="40" rx="5" fill="#0D1117" stroke="#3FB98C" stroke-width="1.0"/>
<text x="716.0" y="257.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">seg 3</text>
<text x="716.0" y="273.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">스트림 B</text>
<rect x="768" y="240.0" width="88" height="40" rx="5" fill="#0D1117" stroke="#3FB98C" stroke-width="1.0"/>
<text x="812.0" y="257.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">seg 4</text>
<text x="812.0" y="273.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">스트림 C</text>
<rect x="864" y="240.0" width="88" height="40" rx="5" fill="#0D1117" stroke="#3FB98C" stroke-width="1.0"/>
<text x="908.0" y="257.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">seg 5</text>
<text x="908.0" y="273.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">스트림 B</text>
<path d="M 524.0 220 L 524.0 184" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="512.0" y="206" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">올라감</text>
<path d="M 716.0 220 L 716.0 204" fill="none" stroke="#F0616D" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="708.0" y1="200" x2="724.0" y2="200" stroke="#F0616D" stroke-width="1.5"/>
<path d="M 812.0 220 L 812.0 204" fill="none" stroke="#F0616D" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="804.0" y1="200" x2="820.0" y2="200" stroke="#F0616D" stroke-width="1.5"/>
<path d="M 908.0 220 L 908.0 204" fill="none" stroke="#F0616D" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="900.0" y1="200" x2="916.0" y2="200" stroke="#F0616D" stroke-width="1.5"/>
<text x="620" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">2 가 올 때까지 막힘</text>
<path d="M 620.0 336 L 620.0 304" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)" stroke-dasharray="4 3"/>
<text x="636.0" y="326" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F0616D">재전송이 올 때까지</text>
<path d="M 56 408 L 56 120" fill="none" stroke="#5E6B7E" stroke-width="1.0" marker-end="url(#soft)"/>
<text x="56" y="430" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">deliver</text>
<text x="24" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">HTTP/2 는 애플리케이션 층에서 프레임을 섞어 앞 객체가 뒤 객체를 막는 일을 없앴습니다.</text>
<text x="24" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">그런데 TCP 는 순서를 보장하는 바이트 스트림 하나라, 세그먼트 하나가 빠지면 그 뒤에 쌓인 것을 스트림과 무관하게 전부 붙듭니다.</text>
<text x="24" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">같은 형태가 04-02 §1 의 입력 큐에도 있습니다. 앞의 것이 못 나가면 뒤도 못 나갑니다.</text>
<line x1="12" y1="524" x2="952" y2="524" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="546" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="536" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">빠진 세그먼트와 그것이 막은 것</text>
<rect x="365" y="536" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="387" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">올라간 세그먼트</text>
<rect x="513" y="536" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="535" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기다리는 스트림</text>
<rect x="661" y="536" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="683" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">막히는 층</text>
</svg>
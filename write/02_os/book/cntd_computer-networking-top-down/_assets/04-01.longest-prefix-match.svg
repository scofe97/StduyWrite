<text x="700" y="248" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">…0001 1</text>
<text x="700" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">20비트</text>
<path d="M 536.0 178.0 L 700 220.0" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="162.0" y="326.0" width="116" height="44" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.4"/>
<text x="220" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">…00010</text>
<text x="220" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">21비트</text>
<path d="M 292 274.0 L 232 318.0" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="542.0" y="326.0" width="116" height="44" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.4"/>
<text x="600" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">…00011</text>
<text x="600" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">21비트</text>
<path d="M 692 274.0 L 610 318.0" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="750.0" y="326.0" width="148" height="44" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="824" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">…00011000</text>
<text x="824" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">24비트</text>
<path d="M 712 274.0 L 800 318.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="162.0" y="426" width="116" height="40" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="220" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">인터페이스 0</text>
<path d="M 220 372.0 L 220 420" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<rect x="542.0" y="426" width="116" height="40" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="600" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">인터페이스 2</text>
<path d="M 600 372.0 L 600 420" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<rect x="766.0" y="426" width="116" height="40" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="1.2"/>
<text x="824" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">인터페이스 1</text>
<path d="M 824 372.0 L 824 420" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)"/>
<rect x="24" y="486" width="420" height="62" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="40" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">…00011000 10101010 은 21비트와 24비트 둘 다에 맞습니다</text>
<text x="40" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">긴 쪽인 24비트가 이겨 인터페이스 1 로 갑니다</text>
<text x="468" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어느 항목에도 안 맞으면 길이 0 인 기본 항목이 이깁니다 — 인터페이스 3.</text>
<text x="468" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCAM 의 '신경 안 씀' 비트가 이 접두 표를 작게 유지하는 열쇠입니다.</text>
<line x1="12" y1="568" x2="952" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="590" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="580" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가장 긴 접두</text>
<rect x="235" y="580" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="257" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">더 짧은 접두</text>
<rect x="370" y="580" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="392" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공통 부분</text>

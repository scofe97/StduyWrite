<title id="dt">가장 깊이 내려간 곳이 답입니다</title><desc id="dd">원문의 접두 표를 트라이로 편 것. 한 주소가 여러 항목에 맞을 수 있어서 가장 긴 접두를 고른다.</desc>
<rect width="1000" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">가장 깊이 내려간 곳이 답입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앞 16비트는 셋이 공유하므로 뿌리에 접어 두었습니다</text>

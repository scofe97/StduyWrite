<text x="24" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">메모리와 버스는 자원 하나를 모두가 나눠 쓰므로 한 번에 하나만 건널 수 있습니다.</text>
<text x="24" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">크로스바는 쓰는 버스가 다르면 나란히 건널 수 있어 논블로킹입니다. 다만 같은 출력 포트로 가는 둘은 하나가 입력에서 기다립니다.</text>

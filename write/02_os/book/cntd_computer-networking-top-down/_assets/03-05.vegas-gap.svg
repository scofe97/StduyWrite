<title id="dt">Vegas — 기대와 실제의 차이가 곧 큐입니다</title><desc id="dd">cwnd 를 올리면 안 막힌 경로에서는 처리량이 cwnd/RTTmin 로 따라 오른다. 실제 처리량이 그 직선에서 떨어지기 시작하는 자리가 큐가 쌓이기 시작한 자리이고, Vegas 는 손실이 나기 전에 거기서 물러선다.</desc>

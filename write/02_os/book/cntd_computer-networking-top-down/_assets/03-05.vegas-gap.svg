<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Vegas — 기대와 실제의 차이가 곧 큐입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가로축은 혼잡 창, 세로축은 처리량입니다. 두 선의 벌어짐이 큐에 쌓인 양입니다</text>

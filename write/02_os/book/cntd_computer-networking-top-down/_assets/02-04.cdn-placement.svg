<title id="dt">어디까지 들어갈 것인가</title><desc id="dd">같은 경로 위에서 CDN 클러스터를 접속 ISP 안에 두느냐 IXP 에 두느냐. 깊이 들어갈수록 사용자에게 가깝고 운영할 곳이 많아진다.</desc>

<title id="dt">패브릭이 회선만큼만 빠르면 줄이 쌓입니다</title><desc id="dd">입력 포트 세 곳에 슬롯마다 패킷이 하나씩 도착하는데 스위칭 패브릭이 회선과 같은 속도라 슬롯당 하나만 건넌다. 건너지 못한 둘이 입력 큐에 남아 슬롯마다 두 개씩 누적된다.</desc>

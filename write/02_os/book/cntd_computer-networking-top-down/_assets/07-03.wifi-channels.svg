<title id="dt">열한 채널 중 셋만 서로 겹치지 않습니다</title><desc id="dd">채널은 5 MHz 간격으로 놓이는데 폭은 20 MHz 다. 그래서 번호가 가까운 채널끼리는 서로 간섭한다.</desc>

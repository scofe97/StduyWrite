<title id="dt">경계를 그으니 문제가 둘 다 풀립니다</title><desc id="dd">라우터를 자율 시스템으로 묶은 뒤의 구조. 같은 AS 안은 하나의 라우팅 프로토콜이 지배하고, AS 를 넘는 순간 다른 프로토콜이 맡는다.</desc>

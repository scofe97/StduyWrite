<text x="350" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">eBGP</text>
<text x="662" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">eBGP</text>
<text x="500" y="446" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 AS 안의 라우터는 같은 라우팅 알고리즘을 돌리고 서로의 정보를 갖습니다.</text>
<text x="500" y="466" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">AS 를 넘는 순간 필요한 것은 최단 경로가 아니라 합의된 하나의 프로토콜입니다.</text>
<text x="30" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">라우터를 무리로 묶는 이유는 둘입니다. 수억 개 라우터의 도달 정보를 저장하고 전파하는 비용이 감당되지 않고,</text>
<text x="30" y="528" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ISP 마다 자기 망을 자기 뜻대로 운영하고 내부를 숨기고 싶어 합니다. 경계 하나가 둘을 함께 해결합니다.</text>

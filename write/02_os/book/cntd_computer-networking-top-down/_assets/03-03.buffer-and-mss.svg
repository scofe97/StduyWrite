<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 648" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">40바이트가 어디에 붙는지가 MSS 를 정합니다</title><desc id="dd">버퍼에서 한 번에 집을 수 있는 양은 링크 층 프레임에 들어가야 한다는 조건에서 나온다. MTU 1,500 에서 IP 헤더 20 과 TCP 헤더 20 을 빼면 남는 것이 1,460 이다.</desc>
<rect width="1000" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 03-03 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">40바이트가 어디에 붙는지가 MSS 를 정합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">MSS 는 데이터만 세는 값입니다 — 세그먼트 전체가 아닙니다</text>
<rect x="24" y="150" width="268" height="158" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.3"/>
<text x="44" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#6A95D8">송신 버퍼</text>
<text x="44" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">3-way 핸드셰이크 때 마련됩니다</text>
<rect x="44" y="224" width="36" height="26" rx="3" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.0"/>
<rect x="88" y="224" width="36" height="26" rx="3" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.0"/>
<rect x="132" y="224" width="36" height="26" rx="3" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.0"/>
<rect x="176" y="224" width="36" height="26" rx="3" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.0"/>
<rect x="220" y="224" width="36" height="26" rx="3" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.0"/>
<text x="44" y="274" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기서 한 번에 집을 수 있는 최대량이</text>
<text x="44" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">MSS 입니다</text>
<path d="M 296 230 L 322 230" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="330" y="142" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#E3B341">링크 층 프레임 · MTU 1,500바이트</text>
<rect x="330" y="150" width="646" height="60" rx="6" fill="#E3B34110" stroke="#E3B341" stroke-width="1.3"/>
<text x="653.0" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">여기 다 들어가야 합니다 · 1,500바이트</text>
<text x="390" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#8B98A9">IP 데이터그램</text>
<rect x="390" y="230" width="586" height="60" rx="6" fill="#8B98A910" stroke="#8B98A9" stroke-width="1.3"/>
<rect x="390" y="230" width="56" height="60" rx="6" fill="#E3B34128" stroke="#E3B341" stroke-width="1.2"/>
<text x="418" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">헤더</text>
<text x="418" y="274" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">20</text>
<text x="711.0" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">페이로드 1,480바이트</text>
<text x="450" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F08A59">TCP 세그먼트</text>
<rect x="450" y="310" width="526" height="60" rx="6" fill="#F08A5910" stroke="#F08A59" stroke-width="1.3"/>
<rect x="450" y="310" width="56" height="60" rx="6" fill="#E3B34128" stroke="#E3B341" stroke-width="1.2"/>
<text x="478" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">헤더</text>
<text x="478" y="354" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">20</text>
<text x="741.0" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">페이로드 1,460바이트 = MSS</text>
<text x="450" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">이 칸의 크기가 곧 MSS 입니다 — 애플리케이션 데이터만 셉니다</text>
<rect x="24" y="424" width="952" height="82" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="44" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">이름이 헷갈립니다</text>
<text x="44" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">MSS 는 「최대 세그먼트 크기」인데 실제로 세는 것은 세그먼트가 아니라 그 안의 애플리케이션 데이터입니다. 굳어진 이름이라 그냥 안고 갑니다.</text>
<text x="44" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">그래서 MTU 1,500 과 MSS 1,460 의 차이 40 이 IP 헤더 20 과 TCP 헤더 20 입니다.</text>
<rect x="24" y="518" width="952" height="62" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.2"/>
<text x="44" y="544" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">그 버퍼는 양 끝에만 있습니다</text>
<text x="44" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">연결은 한쪽 호스트의 버퍼·변수·소켓과 다른 쪽의 버퍼·변수·소켓입니다. 사이의 라우터·스위치·중계기에는 어떤 버퍼도 변수도 할당되지 않습니다.</text>
<line x1="12" y1="604" x2="952" y2="604" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="626" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="616" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="626" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">버퍼와 연결 상태</text>
<rect x="261" y="616" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="283" y="626" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">헤더가 깎는 자리</text>
<rect x="422" y="616" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="444" y="626" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">남는 것 = MSS</text>
</svg>
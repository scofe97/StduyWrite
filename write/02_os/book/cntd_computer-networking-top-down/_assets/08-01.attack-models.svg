<title id="dt">쥔 것이 늘수록 안쪽으로 들어옵니다</title><desc id="dd">안쪽 상자는 바깥 상자가 가진 것을 이미 가지고 있다. 그래서 안으로 갈수록 깨기가 쉬워진다.</desc>
<rect width="1000" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 8.2.1 · THREE ATTACK SCENARIOS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">쥔 것이 늘수록 안쪽으로 들어옵니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세 시나리오의 이름과 예는 원문 §8.2.1 의 것입니다</text>
<rect x="24" y="144" width="480" height="300" rx="10" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.2"/>
<text x="44" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">암호문 단독 공격</text>
<text x="44" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">ciphertext-only</text>
<rect x="64" y="200" width="400" height="188" rx="10" fill="#E3B34110" stroke="#E3B341" stroke-width="1.2"/>
<text x="84" y="228" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">기지 평문 공격</text>
<text x="84" y="246" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">known-plaintext</text>
<rect x="104" y="256" width="320" height="76" rx="10" fill="#F08A5922" stroke="#F08A59" stroke-width="1.5"/>
<text x="124" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">선택 평문 공격</text>
<text x="124" y="302" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">chosen-plaintext</text>
<path d="M 264 424 L 264 348" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)" stroke-dasharray="5 5"/>
<text x="264" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">침입자가 쥔 것이 늘어나는 방향</text>
<rect x="540" y="144" width="436" height="76" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="540" y="144" width="8" height="76" rx="3" fill="#6A95D888" stroke="#6A95D8" stroke-width="0"/>
<text x="564" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">가로챈 암호문만 있고 평문 내용은 모릅니다.</text>
<text x="564" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앞 절의 통계 분석이 여기서 쓰입니다.</text>
<rect x="540" y="232" width="436" height="76" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="540" y="232" width="8" height="76" rx="3" fill="#E3B34188" stroke="#E3B341" stroke-width="0"/>
<text x="564" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">평문과 암호문의 대응 일부를 압니다.</text>
<text x="564" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">bob 과 alice 가 있다는 짐작이 맞은 경우입니다.</text>
<rect x="540" y="320" width="436" height="76" rx="7" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="540" y="320" width="8" height="76" rx="3" fill="#F08A5988" stroke="#F08A59" stroke-width="0"/>
<text x="564" y="350" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">평문을 골라 그 암호문을 얻습니다.</text>
<text x="564" y="372" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">the quick brown fox … 를 보내게 하면 됩니다.</text>
<rect x="540" y="416" width="436" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="560" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">원문이 남긴 단서</text>
<text x="560" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">더 정교한 기법에서는 선택 평문 공격이 가능하다는 것이</text>
<text x="560" y="488" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">곧 깨진다는 뜻은 아닙니다. 블록 암호로 넘어가는 다리입니다.</text>
<line x1="12" y1="504" x2="952" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="526" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="516" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">암호문만</text>
<rect x="196" y="516" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="218" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">대응 일부까지</text>
<rect x="331" y="516" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="353" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평문을 고를 수 있음</text>
</svg>
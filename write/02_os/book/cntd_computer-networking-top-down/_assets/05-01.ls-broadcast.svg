<text x="20" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가운데 칸의 파란 링크는 u 의 패킷이 2 홉째에 지나가는 길이지 그 링크의 비용이 알려졌다는 뜻이 아닙니다. 링크 비용은 그 링크에 붙은 노드가 자기 차례에 광고합니다.</text>
<text x="20" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">퍼뜨리기가 끝나면 모두가 같은 입력을 갖습니다. 같은 알고리즘을 돌리므로 최소 비용 경로 집합도 같지만, 출발점이 달라 표는 저마다 다릅니다.</text>

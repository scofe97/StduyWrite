<title id="dt">자기 링크만 알던 노드가 지도를 갖게 됩니다</title><desc id="dd">각 노드가 자기에게 붙은 링크의 비용만 아는 상태에서 시작해 링크 상태 패킷을 망 전체에 퍼뜨리고, 그 결과 모두가 똑같고 완전한 지도를 갖게 되는 세 단계.</desc>
<rect width="1000" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 5.2.1 · LINK STATE BROADCAST</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">자기 링크만 알던 노드가 지도를 갖게 됩니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">u 한 대의 패킷만 따라 그렸습니다 — 나머지 다섯도 똑같이 자기 패킷을 뿌립니다</text>
<rect x="20" y="138" width="300" height="366" rx="10" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="170" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">1. u 가 아는 것은 자기 링크 셋뿐</text>
<text x="170" y="522" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">나머지 일곱 간선은 u 에게 아직 없습니다</text>
<rect x="350" y="138" width="300" height="366" rx="10" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="500" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">2. u 의 패킷이 몇 홉째에 닿는가</text>
<text x="500" y="522" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">받은 노드가 다시 이웃에게 넘깁니다</text>
<rect x="680" y="138" width="300" height="366" rx="10" fill="#F5F5F305" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="830" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">3. 여섯이 다 뿌리면 지도가 완성</text>
<text x="830" y="522" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">간선 열 개가 모두에게 모입니다</text>

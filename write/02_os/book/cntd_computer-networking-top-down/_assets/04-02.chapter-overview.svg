<title id="dt">줄은 어디에 서고 누가 먼저 나가는가 — 다섯 박자로 읽는 지도</title><desc id="dd">04-02 편의 전체 구조. 줄이 서는 두 자리(입력·출력)에서 출발해 버퍼를 얼마나 둘지, 누가 먼저 나갈지를 거쳐 그 순서를 누가 정하느냐는 정책 물음에 닿는다.</desc>
<rect width="1000" height="406" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 04-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">줄은 어디에 서고 누가 먼저 나가는가 — 다섯 박자로 읽는 지도</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">입력 줄 → 출력 줄 → 얼마나 둘까 → 누가 먼저 → 누가 정하나</text>
<text x="99.6" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§1</text>
<rect x="12.0" y="132" width="175.2" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="99.6" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">입력 줄</text>
<line x1="26.0" y1="182" x2="173.2" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="99.6" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">패브릭이 느리면 선다</text>
<text x="24.0" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· N 배 빠르면 안 선다</text>
<text x="24.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· HOL 블로킹</text>
<text x="24.0" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 58% 에서 발산</text>
<path d="M 189.2 230.0 L 200.2 230.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="290.79999999999995" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§2</text>
<rect x="203.2" y="132" width="175.2" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="290.79999999999995" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">출력 줄</text>
<line x1="217.2" y1="182" x2="364.4" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="290.79999999999995" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">빨라도 생긴다</text>
<text x="215.2" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 출력 링크는 하나</text>
<text x="215.2" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 꼬리 버리기</text>
<text x="215.2" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· AQM 선제 표시</text>
<path d="M 380.4 230.0 L 391.4 230.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="482.0" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§3</text>
<rect x="394.4" y="132" width="175.2" height="196" rx="6" fill="#F08A5910" stroke="#F08A59" stroke-width="1.4"/>
<text x="482.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">얼마나 둘까</text>
<line x1="408.4" y1="182" x2="555.5999999999999" y2="182" stroke="#F08A5944" stroke-width="0.9"/>

<text x="406.4" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· RTT × C</text>
<text x="406.4" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 흐름 많으면 ÷√N</text>
<text x="406.4" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 버퍼블로트</text>
<path d="M 571.5999999999999 230.0 L 582.5999999999999 230.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="673.1999999999999" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§4</text>
<rect x="585.5999999999999" y="132" width="175.2" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="673.1999999999999" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">누가 먼저</text>
<line x1="599.5999999999999" y1="182" x2="746.8" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="673.1999999999999" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">규율 넷</text>
<text x="597.5999999999999" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· FIFO · 우선순위</text>
<text x="597.5999999999999" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 라운드 로빈 · WFQ</text>
<text x="597.5999999999999" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 일 보존</text>
<path d="M 762.8 230.0 L 773.8 230.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="864.4" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§5</text>
<rect x="776.8" y="132" width="175.2" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="864.4" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">누가 정하나</text>
<line x1="790.8" y1="182" x2="938.0" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="864.4" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">기술에서 정책으로</text>
<text x="788.8" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 클래스는 ISP 가</text>
<text x="788.8" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· 망 중립성</text>
<text x="788.8" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">· FCC 2015 → 2024</text>
<text x="500.0" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">강조된 칸이 이 편의 한 줄입니다 — 버퍼는 소금 같아서 알맞으면 낫게 하고 많으면 못 먹게 합니다.</text>

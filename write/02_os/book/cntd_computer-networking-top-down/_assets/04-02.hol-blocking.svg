<title id="dt">자기 출구가 비어 있는데도 못 나갑니다</title><desc id="dd">원문 Figure 4.8. 두 입력 큐의 맨 앞이 같은 출력을 노려 하나가 막히고, 그 뒤에 선 패킷까지 함께 멈춘다.</desc>
<rect width="1000" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 04-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">자기 출구가 비어 있는데도 못 나갑니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">막힌 것은 앞 패킷인데 손해를 보는 것은 뒤 패킷입니다</text>
<line x1="176" y1="132" x2="960" y2="132" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">입력 큐 1</text>
<text x="12" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">위쪽 입력 포트</text>
<line x1="176" y1="268" x2="960" y2="268" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">입력 큐 2</text>
<text x="12" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">아래쪽 입력 포트</text>
<line x1="176" y1="392" x2="960" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="252.0" y="171.0" width="96" height="46" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.4"/>
<text x="300" y="190.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">A1</text>
<text x="300" y="208.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">→ 출력 1</text>
<rect x="158.0" y="171.0" width="96" height="46" rx="5" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="206" y="190.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">A2</text>
<text x="206" y="208.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">→ 출력 2</text>
<rect x="252.0" y="307.0" width="96" height="46" rx="5" fill="#E3B34114" stroke="#E3B341" stroke-width="1.4"/>
<text x="300" y="326.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">B1</text>
<text x="300" y="344.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">→ 출력 1</text>
<rect x="158.0" y="307.0" width="96" height="46" rx="5" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="206" y="326.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">B2</text>
<text x="206" y="344.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">→ 출력 2</text>
<rect x="680" y="164.0" width="160" height="60" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="760" y="190.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">출력 포트 1</text>
<text x="760" y="210.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">이번에 A1 을 받음</text>
<rect x="680" y="300.0" width="160" height="60" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>
<text x="760" y="326.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">출력 포트 2</text>
<text x="760" y="346.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">비어 있음</text>
<path d="M 354.0 194.0 L 674 194.0" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="530.0" y="180.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">건넙니다</text>
<path d="M 354.0 330.0 L 480 330.0 L 480 228.0" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)" stroke-dasharray="5 4"/>
<text x="500" y="316.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">같은 출력을 노려 막힙니다</text>
<path d="M 206 357.0 L 206 384.0 L 674 384.0 L 674 354.0" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)" stroke-dasharray="4 4"/>
<text x="300" y="374.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">출력 2 는 비어 있는데도 B2 가 함께 기다립니다</text>
<text x="24" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이것이 HOL 블로킹입니다. 줄 맨 앞이 막히면 뒤에 선 것도 자기 길이 열려 있는지와 무관하게 멈춥니다.</text>
<text x="24" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">도착률이 용량의 58%에 이르면 입력 큐가 무한히 길어집니다. 이 값의 닫힌 형태는 2 − √2 = 0.5858 입니다.</text>
<text x="24" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">절반을 조금 넘긴 자리에서 무너지므로, 입력 큐잉 방식은 링크를 절반 남짓밖에 못 씁니다.</text>
<line x1="12" y1="544" x2="952" y2="544" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="566" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="556" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자기 길이 열렸는데 막힌 패킷</text>
<rect x="352" y="556" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="374" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">경쟁에서 진 패킷</text>
<rect x="513" y="556" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="535" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">건너간 패킷</text>
</svg>
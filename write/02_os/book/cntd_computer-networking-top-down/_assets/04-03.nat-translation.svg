<title id="dt">나갈 때 출발지를, 들어올 때 목적지를</title><desc id="dd">NAT 라우터가 나가는 데이터그램의 출발지와 들어오는 데이터그램의 목적지를 다시 쓰는 왕복. 가운데 변환 표 한 줄이 두 방향을 이어 준다.</desc>
<rect width="940" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NAT · REWRITE AND RESTORE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">나갈 때 출발지를, 들어올 때 목적지를</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">값은 원문 Figure 4.25 그대로입니다</text>
<text x="169" y="104" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">집 안</text>
<text x="470" y="104" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">NAT 라우터 · 138.76.29.7</text>
<text x="771" y="104" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">인터넷 · 128.119.40.186</text>
<rect x="24" y="126" width="290" height="52" rx="6" fill="#161B22" stroke="#8B98A966" stroke-width="0.9"/>

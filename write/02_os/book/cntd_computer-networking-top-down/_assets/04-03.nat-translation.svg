<text x="38" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">src 10.0.0.1:3345    dst 128.119.40.186:80</text>
<rect x="626" y="126" width="290" height="52" rx="6" fill="#161B22" stroke="#F08A5966" stroke-width="1.4"/>
<text x="640" y="147" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">NAT 이 출발지를 바꿔 적었습니다</text>
<text x="640" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">src 138.76.29.7:5001  dst 128.119.40.186:80</text>
<path d="M 318 152 L 620 152" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>

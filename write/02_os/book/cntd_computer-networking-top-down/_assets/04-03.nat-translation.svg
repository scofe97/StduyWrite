<text x="470" y="156" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">NAT</text>
<rect x="626" y="344" width="290" height="52" rx="6" fill="#161B22" stroke="#8B98A966" stroke-width="0.9"/>
<text x="640" y="365" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">웹 서버가 그대로 되돌려 보냅니다</text>
<text x="640" y="384" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">src 128.119.40.186:80  dst 138.76.29.7:5001</text>
<rect x="24" y="344" width="290" height="52" rx="6" fill="#161B22" stroke="#F08A5966" stroke-width="1.4"/>
<text x="38" y="365" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">NAT 이 목적지를 되돌렸습니다</text>
<text x="38" y="384" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">src 128.119.40.186:80  dst 10.0.0.1:3345</text>
<path d="M 620 370 L 318 370" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>

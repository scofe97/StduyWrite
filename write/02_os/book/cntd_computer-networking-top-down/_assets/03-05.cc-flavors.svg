<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">2024년 기준 BBR 이 나머지를 합친 것보다 많이 쓰입니다</text>

<title id="dt">시나리오 1 — 버퍼가 무한하면 잃지는 않지만 기다립니다</title><desc id="dd">원문 Figure 3.43·3.44. 처리량은 R/2 에서 멈추고, 그 근처에서 큐잉 지연이 무한대로 치솟는다.</desc>

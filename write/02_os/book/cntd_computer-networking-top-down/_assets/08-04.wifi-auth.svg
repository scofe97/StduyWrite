<title id="dt">확인하는 상대가 환경에 따라 다릅니다</title><desc id="dd">개인용은 AP 와 직접 인증하고, 기업용은 인증 서버와 인증하며 AP 는 통과 장치가 된다.</desc>
<rect width="1000" height="668" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SECTION 8.8.1 · WIFI AUTHENTICATION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">확인하는 상대가 환경에 따라 다릅니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 환경의 구성과 SAE 네 단계는 원문 §8.8.1 의 것입니다</text>
<text x="360.0" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">누구와 인증하나</text>
<text x="600.0" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">쓰는 프로토콜</text>
<text x="840.0" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">끝나면</text>
<line x1="240" y1="138" x2="960" y2="138" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="24" y="148" width="200" height="104" rx="6" fill="#F08A5916" stroke="#F08A59" stroke-width="1.3"/>
<text x="124.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">개인용</text>
<text x="124.0" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">WPA3-Personal</text>
<rect x="246" y="164" width="228" height="72" rx="4" fill="#F08A5920" stroke="#F08A59" stroke-width="1.2"/>
<text x="360.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">기기가 AP 와 직접</text>
<rect x="486" y="164" width="228" height="72" rx="4" fill="#F08A5920" stroke="#F08A59" stroke-width="1.2"/>
<text x="600.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">SAE 네 단계</text>
<rect x="726" y="164" width="228" height="72" rx="4" fill="#F08A5920" stroke="#F08A59" stroke-width="1.2"/>
<text x="840.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">PMK 를 각자 유도</text>
<rect x="24" y="272" width="200" height="104" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.3"/>
<text x="124.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">기업용</text>
<text x="124.0" y="340" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">WPA3-Enterprise</text>
<rect x="246" y="288" width="228" height="72" rx="4" fill="#6A95D820" stroke="#6A95D8" stroke-width="1.2"/>
<text x="360.0" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">기기가 인증 서버와</text>
<rect x="486" y="288" width="228" height="72" rx="4" fill="#6A95D820" stroke="#6A95D8" stroke-width="1.2"/>
<text x="600.0" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">802.1X · EAP-TTLS</text>
<rect x="726" y="288" width="228" height="72" rx="4" fill="#6A95D820" stroke="#6A95D8" stroke-width="1.2"/>
<text x="840.0" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">서버가 AP 에 PMK 전달</text>
<rect x="24" y="408" width="470" height="180" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">SAE 네 단계 — Dragonfly 열쇠 교환</text>
<line x1="44" y1="448" x2="474" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="44" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1. 클라이언트 커밋 — element1 과 논스</text>
<text x="44" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">2. AP 커밋 — element2 와 논스</text>
<text x="44" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">3. 클라이언트 확인 — 앞선 값들의 해시</text>
<text x="44" y="538" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">4. AP 확인 — 받은 해시 검사 후 자기 해시</text>
<text x="44" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">공유 비밀을 망으로 보내지 않고 서로를 확인합니다.</text>
<rect x="514" y="408" width="462" height="180" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="534" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">메시지가 실려 가는 길</text>
<line x1="534" y1="448" x2="956" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="534" y="476" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">EAP</text>
<text x="624" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기기 ↔ 인증 서버 종단 간</text>
<text x="534" y="502" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">EAPoL</text>
<text x="624" y="502" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">무선 구간에서 EAP 를 감쌈</text>
<text x="534" y="528" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">RADIUS</text>
<text x="624" y="528" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">AP ↔ 인증 서버, UDP/IP 위</text>
<text x="534" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">카페 비밀번호는 모두가 공유합니다. 모르는 사람만 막힙니다.</text>
<line x1="12" y1="608" x2="952" y2="608" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="630" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="620" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">개인용</text>
<rect x="183" y="620" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="205" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기업용</text>
<rect x="266" y="620" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="288" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">종단 간</text>
<rect x="362" y="620" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="384" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">주의할 점</text>

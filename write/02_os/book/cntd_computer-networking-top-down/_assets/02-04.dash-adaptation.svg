<rect x="589.6666666666667" y="325.0" width="56.666666666666664" height="20" rx="3" fill="#F08A591c" stroke="#F08A59" stroke-width="1.2"/>
<rect x="652.3333333333333" y="325.0" width="56.666666666666664" height="20" rx="3" fill="#F08A591c" stroke="#F08A59" stroke-width="1.2"/>
<rect x="715.0" y="195.0" width="56.666666666666664" height="20" rx="3" fill="#F08A591c" stroke="#F08A59" stroke-width="1.2"/>
<rect x="777.6666666666666" y="195.0" width="56.666666666666664" height="20" rx="3" fill="#F08A591c" stroke="#F08A59" stroke-width="1.2"/>
<rect x="840.3333333333334" y="195.0" width="56.666666666666664" height="20" rx="3" fill="#F08A591c" stroke="#F08A59" stroke-width="1.2"/>
<text x="148" y="468" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">대역폭이 3 Mbps 아래로 떨어지자 다음 청크부터 1 Mbps 판으로, 더 떨어지자 300 kbps 판으로 내려갑니다.</text>
<text x="148" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">회복되면 다시 올라갑니다. 판을 갈아타는 판단이 청크마다 새로 이뤄집니다.</text>
<text x="20" y="528" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버가 준비하는 것은 판마다의 파일과 매니페스트뿐입니다. 무엇을 언제 가져갈지는 클라이언트가 측정한 대역폭과 버퍼 잔량으로 정합니다.</text>
<line x1="12" y1="584" x2="952" y2="584" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="606" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="596" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클라이언트가 고른 청크</text>
<rect x="300" y="596" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="322" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">쓸 수 있는 대역폭</text>

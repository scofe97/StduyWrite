<title id="dt">받을 수 있는 만큼만 요청합니다</title><desc id="dd">쓸 수 있는 대역폭이 시간에 따라 변할 때 클라이언트가 어느 판의 청크를 고르는지. 세 판의 비트율은 원문의 예이고 시계열은 모양만 옮긴 질적 그림이다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPUTER NETWORKING TOP-DOWN · 02-04 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">받을 수 있는 만큼만 요청합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">선택하는 쪽이 서버가 아니라 클라이언트입니다 — 청크마다 다시 정합니다</text>
<line x1="148" y1="380.5" x2="900" y2="380.5" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="136" y="384.5" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">300 kbps</text>
<line x1="148" y1="335.0" x2="900" y2="335.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="136" y="339.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">1 Mbps</text>
<line x1="148" y1="205.0" x2="900" y2="205.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="136" y="209.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">3 Mbps</text>
<line x1="148" y1="140" x2="148" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="148" y1="400" x2="900" y2="400" stroke="#8B98A9" stroke-width="1.0"/>
<text x="136" y="124" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">비트율</text>
<text x="524.0" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">시간 — 청크 하나가 몇 초입니다</text>
<polyline points="179.3,166.0 242.0,179.0 304.7,172.5 367.3,231.0 430.0,309.0 492.7,341.5 555.3,354.5 618.0,322.0 680.7,257.0 743.3,185.5 806.0,172.5 868.7,179.0" fill="none" stroke="#6A95D8" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="151.0" y="195.0" width="56.666666666666664" height="20" rx="3" fill="#F08A591c" stroke="#F08A59" stroke-width="1.2"/>
<rect x="213.66666666666666" y="195.0" width="56.666666666666664" height="20" rx="3" fill="#F08A591c" stroke="#F08A59" stroke-width="1.2"/>

<title id="dt">왕복 횟수별 혼잡 창(cwnd) 증가 추세 (계산 예시)</title><desc id="dd">초기 창 IW=1 에서 시작해 ssthresh=16 에 도달할 때까지 매 왕복마다 cwnd 가 두 배로 급증한다. ssthresh 에 도달하면 혼잡 회피로 전환되어 왕복당 1 SMSS 씩 선형 증가한다. 지연 ACK 환경에서는 증가율이 완만해진다.</desc>

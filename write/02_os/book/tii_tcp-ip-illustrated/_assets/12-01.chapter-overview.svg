<text x="422" y="315" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§4</text>
<rect x="448" y="292" width="200" height="36" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="0.8"/>
<text x="460" y="315" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">Window Size 16비트</text>
<text x="638" y="315" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§8</text>
<rect x="664" y="292" width="200" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="676" y="315" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">15장 창 관리</text>
<rect x="12" y="332" width="208" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="355" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">가운데 망이 막힌다</text>
<rect x="232" y="332" width="200" height="36" rx="4" fill="#6A95D810" stroke="#6A95D8" stroke-width="0.8"/>
<text x="244" y="355" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">망 신호로 줄임 = 혼잡 제어</text>
<text x="422" y="355" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§4</text>
<rect x="448" y="332" width="200" height="36" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="0.8"/>
<text x="460" y="355" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">손실 짐작 · CWR·ECE</text>
<text x="638" y="355" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§8</text>
<rect x="664" y="332" width="200" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="676" y="355" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">16장 혼잡 제어</text>
<rect x="12" y="372" width="208" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="395" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">얼마나 기다리나</text>
<rect x="232" y="372" width="200" height="36" rx="4" fill="#6A95D810" stroke="#6A95D8" stroke-width="0.8"/>
<text x="244" y="395" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">RTT 추정 · RTO</text>
<text x="422" y="395" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§5</text>
<rect x="448" y="372" width="200" height="36" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="0.8"/>
<text x="460" y="395" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">창마다 타이머 하나</text>
<text x="638" y="395" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§7</text>

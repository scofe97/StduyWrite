<text x="24" y="195" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">손실 · 비트 오류</text>
<rect x="232" y="172" width="200" height="36" rx="4" fill="#6A95D810" stroke="#6A95D8" stroke-width="0.8"/>
<text x="244" y="195" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">재전송 · ACK · 체크섬</text>
<text x="422" y="195" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§1</text>

<title id="dt">12장 전체 지도 — 일반 원리가 TCP 장치가 되는 자리</title><desc id="dd">신뢰 전달이 풀어야 할 문제 여섯을 행으로 두고, 12.1 이 말하는 일반 해법과 TCP 가 그것을 구현한 장치, 그리고 그 장치를 자세히 다루는 뒷장을 같은 행에 놓았다. 셀 아래 절 번호가 이 노트에서 그 칸을 다루는 곳이다.</desc>
<rect width="912" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 12-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">12장 전체 지도 — 일반 원리가 TCP 장치가 되는 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽 열을 먼저 익히면 오른쪽의 헤더 필드가 왜 거기 있는지 읽힙니다</text>
<rect x="12" y="104" width="208" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="116.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">풀어야 할 문제</text>
<text x="116.0" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">12.1.1 의 질문들</text>
<rect x="232" y="104" width="200" height="52" rx="6" fill="#2A3140" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="332.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">일반 해법</text>
<text x="332.0" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">12.1 · §1–§5</text>
<rect x="448" y="104" width="200" height="52" rx="6" fill="#2A3140" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="548.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">TCP 의 구현</text>
<text x="548.0" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">12.2–12.3 · §6–§8</text>
<rect x="664" y="104" width="200" height="52" rx="6" fill="#2A3140" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="764.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">더 깊이</text>
<text x="764.0" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 책의 다음 장</text>

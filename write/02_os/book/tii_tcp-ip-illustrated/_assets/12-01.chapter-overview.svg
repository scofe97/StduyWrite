<text x="460" y="195" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">체크섬 틀리면 버리고 침묵</text>
<text x="638" y="195" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§7</text>
<rect x="664" y="172" width="200" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="676" y="195" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">14장 재전송</text>
<rect x="12" y="212" width="208" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="235" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">같은 패킷이 두 번</text>
<rect x="232" y="212" width="200" height="36" rx="4" fill="#6A95D810" stroke="#6A95D8" stroke-width="0.8"/>
<text x="244" y="235" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">순서 번호</text>
<text x="422" y="235" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§1</text>
<rect x="448" y="212" width="200" height="36" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="0.8"/>
<text x="460" y="235" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">바이트 단위 번호</text>
<text x="638" y="235" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§7 · §8</text>
<rect x="664" y="212" width="200" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="676" y="235" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">13장 ISN</text>
<rect x="12" y="252" width="208" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="275" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">하나씩이면 망이 논다</text>
<rect x="232" y="252" width="200" height="36" rx="4" fill="#6A95D810" stroke="#6A95D8" stroke-width="0.8"/>
<text x="244" y="275" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">여러 개를 띄우는 창</text>
<text x="422" y="275" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§2 · §3</text>
<rect x="448" y="252" width="200" height="36" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="460" y="275" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">누적 ACK 슬라이딩 윈도</text>
<text x="638" y="275" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">§7 · §8</text>
<rect x="664" y="252" width="200" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="676" y="275" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">15장 창 관리</text>
<rect x="12" y="292" width="208" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="315" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">받는 쪽이 느리다</text>
<rect x="232" y="292" width="200" height="36" rx="4" fill="#6A95D810" stroke="#6A95D8" stroke-width="0.8"/>

<title id="dt">패킷이 사라졌나, ACK 가 사라졌나</title><desc id="dd">왼쪽은 데이터 패킷이 가는 길에 버려진 경우, 오른쪽은 패킷은 도착했지만 돌아오는 ACK 가 버려진 경우다. 송신자 쪽에서는 두 판 모두 타이머가 만료될 때까지 ACK 를 못 받는 같은 장면이라 둘 다 다시 보낸다. 오른쪽 수신자는 같은 번호를 두 번 받게 되고, 순서 번호로 사본을 알아보고 버린다.</desc>
<rect width="920" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 12-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">패킷이 사라졌나, ACK 가 사라졌나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">송신자 레인만 보면 두 판이 똑같습니다 — 그래서 수신자 쪽에 번호가 필요합니다</text>
<text x="236.0" y="108" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">가는 패킷이 버려짐</text>

<path d="M 112 216 L 236.0 216" fill="none" stroke="#6A95D8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="246.0" y="221" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#F0616D">✕</text>

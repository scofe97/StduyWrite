<title id="dt">유휴 시간에 따른 혼잡 창 감쇠와 문턱 보존 (계산 예시)</title><desc id="dd">초기 cwnd = 32 SMSS, 직전 ssthresh = 16 SMSS 에서 1 RTO 이상의 유휴가 발생한 상황이다. CWV(RFC 2861)는 ssthresh 를 max(ssthresh, 3/4·cwnd) = 24 SMSS 로 보존하고, 유휴 1 RTO(RTT 상한)마다 cwnd 를 반감해 5 RTO 뒤 하한선 1 SMSS 에 도달한다.</desc>
<rect width="920" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 16-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">유휴 시간에 따른 혼잡 창 감쇠와 문턱 보존 (계산 예시)</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">유휴 RTO 마다 cwnd 는 반감되고 이전 기억은 ssthresh 가 보존합니다</text>

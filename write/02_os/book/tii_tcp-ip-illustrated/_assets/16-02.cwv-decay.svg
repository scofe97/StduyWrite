<text x="480.0" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">유휴 경과 시간 (1 RTO 단위, RTT 상한)</text>
<line x1="100" y1="213.33333333333334" x2="860" y2="213.33333333333334" stroke="#3FB98C" stroke-width="1.4" stroke-dasharray="6 4"/>

<title id="dt">유휴 연결에서 응답 판정까지 — 이 편의 지도</title><desc id="dd">위 줄은 데이터가 없는 연결 하나에서 keepalive 가 지나는 단계다. 아무것도 오가지 않는 연결(1)에 타이머가 만료되면 커널이 탐침을 보내고(2), 돌아온 응답이 연결을 살릴지 끊을지 가른다(3). 아래 줄은 각 단계를 겨냥하는 위험이다. 중간 장비의 상태 만료는 유휴 연결에(1), 탐침 간격 관찰은 탐침에(4), 위조 ACK 는 응답 판정에(4) 걸린다.</desc>
<rect width="920" height="456" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 17-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">유휴 연결에서 응답 판정까지 — 이 편의 지도</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">응답이 없는 이유는 TCP 가 구별하지 못합니다</text>
<path d="M 32 128 V 120 H 360 V 128" fill="none" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="196.0" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">아무것도 오가지 않는 구간</text>
<path d="M 384 128 V 120 H 888 V 128" fill="none" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="636.0" y="112" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">SO_KEEPALIVE 를 켠 쪽의 커널</text>
<path d="M 186 184.0 L 204 184.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 362 184.0 L 380 184.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 538 184.0 L 556 184.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 714 184.0 L 732 184.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="32" y="140" width="152" height="88" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="48" y="164" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">1</text>
<text x="48" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">유휴 연결</text>
<text x="48" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">데이터 0 · 상태만 유지</text>
<rect x="208" y="140" width="152" height="88" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="224" y="164" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">2</text>
<text x="224" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">keepalive 타이머</text>
<text x="224" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">유휴 시간 만료</text>
<rect x="384" y="140" width="152" height="88" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="400" y="164" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">2</text>
<text x="400" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">탐침</text>
<text x="400" y="212" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">seq = SND.UNA − 1</text>
<rect x="560" y="140" width="152" height="88" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="576" y="164" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">3</text>
<text x="576" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">응답 판정</text>
<text x="576" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">ACK · RST · 무응답</text>
<rect x="736" y="140" width="152" height="88" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="752" y="164" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">3</text>
<text x="752" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">종료와 오류</text>
<text x="752" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">RST 송수신 · errno</text>

<text x="42.0" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">NAT 가 상태를 지움</text>
<path d="M 460.0 296 L 460.0 234" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="380.0" y="300" width="160" height="64" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<text x="394.0" y="326" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">4 · 간격 관찰</text>
<text x="394.0" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">설정값 추정</text>
<path d="M 636.0 296 L 636.0 234" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="556.0" y="300" width="160" height="64" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<text x="570.0" y="326" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">4 · 위조 ACK</text>
<text x="570.0" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">자원을 계속 붙잡음</text>
<line x1="12" y1="400" x2="872" y2="400" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="422" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="412" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>

<title id="dt">ACK 없이 같은 요청을 다시 보내는 간격</title><desc id="dd">서버를 격리한 뒤 클라이언트가 18바이트 요청을 42.748초에 처음 보냈다. ACK 가 오지 않자 206ms 뒤 재전송했고, 그 뒤 간격은 420ms · 841ms · 1.68초 · 3.36초로 매번 거의 두 배가 됐다. 막대 하나가 직전 전송에서 다음 재전송까지 기다린 구간이고, 가로축은 캡처 시각(초)이다.</desc>

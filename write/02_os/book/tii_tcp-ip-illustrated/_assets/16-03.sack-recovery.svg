<text x="202.0" y="483" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">t=23.659s cwnd 27 도달 · 정상 선형 증가 재개</text>

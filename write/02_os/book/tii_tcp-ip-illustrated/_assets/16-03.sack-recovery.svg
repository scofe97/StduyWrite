<title id="dt">빠른 재전송과 SACK 복구 흐름 (사건 2)</title><desc id="dd">단일 중복 ACK의 SACK 블록으로 즉시 재전송하고 회복 지점을 넘을 때까지 복구를 유지합니다.</desc>

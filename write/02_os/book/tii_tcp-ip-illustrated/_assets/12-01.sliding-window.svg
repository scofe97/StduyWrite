<title id="dt">송신자의 창이 미끄러지는 한 걸음</title><desc id="dd">윗줄은 원서 그림 12-1 의 상태로 창 크기는 3 이다. 1–3 은 보내고 확인까지 받아 사본을 버렸고, 4–6 은 창 안이라 보냈거나 보낼 수 있으며, 7 부터는 창 밖이라 준비돼 있어도 못 보낸다. 아랫줄은 ACK 4 가 도착한 직후로, 창이 한 칸 오른쪽으로 옮겨 4 의 사본을 버리고 7 을 보낼 수 있게 됐다.</desc>

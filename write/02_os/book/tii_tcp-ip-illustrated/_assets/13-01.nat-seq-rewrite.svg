<title id="dt">페이로드를 고치는 NAT 는 번호도 고친다</title><desc id="dd">클라이언트가 seq 1000 부터 10바이트를 보내는데, 가운데 NAT 가 페이로드를 편집해 4바이트를 늘려 서버에 넘긴다. 서버는 14바이트를 받았으므로 ack 1014 를 돌려주고, NAT 는 그것을 클라이언트가 아는 번호 ack 1010 으로 되돌린다. 이후 이 방향의 번호는 계속 +4 만큼 어긋난 채 NAT 가 보정해야 한다. 수치는 설명용 예시다.</desc>
<rect width="920" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 13-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">페이로드를 고치는 NAT 는 번호도 고친다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">NAT 의 상태가 양 끝과 어긋나면 연결이 제대로 동작하지 않습니다</text>

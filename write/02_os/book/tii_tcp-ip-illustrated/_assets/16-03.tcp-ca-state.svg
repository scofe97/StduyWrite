<title id="dt">Linux 송신자의 다섯 가지 혼잡 상태 전이</title><desc id="dd">Open·Disorder·CWR·Recovery·Loss 사이를 오가며 창을 줄이고 타임아웃 오류 시 되돌립니다.</desc>
<rect width="920" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 16-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Linux 송신자의 다섯 가지 혼잡 상태 전이</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">실험의 11개 사건이 각 전이 경로를 그대로 밟습니다</text>
<rect x="380" y="120" width="160" height="60" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="460" y="146" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">Open (0)</text>
<text x="460" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 혼잡 회피</text>
<rect x="680" y="120" width="160" height="60" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="760" y="146" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Disorder (1)</text>
<text x="760" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">순서 어긋남 감지</text>
<rect x="680" y="310" width="160" height="60" rx="8" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="760" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">Recovery (3)</text>
<text x="760" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">빠른 재전송 복구</text>
<rect x="80" y="215" width="160" height="60" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="160" y="241" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">CWR (2)</text>
<text x="160" y="261" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">창 축소 진행</text>
<rect x="380" y="320" width="160" height="60" rx="8" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="460" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">Loss (4)</text>
<text x="460" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">RTO 만료 재시작</text>
<path d="M 540 135 L 676 135" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<text x="610" y="125" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">중복 ACK [4,8]</text>
<path d="M 676 160 L 544 160" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="548" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">누적 ACK 수신</text>
<path d="M 760 180 L 760 306" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<text x="768" y="245" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">중복 ACK 누적 [4,8]</text>
<path d="M 540 170 L 640 170 L 640 325 L 676 325" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<text x="648" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">SACK 즉시</text>
<text x="648" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">판정 [2]</text>
<path d="M 840 340 L 872 340 L 872 75 L 460 75 L 460 116" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="610" y="65" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">회복 지점 도달 [2,4,8]</text>
<path d="M 380 140 L 160 140 L 160 211" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#warn)"/>
<text x="270" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">로컬 큐 포화 [1,3,5,6,9]</text>
<path d="M 240 230 L 270 230 L 270 165 L 376 165" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="215" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">cwnd&lt;=ssthresh</text>
<text x="215" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">[1,3,5]</text>
<path d="M 160 275 L 160 350 L 376 350" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<text x="265" y="365" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">CWR 중 RTO 만료 [7,10]</text>
<path d="M 400 180 L 400 316" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<text x="392" y="248" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">RTO 만료 [11]</text>
<path d="M 450 320 L 450 184" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)" stroke-dasharray="4 4"/>
<text x="458" y="235" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">헛 RTO 취소</text>
<text x="458" y="249" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">[7,10]</text>
<path d="M 535 320 L 535 184" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="543" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">느린 시작 완료</text>
<text x="543" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">[11]</text>
<line x1="12" y1="456" x2="872" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="478" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="468" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 (Open)</text>
<rect x="261" y="468" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="283" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어긋남 (Disorder)</text>
<rect x="487" y="468" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="509" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">로컬 제동 (CWR)</text>
<rect x="674" y="468" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="696" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">복구 (Recovery)</text>

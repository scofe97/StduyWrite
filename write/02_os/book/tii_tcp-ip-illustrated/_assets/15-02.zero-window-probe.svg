<title id="dt">0 창 광고와 persist 타이머의 창 탐침</title><desc id="dd">수신 버퍼가 차면 win 0을 광고해 송신을 멈춘다. 수신 앱이 읽기를 멈춘 동안 송신자는 5초 간격으로 세 차례 1바이트 창 탐침을 보내 최신 창 상태를 확인하고, 소비 시작 후 창 업데이트로 전송을 재개한다.</desc>
<rect width="920" height="730" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 15-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">0 창 광고와 persist 타이머의 창 탐침</text>

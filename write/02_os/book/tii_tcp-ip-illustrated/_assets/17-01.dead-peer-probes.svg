<title id="dt">응답이 끊긴 상대 — 탐침 3회 뒤 RST</title><desc id="dd">OrbStack Ubuntu 의 네임스페이스 두 개에서 클라이언트에 TCP_KEEPIDLE 2 · TCP_KEEPINTVL 1 · TCP_KEEPCNT 3 을 걸고 잡은 순서다. 처음 두 탐침은 ACK 를 받아 타이머가 유휴 시간으로 돌아가고, 서버 쪽 수신을 막은 뒤의 세 탐침은 1초 간격으로 나가며 응답이 없다. 마지막 탐침에서 한 간격이 지난 9.23초에 클라이언트가 RST 를 보내고 recv 는 ETIMEDOUT 로 끝난다. 세로 간격은 시간에 비례하지 않는다.</desc>

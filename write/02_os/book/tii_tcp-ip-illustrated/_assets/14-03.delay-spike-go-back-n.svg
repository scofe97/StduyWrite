<title id="dt">ACK 가 늦으면 이미 받은 세그먼트까지 다시 간다</title><desc id="dd">송신자가 5–8 을 보냈고 수신자는 모두 받았다. 그 뒤 ACK 경로가 갑자기 느려져 A5–A8 이 오는 동안 5 의 RTO 가 먼저 만료되고 5 가 재전송된다. 이어 도착한 원본 5 의 ACK 에 맞춰 송신자는 6 을, A6 에 맞춰 7 을, A7 에 맞춰 8 을 다시 보낸다. 수신자에는 5–8 이 한 번씩 더 도착하고 중복 ACK 가 돌아간다. 패킷 번호와 '이미 도착한 것' 을 가리키는 ACK 는 원서 그림의 단순화를 따른다.</desc>
<rect width="920" height="904" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TCP/IP ILLUSTRATED VOL.1 · 14-03 §1</text>

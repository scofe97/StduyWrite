<title id="dt">MSS 1460 인데 1448바이트씩 실리는 이유</title><desc id="dd">MSS 는 IP·TCP 기본 헤더 40바이트만 뺀 데이터 상한이라 MTU 1500 에서 1460 이다. 그런데 Timestamps 옵션을 쓰면 세그먼트마다 12바이트(옵션 10 + NOP 2)가 더 붙어 실제 데이터는 1448바이트씩 실린다. 경로 MTU 가 1000 으로 줄면 같은 계산으로 948바이트가 된다. 막대 길이는 바이트 수에 비례한다.</desc>

<title id="dt">재전송은 원래 세그먼트 경계를 따르지 않는다</title><desc id="dd">Telnet 으로 hello there 13바이트를 보내 확인받은 뒤, 다음 줄은 케이블을 뺀 사이 사라지고 재연결 뒤 and 3 이 순서 번호 29 부터 도착했다. 수신자는 ACK 14 와 SACK [29,36) 을 보낸다. 송신자는 14 부터 35 까지를 22바이트 세그먼트 하나로 다시 보냈고, 이 세그먼트는 SACK 으로 알려진 구간과 겹치며 FIN 도 싣는다.</desc>

<title id="dt">확장은 아래 층부터 — PV → VG → LV → 파일시스템</title><desc id="dd">VG 에 Free PE 를 확보하고 lvextend 로 LV 를 확장한 뒤 resize2fs 로 ext4 블록 그룹을 추가한다. ext4 주소는 LV 주소와 같아 LV 가 커지기 전에 ext4 를 먼저 늘릴 수 없다.</desc>
<rect width="920" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">확장은 아래 층부터 — PV → VG → LV → 파일시스템</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 층은 아래 층에 이미 확보된 공간만 쓴다 — 그래서 확장은 아래 층부터 올라간다</text>
<text x="24" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">파일시스템</text>
<text x="24" y="161" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">ext4 /mnt/lv</text>
<text x="24" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">LV</text>
<text x="24" y="223" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">vg0/data</text>
<text x="24" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">VG · PV</text>
<text x="24" y="285" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">/dev/sdb · PE 풀</text>
<path d="M 348.5 248 L 348.5 232" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 348.5 186 L 348.5 170" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="136.0" y="252" width="170.0" height="38" rx="4" fill="#161B22" stroke="#8B98A9" stroke-width="1"/>
<text x="221.0" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">기존 PE 50개</text>
<rect x="306.0" y="252" width="85.0" height="38" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="348.5" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">Free PE 25개</text>
<rect x="391.0" y="252" width="42.5" height="38" rx="4" fill="none" stroke="#5E6B7E" stroke-width="1" stroke-dasharray="4 3"/>
<text x="412.25" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">(예)</text>

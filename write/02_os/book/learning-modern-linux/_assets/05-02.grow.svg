<text x="221.0" y="214" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">200M (LE 0~49)</text>
<rect x="306.0" y="190" width="85.0" height="38" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="348.5" y="214" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">+100M</text>
<rect x="136.0" y="128" width="170.0" height="38" rx="4" fill="#161B22" stroke="#8B98A9" stroke-width="1"/>
<text x="221.0" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">기존 블록 그룹</text>
<rect x="306.0" y="128" width="85.0" height="38" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="348.5" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">새 블록 그룹 추가</text>
<circle cx="453.5" cy="271.0" r="10" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="453.5" y="275.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">1</text>
<circle cx="453.5" cy="209.0" r="10" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="453.5" y="213.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">2</text>
<circle cx="453.5" cy="147.0" r="10" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="453.5" y="151.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">3</text>
<text x="469.5" y="276" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">pvresize · vgextend</text>
<text x="469.5" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">lvextend -L +100M</text>
<text x="469.5" y="152" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">resize2fs</text>
<rect x="624" y="128" width="272" height="162" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="638" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">ext4 주소 = LV 주소</text>
<text x="638" y="170" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">• 두 층 사이 번역표 없음 (1:1)</text>
<text x="638" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">• LVM 표는 LE→PE 한 곳뿐</text>
<line x1="636" y1="204" x2="884" y2="204" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="638" y="224" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">ext4 먼저 키우면?</text>
<text x="638" y="246" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">하위 LV 가 늘어나지 않아 새 블록</text>
<text x="638" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">그룹 메타데이터를 쓸 주소가 없음</text>
<text x="638" y="282" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">→ 아래 장치부터 키워야 함</text>
<rect x="24" y="314" width="872" height="38" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="38" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">실무 팁: lvextend -r (--resizefs) — 2단계(LV 확장)와 3단계(resize2fs) 일괄 처리</text>
<line x1="12" y1="372" x2="872" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="394" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="384" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">확장 방향</text>
<rect x="209" y="384" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="231" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기존 할당 공간</text>
<rect x="357" y="384" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="379" y="394" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">새로 확장된 영역</text>
<rect x="518" y="384" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>

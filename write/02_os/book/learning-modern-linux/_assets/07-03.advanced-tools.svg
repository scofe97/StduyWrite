<title id="dt">고급 도구도 결국 네 층 어딘가를 본다</title><desc id="dd">저자가 고급으로 묶은 것들을 07-01 에서 세운 네 층 위에 얹은 것. 하나만 층을 가로지르는데, 그것이 이 장 전체를 한 화면에 보이는 도구다.</desc>
<rect width="880" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-03 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">고급 도구도 결국 네 층 어딘가를 본다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">tshark 한 화면에 네 층이 다 있습니다</text>
<rect x="32" y="168" width="560" height="78" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="50" y="194" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#E3B341">애플리케이션 · L7</text>
<text x="50" y="216" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">whois · DHCP(dhcpdump) · NTP(ntpq)</text>
<text x="50" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">등록 정보 · IP 자동 배정 · 시계 동기화</text>
<rect x="32" y="256" width="560" height="78" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="50" y="282" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#3FB98C">전송 · L4</text>
<text x="50" y="304" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">socat · 터널(inlets)</text>
<text x="50" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">양방향 바이트 스트림 · VPN 의 대안</text>
<rect x="32" y="344" width="560" height="78" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="50" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#6A95D8">인터넷 · L3</text>
<text x="50" y="392" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">geoiplookup · BitTorrent</text>
<text x="50" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IP 를 지리에 대응 · 개인 간 전송</text>
<rect x="32" y="432" width="560" height="78" rx="8" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>
<text x="50" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#8B98A9">링크 · L2</text>
<text x="50" y="480" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">ip link 로 고른 인터페이스</text>
<text x="50" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">캡처가 시작되는 자리</text>
<rect x="608" y="168" width="240" height="342" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.5"/>
<text x="728.0" y="208" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="17" font-weight="600" fill="#F08A59">tshark</text>
<text x="728.0" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">wireshark</text>
<text x="728.0" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">네 층을</text>
<text x="728.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">한꺼번에</text>
<text x="728.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">가로지릅니다</text>
<text x="728.0" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">-i 로 인터페이스를</text>
<text x="728.0" y="370" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">고르고 필터로</text>
<text x="728.0" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">층을 좁힙니다</text>
<text x="728.0" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">tcpdump 로도</text>
<text x="728.0" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">같은 일을 합니다</text>
<rect x="32" y="530" width="816" height="84" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="52" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">출력 한 줄에 네 층이 다 있습니다</text>
<text x="52" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">192.168.178.40 → 185.199.109.153 이 인터넷 계층이고, 47618 → 443 이 전송 계층이며,</text>
<text x="52" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">GET / HTTP/1.1 이 애플리케이션 계층, -i wlp1s0 이 링크 계층입니다.</text>
<line x1="12" y1="642" x2="832" y2="642" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="664" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="654" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="664" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사용자를 만나는 층</text>
<rect x="274" y="654" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="296" y="664" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">포트가 있는 층</text>
<rect x="422" y="654" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="444" y="664" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">주소가 정해지는 층</text>
<rect x="596" y="654" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="618" y="664" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">층을 가로지르는 도구</text>
</svg>
<title id="dt">sed 가 한 줄을 읽어 바꾸고 내보내는 한 바퀴</title><desc id="dd">sed -n 's/^version=//p' 가 두 줄짜리 파일을 처리하는 순서. 한 줄을 패턴 스페이스에 올려 s 명령을 적용하고, 치환이 일어난 줄만 p 플래그로 찍는다. -n 이 끝의 자동 출력을 끈다.</desc>
<rect width="880" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">sed 가 한 줄을 읽어 바꾸고 내보내는 한 바퀴</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">치환이 일어난 줄만 출력에 닿습니다</text>
<path d="M 176.0 152.0 L 198.0 152.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 344.0 152.0 L 374 152.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 504 152.0 L 534.0 152.0" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="520.0" y="144.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">예</text>
<path d="M 680.0 152.0 L 702.0 152.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 440 188.0 L 440 204 L 776 204 L 776 182" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="450" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">아니오</text>
<path d="M 776 124 L 776 104 L 104 104 L 104 122" fill="none" stroke="#5E6B7E" stroke-width="1.1" marker-end="url(#soft)" stroke-dasharray="4 3"/>
<text x="440" y="96" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">다음 줄</text>
<rect x="32.0" y="124" width="144" height="56" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="104" y="148" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">줄 읽기</text>
<text x="104" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패턴 스페이스에 올림</text>

<title id="dt">자주 치는 것일수록 짧아야 한다</title><desc id="dd">3장 가운데 구간 노트의 절 여섯을 읽는 순서로 이은 지도. 1~3절이 지금 쓰는 셸에서 손을 덜 쓰는 법이고, 4~5절이 셸 자체를 갈아 끼우는 판단, 6절이 터미널을 쪼개 쓰는 법이다.</desc>
<rect width="880" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">자주 치는 것일수록 짧아야 한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">5절에서 저자가 자기 선택을 밝힙니다</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 724" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">아래를 갈아 끼워도 내 존 파일은 그대로다</title><desc id="dd">www 에 주소를 직접 적는 대신 CDN 의 이름을 가리키게 해 두면, CDN 이 서버를 옮겨 주소가 바뀌어도 내가 고칠 줄은 없다. 한 겹을 둔 값이 그것이다.</desc>
<rect width="880" height="724" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-02 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">아래를 갈아 끼워도 내 존 파일은 그대로다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자는 별칭이라고만 적고 왜 필요한지는 말하지 않습니다</text>
<text x="207.0" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">오늘</text>
<text x="673.0" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">CDN 이 서버를 옮긴 뒤</text>
<rect x="64" y="160" width="286" height="76" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.5"/>
<text x="82" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">www.example.com</text>
<text x="332" y="190" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">CNAME</text>
<text x="82" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">내 존 파일이 정하는 한 줄</text>
<rect x="530" y="160" width="286" height="76" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.5"/>
<text x="548" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">www.example.com</text>
<text x="798" y="190" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">CNAME</text>
<text x="548" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">고칠 일이 생기지 않는다</text>
<path d="M 104 244 L 104 274" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="118" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">CNAME 레코드가 가리킨다</text>
<path d="M 570 244 L 570 274" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="584" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">CNAME 레코드가 가리킨다</text>
<line x1="356" y1="198.0" x2="392.5" y2="198.0" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="487.5" y1="198.0" x2="524" y2="198.0" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="398.5" y="188.0" width="83.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="440.0" y="202.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">손대지 않음</text>
<rect x="64" y="280" width="286" height="76" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="82" y="310" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">cdn.example.net</text>
<text x="332" y="310" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">A</text>
<text x="82" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">CDN 이 관리하는 이름</text>
<rect x="530" y="280" width="286" height="76" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="548" y="310" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">cdn.example.net</text>
<text x="798" y="310" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">A</text>
<text x="548" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">이름은 그대로 남는다</text>
<path d="M 104 364 L 104 394" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="118" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">A 레코드가 가리킨다</text>
<path d="M 570 364 L 570 394" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="584" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">A 레코드가 가리킨다</text>
<line x1="356" y1="318.0" x2="409.75" y2="318.0" stroke="#5E6B7E" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="470.25" y1="318.0" x2="524" y2="318.0" stroke="#5E6B7E" stroke-width="1.2" stroke-dasharray="4 5"/>
<rect x="415.75" y="308.0" width="48.5" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="440.0" y="322.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#5E6B7E">그대로</text>
<rect x="64" y="400" width="286" height="76" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="82" y="430" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">1.2.3.4</text>
<text x="332" y="430" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">IPv4</text>
<text x="82" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">오늘 이 이름이 가리키는 서버</text>
<rect x="530" y="400" width="286" height="76" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="548" y="430" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">5.6.7.8</text>
<text x="798" y="430" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">IPv4</text>
<text x="548" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">CDN 이 말없이 갈아 끼운다</text>
<line x1="356" y1="438.0" x2="398.25" y2="438.0" stroke="#8B98A9" stroke-width="1.5"/>
<path d="M 481.75 438.0 L 524 438.0" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="404.25" y="428.0" width="71.5" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="440.0" y="442.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">갈아 끼움</text>
<rect x="24" y="494" width="832" height="148" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="44" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">한 겹을 둔 값과 그 대가</text>
<text x="44" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">값 — CNAME 이 없으면 www 에 주소를 직접 적어야 하고, 주소가 바뀔 때마다 내 존 파일을 고쳐야 합니다.</text>
<text x="44" y="576" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">대가 하나 — 이름 서버는 CNAME 을 만나면 그 이름으로 질의를 다시 시작합니다. 체인이 길수록 왕복이 늡니다.</text>
<text x="44" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">대가 둘 — CNAME 이 있는 노드에는 다른 데이터를 두지 못합니다. 그래서 존 꼭대기는 별칭이 될 수 없습니다.</text>
<text x="44" y="620" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">앞 편의 07-01.layer-swap 과 같은 논지입니다 — 사이에 한 겹을 두면 그 아래를 갈아 끼울 수 있습니다.</text>
<line x1="12" y1="662" x2="832" y2="662" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="684" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="674" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="684" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">내가 쥔 한 줄 — 안 바뀝니다</text>
<rect x="365" y="674" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="387" y="684" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">CDN 이 쥔 이름</text>
<rect x="539" y="674" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="561" y="684" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실제 주소 — 갈립니다</text>
</svg>
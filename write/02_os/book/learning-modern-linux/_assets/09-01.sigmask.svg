<title id="dt">SigCgt 0x10203 을 비트로 풀면 잡는 시그널 넷이 나온다</title><desc id="dd">trap "" TERM; trap : USR1 HUP 를 건 bash 의 /proc/PID/status. 16진 한 자리가 비트 넷이고, 0 부터 센 비트 n-1 이 시그널 n 이다.</desc>

<text x="836" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">cannot access './old'</text>
<text x="836" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">cannot access 'report.gz'</text>
<text x="32" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">공백 · 줄바꿈 모두 경계</text>
<text x="432" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">인자 3개 · 없는 이름 둘</text>
<line x1="24" y1="232" x2="936" y2="232" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="32" y="264" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">find . -name '*.gz' -print0 | xargs -0 ls -l</text>

<text x="634.0" y="173" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">./plain.gz</text>
<path d="M 688 168 L 728 168" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

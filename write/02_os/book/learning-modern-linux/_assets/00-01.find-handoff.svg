<title id="dt">xargs 는 구분자에서 이름을 끊는다</title><desc id="dd">find 의 출력 바이트가 xargs 를 지나 ls 의 인자가 되는 두 갈래. 줄바꿈으로 끝낸 출력은 공백에서도 끊겨 old report.gz 가 ./old 와 report.gz 두 인자로 갈라지고, 널 바이트로 끝낸 출력은 널에서만 끊겨 이름이 온전히 넘어간다.</desc>
<rect width="960" height="396" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 00-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">xargs 는 구분자에서 이름을 끊는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">파일 둘: 'old report.gz' · 'plain.gz'</text>
<text x="32" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">find 출력 바이트</text>
<text x="432" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">xargs 가 만든 인자</text>
<text x="736" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">ls 결과</text>
<text x="32" y="140" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">find . -name '*.gz' | xargs ls -l</text>
<rect x="32" y="152" width="56" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="60.0" y="173" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">./old</text>
<rect x="88" y="152" width="40" height="32" rx="4" fill="#F08A5933" stroke="#F08A59" stroke-width="1.4"/>
<text x="108.0" y="173" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">공백</text>
<rect x="128" y="152" width="84" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="170.0" y="173" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">report.gz</text>
<rect x="212" y="152" width="32" height="32" rx="4" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.0"/>
<text x="228.0" y="173" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">\n</text>
<rect x="244" y="152" width="92" height="32" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="290.0" y="173" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">./plain.gz</text>
<rect x="336" y="152" width="32" height="32" rx="4" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.0"/>
<text x="352.0" y="173" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">\n</text>

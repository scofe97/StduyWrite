<text x="268" y="448" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">쓰기 층 1개</text>
<text x="268" y="468" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">컨테이너 (RW)</text>
<path d="M 344 376 L 376 376 L 376 412" fill="none" stroke="#6A95D8" stroke-width="1.4"/>

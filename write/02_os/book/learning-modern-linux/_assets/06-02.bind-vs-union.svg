<rect x="24" y="300" width="136" height="212" rx="8" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="92.0" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">런타임</text>
<text x="92.0" y="418" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">docker run</text>
<rect x="180" y="308" width="376" height="196" rx="8" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="396" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">유니온 마운트 (N:1)</text>
<rect x="576" y="308" width="280" height="196" rx="8" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="716" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">바인드 마운트 (1:1)</text>
<path d="M 750 224 L 750 260 L 268 260 L 268 344" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="512" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">읽기 전용 층 전달</text>
<rect x="192" y="348" width="152" height="56" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="268" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">이미지 층 N개</text>
<text x="268" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">읽기 전용 (RO)</text>

<title id="dt">빌드는 층을 겹치고 런타임은 쓰기 층과 바인드를 더한다</title><desc id="dd">빌드 시점(docker build)에는 베이스 층 위에 COPY 와 RUN 마다 읽기 전용 이미지 층이 CoW 변경분으로 쌓인다. 런타임(docker run)에는 유니온 마운트가 그 읽기 전용 층 N개와 컨테이너 전용 쓰기 층 1개를 하나의 루트(/)로 합치고(N:1), 바인드 마운트(-v)는 호스트 폴더를 컨테이너 경로에 1:1로 직접 잇는다.</desc>
<rect width="880" height="584" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">빌드는 층을 겹치고 런타임은 쓰기 층과 바인드를 더한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">유니온 마운트는 여러 층을 하나로 합치고(N:1), 바인드 마운트는 두 경로를 직접 잇습니다(1:1)</text>
<rect x="24" y="104" width="136" height="136" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="92.0" y="162" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">빌드 시점</text>
<text x="92.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">docker build</text>
<rect x="180" y="120" width="176" height="104" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="268" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">FROM ubuntu:20.04</text>
<text x="268" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">베이스 층 (RO)</text>
<text x="268" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">디스크에 한 벌 공유</text>
<path d="M 356 172 L 398 172" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="400" y="120" width="200" height="104" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="500" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">COPY · RUN</text>
<text x="500" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">새 층 누적 (RO)</text>
<text x="500" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CoW 변경분만 저장</text>
<path d="M 600 172 L 642 172" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="644" y="120" width="212" height="104" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="750" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">이미지 완성</text>
<text x="750" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">읽기 전용 층 N개</text>
<text x="750" y="198" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">greeter:1 (불변)</text>

<title id="dt">카운터는 올라가기만 하고 게이지는 오르내린다</title><desc id="dd">일정 간격으로 표집한 점이 이룬 두 시계열. 카운터는 점마다 이전 값 이상이고, 내려가는 것은 0 으로 초기화될 때뿐이다. 게이지는 점마다 그 순간의 값이라 오르내린다. 세로축에 단위가 없는 것은 크기가 아니라 방향을 보이려는 그림이기 때문이다.</desc>

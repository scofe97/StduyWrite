<title id="dt">v1 은 계층마다 컨트롤러가 붙고 태스크는 계층마다 한 칸</title><desc id="dd">CPU 계정·메모리·블록 IO 컨트롤러가 각자 계층을 갖고, 계층마다 루트 아래 그룹이 있다. 같은 태스크 하나가 세 계층에 한 칸씩 든다.</desc>

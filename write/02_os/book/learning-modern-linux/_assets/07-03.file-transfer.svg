<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">셋 다 SSH 위에 있거나, 아예 다른 길이다</title><desc id="dd">파일을 옮기는 도구는 상황이 정한다. scp 와 rsync 는 SSH 위에 얹히고, S3 는 그것과 무관한 길이며, NFS 는 복사 대신 마운트다.</desc>
<rect width="880" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-03 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">셋 다 SSH 위에 있거나, 아예 다른 길이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자는 FTP 를 이제 쓸 이유가 없다고 못 박습니다</text>
<rect x="32" y="164" width="208" height="76" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="136.0" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">무엇을 옮기는가</text>
<text x="136.0" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">그리고 몇 번 옮기는가</text>
<rect x="288" y="164" width="560" height="76" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="306" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13.5" font-weight="600" fill="#3FB98C">scp</text>
<text x="306" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">파일 하나를 한 번</text>
<text x="830" y="224" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10.5" font-weight="400" fill="#5E6B7E">scp copyme user@host:/path/</text>
<path d="M 240 202 L 264.0 202 L 264.0 202 L 280 202" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="288" y="252" width="560" height="76" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.5"/>
<text x="306" y="280" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13.5" font-weight="600" fill="#F08A59">rsync -avz</text>
<text x="306" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">디렉토리를 반복해서 맞출 때</text>
<text x="830" y="312" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10.5" font-weight="400" fill="#5E6B7E">더해지거나 바뀐 파일만 복사한다</text>
<path d="M 240 202 L 264.0 202 L 264.0 290 L 280 290" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<rect x="288" y="340" width="560" height="76" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="306" y="368" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13.5" font-weight="600" fill="#6A95D8">aws s3 sync</text>
<text x="306" y="390" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">공개 S3 버킷에서 받을 때</text>
<text x="830" y="400" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10.5" font-weight="400" fill="#5E6B7E">--no-sign-request 로 인증을 건너뛴다</text>
<path d="M 240 202 L 264.0 202 L 264.0 378 L 280 378" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="288" y="428" width="560" height="76" rx="8" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>
<text x="306" y="456" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13.5" font-weight="600" fill="#8B98A9">NFS 마운트</text>
<text x="306" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">복사하지 않고 그대로 쓸 때</text>
<text x="830" y="488" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10.5" font-weight="400" fill="#5E6B7E">sudo mount nfs.example.com:/dir /opt/target</text>
<path d="M 240 202 L 264.0 202 L 264.0 466 L 280 466" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="32" y="424" width="208" height="80" rx="8" fill="#3FB98C06" stroke="#3FB98C" stroke-width="1.2" stroke-dasharray="7 6"/>
<text x="136" y="452" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#3FB98C">앞의 둘은</text>
<text x="136" y="474" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#3FB98C">SSH 위에 얹힙니다</text>
<text x="136" y="500" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">키 기반 인증을</text>
<text x="136" y="518" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">먼저 갖춰야 합니다</text>
<rect x="32" y="528" width="816" height="52" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="52" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">조용히 실패하는 자리 — 호스트 뒤의 콜론</text>
<text x="52" y="572" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">빠뜨리면 rsync 가 그것을 로컬 디렉토리로 해석합니다. 명령은 잘 도는데 파일이 로컬에 남습니다.</text>
<line x1="12" y1="596" x2="832" y2="596" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="618" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="608" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SSH 위의 도구</text>
<rect x="261" y="608" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="283" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 밖의 길</text>
<rect x="383" y="608" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="405" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실수가 잦은 곳</text>
</svg>
<title id="dt">멈춘 프로세스에 보낸 SIGTERM 은 ShdPnd 비트로 남아 기다린다</title><desc id="dd">sleep 300(PID 4334)에 STOP, TERM, CONT 를 차례로 보낸 실측. 칸마다 그 시점의 ps 줄과 /proc/4334/status 값이다. 멈춘 채 받은 SIGTERM 은 ShdPnd 0000000000004000, 곧 비트 14 로 남고 STAT 은 T 그대로다. CONT 가 오는 순간 이 SIGTERM 이 전달되어 143 으로 끝난다. 멈춘 채 SIGKILL 을 받으면 깨우지 않아도 137 이다.</desc>
<rect width="880" height="524" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 09-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">멈춘 프로세스에 보낸 SIGTERM 은 ShdPnd 비트로 남아 기다린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 PID 4334 를 명령 넷의 시점마다 다시 그렸습니다</text>
<path d="M 216 198 L 235 198" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 430 198 L 449 198" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 644 198 L 663 198" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 333.0 366 L 333.0 408.0 L 663 408.0" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<text x="464" y="398.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">kill -KILL $p</text>
<text x="576" y="398.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">깨우지 않아도</text>
<rect x="71.08000000000001" y="114" width="95.83999999999999" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="119.0" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">sleep 300 &amp;</text>
<rect x="277.64" y="114" width="110.72" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="333.0" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">kill -STOP $p</text>
<rect x="491.64" y="114" width="110.72" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="547.0" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">kill -TERM $p</text>
<rect x="705.64" y="114" width="110.72" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="761.0" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">kill -CONT $p</text>
<rect x="24" y="148" width="190" height="216" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="36" y="172" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">PID 4334</text>
<text x="36" y="208" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">STAT</text>
<text x="198" y="212" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="24" font-weight="600" fill="#F5F5F3">S</text>
<line x1="36" y1="228" x2="202" y2="228" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">4334 S sleep 300</text>
<text x="36" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">STOP 을 받기 전</text>
<rect x="238" y="148" width="190" height="216" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="250" y="172" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">PID 4334</text>
<text x="250" y="208" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">STAT</text>
<text x="412" y="212" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="24" font-weight="600" fill="#F5F5F3">T</text>
<line x1="250" y1="228" x2="416" y2="228" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="250" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">4334 T sleep 300</text>
<text x="250" y="284" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">State: T (stopped)</text>
<text x="250" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">SIGSTOP 은 잡을 수 없음</text>
<rect x="452" y="148" width="190" height="216" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="464" y="172" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">PID 4334</text>
<text x="464" y="208" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">STAT</text>
<text x="626" y="212" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="24" font-weight="600" fill="#F5F5F3">T</text>
<line x1="464" y1="228" x2="630" y2="228" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="464" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">4334 T sleep 300</text>
<text x="464" y="280" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">SigPnd 0000000000000000</text>
<text x="464" y="298" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">ShdPnd 000000000000<tspan fill="#F08A59" font-weight="600">4</tspan>000</text>
<rect x="464" y="308" width="22" height="22" rx="3" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="475.0" y="324" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">0</text>
<text x="475.0" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">15</text>
<rect x="490" y="308" width="22" height="22" rx="3" fill="#F08A5922" stroke="#F08A59" stroke-width="1.4"/>
<text x="501.0" y="324" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">1</text>
<text x="501.0" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">14</text>
<rect x="516" y="308" width="22" height="22" rx="3" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="527.0" y="324" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">0</text>
<text x="527.0" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">13</text>
<rect x="542" y="308" width="22" height="22" rx="3" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="553.0" y="324" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#5E6B7E">0</text>
<text x="553.0" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">12</text>
<text x="572" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">비트 14</text>
<text x="572" y="346" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">= TERM</text>
<rect x="666" y="148" width="190" height="216" rx="8" fill="none" stroke="#5E6B7E" stroke-width="1" stroke-dasharray="4 3"/>
<text x="678" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">PID 4334 없음</text>
<text x="678" y="208" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">wait $p</text>
<line x1="678" y1="228" x2="844" y2="228" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="761.0" y="272" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="22" font-weight="600" fill="#E3B341">exit=143</text>
<text x="761.0" y="294" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">128+15</text>
<text x="761.0" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">보류된 TERM 전달 → Term</text>
<rect x="666" y="384" width="190" height="48" rx="20" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="761.0" y="405" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F0616D">exit=137</text>
<text x="761.0" y="423" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">128+9 · CONT 없이</text>
<text x="24" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Ctrl+Z 의 SIGTSTP 는 잡힘</text>
<text x="192" y="464" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">tstp.sh: trap … TSTP</text>
<text x="348" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">→ 끝까지 실행 · exit=0</text>
<line x1="12" y1="484" x2="832" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="506" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="496" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보류된 SIGTERM 비트</text>
<rect x="326" y="496" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="348" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">128+15</text>
<rect x="448" y="496" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="470" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SIGKILL · 128+9</text>
</svg>
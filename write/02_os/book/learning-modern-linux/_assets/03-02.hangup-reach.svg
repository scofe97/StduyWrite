<title id="dt">터미널이 끊길 때 SIGHUP 이 닿는 곳과 닿지 않는 곳</title><desc id="dd">한 셸에서 다섯 방법으로 sleep 을 띄우고 터미널 쪽을 죽인 실험. 세션(SID)마다 영역으로 묶고 실제 PID 를 달았다. bash 가 받은 SIGHUP 을 작업 목록의 작업에 다시 보낸다.</desc>
<rect width="880" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-02 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">터미널이 끊길 때 SIGHUP 이 닿는 곳과 닿지 않는 곳</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">SIGHUP 은 pts/0 에 묶인 세션 250 안에서만 퍼집니다</text>
<rect x="24" y="120" width="544" height="336" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.1" stroke-dasharray="6 5"/>
<rect x="36" y="112" width="121" height="16" fill="#0D1117"/>
<text x="44" y="124" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">SID 250 · pts/0</text>
<rect x="592" y="120" width="264" height="108" rx="8" fill="#5E6B7E06" stroke="#5E6B7E" stroke-width="1.1" stroke-dasharray="6 5"/>
<rect x="604" y="112" width="138" height="16" fill="#0D1117"/>
<text x="612" y="124" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">SID 256 · TTY 없음</text>
<rect x="592" y="260" width="264" height="196" rx="8" fill="#5E6B7E06" stroke="#5E6B7E" stroke-width="1.1" stroke-dasharray="6 5"/>
<rect x="604" y="252" width="191" height="16" fill="#0D1117"/>
<text x="612" y="264" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">SID 258 · SID 259 · pts/1</text>
<rect x="196" y="140" width="200" height="36" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="296" y="163" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">pts/0 끊김</text>
<path d="M 296 176 L 296 202" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="304" y="194" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">SIGHUP</text>
<line x1="296" y1="264" x2="296" y2="288" stroke="#F0616D" stroke-width="1.3"/>
<line x1="140" y1="288" x2="452" y2="288" stroke="#F0616D" stroke-width="1.3"/>
<path d="M 140 288 L 140 318" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<path d="M 452 288 L 452 318" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<text x="304" y="282" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">작업 목록에 재전송</text>
<text x="404" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">작업 목록 밖</text>
<rect x="196" y="204" width="200" height="60" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="208" y="226" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">250</text>
<text x="208" y="248" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">bash --norc -i</text>
<text x="384" y="226" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">종료</text>
<rect x="40" y="320" width="200" height="60" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="52" y="342" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">251</text>
<text x="52" y="364" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">sleep 301 &amp;</text>
<text x="228" y="342" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">종료</text>
<rect x="352" y="320" width="200" height="60" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="364" y="342" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">252</text>
<text x="364" y="364" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">nohup sleep 302 &amp;</text>
<text x="540" y="342" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">무시 · 남음</text>
<rect x="196" y="392" width="200" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="208" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">254</text>
<text x="208" y="436" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">sleep 304 &amp; disown</text>
<text x="384" y="414" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">남음</text>
<rect x="608" y="148" width="232" height="60" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="620" y="170" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">256</text>
<text x="620" y="192" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">setsid sleep 303</text>
<text x="828" y="170" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">남음</text>
<rect x="608" y="288" width="232" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="620" y="310" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">258</text>
<text x="620" y="332" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">tmux 서버</text>
<text x="828" y="310" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">남음</text>
<path d="M 724 340 L 724 362" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="608" y="364" width="232" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="620" y="386" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">259</text>
<text x="620" y="408" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">sleep 305</text>
<text x="828" y="386" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">남음</text>
<text x="724" y="440" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">tmux attach -t work</text>
<rect x="24" y="476" width="832" height="52" rx="6" fill="#8B98A90a" stroke="#8B98A9" stroke-width="0.8"/>
<text x="40" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">끊은 뒤 252 · 254</text>
<text x="40" y="516" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">PPID 1 · SID 250 · TTY ?</text>
<text x="840" y="498" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">끊은 뒤 256 · 258 · 259</text>
<text x="840" y="516" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">변화 없음 · tmux ls → work</text>

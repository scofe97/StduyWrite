<title id="dt">도구 층은 다르게 쌓였고, 세 동작은 이름만 다르다</title><desc id="dd">RPM 계보는 .rpm 형식 위에 yum · DNF · Zypper 가, deb 계보는 .deb 형식 위에 저수준 dpkg 와 고수준 apt · apt-get · aptitude 가 선다. 검색은 yum search golang 과 apt search curl, 설치는 yum install(1 + 의존 101 개, 183 M)과 apt install(32 개, 5447 kB), 확인은 yum info(1.15.14, amzn2-core)와 apt show(7.68.0-1ubuntu2.6)로 짝을 이루고 -y 는 양쪽 같다.</desc>
<rect width="960" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">도구 층은 다르게 쌓였고, 세 동작은 이름만 다르다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저수준 dpkg 는 의존성을 풀지 않는다 — 푸는 쪽이 고수준이다</text>
<text x="390.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">검색</text>

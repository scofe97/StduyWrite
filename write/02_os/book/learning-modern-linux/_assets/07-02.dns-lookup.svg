<title id="dt">질문 하나가 네 절의 답으로 돌아온다</title><desc id="dd">dig 한 줄이 리졸버를 거쳐 네임서버에 닿고, 돌아온 응답이 QUESTION · ANSWER · AUTHORITY · ADDITIONAL 네 절로 나뉜다.</desc>
<rect width="880" height="684" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-02 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">질문 하나가 네 절의 답으로 돌아온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자는 언제나 DNS 탓이라는 격언을 인용합니다</text>
<rect x="24.0" y="116" width="190" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="119.0" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">앱 · dig</text>
<text x="119.0" y="153" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">클라이언트</text>
<rect x="230.0" y="116" width="190" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="325.0" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">리졸버</text>
<text x="325.0" y="153" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">기계에 딸림</text>
<rect x="436.0" y="116" width="190" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="531.0" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">권한 있는 NS</text>
<text x="531.0" y="153" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">dns1.registrar</text>
<rect x="642.0" y="116" width="190" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="737.0" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">응답</text>
<text x="737.0" y="153" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">네 절</text>
<path d="M 129.0 184 L 313.0 184" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="222.0" y="175" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">mhausenblas.info. IN A</text>
<text x="222.0" y="201" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">둘 사이에 정해진 프로토콜은 없다</text>
<path d="M 335.0 222 L 383.0 222 L 383.0 242 L 338.0 242" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="393.0" y="228" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">캐시에 있으면 여기서 끝난다 — TTL 이 남았는가</text>
<path d="M 335.0 296 L 519.0 296" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="428.0" y="287" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">루트에서부터 반복 질의</text>
<text x="428.0" y="313" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">지원되면 재귀 질의로 대신 물어 준다</text>
<rect x="476.5" y="330" width="109.0" height="20" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="531.0" y="344" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">authoritative</text>
<path d="M 541.0 388 L 725.0 388" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="634.0" y="379" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">A 레코드 넷 · NS 둘 · 추가 다섯</text>
<rect x="661.5" y="422" width="151.0" height="20" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="737.0" y="436" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">Query time: 58 msec</text>
<path d="M 727.0 480 L 131.0 480" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="428.0" y="471" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">NOERROR · ANSWER 4</text>
<line x1="119.0" y1="166" x2="119.0" y2="512" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="325.0" y1="166" x2="325.0" y2="512" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>

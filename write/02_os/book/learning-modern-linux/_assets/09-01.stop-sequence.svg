<title id="dt">SIGTERM 을 무시하는 서비스는 3초를 버티고 SIGKILL 을 맞는다</title><desc id="dd">TimeoutStopSec=3 인 서비스를 systemctl stop 으로 멈춘 실측. journal 의 시각을 그대로 옮겼다. 기본값이었다면 같은 일이 90초 뒤에 일어난다.</desc>

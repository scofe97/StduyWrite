<text x="264" y="127" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">→ 커널 · SIGTERM (15) 을 PID 마다 전달</text>

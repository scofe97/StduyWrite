<title id="dt">같은 SIGTERM 을 받아도 15번 칸의 처리 방식이 끝을 정한다</title><desc id="dd">/tmp/rerun.sh 가 notrap.sh·trap.sh·ign.sh 에 차례로 kill 을 보낸 실험. 커널은 각 프로세스의 처리 방식 칸 가운데 15번(SIGTERM)을 읽는다. 기본 동작이면 143, 핸들러가 exit 0 을 부르면 0, 무시면 살아남는다. 살아남은 ign.sh(PID 4324)에 kill -KILL 을 보내면 9번 칸은 바꿀 수 없어 137 로 끝난다.</desc>
<rect width="880" height="664" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 09-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 SIGTERM 을 받아도 15번 칸의 처리 방식이 끝을 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">처리 방식은 프로세스마다 시그널 번호별 칸으로 있습니다</text>

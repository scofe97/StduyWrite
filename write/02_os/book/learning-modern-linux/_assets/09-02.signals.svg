<text x="728" y="565" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">4324 Killed · 128+9</text>
<text x="24" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">처리 방식 칸은 번호마다 있으나 실험이 닿은 15·9번만 그림 · 이름·출력·종료 상태는 rerun.sh 출력 그대로</text>

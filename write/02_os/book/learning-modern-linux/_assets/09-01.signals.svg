<title id="dt">SIGTERM 하나가 배치 셋을 지나 서로 다른 종료 상태로 끝난다</title><desc id="dd">같은 반복문에 배치만 바꿔 kill 을 보낸 실험. 핸들러는 기본 동작을 대체하므로 핸들러 안의 exit 이 종료 상태를 정한다. SIGKILL 은 배치를 보지 않는다.</desc>
<rect width="880" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 09-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SIGTERM 하나가 배치 셋을 지나 서로 다른 종료 상태로 끝난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">기본 동작·무시·핸들러, 셋 중 하나가 프로세스의 배치입니다</text>
<rect x="320" y="100" width="240" height="44" rx="20" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="440" y="127" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">kill PID  →  SIGTERM (15)</text>
<path d="M 440 144 L 440 168" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="440,172 532,212 440,252 348,212" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="440" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">배치</text>
<text x="440" y="226" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">SigIgn·SigCgt</text>
<path d="M 348 212 L 152 212 L 152 296" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 440 252 L 440 296" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 532 212 L 728 212 L 728 296" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="121.13" y="246" width="61.74" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="152" y="260" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">SIG_DFL</text>
<rect x="392.08" y="262" width="95.84" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="440" y="276" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">trap '' TERM</text>
<rect x="649.39" y="246" width="157.22" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="728" y="260" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">trap '…; exit 0' TERM</text>
<rect x="36.0" y="300" width="232" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="152" y="327" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">기본 동작 Term</text>
<text x="152" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">notrap.sh</text>
<rect x="324.0" y="300" width="232" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="440" y="327" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">무시, 반복문 계속</text>
<text x="440" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">ign.sh · 1.2초 뒤 생존</text>
<rect x="612.0" y="300" width="232" height="64" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="728" y="327" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">핸들러 실행</text>
<text x="728" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">TERM 받음, 정리 후 종료</text>
<path d="M 440 364 L 440 400" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="324.0" y="404" width="232" height="64" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="440" y="431" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">kill -KILL PID</text>
<text x="440" y="452" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">배치 확인 없음</text>
<path d="M 152 364 L 152 496" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="72" y="500" width="160" height="44" rx="20" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="152" y="527" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#E3B341">exit=143</text>
<path d="M 440 468 L 440 496" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="360" y="500" width="160" height="44" rx="20" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="440" y="527" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F0616D">exit=137</text>
<path d="M 728 364 L 728 496" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="648" y="500" width="160" height="44" rx="20" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="728" y="527" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">exit=0</text>
<line x1="12" y1="556" x2="832" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="568" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기본 동작을 대체하는 핸들러</text>
<rect x="339" y="568" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="361" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">128+15</text>
<rect x="461" y="568" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="483" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">128+9, 잡을 수 없음</text>
<rect x="687" y="568" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="709" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핸들러가 정한 값</text>
</svg>
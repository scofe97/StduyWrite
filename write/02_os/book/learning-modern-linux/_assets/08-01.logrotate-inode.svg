<title id="dt">이름을 바꾸면 fd 는 inode 를 따라가고 copytruncate 는 inode 를 남긴다</title><desc id="dd">컨테이너에서 0.2초마다 한 줄을 붙이는 루프를 두고 logrotate -f 로 강제 회전한 전후. 숫자는 ls -i 로 본 inode 다.</desc>
<rect width="880" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름을 바꾸면 fd 는 inode 를 따라가고 copytruncate 는 inode 를 남긴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">새 app.log 는 비어 있고 옛 inode 인 app.log.1 만 자랍니다</text>

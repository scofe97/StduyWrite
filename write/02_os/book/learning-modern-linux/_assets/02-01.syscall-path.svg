<title id="dt">명령 한 줄이 커널로 내려갔다 돌아오는 길</title><desc id="dd">원서가 적은 세 걸음을 존 셋으로 갈라 놓은 것. 앱은 시스템 콜을 직접 부르지 않고 C 표준 라이브러리를 거치며, 커널로 들어가고 나올 때마다 하드웨어 컨텍스트가 스택을 오간다.</desc>

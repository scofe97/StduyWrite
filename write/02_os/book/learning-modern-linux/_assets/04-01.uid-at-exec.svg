<title id="dt">passwd 를 실행하면 유효 UID 가 0 이 된다</title><desc id="dd">fork 로 만든 자식은 부모의 UID 사본을 물려받고, setuid 가 켜진 root 소유 파일을 execve 하면 실제 UID 는 남고 유효·저장·파일시스템 UID 가 0 이 된다.</desc>
<rect width="880" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 04-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">passwd 를 실행하면 유효 UID 가 0 이 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칩의 Uid 네 값은 실제 · 유효 · 저장 · 파일시스템 순서입니다</text>
<rect x="24.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="129.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">셸</text>
<text x="129.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">uid 1000</text>
<rect x="323.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="428.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">자식 프로세스</text>
<text x="428.0" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">exec 뒤 passwd</text>
<rect x="622.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="727.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">커널</text>
<text x="727.0" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">권한 판정</text>
<line x1="129.0" y1="154" x2="129.0" y2="488" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="428.0" y1="154" x2="428.0" y2="488" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="727.0" y1="154" x2="727.0" y2="488" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 139.0 172 L 416.0 172" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="278.5" y="162" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">fork(2)</text>
<text x="278.5" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">부모 UID 사본 상속</text>
<rect x="329.2" y="205" width="197.60000000000002" height="22" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="428.0" y="221" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">Uid: 1000 1000 1000 1000</text>
<path d="M 438.0 268 L 715.0 268" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="577.5" y="258" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">execve(2) /usr/bin/passwd</text>
<text x="577.5" y="286" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">setuid · root 소유</text>
<rect x="362.5" y="301" width="131.0" height="22" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="428.0" y="317" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">Uid: 1000 0 0 0</text>
<path d="M 438.0 372 L 715.0 372" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<text x="577.5" y="362" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">/etc/shadow 쓰기</text>
<text x="577.5" y="390" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">파일시스템 UID 0 으로 판정</text>
<rect x="705.0" y="405" width="44.0" height="22" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="727.0" y="421" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">허용</text>
<path d="M 717.0 464 L 141.0 464" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="428.0" y="454" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">비밀번호 변경 완료</text>
<line x1="12" y1="508" x2="832" y2="508" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

<title id="dt">로그는 항목과 문맥과 형식 셋으로 이루어진다</title><desc id="dd">Debian 의 /var/log/syslog 를 tail -f 로 본 다섯 줄. 파일 이름이 파일 전체의 문맥이고, 한 줄이 사건 하나를 담는 항목이다. 줄마다 시각·호스트·프로그램[PID] 이 메시지마다 붙는 문맥으로 앞에 서고, 그 뒤가 사람이 읽는 텍스트 페이로드다. 칸의 순서와 뜻을 정하는 것이 형식이다.</desc>
<rect width="920" height="612" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">로그는 항목과 문맥과 형식 셋으로 이루어진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 칸 순서가 다섯 줄 모두에 걸린다 — 그 순서가 형식이다</text>
<text x="24" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">형식 — 칸의 순서와 뜻</text>
<text x="896" y="116" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">스키마로 적으면 자동 검증</text>

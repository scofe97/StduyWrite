<title id="dt">예약된 대역은 쿠버네티스 문서 곳곳에 다시 나타난다</title><desc id="dd">예약 대역 다섯을, 컨테이너 환경에서 실제로 마주치는 자리와 나란히 놓은 것. 왼쪽은 대역의 성격이고 오른쪽은 그 대역이 나타나는 자리다.</desc>
<rect width="880" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">예약된 대역은 쿠버네티스 문서 곳곳에 다시 나타난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">0.0.0.0 — 호스트의 모든 IPv4 주소 수신 바인딩 표기</text>
<text x="396.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">무엇인가</text>
<text x="690.0" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">컨테이너에서 만나는 자리</text>
<line x1="24" y1="184" x2="848" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<rect x="24" y="196" width="824" height="62" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.3"/>
<text x="38" y="232.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">127.0.0.0</text>
<text x="396.0" y="232.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">로컬 주소용 서브넷</text>
<text x="690.0" y="232.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">127.0.0.1 바인딩 시 파드 외부 도달 불가</text>
<text x="38" y="294.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">169.254.0.0/16</text>
<text x="396.0" y="294.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">링크 로컬 · 전달되지 않음</text>
<text x="690.0" y="294.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">169.254.169.254 노드 메타데이터 조회</text>
<rect x="24" y="320" width="824" height="62" rx="4" fill="#161B22" stroke="none" stroke-width="0"/>
<text x="38" y="356.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">224.0.0.0/4</text>
<text x="396.0" y="356.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">멀티캐스트</text>
<text x="690.0" y="356.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">멀티캐스트 전체 대역 (IANA 등록부 /4)</text>
<text x="38" y="418.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">10/8 · 172.16/12 · 192.168/16</text>
<text x="396.0" y="418.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">RFC 1918 사설 · 공개망에서 라우팅 안 됨</text>
<text x="690.0" y="418.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">파드 및 서비스 CIDR 기본 할당 대역</text>
<rect x="24" y="444" width="824" height="62" rx="4" fill="#161B22" stroke="none" stroke-width="0"/>
<text x="38" y="480.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">0.0.0.0</text>
<text x="396.0" y="480.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">그 기계의 모든 IPv4 주소</text>
<text x="690.0" y="480.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">컨테이너 애플리케이션 수신 바인딩 주소</text>
<line x1="24" y1="512" x2="848" y2="512" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<rect x="24" y="518" width="824" height="68" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="44" y="544" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">멀티캐스트 전체 대역 비트 마스크 및 접두사</text>
<text x="44" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">IANA 공식 등록 범위: 224.0.0.0 ~ 239.255.255.255 (총 2억 6,843만 주소)</text>
<text x="44" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">224(11100000) ~ 239(11101111) 공통 상위 4비트 일치에 따른 /4 접두사 표기</text>
<line x1="12" y1="618" x2="832" y2="618" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="640" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="630" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="640" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">주소 자체의 성격</text>
<rect x="261" y="630" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="283" y="640" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">망 안에서만 도는 것</text>
<rect x="448" y="630" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="470" y="640" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">표기를 확인해야 하는 곳</text>
<rect x="661" y="630" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="683" y="640" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사고가 가장 잦은 곳</text>
</svg>
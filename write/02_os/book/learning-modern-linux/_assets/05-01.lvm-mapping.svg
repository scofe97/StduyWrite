<title id="dt">실제 디스크와 장치 번호에서 논리 볼륨까지의 매핑</title><desc id="dd">GCP VM(lml-os-lab) 실측: 루트 디스크 sda(8:0)는 파티션 기반으로 LVM 과 무관하고, 실습 디스크 sdb(8:16)만 PV 로 초기화되어 VG vg0 에 속한다. 논리 볼륨 root·data 는 device-mapper(252:0·252:1)를 통해 sdb 의 실제 섹터 구간에 1:1 선형 매핑된다.</desc>
<rect width="960" height="712" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">실제 디스크와 장치 번호에서 논리 볼륨까지의 매핑</text>

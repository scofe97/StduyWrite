<title id="dt">NetworkManager 데몬과 커널 런타임 설정의 경계</title><desc id="dd">nmcli 와 설정 파일은 디스크에 프로파일을 영구 보관하고 데몬이 커널을 동기화한다. 반면 ip 명령은 커널 메모리만 즉시 바꾸므로 재부팅 시 소멸한다.</desc>
<rect width="880" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-01 §6</text>

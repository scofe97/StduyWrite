<text x="296" y="127" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">stdin</text>
<text x="584" y="127" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">a · b · c · d · e</text>
<path d="M 440 144 L 440 174" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="320" y="176" width="240" height="52" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="440" y="200" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">xargs -t -n 2 echo</text>
<text x="440" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">인자 2개씩 끊기</text>

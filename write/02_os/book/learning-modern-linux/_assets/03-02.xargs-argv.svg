<title id="dt">xargs 가 입력 다섯 줄을 두 개씩 묶어 echo 를 세 번 실행</title><desc id="dd">표준 입력의 a~e 다섯 줄을 xargs -t -n 2 echo 가 인자로 바꾸는 모양. 한 번 실행에 인자를 둘까지 붙이고, -t 가 실행할 명령 줄을 먼저 찍는다.</desc>
<rect width="880" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">xargs 가 입력 다섯 줄을 두 개씩 묶어 echo 를 세 번 실행</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">인자 묶음 하나가 실행 한 번입니다</text>

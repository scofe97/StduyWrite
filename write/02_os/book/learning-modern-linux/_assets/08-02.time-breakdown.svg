<title id="dt">CPU 시간과 real 사이의 거리</title><desc id="dd">네 명령의 user+sys 와 real 을 로그 시간 축에 찍었다. 두 점이 겹치면 CPU 위에서 시간을 썼고, 멀면 그만큼 CPU 밖에서 기다렸다.</desc>

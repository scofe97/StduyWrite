<title id="dt">목적지 주소를 쥔 쪽이 반대다</title><desc id="dd">밀기에서는 앱이 목적지 127.0.0.1:8125 를 알고 StatsD 서버로 UDP 데이터그램 "foo:1|c" 를 보내며 응답은 없다. 끌기에서는 node exporter 가 HTTP :9100/metrics 를 열어 두기만 하고, Prometheus 가 prometheus.yml 의 targets(172.17.0.1:9100)를 보고 15초마다 GET /metrics 를 보내 텍스트 메트릭을 받아 간다. 앱이 늘고 줄 때 밀기는 앱마다 목적지를, 끌기는 수집기의 targets 목록 하나를 고친다.</desc>
<rect width="920" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-02 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">목적지 주소를 쥔 쪽이 반대다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">밀기는 앱이 수집기 주소를 알고, 끌기는 수집기가 앱 주소 목록을 쥔다</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">밀기 · StatsD</text>
<path d="M 306 180 L 596 180" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)"/>
<text x="452.0" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">"foo:1|c"</text>
<text x="452.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">UDP 데이터그램 · 응답 없음</text>
<rect x="24" y="124" width="280" height="112" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="40" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">앱 프로세스</text>
<text x="40" y="170" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">계측 코드 · StatsD 클라이언트</text>
<rect x="36" y="188" width="256" height="32" rx="4" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<text x="48" y="209" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">목적지 127.0.0.1:8125</text>
<rect x="600" y="124" width="296" height="112" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="616" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">StatsD 서버</text>
<text x="616" y="176" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">UDP :8125</text>
<text x="700" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">에서 받음</text>
<text x="616" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">카운터 foo 에 1</text>
<text x="24" y="262" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">$ echo "foo:1|c" | nc -u -w0 127.0.0.1 8125</text>
<text x="364" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">README 의 예</text>
<line x1="24" y1="284" x2="896" y2="284" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">끌기 · 스크래핑</text>
<path d="M 598 372 L 308 372" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)"/>
<text x="452.0" y="360" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">GET /metrics</text>
<text x="452.0" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">15초마다 · scrape_interval</text>
<path d="M 306 440 L 596 440" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)" stroke-dasharray="5 4"/>
<text x="452.0" y="428" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">200 · text/plain; version=0.0.4</text>
<text x="452.0" y="462" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">응답 본문 = 텍스트 메트릭</text>
<rect x="24" y="324" width="280" height="160" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="40" y="348" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">node exporter</text>
<text x="40" y="372" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">HTTP :9100/metrics</text>
<rect x="36" y="388" width="256" height="52" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="48" y="408" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E"># TYPE go_goroutines gauge</text>
<text x="48" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">go_goroutines 7</text>
<text x="40" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">목적지 설정 없음 · 노출만</text>
<rect x="600" y="324" width="296" height="160" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="616" y="348" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Prometheus</text>
<rect x="612" y="360" width="272" height="112" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="624" y="380" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">prometheus.yml</text>
<text x="624" y="404" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">scrape_interval: 15s</text>
<text x="624" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">prometheus → localhost:9090</text>
<text x="624" y="452" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">machine → 172.17.0.1:9100</text>
<text x="24" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">앱이 늘고 줄 때 고칠 곳 — 밀기: 앱마다의 목적지 · 끌기: targets 목록 하나</text>
<text x="24" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">주소·포트·간격·응답 줄은 본문 §8 과 StatsD·node_exporter README 값 그대로</text>
<line x1="12" y1="556" x2="872" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="568" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">밀기 흐름</text>
<rect x="209" y="568" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="231" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">끌기 흐름</text>
<rect x="318" y="568" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="340" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앱이 쥔 목적지</text>
<rect x="466" y="568" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="488" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수집기가 쥔 targets</text>

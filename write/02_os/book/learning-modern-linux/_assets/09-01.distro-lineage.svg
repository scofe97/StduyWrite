<title id="dt">컨테이너 중심 배포판 넷 중 둘은 한 뿌리에서 갈렸다</title><desc id="dd">만든 곳에서 배포판으로 내려가는 계보. 스타트업 CoreOS 가 2013년 내놓은 CoreOS Linux 는 Container Linux 로 이름을 바꿨고, Red Hat 이 인수해 Project Atomic 과 합친 것이 RHCOS, Kinvolk GmbH 가 포크한 것이 Flatcar 다. Bottlerocket 은 AWS, RancherOS 는 Rancher 가 따로 만들었다. 패키지 관리자가 없다고 책이 명시한 것은 CoreOS Linux, Flatcar, Bottlerocket 셋이다.</desc>
<rect width="880" height="652" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 09-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">컨테이너 중심 배포판 넷 중 둘은 한 뿌리에서 갈렸다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">갈림목은 Container Linux 하나, 거기서 RHCOS 와 Flatcar 가 나옵니다</text>

<title id="dt">시스템 콜은 VFS 객체를 지나 파일시스템마다 갈라진다</title><desc id="dd">파일 관련 시스템 콜 다섯 범주는 모두 VFS 로 들어온다. VFS 는 프로세스가 연 file, 경로를 캐시하는 dentry, 디스크 객체를 나타내는 inode, 마운트된 파일시스템 하나를 맡는 super_block 을 거쳐 super_block 의 연산자 테이블로 구현을 고른다. 로컬 파일시스템은 블록 장치로, tmpfs 는 RAM 으로, procfs 는 커널 상태로, NFS 는 원격 서버로 간다. 그래서 같은 read() 가 보통 파일과 /proc 파일을 함께 다룬다.</desc>
<rect width="920" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">시스템 콜은 VFS 객체를 지나 파일시스템마다 갈라진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">VFS 는 시스템 콜과 파일시스템 구현 사이의 간접 층 — 갈라지는 자리는 함수 포인터다</text>

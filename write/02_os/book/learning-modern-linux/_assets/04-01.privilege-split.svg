<line x1="264" y1="276.0" x2="296" y2="276.0" stroke="#8B98A9" stroke-width="1.3"/>
<line x1="296" y1="136.0" x2="296" y2="416.0" stroke="#8B98A9" stroke-width="1.3"/>
<path d="M 296 136.0 L 328 136.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>

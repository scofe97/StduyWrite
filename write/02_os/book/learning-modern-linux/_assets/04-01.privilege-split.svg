<title id="dt">root 의 특권을 capability 단위로 나눈다</title><desc id="dd">리눅스 2.2부터 슈퍼유저의 특권은 따로 켜고 끌 수 있는 단위로 나뉜다. 80 포트를 여는 웹 서버에는 그중 한 단위만 있으면 된다.</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 04-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">root 의 특권을 capability 단위로 나눈다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">프로세스에는 필요한 단위만 줍니다</text>
<rect x="24" y="226.0" width="240" height="100" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="144.0" y="264.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="17" font-weight="600" fill="#6A95D8">root</text>
<text x="144.0" y="288.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">UID 0</text>

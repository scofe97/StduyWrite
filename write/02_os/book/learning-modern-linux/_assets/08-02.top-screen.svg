<title id="dt">top 화면의 네 구역과 정렬 키</title><desc id="dd">nice 10 반복문이 CPU 하나를 다 쓰는 동안 찍은 top 화면을 구역별로 쌓았다. 오른쪽은 화면에서 쓰는 키다.</desc>
<rect width="900" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">top 화면의 네 구역과 정렬 키</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">메모리 정렬은 대문자 M, 소문자 m 은 메모리 두 줄의 표시 토글입니다</text>
<rect x="24" y="112" width="548" height="64" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="40" y="136" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">1 시스템 요약</text>
<text x="556" y="136" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">uptime 과 같음</text>
<text x="40" y="160" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#6A95D8">top - 05:02:54 up 2:50, load average: 1.82, 1.64, 1.41</text>
<rect x="24" y="186" width="548" height="64" rx="8" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="40" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">2 태스크 통계</text>
<text x="556" y="210" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">실행 · 수면 · 정지 · 좀비</text>
<text x="40" y="234" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">Tasks: 6 total, 2 running, 4 sleeping, 0 zombie</text>
<rect x="24" y="260" width="548" height="88" rx="8" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="40" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">3 CPU 사용 통계</text>
<text x="556" y="284" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">vmstat 의 CPU 축 · 아래 두 줄은 free</text>
<text x="40" y="308" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">%Cpu(s): 1.4 us, 0.5 sy, 14.8 ni, 81.9 id, 0.1 wa</text>
<text x="40" y="332" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">MiB Mem: 8004.2 total, 5286.1 free, 1884.1 used</text>
<rect x="24" y="358" width="548" height="64" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="40" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F08A59">4 프로세스 목록</text>
<text x="556" y="382" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">ps aux 와 견줌 · 정렬 대상</text>
<text x="40" y="406" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#F08A59">3078 root 30 10 R 100.0 0.0 0:02.15 sh</text>

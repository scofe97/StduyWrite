<text x="626" y="264" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">P</text>
<text x="656" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#3FB98C">%CPU 순 정렬</text>
<rect x="615.59" y="282" width="20.82" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="626" y="296" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">k</text>
<text x="656" y="296" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">시그널 보내기</text>
<rect x="615.59" y="314" width="20.82" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="626" y="328" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">q</text>
<text x="656" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F5F5F3">끝내기</text>
<rect x="608.77" y="346" width="34.46" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="626" y="360" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">N T</text>
<text x="656" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#5E6B7E">PID · TIME+ 정렬, 도움말에 없음</text>
<rect x="615.59" y="378" width="20.82" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="626" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">m</text>
<text x="656" y="392" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#5E6B7E">메모리 두 줄 표시 4단 토글</text>
<line x1="12" y1="456" x2="852" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="478" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

<title id="dt">Step 마다 ID 가 하나씩 쌓이고 태그는 그 ID 를 가리킨다</title><desc id="dd">docker build 가 Dockerfile 일곱 줄을 차례로 처리하며 Step 마다 이미지 ID 를 하나씩 남긴다. 맨 아래 Step 1 의 fb52e22af1b0 은 ubuntu:20.04 의 IMAGE ID 와 같고, 맨 위 433a5f10d84e 에 greeter:1 태그가 붙는다. 두 이미지가 각각 72.8MB 로 나와도 아래 층은 디스크에 한 벌이다. USER 1001 줄이 없으면 컨테이너는 불필요하게 root 로 돈다.</desc>
<rect width="880" height="624" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-02 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Step 마다 ID 가 하나씩 쌓이고 태그는 그 ID 를 가리킨다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">greeter:1 은 ubuntu:20.04 위에 여섯 단계를 얹은 것입니다</text>
<text x="24" y="104" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">빌드 순서</text>
<path d="M 36 458 L 36 120" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<path d="M 638 137.0 L 606 137.0" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<path d="M 638 437.0 L 606 437.0" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<rect x="56" y="416" width="544" height="42" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="68" y="442.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">1/7</text>
<text x="112" y="442.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#6A95D8">FROM ubuntu:20.04</text>
<text x="588" y="442.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">fb52e22af1b0</text>
<rect x="56" y="366" width="544" height="42" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="68" y="392.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">2/7</text>
<text x="112" y="392.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">LABEL org.opencontainers.image.authors</text>
<text x="588" y="392.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">def717e3352b</text>
<rect x="56" y="316" width="544" height="42" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="68" y="342.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">3/7</text>
<text x="112" y="342.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#3FB98C">COPY greeter.sh /app/</text>
<text x="588" y="342.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">5f3eb160fea3</text>
<rect x="56" y="266" width="544" height="42" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="68" y="292.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">4/7</text>
<text x="112" y="292.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F5F5F3">WORKDIR /app</text>
<text x="588" y="292.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">d73572886c13</text>
<rect x="56" y="216" width="544" height="42" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="68" y="242.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">5/7</text>
<text x="112" y="242.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#3FB98C">RUN chown -R 1001:1 /app</text>
<text x="588" y="242.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">42c35a6db6e2</text>
<rect x="56" y="166" width="544" height="42" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="68" y="192.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">6/7</text>
<text x="112" y="192.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#F08A59">USER 1001</text>
<text x="588" y="192.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">b6e0e27f253b</text>
<rect x="56" y="116" width="544" height="42" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="68" y="142.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">7/7</text>
<text x="112" y="142.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12.5" font-weight="600" fill="#E3B341">ENTRYPOINT ["/app/greeter.sh"]</text>
<text x="588" y="142.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">433a5f10d84e</text>

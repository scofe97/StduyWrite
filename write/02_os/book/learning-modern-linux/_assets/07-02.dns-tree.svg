<title id="dt">각자 자기 부분만 돌보고 조율은 없다</title><desc id="dd">잎에서 뿌리까지의 라벨을 이은 것이 FQDN 이다. 층마다 관리 주체가 다르고 서로 허락을 구하지 않는데, 그 단순한 사실이 DNS 를 확장 가능하게 만든다.</desc>
<rect width="880" height="752" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">각자 자기 부분만 돌보고 조율은 없다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">라벨 하나의 최대 길이는 63바이트입니다</text>

<title id="dt">NIC 가 바이트를 신호로 바꾸고, 이름은 위치에서 나온다</title><desc id="dd">링크 계층은 바이트와 전선과 전자기파와 드라이버의 세계다. 그 경계에 NIC 가 서 있고, 인터페이스 이름은 그 NIC 가 꽂힌 자리를 그대로 적은 것이다.</desc>
<rect width="880" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">NIC 가 바이트를 신호로 바꾸고, 이름은 위치에서 나온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">MAC 주소는 기계가 아니라 인터페이스를 식별합니다</text>
<rect x="32" y="168" width="232" height="96" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="148.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#6A95D8">소프트웨어</text>
<text x="148.0" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">비트와 바이트</text>
<text x="148.0" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">커널 드라이버가 다루는 형태</text>
<rect x="324" y="168" width="232" height="96" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.3"/>
<text x="440.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#3FB98C">NIC</text>
<text x="440.0" y="224" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">IEEE 802.3 유선</text>
<text x="440.0" y="244" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">IEEE 802.11 무선</text>
<rect x="616" y="168" width="232" height="96" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="732.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#6A95D8">물리 매체</text>
<text x="732.0" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">전기 신호 · 전자기파</text>
<text x="732.0" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">선과 공기</text>
<path d="M 264 202 L 316 202" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="294.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">보내는 길</text>
<path d="M 556 202 L 608 202" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 608 242 L 556 242" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="586.0" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">받는 길</text>
<path d="M 316 242 L 264 242" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="32" y="304" width="400" height="108" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="52" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">MAC 주소 — 48비트</text>
<rect x="52" y="346" width="180" height="26" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="142" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">OUI — 앞 24비트</text>
<rect x="236" y="346" width="176" height="26" rx="4" fill="#8B98A918" stroke="#8B98A9" stroke-width="1.1"/>
<text x="324" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">나머지 24비트</text>
<text x="52" y="392" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#5E6B7E">38:de:ad:37:32:0f — 제조사가 앞쪽에 인코딩됩니다</text>
<rect x="456" y="304" width="392" height="108" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="476" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">이름이 위치에서 나오는 이유</text>
<rect x="476" y="346" width="108" height="26" rx="4" fill="#F08A5920" stroke="#F08A59" stroke-width="1.1"/>
<text x="530" y="364" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">wl</text>
<text x="530" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">무선 인터페이스</text>
<rect x="600" y="346" width="108" height="26" rx="4" fill="#F08A5920" stroke="#F08A59" stroke-width="1.1"/>
<text x="654" y="364" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">p1</text>
<text x="654" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">PCI 버스 1</text>
<rect x="724" y="346" width="108" height="26" rx="4" fill="#F08A5920" stroke="#F08A59" stroke-width="1.1"/>
<text x="778" y="364" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">s0</text>
<text x="778" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">슬롯 0</text>
<rect x="32" y="444" width="816" height="62" rx="6" fill="#8B98A914" stroke="#8B98A9" stroke-width="1.2"/>
<text x="52" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">옛 이름 eth0 · eth1 은 재부팅하거나 카드를 꽂으면 바뀔 수 있었습니다</text>
<text x="52" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">MTU 는 루프백이 65,536 이고 이더넷 기본이 1,500 입니다. 9,000 짜리 점보 프레임도 쓸 수 있습니다.</text>
<line x1="12" y1="536" x2="832" y2="536" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="558" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="548" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소프트웨어와 물리 매체</text>
<rect x="300" y="548" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="322" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">경계에 선 하드웨어</text>
<rect x="474" y="548" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="496" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">예측 가능하게 만든 이름</text>

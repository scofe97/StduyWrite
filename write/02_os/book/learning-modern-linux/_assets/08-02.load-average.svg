<text x="728" y="450" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">1.37 ÷ 8 = 0.17</text>
<text x="728" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">nproc 8</text>
<text x="24" y="536" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">칸 하나 = CPU 하나 · 채운 높이 = load ÷ CPU 수 · 고르게 나뉜다고 본 축약</text>
<line x1="12" y1="552" x2="832" y2="552" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

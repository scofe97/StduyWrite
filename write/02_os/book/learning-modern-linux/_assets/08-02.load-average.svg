<rect x="322" y="368.0" width="44" height="14.0" rx="2" fill="#6A95D855"/>
<rect x="376" y="320" width="48" height="64" rx="4" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<rect x="378" y="368.0" width="44" height="14.0" rx="2" fill="#6A95D855"/>

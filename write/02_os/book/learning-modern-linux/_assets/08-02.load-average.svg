<title id="dt">부하 평균을 CPU 수로 나눈 몫</title><desc id="dd">uptime 출력의 load average 1.37, 1.38, 1.30 은 1·5·15분 평균이고, 센 것은 실행 가능하거나 인터럽트 불가 상태인 프로세스 수다. 이 값은 CPU 수로 정규화되지 않는다. 칸 하나를 CPU 하나로 그리면 load 1.00 은 CPU 1개에서 칸을 가득 채우고, CPU 4개에서는 칸마다 0.25 만 채워 75% 가 논다. 컨테이너 실측 1.37 을 nproc 8 로 나누면 칸마다 0.17 이다.</desc>
<rect width="880" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">부하 평균을 CPU 수로 나눈 몫</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">값을 읽기 전에 그 기계의 CPU 수부터 확인합니다</text>
<rect x="24" y="96" width="600" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="32" y="121" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">05:00:07 up 2:47, 0 user, load average: 1.37, 1.38, 1.30</text>
<rect x="640" y="96" width="120" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="652" y="121" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F5F5F3">nproc → 8</text>
<text x="354.14" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">1분</text>
<text x="400.15999999999997" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">5분</text>
<text x="446.18" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">15분</text>
<text x="24" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">센 것 = runnable + 인터럽트 불가(I/O 대기) 프로세스 수</text>
<text x="24" y="242" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">CPU 1개 · load 1.00</text>
<text x="24" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">man page 의 예</text>
<rect x="264" y="216" width="48" height="64" rx="4" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<rect x="266" y="216.0" width="44" height="62.0" rx="2" fill="#6A95D855"/>
<text x="728" y="242" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">1.00 ÷ 1 = 1.00</text>
<text x="728" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">내내 바쁨</text>
<text x="24" y="346" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">CPU 4개 · load 1.00</text>
<text x="24" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">man page 의 예</text>
<rect x="264" y="320" width="48" height="64" rx="4" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>

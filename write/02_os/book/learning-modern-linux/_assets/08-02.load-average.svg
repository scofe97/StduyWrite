<rect x="490" y="477.0" width="44" height="9.0" rx="2" fill="#F08A5966"/>
<rect x="544" y="424" width="48" height="64" rx="4" fill="#161B22" stroke="#F08A59" stroke-width="1.3"/>
<rect x="546" y="477.0" width="44" height="9.0" rx="2" fill="#F08A5966"/>
<rect x="600" y="424" width="48" height="64" rx="4" fill="#161B22" stroke="#F08A59" stroke-width="1.3"/>

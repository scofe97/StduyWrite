<title id="dt">부하 평균을 CPU 수로 나눈 몫</title><desc id="dd">부하 평균은 CPU 수로 정규화되지 않으므로 같은 값도 CPU 수에 따라 CPU 하나에 걸린 몫이 다르다. 막대는 load 를 CPU 수로 나눈 값이다.</desc>

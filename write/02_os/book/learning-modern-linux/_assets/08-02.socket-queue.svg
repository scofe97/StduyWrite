<title id="dt">받을 큐에 쌓이는 5000바이트</title><desc id="dd">ss -atnp 출력의 세 줄을 객체로 그린 것. 클라이언트 bash 와 fd 5 를 물려받은 ss · cat 이 127.0.0.1:40258 소켓을 쥐고, 서버 nc(pid 3798)가 fd 3 으로 LISTEN 소켓을, fd 4 로 연결 소켓을 쥔다. nc 를 SIGSTOP 으로 멈춘 채 5000바이트를 쓰면 루프백을 건너 서버 쪽 연결 소켓의 Recv-Q 에 5000 이 남고, 클라이언트 쪽은 Recv-Q 0 · Send-Q 0 이다. SIGCONT 로 깨우면 nc 가 읽어 0 으로 돌아간다.</desc>

<title id="dt">reflink 복사는 extent 를 함께 쓰고, 덮어쓴 4 KiB 만 갈라진다</title><desc id="dd">btrfs 실측이다. 위 컷은 64 MiB 파일 orig.bin 을 cp --reflink=always 로 copy.bin 에 복사한 직후다. 두 파일 모두 논리 블록 0..16383 이 물리 블록 5282848..5299231 한 extent 를 가리키고 filefrag 가 shared 로 표시한다. 아래 컷은 copy.bin 의 블록 8192 를 4 KiB 덮어쓴 뒤다. copy.bin 은 extent 셋으로 갈라져 블록 8192 만 물리 6602470 을 가리키고, 0..8191 과 8193..16383 은 여전히 원래 extent 를 shared 로 가리킨다. orig.bin 은 그대로다. df 사용량은 reflink 복사에 0 바이트, 덮어쓰기에 4096 바이트, cp --reflink=never 복사에 67108864 바이트 늘었다.</desc>
<rect width="880" height="940" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">reflink 복사는 extent 를 함께 쓰고, 덮어쓴 4 KiB 만 갈라진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">btrfs · 64 MiB 파일 · filefrag -v 와 df -B1 실측 — 공유는 그대로, 쓴 블록 하나만 새 자리로</text>
<text x="24" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">1. reflink 복사 직후</text>

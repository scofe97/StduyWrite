<title id="dt">유니온 마운트(OverlayFS)의 조회 · 수정 · 삭제 3대 흐름</title><desc id="dd">여러 디렉터리를 겹칠 때 상위(upper)와 하위(lower) 층 사이에서 일어나는 조회 우선순위, 쓰기 시 copy-up, 삭제 시 화이트아웃(c 0 0) 처리 흐름.</desc>
<rect width="880" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">유니온 마운트(OverlayFS)의 조회 · 수정 · 삭제 3대 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">하위 층은 불변으로 두고 상위 층에 변경분과 삭제 표식을 기록</text>
<rect x="24" y="120" width="264" height="320" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="156.0" y="146" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">1. 파일 조회 (Read)</text>
<text x="156.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Upper → Lower 하향 순회</text>
<line x1="36" y1="178" x2="276" y2="178" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="34" y="192" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="42" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">조회 시작</text>
<text x="42" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">merged 뷰에서 파일 요청</text>
<rect x="34" y="240" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="42" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">1차 탐색</text>
<text x="42" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">상위 upperdir 먼저 확인</text>
<rect x="34" y="288" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="42" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">상위 발견 시</text>
<text x="42" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">upperdir 파일 즉시 반환</text>
<rect x="34" y="336" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="42" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">상위 부재 시</text>
<text x="42" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">lowerdir 로 내려가 조회</text>
<rect x="34" y="384" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="42" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">결론</text>
<text x="42" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">상위 층이 하위 층 가림</text>
<rect x="302" y="120" width="264" height="320" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.5"/>
<text x="434.0" y="146" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">2. 파일 수정 (Write)</text>
<text x="434.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">쓰기 시점의 Copy-up</text>
<line x1="314" y1="178" x2="554" y2="178" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="312" y="192" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="320" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">수정 요청</text>
<text x="320" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">lowerdir 파일에 쓰기 시도</text>
<rect x="312" y="240" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="320" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">제약 조건</text>
<text x="320" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">하위 층은 읽기 전용(R/O)</text>
<rect x="312" y="288" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="320" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">복사 동작</text>
<text x="320" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">lowerdir → upperdir 복사</text>
<rect x="312" y="336" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="320" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">수정 적용</text>
<text x="320" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">upperdir 복사본에 데이터 기록</text>
<rect x="312" y="384" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="320" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">결론</text>
<text x="320" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">원본 훼손 없는 독립 수정</text>
<rect x="580" y="120" width="264" height="320" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="712.0" y="146" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">3. 파일 삭제 (Delete)</text>
<text x="712.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">화이트아웃(Whiteout) 표식</text>
<line x1="592" y1="178" x2="832" y2="178" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="590" y="192" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="598" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">삭제 요청</text>
<text x="598" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">lowerdir 파일 삭제 시도</text>
<rect x="590" y="240" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="598" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">제약 조건</text>
<text x="598" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">하위 파일 직접 삭제 불가</text>
<rect x="590" y="288" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="598" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">표식 생성</text>
<text x="598" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">upperdir 에 c 0 0 문자 노드</text>
<rect x="590" y="336" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="598" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">은폐 효과</text>
<text x="598" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">merged 뷰에서 파일 감춤</text>
<rect x="590" y="384" width="244" height="40" rx="5" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="598" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">결론</text>
<text x="598" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">하위 보존 · 뷰에서만 삭제</text>
<rect x="24" y="458" width="832" height="114" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">OverlayFS 계층 구조와 컨테이너 매핑</text>
<rect x="53.0" y="492" width="102.0" height="20" rx="4" fill="#0D1117" stroke="#F5F5F3" stroke-width="0.8"/>
<text x="104" y="506" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">merged 뷰</text>
<text x="194" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">통합 마운트 지점</text>
<text x="374" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">컨테이너 프로세스가 바라보는 단일 파일시스템 트리</text>
<rect x="49.26" y="516" width="109.48" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="104" y="530" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">upperdir (R/W)</text>
<text x="194" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">상위 컨테이너 쓰기 층</text>
<text x="374" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">신규 생성 파일 · 수정된 파일(copy-up) · 화이트아웃(c 0 0)</text>
<rect x="49.26" y="540" width="109.48" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="104" y="554" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">lowerdir (R/O)</text>
<text x="194" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">하위 베이스 이미지 층</text>
<text x="374" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">컨테이너들이 공유하는 읽기 전용 기본 루트 파일시스템</text>
<line x1="12" y1="588" x2="832" y2="588" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="610" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="600" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="610" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">조회 (Upper 우선)</text>
<rect x="313" y="600" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="335" y="610" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수정 (Copy-up)</text>
<rect x="513" y="600" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="535" y="610" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">삭제 (Whiteout)</text>
<rect x="726" y="600" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="748" y="610" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">불변 베이스 층</text>
</svg>
<title id="dt">페이지 테이블 매핑 — 프로세스 격리와 물리 메모리 공유</title><desc id="dd">각 프로세스는 독립된 가상 주소 공간을 보지만, 페이지 테이블을 거쳐 공유 라이브러리는 같은 물리 페이지 한 벌을 가리킨다.</desc>

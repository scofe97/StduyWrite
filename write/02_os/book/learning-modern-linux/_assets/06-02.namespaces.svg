<title id="dt">도구가 무엇이든 같은 커널 함수에서 태어난다</title><desc id="dd">runc 와 unshare 가 각각 clone()·unshare() 시스템 콜을 부르면 커널의 copy_namespaces()·unshare_nsproxy_namespaces() 를 지나 둘 다 create_new_namespaces() 로 들어간다. setns() 는 새로 만들지 않고 기존 네임스페이스에 합류한다.</desc>
<rect width="880" height="372" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">도구가 무엇이든 같은 커널 함수에서 태어난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">보이는 것을 가리는 커튼이지 보안의 단단한 벽은 아닙니다</text>

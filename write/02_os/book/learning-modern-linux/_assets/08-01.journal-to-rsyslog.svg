<title id="dt">한 줄이 journald 를 거쳐 rsyslog 의 파일로 가는 두 길</title><desc id="dd">systemd 배포판에서 /dev/log 로 들어온 줄은 journald 가 먼저 받아 저널 파일에 쓴다. 여기까지는 두 배포판이 같다. Debian 12 에서는 journald 가 ForwardToSyslog=yes 로 /run/systemd/journal/syslog 소켓에 밀어 주고 rsyslogd 의 imuxsock 이 받는다. Rocky Linux 9 에서는 rsyslogd 의 imjournal 이 저널 파일을 직접 읽고 읽은 위치를 상태 파일에 적는다. 그 뒤 rsyslog 규칙이 줄을 /var/log 의 텍스트 파일로 나눈다.</desc>
<rect width="960" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 줄이 journald 를 거쳐 rsyslog 의 파일로 가는 두 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Debian 은 소켓으로 넘겨받고 Rocky 는 저널 파일을 직접 읽습니다</text>
<rect x="252" y="100" width="696" height="128" rx="8" fill="#6A95D808" stroke="#6A95D8" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="268" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">Debian 12 — journald 가 밀어 줌</text>
<rect x="424" y="380" width="524" height="124" rx="8" fill="#3FB98C08" stroke="#3FB98C" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="440" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">Rocky Linux 9 — rsyslog 가 읽어 감</text>
<text x="24" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">두 배포판 공통</text>

<rect x="436" y="132" width="212" height="60" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="542.0" y="157.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#F5F5F3">/run/systemd/journal/syslog</text>
<text x="542.0" y="175.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">유닉스 소켓</text>

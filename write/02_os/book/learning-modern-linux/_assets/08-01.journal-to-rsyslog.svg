<text x="872.0" y="175.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">/var/log/auth.log</text>
<path d="M 338.0 260 L 338.0 162.0 L 432 162.0" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="346.0" y="216" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#6A95D8">3 ForwardToSyslog=yes</text>

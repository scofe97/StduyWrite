<title id="dt">한 줄이 journald 를 거쳐 rsyslog 의 파일로 가는 두 길</title><desc id="dd">systemd 배포판에서 /dev/log 로 들어온 줄은 journald 가 먼저 받는다. rsyslog 는 Debian 에서는 소켓으로 넘겨받고 Rocky 에서는 저널 파일을 직접 읽는다.</desc>
<rect width="880" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 줄이 journald 를 거쳐 rsyslog 의 파일로 가는 두 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Debian 은 소켓으로 넘겨받고 Rocky 는 저널 파일을 직접 읽습니다</text>
<rect x="24" y="192.0" width="132" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="90.0" y="218.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">/dev/log</text>
<text x="90.0" y="238.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">logger · 데몬 · 앱</text>
<rect x="180" y="192.0" width="132" height="64" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="246.0" y="218.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">systemd-journald</text>
<text x="246.0" y="238.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">모든 줄을 먼저 받음</text>
<path d="M 156 224.0 L 176 224.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<line x1="312" y1="224.0" x2="324" y2="224.0" stroke="#8B98A9" stroke-width="1.3"/>
<text x="336" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">Debian 12</text>
<path d="M 324 224.0 L 324 164.0 L 332 164.0" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="336" y="124" width="216" height="80" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="350" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">/run/systemd/journal/syslog</text>
<text x="350" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ForwardToSyslog=yes (기본)</text>
<path d="M 552 164.0 L 572 164.0" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="576" y="124" width="120" height="80" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="590" y="150" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">imuxsock</text>
<text x="590" y="170" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소켓으로 받음</text>
<path d="M 696 164.0 L 716 164.0" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="720" y="124" width="136" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="732" y="150" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">/var/log/syslog</text>
<text x="732" y="170" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">/var/log/auth.log</text>
<text x="732" y="190" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">cron.log …</text>
<text x="336" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">Rocky Linux 9</text>
<path d="M 324 224.0 L 324 284.0 L 332 284.0" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="336" y="244" width="216" height="80" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="350" y="276" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">/var/log/journal/…/*.journal</text>
<text x="350" y="298" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Storage= 가 정한 파일</text>
<path d="M 552 284.0 L 572 284.0" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="576" y="244" width="120" height="80" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="590" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">imjournal</text>
<text x="590" y="290" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저널 파일을 읽음</text>
<text x="590" y="310" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">SysSock.Use=off</text>
<path d="M 696 284.0 L 716 284.0" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="720" y="244" width="136" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="732" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">/var/log/messages</text>
<text x="732" y="290" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">/var/log/secure</text>
<text x="732" y="310" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">cron …</text>
<line x1="720" y1="344" x2="856" y2="344" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="720" y1="338" x2="720" y2="344" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="856" y1="338" x2="856" y2="344" stroke="#8B98A9" stroke-width="1.0"/>
<text x="856" y="364" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">logrotate 가 돌리는 파일 · §7</text>
<line x1="12" y1="388" x2="832" y2="388" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="410" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

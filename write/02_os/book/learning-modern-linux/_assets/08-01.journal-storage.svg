<title id="dt">Storage= 값과 디렉터리 하나가 저널의 자리를 정한다</title><desc id="dd">journald.conf 의 Storage= 네 값이 저널 파일을 디스크의 /var/log/journal 과 메모리의 /run/log/journal 중 어디에 쓰는지. Debian 12 기본값 auto 는 /var/log/journal 디렉터리가 있는지로 갈린다. journalctl --flush 는 /run 쪽 항목을 /var 쪽으로 옮긴다.</desc>
<rect width="920" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Storage= 값과 디렉터리 하나가 저널의 자리를 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Debian 12 기본값 auto 에서는 디렉터리 하나가 재부팅 뒤 기록을 정합니다</text>
<rect x="24" y="248" width="136" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="92.0" y="272" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Storage=</text>
<text x="92.0" y="292" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">journald.conf</text>
<rect x="256" y="248" width="196" height="56" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="354.0" y="272" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">/var/log/journal</text>
<text x="354.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">디렉터리가 있나</text>
<rect x="556" y="112" width="340" height="124" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.3"/>
<text x="572" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">디스크</text>
<text x="632" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">재부팅 뒤 남음 · -b -1 로 조회</text>
<text x="572" y="160" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">/var/log/journal/&lt;machine-id&gt;/</text>
<rect x="588" y="170" width="148" height="24" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="1.0"/>
<text x="662" y="187" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">system.journal</text>
<text x="572" y="224" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">SystemMaxUse 10% · KeepFree 15% · 각 최대 4G</text>
<rect x="556" y="320" width="340" height="120" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.3"/>
<text x="572" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">메모리</text>
<text x="632" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">/run · 재부팅에 사라짐</text>
<text x="572" y="368" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">/run/log/journal/&lt;machine-id&gt;/</text>
<rect x="588" y="378" width="148" height="24" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="1.0"/>
<text x="662" y="395" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">system.journal</text>
<text x="572" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">RuntimeMaxUse= 등 Runtime 짝</text>
<rect x="556" y="452" width="340" height="40" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="572" y="477" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">저장 안 함</text>
<text x="652" y="477" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">imjournal 같은 독자가 읽을 것이 없음</text>
<path d="M 860 318 L 860 240" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="848" y="270" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">journalctl --flush</text>
<text x="848" y="290" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">/run 의 항목을 옮김</text>
<line x1="160" y1="276.0" x2="196" y2="276.0" stroke="#8B98A9" stroke-width="1.3"/>
<line x1="196" y1="152" x2="196" y2="472" stroke="#8B98A9" stroke-width="1.3"/>
<path d="M 196 152 L 552 152" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="258.9" y="142" width="82.2" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="300" y="156" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">persistent</text>
<text x="372" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">없으면 만듦</text>
<path d="M 196 276.0 L 252 276.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="205.36" y="266.0" width="41.28" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="226" y="280.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">auto</text>
<path d="M 452 276.0 L 508 276.0 L 508 196 L 552 196" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="490.0" y="222" width="36.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="508" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">있음</text>
<path d="M 354.0 304 L 354.0 376 L 552 376" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#warn)"/>
<rect x="336.0" y="326" width="36.0" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="354.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">없음</text>
<path d="M 196 412 L 552 412" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="265.72" y="402" width="68.56" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="300" y="416" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">volatile</text>
<path d="M 196 472 L 552 472" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="279.36" y="462" width="41.28" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="300" y="476" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">none</text>
<text x="24" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Debian 12 실측 · 디렉터리 삭제 뒤 재시작 → /run 에만 생김 · 다시 만들고 --flush → /var 로 옮겨짐</text>
<line x1="12" y1="536" x2="872" y2="536" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="558" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="548" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">디렉터리 하나가 가르는 판정</text>
<rect x="339" y="548" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="361" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재부팅 뒤 남음</text>
<rect x="487" y="548" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="509" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재부팅에 사라짐</text>
<rect x="635" y="548" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="657" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저장 안 함</text>
</svg>
<title id="dt">Storage= 값과 디렉터리 하나가 저널의 자리를 정한다</title><desc id="dd">journald.conf 의 Storage= 네 값이 저널 파일을 어디에 쓰는지. 기본값 auto 는 /var/log/journal 디렉터리가 있는지로 영속과 휘발을 가른다.</desc>
<rect width="880" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §9</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Storage= 값과 디렉터리 하나가 저널의 자리를 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">기본값 auto 에서는 디렉터리 하나가 재부팅 뒤 기록을 정합니다</text>
<rect x="24" y="196" width="140" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="94.0" y="220" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Storage=</text>
<text x="94.0" y="240" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">journald.conf</text>
<rect x="260" y="196" width="196" height="56" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="358.0" y="220" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">/var/log/journal</text>
<text x="358.0" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">디렉터리가 있나</text>
<rect x="560" y="96" width="296" height="80" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="574" y="122" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">/var/log/journal/&lt;id&gt;/system.journal</text>
<text x="574" y="142" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">영속 · 재부팅 뒤 -b -1 로 조회</text>
<text x="574" y="162" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">SystemMaxUse 10% · KeepFree 15% · 각 4G</text>
<rect x="560" y="288" width="296" height="80" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="574" y="314" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">/run/log/journal/&lt;id&gt;/system.journal</text>
<text x="574" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">휘발 · 재부팅에 사라짐</text>
<text x="574" y="354" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">RuntimeMaxUse= 등 Runtime 짝</text>
<rect x="560" y="392" width="296" height="48" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="574" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">저장 안 함</text>
<text x="574" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">imjournal 이 읽을 파일 없음</text>
<line x1="164" y1="224.0" x2="196" y2="224.0" stroke="#8B98A9" stroke-width="1.3"/>
<line x1="196" y1="128" x2="196" y2="416" stroke="#8B98A9" stroke-width="1.3"/>
<path d="M 196 128 L 556 128" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="258.9" y="118" width="82.2" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="300" y="132" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">persistent</text>
<text x="372" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">없으면 만듦</text>
<path d="M 196 224.0 L 256 224.0" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="207.36" y="214.0" width="41.28" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="228" y="228.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">auto</text>
<path d="M 456 224.0 L 508 224.0 L 508 152 L 556 152" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="490.0" y="178" width="36.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="508" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">있음</text>
<path d="M 358.0 252 L 358.0 308 L 556 308" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#warn)"/>
<rect x="340.0" y="270" width="36.0" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="358.0" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">없음</text>
<path d="M 196 344 L 556 344" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="265.72" y="334" width="68.56" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="300" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">volatile</text>
<path d="M 196 416 L 556 416" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="279.36" y="406" width="41.28" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="300" y="420" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">none</text>
<line x1="12" y1="468" x2="832" y2="468" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="490" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="480" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">디렉터리 하나가 가르는 판정</text>
<rect x="339" y="480" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="361" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재부팅 뒤 남음</text>
<rect x="487" y="480" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="509" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재부팅에 사라짐</text>
<rect x="635" y="480" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="657" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저장 안 함</text>

<title id="dt">SIGTERM 을 무시하는 서비스는 3초를 버티고 SIGKILL 을 맞는다</title><desc id="dd">TimeoutStopSec=3 인 서비스를 systemctl stop 으로 멈춘 실측. journal 의 시각을 그대로 옮겼다. 주 프로세스 1262 와 자식 sleep 1283 은 유닛의 cgroup 안에 있고, KillMode=control-group 이라 SIGTERM·SIGCONT 와 SIGKILL 이 둘 모두에게 간다. 기본값이었다면 같은 일이 90초 뒤에 일어난다.</desc>
<rect width="920" height="636" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 09-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SIGTERM 을 무시하는 서비스는 3초를 버티고 SIGKILL 을 맞는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">systemd 는 cgroup 안의 프로세스 모두에게 보내고, 시간이 다 되면 모두를 죽입니다</text>
<text x="469.33333333333326" y="107" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">cgroup · stubborn.service · KillMode=control-group</text>

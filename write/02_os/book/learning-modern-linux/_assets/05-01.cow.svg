<title id="dt">복사는 포인터만, 쓰기는 고친 블록 하나만</title><desc id="dd">위 컷은 file1 을 file2 로 복사한 직후다. 두 파일의 메타데이터가 디스크의 같은 블록 A·B·C 를 가리킨다. 아래 컷은 file2 가 C 를 고친 뒤다. C 의 사본 C′ 이 빈 블록에 새로 생기고 file2 의 세 번째 포인터만 C′ 으로 옮겨 간다. file1 은 그대로 A·B·C 를 가리킨다.</desc>
<rect width="880" height="792" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §8</text>

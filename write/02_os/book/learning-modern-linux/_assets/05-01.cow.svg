<title id="dt">복사할 때는 메타데이터 포인터만, 수정할 때에야 신규 블록 할당</title><desc id="dd">CoW 메커니즘의 전후 상태. 1단계에서는 블록 포인터만 복제해 공간을 아끼고, 2단계에서 쓰기 발생 시에만 수정 블록 C' 이 신규 생성되는 과정.</desc>

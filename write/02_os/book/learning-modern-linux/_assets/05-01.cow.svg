<text x="44" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#3FB98C">읽기 전용 베이스 이미지 — 컨테이너 간 기본 레이어 공유</text>

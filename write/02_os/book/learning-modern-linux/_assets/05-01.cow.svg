<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">데이터 블록은 그대로 두고 메타데이터의 블록 포인터만 복제했다가, 쓰는 블록만 갈라 낸다</text>

<title id="dt">HTTP API 로 microVM 을 띄우고 격리와 가상 장치를 묶는다</title><desc id="dd">Firecracker 를 호스트 위의 실제 구성요소로 나눈 것. 호스트의 호출자가 HTTP API 로 microVM 의 생성, 조회, 중지를 요청하고, Firecracker 프로세스는 microVM 을 KVM 인스턴스로 돌린다. microVM 의 네트워크는 호스트 TUN/TAP 장치로, 블록 장치는 호스트 파일과 Virtio 로 이어진다. 호스트로 내려가는 시스템 콜은 seccomp 필터가 제한하고, 로그와 메트릭은 명명 파이프로 모은다.</desc>
<rect width="880" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 09-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">HTTP API 로 microVM 을 띄우고 격리와 가상 장치를 묶는다</text>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">컨테이너 없이도 네임스페이스는 이미 여기저기 쓰이고 있습니다</text>

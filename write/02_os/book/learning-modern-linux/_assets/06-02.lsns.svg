<title id="dt">PID 1 의 일곱 칸과 프로세스 하나짜리 칸</title><desc id="dd">sudo lsns 출력 그대로다. PID 1 이 쓰는 기본 네임스페이스 일곱은 NPROCS 가 240 을 넘고, systemd-timesync·systemd-resolve 의 mnt 와 크롬의 user 는 프로세스 하나짜리 네임스페이스다.</desc>

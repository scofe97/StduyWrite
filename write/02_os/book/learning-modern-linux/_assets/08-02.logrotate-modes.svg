<title id="dt">회전 뒤 fd 1 이 가리키는 inode</title><desc id="dd">0.1초마다 한 줄씩 덧붙이는 프로세스를 두고 logrotate -f 로 돌렸다. 칸마다 inode · 이름 · 크기이고, ▶ 표시가 쓰는 프로세스의 fd 1 이 가리키는 파일이다.</desc>

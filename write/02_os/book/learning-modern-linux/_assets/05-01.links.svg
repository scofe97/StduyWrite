<title id="dt">하드 링크와 심볼릭 링크의 데이터 조회 순서</title><desc id="dd">cat 실행 시 하드 링크는 아이노드를 직접 참조해 1회에 도달하고, 심볼릭 링크는 경로 문자열을 읽어 2회 조회를 거쳐 도달합니다.</desc>
<rect width="880" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">하드 링크와 심볼릭 링크의 데이터 조회 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원본 삭제 시 하드 링크는 데이터 보존, 심볼릭 링크는 깨진 링크</text>
<rect x="24" y="120" width="404" height="330" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="42" y="146" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">하드 링크 조회 — cat somealias</text>
<text x="42" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">아이노드 직접 참조 (1회 도달)</text>
<line x1="38" y1="178" x2="414" y2="178" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="38" y="192" width="376" height="62" rx="6" fill="#0D1117" stroke="#F5F5F3" stroke-width="1.0"/>
<text x="50" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">1. 디렉터리 항목 조회</text>
<text x="50" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">dentry 'somealias' 매핑 검색</text>
<path d="M 226.0 254 L 226.0 270" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="38" y="272" width="376" height="62" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.0"/>
<text x="50" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">2. 아이노드 번호 직접 연결</text>
<text x="50" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Inode 6302071 (Links: 2 · 크기 0B)</text>
<path d="M 226.0 334 L 226.0 350" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="38" y="352" width="376" height="62" rx="6" fill="#0D1117" stroke="#F5F5F3" stroke-width="1.0"/>
<text x="50" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">3. 데이터 블록 읽기</text>
<text x="50" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Inode 블록 포인터로 실제 데이터 도달</text>
<rect x="452" y="120" width="404" height="330" rx="8" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="470" y="146" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">심볼릭 링크 조회 — cat somesoftalias</text>
<text x="470" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">경로 문자열 경유 (2회 도달)</text>
<line x1="466" y1="178" x2="842" y2="178" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="466" y="192" width="376" height="62" rx="6" fill="#0D1117" stroke="#F5F5F3" stroke-width="1.0"/>
<text x="478" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">1. 링크 파일 아이노드 조회</text>
<text x="478" y="236" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Inode 6303540 (Links: 1 · Size: 6)</text>
<path d="M 654.0 254 L 654.0 270" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="466" y="272" width="376" height="62" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="1.0"/>
<text x="478" y="294" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">2. 내용에서 대상 경로 추출</text>
<text x="478" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">문자열 'myfile' (6바이트) 읽기</text>
<path d="M 654.0 334 L 654.0 350" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="466" y="352" width="376" height="62" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.0"/>
<text x="478" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">3. 대상 경로 2차 탐색 및 도달</text>
<text x="478" y="396" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Inode 6302071 검색 후 데이터 블록 읽기</text>
<rect x="24" y="466" width="832" height="86" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="600" fill="#F5F5F3">원본 파일 삭제(rm myfile) 시 동작 차이</text>
<rect x="40" y="502" width="400" height="38" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="50" y="518" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#3FB98C">somealias (하드 링크)</text>
<text x="50" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Inode 6302071 링크 수 2→1 감소 · 데이터 보존</text>
<rect x="452" y="502" width="400" height="38" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="462" y="518" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#F08A59">somesoftalias (심볼릭 링크)</text>
<text x="462" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">경로 'myfile' 부재 · 깨진 링크(dangling link)</text>
<line x1="12" y1="566" x2="832" y2="566" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="588" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="578" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">직접 참조 및 데이터</text>
<rect x="287" y="578" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="309" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">경로 문자열 및 간접 참조</text>
<rect x="513" y="578" width="14" height="12" rx="2" fill="#F5F5F322" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="535" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">메타데이터 및 조회 절차</text>
</svg>
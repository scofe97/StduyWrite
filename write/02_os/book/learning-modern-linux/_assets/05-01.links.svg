<title id="dt">하드 링크는 같은 아이노드를, 심볼릭 링크는 이름을 가리킨다</title><desc id="dd">디렉터리 항목 myfile 과 somealias 는 같은 아이노드 6302071 을 가리켜 Links 가 2 다. somesoftalias 는 자기 아이노드 6303540 을 따로 갖고 그 내용은 경로 문자열 myfile 6 바이트다. cat somesoftalias 는 이 문자열을 읽어 디렉터리에서 myfile 을 다시 찾는다. rm myfile 뒤에는 somealias 가 Links 1 로 데이터를 지키고 somesoftalias 는 찾을 이름이 없어 깨진 링크가 된다.</desc>

<title id="dt">파이프 버퍼를 사이에 둔 세 장면</title><desc id="dd">쓰는 프로세스, 커널 파이프 버퍼 16칸(칸마다 4,096바이트, 합 65,536바이트), 읽는 프로세스를 같은 자리에 두고 세 장면을 쌓았다. 첫 장면은 6바이트가 지나가 wc -l 이 3 을 낸다. 둘째는 읽지 않는 sleep 앞에서 16칸이 가득 찬다. 셋째는 head -1 이 먼저 끝나 yes 가 SIGPIPE 로 141 을 남긴다.</desc>
<rect width="960" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 03-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">파이프 버퍼를 사이에 둔 세 장면</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 프로세스는 동시에 돌고, 그 사이의 버퍼가 속도 차이를 받아 냅니다</text>
<text x="145.0" y="98" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">쓰는 쪽 · FD 1</text>
<text x="480" y="98" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">커널 파이프 버퍼 · 4,096 B × 16칸</text>
<text x="820.0" y="98" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">읽는 쪽 · FD 0</text>
<text x="20" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">장면 1 · 쓴 만큼 읽음</text>
<rect x="20" y="136" width="250" height="72" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="34" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">printf 'a\nb\nc\n'</text>
<text x="34" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">6바이트 쓰고 종료</text>

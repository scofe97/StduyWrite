<title id="dt">PE 조각을 VG 풀에 모았다가 LV 마다 나눠 준다</title><desc id="dd">디스크 /dev/sda 의 파티션 sda2 가 PV 로 초기화되어 4 MiB PE 57105 개로 잘리고, 볼륨 그룹 elementary-vg 가 그 PE 를 풀로 모은다. 논리 볼륨 root 가 56857 PE, swap_1 이 244 PE 를 가져가고 4 PE 가 남는다. root 에는 ext4 가 올라가 / 에 마운트되고 swap_1 은 스왑으로 쓰인다. 새 디스크를 PV 로 만들어 같은 VG 에 넣으면 풀이 커진다.</desc>
<rect width="960" height="712" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">PE 조각을 VG 풀에 모았다가 LV 마다 나눠 준다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">VG 는 나뉘는 쪽이 아니라 모이는 쪽 — 나뉘는 것은 VG 의 PE 를 가져가는 LV 다</text>

<title id="dt">키울 때는 아래 층부터, 줄일 때는 위 층부터</title><desc id="dd">위 판은 lvextend -r -L +100M 이다. VG 의 Free PE 가 LV vg0/data 로 넘어가 200 MiB(50 extents)가 300 MiB(75 extents)가 되고, 이어 마운트된 ext4 가 307200 (1k) 블록으로 늘어난다. 아래 판은 줄이기다. ext4 를 언마운트해 먼저 줄이고 그다음 LV 를 줄여 PE 를 VG 에 돌려준다. LV 를 먼저 자르면 파일시스템 꼬리가 잘린다. XFS 는 fsadm 이 줄이기를 거절한다.</desc>
<rect width="920" height="760" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 05-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">키울 때는 아래 층부터, 줄일 때는 위 층부터</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 층은 아래 층에 이미 있는 공간만 쓴다 — 그래서 늘리는 순서와 줄이는 순서가 반대다</text>
<text x="24" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#3FB98C">키우기</text>
<text x="88" y="118" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">lvextend -r -L +100M /dev/vg0/data</text>
<text x="24" y="153" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">파일시스템</text>
<text x="24" y="170" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">ext4 /mnt/lv</text>
<text x="24" y="213" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">LV</text>

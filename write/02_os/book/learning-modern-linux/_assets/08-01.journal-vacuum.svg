<line x1="96" y1="420" x2="840" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="92" y1="420.0" x2="96" y2="420.0" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="88" y="424.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">0M</text>
<line x1="92" y1="355.0" x2="96" y2="355.0" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="88" y="359.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">10M</text>
<line x1="92" y1="290.0" x2="96" y2="290.0" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="88" y="294.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">20M</text>
<line x1="92" y1="225.0" x2="96" y2="225.0" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="88" y="229.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">30M</text>
<line x1="92" y1="160.0" x2="96" y2="160.0" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="88" y="164.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">40M</text>
<line x1="96" y1="316.0" x2="840" y2="316.0" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="6 4"/>
<text x="844" y="320.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">16M</text>
<line x1="264" y1="181.45" x2="320" y2="181.45" stroke="#8B98A9" stroke-width="1.0" stroke-dasharray="3 4"/>
<line x1="448" y1="181.45" x2="504" y2="181.45" stroke="#8B98A9" stroke-width="1.0" stroke-dasharray="3 4"/>
<rect x="136" y="181.45" width="128" height="238.55" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.2"/>
<text x="200.0" y="173.45" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">36.7M</text>
<text x="200.0" y="244.5" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">보관 + 활성</text>
<rect x="320" y="181.45" width="128" height="238.55" rx="4" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.2"/>
<text x="384.0" y="244.5" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">전부 보관</text>
<text x="384.0" y="262.5" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">옛 활성 포함</text>
<rect x="320" y="165.45" width="128" height="14" rx="3" fill="none" stroke="#3FB98C" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="384.0" y="157.45" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">새 system.journal</text>
<rect x="504" y="279.6" width="128" height="140.39999999999998" rx="4" fill="#F08A591A" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="568.0" y="343.8" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">system@….journal</text>
<text x="568.0" y="363.8" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">21.6M 삭제</text>
<rect x="504" y="181.45" width="128" height="98.15000000000003" rx="4" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.2"/>
<text x="568.0" y="235.525" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">남는 15.1M</text>
<text x="568.0" y="173.45" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">가장 오래된 것부터</text>
<path d="M 636 230.525 L 752.0 230.525 L 752.0 288.0" fill="none" stroke="#8B98A9" stroke-width="1.1" marker-end="url(#ar)"/>
<rect x="688" y="321.85" width="128" height="98.14999999999998" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="752.0" y="308.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">15.1M</text>
<text x="752.0" y="376.25" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">보관 + 활성</text>
<text x="200.0" y="442" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">--disk-usage</text>
<text x="200.0" y="460" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">채운 뒤</text>
<text x="384.0" y="442" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">--rotate</text>
<text x="384.0" y="460" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">활성 → 보관</text>
<text x="568.0" y="442" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">--vacuum-size=16M</text>
<text x="568.0" y="460" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">보관 파일만</text>
<text x="752.0" y="442" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">--disk-usage</text>
<text x="752.0" y="460" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">정리 뒤</text>
<text x="24" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">36.7 − 21.6 = 15.1 · 막대 아래가 오래된 파일 · rotate 직후 합계와 새 활성 크기는 출력에 없음</text>
<line x1="12" y1="508" x2="872" y2="508" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="530" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

<title id="dt">저널 사용량은 rotate 뒤 vacuum 으로 줄어든다</title><desc id="dd">컨테이너의 /var/log/journal/f6c1e3bd.../ 안 파일 합계가 --disk-usage, --rotate, --vacuum-size=16M, --disk-usage 를 차례로 지나며 바뀌는 모습. rotate 가 활성 파일을 보관으로 넘기고, vacuum 이 가장 오래된 보관 파일 system@….journal 21.6M 을 지워 36.7M 이 15.1M 이 된다.</desc>
<rect width="920" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 08-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">저널 사용량은 rotate 뒤 vacuum 으로 줄어든다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">vacuum 은 보관 파일만, 오래된 것부터 지운다 — 21.6M 하나로 16M 아래가 됐다</text>
<text x="24" y="124" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">/var/log/journal/f6c1e3bd.../</text>
<text x="272" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">안 파일의 합계</text>

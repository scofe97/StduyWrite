<text x="894.0" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">-f 일 때 4xx·5xx</text>
<text x="894.0" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">빈 응답 · 리다이렉트</text>
<text x="894.0" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">curl -v · 서버 로그</text>
<rect x="24" y="408" width="952" height="78" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="44" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">0 ms 는 상대가 대답했다는 뜻입니다</text>
<text x="44" y="456" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">즉시 거절당하려면 패킷이 거기까지 갔다 와야 합니다. 도달에는 성공했고 그 포트만 안 열린 것입니다.</text>
<text x="44" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">한도를 다 채웠다면 아무도 대답하지 않은 것이라, 길이 없거나 중간의 무엇이 조용히 버린 것입니다.</text>
<text x="24" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">가른 뒤의 순서</text>
<rect x="24" y="518" width="190" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="38" y="542" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">1</text>
<text x="56" y="540" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">curl</text>
<text x="56" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부류를 가른다 — 6·7·28</text>
<path d="M 215 544 L 236 544" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="238" y="518" width="190" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="252" y="542" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">2</text>
<text x="270" y="540" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">route -n get</text>
<text x="270" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">길이 있는지 (28 일 때)</text>
<path d="M 429 544 L 450 544" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>

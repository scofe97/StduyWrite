<text x="414.0" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#8B98A9">라우팅 · 방화벽</text>
<path d="M 734.0 234 L 734.0 288" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#warn)" stroke-dasharray="4 4"/>

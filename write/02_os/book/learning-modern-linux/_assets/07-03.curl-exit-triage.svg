<title id="dt">종료 코드가 요청이 어디까지 갔는지를 말해 준다</title><desc id="dd">curl 한 방이면 어느 층에서 끊겼는지 부류가 갈린다. 6 은 이름에서, 7 은 포트에서, 28 은 아무 대답도 못 받고 한도까지 기다린 것이다. 35·60 은 TLS 에서, 22·52·47 은 응답에서 끊긴 것이다.</desc>
<rect width="1000" height="726" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 07-03 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">종료 코드가 요청이 어디까지 갔는지를 말해 준다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">0 ms 와 6005 ms 가 갈라 줍니다</text>

<title id="dt">tmpfs 400MiB 가 옮겨 놓는 free 의 칸</title><desc id="dd">같은 total 8004MiB 를 네 조각으로 나눴다. /dev/shm 에 400MiB 를 쓰면 내어 줄 수 없는 캐시 조각이 커지고, 그 조각이 used 와 buff/cache 양쪽에 함께 잡힌다.</desc>

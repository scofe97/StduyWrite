<title id="dt">제어는 세 번 넘어가고, 마지막에 받은 PID 1 은 내려놓지 않는다</title><desc id="dd">펌웨어(UEFI, 설정은 NVRAM)가 디스크의 부트로더 GRUB 2 에 제어를 넘기고, 부트로더가 /boot 의 압축된 커널을 풀어 주기억장치에 올린다. 커널은 서브시스템·파일시스템·드라이버를 초기화한 뒤 init 에 제어를 넘기고 여기서 부팅 본체가 끝난다. PID 1 인 systemd[1] 은 데몬과 셸 같은 사용자 공간 프로세스를 띄우고 고아 프로세스를 거두며 전원을 끌 때까지 돈다.</desc>
<rect width="960" height="740" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">제어는 세 번 넘어가고, 마지막에 받은 PID 1 은 내려놓지 않는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">부팅 본체는 3 에서 끝나지만 PID 1 은 전원을 끌 때까지 돈다</text>
<rect x="24" y="112" width="300" height="220" rx="10" fill="#F5F5F305" stroke="#5E6B7E" stroke-width="1" stroke-dasharray="5 4"/>
<text x="40" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">펌웨어 · 메인보드</text>
<rect x="348" y="112" width="588" height="220" rx="10" fill="#F5F5F305" stroke="#5E6B7E" stroke-width="1" stroke-dasharray="5 4"/>
<text x="364" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">디스크 · 부팅 매체</text>

<title id="dt">docker run 한 줄이 호스트 안에서 지나는 자리</title><desc id="dd">사용자가 docker CLI 로 docker run -d --rm nginx:1.21 을 치면 명령이 Docker 데몬으로 간다. 데몬은 필요하면 레지스트리에서 이미지를 당겨 오는데, 이미지는 JSON 메타데이터와 디렉토리인 층을 담은 압축 아카이브다. 데몬은 런타임 입력을 받아 커널에 네임스페이스와 cgroups 를 만들고 그 안에서 이미지에 정의된 앱을 프로세스 그룹으로 띄운다. 커널의 네 재료는 Docker 이전부터 있었다.</desc>
<rect width="880" height="612" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING MODERN LINUX · 06-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">docker run 한 줄이 호스트 안에서 지나는 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Docker 가 새로 만든 것은 커널 아래가 아니라 위의 사용 방식입니다</text>

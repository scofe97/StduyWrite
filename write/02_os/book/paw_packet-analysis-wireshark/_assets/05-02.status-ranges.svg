<title id="dt">상태 코드 구간이 볼 곳을 정한다</title><desc id="dd">상태 코드는 임의의 숫자가 아니라 백 단위로 묶인 구간이다. 첫 자리만 봐도 응답이 어느 성격인지, 그래서 다음에 어디를 볼지가 정해진다. 성능 조사에서 실제로 찾는 것은 오류 구간이 아니라 2xx 인데 느린 요청이라, 상태 코드와 응답 시간을 함께 걸어야 나온다.</desc>
<rect width="960" height="720" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">상태 코드 구간이 볼 곳을 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">찾는 것은 오류가 아니라 성공했는데 느린 요청입니다</text>
<line x1="150" y1="120" x2="150" y2="580" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<text x="150" y="108" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">첫 자리</text>
<rect x="210" y="128" width="720" height="76" rx="8" fill="#8B98A90A" stroke="#8B98A9" stroke-width="1.1"/>
<line x1="150" y1="152" x2="202" y2="152" stroke="#8B98A9" stroke-width="1.2"/>
<text x="138" y="148" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">1xx</text>
<text x="138" y="166" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">100 ~ 101</text>
<text x="234" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">중간 응답</text>
<text x="234" y="178" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">100 Continue · 101 Switching protocol</text>
<rect x="727.0" y="148" width="146.0" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="800" y="162" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">본 응답이 뒤에 따로 옴</text>
<rect x="210" y="220" width="720" height="76" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.5"/>
<line x1="150" y1="244" x2="202" y2="244" stroke="#F08A59" stroke-width="1.2"/>
<text x="138" y="240" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">2xx</text>
<text x="138" y="258" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">200 ~ 206</text>
<text x="234" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">성공</text>
<text x="234" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">200 OK · 201 Created</text>
<rect x="692.0" y="240" width="216.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="800" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">http.time 으로 느린 것 추림</text>
<rect x="210" y="312" width="720" height="76" rx="8" fill="#6A95D80A" stroke="#6A95D8" stroke-width="1.1"/>
<line x1="150" y1="336" x2="202" y2="336" stroke="#6A95D8" stroke-width="1.2"/>
<text x="138" y="332" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">3xx</text>
<text x="138" y="350" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">300 ~ 308</text>
<text x="234" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">재지정</text>
<text x="234" y="362" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">300 Multiple choices · 301 Moved permanently</text>
<rect x="727.0" y="332" width="146.0" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="800" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">다음 요청의 목적지 확인</text>
<rect x="210" y="404" width="720" height="76" rx="8" fill="#E3B3410A" stroke="#E3B341" stroke-width="1.1"/>
<line x1="150" y1="428" x2="202" y2="428" stroke="#E3B341" stroke-width="1.2"/>
<text x="138" y="424" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">4xx</text>
<text x="138" y="442" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">400 ~ 417</text>
<text x="234" y="432" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">클라이언트 오류</text>
<text x="234" y="454" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">400 Bad Request · 401 Unauthorized</text>
<rect x="727.0" y="424" width="146.0" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="800" y="438" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">요청 헤더 · 인증 정보</text>
<rect x="210" y="496" width="720" height="76" rx="8" fill="#F0616D0A" stroke="#F0616D" stroke-width="1.1"/>
<line x1="150" y1="520" x2="202" y2="520" stroke="#F0616D" stroke-width="1.2"/>
<text x="138" y="516" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">5xx</text>
<text x="138" y="534" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">500 ~ 505</text>
<text x="234" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">서버 오류</text>
<text x="234" y="546" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">500 Internal Server Error · 501 Not implemented</text>
<rect x="732.0" y="516" width="136.0" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="800" y="530" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">서버 로그 · 업스트림</text>
<text x="24" y="620" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">부류로 거르기 — http.response.code &gt;= 400 &amp;&amp; http.response.code &lt; 500</text>
<text x="24" y="644" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">성능 조사의 실제 대상 — http.response.code == 200 &amp;&amp; http.time &gt; 1</text>
<line x1="12" y1="676" x2="912" y2="676" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="698" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="688" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="698" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">성공했는데 느린 구간</text>
<rect x="287" y="688" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="698" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재지정</text>

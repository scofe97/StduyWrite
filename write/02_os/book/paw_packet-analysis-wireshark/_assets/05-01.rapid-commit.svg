<title id="dt">rapid commit — 네 걸음을 두 걸음으로</title><desc id="dd">같은 두 주체 사이에서 경로가 갈린다. 위는 SARR 네 메시지, 아래는 rapid commit 옵션이 붙어 두 메시지로 끝나는 경우다. 건너뛰어지는 것은 ADVERTISE 하나이고, REQUEST 도 함께 사라진다. 캡처에 메시지가 둘만 보이는 것이 실패가 아니라 정상일 수 있다.</desc>
<rect width="940" height="688" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">rapid commit — 네 걸음을 두 걸음으로</text>

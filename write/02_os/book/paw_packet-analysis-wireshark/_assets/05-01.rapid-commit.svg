<text x="24" y="596" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">건너뛰는 것 — ADVERTISE 와 REQUEST 두 메시지 · 왕복 한 번</text>

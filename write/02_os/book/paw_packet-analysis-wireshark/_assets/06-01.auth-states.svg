<text x="860.0" y="210" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">데이터 프레임 가능</text>
<path d="M 860.0 224 V 300 H 140.0 V 228" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="500.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">deauthentication 0x0c · 어느 상태에서든 처음으로</text>
<text x="40" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">WPA 라면 결합 뒤에 EAPOL 네 메시지가 이어집니다 — 필터는 eapol 이고, 802.11 복호화에 이 네 개가 필요합니다</text>
<line x1="12" y1="396" x2="952" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="418" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="408" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="418" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터가 오갈 수 있는 상태</text>
<rect x="339" y="408" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>

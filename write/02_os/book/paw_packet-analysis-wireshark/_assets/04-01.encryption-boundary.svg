<title id="dt">TLS 1.2: 방향마다 Finished 부터 암호화</title><desc id="dd">정적 RSA, 서버 인증만 사용하는 최초 전체 핸드셰이크의 예다. 버전·cipher suite·서버 인증서는 평문으로 읽힌다. 보낸 쪽이 자기 ChangeCipherSpec 을 보낸 뒤부터 그 방향의 메시지가 암호화되므로 경계는 방향마다 따로 선다. 그 뒤에도 IP 헤더와 TCP 헤더, 이전 ClientHello 에 실렸던 SNI는 캡처에서 확인할 수 있다.</desc>
<rect width="960" height="874" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TLS 1.2: 방향마다 Finished 부터 암호화</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">정적 RSA · 서버 인증만 사용하는 최초 전체 핸드셰이크의 예입니다</text>

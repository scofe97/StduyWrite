<title id="dt">열쇠와 실패 — 분석의 세 단계</title><desc id="dd">TLS 버전과 키 교환을 확인하고 복호화 재료를 구분한 뒤, 실패한 연결은 마지막 메시지와 Alert 방향으로 좁힌다. ServerHello 이전에도 협상이 실패할 수 있으며 인증서 신뢰는 별도로 점검한다.</desc>
<rect width="880" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 04-02</text>

<title id="dt">Wireshark 설치본의 구성</title><desc id="dd">GUI 와 tshark 는 앞단이고 캡처 자체는 dumpcap 이 맡는다. dumpcap 은 libpcap 을 거쳐 커널 패킷 소켓에 닿고, 결과를 pcapng 파일로 남긴다.</desc>

<title id="dt">B3 — 빈 풀 앞의 침묵</title><desc id="dd">하나뿐인 .100 을 dhcp-client 가 먼저 가져간 뒤 dhcp-client2 가 요청한다. 옆자리 캡처에는 DISCOVER 셋만 남고 서버의 답은 NAK 도 없다. 서버가 무엇을 했는지는 로그의 no address available 세 줄에만 있다.</desc>

<title id="dt">C8 · 협상이 서지 못한 두 연결</title><desc id="dd">서버에 없는 묶음만 제안하면 desc 40 handshake_failure, TLS 1.1 을 제안하면 desc 70 protocol_version 이 온다. 두 경우 모두 ServerHello(2) 없이 2 바이트 Alert 레코드 하나로 끝난다.</desc>

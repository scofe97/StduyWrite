<title id="dt">분석기가 가로채는 층</title><desc id="dd">애플리케이션에서 물리 인터페이스까지의 다섯 층. 애플리케이션 로그는 맨 위 층만 보고, 패킷 분석기는 커널 패킷 소켓 층에서 프레임 사본을 받는다.</desc>
<rect width="1000" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 01-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">분석기가 가로채는 층</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위로 갈수록 해석된 데이터, 아래로 갈수록 선 위의 원본 프레임입니다</text>
<rect x="96" y="104" width="852" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="116" y="142" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">L5</text>

<path d="M 280 404 L 280 424" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 410 466 L 556 466" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 280 504 V 520" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 680 496 V 520 H 280" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<circle cx="280" cy="520" r="4" fill="#F5F5F3"/>
<path d="M 280 524 L 280 552" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 280 616 L 280 636" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 280 700 L 280 724" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="210.0" y="96" width="140" height="40" rx="20" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="280" y="121.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">시작</text>
<polygon points="280,156 410,194 280,232 150,194" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="280" y="199" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">조직 정책이 허용하는가?</text>
<rect x="140.0" y="260" width="280" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="280" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">OS 가 캡처를 지원하는가</text>
<text x="280" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Linux 기본 · Windows 는 별도 설치</text>
<rect x="140.0" y="344" width="280" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="280" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">인터페이스 선택 + promiscuous</text>
<text x="280" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">자기 앞 주소가 아닌 프레임까지 받는다</text>
<polygon points="280,428 410,466 280,504 150,466" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="280" y="471" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Wi-Fi 인터페이스인가?</text>
<rect x="140.0" y="556" width="280" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="280" y="580" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">캡처 시작</text>
<text x="280" y="600" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">선택한 인터페이스에서 프레임 수집</text>
<rect x="140.0" y="640" width="280" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="280" y="664" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">필터 · 통계 · 저장으로 분석</text>
<text x="280" y="684" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여기부터가 2장의 내용</text>
<rect x="210.0" y="728" width="140" height="40" rx="20" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="280" y="753.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">끝</text>
<rect x="556.0" y="156" width="184" height="40" rx="20" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="648" y="181.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">여기서 멈춘다</text>
<rect x="560.0" y="436" width="240" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="680" y="460" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">monitor 모드로 전환</text>
<text x="680" y="480" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">남의 프레임까지 보려면 필수</text>
<text x="294" y="252" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">예</text>
<text x="483" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">아니오</text>
<text x="268" y="520" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">아니오</text>
<text x="480" y="454" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">예</text>
<line x1="12" y1="800" x2="832" y2="800" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="822" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="812" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="822" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">결과가 가장 큰 판단</text>
<rect x="287" y="812" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="309" y="822" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">캡처를 시작하지 않는 경로</text>

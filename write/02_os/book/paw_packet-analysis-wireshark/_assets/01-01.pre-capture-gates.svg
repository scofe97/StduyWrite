<title id="dt">캡처 전에 통과할 다섯 관문</title><desc id="dd">조직 정책 확인에서 시작해 OS 캡처 지원, 인터페이스와 promiscuous 모드, Wi-Fi 라면 monitor 모드를 거쳐 캡처를 시작하는 판단 흐름.</desc>
<rect width="880" height="880" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 01-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">캡처 전에 통과할 다섯 관문</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">첫 마름모가 기술이 아니라 권한을 묻습니다 — 여기서 아니오면 나머지는 볼 필요가 없습니다</text>
<path d="M 280 136 L 280 152" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 280 232 L 280 256" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 410 194 L 556 194" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>

<text x="832" y="134" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여기 건 필터가 안쪽 전체를 좁힙니다</text>
<rect x="56" y="152" width="768" height="200" rx="8" fill="#161B22" fill-opacity="0.45" stroke="rgba(191,192,192,0.22)" stroke-opacity="0.45" stroke-width="1.1"/>

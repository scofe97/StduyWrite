<title id="dt">네 개 창의 범위</title><desc id="dd">캡처 파일에서 한 바이트까지 범위가 네 단계로 좁아진다. 필터 도구모음은 가장 바깥에서 목록 전체를 좁히고, 목록에서 고른 한 줄이 Details 를, Details 에서 고른 한 필드가 Bytes 를 정한다.</desc>
<rect width="880" height="464" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 02-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">네 개 창의 범위</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">안쪽 창이 무엇을 보여줄지는 바깥 창에서 무엇을 골랐는지가 정합니다</text>
<rect x="24" y="104" width="832" height="272" rx="8" fill="#161B22" fill-opacity="0.25" stroke="rgba(191,192,192,0.22)" stroke-opacity="0.30" stroke-width="1.1"/>

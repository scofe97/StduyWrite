<title id="dt">어느 메시지까지 갔나</title><desc id="dd">주소 할당을 담은 캡처를 위에서부터 판단한다. DHCP 가 보이는지, 서버가 답했는지, 첫 답이 REPLY 인지, REQUEST 를 보냈는지, 그 뒤 답이 왔는지, 거절인지, DECLINE 이 있는지 순서로 갈린다.</desc>

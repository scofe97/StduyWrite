<title id="dt">SARR — 네 메시지로 주소를 받습니다</title><desc id="dd">DHCPv6 의 네 메시지 교환. 클라이언트는 서버 주소를 모르므로 멀티캐스트로 보내고, 트랜잭션 ID 가 요청과 응답을 짝짓는다.</desc>
<rect width="940" height="584" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SARR — 네 메시지로 주소를 받습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앞 두 메시지와 뒤 두 메시지의 트랜잭션 ID 가 다릅니다 — 새 요청이기 때문입니다</text>

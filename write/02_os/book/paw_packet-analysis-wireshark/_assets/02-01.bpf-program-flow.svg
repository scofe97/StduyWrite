<title id="dt">BPF 프로그램이 프레임 하나를 가르는 길</title><desc id="dd">tcpdump -d 로 컴파일한 'ip and tcp dst port 443' 필터 11줄의 실행 흐름. 프레임은 EtherType, Protocol, 조각 오프셋, 목적지 포트를 차례로 검사받고, 하나라도 어긋나면 (010) ret #0 으로 앞으로 점프해 버려진다. 뒤로 가는 점프가 없어 모든 경로가 ret 에서 끝난다.</desc>
<rect width="880" height="704" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 02-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">BPF 프로그램이 프레임 하나를 가르는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">아니오 갈래는 모두 아래쪽 (010) 으로만 뛰고, 위로 돌아가는 선은 하나도 없습니다</text>
<path d="M 320 136 L 320 160" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 320 220 L 320 244" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="332" y="239.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예 · IPv4</text>
<path d="M 320 304 L 320 328" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="332" y="323.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예 · TCP</text>
<path d="M 320 388 L 320 412" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="332" y="407.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예 · 첫 조각</text>
<path d="M 320 472 L 320 496" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 320 556 L 320 580" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="332" y="575.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<line x1="440" y1="192" x2="640" y2="192" stroke="#F08A59" stroke-width="1.6"/>
<text x="452" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<text x="652" y="197" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">jf 10</text>
<line x1="440" y1="276" x2="640" y2="276" stroke="#F08A59" stroke-width="1.6"/>
<text x="452" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<text x="652" y="281" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">jf 10</text>
<line x1="440" y1="360" x2="640" y2="360" stroke="#F08A59" stroke-width="1.6"/>
<text x="452" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<text x="652" y="365" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">jt 10</text>
<line x1="440" y1="528" x2="640" y2="528" stroke="#F08A59" stroke-width="1.6"/>
<text x="452" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<text x="652" y="533" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">jf 10</text>
<path d="M 640 192 L 640 580" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<circle cx="640" cy="192" r="4" fill="#F5F5F3"/>
<circle cx="640" cy="276" r="4" fill="#F5F5F3"/>
<circle cx="640" cy="360" r="4" fill="#F5F5F3"/>
<circle cx="640" cy="528" r="4" fill="#F5F5F3"/>
<text x="652" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">뒤로 가는 선 없음</text>
<rect x="220.0" y="100" width="200" height="36" rx="20" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="320" y="123.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">프레임 도착</text>
<polygon points="320,164 440,192 320,220 200,192" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="320" y="197" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">EtherType = 0x800</text>
<text x="40" y="187" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(000) ldh [12]</text>
<text x="40" y="205" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(001) jeq #0x800</text>
<polygon points="320,248 440,276 320,304 200,276" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="320" y="281" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Protocol = 6</text>
<text x="40" y="271" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(002) ldb [23]</text>
<text x="40" y="289" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(003) jeq #0x6</text>
<polygon points="320,332 440,360 320,388 200,360" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="320" y="365" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">조각 오프셋 = 0</text>
<text x="40" y="355" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(004) ldh [20]</text>
<text x="40" y="373" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(005) jset #0x1fff</text>
<polygon points="320,500 440,528 320,556 200,528" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="320" y="533" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">목적지 포트 = 443</text>
<text x="40" y="532" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(008) jeq #0x1bb</text>
<rect x="200" y="416" width="240" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="320" y="440" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">포트 위치 계산</text>
<text x="320" y="460" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">x = 4*([14]&amp;0xf)</text>
<text x="40" y="439" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(006) ldxb</text>
<text x="40" y="457" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(007) ldh [x + 16]</text>
<rect x="200.0" y="584" width="240" height="40" rx="20" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="320" y="609.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">받아들임</text>
<text x="40" y="608" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(009) ret #524288</text>
<rect x="540.0" y="584" width="200" height="40" rx="20" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="640" y="609.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">버림</text>
<text x="752" y="609" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">(010) ret #0</text>
<line x1="12" y1="656" x2="832" y2="656" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="678" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="668" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="678" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앞 번호로만 가는 점프</text>
<rect x="300" y="668" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="322" y="678" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">받아들임</text>
<rect x="396" y="668" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="418" y="678" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">버림</text>
</svg>
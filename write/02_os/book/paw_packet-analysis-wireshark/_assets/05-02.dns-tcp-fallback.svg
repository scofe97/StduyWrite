<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">DNS 가 TCP 로 넘어가는 두 경우</title><desc id="dd">존 전송은 처음부터 TCP 로 간다. 보통 질의는 UDP 로 묻고, 응답이 한계를 넘으면 서버가 잘라서 TC 비트를 세우고 클라이언트가 같은 질의를 TCP 로 다시 묻는다. 한계는 질의의 OPT 가 알린 크기이고, OPT 가 없으면 512바이트다.</desc>
<rect width="960" height="608" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">DNS 가 TCP 로 넘어가는 두 경우</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">EDNS(0) 가 바꾸는 것은 한계 하나입니다 — 존 전송 갈래는 그대로입니다</text>
<rect x="24" y="164" width="96" height="40" rx="20" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="72.0" y="189" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">DNS 질의</text>
<path d="M 124 184 L 156 184" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<polygon points="232,152 304,184 232,216 160,184" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="232" y="189" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">존 전송인가?</text>
<path d="M 308 184 L 364 184" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="316" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<rect x="368" y="158.0" width="152" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="444.0" y="180.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">UDP 53 질의</text>
<text x="444.0" y="198.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">OPT 가 있으면 크기 알림</text>
<path d="M 524 184 L 552 184" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<polygon points="656,152 756,184 656,216 556,184" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="656" y="189" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">응답이 한계를 넘나?</text>
<text x="656" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">한계 = OPT 크기 · 없으면 512</text>
<path d="M 760 184 L 820 184" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="768" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">아니오</text>
<rect x="824" y="164" width="112" height="40" rx="20" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="880.0" y="189" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">UDP 로 끝</text>
<path d="M 232 220 L 232 268" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="244" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">예</text>
<rect x="132" y="272" width="200" height="52" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="232.0" y="294" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">처음부터 TCP 53</text>
<text x="232.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">AXFR · 존 전송</text>
<path d="M 656 220 L 656 268" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="668" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">예</text>
<rect x="556" y="272" width="200" height="52" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="656.0" y="294" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">TC=1 잘린 응답</text>
<text x="656.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">답 0개 · 헤더와 질문만</text>
<path d="M 656 328 L 656 356" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="556" y="360" width="200" height="52" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="656.0" y="382" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">TCP 53 으로 다시 묻기</text>
<text x="656.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">같은 질의 · 전체 응답</text>
<line x1="24" y1="448" x2="936" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="440" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">TXT google.com @8.8.8.8 · 2026-09-21 dig 실측</text>
<text x="48" y="472" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">dig +noedns</text>
<text x="232" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">OPT 없음 · 한계 512</text>
<text x="432" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">응답 1,176B</text>
<text x="600" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">TC=1 → TCP 53 · 답 17개</text>
<text x="48" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">dig (기본)</text>
<text x="232" y="504" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">OPT 4096</text>
<text x="432" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">응답 1,187B</text>
<text x="600" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">UDP 한 번 · 답 17개</text>
<line x1="12" y1="552" x2="912" y2="552" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="574" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="564" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TCP 로 다시 묻는 자리</text>
<rect x="326" y="564" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="348" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">잘린 응답</text>
<rect x="435" y="564" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="457" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">처음부터 TCP</text>
<rect x="583" y="564" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="605" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">UDP 로 끝</text>
</svg>
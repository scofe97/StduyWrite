<title id="dt">패킷 분석기와 Wireshark — 읽는 순서</title><desc id="dd">1장 노트의 절 넷을 읽는 순서로 이은 지도. 분석기가 서는 자리에서 출발해 Wireshark 의 구성과 캡처 전 관문을 지나, 이 도구가 못 하는 일로 닫는다.</desc>
<rect width="880" height="396" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 01-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">패킷 분석기와 Wireshark — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앞 세 칸이 왜 이 도구인지를 잇고, 마지막 칸이 이 도구의 경계로 닫습니다</text>

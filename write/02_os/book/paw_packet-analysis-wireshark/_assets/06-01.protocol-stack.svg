<title id="dt">802.11 이 들어앉는 자리</title><desc id="dd">유선 캡처에서 이더넷이 있던 자리에 802.11 MAC 과 LLC 가 들어온다. 위층은 그대로이므로 IP 이상은 유선 캡처와 같게 읽힌다.</desc>
<rect width="1000" height="584" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 06-01 §4</text>

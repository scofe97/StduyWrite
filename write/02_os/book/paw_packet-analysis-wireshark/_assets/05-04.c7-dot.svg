<title id="dt">C7 — 평문 DNS 와 DoT 에서 보이는 것</title><desc id="dd">평문 DNS 는 질의 이름 example.com 이 선에 그대로 실린다. DoT 는 누구에게 물었나(1.1.1.1:853)만 보이고 이름은 Application Data 안에 암호화된다. IP 로 붙어 SNI 도 비어 있다.</desc>

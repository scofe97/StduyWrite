<title id="dt">Follow TCP Stream 이 묶는 것</title><desc id="dd">Packet List 에서는 다른 대화와 섞여 흩어져 있던 요청과 응답이, 스트림 단위로 모여 한 창에 순서대로 나타난다. 원문의 예는 packet#35 의 HTTP 200 OK 를 기점으로 스트림을 여는 것이다.</desc>
<rect width="880" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 02-03 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Follow TCP Stream 이 묶는 것</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">목록에서 흩어져 있던 세그먼트가 한 대화로 순서대로 이어집니다</text>
<rect x="24.0" y="104" width="224" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

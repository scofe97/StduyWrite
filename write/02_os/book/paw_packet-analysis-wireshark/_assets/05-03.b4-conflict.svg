<title id="dt">B4 — 남이 쓰는 주소를 거르는 두 자리</title><desc id="dd">위 구획은 서버가 제안 전에 ICMP 로 .137 을 묻고 옆자리의 응답을 받아 .138 로 넘어가는 B4a, 아래 구획은 서버 확인을 끄고 클라이언트가 ACK 뒤 ARP 로 묻다가 응답을 받아 DECLINE 을 보내는 B4b 다. DECLINE 뒤 20초를 쉬고 재시작한 교환에서 서버는 .138 을 제안한다.</desc>

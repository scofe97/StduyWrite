<path d="M 300 532 L 300 592" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 712 390 L 712 616 L 456 616" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="180.0" y="100" width="240" height="40" rx="20" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="300" y="125.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">응답이 느리다</text>

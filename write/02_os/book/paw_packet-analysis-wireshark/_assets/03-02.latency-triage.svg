<title id="dt">느릴 때 무엇부터 가르나</title><desc id="dd">지연이 선 위에 있는지 수신 측 처리에 있는지를 먼저 가른다. 원문의 slow_download.pcap 예제는 두 번째 갈래에서 걸렸고, 원인은 윈도우 크기가 100 으로 줄어 있던 것이었다.</desc>
<rect width="880" height="712" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 03-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">느릴 때 무엇부터 가르나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">handshake 시각과 윈도우 크기, 두 눈금이면 어느 쪽인지가 갈립니다</text>

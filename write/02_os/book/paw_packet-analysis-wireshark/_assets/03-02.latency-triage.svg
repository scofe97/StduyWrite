<path d="M 444 208 L 592 208" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<path d="M 300 248 L 300 312" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 444 356 L 592 356" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>

<title id="dt">B7 · 키 로그 한 줄이 여는 연결</title><desc id="dd">SSLKEYLOGFILE 이 남긴 한 줄은 CLIENT_RANDOM 라벨, ClientHello 난수, master secret 으로 이뤄진다. 캡처의 ClientHello 난수와 같은 줄이 있을 때만 그 연결이 열린다.</desc>

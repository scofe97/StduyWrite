<title id="dt">재조립은 조각 수를 숨기지 않고 자리를 옮긴다</title><desc id="dd">같은 HTTP 응답 하나를 재조립 켬과 끔으로 연 결과. 켜면 조각 줄은 목록에 남고 마지막 조각에 HTTP 응답 줄과 재조립 목록이 붙는다. 끄면 첫 조각에 HTTP 응답 줄이 붙고 나머지가 Continuation 으로 늘어선다. http.time 도 붙는 프레임을 따라 옮긴다.</desc>
<rect width="952" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PACKET ANALYSIS WITH WIRESHARK · 05-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">재조립은 조각 수를 숨기지 않고 자리를 옮긴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">켜면 조각 수가 상세 창으로, 끄면 목록으로 갑니다 — http.time 은 마지막 조각과 첫 조각에서 잽니다</text>

<title id="dt">Go 표준 log 로 시작해 레벨 분기와 Zap 구조화·샘플링으로 이어지는 흐름</title><desc id="dd">13-01 의 핵심 로깅 기법 개념도입니다. §1 은 이벤트 로그의 가치와 부하 비용 관리, §2 는 log 패키지의 줄 머리 조립과 다중 출력 지속 쓰기, §3 은 레벨별 로거 분리와 출력 대상 분기, §4 는 Zap 인코더·출력·레벨을 묶은 구조화 코어, §5 는 다중 코어 Tee 결합과 샘플링을 통한 반복 부하 삭감입니다.</desc>

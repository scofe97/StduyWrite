<title id="dt">양방향 프록시와 half-close</title><desc id="dd">io.Copy 양방향 중계와 CloseWrite 를 통한 단방향 FIN 전달</desc>
<rect width="880" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LISTING 4-14 PROXY HALF-CLOSE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">양방향 프록시와 half-close</text>

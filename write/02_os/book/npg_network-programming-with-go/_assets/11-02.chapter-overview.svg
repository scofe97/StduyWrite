<title id="dt">상호 TLS 는 직접 만든 인증서로 클라이언트를 검증하고 접속 주소를 맞춥니다</title><desc id="dd">11-02 의 키워드 개념도. §1 줄은 ClientAuth 와 ClientCAs 로 서버가 클라이언트에게 인증서를 요구하고 신뢰 체인을 확인하는 상호 인증 원리다. §2 줄은 x509.Certificate 템플릿과 P-256 ECDSA 키 쌍을 결합해 자체 서명 인증서와 개인키 PEM 파일을 만드는 과정이다. §3 줄은 GetConfigForClient 로 소켓 IP 를 얻고 VerifyPeerCertificate 로 역방향 DNS 및 인증서 SAN 이름을 대조하는 서버 검증이다. §4 줄은 tls.Dial 이 클라이언트 쪽 핸드셰이크를 마친 뒤 첫 Write·Read 로 서버의 판정을 받는 시험이다.</desc>
<rect width="984" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 11-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">상호 TLS 는 직접 만든 인증서로 클라이언트를 검증하고 접속 주소를 맞춥니다</text>

<title id="dt">Caddy 가 프록시와 정적 파일을 나누고 자동 HTTPS 를 붙입니다</title><desc id="dd">10-02 의 키워드 개념도. §1 줄은 소켓 프록시 주소 대신 X-Forwarded-For 헤더로 원격 클라이언트를 식별하고 trusted_proxies 로 위조를 걸러내는 신뢰 경계다. §2 줄은 routes 배열을 순차 평가해 /backend 경로 일치 시 reverse_proxy 로 중계하고 미매칭 시 file_server 로 넘기는 경로 분기다. §3 줄은 실제 curl 시험 시 위조 헤더 203.0.113.195 를 폐기하고 실제 소켓 IP 로 덮어써 백엔드 로그에 남기는 신뢰 경계 증명이다. §4 줄은 host 매처로 도메인을 감지해 ACME 프로토콜로 인증서를 자동 발급받고 포트 443 에 장착하는 자동 HTTPS 다.</desc>
<rect width="984" height="680" fill="#0D1117"/>

<title id="dt">TFTP 서버 handle 루프 상태 전이</title><desc id="dd">Listing 6-10 블록 전송·ACK 대기·재전송 및 종료 상태 기계</desc>
<rect width="880" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NPG CH.6 — TFTP SERVER STATE MACHINE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TFTP 서버 handle 루프 상태 전이</text>

<title id="dt">소켓을 분리해 응답하고 블록마다 ACK 를 확인합니다</title><desc id="dd">06-02 의 키워드 개념도. §1 줄은 69번 공용 소켓에서 요청을 받아 고루틴과 net.Dial 로 전용 소켓을 여는 연결 분리다. §2 줄은 512바이트 블록을 보내고 6초 타임아웃 재전송을 거쳐 516바이트 미만까지 전진하는 정지-대기 전송이다. §3 줄은 75,352바이트 파일을 다운로드하고 SHA512/256 해시로 원본과의 일치를 확인하는 무결성 검증이다.</desc>
<rect width="984" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 06-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">소켓을 분리해 응답하고 블록마다 ACK 를 확인합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

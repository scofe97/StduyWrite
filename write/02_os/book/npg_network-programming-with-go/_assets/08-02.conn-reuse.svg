<title id="dt">HTTP 커넥션 재사용과 본문 소진 루프</title><desc id="dd">응답 본문을 끝까지 읽고 닫아야 TCP 연결이 유휴 풀로 돌아와 다음 요청에 재사용됩니다. 본문을 읽지 않고 닫으면 세션을 재사용하지 못할 수 있어 다음 요청은 새 핸드셰이크를 거쳐야 합니다.</desc>
<rect width="880" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NPG CHAPTER 8 · HTTP CLIENTS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">HTTP 커넥션 재사용과 본문 소진 루프</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">녹색 고리가 세션 재사용 경로이고 붉은 갈래가 재사용 실패 위험 경로입니다</text>

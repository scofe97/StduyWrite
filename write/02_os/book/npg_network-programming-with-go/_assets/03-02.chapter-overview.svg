<title id="dt">Go 의 TCP 연결은 Listen·Accept·Dial 세 호출로 맺는다</title><desc id="dd">03-02 의 키워드 개념도. 1행은 net.Listen 에 포트 0을 넘겨 임시 포트를 독점 바인딩하고 실제 주소를 확인하는 리스너 생성이다. 2행은 listener.Accept 로 핸드셰이크 완료를 기다려 연결마다 고루틴을 분기하고 defer c.Close 로 소켓 FD 를 회수하는 수신 루프다. 3행은 클라이언트가 net.Dial 로 주소를 해석하고 3-way 핸드셰이크를 거쳐 net.Conn 양방향 소켓을 얻는 연결 수립이다. 4행은 conn.Close 로 시작된 FIN 세그먼트가 서버 c.Read 에 io.EOF 정상 종료 시그널로 전달되는 세션 종료다.</desc>
<rect width="984" height="648" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 03-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Go 의 TCP 연결은 Listen·Accept·Dial 세 호출로 맺는다</text>

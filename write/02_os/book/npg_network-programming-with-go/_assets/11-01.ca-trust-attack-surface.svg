<title id="dt">CA 신뢰 체계와 TLS 를 무너뜨리는 세 가지 공격 지점</title><desc id="dd">인증서 신뢰 사슬 구조와 이를 위협하는 세 지점(CA 오발급, 루트 저장소 침해, 서버 메모리 탈취)입니다.</desc>

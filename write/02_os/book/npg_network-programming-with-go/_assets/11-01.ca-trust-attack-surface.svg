<title id="dt">CA 신뢰 체계와 TLS 를 무너뜨리는 세 가지 공격 지점</title><desc id="dd">CA 서명 확인 관문을 통과하는 위조 공격과 관문 밖 서버를 침해하는 공격의 경로 대조</desc>

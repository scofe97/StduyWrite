<title id="dt">세마포어 파일 생성과 삭제에 따른 무중단 동적 디버그 로깅</title><desc id="dd">운영자가 세마포어 파일을 만들면 fsnotify 가 감지해 AtomicLevel 을 Debug 로 바꾸고, 파일을 지우면 원래의 Info 로 되돌립니다.</desc>
<rect width="980" height="720" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · ON-DEMAND LOGGING FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세마포어 파일 생성과 삭제에 따른 무중단 동적 디버그 로깅</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">atomic.Int32 를 포인터로 공유하는 AtomicLevel 로 레이스 컨디션 없이 실행 중에 로그 레벨을 바꿉니다.</text>
<rect x="24.0" y="104" width="140" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="94.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">운영자</text>
<text x="94.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">os.Create · Remove</text>
<rect x="216.0" y="104" width="140" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="286.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">파일시스템</text>
<text x="286.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">디렉터리 이벤트</text>
<rect x="408.0" y="104" width="140" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

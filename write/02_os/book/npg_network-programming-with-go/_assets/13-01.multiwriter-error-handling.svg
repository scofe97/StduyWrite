<title id="dt">쓰기 오류 발생 시 io.MultiWriter 와 sustainedMultiWriter 의 동작 비교</title><desc id="dd">io.MultiWriter 는 첫 writer 에서 오류가 나면 즉시 중단되어 뒤쪽 출력을 건너뜁니다. 반면 sustainedMultiWriter 는 오류가 나도 모든 writer 에 끝까지 쓰고 에러를 누적 반환합니다.</desc>
<rect width="940" height="770" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · MULTIWRITER ERROR BEHAVIOR</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">쓰기 오류 발생 시 io.MultiWriter 와 sustainedMultiWriter 의 동작 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">한쪽 출력(디스크 풀 등) 장애가 다른 출력(터미널 표준 출력)의 로그 유실로 번지는 현상을 막습니다.</text>
<rect x="24.0" y="104" width="170" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="109.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">호출자</text>
<text x="109.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Logger</text>
<rect x="256.66666666666663" y="104" width="170" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="341.66666666666663" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">다중 출력기</text>
<text x="341.66666666666663" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">MultiWriter</text>
<rect x="489.33333333333326" y="104" width="170" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="574.3333333333333" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">파일 Writer</text>
<text x="574.3333333333333" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">1순위 대상</text>
<rect x="722.0" y="104" width="170" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="807.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">os.Stdout</text>
<text x="807.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2순위 대상</text>
<text x="36" y="170" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">[A] io.MultiWriter — 첫 쓰기 오류 시 즉시 중단 (Fail-Stop)</text>
<path d="M 119.0 198 L 329.66666666666663 198" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="225.33333333333331" y="189" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">Write(p)</text>
<text x="225.33333333333331" y="215" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">로그 바이트 쓰기 요청</text>
<path d="M 351.66666666666663 244 L 562.3333333333333 244" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<text x="457.99999999999994" y="235" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">Write(p)</text>
<text x="457.99999999999994" y="261" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">첫째 writer 에 쓰기</text>
<path d="M 564.3333333333333 290 L 353.66666666666663 290" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)" stroke-dasharray="4 4"/>
<text x="457.99999999999994" y="281" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">err != nil (ENOSPC)</text>
<text x="457.99999999999994" y="307" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">디스크 공간 부족 오류</text>
<line x1="361.66666666666663" y1="330" x2="787.0" y2="330" stroke="#F0616D" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="690.6666666666666" y="320" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">호출 중단 (건너뜀)</text>
<text x="690.6666666666666" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">표준 출력 로그 유실</text>
<path d="M 331.66666666666663 380 L 121.0 380" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)" stroke-dasharray="4 4"/>
<text x="225.33333333333331" y="371" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">return (n, err)</text>
<text x="225.33333333333331" y="397" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">즉시 에러 반환 및 중단</text>
<line x1="24" y1="412" x2="916" y2="412" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="36" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">[B] sustainedMultiWriter — 오류 발생 시에도 모든 대상에 지속 쓰기</text>
<path d="M 119.0 464 L 329.66666666666663 464" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="225.33333333333331" y="455" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">Write(p)</text>
<text x="225.33333333333331" y="481" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">로그 바이트 쓰기 요청</text>
<path d="M 351.66666666666663 510 L 562.3333333333333 510" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<text x="457.99999999999994" y="501" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">Write(p)</text>
<text x="457.99999999999994" y="527" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">첫째 writer 쓰기 시도</text>
<path d="M 564.3333333333333 556 L 353.66666666666663 556" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)" stroke-dasharray="4 4"/>
<text x="457.99999999999994" y="547" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">wErr (ENOSPC)</text>
<text x="457.99999999999994" y="573" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">오류 발생</text>
<path d="M 351.66666666666663 602 L 795.0 602" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="574.3333333333333" y="593" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">Write(p)</text>
<text x="574.3333333333333" y="619" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">중단 없이 다음 writer 진행</text>
<path d="M 797.0 648 L 353.66666666666663 648" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)" stroke-dasharray="4 4"/>
<text x="574.3333333333333" y="639" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">return (n, nil)</text>
<text x="574.3333333333333" y="665" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 출력 성공</text>
<path d="M 331.66666666666663 692 L 121.0 692" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)" stroke-dasharray="4 4"/>
<text x="225.33333333333331" y="683" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">return (n, multierr)</text>
<text x="225.33333333333331" y="709" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가장 적게 쓴 writer 의 바이트 수 · 누적 오류</text>
<line x1="109.0" y1="154" x2="109.0" y2="706" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="341.66666666666663" y1="154" x2="341.66666666666663" y2="706" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="574.3333333333333" y1="154" x2="574.3333333333333" y2="706" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="807.0" y1="154" x2="807.0" y2="706" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="12" y1="726" x2="892" y2="726" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="748" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="738" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="748" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호출 흐름</text>
<rect x="209" y="738" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="231" y="748" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 쓰기</text>
<rect x="318" y="738" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="340" y="748" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">에러 발생</text>
<rect x="427" y="738" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="449" y="748" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">누적 반환</text>

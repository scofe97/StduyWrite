<title id="dt">피어 자격 증명 기반 프로세스 인증 흐름</title><desc id="dd">Listing 7-13 및 7-16의 접속 수락부터 자격 증명 조회, 그룹 대조, 응대 및 차단 분기</desc>
<rect width="840" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NPG CH.7 — PEER CREDENTIALS AUTH</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">피어 자격 증명 기반 프로세스 인증 흐름</text>

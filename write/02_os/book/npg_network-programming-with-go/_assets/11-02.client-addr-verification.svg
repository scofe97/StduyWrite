<title id="dt">서버의 접속 주소 추출 및 인증서 SAN 검증 흐름</title><desc id="dd">GetConfigForClient 로 소켓 주소를 확보하고 VerifyPeerCertificate 로 인증서 이름을 대조합니다</desc>

<title id="dt">도메인 감지와 ACME 자동 HTTPS 발급 시퀀스</title><desc id="dd">Caddy 가 도메인을 감지해 Let's Encrypt 와 HTTP-01 챌린지를 거쳐 인증서를 발급받습니다</desc>
<rect width="960" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NPG CH.10 — AUTOMATIC HTTPS &amp; ACME</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">도메인 감지와 ACME 자동 HTTPS 발급 시퀀스</text>

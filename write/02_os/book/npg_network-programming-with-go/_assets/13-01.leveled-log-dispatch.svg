<title id="dt">코드 내 레벨별 로그 호출이 목적지 Writer 로 분기되는 흐름</title><desc id="dd">log 패키지는 자체 레벨이 없으므로 lDebug 와 lError 로거를 따로 만듭니다. lError 는 sustainedMultiWriter 를 통해 파일과 표준 출력 둘 다로 전달되고, lDebug 는 표준 출력으로만 흘러 디스크 용량을 아낍니다.</desc>
<rect width="940" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEVELED LOG DISPATCH · DATA FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">코드 내 레벨별 로그 호출이 목적지 Writer 로 분기되는 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">동일한 비즈니스 코드에서 발생한 두 호출이 서로 다른 writer 집합에 도달합니다.</text>
<rect x="36" y="120" width="240" height="320" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="52" y="146" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">애플리케이션 로그 호출</text>
<text x="52" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">동일 코드베이스 내 발생</text>
<rect x="52" y="190" width="208" height="90" rx="4" fill="#F0616D15" stroke="#F0616D" stroke-width="1.2"/>
<text x="66" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">lError.Print(...)</text>
<text x="66" y="236" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">"cannot communicate..."</text>
<text x="66" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">심각도: High (장애 알림)</text>
<rect x="52" y="320" width="208" height="90" rx="4" fill="#6A95D815" stroke="#6A95D8" stroke-width="1.2"/>
<text x="66" y="344" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">lDebug.Print(...)</text>
<text x="66" y="366" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">"you cannot hum..."</text>
<text x="66" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">심각도: Low (개발 추적)</text>
<rect x="330" y="185" width="220" height="100" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="440" y="210" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">lError (SustainedMultiWriter)</text>
<text x="440" y="230" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">logFile + lDebug.Writer()</text>
<text x="440" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">다중 출력 분기 복제</text>
<rect x="330" y="320" width="220" height="90" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="440" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">lDebug 로거</text>
<text x="440" y="372" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">os.Stdout 단일 대상</text>
<text x="440" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">파일 쓰기 제외</text>
<path d="M 260 235 L 328 235" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<path d="M 260 365 L 328 365" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="620" y="150" width="280" height="110" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="636" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">로그 파일 (logFile)</text>
<text x="636" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">보존 대상 (ERROR 만 보관)</text>
<rect x="636" y="212" width="248" height="36" rx="4" fill="#3FB98C15" stroke="#3FB98C" stroke-width="1.0"/>
<text x="648" y="234" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">ERROR: log_test.go:48: cannot...</text>
<rect x="620" y="300" width="280" height="150" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="636" y="326" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">표준 출력 (os.Stdout)</text>
<text x="636" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">실시간 콘솔 (ERROR + DEBUG)</text>
<rect x="636" y="362" width="248" height="34" rx="4" fill="#F0616D15" stroke="#F0616D" stroke-width="1.0"/>
<text x="648" y="384" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">ERROR: log_test.go:48: cannot...</text>
<rect x="636" y="404" width="248" height="34" rx="4" fill="#6A95D815" stroke="#6A95D8" stroke-width="1.0"/>
<text x="648" y="426" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">DEBUG: log_test.go:49: you cannot...</text>
<path d="M 550 220 L 584 220 L 584 190 L 618 190" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<path d="M 550 250 L 584 250 L 584 350 L 618 350" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<path d="M 550 375 L 584 375 L 584 410 L 618 410" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
</svg>
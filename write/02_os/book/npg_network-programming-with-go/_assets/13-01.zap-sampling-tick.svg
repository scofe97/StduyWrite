<title id="dt">1초 틱 단위 동일 메시지 샘플링 동작 (first=1, thereafter=3)</title><desc id="dd">NewSamplerWithOptions 는 한 틱(1초) 안에서 동일한 레벨과 메시지를 가진 엔트리의 처음 1개를 기록하고, 이후에는 매 3번째(thereafter) 중복 엔트리만 통과시켜 CPU 와 I/O 부하를 줄입니다.</desc>
<rect width="940" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ZAP SAMPLING TICK · PROCESS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">1초 틱 단위 동일 메시지 샘플링 동작 (first=1, thereafter=3)</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">i=5 에서 1초 수면으로 틱이 갱신되어 카운터가 리셋됩니다.</text>
<rect x="36" y="110" width="868" height="44" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="56" y="137" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">샘플러 설정:</text>
<text x="140" y="137" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">NewSamplerWithOptions(core, time.Second, 1, 3)</text>
<text x="610" y="137" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">동일 메시지: "debug message"</text>
<rect x="36" y="176" width="868" height="140" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="56" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">틱 1 (0.0초 ~ 1.0초)</text>

<title id="dt">대부분의 사용자는 도구까지만 보고 eBPF 층은 그 아래 가려져 있다</title><desc id="dd">kubectl 과 대시보드 아래에 Cilium · Falco 같은 도구가 있고, 도구는 verifier · JIT · 맵 · 헬퍼 · kfunc 를 공유하며 XDP · LSM 같은 커널 훅에 붙는다.</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 11-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">대부분의 사용자는 도구까지만 보고 eBPF 층은 그 아래 가려져 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위에서 아래로 사용자, 도구, eBPF 플랫폼, 커널 훅</text>
<rect x="80" y="100" width="800" height="72" rx="6" fill="#8B98A912" stroke="#8B98A9" stroke-width="1.0"/>
<text x="96" y="124" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L4</text>
<text x="96" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">사용자</text>
<text x="864" y="142" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">kubectl · 대시보드</text>
<rect x="80" y="184" width="800" height="72" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="96" y="208" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L3</text>
<text x="96" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">도구</text>
<text x="864" y="226" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">Cilium · Falco · Tetragon · bpftrace · Pixie</text>

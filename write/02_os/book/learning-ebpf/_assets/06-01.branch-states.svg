<title id="dt">조건 점프 하나가 만드는 두 경로</title><desc id="dd">점프하는 쪽의 상태 사본은 스택에 들어가고, 이어지는 쪽이 먼저 끝까지 간다. 한 경로라도 걸리면 프로그램 전체가 거부된다.</desc>
<rect width="960" height="472" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 06-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">조건 점프 하나가 만드는 두 경로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">30번 명령의 비교 r1 &gt; 12 가 두 경로를 가른다</text>
<rect x="336" y="108" width="288" height="48" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.4"/>
<text x="480.0" y="138" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">30: if r1 &gt; 0xc goto pc+10</text>
<rect x="104" y="208" width="320" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="264" y="236" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">31 → 34</text>
<text x="264" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">r1 ≤ 12 · 이어지는 쪽</text>
<rect x="536" y="208" width="320" height="64" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="696" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">41 · 가지치기 지점</text>
<text x="696" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">r1 &gt; 12 · push 된 사본</text>
<rect x="136" y="328" width="256" height="48" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="264" y="358" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">34: off=16 size=1</text>
<rect x="568" y="328" width="256" height="48" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="696" y="358" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">꺼내지 못함</text>

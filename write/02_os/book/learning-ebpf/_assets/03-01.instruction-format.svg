<title id="dt">eBPF 명령어 구조와 16바이트 와이드 즉시값 인코딩</title><desc id="dd">기본 bpf_insn 은 64비트 5개 필드로 구성되며 64비트 상수는 16바이트 와이드 명령을 씁니다</desc>
<rect width="920" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 03-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">eBPF 명령어 구조와 16바이트 와이드 즉시값 인코딩</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">opcode 8비트 · 레지스터 4비트 쌍 · 오프셋 16비트 · 즉시값 32비트</text>
<rect x="36" y="110" width="468" height="290" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="52" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">struct bpf_insn (64비트 / 8바이트)</text>
<text x="488" y="134" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">기본 단일 슬롯</text>
<rect x="52" y="154" width="64" height="56" rx="4" fill="#F08A5915" stroke="#F08A59" stroke-width="1.0"/>
<text x="84" y="178" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">code</text>
<text x="84" y="198" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">8-bit</text>
<rect x="116" y="154" width="44" height="56" rx="4" fill="#3FB98C15" stroke="#3FB98C" stroke-width="1.0"/>
<text x="138" y="178" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">dst</text>
<text x="138" y="198" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">4-bit</text>
<rect x="160" y="154" width="44" height="56" rx="4" fill="#6A95D815" stroke="#6A95D8" stroke-width="1.0"/>
<text x="182" y="178" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">src</text>
<text x="182" y="198" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">4-bit</text>
<rect x="204" y="154" width="84" height="56" rx="4" fill="#E3B34115" stroke="#E3B341" stroke-width="1.0"/>
<text x="246" y="178" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#E3B341">off</text>
<text x="246" y="198" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">16-bit</text>
<rect x="288" y="154" width="200" height="56" rx="4" fill="#8B98A915" stroke="#8B98A9" stroke-width="1.0"/>
<text x="388" y="178" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">imm</text>
<text x="388" y="198" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">32-bit</text>
<text x="52" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실제 명령 바이트 대응</text>
<text x="168" y="230" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">b7 02 00 00 0f 00 00 00</text>
<rect x="52" y="242" width="64" height="52" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="84" y="262" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">0xb7</text>
<text x="84" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">ALU64|MOV</text>
<rect x="116" y="242" width="44" height="52" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="138" y="262" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">0x2</text>
<text x="138" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">r2</text>
<rect x="160" y="242" width="44" height="52" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="182" y="262" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">0x0</text>
<text x="182" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">-</text>
<rect x="204" y="242" width="84" height="52" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="246" y="262" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">0x0000</text>
<text x="246" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">0</text>
<rect x="288" y="242" width="200" height="52" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="388" y="262" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">0x0000000f</text>
<text x="388" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">15</text>
<rect x="52" y="320" width="436" height="48" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.0"/>
<text x="68" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">해석</text>
<text x="108" y="348" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">r2 = 15</text>
<text x="472" y="348" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">dst = imm (즉시값 15를 레지스터 r2 에 대입)</text>
<rect x="524" y="110" width="360" height="290" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="540" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">와이드 명령 (16바이트 / 2슬롯)</text>
<text x="868" y="134" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">64비트 즉시값 적재</text>
<rect x="540" y="154" width="328" height="60" rx="6" fill="#F08A5910" stroke="#F08A59" stroke-width="1.0"/>
<text x="552" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">슬롯 1 (8B)</text>
<text x="856" y="176" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">18 06 00 00 00 00 00 00</text>
<text x="552" y="198" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">code=0x18 (LD|IMM|DW) · dst=r6 · imm_lo=0</text>
<rect x="540" y="226" width="328" height="60" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="552" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">슬롯 2 (8B 의사 명령)</text>
<text x="856" y="248" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">00 00 00 00 00 00 00 00</text>
<text x="552" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">code=0x0 · dst=0 · off=0 · imm_hi=0</text>
<rect x="540" y="320" width="328" height="48" rx="6" fill="#0D1117" stroke="#E3B341" stroke-width="1.0"/>
<text x="552" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">해석</text>
<text x="592" y="348" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">r6 = 0 ll</text>
<text x="856" y="348" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">64비트 전체 즉시값 적재</text>
<line x1="12" y1="434" x2="872" y2="434" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="456" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

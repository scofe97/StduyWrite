<title id="dt">예제 로더가 낸 bpf() 호출과 돌려받은 fd</title><desc id="dd">hello-buffer-config.py 는 BTF 를 싣고 맵 둘을 만들고 프로그램을 싣고 맵에 값을 두 번 넣는다. 돌아온 fd 는 이후 호출의 인자로 다시 쓰이고, 로더가 끝나 fd 가 닫히면 참조가 줄어 0 이면 커널이 객체를 치운다.</desc>

<title id="dt">fd 6·7·8~11 이 커널 대상과 만나는 세 줄</title><desc id="dd">kprobe 는 fd 7 에 ioctl 로 프로그램 6 을 붙이고, perf 버퍼판은 CPU 마다 링을 맵 fd 4 에 꽂고 ppoll 로 기다리며, 링 버퍼판은 맵 fd 4 를 epoll 인스턴스 fd 8 에 등록한다.</desc>
<rect width="960" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 04-02</text>

<title id="dt">CPU 넷에 링 넷, ppoll 하나가 네 fd 를 본다</title><desc id="dd">output 맵은 CPU 번호를 키로 하고 값은 그 CPU 의 perf 링 fd 다. hello() 가 도는 CPU 의 칸을 따라 그 CPU 의 링에 쓰고, 사용자 공간의 ppoll 이 네 fd 를 함께 기다린다.</desc>

<title id="dt">붙는 자리 일곱 층이 컨텍스트와 필요한 권한을 가른다</title><desc id="dd">모든 층에 CAP_BPF 가 필요하고 트레이싱 쪽 층은 CAP_PERFMON, 네트워크 쪽 층은 SOCKET_FILTER 를 빼고 CAP_NET_ADMIN 이 더 따라옵니다. SOCKET_FILTER 와 CGROUP_SKB 는 unprivileged_bpf_disabled=0 일 때만 CAP_BPF 예외입니다.</desc>
<rect width="920" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 07-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">붙는 자리 일곱 층이 컨텍스트와 필요한 권한을 가른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위쪽일수록 사용자 공간에 가깝고 아래쪽일수록 NIC 에 가깝습니다</text>

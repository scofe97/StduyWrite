<title id="dt">받는 Pod 로 가는 패킷은 조회 두 번으로 전달·프록시·폐기가 갈린다</title><desc id="dd">출발지 10.0.0.68 은 IP cache 에서 identity 22727 로 풀린다. Pod A 의 정책 맵에 (22727, Ingress, TCP, 8080) 항목이 있으면 전달하고 TCP 9113 은 항목이 없어 TC_ACT_SHOT 으로 폐기한다. Pod B 의 항목에 rules.http 가 있으면 프록시로 보낸다.</desc>

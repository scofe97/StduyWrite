<title id="dt">XDP 프로그램은 검사 끝에 반환 코드 하나로 패킷의 운명을 정한다</title><desc id="dd">XDP 프로그램이 data 와 data_end 사이의 경계를 검사한다. 경계 밖이면 XDP_ABORTED 0, 버릴 패킷이면 XDP_DROP 1, 스택에 맡기면 XDP_PASS 2, 같은 장치로 되돌리면 XDP_TX 3, 다른 장치로 보내면 XDP_REDIRECT 4 를 돌려준다.</desc>
<rect width="1000" height="436" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 08-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">XDP 프로그램은 검사 끝에 반환 코드 하나로 패킷의 운명을 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">반환 코드가 곧 판정입니다</text>

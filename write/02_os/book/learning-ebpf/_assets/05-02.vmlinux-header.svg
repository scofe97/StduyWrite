<title id="dt">커널 BTF 가 vmlinux.h 를 거쳐 오브젝트의 .BTF 가 된다</title><desc id="dd">bpftool 이 실행 중인 커널의 BTF 를 C 헤더로 뽑고, 그 헤더를 포함해 컴파일한 오브젝트에 빌드 때의 구조체 배치가 BTF 로 남는다.</desc>
<rect width="960" height="404" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 05-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널 BTF 가 vmlinux.h 를 거쳐 오브젝트의 .BTF 가 된다</text>

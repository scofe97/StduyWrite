<title id="dt">인라인이면 호출 지점마다 본문이 한 벌씩 붙는다</title><desc id="dd">인라인이 아니면 두 호출 지점이 jump 로 같은 본문 한 벌에 갔다 돌아오고, __always_inline 이면 호출 지점마다 본문이 복사된다.</desc>

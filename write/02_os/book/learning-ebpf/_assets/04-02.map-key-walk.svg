<path d="M 302.416 280.000 A 200 200 0 0 1 382.949 197.125" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 480.0 204.0 L 480.0 324.0" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)" stroke-dasharray="5 4"/>

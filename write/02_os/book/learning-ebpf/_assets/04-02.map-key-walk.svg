<title id="dt">직전 키를 넘겨 다음 키를 받고 값을 읽는다</title><desc id="dd">bpftool 은 key=NULL 로 첫 키 0 을 받아 값을 읽어 출력하고, 그 키를 직전 키로 넘겨 다음 키 501 을 받는다. 501 다음 GET_NEXT_KEY 가 ENOENT 를 돌려주면 끝난다.</desc>
<rect width="960" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 04-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">직전 키를 넘겨 다음 키를 받고 값을 읽는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">키 몰라도 전 원소 순회</text>

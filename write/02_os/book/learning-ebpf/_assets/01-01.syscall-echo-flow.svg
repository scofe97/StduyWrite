<title id="dt">echo 명령 실행 시의 시스템 콜 흐름과 eBPF 관측 지점</title><desc id="dd">단순한 문자열 출력도 예제 환경에서 111회 시스템 콜을 부릅니다</desc>
<rect width="920" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 01-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">echo 명령 실행 시의 시스템 콜 흐름과 eBPF 관측 지점</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">strace -c 예제 출력: 총 111회 호출 · openat 30회 · mmap 20회 · write 1회</text>
<rect x="28" y="110" width="196" height="140" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="126.0" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">01 실행 준비</text>
<line x1="38" y1="146" x2="214" y2="146" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="126.0" y="170" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">execve 1회</text>
<text x="126.0" y="194" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">echo 프로세스 기동</text>
<text x="126.0" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바이너리 적재 시작</text>
<path d="M 226 180.0 L 250 180.0" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="252" y="110" width="196" height="140" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="350.0" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">02 파일 열기·닫기</text>
<line x1="262" y1="146" x2="438" y2="146" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="350.0" y="170" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#E3B341">openat 30회 · 12회 실패</text>
<text x="350.0" y="194" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">close 20회</text>
<text x="350.0" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">파일이 없으면 실패</text>
<path d="M 450 180.0 L 474 180.0" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="476" y="110" width="196" height="140" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="574.0" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">03 메모리 할당</text>
<line x1="486" y1="146" x2="662" y2="146" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="574.0" y="170" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#E3B341">mmap 20회</text>
<text x="574.0" y="194" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">mprotect 4회</text>
<text x="574.0" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가상 메모리 주소 매핑</text>
<path d="M 674 180.0 L 698 180.0" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="700" y="110" width="196" height="140" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.3"/>
<text x="798.0" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">04 화면 출력</text>
<line x1="710" y1="146" x2="886" y2="146" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="798.0" y="170" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">write 1회</text>
<text x="798.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">문자열 hello</text>
<text x="798.0" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">터미널로 전달</text>
<rect x="28" y="280" width="864" height="128" rx="6" fill="#6A95D808" stroke="#6A95D8" stroke-width="1.1"/>
<text x="44" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">커널 공간 eBPF 관측 계층</text>
<text x="460.0" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">애플리케이션 수정 없이 시스템 콜 진입점(sys_enter)에서 관측</text>
<rect x="262.0" y="318" width="176" height="56" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="350.0" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">openat 진입점</text>
<text x="350.0" y="358" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어떤 파일을 여는지</text>
<path d="M 350.0 250 L 350.0 314" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)" stroke-dasharray="3 3"/>
<rect x="486.0" y="318" width="176" height="56" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="574.0" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">mmap 진입점</text>
<text x="574.0" y="358" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">메모리 매핑 호출 관측</text>
<path d="M 574.0 250 L 574.0 314" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)" stroke-dasharray="3 3"/>
<rect x="710.0" y="318" width="176" height="56" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="798.0" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">write 진입점</text>
<text x="798.0" y="358" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">출력 호출 관측</text>
<path d="M 798.0 250 L 798.0 314" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)" stroke-dasharray="3 3"/>
<line x1="12" y1="420" x2="872" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="432" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로세스 시작</text>
<rect x="235" y="432" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="257" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자원 준비 호출</text>
<rect x="383" y="432" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="405" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최종 I/O 실행</text>
<rect x="544" y="432" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="566" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">eBPF 훅 관측</text>

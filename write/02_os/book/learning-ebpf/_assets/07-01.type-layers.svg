<title id="dt">레코드 앞 8바이트의 공통 필드 넷은 프로그램이 읽지 못한다</title><desc id="dd">sys_enter_execve 의 format 은 오프셋 0 부터 common_type, common_flags, common_preempt_count, common_pid 를 두고 8 에 __syscall_nr, 16 에 filename, 24 에 argv, 32 에 envp 를 둔다. 앞 네 필드는 읽을 수 없고, 구조체의 syscall_nr 는 long 이라 4바이트 여백을 덮어 filename_ptr 이 16 에 놓인다.</desc>

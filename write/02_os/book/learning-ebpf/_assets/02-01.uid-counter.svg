<title id="dt">명령 다섯 번이 UID 별 횟수가 된다</title><desc id="dd">터미널 2 에서 ls 가 세 번, sudo ls 가 두 번 실행된다. ls 는 UID 501 로 한 번, sudo ls 는 UID 501 의 sudo 와 UID 0 의 ls 로 두 번 execve 를 부른다. 그 결과 counter_table 은 501 이 5, 0 이 2 가 되고 터미널 1 의 루프가 2초마다 읽는다.</desc>

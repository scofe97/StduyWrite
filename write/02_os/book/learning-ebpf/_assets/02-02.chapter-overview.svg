<title id="dt">커널 안 두 갈래, 사용자 공간 두 출구</title><desc id="dd">execve kprobe 의 hello() 는 헬퍼로 모은 data_t 를 perf 버퍼 output 에 밀고, sys_enter raw tracepoint 의 hello() 는 syscall prog array 로 tail call 한다.</desc>

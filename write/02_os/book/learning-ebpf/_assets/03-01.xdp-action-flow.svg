<title id="dt">XDP Hello World 패킷 처리와 xdp_action 판정 분기</title><desc id="dd">네트워크 패킷이 도착하면 hello() 가 카운터를 올리고 XDP_PASS(2) 를 반환합니다</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 03-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">XDP Hello World 패킷 처리와 xdp_action 판정 분기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">패킷 수신 · bpf_printk 출력 · 전역 변수 증가 · 5가지 xdp_action 판정</text>

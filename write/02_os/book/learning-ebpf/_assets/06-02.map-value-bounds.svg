<title id="dt">맵 값 16바이트 안의 c 와 message, 그리고 패킷 끝 포인터</title><desc id="dd">message[12] 는 맵 값의 4~15 바이트에 놓인다. 인덱스가 12 가 되면 접근 오프셋은 16 이라 값 바깥이다.</desc>
<rect width="960" height="444" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 06-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">맵 값 16바이트 안의 c 와 message, 그리고 패킷 끝 포인터</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">비교로 얻은 상한이 곧 증명이다</text>

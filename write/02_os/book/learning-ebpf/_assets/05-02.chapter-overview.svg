<title id="dt">소스 한 파일이 부품 넷과 컴파일 세 단계를 거쳐 .bpf.o 가 된다</title><desc id="dd">hello-buffer-config.bpf.c 는 헤더 다섯, 전역 변수와 맵 둘, execve 에 붙는 프로그램, 라이선스 한 줄로 이뤄지고 clang 과 llvm-strip 을 거쳐 오브젝트 파일이 된다.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">같은 SSL_write 를 가리켜도 프로브가 걸리는 파일은 하나뿐이다</title><desc id="dd">uprobe 는 경로 문자열이 아니라 그 경로가 가리키는 파일(inode)에 등록된다. 호스트의 libssl.so.3 에는 걸리고, 컨테이너 A 의 다른 복사본과 정적 링크 앱에는 걸리지 않는다.</desc>
<rect width="960" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 07-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 SSL_write 를 가리켜도 프로브가 걸리는 파일은 하나뿐이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세 파일 모두 같은 커널 위에서 돕니다</text>
<path d="M 168 152 L 168 192" fill="none" stroke="#3FB98C" stroke-width="1.7" marker-end="url(#ok)"/>
<path d="M 248 152 L 248 172 L 472 172 L 472 192" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)" stroke-dasharray="5 4"/>
<path d="M 308 152 L 308 164 L 776 164 L 776 192" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)" stroke-dasharray="5 4"/>
<rect x="24" y="100" width="560" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">uprobe 프로그램</text>
<text x="40" y="142" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">SEC("uprobe//usr/lib/aarch64-linux-gnu/libssl.so.3:SSL_write")</text>
<rect x="24" y="196" width="288" height="164" rx="8" fill="#3FB98C1F" stroke="#3FB98C" stroke-width="1.4"/>
<text x="40" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">호스트 파일시스템</text>
<line x1="36" y1="234" x2="300" y2="234" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="168" y="268" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">/usr/lib/aarch64-linux-gnu/libssl.so.3</text>
<text x="168" y="292" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">SSL_write</text>
<rect x="125.0" y="318" width="86.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="168" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">프로브 걸림</text>
<rect x="328" y="196" width="288" height="164" rx="8" fill="#F0616D10" stroke="#F0616D" stroke-width="1.2"/>
<text x="344" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">컨테이너 A 파일시스템</text>
<line x1="340" y1="234" x2="604" y2="234" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="472" y="268" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">/usr/lib/aarch64-linux-gnu/libssl.so.3</text>
<text x="472" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">같은 이름, 다른 파일</text>
<rect x="417.0" y="318" width="110.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="472" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">프로브 안 걸림</text>
<rect x="632" y="196" width="288" height="164" rx="8" fill="#F0616D10" stroke="#F0616D" stroke-width="1.2"/>
<text x="648" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">정적 링크 앱</text>
<line x1="644" y1="234" x2="908" y2="234" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="776" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">실행 파일 안에 libssl 포함</text>
<text x="776" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">공유 라이브러리 없음</text>
<rect x="721.0" y="318" width="110.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="776" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">프로브 안 걸림</text>
<rect x="24" y="404" width="896" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="426" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">커널</text>
<text x="40" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">uprobe 등록 단위는 파일(inode)</text>
<path d="M 168 360 L 168 400" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" marker-end="url(#ar)"/>
<path d="M 472 360 L 472 400" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" marker-end="url(#ar)"/>
<path d="M 776 360 L 776 400" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" marker-end="url(#ar)"/>
<line x1="12" y1="500" x2="912" y2="500" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="522" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="512" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로브 걸림</text>
<rect x="222" y="512" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="244" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프로브 안 걸림</text>
</svg>
<title id="dt">신원은 라벨 identity 로 좁혀졌지만 암호화 키는 아직 노드 단위다</title><desc id="dd">앱 코드 mTLS 는 앱이 인증서로 신원을 확인하고 TCP 연결을 암호화한다. 사이드카 서비스 메시는 앱을 고치지 않지만 사이드카 프록시가 필요하다. 투명 암호화는 노드 신원으로 커널 IPsec·WireGuard 터널을 맺어 IP 패킷 전체를 감싼다. 상호 인증은 베타이고 SPIRE 서버가 필요하며 신원은 라벨 identity 이고 암호화는 따로 켠다.</desc>
<rect width="884" height="404" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING EBPF · 08-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">신원은 라벨 identity 로 좁혀졌지만 암호화 키는 아직 노드 단위다</text>

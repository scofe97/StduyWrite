<title id="dt">컨테이너 = namespace + cgroup</title><desc id="dd">Linux 커널에는 컨테이너라는 개념이 없다. namespace 가 보이는 것을 가리고 cgroup 이 쓸 수 있는 양을 막으며, 유저 공간 소프트웨어가 둘을 묶어 컨테이너라 부른다.</desc>
<rect width="928" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 11-03 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">컨테이너 = namespace + cgroup</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">커널에 통일된 컨테이너 ID 가 없다는 점이 관측을 어렵게 만듭니다</text>
<rect x="24" y="128" width="424" height="224" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#6A95D8">namespace</text>
<text x="40" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">격리 — 무엇이 보이는가</text>
<line x1="40" y1="194" x2="432" y2="194" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="40" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">시스템 뷰를 필터링해 자기 자원만</text>
<text x="40" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">보게 합니다.</text>
<text x="40" y="278" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">pid · net · mnt · ipc · uts</text>
<text x="40" y="298" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">user · cgroup · time</text>
<text x="40" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6A95D8">컨테이너마다 PID 1 이 따로 있습니다</text>
<rect x="480" y="128" width="424" height="224" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="496" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">cgroup</text>
<text x="496" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">제한 — 얼마나 쓰는가</text>
<line x1="496" y1="194" x2="888" y2="194" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="496" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">자원 사용량에 한계를 겁니다.</text>
<text x="496" y="258" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">cpu · cpuset · memory</text>
<text x="496" y="278" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">blkio · pids</text>
<text x="496" y="298" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">net_cls · net_prio</text>
<text x="496" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">하드 한계와 공유 기반 소프트 한계</text>
<text x="24" y="392" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">유저 공간 소프트웨어(Docker 등)가 이 둘을 조합해 컨테이너를 만듭니다</text>
<text x="24" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">Kubernetes 는 여러 컨테이너가 같은 namespace 를 공유하는 Pod 로 묶어 localhost 통신을 가능하게 합니다</text>
<line x1="12" y1="440" x2="880" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="462" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="451" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="463" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">쓸 수 있는 양을 막는 쪽</text>
<rect x="358" y="451" width="14" height="14" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="380" y="463" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">보이는 것을 가리는 쪽</text>
</svg>
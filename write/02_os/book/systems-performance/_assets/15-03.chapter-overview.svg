<title id="dt">프로그램을 짜는 다섯 갈래</title><desc id="dd">구조를 세우고 변수와 함수를 익힌 뒤, 종합 예제로 지연 측정을 완성한다.</desc>
<rect width="928" height="564" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 15-03</text>

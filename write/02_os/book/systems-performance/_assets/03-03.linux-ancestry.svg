<title id="dt">Linux 가 선조에게서 물려받은 것</title><desc id="dd">Linux 는 Unix(와 Multics) · BSD · Solaris · Plan 9 에서 아이디어를 가져왔다. BSD 는 Unix 6판을 개선하며 시작했고 Solaris 는 Unix · BSD 에서 파생됐다. 화살표는 '아이디어를 가져온 쪽 → 준 쪽'이고, 노드 안이 물려받은 기능이다.</desc>

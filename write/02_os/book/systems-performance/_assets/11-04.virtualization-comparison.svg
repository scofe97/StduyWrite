<title id="dt">세 기술은 관측성에서 갈린다</title><desc id="dd">CPU·I/O 성능은 셋 다 높다. 갈리는 곳은 메모리 할당 유연성과, 누가 무엇을 볼 수 있느냐다.</desc>

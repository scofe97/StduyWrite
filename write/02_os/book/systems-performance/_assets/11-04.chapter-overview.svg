<title id="dt">경량 가상화와 세 기술의 비교</title><desc id="dd">11-04 가 다루는 네 절. 경량 가상화가 양쪽 장점을 어떻게 얻는지 보고, 기타 유형을 거쳐, 세 기술을 관측성 기준으로 비교한다.</desc>
<rect width="928" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEMS PERFORMANCE · 11-04</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">경량 가상화와 세 기술의 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8B98A9">마지막 절이 11장 전체의 결론입니다 — 관측성이 선택을 가릅니다</text>
<rect x="96" y="116" width="736" height="68" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="72" y="156" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">§1</text>
<text x="116" y="146" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">경량 가상화</text>
<text x="116" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">Firecracker · Kata · gVisor</text>
<text x="812" y="156" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">양쪽의 장점을 노린다</text>
<rect x="96" y="194" width="736" height="68" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="72" y="234" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">§2</text>
<text x="116" y="224" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">관측</text>
<text x="116" y="246" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">VM 처럼 게스트가 자체 커널을 본다</text>
<text x="812" y="234" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">컨테이너와 다르다</text>
<rect x="96" y="272" width="736" height="68" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="72" y="312" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">§3</text>
<text x="116" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">기타 유형</text>
<text x="116" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">FaaS · SaaS · Unikernel</text>
<text x="812" y="312" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">로그인할 OS 가 없다</text>
<rect x="96" y="350" width="736" height="68" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="72" y="390" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">§4</text>
<text x="116" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">세 기술 비교</text>
<text x="116" y="402" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">관측성이 선택을 가른다</text>
<text x="812" y="390" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">누가 분석하는가로 갈린다</text>
<text x="36" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">기술</text>
<path d="M 36 132 L 36 410" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)" stroke-dasharray="4 6"/>
<text x="36" y="434" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">판단</text>
<text x="96" y="440" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">경량 VM 은 컨테이너의 단점을 풀되 통합 캐시 같은 일부 장점을 대가로 냅니다</text>
<line x1="12" y1="464" x2="880" y2="464" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="486" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="475" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="487" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">11장 전체의 결론</text>
<rect x="298" y="475" width="14" height="14" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="320" y="487" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">나머지 절</text>

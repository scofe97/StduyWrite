<title id="dt">카운터에서 알림까지</title><desc id="dd">원서 그림 1.4. 앱과 커널의 카운터를 성능 도구·에이전트가 읽어 통계를 내고, 모니터링 UI 가 그중 고른 통계를 메트릭으로 기록하며, 이벤트 처리가 메트릭으로 알림을 만든다. 원서는 업계의 쓰임이 엄격하지 않다고 덧붙인다.</desc>

<title id="dt">스레드 둘을 만든 직후의 실행 순서는 세 가지가 모두 가능하다</title><desc id="dd">추적 1 은 main 이 스레드 둘을 만들고 기다린 뒤 스레드 1 이 A, 스레드 2 가 B 를 찍는다. 추적 2 는 스레드 1 을 만든 직후 스레드 1 이 먼저 A 를 찍고, 이어 만든 스레드 2 가 B 를 찍은 뒤 main 이 기다리기 시작한다. 추적 3 은 스레드 2 가 스레드 1 보다 먼저 돌아 B 가 A 보다 먼저 찍힌다.</desc>

<title id="dt">만든 쪽과 새 스레드 사이에 인자·반환값·락·신호가 끼는 자리</title><desc id="dd">21-01 의 키워드 개념도. 위 줄은 스레드를 만드는 쪽이고 아래 줄은 새 스레드다. pthread_create 가 새 줄을 시작시키며 인자를 넘기고, 새 줄이 끝나면 pthread_join 이 반환값을 받는다. 두 줄이 함께 건드리는 공유 변수는 가운데 있고 pthread_mutex_lock 과 unlock 이 그 둘레를 감싼다. pthread_cond_wait 는 락을 놓고 잠들고 pthread_cond_signal 이 깨운다. 빌드와 사용 지침은 곁가지다.</desc>
<rect width="984" height="608" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SWIMLANE · 21-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">만든 쪽과 새 스레드 사이에 인자·반환값·락·신호가 끼는 자리</text>

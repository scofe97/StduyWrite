<title id="dt">인증은 키·인증서·해시로 쌓고 메시지 하나에서 멈춘다</title><desc id="dd">한 행이 한 절이다. 첫 행은 정책을 강제할 수 없는 원격 기계를 비밀번호나 공개 키로 인증하는 흐름이다. 둘째 행은 공개 키의 주인을 CA 서명으로 묶고 신뢰를 미리 설치된 CA 키에서 출발시키는 흐름이다. 셋째 행은 저장소가 새도 비밀번호가 드러나지 않게 솔트와 느린 해시를 쓰는 흐름이다. 넷째 행은 인증이 메시지 하나만 보증하므로 재전송을 막을 묶는 장치가 더 필요하다는 흐름이다.</desc>
<rect width="984" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 45-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인증은 키·인증서·해시로 쌓고 메시지 하나에서 멈춘다</text>

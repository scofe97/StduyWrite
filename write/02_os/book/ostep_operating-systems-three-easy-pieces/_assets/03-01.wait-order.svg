<title id="dt">wait() 가 있으면 어느 쪽이 먼저 돌아도 child 가 먼저 찍힌다</title><desc id="dd">부모가 먼저 도는 경우 부모는 fork 뒤 wait 에서 막혀 있고 자식이 출력하고 끝나면 막힘이 풀려 부모가 출력한다. 자식이 먼저 도는 경우 부모는 CPU 를 기다리다가 자식이 끝난 뒤 wait 를 부르면 바로 돌아와 출력한다. 두 경우 모두 자식의 출력이 부모의 출력보다 앞선다.</desc>
<rect width="920" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 03-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">wait() 가 있으면 어느 쪽이 먼저 돌아도 child 가 먼저 찍힌다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">막대 길이는 순서만 뜻하며 실제 시간이 아닙니다.</text>
<text x="24" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">부모가 먼저 도는 경우</text>
<line x1="24" y1="130" x2="872" y2="130" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="170" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">부모</text>
<text x="24" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">자식</text>
<rect x="200" y="150" width="100" height="30" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="250.0" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">fork()</text>
<rect x="300" y="150" width="180" height="30" rx="4" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="390.0" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">wait() 에서 막힘</text>
<rect x="480" y="150" width="200" height="30" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="580.0" y="170" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">parent of … 출력</text>
<rect x="300" y="214" width="180" height="30" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="390.0" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">child 출력 후 종료</text>
<path d="M 480 214 L 480 182" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="490" y="203" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">끝나면 막힘이 풀림</text>
<text x="24" y="290" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">자식이 먼저 도는 경우</text>
<line x1="24" y1="300" x2="872" y2="300" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">부모</text>
<text x="24" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">자식</text>
<rect x="200" y="320" width="100" height="30" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="250.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">fork()</text>
<rect x="300" y="320" width="180" height="30" rx="4" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="390.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">CPU 를 기다림</text>
<rect x="480" y="320" width="140" height="30" rx="4" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="550.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">wait() 즉시 반환</text>
<rect x="620" y="320" width="180" height="30" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="710.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">parent of … 출력</text>
<rect x="300" y="384" width="180" height="30" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="390.0" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">child 출력 후 종료</text>
<text x="200" y="440" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">시간 →</text>
<line x1="12" y1="460" x2="872" y2="460" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="482" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="472" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">fork</text>
<rect x="196" y="472" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="218" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자식 출력</text>
<rect x="305" y="472" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="327" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부모 출력</text>
<rect x="414" y="472" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="436" y="482" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">막힘 · 대기</text>
</svg>
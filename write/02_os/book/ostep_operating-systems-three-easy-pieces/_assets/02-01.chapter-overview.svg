<title id="dt">프로세스는 적재에서 회수까지 일생을 거치고 운영체제가 목록으로 추적한다</title><desc id="dd">02-01 의 키워드 개념도. 가운데 줄은 프로세스 한 개의 일생이다. 디스크의 프로그램이 적재되어 main 에서 시작하고, 실행 중에는 Ready 와 Running 과 Blocked 를 오가다 끝나면 zombie 로 남고, 부모가 wait 로 회수한다. 위 띠는 물리 CPU 몇 개를 번갈아 돌리는 시분할이 CPU 가 끝없이 있는 듯한 환상을 만들고 Ready 와 Running 사이의 오감을 낳는 까닭이다. 아래 띠는 운영체제가 프로세스마다 PCB 를 두고 프로세스 목록으로 묶어 상태를 추적하는 방법이다. 오른쪽 위 곁가지는 프로세스 API 다.</desc>
<rect width="984" height="696" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">STATE · 02-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로세스는 적재에서 회수까지 일생을 거치고 운영체제가 목록으로 추적한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 옆 글자는 두 요소의 관계, 칩은 그 요소를 다루는 절입니다. 가운데 줄이 일생이고 위아래 띠가 일생을 받칩니다.</text>
<text x="24" y="108" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">왜 이렇게 하나</text>

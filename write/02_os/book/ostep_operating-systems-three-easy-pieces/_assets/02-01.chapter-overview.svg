<title id="dt">프로세스는 CPU 를 번갈아 쓰며 끝없는 CPU 의 환상을 만든다</title><desc id="dd">02-01 의 키워드 개념도. 1행은 물리 CPU 가 몇 개뿐이어도 프로세스를 번갈아 돌려 가상 CPU 가 여럿인 듯 보이게 하는 시분할이다. 2행은 프로세스를 만들고 기다리고 제어하고 없애고 살피는 API 다. 3행은 디스크의 프로그램이 주소 공간에 올라 main 에서 시작하는 과정이다. 4행은 Ready 와 Running 과 Blocked 사이의 전이이고, 5행은 프로세스 목록과 PCB 와 zombie 상태다. 6행은 process-run.py 시뮬레이터 숙제다.</desc>
<rect width="984" height="776" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 02-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로세스는 CPU 를 번갈아 쓰며 끝없는 CPU 의 환상을 만든다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

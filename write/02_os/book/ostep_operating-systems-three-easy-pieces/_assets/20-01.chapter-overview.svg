<title id="dt">스레드는 주소 공간을 나눠 쓰므로 공유 데이터 앞에서 동기화가 필요해진다</title><desc id="dd">20-01 의 키워드 개념도. 1행은 스레드가 한 주소 공간을 함께 쓰되 스택은 따로 가진다는 정의다. 2행은 병렬성과 입출력 겹치기가 스레드를 쓰는 두 이유라는 점이다. 3행은 스레드 실행 순서를 스케줄러가 정하므로 결과가 실행마다 달라진다는 점이다. 4행은 공유 카운터를 읽고 더하고 쓰는 사이에 전환이 끼어들면 갱신이 사라지는 경쟁 상태다. 5행은 그 구간을 임계 구역으로 보고 한 번에 한 스레드만 들이는 상호 배제다. 6행은 이를 위해 하드웨어와 운영체제가 동기화 기본 요소를 제공하고, 기다림은 조건 변수가 맡는다는 예고다.</desc>
<rect width="984" height="780" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 20-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스레드는 주소 공간을 나눠 쓰므로 공유 데이터 앞에서 동기화가 필요해진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

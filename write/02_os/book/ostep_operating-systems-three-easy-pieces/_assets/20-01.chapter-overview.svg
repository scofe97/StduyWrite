<title id="dt">주소 공간 공유와 실행 순서가 만나 갱신이 사라지고 상호 배제가 필요하다</title><desc id="dd">20-01 의 키워드 개념도. 왼쪽에서 스레드가 두 사실을 낳는다. 하나는 주소 공간을 함께 쓴다는 것이고 다른 하나는 실행 순서를 스케줄러가 정해 미리 알 수 없다는 것이다. 두 사실은 가운데 한 자리에서 만난다. 공유 카운터를 읽고 더하고 쓰는 사이에 전환이 끼어들면 스레드 1 이 읽은 값으로 덮어써 갱신 하나가 사라지고 카운터는 52 가 아니라 51 이 된다. 오른쪽은 그 구간을 임계 구역으로 보고 상호 배제로 지키는 길이다. 그러려면 원자성이 필요하고 하드웨어와 운영체제가 동기화 기본 요소를 만든다. 조건 변수는 뒤 장들의 몫이다.</desc>
<rect width="984" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 20-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">주소 공간 공유와 실행 순서가 만나 갱신이 사라지고 상호 배제가 필요하다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 요소의 관계, 칩은 그 요소를 다루는 절, 왼쪽에서 오른쪽으로 읽습니다.</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">원인</text>

<title id="dt">프로그램의 바이트가 주소 공간이 되고 main() 에서 시작한다</title><desc id="dd">디스크의 프로그램에서 code 와 static data 가 프로세스의 주소 공간으로 적재된다. 운영체제는 스택에 argc 와 argv 를 채우고 힙을 작게 마련할 수 있으며, 표준 입력·출력·에러의 파일 디스크립터 세 개를 열고, 진입점 main() 으로 점프해 CPU 제어를 프로세스에 넘긴다.</desc>
<rect width="920" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 02-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로그램의 바이트가 주소 공간이 되고 main() 에서 시작한다</text>
<rect x="24" y="112" width="200" height="176" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.1"/>
<text x="124" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">디스크 (또는 SSD)</text>
<rect x="44" y="152" width="160" height="48" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="124" y="174" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">code</text>
<text x="124" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">명령</text>
<rect x="44" y="212" width="160" height="48" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="124" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">static data</text>
<text x="124" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">초기화된 변수</text>
<rect x="300" y="112" width="240" height="300" rx="6" fill="#5E6B7E10" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="420" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">프로세스의 주소 공간</text>
<rect x="320" y="152" width="200" height="48" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="420" y="174" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">code</text>
<text x="420" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">디스크에서 읽어 옴</text>
<rect x="320" y="212" width="200" height="48" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="420" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">static data</text>
<text x="420" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">디스크에서 읽어 옴</text>
<rect x="320" y="272" width="200" height="48" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="420" y="294" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">heap</text>
<text x="420" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">작게 시작 · malloc 때 확장</text>
<rect x="320" y="332" width="200" height="48" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="420" y="354" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">stack</text>
<text x="420" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">argc · argv 를 채움</text>
<path d="M 204 176 L 320 176" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)"/>
<path d="M 204 236 L 320 236" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)"/>
<rect x="231.0" y="150" width="62.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="262" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">1 적재</text>
<rect x="234.0" y="346" width="56.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="262" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">2 스택</text>
<rect x="240.0" y="286" width="44.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="262" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">3 힙</text>
<rect x="640" y="152" width="232" height="92" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="756" y="180" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">열린 파일 디스크립터 세 개</text>
<text x="756" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">표준 입력 · 표준 출력</text>
<text x="756" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">표준 에러</text>
<rect x="702.0" y="130" width="108.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="756" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">4 입출력 준비</text>
<rect x="640" y="320" width="232" height="92" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="756" y="354" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">main() 으로 점프</text>
<text x="756" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CPU 제어를 프로세스에 넘김</text>
<path d="M 540 366 L 640 366" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<path d="M 756 244 L 756 320" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="560.0" y="340" width="60.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="590" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">5 점프</text>
<line x1="12" y1="444" x2="872" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="466" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="456" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">디스크에서 옮긴 것</text>
<rect x="274" y="456" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="296" y="466" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">운영체제가 마련한 것</text>

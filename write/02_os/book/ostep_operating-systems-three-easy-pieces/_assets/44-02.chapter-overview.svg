<title id="dt">암호는 키에서 깨지고 OS 는 세 자리에 암호를 쓴다</title><desc id="dd">44-02 편의 전체 지도. 첫 행은 키가 새거나 키 선택이 무너지는 경로와, 후보가 줄면 무차별 대입이 쉬워진다는 점, 무작위 키로 막는 방법, 둘째 행은 OS 가 키를 쥐면 암호가 숨기지 못한다는 한계와 예외 세 자리, 셋째 행은 전체 디스크 암호화의 보호 범위와 비밀번호 보관함의 타협, 넷째 행은 서명한 capability 가 위조를 막으면서 만료와 신원을 담는 방식을 보인다.</desc>
<rect width="1000" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 44-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">암호는 키에서 깨지고 OS 는 세 자리에 암호를 쓴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행은 본문 절, 화살표 라벨은 앞 키워드에서 뒤 키워드로 넘어가는 관계</text>

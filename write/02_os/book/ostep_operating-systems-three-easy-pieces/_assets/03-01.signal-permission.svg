<title id="dt">시그널은 누가 보내느냐에 따라 닿는 프로세스가 갈린다</title><desc id="dd">일반 사용자는 자기 프로세스에는 시그널을 보낼 수 있지만 다른 사용자의 프로세스에는 대개 보낼 수 없다. 슈퍼유저는 자기 프로세스에는 시그널을 보낼 수 있고 다른 사용자의 프로세스에도 대개 보낼 수 있다.</desc>
<rect width="920" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 03-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">시그널은 누가 보내느냐에 따라 닿는 프로세스가 갈린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">일반 사용자는 대개 자기 프로세스만 통제합니다.</text>

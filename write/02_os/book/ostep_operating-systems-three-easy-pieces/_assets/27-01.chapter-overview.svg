<title id="dt">이벤트 루프는 한 번에 하나만 돌고 막히는 일은 루프 밖으로 넘긴다</title><desc id="dd">27-01 의 키워드 개념도. 왼쪽 고리가 이벤트 루프 한 바퀴다. select() 로 기다리고 준비된 이벤트 하나를 꺼내 핸들러를 끝까지 돌린 뒤 다시 기다리며, 한 번에 핸들러 하나만 돌아 락이 필요 없다. 고리 오른쪽은 핸들러 안에서 막히는 호출이 서버 전체를 멈추는 문제로, SLOW 뒤 TIME 응답이 1,709 ms 뒤에 왔다. 그 오른쪽은 aio_read 로 넘기고 aio_error 로 나중에 확인하며 이어 처리할 상태를 직접 남기는 대응이다. 아래는 치르는 값, 곧 수동 스택 관리의 복잡함과 여러 CPU 에서 되살아나는 락이고, 그래서 단순한 방식부터 고른다는 결론으로 끝난다.</desc>
<rect width="984" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 27-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이벤트 루프는 한 번에 하나만 돌고 막히는 일은 루프 밖으로 넘긴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 요소의 관계, 칩은 그 요소를 다루는 절, 고리에서 시작해 시계 방향으로 읽습니다.</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">루프 한 바퀴</text>

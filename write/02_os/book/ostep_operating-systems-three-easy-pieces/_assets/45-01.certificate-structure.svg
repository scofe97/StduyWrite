<title id="dt">서명은 이름과 공개 키가 든 tbsCertificate 를 덮는다</title><desc id="dd">인증서 server.der 는 788바이트이고 tbsCertificate, 서명 알고리즘, 서명 값 셋을 감싼다. tbsCertificate 는 바이트 4에서 511까지 508바이트이며 발급자 이름, 서버 이름, 공개 키, 유효 기간, 대체 이름이 들어 있다. 서명 값은 바이트 527에서 787까지 261바이트로 머리 4바이트와 미사용 비트 1바이트와 서명 256바이트이며 tbsCertificate 바깥에 붙고, 그 입력은 tbsCertificate 이다. 서버 이름 한 글자만 바꿔도 서명 확인이 error 7 로 실패한다.</desc>
<rect width="880" height="452" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 45-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서명은 이름과 공개 키가 든 tbsCertificate 를 덮는다</text>
<rect x="12" y="92" width="852" height="292" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="28" y="114" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">server.der 788바이트 = 머리 4 + 본문 784</text>
<rect x="36" y="132" width="508" height="216" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.6"/>
<text x="52" y="156" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">tbsCertificate</text>
<text x="52" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">바이트 4–511 · 508바이트</text>
<rect x="52" y="188" width="228" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="62" y="211" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">issuer</text>
<text x="136" y="211" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">CN=Demo Root</text>
<rect x="296" y="188" width="228" height="36" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="1.4"/>
<text x="306" y="211" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">subject</text>
<text x="380" y="211" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">CN=demo.local</text>
<rect x="52" y="232" width="228" height="36" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="62" y="255" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">공개 키</text>
<text x="136" y="255" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">RSA 2048</text>

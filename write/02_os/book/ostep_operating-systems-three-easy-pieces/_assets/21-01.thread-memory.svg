<title id="dt">스택은 스레드마다 하나, 나머지는 모두가 함께 쓴다</title><desc id="dd">프로세스의 주소 공간 안에 코드·전역 변수·heap 이 있는 공유 영역과 스레드마다 하나씩인 스택이 들어 있다. 새 스레드의 arg 는 main 의 스택에 있는 args 를 가리키고, rvals 는 공유 영역의 heap 을 가리킨다.</desc>
<rect width="880" height="524" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 21-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스택은 스레드마다 하나, 나머지는 모두가 함께 쓴다</text>
<rect x="24" y="96" width="832" height="372" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

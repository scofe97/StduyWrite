<title id="dt">쓰는 순간 그 페이지만 복사되어 자식의 값은 그대로다</title><desc id="dd">fork 직후 부모와 자식이 같은 물리 페이지를 읽기 전용으로 함께 쓰다가 부모가 쓰는 순간 그 페이지만 복사되어 자식의 값은 그대로 남는 세 시점</desc>

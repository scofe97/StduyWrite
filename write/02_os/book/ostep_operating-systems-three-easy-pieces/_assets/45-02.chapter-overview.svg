<title id="dt">TLS 는 서명한 키 교환으로 통로를 세우고 믿음은 출발점에서 시작한다</title><desc id="dd">45-02 편의 전체 지도. 첫 행은 연결마다 새 대칭 키를 합의해 순방향 비밀성을 얻는 방식, 둘째 행은 중간자 공격을 서버의 서명(CertificateVerify)이 막는 방식, 셋째 행은 핸드셰이크 세 단계와 클라이언트가 비밀번호로 뒤에 증명하는 이유, 넷째 행은 Heartbleed 로 본 규격 결함과 구현 결함의 구분, 다섯째 행은 쿠키와 도전 응답과 인증 서버의 비교, 여섯째 행은 인증서의 좁은 보증과 HSTS, 일곱째 행은 SSH 첫 접속의 호스트 키 신뢰를 보인다.</desc>
<rect width="1000" height="792" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 45-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TLS 는 서명한 키 교환으로 통로를 세우고 믿음은 출발점에서 시작한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행은 본문 절, 화살표 라벨은 앞 키워드에서 뒤 키워드로 넘어가는 관계</text>

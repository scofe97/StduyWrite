<title id="dt">통로를 세워 인증하고 신원을 이어 가며 믿음은 출발점에서 시작한다</title><desc id="dd">45-02 의 키워드 개념도. 가운데에 세 구간이 왼쪽에서 오른쪽으로 이어진다. 첫 구간은 통로 세우기로, 연결마다 새 키를 합의하고 서버가 서명해 상대를 확인하며, 보증은 서버의 인증서와 서명이 닿는 곳까지다. 둘째 구간은 선 통로 안에서 비밀번호로 클라이언트를 인증하는 것이고 도전 응답과 인증 서버는 곁가지다. 셋째 구간은 쿠키가 신원을 이어 가는 것이고 브라우저를 쓰는 다른 사람도 인증된다는 문제가 남는다. 첫 구간의 보증 끝에서 규격 결함과 구현 결함을 가르는 곁가지가 나온다. 위에는 같은 문제를 이미 푼 HTTPS 와 SSH 가 있고, 아래에는 미리 설치된 인증 기관 키와 첫 접속의 호스트 키라는 믿음의 출발점이 세 구간을 받친다.</desc>
<rect width="984" height="836" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 45-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">통로를 세워 인증하고 신원을 이어 가며 믿음은 출발점에서 시작한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">아래에서 위로 믿음이 받치고 가운데는 왼쪽에서 오른쪽으로 읽습니다. 화살표에 붙은 글자는 관계, 칩은 다루는 절입니다.</text>

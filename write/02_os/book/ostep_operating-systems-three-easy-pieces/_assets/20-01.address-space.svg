<title id="dt">스레드를 더하면 주소 공간에서 스택만 한 층 늘어난다</title><desc id="dd">단일 스레드 프로세스의 주소 공간은 위에서부터 프로그램 코드(0KB~1KB), 정적 데이터, 힙(아래 변이 2KB), 빈 공간, 스택(15KB~16KB)으로 쌓인다. 스레드가 둘인 프로세스의 주소 공간은 코드·정적 데이터·힙이 그대로이고, 빈 공간 아래쪽에 스택이 하나 더 생겨 스택 (2) 와 스택 (1) 두 개가 놓인다. 전역 변수가 놓이는 정적 데이터 층은 코드와 힙 사이에 있다. 원서 그림에 없어 점선으로 더했고 눈금은 붙이지 않았다. 이 층도 스레드가 함께 쓴다.</desc>
<rect width="920" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LAYERS · 20-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스레드를 더하면 주소 공간에서 스택만 한 층 늘어난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽은 스레드 하나, 오른쪽은 스레드 둘입니다. 눈금은 원서 값이고, 코드와 힙 사이의 점선 층은 원서 그림에 없습니다.</text>
<text x="270.0" y="100" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">스레드 하나</text>
<rect x="120" y="112" width="300" height="52" rx="6" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.1"/>
<text x="270.0" y="136.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">프로그램 코드</text>
<text x="270.0" y="156.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">명령어가 있는 자리</text>
<rect x="120" y="168" width="300" height="52" rx="6" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="270.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">정적 데이터</text>
<text x="270.0" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">전역 변수 · 원서 그림에 없는 층</text>
<rect x="120" y="224" width="300" height="52" rx="6" fill="#6A95D818" stroke="#6A95D8" stroke-width="1.1"/>
<text x="270.0" y="248.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">힙</text>

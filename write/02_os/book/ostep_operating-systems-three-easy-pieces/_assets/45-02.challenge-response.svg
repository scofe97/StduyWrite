<text x="440.0" y="199" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">도전값 7731</text>
<path d="M 714 268 L 168 268" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="440.0" y="259" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">응답 87d61ab60ff4273f</text>
<text x="440.0" y="286" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">HMAC-SHA256(비밀, 7731) 의 앞 16자</text>
<rect x="24" y="320" width="832" height="180" rx="4" fill="#F5F5F308" stroke="#5E6B7E" stroke-width="0.9"/>
<rect x="24" y="320" width="72" height="22" rx="2" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.9"/>
<text x="60.0" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">새 도전</text>
<path d="M 166 368 L 712 368" fill="none" stroke="#F5F5F3" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="440.0" y="359" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">도전값 9042</text>
<path d="M 714 428 L 168 428" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)" stroke-dasharray="5 4"/>
<text x="440.0" y="419" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">응답 7e79121912351cb7</text>
<rect x="34.0" y="466" width="244.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="156" y="480" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">같은 계산으로 비교 → ACCEPT</text>
<rect x="24" y="516" width="832" height="120" rx="4" fill="#F5F5F308" stroke="#5E6B7E" stroke-width="0.9"/>
<rect x="24" y="516" width="108" height="22" rx="2" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.9"/>
<text x="78.0" y="532" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">재사용 시도</text>
<path d="M 714 568 L 168 568" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)" stroke-dasharray="5 4"/>
<text x="440.0" y="559" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">9042 에 지난 응답 87d61ab60ff4273f</text>
<rect x="125.68" y="602" width="60.64" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="156" y="616" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">REJECT</text>
</svg>
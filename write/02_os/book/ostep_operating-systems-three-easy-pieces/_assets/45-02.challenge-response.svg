<title id="dt">새 도전값에는 지난 응답이 통하지 않는다</title><desc id="dd">확인하는 쪽이 도전값 7731 을 보내면 증명하는 쪽이 비밀로 계산한 응답 87d61ab60ff4273f 를 돌려준다. 새 연결에서 도전값 9042 를 보내면 올바른 응답은 7e79121912351cb7 이고 확인하는 쪽이 같은 계산으로 비교해 ACCEPT 한다. 도청한 쪽이 지난 응답 87d61ab60ff4273f 를 9042 에 다시 보내면 REJECT 된다. 응답은 비밀을 드러내지 않으므로 도전값과 응답을 암호화하지 않아도 된다.</desc>
<rect width="880" height="652" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 45-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">새 도전값에는 지난 응답이 통하지 않는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">도전값과 응답은 암호화 없이 보내도 되고, 비밀은 미리 나눠 갖고 있어야 한다</text>
<rect x="48.0" y="96" width="216" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="156" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">확인하는 쪽</text>
<text x="156" y="133" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">비밀을 알고 있음</text>
<line x1="156" y1="146" x2="156" y2="628" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<rect x="616.0" y="96" width="216" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="724" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">증명하는 쪽</text>
<text x="724" y="133" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">같은 비밀을 가짐</text>
<line x1="724" y1="146" x2="724" y2="628" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<rect x="24" y="160" width="832" height="144" rx="4" fill="#F5F5F308" stroke="#5E6B7E" stroke-width="0.9"/>
<rect x="24" y="160" width="96" height="22" rx="2" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.9"/>
<text x="72.0" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">지난 도전</text>

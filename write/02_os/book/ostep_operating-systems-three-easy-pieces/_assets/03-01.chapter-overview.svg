<title id="dt">fork 와 exec 사이의 틈에서 프로그램을 고치지 않고 환경을 바꾼다</title><desc id="dd">03-01 의 키워드 개념도. 위쪽 부모 줄은 셸이 fork 로 복제한 뒤 wait 로 자식이 끝나기를 기다리는 흐름이다. 아래쪽 자식 줄은 부모의 복제본으로 시작해 틈을 지나 exec 으로 다른 프로그램을 덮어쓰고 실행하는 흐름이다. 틈은 아직 셸의 코드가 도는 구간이라 열어 둔 파일을 바꿀 수 있고, 그래서 리다이렉션과 파이프가 프로그램을 고치지 않고 된다. 생성과 실행을 합친 호출은 정해진 목록만 바꾼다. 시그널은 두 줄 바깥에서 이미 도는 프로세스로 들어온다.</desc>
<rect width="984" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 03-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">fork 와 exec 사이의 틈에서 프로그램을 고치지 않고 환경을 바꾼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 요소의 관계, 칩은 그 요소를 다루는 절, 줄마다 왼쪽에서 오른쪽으로 읽습니다.</text>
<text x="24" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">부모 줄 · 셸</text>
<text x="24" y="272" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">자식 줄</text>
<rect x="24" y="132" width="140" height="64" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="34.18" y="136" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="48" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§1</text>
<text x="94.0" y="172" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">fork()</text>
<text x="94.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">명령을 받아 복제</text>
<rect x="244" y="132" width="700" height="64" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="254.18" y="136" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="268" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§2</text>
<text x="594.0" y="172" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">wait()</text>
<text x="594.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">자식이 끝날 때까지 부모를 막아 두고 끝나면 돌아옴</text>
<path d="M 166 164 L 242 164" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="204.0" y="155" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">복제 뒤</text>
<rect x="24" y="330" width="140" height="64" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="34.18" y="334" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="48" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§1</text>
<text x="94.0" y="370" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">자식 프로세스</text>
<text x="94.0" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">부모의 복제본</text>
<rect x="594" y="330" width="150" height="64" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="604.18" y="334" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="618" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§3</text>
<text x="669.0" y="370" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">exec()</text>
<text x="669.0" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">프로그램을 덮어씀</text>
<rect x="814" y="330" width="130" height="64" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="824.18" y="334" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="838" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§3</text>
<text x="879.0" y="370" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">새 프로그램</text>
<text x="879.0" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">실행 뒤 종료</text>
<rect x="244" y="300" width="280" height="124" rx="8" fill="#F08A591e" stroke="#F08A59" stroke-width="1.6"/>
<rect x="482.18" y="314" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="496" y="328" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">§4</text>
<text x="384.0" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#F08A59">fork 와 exec 사이의 틈</text>
<text x="384.0" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">셸 코드가 자식 안에서 돎</text>
<text x="384.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">열어 둔 파일을 바꿈</text>
<path d="M 166 362 L 242 362" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="204.0" y="353" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">exec 전</text>
<path d="M 528 362 L 592 362" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="560.0" y="353" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">바꾼 뒤</text>
<path d="M 746 362 L 812 362" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="779.0" y="353" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">성공하면</text>
<path d="M 124 199 L 124 327" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="136" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">복제해</text>
<path d="M 900 327 L 900 199" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="888" y="270" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">끝나면 돌아옴</text>
<rect x="24" y="490" width="140" height="64" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<rect x="34.18" y="494" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="48" y="508" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">§4</text>
<text x="94.0" y="530" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">합친 호출</text>
<text x="94.0" y="548" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">정해진 것만 바꿈</text>
<rect x="244" y="490" width="280" height="64" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<rect x="254.18" y="494" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="268" y="508" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">§4</text>
<text x="384.0" y="530" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">리다이렉션 · 파이프</text>
<text x="384.0" y="548" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">프로그램을 고치지 않음</text>
<path d="M 166 522 L 242 522" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="204.0" y="513" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">목록으로만</text>
<path d="M 384.0 427 L 384.0 487" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="396.0" y="462" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">그 틈에서 바꿔</text>
<rect x="754" y="490" width="190" height="84" rx="6" fill="#8B98A914" stroke="#8B98A9" stroke-width="1.1"/>
<rect x="764.18" y="494" width="27.64" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="778" y="508" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§5</text>
<text x="849.0" y="530" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">kill() 과 시그널</text>
<text x="849.0" y="548" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">이미 도는 프로세스 제어</text>
<text x="849.0" y="564" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">대상은 사용자 개념이 정함</text>
<path d="M 850 487 L 850 397" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)" stroke-dasharray="4 3"/>
<text x="838" y="450" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">이미 도는 프로세스로</text>
<line x1="12" y1="600" x2="936" y2="600" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="622" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="612" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호출 · 전제</text>
<rect x="235" y="612" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="257" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이점</text>
<rect x="305" y="612" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="327" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핵심</text>
<rect x="375" y="612" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="397" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">곁가지</text>
</svg>
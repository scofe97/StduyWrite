<title id="dt">블로킹 호출은 루프를 세우고 aio_read 는 루프를 계속 돌린다</title><desc id="dd">위 레인은 핸들러가 read() 를 부르면 장치 대기 동안 이벤트 루프가 멈추고 대기 중이던 요청이 그 뒤에야 처리되는 흐름이다. 아래 레인은 핸들러가 aio_read() 로 요청만 내고 돌아와 루프가 다른 이벤트를 처리하다가, aio_error() 가 EINPROGRESS 가 아닌 값을 돌려주면 aio_return() 으로 읽은 바이트 수를 받는 흐름이다.</desc>
<rect width="880" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 27-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">블로킹 호출은 루프를 세우고 aio_read 는 루프를 계속 돌린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">막힐 수 있는 일을 루프 밖으로 넘겨야 루프가 선 채 기다리지 않습니다</text>
<rect x="12" y="96" width="856" height="132" rx="8" fill="#5E6B7E0A" stroke="#5E6B7E" stroke-width="0.9"/>
<text x="24" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">블로킹 read() 를 부른 경우</text>
<rect x="24" y="136" width="140" height="76" rx="6" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="94.0" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">핸들러</text>
<text x="94.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이벤트 처리 시작</text>
<path d="M 166 174.0 L 190 174.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="192" y="136" width="140" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="262.0" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">read()</text>
<text x="262.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">디스크 요청</text>
<path d="M 334 174.0 L 358 174.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="360" y="136" width="140" height="76" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="430.0" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">장치 대기</text>
<text x="430.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이벤트 루프 정지</text>
<path d="M 502 174.0 L 526 174.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="528" y="136" width="140" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="598.0" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">read() 반환</text>
<text x="598.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">처리 재개</text>
<path d="M 670 174.0 L 694 174.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="696" y="136" width="140" height="76" rx="6" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="766.0" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">다음 이벤트</text>
<text x="766.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">밀려 있던 요청</text>
<rect x="12" y="244" width="856" height="132" rx="8" fill="#5E6B7E0A" stroke="#5E6B7E" stroke-width="0.9"/>
<text x="24" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">aio_read() 로 넘긴 경우</text>
<rect x="24" y="284" width="140" height="76" rx="6" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="94.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">핸들러</text>
<text x="94.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이벤트 처리 시작</text>
<path d="M 166 322.0 L 190 322.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="192" y="284" width="140" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="262.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">aio_read()</text>
<text x="262.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">요청만 내고 반환</text>
<path d="M 334 322.0 L 358 322.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="360" y="284" width="140" height="76" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="430.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">다른 이벤트</text>
<text x="430.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">루프가 계속 돎</text>
<path d="M 502 322.0 L 526 322.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="528" y="284" width="140" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="598.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">aio_error()</text>
<text x="598.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">완료 여부 확인</text>
<path d="M 670 322.0 L 694 322.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="696" y="284" width="140" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="766.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">aio_return()</text>
<text x="766.0" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">읽은 바이트 수</text>
<line x1="12" y1="392" x2="832" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="414" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="404" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="122" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">응용의 핸들러</text>
<rect x="235" y="404" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="257" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">I/O 를 맡기는 호출</text>
<rect x="435" y="404" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="457" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">루프가 멈추는 자리</text>
<rect x="609" y="404" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="631" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">루프가 도는 자리</text>
</svg>
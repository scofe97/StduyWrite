<title id="dt">첫 암호문 블록의 한 비트가 둘째 평문 블록의 같은 자리를 바꾼다</title><desc id="dd">위 행은 암호문 블록 C1 이 복호된 뒤 IV 와 XOR 되어 알아볼 수 없는 평문 블록 P1' 이 되는 흐름이다. 아래 행은 C2 가 복호된 뒤 C1 과 XOR 되어 P2' 가 되는 흐름이고 C1 에서 뒤집힌 비트가 P2' 의 같은 자리에 그대로 나타난다. 복호는 오류 없이 끝난다.</desc>
<rect width="1000" height="412" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 44-01 CBC</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">첫 암호문 블록의 한 비트가 둘째 평문 블록의 같은 자리를 바꾼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">AES-256-CBC 로 암호화한 한 줄의 평문에서 C1 의 4번째 바이트를 0x01 과 XOR 한 실험이다.</text>
<rect x="24" y="108" width="192" height="76" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="120.0" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">C1</text>
<text x="120.0" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">4번째 바이트 1비트 반전</text>
<rect x="288" y="108" width="168" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="372.0" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">복호 D(K)</text>
<text x="372.0" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">같은 키 K</text>
<rect x="528" y="108" width="104" height="76" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="580.0" y="140" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">XOR</text>
<text x="580.0" y="164" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">IV 와 합침</text>

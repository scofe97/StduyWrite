<title id="dt">TLS 핸드셰이크는 키 교환, 서버 매개변수, 인증의 세 단계로 흐른다</title><desc id="dd">클라이언트가 지원 목록과 키 교환 값을 보내면 서버가 선택한 값과 자기 키 교환 값으로 답하고, 이 뒤의 메시지는 암호화된다. 서버는 이어서 서버 매개변수와 인증서와 서명과 확인값을 보내고, 클라이언트는 인증서와 서명을 확인한 뒤 자기 확인값을 보낸다.</desc>
<rect width="880" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 45-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TLS 핸드셰이크는 키 교환, 서버 매개변수, 인증의 세 단계로 흐른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">서버의 서명까지 확인해야 믿을 수 있는 통로가 서고, 비밀번호는 그 안에서 보냅니다</text>
<rect x="12" y="96" width="856" height="128" rx="8" fill="#5E6B7E0A" stroke="#5E6B7E" stroke-width="0.9"/>
<text x="24" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">클라이언트 쪽</text>

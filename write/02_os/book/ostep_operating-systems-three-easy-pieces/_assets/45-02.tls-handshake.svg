<title id="dt">핸드셰이크는 키 교환 뒤부터 암호화되고 서버의 서명으로 인증한다</title><desc id="dd">클라이언트가 ClientHello 로 지원 목록과 키 교환 값을 보내면 서버가 ServerHello 로 고른 암호 모음과 자기 키 교환 값을 답한다. 여기까지가 키 교환 단계이고 이 뒤의 메시지는 암호화된다. 서버 매개변수 단계에서 서버가 EncryptedExtensions 를 보내고, 인증 단계에서 Certificate 와 CertificateVerify 와 Finished 를 보낸다. 클라이언트가 자기 Finished 를 보내면 끝난다. 협상된 값은 TLS 1.3 이고 암호 모음은 TLS_AES_256_GCM_SHA384 이며 키 교환 그룹은 X25519MLKEM768 이다.</desc>
<rect width="880" height="732" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">OSTEP · 45-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">핸드셰이크는 키 교환 뒤부터 암호화되고 서버의 서명으로 인증한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">서버만 서명하고, 클라이언트는 이 통로가 선 뒤에 비밀번호를 보낸다</text>

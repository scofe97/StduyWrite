<title id="dt">부팅 때 길을 깔아 두고 trap 과 return-from-trap 으로 제어를 넘긴다</title><desc id="dd">위쪽부터 부팅 때 trap table 등록, 프로세스 시작 때 return-from-trap 으로 main() 진입, 실행 중 trap 과 return-from-trap 으로 시스템 콜 처리, 종료 때 exit() trap 과 자원 정리까지 제한된 직접 실행 프로토콜의 네 구간을 한 시퀀스로 보여준다.</desc>

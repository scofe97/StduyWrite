<title id="dt">경로는 컨트롤 플레인 노드를 거쳐 퍼집니다</title><desc id="dd">kubeadm 으로 여러 해 운영한 큰 클러스터다. 노드가 많아 Calico 를 풀메시 대신 경로 반사기 구성으로 바꿔 두었고, 반사기 역할은 컨트롤 플레인 노드가 맡는다. 어느 노드가 반사기인지는 BGPPeer 리소스의 셀렉터가 노드 라벨로 고른다.</desc>

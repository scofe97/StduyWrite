<title id="dt">이름이 Pod 에 닿기까지</title><desc id="dd">Service 이름으로 부를 때만 지나는 두 관문. 첫째는 이름을 주소로 바꾸는 일이고 둘째는 그 주소가 어느 Pod 로 갈지 아는 일이다. 어느 쪽이 막혔느냐에 따라 클라이언트가 보는 증상이 다르다.</desc>
<rect width="900" height="728" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-07 D2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름이 Pod 에 닿기까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이름 해석이 실패하면 즉시 오류가, 대상 목록이 비면 타임아웃이 돌아옵니다</text>

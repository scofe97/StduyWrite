<text x="406" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">아무것도 크래시하지 않았고 노드도 죽지 않았습니다</text>
<text x="406" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Pod 가 사라진 자리에 남은 이벤트는 Preempted by another pod 하나뿐입니다</text>

<title id="dt">같은 클러스터의 두 벌</title><desc id="dd">시계열 수집 서비스가 한 클러스터에 두 벌 떠 있다. 하나는 우선순위 클래스를 만들기 전부터 돌던 운영용이고, 다른 하나는 장애 당일 배포한 고객 전용이다.</desc>
<rect width="812" height="424" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TROUBLESHOOTING DRILL · 2026-09-09 B</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 클러스터의 두 벌</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 벌의 차이는 무엇을 하느냐가 아니라 언제 만들어졌느냐입니다</text>
<rect x="40" y="116" width="736" height="60" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="56" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F5F5F3">전날 — 우선순위 클래스 넷을 새로 만들고 medium 을 기본값으로 지정</text>
<text x="56" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">이미 떠 있던 Pod 에 무엇이 적용되는지는 이 그림에 없습니다</text>

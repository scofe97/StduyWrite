<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="to do">
<title id="to">한 세션이 자기 코드를 리뷰할 때와 별도 세션이 결과만 볼 때의 차이</title>
<desc id="do">같은 세션은 구현 맥락을 알고 있어 리뷰가 관대해지고, 별도 세션은 결과만 보므로 냉정해진다는 대비 그림입니다. 별도 세션 쪽만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--bad:#F0616D;--ok:#3FB98C}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.lbl{fill:var(--ink);font-size:13px;font-weight:600}
.note{fill:var(--muted);font-size:10px}
.bad{fill:var(--bad);font-size:11px}
.ok{fill:var(--ok);font-size:11px}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
</style>
<rect width="1000" height="320" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">WHY SEPARATE SESSIONS</text>
<text class="kr h1" x="64" y="76">맥락을 가진 쪽은 자기 편을 듭니다</text>
<text class="kr sub" x="64" y="98">세션을 하나 더 띄우는 비용으로 작성자와 리뷰어를 나눌 수 있습니다.</text>

<text class="kr lbl" x="64" y="140">같은 세션이 스스로 리뷰</text>
<rect class="box" x="64" y="156" width="176" height="52" rx="4"/>
<text class="kr note" x="88" y="180">구현 + 리뷰</text>
<text class="kr note" x="88" y="198">왜 그렇게 짰는지 앎</text>
<path class="arrow" d="M240 182 L296 182"/><path class="arrow" d="M288 177 L296 182 L288 187"/>
<text class="kr bad" x="312" y="178">그 이유가 리뷰의 편에 섭니다</text>
<text class="kr note" x="312" y="196">문제를 문제로 보지 않게 됩니다</text>

<line x1="64" y1="232" x2="936" y2="232" stroke="var(--rule)" stroke-width="1"/>

<text class="kr lbl" x="64" y="264">별도 세션이 리뷰</text>
<rect x="56" y="272" width="888" height="40" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr note" x="88" y="296">구현 세션</text>
<path class="arrow" d="M180 292 L236 292"/><path class="arrow" d="M228 287 L236 292 L228 297"/>
<text class="kr note" x="252" y="296">결과물만 전달</text>
<path class="arrow" d="M352 292 L408 292"/><path class="arrow" d="M400 287 L408 292 L400 297"/>
<text class="kr note" x="424" y="296">리뷰 세션</text>
<text class="kr ok" x="536" y="296">맥락이 없으니 결과만 봅니다 · 프롬프트로 "고치지 말라"를 겁니다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" role="img" aria-labelledby="ti di">
<title id="ti">코디네이터를 중심에 둔 별 모양과 워커끼리 직접 말하는 그물 모양의 대비</title>
<desc id="di">왼쪽은 워커 다섯이 서로 직접 연결된 그물 구조로 경로가 열 갈래이고, 오른쪽은 코디네이터를 거치는 별 구조로 경로가 다섯 갈래임을 보이는 대비 그림입니다. 별 구조만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--bad:#F0616D;--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.cap{fill:var(--ink);font-size:13px;font-weight:600}
.note{fill:var(--muted);font-size:10px}
.bad{fill:var(--bad);font-size:11px}
.ok{fill:var(--info);font-size:11px}
.mesh{stroke:var(--bad);stroke-width:0.8;opacity:.55;fill:none}
.star{stroke:var(--accent);stroke-width:1.2;fill:none}
.node{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.nlbl{fill:var(--muted);font-size:10px;text-anchor:middle}
</style>
<rect width="1000" height="372" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">TOPOLOGY</text>
<text class="kr h1" x="64" y="76">모든 소통이 코디네이터를 거칩니다</text>
<text class="kr sub" x="64" y="98">워커가 다섯일 때 경로의 수가 열 갈래에서 다섯 갈래로 줄어듭니다.</text>

<text class="kr cap" x="64" y="140">워커끼리 직접</text>
<text class="kr bad" x="64" y="158">경로 n(n−1)/2 = 10</text>
<g transform="translate(216,252)">
<path class="mesh" d="M0,-72 L68,-22 M0,-72 L42,58 M0,-72 L-42,58 M0,-72 L-68,-22"/>
<path class="mesh" d="M68,-22 L42,58 M68,-22 L-42,58 M68,-22 L-68,-22"/>
<path class="mesh" d="M42,58 L-42,58 M42,58 L-68,-22"/>
<path class="mesh" d="M-42,58 L-68,-22"/>
<circle class="node" cx="0" cy="-72" r="14"/><circle class="node" cx="68" cy="-22" r="14"/>
<circle class="node" cx="42" cy="58" r="14"/><circle class="node" cx="-42" cy="58" r="14"/>
<circle class="node" cx="-68" cy="-22" r="14"/>
</g>
<text class="kr note" x="112" y="352">누가 무엇을 아는지 추적할 수 없습니다</text>

<line x1="484" y1="128" x2="484" y2="340" stroke="var(--rule)" stroke-width="1"/>

<text class="kr cap" x="548" y="140">코디네이터를 거쳐서</text>
<text class="kr ok" x="548" y="158">경로 n = 5</text>
<g transform="translate(700,252)">
<path class="star" d="M0,0 L0,-72 M0,0 L68,-22 M0,0 L42,58 M0,0 L-42,58 M0,0 L-68,-22"/>
<circle cx="0" cy="0" r="22" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<circle class="node" cx="0" cy="-72" r="14"/><circle class="node" cx="68" cy="-22" r="14"/>
<circle class="node" cx="42" cy="58" r="14"/><circle class="node" cx="-42" cy="58" r="14"/>
<circle class="node" cx="-68" cy="-22" r="14"/>
<text class="kr nlbl" x="0" y="4" style="fill:#F5F5F3;font-size:10px">코디</text>
</g>
<text class="kr note" x="596" y="352">한 곳만 보면 전체가 보입니다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" role="img" aria-labelledby="t6 d6">
<title id="t6">Repo 하나에서 워크트리가 갈리고 각 워크트리에 터미널이 붙는 구조</title>
<desc id="d6">Repo 아래에 원본 워크트리와 파생 워크트리 둘이 트리로 갈리고, 파생 워크트리마다 터미널이 붙어 있는 구조입니다. 파생 워크트리 하나만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.lbl{fill:var(--ink);font-size:13px;font-weight:600}
.path{fill:var(--muted);font-size:10px}
.note{fill:var(--muted);font-size:10px}
.edge{stroke:var(--rule);stroke-width:1;fill:none}
.legend{fill:var(--soft);font-size:10px}
</style>
<rect width="1000" height="372" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">REPO · WORKTREE · TERMINAL</text>
<text class="kr h1" x="64" y="76">작업을 세는 단위가 셋입니다</text>
<text class="kr sub" x="64" y="98">Repo 는 프로젝트마다 하나, 워크트리는 작업마다 하나, 터미널은 워크트리마다 하나 이상입니다.</text>

<rect class="box" x="64" y="132" width="248" height="60" rx="4"/>
<text class="kr lbl" x="88" y="158">Repo</text>
<text class="mn path" x="88" y="176">$HOME/orca-practice</text>

<path class="edge" d="M188 192 L188 232 L380 232"/>
<path class="edge" d="M188 232 L188 300 L380 300"/>

<rect class="box" x="380" y="204" width="280" height="56" rx="4"/>
<text class="kr lbl" x="404" y="228">워크트리 main</text>
<text class="mn path" x="404" y="246">원본 폴더 · isMainWorktree true</text>

<rect x="380" y="272" width="280" height="56" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr lbl" x="404" y="296">워크트리 demo-a</text>
<text class="mn path" x="404" y="314">$HOME/orca/workspaces/…/demo-a</text>

<path class="edge" d="M660 300 L712 300"/>
<rect class="box" x="712" y="272" width="224" height="56" rx="4"/>
<text class="kr lbl" x="736" y="296">터미널</text>
<text class="mn path" x="736" y="314">term_50a2… · connected true</text>

<line x1="64" y1="348" x2="936" y2="348" stroke="var(--rule)" stroke-width="1"/>
<text class="kr legend" x="64" y="368">브랜치는 워크트리 이름과 같게 자동 생성됩니다. --agent 를 주지 않아도 터미널 하나가 붙습니다.</text>
</svg>

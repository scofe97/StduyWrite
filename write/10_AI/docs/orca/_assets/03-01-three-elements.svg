<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="tj dj">
<title id="tj">태스크·메시지·게이트가 각각 담당하는 축</title>
<desc id="dj">세 요소가 각각 무엇을·어떻게 주고받는지·언제 멈추는지를 담당하고 식별자 접두가 다름을 보이는 표입니다. 게이트만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12)}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.el{fill:var(--ink);font-size:15px;font-weight:600}
.axis{fill:var(--ink);font-size:13px}
.mn11{fill:var(--muted);font-size:11px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="320" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">TASK · MESSAGE · GATE</text>
<text class="kr h1" x="64" y="76">세 요소가 서로 다른 축을 맡습니다</text>
<text class="kr sub" x="64" y="98">태스크와 메시지를 만들려면 먼저 Run 이 있어야 합니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">요소</text>
<text class="kr col" x="300" y="148">담당하는 축</text>
<text class="kr col" x="600" y="148">식별자</text>
<text class="kr col" x="784" y="148">특이점</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="kr el" x="64" y="196">태스크</text>
<text class="kr axis" x="300" y="196">무엇을</text>
<text class="mn mn11" x="600" y="196">task_&lt;12hex&gt;</text>
<text class="kr note" x="784" y="196">deps 는 JSON 문자열</text>

<text class="kr el" x="64" y="240">메시지</text>
<text class="kr axis" x="300" y="240">어떻게 주고받는지</text>
<text class="mn mn11" x="600" y="240">msg_&lt;12hex&gt;</text>
<text class="kr note" x="784" y="240">타입 8종으로 고정</text>

<rect x="56" y="256" width="888" height="48" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr el" x="64" y="284">게이트</text>
<text class="kr axis" x="300" y="284">언제 멈추는지</text>
<text class="mn mn11" x="600" y="284">gate_&lt;12hex&gt;</text>
<text class="kr note" x="784" y="284">resolve 만 --id 를 씁니다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="th dh">
<title id="th">지시의 네 덩어리와 각각이 막는 사고</title>
<desc id="dh">목표·완료 조건·경계·진행 규칙 네 덩어리를 왼쪽에 두고 각각이 없을 때 생기는 사고를 오른쪽에 짝지은 매핑입니다. 진행 규칙 행만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.blk{fill:var(--ink);font-size:14px;font-weight:600}
.note{fill:var(--muted);font-size:10px}
.bad{fill:var(--bad);font-size:12px}
.hair{stroke:var(--rule);stroke-width:1}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
</style>
<rect width="1000" height="380" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">FOUR BLOCKS</text>
<text class="kr h1" x="64" y="76">지시를 네 덩어리로 나눠 적습니다</text>
<text class="kr sub" x="64" y="98">목표만 갈아 끼우면 다른 작업에 그대로 재사용됩니다.</text>

<line class="hair" x1="64" y1="124" x2="936" y2="124"/>
<text class="kr col" x="64" y="144">덩어리</text>
<text class="kr col" x="536" y="144">빠뜨리면 생기는 일</text>
<line class="hair" x1="64" y1="156" x2="936" y2="156"/>

<text class="kr blk" x="64" y="188">목표</text>
<text class="kr note" x="64" y="206">무엇을 바꿀 것인가</text>
<path class="arrow" d="M456 184 L504 184"/><path class="arrow" d="M496 179 L504 184 L496 189"/>
<text class="kr note" x="536" y="188">대개 이 덩어리만 적고 끝냅니다</text>

<text class="kr blk" x="64" y="240">완료 조건</text>
<text class="kr note" x="64" y="258">무엇으로 확인할 것인가</text>
<path class="arrow" d="M456 236 L504 236"/><path class="arrow" d="M496 231 L504 236 L496 241"/>
<text class="kr bad" x="536" y="240">매번 결과가 다릅니다</text>

<text class="kr blk" x="64" y="292">경계</text>
<text class="kr note" x="64" y="310">건드리지 말 것</text>
<path class="arrow" d="M456 288 L504 288"/><path class="arrow" d="M496 283 L504 288 L496 293"/>
<text class="kr bad" x="536" y="292">시키지 않은 파일이 바뀝니다</text>

<rect x="56" y="316" width="888" height="48" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr blk" x="64" y="340">진행 규칙</text>
<text class="kr note" x="64" y="358">커밋 · 막혔을 때 · 끝났을 때</text>
<path class="arrow" d="M456 340 L504 340"/><path class="arrow" d="M496 335 L504 340 L496 345"/>
<text class="kr bad" x="536" y="340">복구 지점이 없고 완료를 판정할 수 없습니다</text>
<text class="kr note" x="536" y="358">DONE.txt 를 만들게 하는 것이 이 덩어리입니다</text>
</svg>

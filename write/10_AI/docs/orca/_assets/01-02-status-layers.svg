<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 336" role="img" aria-labelledby="t5 d5">
<title id="t5">app·runtime·graph 세 층과 각 층이 준비되지 않았을 때의 증상</title>
<desc id="d5">위에서 아래로 app·runtime·graph 세 층이 순서대로 준비되는 계층 스택이고, 각 층 오른쪽에 그 층이 준비되지 않았을 때 나타나는 증상이 적혀 있습니다. graph 층만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12)}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.idx{fill:var(--soft);font-size:9px;letter-spacing:.1em}
.name{fill:var(--ink);font-size:15px;font-weight:600}
.note{fill:var(--muted);font-size:10px}
.dir{fill:var(--soft);font-size:9px;letter-spacing:.1em}
</style>
<rect width="1000" height="336" fill="var(--paper)"/>
<text class="mn eyebrow" x="120" y="44">READINESS STACK</text>
<text class="kr h1" x="120" y="76">위층부터 순서대로 켜집니다</text>
<text class="kr sub" x="120" y="98">명령이 이상하게 동작하면 어느 층까지 켜졌는지부터 봅니다.</text>

<text class="kr dir" x="64" y="180" transform="rotate(-90 64 180)">준비 순서 ↓</text>

<rect x="120" y="128" width="816" height="60" rx="4" fill="var(--paper2)" stroke="var(--rule)" stroke-width="1"/>
<text class="mn idx" x="144" y="152">L1</text>
<text class="kr name" x="216" y="156">app</text>
<text class="kr note" x="216" y="174">데스크톱 앱 프로세스</text>
<text class="kr note" x="560" y="156">꺼져 있으면 화면이 없습니다</text>
<text class="mn note" x="560" y="174">running: false</text>

<rect x="120" y="192" width="816" height="60" rx="4" fill="var(--paper2)" stroke="var(--rule)" stroke-width="1"/>
<text class="mn idx" x="144" y="216">L2</text>
<text class="kr name" x="216" y="220">runtime</text>
<text class="kr note" x="216" y="238">명령을 받아 처리하는 부분</text>
<text class="kr note" x="560" y="220">거의 모든 명령이 실패합니다</text>
<text class="mn note" x="560" y="238">state: stale_bootstrap</text>

<rect x="120" y="256" width="816" height="60" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn idx" x="144" y="280">L3</text>
<text class="kr name" x="216" y="284">graph</text>
<text class="kr note" x="216" y="302">작업 상태 저장소</text>
<text class="kr note" x="560" y="284">오류 없이 빈 결과를 줍니다</text>
<text class="mn note" x="560" y="302">state: not_running</text>
</svg>

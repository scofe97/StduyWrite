<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" role="img" aria-labelledby="t8 d8">
<title id="t8">브랜치 전환과 워크트리의 차이 — 폴더 하나 대 폴더 여럿</title>
<desc id="d8">위쪽은 폴더 하나의 내용이 브랜치에 따라 바뀌는 git switch 방식, 아래쪽은 저장소 하나를 공유하며 브랜치마다 폴더를 따로 두는 워크트리 방식을 비교한 그림입니다. 아래쪽만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--bad:#F0616D;--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.mode{fill:var(--ink);font-size:14px;font-weight:600}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.lbl{fill:var(--ink);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.limit{fill:var(--bad);font-size:10px}
.edge{stroke:var(--rule);stroke-width:1;fill:none}
</style>
<rect width="1000" height="372" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">SWITCH vs WORKTREE</text>
<text class="kr h1" x="64" y="76">폴더가 하나냐 여럿이냐</text>
<text class="kr sub" x="64" y="98">두 방식 모두 저장소는 하나입니다. 다른 것은 작업 폴더의 개수입니다.</text>

<text class="mn eyebrow" x="64" y="136">git switch</text>
<rect class="box" x="64" y="148" width="248" height="60" rx="4"/>
<text class="kr lbl" x="88" y="172">작업 폴더 1개</text>
<text class="mn note" x="88" y="190">my-app/</text>
<path class="edge" d="M312 178 L392 178"/><path class="edge" d="M384 173 L392 178 L384 183"/>
<rect class="box" x="392" y="148" width="176" height="60" rx="4"/>
<text class="kr lbl" x="416" y="172">내용이 통째로 바뀜</text>
<text class="mn note" x="416" y="190">main ↔ feature/login</text>
<text class="kr limit" x="616" y="168">· 두 브랜치를 나란히 못 봅니다</text>
<text class="kr limit" x="616" y="188">· 빌드 도는 동안 다른 브랜치 편집 불가</text>

<line class="edge" x1="64" y1="232" x2="936" y2="232"/>

<text class="mn eyebrow" x="64" y="264">git worktree</text>
<rect x="56" y="272" width="888" height="76" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<rect class="box" x="72" y="288" width="240" height="44" rx="4"/>
<text class="kr lbl" x="96" y="308">저장소 1개 공유</text>
<text class="mn note" x="96" y="324">.git</text>
<path class="edge" d="M312 300 L392 296"/><path class="edge" d="M384 291 L392 296 L384 301"/>
<path class="edge" d="M312 314 L392 322"/><path class="edge" d="M384 317 L392 322 L384 327"/>
<rect class="box" x="392" y="278" width="248" height="32" rx="4"/>
<text class="mn lbl" x="412" y="299">my-app/  [main]</text>
<rect class="box" x="392" y="316" width="248" height="32" rx="4"/>
<text class="mn lbl" x="412" y="337">demo-a/  [demo-a]</text>
<text class="kr note" x="672" y="300">커밋 이력은 하나로 이어집니다</text>
<text class="kr note" x="672" y="322">폴더가 다르니 에이전트끼리 안 겹칩니다</text>
</svg>

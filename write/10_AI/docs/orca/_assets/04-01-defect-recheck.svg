<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" role="img" aria-labelledby="tw dw">
<title id="tw">원서가 공개한 브라우저 결함 넷의 v1.4.188 재현 여부</title>
<desc id="dw">클릭 결함은 해소되고 쿠키·intercept·스크린샷 셋은 그대로 재현됐음을 네 줄로 비교한 표입니다. 해소된 클릭 행만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.cmd{fill:var(--ink);font-size:12px}
.claim{fill:var(--muted);font-size:11px}
.ok{fill:var(--ok);font-size:12px}
.bad{fill:var(--bad);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="372" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">RE-CHECKED ON v1.4.188</text>
<text class="kr h1" x="64" y="76">원서가 공개한 결함을 다시 밟았습니다</text>
<text class="kr sub" x="64" y="98">넷 중 하나만 고쳐졌습니다. 정오를 공개한 문서라서 확인이 가능했습니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">명령</text>
<text class="kr col" x="280" y="148">원서 서술 (v1.4.176)</text>
<text class="kr col" x="704" y="148">v1.4.188</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<rect x="56" y="176" width="888" height="52" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="mn cmd" x="64" y="200">click</text>
<text class="kr claim" x="280" y="200">성공을 반환하고 이벤트는 미전달</text>
<text class="kr ok" x="704" y="200">해소 — 카운터가 1로 증가</text>
<text class="kr note" x="280" y="218">06장 실습이 그대로는 안 됨</text>

<text class="mn cmd" x="64" y="264">cookie delete</text>
<text class="kr claim" x="280" y="264">이름을 줘도 전부 지운다</text>
<text class="kr bad" x="704" y="264">그대로 — cleared: true</text>

<text class="mn cmd" x="64" y="304">intercept</text>
<text class="kr claim" x="280" y="304">요청을 가로채지 않는다</text>
<text class="kr bad" x="704" y="304">그대로 — 정상 로드</text>

<text class="mn cmd" x="64" y="344">screenshot</text>
<text class="kr claim" x="280" y="344">창이 가려지면 실패한다</text>
<text class="kr bad" x="704" y="344">그대로 — pdf 로 대체</text>
</svg>

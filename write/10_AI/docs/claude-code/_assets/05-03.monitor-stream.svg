<title id="dt">Monitor 도구의 이벤트 스트림 감시와 세션 기상 흐름</title><desc id="dd">백그라운드 명령 stdout을 라인 버퍼링 파이프로 감시하여 매칭 이벤트 발생 시 세션을 깨우는 데이터 흐름</desc>

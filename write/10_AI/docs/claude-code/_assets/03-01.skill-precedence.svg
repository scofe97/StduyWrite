<title id="dt">스킬 우선순위와 네임스페이스 격리</title><desc id="dd">엔터프라이즈 &gt; 개인 &gt; 프로젝트 순서의 이름 충돌 해결과 플러그인 고유 네임스페이스</desc>
<rect width="920" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SKILL PRECEDENCE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스킬 우선순위와 네임스페이스 격리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">동일한 deploy 이름 충돌 시 개인 스킬이 프로젝트 스킬을 덮어씁니다</text>

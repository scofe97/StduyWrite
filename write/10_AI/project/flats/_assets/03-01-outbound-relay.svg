<title id="dt">공개 릴레이 역방향 터널과 오버레이 사설망 트래픽 흐름</title><desc id="dd">인바운드 포트 개방 없이 아웃바운드 세션으로 요청을 중계하거나 가상 IP로 직접 피어링합니다</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DATA FLOW · REVERSE TUNNEL &amp; OVERLAY</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">공개 릴레이 역방향 터널과 오버레이 사설망 트래픽 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">공개: 방문자 ──&gt; 릴레이 ──(아웃바운드)──&gt; 로컬 클라이언트 / 사설: 피어 ──&gt; 100.x.y.z ──&gt; tsnet</text>
<rect x="20" y="100" width="960" height="195" rx="8" fill="rgba(245,245,245,0.02)" stroke="#F08A59" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="36" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">1. 공개 릴레이 역방향 터널 경로 (Public Relay · Reverse Tunnel)</text>
<rect x="20" y="310" width="960" height="195" rx="8" fill="rgba(245,245,245,0.02)" stroke="#6A95D8" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="36" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">2. 오버레이 사설 네트워크 경로 (Private Overlay VPN · Mesh)</text>
<rect x="40" y="140" width="185" height="70" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="54" y="164" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">인터넷 방문자</text>
<text x="54" y="186" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">https://&lt;name&gt;.&lt;relay&gt;</text>
<text x="54" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">누구나 접속 가능 (Public)</text>
<rect x="270" y="140" width="190" height="70" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="285" y="164" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">공개 릴레이 에지</text>
<text x="285" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#F08A59">공용 IP · SNI/TCP 중계 / TLS 종료</text>
<text x="285" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="8.5" font-weight="400" fill="#5E6B7E">중계(Funnel·Portal) / 종료(Cloudflare)</text>
<rect x="525" y="140" width="210" height="70" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="540" y="164" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">호스트 제공자 클라이언트</text>
<text x="540" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">아웃바운드 터널 수납</text>
<text x="540" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">인바운드 포트 개방 없음</text>
<rect x="780" y="140" width="180" height="70" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="795" y="164" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">flat 핸들러</text>
<text x="795" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">siteHandler 직접 호출</text>
<text x="795" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">루프백 포트 경유 없음</text>
<path d="M 225 175 L 270 175" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<path d="M 460 165 L 525 165" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="492" y="155" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#F08A59">요청 중계</text>
<path d="M 525 190 L 460 190" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)" stroke-dasharray="3 3"/>
<text x="492" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="8" font-weight="400" fill="#8B98A9">아웃바운드 연결</text>
<path d="M 735 175 L 780 175" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="757" y="165" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#3FB98C">직접 호출</text>
<rect x="40" y="350" width="185" height="70" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="54" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">허락된 피어 기기</text>
<text x="54" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">인증된 tailnet / NetBird</text>
<text x="54" y="410" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">가상망 내부 접근 (Private)</text>
<rect x="275" y="350" width="190" height="70" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="290" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">가상 오버레이 IP</text>
<text x="290" y="396" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">100.x.y.z (MagicDNS)</text>
<text x="290" y="410" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">CGNAT 100.64.0.0/10 대역</text>
<rect x="515" y="350" width="215" height="70" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="530" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#6A95D8">로컬 피어 노드 (tsnet / NetBird peer)</text>
<text x="530" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">WireGuard 종단 · ACL 검사</text>
<text x="530" y="410" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">직접 UDP 또는 DERP 경유</text>
<rect x="780" y="350" width="180" height="70" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="795" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">flat 핸들러</text>
<text x="795" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">siteHandler 직접 호출</text>
<text x="795" y="410" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">루프백 포트 경유 없음</text>
<path d="M 225 385 L 275 385" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="250" y="375" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">DNS 해석</text>
<path d="M 465 385 L 515 385" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="490" y="375" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#6A95D8">암호화 터널</text>
<path d="M 730 385 L 780 385" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="755" y="375" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#3FB98C">직접 호출</text>
<line x1="12" y1="518" x2="952" y2="518" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="540" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="530" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공개 트래픽 (인터넷 릴레이)</text>
<rect x="352" y="530" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="374" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사설 트래픽 (오버레이 VPN)</text>
<rect x="617" y="530" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="639" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">flat 핸들러 (siteHandler)</text>
</svg>
<title id="dt">flats 신뢰 경계와 권한 격리 구조</title><desc id="dd">운영자 OS 권한 범위와 외부 에이전트·웹페이지 간 방어 경계 및 잔여 한계</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TRUST BOUNDARY · SECURITY MODEL</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">flats 신뢰 경계와 권한 격리 구조</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">계정 없는 아키텍처의 요청 출처와 헤더 기반 방어선입니다</text>
<rect x="40" y="100" width="480" height="370" rx="10" fill="#161B22" stroke="#E3B341" stroke-width="1.4"/>
<text x="60" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">운영자 OS 권한 범위 (Host Scope)</text>
<text x="60" y="146" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">데이터 폴더 접근 · secret.key 열람 · 임의 HTTP 전송 가능</text>
<rect x="60" y="165" width="440" height="75" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="80" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">로컬 프로세스 (Not Enforced)</text>
<text x="80" y="210" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">콘솔 헤더 흉내 가능 · flats.db 직접 열람</text>
<text x="80" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">별도 계정/MFA 없음 → 사람 승인 입증 불가</text>
<rect x="60" y="260" width="440" height="185" rx="8" fill="#0D1117" stroke="#3FB98C" stroke-width="1.4"/>
<text x="80" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">브라우저 콘솔 페이지 (Web Console Scope)</text>
<text x="80" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">동일 출처 제약 (Same-Origin) 강제</text>
<rect x="80" y="330" width="400" height="95" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="96" y="352" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#6A95D8">경로: /console/api/approvals/{id}/approve</text>
<text x="96" y="372" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#3FB98C">헤더: X-Flats-Console: 1</text>
<text x="96" y="392" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#3FB98C">메타: Sec-Fetch-Site: same-origin</text>
<text x="96" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">감사: decided_by (WhoIs 로그인 / 콘솔)</text>
<rect x="560" y="100" width="400" height="105" rx="8" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="580" y="126" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">다른 사이트 웹페이지 (외부 출처)</text>
<text x="580" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">HostGuard: DNS Rebinding 차단</text>
<text x="580" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">CSRF 가드: 교차 출처 거절</text>
<text x="580" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">403 Forbidden · 콘솔 접근 불가</text>
<rect x="560" y="225" width="400" height="115" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="580" y="251" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">에이전트 (MCP · CLI · /api)</text>
<text x="580" y="273" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">승인/거절 엔드포인트 미노출</text>
<text x="580" y="293" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">consoleRequest: X-Flats-Client 거절</text>
<text x="580" y="313" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">요청(pending)만 생성 · 결정 권한 없음</text>
<rect x="560" y="360" width="400" height="110" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.2"/>
<text x="580" y="386" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">권장 완화책: 격리된 에이전트</text>
<text x="580" y="408" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F5F5F3">다른 OS 계정 또는 다른 기계 배치</text>
<text x="580" y="428" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">Tailnet ACL: MCP·/api 만 허용</text>
<text x="580" y="448" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">데이터 폴더 접근 및 콘솔 흉내 차단</text>
<line x1="12" y1="490" x2="952" y2="490" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="512" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="60" y="502" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="82" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">운영자 OS 권한 (미격리 범위)</text>
<rect x="266" y="502" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="288" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">강제된 보호 경계 (Enforced)</text>
<rect x="473" y="502" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="495" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">외부 위협 차단 (Blocked)</text>
<rect x="662" y="502" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="684" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">제한된 에이전트 표면 (Request Only)</text>
</svg>
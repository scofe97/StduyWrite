<title id="dt">동시 활성화 요청의 Compare-And-Swap 충돌 해결</title><desc id="dd">동일 버전을 읽은 두 배포 요청이 경합할 때 한 요청만 행 갱신에 성공하고 다른 요청은 충돌 오류로 롤백되는 시퀀스</desc>
<rect width="960" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">STORE · CONCURRENT DEPLOY CAS RACE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">동시 활성화 요청의 Compare-And-Swap 충돌 해결</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">WHERE live_version=previous 조건으로 갱신 영향 행 수를 검사해 묵시적 덮어쓰기 방지 (잠금·승인 검사 없는 일반론)</text>

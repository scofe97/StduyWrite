<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="요청 파라미터 쿼리 문법 토큰별 해부 도식">
  <title>?color=blue&amp;name=Jane — 쿼리 문법을 토큰마다 읽습니다</title>
  <desc>HTTP 요청 파라미터 쿼리 문법을 토큰별로 해부한다. 물음표는 요청 파라미터 쿼리의 시작을 뜻하고, 각 파라미터는 key=value 형태의 키-값 쌍이며, 앰퍼샌드는 여러 키-값 쌍을 구분한다. 예를 들어 color=blue와 name=Jane 두 파라미터를 물음표로 시작해 앰퍼샌드로 이어 붙인다</desc>
  <rect x="0" y="0" width="760" height="320" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">요청 파라미터 쿼리 — 토큰마다 역할이 있습니다</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">경로 뒤에 ? 로 쿼리를 시작하고, key=value 쌍을 &amp; 로 이어 붙입니다</text>

  <!-- 경로 + 쿼리 칩들 -->
  <text x="70" y="112" fill="rgb(138,133,128)" font-size="15" font-family="monospace">/home</text>

  <rect x="150" y="88" width="26" height="40" rx="6" fill="rgb(212,168,83)"/>
  <text x="163" y="114" fill="#0d0d0d" font-size="17" font-weight="bold" text-anchor="middle" font-family="monospace">?</text>

  <rect x="182" y="88" width="74" height="40" rx="6" fill="#5b9bd5"/>
  <text x="219" y="114" fill="#e8e4df" font-size="14" font-weight="bold" text-anchor="middle" font-family="monospace">color</text>
  <rect x="258" y="88" width="24" height="40" rx="6" fill="#66bb6a"/>
  <text x="270" y="114" fill="#0d0d0d" font-size="16" font-weight="bold" text-anchor="middle" font-family="monospace">=</text>
  <rect x="284" y="88" width="66" height="40" rx="6" fill="#dceaf7"/>
  <text x="317" y="114" fill="#0d0d0d" font-size="14" font-weight="bold" text-anchor="middle" font-family="monospace">blue</text>

  <rect x="356" y="88" width="26" height="40" rx="6" fill="rgb(212,168,83)"/>
  <text x="369" y="114" fill="#0d0d0d" font-size="17" font-weight="bold" text-anchor="middle" font-family="monospace">&amp;</text>

  <rect x="388" y="88" width="66" height="40" rx="6" fill="#5b9bd5"/>
  <text x="421" y="114" fill="#e8e4df" font-size="14" font-weight="bold" text-anchor="middle" font-family="monospace">name</text>
  <rect x="456" y="88" width="24" height="40" rx="6" fill="#66bb6a"/>
  <text x="468" y="114" fill="#0d0d0d" font-size="16" font-weight="bold" text-anchor="middle" font-family="monospace">=</text>
  <rect x="482" y="88" width="70" height="40" rx="6" fill="#dceaf7"/>
  <text x="517" y="114" fill="#0d0d0d" font-size="14" font-weight="bold" text-anchor="middle" font-family="monospace">Jane</text>

  <!-- 해부 라벨 -->
  <line x1="163" y1="132" x2="163" y2="168" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="70" y="186" fill="rgb(212,168,83)" font-size="12" font-weight="bold">?  —  쿼리 시작</text>

  <line x1="219" y1="132" x2="219" y2="204" stroke="#5b9bd5" stroke-width="1.2"/>
  <text x="70" y="222" fill="#5b9bd5" font-size="12" font-weight="bold">key  —  파라미터 이름</text>

  <line x1="317" y1="132" x2="317" y2="240" stroke="#dceaf7" stroke-width="1.2"/>
  <text x="70" y="258" fill="#dceaf7" font-size="12" font-weight="bold">value  —  파라미터 값 (= 뒤)</text>

  <line x1="369" y1="132" x2="369" y2="168" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="560" y="186" fill="rgb(212,168,83)" font-size="12" font-weight="bold">&amp;  —  쌍 구분</text>

  <line x1="468" y1="132" x2="468" y2="204" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="560" y="222" fill="#66bb6a" font-size="12" font-weight="bold">=  —  key와 value 연결</text>

  <text x="24" y="298" fill="#e8e4df" font-size="12" font-weight="bold">→ @RequestParam String color, @RequestParam String name 으로 각 값을 받습니다</text>
  <text x="24" y="316" fill="rgb(138,133,128)" font-size="11">기본은 필수(안 보내면 400) · 선택적으로 만들려면 @RequestParam(required = false)</text>
</svg>

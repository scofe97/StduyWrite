<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="JDBC 추상화와 벤더 드라이버 구현의 분리 도식">
  <title>JDK는 JDBC 추상화만 주고, 구현은 벤더별 드라이버가 제공합니다</title>
  <desc>Java 앱이 관계형 DB에 연결할 때 JDBC를 쓴다. JDK는 java.sql.Connection, Statement, ResultSet 같은 추상화(인터페이스)만 제공하고, 특정 DB 기술의 실제 구현은 주지 않는다. 그 구현은 벤더가 제공하는 JDBC 드라이버가 담당하며, 런타임 의존성으로 추가한다. 앱은 JDK 추상화를 사용하고, 드라이버가 그 추상화를 구현해 특정 DBMS에 연결한다</desc>
  <rect x="0" y="0" width="760" height="380" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">JDBC — 추상화는 JDK, 구현은 벤더 드라이버</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">JDK는 인터페이스만 · 실제 DB에 붙는 구현은 기술 벤더의 JDBC 드라이버(런타임 의존성)가 줍니다</text>

  <!-- App -->
  <rect x="30" y="150" width="130" height="70" rx="6" fill="rgba(212,168,83,0.12)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="95" y="180" fill="rgb(212,168,83)" font-size="12" font-weight="bold" text-anchor="middle">App</text>
  <text x="95" y="200" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">DB에 데이터 영속</text>

  <line x1="160" y1="185" x2="240" y2="185" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#a12)"/>
  <text x="200" y="177" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">Uses</text>

  <!-- JDBC 추상화 (JDK) -->
  <rect x="240" y="110" width="200" height="120" rx="8" fill="rgba(91,155,213,0.12)" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="340" y="136" fill="#5b9bd5" font-size="12" font-weight="bold" text-anchor="middle">JDBC 추상화 (JDK)</text>
  <rect x="258" y="150" width="164" height="64" rx="5" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="270" y="172" fill="#e8e4df" font-size="10" font-family="monospace">java.sql.Connection</text>
  <text x="270" y="190" fill="#e8e4df" font-size="10" font-family="monospace">java.sql.Statement</text>
  <text x="270" y="208" fill="#e8e4df" font-size="10" font-family="monospace">java.sql.ResultSet</text>

  <!-- 드라이버 (벤더) -->
  <line x1="340" y1="290" x2="340" y2="230" stroke="#66bb6a" stroke-width="1.4" marker-end="url(#a12g)"/>
  <text x="350" y="266" fill="#66bb6a" font-size="10">Implements</text>
  <rect x="240" y="292" width="200" height="70" rx="8" fill="rgba(102,187,106,0.12)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="340" y="318" fill="#66bb6a" font-size="12" font-weight="bold" text-anchor="middle">JDBC 드라이버 (벤더)</text>
  <text x="340" y="337" fill="#e8e4df" font-size="10" text-anchor="middle">특정 DB 기술 구현</text>
  <text x="340" y="352" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">런타임 의존성 (MySQL·H2 등)</text>

  <!-- DBMS -->
  <line x1="440" y1="327" x2="560" y2="200" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#a12)"/>
  <text x="512" y="250" fill="rgb(138,133,128)" font-size="10">Connects</text>
  <text x="640" y="150" fill="#e8e4df" font-size="12" font-weight="bold" text-anchor="middle">DBMS</text>
  <ellipse cx="640" cy="180" rx="55" ry="14" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.4"/>
  <path d="M585,180 L585,215 A55,14 0 0 0 695,215 L695,180" fill="none" stroke="rgb(138,133,128)" stroke-width="1.4"/>
  <ellipse cx="640" cy="197" rx="55" ry="14" fill="none" stroke="rgb(138,133,128)" stroke-width="1"/>

  <text x="24" y="378" fill="#5b9bd5" font-size="11" font-weight="bold">→ 같은 추상화 코드로 여러 DB에 붙습니다 · 드라이버만 갈아 끼우면 MySQL·Postgres·Oracle로 전환</text>

  <defs>
    <marker id="a12" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
    <marker id="a12g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#66bb6a"/></marker>
  </defs>
</svg>

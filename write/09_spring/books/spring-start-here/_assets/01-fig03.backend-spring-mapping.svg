<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="백엔드 앱에 매핑된 Spring 프로젝트 6종 도식">
  <title>백엔드 앱을 이루는 Spring 프로젝트 6종</title>
  <desc>클라이언트(웹·모바일) 요청이 백엔드 앱으로 들어오면 IoC 컨테이너·Spring MVC·Spring Security·Spring Boot·Spring Data·Spring Integration이 각각 객체 관리·REST 엔드포인트·인증·설정·DB 접근·메시지 송수신을 맡고, 앱은 데이터베이스·타 백엔드·메시지 브로커와 통신한다</desc>
  <rect x="0" y="0" width="760" height="420" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">백엔드 앱을 이루는 Spring 프로젝트 6종</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">클라이언트 요청을 받아 데이터·통신·보안을 처리하는 각 조각을 Spring이 맡습니다</text>

  <!-- 좌: 클라이언트 -->
  <rect x="24" y="150" width="120" height="120" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.5"/>
  <text x="84" y="196" fill="#e8e4df" font-size="12" font-weight="bold" text-anchor="middle">클라이언트</text>
  <text x="84" y="216" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">웹 · 모바일</text>

  <line x1="144" y1="210" x2="196" y2="210" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#arG)"/>
  <text x="170" y="202" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">요청</text>

  <!-- 중앙: 백엔드 앱 (6역할) -->
  <rect x="200" y="96" width="360" height="256" rx="8" fill="none" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="380" y="120" fill="rgb(212,168,83)" font-size="12" font-weight="bold" text-anchor="middle">백엔드 앱</text>

  <!-- 6개 역할 칩: 밝은 파랑 박스 + 흰 글자 -->
  <rect x="216" y="134" width="160" height="46" rx="5" fill="#5b9bd5" stroke="#5b9bd5"/>
  <text x="296" y="154" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">IoC 컨테이너</text>
  <text x="296" y="171" fill="#e8e4df" font-size="9" text-anchor="middle">객체 생성·관리</text>

  <rect x="384" y="134" width="160" height="46" rx="5" fill="#5b9bd5" stroke="#5b9bd5"/>
  <text x="464" y="154" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">Spring MVC</text>
  <text x="464" y="171" fill="#e8e4df" font-size="9" text-anchor="middle">REST 엔드포인트</text>

  <rect x="216" y="188" width="160" height="46" rx="5" fill="#5b9bd5" stroke="#5b9bd5"/>
  <text x="296" y="208" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">Spring Security</text>
  <text x="296" y="225" fill="#e8e4df" font-size="9" text-anchor="middle">인증·인가</text>

  <rect x="384" y="188" width="160" height="46" rx="5" fill="#5b9bd5" stroke="#5b9bd5"/>
  <text x="464" y="208" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">Spring Boot</text>
  <text x="464" y="225" fill="#e8e4df" font-size="9" text-anchor="middle">설정 간소화</text>

  <rect x="216" y="242" width="160" height="46" rx="5" fill="#5b9bd5" stroke="#5b9bd5"/>
  <text x="296" y="262" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">Spring Data</text>
  <text x="296" y="279" fill="#e8e4df" font-size="9" text-anchor="middle">SQL·NoSQL 접근</text>

  <rect x="384" y="242" width="160" height="46" rx="5" fill="#5b9bd5" stroke="#5b9bd5"/>
  <text x="464" y="262" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">Spring Integration</text>
  <text x="464" y="279" fill="#e8e4df" font-size="9" text-anchor="middle">메시지 송수신</text>

  <text x="380" y="322" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">각 조각은 별도 프로젝트지만 한 앱에서 함께 씁니다</text>

  <line x1="560" y1="210" x2="612" y2="210" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#arG)"/>

  <!-- 우: 외부 시스템 -->
  <rect x="616" y="120" width="120" height="52" rx="6" fill="rgba(102,187,106,0.12)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="676" y="151" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">데이터베이스</text>

  <rect x="616" y="184" width="120" height="52" rx="6" fill="rgba(102,187,106,0.12)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="676" y="207" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">타 백엔드</text>
  <text x="676" y="223" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">REST 호출</text>

  <rect x="616" y="248" width="120" height="52" rx="6" fill="rgba(102,187,106,0.12)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="676" y="271" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">메시지 브로커</text>
  <text x="676" y="287" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">큐 · 토픽</text>

  <text x="24" y="392" fill="rgb(138,133,128)" font-size="11">실무의 일반적인 백엔드 아키텍처가 대체로 이 뼈대 위에 놓입니다</text>

  <defs>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>
</svg>

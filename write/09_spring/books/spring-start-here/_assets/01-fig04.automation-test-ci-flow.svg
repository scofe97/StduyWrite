<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="자동화 테스트 CI 흐름 도식">
  <title>자동화 테스트 앱의 CI 피드백 루프</title>
  <desc>개발팀이 새 테스트를 Git에 push하면 Jenkins가 정기적으로 실행하고, 테스트 하나라도 실패하면 팀에 알려 무엇이 깨졌는지 바로 확인하게 하는 피드백 루프. 시나리오는 Selenium·Cucumber·Gauge로 짜고 IoC 컨테이너·Spring Data·REST 호출에 Spring을 함께 쓴다</desc>
  <rect x="0" y="0" width="760" height="300" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">자동화 테스트 앱의 CI 피드백 루프</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">테스트가 실패하면 Jenkins가 팀에 알려, 개발 중 회귀를 즉시 잡습니다</text>

  <!-- 개발자 -->
  <rect x="24" y="96" width="130" height="72" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.5"/>
  <text x="89" y="128" fill="#e8e4df" font-size="12" font-weight="bold" text-anchor="middle">개발팀</text>
  <text x="89" y="147" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">테스트 추가</text>

  <line x1="154" y1="132" x2="210" y2="132" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#arG4)"/>
  <text x="182" y="124" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">push</text>

  <!-- Git -->
  <rect x="214" y="96" width="130" height="72" rx="6" fill="rgba(212,168,83,0.12)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="279" y="128" fill="#e8e4df" font-size="12" font-weight="bold" text-anchor="middle">Git</text>
  <text x="279" y="147" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">버전 저장소</text>

  <line x1="344" y1="132" x2="400" y2="132" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#arG4)"/>
  <text x="372" y="124" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">trigger</text>

  <!-- Jenkins -->
  <rect x="404" y="96" width="130" height="72" rx="6" fill="#66bb6a" stroke="#66bb6a" stroke-width="2"/>
  <text x="469" y="128" fill="#0d0d0d" font-size="12" font-weight="bold" text-anchor="middle">Jenkins</text>
  <text x="469" y="147" fill="#0d0d0d" font-size="9" text-anchor="middle">CI 도구 · 정기 실행</text>

  <line x1="534" y1="132" x2="590" y2="132" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#arG4)"/>

  <!-- 테스트 결과 -->
  <rect x="594" y="90" width="142" height="84" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.5"/>
  <text x="606" y="114" fill="#66bb6a" font-size="11" text-anchor="start">✓ TEST 1 통과</text>
  <text x="606" y="134" fill="#66bb6a" font-size="11" text-anchor="start">✓ TEST 2 통과</text>
  <text x="606" y="154" fill="#e0736b" font-size="11" text-anchor="start">✗ TEST 3 실패</text>

  <!-- 실패 피드백 루프: Jenkins 결과 -> 개발팀 -->
  <path d="M665,174 L665,244 L89,244 L89,168" fill="none" stroke="#e0736b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arR4)"/>
  <text x="380" y="238" fill="#e0736b" font-size="10" text-anchor="middle">실패 시 팀에 알림 — 무엇이 깨졌는지 바로 확인</text>

  <text x="24" y="288" fill="rgb(138,133,128)" font-size="11">Selenium · Cucumber · Gauge로 시나리오를 짜고, IoC 컨테이너·Spring Data·REST 호출에 Spring을 함께 씁니다</text>

  <defs>
    <marker id="arG4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
    <marker id="arR4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e0736b"/></marker>
  </defs>
</svg>

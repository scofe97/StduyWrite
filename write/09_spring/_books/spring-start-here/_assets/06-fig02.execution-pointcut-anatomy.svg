<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="AspectJ execution pointcut 식 토큰별 해부 도식">
  <title>execution(* services.*.*(..)) — 토큰마다 무엇을 가로챌지 정합니다</title>
  <desc>AspectJ pointcut 식 execution(* services.*.*(..))를 토큰별로 해부한다. execution은 메서드가 호출될 때를 뜻하고, 첫 별표는 반환 타입 무관, services는 대상 패키지, 두 번째 별표는 어느 클래스든, 세 번째 별표는 어느 메서드명이든, (..)는 파라미터 무관을 뜻한다. 종합하면 services 패키지의 모든 메서드를 반환 타입·클래스·메서드명·파라미터와 무관하게 가로챈다는 의미다</desc>
  <rect x="0" y="0" width="760" height="360" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">execution() pointcut 식 — 토큰마다 대상을 좁힙니다</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">복잡해 보이지만 토큰을 하나씩 읽으면 "무엇을 가로챌지"가 그대로 드러납니다</text>

  <!-- 식 본문 (모노 톤 칩들) -->
  <rect x="150" y="88" width="90" height="40" rx="6" fill="rgb(212,168,83)"/>
  <text x="195" y="114" fill="#0d0d0d" font-size="16" font-weight="bold" text-anchor="middle" font-family="monospace">execution</text>
  <text x="248" y="114" fill="#e8e4df" font-size="18" font-weight="bold" font-family="monospace">(</text>

  <rect x="262" y="88" width="28" height="40" rx="6" fill="#5b9bd5"/>
  <text x="276" y="114" fill="#e8e4df" font-size="16" font-weight="bold" text-anchor="middle" font-family="monospace">*</text>

  <rect x="298" y="88" width="90" height="40" rx="6" fill="#66bb6a"/>
  <text x="343" y="114" fill="#0d0d0d" font-size="15" font-weight="bold" text-anchor="middle" font-family="monospace">services</text>
  <text x="390" y="114" fill="#e8e4df" font-size="18" font-weight="bold" font-family="monospace">.</text>

  <rect x="402" y="88" width="28" height="40" rx="6" fill="#5b9bd5"/>
  <text x="416" y="114" fill="#e8e4df" font-size="16" font-weight="bold" text-anchor="middle" font-family="monospace">*</text>
  <text x="432" y="114" fill="#e8e4df" font-size="18" font-weight="bold" font-family="monospace">.</text>

  <rect x="444" y="88" width="28" height="40" rx="6" fill="#5b9bd5"/>
  <text x="458" y="114" fill="#e8e4df" font-size="16" font-weight="bold" text-anchor="middle" font-family="monospace">*</text>

  <rect x="480" y="88" width="56" height="40" rx="6" fill="rgb(212,168,83)"/>
  <text x="508" y="114" fill="#0d0d0d" font-size="15" font-weight="bold" text-anchor="middle" font-family="monospace">(..)</text>
  <text x="538" y="114" fill="#e8e4df" font-size="18" font-weight="bold" font-family="monospace">)</text>

  <!-- 해부 라벨 -->
  <line x1="195" y1="132" x2="195" y2="168" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="60" y="186" fill="rgb(212,168,83)" font-size="12" font-weight="bold">execution(...)</text>
  <text x="60" y="202" fill="rgb(138,133,128)" font-size="11">메서드가 호출될 때</text>

  <line x1="276" y1="132" x2="276" y2="228" stroke="#5b9bd5" stroke-width="1.2"/>
  <text x="60" y="246" fill="#5b9bd5" font-size="12" font-weight="bold">첫 *  —  반환 타입 무관</text>

  <line x1="343" y1="132" x2="343" y2="288" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="60" y="306" fill="#66bb6a" font-size="12" font-weight="bold">services  —  이 패키지 안이면</text>

  <line x1="416" y1="132" x2="416" y2="168" stroke="#5b9bd5" stroke-width="1.2"/>
  <text x="470" y="186" fill="#5b9bd5" font-size="12" font-weight="bold">둘째 *  —  어느 클래스든</text>

  <line x1="458" y1="132" x2="458" y2="228" stroke="#5b9bd5" stroke-width="1.2"/>
  <text x="470" y="246" fill="#5b9bd5" font-size="12" font-weight="bold">셋째 *  —  어느 메서드명이든</text>

  <line x1="508" y1="132" x2="508" y2="288" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="470" y="306" fill="rgb(212,168,83)" font-size="12" font-weight="bold">(..)  —  파라미터 무관</text>

  <text x="24" y="342" fill="#e8e4df" font-size="12" font-weight="bold">→ services 패키지의 모든 메서드를, 반환 타입·클래스·이름·파라미터와 무관하게 가로챕니다</text>
</svg>

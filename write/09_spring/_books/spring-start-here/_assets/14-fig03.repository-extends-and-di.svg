<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="앱 repository가 Spring Data 계약을 확장하고 DI로 주입되는 도식">
  <title>인터페이스로 CrudRepository를 확장하면 Spring Data가 구현을 bean으로 줍니다</title>
  <desc>Spring Data repository를 만드는 방법을 나타낸다. 앱은 AccountRepository 인터페이스를 선언하고 Spring Data의 CrudRepository 계약을 확장한다. CRUD만 필요하면 CrudRepository를 확장한다. 프레임워크가 이 인터페이스를 구현한 bean을 컨텍스트에 등록하므로, TransferService 같은 다른 컴포넌트는 DI로 AccountRepository를 주입받아 쓴다. 개발자는 구현 코드를 쓰지 않는다</desc>
  <rect x="0" y="0" width="760" height="380" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">계약을 확장하면 Spring Data가 구현을 채워 bean으로 줍니다</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">CRUD만 필요하면 CrudRepository 확장 · 정렬·페이징도 필요하면 PagingAndSortingRepository</text>

  <!-- App's logic 경계 -->
  <rect x="24" y="120" width="380" height="200" rx="8" fill="none" stroke="rgb(60,55,50)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="36" y="140" fill="rgb(138,133,128)" font-size="11">App's logic</text>

  <!-- TransferService -->
  <rect x="44" y="200" width="150" height="60" rx="6" fill="rgba(212,168,83,0.12)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="119" y="228" fill="rgb(212,168,83)" font-size="12" font-weight="bold" text-anchor="middle">TransferService</text>
  <text x="119" y="247" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">DI로 주입받아 사용</text>

  <line x1="194" y1="230" x2="250" y2="230" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#a14)"/>
  <text x="222" y="222" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">Uses</text>

  <!-- AccountRepository interface -->
  <rect x="250" y="200" width="140" height="60" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="320" y="226" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">AccountRepository</text>
  <text x="320" y="244" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">«interface»</text>

  <!-- Spring Data 경계 -->
  <rect x="440" y="90" width="300" height="230" rx="8" fill="rgba(102,187,106,0.06)" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="452" y="110" fill="#66bb6a" font-size="11" font-weight="bold">Spring Data</text>

  <rect x="530" y="122" width="180" height="46" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="620" y="143" fill="#e8e4df" font-size="11" font-weight="bold" text-anchor="middle">Repository</text>
  <text x="620" y="159" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">«interface» 마커</text>

  <line x1="620" y1="200" x2="620" y2="170" stroke="rgb(138,133,128)" stroke-width="1.2" marker-end="url(#a14)"/>
  <text x="646" y="188" fill="rgb(138,133,128)" font-size="9">Extends</text>

  <rect x="530" y="202" width="180" height="46" rx="6" fill="rgba(102,187,106,0.12)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="620" y="223" fill="#66bb6a" font-size="11" font-weight="bold" text-anchor="middle">CrudRepository</text>
  <text x="620" y="239" fill="#e8e4df" font-size="9" text-anchor="middle">CRUD 연산 제공</text>

  <line x1="620" y1="282" x2="620" y2="252" stroke="rgb(138,133,128)" stroke-width="1.2" marker-end="url(#a14)"/>
  <text x="646" y="270" fill="rgb(138,133,128)" font-size="9">Extends</text>
  <rect x="530" y="284" width="180" height="30" rx="6" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="620" y="303" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">PagingAndSortingRepository</text>

  <!-- Extends from app to CrudRepository -->
  <line x1="390" y1="225" x2="528" y2="225" stroke="#66bb6a" stroke-width="1.4" marker-end="url(#a14g)"/>
  <text x="455" y="217" fill="#66bb6a" font-size="10" text-anchor="middle">Extends</text>

  <text x="24" y="350" fill="#66bb6a" font-size="12" font-weight="bold">→ 인터페이스만 선언 · Spring Data가 구현 bean을 컨텍스트에 등록 · 다른 컴포넌트는 DI로 주입</text>

  <defs>
    <marker id="a14" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
    <marker id="a14g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#66bb6a"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img" aria-label="purchase 테이블 구조 도식">
  <title>purchase 테이블 — 각 행이 구매 레코드, id는 생성된 기본 키입니다</title>
  <desc>purchase 테이블의 구조를 나타낸다. 세 컬럼은 id, product, price다. id는 자동 증가하는 숫자 기본 키이고, product는 구매한 상품 이름, price는 구매 가격이다. 각 행이 하나의 구매 레코드이며, 예로 Spring Security in Action 25.2, Spring Quickly 20, Debugging Java Apps 22 세 레코드가 있다. 모델 클래스 Purchase의 인스턴스가 이 표의 한 행에 대응한다</desc>
  <rect x="0" y="0" width="760" height="340" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16" font-weight="bold">purchase 테이블 — 각 행이 하나의 구매 레코드</text>
  <text x="24" y="56" fill="rgb(138,133,128)" font-size="12">모델 클래스 Purchase의 인스턴스 하나가 이 표의 한 행에 대응합니다</text>

  <!-- 헤더 행 -->
  <rect x="120" y="90" width="120" height="40" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="180" y="115" fill="#0d0d0d" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">id</text>
  <rect x="240" y="90" width="280" height="40" fill="#5b9bd5" stroke="#5b9bd5"/>
  <text x="380" y="115" fill="#e8e4df" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">product</text>
  <rect x="520" y="90" width="140" height="40" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="590" y="115" fill="#0d0d0d" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">price</text>

  <!-- 데이터 행 1 -->
  <rect x="120" y="130" width="120" height="38" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="180" y="154" fill="#e8e4df" font-size="12" text-anchor="middle" font-family="monospace">1</text>
  <rect x="240" y="130" width="280" height="38" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="256" y="154" fill="#e8e4df" font-size="12" font-family="monospace">Spring Security in Action</text>
  <rect x="520" y="130" width="140" height="38" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="590" y="154" fill="#e8e4df" font-size="12" text-anchor="middle" font-family="monospace">25.2</text>

  <!-- 데이터 행 2 -->
  <rect x="120" y="168" width="120" height="38" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="180" y="192" fill="#e8e4df" font-size="12" text-anchor="middle" font-family="monospace">2</text>
  <rect x="240" y="168" width="280" height="38" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="256" y="192" fill="#e8e4df" font-size="12" font-family="monospace">Spring Quickly</text>
  <rect x="520" y="168" width="140" height="38" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="590" y="192" fill="#e8e4df" font-size="12" text-anchor="middle" font-family="monospace">20</text>

  <!-- 데이터 행 3 -->
  <rect x="120" y="206" width="120" height="38" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="180" y="230" fill="#e8e4df" font-size="12" text-anchor="middle" font-family="monospace">3</text>
  <rect x="240" y="206" width="280" height="38" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="256" y="230" fill="#e8e4df" font-size="12" font-family="monospace">Debugging Java Apps</text>
  <rect x="520" y="206" width="140" height="38" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="590" y="230" fill="#e8e4df" font-size="12" text-anchor="middle" font-family="monospace">22</text>

  <!-- 라벨 -->
  <text x="180" y="272" fill="rgb(212,168,83)" font-size="11" font-weight="bold" text-anchor="middle">↑ 생성된 숫자 PK</text>
  <text x="380" y="272" fill="#5b9bd5" font-size="11" font-weight="bold" text-anchor="middle">↑ 구매한 상품 이름</text>
  <text x="590" y="272" fill="#66bb6a" font-size="11" font-weight="bold" text-anchor="middle">↑ 구매 가격</text>

  <text x="24" y="312" fill="rgb(138,133,128)" font-size="11">id는 DBMS가 자동 증가로 생성하므로 INSERT 시 NULL을 둡니다 · price는 정밀도 때문에 BigDecimal로 매핑</text>
</svg>

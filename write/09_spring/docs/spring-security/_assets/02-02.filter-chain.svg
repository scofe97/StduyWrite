<title id="dt">요청 하나가 필터를 지나며 갈리는 판단</title><desc id="dd">LogoutFilter와 ConcurrentSessionFilter가 요청을 검사해 204, 401, 통과로 분기하는 흐름</desc>
<rect width="880" height="800" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · SESSION FILTER CHAIN</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">요청 하나가 필터를 지나며 갈리는 판단</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Spring Security 필터 체인 순서와 세션 만료 검사 기준</text>

<text x="350" y="530.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">정상</text>
<rect x="215.0" y="536.0" width="250" height="48" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="340" y="556" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">refreshLastRequest()</text>
<text x="340" y="574" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">마지막 요청 시각 갱신</text>

<title id="dt">CSRF 공격 흐름과 이중 제출 쿠키 방어</title><desc id="dd">로그인된 브라우저의 세션 쿠키 자동 전송 악용과 두 겹 방어(SameSite=Lax · X-XSRF-TOKEN 검증)</desc>
<rect width="960" height="988" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · CSRF ATTACK &amp; DEFENSE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">CSRF 공격 흐름과 이중 제출 쿠키 방어</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세션 쿠키 자동 전송 악용 vs 두 겹 방어(SameSite=Lax 쿠키 제외 · X-XSRF-TOKEN 대조 차단)</text>
<rect x="24.0" y="104" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="124.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">사용자 브라우저</text>
<text x="124.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Chrome · 세션 보관</text>

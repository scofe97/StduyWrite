<title id="dt">CSRF 토큰이 쿠키에서 헤더로 돌아오는 길</title><desc id="dd">서버가 XSRF-TOKEN 쿠키를 내려 주고, axios가 그 값을 X-XSRF-TOKEN 헤더로 실어 보내면 서버가 둘을 비교하는 순서</desc>

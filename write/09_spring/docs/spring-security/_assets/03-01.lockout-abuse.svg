<title id="dt">동료 이메일로 다섯 번 틀려 계정을 잠그는 과정</title><desc id="dd">타인 계정으로 연속 5회 로그인 실패 시 계정이 잠겨 정당한 사용자도 차단되는 서비스 거부 흐름</desc>

<rect x="80.0" y="462" width="300" height="52" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="230" y="484" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">onAuthentication</text>
<text x="230" y="502" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">XSRF-TOKEN 교체 · 세션 저장</text>

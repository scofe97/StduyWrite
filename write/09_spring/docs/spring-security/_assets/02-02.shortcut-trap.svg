<rect x="500.0" y="462" width="300" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="650" y="484" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">AuthorizationFilter</text>
<text x="650" y="502" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">공개 API 허용</text>
<path d="M 650 514 L 650 556" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>

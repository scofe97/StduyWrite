<rect x="746" y="260" width="160" height="54" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.2"/>
<text x="826" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Spring Boot</text>
<text x="826" y="302" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">172.18.0.3</text>

<text x="480" y="460" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">헤더를 읽지 않으면 모든 요청이 Nginx IP 로 보임 · 시도 횟수 제한·감사 로그가 사용자를 구분하지 못함</text>

<title id="dt">요청 하나가 보안 필터를 지나는 길</title><desc id="dd">요청이 CSRF 검사, CSRF 쿠키 발급, 개발 환경 임시 인증 주입, URL 인가 규칙을 거쳐 컨트롤러·401·403 중 하나로 가는 흐름</desc>
<rect width="960" height="760" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · SECURITY FILTER CHAIN</text>

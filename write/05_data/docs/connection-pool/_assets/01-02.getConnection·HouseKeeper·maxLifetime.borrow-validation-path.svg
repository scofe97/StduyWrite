<title id="dt">커넥션 대여 경로와 500ms 검증 생략 최적화</title><desc id="dd">getConnection 호출 시 ConcurrentBag 대여, 500ms 경과 여부에 따른 생략 구간, isConnectionDead 검증 및 ProxyConnection 래핑 흐름</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">HIKARICP BORROW PATH · CONNECTION VALIDATION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커넥션 대여 경로와 500ms 검증 생략 최적화</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">500ms 이내 재사용 커넥션의 검증 생략과 비정상 커넥션 즉시 폐기 및 재대여 분기</text>
<rect x="36" y="104" width="160" height="172" rx="8" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="116" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#6A95D8">STEP 1</text>
<text x="116" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">대여 요청 진입</text>
<text x="116" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">ConcurrentBag.borrow</text>
<line x1="48" y1="184" x2="184" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="116" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">getConnection 호출</text>
<text x="116" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스레드 로컬 캐시 탐색</text>
<text x="116" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">공유 목록 CAS 선점</text>
<path d="M 200 190 L 220 190" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="224" y="104" width="160" height="172" rx="8" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="304" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#6A95D8">STEP 2</text>
<text x="304" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">만료 여부 확인</text>

<rect x="412" y="104" width="160" height="172" rx="8" fill="#F08A5918" stroke="#F08A59" stroke-width="1.6"/>
<text x="492" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F08A59">STEP 3</text>
<text x="492" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">생략 윈도우 판정</text>
<text x="492" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">500ms 임계치 대조</text>

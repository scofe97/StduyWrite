<rect x="788" y="104" width="160" height="172" rx="8" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="868" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#3FB98C">STEP 5</text>
<text x="868" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">프록시 래핑 반환</text>
<text x="868" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">ProxyConnection</text>

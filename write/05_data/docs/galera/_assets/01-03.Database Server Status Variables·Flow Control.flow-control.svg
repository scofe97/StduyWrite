<title id="dt">수신 큐 임계값과 흐름 제어 일시 정지 및 재개 순환</title><desc id="dd">저속 노드의 수신 큐 초과로 인한 클러스터 쓰기 중단과 앱플라이어 소화 후 정상화 순서</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">GALERA FLOW CONTROL · FEEDBACK CYCLE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">수신 큐 임계값과 흐름 제어 일시 정지 및 재개 순환</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">gcs.fc_limit 상한 도달 시 PAUSE 전파와 fc_factor 하한 도달 시 RESUME 재개 메커니즘</text>
<rect x="36" y="104" width="160" height="168" rx="8" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="116" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#6A95D8">STEP 1</text>
<text x="116" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">트랜잭션 복제</text>
<text x="116" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">수신 큐 적재</text>
<line x1="48" y1="184" x2="184" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="116" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">쓰기 집합 수신</text>
<text x="116" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">로컬 큐 버퍼링</text>
<text x="116" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 순차 처리</text>
<path d="M 200 188 L 220 188" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="224" y="104" width="160" height="168" rx="8" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>
<text x="304" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#E3B341">STEP 2</text>
<text x="304" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">임계값 초과</text>

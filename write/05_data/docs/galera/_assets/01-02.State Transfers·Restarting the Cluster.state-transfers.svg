<title id="dt">IST 와 SST 의 상태 전송 경로와 Donor 영향</title><desc id="dd">빠진 트랜잭션만 전달하는 증분 전송과 전체 스냅샷 복사 방식의 데이터 흐름 및 잠금 차이</desc>

<title id="dt">전체 정지 뒤 안전한 첫 노드 선정과 부트스트랩 절차</title><desc id="dd">grastate.dat 상태 확인부터 wsrep-recover seqno 복구 및 단일 노드 부트스트랩 순서</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CLUSTER CRASH RECOVERY · BOOTSTRAP WORKFLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">전체 정지 뒤 안전한 첫 노드 선정과 부트스트랩 절차</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">최신 seqno 기반의 단일 노드 부트스트랩과 스플릿 브레인 방지 복구 흐름</text>
<rect x="36" y="104" width="196" height="168" rx="8" fill="#F0616D10" stroke="#F0616D" stroke-width="1.0"/>
<text x="134" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F0616D">STEP 1</text>
<text x="134" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">전체 정지 확인</text>
<text x="134" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Primary 부재</text>
<line x1="48" y1="184" x2="220" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="134" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">모든 노드 정지 확인</text>
<text x="134" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">합류할 Primary 없음</text>
<text x="134" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">수동 부트스트랩 필요</text>
<path d="M 236 188 L 256 188" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="260" y="104" width="196" height="168" rx="8" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="358" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#6A95D8">STEP 2</text>
<text x="358" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">상태 파일 점검</text>
<text x="358" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">grastate.dat 판정</text>
<line x1="272" y1="184" x2="444" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="358" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">safe_to_bootstrap 확인</text>
<text x="358" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">비정상 시 wsrep-recover</text>
<text x="358" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최고 seqno 노드 확정</text>
<path d="M 460 188 L 480 188" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="484" y="104" width="196" height="168" rx="8" fill="#F08A5918" stroke="#F08A59" stroke-width="1.6"/>
<text x="582" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F08A59">STEP 3</text>
<text x="582" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">단일 부트스트랩</text>
<text x="582" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">galera_new_cluster</text>
<line x1="496" y1="184" x2="668" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="582" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최신 노드 1대만 지정</text>
<text x="582" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">새 Primary 생성</text>
<text x="582" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">복수 실행 엄격 금지</text>
<path d="M 684 188 L 704 188" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="708" y="104" width="196" height="168" rx="8" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="806" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#3FB98C">STEP 4</text>
<text x="806" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">나머지 노드 합류</text>
<text x="806" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">일반 시작 명령</text>
<line x1="720" y1="184" x2="892" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="806" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">systemctl start 호출</text>
<text x="806" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">새 Primary 에 연결</text>
<text x="806" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IST 또는 SST 동기화</text>
<rect x="36" y="292" width="888" height="112" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="52" y="306" width="416" height="84" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="72" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">시작점 판정 기준 (grastate.dat)</text>
<text x="72" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">정상 순차 종료: 마지막 종료 노드 safe_to_bootstrap=1</text>
<text x="72" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">비정상 종료: 최대 seqno (-1 이면 wsrep-recover)</text>
<rect x="492" y="306" width="416" height="84" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="512" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">금지: 복수 노드 동시 부트스트랩</text>
<text x="512" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">두 노드에서 동시 실행 시 독립된 Primary Component 생성</text>
<text x="512" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">데이터가 갈라진 두 클러스터(스플릿 브레인)</text>
<line x1="12" y1="428" x2="912" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="450" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="440" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 단계 진행</text>
<rect x="248" y="440" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="270" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">단일 부트스트랩 실행</text>
<rect x="435" y="440" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="457" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">판정 및 상태 점검</text>
<rect x="609" y="440" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="631" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">중단 및 위험 금지</text>
</svg>
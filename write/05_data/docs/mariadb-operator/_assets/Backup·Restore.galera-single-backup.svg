<title id="dt">Galera 단일 노드 백업 원칙과 비복제 테이블 예외 처리</title><desc id="dd">동기 복제 데이터 동일성에 기반한 단일 백업과 MyISAM 및 wsrep 시스템 테이블 예외 제어</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">GALERA CLUSTER · SINGLE NODE BACKUP ARCHITECTURE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Galera 단일 노드 백업 원칙과 비복제 테이블 예외 처리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">노드 하나의 백업이 클러스터 스냅샷이 되는 이유와 Galera 덤프에서 빼는 세 가지</text>
<rect x="28" y="104" width="280" height="168" rx="8" fill="#F08A5918" stroke="#F08A59" stroke-width="1.6"/>
<text x="168" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F08A59">BACKUP TARGET NODE</text>
<text x="168" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">galera-0 (단일 백업 대상)</text>
<text x="168" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">MariaDB 수동 절차 기준</text>
<line x1="40" y1="184" x2="296" y2="184" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="168" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">wsrep_desync=ON 복제 적용 멈춤</text>
<text x="168" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">mariadb-backup 실행</text>
<text x="168" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">OFF 로 되돌린 뒤 IST 로 따라잡기</text>
<rect x="336" y="104" width="280" height="168" rx="8" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="476" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#6A95D8">NORMAL TRAFFIC NODE</text>
<text x="476" y="152" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">galera-1 (서비스 노드)</text>

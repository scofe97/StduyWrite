<rect x="28" y="296" width="904" height="104" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="44" y="310" width="276" height="76" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>

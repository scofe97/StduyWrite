<title id="dt">2단계 커밋 프로토콜과 코디네이터 장애 의심 상태</title><desc id="dd">1단계 준비 질의와 커밋 약속, 2단계 코디네이터 커밋 포인트와 코디네이터 장애 시 참여자가 잠금을 쥔 채 대기하는 의심 상태.</desc>
<rect width="880" height="756" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">08-04 §2 · TWO-PHASE COMMIT &amp; IN-DOUBT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">2단계 커밋 프로토콜과 코디네이터 장애 의심 상태</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">코디네이터의 준비 질의에 참여자가 예라고 답한 후, 코디네이터 장애가 발생하면 참여자는 결정을 알지 못해 의심 상태에 갇힌다.</text>
<rect x="24.0" y="104" width="196" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

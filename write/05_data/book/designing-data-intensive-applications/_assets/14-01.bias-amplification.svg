<rect x="625" y="182" width="210" height="50" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="730.0" y="201" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">출력에서 편향 증폭</text>
<text x="730.0" y="219" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">과거 외삽 · 차별의 코드화</text>
<rect x="625" y="238" width="210" height="50" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="730.0" y="257" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">보호 특성의 간접 재구성</text>
<text x="730.0" y="275" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보호 특성 제거만으로 못 막는 차별</text>
<rect x="35" y="332" width="810" height="64" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="55" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">도덕적 상상력: 오직 사람만 제공</text>
<text x="55" y="370" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">미래가 과거보다 나아지길 원할 때 필요</text>
<text x="55" y="386" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터와 모델은 도구 · 주인이 아님</text>
<path d="M 440.0 332 L 440.0 302" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)" stroke-dasharray="4 3"/>

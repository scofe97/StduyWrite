<title id="dt">대리 변수를 통한 편향 증폭과 도덕적 상상력</title><desc id="dd">과거 차별 데이터가 대리 변수와 머신러닝 추론을 거쳐 편향 증폭된 출력으로 변환되는 데이터 흐름과 사람의 개입.</desc>
<rect width="880" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">14-01 · §2 DATA FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">대리 변수를 통한 편향 증폭과 도덕적 상상력</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">차별적 과거 · 보호 특성과 상관된 변수 · 불투명한 규칙 추론 · 출력에서 편향 증폭 · 도덕적 상상력</text>
<rect x="35" y="96" width="810" height="42" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="440.0" y="113" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">규칙 자체를 데이터에서 추론: 입력의 체계적 편향을 학습·증폭</text>
<text x="440.0" y="129" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">보호 특성과 상관된 변수 · 과거의 외삽 · 사람만 제공하는 도덕적 상상력</text>
<rect x="35" y="148" width="230" height="154" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.0"/>
<rect x="112.0" y="154" width="76.0" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="150.0" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">입력 데이터</text>

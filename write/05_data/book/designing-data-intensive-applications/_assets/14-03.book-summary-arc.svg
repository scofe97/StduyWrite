<title id="dt">14장에서 1장까지 책 전체 종합 체계</title><desc id="dd">1~13장의 기술 주제를 장 묶음으로 쌓고, 맨 위에 차별·착취·감시·프라이버시를 다룬 14장의 윤리적 책임을 둔다.</desc>
<rect width="880" height="566" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">14-03 · §4 BOOK SUMMARY ARC</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">14장에서 1장까지 책 전체 종합 체계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">1~2장 비기능 요구사항 · 3~5장 모델과 저장 · 6~10장 분산과 일관성 · 11~13장 배치와 스트림 · 14장 윤리</text>

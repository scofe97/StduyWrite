<title id="dt">JSON·XML·이진 변형 전체 지도</title><desc id="dd">표준 텍스트 인코딩의 결함에서 출발해 스키마 제약 모델과 필드명을 데이터에 포함하는 이진 변형의 한계까지 세 절의 흐름을 잇는다.</desc>

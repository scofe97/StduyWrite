<title id="dt">운영과 분석은 질문의 모양이 다르다</title><desc id="dd">운영 시스템은 키로 레코드 한 건을 찾아 읽고 쓰고, 분석 시스템은 대량 레코드를 훑어 집계 통계를 낸다. 오른쪽 분석의 대량 집계가 두 접근을 가르는 지점이다.</desc>

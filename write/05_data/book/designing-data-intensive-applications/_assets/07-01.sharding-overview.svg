<title id="dt">단일 리더 복제와 샤딩의 결합 배치</title><desc id="dd">각 노드는 특정 샤드의 리더 역할을 맡으면서 동시에 다른 샤드의 팔로워를 겸하여 내결함성과 수평 확장을 함께 달성한다.</desc>

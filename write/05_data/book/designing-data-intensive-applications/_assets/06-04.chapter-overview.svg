<title id="dt">다중 리더 복제 전체 지도</title><desc id="dd">멀티리전 지리 분산, 복제 토폴로지 통신 구조, sync engine과 local-first의 세 절을 조망한다.</desc>
<rect width="880" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">06-04 · CHAPTER OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">다중 리더 복제 전체 지도</text>

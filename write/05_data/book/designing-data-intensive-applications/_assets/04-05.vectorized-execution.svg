<title id="dt">벡터화 쿼리 실행과 SIMD 비트 연산</title><desc id="dd">컬럼 데이터를 수천 개 단위의 배치로 묶어 사전 정의된 연산자로 넘기고 SIMD 비트 연산으로 행을 걸러 CPU 시간을 절감한다.</desc>
<rect width="880" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">04-05 · VECTORIZED EXECUTION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">벡터화 쿼리 실행과 SIMD 비트 연산</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">컬럼 배치 입력 · 동등 비교 연산자 · SIMD 비트 AND · 일치 행 버퍼</text>
<rect x="24" y="104" width="832" height="74" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="44.5" y="114" width="47.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="68" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">1단계</text>
<text x="118" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">입력 컬럼 벡터 배치 (Vector Batches)</text>
<text x="836" y="128" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#5E6B7E">행 루프 대신 컬럼 값 묶음을 한꺼번에 전달</text>
<line x1="36" y1="140" x2="844" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="40" y="146" width="394" height="24" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="50" y="162" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#6A95D8">product_sk 배치</text>
<text x="424" y="162" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">[ 74, 30, 30, 30, 30, 29, 31, 31 ]</text>
<rect x="446" y="146" width="394" height="24" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="456" y="162" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#6A95D8">store_sk 배치 (·=3 아님)</text>
<text x="830" y="162" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">[  3,  ·,  3,  3,  ·,  ·,  ·,  · ]</text>
<path d="M 237.0 180 L 237.0 192" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<path d="M 643.0 180 L 643.0 192" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="24" y="194" width="832" height="74" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<rect x="44.5" y="204" width="47.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="68" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">2단계</text>
<text x="118" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">벡터 동등 비교 연산자 (Equality Operators)</text>
<text x="836" y="218" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#5E6B7E">각 연산자가 1비트 단위 결과 비트맵 배치 생성</text>

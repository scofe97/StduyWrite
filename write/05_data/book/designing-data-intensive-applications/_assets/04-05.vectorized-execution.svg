<text x="424" y="252" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">비트맵 A: [ 0, 1, 1, 1, 1, 0, 0, 0 ]</text>
<rect x="446" y="236" width="394" height="24" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="456" y="252" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#F08A59">연산자 == 3</text>
<text x="830" y="252" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">비트맵 B: [ 1, 0, 1, 1, 0, 0, 0, 0 ]</text>

<path d="M 643.0 270 L 643.0 276 L 480.0 276 L 480.0 282" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#soft)"/>
<rect x="24" y="284" width="832" height="114" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.4"/>
<rect x="44.5" y="294" width="47.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="68" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">3단계</text>
<text x="118" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">SIMD 비트 AND 연산 및 조건 일치 행 확정</text>
<text x="836" y="308" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#3FB98C">SIMD 로 여러 비트를 한꺼번에 AND</text>
<line x1="36" y1="320" x2="844" y2="320" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="40" y="328" width="800" height="28" rx="4" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.0"/>
<text x="50" y="346" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#3FB98C">bitwise AND 결과</text>
<text x="440.0" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">[ 0, 0, 1, 1, 0, 0, 0, 0 ]</text>
<text x="828" y="346" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">셋째 · 넷째 값 일치</text>
<rect x="40" y="362" width="800" height="26" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="50" y="379" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">CPU 효율 핵심</text>
<text x="164" y="379" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">순차 메모리 접근 (캐시 미스↓)</text>

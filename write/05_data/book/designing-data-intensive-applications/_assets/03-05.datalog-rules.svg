<rect x="280" y="168" width="320" height="48" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="440" y="190" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">migrated("Lucy", "United States", "Europe")</text>
<text x="440" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">파생 가상 뷰 · 규칙 3</text>
<line x1="440" y1="216" x2="440" y2="238" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<line x1="99" y1="238" x2="719" y2="238" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<line x1="99" y1="238" x2="99" y2="256" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>
<line x1="248" y1="238" x2="248" y2="256" stroke="rgba(191,192,192,0.22)" stroke-width="1.2"/>

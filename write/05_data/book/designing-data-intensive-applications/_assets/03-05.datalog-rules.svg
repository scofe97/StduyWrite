<title id="dt">Datalog 규칙과 사실의 파생 트리</title><desc id="dd">기본 사실(fact)에서 출발해 재귀 규칙으로 가상 뷰를 합성하고 최종 질의 목표를 도출하는 구조</desc>
<rect width="880" height="504" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">03-05 · DATALOG DERIVATION TREE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Datalog 규칙과 사실의 파생 트리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">하단의 기본 사실들이 규칙 1·2를 통해 재귀 집합으로 합성되고, 규칙 3·4를 거쳐 최종 결과를 도출합니다.</text>
<rect x="340" y="96" width="200" height="48" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.4"/>
<text x="440" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">us_to_europe("Lucy")</text>
<text x="440" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">최종 질의 목표 · 규칙 4</text>

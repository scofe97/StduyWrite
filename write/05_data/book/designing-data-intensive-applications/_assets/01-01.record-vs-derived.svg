<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원본은 기록 시스템, 파생 데이터는 다시 만들 수 있는 사본</text>

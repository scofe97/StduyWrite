<title id="dt">기록 시스템과 파생 데이터</title><desc id="dd">기록 시스템에서 파이프라인을 거쳐 파생 데이터가 만들어지고, 파생 데이터는 잃어도 같은 경로로 원본에서 다시 만들 수 있다. 재생성 경로가 핵심 논점이다.</desc>
<rect width="880" height="476" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">01-01 · RECORD VS DERIVED</text>

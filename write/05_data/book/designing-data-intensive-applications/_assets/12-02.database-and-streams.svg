<title id="dt">CDC 기반 데이터베이스와 파생 시스템 동기화 흐름</title><desc id="dd">데이터베이스 복제 로그를 스트림으로 추출해 검색 인덱스·캐시·DW에 동일 순서로 동기화한다.</desc>

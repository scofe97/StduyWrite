<title id="dt">누가 만들고 누가 운영하는가</title><desc id="dd">맞춤 제작에서 클라우드 서비스까지 만드는 쪽과 운영하는 쪽이 사내에서 벤더로 옮겨 간다. 가운데 기성품 셀프 호스팅이 직접 배포하는 중간 지점이다.</desc>

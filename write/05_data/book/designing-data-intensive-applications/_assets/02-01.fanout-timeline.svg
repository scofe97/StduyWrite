<title id="dt">한 게시가 팔로워 타임라인으로 퍼지는 fan-out</title><desc id="dd">게시 한 건이 팔로워 수만큼의 타임라인 쓰기로 늘어난다. 초당 5,800 게시에 fan-out 계수 200이면 초당 100만 건이 넘는 쓰기가 된다.</desc>
<rect width="880" height="548" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">02-01 · FAN-OUT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 게시가 팔로워 타임라인으로 퍼지는 fan-out</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">게시 시점에 팔로워별 타임라인에 미리 배달</text>
<rect x="16" y="196" width="208" height="72" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="120" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">사용자 게시</text>
<text x="120" y="252" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">5,800 게시/초</text>
<rect x="304" y="196" width="176" height="72" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="392" y="228" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="600" fill="#F08A59">fan-out</text>
<text x="392" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">계수 200</text>
<path d="M 228 232 L 300 232" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="480" y1="232" x2="548" y2="232" stroke="#8B98A9" stroke-width="1.6"/>
<line x1="548" y1="144" x2="548" y2="320" stroke="#8B98A9" stroke-width="1.6"/>
<rect x="600" y="116" width="264" height="56" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="732" y="149" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#F5F5F3">팔로워 1 타임라인</text>
<path d="M 548 144 L 596 144" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="600" y="196" width="264" height="56" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="732" y="229" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#F5F5F3">팔로워 2 타임라인</text>
<path d="M 548 224 L 596 224" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="600" y="292" width="264" height="56" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="732" y="325" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#F5F5F3">팔로워 200 타임라인</text>
<path d="M 548 320 L 596 320" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="732" y="276" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="16" font-weight="400" fill="#8B98A9">⋯</text>
<rect x="16" y="392" width="416" height="72" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="224" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">fan-out 쓰기</text>
<text x="224" y="446" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">5,800 × 200 = 100만+ /초</text>
<rect x="448" y="392" width="416" height="72" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="656" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">폴링 조회 (비교)</text>
<text x="656" y="446" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">4억 /초</text>
<line x1="12" y1="492" x2="832" y2="492" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="514" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="504" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핵심 — fan-out</text>
<rect x="300" y="504" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="322" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저장되는 데이터</text>
</svg>
<title id="dt">동기 vs 비동기 vs 반동기 복제 시퀀스</title><desc id="dd">리더는 동기 팔로워의 확인 응답을 받은 뒤 클라이언트에 성공을 확정 통보하지만, 비동기 팔로워에는 확인 대기 없이 변경을 보내 지연이 발생할 수 있다.</desc>
<rect width="880" height="572" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">06-01 · §2 SEQUENCE</text>

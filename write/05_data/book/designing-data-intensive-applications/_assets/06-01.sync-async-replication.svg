<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">클라이언트 갱신 요청 · 동기 확인 대기 · 성공 확정 통보 · 비동기 지연 전파</text>

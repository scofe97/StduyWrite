<title id="dt">read-scaling 아키텍처와 복제 지연</title><desc id="dd">쓰기 집중 처리와 비동기 팔로워 분산 읽기 환경에서 복제 지연으로 인한 낡은 데이터 반환 구조</desc>
<rect width="880" height="506" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">06-03 · §1 READ-SCALING ARCHITECTURE</text>

<title id="dt">온라인 · 배치 · 스트림 처리 시스템 비교</title><desc id="dd">데이터 처리 시스템의 세 패러다임을 상호작용 방식, 핵심 지표, 입출력 특성, 결함 내성 기준으로 대조한다. 배치의 불변 입력과 재실행 가능성이 핵심 논점이다.</desc>
<rect width="880" height="524" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">11-01 · §1 PROCESSING PARADIGMS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">온라인 · 배치 · 스트림 처리 시스템 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">대화형 vs 일괄 계산 vs 무한 스트림 · 응답 시간 vs 처리량 vs 지연 · 불변 입력과 인간 결함 내성</text>

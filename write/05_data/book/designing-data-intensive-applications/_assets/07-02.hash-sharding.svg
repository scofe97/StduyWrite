<title id="dt">해시 함수를 통한 파티션 키의 균등 분산</title><desc id="dd">유사한 문자열 파티션 키라도 해시 함수를 거쳐 0부터 2³²−1 공간에 균등하게 분포하며, 샤딩에는 프로세스 독립적인 해시 함수를 사용한다.</desc>
<rect width="880" height="498" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">07-02 · §1 DATA FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">해시 함수를 통한 파티션 키의 균등 분산</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">문자열 키 입력 · 32비트 균등 분포 · 샤딩 적합 해시(MD5·Murmur3) vs 부적합(hashCode)</text>
<rect x="28" y="104" width="824" height="34" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="440.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">비슷한 입력도 전혀 다른 위치로 · 같은 키는 어느 프로세스에서든 같은 값</text>
<rect x="28" y="150" width="216" height="264" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="81.0" y="160" width="110.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="136.0" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">입력 파티션 키</text>
<text x="136.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">문자열 키</text>
<line x1="40" y1="202" x2="232" y2="202" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="42" y="226" width="188" height="72" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="136.0" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">아주 비슷한 문자열</text>
<text x="136.0" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">편향된 입력</text>
<rect x="42" y="318" width="188" height="72" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="136.0" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">같은 키</text>
<text x="136.0" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">어느 프로세스에서든</text>
<rect x="268" y="150" width="300" height="264" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="363.0" y="160" width="110.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="418.0" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">해시 함수 엔진</text>
<text x="418.0" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">알고리즘별 샤딩 적합성 비교</text>
<line x1="280" y1="202" x2="556" y2="202" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="282" y="214" width="272" height="92" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.2"/>
<text x="418.0" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">샤딩 적합 해시 함수</text>
<text x="418.0" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">MD5 (MongoDB) · Murmur3</text>
<text x="418.0" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">암호학적 강도 불필요</text>
<rect x="282" y="316" width="272" height="86" rx="6" fill="#F0616D18" stroke="#F0616D" stroke-width="1.2"/>
<text x="418.0" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">샤딩 부적합 해시 함수</text>
<text x="418.0" y="358" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">Object.hashCode() · Object#hash</text>
<text x="418.0" y="376" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Java · Ruby · 프로세스마다 다른 값</text>
<text x="418.0" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">샤딩에 쓸 수 없음</text>
<rect x="592" y="150" width="260" height="264" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="637.0" y="160" width="170.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="722.0" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">32비트 균등 해시 공간</text>
<text x="722.0" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0 ~ 2³²−1 (0 ~ 4,294,967,295)</text>
<line x1="604" y1="202" x2="840" y2="202" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="606" y="226" width="232" height="72" rx="6" fill="#6A95D816" stroke="#6A95D8" stroke-width="1.0"/>
<text x="722.0" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">고르게 분포한 출력</text>
<text x="722.0" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">전혀 다른 위치에 떨어짐</text>
<rect x="606" y="318" width="232" height="72" rx="6" fill="#6A95D816" stroke="#6A95D8" stroke-width="1.0"/>
<text x="722.0" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">같은 해시값</text>
<text x="722.0" y="368" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">같은 입력 → 같은 출력</text>
<path d="M 244 260 L 282 260" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 554 260 L 592 260" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<line x1="12" y1="442" x2="832" y2="442" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="464" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

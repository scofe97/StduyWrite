<title id="dt">2장의 비기능 요구사항 넷</title><desc id="dd">2장은 성능·확장성·신뢰성·유지보수성을 다뤘다. 유지보수성은 운영성·단순성·발전성으로 나뉘고, 공통 해법은 잘 이해된 빌딩 블록이다.</desc>

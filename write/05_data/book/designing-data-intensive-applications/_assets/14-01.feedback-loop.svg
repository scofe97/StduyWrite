<title id="dt">신용 점수 하향 나선과 시스템 사고</title><desc id="dd">예측 분석이 개인의 행동과 삶을 제약하고 다시 악화된 입력으로 되먹임되는 자기강화 하향 나선과 시스템 사고.</desc>
<rect width="840" height="464" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">14-01 · §4 FEEDBACK LOOP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">신용 점수 하향 나선과 시스템 사고</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">통제 밖 불운 · 신용 점수 하락 · 구직 어려움 · 실직과 빈곤 · 점수 추가 하락 · 시스템 사고</text>
<rect x="24" y="96" width="792" height="42" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="420.0" y="113" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">자기강화 피드백 루프: 예측이 바꾼 행동이 다시 예측의 입력</text>
<text x="420.0" y="129" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">수학적 엄밀함의 위장 뒤 독성 가정 · 사람까지 포함한 전체 시스템</text>
<rect x="24" y="154" width="430" height="236" rx="6" fill="#F0616D10" stroke="#F0616D" stroke-width="1.2"/>
<rect x="90.0" y="160" width="298.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="239.0" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">자기강화 하향 나선 (신용 점수 → 채용 예시)</text>
<rect x="44" y="194" width="160" height="50" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="124.0" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">1. 통제 밖의 불운</text>
<text x="124.0" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재정 곤란 · 청구서 연체</text>
<rect x="264" y="194" width="160" height="50" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="344.0" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">2. 신용 점수 하락</text>
<text x="344.0" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">연체가 점수에 반영</text>
<rect x="264" y="286" width="160" height="50" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="344.0" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">3. 구직 어려움</text>
<text x="344.0" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">고용주의 신용 점수 평가</text>
<rect x="44" y="286" width="160" height="50" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="124.0" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">4. 실직과 빈곤</text>
<text x="124.0" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실직이 빈곤으로</text>
<path d="M 204 219.0 L 264 219.0" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="234.0" y="211.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">연체</text>
<path d="M 344.0 244 L 344.0 286" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="380.0" y="269.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">채용 평가</text>
<path d="M 344.0 336 L 344.0 352 L 124.0 352 L 124.0 342" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="234.0" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">실직</text>
<path d="M 204 311.0 L 234 311.0 L 234 234 L 258 234" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)" stroke-dasharray="4 3"/>
<text x="226" y="269.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">점수 추가 하락</text>
<rect x="474" y="154" width="342" height="236" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="573.0" y="160" width="144.0" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="645.0" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">시스템 사고 관점 대비</text>
<rect x="488" y="192" width="314" height="66" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<rect x="597.0" y="194" width="96.0" height="20" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="645.0" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">전산화된 부분만</text>
<text x="502" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">상호작용하는 사람은 시야 밖</text>
<text x="502" y="244" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">예측이 바꾼 사람 행동 누락</text>
<path d="M 645.0 258 L 645.0 278" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<text x="681.0" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">관점 전환</text>
<rect x="488" y="278" width="314" height="92" rx="4" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<rect x="503.5" y="284" width="283.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="645.0" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">시스템 사고 (systems thinking)</text>
<text x="502" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">상호작용하는 사람까지 전체 시스템</text>
<text x="502" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">기존 격차를 강화·증폭하는지 점검</text>
<text x="502" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">많은 결과 사전 예측 (항상은 아님)</text>
<line x1="12" y1="412" x2="792" y2="412" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="434" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="424" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">불운·점수 하락</text>
<rect x="248" y="424" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="270" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">구직·빈곤 악순환 (focal)</text>
<rect x="513" y="424" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="535" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전산화된 부분만</text>
<rect x="661" y="424" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="683" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전체 시스템 사고</text>
</svg>
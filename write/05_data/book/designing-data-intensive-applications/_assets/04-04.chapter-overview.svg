<title id="dt">보조 인덱스와 인메모리 저장 전체 지도</title><desc id="dd">기본키 외 컬럼 검색을 위한 보조 인덱스에서 인덱스 리프의 값 저장 방식, 그리고 디스크 제약을 넘어선 인메모리 엔진으로의 확장 흐름을 조망한다.</desc>

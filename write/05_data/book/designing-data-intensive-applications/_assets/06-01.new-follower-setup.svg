<title id="dt">다운타임 없는 신규 팔로워 셋업 프로세스</title><desc id="dd">클라이언트 쓰기를 중단하지 않고, 리더의 잠금 없는 일관 스냅샷을 복사한 뒤 복제 로그 위치(LSN·GTID) 이후의 변경분을 요청·적용하여 팔로워를 따라잡는다.</desc>
<rect width="880" height="524" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">06-01 · §4 PROCESS</text>

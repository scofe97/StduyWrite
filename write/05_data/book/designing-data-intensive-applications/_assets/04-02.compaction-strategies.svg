<title id="dt">size-tiered와 leveled compaction 구조 비교</title><desc id="dd">size-tiered는 소형 세그먼트를 대형 세그먼트로 누적 병합하고, leveled는 고정 크기 세그먼트를 레벨별 키 범위로 분할 관리한다.</desc>
<rect width="880" height="572" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">04-02 · §4 COMPACTION STRATEGIES</text>

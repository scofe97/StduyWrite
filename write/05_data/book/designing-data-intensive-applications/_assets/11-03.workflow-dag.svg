<title id="dt">잡 간 DAG 의존성과 워크플로우 오케스트레이션</title><desc id="dd">단일 잡 자원 배분과 분리하여, 워크플로우 스케줄러가 여러 잡 사이의 산출물 의존성 DAG를 정의하고 선행 잡 완료를 검증해 후속 잡을 순서대로 실행한다.</desc>

<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">선행 잡 산출물 의존성 · Airflow/Dagster DAG 제어 · 이기종 도구 데이터 파이프라인 · YARN/K8s 잡 스케줄러와의 역할 분담</text>
<rect x="24" y="102" width="832" height="64" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>

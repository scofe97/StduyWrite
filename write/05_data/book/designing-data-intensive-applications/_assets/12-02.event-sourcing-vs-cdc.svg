<text x="144" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">UPDATE · DELETE 직접 허용</text>
<rect x="456" y="436" width="386" height="48" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="459.0" y="450.0" width="98.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="508" y="464.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">상태 갱신 방식</text>
<text x="562" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">Append-only 불변 로그 (업데이트·삭제 권장 안 함)</text>
<rect x="28" y="504" width="824" height="52" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="440.0" y="526" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">기존 뮤터블 DB에 최소 침습 적용 (CDC)  vs  초기 설계부터 적용, 더 풍부한 이력 (이벤트 소싱)</text>
<text x="440.0" y="544" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">목적이 다른 두 방식 · 어느 쪽이 낫다고 일반화하기 어려움</text>
<line x1="12" y1="576" x2="832" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

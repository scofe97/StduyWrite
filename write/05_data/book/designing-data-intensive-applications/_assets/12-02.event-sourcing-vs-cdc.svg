<title id="dt">CDC와 이벤트 소싱의 아키텍처 비교</title><desc id="dd">데이터베이스 변경을 스트림으로 다루는 두 접근 방식의 추상화 계층과 상태 모델 대비.</desc>
<rect width="880" height="628" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">12-02 · §4 EVENT SOURCING VS CDC</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">CDC와 이벤트 소싱의 아키텍처 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저수준 물리 변경 vs 고수준 도메인 의도 · 최소 침습 도입 vs 전면 설계 · 로그 컴팩션 가능 여부</text>
<rect x="28" y="104" width="824" height="36" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="440.0" y="127" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">비교 핵심: CDC는 DB 변경을 캡처하고, 이벤트 소싱은 애플리케이션 수준에서 불변 이벤트를 설계</text>
<rect x="28" y="152" width="406" height="340" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<rect x="43.5" y="162" width="41.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="64" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">저수준</text>
<text x="98" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">CDC (변경 데이터 캡처)</text>
<line x1="38" y1="190" x2="424" y2="190" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="231.0" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기존 뮤터블 DB에 최소 침습으로 파생 동기화</text>
<rect x="446" y="152" width="406" height="340" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<rect x="461.5" y="162" width="41.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="482" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">고수준</text>
<text x="516" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">이벤트 소싱 (Event Sourcing)</text>
<line x1="456" y1="190" x2="842" y2="190" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="649.0" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">사용자 의도를 불변 이벤트로 기록하고 상태 재생</text>
<rect x="38" y="220" width="386" height="48" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="52.0" y="234.0" width="76.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="90" y="248.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">추상화 수준</text>
<text x="144" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">저수준 스토리지 변경 (DB 물리 쓰기 반영)</text>
<rect x="456" y="220" width="386" height="48" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="470.0" y="234.0" width="76.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="508" y="248.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">추상화 수준</text>
<text x="562" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">고수준 애플리케이션 (사용자 비즈니스 의도)</text>

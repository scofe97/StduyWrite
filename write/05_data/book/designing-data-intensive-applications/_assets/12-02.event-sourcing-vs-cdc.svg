<rect x="456" y="274" width="386" height="48" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="470.0" y="288.0" width="76.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="508" y="302.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">이벤트 의미</text>
<text x="562" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">도메인 액션: "사용자가 Y를 주문함"</text>
<rect x="38" y="328" width="386" height="48" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="41.0" y="342.0" width="98.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="90" y="356.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">기존 DB 도입</text>
<text x="144" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">최소 침습적 연동 (기존 뮤터블 DB 유지)</text>
<rect x="456" y="328" width="386" height="48" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="459.0" y="342.0" width="98.0" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="508" y="356.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">기존 DB 도입</text>
<text x="562" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">전면 재설계 (설계 초기부터 이벤트 기반 구축)</text>
<rect x="38" y="382" width="386" height="48" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="52.0" y="396.0" width="76.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="90" y="410.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">로그 컴팩션</text>
<text x="144" y="410" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">키별 최신값 보존 컴팩션 가능</text>
<rect x="456" y="382" width="386" height="48" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.7"/>
<rect x="470.0" y="396.0" width="76.0" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="508" y="410.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">로그 컴팩션</text>
<text x="562" y="410" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">전체 이력 필요 (같은 방식 컴팩션 불가)</text>

<title id="dt">관계형과 문서 모델의 상호 기능 흡수와 수렴</title><desc id="dd">관계형은 JSON 과 속성 인덱싱을 더하고, 문서는 조인과 보조 인덱스를 더하며 관계형-문서 하이브리드로 수렴한다.</desc>
<rect width="880" height="562" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">03-04 · CONVERGENCE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">관계형과 문서 모델의 상호 기능 흡수와 수렴</text>

<title id="dt">에포크 번호와 2라운드 쿼럼 투표 체계</title><desc id="dd">단조 증가 에포크 번호로 리더 유일성을 보장하고, 선거 쿼럼과 복제 쿼럼의 교집합으로 커밋 일관성을 지킨다.</desc>
<rect width="880" height="510" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">10-04 · §2 EPOCH AND TWO-ROUND QUORUM VOTING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">에포크 번호와 2라운드 쿼럼 투표 체계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">단조 증가 에포크(term) · 1라운드 리더 선출 쿼럼 · 2라운드 로그 항목 복제 쿼럼 · 쿼럼 교집합 안전성</text>
<rect x="24" y="102" width="406" height="246" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="33.129999999999995" y="114" width="57.74" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="62" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">Round 1</text>
<text x="254" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">리더 선출 (선거 쿼럼)</text>
<line x1="36" y1="144" x2="418" y2="144" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="227.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">후보 노드가 에포크(term e+1)로 투표 요청</text>
<rect x="40" y="170" width="116" height="56" rx="4" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.0"/>
<text x="98" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">Node 1 (후보)</text>
<text x="98" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">term e+1 제안</text>
<rect x="168" y="170" width="116" height="56" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="226" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">Node 2 (팔로워)</text>
<text x="226" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">투표 찬성 (✓ vote)</text>
<rect x="296" y="170" width="116" height="56" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="354" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">Node 3 (팔로워)</text>
<text x="354" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">미응답 또는 지연</text>
<path d="M 156 186 L 168 186" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)"/>
<path d="M 168 202 L 156 202" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<path d="M 284 194 L 296 194" fill="none" stroke="#8B98A9" stroke-width="1.0" marker-end="url(#ar)" stroke-dasharray="2 2"/>
<rect x="40" y="242" width="372" height="44" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="226" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">선거 쿼럼: {Node 1, Node 2} (과반수 2/3 달성)</text>
<text x="226" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">Node 1 리더 승격 · 에포크 e+1 단독 리더십 확립</text>
<text x="226" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Raft 규칙: 후보 로그가 자신보다 오래되면 투표 거부</text>
<text x="226" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Paxos 규칙: 리더 선출 후 이전 미완성 제안 동기화</text>
<rect x="450" y="102" width="406" height="246" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="459.13" y="114" width="57.74" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="488" y="128" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">Round 2</text>
<text x="680" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">로그 복제 (커밋 쿼럼)</text>
<line x1="462" y1="144" x2="844" y2="144" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="653.0" y="160" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">리더가 명령 수신 후 과반수 복제 시 커밋</text>
<rect x="466" y="170" width="116" height="56" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="524" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">Node 1 (리더)</text>
<text x="524" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">[cmd] 항목 복제</text>
<rect x="594" y="170" width="116" height="56" rx="4" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="652" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">Node 2 (팔로워)</text>
<text x="652" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">복제 확인 (✓ ack)</text>
<rect x="722" y="170" width="116" height="56" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="780" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">Node 3 (팔로워)</text>
<text x="780" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">네트워크 단절</text>
<path d="M 582 186 L 594 186" fill="none" stroke="#F08A59" stroke-width="1.2" marker-end="url(#acc)"/>
<path d="M 594 202 L 582 202" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<path d="M 710 194 L 722 194" fill="none" stroke="#8B98A9" stroke-width="1.0" marker-end="url(#ar)" stroke-dasharray="2 2"/>
<rect x="466" y="242" width="372" height="44" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="652" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">복제 쿼럼: {Node 1, Node 2} (과반수 2/3 달성)</text>
<text x="652" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">[cmd] 항목 커밋 확정 · 팔로워 상태 머신 반영</text>
<text x="652" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">과반수 응답 전에는 미커밋 유지로 안전 확보</text>
<text x="652" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">선형화 읽기: 리더가 아직 최신인지 쿼럼 확인 후 응답</text>
<rect x="24" y="362" width="832" height="74" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="440" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">안전성의 핵심: 쿼럼 교집합 보장 (Quorum Overlap)</text>
<text x="440" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">선거 쿼럼 Q1 ∩ 복제 쿼럼 Q2 ≥ 1개 노드 (과반수끼리는 반드시 겹침)</text>
<text x="440" y="422" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">새 리더 선출 시 쿼럼 노드 중 최소 하나는 직전 커밋 로그 보유 → 커밋 소실 방지</text>
<line x1="12" y1="454" x2="832" y2="454" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="476" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="466" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">쿼럼 교집합 안전성 (focal)</text>
<rect x="378" y="466" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="400" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">선거 쿼럼 투표</text>
<rect x="526" y="466" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="548" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">복제 쿼럼 커밋</text>
<rect x="674" y="466" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="696" y="476" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">단절·미응답 노드</text>
</svg>
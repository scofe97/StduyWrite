<title id="dt">B-tree와 LSM 읽기·쓰기 동작 비교</title><desc id="dd">읽기 예측성과 범위 쿼리는 B-tree가 우수하고, 순차 쓰기 처리량과 SSD 마모 완화는 LSM이 우수하다.</desc>
<rect width="880" height="496" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">04-03 · READ AND WRITE COMPARISON</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">B-tree와 LSM 읽기·쓰기 동작 비교</text>

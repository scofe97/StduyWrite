<title id="dt">분산을 쓰는 이유와 그 대가</title><desc id="dd">분산에는 아홉 가지 이유가 있지만 부분 실패 같은 대가가 따르므로, 단일 머신으로 유지할 수 있다면 분산을 서두르지 않는 쪽이 책의 권고다. 단일 노드 상자가 핵심 논점이다.</desc>

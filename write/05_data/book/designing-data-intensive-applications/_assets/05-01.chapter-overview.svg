<title id="dt">인코딩과 호환성 기초 전체 지도</title><desc id="dd">롤링 업그레이드로 인한 공존 환경에서 두 데이터 표현의 번역, 양방향 호환성, 언어 내장 직렬화의 한계를 잇는다.</desc>
<rect width="880" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">05-01 · CHAPTER OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인코딩과 호환성 기초 전체 지도</text>

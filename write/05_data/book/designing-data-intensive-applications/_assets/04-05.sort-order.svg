<title id="dt">행 전체 다중 키 정렬과 일괄 쓰기 구조</title><desc id="dd">행 전체 단위로 정렬해 첫 정렬 키의 긴 반복으로 압축 효과를 극대화하고, 쓰기는 인메모리 버퍼 축적 후 디스크 컬럼 파일로 일괄 병합한다.</desc>
<rect width="880" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">04-05 · SORT ORDER</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">행 전체 다중 키 정렬과 일괄 쓰기 구조</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">1차 정렬 키 RLE 압축 · 2차 정렬 순서 보장 · 인메모리 버퍼 일괄 병합</text>
<rect x="20" y="104" width="412" height="276" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<rect x="38.0" y="116" width="36.0" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="56" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">정렬</text>
<text x="200" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">다중 정렬 키와 압축 효과</text>
<text x="226.0" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">행 전체 단위 정렬 · 컬럼별 독립 정렬 금지</text>
<line x1="32" y1="160" x2="420" y2="160" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="32" y="170" width="388" height="36" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="40" y="186" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="600" fill="#3FB98C">1차 정렬: date_key</text>
<text x="412" y="186" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">긴 연속 반복 · 압축 가장 잘 됨</text>
<text x="40" y="200" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">[ 260101, 260101, 260101, 260102, ... ]</text>
<rect x="32" y="212" width="388" height="36" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="40" y="228" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#6A95D8">2차 정렬: product_sk</text>
<text x="412" y="228" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">같은 날짜 안의 순서 결정</text>
<text x="40" y="242" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">[     29,     30,     69,     31, ... ]</text>
<rect x="32" y="254" width="388" height="36" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="40" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#5E6B7E">하위 컬럼: store_sk</text>
<text x="412" y="270" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">k번째 항목 일치 유지 · 행 재조립</text>
<text x="40" y="284" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">[      3,      5,      3,      4, ... ]</text>
<rect x="32" y="304" width="388" height="64" rx="6" fill="#F08A5918" stroke="#F08A59" stroke-width="1.2"/>
<text x="226.0" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">첫 정렬 키는 수십억 행도 수 KB로 RLE 압축</text>
<text x="226.0" y="342" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#F08A59">날짜 범위 쿼리 시 대상 구간 블록만 스캔</text>
<text x="226.0" y="357" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">컬럼 간 같은 행 순서 유지로 k번째 항목 결합 보장</text>
<rect x="448" y="104" width="412" height="276" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="466.0" y="116" width="36.0" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="484" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">쓰기</text>
<text x="628" y="130" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">로그 구조 일괄 적재 (ETL)</text>
<text x="654.0" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">압축 컬럼 재작성 비용 분산 파이프라인</text>
<line x1="460" y1="160" x2="848" y2="160" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="460" y="170" width="388" height="34" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="472" y="191" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F5F5F3">신규 쓰기 유입</text>
<text x="836" y="191" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">행 단위 삽입 요청</text>
<path d="M 654.0 206 L 654.0 214" fill="none" stroke="#5E6B7E" stroke-width="1.1" marker-end="url(#soft)"/>
<rect x="460" y="216" width="388" height="38" rx="4" fill="#E3B34116" stroke="#E3B341" stroke-width="1.0"/>
<text x="472" y="234" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#E3B341">인메모리 정렬 행 저장소</text>
<text x="836" y="234" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">정렬 순서 유지하며 버퍼링</text>
<text x="472" y="248" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">일정량 누적 시까지 메모리 보관</text>
<path d="M 654.0 256 L 654.0 264" fill="none" stroke="#5E6B7E" stroke-width="1.1" marker-end="url(#soft)"/>
<rect x="460" y="266" width="388" height="38" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="472" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F5F5F3">디스크 컬럼 파일 일괄 병합</text>
<text x="836" y="284" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">신규 불변 파일 일괄 작성</text>
<text x="472" y="298" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">오브젝트 스토리지 적합 구조</text>
<rect x="460" y="312" width="388" height="56" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="654.0" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F5F5F3">쿼리는 메모리 쓰기와 디스크 컬럼 파일을 결합</text>
<text x="654.0" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">실행 엔진이 계층 분리를 사용자에게 은닉</text>
<line x1="12" y1="412" x2="832" y2="412" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="434" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="424" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1차 키 RLE 압축</text>
<rect x="287" y="424" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">2차 정렬 키</text>
<rect x="422" y="424" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="444" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">인메모리 정렬 버퍼</text>
<rect x="596" y="424" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="618" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">행 재조립 순서 보장</text>
</svg>
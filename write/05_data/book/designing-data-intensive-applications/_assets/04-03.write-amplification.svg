<title id="dt">B-tree와 LSM 디스크 쓰기 증폭 경로</title><desc id="dd">애플리케이션 쓰기 하나가 두 저장 엔진에서 디스크 쓰기 여러 번으로 늘어나는 경로를 따라간다.</desc>
<rect width="880" height="504" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">04-03 · WRITE AMPLIFICATION DATA FLOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">B-tree와 LSM 디스크 쓰기 증폭 경로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">애플리케이션 요청 → WAL 기록 → 디스크 페이지 덮어쓰기 / SSTable 압축 플러시 → 증폭 결과</text>

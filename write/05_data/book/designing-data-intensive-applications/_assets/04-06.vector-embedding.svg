<text x="692" y="232" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">거리 d ≈ 0.32 (가까움)</text>
<text x="692" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">의미 유사 (농업 ≈ 채소)</text>
<rect x="684" y="270" width="160" height="64" rx="6" fill="#0D1117" stroke="#E3B341" stroke-width="1.0"/>
<text x="692" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">벡터 A ↔ 벡터 C</text>
<text x="692" y="306" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">거리 d ≈ 1.27 (멂)</text>
<text x="692" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">의미 상이 (무관한 주제)</text>
<rect x="26" y="374" width="828" height="32" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="440.0" y="394" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">동의어·오타를 넘어 코사인 유사도나 유클리드 거리로 의미적 유사 문서를 탐색</text>
<line x1="12" y1="440" x2="832" y2="440" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="462" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

<rect x="242" y="152" width="180" height="196" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="332.0" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">임베딩 모델 (LLM)</text>

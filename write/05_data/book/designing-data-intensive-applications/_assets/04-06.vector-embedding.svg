<text x="476" y="323" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">[0.85, 0.10, -0.52]</text>
<path d="M 638 250.0 L 674 250.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="674" y="152" width="180" height="196" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="764.0" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">거리 &amp; 유사도 비교</text>
<rect x="684" y="196" width="160" height="64" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>

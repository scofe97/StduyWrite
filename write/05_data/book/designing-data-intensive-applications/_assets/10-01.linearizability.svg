<title id="dt">복제 지연으로 인한 비선형적 읽기 시퀀스</title><desc id="dd">Aaliyah 는 최종 점수를 읽었는데, 그 말을 듣고 나중에 읽은 Bryce 는 늦은 팔로워에서 구 값을 받는다.</desc>

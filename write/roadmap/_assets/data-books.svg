<title id="dt">데이터 책 읽기 흐름</title><desc id="dd">자체 노트 79편이 1~7단계를 맡고 책 셋이 3단계와 8~10단계를 맡는다. 그래서 책 카드가 뒷단계에 몰린다 — 앞단계의 빈자리는 노트가 채운다. 테두리 색이 우선순위다.</desc>

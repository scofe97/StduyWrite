<title id="dt">Spring 책 읽기 흐름</title><desc id="dd">이 로드맵이 쓰는 책 다섯을 단계 순으로 걸고 각 책에서 읽을 장만 적었다. 통독하는 책은 Spring Start Here 하나뿐이고 나머지는 부분 독서다. 같은 책이 여러 단계에 갈려 걸리므로 행은 단계가 아니라 책의 역할로 묶었다. 테두리 색이 우선순위다.</desc>

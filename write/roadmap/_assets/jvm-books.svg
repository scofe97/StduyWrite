<title id="dt">JVM 책 읽기 흐름</title><desc id="dd">책은 셋뿐이고 정독 노트가 171편이다. 세 권이 단계를 나눠 가지므로 같은 책이 여러 행에 나온다. 심층 자바 가상 머신이 원리를, Java Performance 가 측정과 튜닝을, Troubleshooting Java 가 진단을 맡는다.</desc>

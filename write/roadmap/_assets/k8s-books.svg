<title id="dt">Kubernetes 책 읽기 흐름</title><desc id="dd">이 로드맵이 쓰는 책 열을 단계 순으로 걸고 각 책에서 읽을 장만 적었다. 통독하는 책은 Kubernetes in Action 하나이고 나머지는 부분 독서다. 테두리 색이 우선순위다.</desc>

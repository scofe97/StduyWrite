<title id="dt">AI 책 읽기 흐름 — DevOps 축</title><desc id="dd">이 로드맵이 쓰는 책 다섯을 단계 순으로 걸고 각 책에서 읽을 장만 적었다. 통독하는 책은 둘이고 나머지는 부분 독서다. AI Engineering 의 파인튜닝·데이터셋 두 장은 모델을 만드는 쪽이라 뺐다. 테두리 색이 우선순위다.</desc>

<title id="dt">폐쇄망 환경 차트 및 컨테이너 이미지 반입 경로</title><desc id="dd">외부망에서 tgz 차트와 이미지 목록을 추출해 망 분리 경계를 넘어 사내 레지스트리에 적재하고 설치하는 아키텍처</desc>

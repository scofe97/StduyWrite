<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">외부망 아카이브 추출(좌) → 망 분리 경계 통과 → 사내 레지스트리 적재 및 클러스터 설치(우)</text>

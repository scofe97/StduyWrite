<title id="dt">helm lint 와 렌더 테스트의 오류 검출 분기</title><desc id="dd">위험한 Role 권한이 든 ./t3/demo 사본이 helm lint --strict 는 종료 코드 0 으로 통과하고 render-test.sh 에서 차단되는 두 경로</desc>
<rect width="904" height="472" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">HELM · LINT VS RENDER TEST</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">helm lint 와 렌더 테스트의 오류 검출 분기</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">동일 차트 사본(./t3/demo) 입력 · lint 는 형식만 확인해 통과하고, 렌더 테스트는 값 단언에서 차단(Helm v4.1.4 실측)</text>
<rect x="132" y="92" width="640" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="452" y="110" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">입력 차트 사본: ./t3/demo</text>
<text x="452" y="127" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">Role verbs: ["*"]  ·  (YAML 형식은 정상)</text>
<path d="M 452 136 L 452 144 L 220 144 L 220 156" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 452 136 L 452 144 L 684 144 L 684 156" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="56" y="156" width="328" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="220" y="181" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">helm lint ./t3/demo --strict</text>
<rect x="520" y="156" width="328" height="40" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="684" y="181" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">./render-test.sh ./t3/demo</text>
<path d="M 220 196 L 220 216" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 684 196 L 684 216" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="56" y="216" width="328" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="72" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">차트 형식 · 값의 의미는 점검 밖</text>
<text x="72" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">통과 · Role 의 * 도 올바른 YAML</text>
<rect x="400" y="220" width="104" height="48" rx="6" fill="#F08A5916" stroke="#F08A59" stroke-width="1.4"/>
<text x="452" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">첫 분기점</text>
<text x="452" y="258" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">값 의미 검사</text>
<line x1="384" y1="244" x2="400" y2="244" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="504" y1="244" x2="520" y2="244" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="520" y="216" width="328" height="56" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.3"/>
<text x="536" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">단언 1 · Role verbs 가 get,list 인가</text>
<text x="536" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">FAIL · Role verbs: *,get,list</text>
<path d="M 220 272 L 220 288" fill="none" stroke="#E3B341" stroke-width="1.2" marker-end="url(#warn)"/>
<path d="M 684 272 L 684 288" fill="none" stroke="#F0616D" stroke-width="1.2" marker-end="url(#bad)" stroke-dasharray="4 4"/>
<rect x="56" y="288" width="328" height="56" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="72" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">fail 로 막아 둔 잘못된 mode 값</text>
<text x="72" y="330" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">lint 는 통과시킴 (실측)</text>
<rect x="520" y="288" width="328" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="536" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">단언 4 · --set mode=weird 는 렌더 실패인가</text>
<text x="536" y="330" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">NOT REACHED · 앞 단언에서 중단</text>
<path d="M 220 344 L 220 360" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#warn)"/>
<path d="M 684 344 L 684 360" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<rect x="56" y="360" width="328" height="44" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="220" y="387" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">종료 코드 0 · 위험 매니페스트 통과 (실측)</text>
<rect x="520" y="360" width="328" height="44" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="684" y="387" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">종료 코드 1 · FAIL 차단 (실측)</text>
<line x1="12" y1="424" x2="856" y2="424" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="446" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="436" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">형식 점검 통과</text>
<rect x="248" y="436" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="270" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">값 의미를 못 거름</text>
<rect x="422" y="436" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="444" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실패 차단 (FAIL)</text>
<rect x="622" y="436" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="644" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">첫 분기점</text>

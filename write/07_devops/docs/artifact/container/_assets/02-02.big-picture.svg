<title id="dt">OpenJDK 소스에서 배포판까지의 분화</title><desc id="dd">업스트림 OpenJDK 소스가 배포처를 거쳐 이미지에 도달할 때 판 번호를 따라 같이 오는 요소와 배포처마다 달라지는 요소의 구분</desc>

<title id="dt">환경과 제약에 따른 빌더 선택 결정 흐름</title><desc id="dd">실행 환경, 보안 정책, 대상 언어, Dockerfile 준비 여부에 따른 6종 빌더 선택 경로</desc>
<rect width="960" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER · 01-03 FLOWCHART</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">환경과 제약에 따른 빌더 선택 결정 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">질문 분기(Pod 실행 여부 → 특권 허용 → JVM 여부 → Dockerfile 유무)와 최종 선택 도구</text>
<path d="M 240 96 L 335 118 L 240 140 L 145 118 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="240" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">실행 환경이 Pod 인가?</text>
<path d="M 335 118 L 518 118" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="427" y="111" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아니오 (VM)</text>
<rect x="520" y="93" width="410" height="50" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="536" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">Docker (docker build)</text>
<text x="536" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">VM 호스트 데몬 직접 활용 · Dockerfile 기반</text>
<path d="M 240 140 L 240 168" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="254" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">예</text>
<path d="M 240 168 L 335 190 L 240 212 L 145 190 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="240" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">특권(privileged) 허용?</text>
<path d="M 335 190 L 518 190" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="427" y="183" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">예</text>
<rect x="520" y="165" width="410" height="50" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="536" y="184" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">BuildKit 데몬 또는 Docker DinD</text>
<text x="536" y="204" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트 소켓 마운트 또는 특권 컨테이너 전제</text>
<path d="M 240 212 L 240 240" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="254" y="230" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아니오</text>
<path d="M 240 240 L 335 262 L 240 284 L 145 262 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="240" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">JVM 애플리케이션인가?</text>
<path d="M 335 262 L 518 262" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="427" y="255" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">예</text>
<rect x="520" y="237" width="410" height="50" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="536" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">Jib (Maven · Gradle 플러그인)</text>
<text x="536" y="276" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Dockerfile 불필요 · Restricted Pod 에서도 동작</text>
<path d="M 240 284 L 240 312" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="254" y="302" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아니오</text>
<path d="M 240 312 L 335 334 L 240 356 L 145 334 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="240" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">Dockerfile 있는가?</text>
<path d="M 335 334 L 518 334" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="427" y="327" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">예</text>
<rect x="520" y="309" width="410" height="50" rx="6" fill="#F08A5916" stroke="#F08A59" stroke-width="1.4"/>
<text x="536" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">BuildKit rootless 또는 Buildah</text>
<text x="536" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">빌드 전용 네임스페이스 · 보안 프로필 완화 필요</text>
<path d="M 240 356 L 240 406 L 518 406" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="254" y="366" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아니오</text>
<rect x="520" y="381" width="410" height="50" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="536" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">Buildpacks (pack · kpack)</text>
<text x="536" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소스 감지 · Pod 에서는 kpack (Restricted 조건)</text>
<line x1="12" y1="472" x2="912" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="494" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="484" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">privileged 없음 · 완화 필요</text>
<rect x="417" y="484" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="439" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">언어 특화 (Jib)</text>
<rect x="604" y="484" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="626" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데몬·다언어 감지</text>
<rect x="765" y="484" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="787" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">특권 격리 완화</text>

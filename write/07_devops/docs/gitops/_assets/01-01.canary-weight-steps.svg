<title id="dt">Canary 단계별 가중치 확대와 pause · analysis 관문</title><desc id="dd">트래픽 라우터가 v1/v2 가중치를 90/10, 70/30, 50/50, 0/100 으로 단계 진행하며 단계마다 pause 와 analysis 관문을 거친다. 관문 실패 시 abort 점선으로 100/0 으로 즉시 복귀하며, 정확한 가중치 분할에는 NGINX 나 Istio 같은 trafficRouting 이 필요하다.</desc>

<title id="dt">Blue-Green 배포의 Service 선택자 전환과 즉시 롤백</title><desc id="dd">전환 전에는 Ingress 에서 Service(my-api, version: blue) 가 Blue Deployment(v1, 3 Pod) 로 100% 트래픽을 보내고 Green Deployment(v2, 3 Pod) 를 미리 띄워 둔다. kubectl patch 로 selector 를 version: green 으로 바꾸면 트래픽 100% 가 Green 으로 일괄 이동하고, 장애 시 selector 를 version: blue 로 되돌리는 점선으로 즉시 복구한다.</desc>

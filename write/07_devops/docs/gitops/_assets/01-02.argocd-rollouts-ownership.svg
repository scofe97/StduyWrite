<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Argo CD 와 Argo Rollouts 의 자원 소유 경계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Argo CD 는 Git 선언을 Rollout CR 에 동기화하고, Argo Rollouts 는 클러스터 안의 트래픽과 파드를 전환합니다</text>

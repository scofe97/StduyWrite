<title id="dt">Argo CD 와 Argo Rollouts 의 자원 소유 경계</title><desc id="dd">Git 저장소의 Rollout v2 선언을 Argo CD 가 클러스터의 Rollout CR 로 동기화한다. Argo Rollouts 컨트롤러는 Rollout CR 을 감시하며 stable 과 canary ReplicaSet 스케일, stable 과 canary Service 의 selector, 그리고 Ingress 또는 Istio 의 trafficRouting 가중치 90 대 10 을 각각 변경한다. 실트래픽은 Ingress 또는 Istio 에서 90% 와 10% 로 나뉘어 각 Service 를 거쳐 stable 과 canary ReplicaSet 으로 흐른다.</desc>

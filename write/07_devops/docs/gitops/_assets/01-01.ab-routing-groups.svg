<title id="dt">A/B Testing 조건 분기와 성과 비교 흐름</title><desc id="dd">사용자 요청을 x-beta-user 헤더 조건으로 그룹 A(subset: v1)와 그룹 B(subset: v2)에 고정 분기하고 전환율과 체류 시간을 비교해 승자를 승격하는 흐름</desc>
<rect width="960" height="416" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · A/B TESTING ROUTING</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">A/B Testing 조건 분기와 성과 비교 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">시간 진행이 아니라 HTTP 헤더·쿠키 조건으로 사용자를 같은 버전에 고정 분기해 비즈니스 성과 승자를 고릅니다</text>
<path d="M 136 228 L 182 228" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 260 180 L 260 148 L 414 148" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>

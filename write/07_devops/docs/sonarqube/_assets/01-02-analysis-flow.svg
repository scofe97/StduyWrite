  <title id="sq-analysis-flow-title">분석은 CI 호스트에서 돌고 서버는 결과를 계산한다</title>
  <desc id="sq-analysis-flow-desc">개발자·CI 호스트·SonarQube 서버 세 역할이 커밋부터 Quality Gate 판정까지 다섯 단계를 나눠 맡는 흐름. 스캐너 실행이 CI 호스트에서 일어나고, 그 결과를 서버가 받아 리포트를 처리한 뒤 판정을 CI 로 돌려준다.</desc>

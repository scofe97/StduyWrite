<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%"
     role="img" aria-labelledby="sq-newcode-title sq-newcode-desc">
  <title id="sq-newcode-title">New Code 정의마다 새 코드로 치는 구간이 달라진다</title>
  <desc id="sq-newcode-desc">Previous version, Specific analysis, Number of days 세 정의는 같은 커밋 이력 위에서 시작일만 다른 구간을 만든다. Reference branch 는 기간이 아니라 브랜치 사이의 차이라서 시간축 위에 얹히지 않는다.</desc>

  <rect width="960" height="380" fill="#0D1117"/>
  <text x="40" y="32" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.14em">NEW CODE DEFINITION</text>

  <line x1="280" y1="72" x2="880" y2="72" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <line x1="352" y1="64" x2="352" y2="80" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <line x1="504" y1="64" x2="504" y2="80" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <line x1="656" y1="64" x2="656" y2="80" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <line x1="880" y1="56" x2="880" y2="292" stroke="rgba(240,138,89,0.35)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="352" y="96" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">v1.2 release</text>
  <text x="504" y="96" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">analysis #418</text>
  <text x="656" y="96" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">30 days ago</text>
  <text x="880" y="48" fill="#F08A59" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">now</text>

  <text x="40" y="136" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Previous version</text>
  <text x="40" y="154" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace">global default</text>
  <rect x="352" y="120" width="528" height="28" rx="4" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
  <text x="616" y="139" fill="#F08A59" font-size="10" font-family="'Geist Mono',monospace" text-anchor="middle">since last version bump</text>

  <text x="40" y="196" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Specific analysis</text>
  <text x="40" y="214" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace">branch level only</text>
  <rect x="504" y="180" width="376" height="28" rx="4" fill="rgba(245,245,243,0.06)" stroke="rgba(245,245,243,0.28)" stroke-width="1"/>
  <text x="692" y="199" fill="#8B98A9" font-size="10" font-family="'Geist Mono',monospace" text-anchor="middle">since a chosen analysis</text>

  <text x="40" y="256" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Number of days</text>
  <text x="40" y="274" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace">max 90</text>
  <rect x="656" y="240" width="224" height="28" rx="4" fill="rgba(245,245,243,0.06)" stroke="rgba(245,245,243,0.28)" stroke-width="1"/>
  <text x="768" y="259" fill="#8B98A9" font-size="10" font-family="'Geist Mono',monospace" text-anchor="middle">rolling window</text>

  <line x1="40" y1="300" x2="920" y2="300" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

  <text x="40" y="332" fill="#F5F5F3" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Reference branch</text>
  <text x="40" y="350" fill="#5E6B7E" font-size="9" font-family="'Geist Mono',monospace">not a period</text>
  <rect x="280" y="316" width="600" height="40" rx="4" fill="rgba(245,245,243,0.03)" stroke="rgba(245,245,243,0.20)" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="580" y="341" fill="#8B98A9" font-size="13" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">기간이 아니라 기준 브랜치와의 차이 — 시간축에 얹히지 않습니다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" role="img" aria-labelledby="t0503 d0503">
  <title id="t0503">여러 분석이 하나의 Compute Engine 워커로 모이고 큐 깊이와 대기 시간이 증설 판단의 근거가 된다</title>
  <desc id="d0503">main · 브랜치 · 풀 리퀘스트 분석이 데이터베이스의 리포트 큐로 모인다. Compute Engine 은 한 번에 한 건만 처리하며 Community Build 는 워커 수를 늘릴 수 없다. PendingCount 는 큐 깊이를, PendingTime 은 가장 오래 기다린 작업의 나이를 알려 주고 두 값을 함께 봐야 적체를 판정할 수 있다.</desc>

  <defs>
    <marker id="q-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8B98A9"/>
    </marker>
    <marker id="q-ar-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3FB98C"/>
    </marker>
    <marker id="q-ar-bad" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F0616D"/>
    </marker>
  </defs>

  <rect width="960" height="440" fill="#0D1117"/>

  <text x="40" y="44" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.6">COMPUTE ENGINE / QUEUE DEPTH</text>
  <text x="40" y="72" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="600">분석은 여럿이고 처리하는 워커는 하나입니다</text>
  <text x="40" y="94" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">Community Build 26.1 실측 · JMX ComputeEngineTasks MBean 의 속성을 위치에 대응시킨 그림</text>

  <text x="40" y="140" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.2">ARRIVALS</text>
  <text x="264" y="140" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.2">REPORT QUEUE — IN DATABASE</text>
  <text x="560" y="140" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.2">SERVICE POINT</text>
  <text x="800" y="140" fill="#5E6B7E" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="1.2">OUTCOME</text>

  <path d="M 176 202 H 212 Q 220 202 220 210 V 218 Q 220 226 228 226 H 256" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#q-ar)"/>
  <line x1="176" y1="250" x2="256" y2="250" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#q-ar)"/>
  <path d="M 176 298 H 212 Q 220 298 220 290 V 282 Q 220 274 228 274 H 256" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#q-ar)"/>

  <line x1="516" y1="250" x2="552" y2="250" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#q-ar)"/>

  <path d="M 712 241 H 744 Q 752 241 752 233 V 230 Q 752 222 760 222 H 792" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#q-ar-ok)"/>
  <path d="M 712 259 H 744 Q 752 259 752 267 V 282 Q 752 290 760 290 H 792" fill="none" stroke="#F0616D" stroke-width="1.2" marker-end="url(#q-ar-bad)"/>

  <rect x="40" y="184" width="136" height="36" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1"/>
  <text x="108" y="207" text-anchor="middle" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" font-weight="600">main 분석</text>

  <rect x="40" y="232" width="136" height="36" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1"/>
  <text x="108" y="255" text-anchor="middle" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" font-weight="600">브랜치 분석</text>

  <rect x="40" y="280" width="136" height="36" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1"/>
  <text x="108" y="303" text-anchor="middle" fill="#F5F5F3" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" font-weight="600">풀 리퀘스트 분석</text>

  <rect x="264" y="216" width="244" height="68" rx="6" fill="rgba(139,152,169,0.06)" stroke="#8B98A9" stroke-width="1"/>
  <rect x="280" y="232" width="36" height="36" rx="4" fill="rgba(139,152,169,0.18)" stroke="#8B98A9" stroke-width="1"/>
  <rect x="324" y="232" width="36" height="36" rx="4" fill="rgba(139,152,169,0.18)" stroke="#8B98A9" stroke-width="1"/>
  <rect x="368" y="232" width="36" height="36" rx="4" fill="rgba(139,152,169,0.18)" stroke="#8B98A9" stroke-width="1"/>
  <rect x="412" y="232" width="36" height="36" rx="4" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="456" y="232" width="36" height="36" rx="4" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="264" y="304" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9">PendingCount = 큐 깊이</text>
  <text x="264" y="320" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9">PendingTime  = 가장 오래 기다린 작업의 나이</text>

  <rect x="560" y="224" width="152" height="52" rx="6" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
  <text x="636" y="246" text-anchor="middle" fill="#F08A59" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" font-weight="600">Compute Engine</text>
  <text x="636" y="264" text-anchor="middle" fill="#F08A59" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10">WorkerCount = 1</text>

  <text x="560" y="304" fill="#8B98A9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9">InProgressCount ∈ {0, 1}</text>

  <rect x="796" y="204" width="124" height="36" rx="6" fill="rgba(63,185,140,0.08)" stroke="#3FB98C" stroke-width="1"/>
  <text x="858" y="227" text-anchor="middle" fill="#3FB98C" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10">SuccessCount</text>

  <rect x="796" y="272" width="124" height="36" rx="6" fill="rgba(240,97,109,0.08)" stroke="#F0616D" stroke-width="1"/>
  <text x="858" y="295" text-anchor="middle" fill="#F0616D" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10">ErrorCount</text>

  <line x1="40" y1="356" x2="920" y2="356" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="40" y="376" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">깊이만 보면 오판합니다. 큐가 비어 있어도 한 건이 오래 붙들려 있을 수 있으므로 PendingCount 와 PendingTime 을 함께 봅니다.</text>
  <text x="40" y="396" fill="#8B98A9" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11">Community Build 는 MaxWorkerCount 도 1 입니다. 워커 증설은 Enterprise Edition 기능이라 이 그림의 병목은 늘릴 수 없습니다.</text>
</svg>

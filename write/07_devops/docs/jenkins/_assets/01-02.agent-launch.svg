<title id="dt">SSH Agent 가 뜨는 순서</title><desc id="dd">사람이 JDK·빌드 도구·sshd 를 미리 설치하고 노드를 저장하면 Controller 의 config.xml 만 바뀌며, Launch agent 를 누르면 Controller 가 다섯 단계로 SSH 접속부터 채널 연결까지 수행하는 순서</desc>

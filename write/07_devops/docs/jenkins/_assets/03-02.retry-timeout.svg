<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">재시도와 타임아웃의 중첩 순서</title><desc id="dd">retry 와 timeout 의 중첩 순서에 따른 실행기 점유 시간 비교. 바깥 retry 는 시도마다 10분이 새로 시작되어 최악의 경우 30분 동안 실행기를 점유하고, 바깥 timeout 은 세 번의 재시도를 합친 총시간을 10분 상한으로 제한합니다.</desc>
<rect width="960" height="352" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">JENKINS · RETRY &amp; TIMEOUT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">재시도와 타임아웃의 중첩 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바깥 retry 는 최악 30분 누적 점유(상단) vs 바깥 timeout 은 전체 10분 상한 준수(하단)</text>
<line x1="240" y1="128" x2="240" y2="264" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 4"/>
<text x="240" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">0분</text>
<line x1="460" y1="128" x2="460" y2="264" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 4"/>
<text x="460" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">10분</text>
<line x1="680" y1="128" x2="680" y2="264" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 4"/>
<text x="680" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">20분</text>
<line x1="900" y1="128" x2="900" y2="264" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="2 4"/>
<text x="900" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">30분</text>
<rect x="16" y="140" width="216" height="44" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="28" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">retry(3) { timeout(10m) }</text>
<text x="28" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">시도마다 10분 타임아웃 재시작</text>
<rect x="240" y="140" width="220" height="44" rx="4" fill="#E3B34118" stroke="#E3B341" stroke-width="1.0"/>
<text x="350" y="158" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">시도 1 (10분)</text>
<text x="350" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">타임아웃 발생</text>
<rect x="460" y="140" width="220" height="44" rx="4" fill="#E3B34118" stroke="#E3B341" stroke-width="1.0"/>
<text x="570" y="158" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">시도 2 (10분)</text>
<text x="570" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">타임아웃 발생</text>
<rect x="680" y="140" width="220" height="44" rx="4" fill="#F0616D20" stroke="#F0616D" stroke-width="1.2"/>
<text x="790" y="158" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">시도 3 (10분)</text>
<text x="790" y="174" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">최악 30분 실행기 점유</text>
<line x1="460" y1="136" x2="460" y2="188" stroke="#E3B341" stroke-width="1.4"/>
<line x1="680" y1="136" x2="680" y2="188" stroke="#E3B341" stroke-width="1.4"/>
<line x1="900" y1="136" x2="900" y2="188" stroke="#F0616D" stroke-width="1.8"/>
<rect x="16" y="212" width="216" height="44" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="28" y="230" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">timeout(10m) { retry(3) }</text>
<text x="28" y="246" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">전체 상한 10분 강제</text>
<rect x="240" y="212" width="220" height="44" rx="4" fill="#F08A5918" stroke="#F08A59" stroke-width="1.4"/>
<text x="350" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">시도 1·2·3 합쳐 10분 이내</text>
<text x="350" y="246" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">시도마다 --max-time 30</text>
<line x1="460" y1="206" x2="460" y2="262" stroke="#F08A59" stroke-width="2.0"/>
<rect x="460" y="212" width="440" height="44" rx="4" fill="#3FB98C0A" stroke="#3FB98C" stroke-width="1.0"/>
<text x="680" y="239" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">10분에서 끝남 — 실행기 점유 없음</text>
<line x1="12" y1="296" x2="912" y2="296" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="308" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시도별 10분 점유</text>
<rect x="274" y="308" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="296" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최악 30분 점유</text>
<rect x="435" y="308" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="457" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전체 10분 상한</text>
<rect x="596" y="308" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="618" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">10분 뒤 점유 없음</text>
</svg>
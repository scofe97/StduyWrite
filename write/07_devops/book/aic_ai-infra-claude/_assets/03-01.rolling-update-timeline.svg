  <text x="475" y="140" text-anchor="middle" fill="#f44336" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">− v0.1.0</text>
  <rect x="410" y="150" width="130" height="34" fill="#0d0d0d" stroke="#f44336" stroke-dasharray="5 3" rx="5"/>
  <text x="475" y="172" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" style="fill:#f44336">v0.1.0</text>
  <rect x="410" y="192" width="130" height="34" fill="#66bb6a" rx="5"/>
  <text x="475" y="214" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#0d0d0d">v0.1.1</text>
  <rect x="410" y="234" width="130" height="34" fill="#5b9bd5" rx="5"/>
  <text x="475" y="256" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#e8e4df">v0.1.0</text>

  <line x1="552" y1="210" x2="576" y2="210" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#arrowAmber3)"/>

  <!-- ④ 새 Pod 띄움 -->
  <rect x="580" y="64" width="150" height="231" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="8"/>
  <text x="655" y="92" text-anchor="middle" fill="#e8e4df" font-size="13" font-weight="700">④ 새 Pod 띄움</text>
  <text x="655" y="112" text-anchor="middle" fill="#e8e4df" font-size="11">총 3 — maxSurge</text>
  <text x="655" y="140" text-anchor="middle" fill="#66bb6a" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">+ v0.1.1</text>
  <rect x="590" y="150" width="130" height="34" fill="#66bb6a" rx="5"/>
  <text x="655" y="172" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#0d0d0d">v0.1.1</text>
  <rect x="590" y="192" width="130" height="34" fill="#66bb6a" rx="5"/>
  <text x="655" y="214" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#0d0d0d">v0.1.1</text>
  <rect x="590" y="234" width="130" height="34" fill="#5b9bd5" rx="5"/>
  <text x="655" y="256" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#e8e4df">v0.1.0</text>

  <line x1="732" y1="210" x2="756" y2="210" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#arrowAmber3)"/>

  <!-- ⑤ 완료 -->
  <rect x="760" y="64" width="150" height="231" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="8"/>
  <text x="835" y="92" text-anchor="middle" fill="#e8e4df" font-size="13" font-weight="700">⑤ 완료</text>
  <text x="835" y="112" text-anchor="middle" fill="#e8e4df" font-size="11">총 2</text>
  <text x="835" y="140" text-anchor="middle" fill="#f44336" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">− v0.1.0</text>
  <rect x="770" y="150" width="130" height="34" fill="#0d0d0d" stroke="#f44336" stroke-dasharray="5 3" rx="5"/>
  <text x="835" y="172" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" style="fill:#f44336">v0.1.0</text>
  <rect x="770" y="192" width="130" height="34" fill="#66bb6a" rx="5"/>
  <text x="835" y="214" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#0d0d0d">v0.1.1</text>
  <rect x="770" y="234" width="130" height="34" fill="#66bb6a" rx="5"/>
  <text x="835" y="256" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#0d0d0d">v0.1.1</text>

  <!-- 혼재 구간 브래킷 -->
  <line x1="220" y1="320" x2="730" y2="320" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <line x1="220" y1="312" x2="220" y2="320" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <line x1="730" y1="312" x2="730" y2="320" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="475" y="345" text-anchor="middle" fill="rgb(212,168,83)" font-size="13" font-weight="700">v0.1.0과 v0.1.1이 동시에 응답하는 구간 — 하위 호환되는 변경만 안전</text>

  <!-- 범례 -->
  <rect x="250" y="380" width="70" height="20" fill="#5b9bd5" rx="4"/>
  <text x="285" y="394" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" style="fill:#e8e4df">v0.1.0</text>
  <text x="330" y="394" fill="#e8e4df" font-size="11">기존</text>
  <rect x="420" y="380" width="70" height="20" fill="#66bb6a" rx="4"/>
  <text x="455" y="394" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" style="fill:#0d0d0d">v0.1.1</text>
  <text x="500" y="394" fill="#e8e4df" font-size="11">새 버전</text>
  <rect x="610" y="380" width="70" height="20" fill="#0d0d0d" stroke="#f44336" stroke-dasharray="4 3" rx="4"/>
  <text x="645" y="394" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" style="fill:#f44336">v0.1.0</text>

<svg viewBox="0 0 960 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Rolling Update 교체 타임라인</title>
  <desc>replicas 2, maxSurge 1, maxUnavailable 0에서 v0.1.0 Pod 2개가 v0.1.1로 하나씩 교체되는 5단계와 두 버전 혼재 구간</desc>
  <defs>
    <marker id="arrowAmber3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="430" fill="#0d0d0d"/>

  <text x="480" y="30" text-anchor="middle" fill="rgb(212,168,83)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">replicas 2 · maxSurge 1 · maxUnavailable 0</text>
  <text x="480" y="52" text-anchor="middle" fill="#e8e4df" font-size="12">새 Pod은 1개까지 더 띄우고 가용 Pod은 2 미만으로 줄이지 않는다</text>

  <!-- ① 시작 -->
  <rect x="40" y="64" width="150" height="231" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="8"/>
  <text x="115" y="92" text-anchor="middle" fill="#e8e4df" font-size="13" font-weight="700">① 시작</text>
  <text x="115" y="112" text-anchor="middle" fill="#e8e4df" font-size="11">총 2</text>
  <rect x="50" y="192" width="130" height="34" fill="#5b9bd5" rx="5"/>
  <text x="115" y="214" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#e8e4df">v0.1.0</text>
  <rect x="50" y="234" width="130" height="34" fill="#5b9bd5" rx="5"/>
  <text x="115" y="256" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#e8e4df">v0.1.0</text>

  <line x1="192" y1="210" x2="216" y2="210" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#arrowAmber3)"/>

  <!-- ② 새 Pod 띄움 -->
  <rect x="220" y="64" width="150" height="231" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="8"/>
  <text x="295" y="92" text-anchor="middle" fill="#e8e4df" font-size="13" font-weight="700">② 새 Pod 띄움</text>
  <text x="295" y="112" text-anchor="middle" fill="#e8e4df" font-size="11">총 3 — maxSurge</text>
  <text x="295" y="140" text-anchor="middle" fill="#66bb6a" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">+ v0.1.1</text>
  <rect x="230" y="150" width="130" height="34" fill="#66bb6a" rx="5"/>
  <text x="295" y="172" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#0d0d0d">v0.1.1</text>
  <rect x="230" y="192" width="130" height="34" fill="#5b9bd5" rx="5"/>
  <text x="295" y="214" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#e8e4df">v0.1.0</text>
  <rect x="230" y="234" width="130" height="34" fill="#5b9bd5" rx="5"/>
  <text x="295" y="256" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#e8e4df">v0.1.0</text>

  <line x1="372" y1="210" x2="396" y2="210" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#arrowAmber3)"/>


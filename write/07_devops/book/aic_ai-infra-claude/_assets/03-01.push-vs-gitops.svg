<svg viewBox="0 0 960 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>푸시 배포 vs GitOps 대비도</title>
  <desc>왼쪽은 kubectl 푸시 배포에서 클러스터와 깃이 어긋나는 드리프트, 오른쪽은 ArgoCD Reconciliation Loop가 깃을 기준으로 클러스터를 수렴시키는 구조</desc>
  <defs>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#0d0d0d"/>

  <!-- ─── 왼쪽 패널: 푸시 배포 ─── -->
  <rect x="20" y="20" width="440" height="430" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5" rx="8"/>
  <text x="240" y="54" text-anchor="middle" fill="#e8e4df" font-size="15" font-weight="700">푸시 배포 — kubectl로 직접</text>

  <rect x="150" y="80" width="180" height="42" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="6"/>
  <text x="240" y="106" text-anchor="middle" fill="#e8e4df" font-size="13">운영자 터미널</text>

  <line x1="240" y1="122" x2="240" y2="168" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="252" y="150" fill="rgb(212,168,83)" font-family="'JetBrains Mono',monospace" font-size="11">kubectl apply / edit</text>

  <rect x="40" y="175" width="175" height="95" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="6"/>
  <text x="127" y="200" text-anchor="middle" fill="#e8e4df" font-size="12.5">클러스터 (실제)</text>
  <rect x="60" y="215" width="135" height="30" fill="#f2d4d4" rx="4"/>
  <text x="127" y="235" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#7a1f1f">level: warn</text>

  <rect x="265" y="175" width="175" height="95" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="6"/>
  <text x="352" y="200" text-anchor="middle" fill="#e8e4df" font-size="12.5">깃 저장소 (기록)</text>
  <rect x="285" y="215" width="135" height="30" fill="#dceaf7" rx="4"/>
  <text x="352" y="235" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" style="fill:#10243a">level: info</text>

  <text x="240" y="230" text-anchor="middle" fill="#f44336" font-size="20" font-weight="700">✕</text>

  <text x="240" y="302" text-anchor="middle" fill="#f44336" font-size="13" font-weight="700">드리프트 — 어긋나도 감지 못 함</text>

  <text x="48" y="342" fill="#e8e4df" font-size="12">· 되돌려도 '왜'가 어디에도 남지 않음</text>
  <text x="48" y="368" fill="#e8e4df" font-size="12">· CHANGE-CAUSE는 십중팔구 &lt;none&gt;</text>
  <text x="48" y="394" fill="#e8e4df" font-size="12">· ConfigMap은 rollout history조차 없음</text>

  <!-- ─── 오른쪽 패널: GitOps ─── -->
  <rect x="500" y="20" width="440" height="430" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5" rx="8"/>
  <text x="720" y="54" text-anchor="middle" fill="#e8e4df" font-size="15" font-weight="700">GitOps — 클러스터가 깃을 따라온다</text>

  <rect x="630" y="80" width="180" height="42" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="6"/>
  <text x="720" y="106" text-anchor="middle" fill="#e8e4df" font-size="13">개발자</text>

  <line x1="720" y1="122" x2="720" y2="162" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="732" y="146" fill="rgb(212,168,83)" font-family="'JetBrains Mono',monospace" font-size="11">git push</text>

  <rect x="610" y="168" width="220" height="64" fill="rgba(212,168,83,0.15)" stroke="rgb(212,168,83)" stroke-width="1.5" rx="6"/>
  <text x="720" y="192" text-anchor="middle" fill="#e8e4df" font-size="13" font-weight="700">깃 저장소 — 단일 기준</text>
  <text x="720" y="214" text-anchor="middle" fill="rgb(212,168,83)" font-family="'JetBrains Mono',monospace" font-size="11">k8s/smb/*.yaml</text>

  <line x1="640" y1="238" x2="640" y2="314" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="800" y1="314" x2="800" y2="238" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="720" y="272" text-anchor="middle" fill="rgb(212,168,83)" font-size="12" font-weight="700">Reconciliation Loop</text>
  <text x="720" y="290" text-anchor="middle" fill="#e8e4df" font-size="11.5">3분마다 비교·수렴</text>

  <rect x="610" y="320" width="220" height="56" fill="#0d0d0d" stroke="rgb(42,37,32)" rx="6"/>
  <text x="720" y="354" text-anchor="middle" fill="#e8e4df" font-size="13">클러스터 — 깃을 따라옴</text>

  <text x="720" y="404" text-anchor="middle" fill="#66bb6a" font-size="12">kubectl edit로 직접 수정해도</text>
  <text x="720" y="424" text-anchor="middle" fill="#66bb6a" font-size="12">몇 분 안에 깃 상태로 복원 — Self-Heal</text>
</svg>

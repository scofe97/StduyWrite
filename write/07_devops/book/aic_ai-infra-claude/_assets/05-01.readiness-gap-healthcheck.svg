<svg viewBox="0 0 900 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>준비 전 트래픽 유입 빈틈 — 헬스체크 없음 vs HealthCheckPolicy 있음</title>
  <desc>왼쪽은 헬스체크가 느슨해 새 Pod가 초기화 중인데 트래픽이 들어와 5xx가 나는 구간, 오른쪽은 HealthCheckPolicy가 /health를 통과한 뒤에만 트래픽을 흘려 빈틈을 막는 구조</desc>
  <defs>
    <marker id="arrRed5" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f44336"/></marker>
    <marker id="arrBlue5" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b9bd5"/></marker>
    <marker id="arrGray5" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8a8580"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#0d0d0d"/>

  <!-- 좌: 헬스체크 없음/느슨 -->
  <text x="225" y="36" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">헬스체크 느슨 — 준비 전 유입</text>
  <text x="225" y="58" text-anchor="middle" fill="#8a8580" font-size="12">새 Pod가 뜨자마자 엔드포인트 등록</text>

  <!-- 클라이언트 -->
  <rect x="40" y="150" width="96" height="44" rx="6" fill="#dceaf7"/>
  <text x="88" y="177" text-anchor="middle" font-size="13" style="fill:#0d0d0d">클라이언트</text>
  <!-- Service -->
  <rect x="180" y="150" width="96" height="44" rx="6" fill="#f5edda"/>
  <text x="228" y="172" text-anchor="middle" font-size="12" style="fill:#0d0d0d">Service</text>
  <text x="228" y="187" text-anchor="middle" font-size="10" style="fill:#0d0d0d">엔드포인트</text>
  <!-- 새 Pod (초기화 중) -->
  <rect x="320" y="90" width="120" height="52" rx="6" fill="#0d0d0d" stroke="#f44336" stroke-dasharray="5 3" stroke-width="1.5"/>
  <text x="380" y="112" text-anchor="middle" font-size="12" font-weight="700" style="fill:#f44336">새 Pod</text>
  <text x="380" y="130" text-anchor="middle" font-size="10" style="fill:#f44336">초기화 중 (준비 안 됨)</text>
  <!-- 기존 Pod -->
  <rect x="320" y="196" width="120" height="52" rx="6" fill="#5b9bd5"/>
  <text x="380" y="218" text-anchor="middle" font-size="12" font-weight="700" style="fill:#e8e4df">기존 Pod</text>
  <text x="380" y="236" text-anchor="middle" font-size="10" style="fill:#e8e4df">정상</text>

  <line x1="136" y1="172" x2="178" y2="172" stroke="#5b9bd5" stroke-width="2" marker-end="url(#arrBlue5)"/>
  <line x1="276" y1="162" x2="318" y2="122" stroke="#f44336" stroke-width="2" marker-end="url(#arrRed5)"/>
  <line x1="276" y1="182" x2="318" y2="216" stroke="#5b9bd5" stroke-width="2" marker-end="url(#arrBlue5)"/>
  <text x="300" y="290" text-anchor="middle" fill="#f44336" font-size="13" font-weight="700">준비 안 된 Pod로 트래픽 → 순간 5xx</text>

  <!-- 구분선 -->
  <line x1="450" y1="70" x2="450" y2="340" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 우: HealthCheckPolicy 있음 -->
  <text x="675" y="36" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">HealthCheckPolicy — 준비 확인 후 유입</text>
  <text x="675" y="58" text-anchor="middle" fill="#8a8580" font-size="12">GET /health 통과해야 트래픽 허용</text>

  <!-- 클라이언트 -->
  <rect x="490" y="150" width="96" height="44" rx="6" fill="#dceaf7"/>
  <text x="538" y="177" text-anchor="middle" font-size="13" style="fill:#0d0d0d">클라이언트</text>
  <!-- LB/Service (헬스체크 게이트) -->
  <rect x="628" y="144" width="104" height="56" rx="6" fill="#ddd4f0"/>
  <text x="680" y="166" text-anchor="middle" font-size="12" style="fill:#0d0d0d">LB + 헬스체크</text>
  <text x="680" y="184" text-anchor="middle" font-size="10" style="fill:#0d0d0d">GET /health :8080</text>
  <!-- 새 Pod (준비 전 — 격리) -->
  <rect x="776" y="90" width="120" height="52" rx="6" fill="#0d0d0d" stroke="#8a8580" stroke-dasharray="5 3" stroke-width="1.5"/>
  <text x="836" y="112" text-anchor="middle" font-size="12" font-weight="700" style="fill:#8a8580">새 Pod</text>
  <text x="836" y="130" text-anchor="middle" font-size="10" style="fill:#8a8580">준비 전 — 트래픽 격리</text>
  <!-- 기존 Pod (정상) -->
  <rect x="776" y="196" width="120" height="52" rx="6" fill="#66bb6a"/>
  <text x="836" y="218" text-anchor="middle" font-size="12" font-weight="700" style="fill:#0d0d0d">기존 Pod</text>
  <text x="836" y="236" text-anchor="middle" font-size="10" style="fill:#0d0d0d">정상 응답</text>

  <line x1="586" y1="172" x2="626" y2="172" stroke="#5b9bd5" stroke-width="2" marker-end="url(#arrBlue5)"/>
  <!-- 새 Pod로는 점선(격리), 200 OK 전까지 막음 -->
  <line x1="732" y1="160" x2="774" y2="122" stroke="#8a8580" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrGray5)"/>
  <text x="754" y="150" text-anchor="middle" fill="#8a8580" font-size="9">/health 실패 → 격리</text>
  <line x1="732" y1="184" x2="774" y2="216" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrGray5)"/>
  <text x="756" y="290" text-anchor="middle" fill="#66bb6a" font-size="13" font-weight="700">준비된 Pod로만 트래픽 → 5xx 예방</text>

  <!-- 하단 주석: 버전 혼재는 03-01 참조 -->
  <text x="450" y="360" text-anchor="middle" fill="#8a8580" font-size="11">이 도식은 두 빈틈 중 "준비 전 유입"만 다룹니다. "버전 혼재" 빈틈은 03-01 롤링 업데이트 타임라인 참조.</text>
</svg>

<title id="dt">kubeadm join 과 TLS 부트스트래핑 흐름</title><desc id="dd">부트스트랩 토큰과 CA 해시로 상호 신뢰를 검증하고 kubelet 인증서를 발급합니다</desc>
<rect width="880" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES · OPERATIONS · 03-05</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">kubeadm join 과 TLS 부트스트래핑 흐름</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">토큰 기반 API 서버 탐색(상단) 및 CSR 발급·자동 승인과 노드 등록(하단)</text>
<rect x="50" y="110" width="180" height="44" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="140" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">새 워커 노드</text>
<text x="140" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">kubeadm · kubelet</text>
<line x1="140" y1="154" x2="140" y2="450" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 5"/>
<rect x="350" y="110" width="180" height="44" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.0"/>
<text x="440" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">API 서버</text>
<text x="440" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">kube-apiserver (6443)</text>
<line x1="440" y1="154" x2="440" y2="450" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 5"/>
<rect x="650" y="110" width="180" height="44" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="740" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">컨트롤러 매니저</text>
<text x="740" y="144" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#3FB98C">csrapproving 컨트롤러</text>
<line x1="740" y1="154" x2="740" y2="450" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 5"/>
<path d="M 148 185 L 432 185" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="290.0" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">1. cluster-info 조회</text>
<text x="290.0" y="203" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">kube-public/cluster-info (인증 없음)</text>
<path d="M 432 230 L 148 230" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)" stroke-dasharray="3 3"/>
<text x="290.0" y="221" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">2. 루트 CA 담은 kubeconfig 응답</text>
<text x="290.0" y="248" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">ConfigMap 에 CA·토큰 서명 포함</text>
<path d="M 148 260 L 190 260 L 190 280 L 150 280" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="198" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">3. 토큰 서명·CA 해시 검증</text>
<text x="198" y="284" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">SPKI sha256 대조 (가짜 서버 차단)</text>
<path d="M 148 315 L 432 315" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<text x="290.0" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">4. 토큰으로 CSR 제출</text>
<text x="290.0" y="333" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">signer: kube-apiserver-client-kubelet</text>
<path d="M 732 360 L 448 360" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="590.0" y="351" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">5. CSR 자동 승인</text>
<text x="590.0" y="378" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">csrapproving (SubjectAccessReview)</text>
<path d="M 432 405 L 148 405" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)" stroke-dasharray="3 3"/>
<text x="290.0" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">6. 서명된 인증서 발급</text>
<text x="290.0" y="423" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">kubelet 클라이언트 인증서 수신</text>
<path d="M 148 432 L 190 432 L 190 452 L 150 452" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="198" y="440" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">7. 정식 노드 등록</text>
<text x="198" y="456" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">kubelet.conf 남김, 임시 파일 삭제</text>
<line x1="12" y1="485" x2="832" y2="485" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="507" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="497" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="507" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">탐색 및 요청</text>
<rect x="235" y="497" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="257" y="507" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">해시 검증</text>
<rect x="344" y="497" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="366" y="507" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">승인 및 등록</text>
<rect x="479" y="497" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="501" y="507" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">API 엔드포인트</text>
</svg>
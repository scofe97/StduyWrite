<title id="dt">노드 안전 격리와 단계별 퇴역 파이프라인</title><desc id="dd">스케줄링 차단과 축출 뒤 호스트를 초기화하고 마지막에 Node 객체를 지웁니다</desc>
<rect width="880" height="420" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES · OPERATIONS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">노드 안전 격리와 단계별 퇴역 파이프라인</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">워크로드 축출(좌측 두 단계)과 호스트 초기화·객체 삭제(우측 두 단계)</text>
<rect x="28" y="110" width="188" height="220" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<rect x="34" y="116" width="176" height="40" rx="4" fill="#F08A5918" stroke="#F08A59" stroke-width="1.0"/>
<text x="122" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">1. Cordon</text>
<text x="122" y="150" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">스케줄링 차단</text>
<text x="42" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">명령</text>
<text x="42" y="196" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="500" fill="#F5F5F3">kubectl cordon</text>
<text x="42" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">상태</text>
<text x="42" y="232" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="500" fill="#F5F5F3">SchedulingDisabled</text>
<text x="42" y="252" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">동작</text>
<text x="42" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#F5F5F3">신규 파드 배정 차단</text>

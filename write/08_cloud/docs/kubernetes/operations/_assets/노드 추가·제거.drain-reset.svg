<text x="466" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#F5F5F3">CNI · kubeconfig</text>

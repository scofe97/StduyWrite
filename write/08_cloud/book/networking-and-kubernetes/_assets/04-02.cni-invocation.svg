<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
</defs>
<title id="dt">ADD 호출 한 번에 무엇이 넘어가는가</title><desc id="dd">런타임은 Pod 마다 달라지는 값을 환경변수로, 노드에 고정된 망 설정을 stdin JSON 으로 넘기고, 플러그인은 할당한 주소와 경로를 stdout JSON 으로 돌려준다.</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CNI · WHAT ONE ADD CALL CARRIES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">ADD 호출 한 번에 무엇이 넘어가는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">입력이 두 갈래다 — Pod 마다 달라지는 값과 노드에 고정된 값이 서로 다른 통로로 들어간다</text>

<rect x="32" y="110" width="316" height="164" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.4"/>
<text x="50" y="134" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">Pod 마다 달라지는 값 · 환경변수</text>
<text x="50" y="162" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" fill="#F5F5F3">CNI_COMMAND=ADD</text>
<text x="50" y="184" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" fill="#F5F5F3">CNI_CONTAINERID=6f3a…</text>
<text x="50" y="206" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" fill="#F5F5F3">CNI_NETNS=/var/run/netns/cni-…</text>
<text x="50" y="228" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" fill="#F5F5F3">CNI_IFNAME=eth0</text>
<text x="50" y="256" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#5E6B7E">이것이 없으면 어느 Pod 인지 모른다</text>

<rect x="32" y="298" width="316" height="152" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="50" y="322" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">노드에 고정된 값 · stdin JSON</text>
<text x="50" y="348" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" fill="#F5F5F3">{ "type": "bridge",</text>
<text x="50" y="368" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" fill="#F5F5F3">  "bridge": "cni0",</text>
<text x="50" y="388" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" fill="#F5F5F3">  "ipam": { "type": "host-local",</text>
<text x="50" y="408" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" fill="#F5F5F3">    "subnet": "10.1.3.0/24" } }</text>
<text x="50" y="434" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#5E6B7E">/etc/cni/net.d/ 에 놓여 있다</text>

<line x1="352" y1="200" x2="412" y2="288" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)"/>
<line x1="352" y1="374" x2="412" y2="330" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>

<rect x="418" y="252" width="186" height="112" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="511" y="294" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">플러그인 바이너리</text>
<text x="511" y="320" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" fill="#8B98A9">/opt/cni/bin/bridge</text>
<text x="511" y="342" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#5E6B7E">그냥 실행 파일이다</text>

<line x1="608" y1="308" x2="646" y2="308" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>

<rect x="652" y="238" width="316" height="140" rx="8" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.4"/>
<text x="670" y="262" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">돌려주는 값 · stdout JSON</text>
<text x="670" y="290" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" fill="#F5F5F3">ips:    10.1.3.7/24</text>
<text x="670" y="312" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" fill="#F5F5F3">routes: 0.0.0.0/0 → 10.1.3.1</text>
<text x="670" y="334" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" fill="#F5F5F3">dns:    …</text>
<text x="670" y="360" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#5E6B7E">이 주소가 Pod 의 eth0 에 붙는다</text>

<text x="36" y="490" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" fill="#8B98A9">2장 실습에서 손으로 친 것과 같은 일이다. 네임스페이스를 지정하고, 그 안에 인터페이스를 만들고, 주소와 기본 경로를 넣는다</text>
<line x1="12" y1="514" x2="952" y2="514" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="528" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="538" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#8B98A9">호출마다 바뀌는 입력</text>
<rect x="290" y="528" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="312" y="538" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" fill="#8B98A9">플러그인이 정해 돌려주는 값</text>
</svg>

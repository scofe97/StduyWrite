<title id="dt">송신은 감싸며 내려가고 수신은 벗기며 올라간다</title><desc id="dd">OSI 캡슐화의 왕복. 송신 호스트는 계층을 내려가며 헤더를 하나씩 붙여 PDU를 키우고, 수신 호스트는 같은 순서를 거꾸로 밟으며 그 헤더를 벗긴다. 가운데 물리 매체는 자기가 나르는 비트가 어느 계층의 것인지 알지 못한다.</desc>
<rect width="916" height="652" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ENCAPSULATION · 01-01 OSI</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">송신은 감싸며 내려가고 수신은 벗기며 올라간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">각 계층은 자기가 붙인 헤더만 읽습니다 — 위아래가 무엇을 담았는지는 몰라도 됩니다.</text>
<text x="177.0" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">송신 호스트 — 감싼다 (encapsulate)</text>
<text x="703.0" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">수신 호스트 — 벗긴다 (decapsulate)</text>

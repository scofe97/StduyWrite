<svg viewBox="0 0 960 540" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>EKS의 두 VPC 구조와 통신 경로</title>
  <desc>컨트롤 플레인(API 서버·etcd)은 EKS 소유 VPC에, 워커 노드와 Pod는 고객 VPC에 있으며 cross-account ENI가 둘을 잇는다. Kubelet은 클러스터 엔드포인트로 등록하고 컨트롤 플레인은 관리 ENI로 노드에 접근한다</desc>
  <defs>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#0d0d0d"/>

  <text x="480" y="38" text-anchor="middle" fill="#e8e4df" font-size="20" font-weight="700">EKS — 두 VPC와 통신 경로</text>

  <!-- EKS 소유 VPC -->
  <rect x="40" y="80" width="340" height="280" rx="10" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="210" y="108" text-anchor="middle" fill="rgb(212,168,83)" font-size="15" font-weight="700">EKS 소유 VPC (컨트롤 플레인)</text>
  <rect x="70" y="130" width="130" height="44" rx="6" fill="rgb(212,168,83)"/>
  <text x="135" y="157" text-anchor="middle" fill="#0d0d0d" font-size="13" font-weight="700">API 서버</text>
  <rect x="220" y="130" width="130" height="44" rx="6" fill="rgb(212,168,83)"/>
  <text x="285" y="157" text-anchor="middle" fill="#0d0d0d" font-size="13" font-weight="700">etcd</text>
  <rect x="70" y="192" width="280" height="44" rx="6" fill="rgb(212,168,83)"/>
  <text x="210" y="219" text-anchor="middle" fill="#0d0d0d" font-size="13" font-weight="700">API 엔드포인트 로드밸런서</text>
  <text x="210" y="264" text-anchor="middle" fill="rgb(138,133,128)" font-size="11">모드에 따라 public 서브넷 또는</text>
  <text x="210" y="280" text-anchor="middle" fill="rgb(138,133,128)" font-size="11">VPC 내 사설 IP로 해석</text>

  <!-- 고객 VPC -->
  <rect x="560" y="80" width="360" height="360" rx="10" fill="#0d0d0d" stroke="#66bb6a" stroke-width="2"/>
  <text x="740" y="108" text-anchor="middle" fill="#66bb6a" font-size="15" font-weight="700">고객 VPC (워커 노드·Pod)</text>
  <rect x="590" y="130" width="145" height="44" rx="6" fill="#5b9bd5"/>
  <text x="662" y="150" text-anchor="middle" fill="#e8e4df" font-size="12" font-weight="700">워커 노드 1</text>
  <text x="662" y="166" text-anchor="middle" fill="#e8e4df" font-size="10">Kubelet</text>
  <rect x="745" y="130" width="145" height="44" rx="6" fill="#5b9bd5"/>
  <text x="817" y="150" text-anchor="middle" fill="#e8e4df" font-size="12" font-weight="700">워커 노드 2</text>
  <text x="817" y="166" text-anchor="middle" fill="#e8e4df" font-size="10">Kubelet</text>
  <rect x="590" y="192" width="90" height="38" rx="6" fill="#cdeccf"/>
  <text x="635" y="216" text-anchor="middle" fill="#14521d" font-size="12">Pod A</text>
  <rect x="695" y="192" width="90" height="38" rx="6" fill="#cdeccf"/>
  <text x="740" y="216" text-anchor="middle" fill="#14521d" font-size="12">Pod B</text>
  <rect x="800" y="192" width="90" height="38" rx="6" fill="#cdeccf"/>
  <text x="845" y="216" text-anchor="middle" fill="#14521d" font-size="12">Pod C</text>
  <text x="740" y="262" text-anchor="middle" fill="rgb(138,133,128)" font-size="11">Pod IP = VPC CIDR의 ENI 보조 IP (AWS VPC CNI)</text>
  <rect x="590" y="286" width="300" height="40" rx="6" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="740" y="311" text-anchor="middle" fill="#e8e4df" font-size="12">public 서브넷 — NAT GW · IGW</text>
  <rect x="590" y="338" width="300" height="40" rx="6" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="740" y="363" text-anchor="middle" fill="#e8e4df" font-size="12">EKS 관리 cross-account ENI (최대 4)</text>

  <!-- 통신 화살표 -->
  <line x1="590" y1="152" x2="388" y2="152" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="470" y="140" text-anchor="middle" fill="#66bb6a" font-size="11">① Kubelet이 클러스터 엔드포인트에 등록</text>
  <line x1="384" y1="352" x2="586" y2="356" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="480" y="340" text-anchor="middle" fill="rgb(212,168,83)" font-size="11">② 컨트롤 플레인 → 노드 (관리 ENI 경유)</text>

  <!-- 사용자 -->
  <text x="120" y="420" text-anchor="middle" fill="rgb(138,133,128)" font-size="12">kubectl 사용자</text>
  <line x1="150" y1="404" x2="196" y2="366" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="480" y="470" text-anchor="middle" fill="rgb(138,133,128)" font-size="12">앱 사용자 → 고객 VPC의 LB·ingress로 접근</text>

  <text x="480" y="516" text-anchor="middle" fill="rgb(138,133,128)" font-size="13">네트워크 모드 — public(기본, 엔드포인트 인터넷 노출) · private(VPC 안으로 한정) · mixed(둘 다)</text>
</svg>

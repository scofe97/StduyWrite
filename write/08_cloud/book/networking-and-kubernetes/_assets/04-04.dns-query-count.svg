<title id="dt">리졸버가 다르면 같은 이름의 질의 수가 달라집니다</title><desc id="dd">이름 하나가 내보내는 DNS 질의 수. demo-db 는 2026-09 curl 로 5개, 2026-11-08 getent 로 2개였고 curl 을 세 번 재면 5, 2, 2 로 흔들렸다. github.com 은 두 도구 모두 8개였고 curl 은 8, 10, 10 이었다. github.com. 은 2개, demo-db.polylab.svc.cluster.local 은 8개였다.</desc>

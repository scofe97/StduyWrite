<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">총 질의 수는 A 와 AAAA 를 더한 값이고 ndots:5 라서 점이 다섯 개 미만이면 검색 경로를 먼저 붙입니다</text>

<title id="dt">VXLAN — 경계를 못 넘는 프레임을 넘게 하는 법</title><desc id="dd">L2 프레임을 UDP 페이로드로 감싸면 라우터에게는 평범한 IP 트래픽으로 보인다</desc>
<rect width="1000" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">VXLAN · WRAP -&gt; CROSS -&gt; UNWRAP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">VXLAN — 경계를 못 넘는 프레임을 넘게 하는 법</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">L2 프레임을 UDP 페이로드로 감싸면 라우터에게는 평범한 IP 트래픽으로 보인다</text>
<rect x="24" y="104" width="952" height="380" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">껍데기가 붙었다 벗겨진다 — 속의 프레임은 한 번도 손대지 않는다</text>
<text x="152" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">(1) 노드 A 안에서</text>
<text x="384" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">(2) 감싼다</text>
<text x="616" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">(3) IP 망을 건넌다</text>
<text x="848" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">(4) 노드 B 안에서</text>
<rect x="86" y="264" width="132" height="48" rx="5" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="152" y="286" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">L2 프레임</text>
<text x="152" y="303" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">Pod -&gt; Pod</text>
<rect x="304" y="226" width="160" height="124" rx="7" fill="#F08A590A" stroke="#F08A59" stroke-width="1.4"/>
<text x="384" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">IP · UDP · VXLAN 봉투</text>
<rect x="318" y="280" width="132" height="48" rx="5" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="384" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">L2 프레임</text>
<text x="384" y="319" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">Pod -&gt; Pod</text>
<rect x="536" y="226" width="160" height="124" rx="7" fill="#6A95D80A" stroke="#6A95D8" stroke-width="1.2"/>
<text x="616" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">겉만 읽힌다</text>
<rect x="550" y="280" width="132" height="48" rx="5" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="616" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">L2 프레임</text>
<text x="616" y="319" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">Pod -&gt; Pod</text>
<rect x="782" y="264" width="132" height="48" rx="5" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="848" y="286" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">L2 프레임</text>
<text x="848" y="303" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">Pod -&gt; Pod</text>
<text x="152" y="376" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">경계를 못 넘는다</text>
<text x="384" y="376" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">봉투가 붙는다</text>
<text x="616" y="376" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">라우터에겐 평범한 IP</text>
<text x="848" y="376" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">그대로 나온다</text>
<path d="M 228 288 L 292 288" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="261" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">넣는다</text>
<path d="M 474 288 L 524 288" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="500" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">봉함된 채</text>
<path d="M 706 288 L 770 288" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="739" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">꺼낸다</text>
<text x="36" y="448" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">VLAN 이 가두는 기술이라면 VXLAN 은 잇는 기술이다 — 떨어진 노드의 Pod 들이 같은 L2 에 있는 것처럼 통신하는 바닥이 이 봉함이다</text>
<line x1="12" y1="504" x2="952" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="526" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="516" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">겉봉 · 라우터가 읽는 부분</text>
<rect x="339" y="516" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="361" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">감싸는 순간</text>
</svg>
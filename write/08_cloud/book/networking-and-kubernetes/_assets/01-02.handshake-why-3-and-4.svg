<title id="dt">확인할 것은 양쪽 모두 넷 — 합쳐지느냐가 갈랐다</title><desc id="dd">TCP 연결을 열 때 3번, 닫을 때 4번인 이유. 확인해야 할 항목은 양쪽 모두 네 개로 같지만, 열 때는 가운데 두 항목이 한 패킷(SYN-ACK)에 실려 셋이 되고 닫을 때는 각자 남아 넷이 된다.</desc>
<rect width="938" height="530" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPARISON · 01-02 HANDSHAKE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">확인할 것은 양쪽 모두 넷 — 합쳐지느냐가 갈랐다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">횟수가 갈리는 것은 확인할 것이 달라서가 아니라 합쳐지느냐 아니냐에서입니다.</text>
<rect x="12" y="112" width="250" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="137.0" y="139" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">확인해야 할 것</text>
<rect x="276" y="112" width="300" height="44" rx="6" fill="#3FB98C18" stroke="#3FB98C" stroke-width="1.2"/>
<text x="426.0" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">열 때 — 3-way</text>
<text x="426.0" y="149" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">셋으로 줄어든다</text>
<rect x="590" y="112" width="300" height="44" rx="6" fill="#E3B34118" stroke="#E3B341" stroke-width="1.2"/>
<text x="740.0" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">닫을 때 — 4-way</text>
<text x="740.0" y="149" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">넷 그대로</text>
<rect x="12" y="176" width="250" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="26" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">1. 내 말이 가는지</text>
<rect x="590" y="176" width="300" height="64" rx="6" fill="#E3B3410E" stroke="#E3B341" stroke-width="0.9"/>
<text x="740.0" y="206" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">FIN</text>
<text x="740.0" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">내가 FIN</text>
<rect x="12" y="250" width="250" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="26" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">2. 그 답이 오는지</text>
<rect x="590" y="250" width="300" height="64" rx="6" fill="#E3B3410E" stroke="#E3B341" stroke-width="0.9"/>
<text x="740.0" y="280" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">ACK</text>
<text x="740.0" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">상대가 ACK</text>
<rect x="12" y="324" width="250" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="26" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">3. 상대 말이 오는지</text>
<rect x="590" y="324" width="300" height="64" rx="6" fill="#E3B3410E" stroke="#E3B341" stroke-width="0.9"/>
<text x="740.0" y="354" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">FIN</text>
<text x="740.0" y="372" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">상대가 FIN</text>
<rect x="12" y="398" width="250" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="26" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">4. 내 답이 가는지</text>
<rect x="590" y="398" width="300" height="64" rx="6" fill="#E3B3410E" stroke="#E3B341" stroke-width="0.9"/>
<text x="740.0" y="428" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">ACK</text>
<text x="740.0" y="446" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">내가 ACK</text>
<rect x="276" y="176" width="300" height="64" rx="6" fill="#3FB98C0E" stroke="#3FB98C" stroke-width="0.9"/>
<text x="426.0" y="206" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">SYN</text>
<text x="426.0" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">내가 SYN</text>
<rect x="276" y="250" width="300" height="138" rx="6" fill="#F08A5916" stroke="#F08A59" stroke-width="1.6"/>
<text x="426.0" y="311.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F08A59">SYN-ACK</text>
<text x="426.0" y="331.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">2·3번이 한 패킷에 실린다</text>
<rect x="276" y="398" width="300" height="64" rx="6" fill="#3FB98C0E" stroke="#3FB98C" stroke-width="0.9"/>
<text x="426.0" y="428" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">ACK</text>
<text x="426.0" y="446" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">내가 ACK</text>
<path d="M 266 282.0 L 272 282.0 L 272 356.0 L 266 356.0" fill="none" stroke="#F08A59" stroke-width="1.4"/>
<rect x="248.5" y="310.0" width="41.0" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="269.0" y="323.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#F08A59">합쳐짐</text>
<line x1="12" y1="486" x2="890" y2="486" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="508" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="498" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">개별 패킷</text>
<rect x="209" y="498" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">한 패킷으로 병합</text>
<rect x="370" y="498" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="392" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">닫을 때는 못 합침</text>
</svg>
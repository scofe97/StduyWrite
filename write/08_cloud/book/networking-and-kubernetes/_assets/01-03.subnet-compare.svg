<title id="dt">서브넷은 마스크가 자른 앞자리로 정해진다</title><desc id="dd">서브넷 판단은 뺄셈이나 검색이 아니라 한 번의 대조다. 내 주소와 목적지 주소에 각각 마스크를 씌워 앞자리만 남기고 그 둘이 같은지만 본다.</desc>

<svg viewBox="0 0 640 400" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>GCP·Azure와 3사 비교 전체 지도</title>
  <desc>GCP 와 Azure 를 각각 네트워크와 관리형 Kubernetes 두 층으로 나눠 보고, 마지막에 AWS 까지 셋을 한 표로 접습니다. 두 줄기는 순서가 없는 병렬이며 각각 그 클라우드의 기본값이 무엇을 바꾸는지를 다룹니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10.5px; }
    .sec { fill: #3a3632; font-size: 10px; font-weight: 700; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .num { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10.5px; }
    .head { fill: #e8e4df; font-size: 12px; font-weight: 700; }
    .caution-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .caution-detail { fill: #0d0d0d; font-size: 10.5px; }
  </style>

  <rect width="640" height="400" fill="#0d0d0d"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <text class="hint" x="320" y="24" text-anchor="middle">같은 문제, 다른 기본값</text>

  <!-- 두 줄기 제목 -->
  <text class="head" x="170" y="52" text-anchor="middle">GCP — 글로벌이 기본</text>
  <text class="head" x="470" y="52" text-anchor="middle">Azure — 열린 기본 라우트</text>

  <!-- GCP 1 -->
  <text class="num" x="24" y="90">1.</text>
  <rect class="box" x="44" y="66" width="252" height="52" rx="4"/>
  <text class="box-title" x="62" y="88">VPC 가 글로벌 자원</text>
  <text class="box-detail" x="62" y="106">방화벽 · 라우트도 글로벌</text>
  <text class="sec" x="278" y="88" text-anchor="end">§1</text>

  <path class="arrow" d="M170,118 L170,136" marker-end="url(#ah)"/>

  <!-- GCP 2 -->
  <text class="num" x="24" y="164">2.</text>
  <rect class="box" x="44" y="140" width="252" height="52" rx="4"/>
  <text class="box-title" x="62" y="162">GKE — VPC-native</text>
  <text class="box-detail" x="62" y="180">NEG 로 Pod 직결 LB</text>
  <text class="sec" x="278" y="162" text-anchor="end">§2</text>

  <!-- Azure 3 — 주의 -->
  <text class="num" x="324" y="90">3.</text>
  <rect x="344" y="66" width="252" height="52" rx="4" fill="rgb(212,168,83)"/>
  <text class="caution-title" x="362" y="88">주의 · 기본이 열려 있다</text>
  <text class="caution-detail" x="362" y="106">인터넷행 기본 라우트</text>
  <text class="sec" x="578" y="88" text-anchor="end">§3</text>

  <path class="arrow" d="M470,118 L470,136" marker-end="url(#ah)"/>

  <!-- Azure 4 -->
  <text class="num" x="324" y="164">4.</text>
  <rect class="box" x="344" y="140" width="252" height="52" rx="4"/>
  <text class="box-title" x="362" y="162">AKS — kubenet 대 CNI</text>
  <text class="box-detail" x="362" y="180">Pod IP 가 라우터블인가</text>
  <text class="sec" x="578" y="162" text-anchor="end">§4</text>

  <!-- 합류 -->
  <path class="arrow" d="M170,192 L170,222 L320,222 L320,244" marker-end="url(#ah)"/>
  <path class="arrow" d="M470,192 L470,222 L320,222" />

  <!-- 5. 비교표 -->
  <text class="num" x="24" y="278">5.</text>
  <rect class="box" x="44" y="250" width="552" height="56" rx="4"/>
  <text class="box-title" x="62" y="274">3사 비교 — 한 표로 접기</text>
  <text class="box-detail" x="62" y="292">서브넷 경계가 셋 다 다르다</text>
  <text class="sec" x="578" y="274" text-anchor="end">§5</text>

  <path class="arrow" d="M320,306 L320,326" marker-end="url(#ah)"/>

  <rect class="box" x="120" y="332" width="400" height="46" rx="4"/>
  <text class="box-title" x="140" y="350">IP 설계가 곧 용량 설계</text>
  <text class="box-detail" x="140" y="368">두 공식이 같은 교훈</text>
</svg>

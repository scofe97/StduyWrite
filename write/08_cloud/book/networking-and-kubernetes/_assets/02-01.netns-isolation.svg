<title id="dt">네트워크 네임스페이스 격리 — struct net 안에 따로, 전역 표는 소속으로 가른다</title><desc id="dd">열은 네임스페이스 셋, 행은 자료구조다. 인터페이스·라우팅·netfilter 는 네임스페이스마다 struct net 안에 한 벌씩 있고, 소켓 해시와 ARP 이웃 테이블은 커널 전체가 한 벌을 쓴다. 소켓 항목은 소속 네임스페이스 표식으로, ARP 항목은 매달린 장치로 가른다. 세 네임스페이스가 같은 8080, 두 Pod 가 같은 10.244.1.1 과 eth0 을 가져도 소속이 달라 부딪치지 않는다.</desc>

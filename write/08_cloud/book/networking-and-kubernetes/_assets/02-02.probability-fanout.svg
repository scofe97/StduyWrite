<text x="574" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">KUBE-SEP-R4KM…</text>
<text x="574" y="436" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">DNAT 10.244.1.67:8080</text>
<text x="922" y="426" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">최종 몫 1/3</text>
<rect x="558" y="474" width="380" height="72" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>

<title id="dt">KUBE-SVC 체인을 위에서부터 — 마킹 규칙이 먼저이고 확률은 그 다음이다</title><desc id="dd">확률은 0.333 · 0.5 · 무조건으로 다르지만 최종 몫은 셋 다 1/3 이다. 앞 규칙이 빗나간 만큼만 남기 때문이다.</desc>
<rect width="1000" height="680" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBE-SVC · PROBABILITY FANOUT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">KUBE-SVC 체인을 위에서부터 — 마킹 규칙이 먼저이고 확률은 그 다음이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">확률은 셋 다 다른데 최종 몫은 같다 — 앞이 빗나간 만큼만 남기 때문이다</text>
<rect x="24" y="104" width="952" height="512" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">확률이 다른 이유는 앞 규칙이 걸러 간 뒤의 남은 몫을 나누기 때문이다</text>
<rect x="40" y="196" width="408" height="380" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="56" y="187" width="267" height="18" fill="#0D1117"/>
<text x="66" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">KUBE-SVC-LOLE4ISW44XBNF3G — 위에서부터 평가</text>
<rect x="530" y="254" width="430" height="322" rx="8" fill="#F08A5906" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="546" y="245" width="224" height="18" fill="#0D1117"/>
<text x="556" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">KUBE-SEP 체인 — 여기서 목적지가 바뀐다</text>
<rect x="44" y="210" width="400" height="72" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="60" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">첫 규칙은 마킹</text>
<text x="60" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">! -s 10.244.0.0/16</text>

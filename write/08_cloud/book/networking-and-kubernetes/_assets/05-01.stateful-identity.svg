<title id="dt">이름은 headless Service 에서 두 갈래로 갈린다</title><desc id="dd">StatefulSet 이 준 ordinal 이 headless Service 를 지나면서 Pod 별 레코드와 서비스 레코드 두 갈래가 된다. 일반 ClusterIP 를 적으면 위 갈래가 아예 생기지 않는다.</desc>
<rect width="1000" height="572" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">STATEFULSET · WHERE THE NAME FORKS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름은 headless Service 에서 두 갈래로 갈린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">ordinal → headless Service → Pod 를 지목하는 이름과 서비스 전체를 부르는 이름</text>
<rect x="24" y="104" width="952" height="400" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">갈래가 둘이라 클라이언트가 고를 수 있다 — 지목할지, 전체를 부를지</text>
<rect x="28" y="276" width="180" height="108" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="118" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">StatefulSet</text>
<text x="118" y="334" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">postgres · replicas 2</text>
<text x="118" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">ordinal 0 · 1</text>
<rect x="290" y="276" width="220" height="108" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="400" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">headless Service</text>
<text x="400" y="334" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">clusterIP: None</text>
<text x="400" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">spec.serviceName · 필수</text>
<path d="M 212 330 L 286 330" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="249" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이름을 맡긴다</text>
<rect x="570" y="192" width="380" height="96" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="760" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">Pod 별 레코드</text>
<text x="760" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">postgres-0.postgres.default.svc…</text>
<text x="760" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">10.244.1.3 — 멤버를 지목한다</text>
<rect x="570" y="372" width="380" height="96" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="760" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">서비스 레코드</text>
<text x="760" y="424" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">postgres.default.svc.cluster.local</text>
<text x="760" y="446" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">10.105.214.153 — 전체를 부른다</text>
<path d="M 514 306 L 552 306 L 552 240 L 566 240" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 514 354 L 552 354 L 552 420 L 566 420" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="36" y="484" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">일반 ClusterIP 를 적으면 이름이 서비스 VIP 로만 풀려 위 갈래가 생기지 않는다 — Pod 별 정체성이 사라진다</text>
<line x1="12" y1="520" x2="952" y2="520" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="542" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="532" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">멤버를 지목하는 이름</text>
<rect x="287" y="532" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전체를 부르는 이름</text>
<rect x="461" y="532" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="483" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">없으면 위 갈래가 없다</text>
</svg>
<title id="dt">커널이 문구를 던지고 내가 고치기를 세 번 반복했다</title><desc id="dd">실패할 때마다 커널이 다른 문구를 냈고, 문구마다 볼 테이블이 달랐습니다. 한 번에 하나씩 좁혀 세 번 만에 통했습니다.</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">REPAIR JOURNEY · THREE ROUNDS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널이 문구를 던지고 내가 고치기를 세 번 반복했다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">문구가 바뀔 때마다 파야 할 자리도 바뀐다</text>
<rect x="40" y="202" width="920" height="132" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<line x1="200" y1="202" x2="200" y2="334" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="60" y="262" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">커널이 말한 것</text>
<text x="60" y="284" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">관측</text>
<rect x="40" y="346" width="920" height="132" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<line x1="200" y1="346" x2="200" y2="478" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="60" y="406" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">내가 한 것</text>
<text x="60" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">조치</text>

<svg viewBox="0 0 920 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>3사 클라우드 네트워킹 비교 — 같은 문제, 다른 기본값</title>
  <desc>AWS는 VPC가 리전 자원이고 서브넷이 단일 AZ에 묶인다. Azure는 Vnet이 리전 자원이지만 서브넷이 AZ를 가로지르고 기본 인터넷 라우트가 열려 있다. GCP는 VPC·방화벽·라우트가 글로벌 자원이고 서브넷이 리전 단위다. 세 클라우드는 같은 관리형 쿠버네티스 네트워킹 문제를 다른 기본값으로 푼다</desc>
  <rect x="0" y="0" width="920" height="470" fill="#0d0d0d"/>

  <text x="460" y="32" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">3사 클라우드 네트워킹 — 같은 문제, 다른 기본값</text>

  <!-- 열 헤더 -->
  <rect x="40" y="56" width="200" height="34" rx="5" fill="#f5edda"/>
  <text x="140" y="79" text-anchor="middle" font-size="14" style="fill:#0d0d0d" font-weight="700">AWS</text>
  <rect x="360" y="56" width="200" height="34" rx="5" fill="#dceaf7"/>
  <text x="460" y="79" text-anchor="middle" font-size="14" style="fill:#10243a" font-weight="700">Azure</text>
  <rect x="680" y="56" width="200" height="34" rx="5" fill="#e6f7e7"/>
  <text x="780" y="79" text-anchor="middle" font-size="14" style="fill:#14521d" font-weight="700">GCP</text>

  <!-- 행 라벨 왼쪽 -->
  <text x="20" y="118" fill="#8a8580" font-size="11" font-weight="700">가상망</text>
  <text x="20" y="168" fill="#8a8580" font-size="11" font-weight="700">범위</text>
  <text x="20" y="218" fill="rgb(212,168,83)" font-size="10" font-weight="700">서브넷경계</text>
  <text x="20" y="268" fill="#8a8580" font-size="11" font-weight="700">라우팅 범위</text>
  <text x="20" y="318" fill="rgb(212,168,83)" font-size="11" font-weight="700">기본 라우트</text>
  <text x="20" y="368" fill="#8a8580" font-size="11" font-weight="700">관리형 K8s</text>

  <!-- AWS 열 -->
  <text x="140" y="118" text-anchor="middle" fill="#e8e4df" font-size="12">VPC</text>
  <text x="140" y="168" text-anchor="middle" fill="#e8e4df" font-size="12">리전</text>
  <rect x="60" y="200" width="160" height="24" rx="4" fill="#fdf3df"/>
  <text x="140" y="217" text-anchor="middle" font-size="11" style="fill:#0d0d0d" font-weight="700">존(단일 AZ)</text>
  <text x="140" y="268" text-anchor="middle" fill="#e8e4df" font-size="12">서브넷</text>
  <text x="140" y="318" text-anchor="middle" fill="#8a8580" font-size="11">닫힘(명시 개방)</text>
  <text x="140" y="368" text-anchor="middle" fill="#e8e4df" font-size="12">EKS</text>

  <!-- Azure 열 -->
  <text x="460" y="118" text-anchor="middle" fill="#e8e4df" font-size="12">Vnet</text>
  <text x="460" y="168" text-anchor="middle" fill="#e8e4df" font-size="12">리전</text>
  <rect x="380" y="200" width="160" height="24" rx="4" fill="#fdf3df"/>
  <text x="460" y="217" text-anchor="middle" font-size="11" style="fill:#0d0d0d" font-weight="700">리전(AZ 가로지름)</text>
  <text x="460" y="268" text-anchor="middle" fill="#e8e4df" font-size="12">서브넷</text>
  <rect x="380" y="300" width="160" height="24" rx="4" fill="#f2d4d4"/>
  <text x="460" y="317" text-anchor="middle" font-size="11" style="fill:#7a1f1f" font-weight="700">열림(기본 인터넷)</text>
  <text x="460" y="368" text-anchor="middle" fill="#e8e4df" font-size="12">AKS</text>

  <!-- GCP 열 -->
  <text x="780" y="118" text-anchor="middle" fill="#e8e4df" font-size="12">VPC</text>
  <rect x="700" y="150" width="160" height="24" rx="4" fill="#cdeccf"/>
  <text x="780" y="167" text-anchor="middle" font-size="11" style="fill:#14521d" font-weight="700">글로벌</text>
  <rect x="700" y="200" width="160" height="24" rx="4" fill="#fdf3df"/>
  <text x="780" y="217" text-anchor="middle" font-size="11" style="fill:#0d0d0d" font-weight="700">리전</text>
  <rect x="700" y="250" width="160" height="24" rx="4" fill="#cdeccf"/>
  <text x="780" y="267" text-anchor="middle" font-size="11" style="fill:#14521d" font-weight="700">VPC(글로벌)</text>
  <text x="780" y="318" text-anchor="middle" fill="#8a8580" font-size="11">닫힘</text>
  <text x="780" y="368" text-anchor="middle" fill="#e8e4df" font-size="12">GKE</text>

  <!-- 행 구분선 -->
  <line x1="40" y1="132" x2="880" y2="132" stroke="#2a2520" stroke-width="0.7"/>
  <line x1="40" y1="182" x2="880" y2="182" stroke="#2a2520" stroke-width="0.7"/>
  <line x1="40" y1="232" x2="880" y2="232" stroke="#2a2520" stroke-width="0.7"/>
  <line x1="40" y1="282" x2="880" y2="282" stroke="#2a2520" stroke-width="0.7"/>
  <line x1="40" y1="332" x2="880" y2="332" stroke="#2a2520" stroke-width="0.7"/>

  <!-- 하단 요약 -->
  <line x1="40" y1="392" x2="880" y2="392" stroke="#3a3530" stroke-width="1"/>
  <text x="460" y="416" text-anchor="middle" fill="rgb(212,168,83)" font-size="13" font-weight="700">핵심 두 축 — 서브넷 경계(존/리전/리전)와 기본 라우트(Azure만 기본 열림)</text>
  <text x="460" y="440" text-anchor="middle" fill="#8a8580" font-size="11">GCP만 가상망·라우팅이 글로벌 · Azure만 새 자원이 기본적으로 인터넷과 통신(NSG·UDR로 잠가야)</text>
  <text x="460" y="460" text-anchor="middle" fill="#8a8580" font-size="10">셋 다 "관리형 K8s에서 IP 설계가 곧 용량 설계" — Pod IP 라우터블 여부가 EKS·GKE·AKS 공통 선택</text>
</svg>

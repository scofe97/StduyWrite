<svg viewBox="0 0 960 600" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>OSI 7계층과 TCP/IP 4계층의 대응과 캡슐화</title>
  <desc>왼쪽 OSI 7계층이 오른쪽 TCP/IP 계층으로 어떻게 합쳐지는지와, 각 계층의 PDU(Data, Segment, Packet, Frame, Bit), 송신 시 캡슐화·수신 시 역캡슐화 방향을 보여 주는 도식</desc>
  <defs>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#0d0d0d"/>

  <text x="480" y="38" text-anchor="middle" fill="#e8e4df" font-size="20" font-weight="700">OSI 7계층 ↔ TCP/IP 계층 대응과 PDU</text>

  <!-- 열 제목 -->
  <text x="180" y="76" text-anchor="middle" fill="rgb(138,133,128)" font-size="14">OSI 모델</text>
  <text x="415" y="76" text-anchor="middle" fill="rgb(138,133,128)" font-size="14">PDU</text>
  <text x="650" y="76" text-anchor="middle" fill="rgb(138,133,128)" font-size="14">TCP/IP 모델</text>

  <!-- OSI 계층 박스 (배경색 + 테두리, 밝은 글자) -->
  <rect x="60" y="90" width="240" height="56" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="84" y="124" fill="#e8e4df" font-size="16">7  Application</text>
  <rect x="60" y="154" width="240" height="56" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="84" y="188" fill="#e8e4df" font-size="16">6  Presentation</text>
  <rect x="60" y="218" width="240" height="56" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="84" y="252" fill="#e8e4df" font-size="16">5  Session</text>
  <rect x="60" y="282" width="240" height="56" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="84" y="316" fill="#e8e4df" font-size="16">4  Transport</text>
  <rect x="60" y="346" width="240" height="56" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="84" y="380" fill="#e8e4df" font-size="16">3  Network</text>
  <rect x="60" y="410" width="240" height="56" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="84" y="444" fill="#e8e4df" font-size="16">2  Data Link</text>
  <rect x="60" y="474" width="240" height="56" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="84" y="508" fill="#e8e4df" font-size="16">1  Physical</text>

  <!-- PDU 라벨 -->
  <text x="415" y="124" text-anchor="middle" fill="#e8e4df" font-size="14">Data</text>
  <text x="415" y="188" text-anchor="middle" fill="#e8e4df" font-size="14">Data</text>
  <text x="415" y="252" text-anchor="middle" fill="#e8e4df" font-size="14">Data</text>
  <text x="415" y="310" text-anchor="middle" fill="#e8e4df" font-size="14">Segment</text>
  <text x="415" y="328" text-anchor="middle" fill="rgb(138,133,128)" font-size="12">Datagram</text>
  <text x="415" y="380" text-anchor="middle" fill="#e8e4df" font-size="14">Packet</text>
  <text x="415" y="444" text-anchor="middle" fill="#e8e4df" font-size="14">Frame</text>
  <text x="415" y="508" text-anchor="middle" fill="#e8e4df" font-size="14">Bit</text>

  <!-- 대응 안내선 (OSI 상위 3계층 → TCP/IP Application) -->
  <line x1="300" y1="118" x2="520" y2="150" stroke="rgb(42,37,32)" stroke-width="1"/>
  <line x1="300" y1="182" x2="368" y2="182" stroke="rgb(42,37,32)" stroke-width="1"/>
  <line x1="462" y1="182" x2="520" y2="182" stroke="rgb(42,37,32)" stroke-width="1"/>
  <line x1="300" y1="246" x2="520" y2="214" stroke="rgb(42,37,32)" stroke-width="1"/>

  <!-- TCP/IP 계층 박스 (밝은 채움 + 어두운 글자, 파랑만 흰 글자) -->
  <rect x="520" y="90" width="260" height="184" rx="8" fill="rgb(212,168,83)"/>
  <text x="650" y="172" text-anchor="middle" fill="#0d0d0d" font-size="17" font-weight="700">Application</text>
  <text x="650" y="196" text-anchor="middle" fill="#1a1a1a" font-size="12">HTTP · DNS · SSH (RFC로 정의)</text>

  <rect x="520" y="282" width="260" height="56" rx="8" fill="#5b9bd5"/>
  <text x="650" y="308" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">Transport</text>
  <text x="650" y="328" text-anchor="middle" fill="#e8e4df" font-size="12">TCP · UDP · 포트</text>

  <rect x="520" y="346" width="260" height="56" rx="8" fill="#66bb6a"/>
  <text x="650" y="372" text-anchor="middle" fill="#0d0d0d" font-size="17" font-weight="700">Internet</text>
  <text x="650" y="392" text-anchor="middle" fill="#1a1a1a" font-size="12">IP · 라우팅 · MTU</text>

  <rect x="520" y="410" width="260" height="56" rx="8" fill="#f5edda"/>
  <text x="650" y="436" text-anchor="middle" fill="#0d0d0d" font-size="17" font-weight="700">Link</text>
  <text x="650" y="456" text-anchor="middle" fill="#1a1a1a" font-size="12">Ethernet · MAC · ARP</text>

  <rect x="520" y="474" width="260" height="56" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="650" y="500" text-anchor="middle" fill="#e8e4df" font-size="17">Physical</text>
  <text x="650" y="520" text-anchor="middle" fill="rgb(138,133,128)" font-size="12">IEEE 802.3 매체 규격</text>

  <!-- 캡슐화 방향 -->
  <line x1="840" y1="110" x2="840" y2="500" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="856" y="284" fill="rgb(212,168,83)" font-size="13" font-weight="700">송신</text>
  <text x="856" y="302" fill="rgb(212,168,83)" font-size="12">캡슐화</text>
  <line x1="916" y1="500" x2="916" y2="110" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="912" y="332" text-anchor="end" fill="#66bb6a" font-size="13" font-weight="700">수신</text>

  <text x="480" y="576" text-anchor="middle" fill="rgb(138,133,128)" font-size="13">앰버 화살표 = 송신, 헤더를 붙이며 내려감 · 초록 화살표 = 수신, 헤더를 벗기며 올라감</text>
</svg>

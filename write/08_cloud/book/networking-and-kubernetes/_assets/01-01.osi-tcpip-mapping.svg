<title id="dt">OSI 7계층이 TCP/IP 4계층으로 접히는 자리</title><desc id="dd">OSI 7계층과 TCP/IP 4계층의 대응. 상위 3계층(Application·Presentation·Session)이 TCP/IP의 Application 하나로, 하위 2계층(Data Link·Physical)이 Link 하나로 접힌다. Transport와 Network는 1:1로 대응한다.</desc>
<rect width="810" height="638" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LAYER MAPPING · 01-01 OSI</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">OSI 7계층이 TCP/IP 4계층으로 접히는 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위 3개와 아래 2개가 각각 하나로 접힙니다 — 가운데 둘만 1:1로 남습니다.</text>
<text x="162.0" y="100" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">OSI 7계층 — 참조 모델</text>

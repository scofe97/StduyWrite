<title id="dt">3-way 핸드셰이크 — 번호가 양방향으로 한 번씩 오간다</title><desc id="dd">TCP 3-way 핸드셰이크. 클라이언트가 seq=x를 보내면 서버가 ack=x+1로 확인하며 자기 번호 y를 함께 싣고, 클라이언트가 ack=y+1로 답한다. 클라이언트는 세 번째 패킷을 보내며 ESTABLISHED가 되지만 서버는 그 패킷이 도착해야 열린다.</desc>
<rect width="860" height="566" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 01-02 TCP OPEN</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">3-way 핸드셰이크 — 번호가 양방향으로 한 번씩 오간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">2번으로 줄이면 서버의 번호가 확인되지 않은 채 연결이 열립니다.</text>
<rect x="24.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="129.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="129.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">client</text>
<rect x="602.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="707.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서버</text>
<text x="707.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">server</text>
<rect x="677.0" y="154" width="60.0" height="20" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="707.0" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#6A95D8">LISTEN</text>
<rect x="99.0" y="154" width="60.0" height="20" rx="4" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="129.0" y="168" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#5E6B7E">CLOSED</text>
<line x1="129.0" y1="154" x2="129.0" y2="476" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="707.0" y1="154" x2="707.0" y2="476" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 139.0 214 L 695.0 214" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="418.0" y="205" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">SYN  seq=x</text>
<text x="418.0" y="229" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">내 번호 x 를 알린다</text>
<rect x="92.0" y="240" width="74.0" height="20" rx="4" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="129.0" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#E3B341">SYN-SENT</text>
<path d="M 697.0 306 L 141.0 306" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="418.0" y="297" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">SYN-ACK  seq=y, ack=x+1</text>
<text x="418.0" y="321" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">x 확인 + 내 번호 y 를 함께 싣는다</text>
<rect x="656.0" y="332" width="102.0" height="20" rx="4" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="707.0" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#E3B341">SYN-RECEIVED</text>
<path d="M 139.0 398 L 695.0 398" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="418.0" y="389" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">ACK  ack=y+1</text>
<text x="418.0" y="413" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">y 확인</text>
<rect x="81.5" y="430" width="95.0" height="20" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="129.0" y="444" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#3FB98C">ESTABLISHED</text>
<rect x="659.5" y="462" width="95.0" height="20" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="707.0" y="476" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#3FB98C">ESTABLISHED</text>
<text x="430.0" y="440" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">클라이언트가 먼저 열린다</text>
<text x="430.0" y="472" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">서버는 3번째가 도착해야 열린다</text>
<line x1="12" y1="502" x2="812" y2="502" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="524" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="514" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">연결 요청·확인</text>
<rect x="248" y="514" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="270" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">대기 상태</text>
<rect x="357" y="514" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="379" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">번호 두 개가 한 패킷에</text>
</svg>
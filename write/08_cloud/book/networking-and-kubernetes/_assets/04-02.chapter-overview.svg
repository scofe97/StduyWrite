<title id="dt">CNI 가 Pod 를 잇고 kube-proxy 가 서비스 주소를 Pod 주소로 바꿉니다</title><desc id="dd">04-02 의 키워드 개념도. 첫 줄은 CNI 명세 1.1 이 IPAM 에 주소 할당을 맡기고 flat 이나 overlay 로 배선하는 흐름이다. 둘째 줄은 4대 CNI 가 conflist 로 선택되고 Cilium 이 교체 사례가 되는 흐름이다. 셋째 줄은 EndpointSlice 의 명단을 kube-proxy 모드가 읽어 KUBE-SEP 체인의 DNAT 로 서비스 주소를 Pod 주소로 바꾸는 흐름이다. 넷째 줄은 아홉 번 확인에서 Calico 경로를 거쳐 끊긴 자리를 찾는 흐름이다.</desc>
<rect width="1000" height="664" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 04-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">CNI 가 Pod 를 잇고 kube-proxy 가 서비스 주소를 Pod 주소로 바꿉니다</text>

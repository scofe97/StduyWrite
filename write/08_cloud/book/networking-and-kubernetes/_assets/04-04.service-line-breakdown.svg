<title id="dt">서비스 하나의 11줄은 체인 셋에 나뉘어 있습니다</title><desc id="dd">default/web 서비스 하나가 노드마다 만드는 iptables 규칙 11줄의 분해. 진입 줄 1개, 서비스 체인 4줄(마킹 1, 확률 2, 나머지 1), 엔드포인트 체인 셋의 6줄(체인마다 헤어핀 마킹과 DNAT 두 줄)을 더한 값이다. 확률은 0.33333333349, 0.50000000000, 없음 순이다.</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">TREE · 04-04 SERVICE LINES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서비스 하나의 11줄은 체인 셋에 나뉘어 있습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세 노드가 모두 같은 11줄을 갖습니다</text>

<text x="368.0" y="151.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">1줄</text>
<line x1="486" y1="135.0" x2="523.0" y2="135.0" stroke="#5E6B7E" stroke-width="1.3"/>
<path d="M 523.0 135.0 L 556 135.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>

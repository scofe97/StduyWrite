<title id="dt">연결 하나는 선택 · 방향 · 허용 목록 세 관문을 지난다</title><desc id="dd">정책 demo-db-allow-demo 가 걸린 demo-db 에서 연결 셋이 판정된다. demo 에서 오는 80번 연결은 허용 목록과 맞아 통과하고, other 에서 오는 연결은 목록에 없어 차단되며, demo-db 가 새로 거는 연결은 egress 허용이 없어 차단된다.</desc>
<rect width="1000" height="604" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NetworkPolicy · WHEN IT LOCKS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">연결 하나는 선택 · 방향 · 허용 목록 세 관문을 지난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">선택된 방향은 허용 목록에 있는 연결만 통과합니다</text>
<rect x="24" y="104" width="952" height="76" rx="8" fill="#F08A591F" stroke="#F08A59" stroke-width="1.6"/>
<text x="42" y="132" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">정책 demo-db-allow-demo</text>
<text x="42" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">선택 app=demo-db  ·  방향 Ingress, Egress  ·  ingress 허용 from app=demo, TCP 80  ·  egress 허용 없음</text>
<text x="140" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">연결</text>

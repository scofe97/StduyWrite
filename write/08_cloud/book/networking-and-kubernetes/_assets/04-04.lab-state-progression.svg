<title id="dt">실습이 클러스터를 어느 상태로 밀고 가는가</title><desc id="dd">묶음마다 클러스터가 한 칸씩 옮겨 가고, 오른쪽에 그 자리에서 실제로 본 값을 적는다.</desc>
<rect width="1000" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ch4 LAB · CLUSTER STATE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">실습이 클러스터를 어느 상태로 밀고 가는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">묶음은 명령 더미가 아니라 상태를 옮기는 전이다</text>
<circle cx="239.0" cy="96" r="6" fill="#F5F5F3"/>
<path d="M 239.0 104 L 239.0 118.0" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<rect x="24" y="122.0" width="430" height="60" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="42" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">CNI 가 없다</text>
<text x="42" y="169" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노드 NotReady · CoreDNS Pending</text>
<line x1="500" y1="122.0" x2="500" y2="182.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="518" y="148" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">/etc/cni/net.d 비어 있음</text>
<text x="518" y="169" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노드 셋 다 NotReady · 묶음 1</text>
<path d="M 239.0 182.0 L 239.0 212.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="253.0" y="201.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">helm install cilium  [ipam.mode=kubernetes]</text>
<rect x="24" y="216.0" width="430" height="60" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="42" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">CNI 가 붙었다</text>
<text x="42" y="263" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노드 Ready · podCIDR 를 받는다</text>
<line x1="500" y1="216.0" x2="500" y2="276.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="518" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">10.244.0.0/24 · 10.244.2.0/24 · 10.244.1.0/24</text>
<text x="518" y="263" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">05-cilium.conflist 하나 · 묶음 2</text>
<path d="M 239.0 276.0 L 239.0 306.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="253.0" y="295.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">create deployment web --replicas=3  /  expose</text>
<rect x="24" y="310.0" width="430" height="60" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="42" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">서비스가 규칙이 됐다</text>
<text x="42" y="357" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SVC 체인 하나 + SEP 체인 셋</text>
<line x1="500" y1="310.0" x2="500" y2="370.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="518" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">확률 0.33333333349 → 0.5 → 없음</text>
<text x="518" y="357" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">세 노드 모두 default/web 11줄 · 묶음 3</text>
<path d="M 239.0 370.0 L 239.0 400.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="253.0" y="389.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">rm /tmp/ready  [readinessProbe 실패]</text>
<rect x="24" y="404.0" width="430" height="60" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="42" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">명단에서 빠진다</text>
<text x="42" y="451" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">들어오는 길만 끊긴다</text>
<line x1="500" y1="404.0" x2="500" y2="464.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="518" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">낙하 8초 · 복귀 1~4초</text>
<text x="518" y="451" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SEP 체인이 아예 안 생긴다 · 묶음 4</text>
<path d="M 239.0 464.0 L 239.0 494.0" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)" stroke-dasharray="4 4"/>
<text x="253.0" y="483.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">apply NetworkPolicy  [라벨에 걸린다]</text>
<rect x="24" y="498.0" width="430" height="60" rx="8" fill="#F08A5910" stroke="#F08A59" stroke-width="1.4"/>
<text x="42" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">선택되어 잠긴다</text>
<text x="42" y="545" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">허용한 것만 들어온다</text>
<line x1="500" y1="498.0" x2="500" y2="558.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="518" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">들어오는 쪽 000 5s · 나가는 쪽 bad address</text>
<text x="518" y="545" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정책은 합쳐진다 · 묶음 5</text>
<path d="M 239.0 558.0 L 239.0 572" fill="none" stroke="#5E6B7E" stroke-width="1.4" stroke-dasharray="4 4"/>
<circle cx="239.0" cy="580" r="8" fill="none" stroke="#5E6B7E" stroke-width="1.2"/>
<circle cx="239.0" cy="580" r="5" fill="#5E6B7E"/>
<text x="259.0" y="584" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">묶음 6~8 — 이름 · L7 · 노드 밖 (모두 완료)</text>
<text x="24" y="616" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">네 번째 전이는 되돌릴 수 있다 — touch /tmp/ready 를 다시 하면 세 번째 상태로 돌아온다.</text>
<text x="24" y="636" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">readiness 도 정책도 들어오는 길만 건드린다. 어느 상태에서도 Pod 가 밖으로 나가는 길은 열려 있다.</text>
<line x1="12" y1="654" x2="952" y2="654" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="676" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="666" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="676" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실행해서 값을 본 상태</text>
<rect x="300" y="666" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="322" y="676" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">지금 도달한 자리</text>
<rect x="461" y="666" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="483" y="676" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아직 실행 전</text>
</svg>
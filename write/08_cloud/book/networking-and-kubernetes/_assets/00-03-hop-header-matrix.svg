<svg viewBox="0 0 1000 588" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pj-title pj-desc">
  <title id="pj-title">한 요청이 세 구간을 건너는 동안 헤더가 어떻게 바뀌는가</title>
  <desc id="pj-desc">구간 세 개를 세로 열로, 헤더 네 필드를 가로 행으로 놓은 비교 행렬. MAC 두 줄은 구간마다 값이 바뀌고, 목적지 IP 한 줄만 끝까지 같은 값을 유지한다.</desc>
  <rect width="100%" height="100%" fill="#0D1117"/>
  <text x="60" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">COMPARISON MATRIX</text>
  <text x="60" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">구간을 건널 때마다 무엇이 바뀌고 무엇이 남는가</text>
  <text x="60" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">같은 요청 한 장을 세 구간에서 각각 뜯어 본 것입니다. 네 줄 중 한 줄만 처음 값 그대로 도착합니다.</text>
  <rect x="60" y="132" width="908" height="48" fill="#161B22"/>
  <text x="276" y="162" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">구간 1 · 노트북 → 공유기</text>
  <text x="512" y="162" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">구간 2 · 공유기 → ISP 라우터</text>
  <text x="748" y="162" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">구간 3 · 라우터 → 웹 서버</text>
  <line x1="60" y1="180" x2="968" y2="180" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="76" y="220" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">출발지 MAC</text>
  <text x="276" y="210" fill="#6A95D8" font-size="11" font-family="'Geist Mono', monospace">AA:BB:CC:00:00:01</text>
  <text x="276" y="232" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">내 노트북 NIC</text>
  <text x="512" y="210" fill="#6A95D8" font-size="11" font-family="'Geist Mono', monospace">AA:BB:CC:00:00:02</text>
  <text x="512" y="232" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">공유기 WAN</text>
  <text x="748" y="210" fill="#6A95D8" font-size="11" font-family="'Geist Mono', monospace">AA:BB:CC:00:00:03</text>
  <text x="748" y="232" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">마지막 라우터</text>
  <line x1="60" y1="248" x2="968" y2="248" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="76" y="288" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">목적지 MAC</text>
  <text x="276" y="278" fill="#6A95D8" font-size="11" font-family="'Geist Mono', monospace">AA:BB:CC:00:00:02</text>
  <text x="276" y="300" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">공유기 LAN</text>
  <text x="512" y="278" fill="#6A95D8" font-size="11" font-family="'Geist Mono', monospace">AA:BB:CC:00:00:03</text>
  <text x="512" y="300" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">마지막 라우터</text>
  <text x="748" y="278" fill="#6A95D8" font-size="11" font-family="'Geist Mono', monospace">AA:BB:CC:00:00:04</text>
  <text x="748" y="300" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">웹 서버 NIC</text>
  <line x1="60" y1="316" x2="968" y2="316" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="76" y="356" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">출발지 IP</text>
  <text x="276" y="346" fill="#E3B341" font-size="11" font-family="'Geist Mono', monospace">192.168.0.15</text>
  <text x="276" y="368" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">사설 주소</text>
  <text x="512" y="346" fill="#E3B341" font-size="11" font-family="'Geist Mono', monospace">203.0.113.7</text>
  <text x="512" y="368" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">NAT 이 바꿔 적음</text>
  <text x="748" y="346" fill="#E3B341" font-size="11" font-family="'Geist Mono', monospace">203.0.113.7</text>
  <text x="748" y="368" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">그대로</text>
  <line x1="60" y1="384" x2="968" y2="384" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <rect x="60" y="384" width="908" height="68" fill="rgba(240,138,89,0.12)"/>
  <rect x="60" y="384" width="908" height="68" fill="none" stroke="#F08A59" stroke-width="1.4"/>
  <text x="276" y="414" fill="#3FB98C" font-size="11" font-family="'Geist Mono', monospace">93.184.216.34</text>
  <text x="276" y="436" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">처음부터</text>
  <text x="512" y="414" fill="#3FB98C" font-size="11" font-family="'Geist Mono', monospace">93.184.216.34</text>
  <text x="512" y="436" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">그대로</text>
  <text x="748" y="414" fill="#3FB98C" font-size="11" font-family="'Geist Mono', monospace">93.184.216.34</text>
  <text x="748" y="436" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">끝까지 그대로</text>
  <text x="76" y="424" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">목적지 IP</text>
  <line x1="60" y1="452" x2="968" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="60" y="496" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
  <rect x="200" y="486" width="10" height="10" fill="#6A95D8"/>
  <text x="218" y="496" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">구간마다 새로 쓰인다</text>
  <rect x="460" y="486" width="10" height="10" fill="#E3B341"/>
  <text x="478" y="496" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">NAT 지점에서 한 번 바뀐다</text>
  <rect x="720" y="486" width="10" height="10" fill="#3FB98C"/>
  <text x="738" y="496" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">끝까지 그대로다</text>
</svg>

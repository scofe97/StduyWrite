<title id="dt">컨테이너마다 자기 스택 — Pod 는 그것을 일부러 깬다</title><desc id="dd">같은 호스트의 컨테이너 둘과 Pod 안의 컨테이너 둘을 나란히 둔 대조. 링 하나가 네트워크 네임스페이스 하나이며, 링이 둘이면 localhost 가 서로 다른 세계이고 하나면 같은 세계다.</desc>
<rect width="1000" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ONE STACK EACH · POD BREAKS THAT ON PURPOSE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">컨테이너마다 자기 스택 — Pod 는 그것을 일부러 깬다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">링의 개수가 전부입니다 · localhost 는 언제나 자기 링 안에서만 되돌아옵니다</text>
<text x="32" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">기본값 — 컨테이너 둘</text>
<text x="520" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">Pod — 네임스페이스를 공유한다</text>
<rect x="40" y="184" width="204" height="224" rx="10" fill="#3FB98C06" stroke="#3FB98C" stroke-width="1.2" stroke-dasharray="7 6"/>
<text x="54" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">컨테이너 A</text>
<text x="230" y="172" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">netns #1</text>
<rect x="56" y="230" width="172" height="52" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="142" y="252" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">eth0</text>
<text x="142" y="271" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">172.17.0.2</text>
<rect x="56" y="314" width="172" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="142" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">lo</text>
<text x="142" y="355" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">8080 을 잡고 있다</text>
<rect x="260" y="184" width="204" height="224" rx="10" fill="#3FB98C06" stroke="#3FB98C" stroke-width="1.2" stroke-dasharray="7 6"/>
<text x="274" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">컨테이너 B</text>
<text x="450" y="172" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">netns #2</text>
<rect x="276" y="230" width="172" height="52" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="362" y="252" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">eth0</text>
<text x="362" y="271" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">172.17.0.3</text>
<rect x="276" y="314" width="172" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="362" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">lo</text>
<text x="362" y="355" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기엔 아무도 없다</text>
<path d="M 370 374 L 370 432 L 150 432 L 150 374" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)" stroke-dasharray="5 5"/>
<text x="260" y="452" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">B 가 localhost:8080 을 불러도 A 에 닿지 않는다</text>
<rect x="528" y="184" width="432" height="224" rx="10" fill="#F08A5906" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="none"/>
<text x="542" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">Pod</text>
<text x="946" y="172" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">netns 하나</text>
<rect x="550" y="230" width="180" height="52" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="640" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">앱 컨테이너</text>
<text x="640" y="271" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">8080 을 잡고 있다</text>
<rect x="758" y="230" width="180" height="52" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="848" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">사이드카</text>
<text x="848" y="271" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">프록시 · 수집기</text>
<rect x="550" y="314" width="388" height="52" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="744" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">lo</text>
<text x="744" y="355" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">둘이 같은 것을 본다</text>
<path d="M 640 282 L 640 314" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 848 282 L 848 314" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="744" y="432" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">localhost:8080 으로 부른다</text>
<text x="24" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">왼쪽에서 안 되던 그 통신이 오른쪽에서는 됩니다. 컨테이너가 달라진 게 아니라 네임스페이스를 몇 개 만들었는지가 달라졌을 뿐입니다.</text>
<text x="24" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">그래서 사이드카 패턴이 성립합니다. 프록시가 앱을 localhost 로 부를 수 있으니 앱은 자기가 프록시 뒤에 있다는 사실도 모릅니다.</text>
<line x1="12" y1="528" x2="952" y2="528" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="550" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="540" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="550" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Pod 가 공유하는 것</text>
<rect x="300" y="540" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="322" y="550" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">컨테이너 경계</text>
<rect x="435" y="540" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="457" y="550" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">인터페이스</text>
<rect x="544" y="540" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="566" y="550" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">닿지 않는 호출</text>
</svg>
<text x="36" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">스케줄러는 Pod 를 만들지 않는다 — 어느 노드인지만 적고, 그 뒤는 그 노드가 스스로 한다</text>

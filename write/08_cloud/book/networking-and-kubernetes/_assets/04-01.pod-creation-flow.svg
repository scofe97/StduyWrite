<title id="dt">스케줄러는 이름만 적고, 만드는 일은 그 노드의 Kubelet 이 한다</title><desc id="dd">스케줄러가 하는 일은 nodeName 한 줄을 적는 것뿐이다. 컨테이너와 네트워크는 그 노드의 Kubelet 이 CRI 와 CNI 를 불러 만든다.</desc>
<rect width="1000" height="672" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">POD CREATION · WHO ACTUALLY BUILDS IT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스케줄러는 이름만 적고, 만드는 일은 그 노드의 Kubelet 이 한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">스케줄러가 하는 일은 nodeName 한 줄 · 만드는 일은 그 노드의 Kubelet</text>

<title id="dt">주소를 어떻게 줄지 정하고, 그 결정을 실행하는 컴포넌트로 내려간다</title><desc id="dd">3가지 약속에서 시작해 배치를 고르고, 주소 대역과 Pod 생성으로 내려간 뒤 프로브의 자격 판정으로 닫는다.</desc>

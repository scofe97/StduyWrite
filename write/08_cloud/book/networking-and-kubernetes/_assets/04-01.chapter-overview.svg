<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">3가지 약속 → 배치 선택 → 주소 대역 → Pod 생성 → 자격 판정</text>

<title id="dt">응답은 규칙을 다시 안 본다 — conntrack 항목이 목적지를 되돌린다</title><desc id="dd">위는 응답 패킷이 지나는 자리, 아래는 그때 conntrack 항목이 쥐고 있는 값이다. 확률은 재평가되지 않는다.</desc>
<rect width="1000" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONNTRACK · THE RETURN PATH</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">응답은 규칙을 다시 안 본다 — conntrack 항목이 목적지를 되돌린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위는 응답이 지나는 자리 · 아래는 conntrack 이 쥔 값 · 확률은 재평가되지 않는다</text>

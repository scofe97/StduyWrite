<title id="dt">네임스페이스를 밖으로 내보내려면 세 곳에 하나씩 필요하다</title><desc id="dd">나갈 길은 네임스페이스에, 중계 허가는 중계 호스트에, 돌아올 길은 상대 호스트에 있습니다. 셋 중 하나만 빠져도 통하지 않으며 빠진 것에 따라 실패 문구가 달라집니다.</desc>
<rect width="1000" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">THREE REQUIREMENTS · ONE PATH</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">네임스페이스를 밖으로 내보내려면 세 곳에 하나씩 필요하다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">나갈 길·중계 허가·돌아올 길이 서로 다른 곳에 있다</text>
<rect x="40" y="142" width="920" height="116" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<line x1="276" y1="142" x2="276" y2="258" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="60" y="178" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">ns1</text>
<text x="60" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">필요: default 경로</text>
<text x="60" y="226" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">route add default via 10.10.1.1</text>
<rect x="40" y="278" width="920" height="116" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<line x1="276" y1="278" x2="276" y2="394" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="60" y="314" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">ubuntu</text>
<text x="60" y="338" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">필요: 중계 허가</text>
<text x="60" y="362" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">net.ipv4.ip_forward = 1</text>
<rect x="40" y="414" width="920" height="116" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<line x1="276" y1="414" x2="276" y2="530" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="60" y="450" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">ubuntu2</text>
<text x="60" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">필요: 돌아올 경로</text>
<text x="60" y="498" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">route add 10.10.1.0/24 via .208</text>
<rect x="290" y="162" width="212" height="76" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="396" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">default 에 걸림</text>
<text x="396" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">10.10.1.0/24 밖이다</text>
<rect x="290" y="298" width="212" height="76" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="396" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">br0 로 받음</text>
<text x="396" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">홉이 아니라 TTL 그대로</text>
<rect x="526" y="298" width="212" height="76" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="632" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">FORWARD 통과</text>
<text x="632" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ip_forward 검사 · TTL 1 감소</text>
<rect x="758" y="434" width="212" height="76" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="864" y="464" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">받는다</text>
<text x="864" y="488" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">출발지는 10.10.1.11</text>
<path d="M 396 238 L 396 290" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 502 336 L 518 336" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 632 374 L 632 404 L 864 404 L 864 426" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="40" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">TTL 이 64 에서 63 으로 준 것이 중계를 지났다는 증거입니다. 같은 호스트 안 ns1 에서 ns2 로 갈 때는 64 그대로였습니다.</text>
<line x1="12" y1="580" x2="952" y2="580" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="602" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="592" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">갖춰야 할 것</text>
<rect x="235" y="592" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="257" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">중계 허가가 없으면 여기서 버려진다</text>
</svg>
  <text x="421" y="326" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">ISP 라우터</text>
  <text x="421" y="348" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.14em">DST IP</text>
  <text x="421" y="366" fill="#3FB98C" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">93.184.216.34</text>
  <line x1="745" y1="170" x2="745" y2="260" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <rect x="645" y="260" width="200" height="112" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
  <text x="661" y="286" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.14em">DST MAC</text>
  <text x="661" y="306" fill="#6A95D8" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">AA:BB:CC:00:00:04</text>
  <text x="661" y="326" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">웹 서버 NIC</text>
  <text x="661" y="348" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.14em">DST IP</text>
  <text x="661" y="366" fill="#3FB98C" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">93.184.216.34</text>
  <line x1="60" y1="404" x2="950" y2="404" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <rect x="60" y="424" width="10" height="10" fill="#6A95D8"/>
  <text x="78" y="434" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">MAC · 세 번 다시 쓰였다</text>
  <rect x="340" y="424" width="10" height="10" fill="#3FB98C"/>
  <text x="358" y="434" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">IP · 한 번도 바뀌지 않았다</text>
  <text x="660" y="434" fill="#F08A59" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">주황 테두리가 마지막 구간입니다</text>

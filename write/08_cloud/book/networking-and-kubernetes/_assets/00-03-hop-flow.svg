  <text x="60" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.18em">FLOW</text>
  <text x="60" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">구간마다 무엇이 다시 쓰이는가</text>
  <text x="60" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">값 아래가 그 주소의 주인입니다. 세 줄 중 마지막 줄만 처음부터 끝까지 같은 값입니다.</text>

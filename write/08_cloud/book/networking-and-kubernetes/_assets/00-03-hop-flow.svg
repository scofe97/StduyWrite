<svg viewBox="0 0 1000 596" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fl-title fl-desc">
  <title id="fl-title">구간마다 무엇이 다시 쓰이는가</title>
  <desc id="fl-desc">장비 넷을 가로로 잇고 구간마다 목적지 MAC 과 출발지·목적지 IP 를 값과 그 주인 이름까지 붙인 흐름도. MAC 은 세 번, 출발지 IP 는 NAT 에서 한 번 바뀌고 목적지 IP 만 끝까지 같다.</desc>
  <defs><marker id="fl-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8B98A9"/></marker></defs>

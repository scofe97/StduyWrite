  <line x1="470" y1="170" x2="532" y2="170" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#fl-a)"/>
  <line x1="710" y1="170" x2="772" y2="170" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#fl-a)"/>

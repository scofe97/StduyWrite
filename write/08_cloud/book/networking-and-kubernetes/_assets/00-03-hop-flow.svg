<svg viewBox="0 0 1000 478" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fl-title fl-desc">
  <title id="fl-title">한 요청이 세 구간을 건너는 동안 겉봉만 다시 쓰인다</title>
  <desc id="fl-desc">노트북에서 웹 서버까지 장비 넷을 가로로 잇고, 구간마다 그때의 목적지 MAC 과 목적지 IP 를 실제 값으로 붙인 흐름도. MAC 은 세 번 바뀌고 IP 는 한 번도 바뀌지 않는다.</desc>
  <defs><marker id="fl-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8B98A9"/></marker></defs>
  <rect width="100%" height="100%" fill="#0D1117"/>
  <text x="60" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.18em">FLOW</text>
  <text x="60" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">구간마다 겉봉만 다시 쓰인다</text>
  <text x="60" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">아래 카드가 그 구간을 지날 때 프레임에 실제로 적혀 있는 값입니다. 위가 겉봉이고 아래가 속입니다.</text>
  <rect x="60" y="132" width="170" height="76" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="145" y="164" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">내 노트북</text>
  <text x="145" y="186" fill="#8B98A9" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">192.168.0.15</text>
  <rect x="300" y="132" width="170" height="76" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="385" y="164" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">집 공유기</text>
  <text x="385" y="186" fill="#8B98A9" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">게이트웨이</text>
  <rect x="540" y="132" width="170" height="76" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="625" y="164" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">ISP 라우터</text>
  <text x="625" y="186" fill="#8B98A9" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">중간 홉</text>
  <rect x="780" y="132" width="170" height="76" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="865" y="164" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">웹 서버</text>
  <text x="865" y="186" fill="#8B98A9" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">93.184.216.34</text>

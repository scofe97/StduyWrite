<title id="dt">서비스 조회의 세 구현 — 다른 것은 찾는 방법이다</title><desc id="dd">iptables·IPVS·eBPF 를 자료구조·조회 방법·조회 비용·확인 명령·새로 가능해진 일 다섯 축으로 비교한 행렬. 리스트 순회에서 맵 조회로 가며 비용이 규칙 수에 덜 끌려간다.</desc>
<rect width="1000" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPARISON MATRIX · 02-03 SERVICE LOOKUP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서비스 조회의 세 구현 — 다른 것은 찾는 방법이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">리스트는 규칙이 늘수록 대조가 늘고, 맵 조회는 그 길이에 끌려가지 않는다 — 우열이 아니라 전제가 다른 선택지</text>
<text x="86" y="108" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">구현</text>

<svg viewBox="0 0 920 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>L7의 두 층 — Ingress(밖→안)와 Service Mesh(안↔안)</title>
  <desc>Ingress는 클러스터 밖에서 안으로 들어오는 HTTP 트래픽을 host·path로 여러 서비스에 fan-out하는 L7 라우터다. 서비스 메시는 클러스터 안 서비스 사이 통신을 사이드카 프록시가 mTLS·재시도·관측으로 처리하는 L7 인프라다. 둘은 트래픽 방향이 다른 서로 다른 층이다</desc>
  <defs>
    <marker id="l-blu" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b9bd5"/></marker>
    <marker id="l-grn" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#66bb6a"/></marker>
  </defs>
  <rect x="0" y="0" width="920" height="440" fill="#0d0d0d"/>

  <text x="460" y="32" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">L7의 두 층 — 트래픽 방향이 다른 두 인프라</text>

  <!-- 클러스터 경계 -->
  <rect x="250" y="70" width="640" height="340" rx="10" fill="#0d0d0d" stroke="#3a3530" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="880" y="90" text-anchor="end" fill="#b8b3ad" font-size="11">Kubernetes 클러스터</text>

  <!-- Ingress: 밖→안 L7 -->
  <rect x="40" y="150" width="120" height="60" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.3"/>
  <text x="100" y="176" text-anchor="middle" fill="#5b9bd5" font-size="12" font-weight="700">외부 클라이언트</text>
  <text x="100" y="196" text-anchor="middle" fill="#b8b3ad" font-size="10">HTTP(S)</text>

  <rect x="290" y="140" width="150" height="80" rx="8" fill="#dceaf7"/>
  <text x="365" y="166" text-anchor="middle" font-size="13" style="fill:#10243a" font-weight="700">Ingress</text>
  <text x="365" y="186" text-anchor="middle" font-size="10" style="fill:#10243a">밖 → 안 L7 라우터</text>
  <text x="365" y="203" text-anchor="middle" font-size="10" style="fill:#10243a">host·path fan-out</text>
  <line x1="162" y1="180" x2="286" y2="180" stroke="#5b9bd5" stroke-width="2.2" marker-end="url(#l-blu)"/>
  <text x="224" y="170" text-anchor="middle" fill="#5b9bd5" font-size="10">LB 1개로 통합</text>

  <!-- 서비스 A, B (메시) -->
  <rect x="520" y="120" width="150" height="90" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="595" y="142" text-anchor="middle" fill="#66bb6a" font-size="12" font-weight="700">서비스 A</text>
  <rect x="534" y="152" width="56" height="46" rx="4" fill="#e6f7e7"/>
  <text x="562" y="172" text-anchor="middle" font-size="9" style="fill:#14521d" font-weight="700">app</text>
  <rect x="600" y="152" width="56" height="46" rx="4" fill="#cdeccf"/>
  <text x="628" y="169" text-anchor="middle" font-size="8" style="fill:#14521d" font-weight="700">사이드카</text>
  <text x="628" y="183" text-anchor="middle" font-size="8" style="fill:#14521d">proxy</text>

  <rect x="720" y="250" width="150" height="90" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="795" y="272" text-anchor="middle" fill="#66bb6a" font-size="12" font-weight="700">서비스 B</text>
  <rect x="734" y="282" width="56" height="46" rx="4" fill="#e6f7e7"/>
  <text x="762" y="302" text-anchor="middle" font-size="9" style="fill:#14521d" font-weight="700">app</text>
  <rect x="800" y="282" width="56" height="46" rx="4" fill="#cdeccf"/>
  <text x="828" y="299" text-anchor="middle" font-size="8" style="fill:#14521d" font-weight="700">사이드카</text>
  <text x="828" y="313" text-anchor="middle" font-size="8" style="fill:#14521d">proxy</text>

  <!-- Ingress → 서비스 A -->
  <line x1="440" y1="175" x2="516" y2="165" stroke="#5b9bd5" stroke-width="2" marker-end="url(#l-blu)"/>
  <!-- 메시: A↔B (사이드카 간 mTLS) -->
  <line x1="628" y1="200" x2="800" y2="290" stroke="#66bb6a" stroke-width="2.2" marker-end="url(#l-grn)"/>
  <text x="740" y="230" text-anchor="middle" fill="#66bb6a" font-size="10" font-weight="700">안 ↔ 안 mTLS</text>
  <text x="740" y="245" text-anchor="middle" fill="#b8b3ad" font-size="9">재시도·관측·라우팅</text>

  <!-- 컨트롤 플레인 -->
  <rect x="290" y="300" width="200" height="60" rx="6" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1"/>
  <text x="390" y="324" text-anchor="middle" fill="#e8e4df" font-size="11" font-weight="700">메시 컨트롤 플레인</text>
  <text x="390" y="344" text-anchor="middle" fill="#b8b3ad" font-size="9">설정 배포 · 죽어도 데이터 플레인은 동작</text>

  <!-- 하단 요약 -->
  <line x1="40" y1="382" x2="880" y2="382" stroke="#2a2520" stroke-width="1"/>
  <text x="100" y="406" fill="#5b9bd5" font-size="12" font-weight="700">Ingress = 1층 안내 데스크</text>
  <text x="300" y="406" fill="#b8b3ad" font-size="11">밖에서 온 HTTP를 부서로 안내 (LB 비용 통합)</text>
  <text x="620" y="406" fill="#66bb6a" font-size="12" font-weight="700">Mesh = 사내 전화망 교체</text>
</svg>

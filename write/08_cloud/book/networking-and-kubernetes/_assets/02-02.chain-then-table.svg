<title id="dt">체인이 바깥이고 테이블이 그 안이다 — 인바운드 패킷이 이 호스트로 올 때</title><desc id="dd">레인 하나가 체인 하나다. 레인 안의 칸이 그 체인에서 Raw·Mangle·NAT·Filter 순으로 평가되는 테이블이고, 점선 칸은 그 체인에 없는 테이블이다. 레인을 갈아타는 자리가 라우팅 판단이다.</desc>
<rect width="1000" height="700" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">IPTABLES · CHAIN FIRST, TABLE INSIDE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">체인이 바깥이고 테이블이 그 안이다 — 인바운드 패킷이 이 호스트로 올 때</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">레인 = 체인 · 레인 안 칸 = 그 체인이 실제로 가진 테이블 (평가 순서 Raw → Mangle → NAT → Filter)</text>
<rect x="24" y="148" width="952" height="124" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="176" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">PREROUTING</text>
<text x="40" y="194" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">체인 · 라우팅 판단 전</text>
<rect x="24" y="296" width="952" height="76" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">라우팅 판단</text>
<text x="40" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">체인을 가르는 유일한 분기</text>
<rect x="24" y="396" width="952" height="124" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="424" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">INPUT</text>
<text x="40" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">체인 · 라우팅 판단 후</text>
<rect x="184" y="96" width="160" height="32" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="264" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">인바운드 패킷</text>
<path d="M 264 128 L 264 192" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="184" y="196" width="160" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="264" y="226" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Raw</text>
<text x="264" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">추적 이전</text>
<rect x="384" y="196" width="160" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="464" y="226" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Mangle</text>
<text x="464" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">헤더 편집·마킹</text>
<rect x="584" y="196" width="160" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="664" y="226" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">NAT</text>
<text x="664" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">DNAT</text>
<rect x="612.36" y="173" width="103.28" height="18" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="664" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#6A95D8">-j KUBE-SERVICES</text>
<rect x="784" y="196" width="160" height="64" rx="6" fill="none" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="6 6"/>
<text x="864" y="226" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">Filter</text>
<text x="864" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">이 체인에 없음</text>
<path d="M 352 228 L 374 228" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 552 228 L 574 228" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 664 260 L 664 280 L 564 280 L 564 306" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<rect x="432" y="310" width="264" height="48" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="564" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">목적지 = 이 호스트인가</text>
<text x="564" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">예 → INPUT · 아니오 → FORWARD</text>
<path d="M 564 358 L 564 380 L 464 380 L 464 440" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<rect x="184" y="444" width="160" height="64" rx="6" fill="none" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="6 6"/>
<text x="264" y="474" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#5E6B7E">Raw</text>
<text x="264" y="494" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">이 체인에 없음</text>
<rect x="384" y="444" width="160" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="464" y="474" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Mangle</text>
<text x="464" y="494" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">헤더 편집</text>
<rect x="584" y="444" width="160" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="664" y="474" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">NAT</text>
<text x="664" y="494" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">테이블만 존재</text>
<rect x="784" y="444" width="160" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="864" y="474" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Filter</text>
<text x="864" y="494" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">수락·거부</text>
<path d="M 552 476 L 574 476" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 752 476 L 774 476" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 864 508 L 864 540" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="784" y="544" width="160" height="32" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="864" y="564" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">로컬 프로세스</text>
<text x="24" y="608" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">두 레인의 칸이 같은 자리에 놓인 것은 평가 순서가 같기 때문이다. 달라지는 것은 그 체인이 어느 테이블을 갖느냐뿐이다.</text>
<line x1="12" y1="632" x2="952" y2="632" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="654" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="644" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="654" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">그 체인이 가진 테이블</text>
<rect x="300" y="644" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="322" y="654" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">없는 테이블</text>
<rect x="422" y="644" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="444" y="654" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">체인을 갈아타는 자리</text>
</svg>
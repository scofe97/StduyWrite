<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1138 466" width="100%" role="img" aria-labelledby="ctt ctd">
<title id="ctt">conntrack 상태 넷 — 수명과 플래그가 함께 바뀐다</title>
<desc id="ctd">conntrack flow의 네 상태(NEW·ESTABLISHED·RELATED·INVALID)를 의미·예·남은 수명·플래그 네 축으로 정리한 행렬. 응답 없는 연결은 120초, 수립된 연결은 432000초로 수명이 크게 갈린다.</desc>
<rect width="1138" height="466" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">STATE MATRIX · 02-01 CONNTRACK</text>
<text x="12" y="52" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">conntrack 상태 넷 — 수명과 플래그가 함께 바뀐다</text>
<text x="12" y="72" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="11" fill="#8B98A9">상태는 이름이 아니라 테이블에 적힌 한 줄입니다 — 수명과 플래그가 함께 붙습니다.</text>

<title id="dt">짧은 이름 하나가 다섯 번의 질의가 된다</title><desc id="dd">검색 경로를 차례로 붙여 가며 시도하기 때문에 이름 하나에 요청이 여러 번 나간다.</desc>
<rect width="1000" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CLUSTER DNS · SEARCH PATH COST</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">짧은 이름 하나가 다섯 번의 질의가 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">지연의 근원은 서버가 느린 것이 아니라 물어보는 횟수다</text>
<rect x="32" y="160" width="200" height="96" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="132" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">1차 시도</text>
<text x="132" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">&lt;service&gt;.default</text>
<text x="132" y="238" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">.svc.cluster.local</text>
<path d="M 238 208 L 254 208" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="264" y="160" width="200" height="96" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="364" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">2차 시도</text>
<text x="364" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">svc.cluster.local</text>
<path d="M 470 208 L 486 208" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="496" y="160" width="200" height="96" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="596" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">3차 시도</text>
<text x="596" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">cluster.local</text>
<path d="M 702 208 L 718 208" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="728" y="160" width="200" height="96" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="828" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">4차 시도</text>
<text x="828" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트 검색 경로</text>
<rect x="32" y="296" width="896" height="64" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="480" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#F08A59">짧은 이름 하나에 요청이 다섯 번 — 클러스터 DNS 지연의 근원</text>
<rect x="32" y="400" width="448" height="96" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="256" y="428" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">CoreDNS Autopath</text>
<text x="256" y="452" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버 측에서 검색 경로를 완성해</text>
<text x="256" y="472" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">CNAME 으로 답한다 · 질의 한 번</text>
<text x="256" y="492" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">대신 CoreDNS 메모리가 는다</text>
<rect x="520" y="400" width="448" height="96" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="744" y="428" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">ndots 조정</text>
<text x="744" y="452" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Pod 기본값 ndots:5 탓에</text>
<text x="744" y="472" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">외부 도메인도 검색 경로를 다 돈다</text>
<text x="744" y="492" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">FQDN 이나 dnsConfig 로 낮춘다</text>
<text x="36" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">처방 둘 다 질의 횟수를 줄이는 쪽이다 — 하나는 서버가 대신 완성하고, 하나는 애초에 검색 경로를 덜 돌게 한다</text>
<line x1="12" y1="536" x2="952" y2="536" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="558" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="548" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">차례로 시도하는 이름</text>
<rect x="287" y="548" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="309" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">처방</text>
<rect x="357" y="548" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="379" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">그 결과</text>
</svg>
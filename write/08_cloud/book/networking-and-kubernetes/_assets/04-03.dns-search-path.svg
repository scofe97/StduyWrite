<title id="dt">같은 규칙인데 클러스터 밖 이름이 훨씬 비싸다</title><desc id="dd">검색 도메인을 앞에서부터 붙여 시도한다. 클러스터 안 이름은 첫 판에 맞고, 밖 이름은 검색 경로의 실패를 다 소진한 뒤에야 맞는다. 시도마다 A 와 AAAA 두 질의가 나가므로 패킷은 그 두 배다.</desc>
<rect width="1000" height="624" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CLUSTER DNS · THE SEARCH PATH IS TRIED IN ORDER</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 규칙인데 클러스터 밖 이름이 훨씬 비싸다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">검색 도메인을 앞에서부터 붙여 시도한다. 안 이름은 첫 판에 맞고 밖 이름은 실패를 다 소진한 뒤 맞는다</text>
<rect x="32" y="112" width="936" height="180" rx="8" fill="#161B22" stroke="#3FB98C" stroke-width="1.4"/>
<text x="52" y="138" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">클러스터 안 이름 · web</text>
<rect x="52" y="152" width="200" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="152" y="174" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">1차</text>
<text x="152" y="194" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">web.default.svc…</text>
<text x="152" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">있다 · 여기서 끝</text>
<line x1="256" y1="180" x2="292" y2="180" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="3 3"/>
<rect x="296" y="152" width="640" height="56" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.14)" stroke-width="0.9"/>
<text x="616" y="185" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">2차부터는 아예 시도하지 않는다</text>
<text x="52" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">질의 왕복 1회. 이름을 짧게 부르는 편의가 여기서는 값이 거의 없다</text>
<rect x="32" y="310" width="936" height="212" rx="8" fill="#161B22" stroke="#F0616D" stroke-width="1.4"/>
<text x="52" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">클러스터 밖 이름 · api.pay.example.com</text>
<rect x="52" y="350" width="168" height="56" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="136" y="372" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">1차</text>
<text x="136" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">…default.svc…</text>
<text x="136" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">없음</text>
<path d="M 224 378 L 228 378" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="232" y="350" width="168" height="56" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="316" y="372" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2차</text>
<text x="316" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">…svc.cluster.local</text>
<text x="316" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">없음</text>
<path d="M 404 378 L 408 378" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="412" y="350" width="168" height="56" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="496" y="372" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">3차</text>
<text x="496" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">…cluster.local</text>
<text x="496" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">없음</text>
<path d="M 584 378 L 588 378" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="592" y="350" width="168" height="56" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="676" y="372" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">4차</text>
<text x="676" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">호스트 검색 경로</text>
<text x="676" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">없음</text>
<path d="M 764 378 L 768 378" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="772" y="350" width="164" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.4"/>
<text x="854" y="372" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">마지막</text>
<text x="854" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">이름 그대로</text>
<text x="854" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">있다</text>
<rect x="52" y="444" width="884" height="58" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="72" y="468" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">헛발질을 다 소진한 뒤에야 정답에 닿는다. 그리고 시도마다 A 와 AAAA 두 질의를 내보내므로</text>
<text x="72" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">실제 패킷은 그 두 배다. 이름 하나에 왕복 열 번이 나갈 수 있다</text>
<text x="36" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">ndots 의 5 는 질의 횟수가 아니다. 점이 5개 미만이면 검색 경로를 먼저 돈다는 임계값이고, 위 이름은 점이 3개라 걸린다</text>
<line x1="12" y1="576" x2="952" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="588" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">헛발질</text>
<rect x="183" y="588" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="205" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">맞은 시도</text>
</svg>
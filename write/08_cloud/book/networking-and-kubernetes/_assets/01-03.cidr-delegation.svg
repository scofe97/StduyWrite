<title id="dt">CIDR 위임 계보 — 단계마다 범위가 좁아진다</title><desc id="dd">208.130.29.33의 위임 계보. IANA가 /11을 ARIN에 주고, ARIN이 점점 작은 서브넷으로 쪼개 내려가 최종적으로 단일 호스트 /32에 닿는다. 프리픽스 숫자가 커질수록 담는 주소 수가 줄어든다.</desc>

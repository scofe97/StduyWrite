<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dn-title dn-desc">
  <title id="dn-title">이름으로는 아무것도 보낼 수 없다</title>
  <desc id="dn-desc">이름을 IP 로 바꾸는 조회가 실제 연결보다 먼저 일어난다는 것을 네 단계 가로 절차로 보인 도식.</desc>
  <rect width="100%" height="100%" fill="#0D1117"/>
  <text x="60" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.18em">PROCESS</text>
  <text x="60" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">이름으로는 아무것도 보낼 수 없다</text>
  <text x="60" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">IP 헤더에는 이름을 적을 칸이 없습니다. 그래서 연결보다 조회가 먼저입니다.</text>
  <rect x="60" y="152" width="200" height="88" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="76" y="178" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.14em">01</text>
  <text x="76" y="202" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">이름을 친다</text>
  <text x="76" y="224" fill="#8B98A9" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">example.com</text>
  <line x1="264" y1="196" x2="288" y2="196" stroke="#8B98A9" stroke-width="1.2"/>
  <rect x="292" y="152" width="200" height="88" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="308" y="178" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.14em">02</text>
  <text x="308" y="202" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">DNS 에 묻는다</text>
  <text x="308" y="224" fill="#8B98A9" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">DHCP 가 준 서버</text>
  <line x1="496" y1="196" x2="520" y2="196" stroke="#8B98A9" stroke-width="1.2"/>
  <rect x="524" y="152" width="200" height="88" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
  <text x="540" y="178" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.14em">03</text>
  <text x="540" y="202" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">IP 를 받는다</text>
  <text x="540" y="224" fill="#F08A59" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">93.184.216.34</text>
  <line x1="728" y1="196" x2="752" y2="196" stroke="#8B98A9" stroke-width="1.2"/>
  <rect x="756" y="152" width="200" height="88" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="772" y="178" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.14em">04</text>
  <text x="772" y="202" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">그제야 연결</text>
  <text x="772" y="224" fill="#8B98A9" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">TCP 핸드셰이크</text>
  <line x1="60" y1="288" x2="958" y2="288" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="60" y="320" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">조회가 실패하면 뒤의 모든 것이 시작조차 못 합니다. 연결이 안 될 때 여기부터 보는 이유입니다.</text>
</svg>

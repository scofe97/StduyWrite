<svg viewBox="0 0 640 400" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>컨테이너의 탄생 전체 지도</title>
  <desc>TCP/IP 스택이 몇 개인가를 축으로 한 실행 환경의 진화에서 출발해 생태계 용어와 런타임 계보를 정리하고, 컨테이너를 이루는 두 커널 프리미티브 cgroup 과 namespace 를 나눠 본 뒤, 마지막에 그 배선을 맨손 Linux 명령으로 재현하는 흐름입니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10.5px; }
    .sec { fill: #3a3632; font-size: 10px; font-weight: 700; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .num { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10.5px; }
    .caution-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .caution-detail { fill: #0d0d0d; font-size: 10.5px; }
  </style>

  <rect width="640" height="400" fill="#0d0d0d"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <!-- 1 -->
  <text class="num" x="34" y="45">1.</text>
  <rect class="box" x="54" y="24" width="532" height="50" rx="4"/>
  <text class="box-title" x="72" y="46">진화 — 스택이 몇 개인가</text>
  <text class="box-detail" x="72" y="64">베어메탈 · VM · 컨테이너</text>
  <text class="sec" x="566" y="46" text-anchor="end">§1</text>

  <path class="arrow" d="M320,74 L320,92" marker-end="url(#ah)"/>

  <!-- 2 -->
  <text class="num" x="34" y="119">2.</text>
  <rect class="box" x="54" y="98" width="532" height="50" rx="4"/>
  <text class="box-title" x="72" y="120">용어와 계보</text>
  <text class="box-detail" x="72" y="138">Docker 가 부품으로 분해</text>
  <text class="sec" x="566" y="120" text-anchor="end">§2</text>

  <path class="arrow" d="M320,148 L320,166" marker-end="url(#ah)"/>

  <!-- 분기 라벨 -->
  <text class="hint" x="320" y="182" text-anchor="middle">컨테이너를 이루는 두 프리미티브</text>

  <path class="arrow" d="M320,188 L320,200 L180,200 L180,218" marker-end="url(#ah)"/>
  <path class="arrow" d="M320,188 L320,200 L460,200 L460,218" marker-end="url(#ah)"/>

  <!-- 3. cgroup -->
  <text class="num" x="34" y="247">3.</text>
  <rect class="box" x="54" y="224" width="252" height="52" rx="4"/>
  <text class="box-title" x="72" y="246">cgroup — 얼마나</text>
  <text class="box-detail" x="72" y="264">자원의 양을 제한</text>
  <text class="sec" x="288" y="246" text-anchor="end">§3</text>

  <!-- 4. namespace -->
  <text class="num" x="345" y="247">4.</text>
  <rect class="box" x="364" y="224" width="222" height="52" rx="4"/>
  <text class="box-title" x="382" y="246">namespace — 무엇을</text>
  <text class="box-detail" x="382" y="264">시야를 격리 · 6종</text>
  <text class="sec" x="566" y="246" text-anchor="end">§4</text>

  <path class="arrow" d="M180,276 L180,290 L320,290 L320,306" marker-end="url(#ah)"/>
  <path class="arrow" d="M460,276 L460,290 L320,290" />

  <!-- 5. 맨손 실습 — 주의 -->
  <text class="num" x="34" y="341">5.</text>
  <rect x="54" y="312" width="532" height="60" rx="4" fill="rgb(212,168,83)"/>
  <text class="caution-title" x="72" y="336">주의 · 맨손 배선은 위험하다</text>
  <text class="caution-detail" x="72" y="356">설정 하나 틀리면 루프</text>
  <text class="sec" x="566" y="336" text-anchor="end">§5</text>
</svg>

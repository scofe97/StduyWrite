<title id="dt">연결 하나가 두 큐를 거쳐 accept 로 나오는 길</title><desc id="dd">SYN 만 받은 반쯤 열린 연결은 SYN 큐에 쌓이고, 3-way 가 끝나면 accept 큐로 옮겨진다. listen 의 두 번째 인자가 정하는 것은 뒤쪽 accept 큐의 칸 수다. 그 칸이 없으면 커널은 거절하지 않고 SYN/ACK 를 조용히 버려 클라이언트의 재전송을 기다린다.</desc>
<rect width="1000" height="880" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LISTEN BACKLOG · SYN QUEUE → ACCEPT QUEUE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">연결 하나가 두 큐를 거쳐 accept 로 나오는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 큐가 채워지는 시점이 다르다 · listen 두 번째 인자가 정하는 것은 뒤쪽 칸뿐이다</text>
<rect x="24.0" y="104" width="212" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="130.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">클라이언트</text>
<text x="130.0" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">연결을 거는 쪽</text>
<rect x="382.0" y="104" width="212" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="488.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">커널</text>
<text x="488.0" y="141" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SYN 큐 · accept 큐</text>

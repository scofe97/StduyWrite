<text x="667.0" y="466" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#8B98A9">fd</text>
<text x="667.0" y="494" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">연결 전용 파일 디스크립터</text>
<rect x="88" y="508" width="856" height="156" rx="4" fill="#F5F5F306" stroke="#E3B341" stroke-width="1.0"/>
<rect x="88" y="508" width="44" height="16" rx="2" fill="#0D1117" stroke="#E3B341" stroke-width="1.0"/>
<text x="110" y="520" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#E3B341">OPT</text>
<text x="144" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">[accept 큐에 빈 칸이 없으면]</text>

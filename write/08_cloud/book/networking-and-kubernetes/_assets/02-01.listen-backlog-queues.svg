<text x="309.0" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">3-way 완료</text>
<path d="M 498.0 368 L 552.0 368 L 552.0 392 L 501.0 392" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#ar)"/>

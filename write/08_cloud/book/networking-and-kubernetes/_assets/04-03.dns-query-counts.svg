<title id="dt">같은 이름 web 을 부르는데 질의 수는 2에서 5까지 갈린다</title><desc id="dd">glibc 2.41 과 musl 의 getent hosts web 은 질의가 2번이고, c-ares 1.34.9 를 쓰는 curl 8.23.0 은 5번이다(A 1, AAAA 4). 같은 curl 이 example.com 은 8번, 끝점을 찍은 example.com. 은 2번이다. CoreDNS v1.14.6 로그 기준, 2026-11-08.</desc>
<rect width="1000" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CLUSTER DNS · QUERIES PER CLIENT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 이름 web 을 부르는데 질의 수는 2에서 5까지 갈린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">web 은 A 레코드만 있어서 AAAA 질의가 어디서 멈추는지가 횟수를 가릅니다</text>
<text x="48" y="134" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">클라이언트 · 부른 이름</text>

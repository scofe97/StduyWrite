<svg viewBox="0 0 920 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>NetworkPolicy peer의 AND/OR — YAML 대시 하나가 의미를 뒤집는다</title>
  <desc>namespaceSelector와 podSelector를 같은 리스트 항목에 두면 두 조건의 AND(매칭 네임스페이스 안의 매칭 Pod)이고, 각각 별도 대시 항목으로 나누면 OR(매칭 네임스페이스의 모든 Pod 또는 정책 네임스페이스의 매칭 Pod)이다. 대시 하나 위치가 허용 범위를 크게 바꾼다</desc>
  <rect x="0" y="0" width="920" height="470" fill="#0d0d0d"/>

  <text x="460" y="32" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">NetworkPolicy peer 의 AND · OR</text>
  <text x="460" y="54" text-anchor="middle" fill="#b8b3ad" font-size="12">한 항목에 두느냐 나누느냐</text>

  <!-- AND 패널 -->
  <rect x="30" y="76" width="410" height="360" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="235" y="102" text-anchor="middle" fill="#66bb6a" font-size="15" font-weight="700">AND — 한 항목 (대시 하나)</text>

  <!-- YAML AND -->
  <rect x="50" y="116" width="370" height="118" rx="5" fill="#0d1a0d"/>
  <text x="66" y="138" fill="#b8b3ad" font-size="12" font-family="monospace">ingress:</text>
  <text x="66" y="156" fill="#e8e4df" font-size="12" font-family="monospace">- from:</text>
  <text x="82" y="174" fill="#66bb6a" font-size="12" font-family="monospace" font-weight="700">  - namespaceSelector:</text>
  <text x="98" y="192" fill="#e8e4df" font-size="12" font-family="monospace">      matchLabels: {team: store}</text>
  <text x="82" y="210" fill="#66bb6a" font-size="12" font-family="monospace" font-weight="700">    podSelector:</text>
  <text x="98" y="228" fill="#e8e4df" font-size="12" font-family="monospace">      matchLabels: {app: frontend}</text>

  <text x="235" y="260" text-anchor="middle" fill="#e8e4df" font-size="12">대시 하나 아래 두 셀렉터가 함께 있음</text>
  <rect x="60" y="278" width="350" height="80" rx="6" fill="#e6f7e7"/>
  <text x="235" y="304" text-anchor="middle" font-size="13" style="fill:#14521d" font-weight="700">team=store 네임스페이스 안의</text>
  <text x="235" y="326" text-anchor="middle" font-size="13" style="fill:#14521d" font-weight="700">app=frontend Pod만 허용</text>
  <text x="235" y="348" text-anchor="middle" font-size="11" style="fill:#14521d">교집합 — 좁게 허용</text>
  <text x="235" y="392" text-anchor="middle" fill="#66bb6a" font-size="12" font-weight="700">두 조건을 모두 만족해야 통과</text>
  <text x="235" y="416" text-anchor="middle" fill="#b8b3ad" font-size="11">의도한 최소 권한이면 이쪽</text>

  <!-- OR 패널 -->
  <rect x="480" y="76" width="410" height="360" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="685" y="102" text-anchor="middle" fill="#f44336" font-size="15" font-weight="700">OR — 두 항목 (대시 둘)</text>

  <!-- YAML OR -->
  <rect x="500" y="116" width="370" height="118" rx="5" fill="#1a0d0d"/>
  <text x="516" y="138" fill="#b8b3ad" font-size="12" font-family="monospace">ingress:</text>
  <text x="516" y="156" fill="#e8e4df" font-size="12" font-family="monospace">- from:</text>
  <text x="532" y="174" fill="#f44336" font-size="12" font-family="monospace" font-weight="700">  - namespaceSelector:</text>
  <text x="548" y="192" fill="#e8e4df" font-size="12" font-family="monospace">      matchLabels: {team: store}</text>
  <text x="532" y="210" fill="#f44336" font-size="12" font-family="monospace" font-weight="700">  - podSelector:</text>
  <text x="548" y="228" fill="#e8e4df" font-size="12" font-family="monospace">      matchLabels: {app: frontend}</text>

  <text x="685" y="260" text-anchor="middle" fill="#e8e4df" font-size="12">대시가 둘 — 별개 항목으로 나뉨</text>
  <rect x="510" y="278" width="350" height="80" rx="6" fill="#f2d4d4"/>
  <text x="685" y="300" text-anchor="middle" font-size="13" style="fill:#7a1f1f" font-weight="700">team=store 네임스페이스의 모든 Pod</text>
  <text x="685" y="320" text-anchor="middle" font-size="13" style="fill:#7a1f1f" font-weight="700">또는 정책 NS의 app=frontend Pod</text>
  <text x="685" y="342" text-anchor="middle" font-size="11" style="fill:#7a1f1f">합집합 — 넓게 허용</text>
  <text x="685" y="392" text-anchor="middle" fill="#f44336" font-size="12" font-weight="700">둘 중 하나만 만족해도 통과</text>
  <text x="685" y="416" text-anchor="middle" fill="#b8b3ad" font-size="11">의도치 않게 열리는 실무 사고 1순위</text>
</svg>

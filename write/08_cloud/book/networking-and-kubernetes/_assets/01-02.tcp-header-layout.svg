<svg viewBox="0 0 1000 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="thl-title thl-desc">
  <title id="thl-title">TCP 헤더는 32비트 줄을 쌓아 만든다</title>
  <desc id="thl-desc">TCP 세그먼트 헤더를 32비트 폭의 격자로 그린 배치도. 고정 다섯 줄에 포트·시퀀스 번호·확인 번호·플래그와 윈도우·체크섬이 들어가고, 그 아래 옵션은 가변이라 헤더 길이가 변한다. 아홉 비트가 나란히 붙어 있는 플래그 칸을 초점으로 강조했다.</desc>

  <rect width="100%" height="100%" fill="#0D1117"/>

  <text x="100" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TCP HEADER LAYOUT</text>
  <text x="100" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">TCP 헤더는 32비트 줄을 쌓아 만든다</text>
  <text x="100" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">한 줄이 32비트입니다. 줄 안에서 칸이 어떻게 나뉘는지가 필드 크기입니다.</text>

  <line x1="100" y1="128" x2="900" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="100" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">0</text>
  <text x="300" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">8</text>
  <text x="500" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">16</text>
  <text x="700" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">24</text>
  <text x="884" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="end">31</text>

  <rect x="100" y="164" width="400" height="44" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="300" y="184" fill="#F5F5F3" font-size="13" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">출발지 포트</text>
  <text x="300" y="200" fill="#5E6B7E" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">16 bit</text>

  <rect x="500" y="164" width="400" height="44" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="700" y="184" fill="#F5F5F3" font-size="13" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">목적지 포트</text>
  <text x="700" y="200" fill="#5E6B7E" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">16 bit</text>

  <rect x="100" y="208" width="800" height="44" fill="rgba(106,149,216,0.12)" stroke="#6A95D8" stroke-width="1"/>
  <text x="500" y="228" fill="#6A95D8" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">시퀀스 번호</text>
  <text x="500" y="244" fill="#6A95D8" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">32 bit — 바이트를 센다</text>

  <rect x="100" y="252" width="800" height="44" fill="rgba(106,149,216,0.12)" stroke="#6A95D8" stroke-width="1"/>
  <text x="500" y="272" fill="#6A95D8" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">확인 번호</text>
  <text x="500" y="288" fill="#6A95D8" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">32 bit — 다음에 기대하는 번호</text>

  <rect x="100" y="296" width="100" height="44" fill="rgba(227,179,65,0.12)" stroke="#E3B341" stroke-width="1"/>
  <text x="150" y="316" fill="#E3B341" font-size="11" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">헤더 길이</text>
  <text x="150" y="332" fill="#E3B341" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">4 bit</text>

  <rect x="200" y="296" width="75" height="44" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="237" y="322" fill="#5E6B7E" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">예약 3</text>

  <rect x="275" y="296" width="225" height="44" fill="rgba(240,138,89,0.12)"/>
  <rect x="275" y="296" width="225" height="44" fill="none" stroke="#F08A59" stroke-width="1.4"/>
  <text x="387" y="316" fill="#F08A59" font-size="12" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">플래그 9비트</text>
  <text x="387" y="332" fill="#F08A59" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">SYN ACK FIN RST PSH URG …</text>

  <rect x="500" y="296" width="400" height="44" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="700" y="316" fill="#F5F5F3" font-size="13" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">윈도우 크기</text>
  <text x="700" y="332" fill="#5E6B7E" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">16 bit — 흐름 제어</text>

  <rect x="100" y="340" width="400" height="44" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="300" y="360" fill="#F5F5F3" font-size="13" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">체크섬</text>
  <text x="300" y="376" fill="#5E6B7E" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">16 bit</text>

  <rect x="500" y="340" width="400" height="44" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="700" y="360" fill="#F5F5F3" font-size="13" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">긴급 포인터</text>
  <text x="700" y="376" fill="#5E6B7E" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">16 bit</text>

  <rect x="100" y="384" width="800" height="40" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="500" y="409" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">옵션 — 가변 (0 ~ 320 bit) · 32비트 경계에 맞추는 패딩</text>

  <text x="916" y="192" fill="#5E6B7E" font-size="10" font-family="'Geist Mono', monospace">1</text>
  <text x="916" y="236" fill="#5E6B7E" font-size="10" font-family="'Geist Mono', monospace">2</text>
  <text x="916" y="280" fill="#5E6B7E" font-size="10" font-family="'Geist Mono', monospace">3</text>
  <text x="916" y="324" fill="#5E6B7E" font-size="10" font-family="'Geist Mono', monospace">4</text>
  <text x="916" y="368" fill="#5E6B7E" font-size="10" font-family="'Geist Mono', monospace">5</text>

  <line x1="100" y1="448" x2="900" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="100" y="476" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">배치가 설명해 주는 것</text>

  <text x="100" y="504" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">옵션이 가변이라 헤더 길이가 고정이 아닙니다. 그래서 <tspan fill="#E3B341" font-weight="600">헤더 길이</tspan> 칸이 따로 필요합니다.</text>
  <text x="100" y="528" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">받는 쪽은 그 값을 읽어야 어디부터가 데이터인지 알 수 있습니다.</text>
  <text x="100" y="560" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">플래그 아홉은 각각 <tspan fill="#F5F5F3" font-weight="600">1비트</tspan>라 여러 개를 동시에 켤 수 있습니다.</text>
  <text x="100" y="584" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif"><tspan fill="#F08A59" font-weight="600">SYN-ACK</tspan> 와 <tspan fill="#F08A59" font-weight="600">FIN-ACK</tspan> 가 한 패킷인 이유가 이 칸의 생김새입니다.</text>
</svg>

<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="amf-title amf-desc">
  <title id="amf-title">빈 칸 하나가 채워져 돌아온다</title>
  <desc id="amf-desc">ARP 요청과 응답의 네 칸을 위아래로 나란히 둔 대조. 요청에서는 찾는 쪽 MAC 칸이 비어 있고, 응답에서는 그 칸이 채워져 자리를 바꿔 돌아온다. 비어 있다가 채워지는 그 칸을 초점으로 강조했다.</desc>

  <rect width="100%" height="100%" fill="#0D1117"/>

  <text x="100" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ARP MESSAGE FIELDS</text>
  <text x="100" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">빈 칸 하나가 채워져 돌아온다</text>
  <text x="100" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">ARP 메시지에는 칸이 넷입니다. 아는 것을 적고 모르는 칸을 비워 보냅니다.</text>

  <line x1="100" y1="128" x2="940" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="120" y="156" fill="#6A95D8" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">요청 — 브로드캐스트로 나간다</text>
  <text x="920" y="156" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">보내는 쪽: 10.0.0.5</text>

  <rect x="120" y="172" width="820" height="36" fill="#161B22"/>
  <text x="140" y="196" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">보내는 쪽 IP</text>
  <text x="420" y="196" fill="#F5F5F3" font-size="13" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">10.0.0.5</text>
  <text x="920" y="196" fill="#5E6B7E" font-size="11" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">내 주소</text>

  <rect x="120" y="212" width="820" height="36" fill="#161B22"/>
  <text x="140" y="236" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">보내는 쪽 MAC</text>
  <text x="420" y="236" fill="#F5F5F3" font-size="13" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">2a:4f:1b:8c:d2:e0</text>
  <text x="920" y="236" fill="#5E6B7E" font-size="11" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">랜카드에 이미 있다</text>

  <rect x="120" y="252" width="820" height="36" fill="rgba(106,149,216,0.12)"/>
  <rect x="120" y="252" width="820" height="36" fill="none" stroke="#6A95D8" stroke-width="1"/>
  <text x="140" y="276" fill="#6A95D8" font-size="12" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">찾는 쪽 IP</text>
  <text x="420" y="276" fill="#6A95D8" font-size="13" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">10.0.0.1</text>
  <text x="920" y="276" fill="#6A95D8" font-size="11" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">입력 — 이걸로 묻는다</text>

  <rect x="120" y="292" width="820" height="36" fill="rgba(240,138,89,0.12)"/>
  <rect x="120" y="292" width="820" height="36" fill="none" stroke="#F08A59" stroke-width="1.4"/>
  <text x="140" y="316" fill="#F08A59" font-size="12" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">찾는 쪽 MAC</text>
  <text x="420" y="316" fill="#F08A59" font-size="13" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">00:00:00:00:00:00</text>
  <text x="920" y="316" fill="#F08A59" font-size="11" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">비워 둔다 — 모르는 칸</text>

  <text x="530" y="360" fill="#8B98A9" font-size="13" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">10.0.0.1 이 받아서 자리를 바꿔 답한다</text>

  <line x1="100" y1="380" x2="940" y2="380" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="120" y="408" fill="#3FB98C" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">응답 — 그 한 대에게만 유니캐스트</text>
  <text x="920" y="408" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">보내는 쪽: 10.0.0.1</text>

  <rect x="120" y="424" width="820" height="36" fill="#161B22"/>
  <text x="140" y="448" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">보내는 쪽 IP</text>
  <text x="420" y="448" fill="#F5F5F3" font-size="13" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">10.0.0.1</text>
  <text x="920" y="448" fill="#5E6B7E" font-size="11" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">아까 찾던 그 주소</text>

  <rect x="120" y="464" width="820" height="36" fill="rgba(63,185,140,0.12)"/>
  <rect x="120" y="464" width="820" height="36" fill="none" stroke="#3FB98C" stroke-width="1"/>
  <text x="140" y="488" fill="#3FB98C" font-size="12" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">보내는 쪽 MAC</text>
  <text x="420" y="488" fill="#3FB98C" font-size="13" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">b8:27:eb:14:aa:03</text>
  <text x="920" y="488" fill="#3FB98C" font-size="11" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">출력 — 비었던 값이 여기 담긴다</text>

  <rect x="120" y="504" width="820" height="36" fill="#161B22"/>
  <text x="140" y="528" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">찾는 쪽 IP · MAC</text>
  <text x="420" y="528" fill="#F5F5F3" font-size="13" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">10.0.0.5 · 2a:4f:1b:8c:d2:e0</text>
  <text x="920" y="528" fill="#5E6B7E" font-size="11" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">요청 프레임에서 이미 알았다</text>

  <line x1="100" y1="556" x2="940" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="100" y="584" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL</text>
  <text x="204" y="584" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">입력은 <tspan fill="#6A95D8" font-weight="600">IP</tspan>, 출력은 <tspan fill="#3FB98C" font-weight="600">MAC</tspan> 입니다. 응답의 마지막 줄이 채워져 있어 양쪽이 한 번에 서로를 알게 됩니다.</text>
</svg>

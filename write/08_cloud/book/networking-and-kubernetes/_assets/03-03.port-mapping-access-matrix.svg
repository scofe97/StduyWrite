<svg viewBox="0 0 920 438" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>포트 매핑 접근 매트릭스 — 누가 어디에 닿는가</title>
  <desc>-p 80:8080으로 노출한 컨테이너에 세 출발지(같은 호스트 다른 컨테이너·호스트 자신·다른 호스트)에서 접근할 때, 컨테이너 네트워크 안에서는 컨테이너 포트만, 밖에서는 호스트 포트만 통한다. 컨테이너 사설 IP는 다른 호스트에서 No route다</desc>
  <defs>
    <marker id="m-ok" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#66bb6a"/></marker>
    <marker id="m-no" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f44336"/></marker>
  </defs>
  <rect x="0" y="0" width="920" height="438" fill="#0d0d0d"/>

  <text x="460" y="32" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">포트 매핑 -p 80:8080 — 누가 어디에 닿는가</text>
  <text x="460" y="54" text-anchor="middle" fill="#b8b3ad" font-size="12">안은 컨테이너 · 밖은 호스트 포트</text>

  <!-- Docker 호스트 큰 박스 -->
  <rect x="250" y="80" width="420" height="230" rx="10" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="460" y="102" text-anchor="middle" fill="#5b9bd5" font-size="13" font-weight="700">Docker 호스트 192.168.1.20</text>

  <!-- docker0 브리지 -->
  <rect x="300" y="120" width="320" height="30" rx="4" fill="#dceaf7"/>
  <text x="460" y="140" text-anchor="middle" font-size="12" style="fill:#10243a" font-weight="700">docker0 · 매핑 80→8080</text>

  <!-- go-web 컨테이너 -->
  <rect x="300" y="170" width="180" height="60" rx="6" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.3"/>
  <text x="390" y="192" text-anchor="middle" fill="#66bb6a" font-size="12" font-weight="700">go-web 172.17.0.2</text>
  <rect x="320" y="200" width="140" height="22" rx="3" fill="#e6f7e7"/>
  <text x="390" y="216" text-anchor="middle" font-size="11" style="fill:#14521d" font-weight="700">웹 서버 :8080</text>

  <!-- dnsutils 컨테이너 -->
  <rect x="500" y="170" width="100" height="60" rx="6" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.3"/>
  <text x="550" y="192" text-anchor="middle" fill="#e8e4df" font-size="12" font-weight="700">dnsutils</text>
  <text x="550" y="214" text-anchor="middle" fill="#b8b3ad" font-size="11">172.17.0.3</text>

  <text x="460" y="258" text-anchor="middle" fill="#b8b3ad" font-size="11">두 컨테이너는 각자 별개 네트워크 스택 — localhost 서로 불통</text>
  <text x="460" y="292" text-anchor="middle" fill="#66bb6a" font-size="11" font-weight="700">그래서 Pod 가 필요하다</text>

  <!-- 세 출발지 -->
  <!-- 1. dnsutils → go-web (안) -->
  <line x1="500" y1="200" x2="462" y2="200" stroke="#66bb6a" stroke-width="2" marker-end="url(#m-ok)"/>

  <!-- 2. 호스트 자신 -->
  <rect x="60" y="120" width="150" height="70" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="135" y="146" text-anchor="middle" fill="rgb(212,168,83)" font-size="12" font-weight="700">호스트 자신</text>
  <text x="135" y="168" text-anchor="middle" fill="#b8b3ad" font-size="10">127.0.0.1 · 자기 IP</text>
  <line x1="210" y1="155" x2="298" y2="138" stroke="#66bb6a" stroke-width="2" marker-end="url(#m-ok)"/>
  <text x="222" y="118" text-anchor="start" fill="#66bb6a" font-size="10">127.0.0.1:80 · 172.17.0.2:8080 성공</text>

  <!-- 3. 다른 호스트 -->
  <rect x="60" y="235" width="150" height="70" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.3"/>
  <text x="135" y="261" text-anchor="middle" fill="#f44336" font-size="12" font-weight="700">다른 호스트</text>
  <text x="135" y="283" text-anchor="middle" fill="#b8b3ad" font-size="10">host-2 192.168.1.23</text>
  <line x1="210" y1="255" x2="298" y2="148" stroke="#66bb6a" stroke-width="1.6" marker-end="url(#m-ok)"/>
  <text x="222" y="315" text-anchor="start" fill="#66bb6a" font-size="10">192.168.1.20:80 (호스트 포트) 성공</text>
  <line x1="210" y1="278" x2="298" y2="205" stroke="#f44336" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#m-no)"/>
  <text x="222" y="331" text-anchor="start" fill="#f44336" font-size="10">172.17.0.2:any (컨테이너 IP) — No route</text>

  <!-- 규칙 요약 하단 -->
  <line x1="60" y1="340" x2="860" y2="340" stroke="#2a2520" stroke-width="1"/>
  <text x="60" y="366" fill="#e8e4df" font-size="12" font-weight="700">규칙 두 줄</text>
  <text x="60" y="392" fill="#66bb6a" font-size="12">✓ 컨테이너 네트워크 안 → 컨테이너IP:컨테이너포트(8080)</text>
  <text x="60" y="414" fill="#66bb6a" font-size="12">✓ 밖(호스트·다른 호스트) → 호스트IP:호스트포트(80)</text>
  </svg>

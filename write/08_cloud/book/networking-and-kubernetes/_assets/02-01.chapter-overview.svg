<title id="dt">커널이 패킷을 다루는 법 전체 지도 — 이 편은 점선 안을 다룬다</title><desc id="dd">위는 유저 공간에서 부르는 쪽, 아래는 물리 네트워크. 그 사이 커널 안에서 벌어지는 네 단계가 이 편이다.</desc>
<rect width="1000" height="788" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">02-01 · CHAPTER MAP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">커널이 패킷을 다루는 법 전체 지도 — 이 편은 점선 안을 다룬다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위는 유저 공간, 아래는 물리 네트워크 · 그 사이 커널 안 네 단계가 이 편이다</text>
<rect x="24" y="104" width="952" height="624" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">부르는 쪽과 물리 네트워크 사이에서 커널이 하는 일이 이 편의 범위다</text>
<rect x="156" y="232" width="688" height="332" rx="8" fill="#F08A590A" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="7 6"/>
<rect x="180" y="223" width="167" height="18" fill="#0D1117"/>
<text x="190" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">커널 공간 — 이 편이 다루는 곳</text>
<rect x="180" y="140" width="640" height="72" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1" stroke-dasharray="6 5"/>
<text x="200" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">애플리케이션</text>
<text x="200" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">socket() 을 부른다</text>
<text x="800" y="180" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">유저 공간</text>
<rect x="180" y="236" width="640" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="200" y="264" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">소켓 · fd</text>
<text x="200" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">번역은 커널 몫</text>
<text x="800" y="272" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">§1 · §2</text>

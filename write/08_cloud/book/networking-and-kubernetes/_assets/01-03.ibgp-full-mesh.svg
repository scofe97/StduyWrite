<title id="dt">안쪽은 iBGP 풀메시, 밖으로 나가는 자리만 eBGP</title><desc id="dd">화살표는 한 방향으로 그렸지만 이웃 관계는 쌍방이다 — 점선 상자 하나가 AS 하나다</desc>
<rect width="1000" height="624" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CALICO · iBGP FULL MESH</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">안쪽은 iBGP 풀메시, 밖으로 나가는 자리만 eBGP</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이웃 관계는 쌍방이다 · 점선 상자 하나가 AS 하나</text>
<rect x="24" y="104" width="952" height="456" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">중계가 없으니 모두가 모두와 직접 맺어야 한다</text>
<rect x="296" y="190" width="664" height="316" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="320" y="181" width="221" height="18" fill="#0D1117"/>
<text x="330" y="194" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">AS 64512 — 클러스터 전체가 덩어리 하나</text>
<rect x="48" y="252" width="168" height="96" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="132" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">회사 라우터</text>
<text x="132" y="304" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">AS 65001</text>
<text x="132" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">남의 조직</text>
<rect x="346" y="206" width="168" height="96" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="430" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">노드 1</text>
<text x="430" y="258" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10.244.1.0/24</text>
<text x="430" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">경계 · eBGP 도 한다</text>

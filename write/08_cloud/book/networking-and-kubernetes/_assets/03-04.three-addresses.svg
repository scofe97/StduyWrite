<title id="dt">다른 호스트에서 세 주소 — 둘은 답을 받고 하나는 사라진다</title><desc id="dd">ubuntu2 에서 같은 컨테이너를 세 가지 주소로 부른 여정. 앞의 둘은 목적지 호스트까지 도달해 각각 응답과 거부를 받고, 컨테이너 IP 로 간 것만 게이트웨이 너머에서 응답 없이 사라진다.</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">THREE ADDRESSES · HOW FAR DID IT GET</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">다른 호스트에서 세 주소 — 둘은 답을 받고 하나는 사라진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">거부는 도달했다는 증거입니다 · 응답 화살표가 없는 마지막 한 줄만 성격이 다릅니다</text>
<rect x="24.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="129.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">ubuntu2</text>
<text x="129.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">192.168.139.238</text>
<rect x="383.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="488.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">게이트웨이</text>
<text x="488.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">192.168.139.1</text>
<rect x="742.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="847.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">ubuntu1 · go-web</text>
<text x="847.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">192.168.139.208 · 172.17.0.4</text>
<line x1="129.0" y1="154" x2="129.0" y2="468" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="488.0" y1="154" x2="488.0" y2="468" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="847.0" y1="154" x2="847.0" y2="468" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 139.0 168 L 835.0 168" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="488.0" y="159" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">192.168.139.208:80</text>
<text x="488.0" y="185" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 랜이라 게이트웨이를 안 거친다</text>
<path d="M 837.0 224 L 141.0 224" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4 4"/>
<text x="488.0" y="215" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">200 OK</text>
<text x="488.0" y="241" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">DNAT 이 컨테이너 8080 으로 넘겼다</text>
<path d="M 139.0 292 L 835.0 292" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="488.0" y="283" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">192.168.139.208:8080</text>
<text x="488.0" y="309" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트 포트 8080 을 잡은 것이 없다</text>
<path d="M 837.0 348 L 141.0 348" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4 4"/>
<text x="488.0" y="339" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">TCP RST</text>
<text x="488.0" y="365" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">exit 7 — 거절도 답이다</text>
<path d="M 139.0 416 L 476.0 416" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="308.5" y="407" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">172.17.0.4:80</text>
<text x="308.5" y="433" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">경로가 없어 기본 경로로 떨어진다</text>
<rect x="391.5" y="462" width="193.0" height="20" rx="4" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="488.0" y="476" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">172.17.0.0/16 을 모른다 — 버린다</text>
<text x="24" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">앞의 두 줄은 응답 화살표가 있습니다. 목적지 호스트까지 갔다는 뜻이고, 거부도 그 증거입니다.</text>
<text x="24" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">마지막 줄만 돌아오는 화살표가 없습니다. exit 28 타임아웃이며, 아무도 이 대역이 ubuntu1 것이라고 알려 준 적이 없기 때문입니다.</text>
<text x="24" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그 사실을 알려 주는 일을 오버레이나 경로 광고가 맡습니다. 손댈 곳이 목적지 포트가 아니라 출발지 경로라는 것을 exit 코드가 가릅니다.</text>
<line x1="12" y1="580" x2="952" y2="580" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="602" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="592" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">성공</text>
<rect x="170" y="592" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="192" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">거부 — 도달했다는 증거</text>
<rect x="383" y="592" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="405" y="602" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">타임아웃 — 도중에 사라짐</text>
</svg>
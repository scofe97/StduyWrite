<svg viewBox="0 0 640 410" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>IP 라우팅과 Ethernet 전체 지도</title>
  <desc>배달을 보장하지 않는 IP에서 출발해 주소 체계의 진화, 네트워크 사이를 잇는 BGP 라우팅, 같은 네트워크 안 마지막 한 걸음을 맡는 MAC과 ARP를 지나, 요청 하나의 전 계층 여정으로 합쳐지는 흐름입니다. 범위가 전 지구에서 바로 옆 이웃으로 좁혀집니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10.5px; }
    .sec { fill: #3a3632; font-size: 10px; font-weight: 700; }
    .scope { fill: #b8b3ad; font-size: 10px; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .num { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .caution-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .caution-detail { fill: #0d0d0d; font-size: 10.5px; }
  </style>

  <rect width="640" height="410" fill="#0d0d0d"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <!-- 1. IP best-effort — 주의 -->
  <text class="num" x="34" y="45">1.</text>
  <rect x="54" y="24" width="470" height="52" rx="4" fill="rgb(212,168,83)"/>
  <text class="caution-title" x="72" y="46">주의 · IP 는 도착을 보장 안 함</text>
  <text class="caution-detail" x="72" y="64">신뢰성은 양 끝 TCP 몫</text>
  <text class="sec" x="504" y="46" text-anchor="end">§1</text>

  <path class="arrow" d="M289,76 L289,96" marker-end="url(#ah)"/>

  <!-- 2. 주소 체계 -->
  <text class="num" x="34" y="123">2.</text>
  <rect class="box" x="54" y="102" width="470" height="52" rx="4"/>
  <text class="box-title" x="72" y="124">주소 — CIDR 로, IPv6 로</text>
  <text class="box-detail" x="72" y="142">고갈이 경계를 옮겼다</text>
  <text class="sec" x="504" y="124" text-anchor="end">§2</text>
  <text class="scope" x="548" y="128">전 지구</text>

  <path class="arrow" d="M289,154 L289,174" marker-end="url(#ah)"/>

  <!-- 3. BGP -->
  <text class="num" x="34" y="201">3.</text>
  <rect class="box" x="54" y="180" width="470" height="52" rx="4"/>
  <text class="box-title" x="72" y="202">BGP — 네트워크 사이의 길</text>
  <text class="box-detail" x="72" y="220">ASN 단위 경로 광고</text>
  <text class="sec" x="504" y="202" text-anchor="end">§3</text>
  <text class="scope" x="548" y="206">AS 사이</text>

  <path class="arrow" d="M289,232 L289,252" marker-end="url(#ah)"/>

  <!-- 4. Link -->
  <text class="num" x="34" y="279">4.</text>
  <rect class="box" x="54" y="258" width="470" height="52" rx="4"/>
  <text class="box-title" x="72" y="280">Link — MAC 과 ARP</text>
  <text class="box-detail" x="72" y="298">브로드캐스트로 이웃 찾기</text>
  <text class="sec" x="504" y="280" text-anchor="end">§4</text>
  <text class="scope" x="548" y="284">옆 이웃</text>

  <path class="arrow" d="M289,310 L289,330" marker-end="url(#ah)"/>

  <!-- 5. 전 계층 여정 -->
  <text class="num" x="34" y="357">5.</text>
  <rect class="box" x="54" y="336" width="470" height="52" rx="4"/>
  <text class="box-title" x="72" y="358">요청 하나의 전 계층 여정</text>
  <text class="box-detail" x="72" y="376">내려가며 감싸고 올라가며 벗김</text>
  <text class="sec" x="504" y="358" text-anchor="end">§5</text>
</svg>

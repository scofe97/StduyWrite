<svg viewBox="0 0 920 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Endpoints vs EndpointSlice — 규모가 만든 watch 병목과 그 해법</title>
  <desc>Endpoints는 서비스 하나가 전체 Pod 주소를 담은 객체 하나라, 주소 하나만 바뀌어도 객체 전체가 모든 노드의 kube-proxy에게 재전송돼 대형 클러스터에서 병목이 된다. EndpointSlice는 주소를 부분집합 여러 개로 쪼개, 바뀐 주소가 속한 slice만 전송해 데이터 이동량을 줄인다</desc>
  <defs>
    <marker id="e-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f44336"/></marker>
    <marker id="e-grn" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#66bb6a"/></marker>
  </defs>
  <rect x="0" y="0" width="920" height="440" fill="#0d0d0d"/>

  <text x="460" y="32" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">Endpoints vs EndpointSlice — 주소 하나 바뀔 때 무엇이 전송되는가</text>

  <!-- Endpoints 패널 -->
  <rect x="30" y="60" width="410" height="330" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="235" y="86" text-anchor="middle" fill="#f44336" font-size="15" font-weight="700">Endpoints — 객체 하나 (병목)</text>

  <!-- 큰 객체 -->
  <rect x="70" y="104" width="150" height="150" rx="6" fill="#f2d4d4"/>
  <text x="145" y="126" text-anchor="middle" font-size="12" style="fill:#7a1f1f" font-weight="700">Endpoints 1개</text>
  <text x="145" y="146" text-anchor="middle" font-size="11" style="fill:#7a1f1f">Pod 1000개</text>
  <text x="145" y="162" text-anchor="middle" font-size="11" style="fill:#7a1f1f">주소 전부</text>
  <rect x="84" y="176" width="122" height="14" rx="2" fill="#e89b9b"/>
  <rect x="84" y="194" width="122" height="14" rx="2" fill="#e89b9b"/>
  <rect x="84" y="212" width="122" height="14" rx="2" fill="#e89b9b"/>
  <rect x="84" y="230" width="122" height="14" rx="2" fill="#c94a4a"/>
  <text x="145" y="241" text-anchor="middle" font-size="9" style="fill:#fff" font-weight="700">1개만 변경</text>

  <!-- kube-proxy 다수 -->
  <text x="340" y="120" text-anchor="middle" fill="#e8e4df" font-size="11">kube-proxy</text>
  <text x="340" y="135" text-anchor="middle" fill="#8a8580" font-size="10">× 노드 수천</text>
  <rect x="300" y="146" width="80" height="20" rx="3" fill="#1a1a1a" stroke="#8a8580" stroke-width="0.7"/>
  <rect x="300" y="172" width="80" height="20" rx="3" fill="#1a1a1a" stroke="#8a8580" stroke-width="0.7"/>
  <rect x="300" y="198" width="80" height="20" rx="3" fill="#1a1a1a" stroke="#8a8580" stroke-width="0.7"/>
  <line x1="222" y1="182" x2="296" y2="156" stroke="#f44336" stroke-width="1.6" marker-end="url(#e-red)"/>
  <line x1="222" y1="188" x2="296" y2="182" stroke="#f44336" stroke-width="1.6" marker-end="url(#e-red)"/>
  <line x1="222" y1="194" x2="296" y2="208" stroke="#f44336" stroke-width="1.6" marker-end="url(#e-red)"/>

  <rect x="60" y="278" width="350" height="88" rx="6" fill="#1a0d0d"/>
  <text x="235" y="302" text-anchor="middle" fill="#f44336" font-size="12" font-weight="700">주소 1개 변경 = 객체 전체 재전송</text>
  <text x="235" y="324" text-anchor="middle" fill="#e8e4df" font-size="11">노드 수 × 객체 크기 × 변경 빈도</text>
  <text x="235" y="346" text-anchor="middle" fill="#8a8580" font-size="11">= 클러스터 규모의 궁극적 병목</text>

  <!-- EndpointSlice 패널 -->
  <rect x="480" y="60" width="410" height="330" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="685" y="86" text-anchor="middle" fill="#66bb6a" font-size="15" font-weight="700">EndpointSlice — 부분집합 분할 (해법)</text>

  <!-- 여러 slice -->
  <rect x="520" y="110" width="120" height="34" rx="5" fill="#cdeccf"/>
  <text x="580" y="132" text-anchor="middle" font-size="11" style="fill:#14521d" font-weight="700">Slice A · 100개</text>
  <rect x="520" y="152" width="120" height="34" rx="5" fill="#66bb6a"/>
  <text x="580" y="168" text-anchor="middle" font-size="11" style="fill:#0d0d0d" font-weight="700">Slice B · 100개</text>
  <text x="580" y="181" text-anchor="middle" font-size="9" style="fill:#0d0d0d">← 여기 1개 변경</text>
  <rect x="520" y="194" width="120" height="34" rx="5" fill="#cdeccf"/>
  <text x="580" y="216" text-anchor="middle" font-size="11" style="fill:#14521d" font-weight="700">... Slice N</text>

  <text x="790" y="120" text-anchor="middle" fill="#e8e4df" font-size="11">kube-proxy</text>
  <text x="790" y="135" text-anchor="middle" fill="#8a8580" font-size="10">× 노드 수천</text>
  <rect x="750" y="152" width="80" height="20" rx="3" fill="#1a1a1a" stroke="#8a8580" stroke-width="0.7"/>
  <rect x="750" y="178" width="80" height="20" rx="3" fill="#1a1a1a" stroke="#8a8580" stroke-width="0.7"/>
  <line x1="642" y1="169" x2="746" y2="162" stroke="#66bb6a" stroke-width="2" marker-end="url(#e-grn)"/>
  <text x="700" y="150" text-anchor="middle" fill="#66bb6a" font-size="10">Slice B만 전송</text>

  <rect x="510" y="248" width="350" height="118" rx="6" fill="#0d1a0d"/>
  <text x="685" y="272" text-anchor="middle" fill="#66bb6a" font-size="12" font-weight="700">바뀐 slice만 전송 = 데이터 이동 급감</text>
  <text x="685" y="296" text-anchor="middle" fill="#e8e4df" font-size="11">기본 100개 · 최대 1,000개 (--max-endpoints-per-slice)</text>
  <text x="685" y="318" text-anchor="middle" fill="#8a8580" font-size="11">재균형 없음 · 트랜잭션 API 없어 일시적 중복 가능</text>
  <text x="685" y="340" text-anchor="middle" fill="#8a8580" font-size="11">kube-proxy 설계는 그대로 (전 노드 watch 유지)</text>
  <text x="685" y="360" text-anchor="middle" fill="#8a8580" font-size="10">소비 코드는 같은 주소의 중복 등장을 처리해야 함</text>
</svg>

<svg viewBox="0 0 1000 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pf-title pf-desc">
  <title id="pf-title">프리픽스 숫자가 커질수록 범위는 좁아진다</title>
  <desc id="pf-desc">프리픽스 넷의 주소 범위를 막대 길이로 비교한 스팬 차트.</desc>
  <rect width="100%" height="100%" fill="#0D1117"/>
  <text x="60" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.18em">SPAN</text>
  <text x="60" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">프리픽스 숫자가 커질수록 범위는 좁아진다</text>
  <text x="60" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">막대 길이가 곧 그 프리픽스가 담는 주소 범위입니다. /24 가 이 편에서 쓰는 기준입니다.</text>
  <text x="60" y="174" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">/8</text>
  <rect x="128" y="152" width="700" height="28" fill="#8B98A9" opacity="0.35"/>
  <text x="844" y="172" fill="#8B98A9" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">16,777,216 개</text>
  <text x="60" y="234" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">/16</text>
  <rect x="128" y="212" width="440" height="28" fill="#8B98A9" opacity="0.35"/>
  <text x="584" y="232" fill="#8B98A9" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">65,536 개</text>
  <text x="60" y="294" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">/24</text>
  <rect x="128" y="272" width="220" height="28" fill="#F08A59" opacity="0.35"/>
  <rect x="128" y="272" width="220" height="28" fill="none" stroke="#F08A59" stroke-width="1.4"/>
  <text x="364" y="292" fill="#F08A59" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">256 개</text>
  <text x="60" y="354" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">/32</text>
  <rect x="128" y="332" width="56" height="28" fill="#8B98A9" opacity="0.35"/>
  <text x="200" y="352" fill="#8B98A9" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">1 개</text>
  <line x1="60" y1="404" x2="958" y2="404" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="60" y="434" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">앞 24 비트가 네트워크부라는 뜻이고, 남은 8 비트가 그 동네의 주소 수를 정합니다.</text>
</svg>

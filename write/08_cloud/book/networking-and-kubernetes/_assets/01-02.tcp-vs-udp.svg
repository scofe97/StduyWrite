<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 938 408" width="100%" role="img" aria-labelledby="tut tud">
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker></defs>
<title id="tut">TCP 와 UDP — 같은 저울의 반대편</title>
<desc id="tud">TCP와 UDP를 헤더 구성·할 수 있는 일·치르는 값 세 축으로 나란히 비교한 행렬. 윗줄과 아랫줄이 같은 모양으로 이어져, 헤더에 무엇을 두느냐가 능력을 정하고 그 능력이 다시 비용으로 돌아오는 구조를 보여준다.</desc>
<rect width="938" height="408" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPARISON MATRIX · 01-02 TRANSPORT</text>
<text x="12" y="52" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TCP 와 UDP — 같은 저울의 반대편</text>
<text x="12" y="72" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="11" fill="#8B98A9">헤더에 무엇을 두느냐가 할 수 있는 일을 정하고, 그 능력이 다시 값으로 돌아옵니다.</text>
<rect x="174" y="84" width="228" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)"/>
<text x="288.0" y="111" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">헤더에 무엇을 두나</text>
<rect x="418" y="84" width="228" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)"/>
<text x="532.0" y="111" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">그래서 할 수 있는 일</text>
<rect x="662" y="84" width="228" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)"/>
<text x="776.0" y="111" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">그래서 치르는 값</text>
<rect x="12" y="84" width="150" height="44" rx="6" fill="none" stroke="rgba(191,192,192,0.22)"/>
<text x="87.0" y="111" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" font-size="9" fill="#5E6B7E">프로토콜 vs. 축</text>
<rect x="12" y="148" width="150" height="92" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="87.0" y="190" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" font-size="20" font-weight="600" fill="#3FB98C">TCP</text>
<text x="87.0" y="210" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" fill="#8B98A9">연결 지향 · 기본값</text>
<rect x="174" y="148" width="228" height="92" rx="6" fill="#6A95D812" stroke="#6A95D859" stroke-width="0.9"/>
<text x="288.0" y="186" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Seq · Ack · Window · Flags</text>
<text x="288.0" y="210" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" fill="#6A95D8">10필드 · 최소 20바이트</text>
<path d="M 404 194.0 L 416 194.0" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="418" y="148" width="228" height="92" rx="6" fill="#3FB98C12" stroke="#3FB98C59" stroke-width="0.9"/>
<text x="532.0" y="186" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">재전송 · 순서 재조립 · 흐름 제어</text>
<text x="532.0" y="210" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" fill="#3FB98C">유실을 메운다</text>
<path d="M 648 194.0 L 660 194.0" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="662" y="148" width="228" height="92" rx="6" fill="#E3B34112" stroke="#E3B34159" stroke-width="0.9"/>
<text x="776.0" y="186" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">핸드셰이크 3 + 종료 4 · 지연</text>
<text x="776.0" y="210" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" fill="#E3B341">7패킷을 먼저 지불</text>
<rect x="12" y="252" width="150" height="92" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.2"/>
<text x="87.0" y="294" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" font-size="20" font-weight="600" fill="#F08A59">UDP</text>
<text x="87.0" y="314" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" fill="#8B98A9">비연결 · 명시 지정 필요</text>
<rect x="174" y="252" width="228" height="92" rx="6" fill="#6A95D812" stroke="#6A95D859" stroke-width="0.9"/>
<text x="288.0" y="290" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Src · Dst · Length · Checksum</text>
<text x="288.0" y="314" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" fill="#6A95D8">4필드 · 최소 8바이트</text>
<path d="M 404 298.0 L 416 298.0" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="418" y="252" width="228" height="92" rx="6" fill="#F0616D12" stroke="#F0616D59" stroke-width="0.9"/>
<text x="532.0" y="290" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">없음 — 보내고 잊는다</text>
<text x="532.0" y="314" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" fill="#F0616D">유실을 견뎌야 한다</text>
<path d="M 648 298.0 L 660 298.0" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="662" y="252" width="228" height="92" rx="6" fill="#3FB98C12" stroke="#3FB98C59" stroke-width="0.9"/>
<text x="776.0" y="290" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">없음 · 지연 없는 전달</text>
<text x="776.0" y="314" text-anchor="middle" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" fill="#3FB98C">값을 치르지 않는다</text>
<line x1="12" y1="364" x2="890" y2="364" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="386" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" font-size="8" letter-spacing="0.14em" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="376" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="386" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" fill="#8B98A9">헤더 구성</text>
<rect x="209" y="376" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="231" y="386" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" fill="#8B98A9">얻는 능력</text>
<rect x="318" y="376" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="340" y="386" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" fill="#8B98A9">치르는 값</text>
<rect x="427" y="376" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="449" y="386" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" fill="#8B98A9">포기한 것</text>
</svg>
<title id="dt">여섯 방향 — 어디서 부르느냐가 결과를 정한다</title><desc id="dd">포트 매핑된 컨테이너를 호스트 스택과 다른 컨테이너 스택에서 각각 세 번씩 두드린 결과. 안에서는 컨테이너 포트만, 밖에서는 호스트 포트만 통한다는 규칙이 레인별로 드러난다.</desc>
<rect width="1000" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SIX PROBES · SAME CONTAINER, TWO VANTAGE POINTS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">여섯 방향 — 어디서 부르느냐가 결과를 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">레인 = 두드린 자리(그 자리가 선 네트워크 스택) · exit 7 은 거부이고 도달했다는 증거입니다</text>
<rect x="24" y="112" width="952" height="152" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="24" y="112" width="4" height="152" rx="2" fill="#6A95D8"/>
<text x="42" y="138" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">호스트 스택에서</text>
<text x="42" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">ubuntu · 192.168.139.208</text>
<rect x="84" y="166" width="264" height="72" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="100" y="188" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">172.17.0.4:8080</text>
<text x="332" y="188" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">200</text>
<text x="100" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">docker0 대역 경로가 있다</text>
<rect x="380" y="166" width="264" height="72" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="396" y="188" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">127.0.0.1:80</text>
<text x="628" y="188" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">200</text>
<text x="396" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">docker-proxy 가 듣고 있다</text>
<rect x="676" y="166" width="264" height="72" rx="6" fill="#0D1117" stroke="#F0616D" stroke-width="1.2"/>
<text x="692" y="188" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">127.0.0.1:8080</text>
<text x="924" y="188" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">exit 7</text>
<text x="692" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트에 8080 을 잡은 놈이 없다</text>
<rect x="24" y="288" width="952" height="152" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="24" y="288" width="4" height="152" rx="2" fill="#3FB98C"/>
<text x="42" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">다른 컨테이너 스택에서</text>
<text x="42" y="334" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">dnsutils · nsenter -n</text>
<rect x="84" y="342" width="264" height="72" rx="6" fill="#0D1117" stroke="#3FB98C" stroke-width="1.2"/>
<text x="100" y="364" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">172.17.0.4:8080</text>
<text x="332" y="364" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">200</text>
<text x="100" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 브리지 · 직접 간다</text>
<rect x="380" y="342" width="264" height="72" rx="6" fill="#0D1117" stroke="#F0616D" stroke-width="1.2"/>
<text x="396" y="364" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">172.17.0.4:80</text>
<text x="628" y="364" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F0616D">exit 7</text>
<text x="396" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">80 은 호스트 경계에만 있다</text>
<rect x="676" y="342" width="264" height="72" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="692" y="364" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">localhost:8080</text>
<text x="924" y="364" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">exit 7</text>
<text x="692" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자기 스택 안에는 아무도 없다</text>
<text x="24" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">같은 열을 세로로 견주면 규칙이 보입니다. 가운데 열은 위아래가 정반대이고, 그 이유가 포트 매핑이 놓인 자리입니다.</text>
<text x="24" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">오른쪽 아래 칸이 Pod 로 이어집니다. Pod 안 컨테이너들은 네임스페이스를 공유해 이 벽을 일부러 없앤 구조입니다.</text>
<line x1="12" y1="528" x2="952" y2="528" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="550" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="540" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="550" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Pod 로 이어지는 자리</text>
<rect x="313" y="540" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="335" y="550" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">성공</text>
<rect x="383" y="540" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="405" y="550" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">거부</text>
<rect x="453" y="540" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="475" y="550" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트 스택</text>
</svg>
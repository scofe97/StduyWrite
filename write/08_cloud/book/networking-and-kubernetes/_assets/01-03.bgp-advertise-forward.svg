<text x="309.0" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">150.10.0.0/16 은 나를 거치면 닿는다</text>
<path d="M 140.0 408 L 476.0 408" fill="none" stroke="#F5F5F3" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="309.0" y="396" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">목적지 150.10.2.30 · 전체 경로는 모른 채 넘긴다</text>
<path d="M 498.0 456 L 834.0 456" fill="none" stroke="#F5F5F3" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="667.0" y="444" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">채워 둔 표에서 다음 AS 를 고른다</text>
<path d="M 836.0 520 L 142.0 520" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)" stroke-dasharray="6 5"/>
<text x="828.0" y="508" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">도착 — 어느 AS 도 전체 경로를 갖고 있지 않았다</text>
<line x1="12" y1="600" x2="952" y2="600" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="622" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

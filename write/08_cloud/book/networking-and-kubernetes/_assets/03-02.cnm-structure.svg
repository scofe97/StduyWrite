<title id="dt">CNM 세 부품과 CNM 이 제공하지 않는 것</title><desc id="dd">sandbox·endpoint·network 셋은 libnetwork 안에 있다. 여러 호스트를 묶으려면 밖에 KV 저장소를 따로 세워야 한다.</desc>
<rect width="1000" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CNM · THREE PARTS AND ONE GAP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">CNM 세 부품과 CNM 이 제공하지 않는 것</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">세 부품은 안에 있고, 여러 호스트를 묶는 저장소는 밖에서 따로 세워야 한다</text>
<rect x="24" y="104" width="952" height="448" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">부품 셋으로 한 호스트는 되고, 여러 호스트는 밖의 저장소가 있어야 된다</text>
<rect x="40" y="216" width="706" height="268" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="56" y="207" width="193" height="18" fill="#0D1117"/>
<text x="66" y="220" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">libnetwork — Docker 의 CNM 구현</text>
<rect x="50" y="240" width="200" height="104" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="150" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">네트워크 컨트롤러</text>
<text x="150" y="294" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Docker engine API</text>
<text x="150" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">배선을 지휘</text>
<rect x="50" y="372" width="200" height="104" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="150" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">sandbox</text>
<text x="150" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">netns 를 관리</text>
<text x="150" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">호스트의 모든 컨테이너</text>
<rect x="300" y="306" width="200" height="104" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="400" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">endpoint</text>
<text x="400" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">네트워크 위의 호스트</text>
<text x="400" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">iptables 로 격리</text>
<rect x="530" y="306" width="200" height="104" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="630" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">network</text>
<text x="630" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">endpoint 의 집합</text>
<text x="630" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">global 드라이버가 조율</text>
<rect x="766" y="306" width="200" height="104" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="866" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">외부 KV 저장소</text>
<text x="866" y="360" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Consul·etcd·Zookeeper</text>
<text x="866" y="384" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">CNM 이 제공하지 않음</text>
<path d="M 256 292 L 275 292 L 275 336 L 290 336" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 256 424 L 275 424 L 275 380 L 290 380" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 506 358 L 520 358" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 736 358 L 756 358" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)" stroke-dasharray="6 5"/>
<text x="866" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">libkv 의존</text>
<text x="36" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여러 호스트를 하나의 오버레이로 묶으려면 Consul 같은 저장소를 따로 세워야 한다 — 그 빈칸이 CNI 와 갈리는 지점 중 하나다</text>
<line x1="12" y1="568" x2="952" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="590" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="580" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">libnetwork 안</text>
<rect x="300" y="580" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="322" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">CNM 이 제공하지 않는 것</text>
</svg>
<svg viewBox="0 0 780 412" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>TCP "Hello" 요청의 12패킷 — 실제 데이터는 2개뿐</title>
  <desc>클라이언트와 서버 사이 HTTP "Hello" 요청 하나에 오가는 12개 패킷 중 핸드셰이크·확인응답·종료가 10개, 실제 데이터 전송은 2개뿐임을 보여준다</desc>
  <defs>
    <marker id="tpBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#5b9bd5"/></marker>
    <marker id="tpGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#66bb6a"/></marker>
    <marker id="tpGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#b8b3ad"/></marker>
  </defs>
  <rect x="0" y="0" width="780" height="412" fill="#0d0d0d"/>

  <text x="390" y="30" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">"Hello" 요청 하나 = 12패킷, 그중 데이터는 2개</text>

  <!-- 두 lifeline -->
  <text x="150" y="62" text-anchor="middle" fill="#dceaf7" font-size="14" font-weight="700">Client</text>
  <text x="630" y="62" text-anchor="middle" fill="#f5edda" font-size="14" font-weight="700">Server :8080</text>
  <line x1="150" y1="72" x2="150" y2="410" stroke="#3a3a3a" stroke-width="1.5"/>
  <line x1="630" y1="72" x2="630" y2="410" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- 구간 라벨 -->
  <text x="40" y="108" fill="rgb(212,168,83)" font-size="12" font-weight="700">핸드셰이크</text>
  <text x="40" y="228" fill="#66bb6a" font-size="12" font-weight="700">데이터</text>
  <text x="40" y="330" fill="#b8b3ad" font-size="12" font-weight="700">종료</text>

  <!-- 핸드셰이크 3 -->
  <line x1="150" y1="96" x2="628" y2="112" stroke="#5b9bd5" stroke-width="2" marker-end="url(#tpBlue)"/>
  <text x="390" y="98" text-anchor="middle" fill="#b8b3ad" font-size="11">(1) SYN</text>
  <line x1="630" y1="128" x2="152" y2="144" stroke="#5b9bd5" stroke-width="2" marker-end="url(#tpBlue)"/>
  <text x="390" y="130" text-anchor="middle" fill="#b8b3ad" font-size="11">(2) SYN-ACK</text>
  <line x1="150" y1="160" x2="628" y2="176" stroke="#5b9bd5" stroke-width="2" marker-end="url(#tpBlue)"/>
  <text x="390" y="162" text-anchor="middle" fill="#b8b3ad" font-size="11">(3) ACK</text>

  <!-- 데이터 2 (강조) -->
  <line x1="150" y1="212" x2="628" y2="228" stroke="#66bb6a" stroke-width="3.5" marker-end="url(#tpGreen)"/>
  <text x="390" y="208" text-anchor="middle" fill="#66bb6a" font-size="12" font-weight="700">(4) GET / (PSH-ACK, 78 bytes) ← 진짜 데이터</text>
  <line x1="630" y1="252" x2="152" y2="268" stroke="#66bb6a" stroke-width="3.5" marker-end="url(#tpGreen)"/>
  <text x="390" y="248" text-anchor="middle" fill="#66bb6a" font-size="12" font-weight="700">(5) "Hello" 응답 (121 bytes) ← 진짜 데이터</text>
  <line x1="150" y1="284" x2="628" y2="292" stroke="#b8b3ad" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#tpGray)"/>
  <text x="390" y="286" text-anchor="middle" fill="#b8b3ad" font-size="10">(6) ACK (수신 확인)</text>

  <!-- 종료 4 -->
  <line x1="150" y1="322" x2="628" y2="330" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#tpGray)"/>
  <text x="390" y="324" text-anchor="middle" fill="#b8b3ad" font-size="10">(7) FIN-ACK</text>
  <line x1="630" y1="346" x2="152" y2="354" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#tpGray)"/>
  <text x="390" y="348" text-anchor="middle" fill="#b8b3ad" font-size="10">(8) ACK</text>
  <line x1="630" y1="370" x2="152" y2="378" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#tpGray)"/>
  <text x="390" y="372" text-anchor="middle" fill="#b8b3ad" font-size="10">(9) FIN-ACK</text>
  <line x1="150" y1="386" x2="628" y2="394" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#tpGray)"/>
  <text x="390" y="388" text-anchor="middle" fill="#b8b3ad" font-size="10">(10) ACK</text>

  <!-- 결론 -->
</svg>

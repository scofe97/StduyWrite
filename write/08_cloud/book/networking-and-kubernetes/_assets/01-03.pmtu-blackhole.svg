<title id="dt">크면 버리고 크기를 알려 준다 — 그 알림이 막히면 조용히 사라진다</title><desc id="dd">DF 비트를 세운 패킷이 링크 MTU 를 넘었을 때의 두 갈래. 위는 라우터의 ICMP 가 돌아와 송신이 크기를 줄이는 정상 경로이고, 아래는 그 ICMP 가 차단돼 같은 크기로 재전송만 반복하는 경우다.</desc>
<rect width="1000" height="668" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">PATH MTU DISCOVERY · AND ITS BLACK HOLE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">크면 버리고 크기를 알려 준다 — 그 알림이 막히면 조용히 사라진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 묶음의 차이는 화살표 하나입니다 · 아래 묶음에는 돌아오는 알림이 없습니다</text>
<rect x="24.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="129.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">송신 호스트</text>
<text x="129.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">MTU 1500</text>
<rect x="383.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="488.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">중간 라우터</text>
<text x="488.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">다음 링크 MTU 1450</text>
<rect x="742.0" y="104" width="210" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="847.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">목적지</text>
<text x="847.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">웹 서버</text>
<line x1="129.0" y1="154" x2="129.0" y2="512" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="488.0" y1="154" x2="488.0" y2="512" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="847.0" y1="154" x2="847.0" y2="512" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 139.0 176 L 476.0 176" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="308.5" y="167" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">1500B  DF=1</text>
<text x="308.5" y="193" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">쪼개지 말라는 표시를 세워 보낸다</text>
<rect x="423.0" y="218" width="130.0" height="20" rx="4" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="488.0" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">1450 을 넘는다 — 버린다</text>
<path d="M 478.0 280 L 141.0 280" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4 4"/>
<text x="308.5" y="271" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">ICMP  Frag Needed  MTU=1450</text>
<text x="308.5" y="297" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">버렸다 + 이만큼으로 줄여라</text>
<path d="M 139.0 332 L 835.0 332" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="488.0" y="323" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">1450B  DF=1</text>
<text x="488.0" y="349" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">줄여서 다시 — 통과한다</text>
<path d="M 139.0 400 L 476.0 400" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="308.5" y="391" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">1500B  DF=1</text>
<text x="308.5" y="417" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 패킷, 같은 표시</text>
<rect x="398.5" y="442" width="179.0" height="20" rx="4" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="488.0" y="456" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">버린다 — 그런데 ICMP 가 차단돼 있다</text>
<path d="M 139.0 494 L 187.0 494 L 187.0 514 L 142.0 514" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="197.0" y="500" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">재전송 · 재전송 · 재전송</text>
<text x="197.0" y="517" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">줄이라는 말을 못 들었으니 크기를 안 바꾼다</text>
<text x="24" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">위 묶음은 라우터가 두 번 말합니다 — 버렸다는 사실과 얼마로 줄이라는 값을 함께 보냅니다. 그래서 통신이 이어집니다.</text>
<text x="24" y="580" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">아래 묶음에는 그 말이 없습니다. 송신은 왜 안 가는지 모른 채 같은 크기로 재전송하다 멈춥니다. 이것이 PMTU 블랙홀입니다.</text>
<text x="24" y="604" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">작은 요청은 잘 되고 응답이 큰 것만 멈추므로 "네트워크가 안 된다"가 아니라 "어떤 API 만 가끔 멈춘다"로 나타납니다.</text>
<line x1="12" y1="628" x2="952" y2="628" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="650" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="640" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="650" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">알림이 돌아온다</text>
<rect x="248" y="640" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="270" y="650" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보낸 패킷</text>
<rect x="357" y="640" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="379" y="650" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">버리는 판단</text>
<rect x="479" y="640" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="501" y="650" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">알림이 없다</text>
</svg>
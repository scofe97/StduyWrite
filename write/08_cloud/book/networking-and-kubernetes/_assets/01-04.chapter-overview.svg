<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">1장 패킷 캡처 실습 전체 지도 — 관측 방법이 절을 가른다</title><desc id="dd">점선 두 개가 어느 인터페이스에서 잡는지를 가른다. §4 만 두 점선 밖에 있는데, 그 절은 패킷을 잡는 대신 소켓 상태를 조회한다.</desc>
<rect width="1000" height="604" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">01-04 · LAB MAP</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">1장 패킷 캡처 실습 전체 지도 — 관측 방법이 절을 가른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">점선 두 개가 어느 인터페이스에서 잡는지 가른다 · §4 만 그 밖에 있다</text>
<rect x="24" y="104" width="952" height="444" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">통제된 lo0 에서 시작해 실제 랜인 en0 으로 넓힌다</text>
<rect x="40" y="312" width="418" height="136" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="64" y="303" width="174" height="18" fill="#0D1117"/>
<text x="74" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">lo0 캡처 — 잡음 없는 통제 환경</text>
<rect x="514" y="312" width="448" height="136" rx="8" fill="#E3B34106" stroke="#E3B341" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="538" y="303" width="113" height="18" fill="#0D1117"/>
<text x="548" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">en0 캡처 — 실제 랜</text>
<rect x="56" y="326" width="172" height="108" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="142" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">§1 관측 지점</text>
<text x="142" y="378" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">lo0 이냐 en0 이냐</text>
<text x="142" y="406" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">무엇이 보일지가 갈린다</text>
<rect x="270" y="326" width="172" height="108" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="356" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">§2 패킷 12개</text>
<text x="356" y="378" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">요청 하나를 센다</text>
<text x="356" y="406" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">L3 · L4 만 보인다</text>
<rect x="530" y="326" width="172" height="108" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="616" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">§3 ARP 일으키기</text>
<text x="616" y="378" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">캐시를 지우고 다시</text>
<text x="616" y="406" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">L2 가 열린다</text>
<rect x="774" y="326" width="172" height="108" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="860" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">§5 대조</text>
<text x="860" y="378" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TLS 평문 · UDP</text>
<text x="860" y="406" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">L7 경계 · L4 개수</text>
<rect x="652" y="170" width="172" height="108" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="738" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">§4 소켓 상태</text>
<text x="738" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TIME-WAIT · CLOSE-WAIT</text>
<text x="738" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">캡처가 아니라 ss 로</text>
<path d="M 236 380 L 260 380" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="249" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">고른 뒤</text>
<path d="M 450 380 L 520 380" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="486" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">옮겨서</text>
<path d="M 616 320 L 616 224 L 642 224" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 832 224 L 860 224 L 860 316" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="738" y="154" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">두 점선 밖 — 패킷을 잡지 않는다</text>
<text x="36" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">각 칸 아래의 꼬리표가 그 실습에서 열리는 계층이다 — 관측 지점을 옮기면 열리는 계층이 함께 바뀐다</text>
<line x1="12" y1="564" x2="952" y2="564" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="586" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="576" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="586" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">lo0 에서</text>
<rect x="222" y="576" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="244" y="586" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">en0 에서</text>
<rect x="344" y="576" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="366" y="586" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">캡처가 아닌 절</text>
</svg>
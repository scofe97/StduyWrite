<title id="dt">윈도우 크기 — 확인 응답마다 새로 실려 오는 여유분</title><desc id="dd">TCP 흐름 제어. 수신 측이 확인 응답마다 알리는 윈도우 크기가 줄었다 늘었다 한다. 0이 되면 송신이 멈추고, 수신 애플리케이션이 버퍼를 읽어 가야 창이 다시 열린다.</desc>
<rect width="1000" height="740" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 01-02 TCP WINDOW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">윈도우 크기 — 확인 응답마다 새로 실려 오는 여유분</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">보내는 쪽이 멈추는 자리가 win=0 입니다 — 기다리는 대상은 망이 아니라 받는 쪽 앱입니다.</text>
<rect x="24.0" y="104" width="168" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="108.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">보내는 쪽</text>
<text x="108.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">sender</text>
<rect x="632.0" y="104" width="168" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="716.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">받는 쪽</text>
<text x="716.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">receiver</text>
<line x1="108.0" y1="154" x2="108.0" y2="670" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="716.0" y1="154" x2="716.0" y2="670" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<text x="908.0" y="182" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">수신 버퍼 여유</text>
<path d="M 118.0 200 L 704.0 200" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="412.0" y="191" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">DATA 1000B</text>
<path d="M 706.0 254 L 120.0 254" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)" stroke-dasharray="4 4"/>
<text x="412.0" y="245" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">ACK  win=4000</text>
<text x="412.0" y="269" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여유 넉넉 — 계속 보내도 된다</text>
<rect x="856" y="244" width="104" height="20" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="856" y="244" width="104.0" height="20" rx="4" fill="#6A95D844" stroke="#6A95D8" stroke-width="1.1"/>
<text x="968" y="258" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">4000</text>
<path d="M 118.0 308 L 704.0 308" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="412.0" y="299" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">DATA 2000B</text>
<path d="M 706.0 362 L 120.0 362" fill="none" stroke="#E3B341" stroke-width="1.3" marker-end="url(#warn)" stroke-dasharray="4 4"/>
<text x="412.0" y="353" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">ACK  win=2000</text>
<text x="412.0" y="377" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">처리에 밀리기 시작 — 창이 줄었다</text>
<rect x="856" y="352" width="104" height="20" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="856" y="352" width="52.0" height="20" rx="4" fill="#E3B34144" stroke="#E3B341" stroke-width="1.1"/>
<text x="968" y="366" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#E3B341">2000</text>
<path d="M 118.0 416 L 704.0 416" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="412.0" y="407" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">DATA 2000B</text>
<path d="M 706.0 470 L 120.0 470" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)" stroke-dasharray="4 4"/>
<text x="412.0" y="461" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">ACK  win=0</text>
<text x="412.0" y="485" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">버퍼가 찼다 — 송신이 멈춘다</text>
<rect x="856" y="460" width="104" height="20" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="968" y="474" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">0</text>
<rect x="38.0" y="510" width="140" height="28" rx="6" fill="#F0616D1A" stroke="#F0616D" stroke-width="1.3"/>
<text x="108.0" y="529" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">송신 정지</text>
<text x="228.0" y="529" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">망은 한가한데 데이터가 흐르지 않는다</text>
<path d="M 706.0 578 L 120.0 578" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)" stroke-dasharray="4 4"/>
<text x="412.0" y="569" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">Window Update  win=3000</text>
<text x="412.0" y="593" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앱이 읽어 갔다 — 창이 다시 열린다</text>
<rect x="856" y="568" width="104" height="20" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="856" y="568" width="78.0" height="20" rx="4" fill="#F08A5944" stroke="#F08A59" stroke-width="1.1"/>
<text x="968" y="582" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">3000</text>
<path d="M 118.0 632 L 704.0 632" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="412.0" y="623" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">DATA 2000B</text>
<line x1="12" y1="696" x2="952" y2="696" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="718" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="708" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="718" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터 전송</text>
<rect x="222" y="708" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="244" y="718" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">창이 줄었다</text>
<rect x="344" y="708" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="366" y="718" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">창이 닫혔다 win=0</text>
<rect x="544" y="708" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="566" y="718" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앱이 읽어 창이 열림</text>
</svg>
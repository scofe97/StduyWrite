<path d="M 620 204 L 808 204 L 808 272" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<path d="M 808 374 L 808 444 L 622 444" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="792" y="250" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">물리 케이블로 나가지 않는다</text>
<text x="36" y="514" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">tcpdump -i lo0 이 잡은 자리가 바로 이 접히는 지점이다 — 나가는 프레임과 돌아오는 프레임이 같은 인터페이스에서 관측된다</text>
<line x1="12" y1="564" x2="952" y2="564" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

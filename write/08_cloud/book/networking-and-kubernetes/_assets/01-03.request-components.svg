<title id="dt">요청 하나가 지나는 실제 구성 요소 — lo0 에서 접혀 되돌아온다</title><desc id="dd">계층 이름 대신 실제로 존재하는 구성 요소로 같은 여정을 놓으면 가운데가 접힌다</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">curl localhost:8080 · COMPONENT PATH</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">요청 하나가 지나는 실제 구성 요소 — lo0 에서 접혀 되돌아온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">계층 이름 대신 실제 구성 요소로 놓으면 — 가운데가 접힌다</text>
<rect x="24" y="104" width="952" height="440" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">같은 커널이 송신 경로에서 헤더를 붙이고 수신 경로에서 그것을 벗긴다</text>
<rect x="52" y="162" width="160" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="132" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">cURL 프로세스</text>
<text x="132" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사용자 공간</text>
<text x="132" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">REQUEST START</text>

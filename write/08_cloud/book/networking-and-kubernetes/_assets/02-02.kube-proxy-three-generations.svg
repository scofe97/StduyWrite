<svg viewBox="0 0 900 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>kube-proxy 서비스 구현의 3세대 — iptables · IPVS · eBPF</title>
  <desc>iptables는 규칙 리스트를 선형 순회해 대규모에서 느려지고, IPVS는 해시 기반 전용 밸런서로 규모를 풀며, eBPF는 커널 안에서 직접 실행해 Netfilter 경로 자체를 줄인다</desc>
  <defs>
    <marker id="g3arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="rgb(212,168,83)"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#0d0d0d"/>

  <text x="450" y="32" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">kube-proxy 서비스 구현의 3세대 — 규모가 커질수록 경로를 줄인다</text>

  <!-- 3 세대 박스 -->
  <!-- iptables -->
  <rect x="40" y="70" width="240" height="230" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="160" y="98" text-anchor="middle" fill="#f44336" font-size="15" font-weight="700">1세대 · iptables</text>
  <text x="160" y="122" text-anchor="middle" fill="#e8e4df" font-size="12">Netfilter 규칙 리스트</text>
  <rect x="60" y="140" width="200" height="24" rx="3" fill="#f5edda"/>
  <text x="160" y="157" text-anchor="middle" font-size="11" style="fill:#0d0d0d">확률 DNAT fan-out (1/n)</text>
  <text x="160" y="188" text-anchor="middle" fill="#e8e4df" font-size="11">선형 순회 + 전체 교체 갱신</text>
  <text x="160" y="212" text-anchor="middle" fill="#8a8580" font-size="11">20,000 서비스</text>
  <text x="160" y="232" text-anchor="middle" fill="#f44336" font-size="12" font-weight="700">= 160,000 룰 · 갱신 5시간</text>
  <text x="160" y="264" text-anchor="middle" fill="#8a8580" font-size="11">부하 피드백 없음</text>
  <text x="160" y="284" text-anchor="middle" fill="#8a8580" font-size="11">연결 수명 동안 백엔드 고정</text>

  <!-- IPVS -->
  <rect x="330" y="70" width="240" height="230" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="450" y="98" text-anchor="middle" fill="rgb(212,168,83)" font-size="15" font-weight="700">2세대 · IPVS</text>
  <text x="450" y="122" text-anchor="middle" fill="#e8e4df" font-size="12">L4 로드밸런싱 전용</text>
  <rect x="350" y="140" width="200" height="24" rx="3" fill="#f5edda"/>
  <text x="450" y="157" text-anchor="middle" font-size="11" style="fill:#0d0d0d">해시 테이블 조회 O(1)</text>
  <text x="450" y="188" text-anchor="middle" fill="#e8e4df" font-size="11">6가지 밸런싱 모드(rr·wrr·lc…)</text>
  <text x="450" y="212" text-anchor="middle" fill="#8a8580" font-size="11">20,000 노드</text>
  <text x="450" y="232" text-anchor="middle" fill="rgb(212,168,83)" font-size="12" font-weight="700">= 갱신 11분</text>
  <text x="450" y="264" text-anchor="middle" fill="#8a8580" font-size="11">여전히 Netfilter 경로 안</text>
  <text x="450" y="284" text-anchor="middle" fill="#8a8580" font-size="11">kube-proxy 아키텍처 유지</text>

  <!-- eBPF -->
  <rect x="620" y="70" width="240" height="230" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="740" y="98" text-anchor="middle" fill="#66bb6a" font-size="15" font-weight="700">3세대 · eBPF</text>
  <text x="740" y="122" text-anchor="middle" fill="#e8e4df" font-size="12">커널 안에서 직접 실행</text>
  <rect x="640" y="140" width="200" height="24" rx="3" fill="#f5edda"/>
  <text x="740" y="157" text-anchor="middle" font-size="11" style="fill:#0d0d0d">Netfilter 경로 자체를 우회</text>
  <text x="740" y="188" text-anchor="middle" fill="#e8e4df" font-size="11">유저↔커널 왕복 없음</text>
  <text x="740" y="212" text-anchor="middle" fill="#e8e4df" font-size="11">Cilium — kube-proxy 대체</text>
  <text x="740" y="240" text-anchor="middle" fill="#66bb6a" font-size="12" font-weight="700">L7 정책·관측까지 한 계층</text>
  <text x="740" y="272" text-anchor="middle" fill="#8a8580" font-size="11">XDP: 드라이버 수준 처리</text>

  <!-- 진화 화살표 -->
  <line x1="282" y1="185" x2="328" y2="185" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#g3arrow)"/>
  <line x1="572" y1="185" x2="618" y2="185" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#g3arrow)"/>

  <!-- 결론 -->
  <line x1="40" y1="330" x2="860" y2="330" stroke="#2a2520" stroke-width="1"/>
  <text x="450" y="358" text-anchor="middle" fill="rgb(212,168,83)" font-size="13" font-weight="700">병목은 "규칙을 어떻게 조회하는가" — 선형(iptables) → 해시(IPVS) → 경로 제거(eBPF)</text>
  <text x="450" y="382" text-anchor="middle" fill="#8a8580" font-size="11">세 기술 모두 Conntrack(전편) 위에서 연결을 백엔드에 고정한다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 464" width="100%" role="img" aria-labelledby="kpt kpd">
<title id="kpt">서비스 조회의 세 세대 — 바뀐 것은 찾는 방법이다</title>
<desc id="kpd">kube-proxy 세 세대(iptables·IPVS·eBPF)를 자료구조·조회 방법·비용·확인 명령·새로 가능해진 일 다섯 축으로 비교한 행렬. 리스트 순회에서 해시 조회로 바뀌며 비용이 규칙 수와 무관해진다.</desc>
<rect width="1210" height="464" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">COMPARISON MATRIX · 02-02 KUBE-PROXY</text>
<text x="12" y="52" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서비스 조회의 세 세대 — 바뀐 것은 찾는 방법이다</text>
<text x="12" y="72" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="11" fill="#8B98A9">리스트는 규칙이 늘수록 대조가 늘지만, 해시는 규칙 수와 무관합니다 — 16만 규칙 5시간이 여기서 나옵니다.</text>

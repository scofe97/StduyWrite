<title id="dt">같은 cart 가 목적지에 따라 막히고 열립니다</title><desc id="dd">NetworkPolicy 단계별 응답 코드 격자. 정책 전에는 demo 와 cart 모두 demo-db 에 200 을 받는다. 2단계에서 demo-db 만 선택하면 demo 와 cart 모두 demo-db 에 000 을 받지만 cart 는 web 에 200 을 받는다. 3단계에서 demo 를 허용하면 demo 는 200, cart 는 000 이다. 포트를 8080 으로 바꾸면 둘 다 000 이고 ports 를 생략하면 demo 200, cart 000 이다.</desc>

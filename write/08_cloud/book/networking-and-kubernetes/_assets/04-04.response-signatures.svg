<title id="dt">응답 코드는 어디서 멈췄는지를 알려 줍니다</title><desc id="dd">Cilium L7 정책 하나가 만드는 응답 서명 셋. cart 의 GET / 는 출발지 목록에 없어 커널에서 버려져 000 과 3.00초 타임아웃이 된다. demo 의 GET /health 는 Envoy 까지 가서 Access denied 와 403 을 받는다. demo 의 GET / 는 nginx 까지 가서 200 을 받는다. 넓은 표준 정책을 옆에 두면 /health 는 404 로 바뀐다.</desc>

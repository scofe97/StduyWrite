<title id="dt">모드는 버전을 따라 빠지고 들어옵니다</title><desc id="dd">userspace 는 1.26 에서 제거됐고 nftables 는 1.33 에서 GA 가 됐다. ipvs 는 1.35 에서 deprecated 되어 1.40 에 기본 비활성이 되고 1.43 에서 제거된다. 1.37 의 기본값은 iptables 이고, 모드를 정하지 않으면 1.40 에서 nftables 로 바뀐다고 kube-proxy 가 경고한다(코드 기준).</desc>

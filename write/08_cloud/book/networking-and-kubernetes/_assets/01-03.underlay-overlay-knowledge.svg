<svg viewBox="0 0 1000 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uok-title uok-desc">
  <title id="uok-title">어느 네트워크가 어느 주소를 아는가</title>
  <desc id="uok-desc">노드 주소와 Pod 주소를 두 층으로 나눠, 각 층을 누가 통제하고 어느 주소를 아는지 대조한 표. 위층은 쿠버네티스가 정한 Pod 주소가 사는 오버레이이고, 아래층은 클라우드나 회사가 통제하는 하부 네트워크다. 하부가 Pod 주소를 모른다는 칸을 초점으로 강조했다.</desc>

  <rect width="100%" height="100%" fill="#0D1117"/>

  <text x="100" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WHO KNOWS WHAT</text>
  <text x="100" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">어느 네트워크가 어느 주소를 아는가</text>
  <text x="100" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">주소가 두 벌 있습니다. 각 벌을 누가 정했는지가 무엇을 아는지를 정합니다.</text>

  <line x1="100" y1="128" x2="940" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="120" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">층</text>
  <text x="316" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">주소 예</text>
  <text x="524" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">누가 정했나</text>
  <text x="732" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">라우팅 표를 만질 수 있나</text>

  <line x1="100" y1="164" x2="940" y2="164" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <rect x="100" y="164" width="840" height="88" fill="#161B22"/>
  <text x="120" y="196" fill="#F5F5F3" font-size="15" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">오버레이</text>
  <text x="120" y="220" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">Pod 네트워크</text>
  <text x="316" y="200" fill="#6A95D8" font-size="13" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">10.244.1.5</text>
  <text x="316" y="222" fill="#6A95D8" font-size="13" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">10.244.2.7</text>
  <text x="524" y="200" fill="#F5F5F3" font-size="13" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">쿠버네티스</text>
  <text x="524" y="222" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">우리가 값을 고른다</text>
  <text x="732" y="212" fill="#3FB98C" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">예 — 우리 것이다</text>

  <line x1="100" y1="252" x2="940" y2="252" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <rect x="100" y="252" width="840" height="88" fill="#0D1117"/>
  <text x="120" y="284" fill="#F5F5F3" font-size="15" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">하부 네트워크</text>
  <text x="120" y="308" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">노드가 올라앉은 망</text>
  <text x="316" y="288" fill="#F5F5F3" font-size="13" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">192.168.0.10</text>
  <text x="316" y="310" fill="#F5F5F3" font-size="13" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">192.168.0.20</text>
  <text x="524" y="288" fill="#F5F5F3" font-size="13" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">클라우드 · 회사</text>
  <text x="524" y="310" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">빌려 쓰거나 소유한다</text>
  <text x="732" y="300" fill="#E3B341" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">경우에 따라 다르다</text>

  <line x1="100" y1="340" x2="940" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="120" y="376" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">하부가 Pod 주소를 아는가 — 이 한 칸이 방식을 가른다</text>

  <rect x="120" y="392" width="392" height="104" fill="rgba(240,138,89,0.12)"/>
  <rect x="120" y="392" width="392" height="104" fill="none" stroke="#F08A59" stroke-width="1.4"/>
  <text x="140" y="420" fill="#F08A59" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">모른다 — 알려 줄 수단이 없다</text>
  <text x="140" y="446" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">클라우드 VPC 라우터는 우리 것이 아니라</text>
  <text x="140" y="466" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">표에 Pod 블록을 넣어 줄 수 없습니다.</text>
  <text x="140" y="488" fill="#F5F5F3" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">→ VXLAN 으로 노드 주소에 싸서 보낸다</text>

  <rect x="548" y="392" width="392" height="104" fill="#161B22"/>
  <rect x="548" y="392" width="392" height="104" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="568" y="420" fill="#3FB98C" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">안다 — 알려 줄 수단이 있다</text>
  <text x="568" y="446" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">온프레미스 라우터는 관리자가 만지고,</text>
  <text x="568" y="466" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">노드 광고를 받게 설정할 수 있습니다.</text>
  <text x="568" y="488" fill="#F5F5F3" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">→ BGP 로 블록을 광고해 직접 전달</text>

  <line x1="100" y1="520" x2="940" y2="520" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="100" y="552" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL</text>
  <text x="204" y="552" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">하부가 Pod 주소를 모르는 것은 <tspan fill="#F5F5F3" font-weight="600">능력의 문제가 아니라 통제권의 문제</tspan>입니다 — 수단이 열리면 오버레이가 필요 없습니다.</text>
</svg>

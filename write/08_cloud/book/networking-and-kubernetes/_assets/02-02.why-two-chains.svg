<title id="dt">확률은 한 줄에서 한 번만 굴러간다</title><desc id="dd">합친 설계는 같은 확률을 두 번 굴려 표시한 백엔드와 보낸 백엔드가 어긋난다.</desc>
<rect width="1000" height="696" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">kube-proxy · WHY TWO CHAINS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">확률은 한 줄에서 한 번만 굴러간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">뽑은 뒤 할 일이 두 줄이라 점프가 필요하다 — 그 갈 곳이 엔드포인트 체인이다</text>
<rect x="24" y="100" width="464" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="40" y="127" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">합쳤다면</text>
<text x="472" y="127" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">확률 줄 두 개 · 각자 따로 굴린다</text>
<rect x="512" y="100" width="464" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="528" y="127" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">실제 설계</text>
<text x="960" y="127" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">확률 줄 하나 · 뽑은 뒤 점프한다</text>
<rect x="106.0" y="164.0" width="300" height="44" rx="20" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="256" y="191" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">ClusterIP 로 패킷이 온다</text>
<path d="M 256 208 L 256 234" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<path d="M 256 228 L 368 262 L 256 296 L 144 262 z" fill="#E3B34112" stroke="#E3B341" stroke-width="1.3"/>
<text x="256" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">확률 0.33 굴림 · 1회차</text>
<path d="M 256 296 L 256 314" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<text x="268" y="309.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">A</text>
<rect x="106.0" y="312.0" width="300" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="256" y="335" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">KUBE-MARK-MASQ</text>
<text x="256" y="354" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">-s 10.244.1.35 기준으로 표시</text>
<path d="M 256 364 L 256 386" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<path d="M 256 380 L 368 414 L 256 448 L 144 414 z" fill="#E3B34112" stroke="#E3B341" stroke-width="1.3"/>
<text x="256" y="418" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">확률 0.33 굴림 · 2회차</text>
<path d="M 256 448 L 256 466" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<text x="268" y="461.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">B</text>
<rect x="106.0" y="464.0" width="300" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="256" y="487" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">DNAT</text>
<text x="256" y="506" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">--to-destination 10.244.2.4:80</text>
<path d="M 256 516 L 256 542" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<rect x="106.0" y="544.0" width="300" height="44" rx="20" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="256" y="571" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">A 를 표시하고 B 로 보낸다</text>
<rect x="594.0" y="164.0" width="300" height="44" rx="20" fill="#161B22" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="744" y="191" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">ClusterIP 로 패킷이 온다</text>
<path d="M 744 208 L 744 234" fill="none" stroke="#5E6B7E" stroke-width="1.4" marker-end="url(#soft)"/>
<path d="M 744 228 L 856 262 L 744 296 L 632 262 z" fill="#E3B34112" stroke="#E3B341" stroke-width="1.3"/>
<text x="744" y="266" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">확률 0.33 굴림 · 한 번뿐</text>
<path d="M 744 296 L 744 314" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<text x="756" y="309.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">A</text>
<rect x="594.0" y="312.0" width="300" height="52" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="744" y="335" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">KUBE-SEP-A 로 점프</text>
<text x="744" y="354" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">-j KUBE-SEP-BN57OJOGDZOVVFD3</text>
<path d="M 744 364 L 744 390" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="594.0" y="390" width="300" height="80" rx="6" fill="#F08A590E" stroke="#F08A59" stroke-width="1.3"/>
<text x="744" y="412" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">그 체인 안 두 줄 — 조건이 없다</text>
<text x="744" y="434" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">KUBE-MARK-MASQ</text>
<text x="744" y="454" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">DNAT --to 10.244.1.35:80</text>
<path d="M 744 470 L 744 542" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="594.0" y="544.0" width="300" height="44" rx="20" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="744" y="571" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">둘 다 A 에 걸린다</text>
<text x="24" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">확률을 두 줄에 각각 적으면 statistic 매치가 줄마다 따로 굴러간다. 앞줄이 A 를 뽑아도 뒷줄은 B 를 뽑을 수 있다.</text>
<text x="24" y="626" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">한 번의 판정을 여러 동작으로 잇는 방법은 점프뿐이고, 그래서 엔드포인트 체인이 따로 존재한다.</text>
<line x1="12" y1="646" x2="952" y2="646" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="668" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="658" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="668" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">확률을 굴리는 자리</text>
<rect x="274" y="658" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="296" y="668" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">한 번 뽑아 그대로 잇는 길</text>
<rect x="513" y="658" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="535" y="668" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어긋난 결과</text>
</svg>
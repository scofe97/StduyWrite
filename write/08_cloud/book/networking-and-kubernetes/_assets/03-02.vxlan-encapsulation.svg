<svg viewBox="0 0 960 364" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>VXLAN MAC-in-UDP 캡슐화 패킷 구조</title>
  <desc>원본 L2 프레임이 VXLAN 헤더와 함께 UDP-IP 패킷 안에 통째로 담기는 구조. 바깥 헤더는 언더레이 물리망이 라우팅에 쓰고, 안쪽 프레임은 컨테이너가 보낸 그대로 보존된다</desc>
  <defs>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>
  <rect width="960" height="364" fill="#0d0d0d"/>

  <text x="480" y="40" text-anchor="middle" fill="#e8e4df" font-size="20" font-weight="700">VXLAN 패킷 — MAC-in-UDP 캡슐화</text>

  <!-- 상단 구간 라벨 -->
  <text x="320" y="100" text-anchor="middle" fill="#b8b3ad" font-size="13">언더레이(L3 물리망)가 보고 라우팅하는 부분</text>
  <line x1="44" y1="112" x2="596" y2="112" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="760" y="100" text-anchor="middle" fill="#66bb6a" font-size="13">터널이 실어 나르는 화물 — 컨테이너가 보낸 그대로</text>
  <line x1="604" y1="112" x2="916" y2="112" stroke="#66bb6a" stroke-width="1.5"/>

  <!-- 패킷 바 -->
  <rect x="40" y="130" width="150" height="80" rx="6" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="115" y="165" text-anchor="middle" fill="#e8e4df" font-size="14">외부 Ethernet</text>
  <text x="115" y="185" text-anchor="middle" fill="#b8b3ad" font-size="11">VTEP 간 MAC</text>

  <rect x="190" y="130" width="140" height="80" rx="6" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="260" y="165" text-anchor="middle" fill="#e8e4df" font-size="14">외부 IP</text>
  <text x="260" y="185" text-anchor="middle" fill="#b8b3ad" font-size="11">VTEP 간 주소</text>

  <rect x="330" y="130" width="120" height="80" rx="6" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="390" y="165" text-anchor="middle" fill="#e8e4df" font-size="14">외부 UDP</text>
  <text x="390" y="185" text-anchor="middle" fill="#b8b3ad" font-size="11">전송은 IP+UDP</text>

  <rect x="450" y="130" width="150" height="80" rx="6" fill="rgb(212,168,83)"/>
  <text x="525" y="165" text-anchor="middle" fill="#0d0d0d" font-size="15" font-weight="700">VXLAN 헤더</text>
  <text x="525" y="185" text-anchor="middle" fill="#1a1a1a" font-size="11">VNI (24비트)</text>

  <rect x="600" y="130" width="320" height="80" rx="6" fill="#0d0d0d" stroke="#66bb6a" stroke-width="2"/>
  <text x="760" y="152" text-anchor="middle" fill="#66bb6a" font-size="13" font-weight="700">원본 L2 프레임</text>
  <rect x="612" y="164" width="80" height="34" rx="4" fill="#cdeccf"/>
  <text x="652" y="186" text-anchor="middle" fill="#14521d" font-size="11">원본 Ethernet</text>
  <rect x="700" y="164" width="64" height="34" rx="4" fill="#cdeccf"/>
  <text x="732" y="186" text-anchor="middle" fill="#14521d" font-size="11">원본 IP</text>
  <rect x="772" y="164" width="60" height="34" rx="4" fill="#cdeccf"/>
  <text x="802" y="186" text-anchor="middle" fill="#14521d" font-size="11">TCP/UDP</text>
  <rect x="840" y="164" width="68" height="34" rx="4" fill="#cdeccf"/>
  <text x="874" y="186" text-anchor="middle" fill="#14521d" font-size="11">데이터</text>

  <!-- VNI 콜아웃 -->
  <line x1="525" y1="210" x2="525" y2="248" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="525" y="268" text-anchor="middle" fill="rgb(212,168,83)" font-size="13">VNI 24비트 = 세그먼트 1,600만 개</text>
  <text x="525" y="286" text-anchor="middle" fill="#b8b3ad" font-size="12">(VLAN은 12비트, 4,094개)</text>

  <!-- VTEP 흐름 -->
  <text x="150" y="340" text-anchor="middle" fill="#e8e4df" font-size="13">송신 VTEP — 캡슐화</text>
  <line x1="262" y1="336" x2="372" y2="336" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="480" y="340" text-anchor="middle" fill="#b8b3ad" font-size="13">물리망은 바깥 헤더만 본다</text>
  <line x1="588" y1="336" x2="698" y2="336" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="810" y="340" text-anchor="middle" fill="#e8e4df" font-size="13">수신 VTEP — 역캡슐화</text>

  </svg>

<path d="M 592 392 L 410 392" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)" stroke-dasharray="5 5"/>
<rect x="412.0" y="310" width="176" height="28" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="329" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">겉봉 4겹 + 원본</text>
<text x="500" y="416" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">물리망은 겉봉만 읽는다</text>
<text x="24" y="484" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">겉봉이 붙어 있는 구간은 두 VTEP 사이뿐입니다. 컨테이너도 브리지도 원본 프레임만 보므로 오버레이가 있다는 사실조차 모릅니다.</text>
<text x="24" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">겉봉은 약 50바이트라 안쪽에 쓸 수 있는 MTU 가 그만큼 줄어듭니다. 이 값을 안 맞추면 큰 패킷만 조용히 사라집니다.</text>

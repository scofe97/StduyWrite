<title id="dt">VTEP 가 씌우고 반대편 VTEP 가 벗긴다</title><desc id="dd">두 호스트의 부품 배치와 그 사이 터널. 컨테이너는 브리지에 매달리고 브리지는 VTEP 에 붙으며, 겉봉이 붙는 구간은 두 VTEP 사이뿐이다. 물리망은 그 겉봉만 읽는다.</desc>
<rect width="1000" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">VXLAN · WHO WRAPS AND WHO UNWRAPS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">VTEP 가 씌우고 반대편 VTEP 가 벗긴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">컨테이너 → 브리지 → VTEP 순으로 매달립니다 · 모양이 바뀌는 구간은 터널 하나뿐입니다</text>

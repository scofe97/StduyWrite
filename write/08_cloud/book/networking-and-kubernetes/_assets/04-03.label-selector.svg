<title id="dt">같은 네 연산자도 라벨이 없는 Pod 를 다르게 다룬다</title><desc id="dd">tier 키를 기준으로 In 은 Pod A 만, NotIn 은 값이 목록 밖이거나 키가 없는 Pod B 를, Exists 는 A 만, DoesNotExist 는 B 만 고른다. In 과 NotIn 은 values 가 비어 있으면 안 되고 Exists 와 DoesNotExist 는 비어 있어야 한다.</desc>
<rect width="1000" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LABELSELECTOR · FOUR OPERATORS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 네 연산자도 라벨이 없는 Pod 를 다르게 다룬다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">NotIn 은 키가 없는 Pod 도 고릅니다</text>
<text x="228" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">셀렉터 · tier 기준</text>

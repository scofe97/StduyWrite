<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dh-title dh-desc">
  <title id="dh-title">주소가 없는 상태에서 주소를 받아 오는 절차</title>
  <desc id="dh-desc">새로 켠 기계와 DHCP 서버 사이의 네 번의 교환을 시간순으로 그린 시퀀스. 앞의 두 번은 출발지 IP 가 비어 있어 브로드캐스트로 오가고, 마지막 확정 응답을 초점으로 강조했다.</desc>

  <defs>
    <marker id="dh-fill" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8B98A9"/>
    </marker>
    <marker id="dh-fill-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F08A59"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0D1117"/>

  <text x="100" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SEQUENCE</text>
  <text x="100" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">주소가 없는 상태에서 주소를 받아 온다</text>
  <text x="100" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">앞의 두 번은 출발지 IP 칸이 비어 있어 브로드캐스트로 오갑니다. MAC 이 이미 붙어 있어 이 대화가 가능합니다.</text>

  <rect x="140" y="132" width="240" height="56" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="260" y="156" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">새로 켠 기계</text>
  <text x="260" y="176" fill="#8B98A9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">0.0.0.0</text>

  <rect x="620" y="132" width="240" height="56" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="740" y="156" fill="#F5F5F3" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">DHCP 서버</text>
  <text x="740" y="176" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">주소를 빌려주는 쪽</text>

  <line x1="260" y1="188" x2="260" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="740" y1="188" x2="740" y2="444" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="256" y="216" width="8" height="200" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
  <rect x="736" y="216" width="8" height="200" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

  <text x="500" y="224" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">DISCOVER · 브로드캐스트로 서버를 찾는다</text>
  <line x1="264" y1="236" x2="732" y2="236" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#dh-fill)"/>

  <text x="500" y="280" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">OFFER · 이 주소는 어떠십니까</text>
  <line x1="736" y1="292" x2="268" y2="292" stroke="#8B98A9" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#dh-fill)"/>

  <text x="500" y="336" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">REQUEST · 그것으로 쓰겠습니다</text>
  <line x1="264" y1="348" x2="732" y2="348" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#dh-fill)"/>

  <text x="500" y="392" fill="#F08A59" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">ACK · 확정 · 임대 시간까지 당신 것</text>
  <line x1="736" y1="404" x2="268" y2="404" stroke="#F08A59" stroke-width="1.4" marker-end="url(#dh-fill-accent)"/>

  <line x1="100" y1="472" x2="900" y2="472" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="100" y="504" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">RECEIVED</text>
  <text x="216" y="504" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">받는 것은 IP 하나가 아니라 마스크·게이트웨이·DNS 서버까지 네 가지 묶음입니다.</text>
</svg>

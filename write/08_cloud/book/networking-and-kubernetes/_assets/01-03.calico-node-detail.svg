<title id="dt">노드 안을 열어 보면 — Pod 에서 나가 Pod 로 들어가기까지</title><desc id="dd">Pod 는 끝점이고 라우팅을 하는 것은 노드의 커널이다. 광고로 표에 줄이 생겼으므로 가운데를 지나는 동안 겉은 한 겹뿐이다.</desc>
<rect width="1000" height="644" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CALICO · INSIDE THE NODE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">노드 안을 열어 보면 — Pod 에서 나가 Pod 로 들어가기까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Pod 는 끝점이고 라우팅을 하는 것은 노드의 커널이다</text>
<rect x="24" y="104" width="952" height="484" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Pod = 호스트 · 노드 = 라우터 · 클러스터 = AS 하나</text>
<rect x="40" y="176" width="700" height="136" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="64" y="167" width="105" height="18" fill="#0D1117"/>
<text x="74" y="180" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">노드 1 의 커널 안</text>
<rect x="40" y="384" width="700" height="136" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="64" y="375" width="105" height="18" fill="#0D1117"/>
<text x="74" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">노드 2 의 커널 안</text>

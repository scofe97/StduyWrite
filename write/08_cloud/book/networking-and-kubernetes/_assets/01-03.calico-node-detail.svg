<text x="36" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Pod 와 커널은 veth 쌍 한 켤레로 이어지고, 한쪽 끝이 Pod 안의 eth0, 다른 쪽 끝이 노드 쪽 cali 인터페이스다</text>

<title id="dt">정책은 선택되는 순간 잠그고 이름은 검색 경로 때문에 불어납니다</title><desc id="dd">04-03 의 키워드 개념도. 첫 줄은 정책이 Pod 를 선택해 방향을 잠그고 세 단계로 조여 가며 CNI 가 라벨을 주소로 번역하는 흐름이다. 둘째 줄은 LabelSelector 연산자 넷과 peer 의 AND·OR 를 거쳐 ClusterNetworkPolicy 같은 확장으로 넘어가는 흐름이다. 셋째 줄은 dnsPolicy 가 정한 resolv.conf 의 검색 경로가 이름 하나의 질의를 불리고 클라이언트마다 횟수가 갈리는 흐름이다. 넷째 줄은 처방 셋과 ipFamilyPolicy 기본값, 전환 규칙으로 닫는 흐름이다.</desc>
<rect width="1000" height="664" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 04-03 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">정책은 선택되는 순간 잠그고 이름은 검색 경로 때문에 불어납니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄의 묶음입니다.</text>

<svg viewBox="0 0 640 430" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>NetworkPolicy와 DNS 전체 지도</title>
  <desc>선택되는 순간 잠기는 NetworkPolicy 의 동작 모델에서 출발해 그 문법인 라벨 셀렉터와 peer 지정 규칙을 지나 Cilium 의 L7 정책까지 봅니다. 그다음 클러스터의 이름을 맡는 CoreDNS 와 주소 패밀리를 정하는 dual-stack 으로 4장을 닫습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10.5px; }
    .sec { fill: #3a3632; font-size: 10px; font-weight: 700; }
    .zone { fill: #b8b3ad; font-size: 10px; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .num { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .caution-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .caution-detail { fill: #0d0d0d; font-size: 10.5px; }
  </style>

  <rect width="640" height="430" fill="#0d0d0d"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <!-- 1 — 주의 -->
  <text class="num" x="34" y="47">1.</text>
  <rect x="54" y="24" width="470" height="52" rx="4" fill="rgb(212,168,83)"/>
  <text class="caution-title" x="72" y="46">주의 · 기본은 전부 허용</text>
  <text class="caution-detail" x="72" y="64">선택되는 순간 잠긴다</text>
  <text class="sec" x="504" y="46" text-anchor="end">§1</text>
  <text class="zone" x="548" y="50">정책</text>

  <path class="arrow" d="M289,76 L289,96" marker-end="url(#ah)"/>

  <!-- 2 -->
  <text class="num" x="34" y="123">2.</text>
  <rect class="box" x="54" y="102" width="470" height="52" rx="4"/>
  <text class="box-title" x="72" y="124">LabelSelector — 문법</text>
  <text class="box-detail" x="72" y="142">연산자 4종 · values 조건</text>
  <text class="sec" x="504" y="124" text-anchor="end">§2</text>

  <path class="arrow" d="M289,154 L289,174" marker-end="url(#ah)"/>

  <!-- 3 -->
  <text class="num" x="34" y="201">3.</text>
  <rect class="box" x="54" y="180" width="470" height="52" rx="4"/>
  <text class="box-title" x="72" y="202">Rules — peer 4형</text>
  <text class="box-detail" x="72" y="220">대시 하나가 AND 를 OR 로</text>
  <text class="sec" x="504" y="202" text-anchor="end">§3</text>

  <path class="arrow" d="M289,232 L289,252" marker-end="url(#ah)"/>

  <!-- 4 -->
  <text class="num" x="34" y="279">4.</text>
  <rect class="box" x="54" y="258" width="470" height="52" rx="4"/>
  <text class="box-title" x="72" y="280">Cilium — L3 에서 L7 로</text>
  <text class="box-detail" x="72" y="298">경로 단위로 가른다</text>
  <text class="sec" x="504" y="280" text-anchor="end">§4</text>

  <path class="arrow" d="M289,310 L289,330" marker-end="url(#ah)"/>

  <!-- 5 -->
  <text class="num" x="34" y="357">5.</text>
  <rect class="box" x="54" y="336" width="470" height="42" rx="4"/>
  <text class="box-title" x="72" y="362">DNS — 검색 경로의 비용</text>
  <text class="sec" x="504" y="362" text-anchor="end">§5</text>
  <text class="zone" x="548" y="366">이름</text>

  <!-- 6 -->
  <text class="num" x="34" y="409">6.</text>
  <rect class="box" x="54" y="386" width="470" height="40" rx="4"/>
  <text class="box-title" x="72" y="411">Dual Stack — 주소 패밀리</text>
  <text class="sec" x="504" y="411" text-anchor="end">§6</text>
  <text class="zone" x="548" y="415">주소</text>
</svg>

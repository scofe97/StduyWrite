<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tw-title tw-desc">
  <title id="tw-title">2MSL은 최악의 왕복 두 구간을 더한 값</title>
  <desc id="tw-desc">먼저 닫은 쪽과 나중 닫는 쪽의 시간축을 나란히 두고, 마지막 ACK가 유실되는 최악의 경우를 그린 타임라인. 유실까지 최대 1MSL, 상대의 FIN 재전송이 돌아오기까지 다시 최대 1MSL이라 합이 2MSL이 된다. 기록을 지웠을 때 RST가 나가는 갈래를 아래에 대조로 두었고, 두 구간을 더한 대기 시간을 초점으로 강조했다.</desc>

  <rect width="100%" height="100%" fill="#0D1117"/>

  <text x="100" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WHY TWICE</text>
  <text x="100" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">2MSL은 최악의 왕복 두 구간을 더한 값</text>
  <text x="100" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">마지막 ACK가 유실되는 경우를 최악으로 잡고 두 구간을 더합니다.</text>

  <line x1="100" y1="128" x2="940" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="120" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">먼저 닫은 쪽</text>
  <text x="920" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="end">나중 닫는 쪽</text>

  <line x1="180" y1="168" x2="180" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="3 6"/>
  <line x1="860" y1="168" x2="860" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="3 6"/>

  <text x="196" y="192" fill="#F5F5F3" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">마지막 ACK를 보낸다</text>
  <line x1="188" y1="200" x2="600" y2="236" stroke="#F0616D" stroke-width="1.6"/>
  <circle cx="600" cy="236" r="5" fill="#F0616D"/>
  <text x="616" y="232" fill="#F0616D" font-size="12" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">여기서 유실</text>
  <text x="616" y="252" fill="#8B98A9" font-size="11" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">거의 다 가서 사라지는 것이 최악</text>

  <text x="196" y="284" fill="#5E6B7E" font-size="11" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">상대는 확인을 못 받았으므로</text>

  <line x1="852" y1="300" x2="188" y2="352" stroke="#E3B341" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="844" y="296" fill="#E3B341" font-size="12" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">FIN을 재전송한다</text>
  <text x="196" y="376" fill="#E3B341" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">이것을 받아 줄 기록이 남아 있어야 한다</text>

  <line x1="100" y1="404" x2="940" y2="404" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <rect x="120" y="420" width="384" height="32" fill="rgba(240,97,109,0.12)"/>
  <rect x="120" y="420" width="384" height="32" fill="none" stroke="#F0616D" stroke-width="1"/>
  <text x="312" y="441" fill="#F0616D" font-size="12" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">구간 1 — ACK가 떠돌다 사라지기까지</text>

  <rect x="516" y="420" width="384" height="32" fill="rgba(227,179,65,0.12)"/>
  <rect x="516" y="420" width="384" height="32" fill="none" stroke="#E3B341" stroke-width="1"/>
  <text x="708" y="441" fill="#E3B341" font-size="12" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">구간 2 — 재전송 FIN이 돌아오기까지</text>

  <text x="312" y="472" fill="#8B98A9" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle">최대 1 MSL</text>
  <text x="708" y="472" fill="#8B98A9" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle">최대 1 MSL</text>

  <rect x="120" y="488" width="780" height="36" fill="rgba(240,138,89,0.12)"/>
  <rect x="120" y="488" width="780" height="36" fill="none" stroke="#F08A59" stroke-width="1.4"/>
  <text x="510" y="512" fill="#F08A59" font-size="14" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">TIME-WAIT 가 버티는 시간 = 2 MSL</text>

  <text x="100" y="548" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">기록을 미리 지우면 재전송 FIN에 <tspan fill="#F0616D" font-weight="600">RST</tspan>가 나가고, 상대는 정상 종료가 아니라 오류로 끊긴 것으로 남깁니다.</text>
</svg>

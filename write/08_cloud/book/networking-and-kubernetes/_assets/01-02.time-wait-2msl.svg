<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">2MSL은 최악의 두 구간을 더한 값</title><desc id="dd">마지막 ACK 가 유실되는 최악의 경우를 시간 막대로 그린 도식. 유실까지 최대 1MSL, 상대의 FIN 재전송이 돌아오기까지 다시 최대 1MSL 이라 TIME-WAIT 는 2MSL 을 기다린다. 기록을 미리 지우면 재전송 FIN 에 RST 가 나가는 갈래를 아래에 대조로 두었다.</desc>
<rect width="1000" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">GANTT · 01-02 TIME-WAIT</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">2MSL은 최악의 두 구간을 더한 값</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">마지막 ACK가 유실되는 경우를 최악으로 잡고 두 구간을 더합니다.</text>
<text x="200" y="124" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0</text>
<line x1="200" y1="132" x2="200" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="560" y="124" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">1 MSL</text>
<line x1="560" y1="132" x2="560" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="920" y="124" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">2 MSL</text>
<line x1="920" y1="132" x2="920" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<line x1="200" y1="132" x2="920" y2="132" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">마지막 ACK</text>
<text x="24" y="186" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">먼저 닫은 쪽이 보냄</text>
<rect x="200" y="160" width="360" height="24" rx="4" fill="#F0616D10" stroke="#F0616D" stroke-width="1.0"/>
<text x="212" y="177" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">유실까지 최대 1 MSL</text>
<text x="24" y="224" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">FIN 재전송</text>
<text x="24" y="242" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">확인 못 받은 상대가 보냄</text>
<rect x="560" y="216" width="360" height="24" rx="4" fill="#E3B34110" stroke="#E3B341" stroke-width="1.0"/>
<text x="572" y="233" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">돌아오기까지 최대 1 MSL</text>
<text x="24" y="280" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">TIME-WAIT</text>
<text x="24" y="298" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">먼저 닫은 쪽의 기록</text>
<rect x="200" y="272" width="720" height="24" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="212" y="289" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">2 MSL 유지 · 재전송 FIN 에 ACK 응답</text>
<line x1="24" y1="324" x2="960" y2="324" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">기록 조기 삭제</text>
<text x="24" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">대조 · 잘못된 경우</text>
<rect x="200" y="352" width="180" height="24" rx="4" fill="#5E6B7E10" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="212" y="369" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">기록 삭제</text>
<line x1="920" y1="348" x2="920" y2="380" stroke="#F0616D" stroke-width="1.6"/>
<text x="908" y="369" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">재전송 FIN → RST · 오류 종료</text>
<line x1="12" y1="420" x2="952" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="432" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">유실 구간</text>
<rect x="209" y="432" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="231" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재전송 구간</text>
<rect x="331" y="432" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="353" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">TIME-WAIT 대기</text>
<rect x="531" y="432" width="14" height="12" rx="2" fill="#5E6B7E22" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="553" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">미리 지운 기록</text>
</svg>
<svg viewBox="0 0 1000 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="al-title al-desc">
  <title id="al-title">주소는 층마다 따로 있다</title>
  <desc id="al-desc">네 개의 층을 위에서 아래로 쌓아, 각 층이 쓰는 주소와 그 주소를 읽는 장비를 짝지어 보인 계층 스택. MAC 주소가 있는 Link 층을 초점으로 강조했다.</desc>

  <rect width="100%" height="100%" fill="#0D1117"/>

  <text x="100" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LAYER STACK</text>
  <text x="100" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">주소는 층마다 따로 있다</text>
  <text x="100" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">위가 앱 쪽이고 아래가 선 쪽입니다. 층이 다르면 쓰는 주소도, 그것을 읽는 장비도 다릅니다.</text>

  <line x1="100" y1="128" x2="940" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <rect x="100" y="128" width="840" height="64" fill="#0D1117"/>
  <line x1="100" y1="192" x2="940" y2="192" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="120" y="166" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
  <text x="240" y="168" fill="#F5F5F3" font-size="16" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">포트 · Transport</text>
  <text x="920" y="168" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">한 기계 안 어느 프로그램인지 가른다</text>

  <rect x="100" y="192" width="840" height="64" fill="#0D1117"/>
  <line x1="100" y1="256" x2="940" y2="256" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="120" y="230" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
  <text x="240" y="232" fill="#F5F5F3" font-size="16" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">IP 주소 · Network</text>
  <text x="920" y="232" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">라우터가 읽고 다음 망을 고른다</text>

  <rect x="100" y="256" width="840" height="64" fill="rgba(240,138,89,0.12)"/>
  <rect x="100" y="256" width="840" height="64" fill="none" stroke="#F08A59" stroke-width="1.4"/>
  <text x="120" y="294" fill="#F08A59" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
  <text x="240" y="296" fill="#F5F5F3" font-size="16" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">MAC 주소 · Link</text>
  <text x="920" y="296" fill="#F08A59" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">스위치가 읽고 옆 기계로 건넨다</text>

  <rect x="100" y="320" width="840" height="64" fill="#0D1117"/>
  <text x="120" y="358" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
  <text x="240" y="360" fill="#F5F5F3" font-size="16" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">주소 없음 · Physical</text>
  <text x="920" y="360" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="end">허브는 가리지 않고 그대로 복사한다</text>

  <line x1="100" y1="384" x2="940" y2="384" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="100" y="420" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL</text>
  <text x="204" y="420" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">MAC 은 이 층에서만 뜻이 있어, 라우터를 하나 넘는 순간 새로 쓰입니다.</text>
</svg>

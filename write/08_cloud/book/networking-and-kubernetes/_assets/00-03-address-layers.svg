<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 448" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">주소는 층마다 따로 있다</title><desc id="dd">네 개의 층을 위에서 아래로 쌓아, 각 층이 쓰는 주소와 그 주소를 읽는 장비를 짝지어 보인 계층 스택. MAC 주소가 있는 Link 층을 초점으로 강조했다.</desc>
<rect width="1000" height="448" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LAYER STACK · ADDRESSES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">주소는 층마다 따로 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위가 앱 쪽이고 아래가 선 쪽입니다. 층이 다르면 쓰는 주소도, 그것을 읽는 장비도 다릅니다.</text>
<rect x="100" y="128" width="840" height="64" fill="#0D1117"/>
<line x1="100" y1="128" x2="940" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="120" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L4</text>
<text x="240" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">포트 · Transport</text>
<text x="920" y="168" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">한 기계 안 어느 프로그램인지 가른다</text>
<rect x="100" y="192" width="840" height="64" fill="#0D1117"/>
<line x1="100" y1="192" x2="940" y2="192" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="120" y="230" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L3</text>
<text x="240" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">IP 주소 · Network</text>
<text x="920" y="232" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">라우터가 읽고 다음 망을 고른다</text>
<rect x="100" y="256" width="840" height="64" rx="0" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<line x1="100" y1="256" x2="940" y2="256" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="120" y="294" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#F08A59">L2</text>
<text x="240" y="296" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">MAC 주소 · Link</text>
<text x="920" y="296" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">스위치가 읽고 옆 기계로 건넨다</text>
<rect x="100" y="320" width="840" height="64" fill="#0D1117"/>
<line x1="100" y1="320" x2="940" y2="320" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="120" y="358" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">L1</text>
<text x="240" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="600" fill="#F5F5F3">주소 없음 · Physical</text>
<text x="920" y="360" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">허브는 가리지 않고 그대로 복사한다</text>
<line x1="100" y1="384" x2="940" y2="384" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="100" y="396" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">MAC 은 이 층에서만 뜻이 있어, 라우터를 하나 넘는 순간 새로 쓰입니다.</text>
<line x1="12" y1="408" x2="952" y2="408" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="430" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="420" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="122" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">주소를 쓰는 층</text>
<rect x="248" y="420" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="270" y="430" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">MAC 이 뜻을 갖는 층</text>
</svg>
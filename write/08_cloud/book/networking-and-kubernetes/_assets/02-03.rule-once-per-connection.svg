<title id="dt">규칙을 다시 보는 것은 첫 패킷뿐이다</title><desc id="dd">KUBE-SVC 규칙을 갱신해도 이미 열린 연결은 conntrack 항목에 적힌 갱신 전 결정을 그대로 적용받고, 새로 여는 연결만 갱신된 규칙을 평가해 새 백엔드를 고른다.</desc>
<rect width="920" height="400" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBE-PROXY · WHO RE-READS THE RULES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">규칙을 다시 보는 것은 첫 패킷뿐이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 네 칸을 지나는데 세 번째 칸에 들어가는 레인은 하나뿐이다</text>
<text x="12" y="144" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">ESTABLISHED</text>
<text x="12" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">이미 열린 연결</text>
<rect x="140" y="118" width="168" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="224.0" y="145" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">연결 중 패킷</text>
<text x="224.0" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">seq 이어짐</text>
<rect x="332" y="118" width="168" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="416.0" y="145" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">conntrack 조회</text>
<text x="416.0" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">항목 있음</text>
<path d="M 314 150 L 324 150" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="524" y="118" width="168" height="64" rx="6" fill="none" stroke="#8B98A9" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="608.0" y="145" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">건너뜀</text>
<text x="608.0" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">규칙 평가 없음</text>
<path d="M 506 150 L 516 150" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="716" y="118" width="168" height="64" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="800.0" y="145" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">Pod A</text>
<text x="800.0" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">갱신 전 결정</text>
<path d="M 698 150 L 708 150" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<line x1="12" y1="208" x2="908" y2="208" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="12" y="256" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#3FB98C">NEW</text>
<text x="12" y="274" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">새로 여는 연결</text>

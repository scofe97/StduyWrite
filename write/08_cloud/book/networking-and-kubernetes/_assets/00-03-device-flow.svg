<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dv-title dv-desc">
  <title id="dv-title">같은 프레임이 들어와도 장비마다 다르게 나간다</title>
  <desc id="dv-desc">허브·스위치·라우터에 같은 프레임을 넣었을 때 각각 무엇을 읽고 어떻게 내보내는지를 세 줄로 나란히 놓은 흐름 비교. 허브는 모든 포트로 복사하고, 스위치는 한 포트로만 보내며, 라우터만 겉봉을 새로 쓴다.</desc>
  <defs><marker id="dv-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8B98A9"/></marker></defs>
  <rect width="100%" height="100%" fill="#0D1117"/>
  <text x="60" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.18em">FLOW COMPARISON</text>
  <text x="60" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">같은 프레임이 들어와도 나가는 모습이 다르다</text>
  <text x="60" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">왼쪽에 같은 프레임을 넣었습니다. 가운데가 그 장비가 읽는 깊이이고, 오른쪽이 그 결과입니다.</text>
  <rect x="60" y="164" width="140" height="56" fill="#161B22" stroke="rgba(191,192,192,0.22)"/>
  <text x="130" y="190" fill="#F5F5F3" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">프레임 도착</text>
  <text x="130" y="208" fill="#8B98A9" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">dst AA:..:02</text>
  <line x1="204" y1="192" x2="252" y2="192" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#dv-a)"/>
  <rect x="260" y="152" width="180" height="80" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="276" y="176" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.14em">L1</text>
  <text x="350" y="198" fill="#F5F5F3" font-size="15" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">허브</text>
  <text x="350" y="220" fill="#F0616D" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">아무것도 안 읽는다</text>

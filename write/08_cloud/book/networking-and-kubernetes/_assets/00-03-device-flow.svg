  <text x="576" y="247" fill="#F0616D" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">포트 4 · 남의 것이라 버림</text>
  <rect x="60" y="324" width="140" height="56" fill="#161B22" stroke="rgba(191,192,192,0.22)"/>
  <text x="130" y="350" fill="#F5F5F3" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">프레임 도착</text>
  <text x="130" y="368" fill="#8B98A9" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">dst AA:..:02</text>
  <line x1="204" y1="352" x2="252" y2="352" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#dv-a)"/>
  <rect x="260" y="312" width="180" height="80" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="276" y="336" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.14em">L2</text>
  <text x="350" y="358" fill="#F5F5F3" font-size="15" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">스위치</text>
  <text x="350" y="380" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">겉봉 MAC 만 읽는다</text>
  <line x1="444" y1="352" x2="556" y2="352" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#dv-a)"/>

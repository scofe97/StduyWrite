  <line x1="500" y1="162" x2="500" y2="242" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <line x1="500" y1="162" x2="556" y2="162" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#dv-a)"/>
  <rect x="560" y="148" width="380" height="28" fill="#161B22" stroke="rgba(191,192,192,0.22)"/>
  <text x="576" y="167" fill="#3FB98C" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">포트 2 · 받을 대상</text>
  <line x1="500" y1="202" x2="556" y2="202" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#dv-a)"/>
  <rect x="560" y="188" width="380" height="28" fill="#161B22" stroke="rgba(191,192,192,0.22)"/>

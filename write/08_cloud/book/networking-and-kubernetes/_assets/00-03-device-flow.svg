  <text x="576" y="358" fill="#3FB98C" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">포트 2 에게만 · MAC 표에서 찾았다</text>
  <rect x="60" y="464" width="140" height="56" fill="#161B22" stroke="rgba(191,192,192,0.22)"/>
  <text x="130" y="490" fill="#F5F5F3" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">프레임 도착</text>
  <text x="130" y="508" fill="#8B98A9" font-size="11" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">dst AA:..:02</text>
  <line x1="204" y1="492" x2="252" y2="492" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#dv-a)"/>
  <rect x="260" y="452" width="180" height="80" fill="rgba(240,138,89,0.12)" stroke="#F08A59" stroke-width="1.4"/>
  <text x="276" y="476" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.14em">L3</text>
  <text x="350" y="498" fill="#F5F5F3" font-size="15" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">라우터</text>
  <text x="350" y="520" fill="#F08A59" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">속의 IP 까지 읽는다</text>
  <line x1="444" y1="492" x2="556" y2="492" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#dv-a)"/>
  <rect x="560" y="470" width="380" height="44" fill="#161B22" stroke="rgba(191,192,192,0.22)"/>
  <text x="576" y="498" fill="#F08A59" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">다른 망으로 · 겉봉 MAC 을 새로 쓴다</text>
  <line x1="60" y1="556" x2="940" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="60" y="586" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">세 줄의 차이는 성능이 아니라 여는 깊이입니다. 겉봉을 고쳐 쓰는 것은 라우터뿐입니다.</text>
</svg>

<text x="764" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">받아서</text>
<text x="764" y="378" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">처리</text>
<text x="920" y="366" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="18" font-weight="600" fill="#F5F5F3">3 / 3</text>
<line x1="100" y1="428" x2="940" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="100" y="448" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">허브는 아무것도 읽지 않아 두 경우 모두 세 대에 그대로 도착합니다.</text>
<text x="100" y="468" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">갈리는 것은 받은 쪽이 처리하는가 버리는가뿐이고, 그 판정은 받는 랜카드가 합니다.</text>
<line x1="12" y1="484" x2="952" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="506" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

<text x="120" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">유니캐스트</text>
<rect x="120" y="212" width="248" height="36" rx="4" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="136" y="236" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#F08A59">2a:4f:1b:8c:d2:e0</text>

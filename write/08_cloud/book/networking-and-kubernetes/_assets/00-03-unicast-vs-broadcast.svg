<svg viewBox="0 0 1000 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uvb-title uvb-desc">
  <title id="uvb-title">한 칸의 값이 바뀌면 받는 쪽 처리가 갈린다</title>
  <desc id="uvb-desc">같은 허브에 붙은 네 대에 같은 프레임을 두 번 보낸 결과를 위아래로 나란히 둔 비교. 위는 목적지 MAC 칸에 특정 MAC 을 적은 유니캐스트로 한 대만 처리하고 두 대가 버린다. 아래는 같은 칸에 FF:FF:FF:FF:FF:FF 를 적은 브로드캐스트로 세 대 모두 처리한다. 값이 달라진 목적지 MAC 칸을 초점으로 강조했다.</desc>

  <rect width="100%" height="100%" fill="#0D1117"/>

  <text x="100" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FRAME COMPARISON</text>
  <text x="100" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">한 칸의 값이 바뀌면 받는 쪽 처리가 갈린다</text>
  <text x="100" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">허브에 붙은 같은 네 대. 프레임이 다른 곳은 목적지 MAC 칸 하나뿐입니다.</text>

  <line x1="100" y1="128" x2="940" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="120" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">목적지 MAC 칸</text>
  <text x="452" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">2 번</text>
  <text x="596" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">3 번</text>
  <text x="740" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">4 번</text>
  <text x="920" y="152" fill="#5E6B7E" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="end">처리한 대수</text>

  <line x1="100" y1="164" x2="940" y2="164" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <rect x="100" y="164" width="840" height="132" fill="#0D1117"/>
  <text x="120" y="196" fill="#F5F5F3" font-size="15" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">유니캐스트</text>
  <rect x="120" y="212" width="248" height="36" fill="rgba(240,138,89,0.12)"/>
  <rect x="120" y="212" width="248" height="36" fill="none" stroke="#F08A59" stroke-width="1.4"/>
  <text x="136" y="236" fill="#F08A59" font-size="13" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">2a:4f:1b:8c:d2:e0</text>
  <text x="120" y="276" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">2 번 랜카드의 MAC 을 적었습니다</text>

  <rect x="420" y="196" width="112" height="64" fill="rgba(63,185,140,0.12)"/>
  <rect x="420" y="196" width="112" height="64" fill="none" stroke="#3FB98C" stroke-width="1"/>
  <text x="476" y="224" fill="#3FB98C" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">받아서</text>
  <text x="476" y="246" fill="#3FB98C" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">처리</text>

  <rect x="564" y="196" width="112" height="64" fill="rgba(240,97,109,0.12)"/>
  <rect x="564" y="196" width="112" height="64" fill="none" stroke="#F0616D" stroke-width="1"/>
  <text x="620" y="224" fill="#F0616D" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">받아서</text>
  <text x="620" y="246" fill="#F0616D" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">버림</text>

  <rect x="708" y="196" width="112" height="64" fill="rgba(240,97,109,0.12)"/>
  <rect x="708" y="196" width="112" height="64" fill="none" stroke="#F0616D" stroke-width="1"/>
  <text x="764" y="224" fill="#F0616D" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">받아서</text>
  <text x="764" y="246" fill="#F0616D" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">버림</text>

  <text x="920" y="234" fill="#F5F5F3" font-size="18" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">1 / 3</text>

  <line x1="100" y1="296" x2="940" y2="296" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <rect x="100" y="296" width="840" height="132" fill="#0D1117"/>
  <text x="120" y="328" fill="#F5F5F3" font-size="15" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">브로드캐스트</text>
  <rect x="120" y="344" width="248" height="36" fill="rgba(240,138,89,0.12)"/>
  <rect x="120" y="344" width="248" height="36" fill="none" stroke="#F08A59" stroke-width="1.4"/>
  <text x="136" y="368" fill="#F08A59" font-size="13" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace">ff:ff:ff:ff:ff:ff</text>
  <text x="120" y="408" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">예약된 값이라 전원이 자기 것으로 봅니다</text>

  <rect x="420" y="328" width="112" height="64" fill="rgba(63,185,140,0.12)"/>
  <rect x="420" y="328" width="112" height="64" fill="none" stroke="#3FB98C" stroke-width="1"/>
  <text x="476" y="356" fill="#3FB98C" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">받아서</text>
  <text x="476" y="378" fill="#3FB98C" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">처리</text>

  <rect x="564" y="328" width="112" height="64" fill="rgba(63,185,140,0.12)"/>
  <rect x="564" y="328" width="112" height="64" fill="none" stroke="#3FB98C" stroke-width="1"/>
  <text x="620" y="356" fill="#3FB98C" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">받아서</text>
  <text x="620" y="378" fill="#3FB98C" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">처리</text>

  <rect x="708" y="328" width="112" height="64" fill="rgba(63,185,140,0.12)"/>
  <rect x="708" y="328" width="112" height="64" fill="none" stroke="#3FB98C" stroke-width="1"/>
  <text x="764" y="356" fill="#3FB98C" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">받아서</text>
  <text x="764" y="378" fill="#3FB98C" font-size="13" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif" text-anchor="middle">처리</text>

  <text x="920" y="366" fill="#F5F5F3" font-size="18" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">3 / 3</text>

  <line x1="100" y1="428" x2="940" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>

  <text x="100" y="464" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL</text>
  <text x="204" y="464" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">허브는 아무것도 읽지 않아 두 경우 모두 세 대에 그대로 도착합니다.</text>
  <text x="204" y="490" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">갈리는 것은 <tspan fill="#F5F5F3" font-weight="600">받은 쪽이 처리하는가 버리는가</tspan> 뿐이고, 그 판정은 받는 랜카드가 합니다.</text>
</svg>

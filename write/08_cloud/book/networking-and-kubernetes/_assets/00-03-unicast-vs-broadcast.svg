<title id="dt">한 칸의 값이 바뀌면 받는 쪽 처리가 갈린다</title><desc id="dd">같은 허브에 붙은 네 대에 같은 프레임을 두 번 보낸 결과를 위아래로 나란히 둔 비교. 위는 목적지 MAC 칸에 특정 MAC 을 적은 유니캐스트로 한 대만 처리하고 두 대가 버린다. 아래는 같은 칸에 FF:FF:FF:FF:FF:FF 를 적은 브로드캐스트로 세 대 모두 처리한다.</desc>
<rect width="1000" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FRAME COMPARISON · ONE FIELD</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 칸의 값이 바뀌면 받는 쪽 처리가 갈린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">허브에 붙은 같은 네 대. 프레임이 다른 곳은 목적지 MAC 칸 하나뿐입니다.</text>
<line x1="100" y1="128" x2="940" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="120" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">목적지 MAC 칸</text>
<text x="452" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">2 번</text>
<text x="596" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">3 번</text>
<text x="740" y="152" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">4 번</text>
<text x="920" y="152" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">처리한 대수</text>
<rect x="100" y="164" width="840" height="132" fill="#0D1117"/>

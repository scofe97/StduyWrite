<line x1="100" y1="296" x2="940" y2="296" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="120" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">브로드캐스트</text>

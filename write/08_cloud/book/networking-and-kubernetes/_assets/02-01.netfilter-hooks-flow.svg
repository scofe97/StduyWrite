<text x="26" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">라우팅 판단 기준 · 앞은 목적지, 뒤는 출발지</text>
<text x="36" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">장면 · 클러스터 밖 클라이언트 → NodePort 30080 → DNAT 뒤 Pod IP · 이 노드는 중계</text>

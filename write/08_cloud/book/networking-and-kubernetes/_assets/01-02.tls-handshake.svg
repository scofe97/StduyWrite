<title id="dt">TLS 핸드셰이크 — 비밀을 나르는 화살표는 하나뿐</title><desc id="dd">TLS 1.2 핸드셰이크의 메시지 열 개가 노출 상태에 따라 세 구간으로 갈린다. 1구간 네 메시지는 전부 평문이고, 2구간의 ClientKeyExchange 하나만 공개키로 봉해져 비밀을 나르며, 3구간부터 암호문이 된다. 그 하나를 열지 못하면 3구간은 통째로 읽히지 않는다.</desc>
<rect width="1000" height="756" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 01-02 TLS 1.2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TLS 핸드셰이크 — 비밀을 나르는 화살표는 하나뿐</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">열 개 중 아홉을 주워도 봉인 하나를 못 열면 소용이 없습니다.</text>
<rect x="24.0" y="104" width="200" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

<rect x="412" y="348" width="176" height="64" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500" y="370" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">Network</text>
<text x="500" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IP 로 다음 홉</text>

<text x="36" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">라우터가 IP 헤더까지만 읽는다는 사실이 세로로 잘린 기둥 하나로 드러난다 — MAC 은 매 홉 새로 쓰이고 IP 는 끝까지 그대로다</text>

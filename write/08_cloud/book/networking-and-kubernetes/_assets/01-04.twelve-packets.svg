<title id="dt">요청 하나가 12패킷 — 그중 실제 데이터는 2개뿐이다</title><desc id="dd">lo0 캡처에서 세는 12개를 시간 순서로 묶은 것. 가운데 한 칸만 데이터이고 나머지 열 개가 신뢰성에 드는 값이다.</desc>

<title id="dt">같은 이름이 세 번 실립니다</title><desc id="dd">DNS 질의, TLS ClientHello 의 SNI, HTTP Host 헤더에 같은 이름이 실린다. 이유가 각각 다르고, Host 는 암호문 안에 있어 인증서를 고르려면 SNI 가 앞에 평문으로 한 번 더 필요하다.</desc>
<rect width="1000" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NETWORKING AND KUBERNETES · 01-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 이름이 세 번 실립니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이유가 셋 다 다릅니다 — 주소를 찾으려고, 인증서를 고르려고, 가상 호스트를 고르려고</text>
<rect x="24" y="104" width="952" height="96" rx="0" fill="rgba(245,245,245,0.02)" stroke="none" stroke-width="0"/>
<line x1="24" y1="104" x2="976" y2="104" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="124" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">브라우저</text>
<line x1="24" y1="200" x2="976" y2="200" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="220" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">DNS 리졸버</text>
<rect x="24" y="296" width="952" height="96" rx="0" fill="rgba(245,245,245,0.02)" stroke="none" stroke-width="0"/>
<line x1="24" y1="296" x2="976" y2="296" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="316" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">서버</text>
<line x1="24" y1="392" x2="976" y2="392" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<rect x="104.0" y="132.0" width="136" height="56" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="172.0" y="156.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">이름을 주소로 묻는다</text>
<text x="172.0" y="174.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">DNS 질의 · 평문</text>
<rect x="252.0" y="228.0" width="136" height="56" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="320.0" y="252.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">주소를 돌려준다</text>
<text x="320.0" y="270.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">A 레코드 · 평문</text>
<rect x="400.0" y="132.0" width="136" height="56" rx="6" fill="#F08A5916" stroke="#F08A59" stroke-width="1.4"/>
<text x="468.0" y="156.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">ClientHello</text>
<text x="468.0" y="174.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">SNI = 이름 · 평문</text>
<rect x="548.0" y="324.0" width="136" height="56" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.0"/>
<text x="616.0" y="348.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">인증서를 고른다</text>
<text x="616.0" y="366.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">SNI 의 이름으로</text>
<rect x="696.0" y="132.0" width="136" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.0"/>
<text x="764.0" y="156.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">GET / Host: 이름</text>
<text x="764.0" y="174.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">암호문 안</text>
<rect x="844.0" y="324.0" width="136" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.0"/>
<text x="912.0" y="348.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">가상 호스트를 고른다</text>
<text x="912.0" y="366.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Host 의 이름으로</text>
<path d="M 240.0 160.0 L 246.0 160.0 L 246.0 256.0 L 250.0 256.0" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<path d="M 388.0 256.0 L 394.0 256.0 L 394.0 160.0 L 398.0 160.0" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<path d="M 536.0 160.0 L 542.0 160.0 L 542.0 352.0 L 546.0 352.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 684.0 352.0 L 690.0 352.0 L 690.0 160.0 L 694.0 160.0" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)" stroke-dasharray="4 4"/>
<path d="M 832.0 160.0 L 838.0 160.0 L 838.0 352.0 L 842.0 352.0" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)" stroke-dasharray="4 4"/>
<rect x="24" y="428" width="952" height="72" rx="8" fill="#F08A590A" stroke="#F08A59" stroke-width="1.0"/>
<text x="44" y="456" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">Host 헤더는 암호문 안에 있습니다. 읽으려면 복호화해야 하고, 복호화하려면 어느 사이트의 인증서를 쓸지 먼저 정해야 합니다.</text>
<text x="44" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">그래서 핸드셰이크 맨 앞의 ClientHello 에 이름을 평문으로 한 번 더 싣습니다. 그것이 SNI 입니다.</text>
<text x="24" y="528" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">같은 이름이 세 번 나오는데 이유가 다릅니다. DNS 는 주소를 찾으려고, SNI 는 인증서를 고르려고, Host 는 가상 호스트를 고르려고 싣습니다.</text>
<line x1="12" y1="572" x2="952" y2="572" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="594" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="584" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="594" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평문으로 건넌다</text>
<rect x="248" y="584" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="270" y="594" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">암호문 안에서 건넌다</text>
<rect x="435" y="584" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="457" y="594" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이름을 평문으로 한 번 더</text>
</svg>
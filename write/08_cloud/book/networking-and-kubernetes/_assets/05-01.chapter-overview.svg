<svg viewBox="0 0 640 340" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>서비스의 재료 전체 지도</title>
  <desc>서비스를 배우기 전에 그 재료 셋을 봅니다. StatefulSet 이 Pod 에 이름과 순서를 주고, Endpoints 가 준비된 주소 목록을 만들며, 그 목록이 대형 클러스터에서 병목이 되자 EndpointSlice 가 부분집합으로 쪼갰습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10.5px; }
    .sec { fill: #3a3632; font-size: 10px; font-weight: 700; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .num { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10.5px; }
    .caution-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .caution-detail { fill: #0d0d0d; font-size: 10.5px; }
  </style>

  <rect width="640" height="340" fill="#0d0d0d"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <!-- 1 -->
  <text class="num" x="34" y="49">1.</text>
  <rect class="box" x="54" y="26" width="532" height="54" rx="4"/>
  <text class="box-title" x="72" y="50">StatefulSet — 이름과 순서</text>
  <text class="box-detail" x="72" y="68">Pod 마다 고유 DNS 레코드</text>
  <text class="sec" x="566" y="50" text-anchor="end">§1</text>

  <path class="arrow" d="M320,80 L320,100" marker-end="url(#ah)"/>

  <!-- 2 -->
  <text class="num" x="34" y="129">2.</text>
  <rect class="box" x="54" y="106" width="532" height="54" rx="4"/>
  <text class="box-title" x="72" y="130">Endpoints — 준비된 주소</text>
  <text class="box-detail" x="72" y="148">ready 목록만 트래픽을 받음</text>
  <text class="sec" x="566" y="130" text-anchor="end">§2</text>

  <path class="arrow" d="M320,160 L320,178" marker-end="url(#ah)"/>

  <!-- 병목 — 주의 -->
  <rect x="120" y="184" width="400" height="54" rx="4" fill="rgb(212,168,83)"/>
  <text class="caution-title" x="140" y="208">주의 · 규모가 만든 병목</text>
  <text class="caution-detail" x="140" y="226">주소 하나 변경에 목록 전체 재전송</text>

  <path class="arrow" d="M320,238 L320,256" marker-end="url(#ah)"/>

  <!-- 3 -->
  <text class="num" x="34" y="285">3.</text>
  <rect class="box" x="54" y="262" width="532" height="54" rx="4"/>
  <text class="box-title" x="72" y="286">EndpointSlice — 쪼개기</text>
  <text class="box-detail" x="72" y="304">바뀐 slice 만 보낸다</text>
  <text class="sec" x="566" y="286" text-anchor="end">§3</text>

  <text class="hint" x="320" y="332" text-anchor="middle">다음 편 서비스가 이 재료를 쓴다</text>
</svg>

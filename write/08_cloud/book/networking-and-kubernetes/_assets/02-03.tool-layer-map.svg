<text x="12" y="26" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SPAN MATRIX · 02-03 DIAGNOSIS</text>
<text x="12" y="52" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">도구가 보는 계층 — 수사 순서는 계층 순서가 아니다</text>
<text x="12" y="72" font-family="'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="11" fill="#8B98A9">막대 길이가 그 도구가 실제로 보는 계층 범위입니다 — 숫자는 본문의 수사 순서입니다.</text>

<title id="dt">도구가 보는 계층 — 수사 순서는 계층 순서가 아니다</title><desc id="dd">진단 도구 여덟 개가 각각 어느 OSI 계층을 관측하는지 세로 스팬으로 표시한 행렬. 내려오는 선의 길이가 제각각이며, 수사 순서는 계층을 위에서 아래로 훑는 것이 아니라 끊길 가능성이 큰 곳부터 싼 검사로 짚는 순서다.</desc>

<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="if-title if-desc">
  <title id="if-title">인터페이스 하나에 이름과 주소 둘이 붙는다</title>
  <desc id="if-desc">리눅스 ip addr show 출력을 그대로 두고, 인터페이스 이름과 MAC·IP 가 각각 어느 줄에 나타나는지 오른쪽에 표시한 주석 도식.</desc>
  <rect width="100%" height="100%" fill="#0D1117"/>
  <text x="60" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.18em">ANNOTATED OUTPUT</text>
  <text x="60" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">인터페이스 하나에 주소가 둘 붙는다</text>
  <text x="60" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">실제 출력입니다. 이름은 왼쪽에, MAC 은 link/ether 줄에, IP 는 inet 줄에 나옵니다.</text>
  <rect x="48" y="128" width="512" height="256" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="68" y="160" fill="#5E6B7E" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" xml:space="preserve">$ ip addr show</text>
  <text x="68" y="196" fill="#F5F5F3" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" xml:space="preserve">1: lo: &lt;LOOPBACK,UP&gt; mtu 65536</text>
  <text x="68" y="218" fill="#8B98A9" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" xml:space="preserve">    inet 127.0.0.1/8 scope host lo</text>
  <text x="68" y="254" fill="#F5F5F3" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" xml:space="preserve">2: eth0: &lt;BROADCAST,MULTICAST,UP&gt; mtu 1500</text>
  <text x="68" y="276" fill="#F08A59" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" xml:space="preserve">    link/ether 2a:4f:1b:8c:d2:e0</text>
  <text x="68" y="298" fill="#6A95D8" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" xml:space="preserve">    inet 192.168.0.15/24 scope global eth0</text>
  <text x="68" y="334" fill="#F5F5F3" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" xml:space="preserve">7: cali3f2a@if4: &lt;BROADCAST,MULTICAST,UP&gt; mtu 1450</text>
  <text x="68" y="356" fill="#8B98A9" font-size="12" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" xml:space="preserve">    link/ether ee:ee:ee:ee:ee:ee</text>
  <line x1="580" y1="214" x2="632" y2="214" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="644" y="218" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">루프백 · 선을 타지 않는다</text>
  <line x1="580" y1="250" x2="632" y2="250" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="644" y="254" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">인터페이스 이름</text>
  <line x1="580" y1="272" x2="632" y2="272" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="644" y="276" fill="#F08A59" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">MAC · L2 주소</text>
  <line x1="580" y1="294" x2="632" y2="294" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="644" y="298" fill="#6A95D8" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">IP · L3 주소와 마스크</text>
  <line x1="580" y1="330" x2="632" y2="330" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="644" y="334" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">veth 쌍 · @if4 가 짝 번호</text>
  <line x1="48" y1="412" x2="952" y2="412" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
  <text x="48" y="440" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.18em">FOCAL</text>
  <text x="140" y="440" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">MAC 은 커널이 만들어 붙인 값이라, 인터페이스가 사라지면 함께 사라집니다.</text>
</svg>

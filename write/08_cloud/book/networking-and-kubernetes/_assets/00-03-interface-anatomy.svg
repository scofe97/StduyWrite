<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">인터페이스 하나에 주소가 둘 붙는다</title><desc id="dd">리눅스 ip addr show 출력을 그대로 두고, 인터페이스 이름과 MAC·IP 가 각각 어느 줄에 나타나는지 오른쪽에 표시한 주석 도식.</desc>
<rect width="1000" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ANNOTATED OUTPUT · ip addr show</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인터페이스 하나에 주소가 둘 붙는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">실제 출력입니다. 이름은 왼쪽에, MAC 은 link/ether 줄에, IP 는 inet 줄에 나옵니다.</text>
<rect x="48" y="128" width="512" height="256" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="68" y="160" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">$ ip addr show</text>
<text x="68" y="196" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">1: lo: &lt;LOOPBACK,UP&gt; mtu 65536</text>
<text x="92" y="218" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">inet 127.0.0.1/8 scope host lo</text>
<line x1="572" y1="214" x2="632" y2="214" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="644" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">루프백 · 선을 타지 않는다</text>
<text x="68" y="254" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">2: eth0: &lt;BROADCAST,MULTICAST,UP&gt; mtu 1500</text>
<line x1="572" y1="250" x2="632" y2="250" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="644" y="254" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">인터페이스 이름</text>
<text x="92" y="276" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F08A59">link/ether 2a:4f:1b:8c:d2:e0</text>
<line x1="572" y1="272" x2="632" y2="272" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="644" y="276" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">MAC · L2 주소</text>
<text x="92" y="298" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">inet 192.168.0.15/24 scope global eth0</text>
<line x1="572" y1="294" x2="632" y2="294" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="644" y="298" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">IP · L3 주소와 마스크</text>
<text x="68" y="334" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">7: cali3f2a@if4: &lt;BROADCAST,MULTICAST,UP&gt; mtu 1450</text>
<line x1="572" y1="330" x2="632" y2="330" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="644" y="334" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">veth 쌍 · @if4 가 짝 번호</text>
<text x="92" y="356" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">link/ether ee:ee:ee:ee:ee:ee</text>
<text x="48" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">MAC 은 커널이 만들어 붙인 값이라, 인터페이스가 사라지면 함께 사라집니다.</text>
<line x1="12" y1="420" x2="952" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="432" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">MAC · L2</text>
<rect x="248" y="432" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="270" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">IP · L3</text>
</svg>
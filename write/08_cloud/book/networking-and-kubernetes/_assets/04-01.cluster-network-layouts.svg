<svg viewBox="0 0 920 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>클러스터 네트워크의 세 레이아웃 — Isolated · Flat · Island</title>
  <desc>Isolated는 노드만 밖에서 라우팅되고 Pod는 격리돼 IP 공간을 재사용할 수 있다. Flat은 모든 Pod IP가 네트워크 전체에서 라우팅돼 단순·저지연이지만 큰 IP 공간이 필요하다. Island는 노드는 라우팅되고 Pod 트래픽은 노드를 프록시 삼아 SNAT로 숨어 IP 공간 요구를 피하되 IP 기반 식별을 잃는다</desc>
  <rect x="0" y="0" width="920" height="430" fill="#0d0d0d"/>

  <text x="460" y="32" text-anchor="middle" fill="#e8e4df" font-size="17" font-weight="700">클러스터 네트워크의 세 레이아웃 — "Pod IP가 밖에서 보이는가"의 거래</text>

  <!-- Isolated -->
  <rect x="30" y="60" width="270" height="300" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="165" y="86" text-anchor="middle" fill="#5b9bd5" font-size="15" font-weight="700">Isolated</text>
  <rect x="50" y="100" width="230" height="22" rx="3" fill="#dceaf7"/>
  <text x="165" y="116" text-anchor="middle" font-size="11" style="fill:#10243a">노드만 라우팅 가능 · Pod는 격리</text>
  <!-- node box -->
  <rect x="60" y="138" width="210" height="86" rx="6" fill="#0d0d0d" stroke="#8a8580" stroke-width="1"/>
  <text x="165" y="156" text-anchor="middle" fill="#e8e4df" font-size="11">노드 (밖에서 라우팅됨)</text>
  <rect x="80" y="166" width="76" height="46" rx="4" fill="#eef4fb"/>
  <text x="118" y="185" text-anchor="middle" font-size="10" style="fill:#10243a" font-weight="700">Pod</text>
  <text x="118" y="200" text-anchor="middle" font-size="9" style="fill:#10243a">닫힘</text>
  <rect x="176" y="166" width="76" height="46" rx="4" fill="#eef4fb"/>
  <text x="214" y="185" text-anchor="middle" font-size="10" style="fill:#10243a" font-weight="700">Pod</text>
  <text x="214" y="200" text-anchor="middle" font-size="9" style="fill:#10243a">닫힘</text>
  <text x="165" y="256" text-anchor="middle" fill="#66bb6a" font-size="11" font-weight="700">얻는 것: 보안 격리</text>
  <text x="165" y="276" text-anchor="middle" fill="#66bb6a" font-size="11" font-weight="700">클러스터끼리 IP 공간 재사용</text>
  <text x="165" y="304" text-anchor="middle" fill="#f44336" font-size="11">대가: 외부 연동은 LB·프록시로</text>
  <text x="165" y="322" text-anchor="middle" fill="#f44336" font-size="11">뚫어야 함</text>
  <text x="165" y="346" text-anchor="middle" fill="#8a8580" font-size="10">배치 처리 등 닫힌 워크로드에 적합</text>

  <!-- Flat -->
  <rect x="325" y="60" width="270" height="300" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="460" y="86" text-anchor="middle" fill="#66bb6a" font-size="15" font-weight="700">Flat</text>
  <rect x="345" y="100" width="230" height="22" rx="3" fill="#e6f7e7"/>
  <text x="460" y="116" text-anchor="middle" font-size="11" style="fill:#14521d">모든 Pod IP가 네트워크 전체에서 라우팅</text>
  <rect x="355" y="138" width="210" height="86" rx="6" fill="#0d0d0d" stroke="#8a8580" stroke-width="1"/>
  <text x="460" y="156" text-anchor="middle" fill="#e8e4df" font-size="11">노드 (밖에서 라우팅됨)</text>
  <rect x="375" y="166" width="76" height="46" rx="4" fill="#e6f7e7"/>
  <text x="413" y="185" text-anchor="middle" font-size="10" style="fill:#14521d" font-weight="700">Pod</text>
  <text x="413" y="200" text-anchor="middle" font-size="9" style="fill:#14521d">직접 노출</text>
  <rect x="471" y="166" width="76" height="46" rx="4" fill="#e6f7e7"/>
  <text x="509" y="185" text-anchor="middle" font-size="10" style="fill:#14521d" font-weight="700">Pod</text>
  <text x="509" y="200" text-anchor="middle" font-size="9" style="fill:#14521d">직접 노출</text>
  <text x="460" y="256" text-anchor="middle" fill="#66bb6a" font-size="11" font-weight="700">얻는 것: 단순·저지연</text>
  <text x="460" y="276" text-anchor="middle" fill="#66bb6a" font-size="11" font-weight="700">밖 LB가 Pod 직접 밸런싱</text>
  <text x="460" y="304" text-anchor="middle" fill="#f44336" font-size="11">대가: 크고 연속된 IP 공간 필요</text>
  <text x="460" y="322" text-anchor="middle" fill="#f44336" font-size="11">프로그래머블 네트워크 필수</text>
  <text x="460" y="346" text-anchor="middle" fill="#8a8580" font-size="10">클라우드(큰 사설망+할당 API)에서 쉬움</text>

  <!-- Island -->
  <rect x="620" y="60" width="270" height="300" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="755" y="86" text-anchor="middle" fill="rgb(212,168,83)" font-size="15" font-weight="700">Island</text>
  <rect x="640" y="100" width="230" height="22" rx="3" fill="#f5edda"/>
  <text x="755" y="116" text-anchor="middle" font-size="11" style="fill:#0d0d0d">노드는 라우팅 · Pod는 노드 뒤 SNAT</text>
  <rect x="650" y="138" width="210" height="86" rx="6" fill="#0d0d0d" stroke="#8a8580" stroke-width="1"/>
  <text x="755" y="156" text-anchor="middle" fill="#e8e4df" font-size="11">노드 (masquerade 프록시)</text>
  <rect x="670" y="166" width="76" height="46" rx="4" fill="#fdf3df"/>
  <text x="708" y="185" text-anchor="middle" font-size="10" style="fill:#0d0d0d" font-weight="700">Pod</text>
  <text x="708" y="200" text-anchor="middle" font-size="9" style="fill:#0d0d0d">숨음</text>
  <rect x="766" y="166" width="76" height="46" rx="4" fill="#fdf3df"/>
  <text x="804" y="185" text-anchor="middle" font-size="10" style="fill:#0d0d0d" font-weight="700">Pod</text>
  <text x="804" y="200" text-anchor="middle" font-size="9" style="fill:#0d0d0d">숨음</text>
  <text x="755" y="256" text-anchor="middle" fill="#66bb6a" font-size="11" font-weight="700">얻는 것: Flat의 IP 공간</text>
  <text x="755" y="276" text-anchor="middle" fill="#66bb6a" font-size="11" font-weight="700">요구를 회피</text>
  <text x="755" y="304" text-anchor="middle" fill="#f44336" font-size="11">대가: Pod IP가 노드 뒤에 숨어</text>
  <text x="755" y="322" text-anchor="middle" fill="#f44336" font-size="11">IP 기반 방화벽·식별이 어려움</text>
  <text x="755" y="346" text-anchor="middle" fill="#8a8580" font-size="10">IP 공간 부족 + 외부 통신 필요 시</text>

  <text x="460" y="388" text-anchor="middle" fill="rgb(212,168,83)" font-size="13" font-weight="700">노드·Pod는 그 주소 공간에서 L3 연결성을 가져야 한다 — Pod는 보통 MAC이 없어 L2 연결은 없다</text>
  <text x="460" y="412" text-anchor="middle" fill="#8a8580" font-size="11">Kubernetes는 기본 CNI를 싣지 않는다 — CNI 없으면 Pod 네트워크도 없다</text>
</svg>

<title id="dt">ASN 은 라우터가 아니라 조직에 붙는다</title><desc id="dd">가로 한 줄만 eBGP 이고 나머지는 모두 iBGP 다 — 라우터는 여섯 대지만 밖에서 보이는 번호는 둘뿐이다</desc>
<rect width="1000" height="612" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ASN BELONGS TO AN ORGANIZATION</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">ASN 은 라우터가 아니라 조직에 붙는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">한 줄만 eBGP, 나머지는 iBGP — 라우터 여섯 대에 번호는 둘뿐이다</text>

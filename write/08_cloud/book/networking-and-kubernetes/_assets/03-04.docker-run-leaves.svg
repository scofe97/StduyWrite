<text x="24" y="468" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">포트 매핑과 NAT 은 전부 왼쪽 링 안에 생깁니다. 그래서 컨테이너끼리 주고받는 트래픽은 그것들을 지나지 않습니다.</text>

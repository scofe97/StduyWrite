<title id="dt">docker run 한 줄이 남긴 것 — 어느 스택에 무엇이 있나</title><desc id="dd">컨테이너 하나를 띄운 뒤 호스트에 남는 배선과 컨테이너 안에 생긴 것을 네임스페이스별로 나눈 그림. veth 쌍만 두 네임스페이스를 가로지르고, 나머지는 각자 한쪽에만 존재한다.</desc>
<rect width="1000" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DOCKER RUN · WHAT IT LEAVES BEHIND</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">docker run 한 줄이 남긴 것 — 어느 스택에 무엇이 있나</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">링 하나가 네트워크 네임스페이스 하나입니다 · 포트 매핑과 NAT 은 호스트 쪽에만 있습니다</text>

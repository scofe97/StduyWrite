<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">점선 안이 ARP 물음이 닿는 범위입니다. 라우터가 경계이고, 그 너머로는 한 발짝도 나가지 않습니다.</text>

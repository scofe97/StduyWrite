<title id="dt">브로드캐스트는 한 동네를 벗어나지 못한다</title><desc id="dd">스위치에 붙은 호스트 넷을 점선 경계로 묶어 브로드캐스트가 닿는 범위를 보이고, 라우터 너머의 호스트는 경계 밖에 두어 닿지 않음을 표시한 도식.</desc>

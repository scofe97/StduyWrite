<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bc-title bc-desc">
  <title id="bc-title">브로드캐스트가 닿는 범위</title>
  <desc id="bc-desc">스위치에 붙은 호스트 넷을 점선 경계로 묶어 브로드캐스트가 닿는 범위를 보이고, 라우터 너머의 호스트는 경계 밖에 두어 닿지 않음을 표시한 도식.</desc>
  <rect width="100%" height="100%" fill="#0D1117"/>
  <text x="60" y="40" fill="#5E6B7E" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" letter-spacing="0.18em">SCOPE</text>
  <text x="60" y="72" fill="#F5F5F3" font-size="20" font-weight="600" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">브로드캐스트는 한 동네를 벗어나지 못한다</text>
  <text x="60" y="100" fill="#8B98A9" font-size="12" font-family="'Geist', 'Apple SD Gothic Neo', sans-serif">점선 안이 ARP 물음이 닿는 범위입니다. 라우터가 경계이고, 그 너머로는 한 발짝도 나가지 않습니다.</text>

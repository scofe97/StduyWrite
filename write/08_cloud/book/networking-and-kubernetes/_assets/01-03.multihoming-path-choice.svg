<title id="dt">멀티호밍 — 같은 대역이 두 갈래로 광고되어 들어올 때</title><desc id="dd">화살표는 광고가 퍼지는 방향이고 패킷은 반대로 흐른다. 각 AS 가 자기 번호를 목록 앞에 붙여 넘기므로 AS_PATH 가 자란다.</desc>
<rect width="1000" height="684" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BGP · MULTIHOMING PATH CHOICE</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">멀티호밍 — 같은 대역이 두 갈래로 광고되어 들어올 때</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 대역이 두 길로 들어오고, 우리 ISP 는 표엔 한 줄만 적는다</text>
<rect x="24" y="104" width="952" height="524" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">같은 대역이 두 길로 들어와도 표에는 한 줄만 남는다</text>
<rect x="340.0" y="138" width="320" height="28" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="157" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">화살표는 광고 방향 — 패킷은 반대로 흐른다</text>
<rect x="762" y="268" width="180" height="104" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="852" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">목적지 망</text>
<text x="852" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">8.8.8.0/24 주인</text>
<text x="852" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">AS 500 · 광고 시작</text>
<rect x="410" y="184" width="180" height="104" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">상위 A</text>
<text x="500" y="238" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">AS 200 · 앞에 붙임</text>
<text x="500" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">AS_PATH 200 500</text>
<rect x="610" y="432" width="180" height="104" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="700" y="464" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">중간 사업자</text>
<text x="700" y="486" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">AS 400 · 앞에 붙임</text>
<text x="700" y="510" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">AS_PATH 400 500</text>
<rect x="310" y="432" width="180" height="104" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="400" y="464" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">상위 B</text>
<text x="400" y="486" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">AS 300 · 다시 붙임</text>
<text x="400" y="510" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">AS_PATH 300 400 500</text>
<rect x="58" y="268" width="180" height="104" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="148" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">우리 ISP</text>
<text x="148" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">AS 100 · 둘 다 받는다</text>
<text x="148" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">표엔 한 줄만 적는다</text>
<rect x="58" y="448" width="180" height="104" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1" stroke-dasharray="6 5"/>
<text x="148" y="480" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">고르는 순서</text>
<text x="148" y="502" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">1. Local Pref · 정책</text>
<text x="148" y="526" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">2. AS_PATH 길이</text>
<path d="M 754 300 L 676 300 L 676 260 L 600 260" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)"/>
<path d="M 402 260 L 324 260 L 324 300 L 248 300" fill="none" stroke="#6A95D8" stroke-width="1.6" marker-end="url(#info)"/>
<rect x="694.0" y="290" width="50.0" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="719" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6A95D8">2 홉</text>
<path d="M 776 378 L 776 426" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 602 484 L 500 484" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 302 484 L 268 484 L 268 340 L 248 340" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="525.0" y="474" width="50.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="550" y="488" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">3 홉</text>
<path d="M 148 378 L 148 438" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<text x="36" y="600" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">고르는 규칙은 하나이고 표도 하나여서, 어느 쪽으로 배웠든 같은 표에 섞인 뒤 정책이 같다면 목록이 짧은 쪽이 이긴다</text>
<line x1="12" y1="644" x2="952" y2="644" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="666" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="656" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="666" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">짧은 길</text>
<rect x="196" y="656" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="218" y="666" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">광고 시작</text>
<rect x="305" y="656" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="327" y="666" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">고르는 자리</text>

<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">체인을 갈아타는 동안 헤더는 그대로이고, 바뀌는 자리는 두 곳뿐이다</text>
<rect x="40" y="214" width="920" height="142" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="56" y="205" width="176" height="18" fill="#0D1117"/>

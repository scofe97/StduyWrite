<title id="dt">패킷 하나가 nat 테이블을 지나는 동안 — 어느 규칙에 걸려 어느 필드가 바뀌는가</title><desc id="dd">위는 지나는 자리와 거기서 걸린 규칙, 아래는 그 직후 패킷 상태다. 마지막 칸은 노드에서 온 요청일 때만 일어난다.</desc>
<rect width="1000" height="652" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">nat TABLE · WHERE IT LANDS, WHAT CHANGES</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">패킷 하나가 nat 테이블을 지나는 동안 — 어느 규칙에 걸려 어느 필드가 바뀌는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">위는 지나는 자리와 걸린 규칙 · 아래는 그 직후 패킷 상태 (kind 실측)</text>

<title id="dt">네트워킹 역사와 OSI 모델 — 네 박자로 읽는 지도</title><desc id="dd">01-01편의 전체 구조. 단일 프로토콜 NCP의 실패에서 출발해 그것을 설명하는 언어(OSI 7계층)를 얻고, 표준 경쟁에서 TCP/IP가 이겼으며, 그럼에도 OSI의 용어만 남아 오늘까지 쓰인다는 네 단계로 이어진다.</desc>
<rect width="1080" height="406" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 01-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">네트워킹 역사와 OSI 모델 — 네 박자로 읽는 지도</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">단일 프로토콜의 실패 → 그것을 설명하는 언어 → 표준 경쟁 → 남은 것</text>
<text x="129.75" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§1</text>
<rect x="12.0" y="132" width="235.5" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="129.75" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">실패</text>
<line x1="30.0" y1="182" x2="229.5" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="129.75" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">하나가 다 하던 NCP가 무너졌다</text>
<text x="30.0" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">· 네트워크가 다양해짐</text>
<text x="30.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">· 한 프로토콜이 병목</text>
<text x="30.0" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">· 신뢰성과 전달을 쪼갬</text>
<path d="M 250.5 230.0 L 269.5 230.0" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="391.25" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§2</text>
<rect x="273.5" y="132" width="235.5" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="391.25" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">개념 틀</text>
<line x1="291.5" y1="182" x2="491.0" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="391.25" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">책임을 나누는 언어를 얻었다</text>
<text x="291.5" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">· OSI 7계층</text>
<text x="291.5" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">· 캡슐화 — 감싸고 벗긴다</text>
<text x="291.5" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">· 각 계층은 자기 헤더만</text>
<path d="M 512.0 230.0 L 531.0 230.0" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="652.75" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§3</text>
<rect x="535.0" y="132" width="235.5" height="196" rx="6" fill="#F0616D10" stroke="#F0616D" stroke-width="1.4"/>
<text x="652.75" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F0616D">표준 경쟁</text>
<line x1="553.0" y1="182" x2="752.5" y2="182" stroke="#F0616D44" stroke-width="0.9"/>
<text x="652.75" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">OSI 는 졌는데 용어는 남았다</text>
<text x="553.0" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">· TCP/IP 가 실무 표준</text>
<text x="553.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">· OSI 는 교육 도구로</text>
<text x="553.0" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">· 가장 자주 오해되는 자리</text>
<path d="M 773.5 230.0 L 792.5 230.0" fill="none" stroke="#8B98A9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="914.25" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§4·5</text>
<rect x="796.5" y="132" width="235.5" height="196" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.4"/>
<text x="914.25" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">남은 것</text>
<line x1="814.5" y1="182" x2="1014.0" y2="182" stroke="#3FB98C44" stroke-width="0.9"/>
<text x="914.25" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">4계층 모델과 실습으로 이어진다</text>
<text x="814.5" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">· OSI 7 ↔ TCP/IP 4</text>
<text x="814.5" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">· 이름으로 부른다</text>
<text x="814.5" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">· 다음 편들의 토대</text>
<text x="540.0" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">붉은 칸이 이 장에서 가장 자주 오해되는 자리입니다 — 졌지만 용어는 살아남았습니다.</text>
<line x1="12" y1="362" x2="1032" y2="362" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="384" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="374" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">도입·전개</text>
<rect x="209" y="374" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="231" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">핵심·결론</text>
<rect x="318" y="374" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="340" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">다음으로 이어짐</text>
</svg>
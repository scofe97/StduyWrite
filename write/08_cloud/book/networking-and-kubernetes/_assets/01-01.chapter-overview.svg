<svg viewBox="0 0 640 470" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>네트워킹 역사와 OSI 모델 전체 지도</title>
  <desc>단일 프로토콜 NCP의 실패에서 출발해 TCP/IP의 책임 분리, OSI 7계층의 개념 틀, 표준 경쟁의 결과, TCP/IP 4계층 대응, 그리고 책 전체가 재사용할 Go 서버까지 다섯 단계로 이어지는 흐름입니다. 각 단계에 해당 절 번호가 붙어 있습니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10.5px; }
    .sec { fill: #3a3632; font-size: 10px; font-weight: 700; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .num { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .caution-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .caution-detail { fill: #0d0d0d; font-size: 10.5px; }
  </style>

  <rect width="640" height="470" fill="#0d0d0d"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <!-- 1. NCP -->
  <text class="num" x="34" y="47">1.</text>
  <rect class="box" x="54" y="26" width="532" height="56" rx="4"/>
  <text class="box-title" x="72" y="49">NCP — 단일 프로토콜</text>
  <text class="box-detail" x="72" y="68">다양해지자 확장 실패</text>
  <text class="sec" x="566" y="49" text-anchor="end">§1</text>

  <path class="arrow" d="M320,82 L320,104" marker-end="url(#ah)"/>

  <!-- 2. TCP/IP 분리 -->
  <text class="num" x="34" y="131">2.</text>
  <rect class="box" x="54" y="110" width="532" height="56" rx="4"/>
  <text class="box-title" x="72" y="133">TCP / IP 로 책임 분리</text>
  <text class="box-detail" x="72" y="152">신뢰성 TCP · 전달 IP</text>
  <text class="sec" x="566" y="133" text-anchor="end">§1</text>

  <path class="arrow" d="M320,166 L320,188" marker-end="url(#ah)"/>

  <!-- 3. OSI 7계층 -->
  <text class="num" x="34" y="215">3.</text>
  <rect class="box" x="54" y="194" width="532" height="56" rx="4"/>
  <text class="box-title" x="72" y="217">OSI 7계층 — 캡슐화</text>
  <text class="box-detail" x="72" y="236">계층마다 자기 PDU</text>
  <text class="sec" x="566" y="217" text-anchor="end">§2</text>

  <path class="arrow" d="M320,250 L320,272" marker-end="url(#ah)"/>

  <!-- 4. 표준 경쟁 — 주의 -->
  <text class="num" x="34" y="299">4.</text>
  <rect x="54" y="278" width="532" height="56" rx="4" fill="rgb(212,168,83)"/>
  <text class="caution-title" x="72" y="301">주의 · 지고도 남은 용어</text>
  <text class="caution-detail" x="72" y="320">구현체 소멸, L3 · L7 잔존</text>
  <text class="sec" x="566" y="301" text-anchor="end">§3</text>

  <path class="arrow" d="M320,334 L320,356" marker-end="url(#ah)"/>

  <!-- 5. TCP/IP 4계층 -->
  <text class="num" x="34" y="383">5.</text>
  <rect class="box" x="54" y="362" width="532" height="56" rx="4"/>
  <text class="box-title" x="72" y="385">TCP / IP 4계층 — 구현</text>
  <text class="box-detail" x="72" y="404">상위 3계층 → Application</text>
  <text class="sec" x="566" y="385" text-anchor="end">§4</text>

  <path class="arrow" d="M320,418 L320,436" marker-end="url(#ah)"/>

  <!-- 6. Go 서버 -->
  <rect class="box" x="140" y="440" width="360" height="24" rx="4"/>
  <text class="box-title" x="160" y="457">Go 웹 서버 — 책 전체</text>
  <text class="sec" x="480" y="457" text-anchor="end">§5</text>
</svg>

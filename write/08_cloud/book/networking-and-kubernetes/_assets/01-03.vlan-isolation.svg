<title id="dt">VLAN — 같은 장비인데 서로 들리지 않는다</title><desc id="dd">물리 배선은 그대로 두고 태그로 브로드캐스트 도메인을 가른다</desc>
<rect width="1000" height="604" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">VLAN · ONE SWITCH, TWO DOMAINS</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">VLAN — 같은 장비인데 서로 들리지 않는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">물리 배선은 그대로 두고 태그로 브로드캐스트 도메인을 가른다</text>
<rect x="24" y="104" width="952" height="448" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">포트는 전부 같은 장비에 꽂혀 있다 — 갈라지는 것은 배선이 아니라 태그다</text>
<rect x="120" y="176" width="760" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="500" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">물리 스위치 한 대</text>
<text x="500" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">포트는 전부 같은 장비 · 배선은 그대로</text>
<rect x="120" y="296" width="356" height="148" rx="8" fill="#6A95D808" stroke="#6A95D8" stroke-width="1.2"/>
<rect x="144" y="287" width="111" height="18" fill="#0D1117"/>
<text x="154" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">VLAN 10 · 태그 10</text>
<rect x="160" y="340" width="76" height="44" rx="5" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="198" y="367" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">호스트 1</text>
<rect x="256" y="340" width="76" height="44" rx="5" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="294" y="367" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">호스트 2</text>
<rect x="352" y="340" width="76" height="44" rx="5" fill="#161B22" stroke="#6A95D8" stroke-width="1.0"/>
<text x="390" y="367" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">호스트 3</text>
<text x="298" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">브로드캐스트가 이 안에서만</text>
<path d="M 298 258 L 298 286" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="524" y="296" width="356" height="148" rx="8" fill="#E3B34108" stroke="#E3B341" stroke-width="1.2"/>
<rect x="548" y="287" width="111" height="18" fill="#0D1117"/>
<text x="558" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#E3B341">VLAN 20 · 태그 20</text>
<rect x="564" y="340" width="76" height="44" rx="5" fill="#161B22" stroke="#E3B341" stroke-width="1.0"/>
<text x="602" y="367" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">호스트 1</text>
<rect x="660" y="340" width="76" height="44" rx="5" fill="#161B22" stroke="#E3B341" stroke-width="1.0"/>
<text x="698" y="367" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">호스트 2</text>
<rect x="756" y="340" width="76" height="44" rx="5" fill="#161B22" stroke="#E3B341" stroke-width="1.0"/>
<text x="794" y="367" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">호스트 3</text>
<text x="702" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">옆 태그의 방송은 안 들린다</text>
<path d="M 702 258 L 702 286" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="500" y1="280" x2="500" y2="456" stroke="#F08A59" stroke-width="1.6" stroke-dasharray="6 6"/>
<rect x="368.0" y="464" width="264" height="28" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="500" y="483" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">태그가 다르면 방송이 안 넘어간다</text>
<text x="36" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">받고 버릴 남의 프레임이 줄어드니 혼잡과 노출이 함께 줄어든다 — VLAN 이 가두는 기술인 이유가 이것이다</text>
<line x1="12" y1="568" x2="952" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="590" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="580" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">VLAN 10</text>
<rect x="235" y="580" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="257" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">VLAN 20</text>
<rect x="370" y="580" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="392" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">갈라지는 자리</text>
</svg>
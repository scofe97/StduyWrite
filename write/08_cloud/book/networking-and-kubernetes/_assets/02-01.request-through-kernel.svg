<title id="dt">요청 하나가 커널을 관통하는 순서 — 네 절이 실제로 이어지는 자리</title><desc id="dd">점선 안이 커널 공간. 양 끝 두 칸은 그 밖(하드웨어와 유저 공간)이고, 패킷은 경계를 두 번 넘는다.</desc>
<rect width="1000" height="672" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ONE REQUEST · THROUGH THE KERNEL</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">요청 하나가 커널을 관통하는 순서 — 네 절이 실제로 이어지는 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">양 끝 두 칸은 커널 밖 · 패킷은 경계를 두 번 넘는다</text>
<rect x="16" y="104" width="968" height="496" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="30" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">네 절이 이어지는 자리 · 훅 · 연결 추적 · 라우팅 · 소켓</text>

<title id="dt">FailedScheduling 메시지는 노드별 탈락 이유를 세어 합친 한 줄입니다</title><desc id="dd">노드 다섯 대가 모두 떨어진 장면입니다. node-1 은 affinity 와 selector 불일치, node-2 와 node-3 은 Insufficient memory, node-4 와 node-5 는 untolerated taint 로 탈락합니다. 스케줄러가 이유별 개수를 세어 문자열 순으로 정렬한 뒤 0/5 nodes are available 로 시작하는 한 줄을 만들고, 읽는 쪽은 큰 덩어리부터 requests 조정, toleration 추가, 노드 라벨 확인으로 고칩니다.</desc>
<rect width="1000" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES PATTERNS · 06-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">FailedScheduling 메시지는 노드별 탈락 이유를 세어 합친 한 줄입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">통과한 노드가 하나도 없는 경우 · 메시지 안 이유는 개수 순이 아니라 문자열 순으로 정렬됩니다</text>
<text x="24" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">노드별 탈락 이유</text>

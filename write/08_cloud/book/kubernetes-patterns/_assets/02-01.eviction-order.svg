<title id="dt">축출 순서는 등급이 아니라 세 질문이 정합니다</title><desc id="dd">노드 메모리가 임계에 닿으면 kubelet 은 request 초과 여부, Priority, 초과량 순으로 후보를 가립니다. 아래 Pod 셋은 첫 질문에서 갈리고, request 를 넘은 두 Pod 는 뒤 질문으로 이어집니다.</desc>
<rect width="1000" height="548" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES PATTERNS · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">축출 순서는 등급이 아니라 세 질문이 정합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">QoS 등급은 이 질문들의 결과와 닮았을 뿐 kubelet 이 등급으로 순서를 정하지는 않습니다</text>

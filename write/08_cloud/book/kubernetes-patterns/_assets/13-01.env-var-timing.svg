<svg viewBox="0 0 880 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>환경변수 주입 시점이 Service 생성 순서에 걸리는 이유</title>
  <desc>환경변수를 통한 디스커버리가 Service 생성 순서에 의존하는 까닭을 두 경우로 대조한 것입니다. Case A는 Service를 먼저 만든 경우로, 그 뒤에 시작한 소비자 Pod에는 kubelet이 그 시점까지 존재하는 모든 Service를 훑어 RANDOM_GENERATOR_SERVICE_HOST 같은 환경변수를 채워 넣으므로 앱이 환경변수를 읽어 정상 동작합니다. Case B는 소비자 Pod를 먼저 만든 경우로, Pod 시작 시점에 Service가 없었으므로 환경변수가 만들어지지 않고, 그 뒤에 Service를 만들어도 이미 도는 프로세스의 환경변수는 소급해서 채워지지 않습니다. 리눅스에서 환경변수는 execve 호출 시점에 커널이 프로세스 메모리로 복사하고 그 뒤에는 밖에서 바꿀 수 없기 때문이며, 이는 Kubernetes의 제약이 아니라 운영체제의 성질입니다. 다만 Case B에서도 clusterIP와 iptables 규칙과 DNS 등록은 모두 정상이므로 네트워크 자체는 멀쩡하고, 끊긴 것은 주소를 알아내는 경로 하나뿐입니다. 그래서 DNS 조회로 호출하면 시작 시점과 무관하게 언제나 통하며, 환경변수 방식에 걸렸다면 Pod를 재시작해 execve를 다시 하게 만드는 것이 유일한 해결입니다.</desc>

  <defs>
    <marker id="ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="tg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#66bb6a"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">환경변수 주입은 Pod 시작 시점에 고정된다</text>
  <text x="24" y="50" fill="#e8e4df" font-size="10">가로축은 시간. 같은 두 작업을 순서만 바꿔 실행한 결과입니다.</text>

  <!-- time axis -->
  <path d="M60 88 L820 88" fill="none" stroke="rgb(138,133,128)" stroke-width="1" marker-end="url(#ta)"/>
  <text x="820" y="80" text-anchor="end" fill="rgb(138,133,128)" font-size="9">시간</text>

  <!-- ===== Case A ===== -->
  <text x="24" y="126" fill="#66bb6a" font-size="12" font-weight="700">Case A — Service 먼저</text>

  <rect x="150" y="140" width="180" height="52" fill="#f5edda"/>
  <text x="240" y="161" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">① Service 생성</text>
  <rect x="164" y="168" width="152" height="16" fill="#fdf3df"/>
  <text x="240" y="180" text-anchor="middle" fill="#0d0d0d" font-size="9" font-weight="700">clusterIP 10.109.72.32</text>

  <rect x="400" y="140" width="180" height="52" fill="#cdeccf"/>
  <text x="490" y="161" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">② 소비자 Pod 시작</text>
  <text x="490" y="180" text-anchor="middle" fill="#14521d" font-size="9">kubelet이 기존 Service를 훑음</text>

  <rect x="650" y="140" width="190" height="52" fill="#dceaf7"/>
  <text x="745" y="158" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">환경변수 채워짐</text>
  <rect x="662" y="166" width="166" height="17" fill="#eef6fc"/>
  <text x="745" y="179" text-anchor="middle" fill="#10243a" font-size="8" font-weight="700">..._SERVICE_HOST=10.109.72.32</text>

  <path d="M336 166 L394 166" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ta)"/>
  <path d="M586 166 L644 166" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#tg)"/>

  <text x="650" y="210" fill="#66bb6a" font-size="10" font-weight="700">앱이 getenv 로 주소를 읽어 정상 호출</text>

  <!-- divider -->
  <path d="M24 236 L856 236" fill="none" stroke="rgb(138,133,128)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== Case B ===== -->
  <text x="24" y="268" fill="#e8985c" font-size="12" font-weight="700">Case B — Pod 먼저</text>

  <rect x="150" y="282" width="180" height="52" fill="#cdeccf"/>
  <text x="240" y="303" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">① 소비자 Pod 시작</text>
  <text x="240" y="322" text-anchor="middle" fill="#14521d" font-size="9">이 시점에 Service 없음</text>

  <rect x="400" y="282" width="180" height="52" fill="#f5edda"/>
  <text x="490" y="303" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">② Service 생성</text>
  <rect x="414" y="310" width="152" height="16" fill="#fdf3df"/>
  <text x="490" y="322" text-anchor="middle" fill="#0d0d0d" font-size="9" font-weight="700">clusterIP · iptables · DNS 정상</text>

  <rect x="650" y="282" width="190" height="52" fill="#f2d4d4"/>
  <text x="745" y="300" text-anchor="middle" fill="#7a1f1f" font-size="10" font-weight="700">환경변수 비어 있음</text>
  <rect x="662" y="308" width="166" height="17" fill="#fbe9e9"/>
  <text x="745" y="321" text-anchor="middle" fill="#7a1f1f" font-size="8" font-weight="700">getenv(...) → null</text>

  <path d="M336 308 L394 308" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ta)"/>
  <path d="M586 308 L644 308" fill="none" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ta)"/>
  <text x="615" y="300" text-anchor="middle" fill="rgb(212,168,83)" font-size="8">소급 주입 없음</text>

  <!-- why box -->
  <rect x="150" y="352" width="430" height="46" fill="#f5edda"/>
  <text x="165" y="371" fill="#0d0d0d" font-size="10" font-weight="700">왜 소급되지 않나 — 운영체제의 성질</text>
  <text x="165" y="389" fill="#0d0d0d" font-size="9">execve 시점에 커널이 프로세스 메모리로 복사. 밖에서 바꿀 방법이 없음</text>

  <rect x="650" y="352" width="190" height="46" fill="#dceaf7"/>
  <text x="745" y="371" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">해결 — Pod 재시작</text>
  <text x="745" y="389" text-anchor="middle" fill="#10243a" font-size="9">execve 를 다시 수행</text>

  <!-- bottom: network is fine -->
  <rect x="150" y="416" width="690" height="40" fill="#cdeccf"/>
  <text x="165" y="433" fill="#14521d" font-size="10" font-weight="700">Case B 에서도 네트워크는 멀쩡하다 — 끊긴 것은 주소를 알아내는 경로 하나뿐</text>
  <text x="165" y="449" fill="#14521d" font-size="9">그 Pod 안에서 curl http://random-generator 는 통함. DNS 는 호출하는 그 순간 조회하므로 시작 시점과 무관</text>
</svg>

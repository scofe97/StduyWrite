<svg viewBox="0 0 900 410" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>노드 메모리가 부족해질 때 Pod가 죽는 순서</title>
  <desc>노드에 압축 불가 자원인 메모리 압박이 생겼을 때 kubelet이 Pod를 죽이는 순서를 보입니다. 위쪽은 선언에서 등급이 정해지는 경로입니다. 컨테이너에 requests와 limits를 어떻게 적었느냐에 따라 플랫폼이 QoS 등급을 자동으로 매깁니다. 둘 다 없으면 Best-Effort, 서로 다르면 Burstable, 같으면 Guaranteed입니다. 아래쪽은 그 등급이 생사 순서로 이어지는 경로입니다. 메모리 압박이 오면 Best-Effort가 가장 먼저 죽고, 남은 것이 없으면 Burstable이 그다음으로 죽으며, Guaranteed는 앞의 둘보다 먼저 죽지 않습니다. 그래서 메모리에는 requests와 limits를 같게 두어 Guaranteed 등급을 받는 것이 최선입니다.</desc>

  <rect width="900" height="410" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">선언이 생사 순서를 정합니다</text>

  <!-- ===== declaration -> QoS ===== -->
  <text x="24" y="60" fill="#b8b3ad" font-size="11" font-weight="700">무엇을 적었는가</text>

  <rect x="24" y="72" width="240" height="44" fill="#0d0d0d" stroke="#b8b3ad"/>
  <text x="144" y="90" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">아무것도 없음</text>
  <text x="144" y="107" text-anchor="middle" fill="#b8b3ad" font-size="9">requests · limits 없음</text>

  <rect x="24" y="124" width="240" height="44" fill="#0d0d0d" stroke="#b8b3ad"/>
  <text x="144" y="142" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">서로 다름</text>
  <text x="144" y="159" text-anchor="middle" fill="#b8b3ad" font-size="9" font-family="'JetBrains Mono', monospace">limits &gt; requests</text>

  <rect x="24" y="176" width="240" height="44" fill="#0d0d0d" stroke="#b8b3ad"/>
  <text x="144" y="194" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">같음</text>
  <text x="144" y="211" text-anchor="middle" fill="#b8b3ad" font-size="9" font-family="'JetBrains Mono', monospace">requests == limits</text>

  <path d="M 268 94 L 306 94" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <path d="M 268 146 L 306 146" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <path d="M 268 198 L 306 198" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <text x="287" y="62" text-anchor="middle" fill="rgb(212,168,83)" font-size="9" font-weight="700">자동 판정</text>

  <!-- QoS tiers -->
  <rect x="310" y="72" width="200" height="44" fill="#f2d4d4"/>
  <text x="410" y="98" text-anchor="middle" fill="#7a1f1f" font-size="11" font-weight="700">Best-Effort</text>

  <rect x="310" y="124" width="200" height="44" fill="#f5edda"/>
  <text x="410" y="150" text-anchor="middle" fill="#0d0d0d" font-size="11" font-weight="700">Burstable</text>

  <rect x="310" y="176" width="200" height="44" fill="#cdeccf"/>
  <text x="410" y="202" text-anchor="middle" fill="#14521d" font-size="11" font-weight="700">Guaranteed</text>

  <!-- eviction order -->
  <text x="556" y="60" fill="#f44336" font-size="11" font-weight="700">메모리 압박이 오면</text>

  <path d="M 514 94 L 552 94" stroke="#f44336" stroke-width="2" marker-end="url(#r)"/>
  <rect x="556" y="72" width="320" height="44" fill="#f2d4d4"/>
  <text x="576" y="98" fill="#7a1f1f" font-size="11" font-weight="700">1순위 · 가장 먼저 죽습니다</text>

  <path d="M 514 146 L 552 146" stroke="#f44336" stroke-width="2" marker-end="url(#r)"/>
  <rect x="556" y="124" width="320" height="44" fill="#f5edda"/>
  <text x="576" y="143" fill="#0d0d0d" font-size="11" font-weight="700">2순위 · 그다음입니다</text>
  <text x="576" y="160" fill="#0d0d0d" font-size="9">Best-Effort 소진 후</text>

  <path d="M 514 198 L 552 198" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>
  <rect x="556" y="176" width="320" height="44" fill="#cdeccf"/>
  <text x="576" y="195" fill="#14521d" font-size="11" font-weight="700">앞의 둘보다 먼저 죽지 않습니다</text>
  <text x="576" y="212" fill="#14521d" font-size="9">메모리에는 이 등급이 최선입니다</text>

  <line x1="24" y1="244" x2="876" y2="244" stroke="#4a4640"/>

  <!-- compressible vs not -->
  <text x="24" y="270" fill="#e8e4df" font-size="12" font-weight="700">한도를 넘기면</text>

  <rect x="24" y="282" width="410" height="60" fill="#dceaf7"/>
  <text x="44" y="304" fill="#10243a" font-size="11" font-weight="700">CPU · 압축 가능</text>
  <text x="44" y="324" fill="#10243a" font-size="10">스로틀 · 죽지 않습니다</text>

  <rect x="466" y="282" width="410" height="60" fill="#f2d4d4"/>
  <text x="486" y="304" fill="#7a1f1f" font-size="11" font-weight="700">메모리 · 압축 불가</text>
  <text x="486" y="324" fill="#7a1f1f" font-size="10">죽습니다 · 회수 불가</text>

  <!-- recommendation -->
  <rect x="24" y="352" width="852" height="34" fill="rgb(212,168,83)"/>
  <text x="44" y="374" fill="#0d0d0d" font-size="10" font-weight="700">메모리는 같게 · CPU 는 하한만</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="r" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#f44336"/>
    </marker>
    <marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
  </defs>
</svg>

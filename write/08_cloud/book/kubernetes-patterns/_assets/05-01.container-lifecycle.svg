<svg viewBox="0 0 900 500" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>컨테이너 생애주기 — postStart·SIGTERM·30초 유예·SIGKILL과 preStop</title>
  <desc>Kubernetes Patterns 5장. 컨테이너가 만들어지면 postStart 훅이 주 프로세스와 비동기로 돌고, postStart가 끝날 때까지 컨테이너는 Waiting·Pod는 Pending입니다. 종료 시에는 preStop 훅이 먼저 블로킹으로 돌고, 그다음 SIGTERM으로 graceful shutdown을 요청합니다. 기본 30초(terminationGracePeriodSeconds) 안에 안 내려가면 SIGKILL로 강제 종료합니다. 생애주기 훅은 컨테이너 단위, init 컨테이너는 Pod 단위로 동작하며 순차 실행됩니다.</desc>

  <rect x="0" y="0" width="900" height="500" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16">컨테이너 생애주기 — 플랫폼이 보내는 이벤트에 앱이 반응한다</text>
  <text x="24" y="57" fill="rgb(138,133,128)" font-size="11">앱은 자기 생애주기를 통제하지 못합니다. <tspan fill="#e8e4df">플랫폼이 이벤트를 보내면</tspan> 좋은 시민은 <tspan fill="rgb(212,168,83)">거기에 반응</tspan>해야 합니다.</text>

  <!-- timeline -->
  <line x1="40" y1="150" x2="860" y2="150" stroke="rgb(138,133,128)" stroke-width="1.5"/>
  <text x="40" y="90" fill="#e8e4df" font-size="12" font-weight="700">기동</text>
  <text x="820" y="90" fill="#e8e4df" font-size="12" font-weight="700" text-anchor="end">종료</text>

  <!-- create -->
  <circle cx="90" cy="150" r="5" fill="rgb(212,168,83)"/>
  <text x="90" y="176" fill="#e8e4df" font-size="9.5" text-anchor="middle">컨테이너 생성</text>
  <!-- postStart -->
  <rect x="130" y="108" width="180" height="34" fill="#cdeccf"/>
  <text x="220" y="130" fill="#14521d" font-size="10.5" text-anchor="middle" font-weight="700">postStart 훅 (비동기)</text>
  <text x="220" y="200" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">블로킹 — 끝날 때까지</text>
  <text x="220" y="213" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">컨테이너 Waiting·Pod Pending</text>
  <text x="220" y="226" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">nonzero exit → 주 프로세스 kill</text>

  <!-- running -->
  <rect x="330" y="134" width="200" height="32" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="430" y="154" fill="rgb(212,168,83)" font-size="11" text-anchor="middle" font-weight="700">Running (주 프로세스)</text>

  <!-- preStop -->
  <rect x="548" y="108" width="150" height="34" fill="#dceaf7"/>
  <text x="623" y="130" fill="#10243a" font-size="10" text-anchor="middle" font-weight="700">preStop 훅 (블로킹)</text>
  <circle cx="548" cy="150" r="4" fill="#dceaf7"/>
  <text x="623" y="200" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">삭제 호출 전 먼저 완료.</text>
  <text x="623" y="213" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">SIGTERM 반응이 불가할 때의</text>
  <text x="623" y="226" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">graceful shutdown 대안.</text>

  <!-- SIGTERM -->
  <line x1="720" y1="120" x2="720" y2="150" stroke="rgb(212,168,83)"/>
  <text x="720" y="114" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="700">SIGTERM</text>
  <circle cx="720" cy="150" r="5" fill="rgb(212,168,83)"/>
  <!-- grace -->
  <rect x="720" y="140" width="110" height="20" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="775" y="154" fill="#e8e4df" font-size="8.5" text-anchor="middle">기본 30초 유예</text>
  <!-- SIGKILL -->
  <line x1="830" y1="120" x2="830" y2="150" stroke="#e57373"/>
  <text x="830" y="114" fill="#e57373" font-size="10" text-anchor="middle" font-weight="700">SIGKILL</text>
  <circle cx="830" cy="150" r="5" fill="#e57373"/>

  <text x="720" y="246" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">terminationGracePeriodSeconds</text>
  <text x="720" y="259" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">안에 안 내려가면 강제 종료</text>

  <!-- hooks vs init containers -->
  <line x1="24" y1="288" x2="876" y2="288" stroke="rgb(42,37,32)"/>
  <text x="24" y="312" fill="#e8e4df" font-size="12">생애주기 훅 vs init 컨테이너 — 다른 granularity (Table 5-1)</text>
  <rect x="24" y="324" width="415" height="150" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="40" y="346" fill="rgb(212,168,83)" font-size="11.5" font-weight="700">생애주기 훅 (컨테이너 단위)</text>
  <text x="40" y="368" fill="rgb(138,133,128)" font-size="9.5">· 컨테이너 생애주기 단계에 발동</text>
  <text x="40" y="386" fill="rgb(138,133,128)" font-size="9.5">· postStart(기동) / preStop(종료)</text>
  <text x="40" y="404" fill="rgb(138,133,128)" font-size="9.5">· postStart는 ENTRYPOINT와 동시</text>
  <text x="40" y="422" fill="rgb(138,133,128)" font-size="9.5">· 컨테이너별 비핵심 정리 작업</text>
  <text x="40" y="446" fill="rgb(138,133,128)" font-size="9">핸들러: exec · httpGet (at-least-once)</text>
  <text x="40" y="463" fill="rgb(138,133,128)" font-size="9">HTTP 실패는 재시도 안 함 — 중복 대비 필요</text>

  <rect x="461" y="324" width="415" height="150" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="477" y="346" fill="#66bb6a" font-size="11.5" font-weight="700">init 컨테이너 (Pod 단위)</text>
  <text x="477" y="368" fill="rgb(138,133,128)" font-size="9.5">· Pod 생애주기 단계에 발동</text>
  <text x="477" y="386" fill="rgb(138,133,128)" font-size="9.5">· 기동만 (종료 대응 없음)</text>
  <text x="477" y="404" fill="rgb(138,133,128)" font-size="9.5">· 순차 실행, 완료까지 실행</text>
  <text x="477" y="422" fill="rgb(138,133,128)" font-size="9.5">· 앱 컨테이너보다 먼저 전부 완료</text>
  <text x="477" y="446" fill="rgb(138,133,128)" font-size="9">워크플로우형 순차 작업 (15장 Init Container)</text>
  <text x="477" y="463" fill="rgb(138,133,128)" font-size="9">더 강한 제어엔 entrypoint 재작성(Commandlet)</text>
</svg>

<svg viewBox="0 0 900 640" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>로컬 프리미티브(JVM) ↔ 분산 프리미티브(Kubernetes) 대응 — Table 1-1</title>
  <desc>Kubernetes Patterns 1장 Table 1-1. 왼쪽은 JVM이 프로세스 안에서 제공하는 로컬 빌딩 블록(class·object·jar·생성자·스레드 풀 등), 오른쪽은 Kubernetes가 노드와 프로세스에 걸쳐 제공하는 분산 프리미티브(컨테이너 이미지·Pod·Init container·Job 등)입니다. 둘은 추상화 수준이 달라 직접 치환되지는 않지만, CronJob이 ScheduledExecutorService를 완전히 대체하듯 일부는 서로를 대신합니다.</desc>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16">개발 개념을 두 세계가 어떻게 실현하는가 — Table 1-1</text>
  <text x="24" y="57" fill="rgb(138,133,128)" font-size="11">같은 개발 관심사를 <tspan fill="#e8e4df">JVM은 프로세스 안 로컬 빌딩 블록</tspan>으로, <tspan fill="rgb(212,168,83)">Kubernetes는 노드에 걸친 분산 프리미티브</tspan>로 실현합니다.</text>

  <!-- column headers -->
  <rect x="250" y="76" width="300" height="30" fill="#dceaf7"/>
  <text x="400" y="96" fill="#10243a" font-size="12" text-anchor="middle" font-weight="700">로컬 프리미티브 (JVM / Java)</text>
  <rect x="580" y="76" width="300" height="30" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="730" y="96" fill="rgb(212,168,83)" font-size="12" text-anchor="middle" font-weight="700">분산 프리미티브 (Kubernetes)</text>

  <!-- rows: concept | local | distributed -->
  <!-- helper geometry: concept x=24..244, local 250..550, dist 580..880, row h=34 starting y=116 -->
  <g font-size="10.5">
    <!-- row 1 -->
    <text x="24" y="138" fill="rgb(138,133,128)">동작 캡슐화</text>
    <text x="260" y="138" fill="#e8e4df">Class</text>
    <text x="590" y="138" fill="#e8e4df">Container image</text>
    <line x1="250" y1="150" x2="880" y2="150" stroke="rgb(42,37,32)"/>
    <!-- row 2 -->
    <text x="24" y="172" fill="rgb(138,133,128)">동작 인스턴스</text>
    <text x="260" y="172" fill="#e8e4df">Object</text>
    <text x="590" y="172" fill="#e8e4df">Container</text>
    <line x1="250" y1="184" x2="880" y2="184" stroke="rgb(42,37,32)"/>
    <!-- row 3 -->
    <text x="24" y="206" fill="rgb(138,133,128)">재사용 단위</text>
    <text x="260" y="206" fill="#e8e4df">.jar</text>
    <text x="590" y="206" fill="#e8e4df">Container image</text>
    <line x1="250" y1="218" x2="880" y2="218" stroke="rgb(42,37,32)"/>
    <!-- row 4 -->
    <text x="24" y="240" fill="rgb(138,133,128)">합성(composition)</text>
    <text x="260" y="240" fill="#e8e4df">Class A가 Class B 포함</text>
    <text x="590" y="240" fill="#e8e4df">Sidecar 패턴</text>
    <line x1="250" y1="252" x2="880" y2="252" stroke="rgb(42,37,32)"/>
    <!-- row 5 -->
    <text x="24" y="274" fill="rgb(138,133,128)">상속</text>
    <text x="260" y="274" fill="#e8e4df">Class A extends Class B</text>
    <text x="590" y="274" fill="#e8e4df">FROM 부모 이미지</text>
    <line x1="250" y1="286" x2="880" y2="286" stroke="rgb(42,37,32)"/>
    <!-- row 6 -->
    <text x="24" y="308" fill="rgb(138,133,128)">배포 단위</text>
    <text x="260" y="308" fill="#e8e4df">.jar / .war / .ear</text>
    <text x="590" y="308" fill="#e8e4df">Pod</text>
    <line x1="250" y1="320" x2="880" y2="320" stroke="rgb(42,37,32)"/>
    <!-- row 7 -->
    <text x="24" y="342" fill="rgb(138,133,128)">빌드/런타임 격리</text>
    <text x="260" y="342" fill="#e8e4df">Module, package, class</text>
    <text x="590" y="342" fill="#e8e4df">Namespace, Pod, container</text>
    <line x1="250" y1="354" x2="880" y2="354" stroke="rgb(42,37,32)"/>
    <!-- row 8 -->
    <text x="24" y="376" fill="rgb(138,133,128)">초기화 선행조건</text>
    <text x="260" y="376" fill="#e8e4df">Constructor</text>
    <text x="590" y="376" fill="#e8e4df">Init container</text>
    <line x1="250" y1="388" x2="880" y2="388" stroke="rgb(42,37,32)"/>
    <!-- row 9 -->
    <text x="24" y="410" fill="rgb(138,133,128)">초기화 후 트리거</text>
    <text x="260" y="410" fill="#e8e4df">Init-method</text>
    <text x="590" y="410" fill="#e8e4df">postStart</text>
    <line x1="250" y1="422" x2="880" y2="422" stroke="rgb(42,37,32)"/>
    <!-- row 10 -->
    <text x="24" y="444" fill="rgb(138,133,128)">소멸 전 트리거</text>
    <text x="260" y="444" fill="#e8e4df">Destroy-method</text>
    <text x="590" y="444" fill="#e8e4df">preStop</text>
    <line x1="250" y1="456" x2="880" y2="456" stroke="rgb(42,37,32)"/>
    <!-- row 11 -->
    <text x="24" y="478" fill="rgb(138,133,128)">정리 절차</text>
    <text x="260" y="478" fill="#e8e4df">finalize(), shutdown hook</text>
    <text x="590" y="478" fill="rgb(138,133,128)">— (없음)</text>
    <line x1="250" y1="490" x2="880" y2="490" stroke="rgb(42,37,32)"/>
    <!-- row 12 -->
    <text x="24" y="512" fill="rgb(138,133,128)">비동기·병렬 실행</text>
    <text x="260" y="512" fill="#e8e4df">ThreadPoolExecutor</text>
    <text x="590" y="512" fill="#e8e4df">Job</text>
    <line x1="250" y1="524" x2="880" y2="524" stroke="rgb(42,37,32)"/>
    <!-- row 13 -->
    <text x="24" y="546" fill="rgb(138,133,128)">주기 작업</text>
    <text x="260" y="546" fill="#e8e4df">Timer, ScheduledExecutorService</text>
    <text x="590" y="546" fill="#e8e4df">CronJob</text>
    <line x1="250" y1="558" x2="880" y2="558" stroke="rgb(42,37,32)"/>
    <!-- row 14 -->
    <text x="24" y="580" fill="rgb(138,133,128)">백그라운드 작업</text>
    <text x="260" y="580" fill="#e8e4df">Daemon thread</text>
    <text x="590" y="580" fill="#e8e4df">DaemonSet</text>
  </g>

  <!-- bottom note -->
  <rect x="24" y="600" width="856" height="28" fill="#f5edda"/>
  <text x="36" y="618" fill="#0d0d0d" font-size="10" font-weight="700">둘은 추상화 수준이 달라 직접 치환되지 않습니다 — 단, CronJob은 ScheduledExecutorService를 완전히 대신할 수 있습니다.</text>
</svg>

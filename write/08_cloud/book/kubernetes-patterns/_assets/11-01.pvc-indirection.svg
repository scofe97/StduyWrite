<svg viewBox="0 0 880 330" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Pod와 PersistentVolume 사이에 PVC가 놓이는 간접 연결 구조</title>
  <desc>Pod는 PersistentVolume을 직접 참조할 수 없고 PersistentVolumeClaim을 통해 요청하고 바인딩합니다. 왼쪽은 개발자의 영역으로 Pod 정의가 persistentVolumeClaim 필드로 클레임을 참조합니다. 가운데 PVC가 요청을 담고, 오른쪽 클러스터 관리자 영역의 PV가 실제 durable storage를 가리킵니다. 이 간접 연결 덕분에 관심사가 분리되고 Pod 생애주기가 PV에서 분리되어, Pod가 삭제되어도 PV의 소유권은 PVC에 남아 계속 존재합니다. 아래쪽에는 ReplicaSet의 replica 셋이 모두 같은 PVC를 공유해 같은 PV에 붙는다는 점을 표시하며, 이것이 다음 장 StatefulSet과 갈리는 지점입니다.</desc>

  <rect width="880" height="330" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">PVC를 거치는 간접 연결</text>

  <!-- zone labels -->
  <text x="24" y="56" fill="#b8b3ad" font-size="10">개발자 영역</text>
  <text x="640" y="56" fill="#b8b3ad" font-size="10">클러스터 관리자 영역</text>

  <!-- Pod -->
  <rect x="24" y="66" width="220" height="72" fill="#cdeccf"/>
  <text x="134" y="92" text-anchor="middle" fill="#14521d" font-size="12" font-weight="700">Pod template</text>
  <rect x="44" y="102" width="180" height="24" fill="#e6f7e7"/>
  <text x="134" y="118" text-anchor="middle" fill="#14521d" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace">persistentVolumeClaim</text>

  <path d="M 248 102 L 316 102" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <text x="282" y="94" text-anchor="middle" fill="#b8b3ad" font-size="9">참조</text>

  <!-- PVC -->
  <rect x="320" y="66" width="220" height="72" fill="rgb(212,168,83)"/>
  <text x="430" y="92" text-anchor="middle" fill="#0d0d0d" font-size="12" font-weight="700">PVC</text>
  <rect x="340" y="102" width="180" height="24" fill="#fdf3df"/>
  <text x="430" y="118" text-anchor="middle" fill="#0d0d0d" font-size="9" font-weight="700" font-family="'JetBrains Mono', monospace">accessModes · 1Gi</text>

  <path d="M 544 102 L 612 102" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <text x="578" y="94" text-anchor="middle" fill="#b8b3ad" font-size="9">바인딩</text>

  <!-- PV -->
  <rect x="616" y="66" width="240" height="72" fill="#dceaf7"/>
  <text x="736" y="92" text-anchor="middle" fill="#10243a" font-size="12" font-weight="700">PV</text>
  <rect x="636" y="102" width="200" height="24" fill="#f7fbff"/>
  <text x="736" y="118" text-anchor="middle" fill="#10243a" font-size="9" font-weight="700">실제 durable storage</text>

  <!-- benefit strip -->
  <rect x="24" y="156" width="832" height="46" fill="#f5edda"/>
  <text x="44" y="176" fill="#0d0d0d" font-size="11" font-weight="700">관심사 · 생애주기 분리</text>
  <text x="44" y="194" fill="#0d0d0d" font-size="10">Pod 삭제돼도 PV는 남습니다</text>

  <!-- shared PVC among replicas -->
  <line x1="24" y1="220" x2="856" y2="220" stroke="#2a2a2a" stroke-width="1"/>
  <text x="24" y="244" fill="#e8e4df" font-size="12" font-weight="700">replica가 PVC를 공유</text>

  <rect x="24" y="256" width="150" height="34" fill="#cdeccf"/>
  <text x="99" y="278" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">rg-x9k2</text>
  <rect x="190" y="256" width="150" height="34" fill="#cdeccf"/>
  <text x="265" y="278" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">rg-mq7f</text>
  <rect x="356" y="256" width="150" height="34" fill="#cdeccf"/>
  <text x="431" y="278" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700" font-family="'JetBrains Mono', monospace">rg-p2vt</text>

  <path d="M 99 294 L 240 312" stroke="#b8b3ad" stroke-width="1.5"/>
  <path d="M 265 294 L 265 312" stroke="#b8b3ad" stroke-width="1.5"/>
  <path d="M 431 294 L 290 312" stroke="#b8b3ad" stroke-width="1.5"/>

  <rect x="196" y="308" width="140" height="14" fill="rgb(212,168,83)"/>
  <text x="266" y="319" text-anchor="middle" fill="#0d0d0d" font-size="9" font-weight="700">같은 PVC 하나</text>

  <rect x="546" y="252" width="310" height="66" fill="#f2d4d4"/>
  <text x="566" y="274" fill="#7a1f1f" font-size="11" font-weight="700">StatefulSet과 갈리는 지점</text>
  <text x="566" y="293" fill="#7a1f1f" font-size="10">거기서는 replica마다 PVC가</text>
  <text x="566" y="309" fill="#7a1f1f" font-size="10">동적으로 따로 만들어집니다.</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Pod가 스케줄링과 배포의 원자 단위인 이유</title>
  <desc id="desc">노드 안의 하나의 Pod가 app과 sidecar 컨테이너를 함께 담고, 함께 스케줄, 배포, 스케일되는 경계를 표현한 그림</desc>
  <rect width="960" height="350" fill="#0d0d0d"/>
  <text x="48" y="54" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="26" font-weight="700">Pod는 컨테이너를 따로 배치하지 않습니다</text>
  <text x="48" y="82" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="15">스케줄러는 Pod 전체의 요구를 보고 한 노드에 배치합니다.</text>
  <rect x="48" y="116" width="540" height="188" rx="18" fill="#121211" stroke="#4a4640" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="74" y="148" fill="#8a8580" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="700">NODE</text>
  <rect x="104" y="166" width="428" height="110" rx="14" fill="#151817" stroke="#d4a853" stroke-width="2"/>
  <text x="128" y="194" fill="#d4a853" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="700">POD</text>
  <rect x="128" y="211" width="178" height="43" rx="8" fill="#25372a"/><text x="149" y="238" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="16">app container</text>
  <rect x="328" y="211" width="178" height="43" rx="8" fill="#24211b"/><text x="347" y="238" fill="#e8e4df" font-family="Pretendard, Arial, sans-serif" font-size="16">sidecar</text>
  <path d="M604 210H668" stroke="#d4a853" stroke-width="3"/><path d="M668 210l-10-6v12z" fill="#d4a853"/>
  <g font-family="Pretendard, Arial, sans-serif"><rect x="690" y="132" width="222" height="52" rx="10" fill="#171614"/><text x="714" y="165" fill="#e8e4df" font-size="17">함께 스케줄</text><rect x="690" y="198" width="222" height="52" rx="10" fill="#171614"/><text x="714" y="231" fill="#e8e4df" font-size="17">함께 배포·종료</text><rect x="690" y="264" width="222" height="52" rx="10" fill="#171614"/><text x="714" y="297" fill="#e8e4df" font-size="17">함께 스케일</text></g>
</svg>

<svg viewBox="0 0 900 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>배포·릴리스 전략 4종 — 전환 중 인스턴스 수와 자동화 경계</title>
  <desc>Kubernetes Patterns 3장. Deployment가 제공하는 두 배포 전략(Rolling·Recreate)은 낡은 컨테이너를 새 것으로 교체하는 방식을 다루고, 상위 릴리스 전략(Blue-Green·Canary)은 새 버전이 소비자에게 노출되는 방식을 다룹니다. 앞 둘은 Kubernetes가 완전 자동화하지만, 뒤 둘은 전환 트리거에 사람의 판단이 들어가 완전 자동은 아닙니다. Recreate는 다운타임이 있지만 두 버전이 동시에 안 돌고, Rolling은 무중단이지만 전환 중 두 버전이 공존합니다. Blue-Green은 두 배 용량이 필요하고, Canary는 일부 소비자에게만 새 버전을 노출합니다.</desc>

  <rect x="0" y="0" width="900" height="560" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16">배포·릴리스 전략 4종 — 전환 중 무엇이 도는가</text>
  <text x="24" y="57" fill="rgb(138,133,128)" font-size="11"><tspan fill="rgb(212,168,83)">배포 전략(Rolling·Recreate)</tspan>은 컨테이너 교체 방식, <tspan fill="#dceaf7" font-weight="700">릴리스 전략(Blue-Green·Canary)</tspan>은 새 버전 노출 방식.</text>

  <!-- automation boundary labels -->
  <rect x="24" y="74" width="424" height="24" fill="#cdeccf"/>
  <text x="236" y="91" fill="#14521d" font-size="11" text-anchor="middle" font-weight="700">Deployment가 완전 자동화</text>
  <rect x="452" y="74" width="424" height="24" fill="#f5edda"/>
  <text x="664" y="91" fill="#0d0d0d" font-size="11" text-anchor="middle" font-weight="700">사람의 전환 판단 필요 (완전 자동 아님)</text>

  <!-- Recreate -->
  <rect x="24" y="108" width="205" height="180" fill="rgb(26,26,26)" stroke="#e57373"/>
  <text x="40" y="130" fill="#e57373" font-size="13" font-weight="700">Recreate</text>
  <text x="40" y="152" fill="#e8e4df" font-size="9.5">낡은 것 전부 죽인 뒤</text>
  <text x="40" y="167" fill="#e8e4df" font-size="9.5">새것 전부 시작.</text>
  <rect x="40" y="180" width="173" height="22" fill="#f2d4d4"/>
  <text x="126" y="195" fill="#7a1f1f" font-size="9" text-anchor="middle" font-weight="700">다운타임 발생</text>
  <text x="40" y="222" fill="rgb(138,133,128)" font-size="9">✓ 두 버전 동시 실행 안 함</text>
  <text x="40" y="240" fill="rgb(138,133,128)" font-size="9">✗ 전환 중 서비스 중단</text>
  <text x="40" y="264" fill="rgb(138,133,128)" font-size="8.5">maxUnavailable = replicas</text>
  <text x="40" y="279" fill="rgb(138,133,128)" font-size="8.5">호환 불가 API 변경에 유용</text>

  <!-- Rolling -->
  <rect x="243" y="108" width="205" height="180" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="259" y="130" fill="rgb(212,168,83)" font-size="13" font-weight="700">RollingUpdate</text>
  <text x="259" y="146" fill="rgb(138,133,128)" font-size="8.5">(기본값)</text>
  <text x="259" y="167" fill="#e8e4df" font-size="9.5">조금씩 교체.</text>
  <rect x="259" y="180" width="173" height="22" fill="#cdeccf"/>
  <text x="345" y="195" fill="#14521d" font-size="9" text-anchor="middle" font-weight="700">무중단 (zero downtime)</text>
  <text x="259" y="222" fill="rgb(138,133,128)" font-size="9">✓ 서비스 안 끊김</text>
  <text x="259" y="240" fill="rgb(138,133,128)" font-size="9">✗ 전환 중 두 버전 공존</text>
  <text x="259" y="264" fill="rgb(138,133,128)" font-size="8.5">maxSurge·maxUnavailable (기본 25%)</text>
  <text x="259" y="279" fill="rgb(138,133,128)" font-size="8.5">minReadySeconds·readinessProbe 필수</text>

  <!-- Blue-Green -->
  <rect x="452" y="108" width="205" height="180" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="468" y="130" fill="#dceaf7" font-size="13" font-weight="700">Blue-Green</text>
  <text x="468" y="152" fill="#e8e4df" font-size="9.5">green 따로 띄워 두고,</text>
  <text x="468" y="167" fill="#e8e4df" font-size="9.5">Service selector를</text>
  <text x="468" y="182" fill="#e8e4df" font-size="9.5">blue→green으로 전환.</text>
  <rect x="468" y="194" width="173" height="22" fill="#f5edda"/>
  <text x="554" y="209" fill="#0d0d0d" font-size="9" text-anchor="middle" font-weight="700">용량 2배 필요</text>
  <text x="468" y="234" fill="rgb(138,133,128)" font-size="9">✓ 한 번에 한 버전만 노출</text>
  <text x="468" y="252" fill="rgb(138,133,128)" font-size="9">✗ 두 배 자원·DB 상태 드리프트</text>
  <text x="468" y="276" fill="rgb(138,133,128)" font-size="8.5">mesh·Knative 없으면 수동</text>

  <!-- Canary -->
  <rect x="671" y="108" width="205" height="180" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="687" y="130" fill="#dceaf7" font-size="13" font-weight="700">Canary</text>
  <text x="687" y="152" fill="#e8e4df" font-size="9.5">일부 인스턴스만 새 버전.</text>
  <text x="687" y="167" fill="#e8e4df" font-size="9.5">소수 소비자에게만 노출,</text>
  <text x="687" y="182" fill="#e8e4df" font-size="9.5">괜찮으면 전량 확대.</text>
  <rect x="687" y="194" width="173" height="22" fill="#dceaf7"/>
  <text x="773" y="209" fill="#10243a" font-size="9" text-anchor="middle" font-weight="700">위험 최소 노출</text>
  <text x="687" y="234" fill="rgb(138,133,128)" font-size="9">✓ 신버전 위험을 소수로 제한</text>
  <text x="687" y="252" fill="rgb(138,133,128)" font-size="9">→ 확인 후 신 ReplicaSet ↑</text>
  <text x="687" y="270" fill="rgb(138,133,128)" font-size="9">   구 ReplicaSet 0으로 ↓</text>

  <!-- higher-level tools -->
  <line x1="24" y1="308" x2="876" y2="308" stroke="rgb(42,37,32)"/>
  <text x="24" y="332" fill="#e8e4df" font-size="12">상위 도구 — Blue-Green·Canary를 선언적·자동으로 (Operator 패턴 기반)</text>
  <rect x="24" y="344" width="275" height="70" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="40" y="366" fill="rgb(212,168,83)" font-size="11" font-weight="700">Flagger</text>
  <text x="40" y="386" fill="rgb(138,133,128)" font-size="9">Flux CD(GitOps)의 일부. canary·B-G,</text>
  <text x="40" y="402" fill="rgb(138,133,128)" font-size="9">메트릭 기반 자동 롤백.</text>
  <rect x="311" y="344" width="275" height="70" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="327" y="366" fill="rgb(212,168,83)" font-size="11" font-weight="700">Argo Rollouts</text>
  <text x="327" y="386" fill="rgb(138,133,128)" font-size="9">Argo 계열 CD. Flagger와 유사.</text>
  <text x="327" y="402" fill="rgb(138,133,128)" font-size="9">Argo냐 Flux냐로 선택.</text>
  <rect x="598" y="344" width="278" height="70" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="614" y="366" fill="rgb(212,168,83)" font-size="11" font-weight="700">Knative</text>
  <text x="614" y="386" fill="rgb(138,133,128)" font-size="9">서버리스 플랫폼. 트래픽 분할·</text>
  <text x="614" y="402" fill="rgb(138,133,128)" font-size="9">트래픽 기반 오토스케일(29장).</text>

  <!-- bottom rule -->
  <rect x="24" y="428" width="852" height="26" fill="#f5edda"/>
  <text x="36" y="446" fill="#0d0d0d" font-size="10" font-weight="700">Deployment는 Rolling·Recreate만 직접 지원. Blue-Green·Canary는 다른 프리미티브를 조합하거나 상위 도구가 필요.</text>

  <text x="24" y="482" fill="rgb(138,133,128)" font-size="10">전제: 컨테이너가 SIGTERM을 존중(5장 Managed Lifecycle)하고 health 엔드포인트를 제공(4장 Health Probe)해야</text>
  <text x="24" y="500" fill="rgb(138,133,128)" font-size="10">Deployment가 낡은 Pod를 깔끔히 내리고 새 Pod로 교체할 수 있습니다.</text>
  <text x="24" y="524" fill="rgb(138,133,128)" font-size="10">kubectl rollout: status·pause·resume·undo(롤백)·history·restart — 서버 사이드 선언적 업데이트 관리.</text>
</svg>

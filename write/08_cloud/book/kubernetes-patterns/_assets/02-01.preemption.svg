<title id="dt">자리가 없으면 낮은 Pod 를 내보내고 들어갑니다</title><desc id="dd">priority 1000 새 Pod 가 필터에 모두 떨어지면 kube-scheduler 가 노드 하나에서 priority 0 Pod 를 골라 API 서버를 통해 종료시키고, 새 Pod 에 nominatedNodeName 을 적은 뒤 자리가 나면 바인드합니다.</desc>
<rect width="1000" height="684" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES PATTERNS · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">자리가 없으면 낮은 Pod 를 내보내고 들어갑니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">PodDisruptionBudget 은 최선 노력으로만 존중되며 선점을 막지 못합니다</text>

<svg viewBox="0 0 900 460" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>DaemonSet vs ReplicaSet — 무엇이 개수를 정하는가</title>
  <desc>Kubernetes Patterns 9장. ReplicaSet은 사용자 부하·가용성 요구가 Pod 개수를 정하며 노드 수와 무관합니다. DaemonSet은 부하가 아니라 노드가 개수를 정해, 모든 노드(또는 특정 노드)에 하나씩 Pod를 둡니다. DaemonSet Pod는 nodeName이 이미 지정돼 스케줄러 없이도 뜰 수 있고(v1.17+는 nodeAffinity 사용), 로그 수집·메트릭 익스포터·스토리지 같은 인프라 프로세스에 씁니다. 대안인 static Pod는 kubelet만 관리하지만 API로 관리할 수 없어 DaemonSet이 권장됩니다.</desc>

  <rect x="0" y="0" width="900" height="460" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16">DaemonSet vs ReplicaSet — 무엇이 Pod 개수를 정하는가</text>
  <text x="24" y="57" fill="rgb(138,133,128)" font-size="11">둘 다 "정해진 수의 Pod가 늘 돌게" 보장하지만, 그 <tspan fill="rgb(212,168,83)">'정해진 수'를 정하는 주체</tspan>가 다릅니다.</text>

  <!-- ReplicaSet -->
  <rect x="24" y="80" width="415" height="150" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="40" y="104" fill="#e8e4df" font-size="13" font-weight="700">ReplicaSet</text>
  <text x="40" y="126" fill="rgb(138,133,128)" font-size="9.5">개수를 정하는 것 = <tspan fill="#e8e4df">사용자 부하·가용성 요구</tspan></text>
  <text x="40" y="144" fill="rgb(138,133,128)" font-size="9.5">노드 수와 무관.</text>
  <rect x="40" y="158" width="383" height="24" fill="#dceaf7"/>
  <text x="231" y="174" fill="#10243a" font-size="9.5" text-anchor="middle" font-weight="700">"replica 3개" — 노드가 2대든 10대든 3개</text>
  <text x="40" y="202" fill="rgb(138,133,128)" font-size="9">웹 서버처럼 계속 도는 프로세스용.</text>
  <text x="40" y="220" fill="rgb(138,133,128)" font-size="9">스케줄러가 적절한 노드를 찾아 배치.</text>

  <!-- DaemonSet -->
  <rect x="461" y="80" width="415" height="150" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="477" y="104" fill="rgb(212,168,83)" font-size="13" font-weight="700">DaemonSet</text>
  <text x="477" y="126" fill="rgb(138,133,128)" font-size="9.5">개수를 정하는 것 = <tspan fill="#e8e4df">노드</tspan></text>
  <text x="477" y="144" fill="rgb(138,133,128)" font-size="9.5">모든 노드(또는 특정 노드)에 하나씩.</text>
  <rect x="477" y="158" width="383" height="24" fill="#f5edda"/>
  <text x="668" y="174" fill="#0d0d0d" font-size="9.5" text-anchor="middle" font-weight="700">"노드마다 1개" — 노드 3대면 3개, 10대면 10개</text>
  <text x="477" y="202" fill="rgb(138,133,128)" font-size="9">로그 수집·메트릭 익스포터·스토리지·kube-proxy 등</text>
  <text x="477" y="220" fill="rgb(138,133,128)" font-size="9">인프라 프로세스용. nodeSelector로 노드 제한.</text>

  <!-- DaemonSet 특성 -->
  <line x1="24" y1="248" x2="876" y2="248" stroke="rgb(42,37,32)"/>
  <text x="24" y="272" fill="#e8e4df" font-size="12">DaemonSet만의 특성</text>
  <text x="40" y="294" fill="rgb(138,133,128)" font-size="9.5">· Pod에 <tspan fill="#e8e4df">nodeName이 이미 지정</tspan> → 스케줄러 없이도 뜸. 다른 Pod보다 먼저, 스케줄러 시작 전에도 실행 가능.</text>
  <text x="40" y="313" fill="rgb(138,133,128)" font-size="9.5">· 스케줄러를 안 쓰니 노드의 <tspan fill="#e8e4df">unschedulable</tspan> 필드 무시. (그래서 K8s 컴포넌트 실행에도 씀)</text>
  <text x="40" y="332" fill="rgb(138,133,128)" font-size="9.5">· restartPolicy는 <tspan fill="#e8e4df">Always만</tspan>(미지정 시 기본 Always). 여러 컨트롤러가 더 높은 우선순위로 취급(descheduler 축출 회피 등).</text>
  <text x="40" y="351" fill="rgb(138,133,128)" font-size="9.5">· <tspan fill="rgb(212,168,83)">v1.17+</tspan>: nodeName 대신 <tspan fill="#e8e4df">nodeAffinity</tspan> 사용 → 기본 스케줄러가 필수 의존이 되지만, taint·toleration·우선순위·preemption을 얻음.</text>

  <!-- static pods + reach -->
  <text x="24" y="380" fill="#e8e4df" font-size="11">daemon Pod에 닿는 법 · 대안</text>
  <text x="40" y="400" fill="rgb(138,133,128)" font-size="9">· 닿기: Service(랜덤 노드 LB) · headless Service(모든 Pod IP의 A레코드) · node IP + hostPort · 또는 Pod가 외부로 push.</text>
  <rect x="24" y="410" width="852" height="38" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="40" y="428" fill="rgb(138,133,128)" font-size="9">· <tspan fill="#e8e4df">static Pod</tspan> — kubelet이 로컬 디렉토리에서 정의를 읽어 관리. API 서버가 관찰 안 함, 헬스체크 없음. kubelet이 크래시 시 재시작.</text>
  <text x="40" y="442" fill="rgb(138,133,128)" font-size="9">  API로 관리 못 하니, 플랫폼과 잘 통합되는 <tspan fill="rgb(212,168,83)">DaemonSet이 static Pod보다 권장</tspan>.</text>
</svg>

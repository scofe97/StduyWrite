<title id="dt">Lease 하나를 두고 pod 셋이 겨룹니다</title><desc id="dd">pod-1 이 Lease my-app-leader 를 만들고 renewTime 을 갱신하다가 멈춥니다. leaseDurationSeconds 가 지나면 pod-2 와 pod-3 이 같은 resourceVersion 으로 holderIdentity 를 바꾸려 하고, API 서버는 먼저 도착한 pod-2 의 update 만 받고 pod-3 에는 409 Conflict 를 돌려줍니다.</desc>

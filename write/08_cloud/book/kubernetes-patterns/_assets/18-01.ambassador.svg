<svg viewBox="0 0 900 380" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>앱은 그대로 두고 앰배서더만 갈아 끼웁니다</title>
  <desc>책의 Figure 18-1과 18-2를 나란히 놓고 비교합니다. 위쪽은 운영 환경입니다. 메인 앱이 localhost의 고정 포트로 요청을 보내면 앰배서더가 그것을 받아 etcd 같은 완전 분산 원격 저장소로 중계합니다. 여러 샤드에 연결하는 복잡한 클라이언트 설정은 전부 앰배서더 안에 들어 있습니다. 아래쪽은 개발 환경입니다. 메인 앱은 위와 완전히 똑같은 컨테이너이고 보내는 주소도 똑같은 localhost 고정 포트입니다. 그런데 앰배서더만 memcached 같은 로컬 인메모리 저장소로 바뀌어 있습니다. 가운데 강조된 부분이 이 그림의 핵심으로 메인 앱 컨테이너와 그것이 부르는 주소는 두 환경에서 한 글자도 다르지 않습니다. 달라지는 것은 앰배서더 컨테이너 하나뿐이며 Pod 정의에서 그것만 교체하면 됩니다. 그래서 환경별 차이가 앱 코드나 앱 이미지에 전혀 스며들지 않습니다.</desc>

  <rect width="900" height="380" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">앱은 같고 뒤만 바뀝니다</text>

  <!-- ===== production ===== -->
  <text x="24" y="66" fill="rgb(212,168,83)" font-size="11" font-weight="700">운영</text>

  <rect x="96" y="76" width="490" height="66" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-dasharray="5 4"/>
  <text x="110" y="94" fill="rgb(212,168,83)" font-size="9" font-weight="700">Pod</text>

  <rect x="118" y="94" width="176" height="40" fill="#cdeccf"/>
  <text x="206" y="119" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">main · 그대로</text>

  <path d="M 298 114 L 332 114" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>
  <text x="315" y="106" text-anchor="middle" fill="#66bb6a" font-size="8" font-weight="700">localhost</text>

  <rect x="336" y="94" width="230" height="40" fill="#dceaf7"/>
  <text x="451" y="119" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">ambassador · 샤드 연결</text>

  <path d="M 590 114 L 624 114" stroke="#5b9bd5" stroke-width="2" marker-end="url(#bm)"/>

  <rect x="628" y="94" width="248" height="40" fill="#0d0d0d" stroke="#dceaf7"/>
  <text x="752" y="112" text-anchor="middle" fill="#dceaf7" font-size="10" font-weight="700">etcd</text>
  <text x="752" y="127" text-anchor="middle" fill="#dceaf7" font-size="9">분산 원격 저장소</text>

  <!-- ===== development ===== -->
  <text x="24" y="196" fill="rgb(212,168,83)" font-size="11" font-weight="700">개발</text>

  <rect x="96" y="206" width="490" height="66" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-dasharray="5 4"/>
  <text x="110" y="224" fill="rgb(212,168,83)" font-size="9" font-weight="700">Pod</text>

  <rect x="118" y="224" width="176" height="40" fill="#cdeccf"/>
  <text x="206" y="249" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">main · 그대로</text>

  <path d="M 298 244 L 332 244" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>
  <text x="315" y="236" text-anchor="middle" fill="#66bb6a" font-size="8" font-weight="700">localhost</text>

  <rect x="336" y="224" width="230" height="40" fill="#f5edda"/>
  <text x="451" y="249" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">ambassador · 인메모리</text>

  <path d="M 590 244 L 624 244" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <rect x="628" y="224" width="248" height="40" fill="#0d0d0d" stroke="#f5edda"/>
  <text x="752" y="242" text-anchor="middle" fill="#f5edda" font-size="10" font-weight="700">memcached</text>
  <text x="752" y="257" text-anchor="middle" fill="#f5edda" font-size="9">로컬 캐시</text>

  <!-- what changes -->
  <line x1="206" y1="142" x2="206" y2="218" stroke="#66bb6a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="118" y="186" fill="#66bb6a" font-size="9" font-weight="700">같습니다</text>

  <line x1="451" y1="142" x2="451" y2="218" stroke="#f44336" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="466" y="186" fill="#f44336" font-size="9" font-weight="700">여기만 바뀝니다</text>

  <line x1="24" y1="292" x2="876" y2="292" stroke="#4a4640"/>

  <rect x="24" y="304" width="418" height="30" fill="#cdeccf"/>
  <text x="44" y="324" fill="#14521d" font-size="10" font-weight="700">앱 이미지도 주소도 그대로</text>

  <rect x="458" y="304" width="418" height="30" fill="#f2d4d4"/>
  <text x="478" y="324" fill="#7a1f1f" font-size="10" font-weight="700">Pod 정의에서 한 줄만 교체</text>

  <rect x="24" y="342" width="852" height="26" fill="rgb(212,168,83)"/>
  <text x="450" y="360" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">환경 차이가 앱에 안 스밉니다</text>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="bm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#5b9bd5"/>
    </marker>
    <marker id="gm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
  </defs>
</svg>

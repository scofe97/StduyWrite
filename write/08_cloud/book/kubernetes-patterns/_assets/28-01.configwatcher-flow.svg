<svg viewBox="0 0 880 476" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>ConfigWatcher Operator의 조정 흐름과 27장 대비 결합 해소</title>
  <desc>위쪽은 27장의 어노테이션 방식입니다. ConfigMap 자체에 podDeleteSelector 어노테이션을 넣어야 하므로 ConfigMap이 Pod를 알아야 하고, 하나의 ConfigMap을 하나의 애플리케이션에만 연결할 수 있습니다. 아래쪽은 28장의 CRD 방식입니다. ConfigWatcher 커스텀 리소스가 감시할 ConfigMap 이름과 재시작할 Pod의 label selector를 따로 들고 있어 ConfigMap을 수정할 필요가 없습니다. Operator는 ConfigMap 변경 스트림을 watch 하다가 MODIFIED 이벤트를 받으면 설치된 ConfigWatcher 목록을 조회하고, 그중 해당 ConfigMap을 참조하는 것만 골라 그 podSelector에 맞는 Pod를 삭제합니다. 삭제된 Pod는 상위 Deployment가 재생성하면서 바뀐 설정을 읽어 갑니다.</desc>

  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="cg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#66bb6a"/>
    </marker>
    <marker id="cr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f44336"/>
    </marker>
  </defs>

  <rect width="880" height="476" fill="#0d0d0d"/>

  <!-- 27장 방식 -->
  <text x="24" y="30" fill="#e8e4df" font-size="13">27장 — 어노테이션 방식</text>
  <rect x="24" y="46" width="200" height="62" fill="#f2d4d4"/>
  <text x="124" y="70" text-anchor="middle" fill="#7a1f1f" font-size="10" font-weight="700">ConfigMap</text>
  <text x="124" y="88" text-anchor="middle" fill="#7a1f1f" font-size="9">podDeleteSelector</text>
  <text x="124" y="102" text-anchor="middle" fill="#7a1f1f" font-size="9">어노테이션 삽입 필요</text>

  <rect x="324" y="46" width="180" height="62" fill="#f2d4d4"/>
  <text x="414" y="76" text-anchor="middle" fill="#7a1f1f" font-size="10" font-weight="700">앱 하나에 고정</text>
  <text x="414" y="94" text-anchor="middle" fill="#7a1f1f" font-size="9">조합 불가</text>

  <line x1="224" y1="77" x2="318" y2="77" stroke="#f44336" stroke-width="2" marker-end="url(#cr)"/>
  <text x="271" y="69" text-anchor="middle" fill="#f44336" font-size="9">결합</text>

  <line x1="24" y1="130" x2="856" y2="130" stroke="#b8b3ad" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 28장 방식 -->
  <text x="24" y="158" fill="#e8e4df" font-size="13">28장 — CRD 방식</text>

  <!-- configmap clean -->
  <rect x="24" y="182" width="170" height="66" fill="#dceaf7"/>
  <text x="109" y="206" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">ConfigMap</text>
  <text x="109" y="224" text-anchor="middle" fill="#10243a" font-size="9">webapp-config</text>
  <text x="109" y="240" text-anchor="middle" fill="#10243a" font-size="9">수정 불필요</text>

  <!-- custom resource -->
  <rect x="24" y="292" width="170" height="82" fill="#f5edda"/>
  <text x="109" y="315" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">ConfigWatcher</text>
  <text x="109" y="333" text-anchor="middle" fill="#0d0d0d" font-size="9">configMap 참조</text>
  <text x="109" y="349" text-anchor="middle" fill="#0d0d0d" font-size="9">podSelector</text>
  <text x="109" y="365" text-anchor="middle" fill="#0d0d0d" font-size="9">커스텀 리소스</text>

  <!-- watch stream -->
  <rect x="264" y="182" width="180" height="66" fill="#cdeccf"/>
  <text x="354" y="206" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">watch 스트림</text>
  <text x="354" y="224" text-anchor="middle" fill="#14521d" font-size="9">watch=true</text>
  <text x="354" y="240" text-anchor="middle" fill="#14521d" font-size="9">1. MODIFIED 감지</text>

  <line x1="194" y1="215" x2="258" y2="215" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ca)"/>

  <!-- operator -->
  <rect x="514" y="182" width="190" height="82" fill="#cdeccf"/>
  <text x="609" y="206" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">Operator</text>
  <text x="609" y="224" text-anchor="middle" fill="#14521d" font-size="9">2. Watcher 목록 조회</text>
  <text x="609" y="240" text-anchor="middle" fill="#14521d" font-size="9">3. 참조하는 것만 선별</text>
  <text x="609" y="256" text-anchor="middle" fill="#14521d" font-size="9">4. selector 추출</text>

  <line x1="444" y1="215" x2="508" y2="215" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ca)"/>

  <!-- CR feeds operator -->
  <path d="M194 320 L470 320 L470 276 L560 276 L560 270" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ca)"/>
  <text x="300" y="312" fill="rgb(212,168,83)" font-size="9">조회 대상</text>

  <!-- pods -->
  <rect x="514" y="330" width="190" height="66" fill="#dceaf7"/>
  <text x="609" y="354" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">대상 Pod</text>
  <text x="609" y="372" text-anchor="middle" fill="#10243a" font-size="9">app: webapp</text>
  <text x="609" y="388" text-anchor="middle" fill="#10243a" font-size="9">5. 삭제</text>

  <line x1="609" y1="264" x2="609" y2="324" stroke="#66bb6a" stroke-width="2" marker-end="url(#cg)"/>

  <!-- deployment recreate -->
  <rect x="764" y="330" width="92" height="66" fill="#f5edda"/>
  <text x="810" y="354" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">Deployment</text>
  <text x="810" y="372" text-anchor="middle" fill="#0d0d0d" font-size="9">6. 재생성</text>
  <text x="810" y="388" text-anchor="middle" fill="#0d0d0d" font-size="9">새 설정 반영</text>

  <line x1="704" y1="363" x2="758" y2="363" stroke="#66bb6a" stroke-width="2" marker-end="url(#cg)"/>

  <!-- feedback to configmap: 아래로 크게 우회해 본선과 겹치지 않게 -->
  <path d="M810 396 L810 432 L240 432 L240 215 L258 215" fill="none" stroke="#66bb6a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#cg)"/>
  <text x="530" y="446" text-anchor="middle" fill="#66bb6a" font-size="9">7. 새 ConfigMap 값 로드</text>
</svg>

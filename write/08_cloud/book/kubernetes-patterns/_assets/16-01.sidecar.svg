<svg viewBox="0 0 900 400" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>트래픽이 사이드카를 거치느냐 앱이 사이드카를 부르느냐</title>
  <desc>사이드카를 쓰는 두 방식이 트래픽 경로에서 어떻게 갈리는지 비교합니다. 위쪽은 transparent 방식으로 Envoy 프록시가 대표적입니다. 바깥에서 들어오는 트래픽과 앱이 바깥으로 내보내는 트래픽이 모두 사이드카를 통과하도록 가로채집니다. 앱은 사이드카가 거기 있다는 사실조차 모르는 채로 TLS와 로드밸런싱과 자동 재시도와 서킷 브레이킹과 관측성을 얻습니다. 앱 코드를 건드리지 않고 직교하는 능력을 더한다는 점에서 관점 지향 프로그래밍과 닮았습니다. 아래쪽은 explicit 방식으로 Dapr가 대표적입니다. 트래픽을 가로채지 않고 사이드카가 HTTP와 gRPC API를 노출하면 앱이 그것을 명시적으로 호출하거나 구독합니다. 서비스 호출과 발행 구독과 상태 추상과 외부 시스템 바인딩 같은 기능을 이 방식으로 제공합니다. 두 방식의 결정적 차이는 앱이 사이드카의 존재를 아느냐입니다. transparent는 모르고 explicit은 알고 부릅니다.</desc>

  <rect width="900" height="400" fill="#0d0d0d"/>

  <text x="24" y="30" fill="#e8e4df" font-size="15" font-weight="700">앱이 아느냐 모르느냐</text>

  <!-- ============ transparent ============ -->
  <text x="24" y="64" fill="#5b9bd5" font-size="11" font-weight="700">transparent</text>
  <text x="24" y="80" fill="#b8b3ad" font-size="9">Envoy</text>

  <rect x="140" y="50" width="90" height="44" fill="#0d0d0d" stroke="#b8b3ad"/>
  <text x="185" y="77" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">바깥</text>

  <path d="M 234 72 L 268 72" stroke="#5b9bd5" stroke-width="2" marker-end="url(#bm)"/>

  <rect x="272" y="50" width="160" height="44" fill="#dceaf7"/>
  <text x="352" y="70" text-anchor="middle" fill="#10243a" font-size="10" font-weight="700">sidecar 가 가로챕니다</text>
  <text x="352" y="86" text-anchor="middle" fill="#10243a" font-size="9">TLS · 재시도 · 관측성</text>

  <path d="M 436 72 L 470 72" stroke="#5b9bd5" stroke-width="2" marker-end="url(#bm)"/>

  <rect x="474" y="50" width="150" height="44" fill="#cdeccf"/>
  <text x="549" y="77" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">app</text>

  <rect x="648" y="50" width="228" height="44" fill="#0d0d0d" stroke="#5b9bd5"/>
  <text x="762" y="70" text-anchor="middle" fill="#dceaf7" font-size="10" font-weight="700">앱은 모릅니다</text>
  <text x="762" y="86" text-anchor="middle" fill="#dceaf7" font-size="9">코드를 건드리지 않습니다</text>

  <text x="352" y="118" text-anchor="middle" fill="#b8b3ad" font-size="9">나가는 트래픽도 같은 길로 지납니다</text>

  <line x1="24" y1="146" x2="876" y2="146" stroke="#4a4640"/>

  <!-- ============ explicit ============ -->
  <text x="24" y="188" fill="#66bb6a" font-size="11" font-weight="700">explicit</text>
  <text x="24" y="204" fill="#b8b3ad" font-size="9">Dapr</text>

  <rect x="140" y="174" width="90" height="44" fill="#0d0d0d" stroke="#b8b3ad"/>
  <text x="185" y="201" text-anchor="middle" fill="#b8b3ad" font-size="10" font-weight="700">바깥</text>

  <path d="M 234 196 L 470 196" stroke="#b8b3ad" stroke-width="2" marker-end="url(#nm)"/>
  <text x="352" y="188" text-anchor="middle" fill="#b8b3ad" font-size="9">가로채지 않습니다</text>

  <rect x="474" y="174" width="150" height="44" fill="#cdeccf"/>
  <text x="549" y="201" text-anchor="middle" fill="#14521d" font-size="10" font-weight="700">app</text>

  <path d="M 549 222 L 549 250" stroke="#66bb6a" stroke-width="2" marker-end="url(#gm)"/>
  <text x="566" y="240" fill="#66bb6a" font-size="9" font-weight="700">앱이 부릅니다</text>

  <rect x="474" y="256" width="150" height="44" fill="#f5edda"/>
  <text x="549" y="276" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">sidecar API</text>
  <text x="549" y="292" text-anchor="middle" fill="#0d0d0d" font-size="9" font-family="'JetBrains Mono', monospace">HTTP gRPC</text>

  <rect x="648" y="256" width="228" height="44" fill="#0d0d0d" stroke="#f5edda"/>
  <text x="762" y="276" text-anchor="middle" fill="#f5edda" font-size="10" font-weight="700">앱이 알고 씁니다</text>
  <text x="762" y="292" text-anchor="middle" fill="#f5edda" font-size="9">pub-sub · 상태 추상</text>

  <rect x="24" y="322" width="418" height="30" fill="#dceaf7"/>
  <text x="44" y="342" fill="#10243a" font-size="10" font-weight="700">횡단 관심사는 transparent</text>

  <rect x="458" y="322" width="418" height="30" fill="#f5edda"/>
  <text x="478" y="342" fill="#0d0d0d" font-size="10" font-weight="700">앱이 쓸 기능은 explicit 으로</text>

  <rect x="24" y="360" width="852" height="28" fill="rgb(212,168,83)"/>
  <text x="450" y="379" text-anchor="middle" fill="#0d0d0d" font-size="10" font-weight="700">둘 다 앱 이미지는 그대로입니다</text>

  <defs>
    <marker id="bm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#5b9bd5"/>
    </marker>
    <marker id="gm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#66bb6a"/>
    </marker>
    <marker id="nm" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b8b3ad"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 900 500" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Sidecar — 기존 컨테이너를 바꾸지 않고 확장하는 협업 패턴</title>
  <desc>Kubernetes Patterns 16장. sidecar 컨테이너는 기존 컨테이너를 변경하지 않고 그 기능을 확장·강화합니다. Pod가 여러 단일 목적 컨테이너를 한 단위로 묶어 같은 노드 배치·같은 생애주기·볼륨 공유·로컬 네트워크 통신을 가능케 하기에 성립합니다. 전형적 예는 HTTP 서버(main)와 Git 동기화(sidecar)가 볼륨을 공유하는 것입니다. OOP 비유로 컨테이너 이미지는 클래스, 컨테이너는 객체이며, 상속(inheritance, is-a, 빌드타임 강결합)이 아니라 컴포지션(composition, has-a, 런타임 교체 가능)에 해당합니다. 두 방식이 있습니다 — 앱에 보이지 않는 transparent 사이드카(Envoy가 모든 트래픽을 가로채 TLS·로드밸런싱·재시도·서킷브레이킹·관측성을 투명 제공, AOP 유사)와 앱이 잘 정의된 API로 상호작용하는 explicit 사이드카(Dapr가 HTTP·gRPC로 서비스 호출·pub-sub·상태 추상을 노출).</desc>

  <rect x="0" y="0" width="900" height="500" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="16">Sidecar — 기존 컨테이너를 바꾸지 않고 확장</text>
  <text x="24" y="57" fill="rgb(138,133,128)" font-size="11">Pod가 단일 목적 컨테이너들을 한 단위로 묶어 <tspan fill="#e8e4df">같은 노드·생애주기·볼륨·로컬 네트워크</tspan>를 공유하기에 협업이 성립합니다.</text>

  <!-- example -->
  <text x="24" y="86" fill="#e8e4df" font-size="12">전형적 예 — Pod 안에서 볼륨 공유</text>
  <rect x="24" y="96" width="500" height="88" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <rect x="40" y="112" width="220" height="56" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="52" y="132" fill="rgb(212,168,83)" font-size="10" font-weight="700">main: app (httpd)</text>
  <text x="52" y="149" fill="#e8e4df" font-size="8.5">HTTP로 파일 서빙.</text>
  <text x="52" y="162" fill="#e8e4df" font-size="8.5">파일 출처는 모름.</text>
  <rect x="288" y="112" width="220" height="56" fill="#dceaf7"/>
  <text x="300" y="132" fill="#10243a" font-size="10" font-weight="700">sidecar: poll (git)</text>
  <text x="300" y="149" fill="#10243a" font-size="8.5">Git 저장소를 로컬로 동기화.</text>
  <text x="300" y="162" fill="#10243a" font-size="8.5">서빙 방식은 관심 없음.</text>
  <text x="540" y="128" fill="rgb(138,133,128)" font-size="9">emptyDir 볼륨(git)을</text>
  <text x="540" y="143" fill="rgb(138,133,128)" font-size="9">양쪽이 마운트해</text>
  <text x="540" y="158" fill="rgb(138,133,128)" font-size="9">데이터 교환.</text>
  <text x="24" y="203" fill="rgb(138,133,128)" font-size="8.5">main은 목록 첫 컨테이너 = 기본 컨테이너(kubectl exec 대상). 팀·언어·릴리스 주기가 달라도 협업·재사용·교체 가능.</text>

  <!-- OOP analogy -->
  <text x="24" y="230" fill="#e8e4df" font-size="12">OOP 비유 — 이미지=클래스, 컨테이너=객체</text>
  <rect x="24" y="240" width="418" height="76" fill="#f2d4d4"/>
  <text x="36" y="260" fill="#7a1f1f" font-size="11" font-weight="700">상속 (inheritance) — is-a</text>
  <text x="36" y="279" fill="#7a1f1f" font-size="8.5">컨테이너를 확장해 기능 강화하는 것에 비유되지만,</text>
  <text x="36" y="294" fill="#7a1f1f" font-size="8.5">빌드타임에 강하게 결합됩니다.</text>
  <text x="36" y="309" fill="#7a1f1f" font-size="8.5">교체가 어렵습니다.</text>

  <rect x="458" y="240" width="418" height="76" fill="#cdeccf"/>
  <text x="470" y="260" fill="#14521d" font-size="11" font-weight="700">컴포지션 (composition) — has-a ★</text>
  <text x="470" y="279" fill="#14521d" font-size="8.5">Pod 안 여러 컨테이너 협업 = 컴포지션.</text>
  <text x="470" y="294" fill="#14521d" font-size="8.5">빌드타임 결합 없이 나중에 컨테이너를 교체 가능.</text>
  <text x="470" y="309" fill="#14521d" font-size="8.5">단, 별도 프로세스라 헬스체크·재시작·리소스 소비 각각.</text>

  <!-- two approaches -->
  <text x="24" y="340" fill="#e8e4df" font-size="12">두 가지 사이드카 방식</text>
  <rect x="24" y="350" width="418" height="96" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="36" y="371" fill="rgb(212,168,83)" font-size="11" font-weight="700">Transparent — 앱에 보이지 않음</text>
  <text x="36" y="390" fill="#e8e4df" font-size="8.5">예: Envoy 프록시. 모든 인·아웃 트래픽을 가로채</text>
  <text x="36" y="404" fill="#e8e4df" font-size="8.5">TLS·로드밸런싱·재시도·서킷브레이킹·L7 관측성·</text>
  <text x="36" y="418" fill="#e8e4df" font-size="8.5">분산 추적을 앱 수정 없이 제공.</text>
  <text x="36" y="435" fill="#66bb6a" font-size="8.5">AOP 유사 — 직교 관심사를 Pod에 주입.</text>

  <rect x="458" y="350" width="418" height="96" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="470" y="371" fill="rgb(212,168,83)" font-size="11" font-weight="700">Explicit — 앱이 API로 상호작용</text>
  <text x="470" y="390" fill="#e8e4df" font-size="8.5">예: Dapr. 트래픽을 가로채지 않고 기능을</text>
  <text x="470" y="404" fill="#e8e4df" font-size="8.5">HTTP·gRPC API로 노출.</text>
  <text x="470" y="418" fill="#e8e4df" font-size="8.5">앱이 명시적으로 호출·구독:</text>
  <text x="470" y="435" fill="#e8e4df" font-size="8.5">서비스 호출·pub-sub·상태 추상·바인딩·관측성.</text>

  <!-- bottom -->
  <rect x="24" y="458" width="852" height="30" fill="#f5edda"/>
  <text x="36" y="477" fill="#0d0d0d" font-size="9.5">판단 기준: 별도 프로세스를 돌릴 가치가 있는가, 아니면 main에 합칠까. 현대 사이드카는 작고 리소스를 적게 씁니다. Adapter(17장)·Ambassador(18장)는 사이드카의 특화 후속.</text>
</svg>

<title id="dt">새 Pod 하나가 노드에 묶이기까지</title><desc id="dd">requests cpu 500m, memory 1Gi 와 nodeSelector disktype=ssd 를 가진 Pod 하나가 노드 다섯 대를 지나는 여섯 단계입니다. 필터 단계에서 node-1 은 메모리 부족, node-2 는 control-plane taint, node-3 은 selector 불일치로 떨어지고 node-4 와 node-5 가 점수 단계로 넘어갑니다. 점수가 높은 node-5 에 바인딩되며 이후 시간이 흐르면 축출이나 재조정이 일어납니다.</desc>
<rect width="1000" height="568" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES PATTERNS · 06-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">새 Pod 하나가 노드에 묶이기까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">노드 다섯 대를 끝까지 따라갑니다 · 점수 60 과 85 는 예시 값</text>
<text x="88" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">1 생성</text>
<text x="236" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">2 대기</text>
<text x="436" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">3 필터</text>
<text x="608" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">4 점수</text>
<text x="748" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">5 바인딩</text>
<text x="904" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">6 시간이 흐른 뒤</text>

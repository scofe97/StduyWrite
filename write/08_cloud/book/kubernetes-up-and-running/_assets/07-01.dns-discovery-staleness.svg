<title id="dt">이름이 가리키는 값이 늦게 따라온다</title><desc id="dd">DNS 는 안정적인 이름 해석과 넓은 캐싱을 전제로 만들어졌다. 파드가 계속 바뀌는 클러스터에서는 그 전제가 깨져, 값이 바뀐 시점과 클라이언트가 알아채는 시점 사이가 벌어진다.</desc>
<rect width="1240" height="636" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES UP AND RUNNING · 07-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름이 가리키는 값이 늦게 따라온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">재조회 여부와 무관하게 간격 자체는 남는다</text>
<text x="250" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">이름을 조회한다</text>
<text x="610" y="118" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">파드가 바뀐다</text>
<text x="900" y="118" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">TTL 만료 · 재조회</text>
<line x1="610" y1="128" x2="610" y2="362" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 5"/>
<line x1="900" y1="128" x2="900" y2="362" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="4 5"/>
<text x="12" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">실제</text>
<text x="12" y="182" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">엔드포인트가 가리키는 파드</text>

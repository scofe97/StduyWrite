<text x="755.0" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">짧게 잡아도 이 간격은 0 이 되지 않는다 — 값이 바뀐 시점과 알아채는 시점의 차이다</text>

<title id="dt">신원이 없어도 인증은 끝난 것이다</title><desc id="dd">모든 요청은 신원을 확립하는 인증을 먼저 지나고, 그 신원으로 무엇을 할 수 있는지 따지는 인가를 그다음에 지난다.</desc>
<rect width="1240" height="530" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES UP AND RUNNING · 14-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">신원이 없어도 인증은 끝난 것이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">거부는 인가에서만 나온다 — 인증은 아무도 돌려보내지 않는다</text>
<rect x="24" y="200" width="140" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="94" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">API 요청</text>
<rect x="214" y="196" width="190" height="76" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="309" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">인증</text>
<text x="309" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">누구인지 확정한다</text>
<rect x="454" y="176" width="270" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="589.0" y="200.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">신원 있음</text>
<text x="589.0" y="220.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">user 와 groups 를 얻는다</text>
<rect x="454" y="240" width="270" height="52" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="589.0" y="264.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">신원 없음</text>
<text x="589.0" y="284.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">system:unauthenticated 그룹</text>
<path d="M 404 216 L 429 216 L 429 202 L 450 202" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 404 252 L 429 252 L 429 266 L 450 266" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 724 202 L 754 202 L 754 234 L 780 234" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 724 266 L 754 266 L 754 234" fill="none" stroke="#F08A59" stroke-width="1.4"/>
<text x="754" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">둘 다 인가로 간다</text>
<rect x="784" y="162" width="200" height="144" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="884" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">인가</text>
<rect x="802" y="210" width="164" height="24" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="812" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">신원</text>
<rect x="802" y="242" width="164" height="24" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="812" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">리소스</text>
<text x="958" y="258" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">사실상 HTTP 경로</text>
<rect x="802" y="274" width="164" height="24" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="812" y="290" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">동사</text>
<rect x="1044" y="176" width="172" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="1130.0" y="200.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">요청이 진행된다</text>
<rect x="1044" y="240" width="172" height="52" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="1130.0" y="264.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">HTTP 403</text>
<path d="M 984 202 L 1040 202" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<path d="M 984 266 L 1040 266" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<text x="1012" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">규칙과 맞는다</text>
<text x="1012" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">맞지 않는다</text>
<text x="309" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">쿠버네티스는 자체 신원 저장소가 없다</text>
<text x="309" y="366" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">사용자와 그룹은 인증 제공자가 공급한다</text>
<text x="884" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">셋의 조합이 허용된 규칙과 맞아야 한다</text>
<rect x="12" y="390" width="1204" height="62" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="620.0" y="416" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">RBAC 은 방어의 한 겹일 뿐이다. 클러스터 안에서 임의의 코드를 실행할 수 있는 사람은 사실상 전체 root 권한에 닿는다.</text>
<text x="620.0" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서로 신뢰하지 않는 테넌트를 한 클러스터에 태운다면 하이퍼바이저 격리나 컨테이너 샌드박스가 더 필요하다.</text>
<line x1="12" y1="476" x2="1192" y2="476" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="498" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="488" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">신원 없음도 인증의 결과</text>
<rect x="313" y="488" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="335" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">진행</text>
<rect x="383" y="488" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="405" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">거부</text>
</svg>
<title id="dt">인프라 장애 도메인과 소프트웨어 장애 도메인은 다르다</title><desc id="dd">리전 클러스터는 존을 나눠 인프라 장애를 견딘다. 그래도 클러스터는 특정 Kubernetes 버전에 묶여 있고, 업그레이드가 애플리케이션을 깨뜨릴 수 있다.</desc>
<rect width="1240" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES UP AND RUNNING · 21-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인프라 장애 도메인과 소프트웨어 장애 도메인은 다르다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">원서 21장 논증 그대로 — 저자는 여기까지만 말하고 처방을 붙이지 않는다</text>
<rect x="24" y="132" width="386" height="296" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">단일 클러스터</text>
<text x="390" y="162" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">한 곳에 배포</text>
<line x1="44" y1="178" x2="390" y2="178" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="44" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#3FB98C">막는다</text>
<rect x="44" y="212" width="346" height="22" rx="4" fill="#3FB98C0C" stroke="#3FB98C" stroke-width="0.8"/>
<text x="56" y="227" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">—</text>
<text x="44" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#F0616D">못 막는다</text>
<rect x="44" y="318" width="346" height="22" rx="4" fill="#F0616D0C" stroke="#F0616D" stroke-width="0.8"/>
<text x="56" y="333" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">데이터센터 정전·광케이블 절단</text>
<rect x="44" y="346" width="346" height="22" rx="4" fill="#F0616D0C" stroke="#F0616D" stroke-width="0.8"/>
<text x="56" y="361" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">잘못 나간 소프트웨어 배포</text>
<rect x="44" y="374" width="346" height="22" rx="4" fill="#F0616D0C" stroke="#F0616D" stroke-width="0.8"/>
<text x="56" y="389" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">Kubernetes 업그레이드</text>
<path d="M 412 280.0 L 426 280.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="428" y="132" width="386" height="296" rx="8" fill="#F08A590C" stroke="#F08A59" stroke-width="1.5"/>
<text x="448" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">리전 클러스터</text>
<text x="794" y="162" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">여러 독립 존에 걸침</text>
<line x1="448" y1="178" x2="794" y2="178" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="448" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#3FB98C">막는다</text>
<rect x="448" y="212" width="346" height="22" rx="4" fill="#3FB98C0C" stroke="#3FB98C" stroke-width="0.8"/>
<text x="460" y="227" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">데이터센터 정전·광케이블 절단</text>
<rect x="448" y="240" width="346" height="22" rx="4" fill="#3FB98C0C" stroke="#3FB98C" stroke-width="0.8"/>
<text x="460" y="255" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">존 단위 인프라 장애</text>
<text x="448" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#F0616D">못 막는다</text>
<rect x="448" y="318" width="346" height="22" rx="4" fill="#F0616D0C" stroke="#F0616D" stroke-width="0.8"/>
<text x="460" y="333" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">Kubernetes 업그레이드</text>
<rect x="448" y="346" width="346" height="22" rx="4" fill="#F0616D0C" stroke="#F0616D" stroke-width="0.8"/>
<text x="460" y="361" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">API 폐기·동작 변경</text>
<rect x="448" y="374" width="346" height="22" rx="4" fill="#F0616D0C" stroke="#F0616D" stroke-width="0.8"/>
<text x="460" y="389" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">릴리스에 섞여 든 버그</text>
<path d="M 816 280.0 L 830 280.0" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="832" y="132" width="386" height="296" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="852" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">멀티클러스터</text>
<text x="1198" y="162" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">클러스터를 여럿 둔다</text>
<line x1="852" y1="178" x2="1198" y2="178" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="852" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#3FB98C">막는다</text>
<rect x="852" y="212" width="346" height="22" rx="4" fill="#3FB98C0C" stroke="#3FB98C" stroke-width="0.8"/>
<text x="864" y="227" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">앞의 것 전부</text>
<rect x="852" y="240" width="346" height="22" rx="4" fill="#3FB98C0C" stroke="#3FB98C" stroke-width="0.8"/>
<text x="864" y="255" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">한 클러스터의 사고가 전부를 끌고 가지 않는다</text>
<text x="852" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#F0616D">치르는 것</text>
<rect x="852" y="318" width="346" height="22" rx="4" fill="#F0616D0C" stroke="#F0616D" stroke-width="0.8"/>
<text x="864" y="333" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">운영 복잡도가 오른다</text>
<rect x="852" y="346" width="346" height="22" rx="4" fill="#F0616D0C" stroke="#F0616D" stroke-width="0.8"/>
<text x="864" y="361" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">일관성을 직접 지켜야 한다</text>
<line x1="24" y1="454" x2="1192" y2="454" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">가운데 칸을 충분하다고 읽는 것이 이 절이 깨려는 오해다. 존을 나눠도 클러스터는 여전히 한 버전에 묶여 있다.</text>
<line x1="12" y1="494" x2="1192" y2="494" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="516" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="506" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">오해가 생기는 자리</text>
<rect x="274" y="506" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="296" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">막아 주는 것</text>
<rect x="409" y="506" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="431" y="516" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">새는 것</text>

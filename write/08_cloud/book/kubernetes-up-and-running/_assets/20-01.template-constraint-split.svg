<title id="dt">정책을 쓰는 일과 적용하는 일을 갈라 놓는다</title><desc id="dd">템플릿이 Rego 와 파라미터 스키마를 담아 새 kind 를 만들어 내고, 제약이 그 kind 를 파라미터와 범위로 인스턴스화한다.</desc>

<title id="dt">인증 정보가 오는 자리는 둘뿐이다</title><desc id="dd">API 서버가 HTTP 서버이므로 인증도 HTTP 의 것이다. 클라이언트는 kubeconfig 파일에서 읽거나 Pod 의 컨텍스트에서 조립한다.</desc>
<rect width="1240" height="664" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES UP AND RUNNING · 18-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인증 정보가 오는 자리는 둘뿐이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">kind 로컬 클러스터 실측 — 오른쪽 아래 403 은 실제로 받은 응답이다</text>
<rect x="552.5" y="107" width="135.0" height="18" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="0.8"/>
<text x="620.0" y="120" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">코드가 어디서 도는가</text>
<rect x="24" y="152" width="590" height="384" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="44" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">밖에서 돈다</text>
<text x="594" y="178" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">kubeconfig 파일</text>
<line x1="44" y1="194" x2="594" y2="194" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<path d="M 620.0 128 L 319.0 142" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<text x="44" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">읽는 것</text>
<rect x="44" y="230" width="550" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="56" y="247" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">$KUBECONFIG</text>
<text x="582" y="247" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">있으면 기본 위치보다 우선한다</text>
<rect x="44" y="262" width="550" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="56" y="279" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">${HOME}/.kube/config</text>
<text x="582" y="279" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">기본 위치</text>
<rect x="44" y="294" width="550" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="56" y="311" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">외부 실행 파일</text>
<text x="582" y="311" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">클라우드는 이것이 토큰을 만든다</text>
<text x="44" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">클라이언트 호출</text>
<rect x="44" y="354" width="550" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="56" y="371" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">config.load_kube_config()</text>
<text x="582" y="371" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">Python</text>
<rect x="44" y="386" width="550" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="56" y="403" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">Config.defaultClient()</text>
<text x="582" y="403" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">Java</text>
<rect x="44" y="418" width="550" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="56" y="435" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">KubernetesClientConfiguration.BuildDefaultConfig()</text>
<text x="582" y="435" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">.NET</text>
<rect x="44" y="464" width="550" height="56" rx="5" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="319.0" y="488" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">토큰을 만드는 실행 파일이 없다</text>
<text x="319.0" y="508" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#E3B341">코드를 컨테이너로 옮기면 CLI 도구가 따라오지 않는다</text>
<rect x="626" y="152" width="590" height="384" rx="8" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="646" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">안에서 돈다</text>
<text x="1196" y="178" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Pod 의 컨텍스트</text>
<line x1="646" y1="194" x2="1196" y2="194" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<path d="M 620.0 128 L 921.0 142" fill="none" stroke="#F08A59" stroke-width="1.3" marker-end="url(#acc)"/>
<text x="646" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">읽는 것</text>
<rect x="646" y="230" width="550" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="658" y="247" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">/var/run/secrets/…/token</text>
<text x="1184" y="247" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">ServiceAccount 토큰</text>
<rect x="646" y="262" width="550" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="658" y="279" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">/var/run/secrets/…/ca.crt</text>
<text x="1184" y="279" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">인증 기관 인증서</text>
<rect x="646" y="294" width="550" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="658" y="311" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">kubernetes.default.svc</text>
<text x="1184" y="311" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">고정 DNS 이름 · 10.96.0.1:443</text>
<text x="646" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">클라이언트 호출</text>
<rect x="646" y="354" width="550" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="658" y="371" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">config.load_incluster_config()</text>
<text x="1184" y="371" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">Python</text>
<rect x="646" y="386" width="550" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="658" y="403" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">ClientBuilder.cluster().build()</text>
<text x="1184" y="403" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">Java</text>
<rect x="646" y="418" width="550" height="26" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="658" y="435" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">KubernetesClientConfiguration.InClusterConfig()</text>
<text x="1184" y="435" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">.NET</text>
<rect x="646" y="464" width="550" height="56" rx="5" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="921.0" y="488" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">기본 ServiceAccount 는 403 이다</text>
<text x="921.0" y="508" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">인증은 통과했고 인가에서 막힌 것이다</text>
<line x1="24" y1="566" x2="1192" y2="566" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어느 쪽이든 인증을 통과하는 것과 리소스를 읽을 권한을 갖는 것은 다른 일이다. 기본 ServiceAccount 로 버전 조회는 되고 Pod 목록은 안 된다.</text>
<line x1="12" y1="606" x2="1192" y2="606" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="628" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="618" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="628" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">클러스터 밖</text>
<rect x="222" y="618" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="244" y="628" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">클러스터 안</text>
<rect x="344" y="618" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="366" y="628" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">환경이 달라지면 깨진다</text>
<rect x="544" y="618" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="566" y="628" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">실측한 거부</text>
</svg>
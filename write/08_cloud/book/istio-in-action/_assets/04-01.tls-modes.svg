<title id="dt">세 TLS 모드 — 인증서와 종료 지점은 어디에 있는가</title><desc id="dd">SIMPLE 과 MUTUAL 은 게이트웨이가 인증서를 갖고 TLS 를 종료한다. MUTUAL 은 ca.crt 로 클라이언트까지 검증한다. PASSTHROUGH 는 게이트웨이에 인증서가 없고 SNI 만 읽어 백엔드로 넘기며 백엔드가 종료한다.</desc>

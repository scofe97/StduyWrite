<title id="dt">세 TLS 모드 — TLS 는 어디서 끝나는가</title><desc id="dd">SIMPLE 과 MUTUAL 은 게이트웨이가 인증서를 갖고 TLS 를 종료하며 MUTUAL 은 ca.crt 로 클라이언트까지 검증한다. PASSTHROUGH 는 게이트웨이가 SNI 만 읽고 백엔드까지 TLS 를 유지해 백엔드가 종료한다.</desc>
<rect width="960" height="504" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세 TLS 모드 — TLS 는 어디서 끝나는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">코랄 칸이 TLS가 끝나는 곳이고 초록 화살표가 암호화 구간입니다. 모드 이름 옆에 Gateway의 protocol과 VirtualService 매칭 값을 적었습니다.</text>

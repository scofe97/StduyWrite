<title id="dt">설치가 끝나도 데이터 플레인은 아직 없다</title><desc id="dd">istioctl install 이 세우는 것은 컨트롤 플레인과 게이트웨이 둘뿐이다. 색이 붙은 자리가 아직 비어 있고, 애플리케이션을 올려 프록시를 주입해야 채워진다. 애드온은 데모용이라고 저자가 못 박는다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 02-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">설치가 끝나도 데이터 플레인은 아직 없다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">복제본이 하나씩인 것은 demo 프로파일이고 운영에서는 다중 복제가 의도된 형태입니다</text>
<rect x="48" y="148" width="448" height="244" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="60" y="141" width="84" height="14" fill="#0D1117"/>
<text x="66" y="151" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">ISTIO-SYSTEM</text>
<rect x="552" y="148" width="404" height="116" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="564" y="141" width="108" height="14" fill="#0D1117"/>
<text x="570" y="151" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">ADDONS · SAMPLES</text>
<rect x="552" y="296" width="404" height="96" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="564" y="289" width="138" height="14" fill="#0D1117"/>
<text x="570" y="299" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">APPLICATION NAMESPACE</text>
<rect x="68" y="176" width="408" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="80" y="188" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="100" y="199" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">POD</text>
<text x="130" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">istiod</text>
<text x="130" y="218" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">1/1 · 컨트롤 플레인</text>
<rect x="68" y="244" width="408" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="80" y="256" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="100" y="267" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">POD</text>
<text x="130" y="268" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">istio-ingressgateway</text>
<text x="130" y="286" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">1/1 · 들어오는 트래픽</text>
<rect x="68" y="312" width="408" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="80" y="324" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="100" y="335" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">POD</text>
<text x="130" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">istio-egressgateway</text>
<text x="130" y="354" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">1/1 · 나가는 트래픽</text>
<rect x="568" y="176" width="364" height="60" rx="6" fill="#F5F5F304" stroke="#8B98A9" stroke-width="1" stroke-dasharray="5 5"/>
<rect x="580" y="188" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="600" y="199" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">ADD</text>
<text x="630" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">Grafana · Jaeger · Kiali</text>
<text x="630" y="218" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">demo only · 7장이 걷어낸다</text>
<rect x="568" y="320" width="364" height="52" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<rect x="580" y="332" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="600" y="343" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">GAP</text>
<text x="630" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">데이터 플레인</text>
<text x="630" y="362" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">아직 없다</text>
<path d="M 476 206 L 532 206 L 532 206 L 568 206" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)"/>
<text x="520" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">함께 깔지만 필수는 아니다</text>
<path d="M 476 342 L 532 342 L 532 346 L 568 346" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="520" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">앱 + 주입이 있어야 생긴다</text>
<rect x="48" y="424" width="908" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="64" y="450" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">설치 앞뒤로 붙는 확인 명령</text>
<text x="64" y="474" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">istioctl x precheck   -&gt;   istioctl install --set profile=demo -y   -&gt;   istioctl verify-install</text>
<text x="64" y="494" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">마지막 명령은 설치 매니페스트와 클러스터의 실제 상태를 대조해 어긋난 곳을 알린다</text>
<text x="28" y="548" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">컨트롤 플레인이 통째로 내려가도 데이터 플레인은 단절 기간을 견디도록 구현돼 있다</text>
<line x1="12" y1="576" x2="952" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="588" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아직 비어 있는 자리</text>
<rect x="287" y="588" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">필수가 아닌 것</text>
</svg>
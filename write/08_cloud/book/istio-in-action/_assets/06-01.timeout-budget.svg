<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">중첩된 타임아웃과 실습의 0.5초</title><desc id="dd">위 묶음은 저자의 A·B·C 예시로, A→B 의 1초가 먼저 끊겨 B→C 의 2초는 발동하지 못한다. 아래 묶음은 실습으로, 1초 지연을 넣은 백엔드에 0.5초 타임아웃을 걸어 응답이 HTTP 500 으로 끊긴다.</desc>
<rect width="1000" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 06-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">중첩된 타임아웃과 실습의 0.5초</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가장 제한적인 타임아웃이 이깁니다. 그래서 엣지는 크게, 깊은 곳은 짧게 둡니다</text>
<line x1="200.0" y1="118" x2="200.0" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="200.0" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">0s</text>
<line x1="350.0" y1="118" x2="350.0" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="350.0" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">0.5s</text>
<line x1="500.0" y1="118" x2="500.0" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="500.0" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">1s</text>
<line x1="650.0" y1="118" x2="650.0" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="650.0" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">1.5s</text>
<line x1="800.0" y1="118" x2="800.0" y2="428" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="800.0" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">2s</text>
<line x1="200" y1="124" x2="800" y2="124" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="12" y="140" width="956" height="160" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
<text x="24" y="158" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">저자의 예 — 중첩된 타임아웃</text>
<text x="24" y="189" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">A → B</text>
<rect x="200.0" y="172" width="300.0" height="24" rx="4" fill="#F08A591F" stroke="#F08A59" stroke-width="1.4"/>
<text x="510.0" y="189" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">timeout 1s</text>
<text x="24" y="229" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">B → C</text>
<rect x="200.0" y="212" width="600.0" height="24" rx="4" fill="rgba(139,152,169,0.15)" stroke="#8B98A9" stroke-width="1"/>
<text x="810.0" y="229" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">timeout 2s</text>
<text x="24" y="269" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">C 의 실제 처리</text>
<rect x="200.0" y="252" width="600.0" height="24" rx="4" fill="rgba(139,152,169,0.15)" stroke="#8B98A9" stroke-width="1" stroke-dasharray="4 3"/>
<text x="810.0" y="269" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">얼마가 걸리든</text>
<rect x="12" y="320" width="956" height="120" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
<text x="24" y="338" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">실습 — 1초 지연에 0.5초 타임아웃</text>
<text x="24" y="369" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">백엔드 처리</text>
<rect x="200.0" y="352" width="300.0" height="24" rx="4" fill="rgba(139,152,169,0.15)" stroke="#8B98A9" stroke-width="1"/>
<text x="510.0" y="369" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">50% 에 1s 지연</text>
<text x="24" y="409" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F5F5F3">요청 타임아웃</text>
<rect x="200.0" y="392" width="150.0" height="24" rx="4" fill="rgba(139,152,169,0.15)" stroke="#8B98A9" stroke-width="1"/>
<text x="360.0" y="409" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">0.5s → HTTP 500</text>
<line x1="500.0" y1="170" x2="500.0" y2="282" stroke="#F08A59" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="510.0" y="296" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">여기서 끊긴다 — B→C 의 2초는 발동하지 못한다</text>
<line x1="350.0" y1="350" x2="350.0" y2="422" stroke="#F0616D" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="360.0" y="436" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">0.5s 에 HTTP 500 — 느린 응답이 빠른 실패가 된다</text>
<line x1="12" y1="484" x2="952" y2="484" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="506" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="496" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">먼저 끊기는 타임아웃</text>
<rect x="287" y="496" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="309" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">타임아웃이 만든 실패</text>
</svg>
<text x="24" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">저자가 이 실패에서 뽑아 내는 것은 고치는 방법이 아니라 Istio 가 준비되지 않은 워크로드를 다루는 방식이다</text>

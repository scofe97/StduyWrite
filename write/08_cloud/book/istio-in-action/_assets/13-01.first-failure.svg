<title id="dt">저자는 500 을 고치지 않고 훈련으로 남겼다</title><desc id="dd">메시 운영자가 클러스터에서 VM 서비스를 처음 부를 때 지나는 다섯 마디. 색이 붙은 자리가 골짜기이고, 그 아래 두 표시가 그때 운영자가 실제로 겪는 것이다.</desc>
<rect width="1000" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 13-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">저자는 500 을 고치지 않고 훈련으로 남겼다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">단서는 이미 앞 절의 nmap 출력에 closed 로 찍혀 있었습니다</text>
<text x="146.0" y="112" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">STAGE 1</text>
<text x="146.0" y="134" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">서비스를 만든다</text>

<text x="188" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">중앙에서 네트워킹만</text>
<text x="812" y="512" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">분산에서 네트워킹만</text>
<text x="32" y="580" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">메시가 맡지 않는 것 — X12·EDI·HL7 변환 · 비즈니스 프로세스 오케스트레이션 · 예외 처리 · 서비스 오케스트레이션</text>

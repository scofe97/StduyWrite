<line x1="176" y1="356" x2="500" y2="356" stroke="#F5F5F3" stroke-width="1.2"/>
<text x="500" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">중재까지</text>
<text x="500" y="558" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">네트워킹만</text>
<text x="162" y="360" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">중앙</text>
<text x="878" y="360" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">분산</text>

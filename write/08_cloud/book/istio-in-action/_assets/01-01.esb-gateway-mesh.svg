<title id="dt">범위를 좁히고 자리를 흩는다</title><desc id="dd">가로축은 어디에 배치되는가, 세로축은 무엇까지 맡는가. 저자가 ESB 를 인용문으로 소환해 같은 점과 다른 점을 가르는 대목이 이 두 축이다. 색이 붙은 것이 이 책이 고른 자리다.</desc>
<rect width="1000" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 01-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">범위를 좁히고 자리를 흩는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">ESB 는 새 사일로를 만들었고 그 조직이 통합의 문지기가 됐습니다</text>

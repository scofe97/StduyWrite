<text x="872.0" y="298" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">없으면 비어 있다</text>
<text x="24" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">정책이 쓰는 필드 이름이 갈리는 이유가 이 두 경로다 — 앞은 mTLS 가 있어야, 뒤는 토큰이 있어야 찬다</text>

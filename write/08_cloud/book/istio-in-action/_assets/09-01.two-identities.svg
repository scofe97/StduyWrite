<title id="dt">같은 요청에 신원이 둘 실린다</title><desc id="dd">전송 계층은 인증서에서, 요청 계층은 토큰에서 신원을 얻는다. 정책이 쓰는 필드 이름이 다른 이유가 여기 있다. 색이 붙은 칸은 비어 있을 수 있고, 비어도 요청은 통과한다.</desc>
<rect width="1000" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 09-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 요청에 신원이 둘 실린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">requestPrincipals 는 JWT 의 iss 와 sub 를 이어 붙인 값입니다</text>

<title id="dt">두 연결 모두 기계에서 문으로 향한다</title><desc id="dd">VM 은 컨트롤 플레인에 붙어야 하고 클러스터 서비스도 불러야 하는데, 망이 달라 둘 다 동서 게이트웨이를 거친다. 색이 붙은 자리가 그 문이고 여는 포트가 둘이다.</desc>

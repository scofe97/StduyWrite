<title id="dt">세 알고리즘의 지연 백분위</title><desc id="dd">simple-backend-1 에 최대 1초 지연을 넣고 커넥션 10개로 초당 1,000 요청을 60초 보낸 Fortio 결과. 50% 에서는 셋이 겹치고 75% 에서 LEAST_CONN 만 195.63ms 에 머문다. 90% 부터는 LEAST_CONN 이 가장 높다.</desc>

<title id="dt">같은 뿌리에서 갈라져야 서로를 알아본다</title><desc id="dd">두 클러스터에 각자 다른 중간 CA 를 꽂되 같은 루트가 서명한 것으로 둔다. 색이 붙은 뿌리가 양쪽 워크로드 인증서를 함께 검증해 주는 자리이고, 그 개인키만 클러스터 밖에 남는다.</desc>
<rect width="1160" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 12-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 뿌리에서 갈라져야 서로를 알아본다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">쉬운 방법이지만 중간 CA 가 새면 탐지될 때까지 서명이 통합니다</text>
<rect x="390" y="112" width="380" height="56" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="580.0" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">루트 CA</text>
<text x="580.0" y="156" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">개인키는 클러스터 밖에 둔다</text>
<line x1="580.0" y1="168" x2="580.0" y2="216" stroke="#F08A59" stroke-width="1.4"/>
<line x1="278.0" y1="216" x2="882.0" y2="216" stroke="#F08A59" stroke-width="1.4"/>

<text x="104" y="424" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">ca-key.pem       중간 CA 개인키</text>
<text x="104" y="446" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">root-cert.pem    루트 CA 인증서</text>
<text x="104" y="468" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">cert-chain.pem   둘을 이은 신뢰 사슬</text>
<rect x="692" y="372" width="380" height="112" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="708" y="402" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">ca-cert.pem      중간 CA 인증서</text>
<text x="708" y="424" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">ca-key.pem       중간 CA 개인키</text>
<text x="708" y="446" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">root-cert.pem    루트 CA 인증서</text>
<text x="708" y="468" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">cert-chain.pem   둘을 이은 신뢰 사슬</text>
<text x="32" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">cacerts 를 두지 않으면 Istio 가 스스로 CA 를 만들어 istio-ca-secret 에 넣고, 그러면 두 클러스터의 뿌리가 달라진다</text>
<text x="32" y="536" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">더 안전한 쪽은 외부 CA 를 붙이는 것이다 — istiod 가 등록 기관이 되어 CSR 을 승인만 한다</text>
<line x1="12" y1="560" x2="1112" y2="560" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="582" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="572" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">양쪽을 함께 검증하는 뿌리</text>
<rect x="326" y="572" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="348" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">클러스터마다 다른 중간 CA</text>

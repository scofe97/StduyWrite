<title id="dt">안쪽이 바깥을 덮어쓴다</title><desc id="dd">Sidecar 설정은 세 스코프로 놓이고 안쪽이 더 구체적이라 바깥을 덮어쓴다. 색이 붙은 가장 안쪽이 workloadSelector 로 대상을 고르는 자리이고, 나머지 둘은 이름을 default 로 두는 관례를 따른다.</desc>
<rect width="1160" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 11-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">안쪽이 바깥을 덮어쓴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">메시 전역 하나를 깔아 두면 나머지는 팀이 자기 것만 좁히면 됩니다</text>
<rect x="72" y="128" width="1016" height="372" rx="8" fill="#F5F5F304" stroke="#F5F5F330" stroke-width="1.0"/>
<rect x="92" y="121" width="220" height="14" fill="#0D1117"/>
<text x="100" y="131" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">MESH-WIDE · NAMESPACE ISTIO-SYSTEM</text>
<text x="100" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이름은 default · 메시 전체의 기본값</text>
<rect x="116" y="184" width="928" height="280" rx="8" fill="#F5F5F307" stroke="#8B98A9" stroke-width="1.0"/>
<rect x="136" y="177" width="232" height="14" fill="#0D1117"/>
<text x="144" y="187" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">NAMESPACE-WIDE · WORKLOADSELECTOR 없음</text>
<text x="144" y="214" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이름은 default · 그 네임스페이스를 덮어쓴다</text>
<rect x="160" y="240" width="840" height="184" rx="8" fill="#F08A590E" stroke="#F08A59" stroke-width="1.4"/>
<rect x="180" y="233" width="250" height="14" fill="#0D1117"/>
<text x="188" y="243" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F08A59">WORKLOAD-SPECIFIC · WORKLOADSELECTOR 있음</text>
<text x="188" y="270" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">가장 구체적이라 앞의 둘을 덮어쓴다</text>
<rect x="196" y="316" width="248" height="64" rx="6" fill="#F08A5910" stroke="#F08A5966" stroke-width="1"/>
<text x="320" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">egress</text>
<text x="320" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">어디로 나갈 수 있나</text>
<rect x="464" y="316" width="248" height="64" rx="6" fill="#F08A5910" stroke="#F08A5966" stroke-width="1"/>
<text x="588" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">ingress</text>
<text x="588" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">생략하면 파드에서 유추</text>
<rect x="732" y="316" width="248" height="64" rx="6" fill="#F08A5910" stroke="#F08A5966" stroke-width="1"/>
<text x="856" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">outboundTrafficPolicy</text>
<text x="856" y="364" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">REGISTRY_ONLY · ALLOW_ANY</text>
<text x="32" y="528" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">egress 를 적어 두면 컨트롤 플레인이 그 워크로드에 필요한 설정만 골라 내려보낸다</text>
<text x="32" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">메시 전역으로 istio-system 만 허용하면 catalog 의 설정이 2MB 에서 644K 로 줄어든다</text>
<text x="32" y="576" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">이미 도는 클러스터라면 팀이 자기 egress 를 먼저 적게 한 뒤에 전역 기본값을 깐다</text>
<line x1="12" y1="600" x2="1112" y2="600" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="622" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="612" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">가장 구체적인 스코프</text>
<rect x="287" y="612" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="309" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">그것이 덮어쓰는 스코프</text>
</svg>
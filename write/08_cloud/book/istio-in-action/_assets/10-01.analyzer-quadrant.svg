<title id="dt">같은 오류를 셋이 다른 자리에서 잡는다</title><desc id="dd">가로축은 언제 보는가, 세로축은 얼마나 넓게 보는가. 셋 다 subset 이 없다는 같은 사실을 알려 주지만 서는 자리가 다르다. 색이 붙은 것만 클러스터에 넣기 전에 막을 수 있다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 10-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 오류를 셋이 다른 자리에서 잡는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽 아래는 비어 있습니다 — 적용 전에 워크로드 하나로 좁혀 보는 도구는 없습니다</text>
<path d="M 500 520 L 500 152" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 176 340 L 824 340" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="500" y1="520" x2="500" y2="340" stroke="#F5F5F3" stroke-width="1.2"/>
<line x1="176" y1="340" x2="500" y2="340" stroke="#F5F5F3" stroke-width="1.2"/>
<text x="500" y="138" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">넓게</text>
<text x="500" y="542" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">좁게</text>
<text x="162" y="344" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">사전</text>
<text x="838" y="344" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F5F5F3">사후</text>
<circle cx="280" cy="216" r="4" fill="#F08A59"/>
<text x="294" y="213" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">적용 전 파일 검증</text>
<text x="294" y="230" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">istioctl analyze &lt;file&gt;</text>
<circle cx="596" cy="200" r="4" fill="#8B98A9"/>
<text x="610" y="197" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Kiali 설정 검증</text>
<text x="610" y="214" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">KIA1107 subset not found</text>
<circle cx="624" cy="288" r="4" fill="#8B98A9"/>
<text x="638" y="285" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">네임스페이스 분석</text>
<text x="638" y="302" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">istioctl analyze -n &lt;ns&gt;</text>
<circle cx="628" cy="440" r="4" fill="#8B98A9"/>
<text x="642" y="437" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">워크로드 요약</text>
<text x="642" y="454" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">istioctl x describe pod</text>
<text x="196" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">고치기 전에 막는다</text>
<text x="804" y="176" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">이미 난 문제를 훑는다</text>
<text x="196" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">이 자리에 도구가 없다</text>
<text x="804" y="500" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">한 워크로드로 좁힌다</text>
<text x="32" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">describe 는 파드가 이미 떠 있어야 답한다 — 그래서 사전 쪽으로 오지 못한다</text>
<line x1="12" y1="584" x2="952" y2="584" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="606" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="596" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">클러스터에 넣기 전에 막는 자리</text>
<rect x="365" y="596" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="387" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">난 뒤에 훑는 자리</text>
</svg>
<title id="dt">언제 넣을지와 얼마나 꺼낼지가 갈린다</title><desc id="dd">환경변수 넷은 두 축으로 갈린다. 앞의 셋은 이벤트를 언제 푸시 큐에 넣을지를 정하고, 마지막 하나는 큐에서 동시에 몇 개를 꺼낼지를 정한다. 색이 붙은 쪽이 저자가 실험으로 푸시를 다섯 배 줄여 보인 축이다.</desc>
<rect width="1160" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 11-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">언제 넣을지와 얼마나 꺼낼지가 갈린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자의 지침은 갱신을 빨리 퍼뜨리려면 둘을 같은 방향으로 함께 움직이라는 것입니다</text>
<rect x="390" y="112" width="380" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="580.0" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">istiod 가 자신을 지키는 두 방법</text>
<text x="580.0" y="156" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">debounce · throttle</text>
<line x1="580.0" y1="168" x2="580.0" y2="212" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="278.0" y1="212" x2="882.0" y2="212" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="278.0" y1="212" x2="278.0" y2="252" stroke="#F08A59" stroke-width="1.4"/>
<line x1="278.0" y1="304" x2="278.0" y2="368" stroke="#F08A59" stroke-width="1.4"/>
<line x1="882.0" y1="212" x2="882.0" y2="252" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="882.0" y1="304" x2="882.0" y2="368" stroke="#8B98A9" stroke-width="1.0"/>
<rect x="88" y="252" width="380" height="52" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="278.0" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">언제 큐에 넣을까</text>
<text x="278.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">묶어서 일을 줄인다</text>
<rect x="692" y="252" width="380" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="882.0" y="274" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">큐에서 얼마나 꺼낼까</text>
<text x="882.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">동시 처리 수를 정한다</text>
<rect x="88" y="368" width="380" height="90" rx="6" fill="#F08A590C" stroke="#F08A5988" stroke-width="1"/>
<text x="104" y="398" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">PILOT_DEBOUNCE_AFTER      100ms</text>
<text x="104" y="420" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">PILOT_DEBOUNCE_MAX        10s</text>
<text x="104" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">PILOT_ENABLE_EDS_DEBOUNCE true</text>
<rect x="692" y="368" width="380" height="90" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="708" y="398" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">PILOT_PUSH_THROTTLE       100</text>
<text x="708" y="420" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9"></text>
<text x="708" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">CPU 가 남으면 올린다</text>
<text x="32" y="484" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">저자의 실험 — 사이드카가 깔린 135 에서 디바운스를 2.5초로 올려 27 로 떨어뜨렸고 프로덕션에서는 하지 말라고 못 박는다</text>
<text x="32" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">지연 지표는 큐 진입 이후만 세므로 디바운스로 늘어난 시간은 지표에 나타나지 않는다</text>
<line x1="12" y1="536" x2="1112" y2="536" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="558" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="548" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">일을 줄이는 축</text>
<rect x="248" y="548" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="270" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">진행을 빠르게 하는 축</text>
</svg>
<title id="dt">지연 하나를 세 구간으로 나눠 잰다</title><desc id="dd">가로축은 국면 경계이고 막대 길이는 순서만 나타낸다. 색이 붙은 막대가 전체를 재는 지표이고, 왼쪽 점선 막대는 어떤 지표도 세지 않는 구간이다.</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 11-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">지연 하나를 세 구간으로 나눠 잰다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자가 구간별 시간을 적지 않아 눈금 대신 경계만 둡니다</text>
<line x1="300.0" y1="122" x2="300.0" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="300.0" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">이벤트 도착</text>
<line x1="487.04" y1="122" x2="487.04" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="487.04" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">큐 진입</text>
<line x1="674.08" y1="122" x2="674.08" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="674.08" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">워커 착수</text>
<line x1="968.0" y1="122" x2="968.0" y2="340" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="3 5"/>
<text x="968.0" y="116" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">배포 완료</text>
<line x1="300" y1="128" x2="968" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="20" y="185" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F0616D">(어떤 지표도 없다)</text>
<text x="20" y="201" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">디바운스 — 이벤트를 묶는 구간</text>
<rect x="300.0" y="168" width="187.04000000000002" height="24" rx="4" fill="#F0616D0C" stroke="#F0616D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="20" y="229" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">pilot_proxy_convergence_time</text>
<text x="20" y="245" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">큐 진입부터 배포까지 전 과정</text>
<rect x="487.04" y="212" width="480.96" height="24" rx="4" fill="#F08A591F" stroke="#F08A59" stroke-width="1.4"/>
<text x="20" y="273" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">pilot_proxy_queue_time</text>
<text x="20" y="289" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">워커가 집을 때까지 기다린 시간</text>
<rect x="487.04" y="256" width="187.04000000000002" height="24" rx="4" fill="rgba(139,152,169,0.15)" stroke="#8B98A9" stroke-width="1"/>
<text x="20" y="317" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">pilot_xds_push_time</text>
<text x="20" y="333" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정을 워크로드로 푸시한 시간</text>
<rect x="674.08" y="300" width="293.91999999999996" height="24" rx="4" fill="rgba(139,152,169,0.15)" stroke="#8B98A9" stroke-width="1"/>
<text x="28" y="392" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">큐 대기가 길면 istiod 를 수직으로 키워 동시 처리 능력을 늘린다</text>
<text x="28" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">푸시 시간이 길면 대역폭이 눌린 것이다 — Sidecar 로 설정 크기를 줄이는 쪽이 먼저다</text>
<text x="28" y="440" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">저자가 든 경보 기준 — 10초 넘게 1초를 초과하면 경고, 2초를 초과하면 심각</text>
<line x1="12" y1="468" x2="952" y2="468" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="490" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="480" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전체를 재는 지표</text>
<rect x="261" y="480" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="283" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">구간을 나눠 재는 지표</text>
<rect x="461" y="480" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="483" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아무도 세지 않는 구간</text>
</svg>
<title id="dt">규격의 세 자리에 Istio 의 세 부품이 앉는다</title><desc id="dd">위 레인이 규격이 정한 자리이고 아래 레인이 Istio 가 거기 앉힌 부품이다. X.509 를 고른 덕에 워크로드끼리 상호 인증까지 되고, 색이 붙은 칸이 그 결과의 이름이다.</desc>
<rect width="1000" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-03 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">규격의 세 자리에 Istio 의 세 부품이 앉는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">에이전트가 곁에 있어 엔드포인트 자리에, CA 가 istiod 안이라 API 자리에 앉습니다</text>
<line x1="0" y1="140" x2="1000" y2="140" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="20" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">SPIFFE 규격</text>
<text x="20" y="212" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">무엇을 정했나</text>
<line x1="0" y1="260" x2="1000" y2="260" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="20" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">ISTIO 구현</text>
<text x="20" y="332" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">무엇을 앉혔나</text>
<line x1="0" y1="380" x2="1000" y2="380" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<line x1="164" y1="140" x2="164" y2="380" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="188" y="164" width="240" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="308.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Workload Endpoint</text>
<text x="308.0" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">신원을 부트스트랩</text>
<rect x="452" y="164" width="240" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="572.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Workload API</text>
<text x="572.0" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">인증서를 발급</text>
<rect x="716" y="164" width="240" height="72" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="836.0" y="194" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">신원을 받는 워크로드</text>
<text x="836.0" y="216" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">그 신원으로 자기를 밝힘</text>
<rect x="188" y="284" width="240" height="72" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="308.0" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">파일럿 에이전트</text>
<text x="308.0" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">곁에 배포된다</text>
<rect x="452" y="284" width="240" height="72" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="572.0" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">Istio CA</text>
<text x="572.0" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">istiod 의 컴포넌트</text>
<rect x="716" y="284" width="240" height="72" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="836.0" y="314" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">서비스 프록시</text>
<text x="836.0" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Envoy</text>
<path d="M 308.0 236 L 308.0 282" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 572.0 236 L 572.0 282" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 836.0 236 L 836.0 282" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="28" y="396" width="944" height="64" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="48" y="422" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">auto mTLS</text>
<text x="48" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SVID 를 X.509 로 고른 덕에 공개 키가 함께 실린다 — 모든 워크로드가 상호 인증하고 트래픽을 암호화한다</text>
<text x="28" y="484" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">SVID 의 형식은 X.509 와 JWT 둘인데 Istio 는 앞을 골라 SPIFFE ID 를 SAN 의 URI 확장에 인코딩한다</text>
<line x1="12" y1="504" x2="952" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="526" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="516" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 선택이 낳은 결과</text>
<rect x="287" y="516" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="309" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Istio 가 앉힌 부품</text>
</svg>
<title id="dt">설정을 드는 클래스와 요청을 만지는 클래스</title><desc id="dd">생성기가 만들어 주는 뼈대는 둘로 나뉜다. 뿌리 클래스가 모듈 설정을 들고, 색이 붙은 클래스가 요청 경로의 콜백을 구현한다. 예제가 손대는 것은 그 넷 중 하나뿐이다.</desc>
<rect width="1200" height="664" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 14-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">설정을 드는 클래스와 요청을 만지는 클래스</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">언어는 골라도 되지만 Envoy 버전과 ABI 는 맞춰야 합니다</text>
<rect x="704" y="132" width="400" height="46" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="904.0" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">«SDK 가 주는 기반»</text>
<text x="904.0" y="170" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Context</text>
<rect x="704" y="300" width="400" height="176" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="904.0" y="330" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">AddHeader</text>
<line x1="704" y1="346" x2="1104" y2="346" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="720" y="366" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#8B98A9">+ root_context: AddHeaderRoot</text>
<line x1="704" y1="378" x2="1104" y2="378" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="720" y="398" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#8B98A9">+ onRequestHeaders(): Status</text>
<text x="720" y="420" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#8B98A9">+ onRequestBody(): Status</text>
<text x="720" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#8B98A9">+ onResponseHeaders(a: u32): Status</text>
<text x="720" y="464" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#8B98A9">+ onResponseBody(): Status</text>
<rect x="60" y="300" width="400" height="78" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="260.0" y="330" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">AddHeaderRoot</text>
<line x1="60" y1="346" x2="460" y2="346" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="76" y="366" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#8B98A9">+ configuration: string</text>
<line x1="904.0" y1="300" x2="904.0" y2="192" stroke="#F5F5F3" stroke-width="1.2"/>
<polygon points="904.0 178 895.0 193 913.0 193" fill="#0D1117" stroke="#F5F5F3" stroke-width="1.2"/>
<rect x="916.0" y="200" width="54" height="14" fill="#0D1117"/>
<text x="922.0" y="210" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">extends</text>
<path d="M 704 340 H 462" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="531.0" y="308" width="102.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="582.0" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정을 참조한다</text>
<text x="476" y="358" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">1</text>
<text x="688" y="358" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">1</text>
<text x="60" y="540" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">예제가 손대는 것은 onResponseHeaders 하나 — 설정이 비면 hello: world! 를, 아니면 설정값을 붙이고 Continue 를 돌려준다</text>
<text x="60" y="564" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">빌드 산출물은 .wasm 모듈을 레이어 하나로 담은 OCI 이미지이고, 메타데이터가 호환되는 Envoy 버전과 ABI 를 적는다</text>
<text x="60" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">SDK 는 넷이다 — C++ · Rust · AssemblyScript · TinyGo. 저자는 TypeScript 변종인 AssemblyScript 를 고른다</text>
<line x1="12" y1="608" x2="1152" y2="608" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="630" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="620" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">요청 경로의 콜백이 들어가는 클래스</text>
<rect x="391" y="620" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="413" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정을 드는 뿌리 클래스</text>
</svg>
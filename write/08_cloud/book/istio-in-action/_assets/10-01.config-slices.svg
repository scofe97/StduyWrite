<title id="dt">같은 네 칸을 셋이 다른 이름으로 부른다</title><desc id="dd">13,934줄짜리 config_dump 를 xDS 축으로 자르면 네 칸이 남는다. 명령 · 프록시 설정 · 사람이 쓰는 리소스가 같은 칸을 다른 이름으로 부를 뿐이다. 색이 붙은 칸이 저자의 예제에서 비어 있던 자리다.</desc>

<title id="dt">이름 한 줄을 파이프로 끊으면 질의 조건이 된다</title><desc id="dd">클러스터 이름은 방향 · 포트 · subset · FQDN 네 조각을 파이프로 이은 것이고, 그 넷이 그대로 istioctl 의 질의 플래그다. 색이 붙은 조각이 없어서 이 장의 요청이 전부 실패한다.</desc>
<rect width="1240" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 10-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름 한 줄을 파이프로 끊으면 질의 조건이 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이름을 읽을 줄 알면 어느 플래그로 좁혀야 하는지가 함께 정해집니다</text>
<rect x="120" y="112" width="1000" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="620.0" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">인그레스 게이트웨이가 라우트에서 지목한 클러스터 이름</text>
<text x="620.0" y="158" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">outbound|80|version-v1|catalog.istioinaction.svc.cluster.local</text>
<line x1="620.0" y1="172" x2="620.0" y2="216" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="164.0" y1="216" x2="1076.0" y2="216" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="164.0" y1="216" x2="164.0" y2="256" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="164.0" y1="308" x2="164.0" y2="372" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="468.0" y1="216" x2="468.0" y2="256" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="468.0" y1="308" x2="468.0" y2="372" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="772.0" y1="216" x2="772.0" y2="256" stroke="#F08A59" stroke-width="1.2"/>

<title id="dt">목적지를 SNI 에 싣고 관문은 그것만 읽는다</title><desc id="dd">webapp 이 원격의 catalog 를 부를 때 겨냥한 Envoy 클러스터를 SNI 에 인코딩하고, 동서 게이트웨이는 그 값을 읽어 워크로드로 넘긴다. 색이 붙은 손잡이가 VirtualService 없이 목적지가 정해지는 자리다.</desc>

<title id="dt">다섯 걸음 중 둘은 일부러 늦추는 자리다</title><desc id="dd">이벤트 하나가 프록시에 닿기까지 네 참여자를 지난다. 색이 붙은 자리가 이벤트를 묶으려고 일부러 미루는 구간이고, 파란 자리가 동시에 처리하는 수를 제한하는 구간이다.</desc>
<rect width="1240" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 11-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">다섯 걸음 중 둘은 일부러 늦추는 자리다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">istiod 는 이 둘로 스스로를 과부하에서 지킵니다</text>

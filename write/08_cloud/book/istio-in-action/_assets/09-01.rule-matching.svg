<title id="dt">묶음 사이는 AND, 묶음 안은 OR</title><desc id="dd">규칙 하나가 발동하려면 출처 하나와 작업 하나가 맞고 조건이 전부 맞아야 한다. 색이 붙은 묶음만 전부 맞아야 하고 나머지 둘은 하나만 맞으면 된다. 작업 하나 안의 속성은 다시 전부 맞아야 한다.</desc>
<rect width="1200" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 09-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">묶음 사이는 AND, 묶음 안은 OR</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">from 을 빼면 출처를 따지지 않아 인증되지 않은 요청도 들어옵니다</text>
<line x1="600.0" y1="168" x2="600.0" y2="210" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="210.0" y1="210" x2="990.0" y2="210" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="210.0" y1="210" x2="210.0" y2="256" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="210.0" y1="308" x2="210.0" y2="380" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="600.0" y1="210" x2="600.0" y2="256" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="600.0" y1="308" x2="600.0" y2="380" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="990.0" y1="210" x2="990.0" y2="256" stroke="#F08A59" stroke-width="1.2"/>
<line x1="990.0" y1="308" x2="990.0" y2="380" stroke="#F08A59" stroke-width="1.2"/>
<rect x="450" y="116" width="300" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="600.0" y="138" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">rule 하나</text>
<text x="600.0" y="156" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">셋이 모두 맞아야 발동</text>
<rect x="60" y="256" width="300" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="210.0" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">from — 출처</text>
<text x="210.0" y="296" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">하나만 맞으면 된다 · OR</text>
<rect x="450" y="256" width="300" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="600.0" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">to — 작업</text>
<text x="600.0" y="296" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">하나만 맞으면 된다 · OR</text>
<rect x="840" y="256" width="300" height="52" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="990.0" y="278" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">when — 조건</text>
<text x="990.0" y="296" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">전부 맞아야 한다 · AND</text>
<rect x="60" y="380" width="300" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="76" y="408" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">principals: [ … /sa/webapp ]</text>
<text x="76" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">namespaces: ["default"]</text>
<text x="76" y="448" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">ipBlocks: [ CIDR ]</text>
<rect x="450" y="380" width="300" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="466" y="408" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">methods: ["GET"]  paths: ["/users*"]</text>
<text x="466" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">methods: ["POST"] paths: ["/data"]</text>
<text x="466" y="448" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">한 작업 안의 두 속성은 AND</text>
<rect x="840" y="380" width="300" height="84" rx="6" fill="#F08A590C" stroke="#F08A5988" stroke-width="1"/>
<text x="856" y="408" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">key: request.auth.claims[group]</text>
<text x="856" y="428" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">values: [beta-tester, admin, …]</text>
<text x="856" y="448" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">조건이 여럿이면 전부 AND</text>
<text x="32" y="530" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">앞의 둘은 상호 인증이 되어 있어야 작동한다 — 출처를 상대 SVID 에서 꺼내 오기 때문이다</text>
<text x="32" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">값 비교는 완전 일치 · 접두 · 접미 · 존재 확인 넷을 쓴다</text>
<line x1="12" y1="584" x2="1152" y2="584" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="606" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="596" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전부 맞아야 하는 묶음</text>
<rect x="300" y="596" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="322" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">하나만 맞으면 되는 묶음</text>
</svg>
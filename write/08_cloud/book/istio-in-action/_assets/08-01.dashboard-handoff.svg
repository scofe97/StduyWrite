<text x="1075.0" y="398" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">Home 에 목록이 뜬다</text>
<text x="32" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">공식 배포판에는 없다 — 소스나 grafana.com/orgs/istio/dashboards 에서 받는다</text>

<title id="dt">대시보드는 라벨 하나로 건너간다</title><desc id="dd">Istio 배포판에서 빠진 대시보드 JSON 여섯을 받아 컨피그맵으로 만들고, 라벨을 달면 Grafana 사이드카가 집어 간다. 색이 붙은 손잡이가 없으면 컨피그맵은 만들어져 있어도 화면에 나타나지 않는다.</desc>
<rect width="1240" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 08-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">대시보드는 라벨 하나로 건너간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">라벨을 감시하는 쪽은 Istio 가 아니라 kube-prometheus 스택의 Grafana 사이드카입니다</text>

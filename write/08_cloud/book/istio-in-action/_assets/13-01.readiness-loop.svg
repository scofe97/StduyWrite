<text x="332.0" y="700" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">istiod 가 넣고 뺀다</text>
<rect x="144" y="332" width="168" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="228.0" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">라우팅</text>
<text x="228.0" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">트래픽이 가거나 안 간다</text>
<text x="24" y="764" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">생존성 고리는 이 밖에서 따로 돈다 — 클라우드의 자동 복구는 실패한 기계를 새 인스턴스로 갈아 끼운다</text>
<text x="24" y="788" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저자의 어림 규칙 — 준비성 프로브가 항상 생존성 프로브보다 먼저 실패해야 한다</text>
<line x1="12" y1="806" x2="952" y2="806" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

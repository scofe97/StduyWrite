<title id="dt">한 바퀴가 기록을 고치고 그 기록이 다음 바퀴를 정한다</title><desc id="dd">istio-agent 가 애플리케이션을 찌르고, 상태가 바뀔 때만 istiod 에 알리고, istiod 가 엔드포인트를 넣거나 뺀다. 가운데 기록이 매 바퀴 갱신되며 색이 붙은 자리가 저자가 조건을 단 지점이다.</desc>
<rect width="1040" height="848" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 13-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">한 바퀴가 기록을 고치고 그 기록이 다음 바퀴를 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">생존성 고리는 이 밖에서 클라우드가 따로 돌립니다</text>

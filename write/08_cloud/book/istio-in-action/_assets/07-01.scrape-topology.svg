<title id="dt">Prometheus 는 두 리소스로 두 대상을 긁는다</title><desc id="dd">ServiceMonitor 는 istiod 를 서비스 셀렉터로 잡고, PodMonitor 는 모든 파드를 훑어 istio-proxy 컨테이너만 남긴다. 색이 붙은 경로가 사이드카를 잡기 위해 relabeling 이 필요한 쪽이다.</desc>

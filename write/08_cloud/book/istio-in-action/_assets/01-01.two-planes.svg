<title id="dt">설정은 위에서 내려오고 트래픽은 아래에서 흐른다</title><desc id="dd">프록시가 늘어나면 그 집단을 설정하고 관리하는 일이 새 문제가 된다. 여기서 두 평면이 갈린다. 색이 붙은 경로가 컨트롤 플레인이 하는 일이고, 아래 가로 흐름이 데이터 플레인이 하는 일이다.</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 01-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">설정은 위에서 내려오고 트래픽은 아래에서 흐른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">트래픽이 전부 메시를 지나므로 운영자가 명시적으로 통제할 수 있게 됩니다</text>

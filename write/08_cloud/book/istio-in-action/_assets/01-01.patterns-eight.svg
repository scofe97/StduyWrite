<title id="dt">여덟 패턴이 막으려는 것은 셋이다</title><desc id="dd">저자가 든 여덟을 무엇을 막는지로 묶었다. 색이 붙은 갈래만 저자가 단서를 답니다 — 재시도는 이미 과부하인 하류의 문제를 키울 수 있어 예산이라는 별도 패턴이 따라붙는다.</desc>
<rect width="1200" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 01-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">여덟 패턴이 막으려는 것은 셋이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">패킷이 아니라 메시지 계층에서 동작한다는 점이 하위 계층 구성요소와 다릅니다</text>
<line x1="580.0" y1="160" x2="580.0" y2="196" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="200.0" y1="196" x2="960.0" y2="196" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="200.0" y1="196" x2="200.0" y2="232" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="200.0" y1="280" x2="200.0" y2="336" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="580.0" y1="196" x2="580.0" y2="232" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="580.0" y1="280" x2="580.0" y2="336" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="960.0" y1="196" x2="960.0" y2="232" stroke="#F08A59" stroke-width="1.2"/>
<line x1="960.0" y1="280" x2="960.0" y2="336" stroke="#F08A59" stroke-width="1.2"/>
<rect x="420" y="112" width="320" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="580.0" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">애플리케이션 네트워킹</text>
<text x="580.0" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">패턴 여덟</text>
<rect x="40" y="232" width="320" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="200.0" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">어디로 보낼지 고른다</text>
<text x="200.0" y="270" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">routing</text>
<rect x="420" y="232" width="320" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="580.0" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">언제 포기할지 정한다</text>
<text x="580.0" y="270" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">give up</text>
<rect x="800" y="232" width="320" height="48" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="960.0" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">번지지 않게 막는다</text>
<text x="960.0" y="270" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">containment</text>
<rect x="40" y="336" width="320" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="56" y="364" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">클라이언트 사이드 로드밸런싱</text>
<text x="56" y="386" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">서비스 디스커버리</text>
<rect x="420" y="336" width="320" height="86" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="436" y="364" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">타임아웃</text>
<text x="436" y="386" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">데드라인</text>
<text x="436" y="408" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">재시도</text>
<rect x="800" y="336" width="320" height="86" rx="6" fill="#F08A590C" stroke="#F08A5988" stroke-width="1"/>
<text x="816" y="364" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">서킷 브레이킹</text>
<text x="816" y="386" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">벌크헤딩</text>
<text x="816" y="408" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">재시도 예산</text>
<text x="32" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">재시도는 두 갈래에 걸친다 — 다시 보내는 일은 가운데, 그 횟수를 묶는 예산은 오른쪽이다</text>
<text x="32" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이미 과부하라면 재시도가 하류 문제를 키우고, 이전 시도가 실패했다고 확신할 수도 없다</text>
<line x1="12" y1="560" x2="1152" y2="560" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="582" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="572" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">저자가 단서를 다는 갈래</text>
<rect x="313" y="572" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="335" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">나머지 갈래</text>
</svg>
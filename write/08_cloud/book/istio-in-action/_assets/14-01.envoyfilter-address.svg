<title id="dt">좌표를 여섯 번 좁혀야 한 자리가 정해진다</title><desc id="dd">네임스페이스에서 시작해 라벨 · 방향 · 포트 · 네트워크 필터 · 서브필터로 내려가면 패치할 자리 하나가 남는다. 색이 붙은 마디가 새 필터가 실제로 들어가는 곳이다.</desc>
<rect width="1240" height="792" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 14-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">좌표를 여섯 번 좁혀야 한 자리가 정해진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자가 이 리소스를 쓰려면 Envoy 이름 규약에 익숙해야 한다고 적는 이유입니다</text>
<rect x="220" y="128" width="620" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="240" y="153" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">NAMESPACE</text>
<text x="240" y="173" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">istioinaction</text>
<text x="864" y="164" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">생략하면 이 네임스페이스의 모든 워크로드</text>

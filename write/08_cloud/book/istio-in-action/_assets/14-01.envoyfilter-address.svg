<rect x="220" y="632" width="620" height="60" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="240" y="657" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#F08A59">patch.operation</text>
<text x="240" y="677" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">INSERT_BEFORE  -&gt;  envoy.filters.http.tap</text>
<text x="864" y="668" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#F08A59">라우터 바로 앞에 끼운다</text>
<text x="32" y="728" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">저자의 경고 셋 — 하위 호환을 가정하지 말 것 · 다른 Istio 리소스가 전부 번역된 뒤에 적용됨 · 잘못 쓰면 데이터 플레인 전체가 내려감</text>
<line x1="12" y1="748" x2="1192" y2="748" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="770" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

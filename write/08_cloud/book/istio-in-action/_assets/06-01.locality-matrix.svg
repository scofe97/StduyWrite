<title id="dt">네 조건에서 10회 호출이 간 곳</title><desc id="dd">같은 호출 열 번을 네 조건에서 반복한 결과. 위치 라벨만으로는 두 영역에 갈리고, 이상치 감지를 더해야 같은 영역으로 모인다. 로컬이 100% 실패하면 이웃 영역으로 전부 넘어가고, 가중 분배를 주면 70/30 에 가깝게 나뉜다.</desc>

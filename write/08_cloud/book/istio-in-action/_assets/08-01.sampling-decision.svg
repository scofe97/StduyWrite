<title id="dt">이 요청이 추적될지 정해지는 순서</title><desc id="dd">저자가 세 자리에 나눠 적은 규칙을 요청 하나의 관점으로 이었다. 색이 붙은 갈래가 샘플링을 낮게 두고도 원하는 요청만 붙잡는 손잡이다. 저자가 이 순서를 한 줄로 적은 곳은 없다.</desc>
<rect width="1000" height="912" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 08-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이 요청이 추적될지 정해지는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">demo 프로파일은 100% 입니다 — 운영에 그대로 두면 안 되는 값입니다</text>
<rect x="230" y="116" width="224" height="44" rx="20" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="342.0" y="143.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">요청이 프록시에 닿는다</text>
<path d="M 210 240 L 360 188 L 510 240 L 360 292 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="360" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">추적 헤더가</text>
<text x="360" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">이미 붙어 있나</text>
<rect x="680" y="212" width="260" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="810.0" y="245.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">진행 중 트레이스로 본다</text>
<rect x="210" y="320" width="260" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="340.0" y="353.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">새 트레이스를 시작한다</text>
<circle cx="360" cy="402" r="4" fill="#8B98A9"/>
<path d="M 210 496 L 360 444 L 510 496 L 360 548 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="360" y="492" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">x-envoy-force-trace 가</text>
<text x="360" y="512" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">내부 요청에 실렸나</text>

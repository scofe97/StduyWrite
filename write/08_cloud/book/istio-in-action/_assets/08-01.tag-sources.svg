<text x="32" y="474" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">7 장의 차원은 시계열 개수를 늘렸고, 여기의 태그는 스팬 저장소 크기와 검색 비용을 늘린다</text>
<text x="32" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저자는 이 대비를 하지 않는다 — 이 줄은 노트의 읽기다</text>

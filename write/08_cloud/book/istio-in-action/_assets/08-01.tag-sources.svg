<title id="dt">태그 값이 오는 곳은 셋이다</title><desc id="dd">customTags 아래에 태그 이름을 두고, 그 값을 어디서 끌어올지 고른다. 색이 붙은 갈래만 값의 가짓수를 우리가 정하지 못한다. 저자는 세 갈래를 나열할 뿐 이 차이를 짚지 않는다.</desc>

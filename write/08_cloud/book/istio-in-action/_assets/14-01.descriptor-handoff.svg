<title id="dt">서버는 헤더를 모르고 값만 안다</title><desc id="dd">데이터 플레인이 헤더를 디스크립터 값으로 바꿔 보내고, 서버는 그 값에 붙은 한도만 안다. 색이 붙은 가운데 열이 두 설정이 만나는 유일한 자리이고, 여기가 어긋나면 아무것도 세어지지 않는다.</desc>
<rect width="1000" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 14-01 §5</text>

<title id="dt">여섯 갈래가 호출자에게는 한 증상이다</title><desc id="dd">저자가 든 원인 후보 여섯을 성격별로 묶었다. 호출자는 이 중 어느 것인지 가릴 수 없고, 그것이 이 장의 설계를 바꾼다. 확정된 뼈대가 없다는 것이 이 그림의 요점이다.</desc>
<rect width="1240" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 01-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">여섯 갈래가 호출자에게는 한 증상이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">구분할 수 없으므로 원인별 대응이 아니라 증상에 대한 방어책이 필요해집니다</text>
<path d="M 96 320 L 896 320" fill="none" stroke="#F5F5F3" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="576" y1="320" x2="480" y2="152" stroke="#8B98A9" stroke-width="1.1"/>
<rect x="432.0" y="126" width="96" height="26" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="480" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">하류 서비스</text>
<line x1="543.36" y1="262.88" x2="575.36" y2="262.88" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="583.36" y="266.88" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">과부하로 느려짐</text>
<line x1="514.56" y1="212.48000000000002" x2="546.56" y2="212.48000000000002" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="554.56" y="216.48000000000002" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">서비스에 버그</text>
<line x1="408" y1="320" x2="312" y2="488" stroke="#8B98A9" stroke-width="1.1"/>
<rect x="258.0" y="488" width="108" height="26" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="312" y="506" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">네트워크 경로</text>
<line x1="375.36" y1="377.12" x2="407.36" y2="377.12" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="415.36" y="381.12" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">방화벽이 지연시킴</text>
<line x1="346.56" y1="427.52" x2="378.56" y2="427.52" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="386.56" y="431.52" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">혼잡으로 느려짐</text>
<line x1="240" y1="320" x2="144" y2="152" stroke="#8B98A9" stroke-width="1.1"/>
<rect x="108.0" y="126" width="72" height="26" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="144" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">하드웨어</text>
<line x1="207.36" y1="262.88" x2="239.36" y2="262.88" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="247.36" y="266.88" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">장비 장애로 우회 중</text>
<line x1="178.56" y1="212.48000000000002" x2="210.56" y2="212.48000000000002" stroke="#5E6B7E" stroke-width="1.0"/>
<text x="218.56" y="216.48000000000002" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">NIC 장애</text>
<rect x="904" y="274" width="292" height="92" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="1050" y="304" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">Customer 응답이</text>
<text x="1050" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">심하게 느려졌다</text>
<text x="1050" y="350" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">Preference 가 관찰한 것</text>
<text x="32" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">저자가 못 박는 문장 — 클라우드에서는 인프라가 일시적이며 때때로 사용 불가능하다는 가정 위에서 짓는다</text>
<text x="32" y="576" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Preference 입장에서는 이것이 Customer 의 장애인지조차 판별되지 않는다</text>
<line x1="12" y1="596" x2="1192" y2="596" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="618" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="608" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">관찰된 결과</text>
<rect x="222" y="608" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="244" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">확정할 수 없는 원인 갈래</text>
</svg>
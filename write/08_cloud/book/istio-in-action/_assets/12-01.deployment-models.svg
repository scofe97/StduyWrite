<title id="dt">컨트롤 플레인을 어디에 몇 개 둘까</title><desc id="dd">세 모델은 컨트롤 플레인의 자리와 개수만 다르다. 저자가 자원과 가용성을 맞대어 비교하는 것은 앞의 둘뿐이고, 세 번째는 누가 운영하느냐가 다른 모델이다. 색이 붙은 모델이 저자가 실습에서 고른 쪽이다.</desc>
<rect width="1000" height="560" fill="#0D1117"/>

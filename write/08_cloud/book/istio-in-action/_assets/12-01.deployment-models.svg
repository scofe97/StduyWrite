<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">컨트롤 플레인을 어디에 몇 개 둘까</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">고를 근거는 기술이 아니라 몇 분의 다운타임을 견딜 수 있느냐입니다</text>

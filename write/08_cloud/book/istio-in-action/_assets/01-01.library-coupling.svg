<title id="dt">하나를 고르면 나머지가 딸려 온다</title><desc id="dd">서킷 브레이킹을 쓰려고 Hystrix 를 고르면 Ribbon 이 필요하고, Ribbon 은 Eureka 를 필요로 한다. 그리고 셋 모두 같은 런타임 전제 하나로 수렴한다. 색이 붙은 노드가 그 수렴점이다.</desc>

<title id="dt">아홉 가지를 한 컴포넌트에 맡기는 결정</title><desc id="dd">저자가 든 컨트롤 플레인의 책임 아홉을 성격별로 묶었다. 대부분이 istiod 라는 단일 컴포넌트에 구현돼 있다. 색이 붙은 묶음이 1 장의 단점 셋 중 "또 하나의 계층"이 무엇을 뜻하는지 보이는 자리다.</desc>
<rect width="1240" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 02-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">아홉 가지를 한 컴포넌트에 맡기는 결정</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">묶음 이름은 노트가 붙인 것이고 잎 아홉은 저자의 목록 그대로입니다</text>
<line x1="620.0" y1="160" x2="620.0" y2="196" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="170.0" y1="196" x2="1070.0" y2="196" stroke="#8B98A9" stroke-width="1.0"/>

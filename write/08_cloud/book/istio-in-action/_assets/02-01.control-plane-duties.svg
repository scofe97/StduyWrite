<line x1="470.0" y1="196" x2="470.0" y2="232" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="470.0" y1="280" x2="470.0" y2="336" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="770.0" y1="196" x2="770.0" y2="232" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="770.0" y1="280" x2="770.0" y2="336" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="1070.0" y1="196" x2="1070.0" y2="232" stroke="#F08A59" stroke-width="1.2"/>
<line x1="1070.0" y1="280" x2="1070.0" y2="336" stroke="#F08A59" stroke-width="1.2"/>
<rect x="486" y="112" width="268" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="620.0" y="132" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">istiod</text>
<text x="620.0" y="150" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">대부분이 여기 한 컴포넌트에</text>
<rect x="36" y="232" width="268" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="170.0" y="252" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">설정을 받는 자리</text>
<text x="170.0" y="270" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">API</text>
<rect x="336" y="232" width="268" height="48" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

<title id="dt">설정에는 남아 있고 클러스터에는 없다</title><desc id="dd">왼쪽은 실제 클러스터, 오른쪽은 프록시가 들고 있는 엔드포인트 목록이다. 색이 붙은 줄이 이미 사라졌는데도 목록에 남아 있는 항목이고, 그리로 간 요청이 실패한다.</desc>
<rect width="1000" height="616" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 11-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">설정에는 남아 있고 클러스터에는 없다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">짧은 지연은 재시도와 이상값 감지가 덮지만 몇 초를 넘기면 최종 사용자에 닿습니다</text>
<rect x="20" y="128" width="432" height="200" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
<rect x="32" y="132" width="100" height="18" rx="2" fill="#0D1117"/>
<text x="82.0" y="145" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">실제 클러스터</text>
<rect x="552" y="128" width="432" height="300" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
<rect x="564" y="132" width="244" height="18" rx="2" fill="#0D1117"/>
<text x="686.0" y="145" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">프록시가 들고 있는 엔드포인트 목록</text>
<rect x="40" y="160" width="392" height="60" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<rect x="52" y="172" width="44" height="14" rx="2" fill="#F5F5F314"/>
<text x="74" y="183" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">POD</text>

<rect x="580" y="248" width="44" height="14" rx="2" fill="#F5F5F314"/>
<text x="602" y="259" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">EP</text>
<text x="634" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">catalog-2 의 주소</text>
<text x="634" y="278" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">가리키는 파드가 없다</text>
<rect x="568" y="336" width="392" height="60" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>

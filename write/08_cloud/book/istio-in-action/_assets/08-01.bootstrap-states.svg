<title id="dt">갈아 끼운 뒤 되돌아오는 것까지가 저자의 절차</title><desc id="dd">저자는 커스텀 부트스트랩을 적용해 보인 다음 그 설정이 추적을 깨뜨린다고 밝히고 복구 명령을 붙인다. 가운데 상태에서 손대지 않은 필드 하나가 사라지는 것이 이 절의 관찰이다.</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 08-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">갈아 끼운 뒤 되돌아오는 것까지가 저자의 절차</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">typedConfig 는 Any 로 감싼 블록이라 병합이 필드 단위로 내려가지 않습니다</text>

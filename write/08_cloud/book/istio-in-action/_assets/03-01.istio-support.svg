<title id="dt">Envoy를 부양하는 것 — 저자가 든 예 넷</title><desc id="dd">Kubernetes API 에서 Istio 설정과 서비스 레지스트리를 읽은 istiod 가 xDS 로 설정을, CA 로 인증서를 Envoy 사이드카에 내려보낸다. Envoy 가 뿜는 메트릭과 스팬은 Prometheus 와 Jaeger/Zipkin 으로 간다.</desc>
<rect width="1080" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 03-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Envoy를 부양하는 것 — 저자가 든 예 넷</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">istiod가 설정·디스커버리·인증서를 대 주고, 텔레메트리는 어디로 보낼지를 Istio가 설정한다</text>

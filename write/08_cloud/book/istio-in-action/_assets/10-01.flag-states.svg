<path d="M 928 168.0 L 1002 168.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="272.0" y="142.0" width="100" height="18" rx="3" fill="#0D1117"/>
<text x="322.0" y="155.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">라우트가 맞는다</text>
<rect x="609.5" y="142.0" width="89" height="18" rx="3" fill="#0D1117"/>
<text x="654.0" y="155.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">커넥션이 선다</text>

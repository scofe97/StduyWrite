<title id="dt">플래그는 요청이 어디서 끝났는지를 적는다</title><desc id="dd">요청이 프록시 안에서 지나는 자리마다 실패로 끝날 수 있고, 액세스 로그의 두 글자가 그 자리를 지목한다. 색이 붙은 상태가 이 장의 504 이고, 그 두 글자 덕에 앱이 아니라 프록시가 끊었음을 안다.</desc>
<rect width="1240" height="624" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 10-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">플래그는 요청이 어디서 끝났는지를 적는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">UT 가 있으면 타임아웃을 판정한 쪽이 애플리케이션이 아니라 프록시입니다</text>
<circle cx="24" cy="168.0" r="6" fill="#F5F5F3"/>

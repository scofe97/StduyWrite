<rect x="20.0" y="400" width="176" height="60" rx="8" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="108" y="426" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">NR</text>
<text x="108" y="446" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#8B98A9">no route configured</text>
<rect x="60.0" y="374" width="96" height="18" rx="3" fill="#0D1117"/>
<text x="108" y="387" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">라우트가 없다</text>
<rect x="216.0" y="400" width="176" height="60" rx="8" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="304" y="426" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">UH</text>
<text x="304" y="446" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#8B98A9">no healthy upstream</text>
<rect x="226.0" y="374" width="156" height="18" rx="3" fill="#0D1117"/>
<text x="304" y="387" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">건강한 워크로드가 없다</text>
<rect x="412.0" y="400" width="176" height="60" rx="8" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="500" y="426" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">UC</text>
<text x="500" y="446" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#8B98A9">upstream connection termination</text>
<rect x="440.0" y="374" width="120" height="18" rx="3" fill="#0D1117"/>
<text x="500" y="387" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">업스트림이 끊는다</text>
<rect x="608.0" y="400" width="176" height="60" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="696" y="426" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">UT</text>
<text x="696" y="446" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#8B98A9">upstream request timeout</text>
<rect x="630.0" y="374" width="132" height="18" rx="3" fill="#0D1117"/>
<text x="696" y="387" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">제한 시간을 넘긴다</text>
<rect x="804.0" y="400" width="176" height="60" rx="8" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="892" y="426" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">DC</text>
<text x="892" y="446" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#8B98A9">downstream connection termination</text>
<rect x="826.0" y="374" width="132" height="18" rx="3" fill="#0D1117"/>
<text x="892" y="387" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F0616D">다운스트림이 끊는다</text>
<text x="32" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">같은 요청이라도 어느 프록시가 적었는지에 따라 플래그가 갈린다 — 끊은 쪽은 UT, 끊긴 쪽은 DC 다</text>
<text x="32" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">전체 목록은 Envoy 공식 문서에 있고 저자는 자주 보는 다섯만 든다</text>

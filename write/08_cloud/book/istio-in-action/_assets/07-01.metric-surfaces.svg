<title id="dt">메트릭을 어디에 묻고 무엇을 돌려받는가</title><desc id="dd">같은 프록시가 포트와 경로를 여럿 열어 두고, 같은 계열의 값을 다른 형식으로 두 번 낸다. 색이 붙은 잎이 Prometheus 가 실제로 긁어 가는 곳이다.</desc>
<rect width="1000" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 07-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">메트릭을 어디에 묻고 무엇을 돌려받는가</text>

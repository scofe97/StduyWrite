<text x="28" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">저자의 예제에서는 애플리케이션과 워크로드가 사실상 같아 차이가 드러나지 않는다</text>
<text x="28" y="544" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그럼에도 구분을 적어 두는 이유는 왼쪽 메뉴와 검증 대상이 이 단위 위에 놓이기 때문이다</text>
<line x1="12" y1="572" x2="952" y2="572" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="594" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="584" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="594" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저자가 정의로 못 박은 단위</text>

<title id="dt">Kiali 는 두 단위로 세고 화면도 그렇게 갈린다</title><desc id="dd">워크로드는 동일한 복제본으로 배포되는 바이너리 하나이고, 애플리케이션은 그런 워크로드들과 서비스·설정을 묶은 것이다. 예제에서는 둘이 사실상 같아 보이지만 왼쪽 메뉴가 이 두 단위로 나뉘어 있다.</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 08-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Kiali 는 두 단위로 세고 화면도 그렇게 갈린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">그래프의 노드도 이 단위 위에 놓입니다 — 무엇을 세는지가 무엇이 보이는지를 정합니다</text>
<rect x="84" y="128" width="828" height="372" rx="8" fill="#F5F5F304" stroke="#F5F5F330" stroke-width="1.0"/>
<rect x="104" y="121" width="166" height="14" fill="#0D1117"/>
<text x="112" y="131" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">NAMESPACE · ISTIOINACTION</text>
<text x="112" y="158" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">개요 화면이 세는 가장 바깥 단위</text>

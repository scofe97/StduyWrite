<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칩은 다루는 절, 색은 문제(파랑)·대응(초록)·핵심 분리(코랄)·갈래(노랑)·흐름 밖 판단(회색)이며 왼쪽에서 오른쪽으로 읽습니다.</text>

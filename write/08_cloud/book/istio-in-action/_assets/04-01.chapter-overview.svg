<title id="dt">문을 여는 일과 길을 내는 일을 가른다 — 읽는 순서</title><desc id="dd">4장 노트의 절 여섯을 읽는 순서로 이은 지도. 앞 둘이 진입점과 두 리소스를 놓고, 셋째에서 L4·L5 와 L7 을 가른 이유가 서며, 뒤 셋이 TLS·TCP·운영 판단이다.</desc>
<rect width="1240" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 04-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">문을 여는 일과 길을 내는 일을 가른다 — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">셋째 칸에서 이 장의 논지가 서고, 뒤 세 칸은 그 문에 무엇을 다는가입니다</text>

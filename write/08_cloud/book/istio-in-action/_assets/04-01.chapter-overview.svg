<title id="dt">밖의 요청이 인그레스 게이트웨이를 거쳐 서비스에 닿기까지</title><desc id="dd">클러스터 밖 요청이 가상 IP·가상 호스팅을 거쳐 인그레스 게이트웨이(Envoy)에 닿는다. Gateway가 포트·프로토콜·TLS 모드로 무엇을 받아들일지 정하고, VirtualService가 호스트·경로·SNI로 목적지 서비스를 고른다.</desc>

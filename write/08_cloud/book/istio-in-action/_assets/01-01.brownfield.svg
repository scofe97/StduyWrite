<title id="dt">프록시가 밖에 살아서 기존 시스템도 들어온다</title><desc id="dd">저자는 Istio 가 마이크로서비스를 겨냥하지만 거기 한정되지 않는다고 명시한다. 근거는 프록시가 애플리케이션 밖에 산다는 것 하나다. 색이 붙은 자리가 코드를 바꾸지 않고 편입되는 쪽이다.</desc>
<rect width="1200" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 01-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프록시가 밖에 살아서 기존 시스템도 들어온다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">라이브러리로 이미 레질리언스를 구현한 옛 서비스도 같은 방식으로 들어옵니다</text>
<rect x="56" y="148" width="500" height="100" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="68" y="141" width="72" height="14" fill="#0D1117"/>
<text x="74" y="151" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">KUBERNETES</text>
<rect x="56" y="292" width="500" height="100" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="68" y="285" width="102" height="14" fill="#0D1117"/>
<text x="74" y="295" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">VIRTUAL MACHINE</text>
<rect x="640" y="148" width="504" height="244" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="652" y="141" width="66" height="14" fill="#0D1117"/>
<text x="658" y="151" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">SAME MESH</text>
<rect x="80" y="176" width="452" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="92" y="188" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="112" y="199" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">POD</text>
<text x="142" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">새 마이크로서비스</text>
<text x="142" y="218" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">app + istio-proxy</text>
<rect x="80" y="320" width="452" height="60" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<rect x="92" y="332" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="112" y="343" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">VM</text>
<text x="142" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">모놀리스</text>
<text x="142" y="362" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">app + istio-proxy</text>
<rect x="664" y="176" width="456" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="676" y="188" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="696" y="199" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">CP</text>
<text x="726" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">컨트롤 플레인</text>
<text x="726" y="218" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">설정 · 아이덴티티 · 텔레메트리</text>
<rect x="664" y="320" width="456" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="676" y="332" width="40" height="14" rx="2" fill="#F5F5F314"/>
<text x="696" y="343" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">OPS</text>
<text x="726" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">얻는 것</text>
<text x="726" y="362" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">요청 메트릭 · 정책 강제</text>
<path d="M 532 206 L 620 206 L 620 206 L 660 206" fill="none" stroke="#6A95D8" stroke-width="1.2" marker-end="url(#info)"/>
<path d="M 532 350 L 620 350 L 620 350 L 660 350" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="600" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">같은 방식</text>
<text x="600" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">코드 변경 없이</text>
<text x="32" y="448" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">모놀리스에서 최소한 얻는 것 — 사용량 · 지연 · 처리량 · 실패 특성</text>
<text x="32" y="472" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저자가 든 정책 예 — "클라우드 서비스는 온프레미스 애플리케이션과 통신하거나 그 데이터를 쓸 수 없다"</text>
<text x="32" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">옛 서비스에 서킷 브레이커가 남아 있어도 더 제한적인 쪽이 이긴다 — 다만 타임아웃과 재시도는 충돌할 수 있다</text>
<line x1="12" y1="536" x2="1152" y2="536" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="558" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="548" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">코드를 바꾸지 않고 편입되는 자리</text>
<rect x="378" y="548" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="400" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">메시가 원래 겨냥한 쪽</text>
</svg>
<title id="dt">새 버전의 노출이 줄어드는 사다리</title><desc id="dd">실사용자 트래픽에 닿는 위험이 배포 분리(§1) → 다크 런치(§2) → 가중치 전환과 Flagger(§3) → 미러링(§4) 순으로 줄어든다. 메시를 떠나는 트래픽(§5)은 사다리 밖에서 기본 차단과 허용을 다룬다.</desc>
<rect width="960" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 05-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">새 버전의 노출이 줄어드는 사다리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">아래로 내려갈수록 실사용자에게 닿는 위험이 줄고, §4 미러링에서 응답 영향이 0 이 됩니다</text>

<title id="dt">필터 안에 또 필터가 있고 확장은 안쪽에 꽂힌다</title><desc id="dd">리스너가 바이트를 읽어 네트워크 필터 체인으로 넘기고, 그중 HCM 이 바이트를 HTTP 로 바꾼다. HCM 자신도 필터 체인을 품으며, 이 장의 확장이 전부 그 안쪽 체인에 들어간다.</desc>
<rect width="1000" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 14-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">필터 안에 또 필터가 있고 확장은 안쪽에 꽂힌다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">안쪽 체인은 반드시 라우터 필터로 끝나야 합니다</text>
<rect x="48" y="132" width="908" height="396" rx="8" fill="#F5F5F304" stroke="#F5F5F330" stroke-width="1.0"/>
<rect x="68" y="125" width="172" height="14" fill="#0D1117"/>
<text x="76" y="135" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">LISTENER · 포트를 열고 바이트를 읽는다</text>
<text x="76" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Envoy 는 L3/L4 프록시다</text>
<rect x="84" y="196" width="832" height="296" rx="8" fill="#F5F5F307" stroke="#8B98A9" stroke-width="1.0"/>
<rect x="104" y="189" width="136" height="14" fill="#0D1117"/>
<text x="112" y="199" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">NETWORK FILTER CHAIN</text>
<text x="112" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바이트 스트림을 인코딩 · 디코딩한다 — MongoDB · Redis · Thrift · Kafka</text>
<rect x="120" y="260" width="760" height="196" rx="8" fill="#F5F5F309" stroke="#F5F5F355" stroke-width="1.0"/>
<rect x="140" y="253" width="154" height="14" fill="#0D1117"/>
<text x="148" y="263" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">HTTP CONNECTION MANAGER</text>
<text x="148" y="290" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">바이트를 HTTP 헤더 · 본문 · 트레일러로 바꾼다</text>
<rect x="156" y="324" width="688" height="108" rx="8" fill="#F08A590E" stroke="#F08A59" stroke-width="1.4"/>
<rect x="176" y="317" width="118" height="14" fill="#0D1117"/>
<text x="184" y="327" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">HTTP FILTER CHAIN</text>
<text x="184" y="354" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">요청 위에서 도는 필터들 — 이 장의 확장이 꽂히는 자리</text>
<rect x="212" y="364" width="116" height="44" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="270.0" y="384" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">CORS · CSRF</text>
<text x="270.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기본 제공</text>

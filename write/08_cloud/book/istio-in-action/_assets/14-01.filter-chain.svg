<text x="430.0" y="384" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">RateLimit</text>
<text x="430.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기본 제공</text>
<path d="M 488 386.0 H 530" fill="none" stroke="#8B98A9" stroke-width="1.0" marker-end="url(#ar)"/>
<rect x="532" y="364" width="116" height="44" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="590.0" y="384" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">Lua</text>
<text x="590.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기본 제공</text>
<path d="M 648 386.0 H 690" fill="none" stroke="#8B98A9" stroke-width="1.0" marker-end="url(#ar)"/>
<rect x="692" y="364" width="116" height="44" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="750.0" y="384" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">Wasm</text>
<text x="750.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">기본 제공</text>
<path d="M 808 386.0 H 850" fill="none" stroke="#8B98A9" stroke-width="1.0" marker-end="url(#ar)"/>
<rect x="852" y="364" width="116" height="44" rx="4" fill="#F08A591F" stroke="#F08A59" stroke-width="1.2"/>
<text x="910.0" y="384" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">Router</text>
<text x="910.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">종단 필터</text>
<text x="28" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">안쪽 상자 넷의 배열 순서는 설정하기 나름이다 — 원문이 정하는 것은 라우터가 마지막이어야 한다는 규칙 하나뿐이다</text>
<text x="28" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">HCM 이 함께 맡는 것 — 액세스 로깅 · 요청 재시도 · 헤더 조작 · 헤더와 경로 접두사 기반 라우팅</text>
<line x1="12" y1="610" x2="952" y2="610" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="632" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="622" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="632" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">확장이 꽂히는 안쪽 체인</text>
<rect x="313" y="622" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="335" y="632" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그 위를 감싸는 층</text>

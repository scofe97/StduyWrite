<title id="dt">관측 가능성 안에서 Istio 가 맡는 자리</title><desc id="dd">저자는 모니터링을 관측 가능성의 부분집합으로 두고, Istio 는 관측 가능성의 한 부분인 애플리케이션 수준 네트워크 계측을 돕는다고 적는다. 색이 붙은 겹침이 저자가 요약에서 짚은 자리다.</desc>
<rect width="1000" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 07-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">관측 가능성 안에서 Istio 가 맡는 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">모니터링은 아는 나쁜 상태를 봅니다. 관측 가능성은 모르는 실패를 전제합니다</text>
<circle cx="420" cy="316" r="184" fill="#8B98A90A" stroke="#8B98A9" stroke-width="1"/>
<circle cx="356" cy="316" r="104" fill="#5E6B7E0A" stroke="#5E6B7E" stroke-width="1"/>
<circle cx="476" cy="316" r="100" fill="#F5F5F30A" stroke="#F5F5F3" stroke-width="1"/>
<path d="M 419.4 233.6 A 104 104 0 0 1 419.4 398.4 A 100 100 0 0 1 419.4 233.6 Z" fill="#F08A591F" stroke="#F08A59" stroke-width="1.4"/>
<text x="420" y="104" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">OBSERVABILITY</text>
<text x="420" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#8B98A9">관측 가능성</text>
<text x="264" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">모니터링</text>
<path d="M 292 172 L 292 240 L 326 240" fill="none" stroke="#5E6B7E" stroke-width="0.8" marker-end="url(#soft)"/>
<text x="700" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Istio 데이터 플레인 계측</text>
<text x="700" y="180" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">envoy sidecar</text>
<path d="M 694 172 L 694 272 L 560 272" fill="none" stroke="#F5F5F3" stroke-width="0.8" marker-end="url(#ar)"/>
<text x="420" y="172" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앱 자체 계측</text>
<text x="420" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">신호 수집 인프라와 저장소</text>
<text x="420" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터를 헤집어 보는 도구</text>
<text x="312" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">아는 나쁜 상태</text>
<text x="312" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">임계를 정해 감시</text>
<text x="419" y="310" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">임계 감시</text>
<text x="419" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">메트릭</text>
<text x="517" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">나중에 더한 축</text>
<text x="517" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F5F5F3">미리 몰랐던 것</text>
<line x1="12" y1="524" x2="952" y2="524" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="546" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="536" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저자가 요약에서 짚은 겹침</text>
<rect x="326" y="536" width="14" height="12" rx="2" fill="#F5F5F322" stroke="#F5F5F3" stroke-width="1.1"/>
<text x="348" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Istio 가 채우는 부분</text>

<title id="dt">저자가 든 세 수준 중 손잡이가 있는 것은 둘</title><desc id="dd">추적 백엔드 · 샘플링 · 커스텀 태그가 모두 같은 블록에 들어간다. 넣는 자리는 메시 전역 설정과 워크로드 애노테이션 둘이다. 가운데 네임스페이스 층은 저자가 다루지 않겠다고 한 API 에만 있다.</desc>
<rect width="1160" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 08-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">저자가 든 세 수준 중 손잡이가 있는 것은 둘</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">좁은 쪽이 이기는지는 저자가 적지 않습니다 — 계층 규칙은 Telemetry API 문서에 있습니다</text>
<rect x="200" y="136" width="880" height="72" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="220" y="178" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">MESH</text>
<text x="332" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">메시 전역</text>
<text x="500" y="178" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">MeshConfig · defaultConfig.tracing</text>
<text x="1060" y="178" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">istio-system 의 istio 컨피그맵</text>
<rect x="200" y="208" width="880" height="72" rx="4" fill="#F5F5F304" stroke="#8B98A9" stroke-width="1.0" stroke-dasharray="5 5"/>
<text x="220" y="250" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">NS</text>
<text x="332" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#5E6B7E">네임스페이스</text>
<text x="500" y="250" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">저자의 두 손잡이에 없다</text>
<text x="1060" y="250" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">Telemetry API 에만 있는 수준</text>
<rect x="200" y="280" width="880" height="72" rx="4" fill="#F08A5910" stroke="#F08A59" stroke-width="1.4"/>
<text x="220" y="322" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">WORKLOAD</text>
<text x="332" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">워크로드</text>
<text x="500" y="322" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">proxy.istio.io/config</text>
<text x="1060" y="322" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">spec.template.metadata.annotations</text>
<path d="M 156 144 L 156 344" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="140" y="160" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">적용 범위</text>
<text x="140" y="328" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">좁아진다</text>
<text x="32" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">백엔드 주소 · sampling · customTags 가 전부 이 블록 하나에 들어간다</text>
<text x="32" y="444" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">설치 시점의 IstioOperator 도 결국 같은 MeshConfig 를 쓰므로 자리는 늘지 않는다</text>
<line x1="12" y1="476" x2="1112" y2="476" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="498" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="488" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 장이 주로 쓰는 자리</text>
<rect x="313" y="488" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="335" y="498" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">손잡이가 없는 층</text>
</svg>
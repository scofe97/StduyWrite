<title id="dt">리디렉션 주체를 노드로 옮겨 파드 특권을 없앤다</title><desc id="dd">왼쪽은 파드마다 istio-init 컨테이너가 NET_ADMIN·NET_RAW 권한으로 규칙을 세우는 배치이고, 오른쪽은 노드마다 도는 Istio CNI 데몬셋 파드가 대신 세우는 배치다.</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">리디렉션 주체를 노드로 옮겨 파드 특권을 없앤다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">멀티테넌트 보안 기준(다른 테넌트를 해칠 수 없음)을 지키면서 리디렉션을 수행하는 구조 변화입니다.</text>
<text x="236" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">ISTIO-INIT 배치</text>
<text x="724" y="114" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">ISTIO CNI 배치</text>
<rect x="24" y="132" width="424" height="256" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="154" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">NODE</text>
<rect x="512" y="132" width="424" height="256" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<text x="528" y="154" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">NODE</text>
<rect x="44" y="172" width="180" height="68" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="134.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">파드 A</text>
<text x="134.0" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">istio-init 포함</text>
<rect x="248" y="172" width="180" height="68" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="338.0" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">파드 B</text>
<text x="338.0" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">istio-init 포함</text>

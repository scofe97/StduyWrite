<title id="dt">istiod 포트의 경계와 15010·15012 보안 분기</title><desc id="dd">워크로드·API 서버·운영 도구가 istiod 파드의 여섯 포트에 붙는 경계와 역할을 보인다. 같은 xDS 를 여는 15010 과 15012 중 평문인 15010 은 권하지 않고 15012 를 쓴다.</desc>

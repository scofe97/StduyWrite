<text x="82" y="207" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">APP</text>
<text x="114" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">애플리케이션 컨테이너</text>
<text x="114" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">우리 코드</text>
<rect x="48" y="268" width="440" height="60" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<rect x="60" y="280" width="44" height="14" rx="2" fill="#F5F5F314"/>
<text x="82" y="291" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">INIT</text>
<text x="114" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">istio-init</text>
<text x="114" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">먼저 돌아 Iptable 규칙을 세운다</text>
<rect x="48" y="348" width="440" height="80" rx="6" fill="#F5F5F307" stroke="#F5F5F344" stroke-width="1"/>
<text x="64" y="366" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">SIDECAR CONTAINER</text>
<text x="64" y="392" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">istio-agent</text>
<text x="64" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Envoy 를 띄우고 신원을 부트스트랩한다</text>
<text x="300" y="392" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">envoy</text>
<text x="300" y="412" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">에이전트가 설정을 넣는다</text>
<rect x="288" y="360" width="188" height="60" rx="4" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<path d="M 276 392 L 284 392" fill="none" stroke="#8B98A9" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="580" y="184" width="372" height="60" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<rect x="592" y="196" width="44" height="14" rx="2" fill="#F5F5F314"/>
<text x="614" y="207" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#F5F5F3">CP</text>
<text x="646" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">istiod</text>
<text x="646" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정과 인증서를 내려보낸다</text>
<path d="M 488 398 L 528 398 L 528 214 L 576 214" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)" stroke-dasharray="5 4"/>
<text x="534" y="300" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">양방향 연결</text>
<text x="534" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">최신 설정을 받는다</text>
<path d="M 268 268 L 268 250" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="284" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">트래픽을 프록시로 돌린다</text>
<text x="28" y="484" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">로컬 DNS 프록시는 에이전트에 나중에 더해진 부품이다 — 기본은 꺼짐이고 설치할 때 켠다</text>
<text x="28" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저자가 든 Envoy 가 무력한 예 셋 — 요청 경로에 앉기 · 신원 부트스트랩 · 인증서 순환</text>
<line x1="12" y1="532" x2="952" y2="532" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="554" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="544" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Envoy 를 요청 경로에 앉히는 자리</text>
<rect x="417" y="544" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="439" y="554" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정과 인증서가 오는 곳</text>

<title id="dt">Envoy 는 부품 넷 중 하나이고 스스로 뜨지 않는다</title><desc id="dd">파드 안에 애플리케이션, istio-init, 사이드카 컨테이너가 서고, 사이드카 컨테이너 안에 istio-agent 와 Envoy 와 로컬 DNS 프록시가 돈다. istio-init 이 iptables 로 요청 경로에 Envoy 를 앉힌다.</desc>
<rect width="960" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Envoy 는 부품 넷 중 하나이고 스스로 뜨지 않는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">점선 테두리는 파드·컨테이너·컨트롤 플레인 경계, 코랄색은 요청 경로에 앉히는 자리입니다.</text>
<rect x="24" y="116" width="480" height="360" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="138" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">POD</text>
<rect x="560" y="116" width="376" height="136" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<text x="576" y="138" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">CONTROL PLANE</text>
<rect x="44" y="152" width="440" height="64" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="56" y="164" width="48" height="18" rx="3" fill="#F5F5F314"/>
<text x="80" y="177" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">APP</text>
<text x="116" y="178" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">애플리케이션 컨테이너</text>
<text x="116" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">애플리케이션 코드 실행</text>
<rect x="44" y="244" width="440" height="64" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<rect x="56" y="256" width="48" height="18" rx="3" fill="#F5F5F314"/>
<text x="80" y="269" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">INIT</text>
<text x="116" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">istio-init</text>
<text x="116" y="292" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">먼저 돌아 iptables 규칙을 세운다</text>
<rect x="44" y="332" width="440" height="128" rx="6" fill="#F5F5F307" stroke="#F5F5F344" stroke-width="1"/>
<text x="60" y="354" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">SIDECAR CONTAINER</text>
<rect x="60" y="366" width="98" height="80" rx="4" fill="#F5F5F304" stroke="#8B98A9" stroke-width="1" stroke-dasharray="4 3"/>
<text x="109" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">DNS 프록시</text>
<text x="109" y="416" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">기본 꺼짐</text>
<text x="109" y="434" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">이름 해석</text>

<title id="dt">Envoy 는 넷 중 하나이고 스스로 뜨지 않는다</title><desc id="dd">사이드카 컨테이너 안에 에이전트와 Envoy 가 있고 그 밖에 init 컨테이너가 따로 선다. 에이전트가 Envoy 를 띄우고 설정을 넣으며, 색이 붙은 컨테이너가 Envoy 를 요청 경로에 앉힌다.</desc>
<rect width="1000" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Envoy 는 넷 중 하나이고 스스로 뜨지 않는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자는 사이드카를 그냥 프록시라 부르는 것을 제유라고 적습니다</text>
<rect x="28" y="148" width="480" height="300" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="141" width="32" height="14" fill="#0D1117"/>
<text x="46" y="151" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">POD</text>
<rect x="560" y="148" width="412" height="128" rx="8" fill="#F5F5F305" stroke="#F5F5F333" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="572" y="141" width="92" height="14" fill="#0D1117"/>
<text x="578" y="151" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">CONTROL PLANE</text>
<rect x="48" y="184" width="440" height="60" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>

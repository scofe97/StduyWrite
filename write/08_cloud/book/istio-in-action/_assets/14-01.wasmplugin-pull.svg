<title id="dt">좌표를 찍는 대신 워크로드와 URL 만 적는다</title><desc id="dd">3 절의 EnvoyFilter 가 Envoy 이름으로 자리를 찍어야 했다면, 여기서는 고를 워크로드와 모듈의 주소만 적는다. 색이 붙은 리소스가 그 선언이고, 모듈을 당겨 오는 것은 컨트롤 플레인이 아니라 프록시다.</desc>

<title id="dt">스코프를 고르면 볼 계층을 고르는 것이다</title><desc id="dd">로거는 스코프마다 레벨을 따로 갖는다. 위로 갈수록 애플리케이션에 가깝고 아래로 갈수록 전송에 가깝다. 색이 붙은 층에서 타임아웃 판정과 어느 클러스터로 갔는지가 함께 나온다.</desc>
<rect width="1160" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 10-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">스코프를 고르면 볼 계층을 고르는 것이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">전부 debug 로 올리면 로그에 잠기므로 볼 계층만 골라 올립니다</text>
<rect x="210" y="132" width="870" height="72" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="230" y="174" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">HTTP</text>
<text x="318" y="174" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">http</text>
<text x="478" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">레이어 7 · 애플리케이션</text>
<text x="1060" y="174" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">헤더 · 경로 · 스트림 ID</text>
<rect x="210" y="204" width="870" height="72" rx="4" fill="#F08A5910" stroke="#F08A59" stroke-width="1.4"/>
<text x="230" y="246" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">ROUTER</text>
<text x="318" y="246" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">router</text>
<text x="478" y="246" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">라우팅 판단</text>
<text x="1060" y="246" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">맞은 클러스터와 upstream timeout</text>
<rect x="210" y="276" width="870" height="72" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="230" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">POOL</text>
<text x="318" y="318" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">pool</text>
<text x="478" y="318" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">커넥션 풀</text>
<text x="1060" y="318" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">업스트림 커넥션을 얻거나 버린다</text>
<rect x="210" y="348" width="870" height="72" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="230" y="390" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">CONN</text>
<text x="318" y="390" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">connection</text>
<text x="478" y="390" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">레이어 4 · 전송</text>
<text x="1060" y="390" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">TCP 연결 · 핸드셰이크 · 종료</text>
<path d="M 166 140 L 166 412" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="150" y="156" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">애플리케이션</text>
<text x="150" y="396" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">전송</text>
<text x="32" y="456" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">레벨은 none · error · warning · info · debug 다섯이고 기본은 warning 이다</text>
<text x="32" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">커넥션 ID 로 한 커넥션을 묶고 스트림 ID 로 그 안의 요청 하나를 묶는다</text>
<line x1="12" y1="504" x2="1112" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="526" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="516" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">타임아웃 판정이 찍히는 층</text>
<rect x="326" y="516" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="348" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">함께 올리면 도움이 되는 층</text>
</svg>
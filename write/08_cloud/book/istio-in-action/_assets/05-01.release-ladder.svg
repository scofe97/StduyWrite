<title id="dt">릴리스가 지나는 상태와 되돌아가는 길</title><desc id="dd">새 코드는 먼저 트래픽 없이 배포되고, 내부 직원 → 비유료·실버 고객 → 전체로 릴리스가 넓어진다. 어느 상태에서든 관찰 결과가 나쁘면 트래픽을 이전 버전으로 되돌려 롤백한다.</desc>
<rect width="1000" height="396" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 05-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">릴리스가 지나는 상태와 되돌아가는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">옛 버전이 대부분을 받고 새 버전이 작은 몫을 받는 동안 지켜보는 자리가 카나리입니다</text>

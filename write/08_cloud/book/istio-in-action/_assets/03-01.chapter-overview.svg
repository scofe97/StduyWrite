<title id="dt">Envoy가 맡는 일과 Istio가 보태는 일 — 읽는 순서</title><desc id="dd">3장 노트의 절 일곱을 읽는 순서로 이은 지도. 앞 여섯 절이 Envoy 하나를 벗기고 마지막 절이 Istio가 그 위에 무엇을 보태는지로 닫는다.</desc>
<rect width="1240" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 03-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Envoy가 맡는 일과 Istio가 보태는 일 — 읽는 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앞 여섯 칸은 Envoy 하나를 벗기는 순서이고, 마지막 칸이 Istio 쪽으로 넘어가는 결론입니다</text>

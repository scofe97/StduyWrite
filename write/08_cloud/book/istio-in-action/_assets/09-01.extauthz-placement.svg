<title id="dt">판단을 밖으로 내보내면 요청 경로가 하나 길어진다</title><desc id="dd">프록시가 요청을 잠시 멈추고 외부 인가 서비스에 물어본다. 그 서비스가 살 수 있는 자리는 셋이고, 어디에 두든 호출은 요청 경로 안에서 일어난다. 색이 붙은 경로가 늘어나는 지연이다.</desc>
<rect width="1000" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 09-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">판단을 밖으로 내보내면 요청 경로가 하나 길어진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자의 실습은 메시 안 별도 서비스이고, 오버헤드를 줄이려면 사이드카 배치를 고릅니다</text>

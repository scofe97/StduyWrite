<text x="130" y="498" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">OPA · Gloo Edge · 자체 구현 — CheckRequest API</text>

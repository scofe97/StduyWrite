<title id="dt">위쪽은 무엇을 원하는가, 아래쪽은 어떻게 할 것인가</title><desc id="dd">운영자는 의도만 적고 kubectl 로 적용한다. istiod 가 그것을 프록시마다 맞는 낮은 수준 설정으로 번역해 내려보낸다. 색이 붙은 자리가 번역이 일어나는 곳이고, 운영자는 그 결과물을 쓰지 않는다.</desc>
<rect width="1240" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 02-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">위쪽은 무엇을 원하는가, 아래쪽은 어떻게 할 것인가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Istio 설정이 CRD 라서 kubectl 로 적용·삭제하는 기존 습관이 그대로 통합니다</text>

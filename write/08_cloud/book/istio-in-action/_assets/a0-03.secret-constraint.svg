<title id="dt">비밀을 뺐더니 부품이 하나 더 필요해졌다</title><desc id="dd">워크로드에 비밀을 주면 그것을 얻은 공격자가 시스템을 악용한다. 그래서 뺐더니 이번에는 인증할 수단이 없어진다. 색이 붙은 갈래가 규격이 그 공백을 메운 방법이다.</desc>
<rect width="1000" height="756" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-03 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">비밀을 뺐더니 부품이 하나 더 필요해졌다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">제약 하나가 규격의 나머지 구조를 거의 다 결정합니다</text>
<rect x="100" y="112" width="336" height="60" rx="22" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="268.0" y="140.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">워크로드에 신원을 줘야 한다</text>
<text x="268.0" y="160.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SVID 를 받아야 한다</text>
<polygon points="268,212 436,268 268,324 100,268" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="268" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">워크로드가 비밀을</text>
<text x="268" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">직접 들고 있나</text>
<rect x="572" y="236" width="328" height="64" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="736.0" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">비밀을 얻으면 악용된다</text>
<text x="736.0" y="282" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">규격이 이것을 금한다</text>
<polygon points="268,396 436,452 268,508 100,452" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="268" y="448" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">그러면 스스로</text>
<text x="268" y="468" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">인증할 수 있나</text>
<rect x="572" y="420" width="328" height="64" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.2"/>
<text x="736.0" y="446" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">안전한 통신을 못 연다</text>
<text x="736.0" y="466" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">받으러 갈 수가 없다</text>
<rect x="100" y="592" width="336" height="60" rx="22" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="268.0" y="620.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">엔드포인트가 대신한다</text>
<text x="268.0" y="640.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">곁에서 증명하고 받아 온다</text>
<path d="M 268 172 L 268 208" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 436 268 L 570 268" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<path d="M 268 324 L 268 392" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 436 452 L 570 452" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<path d="M 268 508 L 268 588" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="502.0" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">예</text>
<text x="502.0" y="438" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">아니오</text>
<text x="288" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<text x="288" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">그래서</text>
<text x="28" y="680" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">엔드포인트가 하는 일 둘 — 워크로드 증명(커널 인트로스펙션 · 오케스트레이터 질의)과 Workload API 노출</text>
<line x1="12" y1="700" x2="952" y2="700" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="722" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="712" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="722" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">규격이 고른 해법</text>
<rect x="261" y="712" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="283" y="722" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">막다른 갈래</text>
</svg>
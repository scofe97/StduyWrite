<title id="dt">손으로 넣든 웹훅이 넣든 결과는 같다</title><desc id="dd">위 레인은 사람이 istioctl 로 명세를 고치는 길이고 아래 레인은 웹훅이 대신 고치는 길이다. 코랄색 칸이 두 길이 같은 파드 정의를 낸다는 합류점이다.</desc>
<rect width="960" height="460" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">손으로 넣든 웹훅이 넣든 결과는 같다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">갈리는 것은 결과가 아니라 무엇이 배포되는지를 Git 에서 얼마나 통제하느냐입니다.</text>
<line x1="0" y1="116" x2="960" y2="116" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="20" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">수동 주입</text>
<text x="20" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">istioctl 실행</text>
<line x1="0" y1="236" x2="960" y2="236" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="20" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">자동 주입</text>
<text x="20" y="310" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">웹훅이 대신 넣음</text>

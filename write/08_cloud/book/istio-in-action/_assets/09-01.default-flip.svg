<title id="dt">허용을 하나 적으면 나머지가 닫힌다</title><desc id="dd">정책이 없을 때는 전부 허용이다. ALLOW 정책을 하나 붙이는 순간 그 워크로드의 기본값이 거부로 뒤집힌다. 색이 붙은 상태가 저자가 gotcha 라 부른 자리이고, 오른쪽이 그 처방이다.</desc>
<rect width="1240" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 09-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">허용을 하나 적으면 나머지가 닫힌다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자는 이 뒤집힘을 세부 설명보다 먼저 꺼내 놓습니다</text>
<circle cx="60" cy="236" r="6" fill="#F5F5F3"/>
<circle cx="1206" cy="236" r="8" fill="none" stroke="#F5F5F3" stroke-width="1.2"/>
<circle cx="1206" cy="236" r="5" fill="#F5F5F3"/>
<path d="M 68 236 L 114 236" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 416 236 L 494 236" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 796 236 L 874 236" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 1176 236 L 1196 236" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="116" y="200.0" width="300" height="72" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="266.0" y="230.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">정책 없음</text>
<text x="266.0" y="252.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">전부 허용</text>
<rect x="496" y="200.0" width="300" height="72" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="646.0" y="230.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">기본 거부</text>
<text x="646.0" y="252.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">ALLOW 에 맞아야 통과</text>
<rect x="876" y="200.0" width="300" height="72" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="1026.0" y="230.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">명시한 것만 허용</text>
<text x="1026.0" y="252.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">catch-all DENY 가 나머지</text>
<text x="456.0" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#F08A59">ALLOW 정책 하나 추가</text>
<text x="456.0" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">[그 워크로드에 적용될 때]</text>
<text x="836.0" y="166" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="600" fill="#8B98A9">catch-all DENY 추가</text>
<text x="836.0" y="184" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">[spec: {} · 루트 네임스페이스]</text>
<rect x="436" y="312.0" width="420" height="108" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="452" y="338.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">가운데 상태에서 벌어지는 일</text>
<text x="452" y="362.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">/api/catalog   -&gt;  허용  (경로가 맞는다)</text>
<text x="452" y="384.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">/hello/world   -&gt;  거부  (맞는 정책 없음)</text>
<text x="452" y="406.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">허용도 거부도 적지 않은 요청이 막힌다</text>
<line x1="606" y1="272.0" x2="606" y2="312.0" stroke="#8B98A9" stroke-width="1.0" stroke-dasharray="3 5"/>
<text x="32" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">catch-all 을 먼저 깔면 생각할 것이 하나로 준다 — 무엇을 들일지만 적는다</text>
<line x1="12" y1="504" x2="1192" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="526" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="516" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사고가 뒤집히는 상태</text>
</svg>
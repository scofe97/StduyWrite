<title id="dt">미러된 요청은 응답을 버린다</title><desc id="dd">webapp 의 사이드카가 실요청을 catalog v1 로 보내고 응답을 돌려준다. 같은 요청의 복제본을 catalog v2 로 fire-and-forget 으로 보내며 v2 의 응답은 무시한다. 복제본의 Host 에는 -shadow 가 붙는다.</desc>
<rect width="1000" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 05-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">미러된 요청은 응답을 버린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">실사용자는 v1 의 응답만 봅니다. v2 는 실제 트래픽을 받되 아무에게도 영향을 주지 않습니다</text>
<rect x="596" y="108" width="380" height="280" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
<rect x="608" y="112" width="300" height="18" rx="2" fill="#0D1117"/>
<text x="758" y="129" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">catalog · DestinationRule subset</text>
<path d="M 200 236 H 258" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 480 208 H 638" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="540" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">실요청 100%</text>
<path d="M 638 232 H 482" fill="none" stroke="#8B98A9" stroke-width="1.2" marker-end="url(#ar)" stroke-dasharray="4 3"/>
<text x="540" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">응답 → 사용자</text>

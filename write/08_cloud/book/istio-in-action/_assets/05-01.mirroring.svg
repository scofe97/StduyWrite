<text x="548" y="312" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">복제본 · fire-and-forget</text>
<path d="M 638 352 H 600" fill="none" stroke="#5E6B7E" stroke-width="1.0" marker-end="url(#soft)" stroke-dasharray="2 4"/>
<text x="596" y="372" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">응답은 무시</text>

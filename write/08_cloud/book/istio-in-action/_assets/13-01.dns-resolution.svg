<title id="dt">가로채기가 없으면 이름은 기계 밖으로 나간다</title><desc id="dd">질의는 평소의 리졸버로 가려다가 Iptable 규칙에 붙들려 사이드카 안의 DNS 프록시로 향한다. 색이 붙은 자리가 그 가로채기이고, 그것이 없으면 클러스터 이름은 어디서도 풀리지 않는다.</desc>
<rect width="1000" height="936" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 13-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">가로채기가 없으면 이름은 기계 밖으로 나간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이름이 풀리지 않으면 요청은 애플리케이션을 떠나지도 못합니다</text>
<rect x="188" y="112" width="280" height="64" rx="22" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="328.0" y="136" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">webapp.istioinaction 을 묻는다</text>
<text x="328.0" y="156" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">01 · 애플리케이션의 DNS 질의</text>
<path d="M 184 268 L 356 212 L 528 268 L 356 324 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="356" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">hosts 파일에</text>
<text x="356" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">맞는 항목이 있나</text>
<rect x="722" y="240" width="248" height="56" rx="22" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="846.0" y="273.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">그 값으로 끝난다</text>
<rect x="188" y="384" width="280" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="328.0" y="410" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">기본 리졸버로 간다</text>
<text x="328.0" y="430" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">02 · systemd-resolved 127.0.0.53:53</text>
<rect x="188" y="508" width="280" height="68" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="328.0" y="534" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">Iptable 규칙이 붙든다</text>
<text x="328.0" y="554" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">03 · REDIRECT --to-ports 15053</text>
<path d="M 184 664 L 356 608 L 528 664 L 356 720 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="356" y="660" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">DNS 프록시가</text>
<text x="356" y="680" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">아는 이름인가</text>
<rect x="682" y="636" width="316" height="56" rx="22" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="840.0" y="669.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">주소를 돌려준다</text>
<rect x="176" y="796" width="300" height="56" rx="22" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="326.0" y="829.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">resolv.conf 네임서버로 폴백</text>
<path d="M 356 176 L 356 214" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 356 324 L 356 380" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 356 452 L 356 504" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 356 576 L 356 610" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 356 720 L 356 794" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 528 268 L 720 268" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 528 664 L 680 664" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="614.0" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<text x="614.0" y="652" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<text x="376" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<text x="376" y="752" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<text x="682" y="736" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">여기서 풀리는 이유 — istiod 가 NDS 로</text>
<text x="682" y="758" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">메시가 아는 서비스를 채워 두기 때문</text>
<text x="682" y="786" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">짧은 변형은 agent 가 만든다</text>
<text x="682" y="808" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">webapp.istioinaction.svc 등</text>
<text x="20" y="876" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">가로채기가 UDP 와 TCP 양쪽에 걸린다 — 규칙 두 줄이 127.0.0.53 의 53 번을 15053 으로 돌린다</text>
<line x1="12" y1="894" x2="952" y2="894" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="916" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="906" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="916" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">가로채기 — 이 한 걸음이 전부를 가른다</text>
<rect x="430" y="906" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="452" y="916" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">평소의 해석 경로</text>
</svg>
<rect x="646.5" y="198.0" width="91.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="692.0" y="212.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">라벨로 고른다</text>
<text x="716" y="246.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">1</text>
<text x="668" y="246.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#5E6B7E">N</text>
<rect x="28" y="396" width="940" height="92" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="44" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">쿠버네티스에서 그대로 옮겨 온 대응</text>
<text x="44" y="446" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">Deployment  -&gt;  WorkloadGroup            복제본을 어떻게 만들지의 설정을 담는다</text>
<text x="44" y="468" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">Pod         -&gt;  WorkloadEntry            고유한 것이 없어서 버리고 갈아 끼울 수 있다</text>
<text x="28" y="524" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">자동 등록 — 워크로드가 토큰으로 그룹 멤버임을 인증하면 컨트롤 플레인이 WorkloadEntry 를 만든다</text>
<text x="28" y="548" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자동 정리 — VM 을 지우면 그 WorkloadEntry 도 사라진다. 만들어지는 것만큼 치워지는 것도 중요하다</text>
<line x1="12" y1="568" x2="952" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

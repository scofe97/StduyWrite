<title id="dt">템플릿 하나가 인스턴스 여럿을 찍고 서비스가 그것을 고른다</title><desc id="dd">WorkloadGroup 이 공통 속성을 정의하고 WorkloadEntry 가 VM 하나를 나타낸다. 색이 붙은 엔티티가 이 그림의 중심이며, 주소를 가진 유일한 자리이자 서비스가 라벨로 고르는 대상이다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 13-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">템플릿 하나가 인스턴스 여럿을 찍고 서비스가 그것을 고른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Deployment 와 Pod 의 관계를 그대로 옮겨 온 구조입니다</text>
<rect x="28" y="132" width="272" height="190" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="28" y1="178" x2="300" y2="178" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="44" y="152" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">ENTITY · 템플릿</text>
<text x="44" y="170" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">WorkloadGroup</text>
<text x="44" y="194" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9"># metadata.name        forum</text>
<text x="44" y="216" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">metadata.labels        app: forum</text>
<text x="44" y="238" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">template.ports         http: 8080</text>
<text x="44" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">template.serviceAccount  forum-sa</text>
<text x="44" y="282" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">template.network       vm-network</text>
<text x="44" y="304" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">probe                  httpGet /api/healthz</text>

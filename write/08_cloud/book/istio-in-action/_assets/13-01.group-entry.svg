<text x="392" y="260" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">spec.network           vm-network</text>
<text x="392" y="282" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">spec.serviceAccount    forum-sa</text>
<text x="392" y="304" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">status.conditions      Healthy: True | False</text>
<rect x="732" y="168" width="232" height="124" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="732" y1="214" x2="964" y2="214" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="748" y="188" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">ENTITY · 고르는 쪽</text>
<text x="748" y="206" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Service</text>

<text x="914.0" y="511" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기까지 와야 SYNCED 다</text>
<text x="24" y="556" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">proxy-status 가 이 파이프라인의 끝을 보여 준다 — STALE 이면 보냈는데 확인이 안 온 것이다</text>

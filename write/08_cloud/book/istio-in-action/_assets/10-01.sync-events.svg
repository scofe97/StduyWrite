<title id="dt">설정이 늦게 도착하는 것은 고장이 아니다</title><desc id="dd">워크로드가 불건강해진 뒤 프록시가 그 사실을 반영하기까지 네 참여자가 차례로 움직인다. 색이 붙은 자리까지 와야 SYNCED 로 관측되고, 그 전까지는 프록시가 옛 설정으로 돈다.</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 10-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">설정이 늦게 도착하는 것은 고장이 아니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자가 구간별 소요 시간을 적지 않아 눈금 없이 순서만 그립니다</text>

<title id="dt">15004 응답이 컨트롤 플레인 연결 확인이 된다</title><desc id="dd">15004 로 던진 질의는 xDS 이벤트로 istiod 에 안전하게 전달된다. 이 왕복은 동기화 상태를 묻는 동시에 에이전트와 컨트롤 플레인 사이 연결이 살아 있는지 확인한다.</desc>

<title id="dt">세 화면은 재료도 그리는 것도 다르다</title><desc id="dd">가로축은 무엇을 재료로 삼는가, 세로축은 무엇을 그리는가. 저자가 Kiali 를 꺼내며 Grafana 와의 차이부터 못 박은 문장에서 이 두 축이 나온다. 색이 붙은 것이 이 장의 절반을 쓰는 화면이다.</desc>

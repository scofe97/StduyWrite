<title id="dt">쿠버네티스가 준 토큰이 SPIFFE 신원이 된다</title><desc id="dd">파드에 마운트된 서비스 어카운트 토큰에서 시작해 에이전트가 SPIFFE ID 를 만들고 CSR 에 담는다. CA 가 토큰을 검증한 뒤 서명하고, 에이전트가 SDS 로 인증서를 프록시에 넣는다.</desc>
<rect width="1000" height="676" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · A0-03 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">쿠버네티스가 준 토큰이 SPIFFE 신원이 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">색이 붙은 걸음이 규격과 다른 자리입니다 — 원래는 에이전트의 몫입니다</text>
<rect x="24.0" y="104" width="216" height="50" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="132.0" y="125" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">쿠버네티스</text>
<text x="132.0" y="145" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">API 서버</text>
<rect x="261.33333333333337" y="104" width="216" height="50" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="369.33333333333337" y="125" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">파일럿 에이전트</text>
<text x="369.33333333333337" y="145" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">Workload Endpoint</text>
<rect x="498.66666666666674" y="104" width="216" height="50" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="606.6666666666667" y="125" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">Istio CA</text>
<text x="606.6666666666667" y="145" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">Workload API</text>
<rect x="736.0" y="104" width="216" height="50" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="844.0" y="125" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">Envoy 프록시</text>
<text x="844.0" y="145" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">service proxy</text>
<line x1="132.0" y1="160" x2="132.0" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="369.33333333333337" y1="160" x2="369.33333333333337" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="606.6666666666667" y1="160" x2="606.6666666666667" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="844.0" y1="160" x2="844.0" y2="540" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<path d="M 142.0 200 L 357.33333333333337 200" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="250.66666666666669" y="191" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">1. 토큰 파일 마운트</text>
<text x="250.66666666666669" y="218" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">sub: system:serviceaccount:istioinaction:default</text>
<path d="M 379.33333333333337 252 L 427.33333333333337 252 L 427.33333333333337 272 L 382.33333333333337 272" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="437.33333333333337" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">개인 키 · CSR 조립</text>
<text x="437.33333333333337" y="278" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">SAN URI 확장 생성</text>
<path d="M 379.33333333333337 328 L 594.6666666666667 328" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="488.00000000000006" y="319" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">2. token + CSR</text>
<text x="488.00000000000006" y="346" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">SAN URI: .../sa/default</text>
<path d="M 596.6666666666667 392 L 144.0 392" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="369.33333333333337" y="383" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">3. TokenReview API</text>
<text x="369.33333333333337" y="410" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">규격상 에이전트 몫이었다</text>
<path d="M 596.6666666666667 456 L 381.33333333333337 456" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="488.00000000000006" y="447" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">4. X.509 SVID</text>
<text x="488.00000000000006" y="474" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">검증 성공 뒤 서명 응답</text>
<path d="M 379.33333333333337 518 L 832.0 518" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="606.6666666666667" y="509" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#8B98A9">5. Envoy SDS</text>
<text x="606.6666666666667" y="536" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">인증서와 개인 키 전달</text>
<rect x="800.0" y="556" width="88" height="24" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="844.0" y="573" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6A95D8">mTLS 가능</text>
<text x="24" y="604" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">토큰의 페이로드는 고칠 수 없다 — 고치면 서명 검증에 실패한다</text>
<line x1="12" y1="624" x2="952" y2="624" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="646" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="636" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="646" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">규격에서 옮겨 간 걸음</text>
<rect x="300" y="636" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="322" y="646" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부트스트랩이 끝난 상태</text>

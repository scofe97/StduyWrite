<title id="dt">차이는 하나인데 손이 셋 늘어난다</title><desc id="dd">두 경로의 끝은 같다. 토큰으로 istiod 에 인증하고 SVID 를 받는다. 다른 것은 그 토큰이 어떻게 손에 들어오느냐 하나뿐이고, 색이 붙은 화살표가 그 하나다.</desc>
<rect width="1240" height="936" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 13-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">차이는 하나인데 손이 셋 늘어난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자는 이 한 걸음이 멀티 클라우드에서 금세 쌓인다고 적습니다</text>
<rect x="24.0" y="104" width="232" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="140.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">운영자</text>
<text x="140.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">service mesh operator</text>
<rect x="336.0" y="104" width="232" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="452.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">쿠버네티스</text>
<text x="452.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">신뢰의 원천</text>
<rect x="648.0" y="104" width="232" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="764.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">워크로드</text>
<text x="764.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">파드 또는 VM</text>
<rect x="960.0" y="104" width="232" height="44" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="1076.0" y="124" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">istiod</text>
<text x="1076.0" y="141" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">인증 · 발급</text>
<line x1="140.0" y1="154" x2="140.0" y2="816" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="452.0" y1="154" x2="452.0" y2="816" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="764.0" y1="154" x2="764.0" y2="816" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<line x1="1076.0" y1="154" x2="1076.0" y2="816" stroke="rgba(191,192,192,0.22)" stroke-width="1.0" stroke-dasharray="3 6"/>
<text x="24" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">클러스터 안 — 플랫폼이 대신한다</text>
<rect x="748.0" y="218" width="32.0" height="20" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="764.0" y="232" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">파드</text>
<path d="M 462.0 292 L 752.0 292" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="608.0" y="283" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">서비스 어카운트 토큰 주입</text>
<text x="608.0" y="309" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">사람이 개입하지 않는다</text>
<path d="M 774.0 356 L 1064.0 356" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="920.0" y="347" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">토큰으로 인증</text>
<path d="M 1066.0 412 L 776.0 412" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="920.0" y="403" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">SVID 발급</text>
<text x="920.0" y="429" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">메시의 일원이 된다</text>
<line x1="24" y1="460" x2="1192" y2="460" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 6"/>
<text x="24" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#5E6B7E">클러스터 밖 — 운영자가 그 자리를 메운다</text>
<rect x="699.0" y="530" width="130.0" height="20" rx="4" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="764.0" y="544" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">VM · istio-agent</text>
<path d="M 150.0 596 L 440.0 596" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="296.0" y="587" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">서비스 어카운트 생성</text>
<path d="M 442.0 640 L 152.0 640" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="296.0" y="631" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">토큰</text>
<path d="M 150.0 692 L 752.0 692" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<text x="452.0" y="683" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F08A59">안전하게 전송</text>
<text x="452.0" y="709" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기가 유일한 차이다</text>
<path d="M 774.0 748 L 1064.0 748" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="920.0" y="739" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#8B98A9">토큰으로 인증</text>
<path d="M 1066.0 792 L 776.0 792" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="920.0" y="783" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">SVID 발급</text>
<text x="920.0" y="809" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기서부터는 구분되지 않는다</text>
<text x="24" y="852" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">끝은 같다 — istiod 가 SVID 를 발급하고 그때부터 두 워크로드는 구분되지 않는다</text>
<text x="24" y="876" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저자가 준비 중이라 밝힌 대안은 클라우드가 VM 에 부여한 플랫폼 할당 신원이며 아직 개발되지 않았다</text>
<line x1="12" y1="896" x2="1192" y2="896" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="918" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="908" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="918" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">운영자가 손으로 메우는 한 걸음</text>
<rect x="365" y="908" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="387" y="918" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">플랫폼이 자동으로 하는 자리</text>
<rect x="604" y="908" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="626" y="918" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">신원을 받는 지점</text>
</svg>
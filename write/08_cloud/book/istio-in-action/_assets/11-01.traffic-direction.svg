<title id="dt">포화가 어느 쪽과 함께 오르는가가 처방을 가른다</title><desc id="dd">CPU 포화만 보면 무엇을 해야 할지 정해지지 않는다. 들어오는 트래픽과 나가는 트래픽 중 어느 쪽과 함께 오르는지가 처방을 가른다. 색이 붙은 갈래가 저자가 첫 손잡이로 지목한 쪽이다.</desc>
<rect width="1000" height="888" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 11-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">포화가 어느 쪽과 함께 오르는가가 처방을 가른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">포화가 아닌데 지연만 오르면 자원이 남는다는 뜻입니다</text>
<rect x="150" y="112" width="300" height="56" rx="22" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="300.0" y="138.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">지연이 늘었다</text>
<text x="300.0" y="158.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">proxy convergence time</text>
<path d="M 160 268 L 330 212 L 500 268 L 330 324 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="330" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">CPU 사용률이</text>
<text x="330" y="284" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">90% 를 넘나</text>
<rect x="680" y="236" width="300" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="830.0" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">동시 푸시 수를 올린다</text>
<text x="830.0" y="282" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">자원이 남는데 안 쓰고 있다</text>
<path d="M 160 440 L 330 384 L 500 440 L 330 496 Z" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1"/>
<text x="330" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">들어오는 트래픽과</text>
<text x="330" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">함께 오르나</text>
<rect x="680" y="408" width="300" height="68" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="830.0" y="434" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">배칭을 늘리거나 수직 확장</text>
<text x="830.0" y="454" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">설정 생성이 병목이다</text>
<path d="M 160 612 L 330 556 L 500 612 L 330 668 Z" fill="#F08A590C" stroke="#F08A59" stroke-width="1.4"/>
<text x="330" y="608" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">나가는 트래픽과</text>
<text x="330" y="628" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">함께 오르나</text>
<rect x="680" y="580" width="300" height="68" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="830.0" y="606" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">Sidecar 정의 + 수평 확장</text>
<text x="830.0" y="626" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">배포 대상과 크기가 병목이다</text>
<rect x="150" y="712" width="300" height="56" rx="22" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="300.0" y="738.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">플랫폼 쪽을 의심한다</text>
<text x="300.0" y="758.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">API 서버 · 연결</text>
<path d="M 330 168 L 330 208" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 500 268 L 678 268" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 330 324 L 330 380" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 500 440 L 678 440" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 330 496 L 330 552" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 500 612 L 678 612" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 330 668 L 330 708" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="595.0" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<text x="595.0" y="426" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<text x="595.0" y="598" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">예</text>
<text x="354" y="356" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<text x="354" y="528" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<text x="354" y="694" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<text x="28" y="804" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">저자의 우선순위 — 자원을 늘리는 것은 Sidecar 와 발견 범위와 배칭을 다 손본 뒤의 마지막 수단이다</text>
<line x1="12" y1="828" x2="952" y2="828" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="850" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="840" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="850" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Sidecar 가 먼저 오는 갈래</text>
<rect x="378" y="840" width="14" height="12" rx="2" fill="#8B98A922" stroke="#8B98A9" stroke-width="1.1"/>
<text x="400" y="850" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">나머지 갈래</text>

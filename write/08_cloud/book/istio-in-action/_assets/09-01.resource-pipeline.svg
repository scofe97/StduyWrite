<path d="M 1077.0 476 L 1125.0 476 L 1125.0 496 L 1080.0 496" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="1135.0" y="482" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F08A59">허용 또는 거부</text>
<text x="1135.0" y="497" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">여기서만 요청이 막힌다</text>
<text x="24" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">토큰이 없어도 두 번째 필터는 요청을 통과시킨다 — 클레임이 비어 있을 뿐이다</text>

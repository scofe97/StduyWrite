<title id="dt">앞의 둘은 꺼내 놓고 판정은 뒤가 한다</title><desc id="dd">요청 하나가 세 필터를 차례로 지난다. 두 인증 필터가 자격 증명에서 값을 꺼내 필터 메타데이터에 쌓아 두고, 인가 필터가 그 값만 보고 판정한다. 색이 붙은 자리가 유일하게 요청을 막는 곳이다.</desc>
<rect width="1240" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 09-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">앞의 둘은 꺼내 놓고 판정은 뒤가 한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">인증 리소스만 걸어 두면 아무것도 막히지 않습니다</text>

<title id="dt">요청은 downstream에서 upstream으로 흐른다</title><desc id="dd">요청이 downstream 에서 Envoy 의 Listener·Route·Cluster 를 차례로 지나 upstream 서비스에 닿는 경로. 색이 붙은 손잡이가 Cluster 에서 upstream 으로 넘어가는 지점이다.</desc>
<rect width="728" height="444" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 03-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">요청은 downstream에서 upstream으로 흐른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">가운데 레인이 Envoy 안의 세 단계. 색이 붙은 손잡이를 디스커버리·로드밸런싱·건강 검사의 자리로 읽는다</text>

<title id="dt">RDS와 CDS가 따로 올 때와 ADS로 묶일 때</title><desc id="dd">위 구간: RDS 가 cluster foo 를 가리키는 라우트를 먼저 보내고 CDS 가 뒤늦게 foo 를 보내 그 사이 라우팅 오류가 난다. 아래 구간: ADS 스트림 하나가 CDS 를 먼저, RDS 를 뒤에 실어 오류 구간이 없다.</desc>
<rect width="880" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 03-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">RDS와 CDS가 따로 올 때와 ADS로 묶일 때</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">xDS는 최종 일관성 위에 있어 개별 스트림은 순서를 보장하지 않는다. Istio가 ADS를 고른 이유</text>

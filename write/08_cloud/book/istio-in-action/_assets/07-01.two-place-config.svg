<title id="dt">새 차원은 두 자리를 함께 고쳐야 보인다</title><desc id="dd">컨트롤 플레인 설정이 무엇을 셀지 정하고, 워크로드 애노테이션이 프록시에 그 이름을 알린다. 색이 붙은 손잡이가 빠뜨리기 쉬운 쪽이다. 애노테이션 없이는 차원이 설정돼 있어도 노출되지 않는다.</desc>
<rect width="1240" height="508" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 07-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">새 차원은 두 자리를 함께 고쳐야 보인다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">애노테이션은 배포의 metadata 가 아니라 spec.template.metadata 에 붙습니다</text>

<text x="1122.0" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">DNS 프록시</text>
<text x="32" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">쿠버네티스에서도 같은 셋이 필요하다 — 프록시 설치 · istiod 에 붙는 설정 · 신원 토큰. 다만 플랫폼이 대신한다</text>
<text x="32" y="424" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">저자가 못 박는 문장 — 이 편의는 쿠버네티스 밖의 워크로드로 확장되지 않는다</text>
<text x="32" y="448" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">설치 한 줄만은 쿠버네티스에서도 istioctl 로 손수 주입하는 선택지가 웹훅과 나란히 적혀 있다</text>

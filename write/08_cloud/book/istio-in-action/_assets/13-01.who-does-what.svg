<title id="dt">오른쪽 여섯 칸이 모두 누군가의 일이 된다</title><desc id="dd">저자가 장을 닫으며 놓는 표를 그대로 옮겼다. 왼쪽은 대개 플랫폼의 이름이고 오른쪽은 전부 사람이나 새 리소스의 이름이다. 색이 붙은 칸이 저자가 마지막 이정표라 부른 자리다.</desc>
<rect width="1240" height="520" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ISTIO IN ACTION · 13-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">오른쪽 여섯 칸이 모두 누군가의 일이 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이 장의 나머지는 오른쪽 레인의 여섯 칸을 하나씩 채우는 일입니다</text>
<text x="262.0" y="102" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">설치</text>
<text x="434.0" y="102" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">설정</text>
<text x="606.0" y="102" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">신원</text>
<text x="778.0" y="102" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">헬스</text>
<text x="950.0" y="102" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">등록</text>
<text x="1122.0" y="102" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#5E6B7E">이름</text>

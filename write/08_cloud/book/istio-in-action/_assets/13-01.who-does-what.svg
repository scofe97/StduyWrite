<line x1="0" y1="244" x2="1240" y2="244" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="20" y="292" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="600" fill="#5E6B7E">VIRTUAL MACHINE</text>
<text x="20" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">운영자와 새 리소스가 나눈다</text>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01-01 — 배포 흐름과 컨트롤러 조정</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100vh; }
    body {
      background: #0d0d0d; color: #e8e4df;
      font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .container { max-width: 1120px; width: 100%; margin: 0 auto; padding: 18px 24px; display: flex; flex-direction: column; height: 100%; }
    .fixed-header { flex-shrink: 0; }
    .scroll-content { flex: 1; overflow-y: auto; padding-top: 8px; }
    h1 { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: rgb(138,133,128); font-size: 13px; margin-bottom: 14px; }

    .scenario-selector { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .scenario-pill { background: rgb(26,26,26); border: 1px solid rgb(42,37,32); border-radius: 20px; color: rgb(138,133,128); padding: 6px 16px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .scenario-pill.active { background: rgba(212,168,83,0.15); border-color: rgb(212,168,83); color: rgb(212,168,83); }
    .scenario-pill:hover { color: #e8e4df; }

    .stage-wrap { border: 1px solid rgb(42,37,32); border-radius: 10px; background: #0d0d0d; padding: 8px; margin-bottom: 12px; }
    svg { width: 100%; height: auto; display: block; }

    /* SVG component styling via classes */
    .box { fill: rgb(20,24,28); stroke: rgb(60,55,48); stroke-width: 1.5; transition: all 0.45s; }
    .box.hub { stroke: rgb(212,168,83); }
    .box.on { fill: rgba(212,168,83,0.16); stroke: rgb(212,168,83); stroke-width: 2.4; }
    .box.done { fill: rgba(212,168,83,0.05); stroke: rgba(212,168,83,0.55); }
    .box.dead { stroke: rgb(244,67,54); opacity: 0.45; }
    .comp-name { fill: #e8e4df; font-size: 13px; font-weight: 700; transition: fill 0.4s; }
    .comp-role { fill: rgb(138,133,128); font-size: 10px; }
    .on-name { fill: rgb(212,168,83); }
    .frame { fill: none; stroke: rgb(50,46,40); stroke-width: 1.3; stroke-dasharray: 6 4; }
    .frame-label { fill: rgb(212,168,83); font-size: 12px; font-weight: 700; }
    .plane-note { fill: rgb(138,133,128); font-size: 10px; }

    /* edges (arrows) */
    .edge { stroke: rgb(60,55,48); stroke-width: 2; fill: none; transition: all 0.4s; }
    .edge.on { stroke: rgb(212,168,83); stroke-width: 3; filter: drop-shadow(0 0 3px rgba(212,168,83,0.7)); }
    .edge-dot { fill: rgb(212,168,83); opacity: 0; }
    .edge.on ~ .edge-dot, .edge-dot.flow { opacity: 1; }
    .edge-label { fill: rgb(138,133,128); font-size: 10px; transition: fill 0.4s; }
    .edge-label.on { fill: rgb(212,168,83); font-weight: 700; }

    /* pods */
    .pod { transition: all 0.5s; }
    .pod-box { fill: rgb(102,187,106); stroke: none; }
    .pod-box.pending { fill: rgb(120,120,120); }
    .pod-box.gone { fill: rgb(244,67,54); }
    .pod-text { fill: #0d0d0d; font-size: 10px; font-weight: 800; }
    .pod.hidden { opacity: 0; transform: scale(0.3); }
    .pod.appear { animation: pop 0.5s ease; }
    @keyframes pop { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }

    .desired-bar { text-align: center; font-size: 12px; margin: 4px 0 2px; }
    .dtag { color: rgb(138,133,128); }
    .dval { color: rgb(212,168,83); font-weight: 700; font-family: 'JetBrains Mono', monospace; }

    .panel { background: #0d0d0d; border: 1px solid rgb(42,37,32); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .start-overlay { text-align: center; padding: 20px; }
    .btn-start { background: rgba(212,168,83,0.15); border: 1px solid rgb(212,168,83); border-radius: 8px; color: rgb(212,168,83); padding: 12px 32px; font-size: 16px; cursor: pointer; transition: all 0.2s; }
    .btn-start:hover { background: rgba(212,168,83,0.25); }
    .start-hint { color: rgb(138,133,128); font-size: 13px; margin-top: 8px; }

    .controls { display: flex; align-items: center; gap: 16px; padding: 8px 0; border-top: 1px solid rgb(42,37,32); }
    .controls-nav { display: flex; gap: 8px; }
    .btn-ctrl { background: rgb(26,26,26); border: 1px solid rgb(42,37,32); border-radius: 6px; color: #e8e4df; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn-ctrl:hover { border-color: rgb(212,168,83); color: rgb(212,168,83); }
    .btn-ctrl:disabled { opacity: 0.35; cursor: default; }
    .btn-play { min-width: 80px; }
    .speed-group { display: flex; gap: 4px; margin-left: auto; }
    .speed-btn { background: transparent; border: 1px solid transparent; border-radius: 4px; color: rgb(138,133,128); padding: 4px 10px; font-size: 12px; cursor: pointer; }
    .speed-btn.active { border-color: rgb(42,37,32); color: #e8e4df; }
    .step-counter { color: rgb(138,133,128); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }

    .narration-step-title { font-size: 11px; font-weight: 700; color: rgb(212,168,83); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    .narration-body { font-size: 14px; line-height: 1.7; }
    .actor { font-weight: 700; color: rgb(212,168,83); }
    .hl { color: rgb(212,168,83); font-family: 'JetBrains Mono', monospace; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="container">
    <div class="fixed-header">
      <h1>배포 흐름과 컨트롤러 조정</h1>
      <div class="subtitle">매니페스트 하나가 실제 컨테이너가 되기까지, 그리고 파드가 죽었을 때 시스템이 스스로 복구하는 과정 — 화살표를 따라 데이터가 어떻게 흐르는지 보세요</div>
      <div class="scenario-selector" id="selector"></div>
    </div>
    <div class="scroll-content">
      <div class="stage-wrap">
        <div class="desired-bar" id="desired"></div>
        <div id="stage"></div>
      </div>
      <div class="panel">
        <div class="narration-step-title" id="narr-title">시작하기</div>
        <div class="narration-body" id="narr-body"></div>
      </div>
    </div>
    <div class="controls">
      <div class="controls-nav">
        <button class="btn-ctrl" id="prev">◀ 이전</button>
        <button class="btn-ctrl btn-play" id="play">▶ 재생</button>
        <button class="btn-ctrl" id="next">다음 ▶</button>
      </div>
      <span class="step-counter" id="counter">0 / 0</span>
      <div class="speed-group">
        <button class="speed-btn" data-s="2200">0.5×</button>
        <button class="speed-btn active" data-s="1400">1×</button>
        <button class="speed-btn" data-s="700">2×</button>
      </div>
    </div>
  </div>

  <script>
  // ============ 공통 아키텍처 SVG (좌: Control Plane, 우: Worker Nodes) ============
  // 컴포넌트 좌표 — 화살표가 실제 위치를 잇도록 고정 배치
  const COMP = {
    kubectl:    { x: 40,  y: 250, w: 130, h: 58, name: "kubectl", role: "사용자 · 매니페스트" },
    api:        { x: 250, y: 60,  w: 170, h: 60, name: "API Server", role: "유일한 통신 허브", hub: true },
    etcd:       { x: 250, y: 400, w: 170, h: 56, name: "etcd", role: "오브젝트 영속 저장" },
    controller: { x: 250, y: 175, w: 170, h: 56, name: "Controller", role: "Pod 오브젝트 생성" },
    scheduler:  { x: 250, y: 290, w: 170, h: 56, name: "Scheduler", role: "노드 배치 결정" }
  };
  const NODE = {
    n1: { x: 620, y: 90,  w: 320, h: 190, name: "Worker Node 1" },
    n2: { x: 620, y: 310, w: 320, h: 170, name: "Worker Node 2" }
  };
  // Kubelet 은 각 노드 안
  const KUBELET = {
    n1: { x: 640, y: 120, w: 130, h: 50, name: "Kubelet", role: "컨테이너 실행" },
    n2: { x: 640, y: 340, w: 130, h: 50, name: "Kubelet", role: "컨테이너 실행" }
  };
  // kube-proxy 각 노드 안
  const KPROXY = {
    n1: { x: 790, y: 120, w: 130, h: 50, name: "kube-proxy", role: "트래픽 라우팅" },
    n2: { x: 790, y: 340, w: 130, h: 50, name: "kube-proxy", role: "트래픽 라우팅" }
  };
  // Pod 슬롯 (노드 하단)
  const PODSLOT = {
    n1a: { x: 655, y: 200, node: "n1" }, n1b: { x: 725, y: 200, node: "n1" }, n1c: { x: 795, y: 200, node: "n1" },
    n2a: { x: 655, y: 410, node: "n2" }, n2b: { x: 725, y: 410, node: "n2" }
  };

  function cx(c){ return c.x + c.w/2; }
  function cy(c){ return c.y + c.h/2; }

  // 컴포넌트 박스 렌더
  function boxSVG(id, c, cls="") {
    const nmeClass = "comp-name" + (cls.includes("on") ? " on-name" : "");
    return `<g>
      <rect id="box-${id}" class="box ${c.hub?'hub':''} ${cls}" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="8"/>
      <text id="name-${id}" class="${nmeClass}" x="${cx(c)}" y="${c.y+ (c.role? 24: c.h/2+5)}" text-anchor="middle">${c.name}</text>
      ${c.role ? `<text class="comp-role" x="${cx(c)}" y="${c.y+42}" text-anchor="middle">${c.role}</text>` : ''}
    </g>`;
  }

  // 화살표 edge: from,to 컴포넌트 중심을 잇는 직선 + 라벨(절대 좌표 lx,ly 로 명시)
  function edgeSVG(id, from, to, label, lx, ly, anchor="middle") {
    const x1=cx(from), y1=cy(from), x2=cx(to), y2=cy(to);
    // 박스 경계에서 멈추도록 약간 당김
    const ang = Math.atan2(y2-y1, x2-x1);
    const sx = x1 + Math.cos(ang)* (from.w/2+2), sy = y1 + Math.sin(ang)*(from.h/2+2);
    const ex = x2 - Math.cos(ang)* (to.w/2+10), ey = y2 - Math.sin(ang)*(to.h/2+10);
    return `<g>
      <path id="edge-${id}" class="edge" d="M${sx},${sy} L${ex},${ey}" marker-end="url(#arrow)"/>
      <text id="elbl-${id}" class="edge-label" x="${lx}" y="${ly}" text-anchor="${anchor}">${label}</text>
    </g>`;
  }

  // Pod 렌더 (기본 hidden)
  function podSVG(id, slot, label) {
    return `<g id="pod-${id}" class="pod hidden" transform="translate(${slot.x},${slot.y})">
      <rect class="pod-box" x="0" y="0" width="52" height="34" rx="6"/>
      <text class="pod-text" x="26" y="21" text-anchor="middle">${label}</text>
    </g>`;
  }

  // ============ 시나리오 정의 ============
  const SCENARIOS = {
    deploy: {
      label: "배포 흐름",
      total: 7,
      // 각 프레임: 켜질 edge 들, 켜질 box 들, 보일 pod 들(상태)
      frames: [
        { title: "① 매니페스트 제출", edges: ["kubectl-api"], boxes: ["kubectl","api"],
          body: "<span class='actor'>kubectl</span> 이 원하는 상태를 담은 매니페스트를 <span class='hl'>API Server</span> 로 보냅니다. 화살표는 사용자→API Server 방향. 아직 컨테이너는 없습니다." },
        { title: "② etcd에 저장", edges: ["api-etcd"], boxes: ["api","etcd"],
          body: "<span class='hl'>API Server</span> 가 받은 오브젝트를 <span class='actor'>etcd</span> 에 씁니다. etcd 와 직접 대화하는 건 API Server 뿐 — 다른 컴포넌트는 모두 API Server 를 거칩니다." },
        { title: "③ Controller가 Pod 생성", edges: ["controller-api"], boxes: ["controller","api"], pods: {"n1a":"pending","n1b":"pending"},
          body: "<span class='actor'>Controller</span> 가 API Server 를 통해 새 오브젝트를 감지하고, 필요한 수만큼 <span class='hl'>Pod 오브젝트</span> 를 만듭니다(회색 = 아직 배치 안 됨). 어느 노드에 놓을지는 아직 미정입니다." },
        { title: "④ Scheduler가 노드 배정", edges: ["scheduler-api"], boxes: ["scheduler","api"], pods: {"n1a":"pending","n1b":"pending"},
          body: "<span class='actor'>Scheduler</span> 가 노드 없는 Pod 를 발견해 자원·제약을 따져 <span class='hl'>어느 워커 노드</span> 에 놓을지 정합니다. Scheduler 는 '배치 결정'만 하고 실행은 하지 않습니다." },
        { title: "⑤ Kubelet이 컨테이너 실행", edges: ["api-kubelet1"], boxes: ["api","kubelet-n1"], pods: {"n1a":"running","n1b":"running"},
          body: "배정된 노드의 <span class='actor'>Kubelet</span> 이 API Server 로부터 자기 노드에 온 Pod 를 받아 컨테이너 런타임에 지시합니다. 회색 Pod 가 <span class='hl'>초록(running)</span> 으로 바뀌며 실제로 뜹니다." },
        { title: "⑥ kube-proxy가 트래픽 노출", edges: ["api-kproxy1"], boxes: ["api","kproxy-n1"], pods: {"n1a":"running","n1b":"running"},
          body: "<span class='actor'>kube-proxy</span> 가 새 Pod 가 트래픽 받을 준비가 됐음을 감지하고 노드 커널에 라우팅 규칙을 심습니다. 이제 Service 가상 IP 로 온 요청이 이 Pod 로 흐릅니다." },
        { title: "⑦ 배포 완료", edges: [], boxes: [], pods: {"n1a":"running","n1b":"running"}, allDone: true,
          body: "매니페스트 한 장이 <span class='hl'>실제로 도는 컨테이너 2개</span> 가 됐습니다. 각 단계는 모두 <span class='actor'>API Server 를 허브</span> 로 거쳐 이뤄졌습니다 — 컴포넌트끼리 직접 연결되지 않습니다." }
      ]
    },
    reconcile: {
      label: "셀프힐링 (조정 루프)",
      total: 6,
      desired: 3,
      frames: [
        { title: "① 원하는 상태 = Pod 3개", boxes: ["controller","api"], pods: {"n1a":"running","n2a":"running","n2b":"running"},
          body: "<span class='hl'>Pod 3개</span> 가 항상 떠 있어야 한다고 선언했습니다. 이것이 <span class='actor'>원하는 상태(desired state)</span> — '3개인 상태를 유지하라'는 선언입니다.", live: 3 },
        { title: "② 정상 — desired = current", boxes: ["controller"], pods: {"n1a":"running","n2a":"running","n2b":"running"},
          body: "세 Pod 가 노드에 떠서 <span class='actor'>실제 상태(current)</span> 가 원하는 상태(3)와 일치합니다. Controller 는 차이가 없으니 아무것도 하지 않습니다.", live: 3 },
        { title: "③ 노드 장애 → Pod 소멸", boxes: [], deadNode: "n2", pods: {"n1a":"running","n2a":"gone","n2b":"gone"},
          body: "<span class='hl'>Worker Node 2 가 죽어</span> Pod 2개가 사라집니다. 실제 상태는 1개, 원하는 상태는 3개 — <span class='actor'>차이(drift)</span> 가 생겼습니다.", live: 1 },
        { title: "④ Controller가 차이 감지", edges: ["controller-api"], boxes: ["controller","api"], deadNode: "n2", pods: {"n1a":"running","n2a":"gone","n2b":"gone"},
          body: "<span class='actor'>Controller</span> 가 조정 루프를 돌다 '원하는 3 ↔ 실제 1'의 차이를 감지합니다. <span class='hl'>사람이 개입하지 않습니다</span> — 스스로 알아챕니다.", live: 1 },
        { title: "⑤ 살아있는 노드에 재생성", edges: ["scheduler-api","api-kubelet1"], boxes: ["scheduler","api","kubelet-n1"], deadNode: "n2", pods: {"n1a":"running","n1b":"appear","n1c":"appear"},
          body: "Controller 가 부족분 Pod 를 만들고 Scheduler 가 <span class='hl'>살아있는 Node 1</span> 에 배정, Kubelet 이 실행합니다. Node 1 에 새 Pod 2개가 떠오릅니다.", live: 3 },
        { title: "⑥ 원하는 상태로 복구", boxes: ["controller"], deadNode: "n2", pods: {"n1a":"running","n1b":"running","n1c":"running"},
          body: "다시 Pod 3개. 실제 = 원하는 상태가 되어 Controller 는 다시 조용해집니다. 이 <span class='actor'>desired ↔ current 비교·복구 루프</span> 가 쿠버네티스 자동화의 심장입니다.", live: 3 }
      ]
    }
  };

  // ============ 정적 SVG 골격 (컴포넌트·엣지·Pod 전부 미리 그려두고 클래스로 토글) ============
  function buildStageSVG() {
    const edges = [
      edgeSVG("kubectl-api", COMP.kubectl, COMP.api, "① 제출", 150, 200, "middle"),
      edgeSVG("controller-api", COMP.controller, COMP.api, "③ Pod 생성", 345, 155, "start"),
      edgeSVG("scheduler-api", COMP.scheduler, COMP.api, "④ 배정 요청", 345, 268, "start"),
      edgeSVG("api-etcd", COMP.api, COMP.etcd, "② 저장", 345, 388, "start"),
      edgeSVG("api-kubelet1", COMP.api, KUBELET.n1, "⑤ 실행 지시", 500, 100, "middle"),
      edgeSVG("api-kproxy1", COMP.api, KPROXY.n1, "⑥ 규칙 심기", 585, 70, "middle")
    ].join("");

    const boxes = [
      boxSVG("kubectl", COMP.kubectl),
      boxSVG("api", COMP.api),
      boxSVG("etcd", COMP.etcd),
      boxSVG("controller", COMP.controller),
      boxSVG("scheduler", COMP.scheduler),
      boxSVG("kubelet-n1", KUBELET.n1),
      boxSVG("kubelet-n2", KUBELET.n2),
      boxSVG("kproxy-n1", KPROXY.n1),
      boxSVG("kproxy-n2", KPROXY.n2)
    ].join("");

    const pods = [
      podSVG("n1a", PODSLOT.n1a, "P"), podSVG("n1b", PODSLOT.n1b, "P"), podSVG("n1c", PODSLOT.n1c, "P"),
      podSVG("n2a", PODSLOT.n2a, "P"), podSVG("n2b", PODSLOT.n2b, "P")
    ].join("");

    return `<svg viewBox="0 0 960 500" role="img" aria-label="쿠버네티스 아키텍처와 데이터 흐름">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="rgb(60,55,48)"/>
        </marker>
        <marker id="arrowOn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="rgb(212,168,83)"/>
        </marker>
      </defs>
      <!-- Control Plane frame -->
      <rect class="frame" x="230" y="40" width="210" height="436" rx="12"/>
      <text class="frame-label" x="238" y="30">Control Plane (통제)</text>
      <!-- Worker node frames -->
      <rect id="frame-n1" class="frame" x="${NODE.n1.x}" y="${NODE.n1.y}" width="${NODE.n1.w}" height="${NODE.n1.h}" rx="12"/>
      <text id="nlbl-n1" class="frame-label" x="${NODE.n1.x+10}" y="${NODE.n1.y-8}">Worker Node 1</text>
      <rect id="frame-n2" class="frame" x="${NODE.n2.x}" y="${NODE.n2.y}" width="${NODE.n2.w}" height="${NODE.n2.h}" rx="12"/>
      <text id="nlbl-n2" class="frame-label" x="${NODE.n2.x+10}" y="${NODE.n2.y-8}">Worker Node 2</text>

      ${edges}
      ${boxes}
      ${pods}
    </svg>`;
  }

  // ============ 상태 적용 ============
  let cur = "deploy", idx = -1, playing = false, timer = null, speed = 1400;
  const $ = id => document.getElementById(id);
  const q = sel => document.querySelectorAll(sel);

  function renderSelector() {
    $("selector").innerHTML = Object.entries(SCENARIOS).map(([k,v]) =>
      `<button class="scenario-pill ${k===cur?'active':''}" data-k="${k}">${v.label}</button>`).join("");
    q(".scenario-pill").forEach(b => b.onclick = () => { cur=b.dataset.k; reset(); });
  }

  function mountStage() {
    $("stage").innerHTML = buildStageSVG();
  }

  // 모든 상태 초기화 후, idx까지 누적된 상태 적용
  function applyState() {
    const sc = SCENARIOS[cur];
    // reset all
    q(".box").forEach(b => b.classList.remove("on","done","dead"));
    q(".edge").forEach(e => { e.classList.remove("on"); e.setAttribute("marker-end","url(#arrow)"); });
    q(".edge-label").forEach(l => l.classList.remove("on"));
    q(".pod").forEach(p => p.classList.add("hidden"));
    q(".pod-box").forEach(pb => pb.classList.remove("pending","gone"));
    // node frames reset
    ["n1","n2"].forEach(n => { const f=$("frame-"+n); if(f){f.classList.remove("dead"); f.style.stroke=""; f.style.opacity="";} });

    // desired bar
    if (cur === "reconcile" && idx >= 0) {
      const live = sc.frames[idx].live;
      $("desired").innerHTML = `<span class="dtag">원하는 상태</span> <span class="dval">Pod ${sc.desired}</span> &nbsp;·&nbsp; <span class="dtag">실제 상태</span> <span class="dval" style="color:${live===sc.desired?'rgb(102,187,106)':'rgb(244,67,54)'}">Pod ${live}</span>`;
    } else { $("desired").innerHTML = ""; }

    if (idx < 0) return;

    // 누적: 0..idx 프레임에서 등장한 pod/edge 를 done 처리, idx 프레임은 on
    const f = sc.frames[idx];

    // dead node
    if (f.deadNode) {
      const fr = $("frame-"+f.deadNode);
      if (fr) { fr.style.stroke = "rgb(244,67,54)"; fr.style.opacity = "0.55"; }
      ["kubelet-"+f.deadNode, "kproxy-"+f.deadNode].forEach(id => { const b=$("box-"+id); if(b) b.classList.add("dead"); });
    }

    // 지난 프레임 박스 done
    for (let k=0; k<idx; k++) {
      (sc.frames[k].boxes||[]).forEach(id => { const b=$("box-"+id); if(b && !b.classList.contains("on")) b.classList.add("done"); });
    }
    // 현재 프레임 박스 on
    (f.boxes||[]).forEach(id => { const b=$("box-"+id); if(b){ b.classList.remove("done"); b.classList.add("on"); const nm=$("name-"+id); if(nm) nm.classList.add("on-name"); } });
    // on 안 된 이름 원복
    q(".comp-name").forEach(nm => { const id=nm.id.replace("name-",""); const b=$("box-"+id); if(!b||!b.classList.contains("on")) nm.classList.remove("on-name"); });

    // 현재 프레임 edge on
    (f.edges||[]).forEach(id => {
      const e=$("edge-"+id); const l=$("elbl-"+id);
      if(e){ e.classList.add("on"); e.setAttribute("marker-end","url(#arrowOn)"); }
      if(l) l.classList.add("on");
    });

    // pods: 누적 표시 — idx 프레임의 pods 상태를 그대로 반영
    if (f.pods) {
      Object.entries(f.pods).forEach(([slot, st]) => {
        const p=$("pod-"+slot); if(!p) return;
        p.classList.remove("hidden");
        const pb = p.querySelector(".pod-box");
        pb.classList.remove("pending","gone");
        if (st==="pending") pb.classList.add("pending");
        else if (st==="gone") pb.classList.add("gone");
        else if (st==="appear") { p.classList.remove("appear"); void p.offsetWidth; p.classList.add("appear"); }
        // running = 초록 기본
      });
    }
  }

  function render() {
    const sc = SCENARIOS[cur];
    renderSelector();
    applyState();
    if (idx < 0) {
      $("narr-title").textContent = "시작하기";
      $("narr-body").innerHTML = `<div class="start-overlay"><button class="btn-start" id="btnStart">▶ 재생</button><div class="start-hint">${sc.label} 시나리오를 단계별로 따라갑니다 — 화살표가 데이터 흐름입니다</div></div>`;
      $("btnStart").onclick = play;
    } else {
      const f = sc.frames[idx];
      $("narr-title").textContent = f.title;
      $("narr-body").innerHTML = f.body;
    }
    $("counter").textContent = `${idx+1} / ${sc.frames.length}`;
    $("prev").disabled = idx < 0;
    $("next").disabled = idx >= sc.frames.length-1;
    $("play").textContent = playing ? "⏸ 일시정지" : "▶ 재생";
  }

  function step() {
    const sc = SCENARIOS[cur];
    if (idx >= sc.frames.length-1) { stop(); return; }
    idx++; render();
  }
  function play() {
    if (playing) { stop(); return; }
    playing = true;
    if (idx >= SCENARIOS[cur].frames.length-1) idx = -1;
    step(); timer = setInterval(step, speed); render();
  }
  function stop() { playing = false; if (timer) clearInterval(timer); timer = null; render(); }
  function reset() { stop(); idx = -1; mountStage(); render(); }

  $("next").onclick = () => { stop(); step(); };
  $("prev").onclick = () => { stop(); if (idx>=0) idx--; render(); };
  $("play").onclick = play;
  q(".speed-btn").forEach(b => b.onclick = () => {
    q(".speed-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active"); speed = +b.dataset.s;
    if (playing) { clearInterval(timer); timer = setInterval(step, speed); }
  });

  reset();
  </script>
</body>
</html>

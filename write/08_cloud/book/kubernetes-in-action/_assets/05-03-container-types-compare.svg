<svg viewBox="0 0 960 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>세 가지 컨테이너 종류의 생명주기 비교</title>
  <desc>init 컨테이너·일반 사이드카·네이티브 사이드카를 시작 시점, 종료 시점, 정의 위치, 용도로 비교한다. init 은 주 컨테이너 전에 순차로 돌고 끝나면 죽는다. 일반 사이드카는 주 컨테이너와 병렬로 시작하고 함께 죽는다. 네이티브 사이드카는 init 자리에 restartPolicy Always 를 붙여 주 컨테이너보다 먼저 뜨고 맨 마지막에 죽는다.</desc>
  <defs>
    <style>
      .title { font-size: 16px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 10.5px; fill: rgb(138,133,128); }
      .hd    { font-size: 13px; font-weight: 800; }
      .rowlbl{ font-size: 10.5px; font-weight: 800; fill: rgb(212,168,83); }
      .cell  { font-size: 10px; fill: #1a1a1a; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">init 컨테이너 · 일반 사이드카 · 네이티브 사이드카 — 무엇이 다른가</text>
  <text x="24" y="54" class="sub">시작·종료 시점과 정의 위치가 다르다. 세 컬럼으로 비교한다.</text>

  <!-- 행 레이블 열 -->
  <text x="30" y="150" class="rowlbl">시작 시점</text>
  <text x="30" y="222" class="rowlbl">종료 시점</text>
  <text x="30" y="294" class="rowlbl">정의 위치</text>
  <text x="30" y="366" class="rowlbl">언제 쓰나</text>

  <!-- ===== 컬럼 1: init 컨테이너 (초록) ===== -->
  <rect x="150" y="78" width="250" height="40" rx="8" fill="#66bb6a" stroke="#3d8b40" stroke-width="1.3"/>
  <text x="275" y="104" class="hd" text-anchor="middle" style="fill:#0d0d0d">init 컨테이너</text>
  <!-- 시작 -->
  <rect x="150" y="126" width="250" height="56" rx="7" fill="#cdeccf" stroke="#3d8b40" stroke-width="1"/>
  <text x="160" y="148" class="cell">주 컨테이너 <tspan style="font-weight:800">전에</tspan>, 순차로</text>
  <text x="160" y="166" class="cell">(하나 끝나야 다음)</text>
  <!-- 종료 -->
  <rect x="150" y="198" width="250" height="56" rx="7" fill="#cdeccf" stroke="#3d8b40" stroke-width="1"/>
  <text x="160" y="220" class="cell"><tspan style="font-weight:800">끝나면 죽는다</tspan> (일회성)</text>
  <text x="160" y="238" class="cell">Completed 후 사라짐</text>
  <!-- 정의 -->
  <rect x="150" y="270" width="250" height="48" rx="7" fill="#cdeccf" stroke="#3d8b40" stroke-width="1"/>
  <text x="160" y="298" class="cell mono">initContainers</text>
  <!-- 용도 -->
  <rect x="150" y="334" width="250" height="56" rx="7" fill="#cdeccf" stroke="#3d8b40" stroke-width="1"/>
  <text x="160" y="356" class="cell">시작 전 준비: 파일·인증서</text>
  <text x="160" y="374" class="cell">생성, 전제조건 대기</text>

  <!-- ===== 컬럼 2: 일반 사이드카 (파랑) ===== -->
  <rect x="416" y="78" width="250" height="40" rx="8" fill="#5b9bd5" stroke="#2f6ba3" stroke-width="1.3"/>
  <text x="541" y="104" class="hd" text-anchor="middle" style="fill:#e8e4df">일반 사이드카</text>
  <rect x="416" y="126" width="250" height="56" rx="7" fill="#dceaf7" stroke="#2f6ba3" stroke-width="1"/>
  <text x="426" y="148" class="cell">주 컨테이너와 <tspan style="font-weight:800">동시</tspan></text>
  <text x="426" y="166" class="cell">(병렬 시작)</text>
  <rect x="416" y="198" width="250" height="56" rx="7" fill="#dceaf7" stroke="#2f6ba3" stroke-width="1"/>
  <text x="426" y="220" class="cell">주 컨테이너와 <tspan style="font-weight:800">함께</tspan></text>
  <text x="426" y="238" class="cell">(먼저 죽을 위험 있음)</text>
  <rect x="416" y="270" width="250" height="48" rx="7" fill="#dceaf7" stroke="#2f6ba3" stroke-width="1"/>
  <text x="426" y="298" class="cell mono">containers</text>
  <rect x="416" y="334" width="250" height="56" rx="7" fill="#dceaf7" stroke="#2f6ba3" stroke-width="1"/>
  <text x="426" y="356" class="cell">먼저 뜰 필요 없고 같이</text>
  <text x="426" y="374" class="cell">죽어도 되는 보조 (예: envoy)</text>

  <!-- ===== 컬럼 3: 네이티브 사이드카 (앰버) ===== -->
  <rect x="682" y="78" width="254" height="40" rx="8" fill="rgb(212,168,83)" stroke="#a67c1a" stroke-width="1.3"/>
  <text x="809" y="104" class="hd" text-anchor="middle" style="fill:#0d0d0d">네이티브 사이드카</text>
  <rect x="682" y="126" width="254" height="56" rx="7" fill="#faeecd" stroke="#a67c1a" stroke-width="1"/>
  <text x="692" y="148" class="cell">주 컨테이너보다 <tspan style="font-weight:800">먼저</tspan></text>
  <text x="692" y="166" class="cell">(init 도 서비스 받음)</text>
  <rect x="682" y="198" width="254" height="56" rx="7" fill="#faeecd" stroke="#a67c1a" stroke-width="1"/>
  <text x="692" y="220" class="cell">주 컨테이너 다 죽은 뒤</text>
  <text x="692" y="238" class="cell"><tspan style="font-weight:800">맨 마지막</tspan></text>
  <rect x="682" y="270" width="254" height="48" rx="7" fill="#faeecd" stroke="#a67c1a" stroke-width="1"/>
  <text x="692" y="292" class="cell mono">initContainers +</text>
  <text x="692" y="308" class="cell mono" style="font-weight:800">restartPolicy: Always</text>
  <rect x="682" y="334" width="254" height="56" rx="7" fill="#faeecd" stroke="#a67c1a" stroke-width="1"/>
  <text x="692" y="356" class="cell">Pod에 <tspan style="font-weight:800">반드시 필요한</tspan> 사이드카,</text>
  <text x="692" y="374" class="cell">배치 Job(18장) 사이드카</text>
</svg>

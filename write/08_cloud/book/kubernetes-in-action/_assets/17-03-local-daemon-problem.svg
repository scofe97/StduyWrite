<svg viewBox="0 0 960 280" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>클라이언트가 로컬 daemon 파드에만 연결하는 문제</title>
  <desc>각 클라이언트 파드가 같은 노드의 daemon 파드에만 연결해야 한다. 다른 노드의 에이전트로 가면 안 된다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .agent { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .client{ font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .node  { font-size: 11px; font-weight: 700; fill: rgb(138,133,128); }
      .note  { font-size: 10px; fill: #e8e4df; }
    </style>
    <marker id="ldp-a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(102,187,106)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="280" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">문제 — 클라이언트를 로컬 daemon 파드에만 연결</text>
  <text x="24" y="50" class="sub">각 kiada 파드는 자기 노드의 node-agent에만, 다른 노드로 가면 안 됨</text>

  <!-- DaemonSet -->
  <rect x="30" y="80" width="150" height="40" rx="6" fill="rgb(150,220,160)"/><text x="105" y="105" class="agent" text-anchor="middle">DaemonSet node-agent</text>

  <!-- 3 nodes -->
  <g>
    <rect x="240" y="80" width="220" height="150" rx="8" fill="none" stroke="rgb(70,70,70)" stroke-width="1.5"/><text x="350" y="220" class="node" text-anchor="middle">Node A</text>
    <rect x="490" y="80" width="200" height="150" rx="8" fill="none" stroke="rgb(70,70,70)" stroke-width="1.5"/><text x="590" y="220" class="node" text-anchor="middle">Node B</text>
    <rect x="720" y="80" width="200" height="150" rx="8" fill="none" stroke="rgb(70,70,70)" stroke-width="1.5"/><text x="820" y="220" class="node" text-anchor="middle">Node C</text>
  </g>

  <!-- Node A: agent + client -->
  <rect x="260" y="100" width="120" height="34" rx="5" fill="rgb(102,187,106)"/><text x="320" y="122" class="agent" text-anchor="middle">node-agent</text>
  <rect x="260" y="150" width="120" height="34" rx="5" fill="rgb(91,155,213)"/><text x="320" y="172" class="client" text-anchor="middle" style="fill:#e8e4df">kiada</text>
  <line x1="320" y1="150" x2="320" y2="136" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#ldp-a)"/>
  <!-- forbidden cross-node arrow -->
  <line x1="380" y1="167" x2="500" y2="120" stroke="rgb(240,150,190)" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="440" y1="135" x2="452" y2="147" stroke="rgb(240,150,190)" stroke-width="2.5"/><line x1="452" y1="135" x2="440" y2="147" stroke="rgb(240,150,190)" stroke-width="2.5"/>

  <!-- Node B -->
  <rect x="510" y="100" width="120" height="34" rx="5" fill="rgb(102,187,106)"/><text x="570" y="122" class="agent" text-anchor="middle">node-agent</text>
  <rect x="510" y="150" width="120" height="34" rx="5" fill="rgb(91,155,213)"/><text x="570" y="172" class="client" text-anchor="middle" style="fill:#e8e4df">kiada</text>
  <line x1="570" y1="150" x2="570" y2="136" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#ldp-a)"/>

  <!-- Node C -->
  <rect x="740" y="100" width="120" height="34" rx="5" fill="rgb(102,187,106)"/><text x="800" y="122" class="agent" text-anchor="middle">node-agent</text>
  <rect x="740" y="150" width="120" height="34" rx="5" fill="rgb(91,155,213)"/><text x="800" y="172" class="client" text-anchor="middle" style="fill:#e8e4df">kiada</text>
  <line x1="800" y1="150" x2="800" y2="136" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#ldp-a)"/>

  <line x1="180" y1="100" x2="238" y2="105" stroke="rgb(138,133,128)" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="480" y="258" class="note" text-anchor="middle" fill="rgb(240,150,190)">✕ 다른 노드 에이전트로 가면 안 됨 — 로컬(초록)만 허용</text>
</svg>

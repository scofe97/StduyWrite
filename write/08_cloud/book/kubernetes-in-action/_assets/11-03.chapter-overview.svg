<svg viewBox="0 0 820 500" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>11-03 전체 지도 — 명단에 오르는 것과 명단이 불리는 것</title>
  <desc>Service 뒤에 있는 엔드포인트 명단에서 출발해, 그 명단이 EndpointSlice로 쪼개진 이유, 명단이 DNS 레코드로 불리는 방식(headless는 파드 IP를 그대로 돌려줌), 가까운 엔드포인트로 보내는 트래픽 정책, 그리고 파드가 언제 그 명단에 오르는지를 세로로 이은 그림입니다. DNS 단계에는 headless가 cluster IP 대신 파드 IP를 돌려준다는 열쇠 표시가, readiness 단계에는 외부 의존을 검사하면 전체가 동시에 빠진다는 주의 표시가 붙어 있습니다.</desc>
  <rect width="820" height="500" fill="#0d0d0d"/>

  <text x="40" y="40" fill="#e8e4df" font-size="15" font-weight="700">명단에 오르는 것과, 그 명단이 불리는 것</text>

  <rect x="40" y="62" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="88" fill="#0d0d0d" font-size="14" font-weight="700">진입·1. Service 뒤에는 명단이 있습니다</text>
  <text x="740" y="88" text-anchor="end" fill="#3a3632" font-size="11">진입 · §1</text>
  <text x="60" y="112" fill="#3a3632" font-size="12">Service spec 에는 파드 목록이 없습니다</text>
  <text x="440" y="112" fill="#3a3632" font-size="12">IP를 가진 것이면 무엇이든 (외부 IP까지)</text>

  <path d="M410 128 L410 150" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="154" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="180" fill="#0d0d0d" font-size="14" font-weight="700">1. 명단을 조각내는 이유는 전송량입니다</text>
  <text x="740" y="180" text-anchor="end" fill="#3a3632" font-size="11">§1</text>
  <text x="60" y="204" fill="#3a3632" font-size="12">Endpoints: 하나 바뀌면 전체를 모든 노드로</text>
  <text x="440" y="204" fill="#3a3632" font-size="12">EndpointSlice: 바뀐 조각만</text>

  <path d="M410 220 L410 242" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="246" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="272" fill="#0d0d0d" font-size="14" font-weight="700">2. 명단이 DNS로 불립니다</text>
  <text x="740" y="272" text-anchor="end" fill="#3a3632" font-size="11">§2</text>
  <text x="60" y="296" fill="#3a3632" font-size="12">A · SRV · CNAME</text>
  <rect x="300" y="282" width="420" height="22" rx="3" fill="rgb(212,168,83)"/>
  <text x="312" y="297" fill="#0d0d0d" font-size="11.5" font-weight="700">열쇠 · headless 는 파드 IP 전부를 그대로 돌려줍니다</text>

  <path d="M410 326 L410 348" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="352" width="740" height="108" rx="4" fill="#e8e4df"/>
  <text x="60" y="378" fill="#0d0d0d" font-size="14" font-weight="700">3·4. 어디로 보낼지, 언제 명단에 올릴지</text>
  <text x="740" y="378" text-anchor="end" fill="#3a3632" font-size="11">§3 · §4</text>
  <text x="60" y="402" fill="#3a3632" font-size="12">토폴로지: 같은 존 안에서 먼저 고릅니다</text>
  <rect x="60" y="416" width="660" height="22" rx="3" fill="#f2d4d4"/>
  <text x="72" y="431" fill="#7a1f1f" font-size="11.5" font-weight="700">주의 · readiness 가 외부 의존을 보면 모든 파드가 동시에 빠집니다</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8b3ad"/>
    </marker>
  </defs>
</svg>

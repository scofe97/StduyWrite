<svg viewBox="0 0 1120 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>termination과 passthrough — 암호가 풀리는 지점이 어긋나고, 그 차이가 곧 기능 차이입니다</title>
  <desc>두 방식을 같은 가로축 위에 나란히 놓아 암호가 풀리는 지점을 대비한다. 위쪽 termination 은 클라이언트에서 프록시까지만 굵은 이중선의 TLS 구간이고 프록시 자리에서 자물쇠가 열리며, 그 뒤 파드까지는 점선의 평문 구간이다. 아래쪽 passthrough 는 클라이언트에서 파드까지 이중선이 끊기지 않고 이어지며 자물쇠는 맨 오른쪽 파드에서야 열린다. 두 자물쇠의 가로 위치가 어긋나 있고 그 위치 차이가 프록시가 무엇을 볼 수 있는지를 정한다. 프록시가 보는 것은 termination 에서는 GET 슬래시 quote 와 Host 헤더 같은 평문 HTTP 이고, passthrough 에서는 17 03 03 으로 시작하는 암호문 바이트뿐이다. 아래 세 줄의 기능 대비는 같은 높이에 맞춰 정렬되어 경로 분기와 헤더 조작과 쿠키 어피니티가 termination 에서는 모두 가능하고 passthrough 에서는 모두 불가능함을 보여 준다. 마지막으로 호스트 분기만 예외인데, SNI 필드는 핸드셰이크 중이라 평문으로 읽히기 때문이다.</desc>
  <defs>
    <style>
      .h1   { font-size: 23px; font-weight: 800; fill: #e8e4df; }
      .sub  { font-size: 14px; fill: rgb(168,163,158); }
      .col  { font-size: 16px; font-weight: 800; }
      .lyr  { font-size: 12px; font-weight: 800; fill: rgb(168,163,158); }
      .tag  { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .mono { font-size: 12px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .monod{ font-size: 12.5px; font-weight: 800; fill: rgb(240,150,190); font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .who  { font-size: 12.5px; fill: rgb(168,163,158); }
      .good { font-size: 13px; font-weight: 700; fill: rgb(102,187,106); }
      .bad  { font-size: 13px; font-weight: 700; fill: rgb(240,150,190); }
      .rowl { font-size: 12.5px; font-weight: 700; fill: rgb(168,163,158); }
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="560" fill="#0d0d0d"/>

  <text x="30" y="40" class="h1">암호가 풀리는 자리가 어긋납니다 — 그 차이가 곧 기능 차이입니다</text>
  <text x="30" y="64" class="sub">같은 가로축에 놓고 ▲ 표시가 어디 붙는지만 비교합니다. 굵은 이중선 = TLS 구간 · 점선 = 평문 구간.</text>

  <!-- 세로 기준선 -->
  <line x1="628" y1="88" x2="628" y2="330" stroke="rgb(42,37,32)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ══ termination ══ -->
  <rect x="30" y="88" width="1060" height="112" rx="10" fill="rgb(22,22,22)" stroke="rgb(102,187,106)" stroke-width="1.6"/>
  <text x="52" y="114" class="col" style="fill:rgb(102,187,106)">termination — 프록시가 풉니다</text>
  <text x="330" y="114" class="who">인증서를 쥔 쪽: 프록시</text>

  <rect x="52" y="132" width="130" height="40" rx="7" fill="rgb(91,155,213)"/>
  <text x="117" y="157" class="tag" style="fill:#e8e4df" text-anchor="middle">클라이언트</text>

  <line x1="186" y1="147" x2="562" y2="147" stroke="rgb(102,187,106)" stroke-width="3"/>
  <line x1="186" y1="157" x2="562" y2="157" stroke="rgb(102,187,106)" stroke-width="3"/>
  <text x="374" y="188" class="good" text-anchor="middle">TLS 구간</text>

  <rect x="568" y="132" width="120" height="40" rx="7" fill="rgb(212,168,83)"/>
  <text x="628" y="157" class="tag" text-anchor="middle">프록시</text>
  <text x="628" y="188" class="good" text-anchor="middle">▲ 여기서 풉니다</text>

  <line x1="694" y1="152" x2="936" y2="152" stroke="rgb(168,163,158)" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="815" y="188" class="rowl" text-anchor="middle">평문 HTTP</text>

  <rect x="942" y="132" width="118" height="40" rx="7" fill="rgb(91,155,213)"/>
  <text x="1001" y="157" class="tag" style="fill:#e8e4df" text-anchor="middle">파드</text>

  <!-- ══ passthrough ══ -->
  <rect x="30" y="216" width="1060" height="112" rx="10" fill="rgb(22,22,22)" stroke="rgb(240,150,190)" stroke-width="1.6"/>
  <text x="52" y="242" class="col" style="fill:rgb(240,150,190)">passthrough — 파드가 풉니다</text>
  <text x="330" y="242" class="who">인증서를 쥔 쪽: 파드</text>

  <rect x="52" y="260" width="130" height="40" rx="7" fill="rgb(91,155,213)"/>
  <text x="117" y="285" class="tag" style="fill:#e8e4df" text-anchor="middle">클라이언트</text>

  <line x1="186" y1="275" x2="562" y2="275" stroke="rgb(240,150,190)" stroke-width="3"/>
  <line x1="186" y1="285" x2="562" y2="285" stroke="rgb(240,150,190)" stroke-width="3"/>

  <rect x="568" y="260" width="120" height="40" rx="7" fill="rgb(58,58,58)"/>
  <text x="628" y="285" class="tag" style="fill:rgb(200,196,192)" text-anchor="middle">프록시</text>
  <text x="628" y="316" class="bad" text-anchor="middle">✗ 못 풉니다</text>

  <line x1="694" y1="275" x2="936" y2="275" stroke="rgb(240,150,190)" stroke-width="3"/>
  <line x1="694" y1="285" x2="936" y2="285" stroke="rgb(240,150,190)" stroke-width="3"/>
  <text x="374" y="316" class="bad" text-anchor="middle">TLS 구간 — 끊기지 않고 파드까지</text>

  <rect x="942" y="260" width="118" height="40" rx="7" fill="rgb(212,168,83)"/>
  <text x="1001" y="285" class="tag" text-anchor="middle">파드</text>
  <text x="1001" y="316" class="good" text-anchor="middle">▲ 여기서 풉니다</text>

  <!-- ══ 프록시가 보는 것 ══ -->
  <text x="30" y="366" class="lyr">프록시가 보는 것</text>

  <rect x="30" y="378" width="524" height="56" rx="8" fill="rgb(212,168,83)"/>
  <text x="46" y="400" class="mono">GET /quote HTTP/1.1</text>
  <text x="46" y="422" class="mono">Host: api.example.com</text>

  <rect x="566" y="378" width="524" height="56" rx="8" fill="rgb(28,24,26)" stroke="rgb(240,150,190)" stroke-width="1.3"/>
  <text x="582" y="400" class="monod">17 03 03 04 a1 9f 2c 8e b3 ...</text>
  <text x="582" y="422" class="who">경로가 어디에 적혀 있는지조차 알 수 없습니다</text>

  <!-- ══ 기능 3행 — 같은 y 정렬 ══ -->
  <text x="30" y="464" class="rowl">경로 분기 (pathType)</text>
  <text x="380" y="464" class="good">✓ 작동합니다</text>
  <text x="566" y="464" class="rowl">경로 분기 (pathType)</text>
  <text x="916" y="464" class="bad">✗ 작동할 수 없습니다</text>

  <text x="30" y="490" class="rowl">헤더 조작 · URL 재작성</text>
  <text x="380" y="490" class="good">✓ 가능합니다</text>
  <text x="566" y="490" class="rowl">헤더 조작 · URL 재작성</text>
  <text x="916" y="490" class="bad">✗ 불가능합니다</text>

  <text x="30" y="516" class="rowl">쿠키 기반 세션 어피니티</text>
  <text x="380" y="516" class="good">✓ 가능합니다</text>
  <text x="566" y="516" class="rowl">쿠키 기반 세션 어피니티</text>
  <text x="916" y="516" class="bad">✗ 불가능합니다</text>

  <!-- ══ SNI 예외 ══ -->
  <rect x="30" y="530" width="1060" height="0" fill="none"/>
  <text x="30" y="548" class="who">호스트 분기만 예외입니다 — <tspan font-weight="700" fill="#e8e4df">SNI</tspan> 는 핸드셰이크 중이라 평문으로 읽히므로 passthrough 에서도 됩니다.</text>
</svg>

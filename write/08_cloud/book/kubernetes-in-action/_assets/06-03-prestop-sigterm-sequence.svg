<title id="dt">PreStop 이 끝날 때까지 SIGTERM 전송을 미룬다</title><desc id="dd">kubectl delete pod 가 오면 deletionGracePeriodSeconds(기본 30s) 카운트가 시작되고, kubelet 은 PreStop hook(예: sleep 2)이 끝난 뒤에야 메인 프로세스에 SIGTERM(15)을 보낸다.</desc>

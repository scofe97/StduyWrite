<title id="dt">소속을 정하는 것은 위치가 아니라 label 이다</title><desc id="dd">같은 네임스페이스에 나란히 떠 있어도 selector 에 맞지 않으면 이 세트의 파드가 아니다. 무시한다는 것은 세지도 지우지도 않는다는 뜻이다.</desc>
<rect width="1200" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 14-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">소속을 정하는 것은 위치가 아니라 label 이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">selector: app=kiada, rel=stable</text>
<rect x="60" y="232" width="260" height="128" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="190" y="264" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">ReplicaSet kiada</text>
<text x="190" y="292" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">app=kiada</text>
<text x="190" y="312" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">rel=stable</text>
<text x="190" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">이 둘을 다 가진 파드만</text>
<rect x="420" y="160" width="340" height="276" rx="8" fill="#0D1117" stroke="#3FB98C" stroke-width="0.9"/>
<text x="590" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">selector 에 맞는다 — 이 세트의 파드</text>
<rect x="450" y="200" width="280" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="590" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">kiada-0</text>
<text x="590" y="242" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">app=kiada · rel=stable</text>
<path d="M 324 296 L 444 226" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="450" y="266" width="280" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="590" y="290" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">kiada-1</text>
<text x="590" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">app=kiada · rel=stable</text>
<path d="M 324 296 L 444 292" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<rect x="450" y="332" width="280" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="590" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">kiada-2</text>
<text x="590" y="374" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">app=kiada · rel=stable</text>
<path d="M 324 296 L 444 358" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="590" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">replicas 를 채우는 데 셈해진다</text>
<rect x="820" y="160" width="340" height="276" rx="8" fill="#0D1117" stroke="#E3B341" stroke-width="0.9"/>
<text x="990" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">맞지 않는다 — 무시한다</text>
<rect x="850" y="206" width="280" height="52" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="990" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">quote-0</text>
<text x="990" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">app=quote</text>
<rect x="850" y="276" width="280" height="52" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="990" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">kiada-canary</text>
<text x="990" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">app=kiada · rel=canary</text>
<rect x="865.0" y="358" width="250" height="28" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="990" y="377" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">세지도 지우지도 않는다</text>
<text x="990" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">replicas 계산 밖 · 스케일다운 대상 밖</text>
<text x="24" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 rel 값 하나만 달라도 세트에서 빠진다. 14-02 에서 문제 파드를 조사할 때 label 을 바꿔 세트에서 빼는 수가 이 성질을 이용한 것이다.</text>
<text x="24" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">template 의 label 은 selector 의 label 을 포함해야 한다 — 아니면 만든 파드가 자기 수에 안 잡혀 파드가 무한히 생성되므로 API 가 거부한다.</text>
<line x1="12" y1="548" x2="1152" y2="548" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="570" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="560" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">세트의 파드</text>
<rect x="222" y="560" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="244" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">무시되는 파드</text>
<rect x="357" y="560" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="379" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">무시의 두 뜻</text>
</svg>
<svg viewBox="0 0 900 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>ReplicaSet label selector가 파드 소속을 정한다</title>
  <desc>ReplicaSet의 label selector(app=kiada, rel=stable)에 맞는 파드는 이 ReplicaSet이 관리하고, 맞지 않는 파드(Quote, app=quote)는 무시한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: #b8b3ad; }
      .rs    { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .sel   { font-size: 11px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .pod   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .lblk  { font-size: 10px; font-weight: 700; fill: #0d0d0d; }
      .note  { font-size: 11px; fill: #e8e4df; }
      .ign   { font-size: 11px; fill: rgb(240,150,190); }
    </style>
    <marker id="rls-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="340" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">label selector가 어느 파드가 세트에 속하는지 정합니다</text>
  <text x="24" y="50" class="sub">selector에 맞는 파드만 관리하고, 맞지 않는 파드는 무시합니다</text>

  <!-- ReplicaSet + selector -->
  <rect x="40" y="80" width="220" height="90" rx="10" fill="rgb(200,220,245)" stroke="rgb(91,155,213)" stroke-width="1.5"/>
  <text x="150" y="106" class="rs" text-anchor="middle">kiada ReplicaSet</text>
  <rect x="60" y="120" width="180" height="38" rx="6" fill="rgb(91,155,213)"/>
  <text x="150" y="137" class="sel" text-anchor="middle">selector:</text>
  <text x="150" y="152" class="sel" text-anchor="middle">app=kiada, rel=stable</text>

  <!-- matched pods (dashed box) -->
  <rect x="40" y="200" width="560" height="110" rx="10" fill="none" stroke="rgb(212,168,83)" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="320" y="222" class="note" text-anchor="middle" fill="rgb(212,168,83)">selector에 맞음 → ReplicaSet이 관리</text>
  <g>
    <rect x="70" y="235" width="150" height="60" rx="8" fill="rgb(91,155,213)"/>
    <rect x="245" y="235" width="150" height="60" rx="8" fill="rgb(91,155,213)"/>
    <rect x="420" y="235" width="150" height="60" rx="8" fill="rgb(91,155,213)"/>
  </g>
  <g class="pod" text-anchor="middle">
    <text x="145" y="262">kiada pod</text><text x="320" y="262">kiada pod</text><text x="495" y="262">kiada pod</text>
  </g>
  <g class="lblk" text-anchor="middle">
    <text x="145" y="282">app=kiada rel=stable</text><text x="320" y="282">app=kiada rel=stable</text><text x="495" y="282">app=kiada rel=stable</text>
  </g>

  <!-- selector to matched -->
  <line x1="150" y1="170" x2="150" y2="233" stroke="rgb(212,168,83)" stroke-width="1.8" marker-end="url(#rls-a)"/>

  <!-- ignored pod -->
  <rect x="660" y="235" width="180" height="60" rx="8" fill="rgb(176,172,167)"/>
  <text x="750" y="262" class="pod" text-anchor="middle" style="fill:#0d0d0d">Quote pod</text>
  <text x="750" y="282" class="lblk" text-anchor="middle" style="fill:#0d0d0d">app=quote rel=stable</text>
  <text x="750" y="222" class="ign" text-anchor="middle">selector 불일치 → 무시</text>
</svg>

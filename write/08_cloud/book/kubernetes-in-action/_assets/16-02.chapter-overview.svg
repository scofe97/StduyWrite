<svg viewBox="0 0 820 600" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>16-02 전체 지도 — 상황별로 갈라지는 StatefulSet의 대응</title>
  <desc>StatefulSet이 마주하는 네 상황을 증상별 줄기로 갈라 놓은 진단표입니다. 파드만 사라진 경우는 컨트롤러가 자동 교체하고, 노드가 끊긴 경우는 자동 교체하지 않아 운영자가 판단해야 하며, 스케일다운은 파드만 지우고 PVC를 남기고, 그 PVC를 자동 삭제하려면 retention 정책을 씁니다. 스케일다운과 retention 사이에만 화살표가 있고 나머지 줄기는 서로 독립입니다. 마지막에 Pod 관리 정책이 이 모든 줄기의 속도를 정한다는 띠가 가로로 놓여 있습니다.</desc>
  <rect width="820" height="600" fill="#0d0d0d"/>

  <text x="40" y="40" fill="#e8e4df" font-size="15" font-weight="700">무엇이 사라졌는가에 따라 갈린다</text>

  <line x1="40" y1="62" x2="40" y2="472" stroke="#b8b3ad" stroke-width="2"/>

  <rect x="60" y="62" width="720" height="78" rx="4" fill="#e8e4df"/>
  <text x="80" y="88" fill="#0d0d0d" font-size="14" font-weight="700">파드만 사라짐</text>
  <text x="740" y="88" text-anchor="end" fill="#3a3632" font-size="11">§1</text>
  <text x="80" y="112" fill="#3a3632" font-size="12">같은 이름으로 재생성</text>
  <text x="300" y="112" fill="#3a3632" font-size="12">같은 PVC 재부착</text>
  <text x="80" y="131" fill="#3a3632" font-size="12">IP는 바뀌고 DNS가 따라감</text>

  <rect x="60" y="154" width="720" height="98" rx="4" fill="#e8e4df"/>
  <text x="80" y="180" fill="#0d0d0d" font-size="14" font-weight="700">노드가 끊김</text>
  <text x="740" y="180" text-anchor="end" fill="#3a3632" font-size="11">§2</text>
  <text x="80" y="204" fill="#3a3632" font-size="12">컨테이너는 아직 돈다</text>
  <text x="300" y="204" fill="#3a3632" font-size="12">자동 교체하지 않는다</text>
  <rect x="80" y="216" width="230" height="22" rx="3" fill="rgb(212,168,83)"/>
  <text x="92" y="231" fill="#0d0d0d" font-size="11.5" font-weight="700">주의 · 죽었는지 먼저 확인</text>
  <rect x="330" y="216" width="220" height="22" rx="3" fill="#f2d4d4"/>
  <text x="342" y="231" fill="#7a1f1f" font-size="11.5" font-weight="700">위험 · 강제 삭제는 중복</text>

  <rect x="60" y="266" width="720" height="78" rx="4" fill="#e8e4df"/>
  <text x="80" y="292" fill="#0d0d0d" font-size="14" font-weight="700">스케일다운</text>
  <text x="740" y="292" text-anchor="end" fill="#3a3632" font-size="11">§3</text>
  <text x="80" y="316" fill="#3a3632" font-size="12">높은 ordinal부터 삭제</text>
  <text x="300" y="316" fill="#3a3632" font-size="12">PVC는 남는다</text>
  <text x="80" y="335" fill="#3a3632" font-size="12">스케일업하면 재부착</text>

  <path d="M410 344 L410 366" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="370" width="720" height="98" rx="4" fill="#e8e4df"/>
  <text x="80" y="396" fill="#0d0d0d" font-size="14" font-weight="700">그 PVC를 지우려면</text>
  <text x="740" y="396" text-anchor="end" fill="#3a3632" font-size="11">§4</text>
  <text x="80" y="420" fill="#3a3632" font-size="12">whenScaled</text>
  <text x="220" y="420" fill="#3a3632" font-size="12">whenDeleted</text>
  <text x="380" y="420" fill="#3a3632" font-size="12">기본 Retain</text>
  <rect x="80" y="432" width="250" height="22" rx="3" fill="#f2d4d4"/>
  <text x="92" y="447" fill="#7a1f1f" font-size="11.5" font-weight="700">위험 · 둘 다 Delete면 유실</text>
  <text x="350" y="447" fill="#3a3632" font-size="12">노드 장애에는 미적용</text>

  <rect x="40" y="496" width="740" height="76" rx="4" fill="#e8e4df"/>
  <text x="60" y="522" fill="#0d0d0d" font-size="14" font-weight="700">속도는 관리 정책이 정한다</text>
  <text x="740" y="522" text-anchor="end" fill="#3a3632" font-size="11">§5</text>
  <text x="60" y="546" fill="#3a3632" font-size="12">OrderedReady — 하나씩</text>
  <text x="300" y="546" fill="#3a3632" font-size="12">Parallel — 동시에</text>
  <text x="500" y="546" fill="#3a3632" font-size="12">quorum 의존이면 교착</text>
  <text x="60" y="565" fill="#3a3632" font-size="12">순서만 완화, 신원은 유지</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8b3ad"/>
    </marker>
  </defs>
</svg>

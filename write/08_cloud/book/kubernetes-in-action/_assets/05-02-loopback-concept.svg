<svg viewBox="0 0 1040 500" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>loopback — 자기 자신에게 되돌아오는 네트워크 통로</title>
  <desc>보통의 통신은 커널을 거쳐 랜카드(eth0)로 물리 네트워크에 나가 다른 컴퓨터에 닿는다. loopback(127.0.0.1)으로 보낸 패킷은 랜카드로 나가지 않고 커널 안에서 곧바로 자기 자신에게 되돌아온다. port-forward에서 kubelet이 Pod의 loopback을 통해 컨테이너에 붙기 때문에, 컨테이너는 요청이 자기에게서 온 것으로 보아 Client IP를 127.0.0.1로 찍는다.</desc>
  <defs>
    <style>
      .title  { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .zone   { font-size: 12px; font-weight: 800; fill: rgb(212,168,83); }
      .box    { font-size: 12px; font-weight: 800; fill: #0d0d0d; }
      .boxd   { font-size: 12px; font-weight: 800; fill: #e8e4df; }
      .desc   { font-size: 10px; font-weight: 600; fill: #e8e4df; }
      .muted  { font-size: 9.5px; fill: rgb(138,133,128); }
      .mono   { font-size: 10px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="500" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">loopback — 자기 자신에게 되돌아오는 네트워크 통로</text>
  <text x="24" y="50" class="sub">보낸 패킷이 랜카드(물리 네트워크)로 나가지 않고 커널 안에서 곧바로 자기에게 돌아온다. 주소는 127.0.0.1(localhost).</text>

  <!-- 좌: 보통 통신 -->
  <text x="40" y="92" class="zone">보통 통신 — 밖으로 나감</text>
  <rect x="36" y="104" width="440" height="330" rx="12" fill="rgb(16,18,22)" stroke="rgb(42,37,32)" stroke-width="1.4"/>

  <rect x="66" y="150" width="150" height="60" rx="8" fill="#5b9bd5" stroke="#2f6ba3" stroke-width="1.4"/>
  <text x="141" y="176" class="boxd" text-anchor="middle" style="fill:#e8e4df">프로세스</text>
  <text x="141" y="196" class="muted" text-anchor="middle" style="fill:#dbe8f5">"밖의 서버로"</text>

  <rect x="66" y="248" width="150" height="50" rx="8" fill="rgb(28,30,34)" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="141" y="278" class="desc" text-anchor="middle">커널 네트워크 스택</text>

  <rect x="66" y="336" width="150" height="50" rx="8" fill="rgb(245,215,110)"/>
  <text x="141" y="360" class="box" text-anchor="middle">랜카드 eth0</text>
  <text x="141" y="376" class="muted" text-anchor="middle" style="fill:#3a3320">물리 네트워크로</text>

  <rect x="300" y="248" width="150" height="60" rx="8" fill="rgb(28,30,34)" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="375" y="274" class="boxd" text-anchor="middle">다른 컴퓨터</text>
  <text x="375" y="294" class="muted" text-anchor="middle">(밖의 서버)</text>

  <path d="M141,210 L141,246" fill="none" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M141,298 L141,334" fill="none" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M216,361 C260,361 300,320 320,308" fill="none" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 우: loopback -->
  <text x="580" y="92" class="zone">loopback — 자기에게 되돌아옴</text>
  <rect x="564" y="104" width="440" height="330" rx="12" fill="rgb(16,18,22)" stroke="#66bb6a" stroke-width="1.6"/>

  <rect x="594" y="150" width="150" height="60" rx="8" fill="#5b9bd5" stroke="#2f6ba3" stroke-width="1.4"/>
  <text x="669" y="176" class="boxd" text-anchor="middle" style="fill:#e8e4df">프로세스</text>
  <text x="669" y="196" class="mono" text-anchor="middle" style="fill:#dbe8f5">→ 127.0.0.1</text>

  <rect x="594" y="270" width="150" height="60" rx="8" fill="rgb(28,30,34)" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="669" y="296" class="desc" text-anchor="middle">커널 loopback 장치</text>
  <text x="669" y="314" class="muted" text-anchor="middle">(lo)</text>

  <!-- 되돌아오는 곡선 -->
  <path d="M744,180 C880,180 880,300 746,300" fill="none" stroke="#66bb6a" stroke-width="3" marker-end="url(#arg)"/>
  <text x="895" y="235" class="mono" style="fill:#66bb6a">되돌아옴</text>
  <path d="M669,270 C669,240 669,220 669,212" fill="none" stroke="#66bb6a" stroke-width="3" marker-end="url(#arg)"/>

  <rect x="594" y="356" width="380" height="58" rx="8" fill="rgb(20,22,26)" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="614" y="380" class="desc" style="fill:#66bb6a">랜카드로 안 나감 — 커널 안에서 자기에게 회송</text>
  <text x="614" y="400" class="muted">받는 쪽이 보는 출발지 = 127.0.0.1 (자기 자신)</text>

  <!-- 하단: port-forward 연결 -->
  <rect x="36" y="452" width="968" height="38" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1"/>
  <text x="520" y="476" class="desc" text-anchor="middle">port-forward는 kubelet이 Pod의 loopback을 통해 컨테이너에 붙는다 → 컨테이너가 보는 Client IP = 127.0.0.1</text>
</svg>

<title id="dt">붙는 단위가 노드라서 생기는 일</title><desc id="dd">RWO 볼륨은 노드 하나가 붙인다. 같은 노드의 파드끼리는 함께 쓰지만, 다른 노드의 파드가 같은 볼륨을 붙이려 하면 Multi-Attach 로 걸린다.</desc>
<rect width="920" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 10-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">붙는 단위가 노드라서 생기는 일</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">generateName 으로 파드를 흩뿌렸을 때</text>
<rect x="320" y="139" width="280" height="72" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="460" y="173" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">PVC — RWO</text>
<text x="460" y="191" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">PV 하나에 바인딩</text>

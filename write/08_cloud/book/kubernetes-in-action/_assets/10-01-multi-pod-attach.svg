<text x="240" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">노드 A — 볼륨이 붙은 곳</text>
<rect x="80" y="320" width="320" height="44" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="240" y="340" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">파드 1 · Running</text>
<rect x="80" y="378" width="320" height="44" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="240" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">파드 2 · Running</text>
<text x="240" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">같은 노드의 파드는 함께 마운트</text>
<path d="M 370 211 L 370 238 L 240 238 L 240 254" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="480" y="260" width="400" height="220" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="680" y="288" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#5E6B7E">노드 B</text>

<text x="24" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">RWOP: 제한 단위가 파드 · 같은 노드라도 둘째 파드는 Pending</text>

<svg viewBox="0 0 960 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>externalTrafficPolicy Cluster와 Local의 트레이드오프</title>
  <desc>Cluster 정책은 각 노드가 모든 파드로 넘겨 트래픽이 파드마다 고르게 33%씩 나뉘지만 노드 간 홉과 소스 IP 은닉이 생긴다. Local 정책은 노드가 자기 위 파드로만 넘겨 홉이 없고 소스 IP가 보존되지만, 노드 A의 단일 파드가 50%, 노드 B의 두 파드가 각 25%로 불균등하게 받는다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .hdr   { font-size: 13px; font-weight: 800; fill: rgb(212,168,83); }
      .node  { font-size: 11px; font-weight: 700; fill: rgb(138,133,128); }
      .pod   { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .pct   { font-size: 13px; font-weight: 800; fill: #e8e4df; }
      .lb    { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .note  { font-size: 10.5px; fill: #e8e4df; }
      .good  { font-size: 10.5px; fill: rgb(102,187,106); }
      .bad   { font-size: 10.5px; fill: rgb(240,150,190); }
    </style>
    <marker id="etp-c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
    <marker id="etp-l" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(102,187,106)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">externalTrafficPolicy — Cluster vs Local</text>
  <text x="24" y="50" class="sub">고른 분산이냐(홉·IP 은닉 감수), 홉 없음·소스 IP 보존이냐(불균등 감수) 사이의 선택입니다</text>

  <line x1="480" y1="70" x2="480" y2="410" stroke="rgb(60,60,60)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ===== LEFT: Cluster ===== -->
  <text x="230" y="90" class="hdr" text-anchor="middle">Cluster (기본)</text>
  <rect x="30" y="130" width="60" height="34" rx="6" fill="rgb(212,168,83)"/>
  <text x="60" y="152" class="lb" text-anchor="middle">LB</text>
  <!-- node A -->
  <rect x="130" y="105" width="140" height="90" rx="8" fill="rgb(24,28,32)" stroke="rgb(138,133,128)" stroke-width="1.3"/>
  <text x="140" y="122" class="node">Node A</text>
  <rect x="150" y="132" width="100" height="46" rx="6" fill="rgb(91,155,213)"/>
  <text x="200" y="152" class="pod" text-anchor="middle">Pod</text>
  <text x="200" y="170" class="pct" text-anchor="middle" font-size="11">33%</text>
  <!-- node B -->
  <rect x="130" y="215" width="230" height="90" rx="8" fill="rgb(24,28,32)" stroke="rgb(138,133,128)" stroke-width="1.3"/>
  <text x="140" y="232" class="node">Node B</text>
  <rect x="150" y="242" width="90" height="46" rx="6" fill="rgb(91,155,213)"/>
  <text x="195" y="262" class="pod" text-anchor="middle">Pod</text>
  <text x="195" y="279" class="pct" text-anchor="middle" font-size="11">33%</text>
  <rect x="255" y="242" width="90" height="46" rx="6" fill="rgb(91,155,213)"/>
  <text x="300" y="262" class="pod" text-anchor="middle">Pod</text>
  <text x="300" y="279" class="pct" text-anchor="middle" font-size="11">33%</text>
  <!-- cross arrows -->
  <line x1="90" y1="145" x2="148" y2="150" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#etp-c)"/>
  <line x1="90" y1="150" x2="148" y2="255" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#etp-c)"/>
  <line x1="250" y1="165" x2="252" y2="245" stroke="rgb(138,133,128)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#etp-c)"/>
  <line x1="200" y1="248" x2="200" y2="180" stroke="rgb(138,133,128)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#etp-c)"/>
  <text x="230" y="340" class="bad" text-anchor="middle">✗ 노드 간 홉 추가 · 소스 IP를 노드 IP로 은닉</text>
  <text x="230" y="358" class="good" text-anchor="middle">✓ 파드마다 고른 분산(각 33%)</text>

  <!-- ===== RIGHT: Local ===== -->
  <text x="730" y="90" class="hdr" text-anchor="middle">Local</text>
  <rect x="530" y="130" width="60" height="34" rx="6" fill="rgb(212,168,83)"/>
  <text x="560" y="152" class="lb" text-anchor="middle">LB</text>
  <!-- node A -->
  <rect x="630" y="105" width="140" height="90" rx="8" fill="rgb(24,28,32)" stroke="rgb(102,187,106)" stroke-width="1.3"/>
  <text x="640" y="122" class="node">Node A</text>
  <rect x="650" y="132" width="100" height="46" rx="6" fill="rgb(91,155,213)"/>
  <text x="700" y="152" class="pod" text-anchor="middle">Pod</text>
  <text x="700" y="170" class="pct" text-anchor="middle" font-size="11">50%</text>
  <!-- node B -->
  <rect x="630" y="215" width="230" height="90" rx="8" fill="rgb(24,28,32)" stroke="rgb(102,187,106)" stroke-width="1.3"/>
  <text x="640" y="232" class="node">Node B</text>
  <rect x="650" y="242" width="90" height="46" rx="6" fill="rgb(91,155,213)"/>
  <text x="695" y="262" class="pod" text-anchor="middle">Pod</text>
  <text x="695" y="279" class="pct" text-anchor="middle" font-size="11">25%</text>
  <rect x="755" y="242" width="90" height="46" rx="6" fill="rgb(91,155,213)"/>
  <text x="800" y="262" class="pod" text-anchor="middle">Pod</text>
  <text x="800" y="279" class="pct" text-anchor="middle" font-size="11">25%</text>
  <!-- local-only arrows (no cross) -->
  <line x1="590" y1="140" x2="648" y2="150" stroke="rgb(102,187,106)" stroke-width="1.6" marker-end="url(#etp-l)"/>
  <text x="620" y="135" class="note" text-anchor="middle">½</text>
  <line x1="590" y1="155" x2="648" y2="255" stroke="rgb(102,187,106)" stroke-width="1.6" marker-end="url(#etp-l)"/>
  <text x="615" y="215" class="note" text-anchor="middle">½</text>
  <line x1="740" y1="255" x2="753" y2="255" stroke="rgb(102,187,106)" stroke-width="1.3" marker-end="url(#etp-l)"/>
  <text x="730" y="340" class="good" text-anchor="middle">✓ 홉 없음 · 소스 IP 보존(파드가 진짜 클라 IP 관측)</text>
  <text x="730" y="358" class="bad" text-anchor="middle">✗ 불균등 분산(50% · 25% · 25%)</text>

  <text x="480" y="395" class="sub" text-anchor="middle">Local은 로컬 파드 없는 노드로 연결이 멈추므로 healthCheckNodePort로 엔드포인트 있는 노드만 대상으로 삼습니다</text>
</svg>

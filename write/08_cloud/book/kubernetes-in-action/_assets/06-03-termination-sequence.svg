<svg viewBox="0 0 960 490" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Pod 삭제 시 컨테이너들의 병렬 종료</title>
  <desc>kubectl delete pod 시점부터 세 컨테이너가 병렬로 종료된다. 컨테이너 A는 pre-stop hook만으로 프로세스가 종료돼 SIGTERM이 전송되지 않는다. 컨테이너 B는 pre-stop hook이 없어 즉시 SIGTERM을 받고 곧 종료한다. 컨테이너 C는 pre-stop hook과 SIGTERM 후에도 멈추지 않아 deletionGracePeriodSeconds가 지나면 KILL로 강제 종료된다. 모든 컨테이너가 멈추면 Pod 오브젝트가 삭제된다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .cname  { font-size: 11px; font-weight: 700; fill: rgb(138,133,128); }
      .proc   { font-size: 11px; font-weight: 800; fill: #0d0d0d; }
      .sig    { font-size: 10.5px; font-weight: 800; fill: #e8e4df; font-family: 'JetBrains Mono', monospace; }
      .note   { font-size: 10px; fill: #e8e4df; }
      .gp     { font-size: 11px; font-weight: 700; fill: rgb(212,168,83); font-family: 'JetBrains Mono', monospace; }
    </style>
    <marker id="a66" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="490" fill="#0d0d0d"/>
  <text x="24" y="28" class="title">Pod 삭제 시 컨테이너들의 병렬 종료</text>
  <text x="24" y="46" class="sub">preStop → SIGTERM → (유예 만료 시) KILL — 컨테이너마다 독립적으로 진행</text>

  <!-- delete line -->
  <line x1="300" y1="86" x2="300" y2="434" stroke="#e8e4df" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="300" y="76" class="note" text-anchor="middle">① kubectl delete pod</text>

  <!-- grace period end line -->
  <line x1="760" y1="130" x2="760" y2="434" stroke="#e8e4df" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ===== Container A: preStop terminates process, TERM never sent ===== -->
  <text x="60" y="112" class="cname">Container A</text>
  <rect x="60" y="120" width="380" height="80" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <rect x="74" y="132" width="310" height="28" rx="4" fill="rgb(230,126,34)"/>
  <text x="130" y="151" class="proc">Process A</text>
  <rect x="304" y="164" width="80" height="26" rx="4" fill="rgb(240,150,190)"/>
  <text x="344" y="181" class="proc" text-anchor="middle">preStop</text>
  <text x="470" y="140" class="note">② preStop hook만으로 프로세스가</text>
  <text x="470" y="155" class="note">종료됨 — TERM은 전송되지 않음</text>
  <line x1="466" y1="150" x2="392" y2="160" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a66)"/>

  <!-- ===== Container B: no preStop, TERM immediately ===== -->
  <text x="60" y="228" class="cname">Container B</text>
  <rect x="60" y="236" width="330" height="62" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <rect x="74" y="250" width="260" height="28" rx="4" fill="rgb(230,126,34)"/>
  <text x="130" y="269" class="proc">Process B</text>
  <line x1="300" y1="310" x2="300" y2="282" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a66)"/>
  <text x="312" y="308" class="sig">TERM</text>
  <text x="470" y="256" class="note">③ preStop hook이 없으면</text>
  <text x="470" y="271" class="note">TERM 시그널이 즉시 전송됨</text>

  <!-- ===== Container C: preStop + TERM + KILL ===== -->
  <text x="60" y="336" class="cname">Container C</text>
  <rect x="60" y="344" width="850" height="80" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <rect x="74" y="356" width="686" height="28" rx="4" fill="rgb(230,126,34)"/>
  <text x="130" y="375" class="proc">Process C</text>
  <rect x="304" y="390" width="170" height="26" rx="4" fill="rgb(240,150,190)"/>
  <text x="389" y="407" class="proc" text-anchor="middle">preStop</text>
  <line x1="490" y1="420" x2="490" y2="388" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a66)"/>
  <text x="502" y="418" class="sig">TERM</text>
  <line x1="760" y1="420" x2="760" y2="388" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a66)"/>
  <text x="772" y="418" class="sig">KILL</text>
  <text x="620" y="336" class="note">④ 유예 시간 안에 멈추지 않아 강제 종료</text>

  <!-- grace period brace -->
  <line x1="300" y1="444" x2="760" y2="444" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <line x1="300" y1="437" x2="300" y2="444" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <line x1="760" y1="437" x2="760" y2="444" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="530" y="468" class="gp" text-anchor="middle">metadata.deletionGracePeriodSeconds</text>

  <!-- right note -->
  <text x="790" y="100" class="note">⑤ 모든 컨테이너가 멈추면</text>
  <text x="790" y="115" class="note">Pod 오브젝트가 삭제된다</text>
</svg>

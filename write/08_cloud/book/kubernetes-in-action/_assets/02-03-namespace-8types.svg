<svg viewBox="0 0 980 640" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>리눅스 네임스페이스 8종류 — 각자 다른 자원을 격리한다</title>
  <desc>리눅스 커널은 시스템 자원을 8종류의 네임스페이스로 나눠 프로세스마다 다른 뷰를 보게 한다. Mount는 파일시스템, PID는 프로세스 번호, Network는 네트워크 장치와 포트, IPC는 프로세스 간 통신, UTS는 호스트명, User는 사용자·그룹 ID, Time은 시스템 클록, Cgroup은 cgroup 루트를 격리한다. 하나의 컨테이너는 이 여러 네임스페이스가 동시에 배정된 프로세스이며, Docker 기본은 mnt·pid·net·ipc·uts를 격리하고 user·time을 호스트와 공유한다.</desc>
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .zlabel{ font-size: 12px; font-weight: 800; fill: rgb(212,168,83); }
      .nsname{ font-size: 14px; font-weight: 800; fill: #0d0d0d; }
      .nseng { font-size: 9.5px; font-weight: 700; fill: #1a1a1a; font-family: 'JetBrains Mono', monospace; }
      .nsdesc{ font-size: 10.5px; font-weight: 600; fill: #1a1a1a; }
      .nsex  { font-size: 9.5px; fill: #333; }
      .badge { font-size: 9px; font-weight: 800; }
      .note  { font-size: 10.5px; fill: #e8e4df; }
      .cnt   { font-size: 11px; font-weight: 800; fill: rgb(212,168,83); }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="640" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">리눅스 네임스페이스 8종류 — 각자 다른 자원을 격리</text>
  <text x="24" y="52" class="sub">커널이 시스템 자원을 8개의 "그릇"으로 나눕니다. 프로세스는 종류별로 하나씩 배정받아, 그 그릇 안의 것만 봅니다.</text>

  <!-- 범례 -->
  <rect x="620" y="20" width="16" height="12" rx="2" fill="#f2d4d4"/>
  <text x="642" y="30" class="badge" fill="#e88b8b">Docker 기본 격리</text>
  <rect x="770" y="20" width="16" height="12" rx="2" fill="#cdeccf"/>
  <text x="792" y="30" class="badge" fill="#7bc47f">기본 공유(호스트와)</text>

  <!-- 8개 카드: 2행 4열 -->
  <!-- 행1 -->
  <!-- Mount -->
  <rect x="24" y="72" width="228" height="128" rx="10" fill="#f2d4d4"/>
  <text x="40" y="98" class="nsname">Mount</text>
  <text x="150" y="98" class="nseng">mnt</text>
  <rect x="40" y="108" width="52" height="16" rx="3" fill="#7a1f1f"/>
  <text x="66" y="120" class="badge" fill="#fff" text-anchor="middle">격리</text>
  <text x="40" y="146" class="nsdesc">파일시스템·마운트 지점</text>
  <text x="40" y="166" class="nsex">각 컨테이너가 자기만의</text>
  <text x="40" y="181" class="nsex">루트 파일시스템(/)을 봄</text>

  <!-- PID -->
  <rect x="264" y="72" width="228" height="128" rx="10" fill="#f2d4d4"/>
  <text x="280" y="98" class="nsname">PID</text>
  <text x="390" y="98" class="nseng">pid</text>
  <rect x="280" y="108" width="52" height="16" rx="3" fill="#7a1f1f"/>
  <text x="306" y="120" class="badge" fill="#fff" text-anchor="middle">격리</text>
  <text x="280" y="146" class="nsdesc">프로세스 번호(PID)</text>
  <text x="280" y="166" class="nsex">안에서 PID 1부터 새로 셈</text>
  <text x="280" y="181" class="nsex">(node = 안:1 / 밖:32687)</text>

  <!-- Network -->
  <rect x="504" y="72" width="228" height="128" rx="10" fill="#f2d4d4"/>
  <text x="520" y="98" class="nsname">Network</text>
  <text x="640" y="98" class="nseng">net</text>
  <rect x="520" y="108" width="52" height="16" rx="3" fill="#7a1f1f"/>
  <text x="546" y="120" class="badge" fill="#fff" text-anchor="middle">격리</text>
  <text x="520" y="146" class="nsdesc">네트워크 장치·포트·스택</text>
  <text x="520" y="166" class="nsex">각자 자기 eth0·IP·포트</text>
  <text x="520" y="181" class="nsex">→ 컨테이너마다 :8080 가능</text>

  <!-- IPC -->
  <rect x="744" y="72" width="212" height="128" rx="10" fill="#f2d4d4"/>
  <text x="760" y="98" class="nsname">IPC</text>
  <text x="870" y="98" class="nseng">ipc</text>
  <rect x="760" y="108" width="52" height="16" rx="3" fill="#7a1f1f"/>
  <text x="786" y="120" class="badge" fill="#fff" text-anchor="middle">격리</text>
  <text x="760" y="146" class="nsdesc">프로세스 간 통신</text>
  <text x="760" y="166" class="nsex">공유 메모리·메시지 큐·</text>
  <text x="760" y="181" class="nsex">세마포어를 격리</text>

  <!-- 행2 -->
  <!-- UTS -->
  <rect x="24" y="212" width="228" height="128" rx="10" fill="#f2d4d4"/>
  <text x="40" y="238" class="nsname">UTS</text>
  <text x="150" y="238" class="nseng">uts</text>
  <rect x="40" y="248" width="52" height="16" rx="3" fill="#7a1f1f"/>
  <text x="66" y="260" class="badge" fill="#fff" text-anchor="middle">격리</text>
  <text x="40" y="286" class="nsdesc">호스트명·도메인명</text>
  <text x="40" y="306" class="nsex">호스트명 = 컨테이너 ID</text>
  <text x="40" y="321" class="nsex">(fe6daee29272)</text>

  <!-- Cgroup ns -->
  <rect x="264" y="212" width="228" height="128" rx="10" fill="#f2d4d4"/>
  <text x="280" y="238" class="nsname">Cgroup</text>
  <text x="390" y="238" class="nseng">cgroup</text>
  <rect x="280" y="248" width="52" height="16" rx="3" fill="#7a1f1f"/>
  <text x="306" y="260" class="badge" fill="#fff" text-anchor="middle">격리</text>
  <text x="280" y="286" class="nsdesc">cgroup 루트 디렉터리</text>
  <text x="280" y="306" class="nsex">자기 cgroup 트리만 보이게</text>
  <text x="280" y="321" class="nsex">(자원 제한값은 §2 cgroup)</text>

  <!-- User -->
  <rect x="504" y="212" width="228" height="128" rx="10" fill="#cdeccf"/>
  <text x="520" y="238" class="nsname">User</text>
  <text x="640" y="238" class="nseng">user</text>
  <rect x="520" y="248" width="64" height="16" rx="3" fill="#14521d"/>
  <text x="552" y="260" class="badge" fill="#fff" text-anchor="middle">기본 공유</text>
  <text x="520" y="286" class="nsdesc">사용자·그룹 ID(UID/GID)</text>
  <text x="520" y="306" class="nsex">Docker 기본은 안 나눔 →</text>
  <text x="520" y="321" class="nsex">안 root = 호스트 root (보안↓)</text>

  <!-- Time -->
  <rect x="744" y="212" width="212" height="128" rx="10" fill="#cdeccf"/>
  <text x="760" y="238" class="nsname">Time</text>
  <text x="870" y="238" class="nseng">time</text>
  <rect x="760" y="248" width="64" height="16" rx="3" fill="#14521d"/>
  <text x="792" y="260" class="badge" fill="#fff" text-anchor="middle">기본 공유</text>
  <text x="760" y="286" class="nsdesc">시스템 클록 오프셋</text>
  <text x="760" y="306" class="nsex">시계 공유 → 악성 컨테이너의</text>
  <text x="760" y="321" class="nsex">시간 변경이 번질 위험(§3)</text>

  <!-- 하단: 컨테이너 = 여러 ns 배정된 프로세스 -->
  <rect x="24" y="366" width="932" height="90" rx="10" fill="rgb(24,28,32)" stroke="rgb(212,168,83)" stroke-width="1.4"/>
  <text x="44" y="392" class="cnt">컨테이너 하나 = 이 네임스페이스들이 "동시에" 배정된 프로세스</text>
  <text x="44" y="416" class="note">VM처럼 무언가에 감싸인 게 아닙니다. node app.js 프로세스에 mnt·pid·net·ipc·uts·cgroup 네임스페이스(격리)와</text>
  <text x="44" y="436" class="note">user·time 네임스페이스(호스트 공유)가 함께 배정됩니다. 격리 여부가 종류마다 다르므로 경계가 딱 떨어지지 않습니다.</text>

  <!-- 확인 방법 -->
  <rect x="24" y="470" width="932" height="150" rx="10" fill="rgb(24,28,32)" stroke="rgb(42,37,32)" stroke-width="1.2"/>
  <text x="44" y="496" class="zlabel">직접 확인하는 법</text>
  <text x="44" y="520" class="note">• 프로세스가 가진 네임스페이스 목록:  <tspan font-family="'JetBrains Mono', monospace" fill="rgb(212,168,83)">ls -l /proc/&lt;pid&gt;/ns/</tspan>  → 종류별 심볼릭 링크와 고유 번호가 보임</text>
  <text x="44" y="544" class="note">• 격리 여부 판정:  <tspan font-family="'JetBrains Mono', monospace" fill="rgb(212,168,83)">readlink /proc/1/ns/uts</tspan>  를 두 컨테이너에서 비교 → 번호 다르면 격리, 같으면 공유</text>
  <text x="44" y="568" class="note">• 골라서 공유:  관련 컨테이너끼리 net·uts만 공유하고 mnt는 각자 쓸 수 있음(쿠버네티스 Pod가 이 방식으로 컨테이너를 묶음)</text>
  <text x="44" y="596" class="cnt">→ 8종류의 세부 동작·unshare 실습은 커널 카테고리(namespace 실습 — 8가지 격리와 unshare)가 정본입니다.</text>
</svg>

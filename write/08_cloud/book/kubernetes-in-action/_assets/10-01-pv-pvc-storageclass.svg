<svg viewBox="0 0 960 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>PV·PVC·StorageClass 세 오브젝트의 관계</title>
  <desc>파드는 persistentVolumeClaim 볼륨으로 PVC를 이름으로 가리키고, PVC는 StorageClass를 이름으로 지정하며 PV에 바인딩된다. PV는 밑바탕 네트워크 스토리지를 대표한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .lbl   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .note  { font-size: 11px; font-weight: 700; fill: rgb(212,168,83); }
      .cyl   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
    </style>
    <marker id="p10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(91,155,213)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="340" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">PV · PVC · StorageClass 세 오브젝트</text>
  <text x="24" y="50" class="sub">파드 → PVC(이름 참조) → PV(바인딩) → 실제 스토리지. PVC 는 StorageClass 로 스토리지 종류를 고른다</text>

  <!-- Pod -->
  <rect x="30" y="180" width="120" height="90" rx="10" fill="rgb(232,240,248)"/>
  <text x="90" y="202" class="lbl" text-anchor="middle" font-size="11">Pod</text>
  <g transform="translate(55,214)">
    <ellipse cx="35" cy="0" rx="35" ry="9" fill="rgb(146,196,235)"/>
    <rect x="0" y="0" width="70" height="34" fill="rgb(146,196,235)"/>
    <ellipse cx="35" cy="34" rx="35" ry="9" fill="rgb(120,175,220)"/>
    <text x="35" y="22" class="cyl" text-anchor="middle" font-size="10">Volume</text>
  </g>

  <!-- StorageClass -->
  <rect x="270" y="30" width="130" height="60" rx="8" fill="rgb(200,180,235)"/>
  <text x="335" y="58" class="lbl" text-anchor="middle">Storage</text>
  <text x="335" y="76" class="lbl" text-anchor="middle">class</text>

  <!-- PVC -->
  <path d="M270,180 h110 v60 l-15,15 h-95 z" fill="rgb(245,225,110)"/>
  <text x="322" y="212" class="lbl" text-anchor="middle" font-size="11">Persistent</text>
  <text x="322" y="228" class="lbl" text-anchor="middle" font-size="11">volume claim</text>

  <!-- PV -->
  <rect x="500" y="180" width="130" height="70" rx="6" fill="rgb(245,180,140)"/>
  <text x="565" y="210" class="lbl" text-anchor="middle" font-size="11">Persistent</text>
  <text x="565" y="228" class="lbl" text-anchor="middle" font-size="11">volume</text>

  <!-- Network storage -->
  <g transform="translate(740,185)">
    <ellipse cx="90" cy="0" rx="90" ry="18" fill="rgb(146,196,235)"/>
    <rect x="0" y="0" width="180" height="55" fill="rgb(146,196,235)"/>
    <ellipse cx="90" cy="55" rx="90" ry="18" fill="rgb(90,140,200)"/>
    <text x="90" y="32" class="cyl" text-anchor="middle">Network storage</text>
  </g>

  <!-- arrows -->
  <path d="M150,220 L266,215" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#p10)"/>
  <path d="M335,180 L335,92" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#p10)"/>
  <path d="M382,210 L496,210" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#p10)"/>
  <path d="M630,213 L736,213" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#p10)"/>

  <!-- annotations -->
  <text x="30" y="150" class="note">파드는 PVC 볼륨으로</text>
  <text x="30" y="167" class="note">PVC 를 이름으로 참조</text>
  <text x="270" y="120" class="note">PVC 가 StorageClass 를</text>
  <text x="270" y="137" class="note">이름으로 지정</text>
  <text x="460" y="150" class="note">청구는 PV 에 바인딩</text>
  <text x="700" y="150" class="note">PV 가 실제 스토리지 대표</text>
</svg>

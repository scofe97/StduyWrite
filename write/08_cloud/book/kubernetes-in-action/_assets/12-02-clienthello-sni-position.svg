<title id="dt">SNI 는 첫 메시지 안에 있다</title><desc id="dd">TLS 1.3 에서는 ServerHello 직후 키 교환이 끝나 그 뒤로는 서버 인증서마저 암호화되어 전송된다. 프록시가 passthrough 에서 건질 수 있는 것은 맨 앞 두 메시지뿐이다.</desc>
<rect width="1160" height="684" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 12-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">SNI 는 첫 메시지 안에 있다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">클라이언트가 TLS 를 시작하는 순간</text>
<rect x="220" y="168" width="560" height="62" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="260" y="194" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">ClientHello</text>
<text x="260" y="215" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">SNI · 지원 암호군 · 키 공유</text>
<rect x="220" y="244" width="560" height="62" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="260" y="270" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">ServerHello</text>
<text x="260" y="291" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">고른 암호군 · 키 공유</text>
<rect x="220" y="320" width="560" height="62" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="260" y="346" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">Certificate</text>
<text x="260" y="367" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">서버 인증서</text>
<rect x="220" y="396" width="560" height="62" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="260" y="422" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">Finished</text>
<text x="260" y="443" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">핸드셰이크 종료</text>
<rect x="220" y="472" width="560" height="62" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="260" y="498" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#E3B341">Application Data</text>
<text x="260" y="519" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">HTTP 요청 · Host 헤더</text>
<path d="M 190 168 L 180 168 L 180 306 L 190 306" fill="none" stroke="#5E6B7E" stroke-width="1.2"/>
<line x1="180" y1="237.0" x2="196" y2="237.0" stroke="#5E6B7E" stroke-width="1.2"/>
<text x="202" y="241.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">평문</text>
<path d="M 190 320 L 180 320 L 180 534 L 190 534" fill="none" stroke="#E3B341" stroke-width="1.2"/>
<line x1="180" y1="427.0" x2="196" y2="427.0" stroke="#E3B341" stroke-width="1.2"/>
<text x="202" y="431.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">암호화</text>
<text x="812" y="200" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">여기 실린 server_name 을</text>
<text x="812" y="222" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">프록시가 암호 없이 읽는다</text>
<text x="812" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">TLS 1.3 에서는 인증서까지</text>
<text x="812" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">암호화되어 실린다</text>
<text x="24" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Host 헤더와 값이 같아 헷갈리기 쉬운데 층이 다르다. SNI 는 TLS 의 필드라 암호화 전에 오가고, Host 는 HTTP 의 헤더라 암호화 후에 실린다.</text>
<line x1="12" y1="596" x2="1112" y2="596" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="618" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="608" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">암호 없이 읽히는 자리</text>
<rect x="300" y="608" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="322" y="618" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">암호 뒤</text>
</svg>
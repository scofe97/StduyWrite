<svg viewBox="0 0 960 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>label을 바꿔 파드를 ReplicaSet에서 분리</title>
  <desc>파드의 rel 라벨을 stable에서 debug로 바꾸면 ReplicaSet의 selector에 맞지 않게 되어 세트에서 빠진다. selector에 맞는 파드가 하나 줄었으므로 컨트롤러가 대체 파드를 새로 만들어 다시 원하는 수를 맞춘다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: #b8b3ad; }
      .rs    { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .sel   { font-size: 10px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .pod   { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .lblk  { font-size: 10px; font-weight: 700; fill: #0d0d0d; }
      .note  { font-size: 10.5px; fill: #e8e4df; }
      .out   { font-size: 10.5px; fill: rgb(240,150,190); }
      .new   { font-size: 10.5px; fill: rgb(102,187,106); }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="320" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">label을 바꿔 파드를 ReplicaSet에서 빼기</text>
  <text x="24" y="50" class="sub">rel=stable → debug 로 바꾸면 selector에서 빠지고, 컨트롤러가 대체 파드를 만듭니다</text>

  <!-- RS selector -->
  <rect x="40" y="80" width="200" height="70" rx="8" fill="rgb(200,220,245)" stroke="rgb(91,155,213)" stroke-width="1.4"/>
  <text x="140" y="104" class="rs" text-anchor="middle">kiada ReplicaSet · replicas 3</text>
  <rect x="58" y="114" width="164" height="28" rx="5" fill="rgb(91,155,213)"/>
  <text x="140" y="132" class="sel" text-anchor="middle">selector: app=kiada, rel=stable</text>

  <!-- managed dashed box (selector에 맞는 파드 3벌 — debug 파드는 밖) -->
  <rect x="40" y="180" width="455" height="110" rx="10" fill="none" stroke="rgb(138,133,128)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="267" y="172" class="note" text-anchor="middle" fill="rgb(138,133,128)">ReplicaSet이 관리 — selector 일치 3벌</text>

  <!-- stable pods -->
  <rect x="70" y="205" width="130" height="60" rx="8" fill="rgb(91,155,213)"/>
  <text x="135" y="230" class="pod" text-anchor="middle">kiada pod</text>
  <text x="135" y="250" class="lblk" text-anchor="middle">rel=stable</text>
  <rect x="215" y="205" width="130" height="60" rx="8" fill="rgb(91,155,213)"/>
  <text x="280" y="230" class="pod" text-anchor="middle">kiada pod</text>
  <text x="280" y="250" class="lblk" text-anchor="middle">rel=stable</text>

  <!-- new replacement pod (세트 안 — 세 번째 자리를 채움) -->
  <rect x="360" y="205" width="120" height="60" rx="8" fill="rgb(102,187,106)"/>
  <text x="420" y="230" class="pod" text-anchor="middle">kiada pod</text>
  <text x="420" y="250" class="lblk" text-anchor="middle">rel=stable</text>
  <text x="420" y="199" class="new" text-anchor="middle">컨트롤러가 만든 대체 파드</text>

  <!-- removed pod (debug) — 점선 박스 밖 -->
  <rect x="560" y="205" width="150" height="60" rx="8" fill="rgb(176,172,167)"/>
  <text x="635" y="230" class="pod" text-anchor="middle">kiada pod</text>
  <text x="635" y="250" class="lblk" text-anchor="middle">rel=<tspan text-decoration="line-through">stable</tspan> debug</text>
  <text x="635" y="172" class="out" text-anchor="middle">selector 불일치 → 빠짐(디버깅용 유지)</text>

  <!-- explanation right -->
  <text x="850" y="215" class="note" text-anchor="middle">selector에 맞는 파드가</text>
  <text x="850" y="234" class="note" text-anchor="middle">하나 줄었으므로,</text>
  <text x="850" y="253" class="note" text-anchor="middle">컨트롤러가 새 파드를</text>
  <text x="850" y="272" class="note" text-anchor="middle">만들어 3을 다시 맞춥니다</text>
</svg>

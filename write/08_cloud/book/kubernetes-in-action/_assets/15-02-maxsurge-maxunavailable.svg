<title id="dt">천장과 바닥 사이에서만 움직인다</title><desc id="dd">maxSurge 는 원하는 수를 얼마나 넘어설 수 있는지를, maxUnavailable 은 얼마나 모자랄 수 있는지를 정한다. 두 값 모두 원하는 복제본 수에 상대적이다.</desc>
<rect width="900" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 15-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">천장과 바닥 사이에서만 움직인다</text>
<text x="12" y="74" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">replicas 3 · maxSurge 1 · maxUnavailable 1 → 총합 ≤ 4 · 가용 ≥ 2</text>
<line x1="36" y1="194" x2="864" y2="194" stroke="#E3B341" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="860" y="186" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">총합 천장 4 = replicas + maxSurge</text>
<line x1="36" y1="396" x2="864" y2="396" stroke="#3FB98C" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="860" y="388" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">가용 바닥 2 = replicas − maxUnavailable</text>
<text x="150" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">시작</text>
<rect x="68" y="208" width="164" height="102" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="150" y="236" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">옛 0.5 × 3</text>
<text x="150" y="258" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">새 0.6 × 0</text>
<rect x="92" y="278" width="116" height="24" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="150" y="294" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">총합 3</text>
<rect x="92" y="344" width="116" height="24" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="1.1"/>
<text x="150" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">가용 3</text>
<text x="350" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">새 +2 · 옛 −1</text>
<rect x="268" y="208" width="164" height="102" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="350" y="236" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">옛 0.5 × 2</text>
<text x="350" y="258" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">새 0.6 × 2</text>
<rect x="292" y="278" width="116" height="24" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="1.1"/>
<text x="350" y="294" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">총합 4</text>
<rect x="292" y="344" width="116" height="24" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="1.1"/>
<text x="350" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">가용 2</text>
<text x="550" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">교체 진행</text>
<rect x="468" y="208" width="164" height="102" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="550" y="236" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">옛 0.5 × 1</text>
<text x="550" y="258" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">새 0.6 × 3</text>
<rect x="492" y="278" width="116" height="24" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="1.1"/>
<text x="550" y="294" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">총합 4</text>
<rect x="492" y="344" width="116" height="24" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="1.1"/>
<text x="550" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">가용 3</text>
<text x="750" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">옛 −1</text>
<rect x="668" y="208" width="164" height="102" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="750" y="236" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">옛 0.5 × 0</text>
<text x="750" y="258" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">새 0.6 × 3</text>
<rect x="692" y="278" width="116" height="24" rx="4" fill="#0D1117" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="750" y="294" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">총합 3</text>
<rect x="692" y="344" width="116" height="24" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="1.1"/>
<text x="750" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">가용 3</text>
<path d="M 236 258 L 260 258" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 436 258 L 460 258" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 636 258 L 660 258" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="24" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">값은 원하는 수가 기준 — replicas 3 · maxUnavailable 1 의 가용 하한은 현재 5 개여도 2 개(=3−1), 4 개가 아님</text>
<text x="24" y="456" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">순서가 강제됨 — maxSurge 0: 천장 3, 옛 파드를 먼저 지움 · maxUnavailable 0: 바닥 3, 새 파드를 먼저 띄움</text>
<line x1="12" y1="488" x2="852" y2="488" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="510" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="498" width="14" height="14" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">천장에 닿은 단계</text>
<rect x="270" y="498" width="14" height="14" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="292" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">가용 파드</text>
<rect x="384" y="498" width="14" height="14" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="406" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">바닥에 닿은 단계</text>
</svg>
<title id="dt">앞의 것이 아직 돌고 있을 때</title><desc id="dd">정해진 시각이 왔는데 이전 Job 이 아직 끝나지 않았다면 셋 중 하나를 한다. 겹쳐 돌리거나, 이번을 건너뛰거나, 앞의 것을 지우고 바꾼다.</desc>
<rect width="1240" height="768" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 18-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">앞의 것이 아직 돌고 있을 때</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">01:00 Job 이 02:00 까지 이어질 때</text>
<rect x="24" y="100" width="1192" height="172" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Allow — 겹쳐 돌린다</text>
<rect x="220" y="160" width="608.0" height="38" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="524.0" y="185" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">01:00 Job</text>
<rect x="600" y="210" width="456.0" height="38" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="828.0" y="235" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">02:00 Job</text>
<line x1="600" y1="144" x2="600" y2="260" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="608" y="258" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">02:00</text>
<text x="1080" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">둘이 함께 돈다</text>
<rect x="24" y="292" width="1192" height="172" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Forbid — 건너뛴다</text>
<rect x="220" y="352" width="608.0" height="38" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="524.0" y="377" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">01:00 Job</text>
<rect x="600" y="402" width="114.0" height="38" rx="5" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="657.0" y="427" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#E3B341">건너뜀</text>
<line x1="600" y1="336" x2="600" y2="452" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="608" y="450" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">02:00</text>
<text x="1080" y="382" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">이번 회차가 없다</text>
<rect x="24" y="484" width="1192" height="172" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Replace — 바꾼다</text>
<rect x="220" y="544" width="380" height="38" rx="5" fill="#F0616D12" stroke="#F0616D" stroke-width="1.1"/>
<text x="410.0" y="569" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">01:00 Job — 지워진다</text>
<rect x="600" y="594" width="456.0" height="38" rx="5" fill="#F08A5912" stroke="#F08A59" stroke-width="1.1"/>
<text x="828.0" y="619" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">02:00 Job</text>
<line x1="600" y1="528" x2="600" y2="644" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="608" y="642" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">02:00</text>
<text x="1080" y="574" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">앞의 것이 중단된다</text>
<text x="24" y="688" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Allow 는 같은 일이 두 번 겹쳐도 괜찮을 때만 쓴다. 앞의 결과를 덮어쓰는 작업이라면 Forbid 나 Replace 가 맞는다.</text>
<line x1="12" y1="716" x2="1192" y2="716" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="738" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="728" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="738" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">도는 Job</text>
<rect x="222" y="728" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="244" y="738" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">생략</text>
<rect x="292" y="728" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="314" y="738" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">중단·교체</text>
<rect x="401" y="728" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="423" y="738" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">지워지는 것</text>
</svg>
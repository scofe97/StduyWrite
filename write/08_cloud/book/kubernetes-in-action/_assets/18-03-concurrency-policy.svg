<svg viewBox="0 0 960 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>CronJob concurrencyPolicy 세 정책</title>
  <desc>이전 Job이 아직 도는데 다음 예약 시각이 오면 concurrencyPolicy가 동작을 정한다. Allow는 겹쳐 실행하고, Forbid는 새 Job을 건너뛰며, Replace는 이전 Job을 지우고 새 Job으로 교체한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .pol   { font-size: 12px; font-weight: 800; fill: #e8e4df; }
      .desc2 { font-size: 10px; fill: rgb(138,133,128); }
      .job   { font-size: 10.5px; font-weight: 700; fill: #0d0d0d; }
      .tick  { font-size: 10px; fill: rgb(138,133,128); }
    </style>
    <marker id="cc-a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="360" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">concurrencyPolicy — 이전 Job이 아직 돌 때</text>
  <text x="24" y="50" class="sub">다음 예약 시각(t1)에 이전 Job(Job t0)이 아직 실행 중일 때의 동작</text>

  <!-- schedule markers vertical guides -->
  <line x1="360" y1="70" x2="360" y2="330" stroke="rgb(50,50,50)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="360" y="345" class="tick" text-anchor="middle">t1 (다음 예약)</text>

  <!-- Allow -->
  <text x="24" y="100" class="pol">Allow</text>
  <text x="24" y="116" class="desc2">기본 · 겹쳐 실행</text>
  <rect x="200" y="82" width="260" height="28" rx="6" fill="rgb(150,220,160)"/><text x="330" y="101" class="job" text-anchor="middle">Job t0 (계속 실행)</text>
  <rect x="360" y="116" width="260" height="28" rx="6" fill="rgb(91,155,213)"/><text x="490" y="135" class="job" text-anchor="middle" style="fill:#e8e4df">Job t1 (동시 실행)</text>

  <!-- divider -->
  <line x1="24" y1="165" x2="936" y2="165" stroke="rgb(50,50,50)" stroke-width="1"/>

  <!-- Forbid -->
  <text x="24" y="200" class="pol">Forbid</text>
  <text x="24" y="216" class="desc2">동시 금지 · 건너뜀</text>
  <rect x="200" y="182" width="320" height="28" rx="6" fill="rgb(150,220,160)"/><text x="360" y="201" class="job" text-anchor="middle">Job t0 (끝까지 실행)</text>
  <rect x="360" y="216" width="180" height="28" rx="6" fill="none" stroke="rgb(240,150,190)" stroke-width="1.4" stroke-dasharray="5 3"/><text x="450" y="235" text-anchor="middle" font-size="10" fill="rgb(240,150,190)" font-weight="700">Job t1 건너뜀 ✗</text>

  <!-- divider -->
  <line x1="24" y1="265" x2="936" y2="265" stroke="rgb(50,50,50)" stroke-width="1"/>

  <!-- Replace -->
  <text x="24" y="300" class="pol">Replace</text>
  <text x="24" y="316" class="desc2">이전 취소 · 교체</text>
  <rect x="200" y="282" width="160" height="28" rx="6" fill="none" stroke="rgb(240,150,190)" stroke-width="1.4" stroke-dasharray="5 3"/><text x="280" y="301" text-anchor="middle" font-size="10" fill="rgb(240,150,190)" font-weight="700">Job t0 취소 ✗</text>
  <rect x="360" y="282" width="260" height="28" rx="6" fill="rgb(91,155,213)"/><text x="490" y="301" class="job" text-anchor="middle" style="fill:#e8e4df">Job t1 (새로 시작)</text>
</svg>

<svg viewBox="0 0 1120 640" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>일반 Service와 headless Service — 목적지를 누가 고르는가</title>
  <desc>같은 파드 네 개를 향해 요청을 보낼 때 일반 Service와 headless Service에서 앱이 보는 것을 비교한다. 일반 Service에서는 DNS가 cluster IP 하나만 돌려주므로 앱이 아는 목적지도 그 하나뿐이고, 넷 중 어디로 갈지는 커널이 확률로 고른다. 앱은 어느 파드에 닿았는지 모르므로 네 개 모두에 보냈는지 확인할 방법이 없다. headless Service에서는 DNS가 파드 IP 네 개를 그대로 돌려줘 앱이 목록을 손에 쥐고, 코드에서 직접 순회하며 네 번 요청을 보낸다. 몇 개에 보냈는지 세어 확인할 수 있고 어느 파드가 실패했는지도 안다. 순회는 쿠버네티스 기능이 아니라 앱 코드가 하는 일이며, headless를 고르는 기준은 부하 분산이 아니라 목적지를 앱이 알아야 하는가이다.</desc>
  <defs>
    <style>
      .h1   { font-size: 25px; font-weight: 800; fill: #e8e4df; }
      .sub  { font-size: 15px; fill: rgb(168,163,158); }
      .col  { font-size: 16px; font-weight: 800; }
      .nd   { font-size: 12.5px; font-weight: 800; fill: rgb(168,163,158); }
      .pod  { font-size: 11.5px; font-weight: 800; fill: #0d0d0d; }
      .ip   { font-size: 11px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .good { font-size: 13px; fill: rgb(102,187,106); }
      .bad  { font-size: 13px; fill: rgb(240,150,190); }
      .who  { font-size: 12.5px; fill: rgb(168,163,158); }
      .body { font-size: 14px; fill: #e8e4df; }
      .lbl  { font-size: 12px; fill: rgb(168,163,158); }
    </style>
    <marker id="hx-b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(91,155,213)"/>
    </marker>
    <marker id="hx-g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(102,187,106)"/>
    </marker>
    <marker id="hx-d" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(120,116,112)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="640" fill="#0d0d0d"/>

  <text x="30" y="42" class="h1">목적지를 커널이 고르는가, 앱이 고르는가</text>
  <text x="30" y="68" class="sub">파드 네 개 전부에 캐시 무효화를 보내야 하는 상황입니다. 같은 파드, 다른 Service 두 가지.</text>

  <!-- ================= 왼쪽: 일반 Service ================= -->
  <rect x="30" y="92" width="520" height="452" rx="13" fill="rgb(22,22,22)" stroke="rgb(91,155,213)" stroke-width="1.8"/>
  <text x="52" y="122" class="col" style="fill:rgb(91,155,213)">일반 Service — cluster IP 하나</text>
  <text x="52" y="144" class="who">DNS가 돌려주는 주소가 하나뿐입니다</text>

  <rect x="52" y="158" width="476" height="44" rx="8" fill="rgb(91,155,213)"/>
  <text x="68" y="185" class="pod">앱이 손에 쥔 것</text>
  <text x="220" y="185" class="ip">10.96.0.12  (cluster IP)</text>

  <line x1="290" y1="206" x2="290" y2="232" stroke="rgb(91,155,213)" stroke-width="2.2" marker-end="url(#hx-b)"/>

  <rect x="52" y="238" width="476" height="72" rx="8" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.3"/>
  <text x="68" y="262" class="body" font-weight="700">커널이 넷 중 하나를 확률로 고릅니다</text>
  <text x="68" y="284" class="who">앱은 이 선택에 관여하지 않고, 결과도 통보받지 못합니다</text>
  <text x="68" y="302" class="who">— 어느 파드에 닿았는지 모릅니다</text>

  <line x1="150" y1="316" x2="112" y2="344" stroke="rgb(120,116,112)" stroke-width="1.6" marker-end="url(#hx-d)"/>
  <line x1="290" y1="316" x2="290" y2="344" stroke="rgb(91,155,213)" stroke-width="2.2" marker-end="url(#hx-b)"/>
  <line x1="430" y1="316" x2="468" y2="344" stroke="rgb(120,116,112)" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#hx-d)"/>

  <rect x="52" y="352" width="110" height="42" rx="6" fill="rgb(58,58,58)"/>
  <text x="107" y="378" class="pod" style="fill:rgb(200,196,192)" text-anchor="middle">Pod 1</text>
  <rect x="172" y="352" width="110" height="42" rx="6" fill="rgb(58,58,58)"/>
  <text x="227" y="378" class="pod" style="fill:rgb(200,196,192)" text-anchor="middle">Pod 2</text>
  <rect x="292" y="352" width="110" height="42" rx="6" fill="rgb(91,155,213)"/>
  <text x="347" y="378" class="pod" text-anchor="middle">Pod 3 ← 도착</text>
  <rect x="412" y="352" width="116" height="42" rx="6" fill="rgb(58,58,58)"/>
  <text x="470" y="378" class="pod" style="fill:rgb(200,196,192)" text-anchor="middle">Pod 4</text>

  <text x="52" y="418" class="lbl">요청 한 번 = 파드 한 개. 나머지 셋은 못 받았습니다.</text>

  <rect x="52" y="432" width="476" height="66" rx="9" fill="rgba(240,150,190,0.10)" stroke="rgb(240,150,190)" stroke-width="1.4"/>
  <text x="68" y="456" class="body" font-weight="700">"넷 다 보냈다"를 확인할 방법이 없습니다</text>
  <text x="68" y="478" class="who">여러 번 보내도 같은 파드에 겹칠 수 있습니다 — 확률이니까요</text>

  <text x="52" y="522" class="bad">✗ 브로드캐스트에는 쓸 수 없습니다</text>

  <!-- ================= 오른쪽: headless ================= -->
  <rect x="570" y="92" width="520" height="452" rx="13" fill="rgb(22,22,22)" stroke="rgb(102,187,106)" stroke-width="1.8"/>
  <text x="592" y="122" class="col" style="fill:rgb(102,187,106)">headless — 파드 IP 네 개</text>
  <text x="592" y="144" class="who">clusterIP: None — DNS가 파드 IP를 그대로 돌려줍니다</text>

  <rect x="592" y="158" width="478" height="44" rx="8" fill="rgb(102,187,106)"/>
  <text x="608" y="185" class="pod">앱이 손에 쥔 것</text>
  <text x="712" y="185" class="ip">10.244.1.10 · .2.10 · .2.8 · .3.4</text>

  <line x1="830" y1="206" x2="830" y2="232" stroke="rgb(102,187,106)" stroke-width="2.2" marker-end="url(#hx-g)"/>

  <rect x="592" y="238" width="478" height="72" rx="8" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)" stroke-width="1.4"/>
  <text x="608" y="262" class="body" font-weight="700">앱 코드가 목록을 순회합니다</text>
  <text x="608" y="284" class="who">for (pod : pods) — 이 반복문은 쿠버네티스가 아니라</text>
  <text x="608" y="302" class="who">앱이 씁니다. headless는 목록을 건넬 뿐입니다.</text>

  <line x1="650" y1="316" x2="648" y2="344" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#hx-g)"/>
  <line x1="768" y1="316" x2="768" y2="344" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#hx-g)"/>
  <line x1="888" y1="316" x2="888" y2="344" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#hx-g)"/>
  <line x1="1008" y1="316" x2="1008" y2="344" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#hx-g)"/>

  <rect x="592" y="352" width="112" height="42" rx="6" fill="rgb(102,187,106)"/>
  <text x="648" y="378" class="pod" text-anchor="middle">Pod 1 ✓</text>
  <rect x="712" y="352" width="112" height="42" rx="6" fill="rgb(102,187,106)"/>
  <text x="768" y="378" class="pod" text-anchor="middle">Pod 2 ✓</text>
  <rect x="832" y="352" width="112" height="42" rx="6" fill="rgb(102,187,106)"/>
  <text x="888" y="378" class="pod" text-anchor="middle">Pod 3 ✓</text>
  <rect x="952" y="352" width="118" height="42" rx="6" fill="rgb(102,187,106)"/>
  <text x="1011" y="378" class="pod" text-anchor="middle">Pod 4 ✓</text>

  <text x="592" y="418" class="lbl">요청 네 번 = 파드 네 개. 하나도 빠지지 않습니다.</text>

  <rect x="592" y="432" width="478" height="66" rx="9" fill="rgba(102,187,106,0.12)" stroke="rgb(102,187,106)" stroke-width="1.4"/>
  <text x="608" y="456" class="body" font-weight="700">몇 개에 보냈는지 세어 확인할 수 있습니다</text>
  <text x="608" y="478" class="who">어느 파드가 실패했는지도 앱이 압니다 — 주소를 알고 있으니까요</text>

  <text x="592" y="522" class="good">✓ 캐시 무효화·멤버 목록·파드 지목에 씁니다</text>

  <!-- ================= 하단 못박기 ================= -->
  <rect x="30" y="562" width="1060" height="62" rx="12" fill="rgba(212,168,83,0.08)" stroke="rgb(42,37,32)"/>
  <text x="54" y="590" class="body" font-weight="700">headless가 필요한 기준은 부하 분산이 아니라, 목적지를 앱이 알아야 하는가입니다.</text>
  <text x="54" y="612" class="who">부하만 나누면 되는 경우에는 일반 Service가 낫습니다 — 커널이 대신 골라 주므로 앱이 아무것도 안 해도 됩니다.</text>
</svg>

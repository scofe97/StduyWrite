<svg viewBox="0 0 960 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>init 컨테이너 실패 시 주 컨테이너는 시작조차 못 한다</title>
  <desc>init 컨테이너가 성공(exit 0)하면 주 컨테이너가 시작되지만, 실패(exit 1)하면 쿠버네티스가 init 을 재시도하고 주 컨테이너는 PodInitializing 상태에 갇혀 시작조차 못 한다. 반복 실패하면 Init:CrashLoopBackOff 가 된다. 죽은 init 의 로그는 kubectl logs -c 로 여전히 조회할 수 있어 원인을 찾을 수 있다.</desc>
  <defs>
    <style>
      .title { font-size: 16px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 10.5px; fill: rgb(138,133,128); }
      .box   { font-size: 12px; font-weight: 800; }
      .note  { font-size: 9.5px; fill: rgb(138,133,128); }
      .lbl   { font-size: 10px; font-weight: 800; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
    <marker id="ag" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#66bb6a"/></marker>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="rgb(224,110,100)"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">init이 실패하면 주 컨테이너는 시작조차 못 한다</text>
  <text x="24" y="54" class="sub">init 은 성공(exit 0)해야 다음으로 넘어간다. 실패 시 재시도하며 주 컨테이너는 대기에 갇힌다.</text>

  <!-- init 컨테이너 박스 -->
  <rect x="60" y="120" width="200" height="90" rx="11" fill="rgb(28,30,34)" stroke="rgb(212,168,83)" stroke-width="1.4"/>
  <text x="160" y="152" class="box" text-anchor="middle" style="fill:#e8e4df">init 컨테이너</text>
  <text x="160" y="176" class="note" text-anchor="middle">준비 작업 수행</text>
  <text x="160" y="194" class="note mono" text-anchor="middle">exit 0? / exit 1?</text>

  <!-- 분기: 성공 -->
  <path d="M260,150 L400,150" fill="none" stroke="#66bb6a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="330" y="140" class="lbl" text-anchor="middle" style="fill:#66bb6a">exit 0 (성공)</text>
  <rect x="404" y="118" width="200" height="70" rx="10" fill="#66bb6a" stroke="#3d8b40" stroke-width="1.3"/>
  <text x="504" y="146" class="box" text-anchor="middle" style="fill:#0d0d0d">주 컨테이너 시작</text>
  <text x="504" y="168" class="note" text-anchor="middle" style="fill:#14330f">Running ✓</text>

  <!-- 분기: 실패 -->
  <path d="M160,210 L160,250" fill="none" stroke="rgb(224,110,100)" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="230" y="235" class="lbl" text-anchor="middle" style="fill:rgb(224,110,100)">exit 1 (실패)</text>

  <rect x="60" y="256" width="200" height="80" rx="10" fill="rgb(40,22,20)" stroke="rgb(224,110,100)" stroke-width="1.3"/>
  <text x="160" y="284" class="box" text-anchor="middle" style="fill:#f0c8c0">Init:Error</text>
  <text x="160" y="306" class="note" text-anchor="middle" style="fill:#e0a89f">쿠버네티스가 init 재시도</text>
  <text x="160" y="324" class="note" text-anchor="middle" style="fill:#e0a89f">반복 실패 → CrashLoopBackOff</text>

  <!-- 실패 시 주 컨테이너 상태 -->
  <path d="M260,296 L400,296" fill="none" stroke="rgb(224,110,100)" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="330" y="286" class="lbl" text-anchor="middle" style="fill:rgb(224,110,100)">막힘</text>
  <rect x="404" y="262" width="220" height="70" rx="10" fill="rgb(30,32,36)" stroke="rgb(120,116,112)" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="514" y="290" class="box" text-anchor="middle" style="fill:rgb(150,146,142)">주 컨테이너</text>
  <text x="514" y="312" class="note mono" text-anchor="middle" style="fill:rgb(150,146,142)">waiting: PodInitializing</text>
  <text x="514" y="326" class="note" text-anchor="middle" style="fill:rgb(150,146,142)">— 시작조차 못 함</text>

  <!-- 디버깅 팁 박스 -->
  <rect x="656" y="120" width="280" height="212" rx="10" fill="rgb(22,24,28)" stroke="rgb(212,168,83)" stroke-width="1"/>
  <text x="676" y="146" class="lbl" style="fill:rgb(212,168,83)">디버깅 — 죽은 init 로그는 남는다</text>
  <text x="676" y="172" class="note mono" style="fill:#e8e4df">kubectl logs &lt;pod&gt; \</text>
  <text x="676" y="188" class="note mono" style="fill:#e8e4df">  -c failing-init</text>
  <text x="676" y="212" class="note" style="fill:#e8e4df">컨테이너가 죽어도 Pod가 살아있는</text>
  <text x="676" y="228" class="note" style="fill:#e8e4df">한 로그는 조회된다.</text>
  <text x="676" y="252" class="note" style="fill:#e8e4df">→ 실측: "[init] 준비 시작...</text>
  <text x="676" y="268" class="note" style="fill:#e8e4df">        [init] 실패!"</text>
  <text x="676" y="296" class="note" style="fill:rgb(138,133,128)">05-02 §7 logs -c 와 같은 기법.</text>
  <text x="676" y="312" class="note" style="fill:rgb(138,133,128)">init 은 정상이면 exec 전에 끝나</text>
  <text x="676" y="326" class="note" style="fill:rgb(138,133,128)">진입은 실패 원인 찾을 때만.</text>

  <!-- 상태 전이 바 -->
  <rect x="24" y="356" width="912" height="34" rx="7" fill="rgb(26,26,26)" stroke="rgb(212,168,83)" stroke-width="1"/>
  <text x="40" y="378" class="note" style="fill:#e8e4df">정상 상태 전이: Init:0/2 → Init:1/2 → PodInitializing → Running  ·  실패 시: Init:Error → (재시도) → Init:CrashLoopBackOff 에 갇힘</text>
</svg>

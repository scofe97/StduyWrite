<svg viewBox="0 0 960 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>오버헤드와 시작 시간 — 게스트 OS가 있고 없고의 차이</title>
  <desc>왼쪽은 같은 서버에서 VM 2개와 컨테이너 다수의 자원 점유를 비교한다. VM은 게스트 OS가 자원을 먼저 떼어 가 앱에 쓸 여유가 적고, 컨테이너는 게스트 OS가 없어 더 많은 앱을 올릴 수 있다. 오른쪽은 시작 타임라인으로, VM은 게스트 OS 부팅 단계가 있어 느리고 컨테이너는 프로세스만 시작해 빠르다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .zlabel{ font-size: 12.5px; font-weight: 800; fill: rgb(212,168,83); }
      .seg   { font-size: 11px; font-weight: 800; fill: #0d0d0d; }
      .segd  { font-size: 11px; font-weight: 800; fill: #e8e4df; }
      .note  { font-size: 10.5px; fill: #e8e4df; }
      .tick  { font-size: 10px; fill: rgb(138,133,128); }
      .cnt   { font-size: 11px; font-weight: 800; fill: rgb(212,168,83); }
    </style>
    <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">게스트 OS가 있고 없고 — 자원과 시작 시간을 함께 가른다</text>
  <text x="24" y="50" class="sub">VM은 게스트 OS가 자원을 먼저 떼어 가고(왼쪽), 앱을 띄우기 전에 부팅도 해야 합니다(오른쪽). 컨테이너는 둘 다 없습니다.</text>

  <!-- ========== 왼쪽: 자원 점유 (오버헤드) ========== -->
  <text x="24" y="86" class="zlabel">① 자원 점유 — 같은 서버, 무엇이 자원을 먹나</text>

  <!-- VM 서버 -->
  <text x="40" y="112" class="note">VM 2개로 돌릴 때</text>
  <rect x="40" y="120" width="180" height="270" rx="8" fill="rgb(20,24,28)" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <!-- 게스트 OS 2개 (자원 잡아먹음, 보라) -->
  <rect x="50" y="130" width="160" height="50" rx="5" fill="rgb(150,130,220)"/>
  <text x="130" y="152" class="seg" text-anchor="middle">게스트 OS 1</text>
  <text x="130" y="169" class="seg" text-anchor="middle" font-size="9">오버헤드</text>
  <rect x="50" y="184" width="160" height="50" rx="5" fill="rgb(150,130,220)"/>
  <text x="130" y="206" class="seg" text-anchor="middle">게스트 OS 2</text>
  <text x="130" y="223" class="seg" text-anchor="middle" font-size="9">오버헤드</text>
  <!-- 앱 (남은 공간, 초록) -->
  <rect x="50" y="238" width="78" height="40" rx="5" fill="rgb(102,187,106)"/>
  <text x="89" y="262" class="seg" text-anchor="middle">App A</text>
  <rect x="132" y="238" width="78" height="40" rx="5" fill="rgb(102,187,106)"/>
  <text x="171" y="262" class="seg" text-anchor="middle">App B</text>
  <!-- 호스트 OS -->
  <rect x="50" y="282" width="160" height="34" rx="5" fill="rgb(230,230,230)"/>
  <text x="130" y="304" class="seg" text-anchor="middle">호스트 OS</text>
  <rect x="50" y="320" width="160" height="60" rx="5" fill="none" stroke="rgb(138,133,128)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="130" y="346" class="tick" text-anchor="middle">남는 여유 적음</text>
  <text x="130" y="362" class="tick" text-anchor="middle">— 앱 2개가 한계</text>

  <!-- 컨테이너 서버 -->
  <text x="250" y="112" class="note">컨테이너로 돌릴 때</text>
  <rect x="250" y="120" width="180" height="270" rx="8" fill="rgb(20,24,28)" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <!-- 앱 여러 개 (게스트 OS 없어 촘촘, 초록) -->
  <rect x="260" y="130" width="78" height="34" rx="5" fill="rgb(102,187,106)"/>
  <text x="299" y="152" class="seg" text-anchor="middle">App A</text>
  <rect x="342" y="130" width="78" height="34" rx="5" fill="rgb(102,187,106)"/>
  <text x="381" y="152" class="seg" text-anchor="middle">App B</text>
  <rect x="260" y="168" width="78" height="34" rx="5" fill="rgb(102,187,106)"/>
  <text x="299" y="190" class="seg" text-anchor="middle">App C</text>
  <rect x="342" y="168" width="78" height="34" rx="5" fill="rgb(102,187,106)"/>
  <text x="381" y="190" class="seg" text-anchor="middle">App D</text>
  <rect x="260" y="206" width="78" height="34" rx="5" fill="rgb(102,187,106)"/>
  <text x="299" y="228" class="seg" text-anchor="middle">App E</text>
  <rect x="342" y="206" width="78" height="34" rx="5" fill="rgb(212,168,83)" stroke="rgb(212,168,83)" stroke-dasharray="3 2"/>
  <text x="381" y="228" class="seg" text-anchor="middle">…더</text>
  <!-- 호스트 OS -->
  <rect x="260" y="282" width="160" height="34" rx="5" fill="rgb(230,230,230)"/>
  <text x="340" y="304" class="seg" text-anchor="middle">호스트 OS (하나뿐)</text>
  <rect x="260" y="244" width="160" height="34" rx="5" fill="none" stroke="rgb(212,168,83)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="340" y="266" class="cnt" text-anchor="middle">게스트 OS 없음 = 앱에 다 씀</text>

  <!-- 구분선 -->
  <line x1="470" y1="80" x2="470" y2="410" stroke="rgb(42,37,32)" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- ========== 오른쪽: 시작 시간 ========== -->
  <text x="500" y="86" class="zlabel">② 시작 시간 — 앱이 뜨기까지</text>

  <!-- VM 타임라인 -->
  <text x="500" y="120" class="note">VM</text>
  <rect x="500" y="130" width="250" height="40" rx="5" fill="rgb(150,130,220)"/>
  <text x="625" y="155" class="seg" text-anchor="middle">게스트 OS 부팅 (수십 초)</text>
  <rect x="754" y="130" width="90" height="40" rx="5" fill="rgb(102,187,106)"/>
  <text x="799" y="155" class="seg" text-anchor="middle">앱 시작</text>
  <line x1="500" y1="182" x2="844" y2="182" stroke="rgb(138,133,128)" stroke-width="1.2" marker-end="url(#t)"/>
  <text x="670" y="200" class="tick" text-anchor="middle">부팅 단계가 먼저 — 느림</text>

  <!-- 컨테이너 타임라인 -->
  <text x="500" y="248" class="note">컨테이너</text>
  <rect x="500" y="258" width="90" height="40" rx="5" fill="rgb(102,187,106)"/>
  <text x="545" y="283" class="seg" text-anchor="middle">앱 시작</text>
  <rect x="594" y="258" width="250" height="40" rx="5" fill="none" stroke="rgb(212,168,83)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="719" y="283" class="cnt" text-anchor="middle">부팅 단계 없음 — 절약된 시간</text>
  <line x1="500" y1="310" x2="844" y2="310" stroke="rgb(138,133,128)" stroke-width="1.2" marker-end="url(#t)"/>
  <text x="545" y="328" class="tick" text-anchor="middle">프로세스만 실행 — 초 이하</text>

  <text x="672" y="372" class="note" text-anchor="middle">게스트 OS 부팅이 없으니 컨테이너는 즉시 뜹니다</text>
  <text x="672" y="392" class="cnt" text-anchor="middle">→ 오토스케일링·장애 복구에서 이 차이가 결정적</text>
</svg>

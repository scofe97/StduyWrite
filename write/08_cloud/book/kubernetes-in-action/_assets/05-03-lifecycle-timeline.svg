<title id="dt">사이드카 막대가 가장 길고 init 막대가 가장 짧다</title><desc id="dd">네이티브 사이드카는 주 컨테이너보다 먼저 뜨고 맨 나중에 죽으므로 Pod 수명을 거의 다 덮는다. init 은 제 일을 끝내면 사라지고, 주 컨테이너는 그 사이에서만 산다.</desc>
<rect width="1000" height="596" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 05-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">사이드카 막대가 가장 길고 init 막대가 가장 짧다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">누가 먼저인가가 아니라 누가 얼마나 사는가를 본다 — 길이가 곧 보장의 범위다</text>
<rect x="24" y="104" width="952" height="436" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">사이드카가 아직 필요할 때 먼저 멈추지 않는다 — 그 보장이 막대 길이로 보인다</text>
<text x="200" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">사이드카 시작</text>
<text x="200" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">:17</text>
<line x1="200" y1="214" x2="200" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 6"/>
<text x="320" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">init 시작</text>
<text x="320" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">:18</text>
<line x1="320" y1="214" x2="320" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 6"/>
<text x="440" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">init 완료</text>
<line x1="440" y1="214" x2="440" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 6"/>
<text x="560" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">주 컨테이너 시작</text>
<text x="560" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">:25~26</text>
<line x1="560" y1="214" x2="560" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 6"/>
<text x="760" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">주 컨테이너 SIGTERM</text>
<line x1="760" y1="214" x2="760" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 6"/>
<text x="880" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">사이드카 SIGTERM</text>
<text x="880" y="204" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">+3초</text>
<line x1="880" y1="214" x2="880" y2="452" stroke="rgba(191,192,192,0.22)" stroke-width="0.8" stroke-dasharray="4 6"/>
<line x1="60" y1="224" x2="940" y2="224" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="184" y="272" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">네이티브 사이드카</text>
<rect x="200" y="250" width="680" height="36" rx="5" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="540" y="273" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">Pod 수명을 거의 다 덮는다</text>
<text x="184" y="340" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">init 컨테이너</text>
<rect x="320" y="318" width="120" height="36" rx="5" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="380" y="341" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">끝나면 사라진다</text>
<text x="184" y="408" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#3FB98C">주 컨테이너 main·helper</text>
<rect x="560" y="386" width="200" height="36" rx="5" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="660" y="409" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">이 사이에서만 산다</text>
<text x="60" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">시간 → (lifecycle-demo 의 시작과 shutdown-order-demo 의 종료를 이어 붙였다 — 눈금 간격은 순서만 나타낸다)</text>
<text x="36" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">먼저 뜨는 것과 맨 나중에 죽는 것이 한 막대에 같이 들어 있다 — 그래서 로그 수집기나 프록시가 빈 구간 없이 곁을 지킨다.</text>
<line x1="12" y1="556" x2="952" y2="556" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="578" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="568" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">네이티브 사이드카</text>
<rect x="261" y="568" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="283" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">init 컨테이너</text>
<rect x="422" y="568" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="444" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">주 컨테이너</text>
</svg>
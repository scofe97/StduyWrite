<svg viewBox="0 0 960 260" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Deployment → ReplicaSet → Pod 3계층 위임</title>
  <desc>Deployment 오브젝트는 ReplicaSet 오브젝트를 관리하고, ReplicaSet 오브젝트가 파드 오브젝트를 관리한다. Deployment는 파드를 직접 제어하지 않고 ReplicaSet을 통해 간접 제어한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .box   { font-size: 13px; font-weight: 700; fill: #0d0d0d; }
      .note  { font-size: 11px; fill: #e8e4df; }
    </style>
    <marker id="drp-a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="260" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">Deployment → ReplicaSet → Pod — 간접 제어</text>
  <text x="24" y="52" class="sub">Deployment는 파드를 직접 다루지 않고 ReplicaSet을 통해 관리합니다</text>

  <rect x="60" y="110" width="180" height="70" rx="10" fill="rgb(91,155,213)"/>
  <text x="150" y="150" class="box" text-anchor="middle">kiada Deployment</text>

  <rect x="390" y="110" width="180" height="70" rx="10" fill="rgb(140,190,235)"/>
  <text x="480" y="150" class="box" text-anchor="middle">kiada ReplicaSet</text>

  <rect x="740" y="120" width="160" height="60" rx="10" fill="rgb(180,210,245)"/>
  <rect x="730" y="110" width="160" height="60" rx="10" fill="rgb(180,210,245)"/>
  <rect x="720" y="100" width="160" height="60" rx="10" fill="rgb(180,210,245)"/>
  <text x="800" y="135" class="box" text-anchor="middle">kiada Pod</text>

  <line x1="240" y1="145" x2="388" y2="145" stroke="rgb(138,133,128)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#drp-a)"/>
  <line x1="570" y1="140" x2="718" y2="132" stroke="rgb(138,133,128)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#drp-a)"/>

  <text x="315" y="205" class="note" text-anchor="middle">Deployment가 ReplicaSet을 제어</text>
  <text x="645" y="205" class="note" text-anchor="middle">ReplicaSet이 파드를 제어</text>
</svg>

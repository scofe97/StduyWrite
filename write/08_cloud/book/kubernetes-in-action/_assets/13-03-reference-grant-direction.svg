<svg viewBox="0 0 1120 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>허가는 털리는 쪽이 낸다 — ReferenceGrant가 대상 네임스페이스에 서는 이유</title>
  <desc>참조 허가의 방향을 보인다. 참조는 team-a의 HTTPRoute에서 team-b의 서비스로 향한다. 허가가 없으면 team-b가 모르는 사이에 team-b의 서비스가 외부로 노출될 수 있다. 결정이 참조하는 쪽만으로 이뤄지면 소유자 의사가 빠지기 때문이다. 그래서 허가는 참조 화살표와 반대 방향으로, 즉 참조당하는 team-b에서 나온다. ReferenceGrant 오브젝트가 대상 서비스의 네임스페이스에 만들어지는 이유가 이것이다. 위치를 외우는 대신 허가하는 사람이 있는 곳이라고 이해하면 된다. 같은 원칙이 Gateway 공유에도 적용되는데, 그때는 Gateway가 자기 진입점의 소유자이므로 Gateway 쪽 allowedRoutes가 허가 주체가 된다.</desc>
  <defs>
    <style>
      .h1   { font-size: 24px; font-weight: 800; fill: #e8e4df; }
      .sub  { font-size: 15px; fill: #b8b3ad; }
      .ns   { font-size: 13px; font-weight: 800; fill: #b8b3ad; }
      .tag  { font-size: 12.5px; font-weight: 800; fill: #0d0d0d; }
      .who  { font-size: 12.5px; fill: #e8e4df; }
      .body { font-size: 14px; fill: #e8e4df; }
      .mono { font-size: 11px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .edge { font-size: 12px; font-weight: 700; }
    </style>
    <marker id="rg-p" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(240,150,190)"/>
    </marker>
    <marker id="rg-g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(102,187,106)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="430" fill="#0d0d0d"/>

  <text x="30" y="40" class="h1">허가는 털리는 쪽이 냅니다</text>
  <text x="30" y="66" class="sub">참조는 왼쪽에서 오른쪽으로 뻗지만, 허가는 반대 방향으로 나옵니다.</text>

  <!-- 네임스페이스 두 칸 -->
  <rect x="30" y="104" width="420" height="184" rx="12" fill="rgb(20,20,20)" stroke="rgb(120,116,112)" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="52" y="130" class="ns">namespace: team-a — 참조하는 쪽</text>
  <rect x="52" y="146" width="180" height="44" rx="7" fill="rgb(212,168,83)"/>
  <text x="142" y="173" class="tag" text-anchor="middle">HTTPRoute</text>
  <text x="52" y="270" class="who">Route를 만들 권한만 있으면 적을 수 있습니다</text>

  <rect x="670" y="104" width="420" height="184" rx="12" fill="rgb(20,20,20)" stroke="rgb(102,187,106)" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="692" y="130" class="ns" style="fill:rgb(102,187,106)">namespace: team-b — 참조당하는 쪽</text>
  <rect x="888" y="146" width="180" height="44" rx="7" fill="rgb(91,155,213)"/>
  <text x="978" y="173" class="tag" text-anchor="middle">some-service</text>
  <rect x="692" y="208" width="176" height="40" rx="7" fill="rgb(102,187,106)"/>
  <text x="780" y="233" class="tag" text-anchor="middle">ReferenceGrant</text>
  <text x="692" y="270" class="who">소유자가 직접 선언합니다</text>

  <!-- 참조 화살표 (왼→오, 대상은 서비스) -->
  <line x1="238" y1="160" x2="880" y2="160" stroke="rgb(240,150,190)" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#rg-p)"/>
  <text x="559" y="150" class="edge" style="fill:rgb(240,150,190)" text-anchor="middle">참조 — 허가 없으면 RefNotPermitted</text>

  <!-- 허가 화살표 (오→왼, ReferenceGrant에서 나옴) -->
  <line x1="686" y1="228" x2="244" y2="228" stroke="rgb(102,187,106)" stroke-width="2.4" marker-end="url(#rg-g)"/>
  <text x="465" y="218" class="edge" style="fill:rgb(102,187,106)" text-anchor="middle">허가 — 소유자가 냅니다</text>

  <!-- 원칙 띠 -->
  <rect x="30" y="308" width="1060" height="46" rx="11" fill="rgba(102,187,106,0.10)" stroke="rgb(102,187,106)" stroke-width="1.3"/>
  <text x="54" y="337" class="body">허가 주체는 언제나 <tspan font-weight="700">소유자</tspan>입니다. 위치를 외울 게 아니라 <tspan font-weight="700">"허가하는 사람이 있는 곳"</tspan>으로 읽습니다.</text>

  <!-- 같은 원칙, 뒤집힌 소유자 -->
  <rect x="30" y="366" width="1060" height="44" rx="11" fill="rgb(20,20,20)" stroke="rgb(42,37,32)"/>
  <text x="54" y="394" class="who">Gateway 공유는 소유자가 반대편입니다 — 진입점의 주인은 Gateway이므로 <tspan font-weight="700">Gateway 쪽 allowedRoutes</tspan>가 허가합니다.</text>
</svg>

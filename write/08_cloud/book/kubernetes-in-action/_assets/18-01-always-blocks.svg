<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">성공했는데 다시 시작한다</title><desc id="dd">Always 는 컨테이너가 끝나면 이유를 묻지 않고 다시 띄운다. 그래서 Job 이 기다리는 '성공하고 끝난 상태'에 도달하지 못한다.</desc>
<rect width="1240" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 18-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">성공했는데 다시 시작한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">그래서 Job 의 restartPolicy 는 OnFailure 나 Never 여야 한다</text>
<rect x="60" y="258" width="220" height="84" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="170" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">컨테이너 종료</text>
<text x="170" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">exit 0 — 성공</text>
<path d="M 282 268 L 350 268 L 350 200 L 380 200" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)"/>
<rect x="420" y="162" width="280" height="76" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="560" y="198" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">Always</text>
<text x="560" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이유를 묻지 않고 재시작</text>
<path d="M 702 200 L 800 200" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="840.0" y="187" width="300" height="26" rx="5" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="990" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">CrashLoopBackOff</text>
<text x="990" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F0616D">Completed 에 이르지 못한다</text>
<path d="M 282 332 L 350 332 L 350 400 L 380 400" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="420" y="362" width="280" height="76" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="560" y="392" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">OnFailure · Never</text>
<text x="560" y="416" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">성공하면 그대로 둔다</text>
<path d="M 702 400 L 800 400" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="840" y="362" width="300" height="76" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="990" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">Completed</text>
<text x="990" y="416" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Job 이 한 번 채워진다</text>
<text x="24" y="500" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Deployment 의 기본값이 Always 인 것은 계속 도는 것이 정상이기 때문이다. Job 은 반대라, 같은 기본값이 여기서는 끝을 막는다.</text>
<text x="24" y="522" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 Job 매니페스트에서 restartPolicy 는 생략할 수 없는 필드가 된다 — API 가 Always 를 거부한다.</text>
<line x1="12" y1="552" x2="1192" y2="552" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="574" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="564" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">끝나지 못한다</text>
<rect x="235" y="564" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="257" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">끝에 이른다</text>
<rect x="357" y="564" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="379" y="574" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">Job 이 쓸 수 있는 값</text>
</svg>
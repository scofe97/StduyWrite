<svg viewBox="0 0 1120 660" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>파드가 죽고 프록시 설정이 갱신되기까지 — 창이 열려 있는 구간</title>
  <desc>파드가 죽은 순간부터 프록시 설정이 갱신될 때까지의 타임라인이다. 앞부분인 파드 종료와 EndpointSlice 갱신은 11-03에서 이미 다룬 구간이라 한 칸으로 접어 두었다. 이 그림이 크게 보여 주는 것은 그다음이다. 컨트롤러가 변경을 통지받고 설정을 생성해 프록시를 reload하기까지 수백 밀리초에서 수 초가 걸리며, 그동안 프록시의 upstream 목록에는 죽은 파드 IP가 남아 있어 요청이 그리로 간다. 이 창을 메우는 장치는 둘이다. 하나는 프록시 재시도로, 죽은 파드로 간 요청이 실패하면 프록시가 살아 있는 다른 파드로 다시 보내며 이는 cluster IP 방식이 못 하는 일이라 오히려 파드 직접 방식이 유리한 지점이다. 다른 하나는 graceful shutdown과 preStop hook으로, 파드가 곧바로 죽지 않고 잠시 요청을 계속 받아 주어 명단이 전파될 시간을 번다. 따라서 파드 IP를 직접 쓰는 것이 11장 원칙을 어기는 것은 아니다. 프록시는 IP를 붙잡아 두는 것이 아니라 명단을 구독하며, cluster IP를 쓰든 파드 IP를 쓰든 변화를 추적하는 메커니즘은 같고 명단을 커널이 쥐느냐 프록시가 쥐느냐만 다르다. 진짜 위험은 IP가 바뀐다는 것이 아니라 그 변경이 전파되는 데 시간이 걸린다는 것이다.</desc>
  <defs>
    <style>
      .h1   { font-size: 25px; font-weight: 800; fill: #e8e4df; }
      .sub  { font-size: 15px; fill: rgb(168,163,158); }
      .lyr  { font-size: 12.5px; font-weight: 800; fill: rgb(168,163,158); }
      .tag  { font-size: 12px; font-weight: 800; fill: #0d0d0d; }
      .who  { font-size: 12.5px; fill: rgb(168,163,158); }
      .body { font-size: 14px; fill: #e8e4df; }
      .bad  { font-size: 13px; fill: rgb(240,150,190); }
      .good { font-size: 13px; fill: rgb(102,187,106); }
      .step { font-size: 12.5px; font-weight: 800; fill: #0d0d0d; }
      .mono { font-size: 11.5px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .t    { font-size: 11.5px; fill: rgb(138,133,128); }
    </style>
    <marker id="pw-a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="pw-p" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(240,150,190)"/>
    </marker>
    <marker id="pw-g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(102,187,106)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="660" fill="#0d0d0d"/>

  <text x="30" y="42" class="h1">위험한 것은 IP가 바뀌는 게 아니라, 바뀐 걸 아는 데 걸리는 시간입니다</text>
  <text x="30" y="68" class="sub">파드가 죽은 순간부터 프록시 설정이 갱신될 때까지, 죽은 주소가 명단에 남아 있습니다.</text>

  <!-- 타임라인 축 -->
  <line x1="60" y1="196" x2="1070" y2="196" stroke="rgb(120,116,112)" stroke-width="1.4"/>

  <!-- 앞 구간: 축약 -->
  <rect x="60" y="120" width="200" height="56" rx="8" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="160" y="143" class="who" text-anchor="middle">파드 종료 → EndpointSlice 갱신</text>
  <text x="160" y="164" class="t" text-anchor="middle">11-03에서 다룬 구간이라 접습니다</text>
  <text x="60" y="214" class="t">t=0</text>

  <line x1="260" y1="148" x2="292" y2="148" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#pw-a)"/>

  <!-- 뒤 구간: 확대 3단계 -->
  <rect x="300" y="112" width="228" height="72" rx="8" fill="rgb(212,168,83)"/>
  <text x="414" y="136" class="step" text-anchor="middle">컨트롤러가 통지받음</text>
  <text x="414" y="156" class="mono" text-anchor="middle">watch 이벤트 수신</text>
  <text x="414" y="174" class="mono" text-anchor="middle">→ 설정 생성 시작</text>

  <line x1="528" y1="148" x2="560" y2="148" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#pw-a)"/>

  <rect x="568" y="112" width="228" height="72" rx="8" fill="rgb(212,168,83)"/>
  <text x="682" y="136" class="step" text-anchor="middle">nginx.conf 생성</text>
  <text x="682" y="156" class="mono" text-anchor="middle">upstream 목록 다시 씀</text>
  <text x="682" y="174" class="mono" text-anchor="middle">→ 파일 기록</text>

  <line x1="796" y1="148" x2="828" y2="148" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#pw-a)"/>

  <rect x="836" y="112" width="234" height="72" rx="8" fill="rgb(102,187,106)"/>
  <text x="953" y="136" class="step" text-anchor="middle">프록시 reload</text>
  <text x="953" y="156" class="mono" text-anchor="middle">죽은 IP가 명단에서 빠짐</text>
  <text x="953" y="174" class="mono" text-anchor="middle">→ 여기서 창이 닫힙니다</text>

  <!-- 창 표시 -->
  <rect x="300" y="206" width="770" height="86" rx="9" fill="rgba(240,150,190,0.14)" stroke="rgb(240,150,190)" stroke-width="1.6"/>
  <text x="318" y="232" class="body" font-weight="700" style="fill:rgb(240,150,190)">⟵ 창이 열려 있는 구간 · 수백 ms ~ 수 초 ⟶</text>
  <text x="318" y="256" class="who">프록시의 upstream 목록에는 죽은 파드 IP가 아직 남아 있습니다.</text>
  <text x="318" y="278" class="who">그동안 그리로 간 요청은 연결에 실패합니다. 이 구간이 이 그림의 주인공입니다.</text>

  <text x="1004" y="214" class="t">t=수 초</text>

  <!-- 메우는 장치 둘 -->
  <text x="60" y="330" class="body" font-weight="700">창을 메우는 장치는 둘입니다</text>

  <rect x="60" y="344" width="500" height="128" rx="10" fill="rgb(22,22,22)" stroke="rgb(102,187,106)" stroke-width="1.6"/>
  <text x="80" y="370" class="body" font-weight="700" style="fill:rgb(102,187,106)">1. 프록시 재시도</text>
  <text x="80" y="394" class="who">죽은 파드로 간 요청이 실패하면, 프록시가 살아 있는</text>
  <text x="80" y="414" class="who">다른 파드로 다시 보냅니다. 클라이언트는 모릅니다.</text>
  <rect x="80" y="426" width="460" height="34" rx="7" fill="rgba(102,187,106,0.12)" stroke="rgb(102,187,106)" stroke-width="1.2"/>
  <text x="94" y="448" class="good" font-weight="700">cluster IP 방식은 못 하는 일 — 파드 직접이 오히려 유리한 지점</text>

  <rect x="580" y="344" width="490" height="128" rx="10" fill="rgb(22,22,22)" stroke="rgb(102,187,106)" stroke-width="1.6"/>
  <text x="600" y="370" class="body" font-weight="700" style="fill:rgb(102,187,106)">2. graceful shutdown + preStop hook</text>
  <text x="600" y="394" class="who">파드가 곧바로 죽지 않고 잠시 요청을 계속 받아 줍니다.</text>
  <text x="600" y="414" class="who">그 사이에 명단이 전파될 시간을 법니다.</text>
  <rect x="600" y="426" width="450" height="34" rx="7" fill="rgba(102,187,106,0.12)" stroke="rgb(102,187,106)" stroke-width="1.2"/>
  <text x="614" y="448" class="good" font-weight="700">창을 없애는 게 아니라, 창이 열린 동안 버티게 하는 쪽</text>

  <!-- 하단 못박기 -->
  <rect x="30" y="492" width="1060" height="142" rx="12" fill="rgba(212,168,83,0.08)" stroke="rgb(42,37,32)"/>
  <text x="54" y="520" class="body" font-weight="700">그럼 파드 IP를 직접 쓰는 건 11장 원칙을 어기는 걸까요 — 아닙니다.</text>
  <text x="54" y="544" class="who">11-01에서 파드 IP를 금한 이유는 클라이언트가 그 주소를 알아낼 방법도, 바뀐 걸 알아챌 방법도 없어서였습니다.</text>
  <text x="54" y="566" class="who">프록시는 다릅니다 — IP를 붙잡아 두는 게 아니라 EndpointSlice를 watch하며 명단을 구독합니다.</text>

  <rect x="54" y="580" width="1012" height="38" rx="8" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.2"/>
  <text x="70" y="604" class="who">cluster IP를 쓰든 파드 IP를 쓰든 변화 추적 메커니즘은 같습니다(kube-proxy도 같은 명단으로 규칙을 고칩니다). 차이는 명단을 커널이 쥐느냐 프록시가 쥐느냐뿐입니다.</text>
</svg>

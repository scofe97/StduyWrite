<svg viewBox="0 0 900 400" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-labelledby="sts-partition-title sts-partition-desc"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title id="sts-partition-title">RollingUpdate partition으로 canary와 staging 구현</title>
  <desc id="sts-partition-desc">partition 값보다 ordinal이 낮은 파드는 업데이트되지 않는다. partition을 replicas와 같은 3으로 두면 아무 파드도 업데이트되지 않아 staging이 되고, replicas 빼기 1인 2로 두면 quiz-2 하나만 갈려 canary가 되며, 0으로 내리면 남은 파드가 ordinal 역순으로 전부 갈린다. 앰버로 칠한 상자가 새 버전이다.</desc>
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 12px; fill: #b8b3ad; }
      .hdr   { font-size: 13px; font-weight: 800; fill: #e8e4df; }
      .box   { fill: #e8e4df; }
      .warn  { fill: rgb(212,168,83); }
      .lbl   { font-size: 12.5px; font-weight: 700; fill: #0d0d0d; }
      .n     { font-size: 12px; fill: #b8b3ad; }
      .cut   { stroke: rgb(212,168,83); stroke-width: 2; stroke-dasharray: 5 3; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">partition 이 경계를 정합니다</text>
  <text x="24" y="54" class="sub">낮은 ordinal 은 그대로</text>

  <text x="150" y="92" class="hdr" text-anchor="middle">partition: 3</text>
  <text x="150" y="112" class="n" text-anchor="middle">staging</text>
  <rect class="box" x="70" y="126" width="160" height="40" rx="6"/>
  <text x="150" y="152" class="lbl" text-anchor="middle">quiz-2   v0.1</text>
  <rect class="box" x="70" y="172" width="160" height="40" rx="6"/>
  <text x="150" y="198" class="lbl" text-anchor="middle">quiz-1   v0.1</text>
  <rect class="box" x="70" y="218" width="160" height="40" rx="6"/>
  <text x="150" y="244" class="lbl" text-anchor="middle">quiz-0   v0.1</text>
  <line class="cut" x1="60" y1="122" x2="240" y2="122"/>
  <text x="150" y="284" class="n" text-anchor="middle">경계가 맨 위</text>
  <text x="150" y="304" class="n" text-anchor="middle">아무도 안 갈림</text>

  <text x="450" y="92" class="hdr" text-anchor="middle">partition: 2</text>
  <text x="450" y="112" class="n" text-anchor="middle">canary</text>
  <rect class="warn" x="370" y="126" width="160" height="40" rx="6"/>
  <text x="450" y="152" class="lbl" text-anchor="middle">quiz-2   v0.2</text>
  <rect class="box" x="370" y="172" width="160" height="40" rx="6"/>
  <text x="450" y="198" class="lbl" text-anchor="middle">quiz-1   v0.1</text>
  <rect class="box" x="370" y="218" width="160" height="40" rx="6"/>
  <text x="450" y="244" class="lbl" text-anchor="middle">quiz-0   v0.1</text>
  <line class="cut" x1="360" y1="169" x2="540" y2="169"/>
  <text x="450" y="284" class="n" text-anchor="middle">경계 위만 갈림</text>
  <text x="450" y="304" class="n" text-anchor="middle">quiz-2 하나</text>

  <text x="750" y="92" class="hdr" text-anchor="middle">partition: 0</text>
  <text x="750" y="112" class="n" text-anchor="middle">완료</text>
  <rect class="warn" x="670" y="126" width="160" height="40" rx="6"/>
  <text x="750" y="152" class="lbl" text-anchor="middle">quiz-2   v0.2</text>
  <rect class="warn" x="670" y="172" width="160" height="40" rx="6"/>
  <text x="750" y="198" class="lbl" text-anchor="middle">quiz-1   v0.2</text>
  <rect class="warn" x="670" y="218" width="160" height="40" rx="6"/>
  <text x="750" y="244" class="lbl" text-anchor="middle">quiz-0   v0.2</text>
  <line class="cut" x1="660" y1="264" x2="840" y2="264"/>
  <text x="750" y="284" class="n" text-anchor="middle">경계가 맨 아래</text>
  <text x="750" y="304" class="n" text-anchor="middle">전부 갈림</text>

  <text x="24" y="352" class="n">앰버 상자 · 새 버전 v0.2</text>
  <text x="24" y="374" class="n">점선 · partition 경계</text>
  <text x="450" y="352" class="n">경계는 위에서 아래로 내려옵니다</text>
  <text x="450" y="374" class="n">pause 대신 쓰는 손잡이</text>
</svg>

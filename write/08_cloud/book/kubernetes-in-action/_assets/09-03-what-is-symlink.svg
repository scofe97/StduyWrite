<svg viewBox="0 0 900 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>심볼릭 링크란 무엇인가 — 다른 경로를 가리키는 포인터 파일</title>
  <desc>일반 파일은 이름이 디스크의 실제 데이터를 직접 가리킨다. 심볼릭 링크는 데이터가 아니라 다른 경로 문자열을 담은 포인터 파일이다. 심링크를 읽으면 시스템이 그 경로를 따라가 실제 파일에 도달한다. ls -l에서 lrwxrwxrwx로 시작하고 화살표로 대상 경로를 보여준다. 대상을 바꾸면 심링크는 그대로 두고 가리키는 곳만 바뀐다.</desc>

  <rect x="0" y="0" width="900" height="400" fill="#0d0d0d"/>
  <text x="30" y="34" fill="rgb(212,168,83)" font-size="16" font-weight="700">심볼릭 링크 = 데이터가 아니라 "다른 경로"를 담은 포인터 파일</text>

  <!-- 왼쪽: 일반 파일 -->
  <rect x="24" y="56" width="410" height="300" rx="8" fill="#0d0d0d" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <text x="40" y="82" fill="#e8e4df" font-size="13" font-weight="700">일반 파일 — 이름이 데이터를 직접 가리킴</text>

  <rect x="48" y="104" width="150" height="54" rx="6" fill="#dceaf7" stroke="rgb(42,37,32)"/>
  <text x="123" y="127" style="fill:#10243a" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" text-anchor="middle">app.conf</text>
  <text x="123" y="146" style="fill:#10243a" font-size="10" text-anchor="middle">파일 이름</text>

  <line x1="198" y1="131" x2="270" y2="131" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#ar1)"/>
  <defs>
    <marker id="ar1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5b9bd5"/></marker>
  </defs>

  <rect x="272" y="100" width="138" height="62" rx="6" fill="#cdeccf" stroke="rgb(42,37,32)"/>
  <text x="341" y="124" style="fill:#14521d" font-size="11" font-weight="700" text-anchor="middle">디스크의 실제</text>
  <text x="341" y="142" style="fill:#14521d" font-size="11" font-weight="700" text-anchor="middle">데이터 블록</text>
  <text x="341" y="156" style="fill:#14521d" font-family="'JetBrains Mono',monospace" font-size="9" text-anchor="middle">message=...</text>

  <text x="48" y="200" fill="#e8e4df" font-size="11">파일 이름이 곧 데이터의 주소입니다.</text>
  <text x="48" y="222" fill="#e8e4df" font-size="11">이름을 열면 바로 그 내용이 나옵니다.</text>

  <rect x="48" y="248" width="362" height="88" rx="6" fill="#0d0d0d" stroke="rgb(90,85,78)"/>
  <text x="62" y="272" fill="#e8e4df" font-family="'JetBrains Mono',monospace" font-size="11">$ ls -l app.conf</text>
  <text x="62" y="296" fill="rgb(212,168,83)" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">-rw-r--r--  app.conf</text>
  <text x="62" y="320" fill="#e8e4df" font-size="10.5">맨 앞 <tspan font-family="'JetBrains Mono',monospace" font-weight="700">-</tspan> = 일반 파일</text>

  <!-- 오른쪽: 심볼릭 링크 -->
  <rect x="454" y="56" width="422" height="300" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="470" y="82" fill="#5b9bd5" font-size="13" font-weight="700">심볼릭 링크 — 다른 경로를 가리킴</text>

  <rect x="474" y="104" width="130" height="54" rx="6" fill="#dceaf7" stroke="rgb(42,37,32)"/>
  <text x="539" y="127" style="fill:#10243a" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" text-anchor="middle">app.conf</text>
  <text x="539" y="146" style="fill:#10243a" font-size="10" text-anchor="middle">심링크 (포인터)</text>

  <line x1="604" y1="131" x2="646" y2="131" stroke="#5b9bd5" stroke-width="2.5" marker-end="url(#ar2)"/>

  <rect x="648" y="100" width="150" height="62" rx="6" fill="#f5edda" stroke="rgb(42,37,32)"/>
  <text x="723" y="122" style="fill:#3a2f10" font-size="10.5" font-weight="700" text-anchor="middle">담은 것은 데이터가</text>
  <text x="723" y="139" style="fill:#3a2f10" font-size="10.5" font-weight="700" text-anchor="middle">아니라 경로 문자열</text>
  <text x="723" y="156" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="9" text-anchor="middle">..data/app.conf</text>

  <text x="474" y="196" fill="#e8e4df" font-size="11">심링크를 열면 시스템이 그 경로를</text>
  <text x="474" y="216" fill="#e8e4df" font-size="11">따라가 실제 파일에 도달합니다.</text>
  <text x="474" y="236" fill="rgb(212,168,83)" font-size="11" font-weight="700">→ 대상을 바꾸면 심링크는 그대로,</text>
  <text x="474" y="253" fill="rgb(212,168,83)" font-size="11" font-weight="700">   가리키는 곳만 바뀝니다.</text>

  <rect x="474" y="266" width="386" height="72" rx="6" fill="#0d0d0d" stroke="#5b9bd5"/>
  <text x="488" y="290" fill="#e8e4df" font-family="'JetBrains Mono',monospace" font-size="11">$ ls -l app.conf</text>
  <text x="488" y="314" fill="#5b9bd5" font-family="'JetBrains Mono',monospace" font-size="10.5" font-weight="700">lrwxrwxrwx  app.conf -&gt; ..data/app.conf</text>
  <text x="488" y="332" fill="#e8e4df" font-size="10">맨 앞 <tspan font-family="'JetBrains Mono',monospace" font-weight="700" fill="#5b9bd5">l</tspan> = 심링크 · <tspan font-family="'JetBrains Mono',monospace" font-weight="700">-&gt;</tspan> 뒤가 가리키는 대상</text>
</svg>

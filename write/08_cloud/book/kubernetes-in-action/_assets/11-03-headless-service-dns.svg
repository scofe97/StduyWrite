<title id="dt">headless 는 파드 IP 를 그대로 돌려준다</title><desc id="dd">clusterIP 를 None 으로 두면 cluster DNS 가 가상 주소 하나가 아니라 뒷받침 파드마다 A 레코드를 답한다. 클라이언트는 그 목록을 받아 파드에 직접 붙는다.</desc>

<svg viewBox="0 0 820 500" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>15-02 전체 지도 — 무엇이 교체 속도를 정하는가</title>
  <desc>Pod 템플릿을 바꾸면 시작되는 교체를 두 전략으로 가른 뒤, RollingUpdate의 속도를 maxSurge와 maxUnavailable이 어떻게 정하는지, 그리고 그 설정만으로는 무중단이 보장되지 않는 이유와 롤아웃 도중 다시 롤아웃할 때의 동작까지 세로로 이은 그림입니다. 2단계에는 Recreate의 다운타임 표시가, 5단계에는 maxUnavailable 0 이어도 끊길 수 있다는 위험 표시가 붙어 있습니다.</desc>
  <rect width="820" height="500" fill="#0d0d0d"/>

  <text x="40" y="40" fill="#e8e4df" font-size="15" font-weight="700">무엇이 교체 속도를 정하는가</text>

  <rect x="40" y="62" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="88" fill="#0d0d0d" font-size="14" font-weight="700">1. 템플릿을 바꾸면 시작된다</text>
  <text x="740" y="88" text-anchor="end" fill="#3a3632" font-size="11">§1</text>
  <text x="60" y="112" fill="#3a3632" font-size="12">교체 방식은 strategy 가 정합니다</text>
  <text x="340" y="112" fill="#3a3632" font-size="12">Recreate 또는 RollingUpdate</text>

  <path d="M410 128 L410 150" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="154" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="180" fill="#0d0d0d" font-size="14" font-weight="700">2·3. 두 전략이 갈린다</text>
  <text x="740" y="180" text-anchor="end" fill="#3a3632" font-size="11">§2 · §3</text>
  <text x="60" y="204" fill="#3a3632" font-size="12">Recreate — 동시에 전부</text>
  <text x="240" y="204" fill="#3a3632" font-size="12">RollingUpdate — 하나씩</text>
  <rect x="450" y="190" width="270" height="22" rx="3" fill="rgb(212,168,83)"/>
  <text x="462" y="205" fill="#0d0d0d" font-size="11.5" font-weight="700">주의 · Recreate 는 가용 0 구간이 생김</text>

  <path d="M410 234 L410 256" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="260" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="286" fill="#0d0d0d" font-size="14" font-weight="700">4. 두 값이 보폭을 정한다</text>
  <text x="740" y="286" text-anchor="end" fill="#3a3632" font-size="11">§4</text>
  <text x="60" y="310" fill="#3a3632" font-size="12">maxSurge — 위로 몇 개까지</text>
  <text x="300" y="310" fill="#3a3632" font-size="12">maxUnavailable — 아래로 몇 개까지</text>

  <path d="M410 326 L410 348" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="352" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="378" fill="#0d0d0d" font-size="14" font-weight="700">5·6. 설정만으로는 끝나지 않는다</text>
  <text x="740" y="378" text-anchor="end" fill="#3a3632" font-size="11">§5 · §6</text>
  <text x="60" y="402" fill="#3a3632" font-size="12">재롤아웃은 방향만 틉니다</text>
  <rect x="290" y="388" width="430" height="22" rx="3" fill="#f2d4d4"/>
  <text x="302" y="403" fill="#7a1f1f" font-size="11.5" font-weight="700">위험 · maxUnavailable 0 이어도 준비 판정이 틀리면 끊깁니다</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8b3ad"/>
    </marker>
  </defs>
</svg>

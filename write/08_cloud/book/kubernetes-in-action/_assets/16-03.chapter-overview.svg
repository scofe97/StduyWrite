<svg viewBox="0 0 820 560" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>16-03 전체 지도 — 롤아웃 통제권을 넘겨받는 순서</title>
  <desc>StatefulSet 업데이트를 통제권이 컨트롤러에서 사용자로 넘어가는 순서로 이은 그림입니다. RollingUpdate는 컨트롤러가 높은 ordinal부터 하나씩 교체하고, partition은 어디까지 교체할지 사용자가 경계를 정하며, OnDelete는 언제 교체할지까지 사용자가 정합니다. 그 아래에 층위가 다른 별도 줄기로 Operator가 놓여, 통제권을 사용자에게서 앱 전용 컨트롤러로 다시 넘기는 방향을 보입니다.</desc>
  <rect width="820" height="560" fill="#0d0d0d"/>

  <text x="40" y="40" fill="#e8e4df" font-size="15" font-weight="700">통제권이 옮겨 가는 순서</text>

  <rect x="40" y="62" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="88" fill="#0d0d0d" font-size="14" font-weight="700">1. 컨트롤러가 정한다</text>
  <text x="740" y="88" text-anchor="end" fill="#3a3632" font-size="11">§1</text>
  <text x="60" y="112" fill="#3a3632" font-size="12">높은 ordinal부터 하나씩</text>
  <text x="300" y="112" fill="#3a3632" font-size="12">ControllerRevision</text>
  <rect x="480" y="98" width="210" height="22" rx="3" fill="rgb(212,168,83)"/>
  <text x="492" y="113" fill="#0d0d0d" font-size="11.5" font-weight="700">주의 · maxSurge는 없다</text>
  <text x="60" y="131" fill="#3a3632" font-size="12">minReadySeconds로 지연</text>

  <path d="M410 142 L410 164" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="168" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="194" fill="#0d0d0d" font-size="14" font-weight="700">2. 어디까지를 정한다</text>
  <text x="740" y="194" text-anchor="end" fill="#3a3632" font-size="11">§2</text>
  <text x="60" y="218" fill="#3a3632" font-size="12">partition = replicas</text>
  <text x="240" y="218" fill="#3a3632" font-size="12">staging</text>
  <text x="380" y="218" fill="#3a3632" font-size="12">pause 대신 쓴다</text>
  <text x="60" y="237" fill="#3a3632" font-size="12">partition</text>
  <text x="114" y="237" fill="#3a3632" font-size="12">= replicas−1</text>
  <text x="240" y="237" fill="#3a3632" font-size="12">canary</text>
  <text x="380" y="237" fill="#3a3632" font-size="12">0이면 전부 교체</text>

  <path d="M410 248 L410 270" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="274" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="300" fill="#0d0d0d" font-size="14" font-weight="700">3. 언제까지 정한다</text>
  <text x="740" y="300" text-anchor="end" fill="#3a3632" font-size="11">§3</text>
  <text x="60" y="324" fill="#3a3632" font-size="12">지워야 교체된다</text>
  <text x="300" y="324" fill="#3a3632" font-size="12">순서도 자유</text>
  <rect x="440" y="310" width="250" height="22" rx="3" fill="#f2d4d4"/>
  <text x="452" y="325" fill="#7a1f1f" font-size="11.5" font-weight="700">위험 · ready 판단은 사용자 몫</text>
  <text x="60" y="343" fill="#3a3632" font-size="12">연쇄 장애를 막는 대신 수고</text>

  <line x1="40" y1="386" x2="780" y2="386" stroke="#b8b3ad" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="40" y="410" fill="#b8b3ad" font-size="12">여기부터는 층위가 다르다</text>

  <rect x="40" y="424" width="740" height="98" rx="4" fill="#e8e4df"/>
  <text x="60" y="450" fill="#0d0d0d" font-size="14" font-weight="700">4. 앱이 스스로 정한다</text>
  <text x="740" y="450" text-anchor="end" fill="#3a3632" font-size="11">§4</text>
  <text x="60" y="474" fill="#3a3632" font-size="12">CRD로 타입 추가</text>
  <text x="240" y="474" fill="#3a3632" font-size="12">커스텀 오브젝트</text>
  <text x="420" y="474" fill="#3a3632" font-size="12">reconciliation loop</text>
  <text x="60" y="496" fill="#3a3632" font-size="12">StatefulSet도 만들어 준다</text>
  <text x="300" y="496" fill="#3a3632" font-size="12">스케일에 재구성까지</text>
  <text x="60" y="515" fill="#3a3632" font-size="12">하위를 직접 바꾸면 되돌림</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8b3ad"/>
    </marker>
  </defs>
</svg>

<title id="dt">교체의 주도권을 누가 쥐는가</title><desc id="dd">세 방식은 나란한 선택지가 아니라 한 축의 눈금이다. 순서와 시점을 컨트롤러가 다 쥔 쪽에서 시작해, 어디까지 · 언제까지를 한 칸씩 사용자에게 넘긴다.</desc>
<rect width="1180" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 16-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">교체의 주도권을 누가 쥐는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">§1 RollingUpdate · §2 partition · §3 OnDelete</text>
<rect x="24" y="108" width="1132" height="80" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="24" y="108" width="4" height="80" rx="2" fill="#E3B341"/>
<text x="50" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">§1  RollingUpdate</text>
<text x="50" y="164" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">컨트롤러가 순서와 시점을 전부 정한다</text>
<text x="1130" y="154" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">maxSurge 가 없다 — Deployment 와 달리 초과 생성으로 앞당길 수 없다</text>
<rect x="24" y="200" width="1132" height="80" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="50" y="232" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">§2  partition</text>
<text x="50" y="256" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어디까지 교체할지를 사용자가 정한다</text>
<rect x="24" y="292" width="1132" height="80" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="24" y="292" width="4" height="80" rx="2" fill="#F0616D"/>
<text x="50" y="324" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">§3  OnDelete</text>
<text x="50" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">언제 교체할지까지 사용자가 가져온다</text>
<text x="1130" y="338" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">파드가 ready 인지 판단할 책임도 컨트롤러가 아니라 사용자에게 넘어온다</text>
<text x="24" y="432" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">주도권을 가져올수록 컨트롤러가 대신 봐 주던 것도 함께 사라진다. OnDelete 는 시점을 얻는 대신 '이 파드가 받을 수 있는가'를 스스로 판단해야 한다.</text>
<line x1="12" y1="456" x2="1132" y2="456" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="478" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="468" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">컨트롤러가 못 해 주는 것</text>
<rect x="326" y="468" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="348" y="478" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">사용자가 떠안는 책임</text>
</svg>
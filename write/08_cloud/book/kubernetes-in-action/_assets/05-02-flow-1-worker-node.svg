<svg viewBox="0 0 960 480" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>방법 ① 워커 노드에서 접근 — 실제 아키텍처 흐름</title>
  <desc>쿠버네티스 아키텍처 무대(내 노트북, Control Plane의 API 서버·etcd, Worker 노드의 kubelet·Pod) 위에 방법 ①의 경로를 표시한다. 워커 노드에 로그인해 그 노드에서 curl로 같은 노드의 kiada Pod에 직접 연결하므로, 마지막 연결자는 노드이고 Client IP는 노드 브리지 IP다.</desc>
  <defs>
    <style>
      .title  { font-size: 16px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 10.5px; fill: rgb(138,133,128); }
      .zone   { font-size: 11px; font-weight: 800; fill: rgb(138,133,128); }
      .comp   { font-size: 11.5px; font-weight: 800; fill: #e8e4df; }
      .compd  { font-size: 11.5px; font-weight: 800; fill: #0d0d0d; }
      .note   { font-size: 9px; fill: rgb(138,133,128); }
      .ip     { font-size: 11px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: rgb(212,168,83); }
      .last   { font-size: 10.5px; font-weight: 800; fill: rgb(212,168,83); }
      .dim    { font-size: 10px; fill: rgb(90,88,84); }
    </style>
    <marker id="arL" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="rgb(212,168,83)"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">① 워커 노드에서 접근 — 노드가 kiada에 직접 연결</text>
  <text x="24" y="54" class="sub">노드에 로그인(docker exec / ssh)해 그 노드에서 curl. Control Plane·API 서버를 거치지 않는다.</text>

  <!-- 내 노트북 (이 방법에선 미사용 — dim) -->
  <rect x="30" y="90" width="150" height="70" rx="9" fill="rgb(18,20,24)" stroke="rgb(60,58,54)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="105" y="120" class="dim" text-anchor="middle">내 노트북</text>
  <text x="105" y="140" class="dim" text-anchor="middle">(이 방법 미사용)</text>

  <!-- Control Plane (dim — 이 방법에선 안 거침) -->
  <rect x="30" y="200" width="230" height="240" rx="12" fill="rgb(16,18,22)" stroke="rgb(60,58,54)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="46" y="224" class="dim">Control Plane (안 거침)</text>
  <rect x="52" y="238" width="186" height="42" rx="7" fill="rgb(22,24,28)" stroke="rgb(60,58,54)" stroke-width="1"/>
  <text x="145" y="264" class="dim" text-anchor="middle">API 서버</text>
  <rect x="52" y="292" width="88" height="40" rx="7" fill="rgb(22,24,28)" stroke="rgb(60,58,54)" stroke-width="1"/>
  <text x="96" y="317" class="dim" text-anchor="middle">etcd</text>
  <rect x="150" y="292" width="88" height="40" rx="7" fill="rgb(22,24,28)" stroke="rgb(60,58,54)" stroke-width="1"/>
  <text x="194" y="317" class="dim" text-anchor="middle">스케줄러</text>

  <!-- Worker 노드 (활성) -->
  <rect x="470" y="90" width="460" height="350" rx="12" fill="rgb(16,18,22)" stroke="rgb(212,168,83)" stroke-width="1.6"/>
  <text x="490" y="116" class="zone" style="fill:rgb(212,168,83)">Worker 노드 (k8s-lab-worker2)</text>

  <!-- 노드 안: curl 셸 -->
  <rect x="496" y="140" width="180" height="80" rx="9" fill="rgb(28,30,34)" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="586" y="168" class="comp" text-anchor="middle">노드 셸 (curl)</text>
  <text x="586" y="188" class="note" text-anchor="middle">docker exec 로 로그인</text>
  <text x="586" y="204" class="note" text-anchor="middle">브리지 IP 10.244.2.1</text>

  <!-- kubelet (이 방법에선 관여 안 함 — dim) -->
  <rect x="496" y="300" width="180" height="56" rx="9" fill="rgb(22,24,28)" stroke="rgb(60,58,54)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="586" y="333" class="dim" text-anchor="middle">kubelet (관여 안 함)</text>

  <!-- kiada Pod -->
  <rect x="716" y="200" width="190" height="90" rx="10" fill="#5b9bd5" stroke="#2f6ba3" stroke-width="1.4"/>
  <text x="811" y="230" class="comp" text-anchor="middle" style="fill:#e8e4df">kiada Pod</text>
  <text x="811" y="252" class="note" text-anchor="middle" style="fill:#dbe8f5">10.244.2.5:8080</text>
  <text x="811" y="270" class="note" text-anchor="middle" style="fill:#dbe8f5">응답에 Client IP 찍음</text>

  <!-- 경로: 노드 셸 → kiada (앰버, 마지막 연결) -->
  <path d="M676,180 C700,180 700,240 712,242" fill="none" stroke="rgb(212,168,83)" stroke-width="3" marker-end="url(#arL)"/>
  <text x="700" y="150" class="last" text-anchor="middle">같은 노드 안에서 직접 연결</text>

  <!-- 결과 바 -->
  <rect x="30" y="452" width="900" height="0" />
  <rect x="470" y="366" width="460" height="60" rx="8" fill="rgb(26,26,26)" stroke="rgb(212,168,83)" stroke-width="1.1"/>
  <text x="490" y="392" class="last">마지막 연결자 = 노드</text>
  <text x="490" y="414" class="last">→ Client IP =</text>
  <text x="600" y="414" class="ip">10.244.2.1</text>
  <text x="710" y="414" class="note" style="fill:#e8e4df">(노드 브리지 IP)</text>
</svg>

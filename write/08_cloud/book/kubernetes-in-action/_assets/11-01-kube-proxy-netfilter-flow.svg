<svg viewBox="0 0 1180 720" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>kube-proxy가 심은 규칙으로 패킷이 리눅스 커널을 지나는 흐름 — netfilter·conntrack과 iptables 대 IPVS</title>
  <desc>kube-proxy는 트래픽을 직접 나르지 않고 리눅스 커널에 규칙만 심는 컨트롤러다. 실제 패킷 변환은 커널의 netfilter가 한다. ClusterIP로 온 패킷은 PREROUTING 훅에서 nat 테이블의 KUBE-SERVICES 체인으로 들어가고, ClusterIP에 매칭되면 KUBE-SVC 체인에서 엔드포인트 중 하나가 확률적으로 선택되며, KUBE-SEP 체인에서 목적지를 실제 파드 IP로 바꾸는 DNAT가 일어난다. 이때 conntrack이 이 변환을 기록해 두었다가, 응답 패킷이 돌아올 때 출발지를 원래 ClusterIP로 되돌린다. 그래서 클라이언트는 자기가 보낸 ClusterIP에서 응답이 온 것으로 본다. iptables 모드는 체인을 위에서 아래로 선형 탐색해 서비스가 수만 개면 규칙이 O(n)으로 늘지만, IPVS 모드는 해시 테이블로 O(1)에 조회해 대규모 클러스터에서 빠르다.</desc>
  <defs>
    <style>
      .title  { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .sect   { font-size: 13px; font-weight: 800; fill: rgb(212,168,83); }
      .step   { font-size: 12px; font-weight: 800; fill: #e8e4df; }
      .dark   { font-size: 12px; font-weight: 800; fill: #1a1a1a; }
      .desc   { font-size: 10px; font-weight: 600; fill: #e8e4df; }
      .darkdesc { font-size: 10px; font-weight: 600; fill: #1a1a1a; }
      .muted  { font-size: 9.5px; fill: rgb(138,133,128); }
      .mono   { font-size: 9.5px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .darkmono { font-size: 9.5px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #1a1a1a; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/></marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b9bd5"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="720" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">kube-proxy는 규칙만 심고, 패킷 변환은 커널 netfilter가 한다</text>
  <text x="24" y="50" class="sub">ClusterIP 패킷이 PREROUTING 훅 → nat 테이블 체인들 → DNAT → conntrack 기록을 거쳐 파드로 간다. 응답은 conntrack이 역변환한다.</text>

  <!-- kube-proxy 컨트롤러 (위, 규칙 심기) -->
  <rect x="40" y="72" width="1100" height="52" rx="10" fill="rgb(16,18,22)" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="60" y="94" class="sect">kube-proxy (컨트롤러 — 패킷을 나르지 않음)</text>
  <text x="60" y="113" class="muted">EndpointSlice 명단을 감시해 각 노드 커널에 아래 규칙을 심고 갱신할 뿐. 실제 패킷은 건드리지 않는다.</text>
  <text x="720" y="104" class="mono" style="fill:rgb(212,168,83)">iptables-restore / ipvsadm 으로 규칙 주입 ↓</text>

  <!-- 커널 netfilter 경로 (본체) -->
  <text x="40" y="156" class="sect">리눅스 커널 · netfilter 패킷 경로 (요청 →)</text>

  <!-- NIC 진입 -->
  <rect x="40" y="170" width="120" height="70" rx="9" fill="#5b9bd5"/>
  <text x="100" y="200" class="step" text-anchor="middle" style="fill:#e8e4df">NIC 진입</text>
  <text x="100" y="220" class="mono" text-anchor="middle" style="fill:#e8e4df">dst 10.96.74.151:80</text>

  <!-- PREROUTING -->
  <rect x="192" y="170" width="150" height="70" rx="9" fill="rgb(20,22,26)" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="267" y="196" class="desc" text-anchor="middle" style="fill:rgb(212,168,83)">PREROUTING 훅</text>
  <text x="267" y="216" class="muted" text-anchor="middle">nat 테이블 진입점</text>
  <text x="267" y="230" class="muted" text-anchor="middle">(외부→호스트 첫 훅)</text>
  <line x1="160" y1="205" x2="188" y2="205" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- KUBE-SERVICES -->
  <rect x="374" y="170" width="160" height="70" rx="9" fill="rgb(20,22,26)" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="454" y="196" class="mono" text-anchor="middle" style="fill:rgb(212,168,83)">KUBE-SERVICES</text>
  <text x="454" y="216" class="muted" text-anchor="middle">모든 ClusterIP 매칭의</text>
  <text x="454" y="230" class="muted" text-anchor="middle">진입 체인</text>
  <line x1="342" y1="205" x2="370" y2="205" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- KUBE-SVC (확률 분기) -->
  <rect x="566" y="170" width="160" height="70" rx="9" fill="#d4a853"/>
  <text x="646" y="194" class="darkmono" text-anchor="middle">KUBE-SVC-xxxx</text>
  <text x="646" y="214" class="darkdesc" text-anchor="middle">엔드포인트 중 하나를</text>
  <text x="646" y="228" class="darkdesc" text-anchor="middle">확률로 선택</text>
  <line x1="534" y1="205" x2="562" y2="205" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- KUBE-SEP (DNAT) -->
  <rect x="758" y="170" width="160" height="70" rx="9" fill="#d4a853"/>
  <text x="838" y="194" class="darkmono" text-anchor="middle">KUBE-SEP-yyyy</text>
  <text x="838" y="214" class="dark" text-anchor="middle">DNAT 실행</text>
  <text x="838" y="228" class="darkmono" text-anchor="middle">dst → 10.244.2.9:80</text>
  <line x1="726" y1="205" x2="754" y2="205" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- conntrack -->
  <rect x="950" y="170" width="190" height="70" rx="9" fill="rgb(16,18,22)" stroke="#66bb6a" stroke-width="1.4"/>
  <text x="1045" y="194" class="desc" text-anchor="middle" style="fill:#66bb6a">conntrack 기록</text>
  <text x="1045" y="214" class="muted" text-anchor="middle">이 변환(ClusterIP↔파드)을</text>
  <text x="1045" y="228" class="muted" text-anchor="middle">연결 테이블에 저장</text>
  <line x1="918" y1="205" x2="946" y2="205" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 라우팅 → 파드 -->
  <rect x="758" y="264" width="382" height="52" rx="9" fill="rgb(20,22,26)" stroke="#5b9bd5" stroke-width="1.2"/>
  <text x="949" y="286" class="desc" text-anchor="middle" style="fill:#8fc0ec">routing decision → 파드 10.244.2.9 로 전달</text>
  <text x="949" y="304" class="muted" text-anchor="middle">파드는 원래 클라이언트 IP를 출발지로 봄 (SNAT 안 함)</text>
  <line x1="1045" y1="240" x2="1000" y2="262" stroke="#66bb6a" stroke-width="2" marker-end="url(#arg)"/>

  <!-- 응답 역변환 -->
  <text x="40" y="360" class="sect" style="fill:#66bb6a">응답 경로 (← 파드에서 돌아올 때)</text>
  <rect x="40" y="374" width="1100" height="58" rx="9" fill="rgb(16,18,22)" stroke="#66bb6a" stroke-width="1.3"/>
  <text x="60" y="398" class="desc" style="fill:#66bb6a">응답 패킷은 출발지가 파드 IP(10.244.2.9)로 옴 → conntrack이 저장해 둔 매핑으로 출발지를 원래 ClusterIP(10.96.74.151)로 되돌림.</text>
  <text x="60" y="418" class="muted">그래서 클라이언트는 "내가 보낸 ClusterIP에서 응답이 왔다"고 인식한다. conntrack이 없으면 클라이언트가 낯선 파드 IP 응답을 버린다.</text>

  <!-- iptables vs IPVS 비교 -->
  <text x="40" y="474" class="sect">규칙을 어떻게 조회하나 — iptables 모드 대 IPVS 모드</text>

  <!-- iptables -->
  <rect x="40" y="490" width="540" height="200" rx="10" fill="rgb(16,18,22)" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="60" y="516" class="step" style="fill:rgb(212,168,83)">iptables 모드 (기본)</text>
  <text x="60" y="536" class="muted">체인을 위에서 아래로 선형 탐색 — O(n)</text>
  <rect x="60" y="548" width="220" height="122" rx="7" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="75" y="570" class="mono" style="fill:rgb(212,168,83)">KUBE-SVC-a  ? ─ no</text>
  <text x="75" y="590" class="mono" style="fill:rgb(212,168,83)">KUBE-SVC-b  ? ─ no</text>
  <text x="75" y="610" class="mono" style="fill:rgb(212,168,83)">KUBE-SVC-c  ? ─ no</text>
  <text x="75" y="630" class="mono" style="fill:#66bb6a">KUBE-SVC-d  ? ─ 매칭!</text>
  <text x="75" y="654" class="muted">서비스 수만 개면 규칙도 수만 개</text>
  <text x="300" y="576" class="desc" style="fill:#f0b0b0">서비스가 늘수록</text>
  <text x="300" y="596" class="desc" style="fill:#f0b0b0">탐색·규칙 갱신이</text>
  <text x="300" y="616" class="desc" style="fill:#f0b0b0">선형으로 느려짐</text>
  <text x="300" y="648" class="muted">소~중규모엔 충분</text>

  <!-- IPVS -->
  <rect x="600" y="490" width="540" height="200" rx="10" fill="rgb(16,18,22)" stroke="#5b9bd5" stroke-width="1.3"/>
  <text x="620" y="516" class="step" style="fill:#8fc0ec">IPVS 모드</text>
  <text x="620" y="536" class="muted">커널 해시 테이블로 조회 — O(1)</text>
  <rect x="620" y="548" width="240" height="122" rx="7" fill="#5b9bd5"/>
  <text x="740" y="576" class="step" text-anchor="middle" style="fill:#e8e4df">hash(ClusterIP:80)</text>
  <text x="740" y="600" class="mono" text-anchor="middle" style="fill:#e8e4df">→ 바로 엔드포인트 셋</text>
  <text x="740" y="624" class="mono" text-anchor="middle" style="fill:#e8e4df">한 번에 조회</text>
  <text x="740" y="652" class="muted" text-anchor="middle" style="fill:#e8e4df">서비스 수와 무관하게 일정</text>
  <text x="880" y="576" class="desc" style="fill:#66bb6a">서비스 수만 개라도</text>
  <text x="880" y="596" class="desc" style="fill:#66bb6a">조회 시간 일정</text>
  <text x="880" y="626" class="muted">대규모 클러스터에</text>
  <text x="880" y="646" class="muted">유리 (LVS 커널 모듈)</text>

  <text x="24" y="712" class="muted">한계: 이 경로는 표준 ClusterIP·iptables/IPVS 기준이다. eBPF 기반 CNI(Cilium 등)는 netfilter를 우회하는 다른 경로를 쓴다.</text>
</svg>

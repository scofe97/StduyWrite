<svg viewBox="0 0 880 340" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>StatefulSet 스케일 시 PVC 보존과 재부착</title>
  <desc>StatefulSet을 스케일다운하면 파드는 삭제되지만 PVC와 PV는 보존된다. 다시 스케일업하면 새 파드가 ordinal 번호를 기준으로 이전과 같은 PVC에 재부착되므로, 스케일다운은 데이터 삭제가 아니라 일시 정지에 가깝다. PVC를 지우면 바인딩된 PV가 recycle되거나 삭제되어 데이터가 사라지기 때문에 보존이 기본값이다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: #b8b3ad; }
      .stage { font-size: 12px; font-weight: 800; fill: #e8e4df; }
      .box   { fill: #e8e4df; }
      .warn  { fill: rgb(212,168,83); }
      .t     { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .d     { font-size: 10.5px; fill: #3a3632; }
      .n     { font-size: 10.5px; fill: #b8b3ad; }
      .gone  { font-size: 10.5px; fill: #b8b3ad; }
    </style>
    <marker id="spp-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="340" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">PVC 는 남습니다</text>
  <text x="24" y="50" class="sub">파드만 지우고 볼륨은 보존</text>

  <text x="120" y="84" class="stage" text-anchor="middle">replicas: 3</text>
  <g>
    <rect x="40" y="98" width="72" height="32" rx="5" class="box"/>
    <text x="76" y="119" class="t" text-anchor="middle">quiz-0</text>
    <rect x="122" y="98" width="80" height="32" rx="5" class="box"/>
    <text x="162" y="119" class="d" text-anchor="middle">db-data-0</text>
    <rect x="40" y="140" width="72" height="32" rx="5" class="box"/>
    <text x="76" y="161" class="t" text-anchor="middle">quiz-1</text>
    <rect x="122" y="140" width="80" height="32" rx="5" class="box"/>
    <text x="162" y="161" class="d" text-anchor="middle">db-data-1</text>
    <rect x="40" y="182" width="72" height="32" rx="5" class="box"/>
    <text x="76" y="203" class="t" text-anchor="middle">quiz-2</text>
    <rect x="122" y="182" width="80" height="32" rx="5" class="box"/>
    <text x="162" y="203" class="d" text-anchor="middle">db-data-2</text>
  </g>

  <line x1="212" y1="156" x2="288" y2="156" stroke="#b8b3ad" stroke-width="1.6" marker-end="url(#spp-a)"/>
  <text x="250" y="146" class="n" text-anchor="middle">scale 1</text>

  <text x="400" y="84" class="stage" text-anchor="middle">replicas: 1</text>
  <g>
    <rect x="320" y="98" width="72" height="32" rx="5" class="box"/>
    <text x="356" y="119" class="t" text-anchor="middle">quiz-0</text>
    <rect x="402" y="98" width="80" height="32" rx="5" class="box"/>
    <text x="442" y="119" class="d" text-anchor="middle">db-data-0</text>

    <rect x="320" y="140" width="72" height="32" rx="5" fill="none"
          stroke="#b8b3ad" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="356" y="161" class="gone" text-anchor="middle">삭제</text>
    <rect x="402" y="140" width="80" height="32" rx="5" class="box"/>
    <text x="442" y="161" class="d" text-anchor="middle">db-data-1</text>

    <rect x="320" y="182" width="72" height="32" rx="5" fill="none"
          stroke="#b8b3ad" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="356" y="203" class="gone" text-anchor="middle">삭제</text>
    <rect x="402" y="182" width="80" height="32" rx="5" class="box"/>
    <text x="442" y="203" class="d" text-anchor="middle">db-data-2</text>
  </g>
  <text x="400" y="238" class="n" text-anchor="middle">PVC 는 그대로</text>

  <line x1="492" y1="156" x2="568" y2="156" stroke="#b8b3ad" stroke-width="1.6" marker-end="url(#spp-a)"/>
  <text x="530" y="146" class="n" text-anchor="middle">scale 3</text>

  <text x="680" y="84" class="stage" text-anchor="middle">replicas: 3</text>
  <g>
    <rect x="600" y="98" width="72" height="32" rx="5" class="box"/>
    <text x="636" y="119" class="t" text-anchor="middle">quiz-0</text>
    <rect x="682" y="98" width="80" height="32" rx="5" class="box"/>
    <text x="722" y="119" class="d" text-anchor="middle">db-data-0</text>
    <rect x="600" y="140" width="72" height="32" rx="5" class="box"/>
    <text x="636" y="161" class="t" text-anchor="middle">quiz-1</text>
    <rect x="682" y="140" width="80" height="32" rx="5" class="box"/>
    <text x="722" y="161" class="d" text-anchor="middle">db-data-1</text>
    <rect x="600" y="182" width="72" height="32" rx="5" class="box"/>
    <text x="636" y="203" class="t" text-anchor="middle">quiz-2</text>
    <rect x="682" y="182" width="80" height="32" rx="5" class="box"/>
    <text x="722" y="203" class="d" text-anchor="middle">db-data-2</text>
  </g>
  <text x="680" y="238" class="n" text-anchor="middle">같은 번호로 재부착</text>

  <rect x="240" y="268" width="400" height="46" rx="8" class="warn"/>
  <text x="440" y="288" class="t" text-anchor="middle">주의 · PVC 를 지우면</text>
  <text x="440" y="306" class="d" text-anchor="middle">PV recycle · 데이터 유실</text>
</svg>

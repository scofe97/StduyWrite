<svg viewBox="0 0 720 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Secret과 ConfigMap의 차이</title>
  <desc>같은 key-value 데이터를 담더라도 Secret은 data 필드에 Base64로 저장하고 필요한 노드에만 메모리로 배포하는 반면, ConfigMap은 data 필드에 평문으로 저장한다. 필드 구조·저장 형태·쿠버네티스 취급 방식이 세 축에서 다르다는 것을 나타낸다.</desc>

  <rect x="0" y="0" width="720" height="400" fill="#0d0d0d"/>

  <!-- 공통 입력: key-value 데이터 (연파랑 밝은 칩 → 어두운 글자) -->
  <rect x="270" y="30" width="180" height="52" rx="6" fill="#dceaf7" stroke="rgb(42,37,32)"/>
  <text x="360" y="52" fill="#10243a" font-size="12.5" font-weight="700" text-anchor="middle">같은 key-value 데이터</text>
  <text x="360" y="71" fill="#14304a" font-family="'JetBrains Mono',monospace" font-size="10.5" text-anchor="middle">pass: s3cr3t-p@ss</text>

  <!-- 왼쪽: Secret (골든앰버 테두리 강조) -->
  <rect x="40" y="120" width="290" height="230" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="2"/>
  <text x="60" y="148" fill="rgb(212,168,83)" font-size="15" font-weight="700">Secret (민감 데이터)</text>

  <rect x="60" y="164" width="250" height="52" rx="4" fill="#FFE082" stroke="rgb(42,37,32)"/>
  <text x="72" y="184" fill="#0d0d0d" font-size="11.5" font-weight="700">필드: data (Base64) · stringData</text>
  <text x="72" y="203" fill="#1a1a1a" font-family="'JetBrains Mono',monospace" font-size="10.5">czNjcjN0LXBAc3M=</text>

  <rect x="60" y="226" width="250" height="46" rx="4" fill="#FFE082" stroke="rgb(42,37,32)"/>
  <text x="72" y="245" fill="#0d0d0d" font-size="11.5" font-weight="700">type 필드 있음</text>
  <text x="72" y="263" fill="#1a1a1a" font-size="10.5">Opaque · tls · dockerconfigjson…</text>

  <rect x="60" y="282" width="250" height="52" rx="4" fill="#FFE082" stroke="rgb(42,37,32)"/>
  <text x="72" y="302" fill="#0d0d0d" font-size="11.5" font-weight="700">취급: 필요 노드에만 · 메모리 저장</text>
  <text x="72" y="321" fill="#1a1a1a" font-size="10.5">디스크에 안 씀 (노출 최소화)</text>

  <!-- 오른쪽: ConfigMap -->
  <rect x="390" y="120" width="290" height="230" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="410" y="148" fill="#e8e4df" font-size="15" font-weight="700">ConfigMap (일반 설정)</text>

  <rect x="410" y="164" width="250" height="52" rx="4" fill="#dceaf7" stroke="rgb(42,37,32)"/>
  <text x="422" y="184" fill="#10243a" font-size="11.5" font-weight="700">필드: data (평문) · binaryData</text>
  <text x="422" y="203" fill="#14304a" font-family="'JetBrains Mono',monospace" font-size="10.5">s3cr3t-p@ss</text>

  <rect x="410" y="226" width="250" height="46" rx="4" fill="#dceaf7" stroke="rgb(42,37,32)"/>
  <text x="422" y="245" fill="#10243a" font-size="11.5" font-weight="700">type 필드 없음</text>
  <text x="422" y="263" fill="#14304a" font-size="10.5">종류 구분 없이 단일 형태</text>

  <rect x="410" y="282" width="250" height="52" rx="4" fill="#dceaf7" stroke="rgb(42,37,32)"/>
  <text x="422" y="302" fill="#10243a" font-size="11.5" font-weight="700">취급: 일반 오브젝트처럼 저장</text>
  <text x="422" y="321" fill="#14304a" font-size="10.5">특별한 보호 없음</text>

  <!-- 화살표 -->
  <line x1="320" y1="82" x2="200" y2="118" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="400" y1="82" x2="520" y2="118" stroke="rgb(138,133,128)" stroke-width="2" marker-end="url(#a4)"/>
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <text x="40" y="378" fill="#e8e4df" font-size="11.5">기능은 수렴했지만 필드·type·취급 세 축이 남아 있다 — 민감 데이터는 Secret에만 담는다.</text>
</svg>

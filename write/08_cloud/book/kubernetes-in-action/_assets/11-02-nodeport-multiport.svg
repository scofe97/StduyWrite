<title id="dt">여섯 번호는 두 입구와 한 도착지다</title><desc id="dd">NodePort 는 포트 번호를 여섯 개 쓴다. 프로토콜마다 밖에서 들어오는 입구와 안에서 들어오는 입구가 따로 있고, 둘은 같은 파드 포트로 이어진다. 한 요청이 세 번호를 차례로 밟는 것이 아니다.</desc>
<rect width="1120" height="684" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 11-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">여섯 번호는 두 입구와 한 도착지다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">kiada Service · HTTP 와 HTTPS 각각</text>

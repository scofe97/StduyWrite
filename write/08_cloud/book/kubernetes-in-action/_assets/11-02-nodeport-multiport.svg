<svg viewBox="0 0 960 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>NodePort는 여섯 포트 번호를 세 단계로 매핑한다</title>
  <desc>HTTP는 노드 포트 30080에서 cluster IP 포트 80을 거쳐 파드 포트 8080으로, HTTPS는 노드 포트 30443에서 cluster IP 포트 443을 거쳐 파드 포트 8443으로 각각 세 단계로 이어진다. 외부 클라이언트는 노드 포트로, 내부 클라이언트는 cluster IP 포트로 접속하고 둘 다 파드 포트에서 만난다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .stage { font-size: 12px; font-weight: 800; fill: rgb(212,168,83); }
      .port  { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .role  { font-size: 11px; fill: #e8e4df; }
      .svc   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
    </style>
    <marker id="np-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(91,155,213)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="340" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">NodePort의 여섯 포트 — 세 단계로 이어집니다</text>
  <text x="24" y="50" class="sub">노드 포트 → Service cluster IP 포트 → 파드 targetPort. HTTP·HTTPS가 각각 세 칸을 갖습니다</text>

  <!-- column headers -->
  <text x="150" y="90" class="stage" text-anchor="middle">노드 포트 (nodePort)</text>
  <text x="150" y="106" class="role" text-anchor="middle">외부 클라이언트 접속</text>
  <text x="480" y="90" class="stage" text-anchor="middle">cluster IP 포트 (port)</text>
  <text x="480" y="106" class="role" text-anchor="middle">내부 클라이언트 접속</text>
  <text x="810" y="90" class="stage" text-anchor="middle">파드 포트 (targetPort)</text>
  <text x="810" y="106" class="role" text-anchor="middle">애플리케이션이 듣는 포트</text>

  <!-- HTTP row -->
  <text x="40" y="165" class="role">HTTP</text>
  <rect x="80" y="140" width="140" height="46" rx="8" fill="rgb(220,234,247)"/>
  <text x="150" y="169" class="port" text-anchor="middle">30080</text>
  <rect x="410" y="140" width="140" height="46" rx="8" fill="rgb(91,155,213)"/>
  <text x="480" y="169" class="port" text-anchor="middle" fill="#e8e4df">80</text>
  <rect x="740" y="140" width="140" height="46" rx="8" fill="rgb(102,187,106)"/>
  <text x="810" y="169" class="port" text-anchor="middle">8080</text>
  <line x1="220" y1="163" x2="408" y2="163" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#np-arrow)"/>
  <line x1="550" y1="163" x2="738" y2="163" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#np-arrow)"/>

  <!-- HTTPS row -->
  <text x="40" y="255" class="role">HTTPS</text>
  <rect x="80" y="230" width="140" height="46" rx="8" fill="rgb(220,234,247)"/>
  <text x="150" y="259" class="port" text-anchor="middle">30443</text>
  <rect x="410" y="230" width="140" height="46" rx="8" fill="rgb(91,155,213)"/>
  <text x="480" y="259" class="port" text-anchor="middle" fill="#e8e4df">443</text>
  <rect x="740" y="230" width="140" height="46" rx="8" fill="rgb(102,187,106)"/>
  <text x="810" y="259" class="port" text-anchor="middle">8443</text>
  <line x1="220" y1="253" x2="408" y2="253" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#np-arrow)"/>
  <line x1="550" y1="253" x2="738" y2="253" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#np-arrow)"/>

  <text x="480" y="315" class="sub" text-anchor="middle">nodePort를 비우면 쿠버네티스가 30000~32767 범위에서 자동 배정해 포트 충돌을 막습니다</text>
</svg>

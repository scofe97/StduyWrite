<text x="24" y="626" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">cluster IP 는 어느 인터페이스에도 붙지 않아 무언가를 경유시킬 실체가 없다. 화살표는 어느 주소로 들어오면 어디에 닿는지의 매핑이지, 한 요청이 밟는 순서가 아니다.</text>

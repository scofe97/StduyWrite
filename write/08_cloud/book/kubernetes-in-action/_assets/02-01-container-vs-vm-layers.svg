<svg viewBox="0 0 900 480" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>컨테이너와 VM의 아키텍처 층 비교</title>
  <desc>VM은 애플리케이션마다 별도의 게스트 커널·가상 하드웨어를 거쳐 물리 하드웨어에 닿고, 컨테이너는 애플리케이션이 공유 커널을 거쳐 바로 물리 하드웨어에 닿는다. 커널이 하나뿐이므로 컨테이너 쪽이 오버헤드가 적지만, 격리 경계도 커널 안쪽으로 좁혀진다.</desc>
  <defs>
    <style>
      .title  { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11.5px; fill: rgb(138,133,128); }
      .zlabel { font-size: 12px; font-weight: 700; fill: #e8e4df; }
      .nm     { font-size: 12.5px; font-weight: 700; fill: #000; font-family: 'JetBrains Mono', monospace; }
      .nm-dark{ font-size: 12.5px; font-weight: 700; fill: #e8e4df; font-family: 'JetBrains Mono', monospace; }
      .mt     { font-size: 10px; fill: rgb(138,133,128); }
      .note   { font-size: 10.5px; fill: #e8e4df; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="#0d0d0d"/>
  <text x="28" y="34" class="title">컨테이너와 VM의 아키텍처 층 비교</text>
  <text x="28" y="54" class="sub">같은 애플리케이션 3개를 VM 2개에 나눠 돌릴 때 vs 컨테이너 3개로 돌릴 때 — 커널이 몇 겹인지가 오버헤드를 가른다</text>

  <!-- 왼쪽: VM -->
  <text x="60" y="90" class="zlabel">VM으로 격리 — 게스트 커널마다 자원을 씀</text>

  <!-- VM1 -->
  <rect x="44" y="104" width="180" height="200" rx="10" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="60" y="128" class="mt">Virtual Machine 1</text>
  <rect x="60" y="140" width="148" height="34" rx="6" fill="rgba(212,168,83,0.15)" stroke="rgb(212,168,83)"/>
  <text x="134" y="162" class="nm-dark" text-anchor="middle">App A</text>
  <rect x="60" y="180" width="148" height="34" rx="6" fill="rgba(212,168,83,0.15)" stroke="rgb(212,168,83)"/>
  <text x="134" y="202" class="nm-dark" text-anchor="middle">App B</text>
  <rect x="60" y="220" width="148" height="46" rx="6" fill="rgb(102,187,106)"/>
  <text x="134" y="248" class="nm" text-anchor="middle">Guest OS (Kernel)</text>
  <rect x="60" y="272" width="148" height="26" rx="6" fill="none" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="134" y="289" class="mt" text-anchor="middle">Virtual Hardware</text>

  <!-- VM2 -->
  <rect x="236" y="104" width="180" height="200" rx="10" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="252" y="128" class="mt">Virtual Machine 2</text>
  <rect x="252" y="140" width="148" height="34" rx="6" fill="rgba(212,168,83,0.15)" stroke="rgb(212,168,83)"/>
  <text x="326" y="162" class="nm-dark" text-anchor="middle">App C</text>
  <rect x="252" y="180" width="148" height="34" rx="6" fill="none" stroke="rgb(138,133,128)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="326" y="202" class="mt" text-anchor="middle">(미사용)</text>
  <rect x="252" y="220" width="148" height="46" rx="6" fill="rgb(102,187,106)"/>
  <text x="326" y="248" class="nm" text-anchor="middle">Guest OS (Kernel)</text>
  <rect x="252" y="272" width="148" height="26" rx="6" fill="none" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="326" y="289" class="mt" text-anchor="middle">Virtual Hardware</text>

  <!-- Hypervisor -->
  <rect x="44" y="316" width="372" height="34" rx="6" fill="rgb(102,187,106)"/>
  <text x="230" y="338" class="nm" text-anchor="middle">Hypervisor</text>

  <!-- Physical HW (left) -->
  <rect x="44" y="360" width="372" height="34" rx="6" fill="#e8e4df"/>
  <text x="230" y="382" class="nm" text-anchor="middle">Physical Hardware</text>

  <text x="230" y="416" class="note" text-anchor="middle">게스트 커널 2개 + 하이퍼바이저가 자원을 나눠 씀</text>

  <!-- 구분선 -->
  <line x1="450" y1="80" x2="450" y2="426" stroke="rgb(42,37,32)" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- 오른쪽: 컨테이너 -->
  <text x="480" y="90" class="zlabel">컨테이너로 격리 — 커널 하나를 공유</text>

  <rect x="480" y="104" width="376" height="210" rx="10" fill="rgb(26,26,26)" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="496" y="128" class="mt">Container A · B · C (같은 호스트)</text>

  <rect x="496" y="140" width="112" height="34" rx="6" fill="rgba(212,168,83,0.15)" stroke="rgb(212,168,83)"/>
  <text x="552" y="162" class="nm-dark" text-anchor="middle">App A</text>
  <rect x="618" y="140" width="112" height="34" rx="6" fill="rgba(212,168,83,0.15)" stroke="rgb(212,168,83)"/>
  <text x="674" y="162" class="nm-dark" text-anchor="middle">App B</text>
  <rect x="740" y="140" width="112" height="34" rx="6" fill="rgba(212,168,83,0.15)" stroke="rgb(212,168,83)"/>
  <text x="796" y="162" class="nm-dark" text-anchor="middle">App C</text>

  <rect x="496" y="184" width="356" height="86" rx="6" fill="none" stroke="rgb(138,133,128)" stroke-width="1.2"/>
  <text x="674" y="210" class="note" text-anchor="middle">Unused CPU and memory</text>
  <text x="674" y="230" class="mt" text-anchor="middle">게스트 OS가 없어 컨테이너를 더 띄울 여유가 남는다</text>
  <text x="674" y="250" class="mt" text-anchor="middle">(추가 App D·E ...를 위한 여백)</text>

  <rect x="496" y="280" width="356" height="26" rx="6" fill="rgb(102,187,106)"/>
  <text x="600" y="297" class="nm" text-anchor="middle">Host OS Kernel</text>
  <text x="740" y="297" fill="#000" font-size="11" font-weight="700" text-anchor="middle">(공유, 격리 적용)</text>

  <!-- Physical HW (right) -->
  <rect x="480" y="360" width="376" height="34" rx="6" fill="#e8e4df"/>
  <text x="668" y="382" class="nm" text-anchor="middle">Physical Hardware</text>

  <text x="668" y="416" class="note" text-anchor="middle">커널 1개만 자원을 소모 — 그만큼 애플리케이션에 더 내줄 수 있다</text>

  <text x="450" y="456" class="sub" text-anchor="middle">같은 물리 하드웨어에서, 왼쪽은 커널 3개(호스트+게스트 2개) 오른쪽은 커널 1개가 자원을 나눈다</text>
</svg>

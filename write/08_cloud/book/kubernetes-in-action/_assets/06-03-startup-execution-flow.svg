<title id="dt">컨테이너 실행 — startup probe 성공 뒤 liveness 감시</title><desc id="dd">이미지 pull 후 컨테이너가 시작되며 PostStart hook 이 병렬로 돈다. startup probe 가 있으면 성공까지 liveness 를 유예하고, failureThreshold 도달 시 restartPolicy 에 따라 재시작하거나 Terminated 로 남는다.</desc>
<rect width="1000" height="816" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 06-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">컨테이너 실행 — startup probe 성공 뒤 liveness 감시</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">init 컨테이너 완료 뒤 일반 컨테이너마다 진행 · 선언 순서가 시작 순서를 보장하지 않음</text>
<rect x="24" y="104" width="952" height="652" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">컨테이너별 시작·감시·재시작 분기 (Always/OnFailure → 재시작 · Never → Terminated)</text>
<rect x="350" y="146" width="220" height="44" rx="22" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="460" y="173" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">이미지 pull</text>
<path d="M 460 194 L 460 214" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="290" y="220" width="340" height="56" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="460" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">컨테이너 시작 · PostStart 병렬</text>
<text x="460" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">kubelet 은 hook 종료까지 시작 관리 대기</text>
<path d="M 460 280 L 460 296" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 460 302 L 580 340 L 460 378 L 340 340 Z" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="460" y="345" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">startup probe 정의?</text>
<path d="M 584 340 L 640 340" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="599.5" y="330" width="25.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="612" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">예</text>
<rect x="646" y="312" width="260" height="56" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="776" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">startup probe 대기</text>
<text x="776" y="354" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">성공까지 liveness 실행 유예</text>
<path d="M 776 372 L 776 424 L 470 424" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 460 382 L 460 414" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="372.5" y="386" width="47.0" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="396" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">아니오</text>
<circle cx="460" cy="424" r="5" fill="#F5F5F3"/>
<path d="M 460 430 L 460 458" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="310" y="464" width="300" height="56" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="460" y="484" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">liveness probe 주기적 감시</text>
<text x="460" y="506" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">성공 유지 시 컨테이너 실행 지속</text>
<path d="M 614 480 L 662 480 L 662 504 L 620 504" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="672" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">성공 유지</text>
<path d="M 460 524 L 460 556" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)"/>
<text x="472" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">failureThreshold 도달</text>
<rect x="330" y="562" width="260" height="52" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="460" y="580" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">컨테이너 종료</text>
<text x="460" y="602" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재시작 정책 판정으로 이동</text>
<path d="M 460 618 L 460 636" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 460 642 L 580 680 L 460 718 L 340 680 Z" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="460" y="685" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">restartPolicy 허용?</text>
<path d="M 336 680 L 112 680 L 112 168 L 342 168" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)" stroke-dasharray="6 5"/>
<rect x="155.62" y="670" width="136.76" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="224" y="684" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">Always · OnFailure</text>
<path d="M 584 680 L 684 680" fill="none" stroke="#E3B341" stroke-width="1.5" marker-end="url(#warn)"/>
<rect x="609.95" y="670" width="48.1" height="20" rx="4" fill="#0D1117" stroke="#E3B341" stroke-width="0.8"/>
<text x="634" y="684" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">Never</text>
<rect x="690" y="658" width="220" height="44" rx="22" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="800" y="685" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">Terminated 유지</text>
<text x="36" y="738" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">예외: restartPolicy 가 Never 일 때 PostStart 실패 시 Pod 상태는 Completed 표시</text>
<line x1="12" y1="772" x2="952" y2="772" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="794" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="784" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="794" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">시작 · 재시작</text>
<rect x="248" y="784" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="270" y="794" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">startup 관문</text>
<rect x="422" y="784" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="444" y="794" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">정상 감시</text>
<rect x="531" y="784" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="553" y="794" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실패 종료</text>
<rect x="640" y="784" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="662" y="794" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">재시작 안 함</text>

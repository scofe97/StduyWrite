<svg viewBox="0 0 1000 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>로드밸런서는 노드를 고르고, 트래픽 정책은 파드를 고릅니다</title>
  <desc>외부 요청이 파드에 닿기까지 결정이 두 번 내려진다. 첫째 결정은 로드밸런서가 어느 노드로 보낼지 고르는 것이고, 여기서 죽은 노드가 제외된다. 둘째 결정은 요청이 도착한 노드의 커널이 어느 파드로 넘길지 고르는 것이며, 이때 externalTrafficPolicy가 후보 범위를 정한다. Cluster는 클러스터 전체 파드를 후보로 삼아 남의 노드 파드로도 넘기고, Local은 자기 노드 위 파드만 후보로 삼는다. 그래서 다른 노드로 넘길 수 있는지는 Service 타입이 NodePort냐 LoadBalancer냐가 아니라 정책이 결정한다.</desc>
  <defs>
    <style>
      .h1   { font-size: 25px; font-weight: 800; fill: #e8e4df; }
      .sub  { font-size: 15px; fill: rgb(168,163,158); }
      .step { font-size: 15px; font-weight: 800; fill: rgb(212,168,83); }
      .body { font-size: 14px; fill: #e8e4df; }
      .who  { font-size: 12.5px; fill: rgb(168,163,158); }
      .nd   { font-size: 13px; font-weight: 800; fill: rgb(168,163,158); }
      .mono { font-size: 13px; font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
    <marker id="lb-gold" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="lb-blue" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="rgb(91,155,213)"/></marker>
    <marker id="lb-grey" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="rgb(120,116,112)"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#0d0d0d"/>

  <text x="34" y="44" class="h1">결정은 두 번 내려집니다 — 노드를 고르고, 그다음 파드를 고릅니다</text>
  <text x="34" y="70" class="sub">두 결정의 주체가 달라서, 하나를 다른 하나로 설명하면 어긋납니다.</text>

  <!-- 1단: LB가 노드를 고른다 -->
  <rect x="34" y="96" width="932" height="150" rx="14" fill="rgb(22,22,22)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="58" y="126" class="step">1단 · 로드밸런서가 노드를 고릅니다</text>
  <text x="380" y="126" class="who">고르는 기준은 헬스체크와 균등 분배입니다. 파드는 보지 않습니다.</text>

  <rect x="58" y="150" width="96" height="46" rx="8" fill="rgb(212,168,83)"/>
  <text x="106" y="179" class="body" text-anchor="middle" style="fill:#0d0d0d" font-weight="800">LB</text>

  <line x1="154" y1="163" x2="266" y2="152" stroke="rgb(212,168,83)" stroke-width="2.6" marker-end="url(#lb-gold)"/>
  <line x1="154" y1="173" x2="266" y2="196" stroke="rgb(212,168,83)" stroke-width="2.6" marker-end="url(#lb-gold)"/>
  <line x1="154" y1="183" x2="266" y2="240" stroke="rgb(120,116,112)" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#lb-grey)"/>

  <rect x="272" y="134" width="150" height="36" rx="7" fill="rgb(26,26,26)" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <text x="347" y="158" class="mono" text-anchor="middle" style="fill:#e8e4df">Node A</text>
  <rect x="272" y="178" width="150" height="36" rx="7" fill="rgb(26,26,26)" stroke="rgb(212,168,83)" stroke-width="1.8"/>
  <text x="347" y="202" class="mono" text-anchor="middle" style="fill:#e8e4df">Node B</text>
  <rect x="272" y="222" width="150" height="36" rx="7" fill="rgb(26,26,26)" stroke="rgb(120,116,112)" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="347" y="246" class="mono" text-anchor="middle" style="fill:rgb(168,163,158)">Node C</text>

  <text x="440" y="158" class="who">헬스체크 통과 → 분배 대상</text>
  <text x="440" y="202" class="who">헬스체크 통과 → 분배 대상</text>
  <text x="440" y="246" class="who">응답이 없으면 분배에서 제외</text>

  <!-- 2단: 정책이 파드를 고른다 -->
  <rect x="34" y="262" width="932" height="212" rx="14" fill="rgb(22,22,22)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="58" y="292" class="step">2단 · 도착한 노드의 커널이 파드를 고릅니다</text>
  <text x="440" y="292" class="who">후보 범위를 정하는 것이 externalTrafficPolicy입니다.</text>

  <!-- Cluster 후보 -->
  <rect x="58" y="312" width="430" height="142" rx="11" fill="rgb(26,26,26)" stroke="rgb(91,155,213)" stroke-width="1.8"/>
  <text x="82" y="338" class="body" font-weight="800" style="fill:rgb(91,155,213)">Cluster — 후보는 클러스터 전체 파드</text>
  <rect x="82" y="352" width="176" height="76" rx="8" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.2"/>
  <text x="94" y="370" class="nd">도착한 노드</text>
  <rect x="96" y="380" width="70" height="34" rx="6" fill="rgb(91,155,213)"/>
  <text x="131" y="402" class="mono" text-anchor="middle" style="fill:#0d0d0d" font-weight="700">Pod</text>
  <rect x="286" y="352" width="176" height="76" rx="8" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.2"/>
  <text x="298" y="370" class="nd">다른 노드</text>
  <rect x="300" y="380" width="70" height="34" rx="6" fill="rgb(91,155,213)"/>
  <text x="335" y="402" class="mono" text-anchor="middle" style="fill:#0d0d0d" font-weight="700">Pod</text>
  <line x1="180" y1="397" x2="296" y2="397" stroke="rgb(91,155,213)" stroke-width="2.6" marker-end="url(#lb-blue)"/>
  <text x="238" y="446" class="who" text-anchor="middle" style="fill:rgb(91,155,213)">노드 경계를 넘습니다</text>

  <!-- Local 후보 -->
  <rect x="512" y="312" width="430" height="142" rx="11" fill="rgb(26,26,26)" stroke="#66bb6a" stroke-width="1.8"/>
  <text x="536" y="338" class="body" font-weight="800" style="fill:rgb(102,187,106)">Local — 후보는 자기 노드 위 파드만</text>
  <rect x="536" y="352" width="176" height="76" rx="8" fill="rgb(24,28,32)" stroke="rgb(102,187,106)" stroke-width="1.2"/>
  <text x="548" y="370" class="nd">도착한 노드</text>
  <rect x="550" y="380" width="70" height="34" rx="6" fill="rgb(91,155,213)"/>
  <text x="585" y="402" class="mono" text-anchor="middle" style="fill:#0d0d0d" font-weight="700">Pod</text>
  <rect x="740" y="352" width="176" height="76" rx="8" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="752" y="370" class="nd">다른 노드</text>
  <rect x="754" y="380" width="70" height="34" rx="6" fill="rgb(60,64,68)"/>
  <text x="789" y="402" class="mono" text-anchor="middle" style="fill:rgb(168,163,158)">Pod</text>
  <line x1="628" y1="397" x2="736" y2="397" stroke="rgb(120,116,112)" stroke-width="2.2" stroke-dasharray="5 4"/>
  <line x1="666" y1="384" x2="690" y2="410" stroke="rgb(240,150,190)" stroke-width="3"/>
  <line x1="690" y1="384" x2="666" y2="410" stroke="rgb(240,150,190)" stroke-width="3"/>
  <text x="726" y="446" class="who" text-anchor="middle" style="fill:rgb(102,187,106)">노드 경계에서 멈춥니다</text>

  <!-- 하단 못박기 -->
  <rect x="34" y="490" width="932" height="48" rx="12" fill="rgba(212,168,83,0.08)" stroke="rgb(42,37,32)"/>
  <text x="58" y="512" class="body" font-weight="700">다른 노드로 넘길 수 있는지는 정책이 정합니다 — 타입이 아닙니다.</text>
  <text x="58" y="530" class="who">Cluster이면 NodePort도 남의 노드 파드로 넘기고, Local이면 LoadBalancer도 넘기지 못합니다. 로드밸런서가 있고 없고는 1단의 노드 선택에만 관여합니다.</text>
</svg>

<svg viewBox="0 0 960 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Ingress·IngressClass·컨트롤러의 관계</title>
  <desc>각 Ingress는 이름으로 IngressClass를 지정하고, IngressClass는 어느 컨트롤러가 처리할지 지정한다. 여러 Ingress가 같은 IngressClass를, 여러 IngressClass가 같은 컨트롤러를 서로 다른 파라미터로 쓸 수 있다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .ing   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .cls   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .ctl   { font-size: 12px; font-weight: 800; fill: #0d0d0d; }
      .note  { font-size: 10.5px; fill: #e8e4df; }
    </style>
    <marker id="ic-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="340" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Ingress → IngressClass → 컨트롤러</text>
  <text x="24" y="50" class="sub">Ingress는 이름으로 클래스를 지정하고, 클래스는 어느 컨트롤러가 처리할지 지정합니다</text>

  <!-- ===== Nginx row ===== -->
  <rect x="40" y="90" width="130" height="42" rx="6" fill="rgb(91,155,213)"/>
  <text x="105" y="116" class="ing" text-anchor="middle">Ingress</text>
  <rect x="40" y="145" width="130" height="42" rx="6" fill="rgb(91,155,213)"/>
  <text x="105" y="171" class="ing" text-anchor="middle">Ingress</text>
  <rect x="250" y="118" width="160" height="46" rx="6" fill="rgb(91,155,213)"/>
  <text x="330" y="146" class="cls" text-anchor="middle">nginx IngressClass</text>
  <rect x="490" y="118" width="180" height="46" rx="6" fill="rgb(91,155,213)"/>
  <text x="580" y="146" class="ctl" text-anchor="middle">Nginx 컨트롤러</text>
  <line x1="170" y1="111" x2="248" y2="138" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ic-a)"/>
  <line x1="170" y1="166" x2="248" y2="145" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ic-a)"/>
  <line x1="410" y1="141" x2="488" y2="141" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#ic-a)"/>
  <text x="105" y="82" class="note" text-anchor="middle">클래스를 이름으로 지정</text>

  <!-- ===== Ambassador row ===== -->
  <rect x="40" y="230" width="130" height="42" rx="6" fill="rgb(230,150,90)"/>
  <text x="105" y="256" class="ing" text-anchor="middle">Ingress</text>
  <rect x="40" y="285" width="130" height="42" rx="6" fill="rgb(230,180,140)"/>
  <text x="105" y="311" class="ing" text-anchor="middle">Ingress</text>
  <rect x="250" y="228" width="180" height="42" rx="6" fill="rgb(230,150,90)"/>
  <text x="340" y="254" class="cls" text-anchor="middle">ambassador class</text>
  <rect x="250" y="285" width="180" height="42" rx="6" fill="rgb(230,180,140)"/>
  <text x="340" y="311" class="cls" text-anchor="middle">my-custom class</text>
  <rect x="490" y="256" width="180" height="46" rx="6" fill="rgb(230,150,90)"/>
  <text x="580" y="284" class="ctl" text-anchor="middle">Ambassador 컨트롤러</text>
  <line x1="170" y1="251" x2="248" y2="249" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ic-a)"/>
  <line x1="170" y1="306" x2="248" y2="306" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ic-a)"/>
  <line x1="430" y1="249" x2="488" y2="272" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ic-a)"/>
  <line x1="430" y1="306" x2="488" y2="288" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ic-a)"/>

  <text x="740" y="200" class="note" text-anchor="middle">여러 IngressClass가 같은 컨트롤러를</text>
  <text x="740" y="216" class="note" text-anchor="middle">서로 다른 파라미터로 쓸 수 있습니다</text>
  <text x="740" y="90" class="note" text-anchor="middle">컨트롤러를 여럿 설치할 수 있고,</text>
  <text x="740" y="106" class="note" text-anchor="middle">IngressClass가 어느 것이 처리할지 정합니다</text>
</svg>

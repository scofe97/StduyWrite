<svg viewBox="0 0 900 460" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>배포된 애플리케이션의 논리 뷰 — Deployment · Pod · Service</title>
  <desc>Deployment는 원하는 이미지·복제본 수를 선언하고 그만큼의 Pod 오브젝트를 만든다. 각 Pod는 휘발성이라 언제든 사라지고 새 IP로 교체될 수 있다. Service는 정적 IP를 갖는 단일 진입점으로, Pod 집합이 바뀌어도 클라이언트 연결을 항상 건강한 Pod로 라우팅한다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .zlabel { font-size: 12.5px; font-weight: 700; fill: #e8e4df; }
      .nm     { font-size: 12px; font-weight: 700; fill: #000; font-family: 'JetBrains Mono', monospace; }
      .nm-lt  { font-size: 12px; font-weight: 700; fill: #e8e4df; font-family: 'JetBrains Mono', monospace; }
      .mt     { font-size: 10px; fill: rgb(138,133,128); }
      .note   { font-size: 10.5px; fill: #e8e4df; }
      .fail   { font-size: 10px; fill: #f44336; font-weight: 700; }
    </style>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">배포된 애플리케이션의 논리 뷰</text>
  <text x="24" y="48" class="sub">클러스터 규모와 무관하게 항상 같은 세 오브젝트 — Deployment가 선언하고, Pod가 실행되고, Service가 진입점을 고정한다</text>

  <!-- Deployment -->
  <rect x="60" y="76" width="230" height="86" rx="10" fill="rgba(212,168,83,0.15)" stroke="rgb(212,168,83)" stroke-width="2"/>
  <text x="175" y="100" class="nm-lt" text-anchor="middle">Deployment: kiada</text>
  <text x="175" y="120" class="mt" text-anchor="middle">이미지 + 원하는 복제본 수 선언</text>
  <text x="175" y="138" class="mt" text-anchor="middle">지정된 수의 Pod 오브젝트만 생성</text>
  <text x="175" y="154" class="mt" text-anchor="middle">— 그 외엔 관여하지 않는다</text>

  <!-- Pods -->
  <rect x="360" y="76" width="150" height="60" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="435" y="100" class="nm-lt" text-anchor="middle">Pod A</text>
  <text x="435" y="118" class="mt" text-anchor="middle">고유 IP</text>

  <rect x="360" y="150" width="150" height="60" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="435" y="174" class="nm-lt" text-anchor="middle">Pod B</text>
  <text x="435" y="192" class="mt" text-anchor="middle">고유 IP</text>

  <rect x="360" y="224" width="150" height="60" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="435" y="248" class="nm-lt" text-anchor="middle">Pod C</text>
  <text x="435" y="266" class="mt" text-anchor="middle">고유 IP</text>

  <!-- Deployment -> Pods arrows -->
  <path d="M290,105 C325,105 325,106 358,106" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M290,119 C330,119 330,180 358,180" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M290,133 C335,133 335,254 358,254" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Pod A dies, replaced -->
  <rect x="360" y="150" width="150" height="60" rx="8" fill="rgba(244,67,54,0.08)" stroke="#f44336" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="590" y="180" class="fail">Pod B 소멸 → 새 Pod(다른 IP)로 즉시 교체</text>

  <!-- Service -->
  <rect x="60" y="230" width="230" height="120" rx="10" fill="rgba(102,187,106,0.12)" stroke="#66bb6a" stroke-width="2"/>
  <text x="175" y="256" class="nm-lt" text-anchor="middle">Service: kiada</text>
  <text x="175" y="278" class="mt" text-anchor="middle">단일 진입점 — 생성 시 정적 IP</text>
  <text x="175" y="296" class="mt" text-anchor="middle">Service 생애 동안 IP 불변</text>
  <text x="175" y="314" class="mt" text-anchor="middle">Pod 집합이 바뀌어도</text>
  <text x="175" y="330" class="mt" text-anchor="middle">항상 건강한 Pod로 라우팅</text>

  <!-- Service -> Pods arrows -->
  <path d="M290,290 C325,290 325,106 358,106" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M290,290 C325,290 325,180 358,180" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M290,290 C325,290 325,254 358,254" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Bottom callouts -->
  <rect x="60" y="374" width="780" height="70" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1.2"/>
  <text x="80" y="396" class="note">Pod는 <tspan fill="#f44336" font-weight="700">휘발성</tspan>입니다 — 노드 실패·삭제·축출로 언제든 사라지고, 교체된 새 Pod는 완전히 다른 IP를 갖습니다.</text>
  <text x="80" y="418" class="note">그래서 클라이언트는 Pod IP가 아니라 <tspan fill="#66bb6a" font-weight="700">Service IP</tspan>에 연결해야 하고, Deployment는 Pod를 직접 만들지 않고 이 교체·복제 책임을 대신 집니다.</text>
  <text x="80" y="438" class="mt">— 03-02 §5 "왜 Service가 필수인가"</text>
</svg>

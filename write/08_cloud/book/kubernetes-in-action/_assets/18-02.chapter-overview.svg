<svg viewBox="0 0 820 500" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>18-02 전체 지도 — 파드 하나를 넘어설 때 정하는 것</title>
  <desc>Job이 파드 하나로 끝나지 않을 때 정해야 하는 세 축을 증상별 줄기로 갈라 놓은 그림입니다. 몇 번 몇 개를 돌릴지는 completions와 parallelism이, 실패를 어디서 다룰지는 restartPolicy와 backoffLimit이, 파드를 구분할지는 완료 모드가 정합니다. 줄기 사이에 화살표가 없어 서로 독립이며, 첫 축에는 두 값 중 작은 쪽이 상한이라는 주의 표시가, 둘째 축에는 한계를 넘으면 Job 전체가 실패한다는 위험 표시가 붙어 있습니다.</desc>
  <rect width="820" height="500" fill="#0d0d0d"/>

  <text x="40" y="40" fill="#e8e4df" font-size="15" font-weight="700">파드 하나를 넘어설 때</text>

  <line x1="40" y1="62" x2="40" y2="404" stroke="#b8b3ad" stroke-width="2"/>

  <rect x="60" y="62" width="720" height="80" rx="4" fill="#e8e4df"/>
  <text x="80" y="88" fill="#0d0d0d" font-size="14" font-weight="700">몇 번 · 몇 개</text>
  <text x="740" y="88" text-anchor="end" fill="#3a3632" font-size="11">§1</text>
  <text x="80" y="112" fill="#3a3632" font-size="12">completions — 성공 목표</text>
  <text x="330" y="112" fill="#3a3632" font-size="12">parallelism — 동시 실행</text>
  <rect x="530" y="98" width="200" height="22" rx="3" fill="rgb(212,168,83)"/>
  <text x="542" y="113" fill="#0d0d0d" font-size="11.5" font-weight="700">주의 · 작은 쪽이 상한</text>
  <text x="80" y="131" fill="#3a3632" font-size="12">0이면 멈춘 상태</text>

  <rect x="60" y="156" width="720" height="98" rx="4" fill="#e8e4df"/>
  <text x="80" y="182" fill="#0d0d0d" font-size="14" font-weight="700">실패를 어디서 다루나</text>
  <text x="740" y="182" text-anchor="end" fill="#3a3632" font-size="11">§2·§3</text>
  <text x="80" y="206" fill="#3a3632" font-size="12">OnFailure — 같은 파드</text>
  <text x="330" y="206" fill="#3a3632" font-size="12">Never — 새 파드</text>
  <text x="80" y="225" fill="#3a3632" font-size="12">backoffLimit 기본 6</text>
  <text x="330" y="225" fill="#3a3632" font-size="12">activeDeadline</text>
  <text x="422" y="225" fill="#3a3632" font-size="12">Job 전체</text>
  <rect x="530" y="212" width="200" height="22" rx="3" fill="#f2d4d4"/>
  <text x="542" y="227" fill="#7a1f1f" font-size="11.5" font-weight="700">위험 · 넘으면 Job 실패</text>

  <rect x="60" y="268" width="720" height="98" rx="4" fill="#e8e4df"/>
  <text x="80" y="294" fill="#0d0d0d" font-size="14" font-weight="700">파드를 구분할까</text>
  <text x="740" y="294" text-anchor="end" fill="#3a3632" font-size="11">§4</text>
  <text x="80" y="318" fill="#3a3632" font-size="12">NonIndexed — 다 같다</text>
  <text x="330" y="318" fill="#3a3632" font-size="12">Indexed — 번호를 준다</text>
  <text x="80" y="337" fill="#3a3632" font-size="12">JOB_COMPLETION_INDEX</text>
  <text x="330" y="337" fill="#3a3632" font-size="12">hostname · label</text>
  <text x="443" y="337" fill="#3a3632" font-size="12">어노테이션</text>
  <text x="80" y="356" fill="#3a3632" font-size="12">같은 인덱스가 둘 뜰 수 있다</text>

  <rect x="40" y="390" width="740" height="76" rx="4" fill="#e8e4df"/>
  <text x="60" y="416" fill="#0d0d0d" font-size="14" font-weight="700">조율을 어디에 두나</text>
  <text x="740" y="416" text-anchor="end" fill="#3a3632" font-size="11">§5</text>
  <text x="60" y="440" fill="#3a3632" font-size="12">앱 내부 — 한곳에서 추적</text>
  <text x="330" y="440" fill="#3a3632" font-size="12">Indexed Job — 실패 격리</text>
  <text x="60" y="459" fill="#3a3632" font-size="12">공유 상태가 있으면 앱 내부</text>
</svg>

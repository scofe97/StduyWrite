<svg viewBox="0 0 820 500" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>15-01 전체 지도 — 간접 구조가 무엇을 가능하게 하는가</title>
  <desc>Deployment가 파드를 직접 관리하지 않고 ReplicaSet을 통해 관리한다는 간접 구조에서 출발해, 그 구조를 만들고 조회하고 pod-template-hash로 확인한 뒤 스케일과 삭제가 각각 어느 계층에서 일어나는지를 세로로 이은 그림입니다. 4단계에는 해시가 label에도 더해져 이전 파드와 섞이지 않게 한다는 열쇠 표시가, 6단계에는 cascade orphan이 한 단계만 끊는다는 주의 표시가 붙어 있습니다.</desc>
  <rect width="820" height="500" fill="#0d0d0d"/>

  <text x="40" y="40" fill="#e8e4df" font-size="15" font-weight="700">간접 구조가 무엇을 가능하게 하는가</text>

  <rect x="40" y="62" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="88" fill="#0d0d0d" font-size="14" font-weight="700">1. 한 단계를 사이에 둔다</text>
  <text x="740" y="88" text-anchor="end" fill="#3a3632" font-size="11">§1</text>
  <text x="60" y="112" fill="#3a3632" font-size="12">Deployment → ReplicaSet → Pod</text>
  <text x="320" y="112" fill="#3a3632" font-size="12">파드를 직접 만들지 않습니다</text>

  <path d="M410 128 L410 150" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="154" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="180" fill="#0d0d0d" font-size="14" font-weight="700">2·3. 만들고 확인한다</text>
  <text x="740" y="180" text-anchor="end" fill="#3a3632" font-size="11">§2 · §3</text>
  <text x="60" y="204" fill="#3a3632" font-size="12">spec 은 ReplicaSet + strategy</text>
  <text x="320" y="204" fill="#3a3632" font-size="12">READY · UP-TO-DATE · AVAILABLE</text>

  <path d="M410 220 L410 242" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="246" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="272" fill="#0d0d0d" font-size="14" font-weight="700">4. 해시가 세대를 가른다</text>
  <text x="740" y="272" text-anchor="end" fill="#3a3632" font-size="11">§4</text>
  <text x="60" y="296" fill="#3a3632" font-size="12">pod-template-hash</text>
  <text x="220" y="296" fill="#3a3632" font-size="12">이름과 label 양쪽에</text>
  <rect x="420" y="282" width="300" height="22" rx="3" fill="rgb(212,168,83)"/>
  <text x="432" y="297" fill="#0d0d0d" font-size="11.5" font-weight="700">열쇠 · 세대가 달라야 섞이지 않습니다</text>

  <path d="M410 326 L410 348" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="352" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="378" fill="#0d0d0d" font-size="14" font-weight="700">5·6. 스케일과 삭제도 계층을 탄다</text>
  <text x="740" y="378" text-anchor="end" fill="#3a3632" font-size="11">§5 · §6</text>
  <text x="60" y="402" fill="#3a3632" font-size="12">숫자만 아래로 넘깁니다</text>
  <rect x="300" y="388" width="420" height="22" rx="3" fill="#f2d4d4"/>
  <text x="312" y="403" fill="#7a1f1f" font-size="11.5" font-weight="700">주의 · cascade=orphan 은 바로 아래 한 단계만 끊습니다</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8b3ad"/>
    </marker>
  </defs>
</svg>

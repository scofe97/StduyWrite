<svg viewBox="0 0 960 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>네이티브 사이드카가 있는 Pod의 시작·종료 순서는 서로 역순</title>
  <desc>네이티브 사이드카(initContainers + restartPolicy Always)가 있는 Pod는 시작할 때 사이드카가 먼저 뜨고 주 컨테이너들이 병렬로 뜬다. 종료할 때는 반대로 주 컨테이너들이 먼저 종료되고 사이드카가 맨 나중에 종료된다. 주 컨테이너끼리는 시작도 종료도 병렬이지만, 사이드카는 시작 맨 앞·종료 맨 뒤로 순서가 강제되어 시작과 종료가 서로 역순이다. 실측 예: 사이드카 시작 05:22:17, 주 컨테이너 19~20초, 종료는 주 컨테이너 46~47초 뒤 사이드카 48초.</desc>
  <defs>
    <style>
      .title { font-size: 16px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 10.5px; fill: rgb(138,133,128); }
      .lane  { font-size: 12px; font-weight: 800; }
      .cbox  { font-size: 11.5px; font-weight: 800; }
      .csub  { font-size: 9px; }
      .tick  { font-size: 9px; fill: rgb(150,145,140); }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .keynote { font-size: 10px; }
    </style>
    <marker id="fwd" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="rgb(212,168,83)"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">시작과 종료는 역순 — 사이드카는 맨 먼저 뜨고 맨 나중에 죽는다</text>
  <text x="24" y="54" class="sub">주 컨테이너끼리는 병렬(순서 없음). 네이티브 사이드카만 시작 맨 앞·종료 맨 뒤로 강제된다.</text>

  <!-- ===== 상단 레인: 시작 순서 ===== -->
  <text x="30" y="98" class="lane" style="fill:#66bb6a">▶ 시작 (왼→오)</text>
  <!-- 시간 축 -->
  <line x1="150" y1="128" x2="900" y2="128" stroke="rgb(70,68,64)" stroke-width="1.5"/>
  <path d="M888,128 L900,128" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#fwd)"/>
  <text x="905" y="131" class="tick">시간</text>

  <!-- 사이드카 먼저 -->
  <rect x="160" y="108" width="150" height="40" rx="9" fill="#5b9bd5"/>
  <text x="235" y="127" class="cbox" text-anchor="middle" style="fill:#e8e4df">sidecar</text>
  <text x="235" y="141" class="csub mono" text-anchor="middle" style="fill:#0d2038">17초 · 맨 먼저</text>
  <!-- main-a, main-b 병렬 (세로로 겹쳐 배치 = 동시) -->
  <rect x="420" y="90" width="150" height="34" rx="9" fill="#66bb6a"/>
  <text x="495" y="106" class="cbox" text-anchor="middle" style="fill:#0d0d0d">main-a</text>
  <text x="495" y="118" class="csub mono" text-anchor="middle" style="fill:#14330f">19초</text>
  <rect x="420" y="132" width="150" height="34" rx="9" fill="#66bb6a"/>
  <text x="495" y="148" class="cbox" text-anchor="middle" style="fill:#0d0d0d">main-b</text>
  <text x="495" y="160" class="csub mono" text-anchor="middle" style="fill:#14330f">20초</text>
  <!-- 병렬 표시 브레이스 -->
  <text x="600" y="132" class="tick" style="fill:#66bb6a">← 주 컨테이너 병렬</text>
  <!-- 사이드카→main 화살표 -->
  <path d="M312,128 L416,128" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#fwd)"/>

  <!-- 구분선 -->
  <line x1="30" y1="205" x2="930" y2="205" stroke="rgb(50,48,45)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== 하단 레인: 종료 순서 ===== -->
  <text x="30" y="245" class="lane" style="fill:rgb(224,110,100)">■ 종료 (왼→오)</text>
  <line x1="150" y1="278" x2="900" y2="278" stroke="rgb(70,68,64)" stroke-width="1.5"/>
  <path d="M888,278 L900,278" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#fwd)"/>
  <text x="905" y="281" class="tick">시간</text>

  <!-- main-a, main-b 먼저 종료 (병렬) -->
  <rect x="200" y="240" width="150" height="34" rx="9" fill="rgb(224,140,120)"/>
  <text x="275" y="256" class="cbox" text-anchor="middle" style="fill:#0d0d0d">main-b</text>
  <text x="275" y="268" class="csub mono" text-anchor="middle" style="fill:#3a1410">46초</text>
  <rect x="200" y="282" width="150" height="34" rx="9" fill="rgb(224,140,120)"/>
  <text x="275" y="298" class="cbox" text-anchor="middle" style="fill:#0d0d0d">main-a</text>
  <text x="275" y="310" class="csub mono" text-anchor="middle" style="fill:#3a1410">47초 (pre-stop 뒤)</text>
  <text x="378" y="282" class="tick" style="fill:rgb(224,140,120)">← 주 컨테이너 병렬</text>

  <!-- 사이드카 맨 나중 종료 -->
  <rect x="700" y="258" width="150" height="40" rx="9" fill="#5b9bd5"/>
  <text x="775" y="277" class="cbox" text-anchor="middle" style="fill:#e8e4df">sidecar</text>
  <text x="775" y="291" class="csub mono" text-anchor="middle" style="fill:#0d2038">48초 · 맨 나중</text>
  <!-- main→사이드카 화살표 -->
  <path d="M560,278 L696,278" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#fwd)"/>

  <!-- 역순 연결 강조: 상단 sidecar(왼쪽) ↔ 하단 sidecar(오른쪽) -->
  <path d="M235,150 C130,200 130,240 250,258" fill="none" stroke="#5b9bd5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="95" y="210" class="tick" text-anchor="middle" style="fill:#5b9bd5">같은</text>
  <text x="95" y="222" class="tick" text-anchor="middle" style="fill:#5b9bd5">사이드카</text>

  <!-- 하단 규칙 바 -->
  <rect x="30" y="340" width="900" height="82" rx="10" fill="rgb(24,26,30)" stroke="rgb(80,78,74)" stroke-width="1"/>
  <text x="50" y="364" class="keynote" style="fill:#e8e4df">사이드카가 <tspan style="fill:#66bb6a">맨 먼저</tspan> 떠서 준비되고 <tspan style="fill:rgb(224,110,100)">맨 나중</tspan>에 죽는 이유: 로깅·프록시 같은 부가 기능은 주 컨테이너가 다 뜬 뒤에도, 다 죽을 때까지 곁을 지켜야 한다.</text>
  <text x="50" y="386" class="keynote" style="fill:#e8e4df">그래서 <tspan class="mono" style="fill:rgb(212,168,83)">initContainers + restartPolicy: Always</tspan>(네이티브 사이드카)만 이 순서를 보장한다 — 일반 <tspan class="mono">containers</tspan> 사이드카는 병렬·무작위다.</text>
  <text x="50" y="408" class="keynote" style="fill:rgb(150,145,140)">주 컨테이너(main-a·main-b)끼리는 시작도 종료도 병렬(수 초 차는 순서 보장이 아닌 생성 시차). pre-stop hook은 SIGTERM보다 먼저 실행돼 그만큼 SIGTERM을 미룬다(47초).</text>
</svg>

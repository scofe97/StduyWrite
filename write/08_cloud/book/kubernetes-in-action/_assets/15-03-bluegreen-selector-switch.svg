<svg viewBox="0 0 960 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Blue/Green 배포 — Service selector 전환</title>
  <desc>처음에는 Service의 label selector가 col: blue를 매칭해 Blue Deployment로 트래픽이 간다. 전환 시점에 Service의 selector를 col: green으로 바꾸면 트래픽이 한 번에 Green Deployment로 넘어간다. 두 Deployment는 다른 label을 쓴다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .stage { font-size: 12px; font-weight: 800; fill: rgb(212,168,83); }
      .svc   { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .sel   { font-size: 10px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
      .dep   { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .note  { font-size: 10.5px; fill: #e8e4df; }
    </style>
    <marker id="bg-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="360" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Blue/Green — Service selector로 트래픽 전환</text>
  <text x="24" y="50" class="sub">Service의 label selector를 blue → green으로 바꿔 한 번에 전환합니다</text>

  <line x1="480" y1="70" x2="480" y2="350" stroke="rgb(60,60,60)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ===== LEFT: before (blue active) ===== -->
  <text x="230" y="92" class="stage" text-anchor="middle">① selector = col: blue</text>
  <rect x="150" y="110" width="160" height="48" rx="8" fill="rgb(240,215,120)"/>
  <text x="230" y="128" class="svc" text-anchor="middle">kiada service</text>
  <text x="230" y="146" class="sel" text-anchor="middle" style="fill:#0d0d0d">selector: col=blue</text>

  <rect x="70" y="210" width="150" height="52" rx="8" fill="rgb(91,155,213)"/>
  <text x="145" y="235" class="dep" text-anchor="middle">Blue Deploy</text>
  <text x="145" y="251" class="sel" text-anchor="middle" style="fill:#0d0d0d">col=blue</text>
  <rect x="245" y="210" width="150" height="52" rx="8" fill="rgb(120,120,120)"/>
  <text x="320" y="235" class="dep" text-anchor="middle" fill="#e8e4df">Green Deploy</text>
  <text x="320" y="251" class="sel" text-anchor="middle" fill="#e8e4df">col=green</text>

  <line x1="230" y1="158" x2="145" y2="208" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#bg-a)"/>
  <text x="320" y="290" class="note" text-anchor="middle">Green 대기(트래픽 없음)</text>

  <!-- ===== RIGHT: after (green active) ===== -->
  <text x="720" y="92" class="stage" text-anchor="middle">② selector = col: green</text>
  <rect x="640" y="110" width="160" height="48" rx="8" fill="rgb(240,215,120)"/>
  <text x="720" y="128" class="svc" text-anchor="middle">kiada service</text>
  <text x="720" y="146" class="sel" text-anchor="middle" style="fill:#0d0d0d">selector: col=green</text>

  <rect x="560" y="210" width="150" height="52" rx="8" fill="rgb(120,120,120)"/>
  <text x="635" y="235" class="dep" text-anchor="middle" fill="#e8e4df">Blue Deploy</text>
  <text x="635" y="251" class="sel" text-anchor="middle" fill="#e8e4df">col=blue</text>
  <rect x="735" y="210" width="150" height="52" rx="8" fill="rgb(102,187,106)"/>
  <text x="810" y="235" class="dep" text-anchor="middle">Green Deploy</text>
  <text x="810" y="251" class="sel" text-anchor="middle" style="fill:#0d0d0d">col=green</text>

  <line x1="720" y1="158" x2="810" y2="208" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#bg-a)"/>
  <text x="635" y="290" class="note" text-anchor="middle">Blue 삭제 대상(트래픽 없음)</text>

  <text x="480" y="330" class="note" text-anchor="middle">Service label selector만으로 구현 — 추가 도구 불필요, 즉시 롤백 가능</text>
</svg>

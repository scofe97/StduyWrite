<title id="dt">selector 한 줄을 바꿔 한 번에 넘긴다</title><desc id="dd">두 그룹이 서로 다른 label 을 쓰므로 selector 는 언제나 한 쪽만 잡는다. 전환은 Service 의 selector 를 고쳐 쓰는 일이고, Deployment 컨트롤러의 네이티브 전략이 아니다.</desc>
<rect width="1220" height="724" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 15-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">selector 한 줄을 바꿔 한 번에 넘긴다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">strategy.type 에 Blue/Green 을 적을 수는 없다</text>
<rect x="24" y="100" width="1172" height="232" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">전환 전</text>
<rect x="60" y="160" width="300" height="84" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="210" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">Service</text>
<text x="210" y="214" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">selector  col: blue</text>
<rect x="550" y="153" width="300" height="62" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="700" y="182" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">Blue Deployment</text>
<text x="700" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">col: blue</text>
<path d="M 364 202 L 544 184" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<rect x="550" y="239" width="300" height="62" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="700" y="268" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">Green Deployment</text>
<text x="700" y="286" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">col: green</text>
<path d="M 364 202 L 544 270" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#ar)" stroke-dasharray="5 5"/>
<text x="1040" y="216" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">Green 은 떠 있지만 트래픽이 안 간다</text>
<rect x="24" y="356" width="1172" height="232" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="376" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">selector 한 줄을 고친 뒤</text>
<rect x="60" y="416" width="300" height="84" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="210" y="446" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">Service</text>
<text x="210" y="470" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">selector  col: green</text>
<rect x="550" y="409" width="300" height="62" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="700" y="438" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">Blue Deployment</text>
<text x="700" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">col: blue</text>
<path d="M 364 458 L 544 440" fill="none" stroke="#5E6B7E" stroke-width="1.2" marker-end="url(#ar)" stroke-dasharray="5 5"/>
<rect x="550" y="495" width="300" height="62" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="700" y="524" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">Green Deployment</text>
<text x="700" y="542" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">col: green</text>
<path d="M 364 458 L 544 526" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="1040" y="472" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">한 번에 전부 넘어간다</text>
<text x="24" y="636" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Canary 와 짝을 이룬다 — Canary 는 두 Deployment 에 같은 라벨을 줘 한 Service 가 둘 다 잡게 하고 비율을 replica 수로 조절하지만, Blue/Green 은 다른 라벨을 줘 한 번에 한 쪽만 잡히게 한다.</text>
<text x="24" y="658" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 추가 도구가 필요 없다. Service 의 label selector 를 바꾸는 것만으로 된다.</text>
<line x1="12" y1="676" x2="1172" y2="676" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="698" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="688" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="698" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">트래픽을 받는 쪽</text>
<rect x="261" y="688" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="283" y="698" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">전환을 정하는 한 줄</text>
</svg>
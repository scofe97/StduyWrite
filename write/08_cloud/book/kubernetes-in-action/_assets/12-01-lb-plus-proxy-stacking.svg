<text x="24" y="790" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그러니 NodePort·LoadBalancer·Ingress 는 진화 단계가 아니라 계층별 도구다. 위가 아래를 대체하지 않고 그 위에 쌓인다.</text>
<text x="24" y="812" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">위층이 늘 나은 것도 아니다. L7 은 '이 트래픽은 HTTP 다'라는 가정을 산 대가로 경로 라우팅을 얻었다 — DB 연결·gRPC 스트림·게임 UDP 에는 LoadBalancer 가 정답이다.</text>

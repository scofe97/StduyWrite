<svg viewBox="0 0 820 260" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>kubectl port-forward 프록시를 통한 Pod 연결</title>
  <desc>브라우저나 curl 같은 클라이언트가 로컬 포트를 통해 kubectl port-forward 프록시에 연결하면, 그 프록시가 Pod에 연결한다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .bname  { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .note   { font-size: 11px; fill: #e8e4df; }
    </style>
    <marker id="a5c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="260" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">kubectl port-forward 프록시를 통한 Pod 연결</text>
  <text x="24" y="48" class="sub">로컬 포트 → 프록시 → Pod 컨테이너</text>

  <!-- Your computer -->
  <rect x="30" y="80" width="420" height="140" rx="10" fill="rgb(20,20,20)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="46" y="208" class="sub">Your computer</text>

  <rect x="60" y="120" width="140" height="60" rx="8" fill="rgb(91,155,213)"/>
  <text x="130" y="155" class="bname" text-anchor="middle" fill="#e8e4df">Client</text>

  <rect x="270" y="112" width="150" height="76" rx="8" fill="rgb(91,155,213)"/>
  <text x="345" y="145" class="bname" text-anchor="middle" fill="#e8e4df">kubectl</text>
  <text x="345" y="162" class="bname" text-anchor="middle" fill="#e8e4df">port-forward</text>
  <text x="345" y="178" class="bname" text-anchor="middle" fill="#e8e4df">proxy</text>

  <line x1="200" y1="150" x2="268" y2="150" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a5c)"/>

  <!-- Pod -->
  <rect x="620" y="100" width="170" height="110" rx="10" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="770" y="198" class="sub" text-anchor="end">Pod</text>
  <rect x="650" y="125" width="120" height="50" rx="8" fill="rgb(230,126,34)"/>
  <text x="710" y="155" class="bname" text-anchor="middle">Container</text>

  <line x1="420" y1="150" x2="618" y2="150" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a5c)"/>

  <!-- annotations -->
  <text x="130" y="105" class="note" text-anchor="middle">로컬 포트로 프록시에 연결</text>
  <text x="520" y="128" class="note" text-anchor="middle">프록시가 Pod에 연결</text>
</svg>

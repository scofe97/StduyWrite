<title id="dt">조건 둘은 보는 방향이 다르다</title><desc id="dd">존재하지 않는 이름을 적어도 apply 는 성공한다. 스키마가 보는 것은 필드가 있는지와 문자열인지까지이고, 그 이름의 오브젝트가 실제로 있는지는 다른 오브젝트를 조회해야 알 수 있다.</desc>
<rect width="1200" height="660" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 13-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">조건 둘은 보는 방향이 다르다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">13-01 §2 의 '모양은 강제해도 행동은 못 한다'가 참조에도 적용된다</text>

<svg viewBox="0 0 900 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Node 오브젝트의 status conditions</title>
  <desc>Node 오브젝트의 status 안 conditions는 노드의 현재 상태를 여러 측면으로 나타낸다. 각 condition의 상태는 True·False·Unknown 중 하나다. MemoryPressure·DiskPressure·PIDPressure는 노드가 자원을 소진해 가는지, Ready는 kubelet(노드 에이전트)이 준비돼 새 워크로드를 받을 수 있는지를 알려준다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .seclbl { font-size: 13px; font-weight: 800; fill: #e8e4df; }
      .ctype  { font-size: 13px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .cval   { font-size: 13px; font-weight: 800; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .cvallt { font-size: 13px; font-weight: 800; fill: #e8e4df; font-family: 'JetBrains Mono', monospace; }
      .note   { font-size: 11px; fill: #e8e4df; }
      .mt     { font-size: 10px; fill: rgb(138,133,128); }
    </style>
    <marker id="ah3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="380" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Node 오브젝트의 status conditions</text>
  <text x="24" y="48" class="sub">오브젝트 상태를 단일 필드가 아니라 여러 개의 직교적 condition 리스트로 표현한다</text>

  <!-- Node object outer -->
  <rect x="24" y="70" width="490" height="290" rx="10" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="40" y="92" class="mt">Node object</text>

  <!-- Spec column -->
  <rect x="40" y="102" width="88" height="242" rx="6" fill="rgb(102,187,106)"/>
  <text x="84" y="228" class="ctype" text-anchor="middle">Spec</text>

  <!-- Status box -->
  <rect x="140" y="102" width="360" height="242" rx="6" fill="rgb(91,155,213)"/>
  <text x="156" y="122" class="seclbl">Status</text>

  <!-- Conditions inner -->
  <rect x="156" y="132" width="328" height="196" rx="6" fill="rgb(26,26,26)" stroke="rgb(220,234,247)" stroke-width="1.5"/>
  <text x="170" y="152" class="note">Conditions</text>

  <!-- MemoryPressure True (magenta) -->
  <rect x="170" y="162" width="200" height="34" rx="5" fill="rgb(240,150,190)"/>
  <text x="182" y="184" class="ctype">MemoryPressure</text>
  <rect x="378" y="162" width="92" height="34" rx="5" fill="rgb(240,150,190)"/>
  <text x="424" y="184" class="cval" text-anchor="middle">True</text>

  <!-- DiskPressure False (green) -->
  <rect x="170" y="202" width="200" height="34" rx="5" fill="rgb(102,187,106)"/>
  <text x="182" y="224" class="ctype">DiskPressure</text>
  <rect x="378" y="202" width="92" height="34" rx="5" fill="rgb(102,187,106)"/>
  <text x="424" y="224" class="cval" text-anchor="middle">False</text>

  <!-- PIDPressure False (green) -->
  <rect x="170" y="242" width="200" height="34" rx="5" fill="rgb(102,187,106)"/>
  <text x="182" y="264" class="ctype">PIDPressure</text>
  <rect x="378" y="242" width="92" height="34" rx="5" fill="rgb(102,187,106)"/>
  <text x="424" y="264" class="cval" text-anchor="middle">False</text>

  <!-- Ready Unknown (amber) -->
  <rect x="170" y="282" width="200" height="34" rx="5" fill="rgb(245,215,110)"/>
  <text x="182" y="304" class="ctype">Ready</text>
  <rect x="378" y="282" width="92" height="34" rx="5" fill="rgb(245,215,110)"/>
  <text x="424" y="304" class="cval" text-anchor="middle">Unknown</text>

  <!-- annotations -->
  <line x1="518" y1="145" x2="560" y2="145" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ah3)"/>
  <text x="566" y="142" class="note">condition은 오브젝트 상태의</text>
  <text x="566" y="158" class="note">개별 측면을 나타낸다</text>

  <line x1="474" y1="179" x2="560" y2="210" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ah3)"/>
  <text x="566" y="206" class="note">각 condition의 상태는</text>
  <text x="566" y="222" class="cvallt">True · False · Unknown</text>
  <text x="566" y="238" class="note">셋 중 하나</text>

  <line x1="300" y1="320" x2="560" y2="300" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ah3)"/>
  <text x="566" y="286" class="note">Ready는 kubelet이 준비돼</text>
  <text x="566" y="302" class="note">새 워크로드(Pod)를 받을 수</text>
  <text x="566" y="318" class="note">있는지 알려준다 — 가장 중요</text>

  <text x="566" y="348" class="mt">Pressure 계열 3종은 노드가 자원을</text>
  <text x="566" y="362" class="mt">소진해 가는지를 신호한다</text>
</svg>

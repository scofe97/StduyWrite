<svg viewBox="0 0 960 460" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>네이티브 사이드카의 생명주기 세 단계</title>
  <desc>네이티브 사이드카는 init 자리에 restartPolicy Always 를 붙여 만든다. init 단계에서 주 컨테이너보다 먼저 뜨고(그래서 뒤따르는 init·주 컨테이너에 서비스 제공 가능), Pod 수명 내내 계속 살아있으며, 종료 시에는 주 컨테이너가 모두 죽은 뒤 맨 마지막에 죽는다. init 의 먼저와 사이드카의 계속을 합친 것이다.</desc>
  <defs>
    <style>
      .title { font-size: 16px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 10.5px; fill: rgb(138,133,128); }
      .step  { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .body  { font-size: 10.5px; fill: #1a1a1a; }
      .note  { font-size: 9.5px; fill: rgb(138,133,128); }
      .tag   { font-size: 10px; font-weight: 800; fill: rgb(212,168,83); }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
    <marker id="ar3" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="rgb(212,168,83)"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">네이티브 사이드카 = init의 "먼저" + 사이드카의 "계속" + 맨 마지막 종료</text>
  <text x="24" y="54" class="sub">initContainers 에 restartPolicy: Always 한 줄을 붙이면 만들어진다. 아래 세 단계로 산다.</text>

  <!-- restartPolicy: Always 강조 배지 -->
  <rect x="24" y="72" width="912" height="34" rx="7" fill="rgb(28,30,34)" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="40" y="94" class="tag">정의:</text>
  <text x="86" y="94" class="note mono" style="fill:#e8e4df">initContainers: [ { name: sidecar, restartPolicy: Always } ]</text>
  <text x="560" y="94" class="note">← "끝나면 항상 재시작" = 죽는 틈이 없음 = 상시 실행</text>

  <!-- 단계 1: 먼저 뜬다 -->
  <rect x="24" y="128" width="290" height="150" rx="11" fill="rgb(212,168,83)" stroke="#a67c1a" stroke-width="1.4"/>
  <text x="44" y="158" class="step">① 먼저 뜬다</text>
  <text x="44" y="184" class="body">init 단계에서 시작 —</text>
  <text x="44" y="202" class="body">주 컨테이너보다 앞.</text>
  <text x="44" y="226" class="body">Ready 되면 다음 init·주</text>
  <text x="44" y="244" class="body">컨테이너로 넘어간다.</text>
  <text x="44" y="266" class="body" style="fill:#5a3d0a">→ 뒤따르는 것들에 서비스 제공</text>

  <!-- 단계 2: 계속 산다 -->
  <rect x="335" y="128" width="290" height="150" rx="11" fill="#66bb6a" stroke="#3d8b40" stroke-width="1.4"/>
  <text x="355" y="158" class="step">② 계속 산다</text>
  <text x="355" y="184" class="body">Pod 수명 내내 실행.</text>
  <text x="355" y="202" class="body">일반 init 처럼 "끝나고</text>
  <text x="355" y="220" class="body">죽지" 않는다.</text>
  <text x="355" y="244" class="body">죽으면 Always 정책이</text>
  <text x="355" y="262" class="body">즉시 되살린다.</text>

  <!-- 단계 3: 마지막에 죽는다 -->
  <rect x="646" y="128" width="290" height="150" rx="11" fill="#5b9bd5" stroke="#2f6ba3" stroke-width="1.4"/>
  <text x="666" y="158" class="step" style="fill:#0d0d0d">③ 마지막에 죽는다</text>
  <text x="666" y="184" class="body" style="fill:#0d1a2a">Pod 종료 시, 주 컨테이너가</text>
  <text x="666" y="202" class="body" style="fill:#0d1a2a">모두 죽은 뒤에야 SIGTERM.</text>
  <text x="666" y="226" class="body" style="fill:#0d1a2a">사이드카가 아직 필요할 때</text>
  <text x="666" y="244" class="body" style="fill:#0d1a2a">멈추지 않도록 보장.</text>
  <text x="666" y="266" class="body" style="fill:#0d1a2a">(로그·네트워크 사이드카 안전)</text>

  <!-- 화살표 연결 -->
  <path d="M314,203 L333,203" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#ar3)"/>
  <path d="M625,203 L644,203" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#ar3)"/>

  <!-- 대비 표: 일반 사이드카와 뭐가 다른가 -->
  <rect x="24" y="300" width="912" height="132" rx="9" fill="rgb(22,24,28)" stroke="rgb(80,78,74)" stroke-width="1"/>
  <text x="40" y="324" class="tag">일반 사이드카와 비교</text>
  <text x="40" y="350" class="note" style="fill:#e8e4df">· 시작: 일반 = 주 컨테이너와 <tspan class="mono">동시(병렬)</tspan>  /  네이티브 = 주 컨테이너보다 <tspan class="mono" style="fill:rgb(212,168,83)">먼저</tspan> (init 도 쓸 수 있음)</text>
  <text x="40" y="374" class="note" style="fill:#e8e4df">· 종료: 일반 = 주 컨테이너와 <tspan class="mono">동시</tspan>(먼저 죽을 위험)  /  네이티브 = 주 컨테이너 다 죽은 뒤 <tspan class="mono" style="fill:#5b9bd5">마지막</tspan></text>
  <text x="40" y="398" class="note" style="fill:#e8e4df">· 정의 위치: 일반 = <tspan class="mono">containers</tspan>  /  네이티브 = <tspan class="mono">initContainers</tspan> + <tspan class="mono" style="fill:rgb(212,168,83)">restartPolicy: Always</tspan></text>
  <text x="40" y="422" class="note" style="fill:#e8e4df">· 배치 Job(18장): 반드시 네이티브여야 주 컨테이너 완료 시 사이드카가 Pod 완료를 막지 않는다</text>
</svg>

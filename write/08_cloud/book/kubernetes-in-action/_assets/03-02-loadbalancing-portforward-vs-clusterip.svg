<svg viewBox="0 0 900 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>로드밸런싱 — port-forward는 우회하고, 클러스터 내부 ClusterIP만 분산한다</title>
  <desc>같은 Service에 요청해도 접속 경로에 따라 로드밸런싱 여부가 갈린다. kubectl port-forward는 Service의 endpoint 중 Pod 하나에 직접 터널을 뚫어 그 Pod에 고정되므로, 30번 요청이 전부 같은 Pod로 갔다. 반면 클러스터 안에서 Service 이름(ClusterIP)으로 요청하면 kube-proxy가 endpoints에 분산해, 30번 요청이 세 Pod에 13/10/7로 나뉘고 다른 노드의 Pod에도 도달했다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .zlabel { font-size: 12.5px; font-weight: 800; fill: #e8e4df; }
      .big    { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .lbl    { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .note   { font-size: 10.5px; fill: #e8e4df; }
      .cnt    { font-size: 11px; font-weight: 800; }
      .podnm  { font-size: 9.5px; font-weight: 800; fill: #14521d; font-family: 'JetBrains Mono', monospace; }
    </style>
    <marker id="ared" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e88b8b"/>
    </marker>
    <marker id="agr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="470" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">로드밸런싱 — 접속 경로가 분산 여부를 가른다</text>
  <text x="24" y="48" class="sub">같은 kiada Service인데도, port-forward는 한 Pod에 고정되고 클러스터 내부 ClusterIP만 세 Pod에 분산합니다.</text>

  <!-- ===== 왼쪽: port-forward (우회) ===== -->
  <rect x="30" y="70" width="410" height="370" rx="12" fill="rgb(24,28,32)" stroke="#7a1f1f" stroke-width="1.5"/>
  <text x="50" y="96" class="cnt" fill="#e88b8b">① kubectl port-forward — 로드밸런싱 우회</text>

  <rect x="50" y="110" width="150" height="40" rx="6" fill="rgb(45,42,38)"/>
  <text x="125" y="135" class="note" style="fill:#e8e4df" text-anchor="middle">로컬 curl ×30</text>

  <text x="60" y="172" class="sub">port-forward가 Pod 하나에 직접 터널</text>
  <line x1="125" y1="150" x2="125" y2="200" stroke="#e88b8b" stroke-width="2.2" marker-end="url(#ared)"/>

  <!-- 3 pod, only 1 hit -->
  <rect x="50" y="210" width="360" height="50" rx="6" fill="#66bb6a"/>
  <text x="70" y="232" class="podnm">Pod bhgc5</text>
  <rect x="270" y="220" width="120" height="24" rx="4" fill="#fdf3df"/>
  <text x="330" y="237" class="cnt" fill="#7a1f1f" text-anchor="middle">30회 ← 전부!</text>

  <rect x="50" y="268" width="360" height="42" rx="6" fill="rgb(40,44,40)" stroke="#3a4a3a" stroke-width="1"/>
  <text x="70" y="294" class="podnm" style="fill:rgb(120,140,120)">Pod 8phwt</text>
  <text x="270" y="294" class="note" style="fill:rgb(120,140,120)">0회 (터널 안 감)</text>

  <rect x="50" y="318" width="360" height="42" rx="6" fill="rgb(40,44,40)" stroke="#3a4a3a" stroke-width="1"/>
  <text x="70" y="344" class="podnm" style="fill:rgb(120,140,120)">Pod 2vm7s</text>
  <text x="270" y="344" class="note" style="fill:rgb(120,140,120)">0회 (터널 안 감)</text>

  <text x="50" y="392" class="note" style="fill:#e88b8b;font-weight:800">svc/kiada라 써도 kube-proxy를 안 거침</text>
  <text x="50" y="412" class="note">→ 한번 연결된 Pod에 고정. Service 분산 미발동.</text>
  <text x="50" y="430" class="note" style="fill:rgb(138,133,128)">디버깅·단일 Pod 접속엔 편하지만 분산 관찰엔 부적합</text>

  <!-- ===== 오른쪽: ClusterIP (분산) ===== -->
  <rect x="460" y="70" width="410" height="370" rx="12" fill="rgb(24,28,32)" stroke="#14521d" stroke-width="1.5"/>
  <text x="480" y="96" class="cnt" fill="#7bc47f">② 클러스터 내부 ClusterIP — 진짜 분산</text>

  <rect x="480" y="110" width="180" height="40" rx="6" fill="rgb(45,42,38)"/>
  <text x="570" y="135" class="note" style="fill:#e8e4df" text-anchor="middle">클러스터 안 curl ×30</text>

  <rect x="690" y="110" width="160" height="40" rx="6" fill="#5b9bd5"/>
  <text x="770" y="128" class="note" style="fill:#e8e4df" text-anchor="middle">kube-proxy</text>
  <text x="770" y="143" class="note" style="fill:#e8e4df" text-anchor="middle" font-size="9">(iptables 분산)</text>
  <line x1="660" y1="130" x2="688" y2="130" stroke="#66bb6a" stroke-width="2" marker-end="url(#agr)"/>

  <text x="490" y="172" class="sub">http://kiada:8080 (Service 이름 → ClusterIP)</text>
  <line x1="570" y1="150" x2="570" y2="200" stroke="#66bb6a" stroke-width="2.2" marker-end="url(#agr)"/>

  <!-- 3 pod, all hit -->
  <rect x="480" y="210" width="370" height="46" rx="6" fill="#66bb6a"/>
  <text x="500" y="230" class="podnm">Pod bhgc5</text>
  <text x="516" y="246" class="note" style="fill:#14521d" font-size="9">worker</text>
  <rect x="720" y="220" width="115" height="24" rx="4" fill="#fdf3df"/>
  <text x="777" y="237" class="cnt" fill="#14521d" text-anchor="middle">7회</text>

  <rect x="480" y="264" width="370" height="46" rx="6" fill="#66bb6a"/>
  <text x="500" y="284" class="podnm">Pod 8phwt</text>
  <text x="516" y="300" class="note" style="fill:#14521d" font-size="9">worker</text>
  <rect x="720" y="274" width="115" height="24" rx="4" fill="#fdf3df"/>
  <text x="777" y="291" class="cnt" fill="#14521d" text-anchor="middle">10회</text>

  <rect x="480" y="318" width="370" height="46" rx="6" fill="#66bb6a"/>
  <text x="500" y="338" class="podnm">Pod 2vm7s</text>
  <text x="516" y="354" class="note" style="fill:#14521d" font-size="9">worker2 (다른 노드!)</text>
  <rect x="720" y="328" width="115" height="24" rx="4" fill="#fdf3df"/>
  <text x="777" y="345" class="cnt" fill="#14521d" text-anchor="middle">13회</text>

  <text x="480" y="392" class="note" style="fill:#7bc47f;font-weight:800">30회가 세 Pod에 13/10/7로 분산</text>
  <text x="480" y="412" class="note">노드 경계(worker↔worker2)를 넘어 분산됨</text>
  <text x="480" y="430" class="note" style="fill:rgb(138,133,128)">완벽한 3등분이 아닌 건 iptables가 확률적 분산이라서</text>
</svg>

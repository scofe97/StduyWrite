<svg viewBox="0 0 900 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>로드밸런싱 — port-forward는 우회하고, ClusterIP 경로는 노드 커널에서 endpoint를 선택한다</title>
  <desc>같은 Service에 요청해도 접속 경로에 따라 로드밸런싱 여부가 갈린다. kubectl port-forward는 Service의 endpoint 중 Pod 하나에 직접 터널을 뚫어 그 Pod에 고정된다. 반면 클러스터 안의 클라이언트 Pod curl은 Service 이름 kiada를 DNS로 해석해 ClusterIP 10.96.154.45:8080에 연결하고, 출발 노드의 커널 데이터패스가 kube-proxy가 사전에 설치한 규칙으로 endpoint 하나를 선택해 DNAT한다. 새 연결마다 세 Pod 후보 중 하나가 선택되며 요청은 복제되지 않는다. 이 kind 환경의 실측 30회 결과는 13/10/7이다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .zlabel { font-size: 12.5px; font-weight: 800; fill: #e8e4df; }
      .big    { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .lbl    { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .note   { font-size: 10.5px; fill: #e8e4df; }
      .cnt    { font-size: 11px; font-weight: 800; }
      .podnm  { font-size: 9.5px; font-weight: 800; fill: #14521d; font-family: 'JetBrains Mono', monospace; }
    </style>
    <marker id="ared" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e88b8b"/>
    </marker>
    <marker id="agr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="470" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">로드밸런싱 — 접속 경로가 분산 여부를 가른다</text>
  <text x="24" y="48" class="sub">같은 kiada Service인데도, port-forward는 한 Pod에 고정되고 클러스터 내부 ClusterIP 경로는 새 연결마다 endpoint를 선택합니다.</text>

  <!-- ===== 왼쪽: port-forward (우회) ===== -->
  <rect x="30" y="70" width="410" height="370" rx="12" fill="rgb(24,28,32)" stroke="#7a1f1f" stroke-width="1.5"/>
  <text x="50" y="96" class="cnt" fill="#e88b8b">① kubectl port-forward — 로드밸런싱 우회</text>

  <rect x="50" y="110" width="150" height="40" rx="6" fill="rgb(45,42,38)"/>
  <text x="125" y="135" class="note" style="fill:#e8e4df" text-anchor="middle">로컬 curl ×30</text>

  <text x="60" y="172" class="sub">port-forward가 Pod 하나에 직접 터널</text>
  <line x1="125" y1="150" x2="125" y2="200" stroke="#e88b8b" stroke-width="2.2" marker-end="url(#ared)"/>

  <!-- 3 pod, only 1 hit -->
  <rect x="50" y="210" width="360" height="50" rx="6" fill="#66bb6a"/>
  <text x="70" y="232" class="podnm">Pod bhgc5</text>
  <rect x="270" y="220" width="120" height="24" rx="4" fill="#fdf3df"/>
  <text x="330" y="237" class="cnt" fill="#7a1f1f" text-anchor="middle">30회 ← 전부!</text>

  <rect x="50" y="268" width="360" height="42" rx="6" fill="rgb(40,44,40)" stroke="#3a4a3a" stroke-width="1"/>
  <text x="70" y="294" class="podnm" style="fill:rgb(120,140,120)">Pod 8phwt</text>
  <text x="270" y="294" class="note" style="fill:rgb(120,140,120)">0회 (터널 안 감)</text>

  <rect x="50" y="318" width="360" height="42" rx="6" fill="rgb(40,44,40)" stroke="#3a4a3a" stroke-width="1"/>
  <text x="70" y="344" class="podnm" style="fill:rgb(120,140,120)">Pod 2vm7s</text>
  <text x="270" y="344" class="note" style="fill:rgb(120,140,120)">0회 (터널 안 감)</text>

  <text x="50" y="392" class="note" style="fill:#e88b8b;font-weight:800">svc/kiada라 써도 kube-proxy를 안 거침</text>
  <text x="50" y="412" class="note">→ 한번 연결된 Pod에 고정. Service 분산 미발동.</text>
  <text x="50" y="430" class="note" style="fill:rgb(138,133,128)">디버깅·단일 Pod 접속엔 편하지만 분산 관찰엔 부적합</text>

  <!-- ===== 오른쪽: ClusterIP (분산) ===== -->
  <rect x="460" y="70" width="410" height="370" rx="12" fill="rgb(24,28,32)" stroke="#14521d" stroke-width="1.5"/>
  <text x="480" y="96" class="cnt" fill="#7bc47f">② 클러스터 내부 ClusterIP — 노드 데이터패스에서 분산</text>

  <!-- 실제 실선 경로: 클라이언트 Pod → Service 이름/DNS·ClusterIP → 출발 노드 커널 -->
  <rect x="480" y="110" width="110" height="40" rx="6" fill="rgb(45,42,38)"/>
  <text x="535" y="126" class="note" style="fill:#e8e4df" text-anchor="middle">클라이언트 Pod</text>
  <text x="535" y="141" class="note" style="fill:#e8e4df" text-anchor="middle">curl ×30</text>

  <rect x="610" y="110" width="240" height="40" rx="6" fill="#5b9bd5"/>
  <text x="730" y="126" class="note" style="fill:#e8e4df" text-anchor="middle">Service 이름 DNS 해석</text>
  <text x="730" y="141" class="note" style="fill:#e8e4df" text-anchor="middle">kiada → 10.96.154.45:8080</text>
  <line x1="590" y1="130" x2="608" y2="130" stroke="#66bb6a" stroke-width="2.2" marker-end="url(#agr)"/>

  <rect x="480" y="170" width="220" height="48" rx="6" fill="#d89b55"/>
  <text x="590" y="188" class="big" text-anchor="middle">출발 노드 커널 데이터패스</text>
  <text x="590" y="205" class="lbl" text-anchor="middle">endpoint 하나 선택 + DNAT</text>
  <path d="M730 150 V160 H590 V168" fill="none" stroke="#66bb6a" stroke-width="2.2" marker-end="url(#agr)"/>

  <!-- kube-proxy는 실제 요청 경로 밖에서 규칙만 사전 설치 -->
  <rect x="720" y="170" width="130" height="48" rx="6" fill="#5b9bd5"/>
  <text x="785" y="188" class="note" style="fill:#e8e4df" text-anchor="middle">kube-proxy</text>
  <text x="785" y="205" class="note" style="fill:#e8e4df" text-anchor="middle" font-size="9">(사전에 규칙 설치)</text>
  <line x1="720" y1="194" x2="702" y2="194" stroke="#66bb6a" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#agr)"/>

  <text x="480" y="236" class="note" style="fill:#7bc47f;font-weight:800">새 연결마다 후보 중 하나 선택</text>
  <text x="480" y="251" class="note" style="fill:#e8e4df">(요청 복제 아님) · Service endpoint 후보 3개</text>
  <path d="M590 218 V258" fill="none" stroke="#66bb6a" stroke-width="2.2"/>

  <!-- 각 실선 가지는 새 연결의 단일 endpoint 선택을 나타냄 -->
  <path d="M537 258 H792" fill="none" stroke="#66bb6a" stroke-width="2"/>
  <path d="M537 258 V268" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M664 258 V268" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M792 258 V268" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#agr)"/>

  <!-- 3 Pod 후보와 보존된 실측 수치 -->
  <rect x="480" y="268" width="115" height="68" rx="6" fill="#66bb6a"/>
  <text x="537" y="287" class="podnm" text-anchor="middle">Pod bhgc5</text>
  <text x="537" y="302" class="note" style="fill:#14521d" text-anchor="middle" font-size="9">worker</text>
  <text x="537" y="325" class="cnt" fill="#14521d" text-anchor="middle">7회</text>

  <rect x="607" y="268" width="115" height="68" rx="6" fill="#66bb6a"/>
  <text x="664" y="287" class="podnm" text-anchor="middle">Pod 8phwt</text>
  <text x="664" y="302" class="note" style="fill:#14521d" text-anchor="middle" font-size="9">worker</text>
  <text x="664" y="325" class="cnt" fill="#14521d" text-anchor="middle">10회</text>

  <rect x="735" y="268" width="115" height="68" rx="6" fill="#66bb6a"/>
  <text x="792" y="287" class="podnm" text-anchor="middle">Pod 2vm7s</text>
  <text x="792" y="302" class="note" style="fill:#14521d" text-anchor="middle" font-size="9">worker2 (다른 노드!)</text>
  <text x="792" y="325" class="cnt" fill="#14521d" text-anchor="middle">13회</text>

  <text x="480" y="360" class="note" style="fill:#7bc47f;font-weight:800">실측 30회: 세 Pod에 13/10/7로 분산</text>
  <text x="480" y="379" class="note">노드 경계(worker↔worker2)를 넘어 분산됨</text>
  <text x="480" y="398" class="note" style="fill:rgb(138,133,128)">이 kind 환경의 iptables 규칙이 확률적으로 분산</text>
  <text x="480" y="417" class="note" style="fill:rgb(138,133,128)">한 요청을 세 Pod에 복제하지 않고 연결 단위로 선택</text>
</svg>

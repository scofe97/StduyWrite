<title id="dt">같은 30회인데 경로에 따라 도착지가 갈린다</title><desc id="dd">port-forward 는 Pod 하나에 직접 터널을 뚫어 kube-proxy 를 거치지 않으므로 30번이 한 Pod 로 몰린다. 클러스터 안에서 ClusterIP 로 가면 새 연결마다 endpoint 가 선택된다.</desc>
<rect width="1000" height="668" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 03-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 30회인데 경로에 따라 도착지가 갈린다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">분산은 Service 가 아니라 노드의 데이터패스가 한다 — 그 경로를 지나야 발동한다</text>
<rect x="24" y="104" width="952" height="508" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">한 요청을 셋에 복제하는 것이 아니라 연결 하나가 하나로 간다</text>
<text x="36" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">① kubectl port-forward — kube-proxy 를 안 거친다</text>
<text x="36" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">Pod 하나에 직접 터널을 뚫는다. svc/kiada 라 써도 마찬가지다.</text>
<text x="404" y="250" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">bhgc5 (worker)</text>
<rect x="420" y="233" width="420" height="26" rx="4" fill="#F0616D22" stroke="#F0616D" stroke-width="1.0"/>
<text x="852" y="250" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">30회</text>
<text x="404" y="292" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">8phwt (worker)</text>
<text x="432" y="292" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">0회</text>
<text x="404" y="334" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2vm7s (worker2)</text>
<text x="432" y="334" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">0회</text>
<rect x="638.0" y="195" width="124.0" height="18" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="700" y="208" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">한 Pod 에 고정</text>
<text x="36" y="400" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">② 클러스터 안에서 ClusterIP 로 — 노드 데이터패스가 고른다</text>
<text x="36" y="420" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">새 연결마다 endpoint 하나를 골라 DNAT 한다. kube-proxy 가 미리 규칙을 깔아 둔다.</text>
<text x="404" y="454" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">bhgc5 (worker)</text>
<rect x="420" y="437" width="98" height="26" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="530" y="454" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">7회</text>
<text x="404" y="496" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">8phwt (worker)</text>
<rect x="420" y="479" width="140" height="26" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="572" y="496" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">10회</text>
<text x="404" y="538" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">2vm7s (worker2)</text>
<rect x="420" y="521" width="182" height="26" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="614" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">13회</text>
<rect x="638.0" y="399" width="124.0" height="18" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="700" y="412" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">세 Pod 로 분산</text>
<line x1="36" y1="372" x2="964" y2="372" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="36" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">표본이 30회라 13/10/7 정도의 편차는 난다 — iptables 규칙이 확률적으로 고르기 때문이다.</text>
<text x="36" y="576" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그중 하나는 다른 노드(worker2)였다 — 분산은 노드 경계를 넘는다.</text>
<line x1="12" y1="628" x2="952" y2="628" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="650" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="640" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="650" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">분산이 발동하지 않는 경로</text>
<rect x="326" y="640" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="348" y="650" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">분산이 발동하는 경로</text>
</svg>
<svg viewBox="0 0 820 520" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>17-02 전체 지도 — 격리를 어느 축에서 푸는가</title>
  <desc>노드 에이전트가 일반 워크로드의 격리를 벗어나야 하는 네 축을 증상별 줄기로 갈라 놓은 그림입니다. 커널 접근은 privileged 또는 capabilities로, 파일시스템은 hostPath로, 네트워크는 hostNetwork로 열고, 마지막 축은 격리가 아니라 스케줄 우선순위를 PriorityClass로 올립니다. 줄기 사이에 화살표가 없어 서로 독립이며, 커널 축에는 privileged 전체 권한이 위험하다는 표시가, 네트워크 축에는 노드 IP를 그대로 쓴다는 주의 표시가 붙어 있습니다.</desc>
  <rect width="820" height="520" fill="#0d0d0d"/>

  <text x="40" y="40" fill="#e8e4df" font-size="15" font-weight="700">무엇을 열어 줄 것인가</text>

  <line x1="40" y1="62" x2="40" y2="392" stroke="#b8b3ad" stroke-width="2"/>

  <rect x="60" y="62" width="720" height="80" rx="4" fill="#e8e4df"/>
  <text x="80" y="88" fill="#0d0d0d" font-size="14" font-weight="700">커널</text>
  <text x="740" y="88" text-anchor="end" fill="#3a3632" font-size="11">§1</text>
  <text x="80" y="112" fill="#3a3632" font-size="12">privileged — 전부</text>
  <text x="260" y="112" fill="#3a3632" font-size="12">capabilities — 골라서</text>
  <rect x="480" y="98" width="220" height="22" rx="3" fill="#f2d4d4"/>
  <text x="492" y="113" fill="#7a1f1f" font-size="11.5" font-weight="700">위험 · 권한 검사 우회</text>
  <text x="80" y="131" fill="#3a3632" font-size="12">최소 권한이 원칙</text>

  <rect x="60" y="156" width="720" height="66" rx="4" fill="#e8e4df"/>
  <text x="80" y="182" fill="#0d0d0d" font-size="14" font-weight="700">파일시스템</text>
  <text x="740" y="182" text-anchor="end" fill="#3a3632" font-size="11">§2</text>
  <text x="80" y="206" fill="#3a3632" font-size="12">hostPath로 마운트</text>
  <text x="300" y="206" fill="#3a3632" font-size="12">xtables.lock</text>
  <text x="420" y="206" fill="#3a3632" font-size="12">/lib/modules</text>

  <rect x="60" y="236" width="720" height="80" rx="4" fill="#e8e4df"/>
  <text x="80" y="262" fill="#0d0d0d" font-size="14" font-weight="700">네트워크</text>
  <text x="740" y="262" text-anchor="end" fill="#3a3632" font-size="11">§3</text>
  <text x="80" y="286" fill="#3a3632" font-size="12">hostNetwork — 노드 것</text>
  <rect x="330" y="272" width="230" height="22" rx="3" fill="rgb(212,168,83)"/>
  <text x="342" y="287" fill="#0d0d0d" font-size="11.5" font-weight="700">주의 · 파드 IP = 노드 IP</text>
  <text x="80" y="305" fill="#3a3632" font-size="12">IPC · PID는 따로 연다</text>

  <rect x="60" y="330" width="720" height="62" rx="4" fill="#e8e4df"/>
  <text x="80" y="356" fill="#0d0d0d" font-size="14" font-weight="700">우선순위</text>
  <text x="740" y="356" text-anchor="end" fill="#3a3632" font-size="11">§4</text>
  <text x="80" y="380" fill="#3a3632" font-size="12">PriorityClass로 표시</text>
  <text x="300" y="380" fill="#3a3632" font-size="12">내장 2종은 20억대</text>

  <rect x="40" y="428" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="454" fill="#0d0d0d" font-size="14" font-weight="700">kube-proxy가 넷을 다 쓴다</text>
  <text x="60" y="478" fill="#3a3632" font-size="12">privileged</text>
  <text x="180" y="478" fill="#3a3632" font-size="12">hostPath 2개</text>
  <text x="330" y="478" fill="#3a3632" font-size="12">hostNetwork</text>
  <text x="480" y="478" fill="#3a3632" font-size="12">node-critical</text>
</svg>

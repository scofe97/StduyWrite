<title id="dt">무엇을 열어 줄 것인가</title><desc id="dd">노드 에이전트는 격리를 부분적으로 열어야 일을 한다. 커널·파일시스템·네트워크 셋은 각각 다른 격리를 열고, 넷째는 격리가 아니라 스케줄 자리를 지킨다.</desc>
<rect width="1180" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 17-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">무엇을 열어 줄 것인가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">네 영역 사이에 순서가 없다 — 필요한 것만 골라 읽는다</text>
<rect x="90" y="176" width="500" height="140" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="118" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">§1  커널</text>
<text x="118" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">privileged 로 전부 열거나</text>
<text x="118" y="274" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">capabilities 로 골라 연다</text>
<rect x="630" y="176" width="500" height="140" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="658" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">§2  파일시스템</text>
<text x="658" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">hostPath 로</text>
<text x="658" y="274" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노드의 경로를 마운트한다</text>
<rect x="90" y="348" width="500" height="140" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="118" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">§3  네트워크</text>
<text x="118" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">hostNetwork 로</text>
<text x="118" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노드의 네트워크를 그대로 쓴다</text>
<rect x="630" y="348" width="500" height="140" rx="8" fill="#161B22" stroke="#F08A59" stroke-width="1.2"/>
<text x="658" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">§4  우선순위</text>
<text x="658" y="422" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">격리를 여는 게 아니라</text>
<text x="658" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">스케줄 자리를 지킨다</text>
<text x="590" y="508" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">privileged 는 커널 권한 검사를 통째로 우회하고, hostNetwork 는 파드가 자기 IP 없이 노드 IP 를 쓰게 만든다</text>
<text x="24" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">앞의 셋은 격리를 여는 일이라 열수록 노출면이 넓어진다. 넷째만 성격이 달라 '무엇을 열까'가 아니라 '어디까지 밀려나지 않을까'를 정한다.</text>
<line x1="12" y1="576" x2="1132" y2="576" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="598" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="588" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">격리를 여는 셋</text>
<rect x="248" y="588" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="270" y="598" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">성격이 다른 넷째</text>
</svg>
<svg viewBox="0 0 900 560" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif">
  <title>13-03 전체 지도 — 무엇을 아는가로 갈리는 네 축</title>
  <desc>이 절 전체를 게이트웨이가 무엇을 아는가라는 하나의 축으로 이은 지도다. 축 1 은 TLS 다. 게이트웨이가 TLS 를 직접 종료하면 안이 HTTP 임을 알게 되어 리스너 프로토콜은 HTTPS 이고 HTTPRoute 로 경로와 헤더까지 라우팅한다. 반대로 통과시키면 백엔드가 종료하므로 게이트웨이는 SNI 의 호스트명만 알고, 리스너 프로토콜은 TLS 이며 TLSRoute 로 호스트명만 본다. 축 2 는 HTTP 가 아닌 프로토콜이다. TCPRoute 와 UDPRoute 는 내용을 전혀 모르므로 조건 없이 전달하고 weight 분할만 되며, GRPCRoute 는 HTTP 리스너 위에서 gRPC 서비스와 메서드를 매칭한다. 여기서 선언이 뜻대로 안 되는 양상이 셋으로 갈린다. 스키마 오류는 apply 자체가 실패하고, 참조 거부는 status 에 RefNotPermitted 라는 이유가 찍히며, 구현 미지원은 apply 가 성공하는데 status 가 빈 채로 남는다. 셋째가 가장 어렵다. 축 3 은 네임스페이스를 넘는 참조다. 파드 간 네트워크 통신은 원래 네임스페이스를 넘지만 오브젝트 간 참조는 기본으로 막혀 있다. 게이트웨이 공유는 리스너의 allowedRoutes 로 허가하고, 다른 네임스페이스의 서비스를 백엔드로 쓰는 것은 ReferenceGrant 로 허가하되 그 오브젝트는 참조 대상인 서비스의 네임스페이스에 만든다. 축 4 는 mesh 다. parentRefs 의 뜻이 원래 부모 게이트웨이가 아니라 이 규칙이 적용될 트래픽 진입점이므로, 진입점 자리에 Service 를 두면 같은 API 로 서비스 간 통신까지 관리된다. 도식에서 색은 오직 경고 띠에만 쓴다. 나머지 상자는 모두 같은 회색이므로 색이 아니라 배치와 화살표가 뜻을 만든다.</desc>
  <rect width="900" height="560" fill="#0d0d0d"/>

  <defs>
    <marker id="ar13" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">게이트웨이가 무엇을 아는가</text>
  <text x="450" y="53" text-anchor="middle" font-size="11.5" fill="#b8b3ad">색은 경고 띠에만 씁니다</text>

  <!-- 축 1 TLS -->
  <line x1="24" y1="76" x2="24" y2="152" stroke="#b8b3ad" stroke-width="2"/>
  <text x="40" y="90" font-size="12" font-weight="700" fill="#e8e4df">축 1 · TLS</text>
  <text x="130" y="90" font-size="11" fill="#b8b3ad">§1 · 누가 종료하는가</text>

  <rect x="40" y="102" width="410" height="40" rx="4" fill="#e8e4df"/>
  <text x="245" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#0d0d0d">termination · HTTPS</text>
  <text x="245" y="134" text-anchor="middle" font-size="9.5" fill="#3a3632">안이 HTTP · HTTPRoute</text>

  <rect x="458" y="102" width="410" height="40" rx="4" fill="#e8e4df"/>
  <text x="663" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#0d0d0d">passthrough · TLS</text>
  <text x="663" y="134" text-anchor="middle" font-size="9.5" fill="#3a3632">SNI 만 · TLSRoute</text>

  <!-- 축 2 기타 프로토콜 -->
  <line x1="24" y1="172" x2="24" y2="288" stroke="#b8b3ad" stroke-width="2"/>
  <text x="40" y="186" font-size="12" font-weight="700" fill="#e8e4df">축 2 · HTTP 가 아닌 것</text>
  <text x="196" y="186" font-size="11" fill="#b8b3ad">§2 · 모를수록 좁습니다</text>

  <rect x="40" y="198" width="268" height="40" rx="4" fill="#e8e4df"/>
  <text x="174" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#0d0d0d">TCPRoute · UDPRoute</text>
  <text x="174" y="230" text-anchor="middle" font-size="9.5" fill="#3a3632">조건 없이 · weight 만</text>

  <rect x="316" y="198" width="268" height="40" rx="4" fill="#e8e4df"/>
  <text x="450" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#0d0d0d">GRPCRoute</text>
  <text x="450" y="230" text-anchor="middle" font-size="9.5" fill="#3a3632">service · method</text>

  <rect x="592" y="198" width="276" height="40" rx="4" fill="#e8e4df"/>
  <text x="730" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#0d0d0d">확인은 status 로</text>
  <text x="730" y="230" text-anchor="middle" font-size="9.5" fill="#3a3632">규격 아닌 실측</text>

  <rect x="40" y="246" width="828" height="30" rx="4" fill="rgb(212,168,83)"/>
  <text x="454" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#0d0d0d">주의 · status 가 빕니다</text>

  <!-- 축 3 네임스페이스 -->
  <line x1="24" y1="308" x2="24" y2="424" stroke="#b8b3ad" stroke-width="2"/>
  <text x="40" y="322" font-size="12" font-weight="700" fill="#e8e4df">축 3 · 네임스페이스 참조</text>
  <text x="228" y="322" font-size="11" fill="#b8b3ad">§3 · 통신되나 참조 막힘</text>

  <rect x="40" y="334" width="410" height="40" rx="4" fill="#e8e4df"/>
  <text x="245" y="351" text-anchor="middle" font-size="11" font-weight="700" fill="#0d0d0d">Gateway 공유</text>
  <text x="245" y="366" text-anchor="middle" font-size="9.5" fill="#3a3632">allowedRoutes</text>

  <line x1="456" y1="354" x2="484" y2="354" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#ar13)"/>

  <rect x="492" y="334" width="376" height="40" rx="4" fill="#e8e4df"/>
  <text x="680" y="351" text-anchor="middle" font-size="11" font-weight="700" fill="#0d0d0d">ReferenceGrant</text>
  <text x="680" y="366" text-anchor="middle" font-size="9.5" fill="#3a3632">대상 네임스페이스에</text>

  <rect x="40" y="382" width="828" height="30" rx="4" fill="#f2d4d4"/>
  <text x="454" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#7a1f1f">위험 · YAML 은 멀쩡합니다</text>

  <!-- 축 4 mesh -->
  <line x1="24" y1="444" x2="24" y2="536" stroke="#b8b3ad" stroke-width="2"/>
  <text x="40" y="458" font-size="12" font-weight="700" fill="#e8e4df">축 4 · mesh 로 확장</text>
  <text x="192" y="458" font-size="11" fill="#b8b3ad">§4 · 진입점 다시 읽기</text>

  <rect x="40" y="470" width="380" height="52" rx="4" fill="#e8e4df"/>
  <text x="230" y="490" text-anchor="middle" font-size="11" font-weight="700" fill="#0d0d0d">north/south</text>
  <text x="230" y="507" text-anchor="middle" font-size="9.5" fill="#3a3632">parentRef 는 Gateway</text>

  <line x1="426" y1="496" x2="454" y2="496" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#ar13)"/>

  <rect x="462" y="470" width="406" height="52" rx="4" fill="#e8e4df"/>
  <text x="665" y="490" text-anchor="middle" font-size="11" font-weight="700" fill="#0d0d0d">east/west · Service</text>
  <text x="665" y="507" text-anchor="middle" font-size="9.5" fill="#3a3632">parentRef 는 Service</text>
</svg>

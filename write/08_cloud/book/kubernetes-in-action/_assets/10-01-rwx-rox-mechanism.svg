<svg viewBox="0 0 960 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>RWX와 ROX의 동작 방식</title>
  <desc>RWX는 여러 노드가 파일 스토리지에 동시에 read-write하고, ROX는 dataSourceRef로 기존 PVC를 복제해 초기화한 PV를 여러 노드가 read-only로 마운트한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .panel { font-size: 13px; font-weight: 800; fill: rgb(212,168,83); }
      .lbl   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .lbls  { font-size: 10px; fill: #0d0d0d; }
      .node  { font-size: 10px; fill: #e8e4df; }
      .pod   { font-size: 10px; font-weight: 700; fill: #0d0d0d; }
      .ok    { font-size: 11px; font-weight: 800; fill: #66bb6a; }
      .note  { font-size: 11px; font-weight: 700; fill: rgb(212,168,83); }
      .flow  { font-size: 10px; font-weight: 700; fill: rgb(212,168,83); }
    </style>
    <marker id="rx10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(91,155,213)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">RWX 와 ROX — 여러 노드 마운트의 두 방식</text>
  <text x="24" y="50" class="sub">RWX 는 스토리지 기술이 동시 쓰기를 지원해야 하고, ROX 는 빈 PV 를 쓸 수 없어 복제로 시작한다</text>

  <!-- left panel: RWX -->
  <rect x="24" y="70" width="445" height="320" rx="10" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="44" y="96" class="panel">RWX — 여러 노드가 동시에 read-write</text>

  <rect x="44" y="118" width="130" height="64" rx="8" fill="#0d0d0d" stroke="rgb(138,133,128)"/>
  <text x="56" y="134" class="node">Node A</text>
  <rect x="56" y="142" width="56" height="26" rx="6" fill="rgb(146,196,235)"/>
  <text x="84" y="159" class="pod" text-anchor="middle">Pod</text>

  <rect x="44" y="208" width="130" height="64" rx="8" fill="#0d0d0d" stroke="rgb(138,133,128)"/>
  <text x="56" y="224" class="node">Node B</text>
  <rect x="56" y="232" width="56" height="26" rx="6" fill="rgb(146,196,235)"/>
  <text x="84" y="249" class="pod" text-anchor="middle">Pod</text>

  <g transform="translate(300,150)">
    <ellipse cx="75" cy="0" rx="75" ry="14" fill="rgb(146,196,235)"/>
    <rect x="0" y="0" width="150" height="70" fill="rgb(146,196,235)"/>
    <ellipse cx="75" cy="70" rx="75" ry="14" fill="rgb(90,140,200)"/>
    <text x="75" y="30" class="lbl" text-anchor="middle">NFS 등</text>
    <text x="75" y="48" class="lbl" text-anchor="middle">파일 스토리지</text>
  </g>

  <path d="M174,150 L294,172" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#rx10)"/>
  <path d="M174,240 L294,200" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#rx10)"/>
  <text x="222" y="146" class="ok">rw</text>
  <text x="222" y="238" class="ok">rw</text>

  <text x="44" y="356" class="note">블록 스토리지 대부분은 동시 쓰기 불가 —</text>
  <text x="44" y="373" class="note">GKE 는 Filestore(파일 스토리지)를 켜야 RWX 지원</text>

  <!-- right panel: ROX -->
  <rect x="491" y="70" width="445" height="320" rx="10" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="511" y="96" class="panel">ROX — 빈 PV 는 못 쓰므로 소스에서 복제</text>

  <rect x="511" y="122" width="130" height="56" rx="8" fill="rgb(245,225,110)"/>
  <text x="576" y="145" class="lbl" text-anchor="middle">소스 PVC</text>
  <text x="576" y="162" class="lbls" text-anchor="middle">(데이터 있음)</text>

  <path d="M641,150 L756,150" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#rx10)"/>
  <text x="698" y="140" class="flow" text-anchor="middle">dataSourceRef</text>

  <rect x="760" y="122" width="130" height="56" rx="8" fill="rgb(245,225,110)"/>
  <text x="825" y="145" class="lbl" text-anchor="middle">ROX PVC</text>
  <text x="825" y="162" class="lbls" text-anchor="middle">(새 청구)</text>

  <path d="M825,178 L825,217" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#rx10)"/>
  <text x="836" y="202" class="flow">프로비저닝 시 복제</text>

  <rect x="760" y="221" width="130" height="52" rx="8" fill="rgb(245,180,140)"/>
  <text x="825" y="243" class="lbl" text-anchor="middle">새 PV</text>
  <text x="825" y="260" class="lbls" text-anchor="middle">(소스 내용으로 초기화)</text>

  <rect x="511" y="302" width="120" height="56" rx="8" fill="#0d0d0d" stroke="rgb(138,133,128)"/>
  <text x="523" y="318" class="node">Node A</text>
  <rect x="523" y="326" width="52" height="24" rx="6" fill="rgb(146,196,235)"/>
  <text x="549" y="342" class="pod" text-anchor="middle">Pod</text>

  <rect x="650" y="302" width="120" height="56" rx="8" fill="#0d0d0d" stroke="rgb(138,133,128)"/>
  <text x="662" y="318" class="node">Node B</text>
  <rect x="662" y="326" width="52" height="24" rx="6" fill="rgb(146,196,235)"/>
  <text x="688" y="342" class="pod" text-anchor="middle">Pod</text>

  <path d="M772,273 L600,298" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#rx10)"/>
  <path d="M800,273 L718,298" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#rx10)"/>
  <text x="668" y="280" class="ok">ro</text>
  <text x="774" y="292" class="ok">ro</text>

  <text x="511" y="382" class="note">복제된 PV 를 여러 노드가 read-only 로 마운트</text>
</svg>

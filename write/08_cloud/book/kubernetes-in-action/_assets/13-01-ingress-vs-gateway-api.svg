<title id="dt">규칙을 뺀 자리에 조직 경계가 들어선다</title><desc id="dd">호스트·인증서·공인 IP 는 플랫폼 팀이 정하고 몇 년을 간다. 경로가 어느 서비스로 가는지는 앱 팀이 배포마다 바꾼다. 성격이 다른 둘이 한 오브젝트에 있으면 권한을 나눌 수가 없다.</desc>
<rect width="1220" height="720" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 13-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">규칙을 뺀 자리에 조직 경계가 들어선다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">RBAC 은 오브젝트 단위라 '이 경로만'을 줄 수 없다</text>
<rect x="24" y="100" width="1172" height="240" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Ingress — 한 오브젝트 안에 다 있다</text>
<rect x="120" y="158" width="420" height="150" rx="8" fill="#161B22" stroke="#E3B341" stroke-width="1.2"/>
<text x="330" y="186" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">Ingress 하나</text>
<text x="330" y="212" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">host: api.example.com</text>
<text x="330" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">tls: secretName</text>
<text x="330" y="256" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">path /orders → orders</text>
<text x="330" y="278" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#8B98A9">path /payments → payments</text>
<rect x="770" y="175" width="180" height="54" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="860" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">orders</text>
<text x="860" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Service</text>
<path d="M 544 233 L 766 202" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="770" y="237" width="180" height="54" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="860" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">payments</text>
<text x="860" y="280" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Service</text>
<path d="M 544 233 L 766 264" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="975.0" y="220" width="210" height="26" rx="5" fill="#E3B34114" stroke="#E3B341" stroke-width="1.0"/>
<text x="1080" y="237" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">권한을 나눌 수 없다</text>
<text x="330" y="322" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">주문 팀에 수정 권한을 주면 결제 경로와 TLS 까지 열린다</text>
<rect x="24" y="364" width="1172" height="252" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="384" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">Gateway API — Route 로 뺐다</text>
<rect x="120" y="422" width="260" height="132" rx="8" fill="#161B22" stroke="#6A95D8" stroke-width="1.2"/>
<text x="250" y="450" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">Gateway</text>
<text x="250" y="472" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">플랫폼 팀</text>
<text x="250" y="500" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">host · port</text>
<text x="250" y="520" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">인증서 · 공인 IP</text>
<rect x="420" y="427" width="280" height="62" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="560" y="452" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">HTTPRoute</text>
<text x="560" y="474" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">주문 팀 · orders ns</text>
<path d="M 384 488 L 414 458" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<path d="M 702 458 L 766 458" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="770" y="431" width="180" height="54" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="860" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">orders</text>
<text x="860" y="474" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Service</text>
<rect x="420" y="495" width="280" height="62" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="560" y="520" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">HTTPRoute</text>
<text x="560" y="542" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">결제 팀 · payments ns</text>
<path d="M 384 488 L 414 526" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<path d="M 702 526 L 766 526" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="770" y="499" width="180" height="54" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="860" y="524" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">payments</text>
<text x="860" y="542" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Service</text>
<rect x="975.0" y="479" width="210" height="26" rx="5" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.0"/>
<text x="1080" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">서로 못 건드린다</text>
<text x="560" y="592" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">RBAC 경계가 조직 경계와 맞아떨어진다</text>
<text x="24" y="654" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Route 를 뺀 덕에 Gateway 가 작게 유지되고, HTTP 말고 TLS·gRPC·TCP·UDP 도 각자의 Route 로 붙는다. 네임스페이스를 넘어 Gateway 를 공유할 수도 있다.</text>
<line x1="12" y1="674" x2="1172" y2="674" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="696" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="686" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="696" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">서비스·Gateway</text>
<rect x="287" y="686" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="309" y="696" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">빼낸 자리</text>
<rect x="396" y="686" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="418" y="696" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">나눌 수 없다</text>
</svg>
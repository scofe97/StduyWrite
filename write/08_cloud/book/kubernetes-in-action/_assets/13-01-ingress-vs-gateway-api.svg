<svg viewBox="0 0 960 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Ingress와 Gateway API 리소스 비교</title>
  <desc>Ingress에서는 IngressClass·Ingress가 서비스를 직접 가리킨다. Gateway API에서는 GatewayClass·Gateway가 서비스를 직접 가리키지 않고, HTTPRoute·TLSRoute·GRPCRoute·TCPRoute·UDPRoute 같은 여러 종류의 Route 오브젝트로 서비스를 붙인다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .hdr   { font-size: 13px; font-weight: 800; fill: rgb(212,168,83); }
      .cls   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .obj   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .route { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .svc   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .note  { font-size: 10.5px; fill: #e8e4df; }
    </style>
    <marker id="ig-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Ingress vs Gateway API — 리소스 대응</text>
  <text x="24" y="50" class="sub">Ingress는 서비스를 직접 가리키지만, Gateway는 여러 종류의 Route로 서비스를 붙입니다</text>

  <!-- ===== Ingress side ===== -->
  <rect x="30" y="80" width="230" height="310" rx="10" fill="none" stroke="rgb(138,133,128)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="145" y="102" class="hdr" text-anchor="middle">Ingress</text>
  <rect x="85" y="120" width="120" height="42" rx="6" fill="rgb(221,212,240)"/>
  <text x="145" y="146" class="cls" text-anchor="middle">IngressClass</text>
  <rect x="85" y="200" width="120" height="42" rx="6" fill="rgb(180,165,230)"/>
  <text x="145" y="226" class="obj" text-anchor="middle">Ingress</text>
  <line x1="145" y1="200" x2="145" y2="164" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#ig-a)"/>
  <rect x="85" y="320" width="120" height="46" rx="6" fill="rgb(91,155,213)"/>
  <text x="145" y="348" class="svc" text-anchor="middle">Services</text>
  <line x1="145" y1="242" x2="145" y2="318" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#ig-a)"/>
  <text x="145" y="285" class="note" text-anchor="middle">서비스를 직접 가리킴</text>

  <!-- ===== Gateway API side ===== -->
  <rect x="300" y="80" width="630" height="310" rx="10" fill="none" stroke="rgb(138,133,128)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="615" y="102" class="hdr" text-anchor="middle">Gateway API</text>
  <rect x="555" y="120" width="120" height="42" rx="6" fill="rgb(221,212,240)"/>
  <text x="615" y="146" class="cls" text-anchor="middle">GatewayClass</text>
  <rect x="555" y="196" width="120" height="42" rx="6" fill="rgb(180,165,230)"/>
  <text x="615" y="222" class="obj" text-anchor="middle">Gateway</text>
  <line x1="615" y1="196" x2="615" y2="164" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#ig-a)"/>

  <!-- routes row -->
  <g fill="rgb(230,150,90)">
    <rect x="330" y="290" width="100" height="42" rx="6"/><rect x="445" y="290" width="100" height="42" rx="6"/>
    <rect x="560" y="290" width="110" height="42" rx="6"/><rect x="685" y="290" width="100" height="42" rx="6"/>
    <rect x="800" y="290" width="100" height="42" rx="6"/>
  </g>
  <text x="380" y="316" class="route" text-anchor="middle">HTTPRoute</text>
  <text x="495" y="316" class="route" text-anchor="middle">TLSRoute</text>
  <text x="615" y="316" class="route" text-anchor="middle">GRPCRoute</text>
  <text x="735" y="316" class="route" text-anchor="middle">TCPRoute</text>
  <text x="850" y="316" class="route" text-anchor="middle">UDPRoute</text>

  <!-- gateway to routes connector -->
  <line x1="615" y1="238" x2="615" y2="262" stroke="rgb(138,133,128)" stroke-width="1.6"/>
  <line x1="380" y1="262" x2="850" y2="262" stroke="rgb(138,133,128)" stroke-width="1.6"/>
  <line x1="380" y1="262" x2="380" y2="288" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ig-a)"/>
  <line x1="495" y1="262" x2="495" y2="288" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ig-a)"/>
  <line x1="615" y1="262" x2="615" y2="288" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ig-a)"/>
  <line x1="735" y1="262" x2="735" y2="288" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ig-a)"/>
  <line x1="850" y1="262" x2="850" y2="288" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ig-a)"/>

  <text x="615" y="360" class="note" text-anchor="middle">Gateway는 서비스를 직접 안 가리키고, 종류별 Route 오브젝트로 서비스를 붙입니다</text>
</svg>

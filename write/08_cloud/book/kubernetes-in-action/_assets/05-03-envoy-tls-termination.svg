<svg viewBox="0 0 960 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Envoy 사이드카의 TLS 종료 — HTTPS를 받아 평문 HTTP로 앱에 넘긴다</title>
  <desc>클라이언트가 8443으로 HTTPS 요청을 보내면 같은 Pod의 Envoy 사이드카가 받아 TLS 암호를 풀고, 평문 HTTP로 localhost:8080 의 kiada 앱에 넘긴다. kiada 는 자기가 HTTPS 를 받았다는 것을 모르고 평문으로 응답하며, Envoy 가 다시 암호화해 클라이언트에 HTTPS 로 돌려준다. 앱 코드를 전혀 고치지 않고 HTTPS 를 추가한 것이다. 두 컨테이너는 같은 네트워크 네임스페이스라 localhost 로 통신한다.</desc>
  <defs>
    <style>
      .title { font-size: 16px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 10.5px; fill: rgb(138,133,128); }
      .comp  { font-size: 12px; font-weight: 800; }
      .note  { font-size: 9.5px; fill: rgb(138,133,128); }
      .step  { font-size: 10px; font-weight: 800; fill: rgb(212,168,83); }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .podlbl{ font-size: 11px; font-weight: 800; fill: rgb(138,133,128); }
    </style>
    <marker id="are" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="arb" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="rgb(120,160,200)"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">Envoy 사이드카가 HTTPS를 대신 받아 평문으로 kiada에 넘긴다 (TLS 종료)</text>
  <text x="24" y="54" class="sub">kiada 앱은 HTTP만 안다. Envoy를 옆에 붙인 것만으로 HTTPS가 된다 — 앱 코드 0줄 수정.</text>

  <!-- 클라이언트 -->
  <rect x="24" y="150" width="150" height="90" rx="10" fill="rgb(28,30,34)" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="99" y="188" class="comp" text-anchor="middle" style="fill:#e8e4df">클라이언트</text>
  <text x="99" y="210" class="note mono" text-anchor="middle">curl -k</text>
  <text x="99" y="226" class="note mono" text-anchor="middle">https://:8443</text>

  <!-- Pod 경계 -->
  <rect x="250" y="90" width="686" height="290" rx="14" fill="rgb(16,18,22)" stroke="rgb(80,78,74)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="270" y="114" class="podlbl">kiada-ssl Pod — 두 컨테이너가 같은 네트워크 네임스페이스(localhost 공유)</text>

  <!-- Envoy 컨테이너 -->
  <rect x="286" y="140" width="270" height="180" rx="11" fill="rgb(212,168,83)" stroke="#a67c1a" stroke-width="1.4"/>
  <text x="421" y="170" class="comp" text-anchor="middle" style="fill:#0d0d0d">Envoy 사이드카</text>
  <text x="421" y="192" class="note" text-anchor="middle" style="fill:#1a1a1a">리버스 프록시</text>
  <text x="421" y="222" class="note" text-anchor="middle" style="fill:#1a1a1a">8443: HTTPS 수신 → TLS 암호 해제</text>
  <text x="421" y="244" class="note" text-anchor="middle" style="fill:#1a1a1a">평문 HTTP 로 변환</text>
  <text x="421" y="268" class="note" text-anchor="middle" style="fill:#1a1a1a">9901: admin (state=LIVE)</text>
  <text x="421" y="298" class="note mono" text-anchor="middle" style="fill:#5a3d0a">TLS 종료(termination)</text>

  <!-- kiada 컨테이너 -->
  <rect x="640" y="140" width="270" height="180" rx="11" fill="#5b9bd5" stroke="#2f6ba3" stroke-width="1.4"/>
  <text x="775" y="170" class="comp" text-anchor="middle" style="fill:#e8e4df">kiada (Node.js)</text>
  <text x="775" y="192" class="note" text-anchor="middle" style="fill:#e8e4df">8080: HTTP 만 안다</text>
  <text x="775" y="222" class="note" text-anchor="middle" style="fill:#e8e4df">"평문 요청이 왔네" 하고</text>
  <text x="775" y="240" class="note" text-anchor="middle" style="fill:#e8e4df">평문으로 응답</text>
  <text x="775" y="270" class="note" text-anchor="middle" style="fill:#e8e4df">HTTPS 받았다는 걸 모름</text>
  <text x="775" y="298" class="note mono" text-anchor="middle" style="fill:#dbe8f5">Client IP: 127.0.0.1</text>

  <!-- 화살표: 클라 → Envoy (HTTPS) -->
  <path d="M174,185 L282,185" fill="none" stroke="rgb(212,168,83)" stroke-width="3" marker-end="url(#are)"/>
  <text x="228" y="176" class="step" text-anchor="middle">① HTTPS</text>
  <text x="228" y="202" class="note" text-anchor="middle">(암호화)</text>

  <!-- 화살표: Envoy → kiada (평문 HTTP) -->
  <path d="M556,200 L636,200" fill="none" stroke="rgb(120,160,200)" stroke-width="3" marker-end="url(#arb)"/>
  <text x="596" y="190" class="step" text-anchor="middle" style="fill:rgb(120,160,200)">② 평문 HTTP</text>
  <text x="596" y="216" class="note" text-anchor="middle">localhost:8080</text>

  <!-- 화살표: kiada → Envoy (응답 평문) -->
  <path d="M636,260 L556,260" fill="none" stroke="rgb(120,160,200)" stroke-width="2" marker-end="url(#arb)" stroke-dasharray="5 3"/>
  <text x="596" y="280" class="note" text-anchor="middle">③ 평문 응답</text>

  <!-- 결과 바 -->
  <rect x="24" y="396" width="912" height="34" rx="7" fill="rgb(26,26,26)" stroke="rgb(212,168,83)" stroke-width="1"/>
  <text x="40" y="418" class="note" style="fill:#e8e4df">실측: 8080(HTTP)과 8443(HTTPS)이 완전히 같은 Kiada 응답. Client IP=127.0.0.1 → 앱에는 자기 Pod 안 Envoy가 localhost로 넘긴 것으로 보인다.</text>
</svg>

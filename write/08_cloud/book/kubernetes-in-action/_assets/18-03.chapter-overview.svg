<svg viewBox="0 0 820 540" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>18-03 전체 지도 — Job을 넓히고, 시간표에 올리기</title>
  <desc>앞 세 줄기는 Job 하나를 넓히는 이야기로, 큐에서 일을 꺼내고 파드끼리 통신하고 사이드카를 담는 방법을 나란히 놓았습니다. 점선 아래는 층위가 다른 CronJob으로, Job을 시간표에 올려 반복 실행합니다. 사이드카 줄기에는 일반 컨테이너에 두면 Job이 끝나지 않는다는 위험 표시가, CronJob 줄기에는 놓친 스케줄이 쌓이면 실행되지 않는다는 주의 표시가 붙어 있습니다.</desc>
  <rect width="820" height="540" fill="#0d0d0d"/>

  <text x="40" y="40" fill="#e8e4df" font-size="15" font-weight="700">Job을 넓히고 시간표에 올린다</text>

  <line x1="40" y1="62" x2="40" y2="330" stroke="#b8b3ad" stroke-width="2"/>

  <rect x="60" y="62" width="720" height="80" rx="4" fill="#e8e4df"/>
  <text x="80" y="88" fill="#0d0d0d" font-size="14" font-weight="700">큐에서 꺼내 쓰기</text>
  <text x="740" y="88" text-anchor="end" fill="#3a3632" font-size="11">§1</text>
  <text x="80" y="112" fill="#3a3632" font-size="12">coarse — 파드당 하나</text>
  <text x="330" y="112" fill="#3a3632" font-size="12">fine — 빌 때까지</text>
  <text x="80" y="131" fill="#3a3632" font-size="12">큐는 컨테이너가 구현한다</text>

  <rect x="60" y="156" width="720" height="66" rx="4" fill="#e8e4df"/>
  <text x="80" y="182" fill="#0d0d0d" font-size="14" font-weight="700">파드끼리 통신</text>
  <text x="740" y="182" text-anchor="end" fill="#3a3632" font-size="11">§2</text>
  <text x="80" y="206" fill="#3a3632" font-size="12">Indexed +</text>
  <text x="145" y="206" fill="#3a3632" font-size="12">headless Service</text>
  <text x="380" y="206" fill="#3a3632" font-size="12">이름을 DNS로 계산</text>

  <rect x="60" y="236" width="720" height="80" rx="4" fill="#e8e4df"/>
  <text x="80" y="262" fill="#0d0d0d" font-size="14" font-weight="700">사이드카 담기</text>
  <text x="740" y="262" text-anchor="end" fill="#3a3632" font-size="11">§3</text>
  <text x="80" y="286" fill="#3a3632" font-size="12">init에 Always</text>
  <rect x="380" y="272" width="250" height="22" rx="3" fill="#f2d4d4"/>
  <text x="392" y="287" fill="#7a1f1f" font-size="11.5" font-weight="700">위험 · 일반 컨테이너면 안 끝난다</text>
  <text x="80" y="305" fill="#3a3632" font-size="12">모든 컨테이너가 멈춰야 완료</text>

  <line x1="40" y1="348" x2="780" y2="348" stroke="#b8b3ad" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="40" y="370" fill="#b8b3ad" font-size="12">여기부터는 층위가 다르다</text>

  <rect x="40" y="384" width="740" height="120" rx="4" fill="#e8e4df"/>
  <text x="60" y="410" fill="#0d0d0d" font-size="14" font-weight="700">시간표가 Job을 만든다</text>
  <text x="740" y="410" text-anchor="end" fill="#3a3632" font-size="11">§4·§5·§6</text>
  <text x="60" y="434" fill="#3a3632" font-size="12">schedule 다섯 필드</text>
  <text x="300" y="434" fill="#3a3632" font-size="12">일·요일 OR 조건부</text>
  <text x="480" y="434" fill="#3a3632" font-size="12">jobTemplate</text>
  <text x="60" y="453" fill="#3a3632" font-size="12">concurrencyPolicy 3종</text>
  <text x="300" y="453" fill="#3a3632" font-size="12">같은 CronJob 안에서만</text>
  <rect x="480" y="439" width="250" height="22" rx="3" fill="rgb(212,168,83)"/>
  <text x="492" y="454" fill="#0d0d0d" font-size="11.5" font-weight="700">주의 · 100개 밀리면 안 돈다</text>
  <text x="60" y="472" fill="#3a3632" font-size="12">startingDeadline</text>
  <text x="172" y="472" fill="#3a3632" font-size="12">Seconds</text>
  <text x="300" y="472" fill="#3a3632" font-size="12">10초보다 짧으면 위험</text>
  <text x="60" y="491" fill="#3a3632" font-size="12">성공 3개 · 실패 1개 보존</text>
</svg>

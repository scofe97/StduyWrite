<title id="dt">ClientIP 어피니티가 붙잡는 것</title><desc id="dd">첫 연결이 파드를 고르면 출발지 IP와 그 파드의 관계가 기록되고, 같은 IP의 다음 연결이 그 기록을 탄다. 기록의 열쇠가 출발지 IP인 이유는 데이터패스가 그 아래 계층만 읽기 때문이다.</desc>

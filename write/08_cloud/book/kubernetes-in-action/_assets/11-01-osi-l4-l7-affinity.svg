<text x="434.66666666666663" y="464" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#8B98A9">기록 적중 · 시각 갱신</text>
<text x="434.66666666666663" y="485" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">고르는 단계를 건너뛴다</text>
<path d="M 376.66666666666663 518 L 597.3333333333333 518" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>

<title id="dt">ClientIP 어피니티가 붙잡는 것</title><desc id="dd">첫 연결이 파드를 고르면 출발지 IP와 그 파드의 관계가 기록되고, 같은 IP의 다음 연결이 그 기록을 타며 시각을 새로 쓴다. 기록의 열쇠가 출발지 IP인 이유는 데이터패스가 그 아래 계층만 읽기 때문이다.</desc>
<rect width="1000" height="714" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 11-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">ClientIP 어피니티가 붙잡는 것</text>

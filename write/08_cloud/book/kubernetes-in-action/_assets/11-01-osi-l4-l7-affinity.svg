<path d="M 376.66666666666663 570 L 840.0 570" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)" stroke-dasharray="6 5"/>
<text x="740" y="561" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">None 이면 다른 endpoint 로</text>
<text x="24" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">데이터패스가 읽는 것은 출발지 IP(L3)와 포트(L4)뿐이다. HTTP 쿠키는 상자 안, 곧 L7 에 있어 이 판단에 쓰이지 않는다.</text>

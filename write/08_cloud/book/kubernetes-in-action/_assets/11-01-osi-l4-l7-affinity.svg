<svg viewBox="0 0 1200 620" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>ClientIP 세션 어피니티의 첫 연결과 다음 연결 처리 흐름</title>
  <desc>같은 출발지 IP의 첫 연결은 어피니티 조회에 실패해 ready endpoint 중 파드 B를 선택하고 매핑을 저장한다. 같은 IP의 다음 새 연결은 저장된 매핑을 찾아 같은 파드 B로 간다. HTTP 쿠키는 L7 정보라 Service 데이터패스가 읽지 않는다.</desc>
  <defs>
    <style>
      .title { font-size: 28px; font-weight: 800; fill: #e8e4df; }
      .subtitle { font-size: 16px; fill: rgb(138,133,128); }
      .section { font-size: 18px; font-weight: 800; fill: rgb(212,168,83); }
      .boxTitle { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .body { font-size: 14px; fill: #e8e4df; }
      .muted { font-size: 13px; fill: rgb(138,133,128); }
      .mono { font-size: 14px; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #e8e4df; }
      .pod { font-size: 16px; font-weight: 800; fill: #0d0d0d; }
    </style>
    <marker id="gold-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#66bb6a"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#0d0d0d"/>
  <text x="48" y="52" class="title">ClientIP 어피니티는 출발지 IP와 파드를 기억합니다</text>
  <text x="48" y="82" class="subtitle">첫 연결은 파드를 고르고 매핑을 저장하며, 같은 IP의 다음 새 연결은 그 매핑을 재사용합니다.</text>

  <!-- 첫 연결 -->
  <rect x="48" y="118" width="1104" height="190" rx="14"
        fill="rgb(22,22,22)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="72" y="150" class="section">① 첫 연결 · affinity miss</text>

  <rect x="72" y="172" width="240" height="102" rx="10"
        fill="rgb(34,37,42)" stroke="rgb(42,37,32)"/>
  <text x="92" y="201" class="boxTitle">Client A</text>
  <text x="92" y="227" class="mono">src IP 203.0.113.7</text>
  <text x="92" y="252" class="muted">Cookie: session=abc · L7</text>

  <line x1="312" y1="223" x2="390" y2="223"
        stroke="rgb(212,168,83)" stroke-width="3" marker-end="url(#gold-arrow)"/>
  <text x="351" y="207" class="muted" text-anchor="middle">새 연결</text>

  <rect x="390" y="172" width="326" height="102" rx="10"
        fill="rgba(212,168,83,0.12)" stroke="rgb(212,168,83)" stroke-width="2"/>
  <text x="410" y="201" class="boxTitle">노드의 Service 데이터패스</text>
  <text x="410" y="227" class="body">key = 출발지 IP로 어피니티 조회</text>
  <text x="410" y="252" class="muted">MISS → ready endpoint 중 하나 선택</text>

  <line x1="716" y1="223" x2="794" y2="223"
        stroke="#66bb6a" stroke-width="3" marker-end="url(#green-arrow)"/>
  <text x="755" y="207" class="muted" text-anchor="middle">Pod B 선택</text>

  <rect x="794" y="172" width="164" height="102" rx="10"
        fill="#66bb6a" stroke="#66bb6a"/>
  <text x="876" y="211" class="pod" text-anchor="middle">Pod B</text>
  <text x="876" y="238" class="mono" text-anchor="middle" style="fill:#0d0d0d">10.244.2.9</text>

  <rect x="982" y="172" width="146" height="102" rx="10"
        fill="rgb(34,37,42)" stroke="rgb(212,168,83)" stroke-dasharray="6 5"/>
  <text x="1055" y="199" class="boxTitle" text-anchor="middle">어피니티 상태</text>
  <text x="1055" y="225" class="mono" text-anchor="middle">203.0.113.7</text>
  <text x="1055" y="247" class="body" text-anchor="middle">→ Pod B</text>
  <text x="1055" y="266" class="muted" text-anchor="middle">기본 10,800초</text>

  <line x1="958" y1="223" x2="976" y2="223"
        stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="5 4"
        marker-end="url(#gold-arrow)"/>

  <!-- 다음 연결 -->
  <rect x="48" y="330" width="1104" height="154" rx="14"
        fill="rgb(22,22,22)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="72" y="362" class="section">② 같은 IP의 다음 새 연결 · affinity hit</text>

  <rect x="72" y="386" width="240" height="70" rx="10"
        fill="rgb(34,37,42)" stroke="rgb(42,37,32)"/>
  <text x="92" y="414" class="boxTitle">Client A</text>
  <text x="92" y="440" class="mono">src IP 203.0.113.7</text>

  <line x1="312" y1="421" x2="390" y2="421"
        stroke="rgb(212,168,83)" stroke-width="3" marker-end="url(#gold-arrow)"/>

  <rect x="390" y="386" width="326" height="70" rx="10"
        fill="rgba(212,168,83,0.12)" stroke="rgb(212,168,83)" stroke-width="2"/>
  <text x="410" y="414" class="boxTitle">저장된 매핑 조회</text>
  <text x="410" y="440" class="body">HIT: 203.0.113.7 → Pod B</text>

  <line x1="716" y1="421" x2="794" y2="421"
        stroke="#66bb6a" stroke-width="3" marker-end="url(#green-arrow)"/>
  <text x="755" y="405" class="muted" text-anchor="middle">같은 파드</text>

  <rect x="794" y="386" width="164" height="70" rx="10"
        fill="#66bb6a" stroke="#66bb6a"/>
  <text x="876" y="429" class="pod" text-anchor="middle">Pod B 재사용</text>

  <!-- 후보와 가시성 경계 -->
  <rect x="48" y="510" width="716" height="76" rx="12"
        fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="72" y="540" class="boxTitle">ready endpoint 후보</text>
  <text x="72" y="566" class="body">Pod A · Pod B · Pod C 중 하나를 선택합니다. 한 요청을 세 파드에 복제하지 않습니다.</text>

  <rect x="788" y="510" width="364" height="76" rx="12"
        fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="812" y="540" class="boxTitle">Service가 읽지 않는 정보</text>
  <text x="812" y="566" class="muted">Cookie·경로·헤더는 L7이므로 어피니티 키가 아닙니다.</text>
</svg>

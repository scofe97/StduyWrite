<svg viewBox="0 0 960 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>베어메탈·VM·컨테이너 — 애플리케이션 3개를 돌리는 세 가지 격리 방식</title>
  <desc>같은 애플리케이션 3개를 베어메탈(격리 없음), VM 2개(App A·B는 커널 공유, C는 별도 커널), 컨테이너 3개(커널은 공유하되 서로 격리)로 돌릴 때의 차이. 격리가 강해질수록 커널이 나뉘고, 커널을 공유할수록 가볍다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .zlabel{ font-size: 12.5px; font-weight: 800; fill: rgb(212,168,83); }
      .zdesc { font-size: 10px; fill: rgb(138,133,128); }
      .app   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .kn    { font-size: 11.5px; font-weight: 800; fill: #0d0d0d; }
      .note  { font-size: 10px; fill: #e8e4df; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="400" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">애플리케이션 3개를 돌리는 세 가지 방식 — 격리와 커널의 관계</text>
  <text x="24" y="50" class="sub">왼쪽으로 갈수록 격리가 없고 가볍고, 오른쪽으로 갈수록 격리가 강하고 무겁습니다. 컨테이너는 그 중간 — 커널은 공유하되 격리는 적용합니다.</text>

  <!-- ===== 1) 베어메탈 ===== -->
  <rect x="24" y="74" width="290" height="290" rx="12" fill="rgb(24,28,32)" stroke="rgb(138,133,128)" stroke-width="1.3"/>
  <text x="42" y="98" class="zlabel">① 베어메탈 — 격리 없음</text>
  <text x="42" y="114" class="zdesc">세 앱이 한 커널을 그냥 공유. 서로 다 보임</text>

  <rect x="42" y="130" width="80" height="40" rx="6" fill="rgb(230,230,230)"/>
  <text x="82" y="155" class="app" text-anchor="middle">App A</text>
  <rect x="130" y="130" width="80" height="40" rx="6" fill="rgb(230,230,230)"/>
  <text x="170" y="155" class="app" text-anchor="middle">App B</text>
  <rect x="218" y="130" width="80" height="40" rx="6" fill="rgb(230,230,230)"/>
  <text x="258" y="155" class="app" text-anchor="middle">App C</text>

  <line x1="82" y1="170" x2="130" y2="230" stroke="rgb(138,133,128)" stroke-width="1.4"/>
  <line x1="170" y1="170" x2="170" y2="230" stroke="rgb(138,133,128)" stroke-width="1.4"/>
  <line x1="258" y1="170" x2="210" y2="230" stroke="rgb(138,133,128)" stroke-width="1.4"/>

  <rect x="42" y="230" width="256" height="42" rx="6" fill="rgb(102,187,106)"/>
  <text x="170" y="256" class="kn" text-anchor="middle">Kernel (공유, 격리 없음)</text>
  <rect x="42" y="282" width="256" height="34" rx="6" fill="#e8e4df"/>
  <text x="170" y="304" class="kn" text-anchor="middle">Physical Hardware</text>
  <text x="170" y="342" class="note" text-anchor="middle">가장 가볍지만 서로 침범 가능</text>

  <!-- ===== 2) VM 2개 ===== -->
  <rect x="335" y="74" width="290" height="290" rx="12" fill="rgb(24,28,32)" stroke="rgb(138,133,128)" stroke-width="1.3"/>
  <text x="353" y="98" class="zlabel">② VM 2개 — 커널이 나뉨</text>
  <text x="353" y="114" class="zdesc">A·B는 VM1 커널 공유, C는 VM2 별도 커널</text>

  <!-- VM1 -->
  <rect x="353" y="126" width="130" height="120" rx="8" fill="rgb(20,24,28)" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="360" y="140" class="zdesc">VM 1</text>
  <rect x="363" y="146" width="50" height="30" rx="5" fill="rgb(230,230,230)"/>
  <text x="388" y="166" class="app" text-anchor="middle">A</text>
  <rect x="421" y="146" width="50" height="30" rx="5" fill="rgb(230,230,230)"/>
  <text x="446" y="166" class="app" text-anchor="middle">B</text>
  <rect x="363" y="184" width="108" height="30" rx="5" fill="rgb(102,187,106)"/>
  <text x="417" y="204" class="kn" text-anchor="middle" font-size="10">Guest Kernel</text>
  <rect x="363" y="218" width="108" height="20" rx="4" fill="none" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="417" y="232" class="zdesc" text-anchor="middle">Virtual HW</text>

  <!-- VM2 -->
  <rect x="491" y="126" width="126" height="120" rx="8" fill="rgb(20,24,28)" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="498" y="140" class="zdesc">VM 2</text>
  <rect x="501" y="146" width="100" height="30" rx="5" fill="rgb(230,230,230)"/>
  <text x="551" y="166" class="app" text-anchor="middle">C</text>
  <rect x="501" y="184" width="100" height="30" rx="5" fill="rgb(102,187,106)"/>
  <text x="551" y="204" class="kn" text-anchor="middle" font-size="10">Guest Kernel</text>
  <rect x="501" y="218" width="100" height="20" rx="4" fill="none" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="551" y="232" class="zdesc" text-anchor="middle">Virtual HW</text>

  <rect x="353" y="254" width="264" height="26" rx="5" fill="rgb(150,130,220)"/>
  <text x="485" y="272" class="kn" text-anchor="middle" font-size="11">Hypervisor</text>
  <rect x="353" y="286" width="264" height="30" rx="5" fill="#e8e4df"/>
  <text x="485" y="306" class="kn" text-anchor="middle">Physical Hardware</text>
  <text x="485" y="342" class="note" text-anchor="middle">가장 강한 격리, 하지만 커널 2개라 무거움</text>

  <!-- ===== 3) 컨테이너 3개 ===== -->
  <rect x="646" y="74" width="290" height="290" rx="12" fill="rgb(24,28,32)" stroke="rgb(212,168,83)" stroke-width="1.4"/>
  <text x="664" y="98" class="zlabel">③ 컨테이너 3개 — 공유+격리</text>
  <text x="664" y="114" class="zdesc">커널 하나를 공유하되 서로 격리됨</text>

  <rect x="664" y="130" width="78" height="40" rx="6" fill="rgb(230,230,230)" stroke="rgb(212,168,83)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="703" y="155" class="app" text-anchor="middle">Ctr A</text>
  <rect x="750" y="130" width="78" height="40" rx="6" fill="rgb(230,230,230)" stroke="rgb(212,168,83)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="789" y="155" class="app" text-anchor="middle">Ctr B</text>
  <rect x="836" y="130" width="82" height="40" rx="6" fill="rgb(230,230,230)" stroke="rgb(212,168,83)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="877" y="155" class="app" text-anchor="middle">Ctr C</text>

  <line x1="703" y1="170" x2="750" y2="230" stroke="rgb(138,133,128)" stroke-width="1.4"/>
  <line x1="789" y1="170" x2="789" y2="230" stroke="rgb(138,133,128)" stroke-width="1.4"/>
  <line x1="877" y1="170" x2="828" y2="230" stroke="rgb(138,133,128)" stroke-width="1.4"/>

  <rect x="664" y="230" width="254" height="42" rx="6" fill="rgb(102,187,106)"/>
  <text x="791" y="256" class="kn" text-anchor="middle">Host Kernel (공유, 격리 적용)</text>
  <rect x="664" y="282" width="254" height="34" rx="6" fill="#e8e4df"/>
  <text x="791" y="304" class="kn" text-anchor="middle">Physical Hardware</text>
  <text x="791" y="342" class="note" text-anchor="middle">커널 1개로 가벼우면서 격리도 유지</text>

  <text x="480" y="388" class="sub" text-anchor="middle">점선 테두리(③)가 "커널은 공유하지만 namespace·cgroup으로 격리"를 뜻합니다 — ①의 무방비와 다릅니다</text>
</svg>

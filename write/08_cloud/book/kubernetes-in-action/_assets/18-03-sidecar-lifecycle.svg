<title id="dt">먼저 뜨고 나중에 내려간다</title><desc id="dd">사이드카는 init 컨테이너 자리에 restartPolicy: Always 로 적는다. kubelet 이 먼저 띄우고 started 만 확인한 뒤 메인을 시작하며, 메인이 끝나야 역순으로 내린다.</desc>
<rect width="1240" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 18-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">먼저 뜨고 나중에 내려간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">ready 가 아니라 started 를 본다 — 그래야 Job 이 멈추지 않는다</text>
<text x="120" y="240" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">사이드카</text>
<rect x="180" y="216" width="896.0" height="48" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="628.0" y="246" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">먼저 뜨고, 메인이 끝난 뒤에 내려간다</text>
<text x="120" y="330" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">메인</text>
<rect x="348.0" y="306" width="616.0" height="48" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="656.0" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">Job 의 일을 한다</text>
<line x1="168" y1="404" x2="1088.0" y2="404" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="180" y1="372" x2="180" y2="410" stroke="#5E6B7E" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="180" y="432" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">사이드카 시작</text>
<line x1="348.0" y1="372" x2="348.0" y2="410" stroke="#F08A59" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="348.0" y="432" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">started 확인 → 메인 시작</text>
<line x1="964.0" y1="372" x2="964.0" y2="410" stroke="#3FB98C" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="964.0" y="432" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">메인 종료</text>
<line x1="1076.0" y1="372" x2="1076.0" y2="410" stroke="#F08A59" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="1076.0" y="432" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">사이드카 종료</text>
<text x="24" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">started 만 보는 것이 요점이다. ready 를 기다렸다면 ready 가 안 되는 사이드카 하나가 Job 전체를 멈춰 세웠을 것이다.</text>
<text x="24" y="518" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">메인이 끝나도 사이드카가 계속 돌면 파드가 Completed 로 가지 못한다 — 그래서 kubelet 이 역순으로 내려 준다.</text>
<line x1="12" y1="548" x2="1192" y2="548" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="570" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="560" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">사이드카</text>
<rect x="196" y="560" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="218" y="570" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">메인</text>
</svg>
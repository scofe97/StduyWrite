<title id="dt">하나만 집고 끝나는가, 빌 때까지 집는가</title><desc id="dd">일을 미리 나누지 않고 파드가 큐에서 꺼내 쓴다. 파드 하나가 아이템 하나만 처리하고 끝나는지, 큐가 빌 때까지 계속 꺼내는지가 두 방식을 가른다.</desc>

<svg viewBox="0 0 960 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>namespace로 물리 클러스터를 여러 가상 클러스터로 분할</title>
  <desc>하나의 쿠버네티스 클러스터 안에 A팀 namespace, B팀 namespace, Alice의 namespace가 있다. 팀 A와 팀 B는 각자의 namespace에 오브젝트를 만들고, Alice는 자기 namespace와 B팀 namespace 양쪽에서 일할 수 있다 — namespace는 권한의 스코프이기도 하다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .zone   { font-size: 11px; fill: rgb(138,133,128); }
      .chip   { font-size: 11.5px; font-weight: 700; fill: #0d0d0d; }
      .actor  { font-size: 11.5px; font-weight: 700; fill: #e8e4df; }
      .note   { font-size: 10.5px; fill: #e8e4df; }
    </style>
    <marker id="a71" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="400" fill="#0d0d0d"/>
  <text x="24" y="28" class="title">namespace로 물리 클러스터를 가상 분할</text>
  <text x="24" y="46" class="sub">팀마다 자기 namespace에 오브젝트를 만들고, namespace는 이름과 권한의 스코프가 된다</text>

  <!-- Cluster box -->
  <rect x="40" y="66" width="880" height="170" rx="10" fill="rgb(20,20,20)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="480" y="88" class="zone" text-anchor="middle">Kubernetes cluster (물리 클러스터 1개)</text>

  <!-- Namespace A (blue) -->
  <rect x="64" y="100" width="256" height="116" rx="8" fill="none" stroke="rgb(138,133,128)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="82" y="116" width="100" height="42" rx="6" fill="rgb(91,155,213)"/>
  <rect x="88" y="122" width="100" height="42" rx="6" fill="rgb(174,214,241)"/>
  <text x="138" y="148" class="chip" text-anchor="middle">Pods</text>
  <rect x="200" y="116" width="100" height="42" rx="6" fill="rgb(91,155,213)"/>
  <rect x="206" y="122" width="100" height="42" rx="6" fill="rgb(174,214,241)"/>
  <text x="256" y="142" class="chip" text-anchor="middle" font-size="10">Other</text>
  <text x="256" y="155" class="chip" text-anchor="middle" font-size="10">objects</text>
  <text x="82" y="204" class="zone">A팀의 namespace</text>

  <!-- Namespace B (orange) -->
  <rect x="352" y="100" width="256" height="116" rx="8" fill="none" stroke="rgb(138,133,128)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="370" y="116" width="100" height="42" rx="6" fill="rgb(230,126,34)"/>
  <rect x="376" y="122" width="100" height="42" rx="6" fill="rgb(250,211,180)"/>
  <text x="426" y="148" class="chip" text-anchor="middle">Pods</text>
  <rect x="488" y="116" width="100" height="42" rx="6" fill="rgb(230,126,34)"/>
  <rect x="494" y="122" width="100" height="42" rx="6" fill="rgb(250,211,180)"/>
  <text x="544" y="142" class="chip" text-anchor="middle" font-size="10">Other</text>
  <text x="544" y="155" class="chip" text-anchor="middle" font-size="10">objects</text>
  <text x="370" y="204" class="zone">B팀의 namespace</text>

  <!-- Namespace Alice (green) -->
  <rect x="640" y="100" width="256" height="116" rx="8" fill="none" stroke="rgb(138,133,128)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="658" y="116" width="100" height="42" rx="6" fill="rgb(102,187,106)"/>
  <rect x="664" y="122" width="100" height="42" rx="6" fill="rgb(205,236,207)"/>
  <text x="714" y="148" class="chip" text-anchor="middle">Pods</text>
  <rect x="776" y="116" width="100" height="42" rx="6" fill="rgb(102,187,106)"/>
  <rect x="782" y="122" width="100" height="42" rx="6" fill="rgb(205,236,207)"/>
  <text x="832" y="142" class="chip" text-anchor="middle" font-size="10">Other</text>
  <text x="832" y="155" class="chip" text-anchor="middle" font-size="10">objects</text>
  <text x="658" y="204" class="zone">Alice의 namespace</text>

  <!-- Actors -->
  <circle cx="192" cy="300" r="18" fill="rgb(220,234,247)"/>
  <text x="192" y="338" class="actor" text-anchor="middle">Team A</text>
  <circle cx="480" cy="300" r="18" fill="rgb(250,211,180)"/>
  <text x="480" y="338" class="actor" text-anchor="middle">Team B</text>
  <circle cx="800" cy="300" r="18" fill="rgb(205,236,207)"/>
  <text x="800" y="338" class="actor" text-anchor="middle">Alice</text>

  <!-- arrows -->
  <line x1="192" y1="280" x2="192" y2="222" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a71)"/>
  <line x1="480" y1="280" x2="480" y2="222" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a71)"/>
  <line x1="800" y1="280" x2="775" y2="222" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a71)"/>
  <path d="M784,292 C660,280 580,250 545,222" fill="none" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a71)"/>

  <!-- notes -->
  <text x="60" y="290" class="note">팀 A는 자기 namespace에</text>
  <text x="60" y="305" class="note">오브젝트를 만든다</text>
  <text x="560" y="330" class="note">Alice는 자기 namespace와 B팀</text>
  <text x="560" y="345" class="note">namespace 양쪽에서 일할 수 있다</text>

  <text x="480" y="384" class="sub" text-anchor="middle">namespace가 이름의 스코프를 제공하므로, 서로 다른 팀이 같은 이름의 오브젝트를 만들 수 있다</text>
</svg>

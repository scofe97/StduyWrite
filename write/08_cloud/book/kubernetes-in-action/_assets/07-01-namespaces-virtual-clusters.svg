<title id="dt">물리 클러스터는 하나인데 이름 공간은 여럿이다</title><desc id="dd">namespace 는 이름과 권한의 스코프다. 스코프가 갈리므로 서로 다른 팀이 같은 이름의 오브젝트를 만들 수 있고, 사람은 자기가 닿는 namespace 에서만 일한다.</desc>
<rect width="1000" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 07-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">물리 클러스터는 하나인데 이름 공간은 여럿이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Alice 는 자기 namespace 와 B팀 namespace 양쪽에 닿는다 — 권한이 곧 스코프다</text>
<rect x="24" y="104" width="952" height="472" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">같은 이름의 오브젝트가 다른 namespace 에 있어도 부딪히지 않는다</text>
<rect x="48" y="200" width="904" height="216" rx="8" fill="#6A95D806" stroke="#6A95D8" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="64" y="191" width="246" height="18" fill="#0D1117"/>
<text x="74" y="204" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#6A95D8">Kubernetes cluster — 물리 클러스터는 하나</text>

<svg viewBox="0 0 960 620" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Pod 접근 네 방법과 kiada가 보는 Client IP</title>
  <desc>워커 노드에서 접근, 임시 클라이언트 Pod, kubectl port-forward, API 서버 프록시 네 방법의 홉 경로를 나란히 놓고 비교한다. 각 경로에서 kiada에 마지막으로 연결한 주체가 굵게 표시되며, 그 주체의 IP가 그대로 Client IP로 찍힌다. 홉이 몇 개든 kiada는 원래 요청자가 아니라 바로 앞의 연결자만 본다.</desc>
  <defs>
    <style>
      .title { font-size: 16px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 10.5px; fill: rgb(138,133,128); }
      .way   { font-size: 12px; font-weight: 800; fill: rgb(212,168,83); }
      .hop   { font-size: 10.5px; font-weight: 700; fill: #e8e4df; }
      .hopd  { font-size: 10.5px; font-weight: 800; fill: #0d0d0d; }
      .note  { font-size: 9px; fill: rgb(138,133,128); }
      .ipc   { font-size: 10.5px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #0d0d0d; }
      .lastl { font-size: 9px; font-weight: 800; fill: rgb(212,168,83); }
      .concl { font-size: 12px; font-weight: 800; fill: #0d0d0d; }
      .conclsub { font-size: 10.5px; fill: #1a1a1a; }
      .hdr   { font-size: 10px; font-weight: 800; fill: rgb(138,133,128); }
    </style>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="rgb(150,145,138)"/></marker>
    <marker id="a2" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="rgb(212,168,83)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">Pod 접근 네 방법 — 마지막으로 연결한 것이 Client IP가 됩니다</text>
  <text x="24" y="54" class="sub">홉이 몇 개 끼든 kiada는 원래 요청자를 못 봅니다. 굵은 앰버 화살표가 각 방법의 "마지막 연결자"이고, 그 IP가 그대로 찍힙니다.</text>

  <text x="24" y="86" class="hdr">방법 · 홉 경로</text>
  <text x="790" y="86" class="hdr" text-anchor="middle">kiada가 보는 Client IP</text>
  <line x1="24" y1="94" x2="936" y2="94" stroke="rgb(60,58,55)" stroke-width="1"/>

  <!-- ① 워커 노드 -->
  <text x="24" y="122" class="way">① 워커 노드에서</text>
  <rect x="150" y="106" width="128" height="34" rx="7" fill="#0d0d0d" stroke="rgb(120,115,108)" stroke-width="1.2"/>
  <text x="214" y="128" class="hop" text-anchor="middle">워커 노드</text>
  <line x1="278" y1="123" x2="352" y2="123" stroke="rgb(212,168,83)" stroke-width="2.6" marker-end="url(#a2)"/>
  <text x="315" y="111" class="lastl" text-anchor="middle">마지막</text>
  <rect x="360" y="106" width="112" height="34" rx="7" fill="rgb(212,168,83)"/>
  <text x="416" y="128" class="hopd" text-anchor="middle">kiada Pod</text>
  <rect x="690" y="106" width="200" height="34" rx="7" fill="#f5edda"/>
  <text x="790" y="128" class="ipc" text-anchor="middle">10.244.2.1 (노드·브리지)</text>

  <!-- ② 임시 클라이언트 Pod -->
  <text x="24" y="180" class="way">② 임시 클라이언트 Pod</text>
  <rect x="150" y="164" width="128" height="34" rx="7" fill="#0d0d0d" stroke="rgb(120,115,108)" stroke-width="1.2"/>
  <text x="214" y="186" class="hop" text-anchor="middle">임시 Pod</text>
  <line x1="278" y1="181" x2="352" y2="181" stroke="rgb(212,168,83)" stroke-width="2.6" marker-end="url(#a2)"/>
  <text x="315" y="169" class="lastl" text-anchor="middle">마지막</text>
  <rect x="360" y="164" width="112" height="34" rx="7" fill="rgb(212,168,83)"/>
  <text x="416" y="186" class="hopd" text-anchor="middle">kiada Pod</text>
  <rect x="690" y="164" width="200" height="34" rx="7" fill="#f5edda"/>
  <text x="790" y="186" class="ipc" text-anchor="middle">10.244.1.13 (요청 Pod)</text>

  <!-- ③ port-forward -->
  <text x="24" y="248" class="way">③ port-forward</text>
  <text x="24" y="266" class="note">홉이 가장 많습니다</text>
  <rect x="150" y="232" width="86" height="34" rx="7" fill="#0d0d0d" stroke="rgb(120,115,108)" stroke-width="1.2"/>
  <text x="193" y="254" class="hop" text-anchor="middle">내 노트북</text>
  <line x1="236" y1="249" x2="256" y2="249" stroke="rgb(150,145,138)" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="260" y="232" width="74" height="34" rx="7" fill="#0d0d0d" stroke="rgb(120,115,108)" stroke-width="1.2"/>
  <text x="297" y="254" class="hop" text-anchor="middle">API 서버</text>
  <line x1="334" y1="249" x2="354" y2="249" stroke="rgb(150,145,138)" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="358" y="232" width="74" height="34" rx="7" fill="#0d0d0d" stroke="rgb(120,115,108)" stroke-width="1.2"/>
  <text x="395" y="254" class="hop" text-anchor="middle">kubelet</text>
  <line x1="432" y1="249" x2="466" y2="249" stroke="rgb(212,168,83)" stroke-width="2.6" marker-end="url(#a2)"/>
  <text x="449" y="237" class="lastl" text-anchor="middle">마지막</text>
  <rect x="470" y="232" width="150" height="34" rx="7" fill="rgb(212,168,83)"/>
  <text x="545" y="254" class="hopd" text-anchor="middle">kiada의 loopback</text>
  <rect x="690" y="232" width="200" height="34" rx="7" fill="#f5edda"/>
  <text x="790" y="254" class="ipc" text-anchor="middle">127.0.0.1 (자기 자신)</text>

  <!-- ④ API 서버 프록시 -->
  <text x="24" y="316" class="way">④ API 서버 프록시</text>
  <rect x="150" y="300" width="86" height="34" rx="7" fill="#0d0d0d" stroke="rgb(120,115,108)" stroke-width="1.2"/>
  <text x="193" y="322" class="hop" text-anchor="middle">내 노트북</text>
  <line x1="236" y1="317" x2="256" y2="317" stroke="rgb(150,145,138)" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="260" y="300" width="74" height="34" rx="7" fill="#0d0d0d" stroke="rgb(120,115,108)" stroke-width="1.2"/>
  <text x="297" y="322" class="hop" text-anchor="middle">API 서버</text>
  <line x1="334" y1="317" x2="408" y2="317" stroke="rgb(212,168,83)" stroke-width="2.6" marker-end="url(#a2)"/>
  <text x="371" y="305" class="lastl" text-anchor="middle">마지막</text>
  <rect x="416" y="300" width="112" height="34" rx="7" fill="rgb(212,168,83)"/>
  <text x="472" y="322" class="hopd" text-anchor="middle">kiada Pod</text>
  <rect x="690" y="300" width="200" height="34" rx="7" fill="#f5edda"/>
  <text x="790" y="322" class="ipc" text-anchor="middle">172.18.0.5 (API 서버)</text>

  <line x1="24" y1="364" x2="936" y2="364" stroke="rgb(60,58,55)" stroke-width="1"/>

  <!-- 원리 -->
  <rect x="24" y="386" width="912" height="74" rx="10" fill="rgb(212,168,83)"/>
  <text x="48" y="416" class="concl">kiada가 보는 Client IP = "마지막으로 kiada에게 직접 연결을 연 그 주체"의 IP</text>
  <text x="48" y="440" class="conclsub">TCP 연결은 바로 붙은 두 끝점 사이의 것이라, 각 중계점이 다음 상대에게 자기를 클라이언트로 소개하며 새 연결을 엽니다.</text>

  <!-- 택배 비유 -->
  <rect x="24" y="482" width="912" height="112" rx="10" fill="#0d0d0d" stroke="rgb(120,115,108)" stroke-width="1.2"/>
  <text x="48" y="508" class="hop">택배 중계로 비유하면 — 친구 문 앞에 마지막으로 물건을 놓고 간 사람만 보입니다</text>
  <rect x="48" y="524" width="104" height="30" rx="7" fill="#0d0d0d" stroke="rgb(120,115,108)" stroke-width="1.2"/>
  <text x="100" y="544" class="hop" text-anchor="middle">부산(나)</text>
  <line x1="152" y1="539" x2="176" y2="539" stroke="rgb(150,145,138)" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="180" y="524" width="80" height="30" rx="7" fill="#0d0d0d" stroke="rgb(120,115,108)" stroke-width="1.2"/>
  <text x="220" y="544" class="hop" text-anchor="middle">대전</text>
  <line x1="260" y1="539" x2="284" y2="539" stroke="rgb(150,145,138)" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="288" y="524" width="80" height="30" rx="7" fill="#0d0d0d" stroke="rgb(120,115,108)" stroke-width="1.2"/>
  <text x="328" y="544" class="hop" text-anchor="middle">안양</text>
  <line x1="368" y1="539" x2="392" y2="539" stroke="rgb(150,145,138)" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="396" y="524" width="112" height="30" rx="7" fill="rgb(212,168,83)"/>
  <text x="452" y="544" class="hopd" text-anchor="middle">서울센터</text>
  <line x1="508" y1="539" x2="546" y2="539" stroke="rgb(212,168,83)" stroke-width="2.6" marker-end="url(#a2)"/>
  <text x="527" y="527" class="lastl" text-anchor="middle">마지막</text>
  <rect x="550" y="524" width="88" height="30" rx="7" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="594" y="544" class="hop" text-anchor="middle">친구</text>
  <text x="660" y="537" class="note">친구가 아는 것은 "서울센터에서 왔다"뿐입니다.</text>
  <text x="660" y="551" class="note">부산은 연결 정보에 남지 않습니다.</text>
  <text x="48" y="578" class="note">그래서 중계가 가장 많은 ③ port-forward에서 원래 요청자와 가장 멀어져, 엉뚱해 보이는 127.0.0.1이 찍힙니다.</text>
</svg>

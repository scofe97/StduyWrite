<svg viewBox="0 0 1100 580" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Pod 접근 네 방법과 kiada가 보는 Client IP</title>
  <desc>클러스터 밖에서는 Pod IP에 직접 못 닿고 네 가지 우회 방법이 있다. kiada가 보는 Client IP는 마지막으로 자기에게 직접 연결한 주체의 IP다. ① 노드가 ② 임시 Pod가 ③ kubelet이 loopback으로 ④ API 서버가 각각 마지막 연결자이므로, 그 주체의 IP가 Client IP로 찍힌다. 원래 요청자(내 노트북)는 보이지 않는다.</desc>
  <defs>
    <style>
      .title  { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .zone   { font-size: 11.5px; font-weight: 800; fill: rgb(212,168,83); }
      .box    { font-size: 12px; font-weight: 800; fill: #0d0d0d; }
      .boxd   { font-size: 12px; font-weight: 800; fill: #e8e4df; }
      .desc   { font-size: 10px; font-weight: 600; fill: #e8e4df; }
      .muted  { font-size: 9px; fill: rgb(138,133,128); }
      .ip     { font-size: 10px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .last   { font-size: 9.5px; font-weight: 800; fill: #0d0d0d; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/></marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e06666"/></marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b9bd5"/></marker>
  </defs>

  <rect x="0" y="0" width="1100" height="580" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Pod 접근 네 방법과 kiada가 보는 Client IP</text>
  <text x="24" y="50" class="sub">kiada는 원래 요청자가 아니라 "마지막으로 자기에게 직접 연결한 주체"만 본다. 그 주체의 IP가 곧 Client IP다.</text>

  <!-- 내 노트북 -->
  <text x="36" y="88" class="zone">클러스터 밖 (내 노트북)</text>
  <rect x="32" y="100" width="172" height="80" rx="10" fill="rgb(20,22,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="50" y="126" class="boxd">원래 요청자</text>
  <text x="50" y="146" class="muted">Pod IP 직접 접근 ✕</text>
  <text x="50" y="164" class="muted" style="fill:#e0a0a0">kiada엔 안 보임</text>

  <path d="M204,140 L236,140" fill="none" stroke="#e06666" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- 클러스터 -->
  <rect x="248" y="72" width="620" height="474" rx="14" fill="rgb(16,18,22)" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="266" y="94" class="zone">클러스터 내부 — 각 방법의 "마지막 연결자"</text>

  <!-- kiada Pod -->
  <rect x="892" y="250" width="180" height="120" rx="10" fill="#5b9bd5" stroke="#2f6ba3" stroke-width="1.5"/>
  <text x="982" y="282" class="boxd" text-anchor="middle" style="fill:#e8e4df">kiada Pod</text>
  <text x="982" y="302" class="ip" text-anchor="middle" style="fill:#e8e4df">10.244.2.5</text>
  <rect x="908" y="316" width="148" height="42" rx="6" fill="rgb(20,30,42)" stroke="#dbe8f5" stroke-width="1"/>
  <text x="982" y="334" class="muted" text-anchor="middle" style="fill:#dbe8f5">Client IP =</text>
  <text x="982" y="350" class="muted" text-anchor="middle" style="fill:#dbe8f5">"바로 앞 연결자"</text>

  <!-- 방법 1 -->
  <rect x="266" y="108" width="290" height="56" rx="8" fill="rgb(212,168,83)"/>
  <text x="280" y="130" class="box">① 워커 노드에서 curl</text>
  <text x="280" y="150" class="last">마지막 연결자 = 노드 →</text>
  <text x="430" y="150" class="ip" style="fill:#1a1a1a">10.244.2.1</text>
  <path d="M556,136 C700,140 780,240 890,270" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 방법 2 -->
  <rect x="266" y="176" width="290" height="56" rx="8" fill="#66bb6a"/>
  <text x="280" y="198" class="box">② 임시 클라이언트 Pod</text>
  <text x="280" y="218" class="last">마지막 연결자 = 그 Pod →</text>
  <text x="442" y="218" class="ip" style="fill:#14521d">10.244.1.13</text>
  <path d="M556,204 C700,215 790,255 890,285" fill="none" stroke="#66bb6a" stroke-width="2" marker-end="url(#arg)"/>

  <!-- 방법 3 -->
  <rect x="266" y="290" width="310" height="76" rx="8" fill="rgb(245,215,110)"/>
  <text x="280" y="312" class="box">③ port-forward</text>
  <text x="280" y="332" class="muted" style="fill:#3a3320">로컬→프록시→API→kubelet→loopback</text>
  <text x="280" y="352" class="last">마지막 연결자 = kubelet(loopback) →</text>
  <text x="500" y="352" class="ip" style="fill:#1a1a1a">127.0.0.1</text>
  <path d="M120,180 C110,430 240,440 264,350" fill="none" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="130" y="420" class="muted">밖에서 터널로 진입</text>
  <path d="M576,332 C720,320 790,300 890,308" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 방법 4 -->
  <rect x="266" y="380" width="310" height="66" rx="8" fill="#5b9bd5"/>
  <text x="280" y="402" class="boxd" style="fill:#e8e4df">④ API 서버 프록시</text>
  <text x="280" y="420" class="muted" style="fill:#dbe8f5">kubectl get --raw .../proxy/</text>
  <text x="280" y="438" class="boxd" style="fill:#e8e4df">마지막 연결자 = API 서버 → 172.18.0.5</text>
  <path d="M576,412 C720,400 800,340 890,330" fill="none" stroke="#5b9bd5" stroke-width="2" marker-end="url(#arb)"/>

  <!-- 하단 핵심 -->
  <rect x="32" y="470" width="1040" height="94" rx="10" fill="rgb(26,26,26)" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="52" y="498" class="desc" style="fill:rgb(212,168,83)">핵심 원리 — kiada가 보는 Client IP = "마지막으로 자기에게 직접 연결을 연 그 주체"의 IP</text>
  <text x="52" y="522" class="desc">중간에 프록시·터널이 몇 개 끼든 kiada는 원래 요청자(내 노트북)를 모르고, 바로 앞에서 자기에게 붙은 것만 본다.</text>
  <text x="52" y="544" class="muted">각 홉이 다음 홉에게 자기를 클라이언트로 보여주기 때문 — 그래서 경로(마지막 연결자)가 곧 Client IP를 정한다.</text>
</svg>

<title id="dt">일반 파드 — 변환과 건널목을 거친다</title><desc id="dd">노드 IP 로 들어온 패킷이 커널 규칙에서 목적지를 파드 IP 로 바꾼 뒤, veth 를 건너 그 파드만의 네트워크 네임스페이스 안에 있는 컨테이너에 닿는다.</desc>
<rect width="1220" height="600" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 17-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">일반 파드 — 변환과 건널목을 거친다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">파드가 자기 IP 를 가진다</text>
<rect x="60" y="176" width="1100" height="244" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="610" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">노드</text>
<rect x="80" y="262" width="220" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="190" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">노드 IP:30080</text>
<text x="190" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패킷이 들어온다</text>
<rect x="350" y="262" width="240" height="76" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="470" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">커널 규칙</text>
<text x="470" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">DNAT — 목적지를 바꾼다</text>

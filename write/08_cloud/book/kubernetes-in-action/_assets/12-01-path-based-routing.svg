<svg viewBox="0 0 960 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>경로 기반 라우팅 — 같은 호스트를 경로로 나눈다</title>
  <desc>api.example.com 한 호스트를 경로로 나눠, /quote는 quote 서비스로(Exact), /questions로 시작하면 quiz 서비스로(Prefix) 보낸다. 요청의 Host 헤더와 경로가 어느 서비스로 갈지 정한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .cli   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .ing   { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .svc   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .req   { font-size: 11px; fill: #e8e4df; }
      .path  { font-size: 11px; font-weight: 700; fill: rgb(212,168,83); }
    </style>
    <marker id="pr-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="320" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">경로 기반 라우팅 — 같은 호스트를 경로로 나눕니다</text>
  <text x="24" y="50" class="sub">api.example.com/quote는 quote(Exact), /questions로 시작하면 quiz(Prefix)로 갑니다</text>

  <!-- Client -->
  <rect x="40" y="150" width="120" height="52" rx="8" fill="rgb(102,187,106)"/>
  <text x="100" y="181" class="cli" text-anchor="middle">Client</text>
  <text x="45" y="130" class="req">GET /questions/random</text>
  <text x="45" y="228" class="req">Host: api.example.com</text>

  <!-- Ingress -->
  <rect x="360" y="145" width="120" height="60" rx="8" fill="rgb(150,130,220)"/>
  <text x="420" y="180" class="ing" text-anchor="middle">Ingress</text>
  <line x1="160" y1="176" x2="358" y2="176" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#pr-a)"/>

  <!-- quote svc -->
  <rect x="720" y="110" width="180" height="52" rx="8" fill="rgb(102,187,106)"/>
  <text x="810" y="141" class="svc" text-anchor="middle">Quote service</text>
  <text x="560" y="120" class="path" text-anchor="middle">api.example.com /quote</text>
  <line x1="480" y1="165" x2="718" y2="140" stroke="rgb(138,133,128)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#pr-a)"/>

  <!-- quiz svc -->
  <rect x="720" y="200" width="180" height="52" rx="8" fill="rgb(230,150,90)"/>
  <text x="810" y="231" class="svc" text-anchor="middle">Quiz service</text>
  <text x="560" y="248" class="path" text-anchor="middle">api.example.com /questions</text>
  <line x1="480" y1="188" x2="718" y2="222" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#pr-a)"/>

  <text x="480" y="295" class="sub" text-anchor="middle">이 예에서 클라이언트의 /questions/random 요청은 Prefix 매칭으로 quiz 서비스로 라우팅됩니다</text>
</svg>

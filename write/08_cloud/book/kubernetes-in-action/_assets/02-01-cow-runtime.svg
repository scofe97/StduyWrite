<svg viewBox="0 0 960 460" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>CoW 실측 — web1이 파일을 바꿔도 web2와 이미지 원본은 그대로</title>
  <desc>같은 nginx:alpine 이미지로 컨테이너 web1과 web2를 띄우고 web1에서만 index.html을 수정하면, web1은 바뀐 내용을, web2와 새 컨테이너는 원본을 본다. 수정하는 순간 그 파일만 web1의 쓰기 레이어로 복사되기 때문이다. 이미지 레이어는 읽기 전용이라 절대 바뀌지 않는다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .zlabel{ font-size: 12px; font-weight: 800; fill: rgb(212,168,83); }
      .ct    { font-size: 12.5px; font-weight: 800; fill: #0d0d0d; }
      .lyr   { font-size: 10.5px; font-weight: 700; fill: #0d0d0d; }
      .val   { font-size: 10px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .note  { font-size: 10.5px; fill: #e8e4df; }
      .cnt   { font-size: 11px; font-weight: 800; fill: rgb(212,168,83); }
      .roname{ font-size: 11px; font-weight: 800; fill: #0d0d0d; }
    </style>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="cg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">CoW 실측 — 같은 이미지, web1만 수정, web2·원본은 그대로</text>
  <text x="24" y="50" class="sub">web1에서 index.html을 바꾸는 순간 그 파일만 web1의 쓰기 레이어로 복사됩니다. 이미지 원본은 읽기 전용이라 바뀌지 않습니다.</text>

  <!-- ===== 두 컨테이너 (위) ===== -->
  <!-- web1 -->
  <rect x="60" y="76" width="250" height="150" rx="10" fill="rgb(24,28,32)" stroke="rgb(212,168,83)" stroke-width="1.4"/>
  <text x="80" y="100" class="zlabel">컨테이너 web1</text>
  <rect x="80" y="112" width="210" height="46" rx="6" fill="rgb(212,168,83)"/>
  <text x="90" y="131" class="lyr">쓰기 레이어 (web1 전용)</text>
  <rect x="90" y="136" width="190" height="18" rx="3" fill="#fdf3df"/>
  <text x="185" y="149" class="val" text-anchor="middle">index.html = "web1이 바꿈"</text>
  <text x="80" y="182" class="note" font-size="10">✎ 수정함 → CoW로 사본 생성</text>
  <text x="80" y="204" class="cnt" font-size="12">결과: "web1이 바꿈"</text>

  <!-- web2 -->
  <rect x="360" y="76" width="250" height="150" rx="10" fill="rgb(24,28,32)" stroke="rgb(138,133,128)" stroke-width="1.3"/>
  <text x="380" y="100" class="zlabel">컨테이너 web2</text>
  <rect x="380" y="112" width="210" height="46" rx="6" fill="none" stroke="rgb(138,133,128)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="390" y="131" class="note" font-size="10">쓰기 레이어 (web2 전용)</text>
  <text x="390" y="148" class="sub" font-size="10">비어 있음 — 수정 안 함</text>
  <text x="380" y="182" class="note" font-size="10">읽기전용 원본을 그대로 봄</text>
  <text x="380" y="204" class="cnt" font-size="12">결과: 원본 Welcome 페이지</text>

  <!-- 새 컨테이너 (오른쪽, 이미지 불변 증명) -->
  <rect x="660" y="76" width="240" height="150" rx="10" fill="rgb(24,28,32)" stroke="rgb(138,133,128)" stroke-width="1.3"/>
  <text x="680" y="100" class="zlabel">이후 새 컨테이너</text>
  <text x="680" y="126" class="note" font-size="10">web1이 바꾼 뒤 새로 띄워도</text>
  <text x="680" y="146" class="note" font-size="10">이미지 원본에서 시작합니다</text>
  <text x="680" y="182" class="note" font-size="10">→ 이미지는 절대 안 바뀜(immutable)</text>
  <text x="680" y="204" class="cnt" font-size="12">결과: 원본 Welcome 페이지</text>

  <!-- ===== 공유 이미지 레이어 (아래, 읽기 전용) ===== -->
  <rect x="180" y="290" width="600" height="70" rx="10" fill="rgb(102,187,106)"/>
  <text x="480" y="316" class="roname" text-anchor="middle">nginx:alpine 이미지 레이어 (읽기 전용 · RO)</text>
  <rect x="330" y="326" width="300" height="24" rx="4" fill="#e6f7e7"/>
  <text x="480" y="343" class="val" text-anchor="middle">index.html = 원본 nginx Welcome (그대로)</text>

  <!-- 화살표: web1 → CoW 복사 (앰버, 굵게) -->
  <path d="M 330 330 Q 150 290 185 160" fill="none" stroke="rgb(212,168,83)" stroke-width="2.4" marker-end="url(#c)"/>
  <text x="120" y="270" class="cnt">✎ 수정 순간</text>
  <text x="120" y="286" class="cnt">CoW 복사 ↑</text>

  <!-- 화살표: web2 → 원본 그대로 읽기 (회색) -->
  <line x1="470" y1="288" x2="470" y2="228" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#cg)"/>
  <text x="500" y="262" class="note" font-size="10">읽기만 함</text>
  <!-- 화살표: 새 컨테이너 → 원본 읽기 (회색) -->
  <line x1="700" y1="288" x2="760" y2="228" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#cg)"/>

  <text x="480" y="392" class="note" text-anchor="middle">web1의 수정은 web1 쓰기 레이어에만 있습니다 — 공유 이미지 레이어(RO)는 손대지 않습니다</text>
  <text x="480" y="414" class="cnt" text-anchor="middle">그래서 web2·새 컨테이너는 원본을 보고, 이미지는 몇 번을 수정해도 불변으로 남습니다</text>
  <text x="480" y="436" class="sub" text-anchor="middle">CoW 트리거 = "읽기 전용 파일을 수정하려는 시도" — 공유 여부와 무관하게, 건드리는 순간 그 파일만 복사됩니다</text>
</svg>

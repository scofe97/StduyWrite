<title id="dt">번호 붙은 칸과 그 위의 대장</title><desc id="dd">블록 디바이스는 같은 크기의 칸이 번호 순으로 늘어선 벽이다. 파일시스템은 그 위에 얹힌 대장으로, 어느 파일이 몇 번 칸에 있는지를 적어 둔다.</desc>
<rect width="1200" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 10-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">번호 붙은 칸과 그 위의 대장</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">리사이즈가 두 층으로 나뉘는 이유가 여기 있다</text>

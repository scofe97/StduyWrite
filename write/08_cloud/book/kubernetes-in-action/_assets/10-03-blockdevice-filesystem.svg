<svg viewBox="0 0 1120 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>블록 디바이스와 파일시스템 — 번호 매긴 사물함 벽과 그 위의 관리 대장</title>
  <desc>블록 디바이스는 디스크를 똑같은 크기의 칸으로 잘라 번호를 매긴 것이며, 번호로 읽고 쓰는 것만 알 뿐 파일 개념은 모른다. 파일시스템은 그 위에 얹은 관리 대장으로, 어떤 파일이 어느 번호 칸들에 들어 있는지·빈 칸은 어디인지·전체 크기가 얼마인지를 기록한다. 사람은 파일 이름으로 접근하고, 파일시스템이 그것을 블록 번호로 번역한다. 리사이즈가 2단계인 이유가 여기서 나온다. 블록 디바이스에 칸을 더 붙여도, 파일시스템 대장은 전체 크기를 옛 값으로 기록 중이라 늘어난 칸을 모른다. resize2fs·xfs_growfs가 대장의 크기 기록을 갱신해야 새 칸을 쓴다.</desc>
  <defs>
    <style>
      .title  { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .lane   { font-size: 13px; font-weight: 800; fill: rgb(212,168,83); }
      .laneb  { font-size: 13px; font-weight: 800; fill: #8fc0ec; }
      .desc   { font-size: 10.5px; font-weight: 600; fill: #e8e4df; }
      .muted  { font-size: 9.5px; fill: rgb(138,133,128); }
      .cell   { font-size: 10px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #1a1a1a; }
      .cellnew{ font-size: 10px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #66bb6a; }
      .ledger { font-size: 10.5px; font-weight: 700; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #14243a; }
      .note   { font-size: 10px; font-weight: 700; fill: #0d0d0d; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/></marker>
  </defs>

  <rect x="0" y="0" width="1120" height="470" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">블록 디바이스 = 번호 매긴 사물함 벽 · 파일시스템 = 그 위의 관리 대장</text>
  <text x="24" y="50" class="sub">사람은 파일 이름으로 접근하고, 파일시스템 대장이 그것을 블록 번호로 번역해 사물함 벽에서 꺼낸다.</text>

  <!-- 위: 파일시스템 대장 -->
  <text x="40" y="90" class="lane">파일시스템 (ext4 · xfs) — 관리 대장</text>
  <rect x="40" y="100" width="700" height="118" rx="12" fill="#d4a853"/>
  <text x="60" y="126" class="note">"파일이 어느 칸에 있나 · 빈 칸은 어디 · 전체 크기는 얼마"를 기록</text>
  <rect x="60" y="138" width="300" height="64" rx="7" fill="#fdf3df"/>
  <text x="72" y="158" class="ledger">이력서.pdf → 5, 6, 7번 칸</text>
  <text x="72" y="176" class="ledger">사진.jpg  → 8번 칸</text>
  <text x="72" y="194" class="ledger">빈 칸: 9 ~ 100</text>
  <rect x="376" y="138" width="344" height="64" rx="7" fill="#fdf3df"/>
  <text x="388" y="162" class="ledger">전체 크기 = 100칸  ← 여기가 stale</text>
  <text x="388" y="184" class="ledger">디바이스가 커져도 스스로 모름</text>

  <!-- 사람 접근 화살표 -->
  <text x="770" y="150" class="desc" style="fill:rgb(212,168,83)">사람: "이력서.pdf 열어"</text>
  <text x="770" y="172" class="muted">→ 대장이 5·6·7번으로 번역</text>
  <line x1="740" y1="160" x2="766" y2="160" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 번역 화살표 (대장 → 벽) -->
  <line x1="200" y1="218" x2="200" y2="262" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="212" y="244" class="muted" style="fill:rgb(212,168,83)">번호로 read/write</text>

  <!-- 아래: 블록 디바이스 사물함 벽 -->
  <text x="40" y="292" class="laneb">블록 디바이스 (클라우드 디스크 · LVM) — 번호 매긴 사물함 벽</text>
  <rect x="40" y="302" width="1040" height="118" rx="12" fill="rgb(16,18,22)" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="60" y="326" class="desc" style="fill:#8fc0ec">아는 명령은 둘뿐 — "N번 칸에 써 / N번 칸 읽어". 파일이 뭔지는 모른다.</text>

  <!-- 기존 칸 0~7 (파랑) -->
  <g>
    <rect x="60" y="340" width="52" height="52" rx="5" fill="#5b9bd5"/><text x="86" y="371" class="cell" text-anchor="middle" style="fill:#e8e4df">0</text>
    <rect x="118" y="340" width="52" height="52" rx="5" fill="#5b9bd5"/><text x="144" y="371" class="cell" text-anchor="middle" style="fill:#e8e4df">1</text>
    <rect x="176" y="340" width="52" height="52" rx="5" fill="#5b9bd5"/><text x="202" y="371" class="cell" text-anchor="middle" style="fill:#e8e4df">…</text>
    <rect x="234" y="340" width="52" height="52" rx="5" fill="#dceaf7"/><text x="260" y="371" class="cell" text-anchor="middle">5</text>
    <rect x="292" y="340" width="52" height="52" rx="5" fill="#dceaf7"/><text x="318" y="371" class="cell" text-anchor="middle">6</text>
    <rect x="350" y="340" width="52" height="52" rx="5" fill="#dceaf7"/><text x="376" y="371" class="cell" text-anchor="middle">7</text>
    <rect x="408" y="340" width="52" height="52" rx="5" fill="#5b9bd5"/><text x="434" y="371" class="cell" text-anchor="middle" style="fill:#e8e4df">8</text>
    <rect x="466" y="340" width="52" height="52" rx="5" fill="#5b9bd5"/><text x="492" y="371" class="cell" text-anchor="middle" style="fill:#e8e4df">…</text>
    <rect x="524" y="340" width="66" height="52" rx="5" fill="#5b9bd5"/><text x="557" y="371" class="cell" text-anchor="middle" style="fill:#e8e4df">100</text>
  </g>
  <text x="260" y="410" class="muted" text-anchor="middle" style="fill:#c9def5">연한 칸(5·6·7) = 이력서.pdf가 실제로 든 곳</text>

  <!-- 확장분 칸 (초록, 점선 경계) -->
  <line x1="600" y1="366" x2="626" y2="366" stroke="#66bb6a" stroke-width="2.5" marker-end="url(#arg)"/>
  <g>
    <rect x="632" y="340" width="52" height="52" rx="5" fill="rgb(20,22,26)" stroke="#66bb6a" stroke-width="1.3" stroke-dasharray="4 3"/><text x="658" y="371" class="cellnew" text-anchor="middle">101</text>
    <rect x="690" y="340" width="52" height="52" rx="5" fill="rgb(20,22,26)" stroke="#66bb6a" stroke-width="1.3" stroke-dasharray="4 3"/><text x="716" y="371" class="cellnew" text-anchor="middle">…</text>
    <rect x="748" y="340" width="66" height="52" rx="5" fill="rgb(20,22,26)" stroke="#66bb6a" stroke-width="1.3" stroke-dasharray="4 3"/><text x="781" y="371" class="cellnew" text-anchor="middle">1000</text>
  </g>
  <text x="722" y="410" class="muted" text-anchor="middle" style="fill:#66bb6a">A층이 붙인 새 칸 — 대장이 아직 몰라 못 씀</text>

  <!-- 우측 결론 -->
  <rect x="838" y="336" width="228" height="60" rx="8" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="952" y="360" class="muted" text-anchor="middle" style="fill:#e8e4df">resize2fs · xfs_growfs 가</text>
  <text x="952" y="378" class="muted" text-anchor="middle" style="fill:#e8e4df">대장의 "전체 크기"를 갱신해야</text>
  <text x="952" y="392" class="muted" text-anchor="middle" style="fill:#66bb6a">101~1000칸을 비로소 사용</text>

  <text x="24" y="448" class="muted">한계: 이 비유는 "칸↔파일 매핑·크기 기록" 구조까지 유효하다. 저널링·inode·단편화 같은 파일시스템 내부 최적화는 사물함 비유로 표현되지 않는다.</text>
</svg>

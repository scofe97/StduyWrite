<svg viewBox="0 0 960 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>HTTPRoute는 게이트웨이와 서비스를 잇는다</title>
  <desc>HTTPRoute는 parentRefs로 하나 이상의 게이트웨이를 부모로 참조하고, backendRefs로 하나 이상의 서비스를 백엔드로 참조한다. 게이트웨이가 받은 트래픽을 rule에 따라 서비스로 라우팅한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .gw    { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .rt    { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .svc   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .fld   { font-size: 12px; font-weight: 700; fill: rgb(212,168,83); font-family: 'JetBrains Mono', monospace; }
      .note  { font-size: 11px; fill: #e8e4df; }
    </style>
    <marker id="hp-a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="300" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">HTTPRoute — parentRefs로 게이트웨이, backendRefs로 서비스</text>
  <text x="24" y="50" class="sub">하나 이상의 게이트웨이(부모)와 하나 이상의 서비스(백엔드)를 잇습니다</text>

  <!-- Gateways (stacked) -->
  <rect x="70" y="150" width="150" height="60" rx="8" fill="rgb(180,165,230)"/>
  <rect x="60" y="140" width="150" height="60" rx="8" fill="rgb(180,165,230)"/>
  <rect x="50" y="130" width="150" height="60" rx="8" fill="rgb(180,165,230)"/>
  <text x="125" y="165" class="gw" text-anchor="middle">Gateways</text>
  <text x="125" y="110" class="note" text-anchor="middle">부모(parent)</text>

  <!-- HTTPRoute -->
  <rect x="400" y="130" width="160" height="60" rx="8" fill="rgb(230,150,90)"/>
  <text x="480" y="165" class="rt" text-anchor="middle">HTTPRoute</text>

  <!-- Services (stacked) -->
  <rect x="770" y="150" width="150" height="60" rx="8" fill="rgb(91,155,213)"/>
  <rect x="760" y="140" width="150" height="60" rx="8" fill="rgb(91,155,213)"/>
  <rect x="750" y="130" width="150" height="60" rx="8" fill="rgb(91,155,213)"/>
  <text x="825" y="165" class="svc" text-anchor="middle">Services</text>
  <text x="825" y="110" class="note" text-anchor="middle">백엔드(backend)</text>

  <!-- connectors -->
  <line x1="200" y1="160" x2="398" y2="160" stroke="rgb(138,133,128)" stroke-width="2" marker-end="url(#hp-a)"/>
  <text x="300" y="150" class="fld" text-anchor="middle">parentRefs</text>
  <line x1="560" y1="160" x2="748" y2="160" stroke="rgb(138,133,128)" stroke-width="2" marker-end="url(#hp-a)"/>
  <text x="655" y="150" class="fld" text-anchor="middle">backendRefs</text>

  <text x="480" y="255" class="note" text-anchor="middle">게이트웨이가 받은 트래픽을 hostname·rule로 매칭해 backendRefs의 서비스로 보냅니다</text>
</svg>

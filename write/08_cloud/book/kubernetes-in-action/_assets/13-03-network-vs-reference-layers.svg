<svg viewBox="0 0 1120 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>네트워크 통신과 오브젝트 참조는 다른 층</title>
  <desc>네임스페이스를 넘는 두 가지 일을 층으로 갈라 보여 준다. 층 1인 파드 간 네트워크 통신은 네임스페이스가 달라도 그냥 된다. flat 네트워크라 FQDN으로 호출하면 흐른다. 층 2인 오브젝트 간 참조는 기본적으로 안 된다. HTTPRoute가 다른 네임스페이스의 서비스를 backendRefs로 가리키면 허가가 없는 한 거부된다. 그래서 트래픽이 흐르지 않는 이유는 네트워크가 막혀서가 아니라 참조 권한이 없어서다.</desc>
  <defs>
    <style>
      .h1   { font-size: 24px; font-weight: 800; fill: #e8e4df; }
      .sub  { font-size: 15px; fill: #b8b3ad; }
      .tag  { font-size: 12.5px; font-weight: 800; fill: #0d0d0d; }
      .monod{ font-size: 11.5px; font-weight: 700; fill: #e8e4df; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .who  { font-size: 12.5px; fill: #e8e4df; }
      .body { font-size: 14px; fill: #e8e4df; }
      .bad  { font-size: 13px; fill: rgb(240,150,190); }
      .good { font-size: 13px; fill: rgb(102,187,106); }
    </style>
    <marker id="nl-g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(102,187,106)"/>
    </marker>
    <marker id="nl-p" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(240,150,190)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="360" fill="#0d0d0d"/>

  <text x="30" y="40" class="h1">막혀서 안 흐르는 게 아니라, 허가가 없어서 안 흐릅니다</text>
  <text x="30" y="66" class="sub">"네임스페이스가 달라도 통신은 되잖아"는 맞는 말입니다 — 다만 다른 층 이야기입니다.</text>

  <!-- 층 1: 네트워크 -->
  <rect x="30" y="94" width="520" height="188" rx="12" fill="rgb(22,22,22)" stroke="rgb(102,187,106)" stroke-width="1.8"/>
  <text x="52" y="122" class="body" font-weight="700" style="fill:rgb(102,187,106)">층 1 · 파드 간 네트워크 통신</text>
  <text x="52" y="144" class="who">네임스페이스를 넘나 — <tspan font-weight="700" fill="rgb(102,187,106)">됩니다</tspan></text>

  <rect x="52" y="160" width="150" height="42" rx="6" fill="rgb(91,155,213)"/>
  <text x="127" y="186" class="tag" text-anchor="middle">team-a 파드</text>
  <line x1="208" y1="181" x2="352" y2="181" stroke="rgb(102,187,106)" stroke-width="2.4" marker-end="url(#nl-g)"/>
  <text x="280" y="173" class="good" style="font-size:11px" text-anchor="middle">그냥 흐릅니다</text>
  <rect x="360" y="160" width="168" height="42" rx="6" fill="rgb(91,155,213)"/>
  <text x="444" y="186" class="tag" text-anchor="middle">team-b 서비스</text>

  <rect x="52" y="216" width="476" height="48" rx="7" fill="rgba(102,187,106,0.12)" stroke="rgb(102,187,106)" stroke-width="1.2"/>
  <text x="66" y="236" class="monod" style="font-size:10.5px">curl http://some-service.team-b.svc.cluster.local</text>
  <text x="66" y="256" class="who">11-01의 flat 네트워크 — FQDN으로 부르면 닿습니다</text>

  <!-- 층 2: 오브젝트 참조 -->
  <rect x="570" y="94" width="520" height="188" rx="12" fill="rgb(22,22,22)" stroke="rgb(240,150,190)" stroke-width="1.8"/>
  <text x="592" y="122" class="body" font-weight="700" style="fill:rgb(240,150,190)">층 2 · 오브젝트 간 참조</text>
  <text x="592" y="144" class="who">네임스페이스를 넘나 — <tspan font-weight="700" fill="rgb(240,150,190)">기본은 안 됩니다</tspan></text>

  <rect x="592" y="160" width="160" height="42" rx="6" fill="rgb(212,168,83)"/>
  <text x="672" y="186" class="tag" text-anchor="middle">HTTPRoute</text>
  <line x1="758" y1="181" x2="892" y2="181" stroke="rgb(240,150,190)" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#nl-p)"/>
  <text x="825" y="173" class="bad" style="font-size:11px" text-anchor="middle">거부됩니다</text>
  <rect x="900" y="160" width="170" height="42" rx="6" fill="rgb(91,155,213)"/>
  <text x="985" y="186" class="tag" text-anchor="middle">team-b 서비스</text>

  <rect x="592" y="216" width="478" height="48" rx="7" fill="rgba(240,150,190,0.12)" stroke="rgb(240,150,190)" stroke-width="1.2"/>
  <text x="606" y="236" class="monod" style="font-size:10.5px">backendRefs: [{name: some-service, namespace: team-b}]</text>
  <text x="606" y="256" class="who">허가(ReferenceGrant)가 있어야 해석됩니다</text>

  <text x="30" y="320" class="sub">막힌 것은 네트워크가 아니라 참조 권한입니다. 허가를 누가 내주는지는 다음 그림에서 봅니다.</text>
</svg>

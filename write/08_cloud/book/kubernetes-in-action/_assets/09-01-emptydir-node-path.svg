<svg viewBox="0 0 920 500" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>emptyDir 볼륨의 노드 저장 위치와 마운트</title>
  <desc>워커 노드 k8s-lab-worker의 파일시스템 디렉터리 트리에서 emptyDir 디렉터리가 mongo 컨테이너의 /data/db에 마운트되어, 두 곳이 같은 실체를 보여준다. 경로 조각은 각각 파드 UID, 볼륨 타입, spec.volumes 이름에 대응한다.</desc>

  <rect x="0" y="0" width="920" height="500" fill="#0d0d0d"/>
  <text x="30" y="38" fill="rgb(212,168,83)" font-size="16" font-weight="700">emptyDir는 노드의 한 디렉터리 — 컨테이너에 마운트되어 같은 실체를 본다</text>

  <!-- 왼쪽: 노드 파일시스템 트리 -->
  <rect x="30" y="60" width="500" height="400" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="46" y="87" fill="rgb(212,168,83)" font-size="13" font-weight="700">워커 노드  k8s-lab-worker  파일시스템</text>

  <!-- 폴더 트리: 세로 연결선(│) + ├└ 로 실제 tree 출력처럼 -->
  <!-- depth0 -->
  <text x="50" y="118" fill="#e8e4df" font-family="'JetBrains Mono',monospace" font-size="12.5">📁 /var/lib/kubelet/pods/</text>
  <!-- 세로 연결선 depth1 -->
  <line x1="66" y1="124" x2="66" y2="150" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <line x1="66" y1="150" x2="80" y2="150" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <text x="86" y="155" fill="#5b9bd5" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="700">📁 74bf7b10-…-006a3a4ffaad/</text>
  <!-- depth2 -->
  <line x1="102" y1="161" x2="102" y2="187" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <line x1="102" y1="187" x2="116" y2="187" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <text x="122" y="192" fill="#e8e4df" font-family="'JetBrains Mono',monospace" font-size="12.5">📁 volumes/</text>
  <!-- depth3 -->
  <line x1="138" y1="198" x2="138" y2="224" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <line x1="138" y1="224" x2="152" y2="224" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <text x="158" y="229" fill="#66bb6a" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="700">📁 kubernetes.io~empty-dir/</text>
  <!-- depth4 -->
  <line x1="174" y1="235" x2="174" y2="261" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <line x1="174" y1="261" x2="188" y2="261" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <text x="194" y="266" fill="rgb(212,168,83)" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="700">📁 quiz-data/</text>

  <!-- depth5: 실제 파일들 (quiz-data 아래로 매달림) -->
  <line x1="210" y1="272" x2="210" y2="430" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <!-- 파일 칩 (연베이지 밝은 칩 → 어두운 글자) -->
  <rect x="224" y="284" width="286" height="120" rx="5" fill="#f5edda" stroke="rgb(42,37,32)"/>
  <text x="236" y="305" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="11">📄 WiredTiger      📄 WiredTiger.wt</text>
  <text x="236" y="326" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="11">📄 WiredTiger.lock  📄 _mdb_catalog.wt</text>
  <text x="236" y="347" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="11">📄 collection-5b3e9bdf-….wt</text>
  <text x="236" y="368" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="11">📄 index-….wt   📄 sizeStorer.wt</text>
  <text x="236" y="392" style="fill:#7a1f1f" font-size="10.5" font-weight="700">↑ UUID 파일명까지 컨테이너와 완전 일치</text>
  <!-- 파일 칩으로 잇는 가지 -->
  <line x1="210" y1="344" x2="222" y2="344" stroke="rgb(90,85,78)" stroke-width="1.5"/>

  <!-- 경로 조각 대응 주석 -->
  <text x="50" y="442" font-size="10.5" style="fill:#e8e4df"><tspan style="fill:#5b9bd5">UID</tspan>=metadata.uid   ·   <tspan style="fill:#66bb6a">empty-dir</tspan>=볼륨 타입   ·   <tspan style="fill:rgb(212,168,83)">quiz-data</tspan>=spec.volumes 이름</text>

  <!-- mount 화살표 -->
  <line x1="530" y1="330" x2="628" y2="330" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#am)"/>
  <text x="579" y="320" fill="rgb(212,168,83)" font-size="12" font-weight="700" text-anchor="middle">mount</text>
  <text x="579" y="348" fill="#e8e4df" font-size="10" text-anchor="middle">같은 실체</text>
  <defs><marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="rgb(212,168,83)"/></marker></defs>

  <!-- 오른쪽: mongo 컨테이너 -->
  <rect x="648" y="220" width="250" height="220" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="663" y="246" fill="#66bb6a" font-size="13" font-weight="700">mongo 컨테이너</text>
  <rect x="663" y="260" width="220" height="46" rx="4" fill="#cdeccf" stroke="rgb(42,37,32)"/>
  <text x="675" y="280" style="fill:#14521d" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">📁 /data/db</text>
  <text x="675" y="298" style="fill:#14521d" font-size="10">volumeMounts.mountPath</text>
  <text x="663" y="334" fill="#e8e4df" font-size="11">여기 ls 결과가 왼쪽</text>
  <text x="663" y="353" fill="#e8e4df" font-size="11">노드 디렉터리 ls와 동일</text>
  <text x="663" y="387" fill="#e8e4df" font-size="11">→ 한 디렉터리를 노드와</text>
  <text x="663" y="406" fill="#e8e4df" font-size="11">컨테이너 두 곳에서 본다</text>

  <text x="30" y="486" fill="#e8e4df" font-size="11.5">emptyDir는 마법의 저장소가 아니라 노드의 평범한 디렉터리다 — 그래서 파드 삭제(디렉터리 삭제)를 넘지 못한다.</text>
</svg>

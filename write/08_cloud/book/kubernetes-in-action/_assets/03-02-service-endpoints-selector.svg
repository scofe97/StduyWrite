<title id="dt">라벨이 붙는 순간 Endpoints 가 스스로 늘어난다</title><desc id="dd">Service 는 고정 IP 를 가진 이름표이고, app=kiada 라벨을 가진 Pod 를 스스로 찾아 Endpoints 에 등록한다. Pod 가 바뀌면 그 목록만 갱신되고 ClusterIP 는 그대로다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 03-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">라벨이 붙는 순간 Endpoints 가 스스로 늘어난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Service 를 건드리지 않았는데 새 Pod 가 라벨을 갖자마자 목록에 들어왔다</text>
<rect x="24" y="104" width="952" height="480" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">클라이언트가 아는 것은 ClusterIP 하나뿐이고, 뒤의 목록이 바뀌어도 그대로다</text>
<rect x="30" y="270" width="240" height="120" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="150" y="312" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">Service: kiada</text>
<text x="150" y="334" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10.96.154.45</text>
<text x="150" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">이 IP 는 안 바뀐다</text>
<text x="150" y="412" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">셀렉터  app=kiada</text>
<rect x="360" y="226" width="280" height="208" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="500" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">Endpoints — 자동 갱신</text>
<text x="500" y="294" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">10.244.1.8:8080</text>
<text x="500" y="324" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">10.244.1.9:8080</text>
<text x="500" y="354" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">10.244.2.5:8080</text>
<text x="500" y="408" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">Pod 가 늘거나 죽으면 이 목록만 바뀐다</text>
<rect x="730" y="204" width="230" height="84" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="845" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">kiada-…-bhgc5</text>
<text x="845" y="250" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10.244.1.8</text>
<text x="845" y="272" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">app=kiada · worker 노드</text>
<rect x="730" y="302" width="230" height="84" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="845" y="326" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">kiada-…-8phwt</text>
<text x="845" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10.244.1.9</text>
<text x="845" y="370" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">app=kiada · worker 노드</text>
<rect x="730" y="400" width="230" height="84" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="845" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">kiada-…-2vm7s</text>
<text x="845" y="446" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">10.244.2.5</text>
<text x="845" y="468" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">app=kiada · worker2 노드</text>
<path d="M 276 330 L 350 330" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<rect x="289.5" y="321" width="47.0" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="313" y="334" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">라벨로</text>
<path d="M 646 330 L 690 330" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 690 246 L 690 442" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 690 246 L 720 246" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 690 344 L 720 344" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 690 442 L 720 442" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="36" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">스케일하자 세 Pod 의 IP 를 Service 가 스스로 물었다 — Endpoints 가 자동으로 늘어난 것이다.</text>
<text x="36" y="544" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그중 하나는 다른 노드(worker2)에 있었다 — 라벨만 맞으면 노드는 상관하지 않는다.</text>
<line x1="12" y1="600" x2="952" y2="600" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="622" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="612" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">고정 진입점</text>
<rect x="222" y="612" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="244" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">자동 갱신되는 목록</text>
<rect x="396" y="612" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="418" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">라벨을 가진 Pod</text>
</svg>
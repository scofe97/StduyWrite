<svg viewBox="0 0 900 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>볼륨이 컨테이너 재시작을 넘어 데이터를 보존하는 원리</title>
  <desc>이전 컨테이너가 종료되고 새 컨테이너로 교체될 때, 볼륨은 파드 생애주기에 묶여 그대로 남는다. 새 컨테이너에 같은 볼륨이 다시 마운트되어 이전 데이터에 이어서 접근한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .zone  { font-size: 11px; fill: rgb(138,133,128); }
      .ctnr  { font-size: 12px; font-weight: 700; fill: #e8e4df; }
      .path  { font-size: 11px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .step  { font-size: 12px; font-weight: 700; fill: rgb(212,168,83); }
      .cyl   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
    </style>
    <marker id="mv1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(146,196,235)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="380" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">볼륨은 컨테이너 재시작을 넘어 데이터를 보존한다</text>
  <text x="24" y="50" class="sub">볼륨의 생애주기는 개별 컨테이너가 아니라 파드에 묶인다 — 컨테이너가 교체돼도 볼륨은 그대로</text>

  <!-- Pod box -->
  <rect x="40" y="76" width="820" height="270" rx="12" fill="rgb(20,20,20)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="60" y="98" class="zone">Pod</text>

  <!-- previous container (terminated) -->
  <rect x="80" y="120" width="230" height="90" rx="8" fill="rgb(26,26,26)" stroke="rgb(138,133,128)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="195" y="146" class="ctnr" text-anchor="middle" fill="rgb(138,133,128)">이전 컨테이너 (종료)</text>
  <rect x="120" y="160" width="150" height="34" rx="5" fill="rgb(60,60,60)"/>
  <text x="195" y="182" class="path" text-anchor="middle" fill="rgb(160,160,160)">/var/data</text>
  <line x1="80" y1="120" x2="310" y2="210" stroke="rgb(200,80,80)" stroke-width="2"/>
  <line x1="310" y1="120" x2="80" y2="210" stroke="rgb(200,80,80)" stroke-width="2"/>
  <text x="195" y="235" class="step" text-anchor="middle">① 이전 컨테이너 종료</text>

  <!-- new container -->
  <rect x="590" y="120" width="230" height="90" rx="8" fill="rgb(26,26,26)" stroke="rgb(91,155,213)" stroke-width="2"/>
  <text x="705" y="146" class="ctnr" text-anchor="middle">새 컨테이너</text>
  <rect x="630" y="160" width="150" height="34" rx="5" fill="rgb(146,196,235)"/>
  <text x="705" y="182" class="path" text-anchor="middle">/var/data</text>
  <text x="705" y="235" class="step" text-anchor="middle">② 새 컨테이너로 교체</text>

  <!-- volume cylinder (center) -->
  <g transform="translate(400,140)">
    <ellipse cx="50" cy="0" rx="50" ry="14" fill="rgb(146,196,235)"/>
    <rect x="0" y="0" width="100" height="60" fill="rgb(146,196,235)"/>
    <ellipse cx="50" cy="60" rx="50" ry="14" fill="rgb(120,175,220)"/>
    <text x="50" y="36" class="cyl" text-anchor="middle">Volume</text>
  </g>
  <text x="450" y="235" class="step" text-anchor="middle">③ 같은 볼륨을 다시 마운트</text>

  <!-- arrows volume to new container -->
  <path d="M500,170 L628,177" fill="none" stroke="rgb(146,196,235)" stroke-width="2.5" marker-end="url(#mv1)"/>
  <!-- restart curved arrow -->
  <path d="M310,165 C355,120 355,120 400,150" fill="none" stroke="rgb(138,133,128)" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="355" y="112" class="zone" text-anchor="middle" font-size="10">재시작 = 재생성</text>

  <text x="450" y="290" class="step" text-anchor="middle" font-size="12.5">④ 새 컨테이너의 프로세스가 이전 컨테이너가 볼륨에 쓴 파일을 그대로 읽는다</text>
  <text x="450" y="322" class="sub" text-anchor="middle">파일이 컨테이너 파일시스템이 아니라 볼륨에 있어, 컨테이너가 교체돼도 살아남는다</text>
</svg>

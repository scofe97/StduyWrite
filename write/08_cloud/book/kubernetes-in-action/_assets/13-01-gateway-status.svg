<svg viewBox="0 0 960 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Gateway status의 세 층</title>
  <desc>Gateway status는 세 부분으로 나뉜다. addresses는 게이트웨이에 배정된 주소, conditions는 Gateway 전체의 Accepted·Programmed 조건, listeners는 각 listener의 attachedRoutes 수와 supportedKinds, conditions다. attachedRoutes가 0이면 연결된 Route가 없어 404가 난다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .layer { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .k     { font-size: 11px; font-weight: 700; fill: rgb(212,168,83); }
      .v     { font-size: 11px; fill: #e8e4df; }
      .ok    { font-size: 11px; font-weight: 700; fill: rgb(102,187,106); }
      .warn  { font-size: 11px; font-weight: 700; fill: rgb(240,150,190); }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="400" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Gateway status — 세 층으로 준비를 진단합니다</text>
  <text x="24" y="50" class="sub">배정 주소 → Gateway 전체 조건 → listener별 상태. attachedRoutes가 0이면 404</text>

  <!-- Layer 1: addresses -->
  <rect x="40" y="80" width="880" height="70" rx="8" fill="rgb(91,155,213)"/>
  <text x="60" y="104" class="layer" style="fill:#e8e4df">① status.addresses</text>
  <text x="60" y="128" class="v" style="fill:#e8e4df">type: IPAddress · value: 172.18.255.200 — 게이트웨이에 배정된 주소(spec과 다를 수 있음, 자동 배정)</text>

  <!-- Layer 2: conditions -->
  <rect x="40" y="165" width="880" height="90" rx="8" fill="rgb(212,168,83)"/>
  <text x="60" y="189" class="layer">② status.conditions (Gateway 전체)</text>
  <text x="60" y="214" class="v" fill="#0d0d0d">Accepted: True (게이트웨이가 받아들임) · Programmed: True (설정 생성돼 접근 가능해짐)</text>
  <text x="60" y="236" class="v" fill="#0d0d0d">type을 먼저 보고 status 확인 → False면 reason·message로 이유. Ready는 예약, Scheduled는 deprecated</text>

  <!-- Layer 3: listeners -->
  <rect x="40" y="270" width="880" height="105" rx="8" fill="rgb(102,187,106)"/>
  <text x="60" y="294" class="layer">③ status.listeners (listener별)</text>
  <text x="60" y="318" class="v" fill="#0d0d0d">name: http · supportedKinds: [HTTPRoute] · conditions: Accepted·Conflicted·Programmed·Ready·ResolvedRefs</text>
  <text x="60" y="342" class="warn" fill="#7a1f3a">attachedRoutes: 0 → 연결된 Route 없음 → 접속 시 404 Not Found</text>
  <text x="60" y="364" class="v" fill="#0d0d0d">Route를 만들어 붙이면 attachedRoutes가 오르고 트래픽이 흐릅니다</text>
</svg>

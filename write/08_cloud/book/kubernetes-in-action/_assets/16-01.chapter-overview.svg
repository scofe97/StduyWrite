<svg viewBox="0 0 820 560" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>16-01 전체 지도 — 파드가 신원을 얻기까지</title>
  <desc>Deployment로는 replica마다 볼륨과 주소를 줄 수 없다는 요구사항에서 출발해, StatefulSet이 ordinal 이름과 PVC 템플릿으로 신원을 만들고, headless Service의 DNS 레코드가 그 신원을 네트워크에서 부를 수 있게 만드는 다섯 단계를 세로로 이은 그림입니다. 3단계에는 Service를 먼저 만들어야 한다는 주의 표시가, 4단계에는 리플리카 셋 초기화를 빠뜨리면 파드가 ready가 되지 않는다는 위험 표시가 붙어 있습니다.</desc>
  <rect width="820" height="560" fill="#0d0d0d"/>

  <text x="40" y="40" fill="#e8e4df" font-size="15" font-weight="700">파드가 신원을 얻기까지</text>

  <rect x="40" y="62" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="88" fill="#0d0d0d" font-size="14" font-weight="700">1. 공유도 전용도 막힘</text>
  <text x="740" y="88" text-anchor="end" fill="#3a3632" font-size="11">§1</text>
  <text x="60" y="112" fill="#3a3632" font-size="12">ReadWriteMany 미지원</text>
  <text x="300" y="112" fill="#3a3632" font-size="12">replica마다 3종 복제</text>

  <path d="M410 128 L410 150" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="154" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="180" fill="#0d0d0d" font-size="14" font-weight="700">2. Cattle 아닌 Pets</text>
  <text x="740" y="180" text-anchor="end" fill="#3a3632" font-size="11">§2</text>
  <text x="60" y="204" fill="#3a3632" font-size="12">Deployment — 교체 자유</text>
  <text x="300" y="204" fill="#3a3632" font-size="12">StatefulSet — 신원 고정</text>

  <path d="M410 220 L410 242" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="246" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="272" fill="#0d0d0d" font-size="14" font-weight="700">3. Service 먼저 만든다</text>
  <text x="740" y="272" text-anchor="end" fill="#3a3632" font-size="11">§3</text>
  <text x="60" y="296" fill="#3a3632" font-size="12">serviceName</text>
  <text x="200" y="296" fill="#3a3632" font-size="12">volumeClaimTemplates</text>
  <rect x="430" y="282" width="210" height="22" rx="3" fill="rgb(212,168,83)"/>
  <text x="442" y="297" fill="#0d0d0d" font-size="11.5" font-weight="700">주의 · Host not found</text>

  <path d="M410 326 L410 348" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="352" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="378" fill="#0d0d0d" font-size="14" font-weight="700">4. 번호로 짝지어진다</text>
  <text x="740" y="378" text-anchor="end" fill="#3a3632" font-size="11">§4</text>
  <text x="60" y="402" fill="#3a3632" font-size="12">quiz-0</text>
  <text x="105" y="402" fill="#3a3632" font-size="12">↔</text>
  <text x="122" y="402" fill="#3a3632" font-size="12">db-data-quiz-0</text>
  <text x="300" y="402" fill="#3a3632" font-size="12">소유자는 StatefulSet</text>
  <rect x="500" y="388" width="190" height="22" rx="3" fill="#f2d4d4"/>
  <text x="512" y="403" fill="#7a1f1f" font-size="11.5" font-weight="700">위험 · initiate 누락</text>

  <path d="M410 432 L410 454" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="458" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="484" fill="#0d0d0d" font-size="14" font-weight="700">5. DNS가 신원을 부른다</text>
  <text x="740" y="484" text-anchor="end" fill="#3a3632" font-size="11">§5</text>
  <text x="60" y="508" fill="#3a3632" font-size="12">A/AAAA — 개별 조회</text>
  <text x="300" y="508" fill="#3a3632" font-size="12">SRV — 주소와 포트</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8b3ad"/>
    </marker>
  </defs>
</svg>

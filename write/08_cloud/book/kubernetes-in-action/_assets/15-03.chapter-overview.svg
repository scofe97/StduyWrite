<svg viewBox="0 0 820 500" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>15-03 전체 지도 — 자동 롤아웃을 제어하는 네 방법</title>
  <desc>시작하면 끝까지 자동으로 진행되는 롤링 업데이트를 제어하는 네 단계를 세로로 이은 그림입니다. 사람이 직접 멈추는 pause, 결함 버전을 자동으로 막는 minReadySeconds, 되돌리는 rollout undo, 그리고 Deployment가 직접 지원하지 않는 배포 전략의 구현 순서입니다. 2단계에는 available이 트래픽 게이트가 아니라는 주의 표시가, 3단계에는 undo가 minReadySeconds까지 되돌린다는 위험 표시가 붙어 있습니다.</desc>
  <rect width="820" height="500" fill="#0d0d0d"/>

  <text x="40" y="40" fill="#e8e4df" font-size="15" font-weight="700">자동 롤아웃을 제어하는 네 방법</text>

  <rect x="40" y="62" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="88" fill="#0d0d0d" font-size="14" font-weight="700">1. 사람이 멈춘다 — pause</text>
  <text x="740" y="88" text-anchor="end" fill="#3a3632" font-size="11">§1</text>
  <text x="60" y="112" fill="#3a3632" font-size="12">spec.paused = true</text>
  <text x="300" y="112" fill="#3a3632" font-size="12">두 버전 혼재 — 리소스별로 갈림</text>

  <path d="M410 128 L410 150" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="154" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="180" fill="#0d0d0d" font-size="14" font-weight="700">2. 자동으로 막는다 — minReadySeconds</text>
  <text x="740" y="180" text-anchor="end" fill="#3a3632" font-size="11">§2</text>
  <text x="60" y="204" fill="#3a3632" font-size="12">ready 유지 → available</text>
  <text x="240" y="204" fill="#3a3632" font-size="12">실패 시 타이머 리셋</text>
  <rect x="430" y="190" width="290" height="22" rx="3" fill="rgb(212,168,83)"/>
  <text x="442" y="205" fill="#0d0d0d" font-size="11.5" font-weight="700">주의 · available 은 트래픽 게이트 아님</text>

  <path d="M410 234 L410 256" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="260" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="286" fill="#0d0d0d" font-size="14" font-weight="700">3. 되돌린다 — rollout undo</text>
  <text x="740" y="286" text-anchor="end" fill="#3a3632" font-size="11">§3</text>
  <text x="60" y="310" fill="#3a3632" font-size="12">revision = ReplicaSet</text>
  <text x="230" y="310" fill="#3a3632" font-size="12">저장된 것까지만 복원</text>
  <rect x="450" y="296" width="270" height="22" rx="3" fill="#f2d4d4"/>
  <text x="462" y="311" fill="#7a1f1f" font-size="11.5" font-weight="700">위험 · minReadySeconds 도 되돌아감</text>

  <path d="M410 340 L410 362" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="366" width="740" height="90" rx="4" fill="#e8e4df"/>
  <text x="60" y="392" fill="#0d0d0d" font-size="14" font-weight="700">4. 없는 전략은 조합한다</text>
  <text x="740" y="392" text-anchor="end" fill="#3a3632" font-size="11">§4</text>
  <text x="60" y="416" fill="#3a3632" font-size="12">네이티브 — Recreate · RollingUpdate</text>
  <text x="60" y="438" fill="#3a3632" font-size="12">조합 — Canary · A/B · Blue/Green · Shadowing</text>
  <text x="430" y="438" fill="#3a3632" font-size="12">같은 label selector 를 반대로 씁니다</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8b3ad"/>
    </marker>
  </defs>
</svg>

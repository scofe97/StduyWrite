<svg viewBox="0 0 960 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>컨테이너별 ready가 Pod 전체 Ready로 종합되는 관계</title>
  <desc>각 컨테이너의 ready 필드(readiness probe가 결정)를 모두 종합해 ContainersReady condition이 정해지고, 그것이 Pod 전체 Ready condition과 kubectl get의 READY n/n 표시로 이어진다. 컨테이너 하나라도 ready=false면 ContainersReady=False, Pod Ready=False가 되어 Service가 이 Pod로 트래픽을 보내지 않는다.</desc>
  <defs>
    <style>
      .title { font-size: 16px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 10.5px; fill: rgb(138,133,128); }
      .box   { font-size: 12px; font-weight: 800; }
      .note  { font-size: 9.5px; fill: rgb(138,133,128); }
      .lbl   { font-size: 10px; font-weight: 800; fill: rgb(212,168,83); }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
    <marker id="af" markerWidth="11" markerHeight="11" refX="7" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="rgb(212,168,83)"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">컨테이너별 ready → ContainersReady → Pod Ready → READY n/n</text>
  <text x="24" y="54" class="sub">컨테이너 하나라도 ready=false면 위로 전파돼 Pod 전체가 not-ready가 된다.</text>

  <!-- 왼쪽: 컨테이너별 ready -->
  <text x="40" y="92" class="lbl">① 컨테이너별 ready (readiness probe가 결정)</text>
  <!-- ready-ok -->
  <rect x="40" y="104" width="250" height="56" rx="9" fill="#66bb6a" stroke="#3d8b40" stroke-width="1.3"/>
  <text x="60" y="128" class="box" text-anchor="start" style="fill:#0d0d0d">ready-ok</text>
  <text x="60" y="148" class="note mono" style="fill:#14330f">ready = true   (probe 통과)</text>
  <!-- ready-fail -->
  <rect x="40" y="172" width="250" height="56" rx="9" fill="rgb(224,140,120)" stroke="rgb(180,90,70)" stroke-width="1.3"/>
  <text x="60" y="196" class="box" text-anchor="start" style="fill:#0d0d0d">ready-fail</text>
  <text x="60" y="216" class="note mono" style="fill:#3a1410">ready = false  (probe 실패)</text>

  <!-- 화살표 종합 -->
  <path d="M290,132 C340,132 350,166 396,166" fill="none" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#af)"/>
  <path d="M290,200 C340,200 350,174 396,170" fill="none" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#af)"/>
  <text x="343" y="120" class="note" text-anchor="middle">모두</text>
  <text x="343" y="230" class="note" text-anchor="middle">종합(AND)</text>

  <!-- 가운데: ContainersReady -->
  <text x="410" y="92" class="lbl">② 종합 → ContainersReady</text>
  <rect x="400" y="138" width="230" height="60" rx="10" fill="rgb(40,22,20)" stroke="rgb(224,110,100)" stroke-width="1.3"/>
  <text x="515" y="164" class="box" text-anchor="middle" style="fill:#f0c8c0">ContainersReady</text>
  <text x="515" y="184" class="note mono" text-anchor="middle" style="fill:#e0a89f">False (ContainersNotReady)</text>
  <text x="410" y="222" class="note">하나라도 false면 → False</text>

  <!-- 화살표 -->
  <path d="M630,168 L690,168" fill="none" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#af)"/>

  <!-- 오른쪽: Pod Ready + READY n/n -->
  <text x="700" y="92" class="lbl">③ Pod 전체 Ready</text>
  <rect x="700" y="120" width="230" height="56" rx="10" fill="rgb(40,22,20)" stroke="rgb(224,110,100)" stroke-width="1.3"/>
  <text x="815" y="144" class="box" text-anchor="middle" style="fill:#f0c8c0">Ready = False</text>
  <text x="815" y="164" class="note" text-anchor="middle" style="fill:#e0a89f">Service가 트래픽 안 보냄</text>
  <!-- READY n/n -->
  <rect x="700" y="188" width="230" height="44" rx="9" fill="rgb(28,30,34)" stroke="rgb(80,78,74)" stroke-width="1"/>
  <text x="815" y="215" class="box mono" text-anchor="middle" style="fill:#e8e4df">READY  1/2</text>

  <!-- 하단 요약 바 -->
  <rect x="40" y="268" width="890" height="60" rx="9" fill="rgb(22,24,28)" stroke="rgb(212,168,83)" stroke-width="1"/>
  <text x="60" y="292" class="note" style="fill:#e8e4df">규칙: 컨테이너 <tspan class="mono">ready</tspan>는 각자의 readiness probe(06-02)가 정한다. 이들을 AND로 종합한 것이 <tspan class="mono">ContainersReady</tspan>.</text>
  <text x="60" y="314" class="note" style="fill:#e8e4df">여기에 readiness gate(11장)까지 더해 Pod 전체 <tspan class="mono" style="fill:rgb(212,168,83)">Ready</tspan>가 정해지고, 그 결과가 <tspan class="mono">READY n/n</tspan> 표시로 보인다.</text>

  <!-- 대비: 만약 둘 다 true면 -->
  <rect x="40" y="344" width="890" height="52" rx="9" fill="rgb(24,32,24)" stroke="#3d8b40" stroke-width="1"/>
  <text x="60" y="368" class="note" style="fill:#cdeccf">만약 두 컨테이너가 모두 <tspan class="mono">ready=true</tspan>였다면 → ContainersReady=True → Pod Ready=True → <tspan class="mono" style="fill:#66bb6a">READY 2/2</tspan></text>
  <text x="60" y="386" class="note" style="fill:#cdeccf">→ 그때만 Service가 이 Pod로 트래픽을 보낸다.</text>
</svg>

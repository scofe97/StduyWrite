<title id="dt">이름은 여럿, 공인 IP 는 하나</title><desc id="dd">도메인마다 A 레코드를 두지만 값은 모두 같은 주소다. 갈라 보내는 일은 DNS 가 아니라 그 주소 뒤에 선 L7 프록시가 HTTP 를 읽어서 한다.</desc>

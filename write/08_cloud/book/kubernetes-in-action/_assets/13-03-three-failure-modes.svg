<svg viewBox="0 0 1120 720" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>세 가지 실패 양상 — 거부와 무처리는 다르다</title>
  <desc>선언한 것이 뜻대로 안 될 때 나타나는 세 가지 양상을 비교한다. 첫째는 스키마 오류나 없는 필드로, apply 자체가 실패하므로 즉시 알아차린다. 둘째는 참조 거부로, apply는 성공하고 status에 ResolvedRefs가 False이고 reason에 RefNotPermitted가 찍힌다. 이유가 적히므로 status를 보면 알 수 있다. 셋째는 구현 미지원으로, apply도 성공하고 status가 아예 비어 있다. 에러도 거부 메시지도 없고 아무 일도 일어나지 않아 가장 진단하기 어렵다. 왜 status가 비는지는 API 서버와 컨트롤러가 별개라는 데서 나온다. apply를 받는 것은 API 서버이고 API 서버가 확인하는 것은 CRD가 설치돼 있는지와 스키마에 맞는지까지다. experimental 채널 CRD를 설치했다면 UDPRoute도 스키마 검증을 통과한다. Istio가 그 리소스를 보지 않는다는 사실을 API 서버는 모른다. 그리고 status를 채우는 주체는 컨트롤러이므로, 컨트롤러가 이 리소스 종류를 아예 안 보면 채울 사람이 없어 status가 빈다. 이것이 미지원의 신호다. 같은 결의 사례가 셋 있는데 13-01의 attachedRoutes 0과 12-02의 기본 IngressClass 부재와 여기 status 빔이 모두 아무도 처리하지 않아 조용히 아무 일도 안 일어나는 경우이고 진단법도 빈지 0인지 보라로 같다.</desc>
  <defs>
    <style>
      .h1   { font-size: 24px; font-weight: 800; fill: #e8e4df; }
      .sub  { font-size: 15px; fill: #b8b3ad; }
      .lyr  { font-size: 12.5px; font-weight: 800; fill: #b8b3ad; }
      .tag  { font-size: 12.5px; font-weight: 800; fill: #0d0d0d; }
      .mono { font-size: 11px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .monod{ font-size: 11px; font-weight: 700; fill: #e8e4df; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .who  { font-size: 12.5px; fill: #e8e4df; }
      .body { font-size: 14px; fill: #e8e4df; }
      .bad  { font-size: 13px; fill: rgb(240,150,190); }
      .good { font-size: 13px; fill: rgb(102,187,106); }
      .cell { font-size: 12.5px; fill: #e8e4df; }
      .rowl { font-size: 12.5px; fill: rgb(168,163,158); }
    </style>
    <marker id="tf-b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(91,155,213)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="720" fill="#0d0d0d"/>

  <text x="30" y="40" class="h1">거부당하는 것과 아무도 안 보는 것은 다릅니다</text>
  <text x="30" y="66" class="sub">선언이 뜻대로 안 될 때 나타나는 양상이 셋이고, 진단 난이도가 오른쪽으로 갈수록 올라갑니다.</text>

  <!-- 세 양상 -->
  <rect x="30" y="94" width="345" height="212" rx="12" fill="rgb(22,22,22)" stroke="rgb(102,187,106)" stroke-width="1.7"/>
  <text x="50" y="120" class="body" font-weight="700" style="fill:rgb(102,187,106)">1. 스키마 오류 · 없는 필드</text>
  <rect x="50" y="134" width="305" height="30" rx="5" fill="rgb(240,150,190)"/>
  <text x="202" y="154" class="mono" text-anchor="middle">apply 실패</text>
  <text x="50" y="186" class="lyr">status</text>
  <text x="50" y="208" class="who">해당 없음 — 만들어지지도 않았습니다</text>
  <rect x="50" y="222" width="305" height="30" rx="5" fill="rgba(102,187,106,0.14)" stroke="rgb(102,187,106)" stroke-width="1.2"/>
  <text x="202" y="242" class="good" font-weight="700" text-anchor="middle">즉시 알아차립니다</text>
  <text x="50" y="276" class="who">터미널에 에러가 바로 뜹니다.</text>
  <text x="50" y="294" class="who">가장 다루기 쉬운 실패입니다.</text>

  <rect x="391" y="94" width="345" height="212" rx="12" fill="rgb(22,22,22)" stroke="rgb(212,168,83)" stroke-width="1.7"/>
  <text x="411" y="120" class="body" font-weight="700" style="fill:rgb(212,168,83)">2. 참조 거부</text>
  <rect x="411" y="134" width="305" height="30" rx="5" fill="rgb(102,187,106)"/>
  <text x="563" y="154" class="mono" text-anchor="middle">apply 성공</text>
  <text x="411" y="186" class="lyr">status</text>
  <rect x="411" y="196" width="305" height="44" rx="5" fill="rgb(24,28,32)" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="424" y="214" class="monod" style="font-size:10px">ResolvedRefs: False</text>
  <text x="424" y="232" class="monod" style="font-size:10px; fill:rgb(212,168,83)">reason: RefNotPermitted</text>
  <rect x="411" y="248" width="305" height="30" rx="5" fill="rgba(212,168,83,0.14)" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="563" y="268" class="cell" font-weight="700" text-anchor="middle" style="fill:rgb(212,168,83)">이유가 적혀 있습니다</text>
  <text x="411" y="296" class="who">status를 보면 원인까지 나옵니다.</text>

  <rect x="752" y="94" width="338" height="212" rx="12" fill="rgb(22,22,22)" stroke="rgb(240,150,190)" stroke-width="1.7"/>
  <text x="772" y="120" class="body" font-weight="700" style="fill:rgb(240,150,190)">3. 구현 미지원</text>
  <rect x="772" y="134" width="298" height="30" rx="5" fill="rgb(102,187,106)"/>
  <text x="921" y="154" class="mono" text-anchor="middle">apply 성공</text>
  <text x="772" y="186" class="lyr">status</text>
  <rect x="772" y="196" width="298" height="44" rx="5" fill="rgb(24,28,32)" stroke="rgb(240,150,190)" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="921" y="223" class="monod" style="fill:rgb(240,150,190)" text-anchor="middle">(비어 있음)</text>
  <rect x="772" y="248" width="298" height="30" rx="5" fill="rgba(240,150,190,0.14)" stroke="rgb(240,150,190)" stroke-width="1.2"/>
  <text x="921" y="268" class="bad" font-weight="700" text-anchor="middle">아무 일도 안 일어납니다</text>
  <text x="772" y="296" class="who">에러도 거부 메시지도 없습니다.</text>

  <!-- 왜 비는가 -->
  <text x="30" y="342" class="body" font-weight="700">3번은 왜 비나 — API 서버와 컨트롤러는 별개입니다</text>

  <rect x="30" y="356" width="520" height="150" rx="11" fill="rgb(22,22,22)" stroke="rgb(91,155,213)" stroke-width="1.5"/>
  <text x="52" y="382" class="body" font-weight="700" style="fill:rgb(91,155,213)">apply를 받는 쪽 = API 서버</text>
  <text x="52" y="406" class="who">확인하는 것은 둘뿐입니다.</text>
  <text x="52" y="428" class="good">✓ CRD가 설치돼 있는가</text>
  <text x="52" y="450" class="good">✓ 스키마에 맞는가</text>
  <rect x="52" y="462" width="476" height="30" rx="5" fill="rgba(91,155,213,0.14)" stroke="rgb(91,155,213)" stroke-width="1.2"/>
  <text x="66" y="482" class="who">Istio가 UDPRoute를 안 본다는 사실을 <tspan font-weight="700" fill="#e8e4df">API 서버는 모릅니다</tspan></text>

  <rect x="570" y="356" width="520" height="150" rx="11" fill="rgb(22,22,22)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="592" y="382" class="body" font-weight="700" style="fill:rgb(212,168,83)">status를 채우는 쪽 = 컨트롤러</text>
  <text x="592" y="406" class="who">experimental 채널 CRD를 깔았으니 UDPRoute도</text>
  <text x="592" y="426" class="who">스키마 검증은 통과합니다. 오브젝트는 만들어집니다.</text>
  <text x="592" y="450" class="who">그런데 컨트롤러가 이 종류를 아예 안 보면</text>
  <rect x="592" y="462" width="478" height="30" rx="5" fill="rgba(212,168,83,0.14)" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="606" y="482" class="cell" font-weight="700">채울 사람이 없어 status가 빕니다 — 그게 미지원 신호입니다</text>

  <!-- 같은 결 셋 -->
  <rect x="30" y="524" width="1060" height="108" rx="11" fill="rgb(20,20,20)" stroke="rgb(42,37,32)"/>
  <text x="54" y="550" class="body" font-weight="700">"아무도 처리하지 않아 조용히 아무 일도 안 일어남" — 같은 결의 사례 셋</text>
  <rect x="54" y="562" width="320" height="26" rx="4" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.1"/>
  <text x="68" y="580" class="monod" style="font-size:10.5px">13-01  attachedRoutes: 0</text>
  <rect x="390" y="562" width="320" height="26" rx="4" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.1"/>
  <text x="404" y="580" class="monod" style="font-size:10.5px">12-02  기본 IngressClass 부재</text>
  <rect x="726" y="562" width="340" height="26" rx="4" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.1"/>
  <text x="740" y="580" class="monod" style="font-size:10.5px">13-03  status 빔 (여기)</text>
  <text x="54" y="614" class="who">진단법도 같습니다 — <tspan font-weight="700" fill="#e8e4df">"빈지·0인지 보라."</tspan> 값이 틀린 게 아니라 값이 없는 것을 찾는 눈이 따로 필요합니다.</text>

  <!-- 하단 못박기 -->
  <rect x="30" y="650" width="1060" height="50" rx="11" fill="rgba(212,168,83,0.08)" stroke="rgb(42,37,32)"/>
  <text x="54" y="676" class="who">support level(13-01)과 헷갈리지 않게 — support level은 <tspan font-weight="700" fill="#e8e4df">명세에 적힌 규범</tspan>이고,</text>
  <text x="54" y="694" class="who">"지금 내 클러스터의 이 컨트롤러가 실제로 지원하는가"는 <tspan font-weight="700" fill="#e8e4df">status로 확인</tspan>합니다. 규범과 실측은 다른 자료입니다.</text>
</svg>

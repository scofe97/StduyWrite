<svg viewBox="0 0 1120 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>status가 비는 이유 — apply는 API 서버에서 끝난다</title>
  <desc>구현 미지원일 때 status가 비는 이유를 흐름으로 보인다. apply 요청은 API 서버가 받아 CRD 설치 여부와 스키마 적합성만 확인하고 오브젝트를 만든다. 여기까지는 성공한다. 그 다음 status를 채우는 주체는 컨트롤러인데, 컨트롤러가 그 리소스 종류를 아예 감시하지 않으면 오브젝트를 읽어 가지 않는다. API 서버에서 컨트롤러로 향하는 화살표가 끊겨 있고, 그래서 status를 채울 주체가 없어 빈 채로 남는다. 두 주체가 별개라는 점이 이 실패의 원인이다.</desc>
  <defs>
    <style>
      .h1   { font-size: 24px; font-weight: 800; fill: #e8e4df; }
      .sub  { font-size: 15px; fill: #b8b3ad; }
      .role { font-size: 15px; font-weight: 800; }
      .who  { font-size: 12.5px; fill: #e8e4df; }
      .mono { font-size: 11px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .monod{ font-size: 11px; font-weight: 700; fill: #e8e4df; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .good { font-size: 12.5px; fill: rgb(102,187,106); }
      .edge { font-size: 12px; font-weight: 700; }
    </style>
    <marker id="tf-ok" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto">
      <path d="M0,0 L9,3.2 L0,6.4 Z" fill="rgb(102,187,106)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="470" fill="#0d0d0d"/>

  <text x="30" y="40" class="h1">status가 비는 이유 — apply는 API 서버에서 끝납니다</text>
  <text x="30" y="66" class="sub">받는 쪽과 채우는 쪽이 별개라, 한쪽만 일해도 apply는 성공합니다.</text>

  <!-- 1. 요청 -->
  <rect x="30" y="118" width="180" height="72" rx="10" fill="rgb(22,22,22)" stroke="rgb(120,116,112)" stroke-width="1.5"/>
  <text x="120" y="146" class="who" font-weight="700" text-anchor="middle">사용자</text>
  <rect x="46" y="156" width="148" height="24" rx="4" fill="rgb(220,234,247)"/>
  <text x="120" y="173" class="mono" text-anchor="middle">kubectl apply</text>

  <line x1="212" y1="154" x2="286" y2="154" stroke="rgb(102,187,106)" stroke-width="2.2" marker-end="url(#tf-ok)"/>

  <!-- 2. API 서버 -->
  <rect x="292" y="100" width="330" height="180" rx="12" fill="rgb(22,22,22)" stroke="rgb(91,155,213)" stroke-width="1.8"/>
  <text x="314" y="128" class="role" style="fill:rgb(91,155,213)">API 서버 — 받는 쪽</text>
  <text x="314" y="152" class="who">확인하는 것은 둘뿐입니다.</text>
  <text x="314" y="176" class="good">✓ CRD가 설치돼 있는가</text>
  <text x="314" y="198" class="good">✓ 스키마에 맞는가</text>
  <rect x="314" y="212" width="286" height="26" rx="4" fill="rgb(220,234,247)"/>
  <text x="457" y="230" class="mono" text-anchor="middle">오브젝트 생성됨 · apply 성공</text>
  <text x="314" y="262" class="who">Istio가 UDPRoute를 안 본다는 사실을 <tspan font-weight="700">모릅니다</tspan></text>

  <!-- 끊긴 화살표 -->
  <line x1="628" y1="190" x2="694" y2="190" stroke="rgb(240,150,190)" stroke-width="2.2" stroke-dasharray="6 5"/>
  <line x1="700" y1="176" x2="724" y2="204" stroke="rgb(240,150,190)" stroke-width="2.6"/>
  <line x1="724" y1="176" x2="700" y2="204" stroke="rgb(240,150,190)" stroke-width="2.6"/>
  <text x="691" y="246" class="edge" style="fill:rgb(240,150,190)" text-anchor="middle">안 읽어 갑니다</text>

  <!-- 3. 컨트롤러 -->
  <rect x="760" y="100" width="330" height="180" rx="12" fill="rgb(22,22,22)" stroke="rgb(240,150,190)" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="782" y="128" class="role" style="fill:rgb(240,150,190)">컨트롤러 — 채우는 쪽</text>
  <text x="782" y="152" class="who">이 리소스 종류를 감시 목록에 두지</text>
  <text x="782" y="172" class="who">않으면 오브젝트를 아예 안 봅니다.</text>
  <rect x="782" y="190" width="286" height="48" rx="5" fill="rgb(24,28,32)" stroke="rgb(240,150,190)" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="925" y="211" class="monod" style="font-size:10.5px" text-anchor="middle">status:</text>
  <text x="925" y="229" class="monod" style="fill:rgb(240,150,190)" text-anchor="middle">(비어 있음)</text>
  <text x="782" y="262" class="who">채울 주체가 없으니 <tspan font-weight="700">빈 채로 남습니다</tspan></text>

  <!-- 결론 띠 -->
  <rect x="30" y="318" width="1060" height="56" rx="11" fill="rgba(240,150,190,0.10)" stroke="rgb(240,150,190)" stroke-width="1.3"/>
  <text x="54" y="344" class="who">그래서 <tspan font-weight="700">에러도 거부 메시지도 없습니다.</tspan> 스키마가 틀린 것도, 참조가 거부된 것도 아니기 때문입니다.</text>
  <text x="54" y="364" class="who">값이 <tspan font-weight="700">틀린</tspan> 것을 찾는 눈으로는 못 찾습니다 — 값이 <tspan font-weight="700">없는</tspan> 것을 찾아야 합니다.</text>

  <text x="30" y="410" class="sub">세 실패 양상의 비교와 같은 결의 사례는 본문 표를 봅니다.</text>
</svg>

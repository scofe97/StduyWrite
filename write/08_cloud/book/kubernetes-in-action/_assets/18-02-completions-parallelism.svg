<svg viewBox="0 0 960 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>completions 5 · parallelism 2 실행</title>
  <desc>parallelism이 2이므로 파드 두 개가 먼저 만들어진다. 하나가 완료되면 즉시 새 파드가 만들어져 실행 중인 파드 수를 둘로 유지한다. 성공한 파드 수가 completions 값 5에 도달할 때까지 반복한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .lbl   { font-size: 11px; font-weight: 700; fill: #e8e4df; }
      .pod   { font-size: 10.5px; font-weight: 700; fill: #e8e4df; }
      .note  { font-size: 10px; fill: rgb(138,133,128); }
      .tick  { font-size: 10px; fill: rgb(138,133,128); }
    </style>
    <marker id="cp-a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="320" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">completions 5 · parallelism 2</text>
  <text x="24" y="50" class="sub">동시 최대 2개 실행. 하나 끝나면 다음 채워 총 5개 성공까지</text>

  <!-- lane labels -->
  <text x="24" y="115" class="lbl">Lane A</text>
  <text x="24" y="185" class="lbl">Lane B</text>

  <!-- time axis -->
  <line x1="110" y1="250" x2="900" y2="250" stroke="rgb(70,70,70)" stroke-width="1.2" marker-end="url(#cp-a)"/>
  <text x="905" y="254" class="note">time</text>
  <text x="150" y="270" class="tick" text-anchor="middle">t0</text>
  <text x="360" y="270" class="tick" text-anchor="middle">t1</text>
  <text x="570" y="270" class="tick" text-anchor="middle">t2</text>
  <text x="780" y="270" class="tick" text-anchor="middle">t3</text>

  <!-- Lane A: Pod1, Pod3, Pod5 -->
  <rect x="110" y="92" width="200" height="34" rx="6" fill="rgb(91,155,213)"/><text x="210" y="114" class="pod" text-anchor="middle">Pod 1 ✓</text>
  <rect x="320" y="92" width="200" height="34" rx="6" fill="rgb(91,155,213)"/><text x="420" y="114" class="pod" text-anchor="middle">Pod 3 ✓</text>
  <rect x="530" y="92" width="200" height="34" rx="6" fill="rgb(91,155,213)"/><text x="630" y="114" class="pod" text-anchor="middle">Pod 5 ✓</text>

  <!-- Lane B: Pod2, Pod4 -->
  <rect x="110" y="162" width="200" height="34" rx="6" fill="rgb(91,155,213)"/><text x="210" y="184" class="pod" text-anchor="middle">Pod 2 ✓</text>
  <rect x="320" y="162" width="200" height="34" rx="6" fill="rgb(91,155,213)"/><text x="420" y="184" class="pod" text-anchor="middle">Pod 4 ✓</text>

  <!-- completion note -->
  <text x="770" y="184" class="note">4개 성공 시</text>
  <text x="770" y="197" class="note">5번째만 남음</text>
  <text x="630" y="150" text-anchor="middle" font-size="10.5" fill="rgb(102,187,106)" font-weight="700">5/5 완료 → Job Complete</text>
</svg>

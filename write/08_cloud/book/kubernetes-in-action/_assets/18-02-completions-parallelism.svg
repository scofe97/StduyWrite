<title id="dt">창은 둘, 채워야 할 횟수는 다섯</title><desc id="dd">parallelism 은 동시에 열어 둘 창의 개수를, completions 는 그 창으로 몇 번 성공을 통과시킬지를 정한다. 하나가 끝나면 그 자리에 다음이 들어온다.</desc>
<rect width="1240" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 18-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">창은 둘, 채워야 할 횟수는 다섯</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">completions 5 · parallelism 2</text>
<rect x="260" y="220" width="272.0" height="46" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="396.0" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">파드 1</text>

<text x="676.5" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">파드 3</text>
<rect x="600.0" y="282" width="272.0" height="46" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="736.0" y="312" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">파드 4</text>
<rect x="821.0" y="220" width="272.0" height="46" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<text x="957.0" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">파드 5</text>
<text x="200" y="250" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">창 1</text>
<text x="200" y="312" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">창 2</text>
<rect x="246" y="206" width="861.0" height="122" rx="8" fill="none" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="7 6"/>
<text x="668.0" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">동시에 둘 — parallelism</text>
<line x1="260" y1="396" x2="1093.0" y2="396" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="260" y="418" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">시작</text>
<text x="1093.0" y="418" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">다섯 번째 성공 → 완료</text>
<text x="24" y="486" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">창이 비면 그때 다음 파드를 만든다. 그래서 총 파드 수는 completions 와 같고, 동시에 도는 수만 parallelism 으로 묶인다.</text>
<text x="24" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">parallelism 을 completions 보다 크게 잡아도 소용없다 — 채울 횟수가 그만큼 없으므로 남는 창은 비어 있다.</text>
<line x1="12" y1="536" x2="1192" y2="536" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="558" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="548" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">도는 파드</text>
<rect x="209" y="548" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="558" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">동시 실행 창</text>

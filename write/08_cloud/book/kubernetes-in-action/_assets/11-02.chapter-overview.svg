<svg viewBox="0 0 820 500" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>11-02 전체 지도 — 밖으로 열수록 소스 IP와 균등 중 하나를 잃는다</title>
  <desc>ClusterIP가 내부 전용이라는 제약에서 출발해, NodePort가 모든 노드에 포트를 열고, LoadBalancer가 그 앞에 단일 진입점을 세우며, externalTrafficPolicy를 Local로 바꾸면 홉과 소스 IP 은닉이 사라지는 대신 파드 없는 노드의 요청 유실과 노드별 불균등이 생기는 흐름을 세로로 이은 그림입니다. Local 단계에는 healthCheckNodePort가 유실만 풀고 불균등은 남긴다는 주의 표시가 붙어 있습니다.</desc>
  <rect width="820" height="500" fill="#0d0d0d"/>

  <text x="40" y="40" fill="#e8e4df" font-size="15" font-weight="700">밖으로 열수록, 소스 IP와 균등 중 하나를 잃습니다</text>

  <rect x="40" y="62" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="88" fill="#0d0d0d" font-size="14" font-weight="700">진입. ClusterIP는 안에서만 닿습니다</text>
  <text x="740" y="88" text-anchor="end" fill="#3a3632" font-size="11">진입</text>
  <text x="60" y="112" fill="#3a3632" font-size="12">externalIPs · NodePort · LoadBalancer · Ingress</text>
  <text x="440" y="112" fill="#3a3632" font-size="12">네 길은 각각 계층이 다릅니다</text>

  <path d="M410 128 L410 150" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="154" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="180" fill="#0d0d0d" font-size="14" font-weight="700">1. NodePort — 모든 노드에 같은 포트</text>
  <text x="740" y="180" text-anchor="end" fill="#3a3632" font-size="11">§1</text>
  <text x="60" y="204" fill="#3a3632" font-size="12">어느 노드로 들어와도 파드까지 갑니다</text>
  <text x="440" y="204" fill="#3a3632" font-size="12">ClusterIP의 확장이라 cluster IP도 그대로</text>

  <path d="M410 220 L410 242" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="246" width="740" height="66" rx="4" fill="#e8e4df"/>
  <text x="60" y="272" fill="#0d0d0d" font-size="14" font-weight="700">2. LoadBalancer — 그 앞에 단일 진입점</text>
  <text x="740" y="272" text-anchor="end" fill="#3a3632" font-size="11">§2</text>
  <text x="60" y="296" fill="#3a3632" font-size="12">NodePort 위에 얹힙니다</text>
  <text x="440" y="296" fill="#3a3632" font-size="12">노드가 죽어도 진입점은 그대로</text>

  <path d="M410 312 L410 334" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="338" width="740" height="122" rx="4" fill="#e8e4df"/>
  <text x="60" y="364" fill="#0d0d0d" font-size="14" font-weight="700">3. Local — 홉과 소스 IP를 되찾는 대신</text>
  <text x="740" y="364" text-anchor="end" fill="#3a3632" font-size="11">§3</text>
  <text x="60" y="388" fill="#3a3632" font-size="12">Cluster(기본): 다른 노드로 넘김 → 홉 +1, 소스 IP 가려짐</text>
  <text x="60" y="410" fill="#3a3632" font-size="12">Local: 자기 위 파드로만 → 문제 둘을 새로 얻습니다</text>
  <rect x="60" y="424" width="660" height="22" rx="3" fill="#f2d4d4"/>
  <text x="72" y="439" fill="#7a1f1f" font-size="11.5" font-weight="700">주의 · healthCheckNodePort 는 유실만 풀고 노드별 불균등은 그대로 남깁니다</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8b3ad"/>
    </marker>
  </defs>
</svg>

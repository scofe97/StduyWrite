<svg viewBox="0 0 1080 600" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>404를 진단할 때 조회가 갈라지는 지점</title>
  <desc>게이트웨이에 접속했는데 404가 났을 때 진단이 어떻게 흘러가는지를 따라간다. 먼저 kubectl get gtw로 Gateway 상태를 본다. 이 명령은 status의 위 두 층만 출력한다. 주소는 배정돼 있고 PROGRAMMED 열에는 True가 찍힌다. 여기서 진단이 두 갈래로 갈린다. 한쪽은 True를 초록불로 읽고 조회를 멈추는 길인데, 이러면 원인을 못 찾고 게이트웨이 바깥에서 헤매게 된다. PROGRAMMED True가 뜻하는 것은 설정이 생성돼 게이트웨이에 닿을 수 있다는 것이지 라우팅이 완성됐다는 뜻이 아니기 때문이다. 입구는 열렸지만 안내판이 없는 상태에 가깝다. 다른 한쪽은 세 번째 층인 listeners를 따로 조회하는 길이다. jsonpath로 attachedRoutes를 꺼내 보면 0이 나오고, 여기서 붙은 Route가 하나도 없다는 원인이 드러난다. listener 층에는 이 밖에도 확인할 조건이 셋 있다. Accepted는 이 listener 설정을 받아들였는지, Conflicted는 다른 listener와 포트나 호스트가 겹치는지, ResolvedRefs는 참조한 TLS Secret 같은 것이 실제로 있는지를 가린다.</desc>
  <defs>
    <style>
      .h1   { font-size: 22px; font-weight: 800; fill: #e8e4df; }
      .k    { font-size: 12.5px; font-weight: 700; fill: #0d0d0d; }
      .tag  { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .mono { font-size: 11.5px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .monod{ font-size: 11.5px; font-weight: 700; fill: #e8e4df; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .who  { font-size: 12.5px; fill: #b8b3ad; }
      .lbl  { font-size: 12.5px; font-weight: 800; }
    </style>
    <marker id="sl-w" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
    <marker id="sl-p" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(240,150,190)"/>
    </marker>
    <marker id="sl-g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(102,187,106)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="600" fill="#0d0d0d"/>

  <text x="30" y="38" class="h1">404 진단이 갈라지는 자리</text>
  <text x="30" y="64" class="who">흔한 명령은 위 두 층에서 끝납니다</text>

  <!-- 시작 -->
  <rect x="30" y="94" width="200" height="60" rx="9" fill="rgb(240,150,190)"/>
  <text x="130" y="118" class="tag" text-anchor="middle">접속하니 404</text>
  <text x="130" y="140" class="k" text-anchor="middle">원인을 찾습니다</text>

  <line x1="236" y1="124" x2="272" y2="124" stroke="#b8b3ad" stroke-width="2.4" marker-end="url(#sl-w)"/>

  <!-- get gtw -->
  <rect x="278" y="82" width="480" height="122" rx="11" fill="rgb(20,20,20)" stroke="rgb(120,116,112)" stroke-width="1.6"/>
  <text x="300" y="108" class="monod">kubectl get gtw kiada</text>
  <text x="300" y="130" class="who">status의 1·2층만 출력합니다</text>
  <rect x="300" y="142" width="200" height="26" rx="5" fill="rgb(91,155,213)"/>
  <text x="400" y="160" class="k" text-anchor="middle">ADDRESS 배정됨</text>
  <rect x="512" y="142" width="222" height="26" rx="5" fill="rgb(102,187,106)"/>
  <text x="623" y="160" class="mono" text-anchor="middle">PROGRAMMED: True</text>
  <text x="300" y="188" class="who">3층은 여기 안 나옵니다</text>

  <!-- 분기점 -->
  <line x1="518" y1="210" x2="518" y2="238" stroke="#b8b3ad" stroke-width="2.4"/>
  <text x="534" y="232" class="who">여기서 갈립니다</text>
  <line x1="518" y1="238" x2="230" y2="238" stroke="#b8b3ad" stroke-width="2.4"/>
  <line x1="518" y1="238" x2="820" y2="238" stroke="#b8b3ad" stroke-width="2.4"/>
  <line x1="230" y1="238" x2="230" y2="272" stroke="rgb(240,150,190)" stroke-width="2.4" marker-end="url(#sl-p)"/>
  <line x1="820" y1="238" x2="820" y2="272" stroke="rgb(102,187,106)" stroke-width="2.4" marker-end="url(#sl-g)"/>

  <!-- 왼쪽: 멈추는 길 -->
  <rect x="30" y="278" width="400" height="150" rx="11" fill="rgb(20,20,20)" stroke="rgb(240,150,190)" stroke-width="1.6"/>
  <text x="52" y="304" class="lbl" style="fill:rgb(240,150,190)">✗ True를 보고 멈추면</text>
  <text x="52" y="330" class="who">게이트웨이는 정상으로 판단</text>
  <text x="52" y="352" class="who">앱·Service·DNS를 뒤집니다</text>
  <rect x="52" y="366" width="356" height="46" rx="6" fill="rgba(240,150,190,0.12)"/>
  <text x="66" y="386" class="who" style="fill:rgb(240,150,190)">True = 닿는다</text>
  <text x="66" y="404" class="who" style="fill:rgb(240,150,190)">≠ 라우팅이 됐다</text>

  <!-- 오른쪽: 파고드는 길 -->
  <rect x="650" y="278" width="400" height="150" rx="11" fill="rgb(20,20,20)" stroke="rgb(102,187,106)" stroke-width="1.6"/>
  <text x="672" y="304" class="lbl" style="fill:rgb(102,187,106)">✓ 3층을 따로 조회하면</text>
  <rect x="672" y="316" width="356" height="46" rx="6" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.1"/>
  <text x="686" y="334" class="monod" style="font-size:10.5px">kubectl get gtw kiada -o jsonpath=</text>
  <text x="686" y="352" class="monod" style="font-size:10.5px">'{.status.listeners[*].attachedRoutes}'</text>
  <rect x="672" y="374" width="120" height="26" rx="5" fill="rgb(240,150,190)"/>
  <text x="732" y="392" class="mono" text-anchor="middle">0</text>
  <text x="806" y="392" class="who">붙은 Route가 없습니다</text>
  <text x="672" y="418" class="who" style="fill:rgb(102,187,106)">원인을 찾았습니다</text>

  <!-- listener 조건 3 -->
  <line x1="850" y1="434" x2="850" y2="462" stroke="#b8b3ad" stroke-width="2.4" marker-end="url(#sl-w)"/>
  <text x="30" y="484" class="who">3층에서 함께 보는 조건 셋</text>

  <rect x="30" y="496" width="330" height="72" rx="9" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.2"/>
  <text x="50" y="520" class="monod">Accepted</text>
  <text x="50" y="544" class="who">이 설정을 받아들였는가</text>

  <rect x="375" y="496" width="330" height="72" rx="9" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.2"/>
  <text x="395" y="520" class="monod">Conflicted</text>
  <text x="395" y="544" class="who">포트·호스트가 겹치는가</text>

  <rect x="720" y="496" width="330" height="72" rx="9" fill="rgba(212,168,83,0.14)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="740" y="520" class="monod" style="fill:rgb(212,168,83)">ResolvedRefs</text>
  <text x="740" y="544" class="who">참조한 TLS Secret이 있는가</text>
</svg>

<svg viewBox="0 0 960 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>label selector가 어느 파드를 Service에 넣을지 정한다</title>
  <desc>Quote 서비스의 selector app=quote는 stable·canary를 가리지 않고 app 키가 quote인 모든 파드를 고른다. app=quiz 파드는 selector에 맞지 않아 제외되고, 같은 라벨이어도 다른 네임스페이스의 파드는 selector가 네임스페이스 안에서만 매칭하므로 포함되지 않는다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .svc   { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .pod   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .lbl   { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .ns    { font-size: 12px; font-weight: 700; fill: rgb(138,133,128); }
      .note  { font-size: 11px; fill: #e8e4df; }
    </style>
    <marker id="ls-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(102,187,106)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="380" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">label selector가 Service의 뒷받침 파드를 정합니다</text>
  <text x="24" y="50" class="sub">selector는 app 값만 보므로 stable·canary를 함께 고르고, 네임스페이스 경계는 넘지 않습니다</text>

  <!-- Namespace A -->
  <rect x="30" y="80" width="640" height="270" rx="10" fill="none" stroke="rgb(138,133,128)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="360" y="335" class="ns" text-anchor="middle">Namespace A</text>

  <!-- Service box -->
  <rect x="230" y="100" width="240" height="60" rx="8" fill="rgb(102,187,106)"/>
  <text x="350" y="126" class="svc" text-anchor="middle">Quote service</text>
  <text x="350" y="146" class="lbl" text-anchor="middle">selector: app=quote</text>

  <!-- quote pods (match) -->
  <g>
    <rect x="55" y="210" width="120" height="66" rx="8" fill="rgb(102,187,106)"/>
    <text x="115" y="234" class="pod" text-anchor="middle">quote-001</text>
    <rect x="70" y="244" width="90" height="20" rx="4" fill="rgb(212,168,83)"/>
    <text x="115" y="259" class="lbl" text-anchor="middle">app: quote</text>
  </g>
  <g>
    <rect x="190" y="210" width="120" height="66" rx="8" fill="rgb(102,187,106)"/>
    <text x="250" y="234" class="pod" text-anchor="middle">quote-002</text>
    <rect x="205" y="244" width="90" height="20" rx="4" fill="rgb(212,168,83)"/>
    <text x="250" y="259" class="lbl" text-anchor="middle">app: quote</text>
  </g>
  <g>
    <rect x="325" y="210" width="120" height="66" rx="8" fill="rgb(102,187,106)"/>
    <text x="385" y="234" class="pod" text-anchor="middle">quote-canary</text>
    <rect x="340" y="244" width="90" height="20" rx="4" fill="rgb(212,168,83)"/>
    <text x="385" y="259" class="lbl" text-anchor="middle">app: quote</text>
  </g>
  <!-- quiz pod (no match) -->
  <g>
    <rect x="510" y="210" width="120" height="66" rx="8" fill="rgb(240,150,190)"/>
    <text x="570" y="234" class="pod" text-anchor="middle">quiz</text>
    <rect x="525" y="244" width="90" height="20" rx="4" fill="rgb(220,220,220)"/>
    <text x="570" y="259" class="lbl" text-anchor="middle">app: quiz</text>
  </g>

  <line x1="290" y1="160" x2="130" y2="208" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#ls-arrow)"/>
  <line x1="340" y1="160" x2="255" y2="208" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#ls-arrow)"/>
  <line x1="400" y1="160" x2="390" y2="208" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#ls-arrow)"/>
  <line x1="455" y1="150" x2="560" y2="208" stroke="rgb(240,150,190)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="545" y="188" class="note" fill="rgb(240,150,190)">app 불일치 → 제외</text>

  <!-- Namespace B -->
  <rect x="700" y="80" width="230" height="270" rx="10" fill="none" stroke="rgb(138,133,128)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="815" y="335" class="ns" text-anchor="middle">Namespace B</text>
  <g>
    <rect x="755" y="210" width="120" height="66" rx="8" fill="rgb(138,133,128)"/>
    <text x="815" y="234" class="pod" text-anchor="middle">quote-001</text>
    <rect x="770" y="244" width="90" height="20" rx="4" fill="rgb(220,220,220)"/>
    <text x="815" y="259" class="lbl" text-anchor="middle">app: quote</text>
  </g>
  <text x="815" y="175" class="note" text-anchor="middle" fill="rgb(138,133,128)">라벨은 같지만</text>
  <text x="815" y="192" class="note" text-anchor="middle" fill="rgb(138,133,128)">다른 네임스페이스 → 제외</text>
</svg>

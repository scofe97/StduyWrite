<text x="36" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">대기 창 10·20·40·80·160·300초 — kubelet 소스에서 계산한 값, 실측 아님</text>
<text x="36" y="340" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">300초 상한 — 소스의 MaxImageBackOff 와 공식 문서가 같은 값</text>

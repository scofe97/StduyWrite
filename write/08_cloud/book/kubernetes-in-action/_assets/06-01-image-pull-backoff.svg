<title id="dt">pull 이 실패하면 다음 시도까지 대기 창이 두 배씩 길어진다</title><desc id="dd">처음 대기 창은 10초이고 시도가 실패할 때마다 두 배가 되어 300초에서 멈춘다. 시도가 실패하는 순간 reason 은 ErrImagePull 이고, 대기 창 동안에는 ImagePullBackOff 로 바뀐다.</desc>
<rect width="1000" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 06-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">pull 이 실패하면 다음 시도까지 대기 창이 두 배씩 길어진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 이미지를 같은 Pod 가 받는 동안의 대기 창이다 — 새 Pod 는 10초부터 다시 시작한다</text>
<rect x="24" y="104" width="952" height="276" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">reason 이 번갈아 바뀐다 — 실패한 순간은 ErrImagePull, 기다리는 동안은 ImagePullBackOff</text>
<text x="36" y="197" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#F5F5F3">waiting.reason</text>

<svg viewBox="0 0 1080 600" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>apply한 필드가 통과하는 두 관문 — 스키마와 컨트롤러</title>
  <desc>매니페스트 하나가 적용될 때 지나는 경로를 따라간다. kubectl apply로 보낸 필드는 먼저 API 서버의 CRD 스키마 검사를 지난다. 스키마는 그 필드가 정의에 있는지와 타입이 맞는지만 보므로 통과하고, 오브젝트는 저장되어 get으로 조회하면 정상으로 보인다. 다음 관문은 컨트롤러다. 컨트롤러가 그 필드를 구현했으면 프록시 설정으로 반영되어 트래픽에 실제로 걸리지만, 구현하지 않았으면 아무 반응 없이 지나간다. 이때 예외도 에러 로그도 나지 않고 오브젝트는 여전히 정상으로 보인다. 두 관문이 서로 다른 것을 보므로 축도 둘로 나뉜다. 첫째 관문의 통과 여부를 좌우하는 것이 release channel이고, 둘째 관문의 통과 여부를 좌우하는 것이 support level이다. 그래서 standard 채널에 있으면서 extended 수준인 필드가 함정이 된다. 첫째 관문은 항상 통과하지만 둘째 관문에서 조용히 걸러질 수 있기 때문이다. 자바에 견주면 첫째 관문은 컴파일러에 해당하는데, 메서드 몸통이 비어 있어도 컴파일은 통과하는 것과 같다.</desc>
  <defs>
    <style>
      .h1   { font-size: 22px; font-weight: 800; fill: #e8e4df; }
      .gate { font-size: 14px; font-weight: 800; fill: #e8e4df; }
      .tag  { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .mono { font-size: 11.5px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .monod{ font-size: 11.5px; font-weight: 700; fill: #e8e4df; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .k    { font-size: 12.5px; font-weight: 700; fill: #0d0d0d; }
      .who  { font-size: 12.5px; fill: #b8b3ad; }
      .axis { font-size: 13px; font-weight: 800; }
      .num  { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
    </style>
    <marker id="ar-g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(102,187,106)"/>
    </marker>
    <marker id="ar-p" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(240,150,190)"/>
    </marker>
    <marker id="ar-w" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="600" fill="#0d0d0d"/>

  <text x="30" y="42" class="h1">필드 하나가 지나는 두 관문</text>

  <!-- 출발 -->
  <rect x="30" y="86" width="176" height="72" rx="9" fill="rgb(212,168,83)"/>
  <text x="118" y="114" class="k" text-anchor="middle">apply 한 필드</text>
  <text x="118" y="140" class="mono" text-anchor="middle">filters: [...]</text>

  <line x1="212" y1="122" x2="252" y2="122" stroke="#b8b3ad" stroke-width="2.4" marker-end="url(#ar-w)"/>

  <!-- 관문 1 -->
  <rect x="258" y="74" width="300" height="96" rx="11" fill="rgb(20,20,20)" stroke="rgb(102,187,106)" stroke-width="1.8"/>
  <circle cx="282" cy="98" r="11" fill="rgb(102,187,106)"/>
  <text x="282" y="103" class="num" text-anchor="middle">1</text>
  <text x="302" y="103" class="gate">관문 · CRD 스키마</text>
  <text x="278" y="130" class="who">필드가 정의에 있는가</text>
  <text x="278" y="152" class="who">타입이 맞는가</text>
  <rect x="458" y="116" width="82" height="26" rx="5" fill="rgb(102,187,106)"/>
  <text x="499" y="134" class="k" text-anchor="middle">통과</text>

  <line x1="564" y1="122" x2="604" y2="122" stroke="rgb(102,187,106)" stroke-width="2.4" marker-end="url(#ar-g)"/>

  <!-- 저장 -->
  <rect x="610" y="86" width="200" height="72" rx="9" fill="rgb(102,187,106)"/>
  <text x="710" y="114" class="tag" text-anchor="middle">저장됨</text>
  <text x="710" y="140" class="k" text-anchor="middle">get 하면 정상</text>

  <line x1="710" y1="164" x2="710" y2="202" stroke="#b8b3ad" stroke-width="2.4" marker-end="url(#ar-w)"/>

  <!-- 관문 2 -->
  <rect x="258" y="208" width="552" height="116" rx="11" fill="rgb(20,20,20)" stroke="rgb(240,150,190)" stroke-width="1.8"/>
  <circle cx="282" cy="234" r="11" fill="rgb(240,150,190)"/>
  <text x="282" y="239" class="num" text-anchor="middle">2</text>
  <text x="302" y="239" class="gate">관문 · 컨트롤러</text>
  <text x="278" y="266" class="who">이 필드를 구현했는가</text>

  <rect x="278" y="280" width="240" height="30" rx="5" fill="rgb(102,187,106)"/>
  <text x="398" y="300" class="k" text-anchor="middle">구현함 → 설정에 반영</text>

  <rect x="538" y="280" width="252" height="30" rx="5" fill="rgb(240,150,190)"/>
  <text x="664" y="300" class="k" text-anchor="middle">구현 안 함 → 지나감</text>

  <line x1="664" y1="330" x2="664" y2="366" stroke="rgb(240,150,190)" stroke-width="2.4" marker-end="url(#ar-p)"/>

  <!-- 결과 -->
  <rect x="470" y="372" width="388" height="76" rx="10" fill="rgb(240,150,190)"/>
  <text x="664" y="400" class="tag" text-anchor="middle">필터 없이 흐릅니다</text>
  <text x="664" y="424" class="k" text-anchor="middle">예외 없음 · 로그 없음</text>
  <text x="664" y="442" class="k" text-anchor="middle">오브젝트는 정상</text>

  <!-- 자바 비유 -->
  <rect x="30" y="372" width="410" height="76" rx="10" fill="rgb(20,20,20)" stroke="rgb(91,155,213)" stroke-width="1.5"/>
  <text x="52" y="398" class="who">관문 1 = 자바 컴파일러</text>
  <rect x="52" y="408" width="366" height="28" rx="5" fill="rgb(24,28,32)" stroke="rgb(120,116,112)" stroke-width="1.1"/>
  <text x="66" y="427" class="monod">void applyFilter() { }</text>

  <!-- 두 축 대응 -->
  <line x1="30" y1="474" x2="1050" y2="474" stroke="rgb(42,37,32)" stroke-width="1.3"/>
  <text x="30" y="500" class="who">관문마다 축이 하나씩</text>

  <rect x="30" y="512" width="500" height="72" rx="10" fill="rgba(102,187,106,0.10)" stroke="rgb(102,187,106)" stroke-width="1.4"/>
  <text x="52" y="538" class="axis" style="fill:rgb(102,187,106)">1 · release channel</text>
  <text x="52" y="562" class="who">standard = 계속 통과</text>

  <rect x="550" y="512" width="500" height="72" rx="10" fill="rgba(240,150,190,0.10)" stroke="rgb(240,150,190)" stroke-width="1.4"/>
  <text x="572" y="538" class="axis" style="fill:rgb(240,150,190)">2 · support level</text>
  <text x="572" y="562" class="who">core = 어디서나 통과</text>
</svg>

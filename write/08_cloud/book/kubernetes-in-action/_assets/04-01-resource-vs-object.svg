<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">리소스는 창구이고 오브젝트는 대상이다 — 1:1 이 아니다</title><desc id="dd">같은 Deployment 오브젝트가 apps/v1 과 extensions/v1beta1 두 스키마의 리소스로 노출되고, 어떤 리소스는 아무 오브젝트도 가리키지 않고 판정만 돌려준다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 04-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">리소스는 창구이고 오브젝트는 대상이다 — 1:1 이 아니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">리소스는 상호작용하는 창구(뷰)이고 오브젝트는 저장되는 대상(테이블)이다</text>
<rect x="24" y="104" width="952" height="480" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">URI 가 다르다고 다른 오브젝트가 아니고, URI 가 있다고 오브젝트가 있는 것도 아니다</text>
<text x="320" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">리소스 — 창구(URI)</text>
<text x="800" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">오브젝트 — 저장되는 대상</text>
<rect x="40" y="204" width="560" height="48" rx="5" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="56" y="233" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F0616D">/apis/authorization.k8s.io/v1/subjectaccessreviews</text>
<rect x="660" y="198" width="280" height="60" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="800" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">가리키는 오브젝트 없다</text>
<text x="800" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">권한 여부만 응답한다</text>
<path d="M 606 228 L 650 228" fill="none" stroke="#F0616D" stroke-width="1.6" marker-end="url(#bad)"/>
<rect x="40" y="296" width="560" height="48" rx="5" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="56" y="325" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">/apis/apps/v1/…/deployments</text>
<rect x="40" y="352" width="560" height="48" rx="5" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="56" y="381" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">/apis/apps/v1/…/deployments/mydeploy</text>
<rect x="40" y="408" width="560" height="48" rx="5" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="56" y="437" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">/apis/extensions/v1beta1/…/deployments</text>
<rect x="40" y="464" width="560" height="48" rx="5" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="56" y="493" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">/apis/extensions/v1beta1/…/deployments/mydeploy</text>
<rect x="660" y="344" width="280" height="120" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="800" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">Deployment mydeploy</text>
<text x="800" y="420" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">저장되는 것은 이 하나뿐이다</text>
<path d="M 606 320 L 660 320" fill="none" stroke="#3FB98C" stroke-width="1.4"/>
<path d="M 606 376 L 660 376" fill="none" stroke="#3FB98C" stroke-width="1.4"/>
<path d="M 606 432 L 660 432" fill="none" stroke="#6A95D8" stroke-width="1.4"/>
<path d="M 606 488 L 660 488" fill="none" stroke="#6A95D8" stroke-width="1.4"/>
<path d="M 660 320 L 660 488" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 660 404 L 650 404" fill="none" stroke="#F08A59" stroke-width="1.8" marker-end="url(#acc)"/>
<circle cx="660" cy="404" r="4" fill="#F5F5F3"/>
<text x="660" y="290" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">넷 다 같은 것을 가리킨다</text>
<text x="36" y="536" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">apps/v1 과 extensions/v1beta1 은 같은 객체의 다른 표현이다 — 스키마가 다를 뿐 저장된 것은 하나다.</text>
<line x1="12" y1="600" x2="952" y2="600" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="622" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="612" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="122" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">가리키는 대상이 없는 리소스</text>
<rect x="339" y="612" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="361" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">apps/v1 스키마</text>
<rect x="526" y="612" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="548" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">extensions/v1beta1 스키마</text>
<rect x="856" y="612" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="878" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">저장되는 오브젝트</text>
</svg>
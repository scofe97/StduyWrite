<svg viewBox="0 0 900 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>hostPath path:/의 위험 — 노드 파일시스템 전체 노출</title>
  <desc>node-explorer 파드가 hostPath로 노드 루트를 /host에 마운트하면, 컨테이너 안에서 워커 노드의 모든 파일과 다른 파드의 볼륨 데이터, Docker 소켓까지 접근할 수 있다.</desc>

  <rect x="0" y="0" width="900" height="470" fill="#0d0d0d"/>
  <text x="30" y="38" fill="#f44336" font-size="16" font-weight="700">path: / + root 컨테이너 = 노드 전체 장악 가능</text>

  <!-- 왼쪽: 노드 파일시스템 트리 (빨강 테두리로 위험 표시) -->
  <rect x="30" y="60" width="480" height="380" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="46" y="86" fill="#f44336" font-size="13" font-weight="700">워커 노드  k8s-lab-worker  파일시스템  /</text>

  <!-- 트리 (mono, 밝은 글자) -->
  <text x="50" y="116" fill="#e8e4df" font-family="'JetBrains Mono',monospace" font-size="12">📁 bin  etc  home  usr  var …</text>
  <text x="50" y="140" fill="rgb(212,168,83)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">📁 kind/</text>
  <text x="120" y="140" fill="#e8e4df" font-family="'JetBrains Mono',monospace" font-size="11">← 노드임을 드러내는 증거</text>

  <!-- var/lib/kubelet/pods 강조 -->
  <line x1="66" y1="150" x2="66" y2="176" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <line x1="66" y1="176" x2="80" y2="176" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <text x="86" y="181" fill="#e8e4df" font-family="'JetBrains Mono',monospace" font-size="12">📁 var/lib/kubelet/pods/</text>
  <!-- 다른 파드 볼륨 칩 (연빨강 밝은 칩 → 어두운 글자, 위험 강조) -->
  <line x1="102" y1="187" x2="102" y2="290" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <rect x="116" y="196" width="376" height="104" rx="5" fill="#f2d4d4" stroke="#f44336"/>
  <text x="128" y="216" style="fill:#7a1f1f" font-size="11" font-weight="700">다른 파드들의 볼륨 (남의 데이터)</text>
  <text x="128" y="237" style="fill:#7a1f1f" font-family="'JetBrains Mono',monospace" font-size="10">📁 0168efbd-b542-…/</text>
  <text x="128" y="255" style="fill:#7a1f1f" font-family="'JetBrains Mono',monospace" font-size="10">📁 01ccaa92-aab1-…/</text>
  <text x="128" y="273" style="fill:#7a1f1f" font-family="'JetBrains Mono',monospace" font-size="10">📁 1dc20e97-5bdd-…/</text>
  <text x="128" y="292" style="fill:#3a1010" font-size="10">→ 이 파드 것이 아닌 볼륨까지 읽힌다</text>

  <!-- docker.sock 시나리오 -->
  <rect x="50" y="320" width="442" height="106" rx="5" fill="#f5edda" stroke="rgb(42,37,32)"/>
  <text x="62" y="340" style="fill:#3a2f10" font-size="11" font-weight="700">더 나아가면</text>
  <text x="62" y="361" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="10.5">📄 /var/run/docker.sock</text>
  <text x="62" y="382" style="fill:#3a2f10" font-size="10.5">이 소켓을 마운트하면 컨테이너 안에서</text>
  <text x="62" y="401" style="fill:#3a2f10" font-size="10.5">Docker 클라이언트로 호스트에 root 명령 실행</text>
  <text x="62" y="419" style="fill:#7a1f1f" font-size="10.5" font-weight="700">→ 노드 완전 장악</text>

  <!-- mount 화살표 -->
  <line x1="510" y1="240" x2="608" y2="240" stroke="#f44336" stroke-width="2.5" marker-end="url(#ax)"/>
  <text x="559" y="230" fill="#f44336" font-size="12" font-weight="700" text-anchor="middle">hostPath</text>
  <text x="559" y="258" fill="#e8e4df" font-size="10" text-anchor="middle">mount</text>
  <defs><marker id="ax" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f44336"/></marker></defs>

  <!-- 오른쪽: node-explorer 컨테이너 -->
  <rect x="628" y="150" width="250" height="180" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="643" y="176" fill="rgb(212,168,83)" font-size="13" font-weight="700">node-explorer 컨테이너</text>
  <rect x="643" y="190" width="220" height="46" rx="4" fill="#f5edda" stroke="rgb(42,37,32)"/>
  <text x="653" y="210" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700">📁 /host</text>
  <text x="653" y="228" style="fill:#3a2f10" font-size="10">= 노드 루트 그대로</text>
  <text x="643" y="262" fill="#e8e4df" font-size="11">alpine · root 실행</text>
  <text x="643" y="284" fill="#e8e4df" font-size="11">ls /host/… 로 노드의</text>
  <text x="643" y="303" fill="#e8e4df" font-size="11">어떤 파일도 읽고 고침</text>

  <text x="30" y="458" fill="#e8e4df" font-size="11.5">그래서 hostPath는 특권 파드에만 허용한다 — 일반 사용자에게 열면 클러스터 전체가 위험해진다.</text>
</svg>

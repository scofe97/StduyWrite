<svg viewBox="0 0 1040 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>PVC 리사이즈의 2층 구조 — 블록 디바이스 확장과 파일시스템 확장</title>
  <desc>PVC 크기를 키우면 먼저 A층에서 CSI 컨트롤러가 클라우드 디스크/LVM 같은 블록 디바이스의 물리 크기를 파드와 무관하게 늘린다. 그러나 그 위 파일시스템(ext4·xfs)은 자기 메타데이터에 옛 크기를 기록 중이라, B층에서 resize2fs·xfs_growfs로 새 크기를 알려야 끝난다. 이 파일시스템 확장은 kubelet이 볼륨을 재마운트하는 시점에 트리거되므로, 파드를 재시작해야 FileSystemResizePending 조건이 풀리고 CAPACITY가 갱신된다.</desc>
  <defs>
    <style>
      .title  { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .zone   { font-size: 13px; font-weight: 800; fill: rgb(212,168,83); }
      .boxd   { font-size: 13px; font-weight: 800; fill: #e8e4df; }
      .desc   { font-size: 10.5px; font-weight: 600; fill: #e8e4df; }
      .darkd  { font-size: 10.5px; font-weight: 600; fill: #14243a; }
      .muted  { font-size: 9.5px; fill: rgb(138,133,128); }
      .mono   { font-size: 10px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .step   { font-size: 12px; font-weight: 800; fill: #e8e4df; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="470" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">PVC 리사이즈는 2층 — 블록 디바이스는 바로, 파일시스템은 재마운트 때</text>
  <text x="24" y="50" class="sub">A층은 CSI 컨트롤러가 파드와 무관하게 즉시 처리하지만, B층 파일시스템 확장은 kubelet 재마운트 시점에만 일어난다.</text>

  <!-- 왼쪽: 2층 스택 -->
  <text x="40" y="84" class="zone">스토리지 스택 (아래→위)</text>

  <!-- B층 파일시스템 (위) -->
  <rect x="40" y="96" width="560" height="120" rx="12" fill="rgb(16,18,22)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="60" y="122" class="boxd" style="fill:rgb(212,168,83)">B층 · 파일시스템 (ext4 / xfs)</text>
  <rect x="60" y="134" width="250" height="64" rx="7" fill="rgb(20,22,26)" stroke="rgb(42,37,32)"/>
  <text x="185" y="156" class="desc" text-anchor="middle">메타데이터에 옛 크기 기록 중</text>
  <text x="185" y="176" class="muted" text-anchor="middle">디바이스가 커져도 스스로 모름</text>
  <text x="185" y="190" class="mono" text-anchor="middle" style="fill:rgb(138,133,128)">size = 1Gi (stale)</text>
  <rect x="330" y="134" width="250" height="64" rx="7" fill="#d4a853"/>
  <text x="455" y="154" class="darkd" text-anchor="middle" style="fill:#1a1a1a">resize2fs / xfs_growfs</text>
  <text x="455" y="172" class="mono" text-anchor="middle" style="fill:#1a1a1a">"너 커졌다" 알림</text>
  <text x="455" y="190" class="mono" text-anchor="middle" style="fill:#1a1a1a">→ size = 10Gi</text>

  <!-- A층 블록 디바이스 (아래) -->
  <rect x="40" y="230" width="560" height="120" rx="12" fill="rgb(16,18,22)" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="60" y="256" class="boxd" style="fill:#8fc0ec">A층 · 블록 디바이스 (클라우드 디스크 / LVM)</text>
  <rect x="60" y="268" width="250" height="64" rx="7" fill="#5b9bd5"/>
  <text x="185" y="290" class="boxd" text-anchor="middle" style="fill:#e8e4df">CSI 컨트롤러가 확장</text>
  <text x="185" y="308" class="muted" text-anchor="middle" style="fill:#e8e4df">파드와 무관 · 즉시</text>
  <text x="185" y="324" class="mono" text-anchor="middle" style="fill:#e8e4df">1Gi → 10Gi (물리)</text>
  <rect x="330" y="268" width="250" height="64" rx="7" fill="rgb(20,22,26)" stroke="#5b9bd5" stroke-width="1.2"/>
  <text x="455" y="294" class="desc" text-anchor="middle" style="fill:#8fc0ec">물리 용량은 이미 10Gi</text>
  <text x="455" y="314" class="muted" text-anchor="middle">하지만 파일시스템이 못 씀</text>

  <!-- A→B 세로 화살표 -->
  <line x1="320" y1="268" x2="320" y2="216" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="335" y="246" class="muted" style="fill:rgb(212,168,83)">확장분은 B층이 인식해야 실제로 쓰임</text>

  <!-- 오른쪽: 타임라인 -->
  <text x="660" y="84" class="zone">언제 B층이 끝나는가</text>
  <rect x="648" y="96" width="360" height="330" rx="12" fill="rgb(16,18,22)" stroke="rgb(42,37,32)" stroke-width="1.2"/>

  <!-- 타임라인 스텝 -->
  <circle cx="680" cy="140" r="7" fill="#f44336"/>
  <text x="700" y="136" class="step">apply로 크기 10Gi 요청</text>
  <text x="700" y="153" class="mono" style="fill:rgb(138,133,128)">FileSystemResizePending = True</text>

  <circle cx="680" cy="210" r="7" fill="rgb(138,133,128)"/>
  <text x="700" y="206" class="step">CAPACITY 아직 1Gi</text>
  <text x="700" y="223" class="muted">A층은 끝났지만 B층 대기</text>

  <circle cx="680" cy="280" r="7" fill="#d4a853"/>
  <text x="700" y="276" class="step">파드 삭제 → 재생성</text>
  <text x="700" y="293" class="muted">언마운트 → 재마운트 경계</text>
  <text x="700" y="309" class="muted">쓰는 볼륨에 안 끼어들어 안전</text>

  <circle cx="680" cy="366" r="7" fill="#66bb6a"/>
  <text x="700" y="362" class="step" style="fill:#66bb6a">재마운트 때 B층 실행</text>
  <text x="700" y="379" class="mono" style="fill:#66bb6a">CAPACITY = 10Gi ✓</text>

  <line x1="680" y1="147" x2="680" y2="203" stroke="rgb(42,37,32)" stroke-width="2"/>
  <line x1="680" y1="217" x2="680" y2="273" stroke="rgb(42,37,32)" stroke-width="2"/>
  <line x1="680" y1="287" x2="680" y2="359" stroke="#d4a853" stroke-width="2" marker-end="url(#arg)"/>

  <text x="24" y="452" class="muted">온라인 확장을 지원하는 CSI 드라이버는 재시작 없이 B층까지 끝내기도 하지만, local-path 등 기본 경로는 위 오프라인 흐름을 따른다.</text>
</svg>

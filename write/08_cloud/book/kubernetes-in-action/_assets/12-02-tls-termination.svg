<svg viewBox="0 0 960 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Ingress에서 TLS를 종료한다</title>
  <desc>클라이언트는 프록시에 HTTPS/TLS로 붙는다. 프록시가 TLS 연결을 종료하고 백엔드 파드로는 암호화되지 않은 HTTP를 연다. 따라서 파드에서 도는 애플리케이션은 HTTPS를 이해할 필요가 없다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .cli   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .ing   { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .pod   { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .proto { font-size: 12px; font-weight: 800; fill: rgb(212,168,83); }
      .note  { font-size: 11px; fill: #e8e4df; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="300" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Ingress에서 TLS를 종료합니다</text>
  <text x="24" y="50" class="sub">프록시가 TLS를 끝내고 백엔드 파드로는 평문 HTTP를 보내므로, 파드는 HTTPS를 몰라도 됩니다</text>

  <!-- Client -->
  <rect x="40" y="140" width="120" height="52" rx="8" fill="rgb(102,187,106)"/>
  <text x="100" y="171" class="cli" text-anchor="middle">Client</text>
  <text x="60" y="120" class="note">클라이언트는 HTTPS/TLS로 붙습니다</text>

  <!-- HTTPS segment -->
  <line x1="160" y1="166" x2="358" y2="166" stroke="rgb(212,168,83)" stroke-width="3.5"/>
  <text x="260" y="156" class="proto" text-anchor="middle">HTTPS / TLS</text>

  <!-- Ingress proxy -->
  <rect x="360" y="140" width="120" height="52" rx="8" fill="rgb(150,130,220)"/>
  <text x="420" y="171" class="ing" text-anchor="middle">Ingress</text>
  <text x="420" y="120" class="note" text-anchor="middle">여기서 TLS 종료</text>

  <!-- HTTP segment -->
  <line x1="480" y1="166" x2="640" y2="166" stroke="rgb(138,133,128)" stroke-width="2"/>
  <text x="560" y="156" class="proto" text-anchor="middle" fill="rgb(138,133,128)">HTTP (평문)</text>

  <!-- cluster + pods -->
  <rect x="620" y="100" width="320" height="150" rx="10" fill="none" stroke="rgb(138,133,128)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="920" y="120" class="sub" text-anchor="end">Kubernetes cluster</text>
  <g fill="rgb(91,155,213)">
    <rect x="645" y="150" width="80" height="46" rx="8"/><rect x="740" y="150" width="80" height="46" rx="8"/><rect x="835" y="150" width="80" height="46" rx="8"/>
  </g>
  <text x="685" y="178" class="pod" text-anchor="middle">Pod</text><text x="780" y="178" class="pod" text-anchor="middle">Pod</text><text x="875" y="178" class="pod" text-anchor="middle">Pod</text>

  <text x="780" y="232" class="note" text-anchor="middle">파드의 애플리케이션은 HTTPS를 이해할 필요가 없습니다</text>
  <text x="480" y="285" class="sub" text-anchor="middle">인증서·키는 tls 타입 Secret(tls.crt·tls.key)으로 만들어 spec.tls[].secretName으로 참조합니다</text>
</svg>

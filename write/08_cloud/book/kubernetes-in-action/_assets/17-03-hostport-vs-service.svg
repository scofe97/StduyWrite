<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">규칙을 만든 주체가 목적지를 정한다</title><desc id="dd">노드 A 의 같은 IP 로 들어와도 어느 규칙에 걸리느냐에 따라 목적지가 갈린다. 하나는 클러스터 전역에서 고르고, 하나는 이 노드의 컨테이너로 고정한다.</desc>
<rect width="1240" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 17-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">규칙을 만든 주체가 목적지를 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">kube-proxy 의 규칙과 CNI portmap 의 규칙</text>
<rect x="50" y="278" width="220" height="84" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="160" y="318" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">노드 A IP</text>
<text x="160" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">패킷이 들어온다</text>
<path d="M 272 296 L 326 296 L 326 220 L 380 220" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<rect x="390" y="182" width="300" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="540" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">kube-proxy 의 규칙</text>
<text x="540" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">NodePort Service</text>
<path d="M 692 220 L 800 220" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<rect x="820" y="182" width="340" height="76" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="990" y="218" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">클러스터 전역 엔드포인트</text>
<text x="990" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어느 노드의 파드든</text>
<path d="M 272 344 L 326 344 L 326 420 L 380 420" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<rect x="390" y="382" width="300" height="76" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="540" y="418" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">CNI portmap 의 규칙</text>
<text x="540" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">hostPort</text>
<path d="M 692 420 L 800 420" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<rect x="820" y="382" width="340" height="76" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="990" y="418" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">노드 A 의 로컬 컨테이너</text>
<text x="990" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">이 노드로 고정</text>
<text x="620" y="320" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">같은 입구, 다른 규칙</text>
<text x="24" y="512" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 hostPort 와 NodePort 는 겉으로 비슷해 보여도 쓰임이 다르다. 하나는 어느 파드든 괜찮을 때, 하나는 이 노드의 것이어야 할 때다.</text>
<text x="24" y="534" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">둘 다 노드 IP 로 들어오므로, 무엇이 걸릴지는 포트 번호와 심어 둔 규칙이 정한다.</text>
<line x1="12" y1="560" x2="1192" y2="560" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="582" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="572" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">전역에서 고른다</text>
<rect x="248" y="572" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="270" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">이 노드로 고정</text>
</svg>
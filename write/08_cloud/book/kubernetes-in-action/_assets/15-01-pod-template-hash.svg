<svg viewBox="0 0 960 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>pod-template-hash로 기존 파드가 흡수되지 않는 이유</title>
  <desc>Deployment의 selector는 app=kiada, rel=stable이지만, ReplicaSet의 selector에는 pod-template-hash가 추가된다. ReplicaSet이 만든 파드에는 이 hash 라벨이 있어 매칭되지만, 기존 파드에는 hash가 없어 ReplicaSet의 selector에 맞지 않아 흡수되지 않는다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .obj   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .sel   { font-size: 10px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .hash  { font-size: 10px; font-weight: 800; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .pod   { font-size: 10px; font-weight: 700; fill: #0d0d0d; }
      .note  { font-size: 10.5px; fill: #e8e4df; }
      .out   { font-size: 10.5px; fill: rgb(240,150,190); }
    </style>
    <marker id="pth-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="380" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">pod-template-hash — 기존 파드가 흡수되지 않는 이유</text>
  <text x="24" y="50" class="sub">ReplicaSet의 selector에는 hash가 더해져, hash 없는 기존 파드는 맞지 않습니다</text>

  <!-- Deployment -->
  <rect x="40" y="80" width="200" height="76" rx="8" fill="rgb(91,155,213)"/>
  <text x="140" y="103" class="obj" text-anchor="middle">kiada Deployment</text>
  <rect x="56" y="114" width="168" height="34" rx="5" fill="rgb(200,220,245)"/>
  <text x="140" y="128" class="sel" text-anchor="middle">selector: app=kiada</text>
  <text x="140" y="142" class="sel" text-anchor="middle">rel=stable</text>

  <!-- ReplicaSet (selector + hash) -->
  <rect x="380" y="80" width="220" height="92" rx="8" fill="rgb(140,190,235)"/>
  <text x="490" y="103" class="obj" text-anchor="middle">kiada-7bffb9bf96 RS</text>
  <rect x="396" y="114" width="188" height="48" rx="5" fill="rgb(200,220,245)"/>
  <text x="490" y="128" class="sel" text-anchor="middle">selector: app=kiada</text>
  <text x="490" y="141" class="sel" text-anchor="middle">rel=stable</text>
  <text x="490" y="155" class="hash" text-anchor="middle" style="fill:#7a5a10">pod-template-hash=7bffb9bf96</text>
  <line x1="240" y1="120" x2="378" y2="120" stroke="rgb(138,133,128)" stroke-width="1.6" stroke-dasharray="5 3"/>

  <!-- new pods (with hash) matched -->
  <rect x="380" y="210" width="520" height="90" rx="10" fill="none" stroke="rgb(212,168,83)" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="640" y="230" class="note" text-anchor="middle" fill="rgb(212,168,83)">hash 있음 → ReplicaSet이 관리</text>
  <g>
    <rect x="400" y="242" width="150" height="46" rx="6" fill="rgb(140,190,235)"/>
    <rect x="565" y="242" width="150" height="46" rx="6" fill="rgb(140,190,235)"/>
    <rect x="730" y="242" width="150" height="46" rx="6" fill="rgb(140,190,235)"/>
  </g>
  <g class="pod" text-anchor="middle">
    <text x="475" y="262">kiada-7bffb9bf96-4knb6</text><text x="475" y="278" class="hash" style="fill:#7a5a10">hash=7bffb9bf96</text>
    <text x="640" y="262">kiada-7bffb9bf96-7g2md</text><text x="640" y="278" class="hash" style="fill:#7a5a10">hash=7bffb9bf96</text>
    <text x="805" y="262">kiada-7bffb9bf96-qf4t7</text><text x="805" y="278" class="hash" style="fill:#7a5a10">hash=7bffb9bf96</text>
  </g>
  <line x1="490" y1="172" x2="490" y2="240" stroke="rgb(212,168,83)" stroke-width="1.8" marker-end="url(#pth-a)"/>

  <!-- old pods (no hash) ignored -->
  <rect x="40" y="242" width="150" height="46" rx="6" fill="rgb(90,90,90)"/>
  <text x="115" y="262" class="pod" text-anchor="middle" fill="#e8e4df">kiada-4t87s</text>
  <text x="115" y="278" class="pod" text-anchor="middle" fill="#e8e4df">hash 없음</text>
  <rect x="40" y="300" width="150" height="46" rx="6" fill="rgb(90,90,90)"/>
  <text x="115" y="320" class="pod" text-anchor="middle" fill="#e8e4df">kiada-5lg8b</text>
  <text x="115" y="336" class="pod" text-anchor="middle" fill="#e8e4df">hash 없음</text>
  <text x="115" y="230" class="out" text-anchor="middle">기존 파드 → 흡수 안 됨</text>
</svg>

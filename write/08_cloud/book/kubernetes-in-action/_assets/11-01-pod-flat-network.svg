<svg viewBox="0 0 960 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>파드는 NAT 없는 flat 네트워크로 통신한다</title>
  <desc>노드가 지리적으로 흩어져 여러 라우터를 거치더라도, 파드는 NAT가 필요 없는 자신들의 flat 네트워크 위에서 IP를 그대로 주고받는다. 출발지·목적지 IP와 포트가 바뀌지 않으므로 받는 파드는 보낸 파드의 진짜 IP를 본다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .node  { font-size: 12px; font-weight: 700; fill: rgb(212,168,83); }
      .pod   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .eth   { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .flat  { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .note  { font-size: 11px; fill: #e8e4df; }
    </style>
    <marker id="fn-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(102,187,106)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="400" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">파드끼리는 NAT 없는 flat 네트워크로 통신합니다</text>
  <text x="24" y="50" class="sub">노드 사이 토폴로지·라우터가 아무리 많아도, 파드 관점에선 하나의 스위치에 물린 LAN처럼 서로 닿습니다</text>

  <!-- Node 1 -->
  <rect x="40" y="90" width="300" height="180" rx="10" fill="rgb(30,26,20)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="60" y="114" class="node">Node 1</text>
  <rect x="60" y="128" width="140" height="52" rx="8" fill="rgb(91,155,213)"/>
  <text x="130" y="150" class="pod" text-anchor="middle">Pod</text>
  <rect x="60" y="196" width="140" height="52" rx="8" fill="rgb(91,155,213)"/>
  <text x="130" y="218" class="pod" text-anchor="middle">Pod</text>
  <rect x="210" y="140" width="46" height="26" rx="4" fill="rgb(220,234,247)"/>
  <text x="233" y="158" class="eth" text-anchor="middle">eth0</text>
  <rect x="210" y="208" width="46" height="26" rx="4" fill="rgb(220,234,247)"/>
  <text x="233" y="226" class="eth" text-anchor="middle">eth0</text>

  <!-- Node 2 -->
  <rect x="620" y="90" width="300" height="180" rx="10" fill="rgb(30,26,20)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="640" y="114" class="node">Node 2</text>
  <rect x="760" y="128" width="140" height="52" rx="8" fill="rgb(91,155,213)"/>
  <text x="830" y="150" class="pod" text-anchor="middle">Pod</text>
  <rect x="760" y="196" width="140" height="52" rx="8" fill="rgb(91,155,213)"/>
  <text x="830" y="218" class="pod" text-anchor="middle">Pod</text>
  <rect x="704" y="140" width="46" height="26" rx="4" fill="rgb(220,234,247)"/>
  <text x="727" y="158" class="eth" text-anchor="middle">eth0</text>
  <rect x="704" y="208" width="46" height="26" rx="4" fill="rgb(220,234,247)"/>
  <text x="727" y="226" class="eth" text-anchor="middle">eth0</text>

  <!-- network cloud in the middle -->
  <ellipse cx="480" cy="150" rx="90" ry="40" fill="rgb(24,28,32)" stroke="rgb(138,133,128)" stroke-width="1.5"/>
  <text x="480" y="155" class="node" text-anchor="middle" fill="rgb(138,133,128)">Network</text>
  <line x1="256" y1="153" x2="392" y2="150" stroke="rgb(138,133,128)" stroke-width="2.5"/>
  <line x1="568" y1="150" x2="704" y2="153" stroke="rgb(138,133,128)" stroke-width="2.5"/>
  <text x="480" y="105" class="note" text-anchor="middle">노드 간 토폴로지·NAT 게이트웨이가 아무리 많아도 …</text>

  <!-- flat network bar -->
  <rect x="120" y="310" width="720" height="50" rx="10" fill="rgb(102,187,106)"/>
  <text x="480" y="341" class="flat" text-anchor="middle">Flat network (NAT 없음 — SNAT/DNAT 미수행, 출발지·목적지 IP 불변)</text>
  <line x1="233" y1="234" x2="233" y2="310" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#fn-arrow)"/>
  <line x1="727" y1="234" x2="727" y2="310" stroke="rgb(102,187,106)" stroke-width="2" marker-end="url(#fn-arrow)"/>
  <text x="480" y="385" class="sub" text-anchor="middle">… 파드는 주소 변환 없는 flat 네트워크로 연결됩니다 — 받는 파드는 보낸 파드의 진짜 IP를 봅니다</text>
</svg>

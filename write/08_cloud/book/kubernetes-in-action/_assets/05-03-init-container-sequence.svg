<title id="dt">init 은 하나씩 이어지고, 주 컨테이너는 한꺼번에 뜬다</title><desc id="dd">init 컨테이너는 정의된 순서대로 하나가 끝나야 다음이 시작한다. 마지막 init 이 완료된 뒤에야 주 컨테이너들이 시작하고, 그들 사이에는 순서 보장이 없다.</desc>
<rect width="1000" height="584" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 05-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">init 은 하나씩 이어지고, 주 컨테이너는 한꺼번에 뜬다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앞 구간은 겹치지 않고 뒤 구간은 겹친다 — 막대가 겹치는지가 곧 병렬 여부다</text>
<rect x="24" y="104" width="952" height="424" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">마지막 init 이 성공해야 이 문이 열린다 — 실패하면 주 컨테이너는 시작조차 못 한다</text>
<text x="240" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">시간 →</text>
<line x1="60" y1="204" x2="940" y2="204" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="224" y="248" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">1st init</text>
<rect x="240" y="229" width="140" height="30" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.0"/>
<text x="310" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">끝나야 다음이 시작한다</text>
<text x="224" y="300" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">2nd init</text>
<rect x="380" y="281" width="140" height="30" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.0"/>
<text x="450" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">앞이 성공해야 시작한다</text>
<text x="224" y="352" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#6A95D8">last init</text>
<rect x="520" y="333" width="140" height="30" rx="4" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.0"/>
<text x="590" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">여기까지 순차다</text>
<text x="224" y="404" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">Container A</text>
<rect x="660" y="385" width="280" height="30" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="800" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">동시에 시작한다</text>
<text x="224" y="456" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="600" fill="#3FB98C">Container B</text>
<rect x="660" y="437" width="280" height="30" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="800" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">순서 보장은 없다</text>
<path d="M 660 212 L 660 480" fill="none" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="6 5"/>
<rect x="521.0" y="211" width="278.0" height="18" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="660" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">마지막 init 완료 — 여기서 문이 열린다</text>
<path d="M 62 229 L 52 229 L 52 363 L 62 363" fill="none" stroke="#6A95D8" stroke-width="1.2"/>
<line x1="52" y1="296.0" x2="68" y2="296.0" stroke="#6A95D8" stroke-width="1.2"/>
<text x="74" y="300.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6A95D8">순차</text>
<path d="M 62 385 L 52 385 L 52 467 L 62 467" fill="none" stroke="#3FB98C" stroke-width="1.2"/>
<line x1="52" y1="426.0" x2="68" y2="426.0" stroke="#3FB98C" stroke-width="1.2"/>
<text x="74" y="430.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">병렬</text>
<text x="36" y="496" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">init 이 도는 동안 주 컨테이너의 state 는 waiting/PodInitializing 이다 — 아직 시작 전이라는 뜻이다</text>
<line x1="12" y1="544" x2="952" y2="544" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="566" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="556" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">순차로 도는 init</text>
<rect x="287" y="556" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="309" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">한꺼번에 뜨는 주 컨테이너</text>
<rect x="513" y="556" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="535" y="566" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">문이 열리는 시점</text>
</svg>
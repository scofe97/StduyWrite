<svg viewBox="0 0 1180 620" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>실제 네트워크 구조 위의 DNAT 흐름 — 클라이언트 파드에서 대상 파드까지</title>
  <desc>클라이언트 파드가 ClusterIP로 패킷을 보내면, 그 노드의 커널 netfilter가 목적지를 실제 파드 IP로 바꾸는 DNAT를 수행한 뒤 노드 밖으로 내보낸다. 패킷은 veth와 브리지, eth0을 거쳐 대상 파드가 있는 노드로 가고, 그 노드의 veth를 통해 대상 파드에 닿는다. 그림에서 패킷 헤더의 목적지 IP가 ClusterIP 10.96.74.151에서 파드 IP 10.244.2.9로 바뀌는 지점이 DNAT가 일어나는 곳이다. ClusterIP는 어느 노드의 인터페이스에도 실재하지 않는 가상 IP라, 커널 규칙 안에서만 의미를 갖는다.</desc>
  <defs>
    <style>
      .title  { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .node   { font-size: 13px; font-weight: 800; fill: rgb(212,168,83); }
      .comp   { font-size: 11px; font-weight: 700; fill: #e8e4df; }
      .pod    { font-size: 12px; font-weight: 800; fill: #1a1a1a; }
      .podmono{ font-size: 9.5px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #1a1a1a; }
      .iface  { font-size: 9.5px; font-weight: 700; fill: #8fc0ec; }
      .muted  { font-size: 9.5px; fill: rgb(138,133,128); }
      .hdr    { font-size: 9.5px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .step   { font-size: 11px; font-weight: 800; fill: #0d0d0d; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">실제 네트워크 구조 위의 DNAT — ClusterIP는 어느 인터페이스에도 없다</text>
  <text x="24" y="50" class="sub">패킷이 노드·veth·브리지·eth0을 지나는 동안, 출발 노드의 커널에서 목적지 IP가 ClusterIP → 파드 IP로 바뀐다.</text>

  <!-- Node 1 -->
  <rect x="40" y="78" width="520" height="360" rx="14" fill="rgb(14,16,20)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="60" y="104" class="node">노드 1 (worker)</text>

  <!-- 클라이언트 파드 -->
  <rect x="64" y="120" width="180" height="90" rx="9" fill="#5b9bd5"/>
  <text x="154" y="146" class="comp" text-anchor="middle" style="fill:#e8e4df">클라이언트 파드</text>
  <text x="154" y="168" class="podmono" text-anchor="middle" style="fill:#e8e4df">10.244.1.5</text>
  <text x="154" y="190" class="podmono" text-anchor="middle" style="fill:#e8e4df">curl 10.96.74.151:80</text>

  <!-- veth1 -->
  <rect x="288" y="140" width="90" height="50" rx="7" fill="rgb(20,22,26)" stroke="#8fc0ec" stroke-width="1.1"/>
  <text x="333" y="162" class="iface" text-anchor="middle">veth</text>
  <text x="333" y="178" class="muted" text-anchor="middle">pod↔host</text>
  <line x1="244" y1="165" x2="284" y2="165" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 커널 netfilter (DNAT 지점) -->
  <rect x="64" y="240" width="470" height="118" rx="10" fill="rgb(20,22,26)" stroke="#f0b0b0" stroke-width="1.4"/>
  <text x="84" y="264" class="comp" style="fill:#f0b0b0">노드 1 커널 · netfilter (여기서 DNAT)</text>
  <text x="84" y="284" class="muted">kube-proxy가 심은 규칙이 ClusterIP를 대상 파드 IP로 바꾼다</text>

  <!-- DNAT 전 헤더 -->
  <rect x="84" y="298" width="200" height="46" rx="6" fill="rgb(30,20,20)" stroke="#f0b0b0" stroke-width="1"/>
  <text x="94" y="316" class="hdr" style="fill:#f0b0b0">dst 10.96.74.151:80</text>
  <text x="94" y="334" class="muted">DNAT 전 (ClusterIP · 가상)</text>

  <!-- 화살표 -->
  <line x1="288" y1="321" x2="330" y2="321" stroke="#f44336" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="309" y="313" class="muted" text-anchor="middle" style="fill:#f0b0b0">DNAT</text>

  <!-- DNAT 후 헤더 -->
  <rect x="334" y="298" width="190" height="46" rx="6" fill="rgb(20,30,22)" stroke="#66bb6a" stroke-width="1"/>
  <text x="344" y="316" class="hdr" style="fill:#66bb6a">dst 10.244.2.9:80</text>
  <text x="344" y="334" class="muted">DNAT 후 (실제 파드 IP)</text>

  <line x1="333" y1="190" x2="200" y2="236" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- eth0 (node1) -->
  <rect x="444" y="380" width="90" height="44" rx="7" fill="rgb(20,22,26)" stroke="#8fc0ec" stroke-width="1.1"/>
  <text x="489" y="400" class="iface" text-anchor="middle">eth0</text>
  <text x="489" y="415" class="muted" text-anchor="middle">노드 물리 NIC</text>
  <line x1="400" y1="358" x2="470" y2="376" stroke="#66bb6a" stroke-width="2" marker-end="url(#arg)"/>

  <!-- Node 2 -->
  <rect x="640" y="78" width="500" height="360" rx="14" fill="rgb(14,16,20)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="660" y="104" class="node">노드 2 (worker2)</text>

  <!-- eth0 (node2) -->
  <rect x="660" y="380" width="90" height="44" rx="7" fill="rgb(20,22,26)" stroke="#8fc0ec" stroke-width="1.1"/>
  <text x="705" y="400" class="iface" text-anchor="middle">eth0</text>
  <text x="705" y="415" class="muted" text-anchor="middle">노드 물리 NIC</text>

  <!-- veth2 -->
  <rect x="800" y="240" width="90" height="50" rx="7" fill="rgb(20,22,26)" stroke="#8fc0ec" stroke-width="1.1"/>
  <text x="845" y="262" class="iface" text-anchor="middle">veth</text>
  <text x="845" y="278" class="muted" text-anchor="middle">host↔pod</text>

  <!-- 대상 파드 -->
  <rect x="940" y="150" width="180" height="90" rx="9" fill="#66bb6a"/>
  <text x="1030" y="182" class="pod" text-anchor="middle">대상 파드</text>
  <text x="1030" y="206" class="podmono" text-anchor="middle">10.244.2.9</text>
  <text x="1030" y="226" class="podmono" text-anchor="middle">:80 수신</text>

  <!-- node1 eth0 → node2 eth0 (물리망) -->
  <line x1="534" y1="402" x2="656" y2="402" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="595" y="394" class="muted" text-anchor="middle">물리망</text>

  <!-- node2 eth0 → veth2 → pod -->
  <line x1="705" y1="380" x2="820" y2="292" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="892" y1="250" x2="936" y2="215" stroke="#66bb6a" stroke-width="2.5" marker-end="url(#arg)"/>
  <text x="800" y="330" class="muted" style="fill:#66bb6a">노드 2 안에서는 dst=10.244.2.9 그대로 (재변환 없음)</text>

  <!-- 하단 결론 -->
  <rect x="40" y="458" width="1100" height="60" rx="10" fill="rgb(16,18,22)" stroke="rgb(212,168,83)" stroke-width="1.2"/>
  <text x="60" y="482" class="comp" style="fill:rgb(212,168,83)">핵심 — ClusterIP(10.96.74.151)는 노드 1·2 어느 eth0·veth에도 붙어 있지 않은 가상 IP다.</text>
  <text x="60" y="502" class="muted">출발 노드 커널이 DNAT로 실제 파드 IP로 바꿔야 비로소 물리망을 타고 목적지에 닿는다. 그래서 포트 없는 ping은 이 규칙에 안 걸려 사라진다.</text>

  <text x="24" y="548" class="muted">응답은 대상 파드 → 노드2 → 노드1 커널의 conntrack이 출발지를 다시 ClusterIP로 되돌려, 클라이언트가 자기가 보낸 IP의 응답으로 인식한다.</text>
  <text x="24" y="572" class="muted">한계: 이 그림은 표준 브리지형 CNI(kindnet 등) 기준이다. 오버레이(VXLAN)·eBPF(Cilium)는 노드 간 캡슐화·경로가 다르다.</text>
</svg>

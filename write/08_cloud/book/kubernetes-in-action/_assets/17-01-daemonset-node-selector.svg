<title id="dt">라벨이 대상 노드를 정한다</title><desc id="dd">nodeSelector 를 적으면 그 라벨을 가진 노드에만 파드가 놓인다. 개수를 줄이는 것이 아니라 대상 집합을 좁히는 일이다.</desc>
<rect width="1200" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 17-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">라벨이 대상 노드를 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">nodeSelector: gpu=cuda</text>
<rect x="90" y="200" width="300" height="220" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="240" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">노드 A</text>
<text x="240" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">gpu=cuda</text>
<rect x="120" y="299" width="240" height="62" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="240" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">데몬 파드</text>
<text x="240" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기 놓인다</text>
<rect x="440" y="200" width="300" height="220" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="590" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">노드 B</text>
<text x="590" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">gpu=cuda</text>
<rect x="470" y="299" width="240" height="62" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="590" y="328" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">데몬 파드</text>
<text x="590" y="346" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">여기 놓인다</text>
<rect x="790" y="200" width="300" height="220" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="940" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">노드 C</text>
<text x="940" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">라벨 없음</text>
<text x="940" y="330" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">파드가 놓이지 않는다</text>
<text x="940" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">selector 에 안 맞는다</text>
<rect x="430.0" y="452" width="340" height="28" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="600" y="471" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">라벨을 붙이면 그 노드에도 곧 뜬다</text>
<text x="24" y="520" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노드에 라벨을 새로 붙이면 컨트롤러가 그것을 감지해 파드를 만든다. 라벨을 떼면 그 노드의 파드를 지운다. 노드 집합의 변화가 곧 파드 집합의 변화다.</text>
<text x="24" y="542" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">반대로 파드 수를 직접 조절하는 길은 없다 — replicas 필드가 없으니 kubectl scale 도 쓰지 못한다.</text>
<line x1="12" y1="568" x2="1152" y2="568" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="590" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="580" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">대상 노드</text>
<rect x="209" y="580" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="590" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">라벨이 바꾸는 것</text>
</svg>
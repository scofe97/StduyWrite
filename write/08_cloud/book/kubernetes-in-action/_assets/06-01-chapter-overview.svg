<text x="308" y="433" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">phase: Pending</text>
<rect x="606" y="412" width="364" height="32" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.0"/>
<text x="788" y="433" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">phase: Running</text>
<text x="36" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">init 컨테이너가 없으면 Initialized 는 샌드박스를 만들기 전에 True 가 된다</text>
<line x1="12" y1="504" x2="952" y2="504" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

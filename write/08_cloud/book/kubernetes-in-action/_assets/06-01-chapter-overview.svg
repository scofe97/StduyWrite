<path d="M 884 230 L 884 250" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="798" y="260" width="172" height="112" rx="6" fill="#0D1117" stroke="#F08A59" stroke-width="1.4"/>

<title id="dt">Pod status 는 주체마다 다른 시점에 채운다</title><desc id="dd">API 서버가 Pod 를 받으면 phase 는 Pending 이다. 스케줄러·kubelet·probe 가 차례로 conditions 와 컨테이너 상태를 채우고, 주 컨테이너가 모두 시작되면 phase 가 Running 이 되며 Ready 는 그 뒤에 선다.</desc>
<rect width="1000" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 06-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Pod status 는 주체마다 다른 시점에 채운다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">phase 는 한 번 바뀌고, Ready 는 phase 가 Running 이 된 뒤에야 선다</text>
<rect x="24" y="104" width="952" height="388" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">같은 열은 같은 단계 — 위는 누가, 아래는 무엇이 채워지나</text>
<rect x="30" y="156" width="172" height="68" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.1"/>
<text x="116" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">API 서버</text>
<text x="116" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Pod 를 받아 저장</text>
<path d="M 116 230 L 116 250" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="30" y="260" width="172" height="112" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="116" y="294" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">phase: Pending</text>
<rect x="222" y="156" width="172" height="68" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="308" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">스케줄러</text>
<text x="308" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">노드를 골라 바인딩</text>
<path d="M 308 230 L 308 250" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="222" y="260" width="172" height="112" rx="6" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="308" y="294" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F5F5F3">PodScheduled: True</text>
<path d="M 208 190 L 212 190" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="414" y="156" width="172" height="68" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="500" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">kubelet</text>
<text x="500" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">샌드박스 · init 실행</text>

<rect x="798" y="156" width="172" height="68" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="884" y="184" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">kubelet · probe</text>

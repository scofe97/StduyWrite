<title id="dt">externalTrafficPolicy Local — 밖에서 온 요청</title><desc id="dd">요청은 로드밸런서가 고른 노드의 NodePort 에 먼저 닿는다. Local 이면 그 노드의 규칙이 로컬 엔드포인트만 고르므로 노드 간 홉과 소스 IP 위조가 사라진다. 파드 없는 노드는 헬스체크가 분배에서 빼 준다.</desc>
<rect width="1160" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 11-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">externalTrafficPolicy Local — 밖에서 온 요청</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">앞단에 노드를 고르는 장치가 있다</text>
<rect x="24" y="100" width="1112" height="400" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">클러스터 밖 → nodePort · LoadBalancer</text>
<rect x="50" y="260" width="200" height="80" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="150" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">외부 클라이언트</text>
<text x="150" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">203.0.113.7</text>
<rect x="330" y="260" width="200" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="430" y="298" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">로드밸런서</text>
<text x="430" y="316" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">건강한 노드로만</text>
<path d="M 256 300 L 324 300" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="660" y="168" width="380" height="128" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="850" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">노드 A — 로컬 파드 있음</text>
<rect x="730" y="215" width="240" height="62" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="850" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">파드</text>
<text x="850" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F08A59">10.244.1.7:8080</text>
<path d="M 536 288 L 600 288 L 600 232 L 654 232" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="650" y="210" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">몫을 받는다</text>
<rect x="660" y="336" width="380" height="128" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="850" y="360" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">노드 C — 로컬 파드 없음</text>
<rect x="750.0" y="401" width="200" height="26" rx="5" fill="#E3B34114" stroke="#E3B341" stroke-width="1.0"/>
<text x="850" y="418" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">503 을 답한다</text>
<path d="M 536 312 L 592 312 L 592 400 L 654 400" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)" stroke-dasharray="6 5"/>
<text x="586" y="356" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">헬스체크를 보낸다</text>
<path d="M 654 440 L 628 440 L 628 276 L 542 276" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)" stroke-dasharray="6 5"/>
<text x="660" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">503 이면 로드밸런서가 분배에서 뺀다 — healthCheckNodePort</text>
<text x="24" y="526" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소스 IP 는 남지만 파드당 부하는 어긋난다. 로드밸런서는 노드 단위로 나누는데 노드마다 파드 수가 다르기 때문이다.</text>
<line x1="12" y1="546" x2="1112" y2="546" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="568" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="558" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="568" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">닿는 길</text>
<rect x="196" y="558" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="218" y="568" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">빠지는 길</text>
<rect x="305" y="558" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="327" y="568" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">로컬만 후보</text>
</svg>
<svg viewBox="0 0 1120 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>externalTrafficPolicy Local의 실제 외부 요청 경로</title>
  <desc>외부 클라이언트 요청이 로드밸런서에서 노드 단위로 분배되고, 각 노드의 NodePort와 Service 규칙을 거쳐 그 노드의 로컬 Pod로만 전달되는 흐름이다. Node A에는 Pod가 세 개, Node B에는 Pod가 한 개라 같은 수의 요청을 받아도 Pod당 부하가 세 배 차이 난다.</desc>
  <defs>
    <style>
      .title { font-size: 25px; font-weight: 800; fill: #e8e4df; }
      .sub { font-size: 15px; fill: #b8b3ad; }
      .panel-title { font-size: 15px; font-weight: 800; fill: #e8e4df; }
      .box { fill: #e8e4df; stroke: #b8b3ad; stroke-width: 1.4; }
      .box-title { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .box-detail { font-size: 11px; fill: #3a3632; }
      .label { font-size: 12px; fill: #b8b3ad; }
      .warn { fill: rgb(212,168,83); stroke: #b8b3ad; stroke-width: 1.4; }
      .warn-text { font-size: 12px; font-weight: 800; fill: #0d0d0d; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <rect width="1120" height="560" fill="#0d0d0d"/>
  <text x="36" y="42" class="title">external · Local</text>
  <text x="36" y="68" class="sub">외부 요청의 노드 로컬 경로</text>

  <rect x="42" y="98" width="168" height="66" rx="10" class="box"/>
  <text x="126" y="124" text-anchor="middle" class="box-title">외부 클라이언트</text>
  <text x="126" y="146" text-anchor="middle" class="box-detail">source 203.0.113.10</text>

  <line x1="210" y1="131" x2="278" y2="131" stroke="#b8b3ad" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="244" y="117" text-anchor="middle" class="label">요청</text>

  <rect x="286" y="98" width="206" height="66" rx="10" class="box"/>
  <text x="389" y="124" text-anchor="middle" class="box-title">LoadBalancer</text>
  <text x="389" y="146" text-anchor="middle" class="box-detail">노드 단위 분배</text>

  <path d="M389 164 L389 190 L120 190 L120 288" fill="none" stroke="#b8b3ad" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M389 164 L389 190 L662 190 L662 288" fill="none" stroke="#b8b3ad" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="242" y="183" text-anchor="middle" class="label">50 requests</text>
  <text x="562" y="183" text-anchor="middle" class="label">50 requests</text>

  <rect x="36" y="240" width="510" height="232" rx="14" fill="rgb(20,20,20)" stroke="#b8b3ad" stroke-width="1.4"/>
  <text x="58" y="270" class="panel-title">Node A · 로컬 Pod 3개</text>
  <line x1="120" y1="240" x2="120" y2="288" stroke="#b8b3ad" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="62" y="296" width="116" height="62" rx="9" class="box"/>
  <text x="120" y="322" text-anchor="middle" class="box-title">NodePort</text>
  <text x="120" y="343" text-anchor="middle" class="box-detail">외부 진입점</text>

  <line x1="178" y1="327" x2="218" y2="327" stroke="#b8b3ad" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="226" y="296" width="132" height="62" rx="9" class="box"/>
  <text x="292" y="322" text-anchor="middle" class="box-title">Service 규칙</text>
  <text x="292" y="343" text-anchor="middle" class="box-detail">로컬 Endpoint만</text>

  <path d="M358 327 L382 327 L382 303 L398 303" fill="none" stroke="#b8b3ad" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M382 327 L382 349 L398 349" fill="none" stroke="#b8b3ad" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M382 349 L382 395 L398 395" fill="none" stroke="#b8b3ad" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="406" y="284" width="112" height="38" rx="7" class="box"/>
  <rect x="406" y="330" width="112" height="38" rx="7" class="box"/>
  <rect x="406" y="376" width="112" height="38" rx="7" class="box"/>
  <text x="462" y="308" text-anchor="middle" class="box-title">Pod A-1</text>
  <text x="462" y="354" text-anchor="middle" class="box-title">Pod A-2</text>
  <text x="462" y="400" text-anchor="middle" class="box-title">Pod A-3</text>
  <text x="292" y="440" text-anchor="middle" class="label">Pod당 약 16.7</text>

  <rect x="578" y="240" width="506" height="232" rx="14" fill="rgb(20,20,20)" stroke="#b8b3ad" stroke-width="1.4"/>
  <text x="600" y="270" class="panel-title">Node B · 로컬 Pod 1개</text>
  <line x1="662" y1="240" x2="662" y2="288" stroke="#b8b3ad" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="604" y="296" width="116" height="62" rx="9" class="box"/>
  <text x="662" y="322" text-anchor="middle" class="box-title">NodePort</text>
  <text x="662" y="343" text-anchor="middle" class="box-detail">외부 진입점</text>

  <line x1="720" y1="327" x2="760" y2="327" stroke="#b8b3ad" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="768" y="296" width="132" height="62" rx="9" class="box"/>
  <text x="834" y="322" text-anchor="middle" class="box-title">Service 규칙</text>
  <text x="834" y="343" text-anchor="middle" class="box-detail">로컬 Endpoint만</text>

  <line x1="900" y1="327" x2="940" y2="327" stroke="#b8b3ad" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="948" y="296" width="110" height="62" rx="9" class="warn"/>
  <text x="1003" y="322" text-anchor="middle" class="box-title">Pod B-1</text>
  <text x="1003" y="343" text-anchor="middle" class="box-detail">50 requests</text>
  <text x="1003" y="390" text-anchor="middle" class="label" font-weight="800">주의 · 3배 부하</text>

  <rect x="36" y="494" width="1048" height="46" rx="10" fill="rgb(20,20,20)" stroke="#b8b3ad" stroke-width="1.2"/>
  <text x="58" y="522" class="label">source IP 유지</text>
  <text x="252" y="522" class="label">교차 노드 홉 없음</text>
  <text x="482" y="522" class="label">빈 노드는 health 제외</text>
</svg>

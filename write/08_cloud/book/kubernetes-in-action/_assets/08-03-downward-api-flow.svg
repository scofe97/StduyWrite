<svg viewBox="0 0 720 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Downward API의 필드 주입 흐름</title>
  <desc>Pod 오브젝트의 metadata·spec·status 세 필드 영역이 fieldRef·resourceFieldRef를 통해 환경변수로, downwardAPI 볼륨을 통해 파일로 컨테이너 안 애플리케이션에 주입되는 흐름을 나타낸다.</desc>

  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="360" fill="#0d0d0d"/>

  <!-- Pod 오브젝트 (배경 동일 fill + 앰버 테두리) -->
  <rect x="24" y="40" width="240" height="220" rx="6" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="40" y="66" fill="rgb(212,168,83)" font-size="13" font-weight="700">Pod 오브젝트</text>

  <!-- metadata 칩 -->
  <rect x="40" y="80" width="208" height="48" rx="4" fill="#dceaf7" stroke="rgb(42,37,32)"/>
  <text x="52" y="100" fill="#10243a" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">metadata</text>
  <text x="52" y="119" fill="#14304a" font-size="10.5">name · namespace · labels</text>

  <!-- spec 칩 -->
  <rect x="40" y="136" width="208" height="48" rx="4" fill="#dceaf7" stroke="rgb(42,37,32)"/>
  <text x="52" y="156" fill="#10243a" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">spec</text>
  <text x="52" y="175" fill="#14304a" font-size="10.5">nodeName · 리소스 한도</text>

  <!-- status 칩 -->
  <rect x="40" y="192" width="208" height="48" rx="4" fill="#dceaf7" stroke="rgb(42,37,32)"/>
  <text x="52" y="212" fill="#10243a" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">status</text>
  <text x="52" y="231" fill="#14304a" font-size="10.5">podIP · hostIP</text>

  <!-- env 경로 (골든앰버 밝은 fill → 검정) -->
  <rect x="360" y="66" width="180" height="66" rx="6" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="450" y="92" fill="#0d0d0d" font-size="13" font-weight="700" text-anchor="middle">환경변수</text>
  <text x="450" y="114" fill="#1a1a1a" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">fieldRef · resourceFieldRef</text>

  <!-- 볼륨 경로 (골든앰버 밝은 fill → 검정) -->
  <rect x="360" y="168" width="180" height="66" rx="6" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="450" y="194" fill="#0d0d0d" font-size="13" font-weight="700" text-anchor="middle">파일</text>
  <text x="450" y="216" fill="#1a1a1a" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">downwardAPI 볼륨(다음 장)</text>

  <!-- 컨테이너 앱 (초록 밝은 fill → 검정) -->
  <rect x="600" y="110" width="96" height="80" rx="6" fill="#66bb6a" stroke="rgb(42,37,32)"/>
  <text x="648" y="145" fill="#0d0d0d" font-size="12.5" font-weight="700" text-anchor="middle">컨테이너</text>
  <text x="648" y="165" fill="#0d0d0d" font-size="12.5" font-weight="700" text-anchor="middle">앱</text>

  <!-- 화살표: Pod → env / 볼륨 -->
  <line x1="264" y1="99" x2="358" y2="99" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="264" y1="201" x2="358" y2="201" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arr2)"/>
  <!-- 화살표: env / 볼륨 → 앱 -->
  <line x1="540" y1="99"  x2="598" y2="140" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="540" y1="201" x2="598" y2="160" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- 주석 -->
  <text x="24" y="300" fill="#e8e4df" font-size="11.5">값의 출처가 Pod 오브젝트 자신이라는 점만 빼면, ConfigMap·Secret 주입과 구조가 같다.</text>
  <text x="24" y="322" fill="#e8e4df" font-size="11.5">REST 호출이 아니라 필드 값을 컨테이너로 "내려보내는(downward)" 주입이다.</text>
</svg>

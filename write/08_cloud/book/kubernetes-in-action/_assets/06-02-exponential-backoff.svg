<svg viewBox="0 0 960 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>컨테이너 재시작 사이의 지수 백오프</title>
  <desc>프로세스가 종료되면 컨테이너가 파괴되고 새 컨테이너가 즉시 만들어진다. 계속 크래시가 나면 재시작 전 지연이 10초에서 시작해 매번 두 배로 늘어나며 5분에서 상한에 닿는다. 컨테이너가 10분 동안 정상 동작하면 지연은 0으로 리셋된다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .cbox   { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .fail   { font-size: 15px; font-weight: 800; fill: rgb(240,80,90); }
      .delay  { font-size: 12px; font-weight: 800; fill: rgb(212,168,83); font-family: 'JetBrains Mono', monospace; }
      .note   { font-size: 10.5px; fill: #e8e4df; }
    </style>
    <marker id="a63" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="300" fill="#0d0d0d"/>
  <text x="24" y="28" class="title">컨테이너 재시작 사이의 지수 백오프</text>
  <text x="24" y="46" class="sub">첫 재시작은 즉시 · 이후 10초부터 두 배씩 · 5분 상한 · 10분 정상 동작 시 0으로 리셋</text>

  <!-- container boxes with failing process -->
  <!-- box 1 -->
  <rect x="40" y="100" width="120" height="60" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <rect x="52" y="118" width="96" height="28" rx="4" fill="rgb(230,126,34)"/>
  <text x="92" y="137" class="cbox">Process</text>
  <text x="138" y="139" class="fail">✕</text>
  <text x="100" y="92" class="note" text-anchor="middle">Container</text>

  <!-- immediate arrow -->
  <line x1="160" y1="130" x2="196" y2="130" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a63)"/>
  <text x="178" y="118" class="delay" text-anchor="middle">0s</text>

  <!-- box 2 -->
  <rect x="200" y="100" width="120" height="60" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <rect x="212" y="118" width="96" height="28" rx="4" fill="rgb(230,126,34)"/>
  <text x="252" y="137" class="cbox">Process</text>
  <text x="298" y="139" class="fail">✕</text>
  <text x="260" y="92" class="note" text-anchor="middle">New container</text>

  <line x1="320" y1="130" x2="376" y2="130" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a63)"/>
  <text x="348" y="118" class="delay" text-anchor="middle">10s</text>

  <!-- box 3 -->
  <rect x="380" y="100" width="120" height="60" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <rect x="392" y="118" width="96" height="28" rx="4" fill="rgb(230,126,34)"/>
  <text x="432" y="137" class="cbox">Process</text>
  <text x="478" y="139" class="fail">✕</text>

  <line x1="500" y1="130" x2="576" y2="130" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a63)"/>
  <text x="538" y="118" class="delay" text-anchor="middle">20s</text>

  <!-- box 4 -->
  <rect x="580" y="100" width="120" height="60" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <rect x="592" y="118" width="96" height="28" rx="4" fill="rgb(230,126,34)"/>
  <text x="632" y="137" class="cbox">Process</text>
  <text x="678" y="139" class="fail">✕</text>

  <line x1="700" y1="130" x2="796" y2="130" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a63)"/>
  <text x="748" y="118" class="delay" text-anchor="middle">40s …</text>

  <!-- box 5 -->
  <rect x="800" y="100" width="120" height="60" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <rect x="812" y="118" width="96" height="28" rx="4" fill="rgb(230,126,34)"/>
  <text x="852" y="137" class="cbox">Process</text>
  <text x="898" y="139" class="fail">✕</text>

  <!-- annotations -->
  <text x="40" y="210" class="note">프로세스가 종료되면 컨테이너는 파괴되고,</text>
  <text x="40" y="226" class="note">첫 번째는 즉시 새 컨테이너로 교체된다</text>

  <text x="430" y="210" class="note">계속 크래시가 나면 새 컨테이너 생성 전 지연이 생기고,</text>
  <text x="430" y="226" class="note">매번 두 배로 늘어나되 5분에서 상한에 닿는다</text>

  <text x="480" y="270" class="sub" text-anchor="middle">이 대기 상태가 CrashLoopBackOff — 이미지 pull 실패의 재시도에도 같은 지수 백오프가 적용된다</text>
</svg>

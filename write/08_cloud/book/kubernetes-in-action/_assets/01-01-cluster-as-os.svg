<svg viewBox="0 0 980 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>운영체제와 쿠버네티스의 대응 — 한 대의 컴퓨터에서 컴퓨터 클러스터로</title>
  <desc>운영체제가 애플리케이션과 CPU·RAM 하드웨어 사이를 중개하듯, 쿠버네티스는 애플리케이션과 여러 서버로 이뤄진 클러스터 사이를 중개한다. 애플리케이션은 개별 서버를 몰라도 쿠버네티스를 거쳐 클러스터 자원에 닿는다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: #e8e4df; }
      .dim   { font-size: 10.5px; fill: rgb(138,133,128); }
      .zone  { font-size: 13px; font-weight: 800; fill: rgb(212,168,83); }
      .lbl   { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .lbl2  { font-size: 10.5px; font-weight: 600; fill: #0d0d0d; }
      .layer { font-size: 11px; font-weight: 700; fill: #e8e4df; }
    </style>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,0 L5,10 z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="430" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">쿠버네티스 = 클러스터의 운영체제</text>
  <text x="24" y="52" class="sub">OS가 앱과 하드웨어 사이를 중개하듯, 쿠버네티스는 앱과 여러 서버(클러스터) 사이를 중개합니다. 같은 3층 구조가 한 대에서 여러 대로 확장됩니다.</text>

  <!-- ===== LEFT: single computer ===== -->
  <rect x="40" y="82" width="400" height="316" rx="12" fill="rgb(24,28,32)" stroke="rgb(138,133,128)" stroke-width="1.3"/>
  <text x="60" y="108" class="zone">컴퓨터 한 대</text>

  <!-- layer 1: Applications -->
  <text x="60" y="140" class="layer">① 애플리케이션 계층</text>
  <rect x="60" y="150" width="360" height="52" rx="8" fill="rgb(230,230,230)"/>
  <text x="240" y="182" class="lbl" text-anchor="middle">Applications</text>

  <!-- layer 2: OS (middleware) -->
  <text x="60" y="234" class="layer">② 중개 계층</text>
  <rect x="60" y="244" width="360" height="52" rx="8" fill="rgb(212,168,83)"/>
  <text x="240" y="270" class="lbl" text-anchor="middle">Operating System</text>
  <text x="240" y="288" class="lbl2" text-anchor="middle">앱 ↔ 하드웨어 중개 · 프로세스 스케줄링</text>

  <!-- layer 3: hardware -->
  <text x="60" y="328" class="layer">③ 물리 자원</text>
  <rect x="60" y="338" width="360" height="46" rx="8" fill="rgb(150,130,220)"/>
  <text x="240" y="366" class="lbl" text-anchor="middle">CPU · RAM · Disk (한 대)</text>

  <line x1="240" y1="202" x2="240" y2="242" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#dn)"/>
  <line x1="240" y1="296" x2="240" y2="336" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#dn)"/>

  <!-- ===== bridge label ===== -->
  <text x="490" y="240" class="zone" text-anchor="middle">같은</text>
  <text x="490" y="262" class="zone" text-anchor="middle">3층</text>
  <text x="490" y="284" class="zone" text-anchor="middle">구조</text>
  <text x="490" y="308" class="dim" text-anchor="middle">→ 확장</text>

  <!-- ===== RIGHT: cluster ===== -->
  <rect x="540" y="82" width="400" height="316" rx="12" fill="rgb(24,28,32)" stroke="rgb(212,168,83)" stroke-width="1.4"/>
  <text x="560" y="108" class="zone">컴퓨터 클러스터 (여러 대)</text>

  <!-- layer 1 -->
  <text x="560" y="140" class="layer">① 애플리케이션 계층</text>
  <rect x="560" y="150" width="360" height="52" rx="8" fill="rgb(230,230,230)"/>
  <text x="740" y="182" class="lbl" text-anchor="middle">Applications</text>

  <!-- layer 2: Kubernetes -->
  <text x="560" y="234" class="layer">② 중개 계층</text>
  <rect x="560" y="244" width="360" height="52" rx="8" fill="rgb(212,168,83)"/>
  <text x="740" y="270" class="lbl" text-anchor="middle">Kubernetes</text>
  <text x="740" y="288" class="lbl2" text-anchor="middle">앱 ↔ 클러스터 중개 · 노드에 스케줄링</text>

  <!-- layer 3: servers -->
  <text x="560" y="328" class="layer">③ 물리 자원</text>
  <rect x="560" y="338" width="112" height="46" rx="8" fill="rgb(150,130,220)"/>
  <text x="616" y="366" class="lbl" text-anchor="middle">Server</text>
  <rect x="684" y="338" width="112" height="46" rx="8" fill="rgb(150,130,220)"/>
  <text x="740" y="366" class="lbl" text-anchor="middle">Server</text>
  <rect x="808" y="338" width="112" height="46" rx="8" fill="rgb(150,130,220)"/>
  <text x="864" y="366" class="lbl" text-anchor="middle">Server</text>

  <line x1="740" y1="202" x2="740" y2="242" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#dn)"/>
  <line x1="740" y1="296" x2="616" y2="336" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#dn)"/>
  <line x1="740" y1="296" x2="740" y2="336" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#dn)"/>
  <line x1="740" y1="296" x2="864" y2="336" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#dn)"/>

  <text x="740" y="416" class="dim" text-anchor="middle">앱은 어느 Server 가 자원을 내주는지 몰라도 됩니다 — Kubernetes 가 감춥니다</text>
</svg>

<svg viewBox="0 0 960 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>startup probe에서 liveness probe로의 전환</title>
  <desc>컨테이너가 시작되면 startup probe만 실행된다. 초기화 구간에서는 probe가 실패해도 정상이며, 성공하는 순간 쿠버네티스가 liveness probe로 전환한다. liveness probe는 더 짧은 주기와 엄격한 실패 임계값을 써서, 두 번 연속 실패하면 컨테이너를 종료한다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .zone   { font-size: 12.5px; font-weight: 800; fill: #0d0d0d; }
      .mark-f { font-size: 15px; font-weight: 800; fill: rgb(240,80,90); }
      .mark-s { font-size: 15px; font-weight: 800; fill: rgb(102,187,106); }
      .cfg    { font-size: 11px; font-weight: 700; fill: #e8e4df; font-family: 'JetBrains Mono', monospace; }
      .note   { font-size: 10.5px; fill: #e8e4df; }
    </style>
    <marker id="a64" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="340" fill="#0d0d0d"/>
  <text x="24" y="28" class="title">startup probe에서 liveness probe로의 전환</text>
  <text x="24" y="46" class="sub">시작 구간은 관대하게(120초 허용), 정상 운영 구간은 엄격하게(10초 안에 감지)</text>

  <!-- timeline zones -->
  <text x="60" y="86" class="note">컨테이너 시작</text>
  <line x1="60" y1="92" x2="60" y2="120" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a64)"/>

  <text x="400" y="86" class="note">liveness probe로 전환</text>
  <line x1="410" y1="92" x2="410" y2="120" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a64)"/>

  <!-- Application initializing (amber) -->
  <polygon points="60,124 390,124 410,150 390,176 60,176" fill="rgb(245,215,110)"/>
  <text x="220" y="155" class="zone" text-anchor="middle">애플리케이션 초기화 중</text>

  <!-- Normal operation (green) -->
  <polygon points="400,124 830,124 850,150 830,176 400,176 420,150" fill="rgb(102,187,106)"/>
  <text x="620" y="155" class="zone" text-anchor="middle">정상 운영</text>

  <!-- Unhealthy (magenta) -->
  <polygon points="840,124 920,124 920,176 840,176 860,150" fill="rgb(240,150,190)"/>
  <text x="888" y="155" class="zone" text-anchor="middle">비정상</text>

  <!-- probe marks under timeline: startup fails then success -->
  <text x="110" y="205" class="mark-f" text-anchor="middle">✕</text>
  <text x="190" y="205" class="mark-f" text-anchor="middle">✕</text>
  <text x="270" y="205" class="mark-f" text-anchor="middle">✕</text>
  <text x="360" y="205" class="mark-s" text-anchor="middle">✓</text>
  <!-- liveness successes -->
  <text x="440" y="205" class="mark-s" text-anchor="middle">✓</text>
  <text x="490" y="205" class="mark-s" text-anchor="middle">✓</text>
  <text x="540" y="205" class="mark-s" text-anchor="middle">✓</text>
  <text x="590" y="205" class="mark-s" text-anchor="middle">✓</text>
  <text x="640" y="205" class="mark-s" text-anchor="middle">✓</text>
  <text x="690" y="205" class="mark-s" text-anchor="middle">✓</text>
  <text x="740" y="205" class="mark-s" text-anchor="middle">✓</text>
  <text x="790" y="205" class="mark-s" text-anchor="middle">✓</text>
  <!-- liveness failures -->
  <text x="860" y="205" class="mark-f" text-anchor="middle">✕</text>
  <text x="905" y="205" class="mark-f" text-anchor="middle">✕</text>

  <!-- probe config braces -->
  <line x1="80" y1="222" x2="380" y2="222" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="230" y="244" class="cfg" text-anchor="middle">Startup probe</text>
  <text x="230" y="260" class="cfg" text-anchor="middle">[periodSeconds=10 · failureThreshold=12]</text>
  <text x="230" y="280" class="note" text-anchor="middle">실패해도 정상 — 앱에 120초의 시작 시간을 준다</text>

  <line x1="430" y1="222" x2="915" y2="222" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="672" y="244" class="cfg" text-anchor="middle">Liveness probe</text>
  <text x="672" y="260" class="cfg" text-anchor="middle">[periodSeconds=5 · failureThreshold=2]</text>
  <text x="672" y="280" class="note" text-anchor="middle">짧은 주기·엄격한 임계값 — 두 번 연속 실패하면 컨테이너 종료</text>

  <text x="480" y="322" class="sub" text-anchor="middle">startup probe가 성공하는 순간 liveness probe로 전환된다 · startup probe도 failureThreshold에 닿으면 컨테이너가 종료된다</text>
</svg>

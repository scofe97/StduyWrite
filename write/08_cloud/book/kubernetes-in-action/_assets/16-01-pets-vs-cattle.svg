<svg viewBox="0 0 960 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Pets vs Cattle — StatefulSet vs Deployment</title>
  <desc>Pets는 이름·개성이 있어 대체 불가능하다(StatefulSet 파드). Cattle은 균질하고 이름이 없어 교체가 자명하다(Deployment 파드). StatefulSet 파드는 같은 이름·PVC·주소로만 교체된다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .hdr   { font-size: 14px; font-weight: 800; fill: rgb(212,168,83); }
      .pet   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .cattle{ font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .note  { font-size: 11px; fill: #e8e4df; }
      .map   { font-size: 11px; font-weight: 700; fill: rgb(240,150,190); }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="320" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Pets vs Cattle — StatefulSet은 Pets, Deployment는 Cattle</text>

  <line x1="480" y1="55" x2="480" y2="300" stroke="rgb(60,60,60)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- LEFT: Pets -->
  <text x="230" y="78" class="hdr" text-anchor="middle">Pets — 이름·개성이 있음 (대체 불가)</text>
  <rect x="60" y="95" width="150" height="52" rx="8" fill="rgb(245,200,150)"/><text x="135" y="126" class="pet" text-anchor="middle">Luna</text>
  <rect x="250" y="95" width="150" height="52" rx="8" fill="rgb(150,220,160)"/><text x="325" y="126" class="pet" text-anchor="middle">Rocky</text>
  <rect x="60" y="160" width="150" height="52" rx="8" fill="rgb(200,180,240)"/><text x="135" y="191" class="pet" text-anchor="middle">Lucy</text>
  <rect x="250" y="160" width="150" height="52" rx="8" fill="rgb(140,190,235)"/><text x="325" y="191" class="pet" text-anchor="middle">Buddy</text>
  <line x1="258" y1="164" x2="392" y2="208" stroke="rgb(240,150,190)" stroke-width="2.5"/>
  <line x1="392" y1="164" x2="258" y2="208" stroke="rgb(240,150,190)" stroke-width="2.5"/>
  <text x="230" y="245" class="map" text-anchor="middle">잃은 애완동물은 그냥 대체 못 함</text>
  <text x="230" y="265" class="note" text-anchor="middle">StatefulSet 파드 = 같은 이름·PVC·주소로만 교체</text>

  <!-- RIGHT: Cattle -->
  <text x="730" y="78" class="hdr" text-anchor="middle">Cattle — 균질·이름 없음 (교체 자명)</text>
  <rect x="560" y="95" width="150" height="46" rx="6" fill="rgb(210,215,215)"/><text x="635" y="123" class="cattle" text-anchor="middle">S/N: 4322</text>
  <rect x="750" y="95" width="150" height="46" rx="6" fill="rgb(210,215,215)"/><text x="825" y="123" class="cattle" text-anchor="middle">S/N: 8324</text>
  <rect x="560" y="153" width="150" height="46" rx="6" fill="rgb(210,215,215)"/><text x="635" y="181" class="cattle" text-anchor="middle">S/N: 8348</text>
  <rect x="750" y="153" width="150" height="46" rx="6" fill="rgb(210,215,215)"/><text x="825" y="181" class="cattle" text-anchor="middle">S/N: 9583</text>
  <line x1="568" y1="157" x2="702" y2="195" stroke="rgb(240,150,190)" stroke-width="2.5"/>
  <line x1="702" y1="157" x2="568" y2="195" stroke="rgb(240,150,190)" stroke-width="2.5"/>
  <text x="730" y="245" class="note" text-anchor="middle">전부 같으니 소 교체는 자명</text>
  <text x="730" y="265" class="note" text-anchor="middle">Deployment 파드 = 교체돼도 알아채지 못함</text>
</svg>

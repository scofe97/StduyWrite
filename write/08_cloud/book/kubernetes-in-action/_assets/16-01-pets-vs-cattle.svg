<svg viewBox="0 0 720 300" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Pets vs Cattle 비유</title>
  <desc>Cattle은 균질하고 이름이 없어 교체가 자명하며 Deployment의 stateless 파드가 여기 해당한다. Pets는 이름과 개성이 있어 그냥 대체할 수 없고 StatefulSet의 stateful 파드가 여기 해당한다. 다만 소프트웨어에서는 교체 인스턴스에 같은 이름과 PVC와 주소를 물려주면 대체가 성립하며, StatefulSet이 바로 그 일을 한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: #b8b3ad; }
      .box   { fill: #e8e4df; }
      .warn  { fill: rgb(212,168,83); }
      .t     { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .d     { font-size: 11px; fill: #3a3632; }
      .n     { font-size: 10.5px; fill: #b8b3ad; }
    </style>
  </defs>

  <rect x="0" y="0" width="720" height="300" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Pets vs Cattle</text>
  <text x="24" y="50" class="sub">교체가 자명한가</text>

  <rect x="30" y="76" width="310" height="120" rx="10" class="box"/>
  <text x="185" y="104" class="t" text-anchor="middle">Cattle</text>
  <text x="185" y="128" class="d" text-anchor="middle">균질 · 이름 없음</text>
  <text x="185" y="150" class="d" text-anchor="middle">교체를 알아채지 못함</text>
  <text x="185" y="176" class="t" text-anchor="middle" font-size="11">Deployment 파드</text>

  <rect x="380" y="76" width="310" height="120" rx="10" class="box"/>
  <text x="535" y="104" class="t" text-anchor="middle">Pets</text>
  <text x="535" y="128" class="d" text-anchor="middle">이름 · 개성 있음</text>
  <text x="535" y="150" class="d" text-anchor="middle">그냥 대체 불가</text>
  <text x="535" y="176" class="t" text-anchor="middle" font-size="11">StatefulSet 파드</text>

  <rect x="380" y="212" width="310" height="60" rx="10" class="warn"/>
  <text x="535" y="236" class="t" text-anchor="middle" font-size="12">주의 · 소프트웨어는 다름</text>
  <text x="535" y="257" class="d" text-anchor="middle">이름 · PVC · 주소를 물려줌</text>

  <text x="185" y="240" class="n" text-anchor="middle">현실의 애완동물은</text>
  <text x="185" y="258" class="n" text-anchor="middle">같은 이름을 줘도</text>
  <text x="185" y="276" class="n" text-anchor="middle">원래처럼 행동하지 않습니다</text>
</svg>

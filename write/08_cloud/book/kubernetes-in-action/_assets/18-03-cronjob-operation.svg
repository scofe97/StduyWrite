<rect x="890" y="364" width="220" height="72" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="1000" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">파드</text>
<text x="1000" y="416" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">완료까지 실행</text>
<path d="M 722 400 L 884 400" fill="none" stroke="#3FB98C" stroke-width="1.3" marker-end="url(#ok)"/>
<text x="383" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">때가 되면 만든다</text>
<text x="803" y="176" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">Job 이 만든다</text>
<text x="24" y="470" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">그래서 CronJob 안에는 jobTemplate 이 통째로 들어간다. completions·parallelism·backoffLimit 처럼 18-02 에서 정한 것이 그 안에 그대로 실린다.</text>
<text x="24" y="492" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">보존 개수(successfulJobsHistoryLimit·failedJobsHistoryLimit)를 두는 이유도 여기 있다 — 때마다 Job 오브젝트가 하나씩 쌓이기 때문이다.</text>

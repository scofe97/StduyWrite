<title id="dt">CronJob 이 만드는 것은 Job 이다</title><desc id="dd">시간표에 맞춰 CronJob 컨트롤러가 새 Job 오브젝트를 만든다. 파드를 만드는 것은 그 Job 이고, 컨테이너를 띄우는 것은 kubelet 이다 — 층이 하나 더 늘었을 뿐이다.</desc>
<rect width="1240" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 18-03</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">CronJob 이 만드는 것은 Job 이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">schedule: 0 * * * *</text>

<svg viewBox="0 0 960 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>CronJob의 동작</title>
  <desc>CronJob 컨트롤러는 schedule에 맞춰 Job 템플릿에서 새 Job을 만든다. 각 Job은 다시 Pod를 만들어 완료까지 실행한다. CronJob 오브젝트를 지울 때까지 이 과정이 반복된다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .cj    { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .job   { font-size: 10.5px; font-weight: 700; fill: #0d0d0d; }
      .pod   { font-size: 10px; font-weight: 700; fill: #e8e4df; }
      .tick  { font-size: 10px; fill: rgb(138,133,128); }
      .note  { font-size: 10px; fill: rgb(138,133,128); }
    </style>
    <marker id="cj-a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="300" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">CronJob의 동작</text>
  <text x="24" y="50" class="sub">schedule마다 Job 생성 → Job이 Pod 생성 → 완료까지 실행. CronJob 삭제 전까지 반복</text>

  <!-- CronJob bar -->
  <rect x="24" y="80" width="912" height="34" rx="6" fill="rgb(212,168,83)"/>
  <text x="44" y="102" class="cj">CronJob  ·  Job 템플릿  ·  schedule "* * * * *"</text>

  <!-- schedule ticks + jobs -->
  <line x1="60" y1="270" x2="900" y2="270" stroke="rgb(70,70,70)" stroke-width="1.2" marker-end="url(#cj-a)"/>
  <text x="905" y="274" class="tick">time</text>

  <!-- 3 scheduled Jobs -->
  <g>
    <!-- Job 1 -->
    <line x1="150" y1="114" x2="150" y2="140" stroke="rgb(138,133,128)" stroke-width="1.3" marker-end="url(#cj-a)"/>
    <rect x="90" y="142" width="120" height="30" rx="6" fill="rgb(150,220,160)"/><text x="150" y="162" class="job" text-anchor="middle">Job (t1)</text>
    <rect x="105" y="182" width="90" height="26" rx="5" fill="rgb(91,155,213)"/><text x="150" y="200" class="pod" text-anchor="middle">Pod ✓</text>
    <text x="150" y="255" class="tick" text-anchor="middle">t1</text>

    <!-- Job 2 -->
    <line x1="440" y1="114" x2="440" y2="140" stroke="rgb(138,133,128)" stroke-width="1.3" marker-end="url(#cj-a)"/>
    <rect x="380" y="142" width="120" height="30" rx="6" fill="rgb(150,220,160)"/><text x="440" y="162" class="job" text-anchor="middle">Job (t2)</text>
    <rect x="395" y="182" width="90" height="26" rx="5" fill="rgb(91,155,213)"/><text x="440" y="200" class="pod" text-anchor="middle">Pod ✓</text>
    <text x="440" y="255" class="tick" text-anchor="middle">t2</text>

    <!-- Job 3 -->
    <line x1="730" y1="114" x2="730" y2="140" stroke="rgb(138,133,128)" stroke-width="1.3" marker-end="url(#cj-a)"/>
    <rect x="670" y="142" width="120" height="30" rx="6" fill="rgb(150,220,160)"/><text x="730" y="162" class="job" text-anchor="middle">Job (t3)</text>
    <rect x="685" y="182" width="90" height="26" rx="5" fill="rgb(91,155,213)"/><text x="730" y="200" class="pod" text-anchor="middle">Pod ✓</text>
    <text x="730" y="255" class="tick" text-anchor="middle">t3</text>
  </g>

  <text x="850" y="160" class="note">… 계속</text>
</svg>

<svg viewBox="0 0 960 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>headless Service와 StatefulSet의 DNS</title>
  <desc>clusterIP가 None인 headless Service를 StatefulSet과 결합하면, Service 이름은 모든 파드 IP로 resolve되고, 파드마다 추가 DNS 레코드(quiz-N.quiz-pods...)가 생겨 개별 IP를 조회할 수 있다. 이것이 안정된 네트워크 신원의 핵심이다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .svc   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .pod   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .dns   { font-size: 10.5px; font-weight: 700; fill: rgb(212,168,83); font-family: 'JetBrains Mono', monospace; }
      .note  { font-size: 10.5px; fill: #e8e4df; }
    </style>
    <marker id="hdns-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="380" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">headless Service + StatefulSet — 파드마다 DNS 레코드</text>
  <text x="24" y="50" class="sub">clusterIP: None → Service 이름은 모든 파드 IP로, 파드 이름은 개별 IP로 resolve</text>

  <!-- StatefulSet -->
  <rect x="30" y="150" width="120" height="70" rx="8" fill="rgb(140,190,235)"/>
  <text x="90" y="180" class="svc" text-anchor="middle">quiz</text>
  <text x="90" y="197" class="svc" text-anchor="middle" font-size="10">StatefulSet</text>

  <!-- headless Service -->
  <rect x="200" y="70" width="170" height="52" rx="8" fill="rgb(240,215,120)"/>
  <text x="285" y="90" class="svc" text-anchor="middle">quiz-pods Service</text>
  <text x="285" y="108" class="svc" text-anchor="middle" font-size="10" style="fill:#0d0d0d">clusterIP: None (headless)</text>

  <!-- pods -->
  <rect x="220" y="150" width="130" height="46" rx="6" fill="rgb(91,155,213)"/><text x="285" y="178" class="pod" text-anchor="middle" style="fill:#e8e4df">quiz-0 Pod</text>
  <rect x="220" y="208" width="130" height="46" rx="6" fill="rgb(91,155,213)"/><text x="285" y="236" class="pod" text-anchor="middle" style="fill:#e8e4df">quiz-1 Pod</text>
  <rect x="220" y="266" width="130" height="46" rx="6" fill="rgb(91,155,213)"/><text x="285" y="294" class="pod" text-anchor="middle" style="fill:#e8e4df">quiz-2 Pod</text>

  <line x1="150" y1="185" x2="218" y2="173" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#hdns-a)"/>
  <line x1="285" y1="122" x2="285" y2="148" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#hdns-a)"/>

  <!-- DNS cylinder -->
  <ellipse cx="720" cy="80" rx="55" ry="14" fill="rgb(245,200,150)"/>
  <rect x="665" y="80" width="110" height="40" fill="rgb(245,200,150)"/>
  <ellipse cx="720" cy="120" rx="55" ry="14" fill="rgb(230,185,135)"/>
  <text x="720" y="105" class="svc" text-anchor="middle">DNS</text>

  <!-- per-pod DNS records -->
  <g class="dns" text-anchor="start">
    <text x="440" y="173">quiz-0.quiz-pods.kiada.svc.cluster.local</text>
    <text x="440" y="231">quiz-1.quiz-pods.kiada.svc.cluster.local</text>
    <text x="440" y="289">quiz-2.quiz-pods.kiada.svc.cluster.local</text>
  </g>
  <line x1="352" y1="173" x2="438" y2="173" stroke="rgb(212,168,83)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="352" y1="231" x2="438" y2="231" stroke="rgb(212,168,83)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="352" y1="289" x2="438" y2="289" stroke="rgb(212,168,83)" stroke-width="1.4" stroke-dasharray="4 3"/>

  <text x="600" y="330" class="note" text-anchor="middle">StatefulSet과 결합할 때만 파드별 레코드가 생성됩니다</text>
  <text x="600" y="350" class="dns" text-anchor="middle" style="fill:rgb(138,133,128)">quiz-pods.kiada.svc.cluster.local → 모든 파드 IP</text>
</svg>

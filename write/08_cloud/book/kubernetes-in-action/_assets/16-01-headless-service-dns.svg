<svg viewBox="0 0 820 440" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>headless Service가 만드는 DNS 대응표와 개별 파드 조회</title>
  <desc>보통의 ClusterIP Service는 이름 하나가 가상 IP 하나로 resolve된다. headless Service는 가상 IP가 없어 이름이 소속 파드 IP 전부로 resolve되지만 그것만으로는 특정 파드를 지목할 수 없다. StatefulSet과 결합하면 파드 하나당 한 줄씩 레코드가 추가되어, quiz-2 이름으로 조회하면 그 파드의 IP 하나만 돌아온다. 받은 값이 이미 실제 파드 IP이므로 kube-proxy의 DNAT 바꿔치기가 없고, 파드가 재생성돼 IP가 바뀌어도 이름은 같으므로 그 줄의 IP만 갱신된다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: #b8b3ad; }
      .stage { font-size: 12px; font-weight: 800; fill: #e8e4df; }
      .box   { fill: #e8e4df; }
      .warn  { fill: rgb(212,168,83); }
      .k     { font-size: 11px; font-weight: 700; fill: #0d0d0d;
               font-family: 'JetBrains Mono', monospace; }
      .v     { font-size: 11px; fill: #3a3632;
               font-family: 'JetBrains Mono', monospace; }
      .t     { font-size: 11.5px; font-weight: 700; fill: #0d0d0d; }
      .d     { font-size: 10.5px; fill: #3a3632; }
      .n     { font-size: 10.5px; fill: #b8b3ad; }
    </style>
    <marker id="dns-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="440" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">DNS 표에 줄이 늘어납니다</text>
  <text x="24" y="50" class="sub">이름 하나에서 파드마다 한 줄로</text>

  <text x="24" y="86" class="stage">1. ClusterIP</text>
  <rect x="24" y="96" width="380" height="34" rx="6" class="box"/>
  <text x="38" y="118" class="k">quiz-pods</text>
  <text x="250" y="118" class="v">10.96.0.42</text>
  <text x="420" y="118" class="n">가상 IP 하나</text>

  <text x="24" y="164" class="stage">2. headless</text>
  <rect x="24" y="174" width="380" height="34" rx="6" class="box"/>
  <text x="38" y="196" class="k">quiz-pods</text>
  <text x="250" y="196" class="v">.1.5 .2.7 .3.9</text>
  <text x="420" y="196" class="n">목록만 · 지목 불가</text>

  <text x="24" y="242" class="stage">3. StatefulSet 결합</text>

  <rect x="24" y="252" width="380" height="34" rx="6" class="box"/>
  <text x="38" y="274" class="k">quiz-0.quiz-pods</text>
  <text x="250" y="274" class="v">10.244.1.5</text>

  <rect x="24" y="292" width="380" height="34" rx="6" class="box"/>
  <text x="38" y="314" class="k">quiz-1.quiz-pods</text>
  <text x="250" y="314" class="v">10.244.2.7</text>

  <rect x="24" y="332" width="380" height="34" rx="6" class="warn"/>
  <text x="38" y="354" class="k">quiz-2.quiz-pods</text>
  <text x="250" y="354" class="v" style="fill:#0d0d0d">10.244.3.9</text>

  <text x="420" y="314" class="n">파드마다 한 줄</text>

  <rect x="500" y="252" width="290" height="114" rx="8" class="box"/>
  <text x="645" y="278" class="t" text-anchor="middle">quiz-1 → quiz-2 조회</text>
  <text x="645" y="304" class="d" text-anchor="middle">1. 이름으로 물음</text>
  <text x="645" y="326" class="d" text-anchor="middle">2. IP 하나만 돌아옴</text>
  <text x="645" y="348" class="d" text-anchor="middle">3. 그 주소로 직접 연결</text>

  <path d="M406,349 L498,324" stroke="#b8b3ad" stroke-width="1.6" fill="none" marker-end="url(#dns-a)"/>

  <text x="24" y="400" class="n">이름 뒤 생략 · .kiada.svc</text>
  <text x="500" y="400" class="n">DNAT 바꿔치기 없음</text>
</svg>

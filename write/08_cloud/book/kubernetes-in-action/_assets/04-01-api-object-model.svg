<svg viewBox="0 0 960 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>쿠버네티스 API 오브젝트 모델 — 클러스터의 거의 모든 것이 오브젝트로 표현된다</title>
  <desc>사용자는 API 오브젝트를 조작(쓰기·읽기)하는 것으로 클러스터를 설정한다. API 안에는 Pod·Deployment·Service·Node·ConfigMap·PersistentVolume 같은 오브젝트가 있고, 이들은 클러스터 노드 안의 로드밸런서·애플리케이션 설정·실행 중인 애플리케이션·로컬 스토리지, 그리고 네트워크 스토리지 같은 실제 구성 요소를 나타낸다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .zlabel { font-size: 12px; font-weight: 700; fill: #e8e4df; }
      .card   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .cardlt { font-size: 12px; font-weight: 700; fill: #e8e4df; }
      .inner  { font-size: 10.5px; font-weight: 700; fill: #0d0d0d; }
      .mt     { font-size: 10px; fill: rgb(138,133,128); }
      .note   { font-size: 11px; fill: #e8e4df; }
      .arrl   { font-size: 10.5px; font-weight: 700; fill: rgb(212,168,83); }
    </style>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">쿠버네티스 API 오브젝트 모델</text>
  <text x="24" y="48" class="sub">API 오브젝트는 클러스터에 존재하는 거의 모든 것을 나타내고, 사용자는 이 오브젝트를 조작해 클러스터를 설정한다</text>

  <!-- User -->
  <circle cx="70" cy="150" r="24" fill="rgb(220,234,247)"/>
  <text x="70" y="192" class="note" text-anchor="middle">사용자</text>
  <text x="70" y="208" class="mt" text-anchor="middle">(엔지니어)</text>
  <!-- write / read arrows -->
  <line x1="100" y1="138" x2="196" y2="120" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="150" y="118" class="arrl" text-anchor="middle">쓰기</text>
  <line x1="196" y1="170" x2="100" y2="164" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="150" y="188" class="arrl" text-anchor="middle">읽기</text>

  <!-- Kubernetes API box -->
  <rect x="200" y="72" width="540" height="180" rx="10" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="216" y="94" class="zlabel">Kubernetes API</text>

  <!-- object cards row 1 -->
  <rect x="216" y="104" width="160" height="50" rx="6" fill="rgb(91,155,213)"/>
  <text x="296" y="126" class="cardlt" text-anchor="middle">Pod</text>
  <text x="296" y="143" class="inner" text-anchor="middle" font-weight="400">실행 인스턴스</text>

  <rect x="386" y="104" width="160" height="50" rx="6" fill="rgb(197,179,224)"/>
  <text x="466" y="126" class="card" text-anchor="middle">Deployment</text>
  <text x="466" y="143" class="inner" text-anchor="middle" font-weight="400">배포 정의</text>

  <rect x="556" y="104" width="168" height="50" rx="6" fill="rgb(102,187,106)"/>
  <text x="640" y="126" class="card" text-anchor="middle">Service</text>
  <text x="640" y="143" class="inner" text-anchor="middle" font-weight="400">단일 진입점</text>

  <!-- object cards row 2 -->
  <rect x="216" y="164" width="160" height="50" rx="6" fill="rgb(232,228,223)"/>
  <text x="296" y="186" class="card" text-anchor="middle">Node</text>
  <text x="296" y="203" class="inner" text-anchor="middle" font-weight="400">클러스터 컴퓨터</text>

  <rect x="386" y="164" width="160" height="50" rx="6" fill="rgb(245,215,110)"/>
  <text x="466" y="186" class="card" text-anchor="middle">ConfigMap</text>
  <text x="466" y="203" class="inner" text-anchor="middle" font-weight="400">설정 데이터</text>

  <rect x="556" y="164" width="168" height="50" rx="6" fill="rgb(240,150,190)"/>
  <text x="640" y="186" class="card" text-anchor="middle">PersistentVolume</text>
  <text x="640" y="203" class="inner" text-anchor="middle" font-weight="400">영속 스토리지</text>

  <text x="216" y="238" class="mt">이 밖에도 로드밸런서·보안 권한·스토리지 등 수많은 오브젝트 타입이 있다</text>

  <!-- big arrow API -> cluster (configures) -->
  <line x1="470" y1="252" x2="470" y2="288" stroke="rgb(212,168,83)" stroke-width="3" marker-end="url(#ah)"/>
  <text x="486" y="276" class="arrl">구성한다(configure)</text>

  <!-- Cluster nodes -->
  <text x="24" y="312" class="zlabel">실제 클러스터 (오브젝트가 나타내는 대상)</text>

  <!-- cluster node 1 -->
  <rect x="24" y="322" width="360" height="122" rx="10" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <rect x="40" y="336" width="158" height="44" rx="6" fill="rgb(102,187,106)"/>
  <text x="119" y="363" class="inner" text-anchor="middle">Load balancer</text>
  <rect x="206" y="336" width="162" height="44" rx="6" fill="rgb(245,215,110)"/>
  <text x="287" y="363" class="inner" text-anchor="middle">App config</text>
  <rect x="40" y="386" width="158" height="44" rx="6" fill="rgb(91,155,213)"/>
  <text x="119" y="413" class="inner" text-anchor="middle" fill="#0d0d0d">Running app</text>
  <rect x="206" y="386" width="162" height="44" rx="6" fill="rgb(240,150,190)"/>
  <text x="287" y="413" class="inner" text-anchor="middle">Local storage</text>
  <text x="204" y="440" class="mt" text-anchor="middle" fill="rgb(138,133,128)">Cluster node</text>

  <!-- cluster node 2 -->
  <rect x="400" y="322" width="360" height="122" rx="10" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <rect x="416" y="336" width="158" height="44" rx="6" fill="rgb(102,187,106)"/>
  <text x="495" y="363" class="inner" text-anchor="middle">Load balancer</text>
  <rect x="582" y="336" width="162" height="44" rx="6" fill="rgb(245,215,110)"/>
  <text x="663" y="363" class="inner" text-anchor="middle">App config</text>
  <rect x="416" y="386" width="158" height="44" rx="6" fill="rgb(91,155,213)"/>
  <text x="495" y="413" class="inner" text-anchor="middle" fill="#0d0d0d">Running app</text>
  <rect x="582" y="386" width="162" height="44" rx="6" fill="rgb(240,150,190)"/>
  <text x="663" y="413" class="inner" text-anchor="middle">Local storage</text>
  <text x="580" y="440" class="mt" text-anchor="middle" fill="rgb(138,133,128)">Cluster node</text>

  <!-- network storage -->
  <rect x="776" y="322" width="160" height="122" rx="10" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <rect x="792" y="336" width="128" height="30" rx="6" fill="rgb(240,150,190)"/>
  <text x="856" y="356" class="inner" text-anchor="middle">Network storage</text>
  <rect x="792" y="372" width="128" height="30" rx="6" fill="rgb(240,150,190)"/>
  <text x="856" y="392" class="inner" text-anchor="middle">Network storage</text>
  <rect x="792" y="408" width="128" height="30" rx="6" fill="rgb(240,150,190)"/>
  <text x="856" y="428" class="inner" text-anchor="middle">Network storage</text>

  <text x="480" y="463" class="sub" text-anchor="middle">사용자는 개별 서버·스토리지를 직접 만지지 않고, API 오브젝트를 조작하면 쿠버네티스가 실제 구성을 그 상태에 맞춘다</text>
</svg>

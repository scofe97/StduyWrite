<svg viewBox="0 0 960 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>namespaced 타입과 cluster-scoped 타입</title>
  <desc>Pod·ConfigMap·Secret·Event·PersistentVolumeClaim은 namespaced 타입이라 각 namespace 안에 존재한다. Node·PersistentVolume·StorageClass·Namespace 자신은 cluster-scoped 타입이라 namespace 밖 클러스터 수준에 존재한다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .zone   { font-size: 11px; fill: rgb(138,133,128); }
      .chip   { font-size: 10.5px; font-weight: 700; fill: #0d0d0d; }
      .note   { font-size: 11px; fill: #e8e4df; }
    </style>
    <marker id="a72" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="400" fill="#0d0d0d"/>
  <text x="24" y="28" class="title">namespaced 타입과 cluster-scoped 타입</text>
  <text x="24" y="46" class="sub">확인: kubectl api-resources의 NAMESPACED 열</text>

  <!-- Cluster box -->
  <rect x="180" y="66" width="740" height="310" rx="10" fill="rgb(20,20,20)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="550" y="88" class="zone" text-anchor="middle">Kubernetes cluster</text>

  <!-- Namespace A -->
  <rect x="204" y="100" width="336" height="150" rx="8" fill="none" stroke="rgb(138,133,128)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="222" y="114" width="90" height="34" rx="5" fill="rgb(174,214,241)"/>
  <text x="267" y="136" class="chip" text-anchor="middle">Pods</text>
  <rect x="322" y="114" width="100" height="34" rx="5" fill="rgb(205,236,207)"/>
  <text x="372" y="136" class="chip" text-anchor="middle">ConfigMaps</text>
  <rect x="432" y="114" width="90" height="34" rx="5" fill="rgb(240,150,190)"/>
  <text x="477" y="136" class="chip" text-anchor="middle">Secrets</text>
  <rect x="222" y="158" width="90" height="34" rx="5" fill="rgb(174,214,241)"/>
  <text x="267" y="180" class="chip" text-anchor="middle">Events</text>
  <rect x="322" y="158" width="200" height="34" rx="5" fill="rgb(245,215,110)"/>
  <text x="422" y="180" class="chip" text-anchor="middle">PersistentVolumeClaims</text>
  <text x="222" y="236" class="zone">Namespace A</text>

  <!-- Namespace B -->
  <rect x="560" y="100" width="336" height="150" rx="8" fill="none" stroke="rgb(138,133,128)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="578" y="114" width="90" height="34" rx="5" fill="rgb(174,214,241)"/>
  <text x="623" y="136" class="chip" text-anchor="middle">Pods</text>
  <rect x="678" y="114" width="100" height="34" rx="5" fill="rgb(205,236,207)"/>
  <text x="728" y="136" class="chip" text-anchor="middle">ConfigMaps</text>
  <rect x="788" y="114" width="90" height="34" rx="5" fill="rgb(240,150,190)"/>
  <text x="833" y="136" class="chip" text-anchor="middle">Secrets</text>
  <rect x="578" y="158" width="90" height="34" rx="5" fill="rgb(174,214,241)"/>
  <text x="623" y="180" class="chip" text-anchor="middle">Events</text>
  <rect x="678" y="158" width="200" height="34" rx="5" fill="rgb(245,215,110)"/>
  <text x="778" y="180" class="chip" text-anchor="middle">PersistentVolumeClaims</text>
  <text x="578" y="236" class="zone">Namespace B</text>

  <!-- Cluster-scoped row -->
  <rect x="240" y="288" width="110" height="40" rx="5" fill="rgb(232,228,223)"/>
  <text x="295" y="313" class="chip" text-anchor="middle">Nodes</text>
  <rect x="370" y="288" width="180" height="40" rx="5" fill="rgb(250,211,180)"/>
  <text x="460" y="313" class="chip" text-anchor="middle">PersistentVolumes</text>
  <rect x="570" y="288" width="150" height="40" rx="5" fill="rgb(197,179,224)"/>
  <text x="645" y="313" class="chip" text-anchor="middle">StorageClasses</text>
  <rect x="740" y="288" width="140" height="40" rx="5" fill="rgb(232,228,223)"/>
  <text x="810" y="313" class="chip" text-anchor="middle">Namespaces</text>

  <!-- annotations -->
  <text x="24" y="150" class="note">일부 오브젝트 타입은</text>
  <text x="24" y="166" class="note">namespaced —</text>
  <text x="24" y="182" class="note">namespace 안에 존재</text>
  <line x1="150" y1="165" x2="200" y2="165" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a72)"/>

  <text x="24" y="295" class="note">일부는 cluster-scoped —</text>
  <text x="24" y="311" class="note">namespace 밖</text>
  <text x="24" y="327" class="note">클러스터 수준에 존재</text>
  <line x1="150" y1="308" x2="236" y2="308" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a72)"/>
</svg>

<svg viewBox="0 0 960 380" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <title>startup·liveness probe의 활성 구간이 시간 축에서 어긋난다 (실측)</title>
  <desc>같은 cat /tmp/ready 명령을 startup과 liveness 두 probe에 똑같이 걸었다. 기동 20초 동안 startup probe만 3초 주기로 실행되어 파일이 없으니 7번 실패했고, 그 사이 liveness probe는 아예 실행되지 않아 실패 이벤트가 0건이었다. startup이 7번 실패하는 동안에도 failureThreshold(10) 예산 안이라 컨테이너는 재시작되지 않았다. 20초 뒤 /tmp/ready가 생겨 startup이 성공하자 쿠버네티스가 liveness로 전환하고 READY가 1/1이 됐다.</desc>
  <rect x="0" y="0" width="960" height="380" fill="#0d0d0d"/>
  <text x="28" y="38" font-size="19" font-weight="800" fill="#e8e4df">같은 명령, 다른 활성 구간 — startup이 도는 동안 liveness는 침묵한다</text>
  <text x="28" y="61" font-size="12.5" fill="#a09c96">startup·liveness에 똑같이 <tspan font-family="monospace" fill="#d4a853">cat /tmp/ready</tspan> 를 걸어도, 실패 기록은 한쪽에만 남는다 (실측)</text>

  <!-- 시간 축 -->
  <line x1="150" y1="110" x2="900" y2="110" stroke="#4a4640" stroke-width="1.5"/>
  <text x="150" y="98" font-size="11" fill="#a09c96" text-anchor="middle">0s</text>
  <text x="560" y="98" font-size="11" fill="#a09c96" text-anchor="middle">20s (/tmp/ready 생성)</text>
  <text x="890" y="98" font-size="11" fill="#a09c96" text-anchor="end">그 이후</text>
  <!-- 20초 경계선 -->
  <line x1="560" y1="120" x2="560" y2="320" stroke="#5b9bd5" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- STARTUP 행 -->
  <text x="30" y="168" font-size="13" font-weight="700" fill="#e8e4df">startup</text>
  <text x="30" y="184" font-size="10" fill="#a09c96">period=3s</text>
  <!-- 활성 구간 배경 (기동 20초) -->
  <rect x="150" y="146" width="410" height="34" rx="6" fill="#f5edda"/>
  <!-- 실패 ✗ 7개 -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="182" y="168" style="fill:#b03030">✗</text>
    <text x="236" y="168" style="fill:#b03030">✗</text>
    <text x="290" y="168" style="fill:#b03030">✗</text>
    <text x="344" y="168" style="fill:#b03030">✗</text>
    <text x="398" y="168" style="fill:#b03030">✗</text>
    <text x="452" y="168" style="fill:#b03030">✗</text>
    <text x="506" y="168" style="fill:#b03030">✗</text>
  </g>
  <text x="355" y="200" font-size="10.5" text-anchor="middle" style="fill:#8a8580">파일 없음 → 7번 실패 (그래도 예산 10 안이라 재시작 X)</text>
  <!-- 성공 ✓ (20초 이후) -->
  <rect x="562" y="146" width="336" height="34" rx="6" fill="#0d0d0d" stroke="#4ac26b" stroke-width="1.2"/>
  <text x="600" y="168" font-size="14" font-weight="700" style="fill:#4ac26b">✓</text>
  <text x="620" y="168" font-size="11" style="fill:#8fcf9a">성공 → liveness로 인계</text>

  <!-- LIVENESS 행 -->
  <text x="30" y="258" font-size="13" font-weight="700" fill="#e8e4df">liveness</text>
  <text x="30" y="274" font-size="10" fill="#a09c96">period=5s</text>
  <!-- 침묵 구간 (기동 20초, 회색 빗금 느낌) -->
  <rect x="150" y="236" width="410" height="34" rx="6" fill="#0d0d0d" stroke="#4a4640" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="355" y="258" font-size="11.5" text-anchor="middle" fill="#8a8580">비활성 — 실행되지 않음 (실패 이벤트 0건)</text>
  <!-- 활성 구간 (20초 이후) -->
  <rect x="562" y="236" width="336" height="34" rx="6" fill="#dafbe1"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="600" y="258" style="fill:#1a7f37">✓</text>
    <text x="648" y="258" style="fill:#1a7f37">✓</text>
    <text x="696" y="258" style="fill:#1a7f37">✓</text>
    <text x="744" y="258" style="fill:#1a7f37">✓</text>
  </g>
  <text x="800" y="258" font-size="10.5" text-anchor="middle" style="fill:#14521d">촘촘히 감시 시작</text>

  <!-- 인계 화살표 -->
  <path d="M560,197 C560,215 560,218 560,232" stroke="#4ac26b" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4ac26b"/></marker></defs>

  <!-- 하단 결론 -->
  <text x="28" y="345" font-size="12" fill="#e8e4df">핵심: 같은 <tspan font-family="monospace" fill="#d4a853">cat /tmp/ready</tspan> 인데 startup은 7번 실패 기록, liveness는 0건 — 활성 시점이 갈린다.</text>
  <text x="28" y="365" font-size="11" fill="#a09c96">기동 실패는 startup이 관대하게 흡수(안 죽임), 뜬 뒤 빠른 감지는 liveness가 맡는 분업.</text>
</svg>

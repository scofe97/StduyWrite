<svg viewBox="0 0 780 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>주 컨테이너와 사이드카 컨테이너</title>
  <desc>Pod 안에서 주 컨테이너는 주 애플리케이션 프로세스를 돌리고, 하나 이상의 사이드카 컨테이너가 그 주 컨테이너의 동작을 보완한다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .cname  { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .note   { font-size: 11px; fill: #e8e4df; }
    </style>
    <marker id="a5b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="300" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">주 컨테이너와 사이드카 컨테이너</text>
  <text x="24" y="48" class="sub">사이드카는 주 컨테이너의 동작을 보완한다 — Pod는 사이드카를 여럿 둘 수 있다</text>

  <!-- Pod 경계 -->
  <rect x="60" y="80" width="500" height="180" rx="14" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="2"/>
  <text x="530" y="244" class="sub" text-anchor="end">Pod</text>

  <!-- Primary -->
  <rect x="90" y="110" width="150" height="110" rx="8" fill="rgb(230,126,34)"/>
  <text x="165" y="160" class="cname" text-anchor="middle">Primary</text>
  <text x="165" y="180" class="cname" text-anchor="middle">container</text>

  <!-- Sidecars (stacked) -->
  <rect x="330" y="130" width="180" height="70" rx="8" fill="rgb(250,211,180)"/>
  <rect x="318" y="118" width="180" height="70" rx="8" fill="rgb(250,211,180)"/>
  <rect x="306" y="106" width="180" height="70" rx="8" fill="rgb(250,211,180)"/>
  <text x="396" y="136" class="cname" text-anchor="middle">Sidecar</text>
  <text x="396" y="156" class="cname" text-anchor="middle">container(s)</text>

  <!-- annotations -->
  <line x1="165" y1="110" x2="200" y2="72" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a5b)"/>
  <text x="130" y="66" class="note">주 컨테이너는 주 애플리케이션 프로세스를 돌린다</text>

  <line x1="470" y1="120" x2="600" y2="140" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a5b)"/>
  <text x="580" y="120" class="note">하나 이상의 사이드카가</text>
  <text x="580" y="136" class="note">주 컨테이너를 보완한다</text>
</svg>

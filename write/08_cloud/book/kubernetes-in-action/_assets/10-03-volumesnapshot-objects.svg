<svg viewBox="0 0 960 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>VolumeSnapshot·VolumeSnapshotContent가 PVC·PV와 대응하는 관계</title>
  <desc>VolumeSnapshot은 스냅샷 요청을, VolumeSnapshotContent는 실제 스냅샷을 대표한다. 이는 PVC가 스토리지 요청을, PV가 실제 스토리지를 대표하는 것과 같은 구조다. VolumeSnapshot·PVC는 네임스페이스 오브젝트, VolumeSnapshotContent·PV는 클러스터 범위 오브젝트다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .lbl   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .scope { font-size: 11px; font-weight: 700; fill: rgb(212,168,83); }
      .role  { font-size: 11px; fill: rgb(138,133,128); }
      .eq    { font-size: 20px; font-weight: 800; fill: rgb(138,133,128); }
    </style>
    <marker id="v10" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(91,155,213)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="360" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">VolumeSnapshot ↔ VolumeSnapshotContent = PVC ↔ PV</text>
  <text x="24" y="50" class="sub">요청 오브젝트(네임스페이스)와 실제 오브젝트(클러스터 범위)로 나뉘는 같은 구조가 스냅샷에도 반복된다</text>

  <!-- namespace scope band -->
  <rect x="40" y="90" width="880" height="90" rx="10" fill="rgb(24,28,32)" stroke="rgb(91,155,213)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="110" class="scope">네임스페이스 범위 (일반 사용자)</text>

  <!-- cluster scope band -->
  <rect x="40" y="200" width="880" height="90" rx="10" fill="rgb(30,26,20)" stroke="rgb(212,168,83)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="220" class="scope">클러스터 범위 (운영자)</text>

  <!-- PVC -->
  <path d="M110,124 h150 v34 l-14,14 h-136 z" fill="rgb(245,225,110)"/>
  <text x="178" y="150" class="lbl" text-anchor="middle">PVC</text>
  <text x="185" y="192" class="role" text-anchor="middle">스토리지 요청</text>

  <!-- PV -->
  <rect x="110" y="230" width="150" height="46" rx="6" fill="rgb(245,180,140)"/>
  <text x="185" y="258" class="lbl" text-anchor="middle">PV</text>
  <text x="185" y="176" class="role" text-anchor="middle" opacity="0"> </text>

  <!-- PVC -> PV bind -->
  <path d="M185,172 L185,226" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#v10)"/>

  <!-- equals -->
  <text x="440" y="150" class="eq" text-anchor="middle">≈</text>
  <text x="440" y="258" class="eq" text-anchor="middle">≈</text>

  <!-- VolumeSnapshot -->
  <path d="M600,124 h230 v34 l-14,14 h-216 z" fill="rgb(210,238,212)"/>
  <text x="708" y="150" class="lbl" text-anchor="middle">VolumeSnapshot</text>
  <text x="715" y="192" class="role" text-anchor="middle">스냅샷 요청</text>

  <!-- VolumeSnapshotContent -->
  <rect x="600" y="230" width="230" height="46" rx="6" fill="rgb(200,225,240)"/>
  <text x="715" y="258" class="lbl" text-anchor="middle">VolumeSnapshotContent</text>

  <!-- VS -> VSC -->
  <path d="M715,172 L715,226" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#v10)"/>

  <text x="480" y="330" class="sub" text-anchor="middle">스냅샷을 또 만들려면 새 VolumeSnapshot 을 만들고, 그때마다 새 VolumeSnapshotContent 를 얻는다</text>
</svg>

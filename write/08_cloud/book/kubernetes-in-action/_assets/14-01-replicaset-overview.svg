<svg viewBox="0 0 960 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>ReplicaSet 개요</title>
  <desc>ReplicaSet 오브젝트에 원하는 복제본 수(3×)와 Pod 템플릿을 적으면, 쿠버네티스가 그 템플릿으로 원하는 수만큼 파드를 만든다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: #b8b3ad; }
      .rs    { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .tmpl  { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .pod   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .lbl   { font-size: 11px; fill: #e8e4df; }
      .cnt   { font-size: 13px; font-weight: 800; fill: rgb(212,168,83); }
    </style>
    <marker id="rso-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="320" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">ReplicaSet — 원하는 수 + Pod 템플릿 → 파드 생성</text>
  <text x="24" y="50" class="sub">복제본 수와 템플릿을 적으면 쿠버네티스가 그만큼 파드를 만듭니다</text>

  <!-- ReplicaSet box -->
  <rect x="60" y="90" width="230" height="160" rx="10" fill="rgb(200,220,245)" stroke="rgb(91,155,213)" stroke-width="1.5"/>
  <text x="175" y="116" class="rs" text-anchor="middle">kiada ReplicaSet</text>
  <text x="90" y="240" class="cnt" style="fill:#0d0d0d">3 ×</text>
  <text x="90" y="150" class="lbl" style="fill:#0d0d0d" font-size="10">원하는 복제본 수</text>
  <!-- pod template inside -->
  <rect x="150" y="160" width="110" height="66" rx="8" fill="rgb(91,155,213)"/>
  <text x="205" y="190" class="tmpl" text-anchor="middle">kiada</text>
  <text x="205" y="208" class="tmpl" text-anchor="middle">pod (template)</text>

  <!-- generated pods -->
  <g>
    <rect x="640" y="90" width="150" height="46" rx="8" fill="rgb(91,155,213)"/>
    <rect x="640" y="152" width="150" height="46" rx="8" fill="rgb(91,155,213)"/>
    <rect x="640" y="214" width="150" height="46" rx="8" fill="rgb(91,155,213)"/>
  </g>
  <text x="715" y="118" class="pod" text-anchor="middle">kiada pod</text>
  <text x="715" y="180" class="pod" text-anchor="middle">kiada pod</text>
  <text x="715" y="242" class="pod" text-anchor="middle">kiada pod</text>

  <!-- arrows template → pods -->
  <line x1="290" y1="193" x2="450" y2="193" stroke="rgb(138,133,128)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="450" y1="113" x2="450" y2="237" stroke="rgb(138,133,128)" stroke-width="1.6"/>
  <line x1="450" y1="113" x2="638" y2="113" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#rso-a)"/>
  <line x1="450" y1="175" x2="638" y2="175" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#rso-a)"/>
  <line x1="450" y1="237" x2="638" y2="237" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#rso-a)"/>

  <text x="465" y="288" class="lbl" text-anchor="middle">쿠버네티스가 Pod 템플릿으로 원하는 수만큼 파드를 만듭니다</text>
</svg>

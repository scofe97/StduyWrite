<svg viewBox="0 0 960 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Indexed 완료 모드의 인덱스 분배</title>
  <desc>Indexed 완료 모드에서는 하나의 Pod 템플릿으로 completions 수만큼 파드를 만들되, 각 파드에 0부터 시작하는 완료 인덱스를 준다. 파드는 JOB_COMPLETION_INDEX 환경 변수로 자신이 처리할 부분을 정한다. 여기서는 12개월을 12개 파드가 나눠 처리한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .lbl   { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .tmpl  { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .idx   { font-size: 11px; font-weight: 700; fill: #e8e4df; }
      .mon   { font-size: 9.5px; fill: #e8e4df; }
      .note  { font-size: 10px; fill: rgb(138,133,128); }
    </style>
    <marker id="ix-a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="320" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Indexed 완료 모드 — 인덱스로 나눠 처리</text>
  <text x="24" y="50" class="sub">completions 12 · completionMode Indexed. 각 파드가 JOB_COMPLETION_INDEX(0~11)로 처리할 월 결정</text>

  <!-- template -->
  <rect x="30" y="120" width="150" height="70" rx="8" fill="rgb(212,168,83)"/>
  <text x="105" y="148" class="tmpl" text-anchor="middle">Pod 템플릿</text>
  <text x="105" y="168" class="tmpl" text-anchor="middle" font-size="10">YEAR=2021</text>
  <text x="105" y="182" class="tmpl" text-anchor="middle" font-size="9.5">(단일)</text>
  <line x1="180" y1="155" x2="240" y2="155" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#ix-a)"/>

  <!-- 12 pods grid: 6 cols x 2 rows -->
  <g>
    <!-- row 1: idx 0-5 -->
    <rect x="250" y="90"  width="108" height="46" rx="6" fill="rgb(91,155,213)"/><text x="304" y="110" class="idx" text-anchor="middle">index 0</text><text x="304" y="126" class="mon" text-anchor="middle">→ 1월</text>
    <rect x="366" y="90"  width="108" height="46" rx="6" fill="rgb(91,155,213)"/><text x="420" y="110" class="idx" text-anchor="middle">index 1</text><text x="420" y="126" class="mon" text-anchor="middle">→ 2월</text>
    <rect x="482" y="90"  width="108" height="46" rx="6" fill="rgb(91,155,213)"/><text x="536" y="110" class="idx" text-anchor="middle">index 2</text><text x="536" y="126" class="mon" text-anchor="middle">→ 3월</text>
    <rect x="598" y="90"  width="108" height="46" rx="6" fill="rgb(91,155,213)"/><text x="652" y="110" class="idx" text-anchor="middle">index 3</text><text x="652" y="126" class="mon" text-anchor="middle">→ 4월</text>
    <rect x="714" y="90"  width="108" height="46" rx="6" fill="rgb(91,155,213)"/><text x="768" y="110" class="idx" text-anchor="middle">index 4</text><text x="768" y="126" class="mon" text-anchor="middle">→ 5월</text>
    <rect x="830" y="90"  width="108" height="46" rx="6" fill="rgb(91,155,213)"/><text x="884" y="110" class="idx" text-anchor="middle">index 5</text><text x="884" y="126" class="mon" text-anchor="middle">→ 6월</text>
    <!-- row 2: idx 6-11 -->
    <rect x="250" y="150" width="108" height="46" rx="6" fill="rgb(91,155,213)"/><text x="304" y="170" class="idx" text-anchor="middle">index 6</text><text x="304" y="186" class="mon" text-anchor="middle">→ 7월</text>
    <rect x="366" y="150" width="108" height="46" rx="6" fill="rgb(91,155,213)"/><text x="420" y="170" class="idx" text-anchor="middle">index 7</text><text x="420" y="186" class="mon" text-anchor="middle">→ 8월</text>
    <rect x="482" y="150" width="108" height="46" rx="6" fill="rgb(91,155,213)"/><text x="536" y="170" class="idx" text-anchor="middle">index 8</text><text x="536" y="186" class="mon" text-anchor="middle">→ 9월</text>
    <rect x="598" y="150" width="108" height="46" rx="6" fill="rgb(91,155,213)"/><text x="652" y="170" class="idx" text-anchor="middle">index 9</text><text x="652" y="186" class="mon" text-anchor="middle">→ 10월</text>
    <rect x="714" y="150" width="108" height="46" rx="6" fill="rgb(91,155,213)"/><text x="768" y="170" class="idx" text-anchor="middle">index 10</text><text x="768" y="186" class="mon" text-anchor="middle">→ 11월</text>
    <rect x="830" y="150" width="108" height="46" rx="6" fill="rgb(91,155,213)"/><text x="884" y="170" class="idx" text-anchor="middle">index 11</text><text x="884" y="186" class="mon" text-anchor="middle">→ 12월</text>
  </g>

  <text x="250" y="235" class="note">month = JOB_COMPLETION_INDEX + 1  (인덱스 0-based → 월 1-based)</text>
  <text x="250" y="252" class="note">hostname = &lt;job&gt;-&lt;index&gt; · annotation batch.kubernetes.io/job-completion-index</text>
  <text x="250" y="269" class="note">NonIndexed(기본)는 모든 파드가 동일 — 각 파드에 다른 월을 못 넘김</text>
</svg>

<title id="dt">같은 템플릿, 다른 몫</title><desc id="dd">completionMode 를 Indexed 로 두면 파드마다 0 부터 번호가 붙는다. 그 번호를 환경변수와 어노테이션으로 받아 각자 처리할 범위를 스스로 계산한다.</desc>
<rect width="1220" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 18-02</text>

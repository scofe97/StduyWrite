<text x="1060" y="368" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">11000 ~ 11999</text>
<text x="24" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">번호가 없으면(NonIndexed) 파드들이 서로 구분되지 않아, 누가 무엇을 맡을지 밖에서 정해 줘야 한다. 그 조율을 큐로 미는 방법이 18-03 이다.</text>

<svg viewBox="0 0 960 460" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>app·rel 두 라벨로 Pod를 2차원으로 조직</title>
  <desc>app 라벨은 Pod를 애플리케이션(kiada·quiz·quote)별로 가로로, rel 라벨은 릴리스(stable·canary)별로 세로로 조직한다. app=quote 같은 equality 셀렉터는 quote 열의 stable과 canary Pod 전부를 선택한다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .colh   { font-size: 12px; font-weight: 700; fill: #e8e4df; font-family: 'JetBrains Mono', monospace; }
      .rowh   { font-size: 12px; font-weight: 700; fill: #e8e4df; font-family: 'JetBrains Mono', monospace; }
      .pname  { font-size: 12px; font-weight: 800; fill: #0d0d0d; }
      .lchip  { font-size: 9.5px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .note   { font-size: 10.5px; fill: #e8e4df; }
      .sel    { font-size: 12px; font-weight: 800; fill: rgb(212,168,83); font-family: 'JetBrains Mono', monospace; }
    </style>
    <marker id="a73" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="#0d0d0d"/>
  <text x="24" y="28" class="title">app·rel 두 라벨로 Pod를 2차원으로 조직</text>
  <text x="24" y="46" class="sub">가로 = app(애플리케이션) · 세로 = rel(릴리스) — 라벨을 붙이는 순간 무질서한 Pod들이 격자로 정렬된다</text>

  <!-- column headers -->
  <text x="230" y="86" class="colh" text-anchor="middle">app: kiada</text>
  <text x="480" y="86" class="colh" text-anchor="middle">app: quiz</text>
  <text x="730" y="86" class="colh" text-anchor="middle">app: quote</text>

  <!-- row headers -->
  <text x="60" y="170" class="rowh" text-anchor="middle" transform="rotate(-90 60 170)">rel: stable</text>
  <text x="60" y="352" class="rowh" text-anchor="middle" transform="rotate(-90 60 352)">rel: canary</text>

  <!-- selector highlight around quote column -->
  <rect x="608" y="96" width="252" height="330" rx="14" fill="none" stroke="rgb(212,168,83)" stroke-width="2.5" stroke-dasharray="8 5"/>

  <!-- === stable row === -->
  <!-- kiada-xxx stack (blue) -->
  <rect x="128" y="120" width="180" height="96" rx="10" fill="rgb(58,110,165)"/>
  <rect x="120" y="112" width="180" height="96" rx="10" fill="rgb(74,130,190)"/>
  <rect x="112" y="104" width="180" height="96" rx="10" fill="rgb(91,155,213)"/>
  <text x="160" y="152" class="pname" style="fill:#e8e4df">kiada-</text>
  <text x="160" y="168" class="pname" style="fill:#e8e4df">xxx</text>
  <rect x="204" y="118" width="80" height="20" rx="4" fill="rgb(232,228,223)"/>
  <text x="244" y="132" class="lchip" text-anchor="middle">app: kiada</text>
  <rect x="204" y="144" width="80" height="20" rx="4" fill="rgb(205,236,207)"/>
  <text x="244" y="158" class="lchip" text-anchor="middle">rel: stable</text>

  <!-- quiz (orange) -->
  <rect x="390" y="104" width="180" height="96" rx="10" fill="rgb(230,126,34)"/>
  <text x="430" y="158" class="pname">quiz</text>
  <rect x="474" y="118" width="80" height="20" rx="4" fill="rgb(232,228,223)"/>
  <text x="514" y="132" class="lchip" text-anchor="middle">app: quiz</text>
  <rect x="474" y="144" width="80" height="20" rx="4" fill="rgb(205,236,207)"/>
  <text x="514" y="158" class="lchip" text-anchor="middle">rel: stable</text>

  <!-- quote-xxx stack (green) -->
  <rect x="636" y="120" width="180" height="96" rx="10" fill="rgb(62,128,66)"/>
  <rect x="628" y="112" width="180" height="96" rx="10" fill="rgb(80,155,84)"/>
  <rect x="620" y="104" width="180" height="96" rx="10" fill="rgb(102,187,106)"/>
  <text x="666" y="152" class="pname">quote-</text>
  <text x="666" y="168" class="pname">xxx</text>
  <rect x="712" y="118" width="80" height="20" rx="4" fill="rgb(232,228,223)"/>
  <text x="752" y="132" class="lchip" text-anchor="middle">app: quote</text>
  <rect x="712" y="144" width="80" height="20" rx="4" fill="rgb(205,236,207)"/>
  <text x="752" y="158" class="lchip" text-anchor="middle">rel: stable</text>

  <!-- === canary row === -->
  <!-- kiada-canary (light blue) -->
  <rect x="112" y="290" width="180" height="96" rx="10" fill="rgb(174,214,241)"/>
  <text x="152" y="336" class="pname">kiada-</text>
  <text x="152" y="352" class="pname">canary</text>
  <rect x="204" y="304" width="80" height="20" rx="4" fill="rgb(232,228,223)"/>
  <text x="244" y="318" class="lchip" text-anchor="middle">app: kiada</text>
  <rect x="204" y="330" width="80" height="20" rx="4" fill="rgb(240,150,190)"/>
  <text x="244" y="344" class="lchip" text-anchor="middle">rel: canary</text>

  <!-- quote-canary (light green) -->
  <rect x="620" y="290" width="180" height="96" rx="10" fill="rgb(205,236,207)"/>
  <text x="660" y="336" class="pname">quote-</text>
  <text x="660" y="352" class="pname">canary</text>
  <rect x="712" y="304" width="80" height="20" rx="4" fill="rgb(232,228,223)"/>
  <text x="752" y="318" class="lchip" text-anchor="middle">app: quote</text>
  <rect x="712" y="330" width="80" height="20" rx="4" fill="rgb(240,150,190)"/>
  <text x="752" y="344" class="lchip" text-anchor="middle">rel: canary</text>

  <!-- selector annotation -->
  <text x="880" y="230" class="sel">app=quote</text>
  <line x1="876" y1="236" x2="864" y2="248" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a73)"/>
  <text x="870" y="264" class="note" text-anchor="end">셀렉터는 quote 열의</text>
  <text x="870" y="280" class="note" text-anchor="end">stable+canary 전부 선택</text>

  <text x="480" y="440" class="sub" text-anchor="middle">rel=canary는 canary 행 전체를, app=quote,rel=canary는 quote-canary 하나만 선택한다</text>
</svg>

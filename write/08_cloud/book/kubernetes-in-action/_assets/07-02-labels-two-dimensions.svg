<title id="dt">라벨 둘을 붙이는 순간 Pod 가 격자로 정렬된다</title><desc id="dd">가로축은 app, 세로축은 rel 이다. 셀렉터는 이 격자에서 열을 고르거나 행을 고르거나 한 칸을 고른다 — 무엇을 고르는지가 면적으로 보인다.</desc>
<rect width="1000" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 07-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">라벨 둘을 붙이는 순간 Pod 가 격자로 정렬된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">라벨이 없으면 Pod 는 그냥 무질서한 목록이다</text>
<rect x="24" y="104" width="952" height="472" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">app=quote 는 열 하나를, rel=canary 는 행 하나를, 둘을 겹치면 칸 하나를 고른다</text>
<rect x="653" y="236" width="214" height="284" rx="8" fill="#F08A590A" stroke="#F08A59" stroke-width="1.4" stroke-dasharray="7 6"/>
<rect x="667" y="227" width="151" height="18" fill="#0D1117"/>
<text x="677" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="600" fill="#F08A59">app=quote 가 고르는 범위</text>
<text x="300" y="214" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">app: kiada</text>
<text x="530" y="214" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">app: quiz</text>
<text x="760" y="214" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">app: quote</text>
<text x="150" y="317" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">rel: stable</text>
<text x="150" y="441" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">rel: canary</text>
<rect x="205" y="266" width="190" height="92" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="300" y="300" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">kiada-xxx</text>
<text x="300" y="322" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">app: kiada</text>
<text x="300" y="340" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">rel: stable</text>
<rect x="435" y="266" width="190" height="92" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="530" y="300" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">quiz</text>
<text x="530" y="322" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">app: quiz</text>
<text x="530" y="340" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">rel: stable</text>
<rect x="665" y="266" width="190" height="92" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="760" y="300" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">quote-xxx</text>
<text x="760" y="322" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">app: quote</text>
<text x="760" y="340" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">rel: stable</text>
<rect x="205" y="390" width="190" height="92" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="300" y="424" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">kiada-canary</text>
<text x="300" y="446" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">app: kiada</text>
<text x="300" y="464" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">rel: canary</text>
<rect x="665" y="390" width="190" height="92" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="760" y="424" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">quote-canary</text>
<text x="760" y="446" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">app: quote</text>
<text x="760" y="464" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">rel: canary</text>
<text x="530" y="482" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">quiz 에는 canary 가 없다</text>
<text x="36" y="552" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">셀렉터를 겹칠수록 범위가 좁아진다 — app=quote,rel=canary 는 quote-canary 하나만 남는다.</text>
<line x1="12" y1="592" x2="952" y2="592" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="614" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="604" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="614" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">격자 위의 Pod</text>
<rect x="261" y="604" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="283" y="614" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">app=quote 가 고르는 열</text>

<svg viewBox="0 0 960 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>세 가지 Job 실행 방식</title>
  <desc>단일 Job은 파드 하나를 완료까지 실행한다. 순차 Job은 파드를 하나씩 이어 실행하고, 병렬 Job은 여러 파드를 동시에 실행한다. 각 Job은 파드가 전부 성공적으로 완료되면 완료된다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .lbl   { font-size: 12px; font-weight: 700; fill: #e8e4df; }
      .pod   { font-size: 10.5px; font-weight: 700; fill: #0d0d0d; }
      .note  { font-size: 10px; fill: rgb(138,133,128); }
    </style>
    <marker id="jt-a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="340" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">세 가지 Job 실행 방식</text>
  <text x="24" y="50" class="sub">파드가 모두 성공적으로 완료(exit 0)되면 Job도 완료. 시간 →</text>

  <!-- axis hint -->
  <line x1="150" y1="300" x2="900" y2="300" stroke="rgb(70,70,70)" stroke-width="1.2" marker-end="url(#jt-a)"/>
  <text x="905" y="304" class="note">time</text>

  <!-- Job (single) -->
  <text x="24" y="95" class="lbl">단일</text>
  <text x="24" y="110" class="note">completions 없음 = 1</text>
  <rect x="150" y="78" width="150" height="34" rx="6" fill="rgb(102,187,106)"/><text x="225" y="99" class="pod" text-anchor="middle">Pod 1 ✓</text>

  <!-- Job (sequential) -->
  <text x="24" y="165" class="lbl">순차</text>
  <text x="24" y="180" class="note">completions 3</text>
  <rect x="150" y="148" width="150" height="34" rx="6" fill="rgb(102,187,106)"/><text x="225" y="169" class="pod" text-anchor="middle">Pod 1 ✓</text>
  <rect x="320" y="148" width="150" height="34" rx="6" fill="rgb(102,187,106)"/><text x="395" y="169" class="pod" text-anchor="middle">Pod 2 ✓</text>
  <rect x="490" y="148" width="150" height="34" rx="6" fill="rgb(102,187,106)"/><text x="565" y="169" class="pod" text-anchor="middle">Pod 3 ✓</text>

  <!-- Job (parallel) -->
  <text x="24" y="240" class="lbl">병렬</text>
  <text x="24" y="255" class="note">completions 5 · parallelism 2</text>
  <rect x="150" y="218" width="150" height="30" rx="6" fill="rgb(91,155,213)"/><text x="225" y="238" class="pod" text-anchor="middle" style="fill:#e8e4df">Pod 1 ✓</text>
  <rect x="150" y="252" width="150" height="30" rx="6" fill="rgb(91,155,213)"/><text x="225" y="272" class="pod" text-anchor="middle" style="fill:#e8e4df">Pod 2 ✓</text>
  <rect x="320" y="218" width="150" height="30" rx="6" fill="rgb(91,155,213)"/><text x="395" y="238" class="pod" text-anchor="middle" style="fill:#e8e4df">Pod 3 ✓</text>
  <rect x="320" y="252" width="150" height="30" rx="6" fill="rgb(91,155,213)"/><text x="395" y="272" class="pod" text-anchor="middle" style="fill:#e8e4df">Pod 4 ✓</text>
  <rect x="490" y="235" width="150" height="30" rx="6" fill="rgb(91,155,213)"/><text x="565" y="255" class="pod" text-anchor="middle" style="fill:#e8e4df">Pod 5 ✓</text>

  <text x="680" y="99" class="note">한 파드를 완료까지</text>
  <text x="680" y="169" class="note">앞 파드 끝나면 다음</text>
  <text x="680" y="248" class="note">동시 2개, 끝나면 채움</text>
</svg>

<title id="dt">몇 개가 언제 도는가</title><desc id="dd">completions 와 parallelism 두 값이 실행 모양을 만든다. 하나도 안 적으면 파드 하나, completions 만 적으면 순차, 둘 다 적으면 병렬이 된다.</desc>
<rect width="1240" height="692" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 18-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">몇 개가 언제 도는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">완료 조건은 셋 다 같다 — 성공 횟수를 채우는 것</text>
<rect x="24" y="100" width="1192" height="168" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">단일 파드</text>
<text x="160" y="156" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#6A95D8">completions 없음</text>
<rect x="360" y="172" width="300" height="36" rx="5" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="510.0" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">파드 1</text>
<text x="1130" y="196" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">완료</text>
<rect x="24" y="292" width="1192" height="168" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="312" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">순차 다중 — completions 3</text>
<text x="160" y="348" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#6A95D8">parallelism 없음(=1)</text>
<rect x="360" y="364" width="240.0" height="36" rx="5" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="480.0" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">파드 1</text>
<rect x="615.0" y="364" width="240.0" height="36" rx="5" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="735.0" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">파드 2</text>
<rect x="870.0" y="364" width="240.0" height="36" rx="5" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.1"/>
<text x="990.0" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">파드 3</text>
<text x="1130" y="388" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">완료</text>
<rect x="24" y="484" width="1192" height="168" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="24" y="484" width="4" height="168" rx="2" fill="#F08A59"/>
<text x="38" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">병렬 다중 — completions 3 · parallelism 2</text>
<text x="160" y="540" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#F08A59">동시에 둘씩</text>
<rect x="360" y="556" width="240.0" height="36" rx="5" fill="#F08A5912" stroke="#F08A59" stroke-width="1.1"/>
<text x="480.0" y="580" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">파드 1</text>
<rect x="360" y="602" width="270.0" height="36" rx="5" fill="#F08A5912" stroke="#F08A59" stroke-width="1.1"/>
<text x="495.0" y="626" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">파드 2</text>
<rect x="615.0" y="556" width="240.0" height="36" rx="5" fill="#F08A5912" stroke="#F08A59" stroke-width="1.1"/>
<text x="735.0" y="580" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">파드 3</text>
<text x="1130" y="580" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">완료</text>
<text x="24" y="628" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">셋 다 성공 횟수를 채우면 끝난다. 다른 것은 그 횟수를 채우는 데 파드를 몇 개 쓰고 동시에 몇 개를 돌리느냐다.</text>
<line x1="12" y1="644" x2="1192" y2="644" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="666" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="656" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="666" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">도는 파드</text>
<rect x="209" y="656" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="231" y="666" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">동시에 도는 창</text>
<rect x="357" y="656" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="379" y="666" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">완료</text>

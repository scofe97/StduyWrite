<svg viewBox="0 0 1080 540" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Service 없이 특정 Pod에 직접 접근하는 네 방법</title>
  <desc>Pod IP는 클러스터 내부 전용이라 밖에서 직접 못 닿는다. 개발·디버깅에는 Service를 거치지 않고 특정 Pod에 직접 닿는 네 방법이 있다. ① 워커 노드에 로그인해 접근 ② 클러스터 안 임시 Pod에서 접근 ③ port-forward로 로컬 포트를 터널링 ④ API 서버 프록시. 각각 출발점과 경로가 다르다.</desc>
  <defs>
    <style>
      .title  { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .zone   { font-size: 11.5px; font-weight: 800; fill: rgb(212,168,83); }
      .box    { font-size: 12.5px; font-weight: 800; fill: #0d0d0d; }
      .boxd   { font-size: 12.5px; font-weight: 800; fill: #e8e4df; }
      .desc   { font-size: 10px; font-weight: 600; fill: #e8e4df; }
      .muted  { font-size: 9.5px; fill: rgb(138,133,128); }
      .num    { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .mono   { font-size: 9.5px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e06666"/></marker>
  </defs>

  <rect x="0" y="0" width="1080" height="540" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Service 없이 특정 Pod에 직접 접근하는 네 방법</text>
  <text x="24" y="50" class="sub">Pod IP는 클러스터 내부 전용이라 밖에서 직접 못 닿는다. 개발·디버깅용으로 특정 Pod에 직접 닿는 네 경로.</text>

  <!-- 클러스터 밖 -->
  <text x="40" y="88" class="zone">클러스터 밖 (내 노트북)</text>
  <rect x="36" y="100" width="150" height="70" rx="10" fill="rgb(20,22,26)" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="56" y="128" class="boxd">💻 로컬 kubectl</text>
  <text x="56" y="150" class="muted">Pod IP 직접 접근 ✕</text>

  <!-- 밖에서 직접 실패 -->
  <path d="M186,135 L250,135" fill="none" stroke="#e06666" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- 클러스터 박스 -->
  <rect x="258" y="76" width="794" height="450" rx="14" fill="rgb(16,18,22)" stroke="rgb(212,168,83)" stroke-width="1.4"/>
  <text x="278" y="100" class="zone">클러스터 내부</text>

  <!-- 대상 Pod -->
  <rect x="872" y="250" width="160" height="100" rx="10" fill="#5b9bd5" stroke="#2f6ba3" stroke-width="1.5"/>
  <text x="952" y="284" class="boxd" text-anchor="middle" style="fill:#e8e4df">대상 Pod</text>
  <text x="952" y="306" class="mono" text-anchor="middle" style="fill:#e8e4df">10.244.2.5:8080</text>
  <text x="952" y="330" class="muted" text-anchor="middle" style="fill:#dbe8f5">클러스터 내부 IP</text>

  <!-- ① 워커 노드 -->
  <rect x="278" y="116" width="250" height="72" rx="8" fill="rgb(245,215,110)"/>
  <text x="296" y="140" class="num">①</text>
  <text x="320" y="140" class="box">워커 노드에서 curl</text>
  <text x="296" y="162" class="muted" style="fill:#3a3320">노드에 로그인 → 로컬 통신</text>
  <text x="296" y="178" class="muted" style="fill:#3a3320">가장 짧은 경로, 성공률 높음</text>
  <path d="M528,150 C680,160 760,270 870,290" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ② 임시 Pod -->
  <rect x="278" y="204" width="250" height="72" rx="8" fill="rgb(245,215,110)"/>
  <text x="296" y="228" class="num">②</text>
  <text x="320" y="228" class="box">임시 클라이언트 Pod</text>
  <text x="296" y="250" class="muted" style="fill:#3a3320">클러스터 안 Pod에서 curl</text>
  <text x="296" y="266" class="muted" style="fill:#3a3320">Pod↔Pod 정책까지 시험 가능</text>
  <path d="M528,240 C680,255 770,285 870,300" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ③ port-forward -->
  <rect x="278" y="292" width="250" height="82" rx="8" fill="rgb(245,215,110)"/>
  <text x="296" y="316" class="num">③</text>
  <text x="320" y="316" class="box">port-forward</text>
  <text x="296" y="338" class="muted" style="fill:#3a3320">로컬 포트 → 프록시 터널</text>
  <text x="296" y="356" class="muted" style="fill:#3a3320">가장 쉬움, 내부 경로는 가장 김</text>
  <!-- 밖에서 터널로 들어오는 화살표 -->
  <path d="M110,170 C110,410 220,410 276,340" fill="none" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="130" y="400" class="muted">밖에서 터널로 진입</text>
  <path d="M528,333 C680,320 770,310 870,315" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ④ API 서버 프록시 -->
  <rect x="278" y="390" width="250" height="72" rx="8" fill="rgb(245,215,110)"/>
  <text x="296" y="414" class="num">④</text>
  <text x="320" y="414" class="box">API 서버 프록시</text>
  <text x="296" y="436" class="mono" style="fill:#3a3320">kubectl get --raw .../proxy/</text>
  <text x="296" y="452" class="muted" style="fill:#3a3320">API 서버가 Pod로 프록시</text>
  <path d="M528,426 C680,410 780,340 870,325" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 하단 핵심 -->
  <rect x="36" y="490" width="1016" height="36" rx="8" fill="rgb(26,26,26)" stroke="rgb(42,37,32)" stroke-width="1"/>
  <text x="544" y="513" class="desc" text-anchor="middle">공통점: 넷 다 Service를 거치지 않고 특정 Pod로 직접 간다. ①②는 클러스터 안에서, ③④는 밖에서 우회로를 뚫는다.</text>
</svg>

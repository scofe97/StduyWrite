<title id="dt">같은 서비스를 어디서 부르는가</title><desc id="dd">Kiada 는 HTML 모드와 평문 모드를 함께 제공한다. 두 모드가 부르는 서비스는 같지만 부르는 자리가 클러스터 바깥과 안으로 갈리고, 그 갈림이 노출 요구사항을 만든다.</desc>
<rect width="1000" height="732" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 02-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 서비스를 어디서 부르는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">브라우저가 직접 부르느냐, Node.js 앱이 대신 부르느냐 — 갈리는 것은 호출 주체와 자리다</text>
<rect x="24" y="104" width="952" height="240" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">HTML 모드 — 브라우저가 바깥에서 직접 부른다</text>
<rect x="40" y="148" width="176" height="168" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="128" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">웹 브라우저</text>
<text x="128" y="244" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">클러스터 바깥</text>
<rect x="336" y="150" width="232" height="52" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="452" y="172" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Web</text>
<text x="452" y="192" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">Node.js 가 HTML 을 서빙한다</text>
<path d="M 222 176 L 326 176" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<rect x="336" y="214" width="232" height="52" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="452" y="236" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Quote service</text>
<text x="452" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">REST — 인용문을 준다</text>
<path d="M 222 240 L 326 240" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<rect x="336" y="278" width="232" height="52" rx="6" fill="#161B22" stroke="#6A95D8" stroke-width="1.1"/>
<text x="452" y="300" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#6A95D8">Quiz service</text>
<text x="452" y="320" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">REST — 퀴즈 문제를 준다</text>
<path d="M 222 304 L 326 304" fill="none" stroke="#6A95D8" stroke-width="1.5" marker-end="url(#info)"/>
<text x="600" y="216" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">브라우저가 세 서비스와 직접 통신한다</text>
<text x="600" y="240" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">API 게이트웨이는 일부러 두지 않았다 — 게이트웨이 뒤에</text>
<text x="600" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">묶이지 않은 서비스들의 문제를 보이려는 의도다</text>
<rect x="24" y="360" width="952" height="240" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">평문 모드 — Node.js 앱이 안에서 대신 부른다</text>
<rect x="40" y="454" width="176" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="128" y="476" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">curl</text>
<text x="128" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">터미널 클라이언트</text>
<rect x="336" y="454" width="232" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="452" y="476" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">Node.js Web App</text>
<text x="452" y="496" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">받아서 하나로 합친다</text>
<rect x="700" y="414" width="200" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="800" y="436" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">Quote service</text>
<text x="800" y="456" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">클러스터 안에서 호출</text>
<rect x="700" y="498" width="200" height="52" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="800" y="520" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">Quiz service</text>
<text x="800" y="540" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">클러스터 안에서 호출</text>
<path d="M 222 480 L 326 480" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="274" y="468" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#3FB98C">GET /text</text>
<path d="M 574 480 L 640 480 L 640 440 L 690 440" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 574 480 L 640 480 L 640 524 L 690 524" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 452 506 L 452 566 L 128 566 L 128 510" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)" stroke-dasharray="6 5"/>
<text x="290" y="556" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">합쳐진 평문 응답 하나</text>
<rect x="24" y="616" width="952" height="56" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="44" y="640" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">그래서 Quote·Quiz 는 내부·외부 양쪽으로 노출돼야 한다</text>
<text x="44" y="660" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">평문 모드는 클러스터 안에서, HTML 모드는 바깥에서 같은 서비스에 닿는다. 노출을 한쪽만 열면 다른 모드가 끊긴다.</text>
<line x1="12" y1="688" x2="952" y2="688" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="710" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="700" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="710" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">바깥에서 직접 부르는 길</text>
<rect x="313" y="700" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="335" y="710" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">안에서 대신 부르는 길</text>
<rect x="513" y="700" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="535" y="710" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">두 모드가 함께 요구하는 것</text>
</svg>
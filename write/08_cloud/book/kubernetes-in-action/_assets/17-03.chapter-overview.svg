<svg viewBox="0 0 820 540" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>17-03 전체 지도 — 로컬 daemon에 닿는 세 갈래</title>
  <desc>일반 Service가 무작위 파드로 보내기 때문에 로컬 daemon에 닿지 못한다는 문제에서 출발해, hostPort와 hostNetwork는 노드 IP를 거치고 Local Service는 Service 이름만으로 닿는 세 갈래를 나란히 놓은 그림입니다. 세 방법 사이에 화살표가 없어 병렬 대안이며, 맨 아래 판정 줄기가 Local Service를 기본으로 삼고 나머지는 클러스터 밖 접근이 필요할 때로 한정합니다. hostNetwork에는 노드 포트를 임의로 열 수 있다는 위험 표시가, Local Service에는 에이전트 없는 노드에서 엔드포인트가 0이 된다는 주의 표시가 붙어 있습니다.</desc>
  <rect width="820" height="540" fill="#0d0d0d"/>

  <text x="40" y="40" fill="#e8e4df" font-size="15" font-weight="700">같은 노드로만 보내려면</text>

  <rect x="40" y="62" width="740" height="52" rx="4" fill="#e8e4df"/>
  <text x="60" y="88" fill="#0d0d0d" font-size="14" font-weight="700">문제 · 일반 Service는 무작위</text>
  <text x="740" y="88" text-anchor="end" fill="#3a3632" font-size="11">진입</text>
  <text x="60" y="106" fill="#3a3632" font-size="12">다른 노드 파드로 갈 수 있다</text>

  <line x1="40" y1="130" x2="780" y2="130" stroke="#b8b3ad" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="40" y="152" fill="#b8b3ad" font-size="12">아래 셋은 병렬 대안이다</text>

  <line x1="40" y1="166" x2="40" y2="404" stroke="#b8b3ad" stroke-width="2"/>

  <rect x="60" y="166" width="720" height="66" rx="4" fill="#e8e4df"/>
  <text x="80" y="192" fill="#0d0d0d" font-size="14" font-weight="700">hostPort</text>
  <text x="740" y="192" text-anchor="end" fill="#3a3632" font-size="11">§1</text>
  <text x="80" y="216" fill="#3a3632" font-size="12">노드 포트를 컨테이너로</text>
  <text x="320" y="216" fill="#3a3632" font-size="12">노드 IP는 Downward API</text>

  <rect x="60" y="246" width="720" height="66" rx="4" fill="#e8e4df"/>
  <text x="80" y="272" fill="#0d0d0d" font-size="14" font-weight="700">hostNetwork</text>
  <text x="740" y="272" text-anchor="end" fill="#3a3632" font-size="11">§2</text>
  <text x="80" y="296" fill="#3a3632" font-size="12">노드 포트에 직접 바인딩</text>
  <rect x="380" y="282" width="250" height="22" rx="3" fill="#f2d4d4"/>
  <text x="392" y="297" fill="#7a1f1f" font-size="11.5" font-weight="700">위험 · 임의 포트 바인딩 가능</text>

  <rect x="60" y="326" width="720" height="78" rx="4" fill="#e8e4df"/>
  <text x="80" y="352" fill="#0d0d0d" font-size="14" font-weight="700">Local Service</text>
  <text x="740" y="352" text-anchor="end" fill="#3a3632" font-size="11">§3</text>
  <text x="80" y="376" fill="#3a3632" font-size="12">Service 이름만 알면 된다</text>
  <rect x="330" y="362" width="260" height="22" rx="3" fill="rgb(212,168,83)"/>
  <text x="342" y="377" fill="#0d0d0d" font-size="11.5" font-weight="700">주의 · 없는 노드는 엔드포인트 0</text>
  <text x="80" y="395" fill="#3a3632" font-size="12">kube-proxy가 걸러 준다</text>

  <rect x="40" y="428" width="740" height="80" rx="4" fill="#e8e4df"/>
  <text x="60" y="454" fill="#0d0d0d" font-size="14" font-weight="700">기본은 Local Service</text>
  <text x="740" y="454" text-anchor="end" fill="#3a3632" font-size="11">§4</text>
  <text x="60" y="478" fill="#3a3632" font-size="12">노드 네트워크 무영향</text>
  <text x="300" y="478" fill="#3a3632" font-size="12">특수 권한 불필요</text>
  <text x="60" y="497" fill="#3a3632" font-size="12">나머지 둘은 클러스터 밖 접근용</text>
</svg>

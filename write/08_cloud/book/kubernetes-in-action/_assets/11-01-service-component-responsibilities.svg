<svg viewBox="0 0 1200 620" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>서비스 트래픽을 위해 각 컴포넌트가 미리 준비하는 것과 실제 요청의 데이터 경로</title>
  <desc>준비 단계에서 스케줄러는 노드를 결정하고 CNI는 파드 IP를 발급하며 EndpointSlice 컨트롤러는 ready 파드 IP 명단을 갱신하고 kube-proxy는 각 노드의 데이터패스 규칙을 준비한다. 실제 요청은 이 컴포넌트들을 차례로 통과하지 않고, 미리 준비된 규칙을 따라 노드 커널에서 대상 파드로 전달된다.</desc>
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub { font-size: 11px; fill: rgb(138,133,128); }
      .zone { font-size: 13px; font-weight: 800; fill: rgb(212,168,83); }
      .zoneNote { font-size: 10.5px; fill: rgb(138,133,128); }
      .cardTitle { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .cardBody { font-size: 11px; font-weight: 650; fill: #e8e4df; }
      .cardMuted { font-size: 10px; fill: rgb(138,133,128); }
      .output { font-size: 10.5px; font-weight: 750; fill: #0d0d0d; }
      .pathTitle { font-size: 12.5px; font-weight: 800; fill: #e8e4df; }
      .pathBody { font-size: 10.8px; fill: rgb(138,133,128); }
      .pathStrong { font-size: 11px; font-weight: 750; fill: #e8e4df; }
      .foot { font-size: 11px; fill: #e8e4df; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; }
    </style>
    <marker id="gold-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(102,187,106)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#0d0d0d"/>
  <text x="28" y="32" class="title">서비스 트래픽은 준비된 규칙을 따라 파드에 도달합니다</text>
  <text x="28" y="53" class="sub">컴포넌트의 일은 먼저 주소·엔드포인트·노드 규칙을 만드는 것, 요청의 일은 그 결과를 따라 데이터패스에서 전달되는 것입니다.</text>

  <!-- preparation phase -->
  <rect x="28" y="76" width="1144" height="252" rx="13" fill="rgb(24,28,32)" stroke="rgb(212,168,83)" stroke-width="1.4"/>
  <text x="48" y="103" class="zone">① 준비 단계 · control plane</text>
  <text x="1148" y="103" class="zoneNote" text-anchor="end">상태를 관찰하고 각자 결과를 준비</text>

  <!-- fan-out hint -->
  <rect x="470" y="112" width="260" height="29" rx="7" fill="rgb(36,39,43)" stroke="rgb(138,133,128)" stroke-width="1"/>
  <text x="600" y="131" class="cardMuted" text-anchor="middle">클러스터 상태 · 서비스 의도</text>
  <line x1="600" y1="141" x2="174" y2="151" stroke="rgb(138,133,128)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="600" y1="141" x2="458" y2="151" stroke="rgb(138,133,128)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="600" y1="141" x2="742" y2="151" stroke="rgb(138,133,128)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="600" y1="141" x2="1026" y2="151" stroke="rgb(138,133,128)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- scheduler -->
  <rect x="48" y="151" width="252" height="143" rx="9" fill="rgb(212,168,83)"/>
  <text x="68" y="177" class="cardTitle">스케줄러</text>
  <text x="68" y="198" class="cardBody" style="fill:#0d0d0d">노드를 결정</text>
  <text x="68" y="221" class="cardMuted" style="fill:rgb(54,45,31)">준비 결과</text>
  <rect x="68" y="231" width="211" height="39" rx="6" fill="rgb(244,224,174)"/>
  <text x="78" y="248" class="output">Pod → Node A</text>
  <text x="78" y="263" class="cardMuted" style="fill:rgb(75,64,45)">배치할 워커 노드 확정</text>

  <!-- CNI -->
  <rect x="332" y="151" width="252" height="143" rx="9" fill="rgb(91,155,213)"/>
  <text x="352" y="177" class="cardTitle">CNI 플러그인</text>
  <text x="352" y="198" class="cardBody">Pod IP를 발급</text>
  <text x="352" y="221" class="cardMuted" style="fill:rgb(224,235,245)">준비 결과</text>
  <rect x="352" y="231" width="211" height="39" rx="6" fill="rgb(220,234,247)"/>
  <text x="362" y="248" class="output">Pod IP 10.244.1.7</text>
  <text x="362" y="263" class="cardMuted" style="fill:rgb(49,69,87)">파드 네트워크 연결</text>

  <!-- EndpointSlice controller -->
  <rect x="616" y="151" width="252" height="143" rx="9" fill="rgb(150,130,220)"/>
  <text x="636" y="176" class="cardTitle" style="font-size:12px">EndpointSlice 컨트롤러</text>
  <text x="636" y="198" class="cardBody">ready Pod IP 명단을 갱신</text>
  <text x="636" y="221" class="cardMuted" style="fill:rgb(236,232,249)">준비 결과</text>
  <rect x="636" y="231" width="211" height="39" rx="6" fill="rgb(227,220,247)"/>
  <text x="646" y="248" class="output">ready endpoints</text>
  <text x="646" y="263" class="cardMuted" style="fill:rgb(70,59,99)">서비스가 보낼 대상 목록</text>

  <!-- kube-proxy -->
  <rect x="900" y="151" width="252" height="143" rx="9" fill="rgb(102,187,106)"/>
  <text x="920" y="177" class="cardTitle">kube-proxy</text>
  <text x="920" y="198" class="cardBody" style="fill:#0d0d0d">각 노드 데이터패스 규칙 준비</text>
  <text x="920" y="221" class="cardMuted" style="fill:rgb(223,244,224)">준비 결과</text>
  <rect x="920" y="231" width="211" height="39" rx="6" fill="rgb(207,239,209)"/>
  <text x="930" y="248" class="output">VIP → ready Pod</text>
  <text x="930" y="263" class="cardMuted" style="fill:rgb(44,79,46)">Service VIP → ready Pod 규칙</text>

  <rect x="48" y="305" width="1104" height="14" rx="7" fill="rgb(35,34,31)"/>
  <text x="600" y="316" class="zoneNote" text-anchor="middle">네 컴포넌트는 순차 파이프라인이 아니라, 준비된 결과를 데이터패스에 남깁니다.</text>

  <!-- request phase -->
  <rect x="28" y="348" width="1144" height="232" rx="13" fill="rgb(18,22,26)" stroke="rgb(138,133,128)" stroke-width="1.3"/>
  <text x="48" y="377" class="zone">② 요청 단계 · data path</text>
  <text x="1148" y="377" class="zoneNote" text-anchor="end">실제 패킷은 준비된 규칙을 따라 전달</text>

  <!-- kube-proxy rule handoff into data path -->
  <path d="M1026 294 L1026 402 L790 402" fill="none" stroke="rgb(102,187,106)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#green-arrow)"/>
  <text x="1040" y="398" class="cardMuted" style="fill:rgb(102,187,106)">미리 설치된 규칙</text>

  <!-- client pod -->
  <rect x="50" y="428" width="188" height="87" rx="9" fill="rgb(91,155,213)"/>
  <text x="144" y="455" class="pathTitle" text-anchor="middle">클라이언트 Pod</text>
  <text x="144" y="477" class="mono" text-anchor="middle" style="fill:#e8e4df">dst = Service VIP</text>
  <text x="144" y="496" class="pathBody" text-anchor="middle" style="fill:#dceaf5">요청 생성</text>

  <!-- service VIP -->
  <rect x="285" y="428" width="194" height="87" rx="9" fill="rgb(212,168,83)"/>
  <text x="382" y="455" class="pathTitle" text-anchor="middle" style="fill:#0d0d0d">Service VIP</text>
  <text x="382" y="477" class="mono" text-anchor="middle" style="fill:#0d0d0d">10.96.74.151:80</text>
  <text x="382" y="496" class="pathBody" text-anchor="middle" style="fill:rgb(54,45,31)">가상 목적지</text>

  <!-- node datapath -->
  <rect x="526" y="410" width="270" height="123" rx="10" fill="rgb(36,43,39)" stroke="rgb(102,187,106)" stroke-width="1.5"/>
  <text x="546" y="438" class="pathTitle" style="fill:rgb(102,187,106)">노드 데이터패스</text>
  <text x="546" y="460" class="pathStrong">준비된 규칙을 조회해 전달</text>
  <text x="546" y="482" class="pathBody">DNAT · 포워딩 · 로드밸런싱</text>
  <text x="546" y="505" class="pathBody">구현 상세는 01-02 정본에서 설명</text>

  <!-- target pod -->
  <rect x="844" y="428" width="300" height="87" rx="9" fill="rgb(102,187,106)"/>
  <text x="994" y="455" class="pathTitle" text-anchor="middle" style="fill:#0d0d0d">선택된 대상 Pod</text>
  <text x="994" y="477" class="mono" text-anchor="middle" style="fill:#0d0d0d">10.244.2.9:8080</text>
  <text x="994" y="496" class="pathBody" text-anchor="middle" style="fill:rgb(42,77,44)">ready endpoint로 도달</text>

  <!-- actual packet path -->
  <line x1="238" y1="471" x2="279" y2="471" stroke="rgb(212,168,83)" stroke-width="2.4" marker-end="url(#gold-arrow)"/>
  <line x1="479" y1="471" x2="520" y2="471" stroke="rgb(212,168,83)" stroke-width="2.4" marker-end="url(#gold-arrow)"/>
  <line x1="796" y1="471" x2="838" y2="471" stroke="rgb(102,187,106)" stroke-width="2.4" marker-end="url(#green-arrow)"/>
  <text x="258" y="459" class="cardMuted" text-anchor="middle">요청</text>
  <text x="500" y="459" class="cardMuted" text-anchor="middle">규칙 적용</text>
  <text x="817" y="459" class="cardMuted" text-anchor="middle" style="fill:rgb(102,187,106)">전달</text>

  <text x="48" y="553" class="foot"><tspan fill="rgb(212,168,83)" font-weight="800">핵심</tspan><tspan> — 요청은 스케줄러 → CNI → EndpointSlice 컨트롤러 → kube-proxy를 차례로 통과하지 않습니다.</tspan></text>
  <text x="48" y="570" class="foot" fill="rgb(138,133,128)">이들이 미리 만든 노드 배치·Pod IP·ready 목록·데이터패스 규칙을 따라, 요청은 데이터패스에서 곧바로 대상 Pod로 갑니다.</text>
</svg>

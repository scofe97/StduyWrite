<svg viewBox="0 0 880 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>hostPath 세 케이스 — 노드 노출·자동 생성·검사 실패</title>
  <desc>hostPath를 세 형태로 돌린 실측. path:/를 마운트한 node-explorer는 노드 루트가 통째로 보이고, type:DirectoryOrCreate는 없는 디렉터리를 755 root로 자동 생성해 기동하며, type:Directory는 경로가 없으면 FailedMount로 기동에 실패한다.</desc>

  <rect x="0" y="0" width="880" height="400" fill="#0d0d0d"/>
  <text x="30" y="38" fill="rgb(212,168,83)" font-size="16" font-weight="700">hostPath는 type이 결과를 가른다 (kind v1.35 실측)</text>

  <!-- ① node-explorer (위험=빨강 테두리) -->
  <rect x="30" y="66" width="265" height="290" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="45" y="94" fill="#f44336" font-size="14" font-weight="700">① node-explorer</text>
  <rect x="45" y="108" width="235" height="46" rx="4" fill="#f2d4d4" stroke="rgb(42,37,32)"/>
  <text x="55" y="127" style="fill:#7a1f1f" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">path: /</text>
  <text x="55" y="145" style="fill:#7a1f1f" font-size="10.5">노드 루트를 /host에 마운트</text>
  <text x="45" y="180" fill="#e8e4df" font-size="11.5">ls /host →</text>
  <rect x="45" y="190" width="235" height="60" rx="4" fill="#f5edda" stroke="rgb(42,37,32)"/>
  <text x="55" y="209" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="9.5">bin etc home var …</text>
  <text x="55" y="226" style="fill:#7a1f1f" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="700">kind</text>
  <text x="98" y="226" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="9.5"> ← 노드 증거</text>
  <text x="55" y="243" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="9.5">var/lib/kubelet/pods/…</text>
  <text x="45" y="278" fill="#e8e4df" font-size="11">root 컨테이너 + 노드 루트</text>
  <text x="45" y="296" fill="#e8e4df" font-size="11">= 다른 파드 데이터까지 접근</text>
  <text x="155" y="335" style="fill:#f44336" font-size="12" font-weight="700" text-anchor="middle">위험 — 노드 장악 가능</text>

  <!-- ② DirectoryOrCreate (성공=초록) -->
  <rect x="308" y="66" width="265" height="290" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="323" y="94" fill="#66bb6a" font-size="14" font-weight="700">② DirectoryOrCreate</text>
  <rect x="323" y="108" width="235" height="46" rx="4" fill="#cdeccf" stroke="rgb(42,37,32)"/>
  <text x="333" y="127" style="fill:#14521d" font-family="'JetBrains Mono',monospace" font-size="10.5" font-weight="700">type: DirectoryOrCreate</text>
  <text x="333" y="145" style="fill:#14521d" font-size="10.5">path: /tmp/hostpath-demo</text>
  <text x="323" y="180" fill="#e8e4df" font-size="11.5">경로가 없으면 →</text>
  <rect x="323" y="190" width="235" height="60" rx="4" fill="#cdeccf" stroke="rgb(42,37,32)"/>
  <text x="333" y="212" style="fill:#14521d" font-size="11" font-weight="700">빈 디렉터리 자동 생성</text>
  <text x="333" y="236" style="fill:#14521d" font-family="'JetBrains Mono',monospace" font-size="10">drwxr-xr-x root root (755)</text>
  <text x="323" y="278" fill="#e8e4df" font-size="11">검사 통과 → 정상 기동</text>
  <text x="440" y="335" style="fill:#66bb6a" font-size="13" font-weight="700" text-anchor="middle">Running</text>

  <!-- ③ Directory (실패=주황/앰버) -->
  <rect x="586" y="66" width="265" height="290" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="601" y="94" fill="rgb(212,168,83)" font-size="14" font-weight="700">③ Directory</text>
  <rect x="601" y="108" width="235" height="46" rx="4" fill="#f5edda" stroke="rgb(42,37,32)"/>
  <text x="611" y="127" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700">type: Directory</text>
  <text x="611" y="145" style="fill:#3a2f10" font-size="10.5">path: 존재하지 않는 경로</text>
  <text x="601" y="180" fill="#e8e4df" font-size="11.5">경로가 없으면 →</text>
  <rect x="601" y="190" width="235" height="60" rx="4" fill="#f5edda" stroke="rgb(42,37,32)"/>
  <text x="611" y="209" style="fill:#3a2f10" font-size="11" font-weight="700">만들지 않고 실패</text>
  <text x="611" y="228" style="fill:#7a1f1f" font-family="'JetBrains Mono',monospace" font-size="9.5">FailedMount</text>
  <text x="611" y="244" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="9.5">type check failed</text>
  <text x="601" y="278" fill="#e8e4df" font-size="11">0/1 ContainerCreating에 멈춤</text>
  <text x="718" y="335" style="fill:rgb(212,168,83)" font-size="13" font-weight="700" text-anchor="middle">기동 실패</text>

  <text x="30" y="384" fill="#e8e4df" font-size="11.5">type는 "조용한 오작동" 대신 시작 시점에 명확히 실패시키는 안전장치다 — 실패 원인은 events에 드러난다.</text>
</svg>

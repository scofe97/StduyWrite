<svg viewBox="0 0 1120 540" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>인증서와 host가 어긋났을 때 — 클러스터 안에는 대조하는 주체가 없습니다</title>
  <desc>인증서에 담긴 이름과 Ingress의 tls.hosts가 어긋난 요청이 어느 컴포넌트를 지나는지 따라간다. 위쪽 줄은 클러스터 안의 경로로, 내 노트북의 kubectl 이 API 서버로 apply 하고 컨트롤러가 프록시 설정을 만들어 프록시 파드에 인증서를 실어 보내기까지 네 컴포넌트가 이어지며 네 단계 모두 초록으로 통과 표시가 붙는다. API 서버는 저장만 하고 검증하지 않으며 컨트롤러도 에러를 내지 않고 프록시도 받은 인증서를 그대로 내밀기 때문이다. 클러스터 경계 아래에는 브라우저가 따로 서 있고 HTTPS 로 프록시에 접속하는 순간 처음으로 분홍색 거부가 나타나며 ERR_CERT_COMMON_NAME_INVALID 가 뜬다. 두 줄을 가르는 것은 검증 주체의 위치이며, 대조하는 쪽이 클러스터 밖 브라우저에 있어서 안쪽 어디에서도 걸리지 않는다. 오른쪽 아래에는 와일드카드 인증서의 요소 단위 규칙을 따로 두어, 별표 점 example.com 이 api.example.com 은 덮지만 foo.api.example.com 은 덮지 못함을 초록과 분홍으로 대비한다.</desc>
  <defs>
    <style>
      .h1   { font-size: 23px; font-weight: 800; fill: #e8e4df; }
      .sub  { font-size: 14px; fill: rgb(168,163,158); }
      .lyr  { font-size: 12.5px; font-weight: 800; fill: rgb(168,163,158); }
      .comp { font-size: 14.5px; font-weight: 700; fill: #e8e4df; }
      .note { font-size: 12px; fill: rgb(168,163,158); }
      .okl  { font-size: 13px; font-weight: 700; fill: rgb(102,187,106); }
      .badl { font-size: 13px; font-weight: 700; fill: rgb(240,150,190); }
      .mono { font-size: 12px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .monod{ font-size: 12.5px; font-weight: 800; fill: rgb(240,150,190); font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .step { font-size: 12px; font-weight: 800; fill: #0d0d0d; }
    </style>
    <marker id="cmOk" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(102,187,106)"/>
    </marker>
    <marker id="cmBad" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(240,150,190)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="540" fill="#0d0d0d"/>

  <text x="30" y="40" class="h1">조용히 지나가고, 접속할 때 터집니다</text>
  <text x="30" y="64" class="monod">인증서 CN/SAN = *.example.com  ·  tls.hosts = kiada.other.com  ← 서로 다릅니다</text>

  <!-- ══ 클러스터 안 ══ -->
  <rect x="30" y="86" width="1060" height="180" rx="10" fill="rgba(212,168,83,0.08)" stroke="rgb(42,37,32)" stroke-dasharray="6 4"/>
  <text x="52" y="112" class="lyr">클러스터 안 — 아무도 인증서와 host 를 대조하지 않습니다</text>

  <rect x="52" y="128" width="216" height="60" rx="8" fill="rgb(22,22,22)" stroke="rgb(102,187,106)" stroke-width="1.5"/>
  <text x="160" y="152" class="comp" text-anchor="middle">내 노트북</text>
  <text x="160" y="174" class="note" text-anchor="middle">kubectl</text>

  <rect x="316" y="128" width="216" height="60" rx="8" fill="rgb(22,22,22)" stroke="rgb(102,187,106)" stroke-width="1.5"/>
  <text x="424" y="152" class="comp" text-anchor="middle">API 서버</text>
  <text x="424" y="174" class="note" text-anchor="middle">저장만 합니다</text>

  <rect x="580" y="128" width="216" height="60" rx="8" fill="rgb(22,22,22)" stroke="rgb(102,187,106)" stroke-width="1.5"/>
  <text x="688" y="152" class="comp" text-anchor="middle">컨트롤러</text>
  <text x="688" y="174" class="note" text-anchor="middle">설정을 만듭니다</text>

  <rect x="844" y="128" width="216" height="60" rx="8" fill="rgb(22,22,22)" stroke="rgb(102,187,106)" stroke-width="1.5"/>
  <text x="952" y="152" class="comp" text-anchor="middle">프록시 파드</text>
  <text x="952" y="174" class="note" text-anchor="middle">인증서가 실립니다</text>

  <line x1="274" y1="158" x2="308" y2="158" stroke="rgb(102,187,106)" stroke-width="2.4" marker-end="url(#cmOk)"/>
  <line x1="538" y1="158" x2="572" y2="158" stroke="rgb(102,187,106)" stroke-width="2.4" marker-end="url(#cmOk)"/>
  <line x1="802" y1="158" x2="836" y2="158" stroke="rgb(102,187,106)" stroke-width="2.4" marker-end="url(#cmOk)"/>

  <rect x="52" y="200" width="216" height="24" rx="5" fill="rgb(102,187,106)"/>
  <text x="160" y="217" class="step" text-anchor="middle">① apply — 성공</text>
  <rect x="316" y="200" width="216" height="24" rx="5" fill="rgb(102,187,106)"/>
  <text x="424" y="217" class="step" text-anchor="middle">② get ingress — 정상 표시</text>
  <rect x="580" y="200" width="216" height="24" rx="5" fill="rgb(102,187,106)"/>
  <text x="688" y="217" class="step" text-anchor="middle">③ 로그 — 에러 없음</text>
  <rect x="844" y="200" width="216" height="24" rx="5" fill="rgb(102,187,106)"/>
  <text x="952" y="217" class="step" text-anchor="middle">④ 설정 반영 — 정상</text>

  <text x="52" y="250" class="okl">배포 파이프라인은 전부 초록불입니다</text>

  <!-- ══ 경계 ══ -->
  <line x1="30" y1="288" x2="1090" y2="288" stroke="rgb(91,155,213)" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="1090" y="282" class="lyr" text-anchor="end">클러스터 경계</text>

  <!-- ══ 클러스터 밖 ══ -->
  <text x="52" y="322" class="lyr">클러스터 밖 — 대조하는 주체는 여기 있습니다</text>

  <rect x="52" y="336" width="216" height="60" rx="8" fill="rgb(28,24,26)" stroke="rgb(240,150,190)" stroke-width="1.5"/>
  <text x="160" y="360" class="comp" text-anchor="middle">브라우저</text>
  <text x="160" y="382" class="note" text-anchor="middle">CN·SAN 을 대조합니다</text>

  <line x1="274" y1="366" x2="836" y2="366" stroke="rgb(240,150,190)" stroke-width="2.4" marker-end="url(#cmBad)"/>
  <text x="555" y="356" class="badl" text-anchor="middle">⑤ HTTPS 접속</text>

  <rect x="844" y="336" width="216" height="60" rx="8" fill="rgb(28,24,26)" stroke="rgb(240,150,190)" stroke-width="1.5"/>
  <text x="952" y="360" class="comp" text-anchor="middle">프록시 파드</text>
  <text x="952" y="382" class="note" text-anchor="middle">그냥 내밉니다</text>

  <rect x="52" y="416" width="470" height="28" rx="6" fill="rgb(240,150,190)"/>
  <text x="66" y="436" class="mono">ERR_CERT_COMMON_NAME_INVALID</text>
  <text x="330" y="436" class="step">← 여기서 처음 터집니다</text>

  <text x="52" y="472" class="badl">사용자만 막힙니다</text>

  <!-- ══ 요소 단위 규칙 ══ -->
  <rect x="580" y="416" width="480" height="100" rx="9" fill="rgb(20,20,20)" stroke="rgb(91,155,213)" stroke-width="1.5"/>
  <text x="600" y="440" class="lyr">인증서 *.example.com 이 덮는 범위</text>

  <rect x="600" y="452" width="440" height="26" rx="5" fill="rgb(102,187,106)"/>
  <text x="612" y="471" class="mono">✓ api.example.com</text>
  <text x="866" y="471" class="step">한 요소를 덮습니다</text>

  <rect x="600" y="484" width="440" height="26" rx="5" fill="rgb(240,150,190)"/>
  <text x="612" y="503" class="mono">✗ foo.api.example.com</text>
  <text x="858" y="503" class="step">두 요소는 못 덮습니다</text>
</svg>

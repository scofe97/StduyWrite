<svg viewBox="0 0 800 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>파일 트리에 파일시스템을 마운트하는 개념</title>
  <desc>운영체제 파일 트리의 특정 위치(/var/data)에 별도 저장 볼륨의 파일시스템이 마운트된다. 마운트 후 그 위치로 가면 볼륨의 내용이 보인다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .dir   { font-size: 13px; font-weight: 700; fill: #e8e4df; font-family: 'JetBrains Mono', monospace; }
      .mnt   { font-size: 13px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .note  { font-size: 12px; font-weight: 700; fill: rgb(212,168,83); }
      .cyl   { font-size: 13px; font-weight: 700; fill: #0d0d0d; }
    </style>
    <marker id="m91" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="340" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">마운트 — 파일 트리의 한 위치에 볼륨을 붙인다</text>
  <text x="24" y="50" class="sub">마운트 후 그 위치로 가면 볼륨의 파일시스템 내용이 그대로 보인다</text>

  <!-- file tree -->
  <line x1="56" y1="80" x2="56" y2="300" stroke="rgb(90,86,80)" stroke-width="1.5"/>
  <text x="40" y="90" class="dir">/</text>
  <g>
    <text x="80" y="118" class="dir">bin</text>
    <text x="80" y="146" class="dir">dev</text>
    <text x="80" y="174" class="dir">etc</text>
    <text x="80" y="202" class="dir">home</text>
    <text x="80" y="230" class="dir">usr</text>
    <text x="80" y="258" class="dir">var</text>
    <text x="80" y="300" class="dir">tmp</text>
  </g>
  <!-- var children -->
  <line x1="98" y1="266" x2="98" y2="290" stroke="rgb(90,86,80)" stroke-width="1.5"/>
  <rect x="118" y="270" width="120" height="24" rx="4" fill="rgb(146,196,235)"/>
  <text x="128" y="287" class="mnt">data</text>
  <text x="118" y="316" class="dir" font-size="11">run</text>

  <!-- filesystem cylinder -->
  <g transform="translate(520,190)">
    <ellipse cx="90" cy="0" rx="90" ry="20" fill="rgb(146,196,235)"/>
    <rect x="0" y="0" width="180" height="70" fill="rgb(146,196,235)"/>
    <ellipse cx="90" cy="70" rx="90" ry="20" fill="rgb(120,175,220)"/>
    <text x="90" y="40" class="cyl" text-anchor="middle">Filesystem</text>
  </g>

  <!-- mount arrow -->
  <path d="M510,225 L245,282" fill="none" stroke="rgb(212,168,83)" stroke-width="2.5" marker-end="url(#m91)"/>

  <!-- annotation -->
  <path d="M470,110 C420,150 350,220 245,275" fill="none" stroke="rgb(212,168,83)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#m91)"/>
  <text x="470" y="100" class="note">파일시스템이 파일 트리의</text>
  <text x="470" y="118" class="note">특정 위치에 마운트된다</text>
</svg>

<svg viewBox="0 0 960 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Scheduled 성공 후 FailedMount — 스케줄러와 kubelet의 역할 분리</title>
  <desc>스케줄러는 PV의 nodeAffinity 선언만 보고 노드를 골라 Scheduled를 띄우고, 경로가 실재하는지는 그 노드의 kubelet이 마운트를 시도할 때 드러나 FailedMount가 난다. 운영자가 경로를 만들면 Running이 된다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .lane  { font-size: 13px; font-weight: 800; fill: rgb(212,168,83); }
      .lbl   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .lbls  { font-size: 10px; fill: #0d0d0d; }
      .mono  { font-size: 10px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .ok    { font-size: 11px; font-weight: 800; fill: #66bb6a; }
      .no    { font-size: 11px; font-weight: 800; fill: #f44336; }
      .note  { font-size: 11px; font-weight: 700; fill: rgb(212,168,83); }
    </style>
    <marker id="sm10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(91,155,213)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Scheduled 성공, FailedMount 실패 — 스케줄러와 kubelet 의 역할 분리</text>
  <text x="24" y="50" class="sub">스케줄러는 선언(nodeAffinity)만 보고 노드를 고르고, 경로가 실재하는지는 그 노드의 kubelet 이 마운트할 때 안다</text>

  <!-- lane 1: control plane -->
  <rect x="24" y="70" width="912" height="130" rx="10" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="40" y="94" class="lane">컨트롤 플레인 — 선언의 세계</text>

  <rect x="40" y="110" width="180" height="60" rx="8" fill="rgb(245,225,110)"/>
  <text x="130" y="135" class="lbl" text-anchor="middle">파드 생성</text>
  <text x="130" y="152" class="lbls" text-anchor="middle">(quiz-data-local PVC 참조)</text>

  <path d="M220,140 L296,140" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#sm10)"/>

  <rect x="300" y="110" width="240" height="60" rx="8" fill="rgb(200,180,235)"/>
  <text x="420" y="135" class="lbl" text-anchor="middle">스케줄러 — PV 의 nodeAffinity 확인</text>
  <text x="420" y="152" class="lbls" text-anchor="middle">선언만 보고 노드를 고름 (경로 실재는 모름)</text>

  <path d="M540,140 L616,140" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#sm10)"/>

  <rect x="620" y="110" width="300" height="60" rx="8" fill="rgb(180,225,180)"/>
  <text x="770" y="135" class="lbl" text-anchor="middle">이벤트 Scheduled</text>
  <text x="770" y="152" class="mono" text-anchor="middle">assigned ... to k8s-lab-worker</text>
  <text x="905" y="98" class="ok" text-anchor="end">여기까지 성공</text>

  <!-- handoff arrow -->
  <path d="M770,170 L770,238 L240,238 L240,262" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#sm10)"/>
  <text x="500" y="230" class="note" text-anchor="middle">이제부터는 그 노드 kubelet 의 일</text>

  <!-- lane 2: node -->
  <rect x="24" y="266" width="912" height="130" rx="10" fill="#0d0d0d" stroke="rgb(91,155,213)" stroke-width="1.5"/>
  <text x="40" y="290" class="lane">노드 k8s-lab-worker — 실재의 세계</text>

  <rect x="40" y="306" width="200" height="60" rx="8" fill="rgb(146,196,235)"/>
  <text x="140" y="331" class="lbl" text-anchor="middle">kubelet — 마운트 시도</text>
  <text x="140" y="348" class="lbls" text-anchor="middle">local 볼륨 경로를 이때 확인</text>

  <path d="M240,336 L316,336" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#sm10)"/>

  <rect x="320" y="306" width="280" height="60" rx="8" fill="rgb(242,212,212)"/>
  <text x="460" y="328" class="lbl" text-anchor="middle">FailedMount</text>
  <text x="460" y="346" class="mono" text-anchor="middle">"/tmp/my-disk" does not exist</text>
  <text x="460" y="382" class="no" text-anchor="middle">local 볼륨은 경로를 만들어 주지 않음</text>

  <path d="M600,336 L676,336" fill="none" stroke="rgb(91,155,213)" stroke-width="2.5" marker-end="url(#sm10)"/>

  <rect x="680" y="306" width="240" height="60" rx="8" fill="rgb(180,225,180)"/>
  <text x="800" y="328" class="lbl" text-anchor="middle">운영자가 경로 생성 → Running</text>
  <text x="800" y="346" class="mono" text-anchor="middle">docker exec ... mkdir -p /tmp/my-disk</text>

  <text x="24" y="428" class="note">Scheduled 는 볼륨 준비 완료가 아님 — 준비는 운영자 책임, 진단은 kubectl describe pod 의 Events 에서 시작</text>
</svg>

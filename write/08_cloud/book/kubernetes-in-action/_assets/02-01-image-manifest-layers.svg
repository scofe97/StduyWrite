<svg viewBox="0 0 960 500" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>이미지는 레이어 목록(manifest)일 뿐 — 레이어는 해시로 한 벌만 저장된다</title>
  <desc>이미지는 레이어 실물을 담은 덩어리가 아니라, 어떤 레이어 해시들을 쌓을지 적은 목록(manifest)이다. 레이어 실물은 해시로 식별되는 저장소에 딱 한 벌씩 있고, nginx:alpine과 redis:alpine의 manifest가 같은 alpine 베이스 레이어(91d5cf66)를 함께 가리킨다. 그래서 저장도 전송(pull)도 레이어 단위로 이뤄지고, 이미 있는 레이어는 Already exists로 건너뛴다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .zlabel{ font-size: 12px; font-weight: 800; fill: rgb(212,168,83); }
      .mname { font-size: 12.5px; font-weight: 800; fill: #0d0d0d; }
      .mrow  { font-size: 9.5px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .store { font-size: 11px; font-weight: 800; fill: #0d0d0d; }
      .hash  { font-size: 9.5px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .sz    { font-size: 9px; font-weight: 700; fill: #1a1a1a; font-family: 'JetBrains Mono', monospace; }
      .note  { font-size: 10.5px; fill: #e8e4df; }
      .cnt   { font-size: 11px; font-weight: 800; fill: rgb(212,168,83); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="500" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">이미지 = 레이어 목록(manifest) · 레이어 = 해시로 한 벌만 저장</text>
  <text x="24" y="50" class="sub">이미지는 레이어 실물을 담지 않습니다. "어떤 해시의 레이어를 쌓을지" 적은 목록일 뿐이고, 레이어 실물은 해시 저장소에 한 벌씩 있습니다.</text>

  <!-- ===== 위: 두 이미지 manifest ===== -->
  <text x="24" y="84" class="zlabel">이미지 manifest (레이어 해시들의 목록)</text>

  <!-- nginx manifest -->
  <rect x="40" y="96" width="300" height="118" rx="9" fill="rgb(230,230,230)"/>
  <text x="56" y="118" class="mname">nginx:alpine</text>
  <rect x="56" y="128" width="268" height="22" rx="3" fill="#cfe8d0"/>
  <text x="64" y="143" class="mrow">↳ 91d5cf66…  (alpine 베이스)</text>
  <rect x="56" y="154" width="268" height="22" rx="3" fill="#e6e6e6"/>
  <text x="64" y="169" class="mrow">↳ a1b2… (nginx RUN 레이어)</text>
  <rect x="56" y="180" width="268" height="22" rx="3" fill="#e6e6e6"/>
  <text x="64" y="195" class="mrow">↳ c3d4… (nginx conf·CMD)</text>

  <!-- redis manifest -->
  <rect x="620" y="96" width="300" height="118" rx="9" fill="rgb(230,230,230)"/>
  <text x="636" y="118" class="mname">redis:alpine</text>
  <rect x="636" y="128" width="268" height="22" rx="3" fill="#cfe8d0"/>
  <text x="644" y="143" class="mrow">↳ 91d5cf66…  (alpine 베이스)</text>
  <rect x="636" y="154" width="268" height="22" rx="3" fill="#e6e6e6"/>
  <text x="644" y="169" class="mrow">↳ e5f6… (redis RUN 레이어)</text>
  <rect x="636" y="180" width="268" height="22" rx="3" fill="#e6e6e6"/>
  <text x="644" y="195" class="mrow">↳ 7a8b… (redis conf·ENV)</text>

  <!-- ===== 아래: 레이어 저장소 (해시로 식별, 한 벌씩) ===== -->
  <text x="24" y="264" class="zlabel">디스크의 레이어 저장소 (content-addressable · 해시 = 주소, 실물은 한 벌씩)</text>

  <!-- 공유 alpine 레이어 (초록, 한 벌) -->
  <rect x="360" y="280" width="240" height="60" rx="10" fill="rgb(102,187,106)"/>
  <text x="480" y="303" class="store" text-anchor="middle">alpine 베이스 레이어</text>
  <rect x="378" y="310" width="204" height="22" rx="4" fill="#e6f7e7"/>
  <text x="480" y="325" class="hash" text-anchor="middle">91d5cf66… · 8.66MB · 한 벌만</text>

  <!-- nginx 고유 레이어들 (왼쪽) -->
  <rect x="60" y="284" width="150" height="26" rx="5" fill="rgb(200,200,200)"/>
  <text x="135" y="301" class="sz" text-anchor="middle">a1b2… nginx RUN</text>
  <rect x="60" y="316" width="150" height="26" rx="5" fill="rgb(200,200,200)"/>
  <text x="135" y="333" class="sz" text-anchor="middle">c3d4… nginx conf</text>

  <!-- redis 고유 레이어들 (오른쪽) -->
  <rect x="750" y="284" width="150" height="26" rx="5" fill="rgb(200,200,200)"/>
  <text x="825" y="301" class="sz" text-anchor="middle">e5f6… redis RUN</text>
  <rect x="750" y="316" width="150" height="26" rx="5" fill="rgb(200,200,200)"/>
  <text x="825" y="333" class="sz" text-anchor="middle">7a8b… redis conf</text>

  <!-- 화살표: 두 manifest의 alpine 행 → 같은 실물 (앰버, 공유) -->
  <line x1="190" y1="150" x2="400" y2="278" stroke="rgb(212,168,83)" stroke-width="2.3" marker-end="url(#m)"/>
  <line x1="770" y1="150" x2="560" y2="278" stroke="rgb(212,168,83)" stroke-width="2.3" marker-end="url(#m)"/>
  <text x="480" y="360" class="cnt" text-anchor="middle">두 manifest가 같은 해시(91d5cf66)를 가리킴 → 실물은 딱 한 벌</text>

  <!-- nginx 고유 레이어 화살표 (회색) -->
  <line x1="180" y1="202" x2="150" y2="282" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#mg)"/>
  <!-- redis 고유 레이어 화살표 (회색) -->
  <line x1="780" y1="202" x2="810" y2="282" stroke="rgb(138,133,128)" stroke-width="1.4" marker-end="url(#mg)"/>

  <!-- 하단 설명: pull 연결 -->
  <rect x="60" y="384" width="840" height="96" rx="8" fill="rgb(24,28,32)" stroke="rgb(42,37,32)" stroke-width="1.2"/>
  <text x="80" y="408" class="note">• 이미지를 pull하면 manifest를 먼저 받고, 거기 적힌 레이어 해시 중 <tspan fill="rgb(212,168,83)" font-weight="800">없는 것만</tspan> 다운로드합니다.</text>
  <text x="80" y="430" class="note">• nginx를 먼저 받아 91d5cf66이 이미 있으면, redis를 받을 때 그 레이어는 <tspan fill="rgb(212,168,83)" font-weight="800">"Already exists"</tspan>로 건너뜁니다 — 그래서 두 번째 pull이 빠릅니다.</text>
  <text x="80" y="452" class="note">• Docker Desktop이 레이어를 alpine 그룹·redis 그룹으로 나눠 보여주는 것도, 저장 단위가 이미지가 아니라 <tspan fill="rgb(212,168,83)" font-weight="800">레이어</tspan>이기 때문입니다.</text>
  <text x="80" y="472" class="cnt">→ 저장도 전송도 레이어 단위. 공유·캐싱·빠른 pull이 전부 여기서 나옵니다.</text>
</svg>

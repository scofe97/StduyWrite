<title id="dt">셋의 수명이 서로 다른 지점에서 끝난다</title><desc id="dd">PVC 를 만들면 PV 가 그때 만들어진다. 파드를 지워도 PVC 와 PV 는 남아, 같은 요구를 다른 파드가 이어받을 수 있다.</desc>
<rect width="1240" height="644" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 10-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">셋의 수명이 서로 다른 지점에서 끝난다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">동적 프로비저닝 · reclaimPolicy: Delete</text>
<text x="40" y="206" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">PVC</text>
<rect x="150" y="180" width="840" height="40" rx="5" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>
<text x="570.0" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6A95D8">만들면 남는다 — 지울 때까지</text>
<text x="40" y="282" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">PV</text>
<rect x="255" y="256" width="798.0" height="40" rx="5" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>
<text x="654.0" y="282" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#3FB98C">PVC 를 만든 직후 프로비저너가 만든다</text>
<text x="40" y="358" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">파드 1</text>
<rect x="360" y="332" width="210" height="40" rx="5" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="465.0" y="358" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">볼륨을 마운트해 쓴다</text>
<text x="40" y="434" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#5E6B7E">파드 2</text>
<rect x="675" y="408" width="210" height="40" rx="5" fill="#F08A5912" stroke="#F08A59" stroke-width="1.2"/>
<text x="780.0" y="434" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#F08A59">같은 PVC 를 이어받는다</text>
<line x1="138" y1="520" x2="1107" y2="520" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<line x1="150" y1="496" x2="150" y2="526" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="150" y="548" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">PVC 생성</text>
<line x1="360" y1="496" x2="360" y2="526" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="360" y="548" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">파드 1 생성</text>
<line x1="570" y1="496" x2="570" y2="526" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="570" y="548" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#5E6B7E">파드 1 삭제</text>

<title id="dt">셋의 수명이 서로 다른 지점에서 끝난다</title><desc id="dd">volumeBindingMode 가 Immediate 면 PVC 를 만들 때 PV 가 만들어진다. 파드를 지워도 PVC 와 PV 는 남아, 같은 요구를 다른 파드가 이어받을 수 있다.</desc>

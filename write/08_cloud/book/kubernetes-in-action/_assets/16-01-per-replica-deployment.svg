<svg viewBox="0 0 760 380" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>StatefulSet 없이 replica마다 오브젝트를 따로 만드는 방식</title>
  <desc>단일 Deployment로는 replica마다 전용 볼륨과 주소를 줄 수 없어, replica 하나마다 Service와 Deployment와 PVC를 따로 만들어야 한다. replica 3개면 오브젝트 9개이며, 늘릴 때 kubectl scale을 쓰지 못하고 오브젝트 3개를 더 작성해야 한다. StatefulSet은 이를 단일 Service와 단일 오브젝트로 해결한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: #b8b3ad; }
      .box   { fill: #e8e4df; }
      .warn  { fill: rgb(212,168,83); }
      .t     { font-size: 11px; font-weight: 700; fill: #0d0d0d; }
      .d     { font-size: 10.5px; fill: #3a3632; }
      .n     { font-size: 10.5px; fill: #b8b3ad; }
    </style>
    <marker id="prd-a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="380" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">replica 하나에 오브젝트 셋</text>
  <text x="24" y="50" class="sub">StatefulSet 없이 만들면</text>

  <text x="60" y="82" class="n">Service</text>
  <text x="235" y="82" class="n">Deployment</text>
  <text x="410" y="82" class="n">Pod</text>
  <text x="560" y="82" class="n">PVC</text>

  <g>
    <rect x="30" y="94" width="140" height="42" rx="6" class="box"/>
    <text x="100" y="120" class="t" text-anchor="middle">quiz-0 Svc</text>
    <rect x="210" y="94" width="150" height="42" rx="6" class="box"/>
    <text x="285" y="120" class="t" text-anchor="middle">quiz-0 Deploy</text>
    <rect x="400" y="94" width="110" height="42" rx="6" class="box"/>
    <text x="455" y="120" class="t" text-anchor="middle">quiz-0</text>
    <rect x="550" y="94" width="140" height="42" rx="6" class="box"/>
    <text x="620" y="120" class="t" text-anchor="middle">db-data-0</text>
  </g>

  <g>
    <rect x="30" y="152" width="140" height="42" rx="6" class="box"/>
    <text x="100" y="178" class="t" text-anchor="middle">quiz-1 Svc</text>
    <rect x="210" y="152" width="150" height="42" rx="6" class="box"/>
    <text x="285" y="178" class="t" text-anchor="middle">quiz-1 Deploy</text>
    <rect x="400" y="152" width="110" height="42" rx="6" class="box"/>
    <text x="455" y="178" class="t" text-anchor="middle">quiz-1</text>
    <rect x="550" y="152" width="140" height="42" rx="6" class="box"/>
    <text x="620" y="178" class="t" text-anchor="middle">db-data-1</text>
  </g>

  <g>
    <rect x="30" y="210" width="140" height="42" rx="6" class="box"/>
    <text x="100" y="236" class="t" text-anchor="middle">quiz-2 Svc</text>
    <rect x="210" y="210" width="150" height="42" rx="6" class="box"/>
    <text x="285" y="236" class="t" text-anchor="middle">quiz-2 Deploy</text>
    <rect x="400" y="210" width="110" height="42" rx="6" class="box"/>
    <text x="455" y="236" class="t" text-anchor="middle">quiz-2</text>
    <rect x="550" y="210" width="140" height="42" rx="6" class="box"/>
    <text x="620" y="236" class="t" text-anchor="middle">db-data-2</text>
  </g>

  <g stroke="#b8b3ad" stroke-width="1.4">
    <line x1="170" y1="115" x2="208" y2="115" marker-end="url(#prd-a)"/>
    <line x1="360" y1="115" x2="398" y2="115" marker-end="url(#prd-a)"/>
    <line x1="510" y1="115" x2="548" y2="115" marker-end="url(#prd-a)"/>
    <line x1="170" y1="173" x2="208" y2="173" marker-end="url(#prd-a)"/>
    <line x1="360" y1="173" x2="398" y2="173" marker-end="url(#prd-a)"/>
    <line x1="510" y1="173" x2="548" y2="173" marker-end="url(#prd-a)"/>
    <line x1="170" y1="231" x2="208" y2="231" marker-end="url(#prd-a)"/>
    <line x1="360" y1="231" x2="398" y2="231" marker-end="url(#prd-a)"/>
    <line x1="510" y1="231" x2="548" y2="231" marker-end="url(#prd-a)"/>
  </g>

  <rect x="30" y="282" width="330" height="66" rx="8" class="warn"/>
  <text x="195" y="308" class="t" text-anchor="middle" font-size="12">주의 · scale 불가</text>
  <text x="195" y="331" class="d" text-anchor="middle">늘릴 때마다 오브젝트 3개 추가</text>

  <text x="560" y="300" class="n" text-anchor="middle">replica 3개 = 오브젝트 9개</text>
  <text x="560" y="326" class="n" text-anchor="middle">StatefulSet 은 하나로 끝</text>
</svg>

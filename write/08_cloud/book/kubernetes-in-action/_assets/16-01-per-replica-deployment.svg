<svg viewBox="0 0 960 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>replica마다 Deployment·Service·PVC를 따로 만드는 방식</title>
  <desc>단일 Deployment로 각 replica에 전용 볼륨·주소를 줄 수 없어, replica마다 Deployment·Service·PVC를 따로 만든다. 스케일에 kubectl scale을 못 쓰고 오브젝트를 계속 늘려야 해 복잡하다. StatefulSet이 이를 단일 오브젝트로 해결한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .svc   { font-size: 10.5px; font-weight: 700; fill: #0d0d0d; }
      .dep   { font-size: 10.5px; font-weight: 700; fill: #0d0d0d; }
      .pv    { font-size: 10px; font-weight: 700; fill: #0d0d0d; }
      .note  { font-size: 10.5px; fill: rgb(240,150,190); }
    </style>
    <marker id="prd-a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="340" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">replica마다 Deployment·Service·PVC — daunting</text>
  <text x="24" y="50" class="sub">단일 Deployment로는 불가 → replica마다 오브젝트 3종. kubectl scale 못 씀</text>

  <!-- 3 rows: Service | Deployment | Pod | PVC | PV -->
  <g>
    <!-- row 0 -->
    <rect x="30" y="80" width="110" height="40" rx="6" fill="rgb(240,215,120)"/><text x="85" y="104" class="svc" text-anchor="middle">quiz-0 Svc</text>
    <rect x="180" y="80" width="120" height="40" rx="6" fill="rgb(140,190,235)"/><text x="240" y="104" class="dep" text-anchor="middle">quiz-0 Deploy</text>
    <rect x="340" y="80" width="90" height="40" rx="6" fill="rgb(91,155,213)"/><text x="385" y="104" class="dep" text-anchor="middle" style="fill:#e8e4df">quiz-0 Pod</text>
    <rect x="470" y="80" width="90" height="40" rx="6" fill="rgb(150,220,160)"/><text x="515" y="104" class="pv" text-anchor="middle">quiz-0 PVC</text>
    <rect x="600" y="80" width="80" height="40" rx="6" fill="rgb(150,220,160)"/><text x="640" y="104" class="pv" text-anchor="middle">PV</text>
    <!-- row 1 -->
    <rect x="30" y="135" width="110" height="40" rx="6" fill="rgb(240,215,120)"/><text x="85" y="159" class="svc" text-anchor="middle">quiz-1 Svc</text>
    <rect x="180" y="135" width="120" height="40" rx="6" fill="rgb(140,190,235)"/><text x="240" y="159" class="dep" text-anchor="middle">quiz-1 Deploy</text>
    <rect x="340" y="135" width="90" height="40" rx="6" fill="rgb(91,155,213)"/><text x="385" y="159" class="dep" text-anchor="middle" style="fill:#e8e4df">quiz-1 Pod</text>
    <rect x="470" y="135" width="90" height="40" rx="6" fill="rgb(150,220,160)"/><text x="515" y="159" class="pv" text-anchor="middle">quiz-1 PVC</text>
    <rect x="600" y="135" width="80" height="40" rx="6" fill="rgb(150,220,160)"/><text x="640" y="159" class="pv" text-anchor="middle">PV</text>
    <!-- row 2 -->
    <rect x="30" y="190" width="110" height="40" rx="6" fill="rgb(240,215,120)"/><text x="85" y="214" class="svc" text-anchor="middle">quiz-2 Svc</text>
    <rect x="180" y="190" width="120" height="40" rx="6" fill="rgb(140,190,235)"/><text x="240" y="214" class="dep" text-anchor="middle">quiz-2 Deploy</text>
    <rect x="340" y="190" width="90" height="40" rx="6" fill="rgb(91,155,213)"/><text x="385" y="214" class="dep" text-anchor="middle" style="fill:#e8e4df">quiz-2 Pod</text>
    <rect x="470" y="190" width="90" height="40" rx="6" fill="rgb(150,220,160)"/><text x="515" y="214" class="pv" text-anchor="middle">quiz-2 PVC</text>
    <rect x="600" y="190" width="80" height="40" rx="6" fill="rgb(150,220,160)"/><text x="640" y="214" class="pv" text-anchor="middle">PV</text>
  </g>
  <!-- arrows per row -->
  <g stroke="rgb(138,133,128)" stroke-width="1.4">
    <line x1="140" y1="100" x2="178" y2="100" marker-end="url(#prd-a)"/><line x1="300" y1="100" x2="338" y2="100" marker-end="url(#prd-a)"/><line x1="430" y1="100" x2="468" y2="100" marker-end="url(#prd-a)"/><line x1="560" y1="100" x2="598" y2="100" marker-end="url(#prd-a)"/>
    <line x1="140" y1="155" x2="178" y2="155" marker-end="url(#prd-a)"/><line x1="300" y1="155" x2="338" y2="155" marker-end="url(#prd-a)"/><line x1="430" y1="155" x2="468" y2="155" marker-end="url(#prd-a)"/><line x1="560" y1="155" x2="598" y2="155" marker-end="url(#prd-a)"/>
    <line x1="140" y1="210" x2="178" y2="210" marker-end="url(#prd-a)"/><line x1="300" y1="210" x2="338" y2="210" marker-end="url(#prd-a)"/><line x1="430" y1="210" x2="468" y2="210" marker-end="url(#prd-a)"/><line x1="560" y1="210" x2="598" y2="210" marker-end="url(#prd-a)"/>
  </g>

  <!-- extra shared Service -->
  <rect x="730" y="135" width="110" height="40" rx="6" fill="rgb(240,215,120)"/><text x="785" y="159" class="svc" text-anchor="middle">quiz Svc(공유)</text>
  <text x="785" y="192" class="note" text-anchor="middle" font-size="10">전체 노출용</text>
  <text x="785" y="206" class="note" text-anchor="middle" font-size="10">Service 하나 더</text>

  <text x="360" y="270" class="note" text-anchor="middle">각 replica가 자기 볼륨·주소 → replica마다 별도 Service·Deployment·PVC</text>
  <text x="360" y="290" class="note" text-anchor="middle" style="fill:#e8e4df">replica 늘리려면 오브젝트 3종을 또 만들어야 함(kubectl scale 불가)</text>
  <text x="360" y="312" class="note" text-anchor="middle" style="fill:rgb(212,168,83)">→ StatefulSet이 단일 Service + 단일 오브젝트로 해결</text>
</svg>

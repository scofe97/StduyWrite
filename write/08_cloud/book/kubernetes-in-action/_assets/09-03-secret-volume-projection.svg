<svg viewBox="0 0 940 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Secret 엔트리를 secret 볼륨으로 컨테이너에 투영하기</title>
  <desc>TLS 인증서와 개인 키를 담은 Secret의 두 엔트리(tls.crt, tls.key)가 secret 볼륨에서 새 이름(example-com.crt, example-com.key)의 파일로 투영되어 컨테이너의 /etc/certs 디렉터리에 마운트된다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .zone  { font-size: 11px; fill: rgb(138,133,128); }
      .kv    { font-size: 11px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .file  { font-size: 11px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
      .lbl   { font-size: 10.5px; font-weight: 700; fill: rgb(212,168,83); }
    </style>
    <marker id="mp1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(240,150,190)"/>
    </marker>
    <marker id="mp2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="360" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Secret 엔트리를 secret 볼륨으로 투영</text>
  <text x="24" y="50" class="sub">Base64 값이 파일로 쓰일 때 디코딩되고, 키가 새 파일명으로 바뀌어 /etc/certs 에 마운트된다 (파일은 tmpfs)</text>

  <!-- Secret -->
  <rect x="40" y="100" width="220" height="160" rx="10" fill="rgb(244,190,215)"/>
  <text x="150" y="124" class="zone" text-anchor="middle" fill="#0d0d0d">Secret (kiada-tls)</text>
  <rect x="62" y="140" width="80" height="34" rx="4" fill="rgb(250,225,238)"/>
  <text x="102" y="162" class="kv" text-anchor="middle">tls.crt</text>
  <rect x="150" y="140" width="90" height="34" rx="4" fill="#fdfdf8"/>
  <text x="195" y="162" class="kv" text-anchor="middle">...</text>
  <rect x="62" y="184" width="80" height="34" rx="4" fill="rgb(250,225,238)"/>
  <text x="102" y="206" class="kv" text-anchor="middle">tls.key</text>
  <rect x="150" y="184" width="90" height="34" rx="4" fill="#fdfdf8"/>
  <text x="195" y="206" class="kv" text-anchor="middle">...</text>
  <text x="150" y="244" class="zone" text-anchor="middle" fill="#0d0d0d" font-size="10">TLS 인증서 + 개인 키</text>

  <!-- secret volume -->
  <g transform="translate(370,130)">
    <ellipse cx="55" cy="0" rx="55" ry="14" fill="rgb(244,190,215)"/>
    <rect x="0" y="0" width="110" height="100" fill="rgb(244,190,215)"/>
    <ellipse cx="55" cy="100" rx="55" ry="14" fill="rgb(230,165,195)"/>
    <rect x="14" y="20" width="82" height="26" rx="3" fill="#fdfdf8"/>
    <text x="55" y="38" class="file" text-anchor="middle" font-size="9">example-com.crt</text>
    <rect x="14" y="56" width="82" height="26" rx="3" fill="#fdfdf8"/>
    <text x="55" y="74" class="file" text-anchor="middle" font-size="9">example-com.key</text>
  </g>
  <text x="425" y="264" class="zone" text-anchor="middle" font-size="10">secret volume</text>

  <!-- Container -->
  <rect x="600" y="86" width="320" height="240" rx="12" fill="rgb(26,26,26)" stroke="rgb(91,155,213)" stroke-width="2"/>
  <text x="760" y="108" class="zone" text-anchor="middle">Container — /etc/certs</text>
  <rect x="640" y="140" width="240" height="40" rx="5" fill="rgb(245,225,110)"/>
  <text x="760" y="165" class="file" text-anchor="middle">example-com.crt</text>
  <rect x="640" y="196" width="240" height="40" rx="5" fill="rgb(245,225,110)"/>
  <text x="760" y="221" class="file" text-anchor="middle">example-com.key</text>
  <text x="760" y="286" class="sub" text-anchor="middle">애플리케이션은 디코딩 없이 파일을 읽는다</text>

  <!-- arrows Secret -> volume -->
  <path d="M262,157 L366,165" fill="none" stroke="rgb(240,150,190)" stroke-width="3" marker-end="url(#mp1)"/>
  <path d="M262,201 L366,192" fill="none" stroke="rgb(240,150,190)" stroke-width="3" marker-end="url(#mp1)"/>
  <text x="270" y="120" class="lbl">새 이름으로 투영</text>

  <!-- arrow volume -> container -->
  <path d="M482,180 C540,180 570,180 596,180" fill="none" stroke="rgb(212,168,83)" stroke-width="3" marker-end="url(#mp2)"/>
  <text x="500" y="164" class="lbl">/etc/certs 에 마운트</text>
</svg>

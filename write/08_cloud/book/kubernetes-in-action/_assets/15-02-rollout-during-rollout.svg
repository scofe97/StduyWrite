<title id="dt">기다린다는 개념 자체가 없다</title><desc id="dd">컨트롤러가 매 조정마다 하는 일은 현재 template 의 해시와 맞는 ReplicaSet 을 새 것으로 지목하고 나머지를 줄이는 것뿐이다. 0.8 을 적는 순간 지목 대상이 바뀐다.</desc>
<rect width="900" height="626" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 15-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">기다린다는 개념 자체가 없다</text>
<text x="12" y="74" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">0.6 → 0.7 롤아웃이 절반쯤 진행됐을 때 0.8 을 적용</text>

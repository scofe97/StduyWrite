<text x="24" y="544" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">0.7 을 완성한 뒤 0.8 로 넘어가지 않음 — 14-02 에서 이름 붙인 level-triggered 성질 · 중간값 0.7 을 거칠 의무 없음</text>

<svg viewBox="0 0 960 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Operator가 CRD·커스텀 오브젝트로 상태 앱을 관리</title>
  <desc>사용자가 Kubernetes API로 커스텀 오브젝트(MongoDB)를 만들면, Operator가 이를 감시해 StatefulSet·Service·Secret을 만들고 관리한다. 사용자는 하위 오브젝트를 직접 다루지 않고 커스텀 오브젝트만 수정한다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .obj   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .step  { font-size: 10.5px; fill: #e8e4df; }
      .num   { font-size: 12px; font-weight: 800; fill: rgb(212,168,83); }
    </style>
    <marker id="ocr-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="340" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Operator — CRD와 커스텀 오브젝트로 상태 앱 자동화</text>
  <text x="24" y="50" class="sub">사용자는 커스텀 오브젝트만 다루고, Operator가 StatefulSet·Service·Secret을 관리</text>

  <!-- MongoDB custom object (user creates) -->
  <rect x="40" y="150" width="150" height="60" rx="8" fill="rgb(91,155,213)"/>
  <text x="115" y="178" class="obj" text-anchor="middle" style="fill:#e8e4df">MongoDB</text>
  <text x="115" y="196" class="obj" text-anchor="middle" style="fill:#e8e4df" font-size="10">(커스텀 오브젝트)</text>
  <text x="115" y="130" class="num" text-anchor="middle">① API로 생성</text>

  <!-- Operator -->
  <rect x="360" y="60" width="150" height="50" rx="8" fill="rgb(212,168,83)"/>
  <text x="435" y="90" class="obj" text-anchor="middle">MongoDB Operator</text>
  <text x="435" y="128" class="num" text-anchor="middle">② StatefulSet·Service·Secret 생성</text>

  <!-- managed objects box -->
  <rect x="340" y="150" width="340" height="150" rx="10" fill="none" stroke="rgb(138,133,128)" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="365" y="170" width="140" height="42" rx="6" fill="rgb(140,190,235)"/><text x="435" y="196" class="obj" text-anchor="middle">StatefulSet</text>
  <rect x="365" y="222" width="140" height="42" rx="6" fill="rgb(240,215,120)"/><text x="435" y="248" class="obj" text-anchor="middle">Service</text>
  <rect x="520" y="222" width="140" height="42" rx="6" fill="rgb(240,150,190)"/><text x="590" y="248" class="obj" text-anchor="middle">Secret</text>

  <!-- Pods -->
  <rect x="740" y="180" width="120" height="46" rx="8" fill="rgb(180,210,245)"/>
  <rect x="730" y="172" width="120" height="46" rx="8" fill="rgb(180,210,245)"/>
  <text x="790" y="200" class="obj" text-anchor="middle">Pods</text>

  <!-- arrows -->
  <line x1="190" y1="180" x2="338" y2="185" stroke="rgb(138,133,128)" stroke-width="1.8" marker-end="url(#ocr-a)"/>
  <line x1="435" y1="110" x2="435" y2="168" stroke="rgb(138,133,128)" stroke-width="1.8" marker-end="url(#ocr-a)"/>
  <line x1="505" y1="191" x2="728" y2="195" stroke="rgb(138,133,128)" stroke-width="1.8" marker-end="url(#ocr-a)"/>

  <text x="435" y="325" class="step" text-anchor="middle">③ 하위 오브젝트를 직접 바꾸면 Operator가 되돌림 — members 값만 바꾸면 스케일·리플리카 셋 재구성 자동</text>
</svg>

<svg viewBox="0 0 980 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>컨트롤 플레인·워커 노드 아키텍처와 배포 흐름</title>
  <desc>사용자가 매니페스트를 API Server에 제출하면 etcd에 저장되고, Controller가 Pod를 생성하고 Scheduler가 노드를 배정하며 Kubelet이 컨테이너를 실행한다. 모든 컴포넌트는 서로 직접 통신하지 않고 API Server만 거친다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: #e8e4df; }
      .dim    { font-size: 11px; fill: rgb(138,133,128); }
      .zone   { font-size: 12px; font-weight: 800; fill: rgb(212,168,83); }
      .lbl    { font-size: 12.5px; font-weight: 800; fill: #0d0d0d; }
      .lbl2   { font-size: 10.5px; font-weight: 600; fill: #0d0d0d; }
      .step   { font-size: 11px; fill: #e8e4df; }
      .stepn  { font-size: 11px; font-weight: 800; fill: rgb(212,168,83); }
      .mono   { font-family: 'JetBrains Mono', monospace; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">쿠버네티스 아키텍처 — 모든 통신은 API Server를 거칩니다</text>
  <text x="24" y="52" class="sub">컨트롤 플레인은 상태를 통제하고, 워커 노드는 실제로 컨테이너를 실행합니다. 컴포넌트끼리 직접 연결되지 않습니다.</text>

  <!-- ===== Control Plane frame ===== -->
  <rect x="30" y="78" width="560" height="440" rx="12" fill="rgb(24,28,32)" stroke="rgb(212,168,83)" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="48" y="102" class="zone">Control Plane (두뇌 — 통제하지만 실행하지 않음)</text>

  <!-- API Server (hub) -->
  <rect x="220" y="120" width="180" height="66" rx="9" fill="rgb(212,168,83)"/>
  <text x="310" y="150" class="lbl" text-anchor="middle">API Server</text>
  <text x="310" y="168" class="lbl2" text-anchor="middle">유일한 통신 허브 · RESTful</text>

  <!-- etcd -->
  <rect x="220" y="430" width="180" height="60" rx="9" fill="rgb(150,130,220)"/>
  <text x="310" y="456" class="lbl" text-anchor="middle">etcd</text>
  <text x="310" y="474" class="lbl2" text-anchor="middle">분산 저장소 · 오브젝트 영속</text>

  <!-- Controllers -->
  <rect x="55" y="250" width="150" height="66" rx="9" fill="rgb(230,230,230)"/>
  <text x="130" y="278" class="lbl" text-anchor="middle">Controllers</text>
  <text x="130" y="296" class="lbl2" text-anchor="middle">조정(reconcile)</text>

  <!-- Scheduler -->
  <rect x="415" y="250" width="150" height="66" rx="9" fill="rgb(230,230,230)"/>
  <text x="490" y="278" class="lbl" text-anchor="middle">Scheduler</text>
  <text x="490" y="296" class="lbl2" text-anchor="middle">노드 배치 결정</text>

  <!-- edges within control plane (all via API Server) -->
  <line x1="310" y1="186" x2="310" y2="430" stroke="rgb(138,133,128)" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="322" y="310" class="dim">읽기·쓰기</text>
  <line x1="205" y1="270" x2="218" y2="180" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="415" y1="270" x2="402" y2="180" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== Worker Node frame ===== -->
  <rect x="640" y="78" width="310" height="440" rx="12" fill="rgb(20,24,28)" stroke="rgb(138,133,128)" stroke-width="1.3"/>
  <text x="658" y="102" class="zone">Worker Node (워크로드 — 실제 실행)</text>

  <!-- Kubelet -->
  <rect x="700" y="150" width="190" height="60" rx="9" fill="rgb(102,187,106)"/>
  <text x="795" y="176" class="lbl" text-anchor="middle">Kubelet</text>
  <text x="795" y="194" class="lbl2" text-anchor="middle">노드 에이전트 · 상태 보고</text>

  <!-- Container runtime -->
  <rect x="700" y="240" width="190" height="60" rx="9" fill="rgb(230,230,230)"/>
  <text x="795" y="266" class="lbl" text-anchor="middle">컨테이너 런타임</text>
  <text x="795" y="284" class="lbl2" text-anchor="middle">컨테이너 실제 실행</text>

  <!-- kube-proxy -->
  <rect x="700" y="330" width="190" height="60" rx="9" fill="rgb(230,230,230)"/>
  <text x="795" y="356" class="lbl" text-anchor="middle">kube-proxy</text>
  <text x="795" y="374" class="lbl2" text-anchor="middle">서비스 트래픽 라우팅</text>

  <!-- API Server <-> Kubelet (the only cross-plane link) -->
  <line x1="400" y1="153" x2="700" y2="176" stroke="rgb(212,168,83)" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="470" y="140" class="stepn">API Server ↔ Kubelet 만 연결</text>
  <line x1="795" y1="210" x2="795" y2="238" stroke="rgb(138,133,128)" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== deploy flow steps (bottom-right) ===== -->
  <text x="658" y="428" class="stepn" font-weight="800">배포 흐름</text>
  <text x="658" y="447" class="step"><tspan class="stepn">①</tspan> 매니페스트 제출 → etcd 저장</text>
  <text x="658" y="464" class="step"><tspan class="stepn">②</tspan> Controller가 부족분 Pod 생성</text>
  <text x="658" y="481" class="step"><tspan class="stepn">③</tspan> Scheduler가 노드 배정</text>
  <text x="658" y="498" class="step"><tspan class="stepn">④</tspan> Kubelet이 컨테이너 실행</text>

  <!-- user -->
  <text x="310" y="540" class="sub" text-anchor="middle">▲ 개발자·운영자(kubectl) 는 오직 API Server 로만 오브젝트를 만듭니다</text>
</svg>

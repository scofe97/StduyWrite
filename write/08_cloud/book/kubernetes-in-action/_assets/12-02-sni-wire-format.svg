<svg viewBox="0 0 1120 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>server_name 확장 — 껍질 셋이 벗겨지며 바이트로 펴집니다</title>
  <desc>SNI 가 실린 server_name 확장의 중첩 구조와 바이트 배열을 세로로 대응시킨다. 위쪽 껍질 셋은 가장 바깥이 Extension 이고 그 안에 ServerNameList 가 있으며 다시 그 안에 ServerName 이 있고 맨 안쪽이 호스트명이다. 각 껍질은 시작하는 x 좌표가 아래 바이트 배열의 자기 시작 위치와 맞춰져 있어, 껍질이 어디서 시작해 어디까지 덮는지 세로로 읽힌다. 아래쪽 바이트 배열은 왼쪽부터 00 00 이 extension_type 으로 server_name 을 뜻하고, 00 14 는 확장 데이터가 20 바이트, 00 12 는 리스트가 18 바이트, 00 은 name_type 이 host_name, 00 0f 는 이름이 15 바이트라는 길이이며, 마지막 15 바이트가 api.example.com 의 ASCII 코드다. 각 길이 값 아래에는 그 길이가 덮는 범위를 나타내는 가로 막대가 서로 다른 높이에 놓여, 앞의 길이가 뒤를 통째로 감싸고 그 안에서 다시 길이가 나오는 중첩이 계단처럼 보인다. 껍질마다 길이가 먼저 오고 내용이 뒤따르는 규칙이 세 번 반복된다.</desc>
  <defs>
    <style>
      .h1   { font-size: 21px; font-weight: 800; fill: #e8e4df; }
      .lyr  { font-size: 12px; font-weight: 800; fill: rgb(168,163,158); }
      .shell{ font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .hex  { font-size: 13px; font-weight: 800; fill: #0d0d0d; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .hexd { font-size: 13px; font-weight: 800; fill: #e8e4df; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .cap  { font-size: 10.5px; fill: rgb(168,163,158); }
      .amb  { font-size: 11px; font-weight: 800; fill: rgb(212,168,83); }
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="430" fill="#0d0d0d"/>

  <text x="30" y="36" class="h1">껍질 셋이 벗겨지며 바이트로 펴집니다</text>

  <!-- ══ 중첩 구조 — 아래 바이트와 x 를 맞춤 ══ -->
  <text x="30" y="70" class="lyr">중첩 구조</text>

  <rect x="30" y="80" width="1060" height="86" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.6"/>
  <text x="42" y="98" class="shell" style="fill:rgb(212,168,83)">Extension</text>

  <rect x="222" y="106" width="864" height="56" rx="7" fill="#0d0d0d" stroke="rgb(91,155,213)" stroke-width="1.5"/>
  <text x="234" y="124" class="shell" style="fill:rgb(91,155,213)">ServerNameList</text>

  <rect x="318" y="132" width="764" height="26" rx="6" fill="#0d0d0d" stroke="rgb(102,187,106)" stroke-width="1.5"/>
  <text x="330" y="149" class="shell" style="fill:rgb(102,187,106)">ServerName</text>

  <rect x="484" y="137" width="590" height="16" rx="3" fill="rgb(212,168,83)"/>
  <text x="779" y="149" class="hex" text-anchor="middle" style="font-size:10.5px">HostName</text>

  <!-- ══ 바이트 배열 — 위 껍질과 같은 x ══ -->
  <text x="30" y="200" class="lyr">바이트 배열</text>

  <rect x="30" y="210" width="90" height="32" rx="4" fill="rgb(212,168,83)"/>
  <text x="75" y="232" class="hex" text-anchor="middle">00 00</text>
  <text x="75" y="256" class="cap" text-anchor="middle">type = 0</text>
  <text x="75" y="270" class="cap" text-anchor="middle">server_name</text>

  <rect x="126" y="210" width="90" height="32" rx="4" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="171" y="232" class="hexd" text-anchor="middle">00 14</text>
  <text x="171" y="256" class="amb" text-anchor="middle">길이 20</text>

  <rect x="222" y="210" width="90" height="32" rx="4" fill="#0d0d0d" stroke="rgb(91,155,213)" stroke-width="1.5"/>
  <text x="267" y="232" class="hexd" text-anchor="middle">00 12</text>
  <text x="267" y="256" class="cap" text-anchor="middle" style="fill:rgb(91,155,213);font-weight:800">길이 18</text>

  <rect x="318" y="210" width="62" height="32" rx="4" fill="rgb(102,187,106)"/>
  <text x="349" y="232" class="hex" text-anchor="middle">00</text>
  <text x="349" y="256" class="cap" text-anchor="middle">host_name</text>

  <rect x="386" y="210" width="90" height="32" rx="4" fill="#0d0d0d" stroke="rgb(102,187,106)" stroke-width="1.5"/>
  <text x="431" y="232" class="hexd" text-anchor="middle">00 0f</text>
  <text x="431" y="256" class="cap" text-anchor="middle" style="fill:rgb(102,187,106);font-weight:800">길이 15</text>

  <rect x="482" y="210" width="596" height="32" rx="4" fill="rgb(212,168,83)"/>
  <text x="780" y="232" class="hex" text-anchor="middle">61 70 69 2e 65 78 61 6d 70 6c 65 2e 63 6f 6d</text>
  <text x="780" y="256" class="amb" text-anchor="middle">"api.example.com" — ASCII 15 바이트</text>

  <!-- ══ 길이가 덮는 범위 — 계단 ══ -->
  <text x="30" y="306" class="lyr">각 길이가 덮는 범위</text>

  <path d="M 171 288 L 171 320" stroke="rgb(212,168,83)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="222" y="316" width="856" height="16" rx="3" fill="rgba(212,168,83,0.30)"/>
  <text x="650" y="328" class="amb" text-anchor="middle">20 바이트 — 이 뒤 전부</text>

  <path d="M 267 288 L 267 348" stroke="rgb(91,155,213)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="318" y="344" width="760" height="16" rx="3" fill="rgba(91,155,213,0.30)"/>
  <text x="698" y="356" class="cap" text-anchor="middle" style="fill:rgb(91,155,213);font-weight:800">18 바이트 — name_type 부터</text>

  <path d="M 431 288 L 431 376" stroke="rgb(102,187,106)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="482" y="372" width="596" height="16" rx="3" fill="rgba(102,187,106,0.30)"/>
  <text x="780" y="384" class="cap" text-anchor="middle" style="fill:rgb(102,187,106);font-weight:800">15 바이트 — 호스트명만</text>

  <text x="30" y="412" class="lyr">껍질마다 <tspan fill="#e8e4df">길이가 먼저</tspan>, 내용이 뒤 — 같은 규칙이 세 번 반복됩니다</text>
</svg>

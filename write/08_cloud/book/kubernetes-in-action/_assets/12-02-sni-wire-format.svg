<svg viewBox="0 0 1120 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>server_name 확장의 실제 구조 — 바이트로 어떻게 실리는가</title>
  <desc>SNI 가 ClientHello 안에 실제로 어떤 바이트로 실리는지 보여 준다. 위쪽은 중첩 구조다. 확장 하나는 extension_type 과 길이와 데이터로 이뤄지고, server_name 의 타입 번호는 0 이다. 그 데이터 자리에 ServerNameList 가 들어가며 리스트의 각 항목은 ServerName 이다. ServerName 은 name_type 과 이름으로 이뤄지고 name_type 이 0 이면 host_name 을 뜻하며 그 뒤에 HostName 이 온다. HostName 은 ASCII 바이트 문자열이다. 아래쪽은 같은 것을 실제 바이트로 편 것이다. 00 00 은 extension_type 이 0 즉 server_name 이라는 뜻이고, 00 14 는 확장 데이터의 길이 20 바이트, 00 12 는 리스트 길이 18 바이트, 00 은 name_type 이 host_name, 00 0f 는 이름 길이 15 바이트이며 그 뒤 15 바이트가 api.example.com 의 ASCII 코드다. 오른쪽에는 명세가 못 박은 제약 셋을 둔다. IP 주소는 넣을 수 없고, 후행 점을 붙이지 않으며, DNS 호스트명만 지원한다. IP 주소를 넣을 수 없다는 것이 IP 로 직접 접속하면 SNI 가 비는 이유다.</desc>
  <defs>
    <style>
      .h1   { font-size: 22px; font-weight: 800; fill: #e8e4df; }
      .sub  { font-size: 13.5px; fill: rgb(168,163,158); }
      .lyr  { font-size: 12px; font-weight: 800; fill: rgb(168,163,158); }
      .box  { font-size: 13px; font-weight: 700; fill: #e8e4df; }
      .who  { font-size: 11.5px; fill: rgb(168,163,158); }
      .mono { font-size: 12px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .monod{ font-size: 12px; font-weight: 700; fill: #e8e4df; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .hex  { font-size: 13px; font-weight: 800; fill: #0d0d0d; font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .amb  { font-size: 12.5px; font-weight: 800; fill: rgb(212,168,83); }
      .bad  { font-size: 12px; font-weight: 700; fill: rgb(240,150,190); }
    </style>
    <marker id="wfA" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="rgb(212,168,83)"/></marker>
  </defs>

  <rect x="0" y="0" width="1120" height="560" fill="#0d0d0d"/>

  <text x="30" y="38" class="h1">server_name 확장은 이렇게 생겼습니다</text>
  <text x="30" y="62" class="sub">앞서 본 <tspan style="font-family:'JetBrains Mono',monospace" fill="rgb(212,168,83)">server_name: api.example.com</tspan> 한 줄이 실제로는 이 중첩 구조와 바이트로 실립니다.</text>

  <!-- ══ 중첩 구조 ══ -->
  <text x="30" y="96" class="lyr">중첩 구조 — 껍질이 셋입니다</text>

  <rect x="30" y="108" width="700" height="150" rx="9" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="46" y="130" class="monod">Extension</text>
  <text x="150" y="130" class="who">확장 하나의 공통 껍질</text>

  <rect x="46" y="140" width="668" height="26" rx="5" fill="rgb(212,168,83)"/>
  <text x="58" y="158" class="mono">extension_type = 0   ← server_name 의 번호</text>

  <rect x="46" y="172" width="668" height="78" rx="5" fill="#0d0d0d" stroke="rgb(212,168,83)"/>
  <text x="60" y="192" class="monod">ServerNameList</text>
  <text x="190" y="192" class="who">이름을 여럿 담을 수 있는 리스트</text>

  <rect x="60" y="200" width="640" height="42" rx="5" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="74" y="219" class="monod">ServerName</text>
  <text x="190" y="219" class="who">name_type + 이름</text>
  <text x="74" y="236" class="mono" style="fill:rgb(102,187,106)">name_type = 0 (host_name)  ·  HostName = "api.example.com"</text>

  <!-- 제약 -->
  <rect x="750" y="108" width="340" height="150" rx="9" fill="rgb(28,24,26)" stroke="rgb(240,150,190)"/>
  <text x="766" y="130" class="bad">명세가 못 박은 제약</text>
  <text x="766" y="156" class="who">· <tspan fill="#e8e4df" font-weight="700">IP 주소는 넣을 수 없습니다</tspan></text>
  <text x="778" y="174" class="who">그래서 IP 로 직접 접속하면 SNI 가 빕니다</text>
  <text x="766" y="198" class="who">· 후행 점(<tspan style="font-family:'JetBrains Mono',monospace" fill="#e8e4df">example.com.</tspan>)을 붙이지 않습니다</text>
  <text x="766" y="222" class="who">· DNS 호스트명만 지원합니다</text>
  <text x="766" y="244" class="who">· 대소문자를 구분하지 않습니다</text>

  <!-- ══ 실제 바이트 ══ -->
  <text x="30" y="296" class="lyr">같은 것을 바이트로 펴면</text>

  <rect x="30" y="308" width="1060" height="140" rx="9" fill="#0d0d0d" stroke="rgb(92,84,74)"/>

  <rect x="46" y="324" width="120" height="30" rx="4" fill="rgb(212,168,83)"/>
  <text x="106" y="344" class="hex" text-anchor="middle">00 00</text>
  <text x="106" y="370" class="who" text-anchor="middle">extension_type</text>
  <text x="106" y="386" class="who" text-anchor="middle">= server_name</text>

  <rect x="174" y="324" width="120" height="30" rx="4" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="234" y="344" class="monod" text-anchor="middle">00 14</text>
  <text x="234" y="370" class="who" text-anchor="middle">확장 데이터 길이</text>
  <text x="234" y="386" class="who" text-anchor="middle">20 바이트</text>

  <rect x="302" y="324" width="120" height="30" rx="4" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="362" y="344" class="monod" text-anchor="middle">00 12</text>
  <text x="362" y="370" class="who" text-anchor="middle">리스트 길이</text>
  <text x="362" y="386" class="who" text-anchor="middle">18 바이트</text>

  <rect x="430" y="324" width="80" height="30" rx="4" fill="rgb(102,187,106)"/>
  <text x="470" y="344" class="hex" text-anchor="middle">00</text>
  <text x="470" y="370" class="who" text-anchor="middle">name_type</text>
  <text x="470" y="386" class="who" text-anchor="middle">= host_name</text>

  <rect x="518" y="324" width="110" height="30" rx="4" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="573" y="344" class="monod" text-anchor="middle">00 0f</text>
  <text x="573" y="370" class="who" text-anchor="middle">이름 길이</text>
  <text x="573" y="386" class="who" text-anchor="middle">15 바이트</text>

  <rect x="636" y="324" width="438" height="30" rx="4" fill="rgb(212,168,83)"/>
  <text x="855" y="344" class="hex" text-anchor="middle">61 70 69 2e 65 78 61 6d 70 6c 65 2e 63 6f 6d</text>
  <text x="855" y="372" class="amb" text-anchor="middle">"api.example.com" — ASCII 15 바이트</text>
  <text x="855" y="390" class="who" text-anchor="middle">여기가 프록시가 읽는 값입니다</text>

  <line x1="855" y1="400" x2="855" y2="424" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#wfA)"/>
  <rect x="636" y="428" width="438" height="8" rx="3" fill="rgba(212,168,83,0.35)"/>

  <!-- 못박기 -->
  <rect x="30" y="466" width="1060" height="74" rx="10" fill="rgba(212,168,83,0.08)" stroke="rgb(42,37,32)"/>
  <text x="52" y="490" class="box">길이가 앞에 붙는 구조라, 암호를 풀지 않아도 <tspan fill="rgb(212,168,83)">어디부터 어디까지가 호스트명인지</tspan> 셀 수 있습니다.</text>
  <text x="52" y="512" class="who">프록시는 ClientHello 를 파싱해 이 바이트만 꺼내 라우팅하고, 나머지는 손대지 않은 채 그대로 흘려보냅니다.</text>
  <text x="52" y="532" class="who">중첩이 셋인 이유는 이름을 <tspan fill="#e8e4df">여럿</tspan> 담을 수 있게 설계했기 때문입니다 — 실제로는 host_name 하나만 쓰입니다.</text>
</svg>

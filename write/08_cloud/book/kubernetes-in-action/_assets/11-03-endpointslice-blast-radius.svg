<svg viewBox="0 0 1120 660" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Endpoints와 EndpointSlice — 파드 하나가 죽었을 때 노드 100대로 나가는 전송량</title>
  <desc>파드 100개짜리 Service에서 파드 1개가 죽고 노드가 100대인 상황을 두 방식으로 비교한다. 저장하는 IP는 양쪽 모두 99개로 같다. Endpoints는 IP 99개가 든 오브젝트 하나를 통째로 노드 100곳에 보내 9,900 IP분을 전송한다. EndpointSlice는 20개씩 다섯 조각으로 나눠 두어, 죽은 파드가 든 조각 하나만 19개로 갱신돼 노드 100곳에 나가고 나머지 네 조각은 바뀌지 않아 전송하지 않으므로 1,900 IP분에 그친다. 줄어든 것은 저장량이 아니라 변경 한 번이 건드리는 범위이며, watch가 델타가 아니라 오브젝트를 통째로 보내기 때문에 조각 크기가 곧 전송 단위가 된다.</desc>
  <defs>
    <style>
      .h1   { font-size: 25px; font-weight: 800; fill: #e8e4df; }
      .sub  { font-size: 15px; fill: rgb(168,163,158); }
      .col  { font-size: 16px; font-weight: 800; }
      .nd   { font-size: 12.5px; font-weight: 800; fill: rgb(168,163,158); }
      .chip { font-size: 12px; font-weight: 800; fill: #0d0d0d; }
      .num  { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .good { font-size: 13px; fill: rgb(102,187,106); }
      .bad  { font-size: 13px; fill: rgb(240,150,190); }
      .who  { font-size: 12.5px; fill: rgb(168,163,158); }
      .body { font-size: 14px; fill: #e8e4df; }
      .big  { font-size: 27px; font-weight: 800; }
    </style>
    <marker id="ar-bad" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(240,150,190)"/>
    </marker>
    <marker id="ar-ok" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="rgb(102,187,106)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="660" fill="#0d0d0d"/>

  <text x="30" y="42" class="h1">줄어든 것은 저장량이 아니라 전파 범위입니다</text>
  <text x="30" y="68" class="sub">파드 100개짜리 Service에서 파드 하나가 죽습니다. 노드는 100대. 양쪽 모두 최종 상태는 IP 99개로 같습니다.</text>

  <!-- ================= 왼쪽: Endpoints ================= -->
  <rect x="30" y="92" width="520" height="428" rx="13" fill="rgb(22,22,22)" stroke="rgb(240,150,190)" stroke-width="1.8"/>
  <text x="52" y="122" class="col" style="fill:rgb(240,150,190)">Endpoints — 오브젝트 하나</text>
  <text x="52" y="144" class="who">IP 99개가 한 오브젝트에 전부 들어 있습니다</text>

  <!-- 저장 상태 -->
  <text x="52" y="176" class="nd">저장</text>
  <rect x="52" y="186" width="476" height="58" rx="8" fill="rgb(240,150,190)"/>
  <text x="290" y="211" class="chip" text-anchor="middle">Endpoints 오브젝트 1개</text>
  <text x="290" y="230" class="num" text-anchor="middle">IP 99개</text>

  <!-- 전송 -->
  <text x="52" y="278" class="nd">파드 1개가 죽으면 — 오브젝트 전체가 다시 나갑니다</text>
  <line x1="290" y1="288" x2="290" y2="318" stroke="rgb(240,150,190)" stroke-width="2.4" marker-end="url(#ar-bad)"/>
  <text x="304" y="308" class="bad">99개 통째로</text>

  <rect x="52" y="326" width="476" height="66" rx="8" fill="rgba(240,150,190,0.14)" stroke="rgb(240,150,190)" stroke-width="1.6"/>
  <text x="68" y="350" class="body" font-weight="700">노드 100곳이 각각 99개를 받습니다</text>
  <text x="68" y="374" class="who">바뀐 IP는 하나인데 나머지 98개도 같이 실려 갑니다</text>

  <rect x="52" y="406" width="476" height="72" rx="10" fill="rgba(240,150,190,0.10)" stroke="rgb(240,150,190)" stroke-width="1.4"/>
  <text x="68" y="438" class="body">99 IP × 노드 100곳 =</text>
  <text x="290" y="462" class="big" style="fill:rgb(240,150,190)" text-anchor="middle">9,900 IP분</text>

  <text x="52" y="502" class="bad">✗ 파드가 늘수록 변경 한 번의 비용이 같이 커집니다</text>

  <!-- ================= 오른쪽: EndpointSlice ================= -->
  <rect x="570" y="92" width="520" height="428" rx="13" fill="rgb(22,22,22)" stroke="rgb(102,187,106)" stroke-width="1.8"/>
  <text x="592" y="122" class="col" style="fill:rgb(102,187,106)">EndpointSlice — 20개씩 다섯 조각</text>
  <text x="592" y="144" class="who">같은 99개를 조각으로 나눠 둡니다</text>

  <!-- 저장 상태: 5조각 -->
  <text x="592" y="176" class="nd">저장 — 합치면 똑같이 99개</text>
  <rect x="592" y="186" width="86" height="58" rx="8" fill="rgb(212,168,83)"/>
  <text x="635" y="209" class="chip" text-anchor="middle">조각 1</text>
  <text x="635" y="228" class="num" text-anchor="middle">19개</text>
  <rect x="690" y="186" width="86" height="58" rx="8" fill="rgb(91,155,213)"/>
  <text x="733" y="209" class="chip" text-anchor="middle">조각 2</text>
  <text x="733" y="228" class="num" text-anchor="middle">20개</text>
  <rect x="788" y="186" width="86" height="58" rx="8" fill="rgb(91,155,213)"/>
  <text x="831" y="209" class="chip" text-anchor="middle">조각 3</text>
  <text x="831" y="228" class="num" text-anchor="middle">20개</text>
  <rect x="886" y="186" width="86" height="58" rx="8" fill="rgb(91,155,213)"/>
  <text x="929" y="209" class="chip" text-anchor="middle">조각 4</text>
  <text x="929" y="228" class="num" text-anchor="middle">20개</text>
  <rect x="984" y="186" width="86" height="58" rx="8" fill="rgb(91,155,213)"/>
  <text x="1027" y="209" class="chip" text-anchor="middle">조각 5</text>
  <text x="1027" y="228" class="num" text-anchor="middle">20개</text>

  <text x="592" y="278" class="nd">파드 1개가 죽으면 — 그 파드가 든 조각만 나갑니다</text>
  <line x1="635" y1="288" x2="635" y2="318" stroke="rgb(102,187,106)" stroke-width="2.4" marker-end="url(#ar-ok)"/>
  <text x="650" y="308" class="good">조각 1만 19개로</text>
  <text x="800" y="308" class="who">조각 2~5는 안 바뀌어 전송 없음</text>

  <rect x="592" y="326" width="478" height="66" rx="8" fill="rgba(102,187,106,0.12)" stroke="rgb(102,187,106)" stroke-width="1.6"/>
  <text x="608" y="350" class="body" font-weight="700">노드 100곳이 각각 19개만 받습니다</text>
  <text x="608" y="374" class="who">나머지 네 조각은 이미 가진 것과 같으므로 보낼 이유가 없습니다</text>

  <rect x="592" y="406" width="478" height="72" rx="10" fill="rgba(102,187,106,0.10)" stroke="rgb(102,187,106)" stroke-width="1.4"/>
  <text x="608" y="438" class="body">19 IP × 노드 100곳 =</text>
  <text x="831" y="462" class="big" style="fill:rgb(102,187,106)" text-anchor="middle">1,900 IP분</text>

  <text x="592" y="502" class="good">✓ 조각 크기가 변경 한 번의 비용 상한이 됩니다</text>

  <!-- ================= 하단 못박기 ================= -->
  <rect x="30" y="538" width="1060" height="98" rx="12" fill="rgba(212,168,83,0.08)" stroke="rgb(42,37,32)"/>
  <text x="54" y="566" class="body" font-weight="700">watch는 바뀐 부분만 보내지 않고 오브젝트를 통째로 보냅니다. 그래서 오브젝트 크기가 곧 전송 단위입니다.</text>
  <text x="54" y="590" class="who">쪼갠 뒤에도 IP 총합은 99개로 그대로입니다. 달라진 것은 변경 하나가 건드리는 범위 — 오브젝트 전체에서 조각 하나로 좁혀졌습니다.</text>
  <text x="54" y="612" class="who">그래서 기본 조각 크기 100은 저장 한도가 아니라 전송량 상한을 정하는 손잡이입니다. 조각을 작게 잡으면 변경 비용이 줄고, 대신 조각 수와 관리 부담이 늡니다.</text>
</svg>

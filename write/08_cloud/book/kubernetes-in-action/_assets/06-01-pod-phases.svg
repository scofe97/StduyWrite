<svg viewBox="0 0 960 330" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Pod의 다섯 phase</title>
  <desc>Pod는 Pending 상태에서 시작해 컨테이너가 시작되면 Running으로 전이한다. 무한정 돌지 않는 Pod는 모든 컨테이너가 성공하면 Succeeded, 하나라도 실패하면 Failed로 끝난다. Kubelet이 API 서버에 보고를 멈추면 Unknown으로 표시된다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .ph     { font-size: 14px; font-weight: 800; fill: #0d0d0d; }
      .note   { font-size: 10.5px; fill: #e8e4df; }
    </style>
    <marker id="a61" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="330" fill="#0d0d0d"/>
  <text x="24" y="28" class="title">Pod의 다섯 phase</text>
  <text x="24" y="46" class="sub">Pending → Running → Succeeded 또는 Failed · Kubelet 보고 두절 시 Unknown</text>

  <!-- start dot -->
  <circle cx="60" cy="150" r="6" fill="#e8e4df"/>
  <line x1="66" y1="150" x2="118" y2="150" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a61)"/>

  <!-- Pending -->
  <rect x="122" y="122" width="130" height="56" rx="10" fill="rgb(245,215,110)"/>
  <text x="187" y="156" class="ph" text-anchor="middle">Pending</text>

  <line x1="252" y1="150" x2="318" y2="150" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a61)"/>

  <!-- Running -->
  <rect x="322" y="122" width="130" height="56" rx="10" fill="rgb(174,214,241)"/>
  <text x="387" y="156" class="ph" text-anchor="middle">Running</text>

  <!-- Running -> Succeeded -->
  <path d="M452,140 L560,120" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a61)"/>
  <!-- Running -> Failed -->
  <path d="M452,162 L560,196" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a61)"/>

  <!-- Succeeded -->
  <rect x="565" y="92" width="140" height="52" rx="10" fill="rgb(102,187,106)"/>
  <text x="635" y="124" class="ph" text-anchor="middle">Succeeded</text>

  <!-- Failed -->
  <rect x="565" y="176" width="140" height="52" rx="10" fill="rgb(240,150,190)"/>
  <text x="635" y="208" class="ph" text-anchor="middle">Failed</text>

  <!-- end dot -->
  <circle cx="765" cy="150" r="8" fill="none" stroke="#e8e4df" stroke-width="2"/>
  <circle cx="765" cy="150" r="4" fill="#e8e4df"/>
  <path d="M705,116 L752,142" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a61)"/>
  <path d="M705,204 L752,160" fill="none" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a61)"/>

  <!-- Unknown -->
  <rect x="322" y="234" width="130" height="52" rx="10" fill="rgb(232,228,223)"/>
  <text x="387" y="266" class="ph" text-anchor="middle">Unknown</text>

  <!-- annotations -->
  <text x="122" y="90" class="note">컨테이너가 시작될 때까지</text>
  <text x="122" y="105" class="note">Pending phase에 머문다</text>

  <text x="300" y="90" class="note">모든 컨테이너가 생성됐고, 최소 하나가</text>
  <text x="300" y="105" class="note">실행 중이거나 시작·재시작 중</text>

  <text x="730" y="70" class="note">모든 컨테이너가</text>
  <text x="730" y="85" class="note">성공적으로 종료됨</text>
  <line x1="726" y1="80" x2="710" y2="100" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a61)"/>

  <text x="740" y="240" class="note">하나 이상의 컨테이너가</text>
  <text x="740" y="255" class="note">실패로 종료됨</text>
  <line x1="736" y1="245" x2="710" y2="220" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a61)"/>

  <text x="60" y="255" class="note">Kubelet이 API 서버 보고를 멈추면</text>
  <text x="60" y="270" class="note">Unknown으로 표시된다</text>
  <line x1="256" y1="262" x2="318" y2="262" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#a61)"/>

  <text x="480" y="315" class="sub" text-anchor="middle">Succeeded·Failed는 무한정 돌 의도가 아닌 Pod(배치 작업 등)에만 해당한다</text>
</svg>

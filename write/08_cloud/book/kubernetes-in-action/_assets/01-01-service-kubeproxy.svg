<title id="dt">가상 IP 하나가 노드마다 심긴 규칙으로 갈린다</title><desc id="dd">클라이언트는 Service 의 ClusterIP 하나만 안다. 그 요청은 각 노드의 kube-proxy 가 커널에 심어 둔 규칙을 타고 실제 파드로 나뉜다.</desc>

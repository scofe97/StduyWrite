<svg viewBox="0 0 940 490" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>fsGroup이 보충 그룹으로 파일 권한 매칭을 성립시키는 원리</title>
  <desc>리눅스 권한 검사는 소유자·그룹·기타 중 딱 한 칸만 적용한다. 프로세스가 파일 소유자도 소유 그룹도 아니면 기타(others) 칸이 적용된다. mode 0640 파일은 기타에 읽기 권한이 없어 프로세스가 못 읽는다. fsGroup은 볼륨 파일의 그룹 소유권을 지정 gid로 바꾸고 프로세스를 그 gid의 보충 그룹 멤버로 넣어, 그룹 칸 매칭을 성립시켜 읽기를 가능하게 한다.</desc>

  <rect x="0" y="0" width="940" height="490" fill="#0d0d0d"/>
  <text x="30" y="34" fill="rgb(212,168,83)" font-size="16" font-weight="700">권한은 소유자→그룹→기타 중 "딱 한 칸"만 적용 — fsGroup은 그룹 칸을 맞춘다</text>

  <!-- 상단: 권한 매칭 규칙 -->
  <rect x="24" y="52" width="892" height="70" rx="8" fill="#0d0d0d" stroke="rgb(90,85,78)" stroke-width="1.5"/>
  <text x="40" y="76" fill="#e8e4df" font-size="12">파일 권한 <tspan font-family="'JetBrains Mono',monospace" font-weight="700" fill="rgb(212,168,83)">rw- r-- ---</tspan> (0640) 은 세 칸 — 프로세스가 어느 칸에 해당하는지 <tspan font-weight="700">위에서부터 하나만</tspan> 골라 적용한다.</text>
  <text x="40" y="102" fill="#e8e4df" font-size="11">① 내가 <tspan font-weight="700" fill="#66bb6a">소유자</tspan>인가? → ② 아니면 파일 <tspan font-weight="700" fill="#5b9bd5">소유 그룹</tspan>의 멤버인가? → ③ 둘 다 아니면 <tspan font-weight="700" fill="#f44336">기타(others)</tspan>. 계급이 아니라 매칭이다.</text>

  <!-- 왼쪽: fsGroup 없음 (실패) -->
  <rect x="24" y="140" width="430" height="316" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="40" y="166" fill="#f44336" font-size="14" font-weight="700">fsGroup 없음 — 기타 칸이 적용돼 실패</text>

  <!-- 프로세스 -->
  <rect x="40" y="182" width="180" height="70" rx="6" fill="#f5edda" stroke="rgb(42,37,32)"/>
  <text x="130" y="204" style="fill:#3a2f10" font-size="11.5" font-weight="700" text-anchor="middle">프로세스 (Envoy)</text>
  <text x="130" y="224" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">uid=1000 gid=1000</text>
  <text x="130" y="240" style="fill:#3a2f10" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">groups=1000</text>
  <!-- 파일 -->
  <rect x="258" y="182" width="180" height="70" rx="6" fill="#dceaf7" stroke="rgb(42,37,32)"/>
  <text x="348" y="204" style="fill:#10243a" font-size="11.5" font-weight="700" text-anchor="middle">tls.key (0640)</text>
  <text x="348" y="224" style="fill:#10243a" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">소유자 root (0)</text>
  <text x="348" y="240" style="fill:#10243a" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">그룹 root (0)</text>

  <!-- 매칭 결과 -->
  <rect x="40" y="270" width="398" height="130" rx="6" fill="#f2d4d4" stroke="rgb(42,37,32)"/>
  <text x="56" y="292" style="fill:#7a1f1f" font-size="11" font-weight="700">매칭: 소유자? 1000≠0 ✗  ·  그룹? 1000 ∉ {0} ✗</text>
  <text x="56" y="314" style="fill:#7a1f1f" font-size="11" font-weight="700">→ 남은 칸은 <tspan font-size="12">기타(others) = ---</tspan></text>
  <text x="56" y="338" style="fill:#7a1f1f" font-size="10.5">0640 의 기타 칸엔 읽기 비트가 없다.</text>
  <text x="56" y="360" style="fill:#7a1f1f" font-size="11" font-weight="700">Envoy 가 tls.key 를 못 읽어 기동 실패</text>
  <text x="56" y="384" style="fill:#3a1010" font-family="'JetBrains Mono',monospace" font-size="9.5">ls -lL → -rw-r----- root root</text>

  <text x="40" y="432" fill="#e8e4df" font-size="10.5">권한을 제한(0640)했더니 프로세스가 소유자도</text>
  <text x="40" y="448" fill="#e8e4df" font-size="10.5">그룹도 아니라 기타 칸으로 떨어졌다.</text>

  <!-- 오른쪽: fsGroup 있음 (성공) -->
  <rect x="486" y="140" width="430" height="316" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="502" y="166" fill="#66bb6a" font-size="14" font-weight="700">fsGroup: 2000 — 그룹 칸이 매칭돼 성공</text>

  <!-- 프로세스 (보충그룹 추가) -->
  <rect x="502" y="182" width="180" height="70" rx="6" fill="#cdeccf" stroke="rgb(42,37,32)"/>
  <text x="592" y="204" style="fill:#14521d" font-size="11.5" font-weight="700" text-anchor="middle">프로세스 (Envoy)</text>
  <text x="592" y="224" style="fill:#14521d" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">uid=1000 gid=1000</text>
  <text x="592" y="240" style="fill:#14521d" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" font-weight="700">groups=1000,2000</text>
  <!-- 파일 (그룹 바뀜) -->
  <rect x="720" y="182" width="180" height="70" rx="6" fill="#cdeccf" stroke="rgb(42,37,32)"/>
  <text x="810" y="204" style="fill:#14521d" font-size="11.5" font-weight="700" text-anchor="middle">tls.key (0640)</text>
  <text x="810" y="224" style="fill:#14521d" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">소유자 root (0)</text>
  <text x="810" y="240" style="fill:#14521d" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" font-weight="700">그룹 2000 로 바뀜</text>

  <rect x="502" y="270" width="398" height="130" rx="6" fill="#cdeccf" stroke="rgb(42,37,32)"/>
  <text x="518" y="292" style="fill:#14521d" font-size="11" font-weight="700">fsGroup 이 두 가지를 동시에 한다:</text>
  <text x="518" y="313" style="fill:#14521d" font-size="10.5">① 파일 그룹 소유권을 gid 2000 으로 바꾸고</text>
  <text x="518" y="332" style="fill:#14521d" font-size="10.5">② 프로세스를 2000 의 <tspan font-weight="700">보충 그룹 멤버</tspan>로 넣는다</text>
  <text x="518" y="356" style="fill:#14521d" font-size="11" font-weight="700">→ 그룹 칸 매칭 성립 (2000 ∈ {1000,2000})</text>
  <text x="518" y="378" style="fill:#14521d" font-size="11" font-weight="700">그룹 칸 r-- 로 읽기 성공</text>
  <text x="518" y="398" style="fill:#14521d" font-family="'JetBrains Mono',monospace" font-size="9.5">ls -lL → -rw-r----- root 2000</text>

  <text x="502" y="432" fill="#e8e4df" font-size="10.5">주 그룹(gid 1000)은 그대로 두고 보충 그룹(2000)만</text>
  <text x="502" y="448" fill="#e8e4df" font-size="10.5">더한다. 사용자 소유권(root)은 못 바꾼다 — 그룹만.</text>

  <text x="30" y="480" fill="#e8e4df" font-size="11">runAsUser·runAsGroup 은 <tspan font-weight="700" fill="rgb(212,168,83)">프로세스 신분</tspan>을, fsGroup 은 <tspan font-weight="700" fill="#66bb6a">파일의 그룹 소유권</tspan>을 바꾼다 — 방향이 다르다. root = uid·gid 0.</text>
</svg>

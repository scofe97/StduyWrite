<svg viewBox="0 0 900 500" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Deployment → ReplicaSet → Pod 3층 계층 — 이름 해시가 그대로 구조를 드러낸다</title>
  <desc>kubectl create deployment 한 줄이 3층 오브젝트를 만든다. Deployment(원하는 상태 선언)가 ReplicaSet(복제본 수 유지)을 만들고, ReplicaSet이 Pod(실제 실행 단위)들을 만든다. Pod 이름 kiada-7bc9cd6878-bhgc5는 이 계층을 그대로 담는다 — kiada는 Deployment명, 7bc9cd6878은 ReplicaSet 해시, bhgc5는 Pod 해시다. Deployment는 원하는 상태를, ReplicaSet은 개수 유지를, Pod는 컨테이너 실행을 각각 책임진다.</desc>
  <defs>
    <style>
      .title  { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub    { font-size: 11px; fill: rgb(138,133,128); }
      .zlabel { font-size: 12.5px; font-weight: 700; fill: #e8e4df; }
      .layer  { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .role   { font-size: 10.5px; font-weight: 600; fill: #1a1a1a; }
      .nm     { font-size: 12px; font-weight: 800; fill: #e8e4df; font-family: 'JetBrains Mono', monospace; }
      .note   { font-size: 10.5px; fill: #e8e4df; }
      .hash   { font-size: 11px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Deployment → ReplicaSet → Pod — 3층 계층</text>
  <text x="24" y="48" class="sub">kubectl create deployment 한 줄이 세 층을 만듭니다. 각 층은 다른 일을 책임지고, 그 구조가 Pod 이름에 그대로 박힙니다.</text>

  <!-- 층1: Deployment -->
  <rect x="40" y="70" width="500" height="70" rx="10" fill="rgb(212,168,83)"/>
  <text x="60" y="98" class="layer">Deployment</text>
  <text x="60" y="120" class="role">"kiada 이미지 컨테이너가 N개 돌아야 한다" — 원하는 상태 선언 + 롤링 업데이트 관리</text>
  <rect x="556" y="70" width="304" height="70" rx="10" fill="rgb(24,28,32)" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="572" y="94" class="note" style="fill:rgb(212,168,83);font-weight:800">책임: 원하는 상태</text>
  <text x="572" y="114" class="note">이미지·복제본 수·업데이트 전략을 선언</text>
  <text x="572" y="131" class="note">실제 실행은 아래에 위임</text>

  <line x1="290" y1="140" x2="290" y2="168" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="300" y="160" class="sub">만든다</text>

  <!-- 층2: ReplicaSet -->
  <rect x="40" y="170" width="500" height="70" rx="10" fill="#5b9bd5"/>
  <text x="60" y="198" class="layer" style="fill:#e8e4df">ReplicaSet</text>
  <text x="60" y="220" class="role" style="fill:#e8e4df">"Pod가 항상 N개 있어야 한다" — 개수를 감시하고 부족하면 새로 만듦</text>
  <rect x="556" y="170" width="304" height="70" rx="10" fill="rgb(24,28,32)" stroke="#5b9bd5" stroke-width="1.3"/>
  <text x="572" y="194" class="note" style="fill:#8fc0ea;font-weight:800">책임: 개수 유지</text>
  <text x="572" y="214" class="note">Pod가 죽으면 즉시 새 Pod로 대체</text>
  <text x="572" y="231" class="note">스케일(replicas=3)이 여기에 걸림</text>

  <line x1="290" y1="240" x2="290" y2="268" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="300" y="260" class="sub">만든다</text>

  <!-- 층3: Pod들 -->
  <rect x="40" y="270" width="500" height="86" rx="10" fill="#66bb6a"/>
  <text x="60" y="296" class="layer">Pod × N</text>
  <text x="60" y="316" class="role">컨테이너를 실제로 실행하는 최소 단위 — 자기 IP·호스트명을 가진 격리된 프로세스</text>
  <rect x="60" y="326" width="145" height="22" rx="4" fill="#e6f7e7"/>
  <text x="132" y="341" class="hash" fill="#14521d" text-anchor="middle">kiada-...-bhgc5</text>
  <rect x="213" y="326" width="145" height="22" rx="4" fill="#e6f7e7"/>
  <text x="285" y="341" class="hash" fill="#14521d" text-anchor="middle">kiada-...-8phwt</text>
  <rect x="366" y="326" width="145" height="22" rx="4" fill="#e6f7e7"/>
  <text x="438" y="341" class="hash" fill="#14521d" text-anchor="middle">kiada-...-2vm7s</text>
  <rect x="556" y="270" width="304" height="86" rx="10" fill="rgb(24,28,32)" stroke="#66bb6a" stroke-width="1.3"/>
  <text x="572" y="294" class="note" style="fill:#7bc47f;font-weight:800">책임: 컨테이너 실행</text>
  <text x="572" y="314" class="note">각 Pod = 자기 IP + 호스트명(=Pod명)</text>
  <text x="572" y="331" class="note">휘발성 — 죽으면 새 이름·새 IP로 교체</text>
  <text x="572" y="348" class="note">노드에 분산 배치됨</text>

  <!-- 이름 분해 -->
  <text x="24" y="392" class="zlabel">Pod 이름이 곧 계층 지도입니다</text>
  <rect x="40" y="404" width="820" height="76" rx="10" fill="rgb(24,28,32)" stroke="rgb(42,37,32)" stroke-width="1.2"/>
  <text x="120" y="440" class="hash" fill="rgb(212,168,83)" text-anchor="middle" font-size="15">kiada</text>
  <text x="330" y="440" class="hash" fill="#8fc0ea" text-anchor="middle" font-size="15">7bc9cd6878</text>
  <text x="560" y="440" class="hash" fill="#7bc47f" text-anchor="middle" font-size="15">bhgc5</text>
  <text x="230" y="440" class="hash" fill="rgb(138,133,128)" text-anchor="middle" font-size="15">-</text>
  <text x="445" y="440" class="hash" fill="rgb(138,133,128)" text-anchor="middle" font-size="15">-</text>
  <text x="120" y="462" class="note" text-anchor="middle" style="fill:rgb(212,168,83)">Deployment명</text>
  <text x="330" y="462" class="note" text-anchor="middle" style="fill:#8fc0ea">ReplicaSet 해시</text>
  <text x="560" y="462" class="note" text-anchor="middle" style="fill:#7bc47f">Pod 해시</text>
  <text x="700" y="447" class="note" style="fill:#e8e4df">← 오늘 실측한 실제 Pod 이름</text>
</svg>

<title id="dt">프록시의 판단이 어디까지 살아남는가</title><desc id="dd">프록시가 요청을 파싱해 '이건 카나리로'라고 정했다. 그 판단이 목적지에 그대로 닿는지는 다음 홉이 그 판단을 읽을 수 있느냐에 달렸다.</desc>
<rect width="1160" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 12-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프록시의 판단이 어디까지 살아남는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">카나리로 보내기로 정한 요청 하나</text>
<rect x="24" y="100" width="1112" height="216" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="120" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">cluster IP 를 거칠 때</text>
<rect x="60" y="174" width="200" height="84" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="160" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">L7 프록시</text>
<text x="160" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">카나리로 보낸다</text>
<rect x="350" y="174" width="240" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<text x="470" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">노드 커널</text>
<text x="470" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">L4 — 판단을 읽지 못한다</text>
<path d="M 266 216 L 344 216" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M 596 216 L 674 216" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="680" y="174" width="220" height="84" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="790" y="214" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">아무 파드</text>
<text x="790" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">확률로 다시 고른다</text>
<rect x="910.0" y="203" width="180" height="26" rx="5" fill="#F0616D14" stroke="#F0616D" stroke-width="1.0"/>
<text x="1000" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">판단이 버려진다</text>
<rect x="24" y="340" width="1112" height="216" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">파드로 직접 보낼 때</text>
<rect x="60" y="414" width="200" height="84" rx="6" fill="#161B22" stroke="#F08A59" stroke-width="1.1"/>
<text x="160" y="454" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">L7 프록시</text>
<text x="160" y="472" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">카나리로 보낸다</text>
<path d="M 266 456 L 674 456" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="470" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">EndpointSlice 로 이미 아는 주소</text>
<rect x="680" y="414" width="220" height="84" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="790" y="454" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">카나리 파드</text>
<text x="790" y="472" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">10.244.3.4:8080</text>
<rect x="910.0" y="442" width="180" height="28" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="1000" y="461" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">판단이 닿는다</text>
<text x="24" y="588" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">부하 분산의 주인이 커널에서 프록시로 옮겨 오면 라운드로빈·쿠키 어피니티·재시도·정밀 카나리가 함께 따라온다. 파드 개수로 비율을 맞출 필요도 없어진다.</text>
<line x1="12" y1="608" x2="1112" y2="608" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="630" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="620" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">프록시의 판단</text>
<rect x="235" y="620" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="257" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">닿는 길</text>
<rect x="331" y="620" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="353" y="630" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">끊기는 지점</text>
</svg>
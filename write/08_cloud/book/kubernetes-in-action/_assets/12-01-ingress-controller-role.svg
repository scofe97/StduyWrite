<svg viewBox="0 0 960 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Ingress 컨트롤러의 역할</title>
  <desc>Ingress 컨트롤러는 쿠버네티스 API의 Ingress·Service·EndpointSlice 오브젝트를 감시(monitors)하고, 변경을 감지하면 리버스 프록시를 설정(configures)한다. API 오브젝트가 외부 클라이언트에게 서비스 접근을 제공하는 정보를 담는다.</desc>
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .api   { font-size: 12px; font-weight: 700; fill: #0d0d0d; }
      .ctl   { font-size: 12px; font-weight: 800; fill: #0d0d0d; }
      .act   { font-size: 12px; font-weight: 800; fill: #0d0d0d; }
      .note  { font-size: 11px; fill: #e8e4df; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="320" fill="#0d0d0d"/>
  <text x="24" y="30" class="title">Ingress 컨트롤러 — 감시하고 설정합니다</text>
  <text x="24" y="50" class="sub">API의 Ingress·Service·EndpointSlice 변경을 감지할 때마다 리버스 프록시를 재설정합니다</text>

  <!-- Kubernetes API box -->
  <rect x="40" y="110" width="470" height="140" rx="10" fill="rgb(24,28,32)" stroke="rgb(138,133,128)" stroke-width="1.3"/>
  <text x="60" y="132" class="note" fill="rgb(138,133,128)">Kubernetes API</text>
  <rect x="60" y="150" width="110" height="70" rx="8" fill="rgb(150,130,220)"/>
  <text x="115" y="190" class="api" text-anchor="middle">Ingress</text>
  <rect x="190" y="150" width="140" height="70" rx="8" fill="rgb(230,230,230)"/>
  <text x="260" y="190" class="api" text-anchor="middle">Services</text>
  <rect x="350" y="150" width="140" height="70" rx="8" fill="rgb(230,230,230)"/>
  <text x="420" y="185" class="api" text-anchor="middle">Endpoint-</text>
  <text x="420" y="202" class="api" text-anchor="middle">Slices</text>
  <line x1="170" y1="185" x2="188" y2="185" stroke="rgb(60,60,60)" stroke-width="2"/>

  <!-- monitors arrow (API <- controller) -->
  <polygon points="620,165 540,165 540,150 510,180 540,210 540,195 620,195" fill="rgb(212,168,83)"/>
  <text x="560" y="185" class="act" text-anchor="middle">monitors</text>

  <!-- controller -->
  <rect x="620" y="140" width="140" height="80" rx="8" fill="rgb(150,130,220)"/>
  <text x="690" y="176" class="ctl" text-anchor="middle" fill="#0d0d0d">Ingress</text>
  <text x="690" y="194" class="ctl" text-anchor="middle" fill="#0d0d0d">controller</text>

  <!-- configures arrow (controller -> proxy) -->
  <polygon points="770,165 850,165 850,150 880,180 850,210 850,195 770,195" fill="rgb(212,168,83)"/>
  <text x="810" y="185" class="act" text-anchor="middle">configures</text>

  <!-- reverse proxy -->
  <rect x="800" y="240" width="140" height="60" rx="8" fill="rgb(150,130,220)" opacity="0"/>
  <rect x="800" y="235" width="150" height="60" rx="8" fill="rgb(180,165,230)"/>
  <text x="875" y="270" class="ctl" text-anchor="middle">Reverse proxy</text>

  <text x="120" y="288" class="note" text-anchor="middle">외부 클라이언트에게 서비스 접근을</text>
  <text x="120" y="304" class="note" text-anchor="middle">제공하는 정보가 여기에 담깁니다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 674" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">Service 는 Pod 이름을 하나도 모른다</title><desc id="dd">selector 에 적힌 라벨을 가진 Pod 만 트래픽을 받는다. 나중에 뜬 Pod 도 그 라벨을 갖자마자 자동으로 편입되고, 라벨이 다르면 같은 namespace 에 있어도 제외된다.</desc>
<rect width="1000" height="674" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">KUBERNETES IN ACTION · 07-02</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Service 는 Pod 이름을 하나도 모른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 메커니즘을 Deployment 와 nodeSelector 도 그대로 쓴다</text>
<rect x="24" y="104" width="952" height="514" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="38" y="124" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">이름으로 걸지 않으므로 멤버가 바뀌어도 selector 를 고칠 일이 없다</text>
<rect x="40" y="270" width="240" height="140" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="160" y="306" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">Service</text>
<text x="160" y="336" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#5E6B7E">selector:</text>
<text x="160" y="358" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">app=payment</text>
<text x="160" y="386" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">이름은 적혀 있지 않다</text>
<rect x="460" y="208" width="400" height="76" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="480" y="238" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">payment-1</text>
<text x="480" y="262" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">app=payment</text>
<text x="840" y="251" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">라벨이 맞는다</text>
<rect x="460" y="302" width="400" height="76" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="480" y="332" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">payment-2</text>
<text x="480" y="356" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">app=payment</text>
<text x="840" y="345" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">라벨이 맞는다</text>
<rect x="460" y="396" width="400" height="76" rx="6" fill="#161B22" stroke="#F0616D" stroke-width="1.1"/>
<text x="480" y="426" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F0616D">order-1</text>
<text x="480" y="450" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">app=order</text>
<text x="840" y="439" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">라벨이 다르다 → 제외</text>
<rect x="460" y="490" width="400" height="76" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="480" y="520" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#3FB98C">payment-3</text>
<text x="480" y="544" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">app=payment</text>
<text x="840" y="533" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#5E6B7E">나중에 떴지만 자동 편입</text>
<path d="M 286 340 L 400 340" fill="none" stroke="#F08A59" stroke-width="1.8"/>
<path d="M 400 246 L 400 528" fill="none" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 400 246 L 450 246" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 400 340 L 450 340" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<path d="M 400 434 L 450 434" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)"/>
<path d="M 400 528 L 450 528" fill="none" stroke="#3FB98C" stroke-width="1.5" marker-end="url(#ok)"/>
<text x="36" y="594" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">라벨만 맞으면 이름을 몰라도 편입된다 — 그것이 Pod 를 갈아 끼워도 Service 를 안 고쳐도 되는 이유다.</text>
<line x1="12" y1="634" x2="952" y2="634" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="656" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="646" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="656" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">selector 에 걸린 Pod</text>
<rect x="365" y="646" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="387" y="656" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">라벨이 달라 제외된 Pod</text>
<rect x="591" y="646" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="613" y="656" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">거는 쪽</text>
</svg>
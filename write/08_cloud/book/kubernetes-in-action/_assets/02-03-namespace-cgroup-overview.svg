<svg viewBox="0 0 980 620" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>리눅스 컨테이너 격리 전체도 — 네임스페이스(볼 수 있는 것)와 cgroup(쓸 수 있는 양)</title>
  <desc>하나의 호스트 커널 위에 두 컨테이너가 프로세스로 돈다. 각 컨테이너는 uts·pid·net 네임스페이스를 서로 다른 번호로 가져 호스트명·PID·네트워크가 격리되고, user·time 네임스페이스는 같은 번호로 호스트와 공유한다. 네임스페이스가 '무엇을 볼 수 있나'를 나눈다면, cgroup은 각 컨테이너가 '얼마나 쓸 수 있나'(메모리·CPU)를 커널이 강제하도록 제한한다.</desc>
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 800; fill: #e8e4df; }
      .sub   { font-size: 11px; fill: rgb(138,133,128); }
      .zlabel{ font-size: 12.5px; font-weight: 800; fill: rgb(212,168,83); }
      .cname { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .nslbl { font-size: 10px; font-weight: 700; fill: #0d0d0d; }
      .nsnum { font-size: 9px; font-weight: 700; fill: #1a1a1a; font-family: 'JetBrains Mono', monospace; }
      .kern  { font-size: 13px; font-weight: 800; fill: #0d0d0d; }
      .note  { font-size: 10.5px; fill: #e8e4df; }
      .cnt   { font-size: 11px; font-weight: 800; fill: rgb(212,168,83); }
      .iso   { font-size: 9.5px; font-weight: 800; fill: #7a1f1f; }
      .shr   { font-size: 9.5px; font-weight: 800; fill: #14521d; }
      .cg    { font-size: 10px; font-weight: 700; fill: #0d0d0d; font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="620" fill="#0d0d0d"/>
  <text x="24" y="32" class="title">리눅스 컨테이너 격리 전체도 — 네임스페이스와 cgroup</text>
  <text x="24" y="52" class="sub">컨테이너는 VM처럼 감싸인 게 아니라, 여러 네임스페이스가 배정된 "프로세스"입니다. 일부는 격리하고(번호 다름) 일부는 공유합니다(번호 같음).</text>

  <!-- ===== 두 컨테이너 (위) ===== -->
  <text x="24" y="86" class="zlabel">컨테이너 = 네임스페이스가 배정된 프로세스 (같은 커널 위에서 돎)</text>

  <!-- kiada 컨테이너 -->
  <rect x="40" y="98" width="420" height="248" rx="12" fill="rgb(24,28,32)" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="60" y="122" class="zlabel">컨테이너 kiada</text>
  <text x="60" y="140" class="note" font-size="10">프로세스: node app.js</text>

  <!-- kiada 격리 ns (uts/pid/net) — 빨강 계열, 번호 다름 강조 -->
  <rect x="60" y="152" width="180" height="42" rx="6" fill="#f2d4d4"/>
  <text x="70" y="169" class="nslbl">uts (호스트명)</text>
  <text x="70" y="186" class="nsnum">[4026534383]</text>
  <rect x="250" y="152" width="190" height="42" rx="6" fill="#f2d4d4"/>
  <text x="260" y="169" class="nslbl">pid (프로세스 번호)</text>
  <text x="260" y="186" class="nsnum">[4026534385] → 안에선 PID 1</text>
  <rect x="60" y="200" width="380" height="38" rx="6" fill="#f2d4d4"/>
  <text x="70" y="217" class="nslbl">net (네트워크·IP·포트)</text>
  <text x="70" y="231" class="nsnum">[4026534387] → 자기 eth0</text>
  <text x="250" y="223" class="iso" text-anchor="start">← 컨테이너마다 다름 = 격리</text>

  <!-- kiada 공유 ns (user/time) — 초록 계열, 번호 같음 -->
  <rect x="60" y="244" width="180" height="40" rx="6" fill="#cdeccf"/>
  <text x="70" y="261" class="nslbl">user (UID/GID)</text>
  <text x="70" y="277" class="nsnum">[4026531837]</text>
  <rect x="250" y="244" width="190" height="40" rx="6" fill="#cdeccf"/>
  <text x="260" y="261" class="nslbl">time (시스템 시계)</text>
  <text x="260" y="277" class="nsnum">[4026531834]</text>
  <text x="60" y="303" class="shr" style="fill:#7bc47f">↑ user·time = 호스트와 같은 번호 = 공유 (Docker 기본은 안 나눔)</text>

  <!-- kiada cgroup -->
  <rect x="60" y="312" width="380" height="26" rx="5" fill="rgb(212,168,83)"/>
  <text x="70" y="329" class="cg">cgroup: memory.max = 104857600 (100MB) — 커널이 강제</text>

  <!-- web1 컨테이너 -->
  <rect x="500" y="98" width="440" height="248" rx="12" fill="rgb(24,28,32)" stroke="rgb(138,133,128)" stroke-width="1.4"/>
  <text x="520" y="122" class="zlabel">컨테이너 web1</text>
  <text x="520" y="140" class="note" font-size="10">프로세스: nginx</text>

  <rect x="520" y="152" width="185" height="42" rx="6" fill="#f2d4d4"/>
  <text x="530" y="169" class="nslbl">uts (호스트명)</text>
  <text x="530" y="186" class="nsnum">[4026534113] ← 다름!</text>
  <rect x="715" y="152" width="205" height="42" rx="6" fill="#f2d4d4"/>
  <text x="725" y="169" class="nslbl">pid (프로세스 번호)</text>
  <text x="725" y="186" class="nsnum">[4026534115] ← 다름!</text>
  <rect x="520" y="200" width="400" height="38" rx="6" fill="#f2d4d4"/>
  <text x="530" y="217" class="nslbl">net (네트워크·IP·포트)</text>
  <text x="530" y="231" class="nsnum">[4026534117] ← 다름! 자기 eth0</text>

  <rect x="520" y="244" width="185" height="40" rx="6" fill="#cdeccf"/>
  <text x="530" y="261" class="nslbl">user (UID/GID)</text>
  <text x="530" y="277" class="nsnum">[4026531837] ← 같음</text>
  <rect x="715" y="244" width="205" height="40" rx="6" fill="#cdeccf"/>
  <text x="725" y="261" class="nslbl">time (시스템 시계)</text>
  <text x="725" y="277" class="nsnum">[4026531834] ← 같음</text>
  <text x="520" y="303" class="shr" style="fill:#7bc47f">↑ kiada와 같은 번호 → 같은 user·time 네임스페이스 공유</text>

  <rect x="520" y="312" width="400" height="26" rx="5" fill="rgb(102,187,106)"/>
  <text x="530" y="329" class="cg">cgroup: 각 컨테이너가 독립 한도 — 서로의 자원 못 가로챔</text>

  <!-- ===== 공유 커널 (아래) ===== -->
  <text x="24" y="378" class="zlabel">공유 — 하나의 호스트 커널 (모든 컨테이너가 같은 커널을 씀)</text>
  <rect x="40" y="390" width="900" height="72" rx="10" fill="rgb(230,230,230)"/>
  <text x="490" y="416" class="kern" text-anchor="middle">호스트 리눅스 커널 (단 하나)</text>
  <text x="490" y="440" class="nslbl" text-anchor="middle">네임스페이스·cgroup을 제공하는 주체 · 모든 컨테이너의 syscall을 직접 처리 · CPU에 직접 닿음</text>

  <!-- 두 컨테이너 → 커널 화살표 -->
  <line x1="250" y1="346" x2="300" y2="388" stroke="rgb(138,133,128)" stroke-width="1.6"/>
  <line x1="720" y1="346" x2="680" y2="388" stroke="rgb(138,133,128)" stroke-width="1.6"/>

  <!-- ===== 하단 요약 (두 축) ===== -->
  <rect x="40" y="482" width="440" height="118" rx="8" fill="rgb(24,28,32)" stroke="#7a1f1f" stroke-width="1.3"/>
  <text x="60" y="506" class="cnt" style="fill:#e07a7a">네임스페이스 — "무엇을 볼 수 있나"</text>
  <text x="60" y="528" class="note">• /proc/&lt;pid&gt;/ns/* 로 확인 (uts·pid·net·mnt·ipc·user·time·cgroup)</text>
  <text x="60" y="548" class="note">• 번호가 다르면 격리, 같으면 공유</text>
  <text x="60" y="568" class="note">• uts·pid·net은 격리, user·time은 호스트와 공유</text>
  <text x="60" y="588" class="note">• "컨테이너 = 네임스페이스 배정된 프로세스"의 실체</text>

  <rect x="500" y="482" width="440" height="118" rx="8" fill="rgb(24,28,32)" stroke="#14521d" stroke-width="1.3"/>
  <text x="520" y="506" class="cnt" style="fill:#7bc47f">cgroup — "얼마나 쓸 수 있나"</text>
  <text x="520" y="528" class="note">• /sys/fs/cgroup/* 로 확인 (memory.max·cpu.max 등)</text>
  <text x="520" y="548" class="note">• docker --memory=100m → memory.max=104857600 에 박힘</text>
  <text x="520" y="568" class="note">• 옵션은 표시가 아니라 커널이 강제하는 실제 한도</text>
  <text x="520" y="588" class="note">• 한 컨테이너가 CPU·메모리를 독차지하지 못하게 막음</text>
</svg>

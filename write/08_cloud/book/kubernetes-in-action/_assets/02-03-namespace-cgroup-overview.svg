<title id="dt">번호가 다르면 격리, 같으면 공유다</title><desc id="dd">같은 커널 위에서 도는 두 컨테이너의 네임스페이스 번호를 나란히 놓으면 무엇이 갈리고 무엇이 겹치는지가 그대로 드러난다. 자원량은 별개 축이라 cgroup 이 따로 강제한다.</desc>

<title id="dt">같은 Node 26 이 올라가는 세 베이스 이미지</title><desc id="dd">node:latest, node:26-alpine, distroless nodejs26 세 이미지를 셸, 패키지 관리자, 컴파일러와 git과 curl, 크기의 네 행으로 비교한 도식이다. 왼쪽에서 오른쪽으로 갈수록 들어 있는 도구가 줄어들고, 크기는 alpine 과 distroless 가 거의 같다.</desc>

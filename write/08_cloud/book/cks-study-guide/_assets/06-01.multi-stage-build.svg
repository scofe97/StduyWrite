<title id="dt">멀티 스테이지 빌드가 남기는 것</title><desc id="dd">왼쪽 build 단계에서 테스트와 빌드를 마치고, COPY --from=build 한 줄로 실행 파일 하나만 오른쪽 실행 단계로 복사하는 도식이다. 아래 막대는 단일 단계 517MB, alpine 실행 단계 27MB, distroless 실행 단계 19.8MB를 같은 비율로 보여 준다.</desc>
<rect width="880" height="448" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 06-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">멀티 스테이지 빌드가 남기는 것</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">빌드 도구는 앞 단계에 두고 실행 파일만 복사하면 최종 이미지가 517MB 에서 27MB 이하로 줄어듭니다</text>
<rect x="24" y="96" width="330" height="150" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="38" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">build 단계</text>
<text x="38" y="142" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">golang:1.27.3-alpine3.24</text>
<text x="38" y="174" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">go test -v</text>
<text x="38" y="196" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">go build -o /out/go-sample-app</text>
<rect x="48.5" y="214" width="135.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="116" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">최종 이미지에서 빠짐</text>
<rect x="526" y="96" width="330" height="150" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="540" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">실행 단계</text>
<text x="540" y="142" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">gcr.io/distroless/static-debian13:nonroot</text>
<text x="540" y="174" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">/app/go-sample-app</text>
<text x="540" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">실행 파일 한 개</text>
<rect x="540.0" y="214" width="124.0" height="20" rx="4" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="602" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">최종 이미지에 남음</text>
<path d="M 356 171 L 524 171" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<rect x="375.03" y="142" width="129.94" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="440.0" y="156" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">COPY --from=build</text>
<text x="24" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">최종 이미지 크기 (docker image inspect, linux/arm64)</text>
<text x="24" y="316" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">단일 단계 · golang:1.27.3-alpine3.24</text>
<rect x="292" y="302" width="491.5" height="20" rx="3" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>

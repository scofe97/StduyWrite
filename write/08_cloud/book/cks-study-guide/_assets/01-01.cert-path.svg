<title id="dt">CNCF 쿠버네티스 자격증 선행 관계</title><desc id="dd">KCNA와 KCSA는 입문 객관식이고 CKAD·CKA·CKS는 실기 시험이며, 다섯 자격증 가운데 CKS만 CKA 합격을 선행 조건으로 요구함을 보인 의존 그래프다.</desc>
<rect width="880" height="356" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 01-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">CNCF 쿠버네티스 자격증 선행 관계</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표는 필수 선행 조건만 가리키며, 입문·실기 4종은 선행 없이 바로 응시할 수 있습니다</text>
<text x="128.0" y="108" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">입문 · 객관식</text>
<text x="128.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">선행 조건 없음</text>
<text x="388.0" y="108" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">실기 · 2시간</text>
<text x="388.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">선행 조건 없음</text>

<text x="119.0" y="162" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">kubectl</text>
<text x="119.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">create secret</text>
<rect x="236" y="130" width="190" height="76" rx="6" fill="#5E6B7E14" stroke="#5E6B7E" stroke-width="1.1"/>
<text x="331.0" y="162" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">kube-apiserver</text>
<text x="331.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">EncryptionConfiguration</text>

<text x="24" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">컨트롤 플레인 노드에서 etcd 를 직접 읽을 때 (암호화를 켠 뒤)</text>

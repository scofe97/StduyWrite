<title id="dt">Secret 이 etcd 에 쓰이고 읽히는 길</title><desc id="dd">kubectl 이 보낸 Secret 을 kube-apiserver 가 EncryptionConfiguration 의 첫 provider 로 암호화해 etcd 에 쓰고, 읽을 때는 접두어가 가리키는 키로 복호화하는 두 레인과, etcdctl 로 etcd 를 직접 읽으면 접두어와 암호문만 보이는 레인을 그린 도식이다.</desc>
<rect width="880" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 05-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Secret 이 etcd 에 쓰이고 읽히는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">키는 API 서버 설정 파일에만 있으므로 etcd 데이터만 손에 넣어서는 평문을 얻지 못합니다</text>
<rect x="12" y="96" width="856" height="120" rx="8" fill="#5E6B7E0A" stroke="#5E6B7E" stroke-width="0.9"/>
<text x="24" y="116" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">쓰기</text>

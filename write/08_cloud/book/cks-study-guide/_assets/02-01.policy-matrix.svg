<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">정책을 얹을수록 열린 길이 줄고, frontend 한 곳만 다시 열립니다</text>

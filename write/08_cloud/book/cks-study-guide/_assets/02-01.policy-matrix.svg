<title id="dt">정책 단계별 backend 접근 가능 여부</title><desc id="dd">g04 네임스페이스의 backend Pod 로 향하는 TCP 3000 호출이 정책 없음, default-deny-ingress, default-deny-ingress 에 backend-ingress 를 더한 세 단계에서 허용되는지 차단되는지 비교한 행렬이다.</desc>
<rect width="932" height="372" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 02-01 §1</text>

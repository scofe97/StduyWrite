<title id="dt">Dashboard 는 토큰을 넘기고 API 서버가 판정한다</title><desc id="dd">브라우저가 붙여 넣은 observer-user 토큰을 Dashboard 가 API 서버에 그대로 전달한다. cluster-observer ClusterRole 이 허용한 Deployment 목록은 200 으로, 허용하지 않은 Pod 목록은 403 으로 돌아온다.</desc>

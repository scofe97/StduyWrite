<title id="dt">태그와 다이제스트가 이미지를 가리키는 방식</title><desc id="dd">위 레인은 태그가 레지스트리에서 다른 이미지로 옮겨질 수 있어 같은 이름이 날마다 다른 내용을 내려받게 하는 흐름이고, 아래 레인은 다이제스트가 파드의 image 필드에서 컨테이너 런타임을 거쳐 레지스트리에 해시 그대로 전달되고 일치하는 이미지가 없으면 ImagePullBackOff 로 끝나는 흐름이다.</desc>
<rect width="880" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 06-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">태그와 다이제스트가 이미지를 가리키는 방식</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">태그는 옮겨지는 이름표이고, 다이제스트는 내용에서 계산한 해시라 옮겨지지 않습니다</text>

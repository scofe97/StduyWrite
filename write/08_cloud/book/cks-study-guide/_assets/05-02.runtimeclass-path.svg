<title id="dt">파드에서 gVisor 샌드박스까지</title><desc id="dd">파드의 runtimeClassName 이 RuntimeClass 의 handler 를 가리키고, 그 이름이 워커 노드 containerd 설정의 runsc 런타임을 거쳐 gVisor 가 컨테이너를 실행하며, 컨테이너와 호스트 커널 사이에 gVisor 가 놓이는 흐름을 두 레인으로 그린 도식이다.</desc>
<rect width="880" height="424" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 05-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">파드에서 gVisor 샌드박스까지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">파드는 이름만 적고, 이름이 가리키는 런타임은 노드에 먼저 설정돼 있어야 합니다</text>

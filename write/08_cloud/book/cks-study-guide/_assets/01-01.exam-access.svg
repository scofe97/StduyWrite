<title id="dt">CKS 시험 환경 접속과 과제 수행 경로</title><desc id="dd">응시자가 PSI Secure Browser와 Linux 원격 데스크톱을 거쳐 base 노드 터미널에서 ssh &lt;nodename&gt; 으로 지정 호스트에 접속하고, 과제 뒤 base 로 돌아오는 흐름도다.</desc>
<rect width="920" height="344" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CKS STUDY GUIDE · 01-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">CKS 시험 환경 접속과 과제 수행 경로</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">base 노드에는 도구가 없으므로 반드시 지정 호스트로 ssh 접속해 풀고, 다음 과제 전에 base 로 돌아옵니다</text>
<rect x="16" y="120" width="176" height="64" rx="20" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="104" y="148.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">PSI Secure Browser</text>

<title id="dt">Falco 가 시스템 콜 이벤트를 경보로 바꾸는 길과 규칙 파일이 쌓이는 순서</title><desc id="dd">위 레인은 컨테이너 프로세스의 시스템 콜을 드라이버가 모으고 규칙 엔진이 규칙의 조건식과 맞대어 보고 맞으면 출력 채널로 경보를 내보내는 흐름이고, 아래 레인은 rules_files 에 적힌 순서대로 falco_rules.yaml, falco-sandbox_rules.yaml, falco_rules.local.yaml 이 적재되며 뒤 파일의 override 가 앞 파일의 규칙을 고치는 흐름이다.</desc>

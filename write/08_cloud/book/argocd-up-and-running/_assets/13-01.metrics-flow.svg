<title id="dt">메트릭이 Grafana 에 닿기까지</title><desc id="dd">왼쪽의 대표 구성요소 네 곳이 각자 포트로 /metrics 를 내보낸다(알림 컨트롤러 등 나머지도 같은 방식). ServiceMonitor 는 라벨로 그 Service 들을 골라 Prometheus 에 알리고, Prometheus 가 주기적으로 긁어 저장한다. Grafana 는 Prometheus 를 조회해 Argo CD 대시보드를 그린다.</desc>

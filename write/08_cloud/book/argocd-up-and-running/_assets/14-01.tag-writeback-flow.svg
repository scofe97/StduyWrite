<title id="dt">새 이미지 태그가 Application 에 반영되는 두 길</title><desc id="dd">Image Updater 는 레지스트리에서 새 태그를 찾고 ImageUpdater 리소스에 적은 전략으로 고른다. argocd 방식은 Application 의 helm 매개변수를 직접 고치고, git 방식은 추적 브랜치에 커밋한다. argocd 방식은 바뀐 Application 매개변수를, git 방식은 새 Git 커밋을 Argo CD 가 받아 동기화해 Deployment 의 이미지를 바꾼다.</desc>
<rect width="880" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 14-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">새 이미지 태그가 Application 에 반영되는 두 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">태그 감시는 Image Updater 가, 동기화는 Argo CD 가 맡습니다</text>

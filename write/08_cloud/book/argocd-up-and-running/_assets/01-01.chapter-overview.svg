<title id="dt">Argo CD 는 Git 과 클러스터를 주기마다 비교해 어긋남을 막는다</title><desc id="dd">01-01 편의 전체 지도. 첫 행은 손으로 고친 클러스터의 구성 드리프트를 Application 의 Target state 와 Live state 비교로 가려 Synced 와 OutOfSync 로 판정하는 흐름, 둘째 행은 이벤트 기반 CD 를 GitOps 의 셋째·넷째 원칙이 가르고 그 결과가 기본 간격 약 3분(120초에 jitter 를 더함)의 조정 루프로 나타나는 흐름, 셋째 행은 Argo 프로젝트 도구 넷 중 하나인 Argo CD 가 Flux 와 Helm 을 다루는 방식에서 갈려 helm template 으로 차트를 펼치는 흐름을 보인다.</desc>
<rect width="1000" height="424" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 01-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Argo CD 는 Git 과 클러스터를 주기마다 비교해 어긋남을 막는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행은 본문 절, 화살표 라벨은 앞 키워드에서 뒤 키워드로 넘어가는 관계</text>
<rect x="23.18" y="122.0" width="21.64" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="34" y="136.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">§1</text>

<title id="dt">TLS 연결 두 구간과 인증서를 두는 곳</title><desc id="dd">위쪽 줄은 브라우저와 명령줄 도구가 argocd-server 에 연결하는 구간이다. 연결을 받는 쪽(서버)인 argocd-server 는 argocd-server-tls Secret 의 인증서를 내고 연결하는 쪽(클라이언트)은 운영체제 신뢰 저장소로 그 인증서를 믿는다. 아래쪽 줄은 argocd-repo-server 가 Git 서버에 HTTPS 로 연결하는 구간이다. 믿을 인증서는 연결하는 쪽(클라이언트)인 Argo CD 의 argocd-tls-certs-cm 에 호스트 이름별로 넣는다.</desc>
<rect width="880" height="432" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 09-01 §1~2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">TLS 연결 두 구간과 인증서를 두는 곳</text>

<text x="336.0" y="126.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">사용자로 이전</text>
<path d="M 610 136.0 L 748 136.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

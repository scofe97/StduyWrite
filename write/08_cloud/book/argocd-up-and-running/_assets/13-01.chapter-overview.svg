<title id="dt">상태는 메트릭과 알림으로 보고 부하는 복제와 샤딩으로 견딘다</title><desc id="dd">13-01 편의 전체 지도. 첫 행은 구성요소마다 다른 포트의 메트릭을 ServiceMonitor 가 골라 Grafana 대시보드로 보는 길, 둘째 행은 비어 있는 ConfigMap 에 service 와 template 과 trigger 를 적고 annotation 으로 구독하는 알림, 셋째 행은 고가용성 매니페스트가 정한 복제 수와 버려도 되는 Redis 캐시, 넷째 행은 느려지는 원인에 따라 처리기 수를 올리고 클러스터가 많으면 복제 수와 샤딩 설정을 함께 적는 것을 보인다.</desc>
<rect width="1000" height="516" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 13-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">상태는 메트릭과 알림으로 보고 부하는 복제와 샤딩으로 견딘다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행은 본문 절, 화살표 라벨은 앞 키워드에서 뒤 키워드로 넘어가는 관계</text>

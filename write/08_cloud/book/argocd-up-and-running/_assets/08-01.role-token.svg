<title id="dt">프로젝트 역할의 토큰이 통과하는 길</title><desc id="dd">왼쪽의 호출은 프로젝트 역할의 JWT 토큰을 달고 온다. 가운데 칸이 프로젝트의 토큰 목록(status.jwtTokensByRole)에 그 토큰이 남아 있는지 확인하고, 삭제한 토큰이면 곧바로 Unauthenticated 로 거부한다. 남아 있는 토큰은 proj:프로젝트:역할 주체가 되어 그 역할의 policies 와 암묵으로 붙는 projects get 줄과 대조된다. 일치하는 allow 줄이 있으면 허용하고 없으면 PermissionDenied 로 거부한다.</desc>
<rect width="880" height="488" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 08-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로젝트 역할의 토큰이 통과하는 길</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">토큰의 권한은 그 프로젝트의 역할이 가진 줄까지입니다</text>
<rect x="24" y="164" width="150" height="142" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="99.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">호출</text>
<text x="99.0" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">JWT 토큰</text>
<text x="99.0" y="256" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">proj role</text>
<text x="99.0" y="276" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">create-token</text>
<rect x="214" y="164" width="200" height="142" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="314.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">토큰 확인</text>
<text x="314.0" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">프로젝트에 남아 있나</text>
<text x="314.0" y="260" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">status.jwtTokensByRole</text>
<text x="314.0" y="284" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">proj:&lt;프로젝트&gt;:&lt;역할&gt;</text>
<rect x="454" y="164" width="216" height="142" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="562.0" y="202" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">역할의 policies 대조</text>
<text x="562.0" y="230" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">역할이 가진 줄과 암묵 get 줄</text>
<text x="562.0" y="258" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">applications, sync,</text>
<text x="562.0" y="278" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11.5" font-weight="400" fill="#8B98A9">&lt;프로젝트&gt;/*, allow</text>
<rect x="708" y="160" width="148" height="70" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="782.0" y="190" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">허용</text>
<text x="782.0" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">allow 줄이 일치</text>
<path d="M 672 235 L 688 235 L 688 195 L 706 195" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="708" y="240" width="148" height="70" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="782.0" y="270" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F5F5F3">PermissionDenied</text>
<text x="782.0" y="292" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">일치하는 줄 없음</text>
<path d="M 672 235 L 688 235 L 688 275 L 706 275" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 176 235 L 212 235" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 416 235 L 452 235" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="214" y="372" width="200" height="62" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="314.0" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="600" fill="#F5F5F3">Unauthenticated</text>
<text x="314.0" y="421" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">delete-token 으로 지운 토큰</text>
<path d="M 314.0 308 L 314.0 370" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="12" y1="448" x2="832" y2="448" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="470" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

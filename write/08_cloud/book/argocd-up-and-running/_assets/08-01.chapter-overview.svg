<title id="dt">설치 모드가 권한 크기를 정하고 AppProject 가 팀의 배포 범위를 좁힌다</title><desc id="dd">08-01 편의 전체 지도. 첫 행은 클러스터 범위 설치에서 네임스페이스 범위 설치로 권한을 좁히고 대상 네임스페이스에 RoleBinding 을 더하는 흐름, 둘째 행은 default 프로젝트의 넓은 허용 범위를 AppProject 가 제한하고 필드마다 검사 시점이 다른 흐름, 셋째 행은 사람 없는 인증을 프로젝트 역할의 JWT 토큰이 맡고 정책에 적힌 get 과 sync 까지만 통과하는 흐름을 보인다.</desc>
<rect width="1000" height="424" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 08-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">설치 모드가 권한 크기를 정하고 AppProject 가 팀의 배포 범위를 좁힌다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">행은 본문 절, 화살표 라벨은 앞 키워드에서 뒤 키워드로 넘어가는 관계</text>

<title id="dt">로컬 계정과 SSO 두 방식의 로그인 길</title><desc id="dd">세 줄의 로그인 길이 왼쪽에서 오른쪽으로 이어진다. 로컬 계정은 비밀번호 확인 뒤 Argo CD 가 토큰을 발급하고, Dex 방식은 argocd-dex-server 가 외부 IdP 를 거쳐 토큰을 발급하며, 직접 OIDC 방식은 OIDC IdP 가 토큰을 발급한다. 세 토큰은 모두 오른쪽의 API server 가 발급자와 사용자 이름과 그룹을 읽는 곳으로 모인다.</desc>

<title id="dt">허브가 원격 클러스터로 밀어 넣는 길</title><desc id="dd">왼쪽의 허브 클러스터 안에서 Application 과 cluster Secret 이 Application controller 로 모이고, controller 가 오른쪽의 원격 클러스터 API server 로 접속한다. 허브 자신인 in-cluster 는 Secret 없이 기본으로 등록되어 있다.</desc>

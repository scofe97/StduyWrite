<title id="dt">sync 가 서비스 계정을 고르는 길</title><desc id="dd">왼쪽의 sync 요청은 Application 의 대상 server 와 namespace 를 들고 온다. 가운데 칸이 프로젝트의 destinationServiceAccounts 를 위에서부터 훑어 처음 맞는 서비스 계정을 고른다. 고른 계정의 권한으로 클러스터를 호출해 Role 이 허용하면 적용되고 허용하지 않으면 forbidden 으로 Failed 가 된다. 맞는 항목이 없으면 enforced 가 true 일 때는 오류, false 일 때는 컨트롤러 계정으로 진행한다.</desc>
<rect width="880" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 09-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">sync 가 서비스 계정을 고르는 길</text>

<title id="dt">argocd cluster add 가 만드는 것</title><desc id="dd">왼쪽의 argocd CLI 가 kubeconfig 컨텍스트로 원격 클러스터에 접속해 가운데 상자의 네 리소스를 만들고, 허브 클러스터에는 Argo CD API server 를 거쳐 오른쪽의 cluster Secret 이 저장된다. 옵션 없이 실행할 때 네 리소스는 ServiceAccount, ClusterRole, ClusterRoleBinding, 토큰 Secret 이다.</desc>
<rect width="880" height="448" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARGO CD UP AND RUNNING · 07-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">argocd cluster add 가 만드는 것</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">옵션 없이 한 번 실행하면 원격에는 관리용 계정과 권한을, 허브에는 접속 정보를 둡니다</text>

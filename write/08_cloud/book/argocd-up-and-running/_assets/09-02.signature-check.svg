<title id="dt">커밋이 서명 검증을 지나는 길</title><desc id="dd">왼쪽의 대상 리비전은 먼저 repo-server 의 GnuPG 키링에서 서명을 확인받는다. 서명이 없으면 unsigned, 서명한 공개 키가 키링에 없으면 key not in keyring 으로 거부된다. 키링에서 확인된 서명은 프로젝트 정책의 키 목록과 한 번 더 대조된다. 목록에 없는 키이면 unallowed key 로 거부되고, 목록에 있는 키이면 허용되어 sync 가 진행된다.</desc>

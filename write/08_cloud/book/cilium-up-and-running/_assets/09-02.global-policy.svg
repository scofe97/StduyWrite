<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">io.cilium.k8s.policy.cluster 라벨 기반 Egress 허용과 Ingress 상호 검증 흐름</text>

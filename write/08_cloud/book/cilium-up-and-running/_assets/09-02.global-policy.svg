<text x="460" y="168" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">── 정상 인가: app=frontend 라벨 보유 (Egress &amp; Ingress 일치) ──</text>

<text x="460" y="404" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">── 미인가 차단: app=frontend 라벨 없음 (Ingress 불일치) ──</text>

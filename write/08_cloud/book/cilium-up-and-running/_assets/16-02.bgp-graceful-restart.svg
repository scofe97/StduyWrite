<title id="dt">Graceful Restart 와 업그레이드 · 장애의 갈래</title><desc id="dd">Graceful Restart 를 켜면 계획된 업그레이드 중 피어가 경로를 붙잡아 eBPF 데이터패스로 연결을 잇지만, 비자발적 장애에서는 타이머 만료까지 죽은 노드로 트래픽이 가 페일오버가 늦어집니다.</desc>

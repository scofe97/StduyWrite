<title id="dt">L7 프록시와 eBPF 데이터패스의 재시작 공백</title><desc id="dd">사용자 공간 DaemonSet 인 cilium-envoy 와 cilium 이 교체되는 동안 기존 L7 연결과 DNS 요청은 끊기지만, 커널에 남은 eBPF 데이터패스는 기존 L3·L4 연결을 계속 나릅니다.</desc>
<rect width="960" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 16-02 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">L7 프록시와 eBPF 데이터패스의 재시작 공백</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">재시작이나 업그레이드 때 사용자 공간 Pod 는 비지만 커널 eBPF 프로그램은 남습니다.</text>
<rect x="24" y="100" width="912" height="232" rx="8" fill="rgba(245,245,243,0.02)" stroke="rgba(245,245,243,0.20)" stroke-width="0.9"/>
<text x="40" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">사용자 공간 · DaemonSet 교체 시 공백 (기존 삭제 → pull → Ready)</text>
<rect x="24" y="360" width="912" height="128" rx="8" fill="rgba(245,245,243,0.02)" stroke="rgba(245,245,243,0.20)" stroke-width="0.9"/>
<text x="40" y="382" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">커널 공간 · 재시작 중 유지</text>

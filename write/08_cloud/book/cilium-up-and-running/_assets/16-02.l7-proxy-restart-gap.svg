<text x="878" y="161" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#8B98A9">1/node</text>
<text x="576" y="164" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="700" fill="#F08A59">cilium-envoy DaemonSet</text>

<rect x="184" y="392" width="736" height="84" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.1"/>
<rect x="196" y="402" width="56" height="16" rx="2" fill="#0D1117" stroke="#3FB98C" stroke-width="0.8"/>
<text x="224" y="413" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="600" fill="#3FB98C">KERNEL</text>
<text x="264" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#3FB98C">eBPF 데이터패스 (커널 상주)</text>

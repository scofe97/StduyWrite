<text x="76" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#E3B341">에이전트 중단 시: DNS 정책이 걸린 Pod 의 DNS 요청 드롭</text>

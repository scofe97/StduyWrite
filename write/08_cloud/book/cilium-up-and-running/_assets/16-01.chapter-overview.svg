<title id="dt">설치 선언에서 업그레이드·이전·관측까지 Cilium 운영 흐름</title><desc id="dd">16-01 개요도. 왼쪽 Zone 1(§1)은 CLI 와 로컬 Helm 의 값 유실·권한 과다 문제를 Helm 과 GitOps 단일 원천 선언으로 풀되 같은 클러스터 교착에 대비함을 보인다. 가운데 Zone 2(§2·§3)는 한 마이너씩 최신 패치에서 출발해 preflight 와 -f 값 파일로 업그레이드하고, 에이전트 재시작 중 eBPF 데이터패스는 유지되지만 백엔드 교체 틈에 맵이 낡음을 보인다. 오른쪽 Zone 3(§4·§5)은 이중 오버레이(10.245.0.0/16·8473)로 CNI 를 노드 단위 이전하고 9962·9963·9964·9965 포트의 Prometheus 지표로 상태를 확인함을 보인다.</desc>

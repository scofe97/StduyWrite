<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">칩은 절 번호, 구역 사이 화살표는 읽는 순서, §4 는 다른 CNI 에서 오는 별도 갈래입니다.</text>

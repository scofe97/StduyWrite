<title id="dt">veth 와 netkit 의 패킷 전달 단계 비교</title><desc id="dd">veth 는 네임스페이스 전환과 호스트 큐를 거치지만 netkit 은 조기 훅으로 우회한다</desc>
<rect width="920" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CILIUM UP AND RUNNING · 08-02 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">veth 와 netkit 의 패킷 전달 단계 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">netkit 은 Pod 내부 조기 훅과 L3 직결로 네임스페이스 전환과 per-CPU 백로그 큐 오버헤드를 줄입니다</text>
<rect x="24" y="106" width="872" height="128" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="40" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">전통 veth 경로 (L2 · 호스트 스택 경유)</text>
<rect x="40" y="142" width="180" height="80" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="52" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">1. Pod 네임스페이스</text>
<text x="52" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">eth0 인터페이스</text>
<text x="52" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">소켓 버퍼 송출</text>
<path d="M 224 182 L 258 182" fill="none" stroke="#E3B341" stroke-width="1.2" marker-end="url(#warn)"/>
<rect x="262" y="142" width="180" height="80" rx="4" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="274" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">2. 네임스페이스 전환</text>
<text x="274" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">veth 쌍 (@ifN)</text>
<text x="274" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">ARP 확인 오버헤드</text>
<path d="M 446 182 L 480 182" fill="none" stroke="#E3B341" stroke-width="1.2" marker-end="url(#warn)"/>
<rect x="484" y="142" width="180" height="80" rx="4" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="496" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">3. 호스트 스택 진입</text>
<text x="496" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#E3B341">per-CPU 백로그 큐</text>
<text x="496" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">per-CPU 백로그 큐 경유 지연</text>
<path d="M 668 182 L 702 182" fill="none" stroke="#E3B341" stroke-width="1.2" marker-end="url(#warn)"/>
<rect x="706" y="142" width="180" height="80" rx="4" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="718" y="162" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">4. 물리 장치 송출</text>
<text x="718" y="182" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F5F5F3">물리 NIC (eth0)</text>
<text x="718" y="202" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">하부 망 패킷 전송</text>
<rect x="24" y="266" width="872" height="128" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="40" y="288" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">netkit 경로 (커널 6.8+ · L3 기본 · eBPF Host-Routing)</text>
<rect x="40" y="302" width="180" height="80" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="52" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">1. Pod 네임스페이스</text>
<text x="52" y="342" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">netkit peer 장치</text>
<text x="52" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">조기 eBPF 훅 실행</text>
<path d="M 224 342 L 258 342" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<rect x="262" y="302" width="180" height="80" rx="4" fill="#6A95D810" stroke="#6A95D8" stroke-width="0.9"/>
<text x="274" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">2. 호스트 제어 분리</text>
<text x="274" y="342" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">primary 장치 제어</text>
<text x="274" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">Pod 변조 방지 격리</text>
<path d="M 446 342 L 480 342" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<rect x="484" y="302" width="180" height="80" rx="4" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.0"/>
<text x="496" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">3. 스택 / 큐 우회</text>
<text x="496" y="342" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#3FB98C">물리 장치로 바로 전달</text>
<text x="496" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">L3 직결 · 백로그 큐 생략</text>
<path d="M 668 342 L 702 342" fill="none" stroke="#3FB98C" stroke-width="1.2" marker-end="url(#ok)"/>
<rect x="706" y="302" width="180" height="80" rx="4" fill="#F08A5914" stroke="#F08A59" stroke-width="1.3"/>
<text x="718" y="322" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">4. 물리 장치 직결</text>
<text x="718" y="342" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">물리 NIC / 다음 홉</text>
<text x="718" y="362" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">네임스페이스 전환 비용 감소</text>
<line x1="12" y1="432" x2="872" y2="432" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="454" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="444" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">veth 병목 단계</text>
<rect x="274" y="444" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="296" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">netkit 조기 훅 및 우회</text>
<rect x="526" y="444" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="548" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트 제어 장치 분리</text>
<rect x="726" y="444" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="748" y="454" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">직결 최적화 완성</text>

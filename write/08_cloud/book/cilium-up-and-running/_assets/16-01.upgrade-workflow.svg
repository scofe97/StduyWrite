<title id="dt">연속 마이너 확인에서 preflight·값 파일 적용까지 업그레이드 순서</title><desc id="dd">16-01 §2 순서도. 현재 버전의 최신 패치로 먼저 올린 뒤 연속 마이너 여부와 Upgrade Notes 를 확인한다. cilium-preflight 로 새 이미지를 노드마다 미리 받아 READY 수를 맞춘 다음 삭제하고, --reuse-values 없이 값 파일과 upgradeCompatibility 로 helm upgrade 를 실행한다. 롤아웃이 틀어지면 helm rollback 으로 최신 패치 상태로 되돌린다.</desc>
<rect width="920" height="744" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 16-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">연속 마이너 확인에서 preflight·값 파일 적용까지 업그레이드 순서</text>

<svg viewBox="0 0 700 424" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>원문이 기준한 2017년 목록과 현재 2025년 목록의 차이</title>
  <desc>원문은 집필 시점의 OWASP 상위 열 가지를 기준으로 각 항목에 컨테이너 고유 대응을 붙였습니다. 그 목록은 2017년판이었고 이후 두 번 개정됐습니다. 2025년판에서 순위가 크게 바뀌었는데, 접근 통제 취약이 네 번째 판 연속 1위를 지켰고 보안 설정 오류가 5위에서 2위로 올라왔습니다. 새로 들어온 범주가 둘입니다. 소프트웨어 공급망 실패가 3위로 들어왔는데 이전의 취약하고 오래된 컴포넌트를 더 넓게 확장한 것이고, 예외 상황 오처리가 10위로 완전히 새로 들어와 잘못된 오류 처리와 논리 오류와 실패 시 열리는 문제를 다룹니다. 이름이 바뀐 것도 있습니다. 식별과 인증 실패가 인증 실패로 좁혀졌고, 보안 로깅과 모니터링 실패가 보안 로깅과 경보 실패로 바뀌어 경보 기능의 중요성을 강조합니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .rank { fill: #b8b3ad; font-size: 9.5px; font-weight: 700; }
    .new-title { fill: #0d0d0d; font-size: 11px; font-weight: 700; }
    .new-detail { fill: #0d0d0d; font-size: 9.5px; }
    .old { fill: #3a3632; font-size: 9.5px; }
  </style>

  <rect width="700" height="424" fill="#0d0d0d"/>

  <text class="head" x="40" y="28">2017년판에서 2025년판으로</text>

  <!-- 2025 목록 -->
  <rect class="box" x="40" y="40" width="300" height="216" rx="4"/>
  <text class="box-title" x="56" y="61">2025년판 순위</text>
  <text class="rank" x="56" y="82">A01</text>
  <text class="box-detail" x="92" y="82">접근 통제 취약 — 4판 연속 1위</text>
  <text class="rank" x="56" y="100">A02</text>
  <text class="box-detail" x="92" y="100">보안 설정 오류 — 5위에서 상승</text>
  <text class="rank" x="56" y="118">A03</text>
  <text class="box-detail" x="92" y="118">소프트웨어 공급망 실패</text>
  <text class="rank" x="56" y="136">A04</text>
  <text class="box-detail" x="92" y="136">암호화 실패</text>
  <text class="rank" x="56" y="154">A05</text>
  <text class="box-detail" x="92" y="154">인젝션</text>
  <text class="rank" x="56" y="172">A06</text>
  <text class="box-detail" x="92" y="172">안전하지 않은 설계</text>
  <text class="rank" x="56" y="190">A07</text>
  <text class="box-detail" x="92" y="190">인증 실패</text>
  <text class="rank" x="56" y="208">A08</text>
  <text class="box-detail" x="92" y="208">소프트웨어·데이터 무결성 실패</text>
  <text class="rank" x="56" y="226">A09</text>
  <text class="box-detail" x="92" y="226">보안 로깅·경보 실패</text>
  <text class="rank" x="56" y="244">A10</text>
  <text class="box-detail" x="92" y="244">예외 상황 오처리 — 신규</text>

  <!-- 새 범주 -->
  <rect x="360" y="40" width="300" height="94" rx="4" fill="rgb(212,168,83)"/>
  <text class="new-title" x="376" y="61">새로 들어온 둘</text>
  <text class="new-detail" x="376" y="80">A03 소프트웨어 공급망 실패</text>
  <text class="new-detail" x="376" y="98">이전 취약·오래된 컴포넌트를 확장</text>
  <text class="new-detail" x="376" y="120">A10 예외 상황 오처리 (신규)</text>

  <!-- 이름 변경 -->
  <rect class="box" x="360" y="146" width="300" height="90" rx="4"/>
  <text class="box-title" x="376" y="167">이름이 바뀐 둘</text>
  <text class="box-detail" x="376" y="186">식별·인증 실패 → 인증 실패</text>
  <text class="box-detail" x="376" y="206">로깅·모니터링 실패</text>
  <text class="box-detail" x="376" y="224">→ 로깅·경보 실패</text>

  <!-- 사라진 것 -->
  <text class="head" x="40" y="288">원문 목차에 있었으나 지금 없는 것</text>

  <rect class="box" x="40" y="300" width="300" height="76" rx="4"/>
  <text class="box-title" x="56" y="321">XML 외부 엔티티</text>
  <text class="old" x="56" y="340">별도 범주에서 빠졌습니다</text>
  <text class="old" x="56" y="358">원문도 컨테이너 고유 대응 없음</text>

  <rect class="box" x="360" y="300" width="300" height="76" rx="4"/>
  <text class="box-title" x="376" y="321">안전하지 않은 역직렬화</text>
  <text class="old" x="376" y="340">무결성 실패로 흡수됐습니다</text>
  <text class="old" x="376" y="358">원문의 격리 조언은 여전히 유효</text>

  <text class="hint" x="40" y="404">이름은 바뀌어도 대응은 남습니다</text>
</svg>

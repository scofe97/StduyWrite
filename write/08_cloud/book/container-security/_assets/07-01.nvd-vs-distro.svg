<title id="dt">같은 bash 가 NVD 에서는 취약, 배포판 권고에서는 안전으로 갈립니다</title><desc id="dd">Ubuntu 12.04 의 bash 4.2-2ubuntu2.2 는 CVE-2014-6271 의 NVD 영향 버전 1.14.0~4.3 안에 들어 취약으로 판정된다. Ubuntu 보안 권고에서는 그 버전에 수정이 적용돼 있어 안전이고, NVD 판정에서 멈추면 오탐이 된다.</desc>
<rect width="960" height="804" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 07-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 bash 가 NVD 에서는 취약, 배포판 권고에서는 안전으로 갈립니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">NVD 는 버전 번호만 봅니다. 배포판은 마이너 버전을 올리지 않고 패치만 적용해 배포할 수 있습니다.</text>
<rect x="180.0" y="100" width="360" height="44" rx="22.0" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="360" y="127.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Ubuntu 12.04 · bash 4.2-2ubuntu2.2</text>
<path d="M 360 144 L 360 172" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="180.0" y="176" width="360" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="360" y="200" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">NVD · CVE-2014-6271</text>
<text x="360" y="220" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">취약 버전 1.14.0 ~ 4.3</text>
<path d="M 360 232 L 360 256" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 360 256.0 L 500.0 300 L 360 344.0 L 220.0 300 Z" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="360" y="305" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">4.2 가 범위 안?</text>
<path d="M 220 300 L 176 300" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="208" y="290" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<rect x="48.0" y="278" width="128" height="44" rx="22.0" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="112" y="305.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">해당 없음</text>
<path d="M 360 344 L 360 372" fill="none" stroke="#E3B341" stroke-width="1.6" marker-end="url(#warn)"/>
<text x="370" y="364" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">예</text>
<rect x="180.0" y="376" width="360" height="56" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.1"/>
<text x="360" y="400" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">NVD 판정 · 취약</text>
<text x="360" y="420" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">버전 번호만으로 내린 결론</text>
<line x1="540" y1="404" x2="572" y2="404" stroke="#E3B341" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="576" y="380" width="328" height="48" rx="6" fill="#E3B3410F" stroke="#E3B341" stroke-width="1.0"/>
<text x="740" y="402" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">여기서 멈추면 오탐</text>
<text x="740" y="420" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">배포판이 이미 패치했을 수 있음</text>
<path d="M 360 432 L 360 460" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="370" y="452" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">배포판 권고까지</text>
<rect x="180.0" y="464" width="360" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="360" y="488" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Ubuntu 보안 권고 조회</text>
<text x="360" y="508" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">같은 CVE · 같은 패키지 버전</text>
<path d="M 360 520 L 360 548" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 360 548.0 L 500.0 592 L 360 636.0 L 220.0 592 Z" fill="#F08A591F" stroke="#F08A59" stroke-width="1.4"/>
<text x="360" y="597" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">이 버전에 수정?</text>
<path d="M 500 592 L 584 592" fill="none" stroke="#F0616D" stroke-width="1.5" marker-end="url(#bad)"/>
<text x="512" y="582" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">아니오</text>
<rect x="612.0" y="570" width="160" height="44" rx="22.0" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="692" y="597.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">취약 확정</text>
<path d="M 360 636 L 360 668" fill="none" stroke="#3FB98C" stroke-width="1.6" marker-end="url(#ok)"/>
<text x="370" y="658" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#3FB98C">예</text>
<rect x="220.0" y="672" width="280" height="64" rx="32.0" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="360" y="701.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">안전 · 백포트</text>
<text x="360" y="719.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">패치만 적용한 버전</text>
<text x="516" y="708" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">마이너 버전을 올리지 않고 패치만 배포</text>
<line x1="12" y1="764" x2="912" y2="764" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="786" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="776" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="122" y="786" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">NVD 판정</text>
<rect x="222" y="776" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="244" y="786" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">배포판 권고에서 안전</text>
<rect x="409" y="776" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="431" y="786" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">배포판 권고에서 취약</text>
<rect x="596" y="776" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="618" y="786" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">배포판 권고 분기</text>

<title id="dt">마운트한 경로 하나마다 호스트로 나가는 길이 하나씩 생깁니다</title><desc id="dd">침해된 컨테이너가 -v 로 / 를 마운트하면 ls /hostroot/ 에 호스트 루트가 보이고, 그 아래 /etc · /bin 계열 · 로그 디렉토리 · /var/log · /var/run/docker.sock 도 각각 따로 탈출 경로가 된다.</desc>
<rect width="984" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 09-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">마운트한 경로 하나마다 호스트로 나가는 길이 하나씩 생깁니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">호스트 루트를 마운트하면 아래 경로가 모두 포함되고, 개별 경로만 마운트해도 각자 탈출 경로가 됩니다.</text>
<rect x="284" y="184" width="272" height="368" rx="8" fill="none" stroke="rgba(191,192,192,0.35)" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="300" y="207" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">/ 마운트에 포함</text>
<line x1="216" y1="326.0" x2="252" y2="326.0" stroke="#8B98A9" stroke-width="1.4"/>
<line x1="252" y1="142.0" x2="252" y2="510.0" stroke="#8B98A9" stroke-width="1.4"/>
<path d="M 252 142.0 L 296 142.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 542 142.0 L 604 142.0" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 252 254.0 L 296 254.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 542 254.0 L 604 254.0" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<path d="M 252 318.0 L 296 318.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 542 318.0 L 604 318.0" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<path d="M 252 382.0 L 296 382.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 542 382.0 L 604 382.0" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<path d="M 252 446.0 L 296 446.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 542 446.0 L 604 446.0" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<path d="M 252 510.0 L 296 510.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 542 510.0 L 604 510.0" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="36" y="286.0" width="180" height="80" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>
<text x="126" y="320.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">침해된 컨테이너</text>
<text x="126" y="344.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">docker run -v</text>
<rect x="300" y="116" width="240" height="52" rx="6" fill="#F08A591F" stroke="#F08A59" stroke-width="1.6"/>
<text x="420.0" y="147.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">-v /:/hostroot</text>
<rect x="608" y="116" width="340" height="52" rx="6" fill="#F08A591F" stroke="#F08A59" stroke-width="1.6"/>
<text x="624" y="138" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">호스트 파일시스템 전체 접근</text>
<text x="624" y="157" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">ls /hostroot/</text>
<rect x="300" y="228" width="240" height="52" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="420.0" y="259.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">/etc</text>
<rect x="608" y="228" width="340" height="52" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="624" y="250" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">/etc/passwd 수정</text>
<text x="624" y="269" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">cron · init · systemd 접근</text>
<rect x="300" y="292" width="240" height="52" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="420.0" y="323.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">/bin · /usr/bin · /usr/sbin</text>
<rect x="608" y="292" width="340" height="52" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="624" y="314" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">실행 파일 쓰기</text>
<text x="624" y="333" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">기존 실행 파일 덮어쓰기</text>
<rect x="300" y="356" width="240" height="52" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="420.0" y="387.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">호스트 로그 디렉토리</text>
<rect x="608" y="356" width="340" height="52" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="624" y="378" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">로그 수정</text>
<text x="624" y="397" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">자기 행적 삭제</text>
<rect x="300" y="420" width="240" height="52" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="420.0" y="451.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">/var/log · Kubernetes</text>
<rect x="608" y="420" width="340" height="52" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="624" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">kubectl logs 권한자에게 호스트 전체</text>
<text x="624" y="461" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">로그 symlink 의 목적지 변경</text>
<rect x="300" y="484" width="240" height="52" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="420.0" y="515.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">/var/run/docker.sock</text>
<rect x="608" y="484" width="340" height="52" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="624" y="506" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">Docker 데몬(root)에 명령</text>
<text x="624" y="525" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">root 로 컨테이너 실행</text>
<line x1="12" y1="584" x2="936" y2="584" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="606" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="596" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">/ 통째 마운트</text>
<rect x="248" y="596" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="270" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">개별 경로의 결과</text>
</svg>
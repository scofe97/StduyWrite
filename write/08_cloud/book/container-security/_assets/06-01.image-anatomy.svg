<title id="dt">런타임은 이미지를 그대로 쓰지 못하고 rootfs 와 config.json 번들로 풉니다</title><desc id="dd">Dockerfile 의 FROM·ADD·COPY·RUN 은 루트 파일시스템을, USER·EXPOSE·ENV 는 설정 정보를 바꾼다. 두 부분이 나란히 저장된 이미지를 umoci unpack 으로 풀면 rootfs 디렉토리와 config.json 파일의 번들이 되고, runc 가 그 번들로 컨테이너를 만든다. 실행 시점의 docker run -e 나 Pod 의 env 값은 config.json 에 들어간다.</desc>
<rect width="984" height="668" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 06-01 §1~2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">런타임은 이미지를 그대로 쓰지 못하고 rootfs 와 config.json 번들로 풉니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽 칩은 단계, 파랑은 루트 파일시스템 갈래, 노랑은 실행 시점에 덮어쓸 수 있는 설정 갈래입니다.</text>

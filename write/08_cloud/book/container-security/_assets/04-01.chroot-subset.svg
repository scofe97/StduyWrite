<title id="dt">루트를 바꾸면 그보다 위로 올라갈 길이 없어 파일시스템의 일부만 보입니다</title><desc id="dd">호스트 파일시스템 / 안에 new_root/ 와 alpine/ 두 디렉토리가 있다. new_root/ 는 비어 있어 chroot 뒤 /bin/bash 를 실행하지 못한다. sudo chroot alpine ls 처럼 alpine/ 으로 루트를 바꾸면 alpine/bin 이 /bin 으로 보이고, 그 위의 호스트 나머지 영역으로는 올라갈 길이 막힌다.</desc>
<rect width="984" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · 04-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">루트를 바꾸면 그보다 위로 올라갈 길이 없어 파일시스템의 일부만 보입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">chroot 한 프로세스에게는 새 루트 안쪽만 파일시스템 전체로 보입니다.</text>
<rect x="36" y="108" width="912" height="296" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.45)" stroke-width="1.0"/>
<text x="60" y="136" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">호스트 파일시스템 / · chroot 전에 보이는 범위</text>
<rect x="60" y="156" width="208" height="104" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="164.0" y="186" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F0616D">new_root/</text>
<text x="164.0" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">비어 있음 → /bin/bash 없음</text>
<text x="164.0" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">sudo chroot new_root</text>
<rect x="60" y="284" width="208" height="96" rx="6" fill="none" stroke="#8B98A9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="164.0" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">호스트의 나머지</text>
<text x="164.0" y="348" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">chroot 뒤에는 닿지 않음</text>
<rect x="396" y="148" width="528" height="232" rx="8" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="420" y="176" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">alpine/ · chroot 뒤 프로세스에게는 이곳이 /</text>
<rect x="428" y="196" width="232" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="544.0" y="230" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">/bin</text>
<text x="544.0" y="256" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">alpine/bin 이 /bin 으로 보임</text>
<rect x="684" y="196" width="232" height="84" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="800.0" y="230" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">/proc</text>
<text x="800.0" y="256" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">mount -t proc proc /proc</text>
<text x="428" y="304" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">PATH 에 /bin 포함 → ls 만 쳐도 실행</text>
<text x="428" y="336" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">sudo chroot alpine ls</text>
<path d="M 392 332 L 320 332" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)" stroke-dasharray="5 4"/>
<line x1="312" y1="318" x2="312" y2="346" stroke="#F0616D" stroke-width="3"/>
<rect x="281.0" y="294" width="102.0" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="332" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F0616D">올라갈 길 없음</text>
<line x1="12" y1="436" x2="936" y2="436" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="458" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="448" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">chroot 뒤 보이는 범위</text>
<rect x="339" y="448" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="361" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">실행 실패</text>
<rect x="448" y="448" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="470" y="458" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">명령</text>
</svg>
<text x="792" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">메모리에만 둠</text>
<text x="36" y="388" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">수명 · 노출</text>
<line x1="120" y1="384" x2="924" y2="384" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>

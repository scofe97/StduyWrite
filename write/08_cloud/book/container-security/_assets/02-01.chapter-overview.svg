<svg viewBox="0 0 640 420" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Linux 시스템 콜과 권한과 capability 전체 지도</title>
  <desc>유저 공간의 앱이 커널에 일을 시키는 통로인 시스템 콜에서 출발합니다. 그다음 파일 권한이 누가 무엇을 할 수 있는지 정하는 방식을 보고, setuid 비트가 그 권한을 넘겨주는 오래된 장치임을 확인합니다. 커널 2.2가 도입한 capability는 그 통짜 권한을 잘게 쪼갠 후계자입니다. 마지막으로 이 장치들이 어긋났을 때 벌어지는 권한 상승을 봅니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10.5px; }
    .sec { fill: #3a3632; font-size: 10px; font-weight: 700; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .num { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10.5px; }
    .danger-title { fill: #7a1f1f; font-size: 13px; font-weight: 700; }
    .danger-detail { fill: #7a1f1f; font-size: 10.5px; }
  </style>

  <rect width="640" height="420" fill="#0d0d0d"/>

  <defs>
    <marker id="bh" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <text class="num" x="34" y="45">1.</text>
  <rect class="box" x="54" y="24" width="532" height="50" rx="4"/>
  <text class="box-title" x="72" y="46">시스템 콜</text>
  <text class="box-detail" x="72" y="64">유저 공간이 커널에 요청하는 통로</text>
  <text class="sec" x="566" y="46" text-anchor="end">§1</text>

  <path class="arrow" d="M320,74 L320,92" marker-end="url(#bh)"/>

  <text class="num" x="34" y="119">2.</text>
  <rect class="box" x="54" y="98" width="532" height="50" rx="4"/>
  <text class="box-title" x="72" y="120">파일 권한 — DAC</text>
  <text class="box-detail" x="72" y="138">소유자 · 그룹 · 그 외 각 rwx</text>
  <text class="sec" x="566" y="120" text-anchor="end">§2</text>

  <path class="arrow" d="M320,148 L320,166" marker-end="url(#bh)"/>

  <text class="hint" x="320" y="182" text-anchor="middle">권한을 넘겨주는 두 장치</text>

  <path class="arrow" d="M320,188 L320,200 L180,200 L180,218" marker-end="url(#bh)"/>
  <path class="arrow" d="M320,188 L320,200 L460,200 L460,218" marker-end="url(#bh)"/>

  <text class="num" x="34" y="247">3.</text>
  <rect class="box" x="54" y="224" width="252" height="56" rx="4"/>
  <text class="box-title" x="72" y="246">setuid — 통짜</text>
  <text class="box-detail" x="72" y="264">root 권한을 통째로</text>
  <text class="sec" x="288" y="246" text-anchor="end">§3</text>

  <text class="num" x="345" y="247">4.</text>
  <rect class="box" x="364" y="224" width="222" height="56" rx="4"/>
  <text class="box-title" x="382" y="246">capability — 조각</text>
  <text class="box-detail" x="382" y="264">필요한 것만 · 커널 2.2</text>
  <text class="sec" x="566" y="246" text-anchor="end">§4</text>

  <path class="arrow" d="M180,280 L180,296 L320,296 L320,314" marker-end="url(#bh)"/>
  <path class="arrow" d="M460,280 L460,296 L320,296"/>

  <text class="num" x="34" y="349">5.</text>
  <rect x="54" y="320" width="532" height="58" rx="4" fill="#f2d4d4"/>
  <text class="danger-title" x="72" y="344">위험 · 권한 상승</text>
  <text class="danger-detail" x="72" y="364">컨테이너는 기본이 root</text>
  <text class="sec" x="566" y="344" text-anchor="end">§5</text>
</svg>

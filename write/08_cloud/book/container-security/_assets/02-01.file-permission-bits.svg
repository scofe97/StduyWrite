<title id="dt">권한 아홉 글자는 셋씩 끊어 소유자·그룹·그 외의 읽기·쓰기·실행으로 읽습니다</title><desc id="dd">myapp 파일의 권한 rwx r-x r-- 를 소유자 liz, 그룹 staff, 그 외 모두 세 행으로 나눈 3 × 3 행렬. 읽기는 세 묶음 모두, 쓰기는 소유자만, 실행은 소유자와 staff 그룹이 할 수 있다. 원문 서술로 복원한 예다.</desc>

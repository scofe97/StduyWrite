<title id="dt">남겨야 할 컨테이너 이벤트 일곱은 SIEM 으로 모여 경보와 차단이 된다</title><desc id="dd">마지막 이벤트인 실패한 동작이 공격자의 정찰 신호다. 성공한 일만 기록하면 그 단계를 통째로 놓친다.</desc>
<rect width="960" height="592" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 14-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">남겨야 할 컨테이너 이벤트 일곱은 SIEM 으로 모여 경보와 차단이 된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">컨테이너 이벤트 일곱이 SIEM 으로 모여 경보와 차단으로 이어지는 흐름</text>

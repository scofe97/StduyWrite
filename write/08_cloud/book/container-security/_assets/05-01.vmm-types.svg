<title id="dt">VMM 의 자리는 하드웨어 바로 위, 호스트 유저 공간, 호스트 커널 안 셋으로 갈립니다</title><desc id="dd">세 열의 층 쌓기. Type 1 은 하드웨어 바로 위에 하이퍼바이저가 있고 호스트 OS 가 없다. Type 2 는 호스트 OS 커널 위 유저 공간에 VMM 애플리케이션이 있다. KVM 은 호스트 Linux 커널 안의 모듈이고 유저 공간의 QEMU 와 함께 쓰이는 경우가 많다.</desc>
<rect width="976" height="492" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LAYERS · 05-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">VMM 의 자리는 하드웨어 바로 위, 호스트 유저 공간, 호스트 커널 안 셋으로 갈립니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">KVM 은 호스트 OS 가 있어 Type 2 처럼 보이지만 VMM 이 유저 공간이 아니라 커널 안에 있어 경계에 걸립니다.</text>

<title id="dt">층에 넣은 것은 지워도 남고, 다이제스트만 내용에 묶입니다</title><desc id="dd">06-01 의 키워드 개념도. 첫 줄은 이미지의 루트 파일시스템과 설정 정보, 그리고 실행 시점의 덮어쓰기다. 둘째 줄은 OCI 이미지를 umoci 로 풀어 rootfs 와 config.json 번들로 만드는 흐름이다. 셋째 줄은 docker build 가 소켓으로 root 데몬에 닿는 위험과 데몬 없는 빌드 도구다. 넷째 줄은 RUN rm 으로 지운 password.txt 가 docker save 로 꺼내면 layer.tar 에 남는 흐름이다. 다섯째 줄은 층 blob 에서 매니페스트와 다이제스트가 나오고 태그는 사람이 읽는 이름으로 옮겨 다니는 흐름이다.</desc>
<rect width="984" height="764" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 06-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">층에 넣은 것은 지워도 남고, 다이제스트만 내용에 묶입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

<title id="dt">v1 은 컨트롤러마다 다른 그룹에 속하고 v2 는 그룹 하나에 속합니다</title><desc id="dd">cgroups v1 에서는 한 프로세스가 /sys/fs/cgroup/memory/mygroup 과 /sys/fs/cgroup/pids/yourgroup 에 동시에 속한다. cgroups v2 에서는 /sys/fs/cgroup/ourgroup 하나에 들어가 그 그룹에 걸린 모든 컨트롤러의 통제를 함께 받는다. stat -fc %T /sys/fs/cgroup/ 출력이 tmpfs 면 v1, cgroup2fs 면 v2 이다.</desc>
<rect width="984" height="484" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 03-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">v1 은 컨트롤러마다 다른 그룹에 속하고 v2 는 그룹 하나에 속합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">같은 프로세스가 어느 그룹에 속하는지가 두 버전을 가릅니다.</text>
<rect x="24" y="100" width="456" height="288" rx="8" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="5 5"/>
<text x="40" y="126" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">CGROUPS V1</text>
<text x="40" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">컨트롤러마다 계층이 따로</text>
<rect x="48" y="216" width="104" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="100" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">프로세스</text>
<text x="100" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">PID 하나</text>
<line x1="152" y1="244" x2="172" y2="244" stroke="#5E6B7E" stroke-width="1.3"/>
<line x1="172" y1="196" x2="172" y2="292" stroke="#5E6B7E" stroke-width="1.3"/>
<path d="M 172 196 L 216 196" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 172 292 L 216 292" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="220" y="168" width="248" height="56" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="344" y="192" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">/sys/fs/cgroup/memory/mygroup</text>
<text x="344" y="212" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">memory 컨트롤러가 거는 한도</text>
<rect x="220" y="264" width="248" height="56" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.1"/>
<text x="344" y="288" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#6A95D8">/sys/fs/cgroup/pids/yourgroup</text>
<text x="344" y="308" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">pids 컨트롤러가 거는 한도</text>
<text x="252.0" y="344" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">stat -fc %T /sys/fs/cgroup/</text>
<rect x="226.95" y="358" width="50.1" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="252.0" y="372" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#6A95D8">tmpfs</text>
<rect x="504" y="100" width="456" height="288" rx="8" fill="none" stroke="rgba(191,192,192,0.22)" stroke-width="1" stroke-dasharray="5 5"/>
<text x="520" y="126" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">CGROUPS V2</text>
<text x="520" y="144" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">계층 하나로 통합</text>
<rect x="528" y="216" width="104" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="580" y="240" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">프로세스</text>
<text x="580" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">PID 하나</text>
<path d="M 634 244 L 696 244" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<rect x="700" y="184" width="248" height="120" rx="6" fill="#F08A591F" stroke="#F08A59" stroke-width="1.6"/>
<text x="824" y="208" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">/sys/fs/cgroup/ourgroup</text>
<text x="824" y="228" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">모든 컨트롤러 통제</text>
<rect x="724.54" y="262" width="54.92" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="752" y="276" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">memory</text>
<rect x="803.36" y="262" width="41.28" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="824" y="276" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">pids</text>
<rect x="881.59" y="262" width="20.82" height="20" rx="4" fill="#0D1117" stroke="#8B98A9" stroke-width="0.8"/>
<text x="892" y="276" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">…</text>
<text x="732.0" y="344" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#8B98A9">stat -fc %T /sys/fs/cgroup/</text>
<rect x="693.31" y="358" width="77.38" height="20" rx="4" fill="#0D1117" stroke="#F08A59" stroke-width="0.8"/>
<text x="732.0" y="372" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="11" font-weight="400" fill="#F08A59">cgroup2fs</text>
<line x1="12" y1="424" x2="936" y2="424" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="446" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="436" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="122" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">v1 · 계층마다 그룹</text>
<rect x="300" y="436" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="322" y="446" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">v2 · 그룹 하나</text>
</svg>
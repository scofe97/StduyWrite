<title id="dt">Service IP 로 향한 패킷은 세 체인을 지나며 목적지가 파드 IP 로 바뀝니다</title><desc id="dd">my-nginx 의 Service IP 10.100.132.10 으로 향한 패킷이 커널의 KUBE-SERVICES, KUBE-SVC-SV7AMNAGZFKZEMQ4 체인을 거쳐 확률 0.5 로 두 KUBE-SEP 체인 중 하나로 갈라지고, DNAT 가 목적지를 파드 IP 10.32.0.3 또는 10.32.0.4 로 바꾼다. kube-proxy 는 이 규칙들을 쓴다.</desc>
<rect width="1000" height="516" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">DATA-FLOW · 10-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Service IP 로 향한 패킷은 세 체인을 지나며 목적지가 파드 IP 로 바뀝니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">iptables -t nat -L 로 보이는 체인 세 개를 따라가며 패킷의 목적지 주소가 어디서 바뀌는지 봅니다.</text>

<svg viewBox="0 0 700 400" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>TLS 핸드셰이크의 흐름과 mTLS 가 더하는 단계</title>
  <desc>전송 계층 연결은 어떤 구성 요소가 시작해야 하고 그 구성 요소를 클라이언트라 부릅니다. 통신 상대는 서버입니다. 이 클라이언트와 서버 관계는 전송 계층에서만 성립할 수 있고 더 높은 계층에서는 두 구성 요소가 대등할 수 있습니다. 클라이언트가 소켓을 열고 서버에 연결을 요청하면서 인증서를 보내 달라고 요청합니다. 인증서는 서버의 신원과 공개키라는 두 가지 중요한 정보를 전달합니다. 클라이언트는 서버 인증서가 신뢰하는 인증 기관의 서명을 받았는지 확인하고 그렇다면 서버를 신뢰할 수 있다고 판단합니다. 이어서 서버의 공개키로 메시지를 암호화해 보내고, 이 연결에서 이후 주고받는 메시지에는 대칭키를 합의해 씁니다. 비대칭 키 쌍보다 성능이 좋기 때문입니다. 서버가 클라이언트 인증서도 요구하도록 설정하면 상호 TLS 가 됩니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 9.5px; }
    .head { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10px; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .step { fill: #b8b3ad; font-size: 9.5px; font-weight: 700; }
    .lane { stroke: #4a4540; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .mtls { stroke: #14521d; stroke-width: 1.5; fill: none; }
    .mtls-label { fill: #14521d; font-size: 9.5px; font-weight: 700; }
    .warn-title { fill: #0d0d0d; font-size: 11.5px; font-weight: 700; }
    .warn-detail { fill: #0d0d0d; font-size: 9.5px; }
  </style>

  <rect width="700" height="400" fill="#0d0d0d"/>

  <defs>
    <marker id="uh11c" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
    <marker id="gn11" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#14521d"/>
    </marker>
  </defs>

  <text class="head" x="40" y="28">연결을 시작하는 쪽이 클라이언트입니다</text>

  <!-- 양쪽 기둥 -->
  <rect class="box" x="40" y="42" width="150" height="36" rx="4"/>
  <text class="box-title" x="56" y="65">클라이언트</text>

  <rect class="box" x="510" y="42" width="150" height="36" rx="4"/>
  <text class="box-title" x="526" y="65">서버</text>

  <path class="lane" d="M115,80 L115,300"/>
  <path class="lane" d="M585,80 L585,300"/>

  <!-- 단계 -->
  <path class="arrow" d="M115,102 L581,102" marker-end="url(#uh11c)"/>
  <text class="step" x="200" y="96">1. 연결 요청 · 인증서 요구</text>

  <path class="arrow" d="M581,140 L121,140" marker-end="url(#uh11c)"/>
  <text class="step" x="200" y="134">2. 서버 인증서 — 신원과 공개키</text>

  <rect class="box" x="150" y="152" width="220" height="52" rx="4"/>
  <text class="box-detail" x="164" y="171">신뢰하는 CA 가 서명했는가</text>
  <text class="box-detail" x="164" y="190">URL 과 일치하는가</text>

  <!-- mTLS 선택 단계 -->
  <path class="mtls" d="M581,226 L121,226" marker-end="url(#gn11)"/>
  <text class="mtls-label" x="200" y="220">3. 선택 — 클라이언트 인증서</text>

  <path class="mtls" d="M115,252 L581,252" marker-end="url(#gn11)"/>
  <text class="mtls-label" x="200" y="246">4. 클라이언트 인증서 = mTLS</text>

  <path class="arrow" d="M115,290 L581,290" marker-end="url(#uh11c)"/>
  <text class="step" x="200" y="284">5. 대칭키 합의 — 이후는 이걸로</text>

  <text class="hint" x="40" y="320">대칭키가 키 쌍보다 빠릅니다</text>

  <!-- skip verify 경고 -->
  <rect x="40" y="334" width="620" height="52" rx="4" fill="rgb(212,168,83)"/>
  <text class="warn-title" x="56" y="355">skip verify — 검증 생략</text>
  <text class="warn-detail" x="56" y="374">암호화는 남지만 사칭을 못 걸러냅니다</text>
</svg>

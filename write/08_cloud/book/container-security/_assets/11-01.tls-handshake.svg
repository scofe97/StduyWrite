<title id="dt">서버가 요구하면 mTLS 가 클라이언트 인증서 단계를 더합니다</title><desc id="dd">클라이언트가 소켓을 열어 서버 인증서를 받고 신뢰하는 CA 의 서명을 확인한 뒤 대칭키를 합의한다. 서버가 client-auth: need 를 걸면 서버도 클라이언트 인증서를 받아 같은 확인을 한다.</desc>
<rect width="960" height="788" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 11-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서버가 요구하면 mTLS 가 클라이언트 인증서 단계를 더합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">기본 핸드셰이크는 서버만 증명하고, mTLS 는 클라이언트의 증명을 더합니다</text>

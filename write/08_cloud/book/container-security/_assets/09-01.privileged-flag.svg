<rect x="472" y="196" width="432" height="64" rx="6" fill="#F08A591F" stroke="#F08A59" stroke-width="1.6"/>
<text x="488" y="224" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F08A59">cap_sys_admin</text>

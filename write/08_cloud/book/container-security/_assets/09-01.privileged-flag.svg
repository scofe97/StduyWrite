<title id="dt">--privileged 가 바꾸는 것은 사용자 ID 가 아니라 capability 집합입니다</title><desc id="dd">UID 0 root 는 플래그 없이도 같다. 플래그 없이 주어지는 Docker 기본 capability 열네 개가 --privileged 에서는 전부로 커지고, 더해진 것 가운데 cap_sys_admin 이 /dev 장치를 마운트해 호스트로 탈출하는 길을 연다.</desc>
<rect width="984" height="556" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · 09-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">--privileged 가 바꾸는 것은 사용자 ID 가 아니라 capability 집합입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">root 는 플래그 없이도 UID 0 이고, 플래그는 cap_sys_admin 을 비롯한 나머지 capability 를 더합니다.</text>
<rect x="24" y="100" width="936" height="368" rx="8" fill="#161B22" stroke="rgba(191,192,192,0.30)" stroke-width="1.0"/>
<text x="48" y="128" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">UID 0 · root — 플래그 없이도 --privileged 에서도 같음</text>
<rect x="56" y="148" width="872" height="288" rx="8" fill="#8B98A90F" stroke="#8B98A9" stroke-width="1.1"/>
<text x="80" y="176" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">--privileged · capability 전부</text>
<rect x="88" y="196" width="352" height="216" rx="8" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="112" y="224" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#6A95D8">플래그 없이 · Docker 기본 열네 개</text>
<text x="112" y="252" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F5F5F3">cap_chown</text>

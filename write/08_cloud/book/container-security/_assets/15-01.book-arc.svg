<title id="dt">맺음말의 네 갈래는 앞 장에 하나씩 이어지고 마지막 단서가 위협 모델로 돌아간다</title><desc id="dd">멘탈 모델은 8장, 통신 이해는 10장, 계층 방어는 1장의 심층 방어, 컨테이너 고유 예방 조치는 14장 OWASP 열 가지로 이어진다. 열 가지는 전부가 아니라서 1장 위협 모델로 돌아가 부록 열아홉 질문으로 가장 취약한 곳을 가늠한다.</desc>
<rect width="960" height="580" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 15-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">맺음말의 네 갈래는 앞 장에 하나씩 이어지고 마지막 단서가 위협 모델로 돌아간다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">저자가 독자가 얻었기를 바란다고 적은 네 갈래의 순서와 이어지는 장</text>
<text x="24" y="196" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">얻은 것</text>

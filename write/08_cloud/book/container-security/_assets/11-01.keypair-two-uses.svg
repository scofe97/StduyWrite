<title id="dt">공개키로 잠그면 개인키로 풀고, 개인키로 서명하면 공개키로 검증합니다</title><desc id="dd">개인키 소유자가 키 쌍을 만들어 공개키를 건네면, 암호문은 상대에서 소유자로, 서명은 소유자에서 상대로 흐른다. 같은 키 쌍을 반대 방향으로 쓴다.</desc>
<rect width="960" height="636" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 11-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">공개키로 잠그면 개인키로 풀고, 개인키로 서명하면 공개키로 검증합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">암호화와 서명은 같은 키 쌍을 반대 방향으로 씁니다</text>

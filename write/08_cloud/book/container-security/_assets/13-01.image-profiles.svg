<title id="dt">이미지 프로파일 하나가 다섯 축으로 모든 컨테이너를 단속합니다</title><desc id="dd">같은 이미지에서 뜬 컨테이너는 같게 동작한다. 그래서 이미지에 프로파일을 붙이고, 축마다 정상 값을 정해 벗어나면 이상 신호로 본다. 축은 네트워크 트래픽, 실행 파일, 파일 접근, 사용자 ID, 시스템 콜과 capability다.</desc>
<rect width="960" height="576" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 13-01 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이미지 프로파일 하나가 다섯 축으로 모든 컨테이너를 단속합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">정상 값은 상품 검색 서비스를 예로 들었습니다.</text>
<text x="244" y="112" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">프로파일 축</text>

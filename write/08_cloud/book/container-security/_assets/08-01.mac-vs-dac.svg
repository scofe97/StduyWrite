<title id="dt">접근 요청은 DAC 와 MAC 를 차례로 통과해야 수행됩니다</title><desc id="dd">접근 요청이 DAC 마름모와 MAC 마름모를 차례로 지나는 흐름. 어느 쪽에서든 허용이 아니면 거부이고 둘 다 허용이어야 수행된다. DAC 의 판정 주체는 파일 소유자의 재량이다. MAC 는 중앙 관리자가 설정하며 AppArmor 는 실행 파일 프로파일의 capability 와 파일 접근으로, SELinux 는 프로세스 도메인과 파일 타입 라벨로 판정한다.</desc>
<rect width="984" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 08-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">접근 요청은 DAC 와 MAC 를 차례로 통과해야 수행됩니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 판정은 서로를 대신하지 않고 함께 작동하므로, 한쪽이 허용해도 다른 쪽이 막으면 접근은 거부됩니다.</text>
<rect x="48" y="214" width="120" height="36" rx="18" fill="#161B22" stroke="#BFC0C038" stroke-width="0.9"/>
<text x="108" y="237" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">접근 요청</text>
<rect x="408" y="100" width="112" height="40" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.2"/>
<text x="464" y="125" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">거부</text>
<path d="M 170 232 L 208 232" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 422 232 L 504 232" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="463" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<path d="M 718 232 L 796 232" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<text x="757" y="222" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">예</text>
<path d="M 316 174 L 316 120 L 404 120" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<text x="328" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<path d="M 612 174 L 612 120 L 524 120" fill="none" stroke="#F0616D" stroke-width="1.3" marker-end="url(#bad)"/>
<text x="624" y="156" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">아니오</text>
<polygon points="316,176 420,232 316,288 212,232" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="316" y="230" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">DAC</text>
<text x="316" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">허용?</text>
<polygon points="612,176 716,232 612,288 508,232" fill="#F08A591F" stroke="#F08A59" stroke-width="1.6"/>
<text x="612" y="230" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F08A59">MAC</text>
<text x="612" y="248" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">허용?</text>
<rect x="800" y="214" width="140" height="36" rx="18" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="870" y="237" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">수행</text>
<path d="M 316 290 L 316 312" fill="none" stroke="#6A95D8" stroke-width="1.3" marker-end="url(#info)"/>
<rect x="168" y="316" width="296" height="164" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="316" y="344" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">DAC — 임의 접근 제어</text>
<text x="316" y="380" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">판정 주체: 파일 소유자의 재량</text>
<text x="316" y="408" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">남에게 접근을 넘길 수 있음</text>
<text x="316" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">내 계정도 막을 수 있음</text>
<path d="M 612 290 L 612 312" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<rect x="492" y="316" width="448" height="164" rx="8" fill="#F08A590F" stroke="#F08A59" stroke-width="1.6"/>
<text x="508" y="344" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">MAC — 강제 접근 제어</text>
<text x="924" y="344" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">중앙 관리자가 설정</text>
<rect x="508" y="364" width="208" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="612" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">AppArmor</text>
<text x="612" y="420" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">축: 실행 파일 프로파일</text>
<text x="612" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">capability · 파일 접근</text>
<rect x="724" y="364" width="208" height="100" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="828" y="392" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">SELinux</text>
<text x="828" y="420" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">축: 도메인 × 파일 타입</text>
<text x="828" y="442" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">사용자 신원 무관</text>
<line x1="12" y1="516" x2="936" y2="516" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="538" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

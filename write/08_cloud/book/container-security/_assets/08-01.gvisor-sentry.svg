<title id="dt">gVisor 에서 시스템 콜은 Sentry 가 받아 안에서 재구현하고, 파일 접근만 Gofer 로 넘어갑니다</title><desc id="dd">컨테이너 안 앱, Sentry, Gofer, 호스트 커널 네 라이프라인의 시퀀스. 앱의 시스템 콜을 Sentry 가 가로챈 뒤 분기한다. 파일과 무관한 시스템 콜은 Sentry 안에서 재구현되어 호스트 커널로 전달되지 않는다. 파일 접근 시스템 콜은 Sentry 가 Gofer 에 위임하고 Gofer 가 호스트 커널에 요청해 결과가 거꾸로 돌아온다.</desc>
<rect width="984" height="676" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SEQUENCE · 08-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">gVisor 에서 시스템 콜은 Sentry 가 받아 안에서 재구현하고, 파일 접근만 Gofer 로 넘어갑니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">Sentry 는 seccomp 로 샌드박싱되어 파일시스템에 직접 닿지 못하므로, 파일 접근은 별개 프로세스 Gofer 가 맡습니다.</text>

<title id="dt">부팅에서 시작해 VMM 의 세 배치와 트랩앤에뮬레이트를 거쳐 격리 강도로 모입니다</title><desc id="dd">05-01 의 키워드 개념도. 윗줄은 BIOS 와 부트로더가 커널을 올리고 커널이 Ring 0 에서 프로세스를 관리하는 모습이다. 가운데 줄은 BIOS 자리에 VMM 이 들어서고 Type 1, Type 2, KVM 세 배치로 갈리는 모습이다. 아랫줄은 트랩앤에뮬레이트가 가상화 불가 명령에 막혀 세 기법을 쓰고, 마지막으로 Linux 와 Xen 의 코드 규모로 격리 강도를 비교하는 모습이다.</desc>
<rect width="988" height="528" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 05-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">부팅에서 시작해 VMM 의 세 배치와 트랩앤에뮬레이트를 거쳐 격리 강도로 모입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

<text x="816.0" y="195.0" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#8B98A9">ps | grep sleep</text>
<rect x="700" y="220" width="232" height="56" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="816.0" y="245.0" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">sleep 프로세스 종료</text>

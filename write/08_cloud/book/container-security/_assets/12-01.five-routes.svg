<title id="dt">빌드 시점 둘은 탈락이고, 실행 시점 셋 중 파일 마운트가 선호됩니다</title><desc id="dd">컨테이너에 정보를 넣는 길은 빌드 시점의 이미지 안 파일과 이미지 설정 환경 변수, 실행 시점의 네트워크 수신과 docker run -e 환경 변수와 볼륨 마운트 다섯이다. 앞의 둘은 하드코딩이라 탈락하고, 네트워크는 드물며, 환경 변수는 눈총을 받고, 볼륨 마운트가 선호된다.</desc>

<title id="dt">eBPF 는 execve 를 관찰해 경보를 내지만 원문 기준으로 막지는 못합니다</title><desc id="dd">컨테이너가 execve 를 부르면 커널 훅이 eBPF 프로그램에 사건을 넘기고, 프로그램이 실행 파일 이름을 허용 목록·차단 목록과 비교해 경보를 낸다. 원문 시점에는 시스템 콜을 수정하지 못해 execve 가 그대로 성공하고, BPF LSM 이후에는 return -EPERM 으로 거부한다.</desc>
<rect width="960" height="772" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 13-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">eBPF 는 execve 를 관찰해 경보를 내지만 원문 기준으로 막지는 못합니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">BPF LSM 은 커널 5.7(2020년 5월)에 병합됐습니다.</text>

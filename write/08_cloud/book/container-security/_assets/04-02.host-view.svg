<title id="dt">같은 sleep 프로세스가 안에서는 PID 10, 호스트에서는 PID 30591 로 보입니다</title><desc id="dd">호스트 PID namespace 안에 컨테이너 PID namespace 가 들어 있다. 컨테이너 안에서 ps 로 보면 sleep 1000 은 PID 10 이고, 호스트에서 ps -C sleep 으로 보면 같은 프로세스가 PID 30591 이다. 프로세스는 하나이고 번호만 둘이며, 호스트 접근 권한이 있으면 모든 컨테이너를 관찰하고 영향을 줄 수 있다.</desc>
<rect width="984" height="552" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">NESTED · 04-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 sleep 프로세스가 안에서는 PID 10, 호스트에서는 PID 30591 로 보입니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">프로세스는 하나이고 번호만 둘입니다. 그래서 호스트에서 컨테이너가 그대로 보입니다.</text>
<rect x="36" y="112" width="912" height="332" rx="8" fill="#ffffff06" stroke="#8B98A9" stroke-width="1.2"/>
<text x="56" y="140" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#8B98A9">호스트 · 기본 PID namespace</text>
<rect x="84" y="160" width="336" height="244" rx="8" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.2"/>
<text x="104" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">컨테이너 · 자기 PID namespace</text>
<path d="M 540 244 L 388 244" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)" stroke-dasharray="5 4"/>
<text x="464" y="232" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">같은 프로세스</text>
<path d="M 252 296 L 252 324" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<path d="M 726 296 L 726 324" fill="none" stroke="#5E6B7E" stroke-width="1.3" marker-end="url(#soft)"/>
<rect x="120" y="200" width="264" height="96" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="252" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">sleep 1000</text>
<text x="252" y="260" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">컨테이너화된 프로세스 하나</text>
<text x="252" y="282" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">docker run --rm -it ubuntu bash</text>
<text x="120" y="348" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">컨테이너 안 ps</text>
<text x="120" y="380" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="22" font-weight="600" fill="#F5F5F3">PID 10</text>
<rect x="540" y="200" width="372" height="96" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="560" y="226" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">호스트에서</text>
<text x="892" y="226" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">ps -C sleep</text>
<text x="560" y="274" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="22" font-weight="600" fill="#F08A59">PID 30591</text>
<text x="892" y="274" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">훨씬 큰 번호</text>
<rect x="540" y="324" width="372" height="80" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="560" y="352" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">가상머신과 갈리는 지점</text>
<text x="560" y="380" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">호스트 접근 = 모든 컨테이너를 관찰·영향</text>
<text x="492" y="432" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">호스트 커널 공유</text>
<line x1="12" y1="488" x2="936" y2="488" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="510" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="500" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">호스트 시점</text>
<rect x="222" y="500" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="244" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">컨테이너 namespace</text>
<rect x="448" y="500" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="470" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">위험</text>
</svg>
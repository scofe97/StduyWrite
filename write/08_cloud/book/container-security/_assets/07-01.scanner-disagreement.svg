<title id="dt">같은 이미지가 스캐너마다 다르게 나오는 이유는 세 단계에 흩어져 있습니다</title><desc id="dd">스캐너 한 번의 실행을 패키지 식별, 피드 대조, 결과 보고 세 단계로 나누면 패키지 이름과 하위 패키지는 식별 단계에서, 정보 출처와 낡은 출처는 피드 대조 단계에서, 고치지 않기로 한 취약점은 결과 보고 단계에서 결과가 갈린다.</desc>
<rect width="960" height="512" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 07-01 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">같은 이미지가 스캐너마다 다르게 나오는 이유는 세 단계에 흩어져 있습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">오탐은 없는 취약점을 보고하는 것이고, 미탐은 있는 취약점을 놓치는 것입니다.</text>

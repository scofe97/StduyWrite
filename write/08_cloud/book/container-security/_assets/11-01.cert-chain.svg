<title id="dt">인증서 체인은 서명자가 자기 자신인 인증서에서 끝납니다</title><desc id="dd">Ann 인증서는 Bob 이, Bob 인증서는 Carol 이 서명하고 Carol 인증서는 Carol 자신이 서명한다. 서명자가 주체와 같으면 사슬이 끝나고, 다르면 다른 CA 인증서가 끝없이 이어진다.</desc>
<rect width="960" height="476" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">FLOWCHART · 11-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">인증서 체인은 서명자가 자기 자신인 인증서에서 끝납니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">사슬의 끝에서 신뢰는 검증되는 것이 아니라 선택됩니다</text>

<text x="364" y="553" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">나쁜 동작 탐지</text>
<path d="M 454 548 L 500 548" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="504" y="528" width="176" height="40" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="592" y="553" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">보안 도구가 종료</text>
<path d="M 682 548 L 728 548" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="732" y="528" width="176" height="40" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="820" y="553" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">오케스트레이터 재생성</text>
<path d="M 820 570 L 820 588 L 136 588 L 136 572" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<line x1="12" y1="624" x2="912" y2="624" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="646" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>

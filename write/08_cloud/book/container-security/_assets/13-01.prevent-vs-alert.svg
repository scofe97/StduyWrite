<title id="dt">막지 못하는 도구의 경보는 다섯 처리 방식 모두 대가를 치릅니다</title><desc id="dd">이상 동작을 탐지하면 막을 수 있는지 먼저 가른다. 막을 수 있으면 실행 자체가 일어나지 않지만, 막지 못하면 경보를 받아 처리 방식을 골라야 한다. 컨테이너 삭제, 프로세스 종료, 재생성, 롤백, 사람의 조사 각각에 대가가 따르고 재생성은 악순환으로 이어진다.</desc>
<rect width="960" height="684" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 13-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">막지 못하는 도구의 경보는 다섯 처리 방식 모두 대가를 치릅니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">그래서 저자는 치료보다 예방이 낫다고 결론짓습니다.</text>
<path d="M 200 154 L 228 154" fill="none" stroke="#6A95D8" stroke-width="1.4" marker-end="url(#info)"/>
<path d="M 432 154 L 476 154" fill="none" stroke="#F08A59" stroke-width="1.6" marker-end="url(#acc)"/>
<path d="M 332 196 L 332 232" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="24" y="130" width="176" height="48" rx="24" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="112" y="159" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">이상 동작 탐지</text>
<polygon points="232,154 332,114 432,154 332,194" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="332" y="159" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">막을 수 있는가?</text>
<text x="454" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">예</text>
<text x="344" y="220" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#E3B341">아니오</text>
<rect x="480" y="104" width="452" height="100" rx="6" fill="#F08A591F" stroke="#F08A59" stroke-width="1.4"/>
<text x="496" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">예방</text>
<text x="496" y="154" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">프로파일 밖 실행 파일 → 실행 불가</text>
<text x="496" y="174" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">좋은 프로세스는 평소처럼 동작</text>
<text x="496" y="194" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">막으면서 경보 · 로그도 남김 (최선)</text>
<rect x="24" y="236" width="908" height="40" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.1"/>
<text x="478" y="261" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#E3B341">경보 수신 · 처리 방식 선택</text>
<path d="M 110 278 L 110 304" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="24" y="308" width="172" height="48" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="110" y="337" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">컨테이너 자동 삭제</text>
<path d="M 110 358 L 110 380" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="24" y="384" width="172" height="72" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="110" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">사용자 서비스 영향</text>
<text x="110" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">포렌식 증거 삭제</text>
<path d="M 294 278 L 294 304" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="208" y="308" width="172" height="48" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="294" y="337" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">문제 프로세스 종료</text>
<path d="M 294 358 L 294 380" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="208" y="384" width="172" height="72" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="294" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">인젝션에 조종된</text>
<text x="294" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">'좋은' 프로세스</text>
<path d="M 478 278 L 478 304" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="392" y="308" width="172" height="48" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="478" y="337" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">오케스트레이터 재생성</text>
<path d="M 478 358 L 478 380" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="392" y="384" width="172" height="72" rx="6" fill="#F0616D1F" stroke="#F0616D" stroke-width="1.8"/>
<text x="478" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">같은 공격 재수신</text>
<text x="478" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">→ 악순환</text>
<path d="M 662 278 L 662 304" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="576" y="308" width="172" height="48" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="662" y="337" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">이전 버전 롤백</text>
<path d="M 662 358 L 662 380" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="576" y="384" width="172" height="72" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="662" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">새 버전의</text>
<text x="662" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">롤백 가능 여부</text>

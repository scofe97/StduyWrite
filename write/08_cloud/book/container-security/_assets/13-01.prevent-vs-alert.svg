<rect x="24" y="488" width="908" height="112" rx="6" fill="#F0616D0C" stroke="#F0616D" stroke-width="1.4"/>
<text x="40" y="510" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F0616D">악순환</text>

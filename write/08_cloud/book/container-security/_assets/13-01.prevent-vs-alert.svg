<rect x="760" y="308" width="172" height="48" rx="6" fill="#E3B34114" stroke="#E3B341" stroke-width="1.2"/>
<text x="846" y="337" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">사람이 조사</text>
<path d="M 846 358 L 846 380" fill="none" stroke="#F0616D" stroke-width="1.4" marker-end="url(#bad)"/>
<rect x="760" y="384" width="172" height="72" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="846" y="414" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">반응까지 지연</text>
<text x="846" y="436" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">유출 · 피해 시간</text>

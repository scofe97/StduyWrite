<title id="dt">빌드 · 저장 · 배포 세 고리마다 약한 고리와 대응이 있습니다</title><desc id="dd">이미지는 빌드 머신에서 레지스트리를 거쳐 클러스터로 흐르고, 세 단계 모두에 약한 고리가 있으며 단계마다 짝지은 대응이 붙는다.</desc>
<rect width="984" height="500" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CONTAINER SECURITY · 06-02 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">빌드 · 저장 · 배포 세 고리마다 약한 고리와 대응이 있습니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이미지 무결성은 세 단계가 모두 지켜질 때만 성립합니다.</text>
<rect x="20" y="100" width="288" height="328" rx="8" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="0.9" stroke-dasharray="6 5"/>
<text x="36" y="122" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#8B98A9">빌드</text>

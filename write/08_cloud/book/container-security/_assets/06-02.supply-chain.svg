<text x="820.0" y="295" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">태그 대신 다이제스트 참조</text>
<rect x="692" y="324" width="256" height="36" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>
<text x="820.0" y="347" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F0616D">레지스트리 URL 한 글자 변형</text>
<rect x="692" y="368" width="256" height="36" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="820.0" y="391" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">어드미션 컨트롤</text>

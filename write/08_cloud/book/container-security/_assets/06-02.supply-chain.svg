<text x="164.0" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">빌드 머신</text>
<text x="164.0" y="188" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Dockerfile → 이미지</text>
<line x1="164.0" y1="204" x2="164.0" y2="228" stroke="#5E6B7E" stroke-width="1.0"/>
<rect x="36" y="228" width="256" height="36" rx="6" fill="#F08A591F" stroke="#F08A59" stroke-width="1.4"/>
<text x="164.0" y="251" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">RUN 편집 = 원격 코드 실행</text>
<rect x="36" y="272" width="256" height="36" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.1"/>
<text x="164.0" y="295" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#3FB98C">편집 권한 제한 + 코드 리뷰</text>
<rect x="36" y="324" width="256" height="36" rx="6" fill="#F0616D14" stroke="#F0616D" stroke-width="1.1"/>

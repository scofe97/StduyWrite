<svg viewBox="0 0 640 420" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>컨테이너 보안 위협 전체 지도</title>
  <desc>리스크와 위협과 완화를 용어로 가르는 데서 출발해, 컨테이너 생애주기별 공격 벡터를 열거하고, 그 벡터들이 보안 경계를 연달아 넘는 체이닝을 살핀 뒤, 경계의 강도를 결정하는 멀티테넌시 환경을 따지고, 마지막으로 이 모두를 판단할 잣대인 보안 원칙 다섯 가지로 수렴하는 흐름입니다.</desc>

  <style>
    .box { fill: #e8e4df; }
    .box-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .box-detail { fill: #3a3632; font-size: 10.5px; }
    .sec { fill: #3a3632; font-size: 10px; font-weight: 700; }
    .arrow { stroke: #b8b3ad; stroke-width: 1.5; fill: none; }
    .num { fill: #b8b3ad; font-size: 11px; font-weight: 700; }
    .hint { fill: #b8b3ad; font-size: 10.5px; }
    .caution-title { fill: #0d0d0d; font-size: 13px; font-weight: 700; }
    .caution-detail { fill: #0d0d0d; font-size: 10.5px; }
  </style>

  <rect width="640" height="420" fill="#0d0d0d"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <!-- 1 -->
  <text class="num" x="34" y="45">1.</text>
  <rect class="box" x="54" y="24" width="532" height="50" rx="4"/>
  <text class="box-title" x="72" y="46">용어를 가른다</text>
  <text class="box-detail" x="72" y="64">리스크 · 위협 · 완화</text>
  <text class="sec" x="566" y="46" text-anchor="end">§1</text>

  <path class="arrow" d="M320,74 L320,92" marker-end="url(#ah)"/>

  <!-- 2 -->
  <text class="num" x="34" y="119">2.</text>
  <rect class="box" x="54" y="98" width="532" height="50" rx="4"/>
  <text class="box-title" x="72" y="120">위협 모델 — 벡터 9종</text>
  <text class="box-detail" x="72" y="138">코드에서 실행까지 생애주기</text>
  <text class="sec" x="566" y="120" text-anchor="end">§2</text>

  <path class="arrow" d="M320,148 L320,166" marker-end="url(#ah)"/>

  <!-- 3 -->
  <text class="num" x="34" y="193">3.</text>
  <rect class="box" x="54" y="172" width="532" height="50" rx="4"/>
  <text class="box-title" x="72" y="194">보안 경계와 체이닝</text>
  <text class="box-detail" x="72" y="212">벡터를 이어 경계를 연달아 넘는다</text>
  <text class="sec" x="566" y="194" text-anchor="end">§3</text>

  <path class="arrow" d="M320,222 L320,236" marker-end="url(#ah)"/>

  <text class="hint" x="320" y="252" text-anchor="middle">경계의 강도는 환경이 정한다</text>

  <!-- 4 -->
  <text class="num" x="34" y="291">4.</text>
  <rect class="box" x="54" y="266" width="532" height="52" rx="4"/>
  <text class="box-title" x="72" y="290">멀티테넌시</text>
  <text class="box-detail" x="72" y="308">공유 머신 · VM · 컨테이너</text>
  <text class="sec" x="566" y="290" text-anchor="end">§4</text>

  <path class="arrow" d="M320,318 L320,334" marker-end="url(#ah)"/>

  <!-- 5 -->
  <text class="num" x="34" y="371">5.</text>
  <rect class="box" x="54" y="342" width="532" height="56" rx="4"/>
  <text class="box-title" x="72" y="366">보안 원칙 5가지</text>
  <text class="box-detail" x="72" y="386">최소권한 · 심층방어 · 외 3</text>
  <text class="sec" x="566" y="366" text-anchor="end">§5</text>
</svg>

<title id="dt">cgroup 은 디렉토리를 만들고 파일에 값을 쓰는 일로 다룹니다</title><desc id="dd">03-01 의 키워드 개념도. 윗줄은 자원 고갈 공격을 cgroup 이 막고 커널이 /sys/fs/cgroup 에 의사 파일시스템으로 노출하는 모습이다. 가운데 줄은 mkdir 로 cgroup 을 만들고 memory.limit_in_bytes 에 한도를, cgroup.procs 에 PID 를 쓰는 세 동작이다. 아랫줄은 docker run --memory 100M 이 같은 일을 감싸고 cgroup v2 가 계층을 하나로 합치는 흐름이다.</desc>
<rect width="984" height="536" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">ARCHITECTURE · 03-01 OVERVIEW</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">cgroup 은 디렉토리를 만들고 파일에 값을 쓰는 일로 다룹니다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">화살표 위 글자는 두 키워드의 관계, 왼쪽 칩은 그 줄을 다루는 절입니다.</text>

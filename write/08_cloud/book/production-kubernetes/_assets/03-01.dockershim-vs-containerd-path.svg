<title id="dt">컨테이너가 뜨기까지 건너는 층 비교</title><desc id="dd">dockershim 경로는 Docker Engine 을 한 번 더 거치고 containerd 직접 경로는 거치지 않는 차이</desc>
<rect width="1000" height="548" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CALL DEPTH · 03-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">컨테이너가 뜨기까지 건너는 층 비교</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">두 경로 모두 컨테이너의 부모 프로세스는 containerd-shim 입니다</text>
<text x="40" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">dockershim 경로 — 건너는 경계 4개</text>
<rect x="40" y="134" width="420" height="52" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="54" y="165" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">L1</text>
<text x="90" y="165" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">kubelet · dockershim</text>
<text x="446" y="165" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CRI 를 Docker API 로 변환</text>
<path d="M 250.0 188 L 250.0 203" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="40" y="206" width="420" height="52" rx="6" fill="#F0616D10" stroke="#F0616D" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="54" y="237" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">L2</text>
<text x="90" y="237" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F0616D">Docker Engine</text>
<text x="446" y="237" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">내부에서 containerd 에 위임</text>
<path d="M 250.0 260 L 250.0 275" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="40" y="278" width="420" height="52" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>
<text x="54" y="309" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="10" font-weight="400" fill="#5E6B7E">L3</text>
<text x="90" y="309" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#6A95D8">containerd</text>
<text x="446" y="309" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">네임스페이스 moby</text>
<path d="M 250.0 332 L 250.0 347" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="40" y="350" width="420" height="52" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.0"/>

<title id="dt">쿠버네티스 배포 모델과 고가용성 인프라 전체 지도</title><desc id="dd">02-01편의 전체 구조. 배포 모델 선택에서 출발해 아키텍처 토폴로지 설계, 머신 부트스트랩과 업그레이드, 그리고 API 서버 단일 주소 고가용성 보강까지의 흐름.</desc>
<rect width="1000" height="392" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">CHAPTER MAP · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">쿠버네티스 배포 모델과 고가용성 인프라 전체 지도</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">배포 전략 선택 → 아키텍처 토폴로지 → 머신과 수명주기 → 고가용성 보강</text>
<text x="119.75" y="118" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">§1·2</text>
<rect x="12.0" y="132" width="215.5" height="196" rx="6" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.4"/>
<text x="119.75" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#6A95D8">배포 전략</text>
<line x1="30.0" y1="182" x2="209.5" y2="182" stroke="#6A95D844" stroke-width="0.9"/>
<text x="119.75" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">자체 구축과 도구 선택</text>
<text x="30.0" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 매니지드 대 직접 구축</text>
<text x="30.0" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 엔지니어링 비용 저울질</text>
<text x="30.0" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 기성 도구와 맞춤 자동화</text>

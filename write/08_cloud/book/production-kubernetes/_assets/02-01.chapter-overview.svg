<rect x="736.5" y="132" width="215.5" height="196" rx="6" fill="#3FB98C10" stroke="#3FB98C" stroke-width="1.4"/>
<text x="844.25" y="166" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#3FB98C">보강 · 고가용성</text>
<line x1="754.5" y1="182" x2="934.0" y2="182" stroke="#3FB98C44" stroke-width="0.9"/>
<text x="844.25" y="206" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#F5F5F3">주소 한 칸과 세 해결</text>
<text x="754.5" y="236" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 단일 주소 한계 극복</text>
<text x="754.5" y="260" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 외부 LB · VIP · 노드 로컬 프록시</text>
<text x="754.5" y="284" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">· 파드 전용 통신 경로</text>

<text x="86" y="347.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">8</text>
<line x1="100" y1="268.0" x2="940" y2="268.0" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="86" y="272.0" text-anchor="end" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">16</text>

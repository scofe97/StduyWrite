<title id="dt">클러스터가 커질 때 복제본이 어떻게 느는가</title><desc id="dd">가로축은 노드 수, 세로축은 CoreDNS 복제본 수다. 최소 둘을 깔고 16노드당 하나와 256코어당 하나 중 큰 쪽을 따르므로, 노드가 굵을수록 코어 규칙이 먼저 이긴다.</desc>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-03 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">클러스터가 커질 때 복제본이 어떻게 느는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">노드당 코어 수는 원서에 없어 가정으로 둔 값입니다</text>

<text x="934" y="389.25" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">최소 2 — 작은 클러스터는 여기 붙어 있다</text>
<text x="20" y="508" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">노드당 32코어면 256코어 규칙이 8노드마다 하나를 요구해 16노드 규칙보다 먼저 이긴다</text>
<text x="20" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">실제 필요는 워크로드가 정하므로 이 곡선은 출발점이지 답이 아니다</text>

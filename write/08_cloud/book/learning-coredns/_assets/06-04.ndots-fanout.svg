<title id="dt">외부 이름 하나에 질의가 여섯 번 나간다</title><desc id="dd">kubelet 이 ndots 를 5 로 두어 점이 다섯보다 적은 이름에 검색 경로를 붙인다. example.com 은 점이 하나라 다섯 번을 헛돌고 여섯 번째에 성공한다.</desc>

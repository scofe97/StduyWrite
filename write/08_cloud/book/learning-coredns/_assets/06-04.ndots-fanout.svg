<text x="20" y="560" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">검색 경로 넷 중 앞 셋은 kubelet 이 클러스터용으로 넣은 것이고 뒤는 호스트의 것이다</text>
<text x="20" y="584" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">짧은 이름을 쓰게 해 주는 설정의 값을 바깥 이름을 부를 때 치르는 구조다</text>
<text x="20" y="608" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">외부 조회가 잦은 워크로드라면 이것만으로 CoreDNS 부하가 극적으로 는다</text>

<title id="dt">재귀는 포워더가 하고 CoreDNS 는 넘긴다</title><desc id="dd">CoreDNS 는 루트 서버부터 참조를 따라가는 완전 재귀를 수행하지 못한다. 그래서 질의를 포워더에 넘기고, 루트에서 권한 서버까지 내려가는 구간은 포워더가 대신 밟는다.</desc>

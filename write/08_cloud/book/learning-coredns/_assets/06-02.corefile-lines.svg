<rect x="256" y="532" width="208" height="36" rx="4" fill="#3FB98C16" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="360.0" y="555" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">디버깅 불가능한 실패를 막는다</text>
<rect x="480" y="532" width="208" height="36" rx="4" fill="#3FB98C16" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="584.0" y="555" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">지우지 않는다</text>

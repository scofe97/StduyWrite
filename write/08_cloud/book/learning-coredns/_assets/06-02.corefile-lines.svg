<text x="360.0" y="515" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">클러스터 안에는 아낄 것이 없다</text>
<rect x="480" y="492" width="208" height="36" rx="4" fill="#F0616D16" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="584.0" y="515" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">클러스터 밖 질의가 없으면</text>

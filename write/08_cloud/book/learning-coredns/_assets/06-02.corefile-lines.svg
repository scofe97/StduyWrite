<text x="360.0" y="475" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">앞선 플러그인이 안 잡은 질의</text>

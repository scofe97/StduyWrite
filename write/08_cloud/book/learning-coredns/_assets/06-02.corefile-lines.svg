<text x="360.0" y="395" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">CIDR 을 다 못 적었을 때 안전장치</text>
<rect x="480" y="372" width="208" height="36" rx="4" fill="#E3B34116" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="584.0" y="395" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">CIDR 을 전부 열거했으면</text>
<rect x="12" y="412" width="232" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="435" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">prometheus :9153</text>
<text x="232" y="435" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">메트릭을 연다</text>
<rect x="256" y="412" width="208" height="36" rx="4" fill="#3FB98C16" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="360.0" y="435" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">기본은 localhost 만 듣는다</text>
<rect x="480" y="412" width="208" height="36" rx="4" fill="#E3B34116" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="584.0" y="435" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#E3B341">긁어 가지 않으면</text>
<rect x="12" y="452" width="232" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="475" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">forward . …</text>
<text x="232" y="475" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">나머지를 상류로</text>

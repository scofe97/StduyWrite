<text x="24" y="355" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">upstream</text>
<text x="232" y="355" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">CNAME 되질의</text>
<rect x="256" y="332" width="208" height="36" rx="4" fill="#8B98A914" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="360.0" y="355" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">1.4 이후 기본 동작</text>
<rect x="480" y="332" width="208" height="36" rx="4" fill="#F0616D16" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="584.0" y="355" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">1.4 이상이면 지운다</text>
<rect x="12" y="372" width="232" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="395" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">fallthrough …</text>
<text x="232" y="395" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">모르는 PTR 을 넘김</text>

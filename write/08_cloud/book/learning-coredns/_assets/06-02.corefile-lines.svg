<title id="dt">기본 Corefile 의 줄과 지울 수 있는 조건</title><desc id="dd">행이 기본 Corefile 의 지시어 열두 줄, 열이 그 줄을 판단하는 두 물음이다. 지울 수 있는 줄과 지우면 안 되는 줄이 사연에 따라 갈린다.</desc>
<rect width="736" height="712" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">기본 Corefile 의 줄과 지울 수 있는 조건</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 줄이 저자들이 직접 고치겠다고 예고한 자리입니다</text>
<rect x="12" y="104" width="232" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="128.0" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">Corefile 의 줄</text>
<text x="128.0" y="146" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">대 판단하는 물음</text>
<rect x="256" y="104" width="208" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.4"/>
<text x="360.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">왜 거기 있나</text>
<text x="360.0" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">줄의 사연</text>
<rect x="480" y="104" width="208" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.4"/>
<text x="584.0" y="126" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">지울 수 있는 조건</text>
<text x="584.0" y="144" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">없으면 무엇이 깨지나</text>
<rect x="12" y="172" width="232" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="195" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">errors</text>
<text x="232" y="195" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">오류를 로그로</text>
<rect x="256" y="172" width="208" height="36" rx="4" fill="#3FB98C16" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="360.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">없으면 SERVFAIL 만 남는다</text>
<rect x="480" y="172" width="208" height="36" rx="4" fill="#3FB98C16" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="584.0" y="195" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">지우지 않는다</text>
<rect x="12" y="212" width="232" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="235" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">health</text>
<text x="232" y="235" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">kubelet 이 부른다</text>
<rect x="256" y="212" width="208" height="36" rx="4" fill="#3FB98C16" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="360.0" y="235" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">프로브가 이 엔드포인트를 본다</text>
<rect x="480" y="212" width="208" height="36" rx="4" fill="#3FB98C16" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="584.0" y="235" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">지우지 않는다</text>
<rect x="12" y="252" width="232" height="36" rx="4" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="24" y="275" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">kubernetes …</text>
<text x="232" y="275" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">클러스터 존에 권한</text>
<rect x="256" y="252" width="208" height="36" rx="4" fill="#3FB98C16" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="360.0" y="275" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">이 플러그인이 이 편의 주인공</text>
<rect x="480" y="252" width="208" height="36" rx="4" fill="#3FB98C16" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="584.0" y="275" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#3FB98C">지우면 클러스터 DNS 가 아니다</text>

<text x="24" y="315" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F5F5F3">pods insecure</text>
<text x="232" y="315" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">kube-dns 하위 호환</text>
<rect x="256" y="292" width="208" height="36" rx="4" fill="#8B98A914" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="360.0" y="315" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">폐기된 명세 부분을 켠다</text>
<rect x="480" y="292" width="208" height="36" rx="4" fill="#F0616D16" stroke="rgba(191,192,192,0.22)" stroke-width="0.6"/>
<text x="584.0" y="315" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">파드 레코드가 필요 없으면</text>

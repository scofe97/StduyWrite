<title id="dt">클러스터 도메인 아래 이름이 갈리는 자리</title><desc id="dd">명세의 모든 레코드는 클러스터 도메인 하나 아래 들어간다. 그 아래에서 svc 갈래와 pod 갈래가 나뉘고, 왼쪽 갈래만 Service 선언에서 유도되며 오른쪽 갈래는 폐기됐다.</desc>
<rect width="940" height="656" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">클러스터 도메인 아래 이름이 갈리는 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">붉은 갈래는 명세가 스스로 걷어낸 자리입니다</text>
<line x1="470" y1="156" x2="470" y2="176" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="250" y1="176" x2="690" y2="176" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="250" y1="176" x2="250" y2="208" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="250" y1="264" x2="250" y2="316" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="250" y1="372" x2="250" y2="424" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="690" y1="176" x2="690" y2="208" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="690" y1="264" x2="690" y2="316" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="690" y1="372" x2="690" y2="424" stroke="#8B98A9" stroke-width="1.0"/>
<rect x="340.0" y="100" width="260" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="470" y="126" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">cluster.local</text>
<text x="470" y="146" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">클러스터 도메인 · 바닐라는 바꿀 수 있다</text>
<rect x="120.0" y="208" width="260" height="56" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.4"/>
<text x="250" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#3FB98C">svc</text>
<text x="250" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">Service 선언에서 유도된다</text>
<rect x="560.0" y="208" width="260" height="56" rx="6" fill="#F0616D12" stroke="#F0616D" stroke-width="1.4"/>
<text x="690" y="234" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F0616D">pod</text>
<text x="690" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">폐기된 갈래</text>
<rect x="120.0" y="316" width="260" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="250" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">&lt;namespace&gt;</text>
<rect x="560.0" y="316" width="260" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="690" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">&lt;namespace&gt;</text>
<rect x="120.0" y="424" width="260" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="250" y="450" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">&lt;service&gt;</text>
<text x="250" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여기서 레코드가 나온다</text>
<rect x="560.0" y="424" width="260" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="690" y="450" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">a-b-c-d</text>
<text x="690" y="470" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">존재 확인을 하지 않는다</text>
<text x="250" y="512" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F08A59">A · PTR · SRV</text>
<text x="250" y="534" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">clusterIP 면 A 하나, None 이면 엔드포인트 수만큼</text>
<text x="250" y="556" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">_포트이름._프로토콜 을 앞에 붙이면 SRV</text>
<text x="690" y="512" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="15" font-weight="600" fill="#F0616D">A 만</text>
<text x="690" y="534" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">와일드카드 인증서용이었지만</text>
<text x="690" y="556" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">네임스페이스 신원을 약화시킨다</text>
<line x1="12" y1="584" x2="892" y2="584" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="606" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="596" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">선언에서 유도되는 갈래</text>
<rect x="300" y="596" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="322" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">명세가 폐기한 갈래</text>
<rect x="474" y="596" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="496" y="606" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">실제로 나오는 레코드</text>

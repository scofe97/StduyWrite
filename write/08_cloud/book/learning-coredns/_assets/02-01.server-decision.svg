<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">질의를 받은 서버가 밟는 판단 순서</title><desc id="dd">권한과 캐시를 먼저 보고, 포워더가 설정돼 있으면 넘기고, 아니면 루트부터 참조를 따라간다. 맨 아래 갈래만이 재귀이며 그 일을 지는 것은 질의를 받은 첫 서버 하나다.</desc>
<rect width="880" height="720" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 02-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">질의를 받은 서버가 밟는 판단 순서</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">마름모에서 오른쪽이 예, 아래가 아니오입니다</text>
<rect x="200" y="90" width="200" height="44" rx="20" fill="none" stroke="#8B98A9" stroke-width="1.2"/>
<text x="300" y="118" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">질의를 받는다</text>
<path d="M 300 134 L 300 168" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 300 168 L 432 212 L 300 256 L 168 212 Z" fill="none" stroke="#8B98A9" stroke-width="1.0"/>
<text x="300" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">권한 있는 존인가</text>
<path d="M 432 212 L 596 212" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="468" y="200" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">예</text>
<rect x="600" y="186" width="256" height="52" rx="6" fill="#3FB98C14" stroke="#3FB98C" stroke-width="1.2"/>
<text x="728.0" y="210" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">존 데이터로 확정 응답</text>
<text x="728.0" y="229" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">authoritative</text>
<path d="M 300 256 L 300 300" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="314" y="282" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">아니오</text>
<path d="M 300 300 L 432 344 L 300 388 L 168 344 Z" fill="none" stroke="#8B98A9" stroke-width="1.0"/>
<text x="300" y="342" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">캐시에 있는가</text>
<path d="M 432 344 L 596 344" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="468" y="332" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">예</text>
<rect x="600" y="318" width="256" height="52" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="728.0" y="342" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">캐시로 응답</text>
<text x="728.0" y="361" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">TTL 이 남은 동안</text>
<path d="M 300 388 L 300 432" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="314" y="414" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">아니오</text>
<path d="M 300 432 L 432 476 L 300 520 L 168 476 Z" fill="none" stroke="#8B98A9" stroke-width="1.0"/>
<text x="300" y="474" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">포워더가 설정됐는가</text>
<path d="M 432 476 L 596 476" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="468" y="464" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">예</text>
<rect x="600" y="450" width="256" height="52" rx="6" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="728.0" y="474" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">포워더에 재귀 질의</text>
<text x="728.0" y="493" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서버가 서버에 재귀를 보내는 유일한 경우</text>
<path d="M 300 520 L 300 564" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="314" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">아니오</text>
<rect x="144" y="564" width="312" height="60" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="300" y="590" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">루트 힌트에서 시작해 참조를 따라간다</text>
<text x="300" y="611" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">이 갈래만이 recursion</text>
<text x="600" y="578" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">참조를 돌려주는 서버들은</text>
<text x="600" y="600" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">재귀를 하지 않는다 — 갖고 있는</text>
<text x="600" y="622" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">NS 레코드로 답할 뿐이다</text>
<line x1="12" y1="652" x2="832" y2="652" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="674" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="664" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="674" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">재귀를 지는 갈래</text>
<rect x="261" y="664" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="283" y="674" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">확정 응답</text>
<rect x="370" y="664" width="14" height="12" rx="2" fill="#6A95D822" stroke="#6A95D8" stroke-width="1.1"/>
<text x="392" y="674" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">남에게 기대는 응답</text>
</svg>
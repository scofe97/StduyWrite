<title id="dt">도메인은 통째, 존은 위임하고 남은 만큼</title><desc id="dd">바깥 사각형이 도메인이고, 링과 링 사이의 띠 하나가 그 도메인의 존이다. 위임할 때마다 안쪽 사각형이 하나 생기고 그만큼이 바깥 존에서 빠져나간다.</desc>
<rect width="880" height="588" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 02-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">도메인은 통째, 존은 위임하고 남은 만큼</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">띠 하나가 관리 주체 하나에 대응합니다</text>
<rect x="40" y="96" width="800" height="344" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<rect x="54" y="88" width="76" height="16" fill="#0D1117"/>
<text x="60" y="100" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">edu 도메인</text>
<text x="820" y="122" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">edu 존 · EDUCAUSE 가 직접 관리</text>
<rect x="72" y="132" width="736" height="272" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.1"/>
<rect x="86" y="124" width="148" height="16" fill="#0D1117"/>
<text x="92" y="136" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#5E6B7E">berkeley.edu 도메인</text>
<text x="788" y="158" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">berkeley.edu 존 · Berkeley IT 부서</text>
<rect x="104" y="168" width="672" height="200" rx="8" fill="#F08A590A" stroke="#F08A59" stroke-width="1.4"/>
<rect x="118" y="160" width="172" height="16" fill="#0D1117"/>
<text x="124" y="172" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">cs.berkeley.edu 도메인</text>
<text x="440" y="236" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">위임이 없으면 도메인과 존이 같다</text>
<text x="440" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">cs.berkeley.edu 아래로 더 위임하지 않는 한</text>
<text x="440" y="300" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">CS 학과가 이 안의 노드를 직접 관리하고</text>
<text x="440" y="324" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">Berkeley IT 는 더 이상 관여하지 않는다</text>
<text x="440" y="476" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">berkeley.edu 도메인은 cs.berkeley.edu 를 품지만, berkeley.edu 존은 품지 않는다</text>
<text x="440" y="500" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">위임한 쪽에는 "어디로 가면 찾을 수 있는지"만 남는다</text>
<line x1="12" y1="524" x2="832" y2="524" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="546" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="536" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="546" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">위임받아 따로 관리되는 도메인</text>
</svg>
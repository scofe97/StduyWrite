<title id="dt">Caddy 에서 물려받은 세 가지</title><desc id="dd">Miek Gieben 은 Caddy 의 아키텍처를 높이 사 그것을 포크해 CoreDNS 를 만들었다. 물려받은 것은 단순한 설정 문법, 플러그인 기반 아키텍처, Go 기반 셋이며 아랫줄이 각각 CoreDNS 에서 취한 모습이다.</desc>
<rect width="940" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 01-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Caddy 에서 물려받은 세 가지</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">이 셋이 곧 2절에서 4절까지의 뼈대입니다</text>
<line x1="468" y1="152" x2="468" y2="184" stroke="#8B98A9" stroke-width="1.0"/>

<title id="dt">호스트 테이블 한 줄이 만드는 것</title><desc id="dd">주소와 정규 이름과 별칭으로 된 한 줄에서 레코드 세 갈래가 나온다. 별칭까지 주소로 이어지는 쪽과 주소에서 이름으로 되돌아오는 쪽이 다르다는 점이 이 절에서 걸리는 자리다.</desc>
<rect width="940" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 04-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">호스트 테이블 한 줄이 만드는 것</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">별칭은 CNAME 이 아니라 주소 레코드가 됩니다</text>
<line x1="468" y1="152" x2="468" y2="184" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="208" y1="184" x2="728" y2="184" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="208" y1="184" x2="208" y2="216" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="208" y1="272" x2="208" y2="312" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="468" y1="184" x2="468" y2="216" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="468" y1="272" x2="468" y2="312" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="728" y1="184" x2="728" y2="216" stroke="#8B98A9" stroke-width="1.0"/>
<line x1="728" y1="272" x2="728" y2="312" stroke="#8B98A9" stroke-width="1.0"/>
<rect x="368.0" y="96" width="200" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="468" y="122" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">호스트 테이블 한 줄</text>
<text x="468" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">주소 · 정규 이름 · 별칭</text>
<rect x="108.0" y="216" width="200" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="208" y="242" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">A 레코드</text>
<text x="208" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">항목이 IPv4 일 때</text>
<rect x="108.0" y="312" width="200" height="56" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="208" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">정규 이름과 별칭 전부</text>
<text x="208" y="358" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F08A59">별칭도 CNAME 이 아니다</text>
<rect x="368.0" y="216" width="200" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="468" y="242" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">AAAA 레코드</text>
<text x="468" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">항목이 IPv6 일 때</text>
<rect x="368.0" y="312" width="200" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="468" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">정규 이름과 별칭 전부</text>
<text x="468" y="358" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">A 와 같은 방식</text>
<rect x="628.0" y="216" width="200" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="728" y="242" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="14" font-weight="600" fill="#F5F5F3">PTR 레코드</text>
<text x="728" y="262" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">주소당 하나</text>
<rect x="628.0" y="312" width="200" height="56" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="728" y="338" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">정규 이름만</text>
<text x="728" y="358" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">별칭으로는 안 돌아온다</text>
<text x="12" y="246" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">무엇이 생기나</text>
<text x="12" y="342" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">누구를 가리키나</text>
<text x="20" y="416" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">no_reverse 를 주면 PTR 을 만들지 않고, ttl 기본값은 3600초다 — 단위 없이 정수로만 적는다</text>
<text x="20" y="438" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">이렇게 만든 존에는 SOA 가 없어 다른 서버로 전송할 수 없다 — 존 전체가 아니라 이름 몇 개를 싣는 용도다</text>
<line x1="12" y1="458" x2="892" y2="458" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="480" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="470" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="480" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">별칭 처리가 갈리는 자리</text>
</svg>
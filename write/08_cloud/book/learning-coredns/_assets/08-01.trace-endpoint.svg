<text x="492" y="361" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">datadog 은 변환 없음</text>
<rect x="20" y="380" width="330" height="54" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<rect x="360" y="380" width="110" height="54" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<rect x="480" y="380" width="380" height="54" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="32" y="413" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">trace datadog</text>
<text x="372" y="413" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">zipkin</text>
<text x="492" y="403" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="600" fill="#F08A59">http://datadog/api/v2/spans</text>
<text x="492" y="423" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">인자 하나는 엔드포인트</text>
<text x="20" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">every · service · client_server 는 블록 안 · 엔드포인트 규칙과 무관</text>

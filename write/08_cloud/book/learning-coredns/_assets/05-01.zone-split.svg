<title id="dt">같은 서버 블록에서 존 인자가 질의를 가른다</title><desc id="dd">example.com:5300 블록의 질의는 모두 log 를 지난다. etcd 는 services.example.com 아래 이름에만 답하고, 그 밖의 example.com 이름은 다음 플러그인인 forward 가 /etc/resolv.conf 의 서버로 넘긴다.</desc>
<rect width="880" height="450" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 05-01 §5</text>

<title id="dt">파드 IP 를 그대로 나눠 주면 목록이 낡는다</title><desc id="dd">Deployment 의 파드는 죽거나 업그레이드되면 새 IP 로 다시 뜬다. 처음 받은 주소 목록을 들고 있는 클라이언트는 파드가 하나 바뀌면 셋 중 둘만, 전부 바뀌면 하나도 맞추지 못한다.</desc>

<title id="dt">도구마다 무엇을 남기고 어디서 깎는가</title><desc id="dd">관측 도구 여섯을 보는 것, 아무것도 적지 않았을 때 남는 것, 값을 깎는 손잡이, 원서 이후 바뀐 것으로 나란히 놓았다. 손잡이 열을 따라 읽으면 도구를 고르는 일이 곧 손잡이를 고르는 일이라는 이 노트의 축이 보인다.</desc>

<title id="dt">키는 5초 뒤 지워져도 응답은 30초를 산다</title><desc id="dd">0초에 리스가 5초 남은 키를 물으면 리스 유래 TTL 5 가 하한 30 으로 올라간다. 메시지에 ttl 이 없으면 응답 TTL 은 30 이고, 키가 5초에 지워진 뒤에도 그 응답을 캐시한 클라이언트는 30초까지 옛 주소를 쓴다.</desc>
<rect width="880" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 05-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">키는 5초 뒤 지워져도 응답은 30초를 산다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 괄호가 키는 없는데 캐시는 살아 있는 구간입니다</text>
<text x="220" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">0s</text>
<line x1="220" y1="128" x2="220" y2="336" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 6"/>
<text x="305" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">5s</text>
<line x1="305" y1="128" x2="305" y2="336" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 6"/>
<text x="390" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">10s</text>
<line x1="390" y1="128" x2="390" y2="336" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 6"/>
<text x="475" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">15s</text>
<line x1="475" y1="128" x2="475" y2="336" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 6"/>
<text x="560" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">20s</text>
<line x1="560" y1="128" x2="560" y2="336" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 6"/>
<text x="645" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">25s</text>
<line x1="645" y1="128" x2="645" y2="336" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 6"/>
<text x="730" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">30s</text>
<line x1="730" y1="128" x2="730" y2="336" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 6"/>
<text x="815" y="120" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">35s</text>
<line x1="815" y1="128" x2="815" y2="336" stroke="rgba(191,192,192,0.22)" stroke-width="0.6" stroke-dasharray="2 6"/>
<line x1="220" y1="128" x2="815" y2="128" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="20" y="168" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">etcd 키</text>
<text x="20" y="188" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">리스 5초 남음</text>
<text x="20" y="238" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">CoreDNS 응답</text>
<text x="20" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">0초에 받은 답</text>
<text x="20" y="308" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">클라이언트 캐시</text>
<text x="20" y="328" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">그 답을 저장</text>
<rect x="220" y="156" width="85" height="28" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="315" y="175" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">리스 만료 · 키 삭제</text>
<rect x="220" y="226" width="510" height="28" rx="4" fill="#161B22" stroke="#8B98A9" stroke-width="1.0"/>
<text x="317" y="245" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">응답 TTL 30 · 리스 5초를 하한 30 으로</text>
<rect x="220" y="296" width="85" height="28" rx="4" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<rect x="305" y="296" width="425" height="28" rx="4" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="317" y="315" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#F0616D">죽은 주소를 계속 쓴다</text>
<text x="738" y="315" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">재질의</text>
<line x1="305" y1="140" x2="305" y2="336" stroke="#F0616D" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 305 346 L 305 354 L 730 354 L 730 346" fill="none" stroke="#F08A59" stroke-width="1.4"/>
<text x="517.5" y="374" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">25초 · 키는 없는데 캐시는 살아 있다</text>
<text x="20" y="404" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">메시지 ttl 을 10 으로 적으면 · 응답 TTL 10 · 이 구간이 5초로 준다</text>
<line x1="12" y1="420" x2="832" y2="420" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="442" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="432" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="122" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">키가 살아 있는 동안</text>
<rect x="287" y="432" width="14" height="12" rx="2" fill="#F0616D22" stroke="#F0616D" stroke-width="1.1"/>
<text x="309" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">죽은 주소를 쓰는 동안</text>
<rect x="487" y="432" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="509" y="442" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">어긋나는 구간</text>
</svg>
<title id="dt">가중치를 나눈 뒤에 중복을 거른다</title><desc id="dd">CoreDNS 는 같은 우선순위 엔드포인트 수로 100 을 먼저 나누고, 그다음 대상 이름과 포트가 같은 SRV 를 거른다. 그래서 넷이 같은 이름 myhost 를 가진 Example 6-7 은 한 줄만 남고 그 가중치는 25 다.</desc>
<rect width="880" height="400" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">가중치를 나눈 뒤에 중복을 거른다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 칸이 합이 100 이 아닌 응답입니다</text>
<text x="32" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">원서 예</text>
<text x="212" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">엔드포인트</text>
<text x="322" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">대상 이름</text>
<text x="532" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">가중치 계산</text>
<text x="692" y="118" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#5E6B7E">중복 제거 · 응답</text>
<rect x="20" y="132" width="170" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="32" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Example 6-5</text>
<text x="32" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">대상이 서로 다름</text>
<path d="M 191 172 L 198 172" fill="none" stroke="#5E6B7E" stroke-width="1.1" marker-end="url(#soft)"/>
<rect x="200" y="132" width="100" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="212" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">넷</text>
<path d="M 301 172 L 308 172" fill="none" stroke="#5E6B7E" stroke-width="1.1" marker-end="url(#soft)"/>
<rect x="310" y="132" width="200" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="322" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">10-5-104-3 외 셋</text>
<text x="322" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">서로 다른 이름</text>
<path d="M 511 172 L 518 172" fill="none" stroke="#5E6B7E" stroke-width="1.1" marker-end="url(#soft)"/>
<rect x="520" y="132" width="150" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="532" y="166" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">100 ÷ 4 = 25</text>
<text x="532" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">넷 모두</text>
<path d="M 671 172 L 678 172" fill="none" stroke="#5E6B7E" stroke-width="1.1" marker-end="url(#soft)"/>
<rect x="680" y="132" width="180" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="692" y="166" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">SRV 넷 · 각 25</text>
<text x="692" y="190" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">합 100</text>
<rect x="20" y="224" width="170" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="32" y="258" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">Example 6-7</text>
<text x="32" y="282" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">hostname: myhost</text>
<path d="M 191 264 L 198 264" fill="none" stroke="#5E6B7E" stroke-width="1.1" marker-end="url(#soft)"/>
<rect x="200" y="224" width="100" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="212" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">넷</text>
<path d="M 301 264 L 308 264" fill="none" stroke="#5E6B7E" stroke-width="1.1" marker-end="url(#soft)"/>
<rect x="310" y="224" width="200" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="322" y="258" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">myhost</text>
<text x="322" y="282" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">넷이 같은 이름</text>
<path d="M 511 264 L 518 264" fill="none" stroke="#5E6B7E" stroke-width="1.1" marker-end="url(#soft)"/>
<rect x="520" y="224" width="150" height="80" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="532" y="258" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">100 ÷ 4 = 25</text>
<text x="532" y="282" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">넷 모두</text>
<path d="M 671 264 L 678 264" fill="none" stroke="#5E6B7E" stroke-width="1.1" marker-end="url(#soft)"/>
<rect x="680" y="224" width="180" height="80" rx="6" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="692" y="258" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">SRV 한 줄 · 25</text>
<text x="692" y="282" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">합 25</text>
<text x="20" y="336" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">소스 주석 · 중복 SRV 를 나중에 버리면 가중치가 어긋날 수 있다</text>
<line x1="12" y1="352" x2="832" y2="352" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="374" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="364" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="374" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">합이 100 이 아닌 응답</text>
</svg>
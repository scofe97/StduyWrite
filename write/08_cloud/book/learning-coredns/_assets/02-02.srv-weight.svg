<title id="dt">가중치는 같은 우선순위 안에서만 나눈다</title><desc id="dd">클라이언트는 먼저 가장 낮은 우선순위 값을 가진 대상들만 후보로 삼는다. 그 안에서 가중치의 합 대비 자기 몫만큼 나눠 가지므로, 200 과 100 이면 2 대 1 이 된다.</desc>

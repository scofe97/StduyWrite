<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">Corefile 문법이 품는 네 겹과 그 바닥</title><desc id="dd">엔트리 안에 블록이 있고, 블록 안에 지시어가 있고, 지시어의 인자가 길면 다시 중괄호로 감싼다. 그 안에 서브지시어까지는 들어가지만 거기서 끝이다.</desc>
<rect width="880" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 03-01 §3</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Corefile 문법이 품는 네 겹과 그 바닥</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">바깥 두 겹만 중괄호가 그리고, 안쪽 둘은 문법이 품는 관계입니다</text>
<rect x="40" y="96" width="800" height="340" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="54" y="88" width="59" height="16" fill="#0D1117"/>
<text x="60" y="100" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">엔트리</text>
<text x="820" y="122" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">라벨 + 정의</text>
<rect x="72" y="132" width="736" height="268" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="86" y="124" width="46" height="16" fill="#0D1117"/>
<text x="92" y="136" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">블록</text>
<text x="788" y="158" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여는 중괄호는 라벨 줄 끝, 닫는 중괄호는 홀로 한 줄</text>
<rect x="104" y="168" width="672" height="196" rx="8" fill="#0D1117" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<rect x="118" y="160" width="111" height="16" fill="#0D1117"/>
<text x="124" y="172" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">지시어와 인자</text>
<text x="756" y="194" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">줄마다 지시어 하나로 시작한다</text>
<rect x="136" y="204" width="608" height="124" rx="8" fill="#F08A590A" stroke="#F08A59" stroke-width="1.4"/>
<rect x="150" y="196" width="85" height="16" fill="#0D1117"/>
<text x="156" y="208" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">서브지시어</text>
<text x="440" y="250" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">새 중괄호 블록을 열 수 없다</text>
<text x="440" y="276" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">저자가 "작은 자비"라 부르는 지점</text>
<text x="440" y="302" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">여기가 Corefile 문법의 바닥이다</text>
<text x="20" y="468" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">라벨이 여러 줄에 걸치면 마지막 줄을 뺀 각 줄의 끝 라벨은 쉼표로 닫는다</text>
<text x="20" y="490" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">주석은 # 로 시작해 줄 끝까지 가고, 정의는 관례상 탭으로 들여쓰지만 강제는 아니다</text>
<line x1="12" y1="510" x2="832" y2="510" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="532" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="522" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="532" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">더 들어갈 수 없는 층</text>
</svg>
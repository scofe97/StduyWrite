<title id="dt">원서의 문법 항목이 지금 어디까지 유효한가</title><desc id="dd">가로축은 날짜가 아니라 CoreDNS 버전 구간이다. 막대가 끊긴 자리가 그 항목이 문법에서 사라진 지점이고, 제거를 예고한 것은 resyncperiod 하나뿐이다.</desc>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-04 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">원서의 문법 항목이 지금 어디까지 유효한가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">1.5.0 경계에서 resyncperiod 의 성격이 바뀝니다</text>
<text x="319.0" y="116" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#5E6B7E">1.2 이전</text>

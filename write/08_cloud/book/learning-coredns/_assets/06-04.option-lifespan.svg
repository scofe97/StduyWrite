<text x="20" y="460" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">셋이 사라진 정확한 릴리스는 확인하지 못했고, master 문법 블록에 없다는 것만 확인했다</text>

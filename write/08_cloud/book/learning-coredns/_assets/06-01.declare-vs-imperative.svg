<title id="dt">프로세스가 죽은 뒤 누가 알아채는가</title><desc id="dd">명령형 API 는 명령을 실행하고 끝나므로 프로세스가 죽어도 모른다. 선언형 API 는 바라는 상태를 받아 두고 감시하다가 죽으면 다시 띄운다. 가로축은 시각이 아니라 사건의 순서다.</desc>
<rect width="880" height="440" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">프로세스가 죽은 뒤 누가 알아채는가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 막대가 선언형만 하는 일입니다</text>
<text x="297.5" y="118" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#5E6B7E">요청</text>

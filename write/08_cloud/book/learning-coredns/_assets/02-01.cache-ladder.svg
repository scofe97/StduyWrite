<title id="dt">캐시는 사다리의 시작점을 끌어내린다</title><desc id="dd">가로축은 시간이 아니라 해석 사다리의 단계다. 막대가 짧을수록 그 질의가 실제로 밟은 구간이 짧고, 짧아진 만큼이 앞선 질의가 캐시에 남긴 것이다.</desc>

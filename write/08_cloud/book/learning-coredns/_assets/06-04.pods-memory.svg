<title id="dt">pods 모드에 따른 CoreDNS 메모리</title><desc id="dd">원서가 실측으로 든 네 값이다. 세로축은 인스턴스 하나가 쓰는 메모리이고, verified 는 파드를 전부 캐시해야 해서 나머지 두 모드의 두 배 안팎을 쓴다.</desc>

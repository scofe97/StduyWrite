<title id="dt">이름에 적힌 IP 를 확인 없이 돌려준다</title><desc id="dd">prod 네임스페이스의 클라이언트가 10-5-88-7.prod.pod 를 묻는다. 확인하지 않는 모드는 이름에서 IP 를 꺼내 그대로 답하고, 클라이언트는 실제로 dev 에 있는 파드를 prod 의 파드로 믿고 접속한다.</desc>
<rect width="880" height="560" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-01 §8</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">이름에 적힌 IP 를 확인 없이 돌려준다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 칸이 빠진 확인 단계입니다</text>

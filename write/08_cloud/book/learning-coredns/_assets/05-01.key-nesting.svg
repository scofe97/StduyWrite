<title id="dt">같은 계층을 반대로 읽으면 키가 된다</title><desc id="dd">링은 도메인 이름의 레이블이다. 바깥에서 안으로 읽으면 etcd 키가 되고, 안에서 바깥으로 읽으면 도메인 이름이 된다. 값은 가장 안쪽 링에 놓인다.</desc>
<rect width="880" height="632" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 05-01 §5</text>

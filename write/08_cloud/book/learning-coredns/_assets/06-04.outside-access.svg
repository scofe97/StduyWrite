<title id="dt">어디서 도느냐가 붙는 설정 줄을 정한다</title><desc id="dd">클러스터 안 파드로 돌면 설정 줄 없이 서비스 어카운트로 API 서버에 붙는다. 클러스터 밖에서 돌면 endpoint 와 tls 로 URL 과 인증서를 주거나, kubeconfig 하나로 주소와 인증을 함께 준다. 둘 다 적으면 kubeconfig 가 이긴다.</desc>
<rect width="880" height="470" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">LEARNING COREDNS · 06-04 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">어디서 도느냐가 붙는 설정 줄을 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">주황 열이 이 소절이 다루는 설정 줄입니다</text>

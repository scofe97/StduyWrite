<title id="dt">세 벌의 설정에 들어가는 플러그인</title><desc id="dd">행이 기본 플러그인 일곱, 열이 원서가 든 세 벌의 Corefile 이다. 캐싱 전용은 권한이 없어 root·file 이 필요 없고, 주 서버와 보조 서버는 재귀까지 맡을 때만 forward·cache 를 더한다.</desc>

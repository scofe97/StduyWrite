<title id="dt">상태는 아래에 모으고 위는 몇 대든 늘린다</title><desc id="dd">윗단의 CoreDNS 는 자기 상태를 갖지 않아 어느 인스턴스가 답해도 결과가 같다. 영속 상태는 전부 아랫단의 etcd 에 있고, 쿼럼만 살아 있으면 하나를 잃어도 계속 돈다.</desc>

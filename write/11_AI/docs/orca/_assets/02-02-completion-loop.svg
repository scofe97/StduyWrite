<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" role="img" aria-labelledby="tg dg">
<title id="tg">신호로 폴링하고 결과물로 판정하는 루프</title>
<desc id="dg">짧은 대기와 결과물 확인을 반복하다가 완료 파일이 보이면 빠져나오는 순환 흐름이고, 오른쪽에 판정 재료 네 가지가 신뢰도 순으로 놓여 있습니다. 완료 파일 재료만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.lbl{fill:var(--ink);font-size:12px;font-weight:600}
.note{fill:var(--muted);font-size:10px}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.mat{fill:var(--ink);font-size:12px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="356" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">POLL WITH SIGNAL · JUDGE WITH ARTIFACT</text>
<text class="kr h1" x="64" y="76">신호는 폴링용, 판정은 결과물로</text>
<text class="kr sub" x="64" y="98">대기 조건을 완료 판정에 쓰지 않습니다. 짧게 기다리고 결과물을 봅니다.</text>

<rect class="box" x="64" y="140" width="180" height="56" rx="4"/>
<text class="kr lbl" x="88" y="164">짧게 기다린다</text>
<text class="mn note" x="88" y="182">--timeout-ms 30000</text>

<path class="arrow" d="M244 168 L300 168"/><path class="arrow" d="M292 163 L300 168 L292 173"/>

<rect class="box" x="300" y="140" width="180" height="56" rx="4"/>
<text class="kr lbl" x="324" y="164">결과물을 본다</text>
<text class="mn note" x="324" y="182">git status --short</text>

<path class="arrow" d="M390 196 L390 244 L154 244 L154 196"/><path class="arrow" d="M149 204 L154 196 L159 204"/>
<text class="kr note" x="220" y="264">아직이면 반복 · timeout 은 실패가 아닙니다</text>

<path class="arrow" d="M480 168 L536 168"/><path class="arrow" d="M528 163 L536 168 L528 173"/>
<rect class="box" x="536" y="140" width="160" height="56" rx="4"/>
<text class="kr lbl" x="560" y="172">완료</text>

<line class="hair" x1="736" y1="128" x2="936" y2="128"/>
<text class="kr col" x="736" y="148">판정 재료</text>
<line class="hair" x1="736" y1="160" x2="936" y2="160"/>
<rect x="728" y="168" width="216" height="40" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr mat" x="744" y="186">완료 파일 존재</text>
<text class="kr note" x="744" y="202">가장 튼튼합니다</text>
<text class="kr mat" x="744" y="234">테스트 통과</text>
<text class="kr mat" x="744" y="266">파일 변경</text>
<text class="kr mat" x="744" y="298">마무리 보고 문구</text>
<text class="kr note" x="744" y="330">아래로 갈수록 약한 근거입니다</text>
</svg>

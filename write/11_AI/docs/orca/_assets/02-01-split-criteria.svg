<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" role="img" aria-labelledby="ta da">
<title id="ta">워크트리를 나눌 때와 나누지 않을 때의 기준</title>
<desc id="da">왼쪽에 워크트리를 나눠야 하는 네 경우, 오른쪽에 나누지 않아도 되는 세 경우를 나란히 둔 비교표입니다. 동시 실행 항목만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--warn:#E3B341}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.colY{fill:var(--ok);font-size:11px;letter-spacing:.08em}
.colN{fill:var(--warn);font-size:11px;letter-spacing:.08em}
.item{fill:var(--ink);font-size:12px}
.why{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
.legend{fill:var(--soft);font-size:10px}
</style>
<rect width="1000" height="372" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">WHEN TO SPLIT</text>
<text class="kr h1" x="64" y="76">한 워크트리 = 한 PR 크기</text>
<text class="kr sub" x="64" y="98">PR 하나로 올릴 만한 크기가 워크트리 하나의 크기입니다.</text>

<line class="hair" x1="64" y1="124" x2="484" y2="124"/>
<text class="kr colY" x="64" y="144">나눈다</text>
<line class="hair" x1="64" y1="156" x2="484" y2="156"/>

<rect x="56" y="164" width="436" height="44" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr item" x="72" y="184">에이전트를 둘 이상 동시에 돌린다</text>
<text class="kr why" x="72" y="200">파일 충돌 방지 — 이것만 필수입니다</text>

<text class="kr item" x="72" y="236">실패해도 되는 실험을 한다</text>
<text class="kr why" x="72" y="252">원본을 안전하게 유지</text>
<text class="kr item" x="72" y="284">같은 일을 두 방식으로 시켜 비교한다</text>
<text class="kr why" x="72" y="300">결과를 나란히 두고 고름</text>
<text class="kr item" x="72" y="332">리뷰 대기 중에 다른 일을 시작한다</text>
<text class="kr why" x="72" y="348">대기 작업을 안 건드림</text>

<line class="hair" x1="516" y1="124" x2="936" y2="124"/>
<text class="kr colN" x="516" y="144">안 나눈다</text>
<line class="hair" x1="516" y1="156" x2="936" y2="156"/>

<text class="kr item" x="524" y="184">한 줄 수정처럼 즉시 끝나는 일</text>
<text class="kr why" x="524" y="200">생성·정리 비용이 더 큼</text>
<text class="kr item" x="524" y="236">여러 파일에 걸친 하나의 작업</text>
<text class="kr why" x="524" y="252">논리적 작업이 하나면 워크트리도 하나</text>
<text class="kr item" x="524" y="284">읽기만 하는 조사 작업</text>
<text class="kr why" x="524" y="300">파일을 안 고치면 충돌이 없음</text>

<line class="hair" x1="516" y1="316" x2="936" y2="316"/>
<text class="kr legend" x="524" y="336">비용: 디스크 · 터미널 세션 메모리 ·</text>
<text class="kr legend" x="524" y="352">설정 스크립트 재실행. 무료가 아닙니다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" role="img" aria-labelledby="u3 v3">
<title id="u3">워크트리가 막아 주는 것과 막아 주지 않는 것</title>
<desc id="v3">워크트리가 막아 주는 항목 둘과 막아 주지 않는 항목 다섯을 좌우로 나눈 비교표이며, 아래에 실제 경계 역할을 하는 장치가 나열돼 있습니다. 막아 주지 않는 쪽만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.colOk{fill:var(--ok);font-size:11px;letter-spacing:.06em}
.colBad{fill:var(--bad);font-size:11px;letter-spacing:.06em}
.item{fill:var(--ink);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="372" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">NOT A SANDBOX</text>
<text class="kr h1" x="64" y="76">워크트리는 보안 경계가 아닙니다</text>
<text class="kr sub" x="64" y="98">코드 변경의 격리이지 프로세스의 격리가 아닙니다. 이 구분이 이 편의 전부입니다.</text>

<line class="hair" x1="64" y1="128" x2="440" y2="128"/>
<text class="kr colOk" x="64" y="148">막아 줍니다</text>
<line class="hair" x1="64" y1="160" x2="440" y2="160"/>
<text class="kr item" x="64" y="188">다른 워크트리 파일을 덮어쓰기</text>
<text class="kr item" x="64" y="216">브랜치가 섞이는 것</text>
<text class="kr note" x="64" y="248">여기까지가 전부입니다</text>

<rect x="472" y="120" width="472" height="176" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr colBad" x="488" y="148">막아 주지 않습니다</text>
<line class="hair" x1="488" y1="160" x2="928" y2="160"/>
<text class="kr item" x="488" y="184">워크트리 밖 파일 읽기 · 쓰기</text>
<text class="kr item" x="488" y="208">환경 변수 읽기</text>
<text class="kr item" x="488" y="232">네트워크 통신</text>
<text class="kr item" x="488" y="256">외부 서비스 조작 · 배포</text>
<text class="kr item" x="488" y="280">다른 프로그램 실행</text>

<line class="hair" x1="64" y1="316" x2="936" y2="316"/>
<text class="kr note" x="64" y="336">프로세스를 실제로 가두는 것은 일회용 환경(컨테이너·VM)과 네트워크 이그레스 제한뿐입니다.</text>
<text class="kr note" x="64" y="356">커밋 전 검토와 결정 게이트는 프로세스가 아니라 결과가 반영되는 시점을 통제합니다.</text>
</svg>

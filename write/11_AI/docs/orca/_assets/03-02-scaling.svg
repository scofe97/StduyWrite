<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="ts ds">
<title id="ts">읽는 워커와 쓰는 워커를 늘릴 때 드는 비용의 차이</title>
<desc id="ds">읽는 워커는 워크트리를 공유해 값싸게 늘릴 수 있고 쓰는 워커는 워크트리 분리와 병합 절차를 요구해 비싸다는 대비표입니다. 읽는 워커 쪽만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--warn:#E3B341}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.kind{fill:var(--ink);font-size:14px;font-weight:600}
.cell{fill:var(--ink);font-size:12px}
.ok{fill:var(--ok);font-size:12px}
.warn{fill:var(--warn);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="320" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">SCALING AXIS</text>
<text class="kr h1" x="64" y="76">늘릴 때는 쓰는 워커 수로 셉니다</text>
<text class="kr sub" x="64" y="98">에이전트 수가 아니라 파일을 고치는 에이전트 수가 비용을 정합니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">워커 종류</text>
<text class="kr col" x="320" y="148">워크트리</text>
<text class="kr col" x="536" y="148">추가 비용</text>
<text class="kr col" x="760" y="148">예</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<rect x="56" y="176" width="888" height="56" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr kind" x="64" y="202">읽는 워커</text>
<text class="kr note" x="64" y="220">리뷰 · 조사 · 검증</text>
<text class="kr cell" x="320" y="202">공유 가능</text>
<text class="kr ok" x="536" y="202">세션 하나 값</text>
<text class="kr note" x="760" y="202">보안·성능·가독성 3인 리뷰</text>

<text class="kr kind" x="64" y="272">쓰는 워커</text>
<text class="kr note" x="64" y="290">구현 · 문서 · 리팩터링</text>
<text class="kr cell" x="320" y="272">분리 필수</text>
<text class="kr warn" x="536" y="272">워크트리 + 병합 절차</text>
<text class="kr note" x="760" y="272">구현 둘을 병렬로 돌릴 때</text>
</svg>

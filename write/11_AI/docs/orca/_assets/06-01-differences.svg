<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="uf vf">
<title id="uf">원서의 Windows 절차와 macOS 절차가 갈리는 지점</title>
<desc id="vf">명령 종료 문법·사전 검사 문법·컴퓨터 유즈 승인·iOS 시뮬레이터 네 항목에서 두 플랫폼이 갈린다는 대조표이고, 아래에 CLI 명령 자체는 동일하다는 결론이 있습니다. 명령 종료 문법 행만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.item{fill:var(--ink);font-size:12px}
.p{fill:var(--muted);font-size:11px}
.note{fill:var(--muted);font-size:10px}
.ok{fill:var(--ok);font-size:11px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="340" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">PLATFORM DELTA</text>
<text class="kr h1" x="64" y="76">갈리는 것은 셸 문법과 경로뿐입니다</text>
<text class="kr sub" x="64" y="98">명령 자체는 플랫폼과 무관하게 같았습니다. 셀렉터·응답 구조·오류 코드가 전부 동일했습니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">항목</text>
<text class="kr col" x="360" y="148">Windows</text>
<text class="kr col" x="640" y="148">macOS</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<rect x="56" y="176" width="888" height="48" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr item" x="64" y="198">명령 종료 이어붙이기</text>
<text class="mn p" x="360" y="198">&lt;명령&gt; &amp; exit</text>
<text class="mn p" x="640" y="198">&lt;명령&gt;; exit</text>
<text class="kr note" x="360" y="216">zsh 에서 &amp; 는 백그라운드라 첫 exit 가 거부됩니다</text>

<text class="kr item" x="64" y="256">빈 출력 거르기</text>
<text class="mn p" x="360" y="256">| findstr . &gt;nul</text>
<text class="mn p" x="640" y="256">| grep -q .</text>

<text class="kr item" x="64" y="288">컴퓨터 유즈 승인</text>
<text class="mn p" x="360" y="288">unsupported</text>
<text class="mn p" x="640" y="288">not-granted + 헬퍼 앱</text>

<text class="kr item" x="64" y="320">iOS 시뮬레이터</text>
<text class="kr p" x="360" y="320">사용 불가</text>
<text class="kr ok" x="640" y="320">사용 가능</text>
</svg>

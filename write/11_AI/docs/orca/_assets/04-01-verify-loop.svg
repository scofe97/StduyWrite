<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 336" role="img" aria-labelledby="tu du">
<title id="tu">조작 후 스냅샷에 반영되는 값·마스킹·상태 영역</title>
<desc id="du">조작 뒤 스냅샷에서 입력값·마스킹된 비밀번호·상태 메시지 세 가지가 확인된다는 것을 항목별로 보인 그림입니다. 상태 메시지 항목만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--ok:#3FB98C;--info:#6A95D8}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.item{fill:var(--ink);font-size:13px}
.mn11{fill:var(--muted);font-size:11px}
.why{fill:var(--muted);font-size:10px}
.ok{fill:var(--ok);font-size:11px}
.info{fill:var(--info);font-size:11px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="336" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">SNAPSHOT AS ASSERTION</text>
<text class="kr h1" x="64" y="76">다시 읽으면 검증이 끝납니다</text>
<text class="kr sub" x="64" y="98">별도 단언 도구 없이 트리 텍스트에 기대한 문구가 있는지만 봅니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">확인되는 것</text>
<text class="kr col" x="392" y="148">스냅샷에 나타나는 모습</text>
<text class="kr col" x="704" y="148">쓸모</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="kr item" x="64" y="196">입력값이 들어갔는가</text>
<text class="mn mn11" x="392" y="196">textbox "아이디" [ref=e4]: demo</text>
<text class="kr why" x="704" y="196">조작이 먹혔는지 확인</text>

<text class="kr item" x="64" y="240">비밀번호는 어떻게 보이나</text>
<text class="mn mn11" x="392" y="240">textbox "비밀번호": ••••••••</text>
<text class="kr info" x="704" y="240">평문이 안 실립니다</text>
<text class="kr why" x="704" y="258">단 명령줄에는 남습니다</text>

<rect x="56" y="272" width="888" height="48" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr item" x="64" y="294">기대한 결과가 떴는가</text>
<text class="mn mn11" x="392" y="294">status → "로그인 성공: demo"</text>
<text class="kr ok" x="704" y="294">이 한 줄이 검증입니다</text>
<text class="kr why" x="704" y="312">픽셀 비교와 달리 오탐이 없습니다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" role="img" aria-labelledby="ty dy">
<title id="ty">플랫폼별 지원 범위와 승인 상태 표시의 차이</title>
<desc id="dy">Windows와 macOS에서 승인 상태·헬퍼·미승인 시 동작이 어떻게 다른지, 그리고 두 플랫폼에서 공통으로 지원되지 않는 항목이 무엇인지 비교한 표입니다. macOS 행만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--bad:#F0616D;--ok:#3FB98C}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.col{fill:var(--soft);font-size:10px;letter-spacing:.08em}
.plat{fill:var(--ink);font-size:14px;font-weight:600}
.mn11{fill:var(--muted);font-size:11px}
.note{fill:var(--muted);font-size:10px}
.bad{fill:var(--bad);font-size:11px}
.hair{stroke:var(--rule);stroke-width:1}
</style>
<rect width="1000" height="356" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">capabilities &amp; permissions</text>
<text class="kr h1" x="64" y="76">같은 필드를 다른 뜻으로 읽습니다</text>
<text class="kr sub" x="64" y="98">unsupported 는 승인할 항목이 없다는 뜻이고, not-granted 는 아직 승인하지 않았다는 뜻입니다.</text>

<line class="hair" x1="64" y1="128" x2="936" y2="128"/>
<text class="kr col" x="64" y="148">플랫폼</text>
<text class="kr col" x="264" y="148">승인 상태</text>
<text class="kr col" x="504" y="148">nextStep</text>
<text class="kr col" x="736" y="148">승인 주체</text>
<line class="hair" x1="64" y1="164" x2="936" y2="164"/>

<text class="kr plat" x="64" y="196">win32</text>
<text class="kr note" x="64" y="214">원서 실측</text>
<text class="mn mn11" x="264" y="196">unsupported</text>
<text class="mn mn11" x="504" y="196">null</text>
<text class="kr note" x="736" y="196">승인 절차 없음</text>

<rect x="56" y="232" width="888" height="52" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<text class="kr plat" x="64" y="258">darwin</text>
<text class="kr note" x="64" y="276">이 노트 실측</text>
<text class="mn mn11" x="264" y="258">not-granted</text>
<text class="kr note" x="504" y="258">Grant Accessibility …</text>
<text class="kr note" x="736" y="258">별도 헬퍼 앱</text>
<text class="kr note" x="736" y="276">Orca Computer Use.app</text>

<line class="hair" x1="64" y1="304" x2="936" y2="304"/>
<text class="kr bad" x="64" y="326">양쪽 공통 미지원 — 창 포커스 이동 · 메뉴 · 다이얼로그 · 독 · 메뉴바</text>
<text class="kr note" x="64" y="344">원서는 이 제약을 Windows 한계로 설명했으나 darwin 에서도 같았습니다. 플랫폼 한정이 아닙니다.</text>
</svg>

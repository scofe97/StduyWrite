<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="tt dt">
<title id="tt">선택자 방식과 스냅샷 방식의 순서 대비</title>
<desc id="dt">선택자 방식은 화면을 모른 채 이름을 맞혀 조작하고, 스냅샷 방식은 읽고 고르고 다시 읽는 순환을 도는 대비 그림입니다. 스냅샷 순환만 강조돼 있습니다.</desc>
<style>
svg{--paper:#0D1117;--paper2:#161B22;--ink:#F5F5F3;--muted:#8B98A9;--soft:#5E6B7E;--rule:rgba(191,192,192,0.22);--accent:#F08A59;--accent12:rgba(240,138,89,0.12);--bad:#F0616D}
.kr{font-family:'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
.mn{font-family:'Geist Mono','Noto Sans Mono CJK KR',monospace}
.eyebrow{fill:var(--soft);font-size:9px;letter-spacing:.14em}
.h1{fill:var(--ink);font-size:20px;font-weight:600}
.sub{fill:var(--muted);font-size:11px}
.cap{fill:var(--ink);font-size:13px;font-weight:600}
.box{fill:var(--paper2);stroke:var(--rule);stroke-width:1}
.st{fill:var(--ink);font-size:12px}
.note{fill:var(--muted);font-size:10px}
.bad{fill:var(--bad);font-size:11px}
.arrow{stroke:var(--soft);stroke-width:1;fill:none}
</style>
<rect width="1000" height="340" fill="var(--paper)"/>
<text class="mn eyebrow" x="64" y="44">READ FIRST, THEN ACT</text>
<text class="kr h1" x="64" y="76">화면을 모르는 쪽이 먼저 읽습니다</text>
<text class="kr sub" x="64" y="98">에이전트는 개발자 도구를 열 수 없습니다. 그래서 순서를 뒤집습니다.</text>

<text class="kr cap" x="64" y="140">선택자 방식</text>
<rect class="box" x="64" y="152" width="168" height="44" rx="4"/>
<text class="mn st" x="88" y="180">#login-button</text>
<path class="arrow" d="M232 174 L288 174"/><path class="arrow" d="M280 169 L288 174 L280 179"/>
<rect class="box" x="288" y="152" width="140" height="44" rx="4"/>
<text class="kr st" x="312" y="180">조작</text>
<text class="kr bad" x="452" y="170">이름을 맞혀야 합니다</text>
<text class="kr note" x="452" y="188">틀리면 무엇이 틀렸는지도 모릅니다</text>

<line x1="64" y1="220" x2="936" y2="220" stroke="var(--rule)" stroke-width="1"/>

<text class="kr cap" x="64" y="252">스냅샷 방식</text>
<rect x="56" y="264" width="888" height="60" rx="4" fill="var(--accent12)" stroke="var(--accent)" stroke-width="1.4"/>
<rect class="box" x="72" y="276" width="152" height="36" rx="4"/>
<text class="mn st" x="96" y="300">snapshot</text>
<path class="arrow" d="M224 294 L272 294"/><path class="arrow" d="M264 289 L272 294 L264 299"/>
<rect class="box" x="272" y="276" width="176" height="36" rx="4"/>
<text class="mn st" x="296" y="300">click / fill</text>
<path class="arrow" d="M448 294 L496 294"/><path class="arrow" d="M488 289 L496 294 L488 299"/>
<rect class="box" x="496" y="276" width="152" height="36" rx="4"/>
<text class="mn st" x="520" y="300">snapshot</text>
<text class="kr note" x="672" y="288">읽은 것 중에서 고릅니다</text>
<text class="kr note" x="672" y="308">조작 결과가 같은 형식으로 돌아옵니다</text>
</svg>

<title id="dt">판단을 만드는 학습 과정</title><desc id="dd">현상에서 판단 수정까지 여섯 단계가 한 줄로 이어진다. 검색과 AI 는 가설을 세운 뒤에 들어온다. 예상과 반증 조건을 먼저 적어야 실제 결과와의 차이가 보이고, 그 차이를 기록할 때 경험이 지식으로 남는다.</desc>

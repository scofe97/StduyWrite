<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" role="img"
     font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>설계를 증명하는 도구와 프로덕션의 자리</title>
  <desc>저자들은 이론적 설계를 증명할 가장 좋은 장소가 고객이 실제로 상호작용하는 프로덕션이라고 적습니다. 다른 환경은 모두 모의 환경이라 고객 상호작용의 미묘함을 놓칠 수 있기 때문이며, 이는 프로덕션으로 가는 경로를 일찍 만들고 자주 쓰라는 권고입니다. 그럼에도 시험 공간은 필요하며 컨테이너화 도구와 가상화 도구로 인프라를 세우고 데모 애플리케이션이나 미리 녹화한 데이터셋으로 데이터를 넣습니다.</desc>

  <style>
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; }
  </style>

  <rect width="880" height="430" fill="#0d0d0d"/>

  <text x="30" y="34" fill="#e8e4df" font-size="17" font-weight="700">설계를 어디서 증명하는가</text>
  <text x="30" y="55" fill="#b8b3ad" font-size="12">저자들의 답이 도발적이다</text>

  <!-- production claim -->
  <rect x="30" y="76" width="820" height="74" rx="8" fill="rgb(212,168,83)"/>
  <text x="50" y="104" fill="#0d0d0d" font-size="14" font-weight="700">가장 좋은 곳은 프로덕션이다</text>
  <text x="50" y="128" fill="#1a1a1a" font-size="12">다른 환경은 모의 환경이다</text>
  <rect x="560" y="94" width="272" height="40" rx="5" fill="#fdf3df"/>
  <text x="572" y="112" fill="#5c4410" font-size="11" font-weight="700">프로덕션 경로를 일찍 만들고</text>
  <text x="572" y="128" fill="#5c4410" font-size="11" font-weight="700">자주 쓰라는 권고다</text>

  <text x="30" y="176" fill="#e8e4df" font-size="13" font-weight="700">그래도 시험 공간은 필요하다</text>

  <!-- infra tools -->
  <rect x="30" y="188" width="400" height="112" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.8"/>
  <rect x="30" y="188" width="400" height="28" rx="8" fill="#66bb6a"/>
  <rect x="30" y="208" width="400" height="8" fill="#66bb6a"/>
  <text x="48" y="208" fill="#0d0d0d" font-size="12.5" font-weight="700">인프라를 세운다</text>

  <text x="48" y="234" fill="#e8e4df" font-size="11">로컬 쿠버네티스</text>
  <rect x="150" y="222" width="264" height="20" rx="3" fill="#e6f7e7"/>
  <text class="code" x="158" y="236" fill="#14521d">k3d · KinD · MicroK8s · minikube</text>

  <text x="48" y="262" fill="#e8e4df" font-size="11">가상화</text>
  <rect x="150" y="250" width="264" height="20" rx="3" fill="#e6f7e7"/>
  <text class="code" x="158" y="264" fill="#14521d">Vagrant</text>
  <text x="212" y="264" fill="#14521d" font-size="10.5">+ 여러 프로바이더</text>

  <rect x="48" y="276" width="366" height="18" rx="3" fill="#e6f7e7"/>
  <text x="58" y="289" fill="#14521d" font-size="10.5" font-weight="700">저자들은 KinD 를 썼다</text>

  <!-- data tools -->
  <rect x="450" y="188" width="400" height="112" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8"/>
  <rect x="450" y="188" width="400" height="28" rx="8" fill="#5b9bd5"/>
  <rect x="450" y="208" width="400" height="8" fill="#5b9bd5"/>
  <text x="468" y="208" fill="#e8e4df" font-size="12.5" font-weight="700">데이터를 넣는다</text>

  <text x="468" y="234" fill="#e8e4df" font-size="11">데모 앱</text>
  <rect x="540" y="222" width="292" height="20" rx="3" fill="#dceaf7"/>
  <text class="code" x="548" y="236" fill="#10243a">OTel Demo · mythical-creatures</text>

  <text x="468" y="262" fill="#e8e4df" font-size="11">녹화 재생</text>
  <rect x="540" y="250" width="292" height="20" rx="3" fill="#dceaf7"/>
  <text class="code" x="548" y="264" fill="#10243a">k6 · Locust · Postman · GHZ</text>

  <rect x="468" y="276" width="364" height="18" rx="3" fill="#dceaf7"/>
  <text x="478" y="289" fill="#10243a" font-size="10.5" font-weight="700">부하 테스트·패킷 캡처와 겹친다</text>

  <!-- protocol caveat -->
  <rect x="30" y="314" width="820" height="96" rx="8" fill="#0d0d0d" stroke="#f44336" stroke-width="1.8"/>
  <text x="50" y="338" fill="#f44336" font-size="13" font-weight="700">프로토콜이 맞아야 한다</text>
  <text x="50" y="360" fill="#e8e4df" font-size="11.5">조직의 데이터 생산과 맞아야 한다</text>

  <rect x="50" y="372" width="380" height="24" rx="4" fill="#f2d4d4"/>
  <text x="62" y="389" fill="#7a1f1f" font-size="10.5" font-weight="700">gRPC — OTel 의 흔한 형식</text>
  <rect x="446" y="372" width="386" height="24" rx="4" fill="#f2d4d4"/>
  <text x="458" y="389" fill="#7a1f1f" font-size="10.5" font-weight="700">SNMP 등 쓰는 것이 있다면 그것도</text>
</svg>

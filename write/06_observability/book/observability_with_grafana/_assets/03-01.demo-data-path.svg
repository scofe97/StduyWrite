<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif" role="img">
  <title>OTel 데모 애플리케이션의 데이터 경로</title>
  <desc>OpenTelemetry 데모 애플리케이션에서 생성된 텔레메트리가 수집기를 거쳐 Grafana Cloud 의 각 백엔드로 전달되는 경로입니다.</desc>
  <style>
    .bg { fill: #0d0d0d; }
    .title { fill: #e8e4df; font-size: 17px; font-weight: 700; }
    .sub { fill: #b8b3ad; font-size: 12px; }
    .zone { fill: #b8b3ad; font-size: 12px; font-weight: 700; }
    .hd { font-size: 14px; font-weight: 700; }
    .note { font-size: 11.5px; }
    .mono { font-size: 11px; }
    .code { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="520"/>

  <text class="title" x="30" y="34">데모 환경의 데이터 경로</text>
  <text class="sub" x="30" y="55">한 곳에 모였다 갈라진다</text>

  <!-- LOCAL zone -->
  <rect x="30" y="76" width="470" height="330" rx="10" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text class="zone" x="46" y="98" fill="#5b9bd5">로컬 — k3d 단일 노드</text>

  <!-- demo app -->
  <rect x="50" y="112" width="430" height="96" rx="8" fill="#dceaf7"/>
  <text class="hd" x="66" y="136" fill="#10243a">OpenTelemetry Demo</text>
  <text class="note" x="66" y="157" fill="#1a1a1a">마이크로서비스 19개 Pod</text>
  <rect x="66" y="168" width="180" height="26" rx="4" fill="#0d0d0d"/>
  <text class="code" x="78" y="185" fill="#5b9bd5">checkoutservice</text>
  <rect x="254" y="168" width="210" height="26" rx="4" fill="#0d0d0d"/>
  <text class="code" x="266" y="185" fill="#5b9bd5">productcatalogueservice …</text>

  <path d="M 265 208 L 265 240" stroke="#b8b3ad" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b8b3ad"/>
    </marker>
  </defs>
  <text class="code" x="276" y="230" fill="#b8b3ad">OTLP</text>

  <!-- collector -->
  <rect x="50" y="244" width="430" height="144" rx="8" fill="rgb(212,168,83)"/>
  <text class="hd" x="66" y="268" fill="#0d0d0d">OTel Collector</text>
  <text class="note" x="66" y="288" fill="#1a1a1a">수신구 두 개</text>
  <rect x="66" y="300" width="196" height="30" rx="4" fill="#fdf3df"/>
  <text class="code" x="78" y="320" fill="#0d0d0d">4317 — gRPC</text>
  <rect x="270" y="300" width="196" height="30" rx="4" fill="#fdf3df"/>
  <text class="code" x="282" y="320" fill="#0d0d0d">4318 — HTTP(s)</text>
  <rect x="66" y="340" width="400" height="34" rx="4" fill="#fdf3df"/>
  <text class="mono" x="78" y="361" fill="#7a1f1f">OTEL-Creds.yaml</text>

  <!-- CLOUD zone -->
  <rect x="530" y="76" width="340" height="330" rx="10" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text class="zone" x="546" y="98" fill="rgb(212,168,83)">Grafana Cloud</text>

  <rect x="550" y="112" width="300" height="76" rx="8" fill="#66bb6a"/>
  <text class="hd" x="566" y="134" fill="#0d0d0d">Loki — 로그</text>
  <rect x="566" y="144" width="268" height="32" rx="4" fill="#e6f7e7"/>
  <text class="code" x="576" y="157" fill="#14521d">+ /loki/api/v1/push</text>
  <text class="mono" x="576" y="171" fill="#14521d">월 50 GB</text>

  <rect x="550" y="200" width="300" height="76" rx="8" fill="#66bb6a"/>
  <text class="hd" x="566" y="222" fill="#0d0d0d">Mimir — 메트릭</text>
  <rect x="566" y="232" width="268" height="32" rx="4" fill="#e6f7e7"/>
  <text class="code" x="576" y="245" fill="#14521d">+ /api/prom/push</text>
  <text class="mono" x="576" y="259" fill="#14521d">월 10,000 시계열</text>

  <rect x="550" y="288" width="300" height="100" rx="8" fill="#f2d4d4"/>
  <text class="hd" x="566" y="310" fill="#7a1f1f">Tempo — 트레이스</text>
  <rect x="566" y="320" width="268" height="50" rx="4" fill="#fbeaea"/>
  <text class="code" x="576" y="336" fill="#7a1f1f">host:443 (no https://)</text>
  <text class="mono" x="576" y="352" fill="#7a1f1f">← 혼자만 형식이 다르다</text>
  <text class="mono" x="576" y="366" fill="#7a1f1f">월 50 GB</text>

  <!-- arrows collector -> cloud -->
  <path d="M 480 300 L 528 150" stroke="#66bb6a" stroke-width="1.8" fill="none" marker-end="url(#ar2)"/>
  <path d="M 480 310 L 528 238" stroke="#66bb6a" stroke-width="1.8" fill="none" marker-end="url(#ar2)"/>
  <path d="M 480 320 L 528 330" stroke="#e39b9b" stroke-width="1.8" fill="none" marker-end="url(#ar3)"/>
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#66bb6a"/>
    </marker>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#e39b9b"/>
    </marker>
  </defs>

  <!-- bottom insight -->
  <rect x="30" y="420" width="840" height="76" rx="8" fill="#0d0d0d" stroke="rgb(42,37,32)" stroke-width="1"/>
  <text class="note" x="50" y="444" fill="rgb(212,168,83)" font-weight="700">자격증명이 갈리는 방식</text>
  <text class="note" x="50" y="466" fill="#e8e4df">토큰은 공유, 사용자명은 신호별</text>
  <text class="note" x="50" y="486" fill="#e8e4df">정책에 쓰기 권한 셋 필요</text>
</svg>

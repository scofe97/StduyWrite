<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <style>
    .bg { fill: #0d0d0d; }
    .title { fill: #e8e4df; font-size: 17px; font-weight: 700; }
    .sub { fill: #8a8580; font-size: 12px; }
    .zone { fill: #8a8580; font-size: 12px; font-weight: 700; }
    .hd { font-size: 14px; font-weight: 700; }
    .note { font-size: 11.5px; }
    .mono { font-family: 'SF Mono', Menlo, monospace; font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="520"/>

  <text class="title" x="30" y="34">데모 환경의 데이터 경로 — 내 노트북에서 Grafana Cloud 까지</text>
  <text class="sub" x="30" y="55">신호 셋이 Collector 한 곳에 모였다가 각기 다른 엔드포인트로 갈라져 나간다. 인증 토큰은 셋이 공유하고, 사용자명과 주소는 신호마다 다르다.</text>

  <!-- LOCAL zone -->
  <rect x="30" y="76" width="470" height="330" rx="10" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text class="zone" x="46" y="98" fill="#5b9bd5">로컬 — k3d 단일 노드 Kubernetes 클러스터</text>

  <!-- demo app -->
  <rect x="50" y="112" width="430" height="96" rx="8" fill="#dceaf7"/>
  <text class="hd" x="66" y="136" fill="#10243a">OpenTelemetry Demo — 천체 관측 쇼핑몰</text>
  <text class="note" x="66" y="157" fill="#1a1a1a">여러 언어로 작성된 마이크로서비스 약 19개 Pod</text>
  <rect x="66" y="168" width="180" height="26" rx="4" fill="#0d0d0d"/>
  <text class="mono" x="78" y="185" fill="#5b9bd5">checkoutservice</text>
  <rect x="254" y="168" width="210" height="26" rx="4" fill="#0d0d0d"/>
  <text class="mono" x="266" y="185" fill="#5b9bd5">productcatalogueservice …</text>

  <path d="M 265 208 L 265 240" stroke="#8a8580" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8580"/>
    </marker>
  </defs>
  <text class="mono" x="276" y="230" fill="#8a8580">OTLP</text>

  <!-- collector -->
  <rect x="50" y="244" width="430" height="144" rx="8" fill="rgb(212,168,83)"/>
  <text class="hd" x="66" y="268" fill="#0d0d0d">OpenTelemetry Collector</text>
  <text class="note" x="66" y="288" fill="#1a1a1a">수신구 두 개를 열어 둔다. 내 앱을 붙일 때 쓰는 자리다.</text>
  <rect x="66" y="300" width="196" height="30" rx="4" fill="#fdf3df"/>
  <text class="mono" x="78" y="320" fill="#0d0d0d">4317 — gRPC</text>
  <rect x="270" y="300" width="196" height="30" rx="4" fill="#fdf3df"/>
  <text class="mono" x="282" y="320" fill="#0d0d0d">4318 — HTTP(s)</text>
  <rect x="66" y="340" width="400" height="34" rx="4" fill="#fdf3df"/>
  <text class="mono" x="78" y="361" fill="#7a1f1f">OTEL-Creds.yaml — 토큰·사용자명·엔드포인트</text>

  <!-- CLOUD zone -->
  <rect x="530" y="76" width="340" height="330" rx="10" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text class="zone" x="546" y="98" fill="rgb(212,168,83)">Grafana Cloud — 무료 티어</text>

  <rect x="550" y="112" width="300" height="76" rx="8" fill="#66bb6a"/>
  <text class="hd" x="566" y="134" fill="#0d0d0d">Loki — 로그</text>
  <rect x="566" y="144" width="268" height="32" rx="4" fill="#e6f7e7"/>
  <text class="mono" x="576" y="157" fill="#14521d">URL 뒤에 /loki/api/v1/push</text>
  <text class="mono" x="576" y="171" fill="#14521d">월 50 GB</text>

  <rect x="550" y="200" width="300" height="76" rx="8" fill="#66bb6a"/>
  <text class="hd" x="566" y="222" fill="#0d0d0d">Mimir — 메트릭</text>
  <rect x="566" y="232" width="268" height="32" rx="4" fill="#e6f7e7"/>
  <text class="mono" x="576" y="245" fill="#14521d">URL 뒤에 /api/prom/push</text>
  <text class="mono" x="576" y="259" fill="#14521d">월 10,000 시계열</text>

  <rect x="550" y="288" width="300" height="100" rx="8" fill="#f2d4d4"/>
  <text class="hd" x="566" y="310" fill="#7a1f1f">Tempo — 트레이스</text>
  <rect x="566" y="320" width="268" height="50" rx="4" fill="#fbeaea"/>
  <text class="mono" x="576" y="336" fill="#7a1f1f">https:// 를 떼고 :443 을 붙임</text>
  <text class="mono" x="576" y="352" fill="#7a1f1f">← 혼자만 형식이 다르다</text>
  <text class="mono" x="576" y="366" fill="#7a1f1f">월 50 GB</text>

  <!-- arrows collector -> cloud -->
  <path d="M 480 300 L 528 150" stroke="#66bb6a" stroke-width="1.8" fill="none" marker-end="url(#ar2)"/>
  <path d="M 480 310 L 528 238" stroke="#66bb6a" stroke-width="1.8" fill="none" marker-end="url(#ar2)"/>
  <path d="M 480 320 L 528 330" stroke="#e39b9b" stroke-width="1.8" fill="none" marker-end="url(#ar3)"/>
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#66bb6a"/>
    </marker>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#e39b9b"/>
    </marker>
  </defs>

  <!-- bottom insight -->
  <rect x="30" y="420" width="840" height="76" rx="8" fill="#141414"/>
  <text class="note" x="50" y="444" fill="rgb(212,168,83)" font-weight="700">자격증명이 갈리는 방식 — 인증 실패의 대부분이 여기서 난다</text>
  <text class="note" x="50" y="466" fill="#e8e4df">비밀번호(API 토큰)는 신호 셋이 공유한다. 사용자명(보통 여섯 자리 숫자)과 엔드포인트는 신호마다 다르다.</text>
  <text class="note" x="50" y="486" fill="#e8e4df">토큰에 묶인 접근 정책이 로그·메트릭·트레이스 세 가지 쓰기 권한을 모두 갖고 있어야 한다.</text>
</svg>

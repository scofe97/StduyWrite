<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <style>
    .bg { fill: #0d0d0d; }
    .title { fill: #e8e4df; font-size: 17px; font-weight: 700; }
    .sub { fill: #8a8580; font-size: 12px; }
    .boxlabel { font-size: 14px; font-weight: 700; }
    .item { font-size: 12.5px; }
    .mono { font-family: 'SF Mono', Menlo, monospace; font-size: 11.5px; }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="470"/>

  <text class="title" x="30" y="34">같은 갑문, 같은 데이터 — 무엇을 묻느냐가 갈린다</text>
  <text class="sub" x="30" y="55">파나마 운하 아구아클라라 갑문. 왼쪽은 미리 정한 임계를 넘었는지 보고, 오른쪽은 정상 범위 안의 어긋남을 읽는다.</text>

  <!-- LEFT: Monitoring -->
  <rect x="30" y="78" width="400" height="352" rx="10" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="2"/>
  <rect x="30" y="78" width="400" height="38" rx="10" fill="#5b9bd5"/>
  <rect x="30" y="106" width="400" height="10" fill="#5b9bd5"/>
  <text class="boxlabel" x="50" y="104" fill="#e8e4df">모니터링 — 미리 정한 것에 알람</text>

  <text class="item" x="50" y="146" fill="#e8e4df">무엇을 재는가 (사전 정의)</text>
  <rect x="50" y="158" width="360" height="76" rx="6" fill="#dceaf7"/>
  <text class="mono" x="64" y="178" fill="#10243a">각 수문의 개폐 성공 여부</text>
  <text class="mono" x="64" y="198" fill="#10243a">갑문 내부 수위</text>
  <text class="mono" x="64" y="218" fill="#10243a">선박의 갑문 통과 소요 시간</text>

  <text class="item" x="50" y="264" fill="#e8e4df">그래서 무엇을 알리는가</text>
  <rect x="50" y="276" width="360" height="76" rx="6" fill="#f2d4d4"/>
  <text class="mono" x="64" y="296" fill="#7a1f1f">기계 고장으로 수문이 열린 채 멈춤</text>
  <text class="mono" x="64" y="316" fill="#7a1f1f">누수로 수위가 급강하</text>
  <text class="mono" x="64" y="336" fill="#7a1f1f">선박이 끼어 갑문을 못 빠져나감</text>

  <rect x="50" y="370" width="360" height="44" rx="6" fill="#f5edda"/>
  <text class="item" x="64" y="388" fill="#0d0d0d" font-weight="700">전제: 어떻게 고장 날지 미리 안다</text>
  <text class="mono" x="64" y="406" fill="#1a1a1a">임계를 넘었다 → 호출</text>

  <!-- RIGHT: Observability -->
  <rect x="470" y="78" width="400" height="352" rx="10" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="2"/>
  <rect x="470" y="78" width="400" height="38" rx="10" fill="rgb(212,168,83)"/>
  <rect x="470" y="106" width="400" height="10" fill="rgb(212,168,83)"/>
  <text class="boxlabel" x="490" y="104" fill="#0d0d0d">관측 가능성 — 정상 범위 안의 어긋남</text>

  <text class="item" x="490" y="146" fill="#e8e4df">데이터는 허용 범위 안인데도 보이는 것</text>

  <rect x="490" y="158" width="360" height="80" rx="6" fill="#fdf3df"/>
  <text class="mono" x="504" y="178" fill="#0d0d0d" font-weight="700">벽 위쪽의 작은 누수</text>
  <text class="mono" x="504" y="197" fill="#1a1a1a">수위가 그 지점 위일 때만 떨어짐</text>
  <text class="mono" x="504" y="216" fill="#14521d">→ 벽체 보수 작업을 부른다</text>

  <rect x="490" y="248" width="360" height="80" rx="6" fill="#fdf3df"/>
  <text class="mono" x="504" y="268" fill="#0d0d0d" font-weight="700">한 수문만 느리게 열림</text>
  <text class="mono" x="504" y="287" fill="#1a1a1a">개폐 사이 시간이 점점 늘어남</text>
  <text class="mono" x="504" y="306" fill="#14521d">→ 수문 정비를 부른다</text>

  <rect x="490" y="338" width="360" height="80" rx="6" fill="#fdf3df"/>
  <text class="mono" x="504" y="358" fill="#0d0d0d" font-weight="700">특정 풍향에서 통과가 느려짐</text>
  <text class="mono" x="504" y="377" fill="#1a1a1a">시간대별 평균 통과율을 비교</text>
  <text class="mono" x="504" y="396" fill="#14521d">→ 풍향 영향 저감 작업을 부른다</text>

  <text class="sub" x="30" y="454">핵심: 알람을 울린 그 데이터로 알람이 울리지 않은 문제까지 조사할 수 있다. 새 계측을 추가한 게 아니라 같은 데이터에 다른 질문을 던진 것이다.</text>
</svg>

<svg viewBox="0 0 560 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>임베딩 벡터 공간 — 의미가 가까우면 벡터도 가깝다</title>
  <desc>2차원으로 투영한 임베딩 공간. dog와 puppy는 의미가 비슷해 가까이 놓이고, skyscraper는 뜻이 달라 멀리 놓인다. 질의 벡터는 최근접 이웃을 거리로 찾는다.</desc>

  <!-- 배경 -->
  <rect x="0" y="0" width="560" height="380" fill="#0d0d0d"/>

  <!-- 제목 -->
  <text x="24" y="34" fill="#e8e4df" font-size="15" font-weight="600">임베딩 벡터 공간 — 뜻이 가까우면 벡터도 가깝다</text>
  <text x="24" y="54" fill="rgb(138,133,128)" font-size="11">텍스트를 다차원 벡터로 바꾸면, 의미적 거리가 공간적 거리가 된다 (여기선 2D로 투영)</text>

  <!-- 좌표축 프레임 -->
  <rect x="40" y="76" width="480" height="264" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>

  <!-- 축 화살표 -->
  <defs>
    <marker id="ax" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/>
    </marker>
    <marker id="near" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>
  <line x1="64" y1="316" x2="500" y2="316" stroke="rgb(138,133,128)" stroke-width="1" marker-end="url(#ax)"/>
  <line x1="64" y1="316" x2="64" y2="96" stroke="rgb(138,133,128)" stroke-width="1" marker-end="url(#ax)"/>
  <text x="486" y="334" fill="rgb(138,133,128)" font-size="10" text-anchor="end">차원 1</text>
  <text x="60" y="104" fill="rgb(138,133,128)" font-size="10" text-anchor="end">차원 2</text>

  <!-- 가까운 무리: dog · puppy (골든 앰버 강조 영역) -->
  <ellipse cx="180" cy="170" rx="86" ry="60" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)" stroke-dasharray="4 3"/>
  <text x="180" y="128" fill="rgb(212,168,83)" font-size="10" text-anchor="middle">의미가 가까운 무리</text>

  <!-- dog 점 -->
  <circle cx="150" cy="182" r="6" fill="rgb(212,168,83)"/>
  <text x="150" y="206" fill="#e8e4df" font-size="12" text-anchor="middle" font-family="'JetBrains Mono', monospace">dog</text>

  <!-- puppy 점 -->
  <circle cx="212" cy="156" r="6" fill="rgb(212,168,83)"/>
  <text x="212" y="148" fill="#e8e4df" font-size="12" text-anchor="middle" font-family="'JetBrains Mono', monospace">puppy</text>

  <!-- dog-puppy 가까움 표시 -->
  <line x1="156" y1="180" x2="206" y2="158" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="181" y="176" fill="rgb(212,168,83)" font-size="9" text-anchor="middle">가깝다</text>

  <!-- 멀리 떨어진 점: skyscraper -->
  <circle cx="430" cy="270" r="6" fill="#66bb6a"/>
  <text x="430" y="294" fill="#e8e4df" font-size="12" text-anchor="middle" font-family="'JetBrains Mono', monospace">skyscraper</text>

  <!-- dog-skyscraper 멂 표시 -->
  <line x1="156" y1="185" x2="424" y2="268" stroke="rgb(138,133,128)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="300" y="234" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">멀다 (뜻이 다름)</text>

  <!-- 질의 벡터 -->
  <circle cx="120" cy="150" r="5" fill="none" stroke="#e8e4df" stroke-width="1.5"/>
  <text x="120" y="138" fill="#e8e4df" font-size="10" text-anchor="middle">질의</text>
  <line x1="124" y1="153" x2="146" y2="178" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#near)"/>
  <text x="108" y="172" fill="rgb(212,168,83)" font-size="9" text-anchor="end">최근접</text>
  <text x="108" y="184" fill="rgb(212,168,83)" font-size="9" text-anchor="end">이웃</text>
</svg>

<svg viewBox="0 0 680 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>OpenSearch 보안 다층 방어 — 인증·인가(FGAC)·암호화·멀티테넌시·감사</title>
  <desc>요청이 인증(SAML·basic auth) 관문을 지나 FGAC(DLS 문서·FLS 필드·FM 값) 인가 필터가 서버에서 자동 병합되고, 암호화(전송·저장)와 멀티테넌시(index-level·document-level 격리)로 감싸이며, 모든 접근이 감사 로그로 기록되는 다층 방어 구조.</desc>

  <rect x="0" y="0" width="680" height="470" fill="#0d0d0d"/>
  <text x="24" y="32" fill="#e8e4df" font-size="15" font-weight="600">보안 — 다층 방어: 경계는 클라이언트가 아니라 서버(role)가 강제한다</text>

  <defs>
    <marker id="sa" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- 요청 주체 -->
  <text x="24" y="58" fill="#e8e4df" font-size="12" font-weight="600">요청 주체</text>
  <rect x="24" y="68" width="96" height="60" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="72" y="92" fill="#e8e4df" font-size="10" text-anchor="middle" font-weight="600">User</text>
  <text x="72" y="108" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">Spring 앱 /</text>
  <text x="72" y="119" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">Dashboards</text>
  <line x1="120" y1="98" x2="146" y2="98" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#sa)"/>

  <!-- 층① 인증 -->
  <text x="152" y="58" fill="#e8e4df" font-size="12" font-weight="600">① 인증 — 누구인가</text>
  <rect x="152" y="68" width="170" height="60" fill="rgb(26,26,26)" stroke="rgb(212,168,83)"/>
  <text x="237" y="86" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="600">Authentication</text>
  <text x="162" y="103" fill="rgb(138,133,128)" font-size="8.5">basic auth · SAML 2.0 · OIDC</text>
  <text x="162" y="116" fill="rgb(138,133,128)" font-size="8.5">LDAP/AD · Entra ID (backend role)</text>
  <line x1="322" y1="98" x2="348" y2="98" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#sa)"/>

  <!-- 층② 인가 FGAC -->
  <text x="354" y="58" fill="#e8e4df" font-size="12" font-weight="600">② 인가(FGAC) — 서버가 쿼리에 자동 병합</text>
  <rect x="354" y="68" width="302" height="60" fill="rgba(212,168,83,0.06)" stroke="rgb(42,37,32)"/>
  <rect x="364" y="78" width="90" height="42" fill="rgba(102,187,106,0.12)" stroke="rgb(102,187,106)"/>
  <text x="409" y="94" fill="rgb(102,187,106)" font-size="9.5" text-anchor="middle" font-weight="600">DLS</text>
  <text x="409" y="110" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">문서(행) 격리</text>
  <rect x="460" y="78" width="90" height="42" fill="rgba(102,187,106,0.12)" stroke="rgb(102,187,106)"/>
  <text x="505" y="94" fill="rgb(102,187,106)" font-size="9.5" text-anchor="middle" font-weight="600">FLS</text>
  <text x="505" y="110" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">필드(열) 제한</text>
  <rect x="556" y="78" width="90" height="42" fill="rgba(102,187,106,0.12)" stroke="rgb(102,187,106)"/>
  <text x="601" y="94" fill="rgb(102,187,106)" font-size="9.5" text-anchor="middle" font-weight="600">FM</text>
  <text x="601" y="110" fill="rgb(138,133,128)" font-size="8" text-anchor="middle">값 부분 마스킹</text>

  <!-- role 흐름 띠 -->
  <rect x="152" y="140" width="504" height="26" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="164" y="157" fill="rgb(138,133,128)" font-size="9">권한 흐름:  backend role(IdP 그룹)  →  role mapping  →  OpenSearch role(권한 묶음)  →  user  · DLS/FLS/FM 은 role 에 선언</text>

  <!-- 층③ 암호화 -->
  <text x="24" y="192" fill="#e8e4df" font-size="12" font-weight="600">③ 암호화 — 전 구간</text>
  <rect x="24" y="202" width="300" height="50" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="34" y="222" fill="rgb(138,133,128)" font-size="9">전송 중(in transit): TLS 1.2+  ·  node-to-node</text>
  <text x="34" y="240" fill="rgb(138,133,128)" font-size="9">저장(at rest): AES-256  ·  필드 마스킹</text>

  <!-- 감사 -->
  <text x="356" y="192" fill="#e8e4df" font-size="12" font-weight="600">감사 — 모든 접근 기록</text>
  <rect x="356" y="202" width="300" height="50" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="366" y="222" fill="rgb(138,133,128)" font-size="9">JSON 감사 로그: user · method · path · 결과 · IP</text>
  <text x="366" y="240" fill="rgb(138,133,128)" font-size="9">→ HIPAA·GDPR·PCI DSS · ISM 보존 정책</text>

  <!-- 멀티테넌시 -->
  <text x="24" y="284" fill="#e8e4df" font-size="12" font-weight="600">멀티테넌시 — 한 클러스터, 여러 테넌트 격리 (규모에 맞춰 섞는다)</text>

  <rect x="24" y="296" width="310" height="88" fill="rgba(212,168,83,0.06)" stroke="rgb(42,37,32)"/>
  <text x="179" y="315" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="600">index-level isolation</text>
  <text x="38" y="333" fill="rgb(138,133,128)" font-size="8.5">테넌트별 전용 인덱스 (client_a_*, client_b_*)</text>
  <text x="38" y="349" fill="rgb(138,133,128)" font-size="8.5">✓ 경계 명확 · 커스텀 샤딩 (큰 테넌트)</text>
  <text x="38" y="365" fill="rgb(138,133,128)" font-size="8.5">✗ 테넌트 많으면 인덱스 폭증</text>
  <text x="38" y="378" fill="rgb(138,133,128)" font-size="8">쓰임: SaaS 고객사 · 병원별</text>

  <rect x="346" y="296" width="310" height="88" fill="rgba(212,168,83,0.06)" stroke="rgb(42,37,32)"/>
  <text x="501" y="315" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="600">document-level isolation</text>
  <text x="360" y="333" fill="rgb(138,133,128)" font-size="8.5">인덱스 공유 + DLS 필터 (${user.tenant_id})</text>
  <text x="360" y="349" fill="rgb(138,133,128)" font-size="8.5">✓ 자원 효율 (작은 테넌트 다수)</text>
  <text x="360" y="365" fill="rgb(138,133,128)" font-size="8.5">✗ 매 쿼리에 필터 병합 비용 상시</text>
  <text x="360" y="378" fill="rgb(138,133,128)" font-size="8">쓰임: 공유 고객지원 · SMB 다수</text>

  <!-- 통찰 띠 -->
  <rect x="24" y="398" width="632" height="30" fill="rgba(102,187,106,0.08)" stroke="rgb(42,37,32)"/>
  <text x="40" y="417" fill="rgb(138,133,128)" font-size="9.5">열쇠: DLS/FLS/FM 은 role 에 선언되고 사용자 쿼리에 서버가 자동 병합 → 앱이 필터를 빠뜨려도 경계는 서버가 지킨다(server-enforced)</text>

  <!-- Spring 관점 -->
  <rect x="24" y="434" width="632" height="30" fill="rgba(212,168,83,0.06)" stroke="rgb(42,37,32)"/>
  <text x="40" y="453" fill="rgb(138,133,128)" font-size="9.5">Spring 앱: 책임은 ① 인증(SSL+basic auth, 시크릿=env) ② 사용자 신원 전파 뿐 — 인가는 서버 role 이 강제, 신원 전파가 감사 품질도 좌우</text>
</svg>

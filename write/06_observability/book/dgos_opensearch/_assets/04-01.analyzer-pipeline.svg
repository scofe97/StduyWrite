<svg viewBox="0 0 640 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>OpenSearch 애널라이저 파이프라인 — char_filter → tokenizer → token_filter</title>
  <desc>원문 텍스트가 char_filter, tokenizer, token_filter 세 단계를 거쳐 검색 가능한 term으로 분해된다. english 애널라이저는 stemming으로 analyzer를 analyz로 줄이고 불용어 for를 제거한다.</desc>

  <rect x="0" y="0" width="640" height="320" fill="#0d0d0d"/>
  <text x="24" y="32" fill="#e8e4df" font-size="15" font-weight="600">애널라이저 파이프라인 — 텍스트를 term으로 쪼갠다</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- 입력 텍스트 -->
  <text x="24" y="66" fill="rgb(138,133,128)" font-size="10">입력 (english 애널라이저)</text>
  <rect x="24" y="74" width="592" height="34" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="40" y="96" fill="#e8e4df" font-size="12" font-family="'JetBrains Mono',monospace">"OpenSearch standard analyzer 1234.4. For text"</text>

  <!-- 3단 파이프라인 박스 -->
  <rect x="24" y="128" width="184" height="70" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="116" y="152" fill="#e8e4df" font-size="12" text-anchor="middle" font-weight="600">① char_filter</text>
  <text x="116" y="172" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">문자 손질</text>
  <text x="116" y="187" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">예: html_strip</text>

  <rect x="228" y="128" width="184" height="70" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="320" y="152" fill="#e8e4df" font-size="12" text-anchor="middle" font-weight="600">② tokenizer</text>
  <text x="320" y="172" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">토큰 분할</text>
  <text x="320" y="187" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">공백·구두점 기준</text>

  <rect x="432" y="128" width="184" height="70" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="524" y="152" fill="#e8e4df" font-size="12" text-anchor="middle" font-weight="600">③ token_filter</text>
  <text x="524" y="172" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">소문자·어간·불용어</text>
  <text x="524" y="187" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">lowercase·stemmer</text>

  <!-- 화살표 -->
  <line x1="116" y1="112" x2="116" y2="126" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="208" y1="163" x2="226" y2="163" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="412" y1="163" x2="430" y2="163" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="524" y1="200" x2="524" y2="228" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 출력 term -->
  <text x="24" y="248" fill="rgb(138,133,128)" font-size="10">출력 term (5개) — stemming으로 analyzer→analyz, 불용어 for 제거</text>
  <rect x="24" y="258" width="102" height="30" fill="rgb(26,26,26)" stroke="rgb(102,187,106)"/>
  <text x="75" y="278" fill="#e8e4df" font-size="11" text-anchor="middle" font-family="'JetBrains Mono',monospace">opensearch</text>
  <rect x="134" y="258" width="80" height="30" fill="rgb(26,26,26)" stroke="rgb(102,187,106)"/>
  <text x="174" y="278" fill="#e8e4df" font-size="11" text-anchor="middle" font-family="'JetBrains Mono',monospace">standard</text>
  <rect x="222" y="258" width="70" height="30" fill="rgba(102,187,106,0.13)" stroke="rgb(102,187,106)"/>
  <text x="257" y="278" fill="#e8e4df" font-size="11" text-anchor="middle" font-family="'JetBrains Mono',monospace">analyz</text>
  <rect x="300" y="258" width="66" height="30" fill="rgb(26,26,26)" stroke="rgb(102,187,106)"/>
  <text x="333" y="278" fill="#e8e4df" font-size="11" text-anchor="middle" font-family="'JetBrains Mono',monospace">1234.4</text>
  <rect x="374" y="258" width="52" height="30" fill="rgb(26,26,26)" stroke="rgb(102,187,106)"/>
  <text x="400" y="278" fill="#e8e4df" font-size="11" text-anchor="middle" font-family="'JetBrains Mono',monospace">text</text>
</svg>

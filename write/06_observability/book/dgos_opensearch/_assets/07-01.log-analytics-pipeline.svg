<svg viewBox="0 0 680 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>OpenSearch 로그 분석 파이프라인 — 집계 3유형에서 관측성까지</title>
  <desc>원시 로그가 쿼리 match 로 좁혀진 뒤 metric·bucket·pipeline 집계로 요약되고, Dashboards 시각화·대시보드를 거쳐 로그·메트릭·트레이스 관측성으로 이어지는 흐름.</desc>

  <rect x="0" y="0" width="680" height="400" fill="#0d0d0d"/>
  <text x="24" y="32" fill="#e8e4df" font-size="15" font-weight="600">로그 분석 파이프라인 — 원시 로그가 관측이 되기까지</text>

  <defs>
    <marker id="la" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <!-- 1. 원시 로그 + match -->
  <rect x="24" y="56" width="120" height="72" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="84" y="82" fill="#e8e4df" font-size="11" text-anchor="middle" font-weight="600">원시 로그</text>
  <text x="84" y="100" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">쿼리 match 로</text>
  <text x="84" y="113" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">분석 창 좁힘</text>
  <line x1="144" y1="92" x2="168" y2="92" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#la)"/>

  <!-- 2. 집계 3유형 (앰버 강조 박스) -->
  <rect x="172" y="48" width="340" height="88" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="188" y="66" fill="#e8e4df" font-size="12" font-weight="600">집계 — 요약 엔진 (match 출력 위에서)</text>

  <rect x="188" y="76" width="100" height="50" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="238" y="93" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="600">metric</text>
  <text x="238" y="107" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">avg·sum·max</text>
  <text x="238" y="119" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">단일 수치</text>

  <rect x="294" y="76" width="100" height="50" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="344" y="93" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="600">bucket</text>
  <text x="344" y="107" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">terms·date_hist</text>
  <text x="344" y="119" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">값·시간 슬라이싱</text>

  <rect x="400" y="76" width="100" height="50" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="450" y="93" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="600">pipeline</text>
  <text x="450" y="107" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">cumulative_sum</text>
  <text x="450" y="119" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">2차 집계</text>

  <line x1="512" y1="92" x2="536" y2="92" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#la)"/>

  <!-- 3. 시각화 -->
  <rect x="540" y="56" width="116" height="72" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="598" y="80" fill="#e8e4df" font-size="11" text-anchor="middle" font-weight="600">시각화</text>
  <text x="598" y="98" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">line·bar·pie</text>
  <text x="598" y="110" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">TSVB·Vega</text>
  <text x="598" y="122" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">→ 대시보드(10초 갱신)</text>

  <!-- 아래로 내려가는 화살표 -->
  <line x1="598" y1="128" x2="598" y2="156" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#la)"/>

  <!-- 4. 관측성 (초록 박스) -->
  <rect x="24" y="164" width="632" height="88" fill="rgba(102,187,106,0.10)" stroke="rgb(102,187,106)"/>
  <text x="40" y="184" fill="#e8e4df" font-size="12" font-weight="600">관측성(observability) — 세 신호로 분산 시스템을 본다</text>

  <rect x="40" y="196" width="196" height="44" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="138" y="214" fill="rgb(102,187,106)" font-size="10" text-anchor="middle" font-weight="600">로그 (logs)</text>
  <text x="138" y="229" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">증상 일지 · 첫 진단처</text>

  <rect x="242" y="196" width="196" height="44" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="340" y="214" fill="rgb(102,187,106)" font-size="10" text-anchor="middle" font-weight="600">메트릭 (metrics)</text>
  <text x="340" y="229" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">CPU·메모리 시계열</text>

  <rect x="444" y="196" width="212" height="44" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="550" y="214" fill="rgb(102,187,106)" font-size="10" text-anchor="middle" font-weight="600">트레이스 (traces)</text>
  <text x="550" y="229" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">trace ID · span · service map</text>

  <!-- 5. 비용 통제 띠 -->
  <rect x="24" y="268" width="632" height="40" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="40" y="285" fill="#e8e4df" font-size="10" font-weight="600">비용 통제:</text>
  <text x="110" y="285" fill="rgb(138,133,128)" font-size="9.5">primary(실시간 색인) vs secondary(대용량 저비용) 로그 분리</text>
  <text x="40" y="300" fill="rgb(138,133,128)" font-size="9.5">UltraWarm/S3 이동 · DirectQuery + Flint 인덱싱(skipping·materialized view·covering)</text>

  <!-- 6. 질의 옵션 띠 -->
  <rect x="24" y="316" width="632" height="34" fill="rgba(212,168,83,0.06)" stroke="rgb(42,37,32)"/>
  <text x="40" y="337" fill="rgb(138,133,128)" font-size="9.5">질의 3옵션: 쿼리 DSL · SQL · PPL(파이프) — OpenSearch Assistant 가 자연어를 PPL 로 번역</text>

  <text x="24" y="374" fill="rgb(138,133,128)" font-size="10">주의: 중첩 집계는 차원 카디널리티의 곱만큼 JVM heap 사용 → 깊은 중첩·긴 시간범위는 OOM</text>
</svg>

<svg viewBox="0 0 880 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>서브쿼리는 안쪽 질의를 여러 번 돌려 범위 벡터를 만듭니다</title>
  <desc>max_over_time(rate(http_requests_total[5m])[1h:1m]) 이 두 단으로 평가되는 과정을 시간 축으로 보인다. 위쪽 1단에서는 안쪽의 rate 질의가 지난 한 시간 동안 해상도 1분 간격으로 예순 번 반복 평가되며, 매 평가마다 그 시점에서 5분을 거슬러 보는 범위가 함께 미끄러진다. 각 평가는 순간 벡터 하나, 즉 값 하나를 낸다. 아래쪽 2단에서는 그렇게 얻은 예순 개의 점이 모여 범위 벡터 하나가 되고, 범위 벡터를 요구하는 max_over_time 이 그것을 받아 최댓값 하나를 돌려준다. 대괄호 두 개의 역할이 갈리는데 앞의 5m 은 안쪽 rate 가 한 번 평가될 때 보는 범위이고, 뒤의 1h 대 1m 은 그 평가를 얼마 동안 얼마 간격으로 반복할지를 정한다.</desc>
  <defs>
    <marker id="sq-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <style>
      .t   { fill: #e8e4df; }
      .mono{ font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .dim { fill: #b8b3ad; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="400" fill="#0d0d0d"/>

  <text x="24" y="34" class="t" font-size="15">서브쿼리 · 2단 구조</text>
  <text x="24" y="56" class="mono" font-size="12" fill="rgb(212,168,83)">max_over_time( rate(http_requests_total[5m]) [1h:1m] )</text>

  <!-- 1단 -->
  <text x="24" y="92" class="t" font-size="12" font-weight="700">1단 · <tspan class="mono" fill="rgb(102,187,106)">rate</tspan> 반복 평가</text>

  <line x1="60" y1="176" x2="800" y2="176" stroke="rgb(92,84,74)"/>
  <text x="60" y="196" class="dim" font-size="10">1시간 전</text>
  <text x="800" y="196" class="dim" font-size="10" text-anchor="end">지금</text>

  <!-- 반복 평가 눈금 + 각 평가의 5m 창 -->
  <g stroke="rgb(102,187,106)">
    <rect x="60"  y="150" width="84" height="12" fill="rgba(102,187,106,0.18)" stroke-width="1"/>
    <rect x="196" y="150" width="84" height="12" fill="rgba(102,187,106,0.18)" stroke-width="1"/>
    <rect x="332" y="150" width="84" height="12" fill="rgba(102,187,106,0.18)" stroke-width="1"/>
    <rect x="604" y="150" width="84" height="12" fill="rgba(102,187,106,0.18)" stroke-width="1"/>
  </g>
  <text x="102" y="144" class="mono dim" font-size="9" text-anchor="middle">[5m]</text>
  <text x="238" y="144" class="mono dim" font-size="9" text-anchor="middle">[5m]</text>
  <text x="374" y="144" class="mono dim" font-size="9" text-anchor="middle">[5m]</text>
  <text x="646" y="144" class="mono dim" font-size="9" text-anchor="middle">[5m]</text>

  <g fill="rgb(102,187,106)">
    <circle cx="144" cy="176" r="4"/><circle cx="280" cy="176" r="4"/>
    <circle cx="416" cy="176" r="4"/><circle cx="688" cy="176" r="4"/>
  </g>
  <text x="510" y="181" class="dim" font-size="13" text-anchor="middle">· · · · · ·</text>
  <text x="510" y="156" class="dim" font-size="9" text-anchor="middle">(60번)</text>

  <text x="144" y="216" class="t" font-size="9.5" text-anchor="middle">값 1</text>
  <text x="280" y="216" class="t" font-size="9.5" text-anchor="middle">값 2</text>
  <text x="416" y="216" class="t" font-size="9.5" text-anchor="middle">값 3</text>
  <text x="688" y="216" class="t" font-size="9.5" text-anchor="middle">값 60</text>

  <text x="24" y="240" class="dim" font-size="10">평가마다 <tspan fill="rgb(102,187,106)">5분 창도 미끄러짐</tspan></text>

  <!-- 2단 -->
  <line x1="424" y1="256" x2="424" y2="288" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#sq-a)"/>
  <text x="440" y="278" class="t" font-size="11">60개 점 = <tspan font-weight="700">범위 벡터</tspan></text>

  <text x="24" y="284" class="t" font-size="12" font-weight="700">2단 · 바깥 함수가 받음</text>

  <rect x="60" y="300" width="740" height="44" fill="rgba(212,168,83,0.10)" stroke="rgb(212,168,83)"/>
  <text x="76" y="321" class="mono" font-size="11.5" fill="rgb(212,168,83)">max_over_time( … )</text>
  <text x="232" y="321" class="t" font-size="11">범위 벡터를 요구하는 함수</text>
  <text x="76" y="338" font-size="10.5" fill="#b8b3ad">60개 중 최댓값 하나</text>

  <text x="24" y="372" class="t" font-size="10.5"><tspan class="mono" fill="rgb(102,187,106)">[5m]</tspan> <tspan fill="rgb(102,187,106)">범위</tspan> · <tspan class="mono" fill="rgb(212,168,83)">[1h:1m]</tspan> <tspan fill="rgb(212,168,83)">반복</tspan></text>
</svg>

<svg viewBox="0 0 820 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>chunk 참조 8바이트가 파일 안 한 지점을 찍습니다</title>
  <desc>세그먼트 파일 하나 안에 서로 다른 시계열의 chunk 가 시간순으로 뒤섞여 들어간다. 파일 안 배치에는 의미가 없어서 이웃한 chunk 가 같은 시계열일 이유가 없다. 그래서 인덱스의 chunk 참조 8바이트가 상위 4바이트로 세그먼트 파일 번호를, 하위 4바이트로 그 파일 안 바이트 오프셋을 가리켜 원하는 chunk 를 바로 집어낸다. 각 chunk 는 자기 데이터 길이를 앞에 varint 로 달고 있어서 그 지점에서 길이만큼 잘라내면 chunk 하나가 온전히 나온다. 오프셋이 없으면 파일을 처음부터 훑어야 한다.</desc>

  <defs>
    <marker id="ro" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(224,108,108)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="470" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">chunk 참조 8바이트가 파일 안 한 지점을 찍습니다</text>

  <!-- 인덱스 항목 -->
  <rect x="24" y="58" width="772" height="62" fill="rgba(212,168,83,0.10)" stroke="rgb(212,168,83)"/>
  <text x="40" y="78" fill="rgb(212,168,83)" font-size="11" font-weight="700">시리즈 인덱스 항목 <tspan fill="rgb(168,163,158)" font-weight="400">— 이 시계열의 chunk 가 어디 있는지</tspan></text>
  <text x="40" y="100" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">{__name__="jvm_memory_bytes_used", pool="G1 Eden Space"}</text>

  <rect x="560" y="86" width="100" height="24" fill="rgba(102,187,106,0.20)" stroke="rgb(102,187,106)"/>
  <text x="610" y="103" fill="#e8e4df" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">상위 4B = 000001</text>

  <rect x="668" y="86" width="112" height="24" fill="rgba(224,108,108,0.25)" stroke="rgb(224,108,108)"/>
  <text x="724" y="103" fill="#e8e4df" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">하위 4B = 455</text>

  <!-- 화살표: 파일 지목 -->
  <line x1="610" y1="114" x2="610" y2="162" stroke="rgb(102,187,106)" stroke-width="2"/>
  <text x="600" y="134" fill="rgb(102,187,106)" font-size="9.5" text-anchor="end">어느 파일인가 ↓</text>

  <!-- 세그먼트 파일 -->
  <text x="24" y="176" fill="#e8e4df" font-size="12"><tspan font-family="'JetBrains Mono', monospace">chunks/000001</tspan> <tspan fill="rgb(168,163,158)" font-size="10">— 5.4 MB · chunk 18,610 개 · 시계열 1,550 개가 뒤섞여 있습니다</tspan></text>

  <rect x="24" y="188" width="772" height="76" fill="#0d0d0d" stroke="rgb(92,84,74)"/>

  <!-- 헤더 -->
  <rect x="32" y="200" width="52" height="40" fill="rgba(102,102,102,0.25)" stroke="rgb(138,133,128)"/>
  <text x="58" y="217" fill="#e8e4df" font-size="8.5" text-anchor="middle">헤더</text>
  <text x="58" y="231" fill="rgb(168,163,158)" font-size="8" text-anchor="middle">8 B</text>

  <!-- chunk 들 — 색이 다르면 다른 시계열 -->
  <rect x="88" y="200" width="76" height="40" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <text x="126" y="217" fill="#e8e4df" font-size="8.5" text-anchor="middle">chunk</text>
  <text x="126" y="231" fill="rgb(168,163,158)" font-size="8" text-anchor="middle">195 B</text>

  <rect x="168" y="200" width="88" height="40" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <text x="212" y="217" fill="#e8e4df" font-size="8.5" text-anchor="middle">chunk</text>
  <text x="212" y="231" fill="rgb(168,163,158)" font-size="8" text-anchor="middle">252 B</text>

  <rect x="260" y="200" width="90" height="40" fill="rgba(224,108,108,0.35)" stroke="rgb(224,108,108)" stroke-width="2"/>
  <text x="305" y="217" fill="#e8e4df" font-size="8.5" text-anchor="middle">chunk</text>
  <text x="305" y="231" fill="rgb(168,163,158)" font-size="8" text-anchor="middle">259 B</text>

  <rect x="354" y="200" width="88" height="40" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <text x="398" y="217" fill="#e8e4df" font-size="8.5" text-anchor="middle">chunk</text>
  <text x="398" y="231" fill="rgb(168,163,158)" font-size="8" text-anchor="middle">256 B</text>

  <rect x="446" y="200" width="86" height="40" fill="rgba(150,120,200,0.30)" stroke="rgb(170,145,215)"/>
  <text x="489" y="217" fill="#e8e4df" font-size="8.5" text-anchor="middle">chunk</text>
  <text x="489" y="231" fill="rgb(168,163,158)" font-size="8" text-anchor="middle">254 B</text>

  <rect x="536" y="200" width="90" height="40" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <text x="581" y="217" fill="#e8e4df" font-size="8.5" text-anchor="middle">chunk</text>
  <text x="581" y="231" fill="rgb(168,163,158)" font-size="8" text-anchor="middle">261 B</text>

  <text x="660" y="224" fill="rgb(168,163,158)" font-size="9.5">… 18,610 개까지</text>

  <!-- 오프셋 눈금 -->
  <text x="88" y="257" fill="rgb(168,163,158)" font-size="8.5" text-anchor="middle">8</text>
  <text x="168" y="257" fill="rgb(168,163,158)" font-size="8.5" text-anchor="middle">203</text>
  <text x="260" y="257" fill="rgb(224,108,108)" font-size="8.5" text-anchor="middle" font-weight="700">455</text>
  <text x="354" y="257" fill="rgb(168,163,158)" font-size="8.5" text-anchor="middle">714</text>
  <text x="446" y="257" fill="rgb(168,163,158)" font-size="8.5" text-anchor="middle">970</text>
  <text x="536" y="257" fill="rgb(168,163,158)" font-size="8.5" text-anchor="middle">1224</text>

  <!-- 오프셋 화살표 -->
  <line x1="724" y1="114" x2="724" y2="152" stroke="rgb(224,108,108)" stroke-width="2"/>
  <line x1="724" y1="152" x2="308" y2="152" stroke="rgb(224,108,108)" stroke-width="2"/>
  <line x1="308" y1="152" x2="308" y2="196" stroke="rgb(224,108,108)" stroke-width="2" marker-end="url(#ro)"/>
  <text x="318" y="146" fill="rgb(224,108,108)" font-size="9.5">그 파일 안 455 바이트 지점으로 바로 점프</text>

  <text x="24" y="280" fill="rgb(168,163,158)" font-size="9.5">색이 다르면 다른 시계열입니다 — 이웃해 있다고 같은 메트릭이 아닙니다. 오프셋은 실측값입니다.</text>

  <!-- chunk 내부 -->
  <line x1="24" y1="292" x2="796" y2="292" stroke="rgb(92,84,74)"/>
  <text x="24" y="316" fill="#e8e4df" font-size="12">그 지점에 무엇이 있습니까 — chunk 는 자기 길이를 앞에 답니다</text>

  <rect x="24" y="330" width="70" height="42" fill="rgba(224,108,108,0.25)" stroke="rgb(224,108,108)"/>
  <text x="59" y="348" fill="#e8e4df" font-size="9" text-anchor="middle">길이</text>
  <text x="59" y="363" fill="rgb(168,163,158)" font-size="8.5" text-anchor="middle">varint 2B</text>

  <rect x="98" y="330" width="70" height="42" fill="rgba(102,187,106,0.25)" stroke="rgb(102,187,106)"/>
  <text x="133" y="348" fill="#e8e4df" font-size="9" text-anchor="middle">인코딩</text>
  <text x="133" y="363" fill="rgb(168,163,158)" font-size="8.5" text-anchor="middle">1B · 0x01</text>

  <rect x="172" y="330" width="400" height="42" fill="rgba(212,168,83,0.25)" stroke="rgb(212,168,83)"/>
  <text x="372" y="348" fill="#e8e4df" font-size="9" text-anchor="middle">압축된 샘플 — 델타 · 델타의 델타 · XOR</text>
  <text x="372" y="363" fill="rgb(168,163,158)" font-size="8.5" text-anchor="middle">252 B</text>

  <rect x="576" y="330" width="70" height="42" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="611" y="348" fill="#e8e4df" font-size="9" text-anchor="middle">CRC32</text>
  <text x="611" y="363" fill="rgb(168,163,158)" font-size="8.5" text-anchor="middle">4B</text>

  <text x="660" y="356" fill="rgb(168,163,158)" font-size="9.5">합 259 B</text>

  <text x="24" y="396" fill="#e8e4df" font-size="10">길이가 앞에 있으므로 <tspan fill="rgb(212,168,83)">455 에서 딱 그만큼만 잘라내면</tspan> chunk 하나가 온전히 나옵니다. 앞뒤를 뒤질 필요가 없습니다.</text>

  <text x="24" y="428" fill="rgb(224,108,108)" font-size="10.5" font-weight="700">오프셋이 없다면</text>
  <text x="150" y="428" fill="#e8e4df" font-size="10">5.4 MB 를 처음부터 훑으며 chunk 18,610 개를 하나씩 까 봐야 합니다.</text>
  <text x="24" y="450" fill="rgb(168,163,158)" font-size="10">파일 안 배치가 무의미하기 때문에 인덱스가 <tspan fill="#e8e4df">"몇 번 파일"과 "몇 바이트 지점"을 둘 다</tspan> 들고 있어야 합니다.</text>
</svg>

<svg viewBox="0 0 900 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>언제 메모리로 올라오는가 — 읽는 순간에만</title>
  <desc>질의가 chunk 4210 을 필요로 하면 프로그램은 그 chunk 에 대응하는 주소를 읽는다. 그 주소에는 아직 실물이 없으므로 CPU 가 페이지 폴트를 일으키고, 운영체제가 약속표를 보고 세그먼트 파일의 해당 구간을 찾아 그 조각만 물리 메모리로 올린다. 프로그램 입장에서는 그냥 메모리를 읽은 것처럼 보인다. 질의가 닿지 않은 나머지 chunk 는 디스크에 그대로 남아 메모리를 전혀 차지하지 않는다. 메모리가 부족해지면 운영체제가 올려 둔 조각을 회수하는데, 원본이 디스크에 있으므로 버려도 안전하고 필요하면 다시 읽으면 된다.</desc>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">3단계 · 그럼 언제 메모리로 올라옵니까</text>
  <text x="24" y="52" fill="rgb(138,133,128)" font-size="10">질의가 chunk 4210 을 필요로 하는 상황입니다.</text>

  <!-- 단계 -->
  <rect x="24" y="68" width="200" height="52" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="124" y="90" style="fill:#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">① 프로그램이</text>
  <text x="124" y="107" style="fill:#0d0d0d" font-size="9" text-anchor="middle">그 주소를 읽으려 함</text>

  <text x="236" y="99" fill="rgb(212,168,83)" font-size="14">→</text>

  <rect x="258" y="68" width="200" height="52" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="358" y="90" style="fill:#7a1f1f" font-size="10" text-anchor="middle" font-weight="700">② CPU: 실물이 없다</text>
  <text x="358" y="107" style="fill:#7a1f1f" font-size="9" text-anchor="middle">page fault 발생</text>

  <text x="470" y="99" fill="rgb(212,168,83)" font-size="14">→</text>

  <rect x="492" y="68" width="200" height="52" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="592" y="90" style="fill:#10243a" font-size="10" text-anchor="middle" font-weight="700">③ OS 가 약속표를 봄</text>
  <text x="592" y="107" style="fill:#10243a" font-size="9" text-anchor="middle">&quot;세그먼트 12 의 그 위치&quot;</text>

  <text x="704" y="99" fill="rgb(212,168,83)" font-size="14">→</text>

  <rect x="726" y="68" width="150" height="52" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="801" y="90" style="fill:#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">④ 그 조각만</text>
  <text x="801" y="107" style="fill:#0d0d0d" font-size="9" text-anchor="middle">메모리로 올림</text>

  <!-- 결과 그림 -->
  <text x="24" y="162" fill="#e8e4df" font-size="12" font-weight="700">결과 — 닿은 것만 올라옵니다</text>

  <text x="24" y="188" fill="rgb(138,133,128)" font-size="10">메모리</text>
  <rect x="24" y="198" width="852" height="56" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <rect x="240" y="212" width="120" height="28" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="300" y="231" style="fill:#0d0d0d" font-size="9.5" text-anchor="middle" font-weight="700">chunk 4210</text>
  <text x="376" y="231" fill="rgb(138,133,128)" font-size="9.5">이것 하나만 실물이 올라와 있습니다</text>

  <!-- 화살표 -->
  <line x1="300" y1="290" x2="300" y2="258" stroke="#66bb6a" stroke-width="2" marker-end="url(#g)"/>
  <text x="312" y="278" fill="#66bb6a" font-size="9">올라옴</text>

  <text x="24" y="284" fill="rgb(138,133,128)" font-size="10">디스크 — 세그먼트 파일 (원본은 계속 여기)</text>
  <rect x="24" y="294" width="852" height="56" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <rect x="40" y="308" width="100" height="28" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="90" y="327" style="fill:#10243a" font-size="9" text-anchor="middle">chunk 4208</text>
  <rect x="148" y="308" width="100" height="28" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="198" y="327" style="fill:#10243a" font-size="9" text-anchor="middle">chunk 4209</text>
  <rect x="256" y="308" width="100" height="28" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="306" y="327" style="fill:#0d0d0d" font-size="9" text-anchor="middle" font-weight="700">chunk 4210</text>
  <rect x="364" y="308" width="100" height="28" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="414" y="327" style="fill:#10243a" font-size="9" text-anchor="middle">chunk 4211</text>
  <rect x="472" y="308" width="100" height="28" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="522" y="327" style="fill:#10243a" font-size="9" text-anchor="middle">chunk 4212</text>
  <text x="588" y="327" fill="rgb(138,133,128)" font-size="9.5">… 나머지 60 만 개는 그대로 디스크에</text>

  <!-- 결론 -->
  <line x1="24" y1="368" x2="876" y2="368" stroke="rgb(92,84,74)"/>
  <text x="24" y="390" fill="#e8e4df" font-size="11">메모리가 부족해지면 OS 가 올려 둔 조각을 <tspan fill="rgb(212,168,83)" font-weight="700">버립니다.</tspan> 원본이 디스크에 있으니 안전합니다.</text>
  <text x="24" y="410" fill="rgb(138,133,128)" font-size="10">그래서 자주 보는 최근 chunk 만 자연히 메모리에 남습니다 — 고르는 일을 OS 가 대신해 준 것입니다.</text>
</svg>

<svg viewBox="0 0 820 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>블록 하나의 해부 — 네 조각이 모여 독립 데이터베이스가 됩니다</title>
  <desc>ULID 로 이름 붙은 블록 디렉토리 하나가 인덱스 파일, chunks 디렉토리, meta.json, 툼스톤 파일 네 조각으로 이뤄진다. 이 넷이 갖춰지므로 블록은 다른 블록에 기대지 않고 홀로 서는 독립 데이터베이스가 된다. chunks 디렉토리 안의 세그먼트 파일 하나는 그 자체가 chunk 가 아니라 서로 무관한 수많은 chunk 를 담는다. 네 조각 중 툼스톤만 블록이 디스크에 쓰인 뒤에도 수정된다.</desc>

  <rect x="0" y="0" width="820" height="380" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">블록 하나의 해부 — 네 조각이 모여 독립 데이터베이스가 됩니다</text>

  <!-- 블록 디렉토리 경계 -->
  <rect x="24" y="56" width="772" height="212" fill="none" stroke="rgb(212,168,83)" stroke-dasharray="5 4"/>
  <text x="40" y="78" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace">01BX5ZZKBKACTAV9WEVGEMMVRZ/</text>
  <text x="780" y="78" fill="rgb(168,163,158)" font-size="9.5" text-anchor="end">디렉토리 이름 = ULID (사전순 정렬 가능)</text>

  <!-- ① 인덱스 -->
  <rect x="44" y="96" width="172" height="70" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="130" y="120" fill="#e8e4df" font-size="12" text-anchor="middle">① <tspan font-family="'JetBrains Mono', monospace">index</tspan></text>
  <text x="130" y="140" fill="#e8e4df" font-size="9.5" text-anchor="middle">역색인 — 라벨로</text>
  <text x="130" y="155" fill="#e8e4df" font-size="9.5" text-anchor="middle">chunk 위치를 찾음</text>

  <!-- ② chunks -->
  <rect x="232" y="96" width="172" height="70" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="318" y="120" fill="#e8e4df" font-size="12" text-anchor="middle">② <tspan font-family="'JetBrains Mono', monospace">chunks/</tspan></text>
  <text x="318" y="140" fill="#e8e4df" font-size="9.5" text-anchor="middle">세그먼트 파일들</text>
  <text x="318" y="155" fill="#e8e4df" font-size="9.5" text-anchor="middle">기본 ≤ 512 MiB</text>

  <!-- ③ meta.json -->
  <rect x="420" y="96" width="172" height="70" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="506" y="120" fill="#e8e4df" font-size="12" text-anchor="middle">③ <tspan font-family="'JetBrains Mono', monospace">meta.json</tspan></text>
  <text x="506" y="140" fill="#e8e4df" font-size="9.5" text-anchor="middle">ID · 최소/최대 시각</text>
  <text x="506" y="155" fill="#e8e4df" font-size="9.5" text-anchor="middle">샘플·시계열·chunk 수</text>

  <!-- ④ 툼스톤 -->
  <rect x="608" y="96" width="172" height="70" fill="#0d0d0d" stroke="rgb(224,108,108)"/>
  <text x="694" y="120" fill="#e8e4df" font-size="12" text-anchor="middle">④ <tspan font-family="'JetBrains Mono', monospace">tombstones</tspan></text>
  <text x="694" y="140" fill="#e8e4df" font-size="9.5" text-anchor="middle">읽을 때 무시할</text>
  <text x="694" y="155" fill="#e8e4df" font-size="9.5" text-anchor="middle">시계열 × 시간 범위</text>

  <text x="694" y="186" fill="rgb(224,108,108)" font-size="9.5" text-anchor="middle">넷 중 쓰인 뒤 고쳐지는 유일한 파일</text>

  <!-- 세그먼트 내부 -->
  <text x="44" y="212" fill="#e8e4df" font-size="11">②의 속 — 파일 하나가 chunk 가 아닙니다</text>

  <rect x="44" y="222" width="360" height="32" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="54" y="242" fill="rgb(168,163,158)" font-size="9.5" font-family="'JetBrains Mono', monospace">000001</text>
  <rect x="112" y="228" width="44" height="20" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <rect x="162" y="228" width="44" height="20" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <rect x="212" y="228" width="44" height="20" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <rect x="262" y="228" width="44" height="20" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <text x="330" y="242" fill="rgb(168,163,158)" font-size="9.5">chunk 수만 개 …</text>

  <text x="424" y="243" fill="#e8e4df" font-size="10">앰버 칸 하나하나가 chunk · 서로 무관합니다</text>

  <!-- 결론 -->
  <line x1="24" y1="294" x2="796" y2="294" stroke="rgb(92,84,74)"/>
  <text x="24" y="320" fill="#e8e4df" font-size="12">넷이 갖춰지므로 <tspan fill="rgb(212,168,83)" font-weight="700">블록 하나가 곧 독립된 데이터베이스</tspan>입니다 — 다른 블록을 읽지 않고 홀로 질의에 답합니다.</text>
  <text x="24" y="348" fill="#e8e4df" font-size="10.5">그래서 보존 만료는 폴더째 지우면 끝나고, 시계열 일부만 지우려면 블록을 통째로 다시 써야 합니다(→ 툼스톤).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="PSI 는 자원 경합 지연을 waiting 과 stalled 로 나눈다. waiting 은 스케줄러가 CPU 에 돌릴 다른 일을 찾은 상태, stalled 는 아무 일도 못 찾아 CPU 사이클을 통째로 버리는 상태다. CPU 자원에는 stalled 범주가 없다">
  <rect width="720" height="330" fill="#0d0d0d"/>
  <text x="360" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">PSI — waiting vs stalled (디스크·메모리 경합)</text>

  <!-- waiting -->
  <rect x="40" y="58" width="310" height="120" rx="10" fill="#dceaf7"/>
  <text x="60" y="84" font-size="15" font-weight="700" fill="#10243a">waiting</text>
  <text x="60" y="108" font-size="12.5" fill="#10243a">프로세스가 자원을 기다려 진행 못 함</text>
  <text x="60" y="130" font-size="12.5" font-weight="700" fill="#14521d">→ 하지만 스케줄러가 CPU 에 돌릴</text>
  <text x="60" y="148" font-size="12.5" font-weight="700" fill="#14521d">   다른 일을 찾아냄 (CPU 안 놀음)</text>
  <text x="60" y="168" font-size="11.5" fill="#10243a">비교적 정상 — some 라인</text>

  <!-- stalled -->
  <rect x="370" y="58" width="310" height="120" rx="10" fill="#f5edda"/>
  <text x="390" y="84" font-size="15" font-weight="700" fill="#3a2f10">stalled</text>
  <text x="390" y="108" font-size="12.5" fill="#3a2f10">프로세스가 자원을 기다려 진행 못 함</text>
  <text x="390" y="130" font-size="12.5" font-weight="700" fill="#7a1f1f">→ 스케줄러가 돌릴 다른 일도</text>
  <text x="390" y="148" font-size="12.5" font-weight="700" fill="#7a1f1f">   아무것도 못 찾음 (CPU 사이클 낭비)</text>
  <text x="390" y="168" font-size="11.5" fill="#3a2f10">심각 신호 — full 라인</text>

  <!-- CPU note -->
  <rect x="40" y="196" width="640" height="60" rx="10" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="60" y="220" font-size="13" font-weight="700" fill="#8ab6e0">CPU 자원에는 stalled 가 없다</text>
  <text x="60" y="242" font-size="12" fill="#c9c4be">CPU 를 기다린다 = 다른 무언가가 이미 CPU 에서 돎 = 무언가는 진행 중 → stalled 일 수 없음</text>

  <text x="360" y="286" text-anchor="middle" font-size="11.5" fill="#8a8580">exporter 서술자 5개: cpu · io · ioFull · mem · memFull  —  cpuFull 은 없음</text>
  <text x="360" y="310" text-anchor="middle" font-size="11" fill="#8a8580">커널 psi.rst: "CPU full is undefined at the system level" (5.13 이후 하위호환 위해 0)</text>
</svg>

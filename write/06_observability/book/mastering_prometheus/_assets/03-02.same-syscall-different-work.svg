<svg viewBox="0 0 900 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>같은 write 시스템콜, 다른 준비 과정</title>
  <desc>WAL 과 영속 블록은 파일에 쓸 때 똑같은 write 와 Sync 시스템콜을 쓴다. 특별한 명령어가 따로 있는 것이 아니다. 갈리는 곳은 그 호출에 이르기까지 무엇을 하느냐다. WAL 은 받은 레코드를 그대로 버퍼에 담아 파일 끝에 덧붙이므로 준비가 사실상 없다. 영속 블록은 기존 데이터를 읽어 시계열별로 정렬하고 델타와 XOR 로 압축한 뒤 역색인을 만들고 나서야 쓴다. 그래서 같은 시스템콜인데도 WAL 은 매 샘플마다 불러도 싸고 블록은 두 시간에 한 번만 부른다.</desc>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">시스템콜은 같습니다 — 다른 건 &quot;쓰기 전에 하는 일&quot;</text>

  <!-- WAL 레인 -->
  <text x="24" y="66" fill="#66bb6a" font-size="12" font-weight="700">WAL — 준비가 없습니다</text>
  <rect x="24" y="78" width="852" height="96" fill="#0d0d0d" stroke="#66bb6a"/>

  <rect x="44" y="98" width="120" height="40" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="104" y="116" style="fill:#0d0d0d" font-size="9.5" text-anchor="middle" font-weight="700">샘플 1 개</text>
  <text x="104" y="130" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">받은 그대로</text>

  <line x1="172" y1="118" x2="216" y2="118" stroke="#66bb6a" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="224" y="98" width="150" height="40" fill="#0d0d0d" stroke="#66bb6a"/>
  <text x="299" y="116" fill="#e8e4df" font-size="9.5" text-anchor="middle">32 KiB 버퍼에 담기</text>
  <text x="299" y="130" fill="#b8b3ad" font-size="8.5" text-anchor="middle">가공 없음</text>

  <line x1="382" y1="118" x2="426" y2="118" stroke="#66bb6a" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="434" y="98" width="150" height="40" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="509" y="116" style="fill:#10243a" font-size="10" text-anchor="middle" font-weight="700">write()</text>
  <text x="509" y="130" style="fill:#10243a" font-size="8.5" text-anchor="middle">파일 끝에 덧붙임</text>

  <text x="604" y="112" fill="#66bb6a" font-size="10" font-weight="700">준비 단계 0 개</text>
  <text x="604" y="130" fill="#b8b3ad" font-size="9">그래서 매 샘플마다 불러도 쌉니다</text>

  <text x="44" y="160" fill="#b8b3ad" font-size="8.5">기존 데이터 안 읽음 · CPU 거의 0</text>

  <!-- 블록 레인 -->
  <text x="24" y="212" fill="rgb(212,168,83)" font-size="12" font-weight="700">영속 블록 — 준비가 깁니다</text>
  <rect x="24" y="224" width="852" height="110" fill="#0d0d0d" stroke="rgb(212,168,83)"/>

  <rect x="44" y="244" width="104" height="40" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="96" y="262" style="fill:#0d0d0d" font-size="9.5" text-anchor="middle" font-weight="700">2 시간치</text>
  <text x="96" y="276" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">head 전체</text>

  <line x1="156" y1="264" x2="184" y2="264" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#aa)"/>

  <rect x="192" y="244" width="94" height="40" fill="#f5edda" stroke="#f5edda"/>
  <text x="239" y="268" style="fill:#7a5a1f" font-size="9" text-anchor="middle">1. 읽어서</text>

  <line x1="294" y1="264" x2="316" y2="264" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#aa)"/>

  <rect x="324" y="244" width="94" height="40" fill="#f5edda" stroke="#f5edda"/>
  <text x="371" y="268" style="fill:#7a5a1f" font-size="9" text-anchor="middle">2. 정렬·병합</text>

  <line x1="426" y1="264" x2="448" y2="264" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#aa)"/>

  <rect x="456" y="244" width="94" height="40" fill="#f5edda" stroke="#f5edda"/>
  <text x="503" y="264" style="fill:#7a5a1f" font-size="9" text-anchor="middle">3. 델타·XOR</text>
  <text x="503" y="277" style="fill:#7a5a1f" font-size="8" text-anchor="middle">압축</text>

  <line x1="558" y1="264" x2="580" y2="264" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#aa)"/>

  <rect x="588" y="244" width="94" height="40" fill="#f5edda" stroke="#f5edda"/>
  <text x="635" y="268" style="fill:#7a5a1f" font-size="9" text-anchor="middle">4. 인덱스 생성</text>

  <line x1="690" y1="264" x2="712" y2="264" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#aa)"/>

  <rect x="720" y="244" width="136" height="40" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="788" y="262" style="fill:#10243a" font-size="10" text-anchor="middle" font-weight="700">write()</text>
  <text x="788" y="276" style="fill:#10243a" font-size="8.5" text-anchor="middle">같은 시스템콜</text>

  <text x="44" y="308" fill="rgb(212,168,83)" font-size="10" font-weight="700">준비 단계 4 개</text>
  <text x="150" y="308" fill="#b8b3ad" font-size="9">— 비싼 건 write 앞의 준비입니다</text>

  <!-- 결론 -->
  <line x1="24" y1="352" x2="876" y2="352" stroke="rgb(92,84,74)"/>
  <text x="24" y="374" fill="#e8e4df" font-size="11">둘 다 <tspan fill="#dceaf7" font-weight="700">똑같은 write · Sync</tspan> 를 부릅니다</text>
  <text x="24" y="392" fill="#b8b3ad" font-size="10">순차 · 임의는 명령어가 아니라 <tspan fill="#e8e4df">어디에 · 무엇을 준비해 쓰느냐</tspan></text>
</svg>

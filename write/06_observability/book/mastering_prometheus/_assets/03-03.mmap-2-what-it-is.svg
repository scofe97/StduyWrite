<svg viewBox="0 0 900 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>mmap 은 무엇인가 — 데이터를 옮기지 않고 주소만 약속한다</title>
  <desc>read 로 읽으면 파일 내용이 프로그램 메모리로 복사되어 사본이 생기고 메모리를 차지한다. mmap 은 아무것도 복사하지 않는다. 이 주소 범위는 저 파일의 이 구간이라는 약속만 커널에 등록하며, 이 시점에 디스크에서 읽어 온 바이트는 0 개다. 데이터는 여전히 디스크에만 있다. 그래서 mmap 은 메모리에 있는 저장소가 아니라 디스크의 파일을 메모리 주소로 부를 수 있게 해 주는 다리다. 주소는 있지만 실물은 아직 디스크에 있는 상태다.</desc>

  <defs>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f44336"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">2단계 · mmap 은 무엇입니까</text>

  <!-- read -->
  <text x="24" y="62" fill="#f44336" font-size="12" font-weight="700">read — 데이터를 복사해 옵니다</text>
  <rect x="24" y="74" width="852" height="106" fill="#0d0d0d" stroke="#f44336"/>

  <text x="44" y="96" fill="rgb(138,133,128)" font-size="9">디스크</text>
  <rect x="44" y="106" width="180" height="56" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="134" y="132" style="fill:#10243a" font-size="10" text-anchor="middle" font-weight="700">파일 내용</text>
  <text x="134" y="150" style="fill:#10243a" font-size="9" text-anchor="middle">원본</text>

  <line x1="236" y1="134" x2="300" y2="134" stroke="#f44336" stroke-width="2" marker-end="url(#r)"/>
  <text x="268" y="126" fill="#f44336" font-size="9" text-anchor="middle" font-weight="700">복사</text>

  <text x="312" y="96" fill="rgb(138,133,128)" font-size="9">메모리</text>
  <rect x="312" y="106" width="180" height="56" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="402" y="132" style="fill:#7a1f1f" font-size="10" text-anchor="middle" font-weight="700">사본이 생김</text>
  <text x="402" y="150" style="fill:#7a1f1f" font-size="9" text-anchor="middle">자리를 차지합니다</text>

  <text x="520" y="126" fill="#e8e4df" font-size="10">같은 내용이 <tspan fill="#f44336" font-weight="700">두 곳에</tspan> 있습니다.</text>
  <text x="520" y="146" fill="rgb(138,133,128)" font-size="9.5">쓸지 안 쓸지 모르는 것까지 미리 올라옵니다.</text>

  <!-- mmap -->
  <text x="24" y="216" fill="rgb(212,168,83)" font-size="12" font-weight="700">mmap — 아무것도 옮기지 않습니다</text>
  <rect x="24" y="228" width="852" height="106" fill="#0d0d0d" stroke="rgb(212,168,83)"/>

  <text x="44" y="250" fill="rgb(138,133,128)" font-size="9">디스크</text>
  <rect x="44" y="260" width="180" height="56" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="134" y="286" style="fill:#10243a" font-size="10" text-anchor="middle" font-weight="700">파일 내용</text>
  <text x="134" y="304" style="fill:#10243a" font-size="9" text-anchor="middle">그대로 여기 있음</text>

  <!-- 다리 -->
  <line x1="224" y1="288" x2="312" y2="288" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="268" y="278" fill="rgb(212,168,83)" font-size="9" text-anchor="middle">약속만</text>
  <text x="268" y="306" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">복사 0 바이트</text>

  <text x="312" y="250" fill="rgb(138,133,128)" font-size="9">메모리 — 주소 공간</text>
  <rect x="312" y="260" width="180" height="56" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-dasharray="4 3"/>
  <text x="402" y="282" fill="#e8e4df" font-size="10" text-anchor="middle">주소는 있는데</text>
  <text x="402" y="300" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="700">내용은 비어 있음</text>

  <text x="520" y="280" fill="#e8e4df" font-size="10">내용은 <tspan fill="rgb(212,168,83)" font-weight="700">한 곳에만</tspan> 있습니다 — 디스크.</text>
  <text x="520" y="300" fill="rgb(138,133,128)" font-size="9.5">&quot;이 주소 = 저 파일 이 구간&quot; 이라는 약속만 등록합니다.</text>

  <!-- 결론 -->
  <line x1="24" y1="352" x2="876" y2="352" stroke="rgb(92,84,74)"/>
  <text x="24" y="374" fill="#e8e4df" font-size="11">그래서 mmap 은 <tspan fill="#f44336" font-weight="700">메모리에 있는 저장소가 아닙니다.</tspan></text>
  <text x="24" y="392" fill="rgb(212,168,83)" font-size="11" font-weight="700">디스크의 파일을 메모리 주소처럼 부를 수 있게 해 주는 &quot;다리&quot; 입니다.</text>
</svg>

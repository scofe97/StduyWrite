<svg viewBox="0 0 900 344" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>read 와 mmap — 복사하느냐 주소만 약속하느냐</title>
  <desc>read 로 읽으면 파일 내용이 프로그램 메모리로 복사되어 같은 내용이 디스크와 메모리 두 곳에 생기고, 사본이 메모리 자리를 차지한다. 아직 쓸지 안 쓸지 모르는 것까지 미리 올라온다. mmap 은 아무것도 복사하지 않는다. 이 주소 범위는 저 파일의 이 구간이라는 약속만 커널에 등록하며, 이 시점에 디스크에서 읽어 온 바이트는 0 개다. 그래서 주소는 있지만 내용은 비어 있는 상태가 되고 데이터는 여전히 디스크에만 있다. mmap 은 메모리에 있는 저장소가 아니라 디스크의 파일을 메모리 주소처럼 부를 수 있게 해 주는 다리다.</desc>

  <defs>
    <marker id="mw-red" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f44336"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="344" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">2단계 · mmap 은 무엇입니까</text>

  <!-- ===== read ===== -->
  <text x="24" y="62" fill="#f44336" font-size="12" font-weight="700">read — 복사합니다</text>
  <rect x="24" y="74" width="852" height="100" fill="#0d0d0d" stroke="#f44336"/>

  <text x="44" y="96" fill="#b8b3ad" font-size="9">디스크</text>
  <rect x="44" y="106" width="180" height="52" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="134" y="130" style="fill:#10243a" font-size="10" text-anchor="middle" font-weight="700">파일 내용</text>
  <text x="134" y="148" style="fill:#10243a" font-size="9" text-anchor="middle">원본</text>

  <line x1="236" y1="132" x2="300" y2="132" stroke="#f44336" stroke-width="2" marker-end="url(#mw-red)"/>
  <text x="268" y="124" fill="#f44336" font-size="9" text-anchor="middle" font-weight="700">복사</text>

  <text x="312" y="96" fill="#b8b3ad" font-size="9">메모리</text>
  <rect x="312" y="106" width="180" height="52" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="402" y="130" style="fill:#7a1f1f" font-size="10" text-anchor="middle" font-weight="700">사본</text>
  <text x="402" y="148" style="fill:#7a1f1f" font-size="9" text-anchor="middle">자리를 차지</text>

  <text x="524" y="126" fill="#e8e4df" font-size="10">내용이 <tspan fill="#f44336" font-weight="700">두 곳에</tspan></text>
  <text x="524" y="146" fill="#b8b3ad" font-size="9.5">안 쓸 것도 미리 올라옴</text>

  <!-- ===== mmap ===== -->
  <text x="24" y="210" fill="rgb(212,168,83)" font-size="12" font-weight="700">mmap — 약속만 합니다</text>
  <rect x="24" y="222" width="852" height="100" fill="#0d0d0d" stroke="rgb(212,168,83)"/>

  <text x="44" y="244" fill="#b8b3ad" font-size="9">디스크</text>
  <rect x="44" y="254" width="180" height="52" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="134" y="278" style="fill:#10243a" font-size="10" text-anchor="middle" font-weight="700">파일 내용</text>
  <text x="134" y="296" style="fill:#10243a" font-size="9" text-anchor="middle">그대로 여기</text>

  <line x1="224" y1="280" x2="312" y2="280" stroke="rgb(212,168,83)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="268" y="270" fill="rgb(212,168,83)" font-size="9" text-anchor="middle">약속만</text>
  <text x="268" y="298" fill="#b8b3ad" font-size="8.5" text-anchor="middle">복사 0 B</text>

  <text x="312" y="244" fill="#b8b3ad" font-size="9">메모리 — 주소 공간</text>
  <rect x="312" y="254" width="180" height="52" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-dasharray="4 3"/>
  <text x="402" y="276" fill="#e8e4df" font-size="10" text-anchor="middle">주소는 있고</text>
  <text x="402" y="294" fill="rgb(212,168,83)" font-size="10" text-anchor="middle" font-weight="700">내용은 비었음</text>

  <text x="524" y="274" fill="#e8e4df" font-size="10">내용은 <tspan fill="rgb(212,168,83)" font-weight="700">디스크 한 곳에만</tspan></text>
  <text x="524" y="294" fill="#b8b3ad" font-size="9.5">주소 ↔ 파일 구간 대응만 등록</text>
</svg>

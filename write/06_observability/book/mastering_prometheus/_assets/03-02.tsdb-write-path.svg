<svg viewBox="0 0 900 428" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>샘플 하나가 걸어가는 길 — 메모리와 디스크를 오가는 경로</title>
  <desc>스크레이프된 샘플은 두 갈래로 갈라진다. 하나는 곧바로 디스크의 WAL 에 순차로 덧붙어 내구성을 확보하고, 다른 하나는 메모리의 head 블록으로 들어간다. head 블록 안에는 시계열마다 head chunk 가 하나씩 자란다. head chunk 가 목표 120 샘플에 이르면 디스크의 chunks_head 세그먼트로 flush 되고 메모리에는 mmap 참조만 남는다. head 블록의 데이터가 최소 블록 범위의 1.5 배를 넘기면 앞의 2 시간이 압축되어 영속 블록이 되고, 이때 그 구간의 WAL 이 잘리며 체크포인트가 만들어진다. 재시작하면 WAL 을 재생해 head 를 복원한다.</desc>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
    <marker id="as" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="428" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">샘플 하나가 걸어가는 길</text>

  <!-- 메모리 영역 -->
  <rect x="168" y="48" width="708" height="122" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="182" y="66" fill="rgb(138,133,128)" font-size="10">메모리</text>

  <!-- 디스크 영역 -->
  <rect x="168" y="196" width="708" height="146" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="182" y="214" fill="rgb(138,133,128)" font-size="10">디스크</text>

  <!-- 입력 -->
  <rect x="24" y="108" width="98" height="44" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="73" y="127" style="fill:#0d0d0d" font-size="10.5" text-anchor="middle" font-weight="700">스크레이프</text>
  <text x="73" y="142" style="fill:#0d0d0d" font-size="9" text-anchor="middle">샘플 1 개</text>

  <!-- 분기 -->
  <line x1="122" y1="130" x2="146" y2="130" stroke="rgb(212,168,83)" stroke-width="2"/>
  <line x1="146" y1="92" x2="146" y2="244" stroke="rgb(212,168,83)" stroke-width="2"/>
  <line x1="146" y1="92" x2="234" y2="92" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <line x1="146" y1="244" x2="234" y2="244" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <text x="158" y="86" fill="rgb(138,133,128)" font-size="8.5">② 그다음</text>
  <text x="158" y="238" fill="rgb(138,133,128)" font-size="8.5">① 먼저</text>

  <!-- head 블록 (메모리) — 안에 head chunk 들이 중첩 -->
  <rect x="242" y="76" width="322" height="82" fill="#0d0d0d" stroke="rgb(212,168,83)"/>
  <text x="256" y="94" fill="rgb(212,168,83)" font-size="11" font-weight="700">head 블록</text>
  <text x="340" y="94" fill="rgb(138,133,128)" font-size="8.5">수집 중인 시계열 전부 · 블록 하나</text>

  <rect x="256" y="104" width="92" height="42" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="302" y="120" style="fill:#0d0d0d" font-size="9" text-anchor="middle" font-weight="700">head chunk</text>
  <text x="302" y="133" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">시계열 A</text>

  <rect x="356" y="104" width="92" height="42" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="402" y="120" style="fill:#0d0d0d" font-size="9" text-anchor="middle" font-weight="700">head chunk</text>
  <text x="402" y="133" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">시계열 B</text>

  <rect x="456" y="104" width="92" height="42" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="502" y="129" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">… 수백만 개</text>

  <!-- flush -->
  <line x1="572" y1="117" x2="612" y2="117" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <text x="592" y="110" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">flush</text>
  <text x="592" y="132" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">120 샘플</text>

  <!-- 메모리에 남는 것: mmap 참조 스텁 -->
  <rect x="620" y="98" width="240" height="44" fill="#0d0d0d" stroke="rgb(92,84,74)" stroke-dasharray="4 3"/>
  <text x="740" y="116" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">메모리엔 <tspan fill="#e8e4df">mmap 참조만</tspan> 남습니다</text>
  <text x="740" y="132" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">샘플 120 개는 힙에서 사라집니다</text>

  <!-- 참조 → 파일 -->
  <line x1="740" y1="142" x2="740" y2="218" stroke="rgb(212,168,83)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="750" y="176" fill="rgb(138,133,128)" font-size="8.5">가리킴</text>

  <!-- chunks_head 세그먼트 (디스크) -->
  <rect x="620" y="220" width="240" height="44" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="740" y="238" style="fill:#10243a" font-size="10" text-anchor="middle" font-weight="700">chunks_head 세그먼트 파일</text>
  <text x="740" y="253" style="fill:#10243a" font-size="8.5" text-anchor="middle">≤ 128 MiB · 여러 chunk 를 한 파일에</text>

  <!-- WAL (디스크) -->
  <rect x="242" y="222" width="210" height="46" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="347" y="241" style="fill:#0d0d0d" font-size="11" text-anchor="middle" font-weight="700">WAL</text>
  <text x="347" y="257" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">순차 덧붙이기 · 매 샘플 · 쌈</text>
  <text x="242" y="292" fill="rgb(138,133,128)" font-size="9">평소엔 <tspan fill="#e8e4df">쓰기만</tspan> 합니다 — 읽히는 때는 재시작뿐</text>

  <!-- replay -->
  <line x1="262" y1="222" x2="262" y2="164" stroke="#66bb6a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="270" y="186" fill="#66bb6a" font-size="8.5">재시작 replay</text>

  <!-- 영속 블록 -->
  <rect x="620" y="282" width="240" height="44" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="740" y="300" style="fill:#0d0d0d" font-size="11" text-anchor="middle" font-weight="700">영속 블록</text>
  <text x="740" y="315" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">임의 쓰기 · 2 시간에 한 번 · 비쌈</text>

  <!-- chunks_head → 영속 블록 -->
  <line x1="660" y1="264" x2="660" y2="278" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <text x="676" y="277" fill="rgb(138,133,128)" font-size="8.5">head 1.5×2h 초과 시 앞 2 시간을 압축</text>

  <!-- WAL 절단 -->
  <line x1="612" y1="304" x2="464" y2="304" stroke="rgb(138,133,128)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#as)"/>
  <text x="538" y="297" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">WAL 절단 · 체크포인트</text>

  <!-- 결론 -->
  <line x1="24" y1="364" x2="876" y2="364" stroke="rgb(92,84,74)"/>
  <text x="24" y="388" fill="#e8e4df" font-size="11">매 샘플이 지나는 <tspan fill="#66bb6a" font-weight="700">WAL 은 싸고</tspan>, 어쩌다 한 번 지나는 <tspan fill="rgb(212,168,83)" font-weight="700">영속 블록은 비쌉니다</tspan>.</text>
  <text x="24" y="408" fill="rgb(138,133,128)" font-size="10">그래서 매번 WAL 을 거쳐도 손해가 아닙니다 — 비싼 일을 자주 하지 않는 것이 핵심입니다.</text>
</svg>

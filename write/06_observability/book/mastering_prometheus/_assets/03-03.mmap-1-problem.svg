<svg viewBox="0 0 900 330" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>mmap 이 푸는 문제 — 데이터는 디스크에 있는데 메모리는 작다</title>
  <desc>chunk 의 원본은 전부 디스크의 세그먼트 파일에 있고 그 양은 수 기가바이트에 이른다. 반면 프로그램이 쓸 수 있는 메모리는 그보다 훨씬 작다. 방법은 셋이다. 전부 메모리로 복사하면 넘쳐서 죽는다. 아무것도 올리지 않고 그때그때 읽으면 질의마다 디스크를 다시 읽어 느리다. 자주 쓰는 것만 골라 올리는 것이 답인데, 무엇이 자주 쓰일지 미리 알 수 없다는 것이 문제다. mmap 은 이 고르는 일을 운영체제에게 맡긴다.</desc>

  <rect x="0" y="0" width="900" height="330" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">1단계 · 무엇이 문제입니까</text>

  <!-- 디스크: 크다 -->
  <text x="24" y="66" fill="rgb(138,133,128)" font-size="10">디스크 — 원본이 전부 여기 있습니다</text>
  <rect x="24" y="76" width="500" height="86" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="274" y="108" style="fill:#10243a" font-size="12" text-anchor="middle" font-weight="700">세그먼트 파일들 · chunk 60 만 개</text>
  <text x="274" y="132" style="fill:#10243a" font-size="10" text-anchor="middle">수 GB</text>
  <text x="274" y="150" style="fill:#10243a" font-size="9" text-anchor="middle">싸고 넉넉하지만 느립니다</text>

  <!-- 메모리: 작다 -->
  <text x="560" y="66" fill="rgb(138,133,128)" font-size="10">메모리 — 프로그램이 쓸 수 있는 곳</text>
  <rect x="560" y="76" width="180" height="86" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="650" y="112" style="fill:#0d0d0d" font-size="12" text-anchor="middle" font-weight="700">훨씬 작음</text>
  <text x="650" y="134" style="fill:#0d0d0d" font-size="9" text-anchor="middle">빠르지만 좁습니다</text>

  <text x="756" y="112" fill="#f44336" font-size="11" font-weight="700">← 다 못 담습니다</text>

  <!-- 선택지 -->
  <text x="24" y="200" fill="#e8e4df" font-size="12" font-weight="700">그럼 어떻게 합니까</text>

  <rect x="24" y="212" width="272" height="68" fill="#0d0d0d" stroke="#f44336"/>
  <text x="40" y="234" fill="#f44336" font-size="10.5" font-weight="700">✕ 전부 메모리로 복사</text>
  <text x="40" y="254" fill="#e8e4df" font-size="9.5">수 GB 를 좁은 곳에 밀어 넣음</text>
  <text x="40" y="270" fill="rgb(138,133,128)" font-size="9">→ 메모리 부족으로 죽습니다</text>

  <rect x="314" y="212" width="272" height="68" fill="#0d0d0d" stroke="#f44336"/>
  <text x="330" y="234" fill="#f44336" font-size="10.5" font-weight="700">✕ 아무것도 안 올림</text>
  <text x="330" y="254" fill="#e8e4df" font-size="9.5">필요할 때마다 디스크를 읽음</text>
  <text x="330" y="270" fill="rgb(138,133,128)" font-size="9">→ 질의마다 느립니다</text>

  <rect x="604" y="212" width="272" height="68" fill="#0d0d0d" stroke="#66bb6a"/>
  <text x="620" y="234" fill="#66bb6a" font-size="10.5" font-weight="700">○ 자주 쓰는 것만 올림</text>
  <text x="620" y="254" fill="#e8e4df" font-size="9.5">그런데 무엇이 자주 쓰일지</text>
  <text x="620" y="270" fill="rgb(138,133,128)" font-size="9">미리 알 수 없습니다</text>

  <line x1="24" y1="300" x2="876" y2="300" stroke="rgb(92,84,74)"/>
  <text x="24" y="320" fill="#e8e4df" font-size="11">세 번째가 답인데 &quot;무엇을 올릴지&quot; 를 정하기 어렵습니다. <tspan fill="#66bb6a" font-weight="700">mmap 은 이 고르는 일을 OS 에게 맡깁니다.</tspan></text>
</svg>

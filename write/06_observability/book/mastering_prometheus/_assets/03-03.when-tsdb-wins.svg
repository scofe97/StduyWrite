<svg viewBox="0 0 900 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>TSDB 가 유리한 조건과 불리한 조건</title>
  <desc>TSDB 는 다섯 전제가 맞을 때 유리하다. 데이터가 쓰인 뒤 바뀌지 않고, 시각이 규칙적으로 증가하며, 한 시계열을 시간 범위로 훑어 읽고, 개별 한 건이 아니라 추세를 보며, 오래된 것을 통째로 버려도 된다는 조건이다. 이 다섯이 맞으면 압축과 순차 읽기가 모두 성립해 저장 비용과 질의 속도에서 큰 차이가 난다. 반대로 데이터를 나중에 수정하거나, 한 건을 정확히 찾아야 하거나, 여러 테이블을 조인해야 하거나, 트랜잭션과 정합성이 필요하거나, 문자열 같은 비수치 값을 다뤄야 하면 TSDB 는 맞지 않고 RDB 를 써야 한다. 모니터링 메트릭은 다섯 전제를 모두 만족하므로 TSDB 가 자연스러운 선택이다.</desc>

  <rect x="0" y="0" width="900" height="470" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">언제 TSDB 를 고릅니까 — 다섯 전제로 판별합니다</text>

  <!-- 유리 -->
  <rect x="24" y="52" width="416" height="252" fill="#0d0d0d" stroke="#66bb6a"/>
  <text x="40" y="76" fill="#66bb6a" font-size="12" font-weight="700">TSDB 가 유리한 조건</text>
  <text x="40" y="94" fill="#b8b3ad" font-size="9">다섯이 모두 맞으면 압축·순차읽기가 성립합니다</text>

  <rect x="40" y="106" width="384" height="34" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="52" y="120" style="fill:#0d0d0d" font-size="9.5" font-weight="700">1. 쓰고 나면 안 바뀝니다</text>
  <text x="52" y="133" style="fill:#0d0d0d" font-size="8.5">과거 측정값을 수정할 일이 없음 → 불변 블록 가능</text>

  <rect x="40" y="146" width="384" height="34" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="52" y="160" style="fill:#0d0d0d" font-size="9.5" font-weight="700">2. 시각이 규칙적으로 늘어납니다</text>
  <text x="52" y="173" style="fill:#0d0d0d" font-size="8.5">15초마다 도착 → 델타-오브-델타가 거의 0</text>

  <rect x="40" y="186" width="384" height="34" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="52" y="200" style="fill:#0d0d0d" font-size="9.5" font-weight="700">3. 한 시계열을 시간 범위로 훑습니다</text>
  <text x="52" y="213" style="fill:#0d0d0d" font-size="8.5">&quot;최근 1시간 CPU&quot; → 순차 스캔</text>

  <rect x="40" y="226" width="384" height="34" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="52" y="240" style="fill:#0d0d0d" font-size="9.5" font-weight="700">4. 한 건이 아니라 추세를 봅니다</text>
  <text x="52" y="253" style="fill:#0d0d0d" font-size="8.5">샘플 하나가 틀려도 그래프는 맞음 → 트랜잭션 불필요</text>

  <rect x="40" y="266" width="384" height="34" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="52" y="280" style="fill:#0d0d0d" font-size="9.5" font-weight="700">5. 오래된 것은 통째로 버립니다</text>
  <text x="52" y="293" style="fill:#0d0d0d" font-size="8.5">보존 기간 지나면 폴더째 삭제 → 정리가 쌈</text>

  <!-- 불리 -->
  <rect x="460" y="52" width="416" height="252" fill="#0d0d0d" stroke="#f44336"/>
  <text x="476" y="76" fill="#f44336" font-size="12" font-weight="700">TSDB 가 맞지 않는 조건</text>
  <text x="476" y="94" fill="#b8b3ad" font-size="9">하나라도 걸리면 RDB 를 쓰십시오</text>

  <rect x="476" y="106" width="384" height="34" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="488" y="120" style="fill:#7a1f1f" font-size="9.5" font-weight="700">✕ 나중에 수정해야 합니다</text>
  <text x="488" y="133" style="fill:#7a1f1f" font-size="8.5">주문 상태·회원 정보 → UPDATE 가 본업</text>

  <rect x="476" y="146" width="384" height="34" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="488" y="160" style="fill:#7a1f1f" font-size="9.5" font-weight="700">✕ 한 건을 정확히 찾아야 합니다</text>
  <text x="488" y="173" style="fill:#7a1f1f" font-size="8.5">&quot;주문번호 12345&quot; → PK 조회가 본업</text>

  <rect x="476" y="186" width="384" height="34" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="488" y="200" style="fill:#7a1f1f" font-size="9.5" font-weight="700">✕ 여러 테이블을 조인해야 합니다</text>
  <text x="488" y="213" style="fill:#7a1f1f" font-size="8.5">TSDB 에는 조인이 없습니다 (라벨 매칭뿐)</text>

  <rect x="476" y="226" width="384" height="34" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="488" y="240" style="fill:#7a1f1f" font-size="9.5" font-weight="700">✕ 트랜잭션·정합성이 필요합니다</text>
  <text x="488" y="253" style="fill:#7a1f1f" font-size="8.5">돈 계산 → 한 건도 틀리면 안 됨</text>

  <rect x="476" y="266" width="384" height="34" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="488" y="280" style="fill:#7a1f1f" font-size="9.5" font-weight="700">✕ 값이 숫자가 아닙니다</text>
  <text x="488" y="293" style="fill:#7a1f1f" font-size="8.5">로그 본문·문자열 → float64 에 안 담김</text>

  <!-- 메트릭 판정 -->
  <line x1="24" y1="328" x2="876" y2="328" stroke="rgb(92,84,74)"/>
  <text x="24" y="352" fill="#e8e4df" font-size="12" font-weight="700">모니터링 메트릭을 이 표에 넣어 보면</text>

  <rect x="24" y="364" width="852" height="52" fill="#0d0d0d" stroke="#66bb6a"/>
  <text x="40" y="384" fill="#e8e4df" font-size="9.5">15 초마다 CPU 측정 · 한 시간 추세 · 한 달 뒤 폐기</text>
  <rect x="40" y="392" width="160" height="18" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="120" y="405" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle" font-weight="700">1. 안 바뀜 ✓</text>
  <rect x="208" y="392" width="160" height="18" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="288" y="405" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle" font-weight="700">2. 규칙적 ✓</text>
  <rect x="376" y="392" width="160" height="18" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="456" y="405" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle" font-weight="700">3. 범위 훑기 ✓</text>
  <rect x="544" y="392" width="150" height="18" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="619" y="405" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle" font-weight="700">4. 추세 ✓</text>
  <rect x="702" y="392" width="158" height="18" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="781" y="405" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle" font-weight="700">5. 통째 삭제 ✓</text>

  <text x="24" y="440" fill="#66bb6a" font-size="11" font-weight="700">다섯 전제가 전부 맞습니다</text>
  <text x="24" y="460" fill="#b8b3ad" font-size="10">하나라도 어긋나면 RDB 쪽</text>
</svg>

<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>Prometheus 내부 구조와 TSDB</title>
  <desc>Prometheus 프로세스 경계 안에 스크레이프 매니저, 룰 매니저, TSDB, 웹 UI/REST API 가 있고 모두 TSDB 를 향한다. 알림 전송을 맡는 Alertmanager 와 시각화를 맡는 Grafana 는 경계 밖의 별도 프로세스다.</desc>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e8e4df"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="420" fill="#0d0d0d"/>
  <text x="40" y="34" fill="#e8e4df" font-size="15">Prometheus 내부 구조 — TSDB 를 중심으로</text>

  <!-- 프로세스 경계 -->
  <rect x="40" y="60" width="520" height="300" fill="none" stroke="rgb(138,133,128)" stroke-dasharray="5 4"/>
  <text x="52" y="80" fill="#e8e4df" font-size="11">Prometheus 프로세스</text>

  <!-- 스크레이프 매니저 -->
  <rect x="70" y="95" width="150" height="64" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="145" y="123" fill="#e8e4df" font-size="13" text-anchor="middle">스크레이프 매니저</text>
  <text x="145" y="141" fill="#e8e4df" font-size="10" text-anchor="middle"><tspan font-family="'JetBrains Mono', monospace">HTTP</tspan> pull · 대상 목록</text>

  <!-- 룰 매니저 -->
  <rect x="390" y="95" width="150" height="64" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="465" y="123" fill="#e8e4df" font-size="13" text-anchor="middle">룰 매니저</text>
  <text x="465" y="141" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">recording · alerting</text>

  <!-- TSDB -->
  <rect x="230" y="200" width="160" height="72" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="310" y="230" fill="#e8e4df" font-size="15" text-anchor="middle" font-family="'JetBrains Mono', monospace">TSDB</text>
  <text x="310" y="250" fill="#e8e4df" font-size="10" text-anchor="middle">시간순 최적화 저장</text>

  <!-- 웹 UI / API -->
  <rect x="230" y="300" width="160" height="52" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="310" y="322" fill="#e8e4df" font-size="13" text-anchor="middle">웹 UI · REST API</text>
  <text x="310" y="339" fill="#e8e4df" font-size="10" text-anchor="middle"><tspan font-family="'JetBrains Mono', monospace">PromQL</tspan> 임시 질의</text>

  <!-- 경계 밖 -->
  <rect x="610" y="95" width="130" height="64" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="675" y="123" fill="#e8e4df" font-size="13" text-anchor="middle">Alertmanager</text>
  <text x="675" y="141" fill="#e8e4df" font-size="10" text-anchor="middle">라우팅 트리</text>

  <rect x="610" y="295" width="130" height="60" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="675" y="321" fill="#e8e4df" font-size="13" text-anchor="middle">Grafana</text>
  <text x="675" y="338" fill="#e8e4df" font-size="10" text-anchor="middle">대시보드</text>

  <!-- 내부 화살표 -->
  <line x1="152" y1="161" x2="243" y2="201" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <text x="152" y="192" fill="rgb(212,168,83)" font-size="10">넣기</text>

  <line x1="458" y1="161" x2="377" y2="201" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>
  <text x="472" y="190" fill="rgb(212,168,83)" font-size="10">읽고 평가</text>

  <line x1="310" y1="298" x2="310" y2="276" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#a)"/>

  <!-- 경계 밖 화살표 -->
  <line x1="542" y1="127" x2="604" y2="127" stroke="rgb(138,133,128)" stroke-width="2" marker-end="url(#g)"/>
  <text x="675" y="86" fill="#e8e4df" font-size="10" text-anchor="middle">알림 페이로드를 넘김</text>

  <line x1="392" y1="326" x2="604" y2="324" stroke="rgb(138,133,128)" stroke-width="2" marker-end="url(#g)"/>
  <text x="498" y="316" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">REST API</text>

  <text x="40" y="396" fill="#e8e4df" font-size="10.5">점선 = Prometheus 프로세스 경계 · 앰버 = 모든 부품이 향하는 TSDB</text>
</svg>

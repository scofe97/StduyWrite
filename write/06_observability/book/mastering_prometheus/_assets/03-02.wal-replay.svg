<svg viewBox="0 0 900 330" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>재시작 복구 순서 — 기본 경로와 스냅샷 경로</title>
  <desc>서버가 재시작하면 메모리의 head 를 다시 채워야 한다. 기본 경로는 세 단계다. 먼저 디스크의 mmap 된 chunk 를 적재하고, 다음으로 체크포인트를 재생하고, 마지막으로 체크포인트 이후의 WAL 세그먼트를 재생한다. memory-snapshot-on-shutdown 기능을 켜면 종료할 때 메모리 상태를 스냅샷으로 남기므로, 재시작 때 mmap chunk 를 적재한 뒤 스냅샷으로 시리즈를 복원하고 스냅샷 이후의 WAL 만 재생한다. 스냅샷이 WAL 보다 최신이라 대개 WAL 재생 자체를 건너뛰어 복구가 빨라진다.</desc>

  <defs>
    <marker id="rp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="330" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">재시작하면 head 를 어떻게 다시 채웁니까</text>

  <!-- 기본 경로 -->
  <text x="24" y="64" fill="rgb(212,168,83)" font-size="12" font-weight="700">기본 — 세 단계</text>
  <rect x="24" y="76" width="852" height="76" fill="#0d0d0d" stroke="rgb(212,168,83)"/>

  <rect x="44" y="96" width="230" height="40" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="159" y="113" style="fill:#0d0d0d" font-size="9.5" text-anchor="middle" font-weight="700">① mmap chunk 적재</text>
  <text x="159" y="127" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">이미 디스크에 있던 것</text>

  <line x1="282" y1="116" x2="310" y2="116" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#rp)"/>

  <rect x="318" y="96" width="230" height="40" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="433" y="113" style="fill:#0d0d0d" font-size="9.5" text-anchor="middle" font-weight="700">② 체크포인트 재생</text>
  <text x="433" y="127" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">걸러진 요약본이라 빠름</text>

  <line x1="556" y1="116" x2="584" y2="116" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#rp)"/>

  <rect x="592" y="96" width="264" height="40" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="724" y="113" style="fill:#0d0d0d" font-size="9.5" text-anchor="middle" font-weight="700">③ 남은 WAL 세그먼트 재생</text>
  <text x="724" y="127" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">체크포인트 이후 구간만</text>

  <!-- 스냅샷 경로 -->
  <text x="24" y="188" fill="#66bb6a" font-size="12" font-weight="700">스냅샷 켰을 때 — WAL 재생을 대개 건너뜁니다</text>
  <text x="368" y="188" fill="rgb(138,133,128)" font-size="9">--enable-feature=memory-snapshot-on-shutdown</text>
  <rect x="24" y="200" width="852" height="76" fill="#0d0d0d" stroke="#66bb6a"/>

  <rect x="44" y="220" width="230" height="40" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="159" y="237" style="fill:#0d0d0d" font-size="9.5" text-anchor="middle" font-weight="700">① mmap chunk 적재</text>
  <text x="159" y="251" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">같습니다</text>

  <line x1="282" y1="240" x2="310" y2="240" stroke="#66bb6a" stroke-width="2" marker-end="url(#rp)"/>

  <rect x="318" y="220" width="230" height="40" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="433" y="237" style="fill:#0d0d0d" font-size="9.5" text-anchor="middle" font-weight="700">② 스냅샷으로 시리즈 복원</text>
  <text x="433" y="251" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">종료 때 남겨 둔 메모리 상태</text>

  <line x1="556" y1="240" x2="584" y2="240" stroke="#66bb6a" stroke-width="2" marker-end="url(#rp)"/>

  <rect x="592" y="220" width="264" height="40" fill="#0d0d0d" stroke="rgb(92,84,74)" stroke-dasharray="4 3"/>
  <text x="724" y="237" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">③ 스냅샷 이후 WAL 만</text>
  <text x="724" y="251" fill="#66bb6a" font-size="8.5" text-anchor="middle" font-weight="700">대개 비어 있어 건너뜀</text>

  <!-- 결론 -->
  <line x1="24" y1="292" x2="876" y2="292" stroke="rgb(92,84,74)"/>
  <text x="24" y="314" fill="#e8e4df" font-size="11">과거엔 재생이 <tspan fill="#f44336" font-weight="700">30 분</tspan> 을 넘기도 했지만 최적화 뒤 같은 서버가 <tspan fill="#66bb6a" font-weight="700">5 분 안팎</tspan> 에 끝냅니다.</text>
</svg>

<svg viewBox="0 0 820 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>개념 3층이 디스크에 앉는 자리 — 1대1로 대응하지 않습니다</title>
  <desc>왼쪽의 개념 3층과 오른쪽의 저장 구조가 일대일로 대응하지 않는다. 개념의 메트릭은 저장소에 독립된 실체가 없고 __name__ 이라는 라벨 하나로 녹아들어 시리즈 인덱스 항목 안에 들어간다. 개념의 시계열은 시리즈 인덱스 항목 하나로 앉으며 라벨 셋과 chunk 참조를 담는다. 개념의 샘플은 시계열 옆이 아니라 chunks 디렉토리의 chunk 안에 델타와 XOR 로 압축되어 따로 눕고, 인덱스는 8바이트 참조로 그 위치만 가리킨다. 참조는 상위 4바이트가 세그먼트 파일 번호, 하위 4바이트가 파일 안 오프셋이다.</desc>

  <defs>
    <marker id="cs" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="470" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">개념 3층이 디스크에 앉는 자리 — 1 대 1 로 대응하지 않습니다</text>

  <text x="24" y="62" fill="rgb(168,163,158)" font-size="11">개념 (§1)</text>
  <text x="336" y="62" fill="rgb(168,163,158)" font-size="11">저장 (§5·§6)</text>

  <!-- 세로 구분선 -->
  <line x1="304" y1="70" x2="304" y2="352" stroke="rgb(92,84,74)" stroke-dasharray="5 4"/>

  <!-- 개념: 메트릭 -->
  <rect x="24" y="78" width="240" height="52" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="40" y="100" fill="#e8e4df" font-size="12">메트릭</text>
  <text x="40" y="119" fill="rgb(168,163,158)" font-size="9.5" font-family="'JetBrains Mono', monospace">node_cpu_seconds_total</text>

  <!-- 개념: 시계열 -->
  <rect x="24" y="168" width="240" height="52" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="40" y="190" fill="#e8e4df" font-size="12">시계열</text>
  <text x="40" y="209" fill="rgb(168,163,158)" font-size="9.5" font-family="'JetBrains Mono', monospace">{cpu="0", job="node"}</text>

  <!-- 개념: 샘플 -->
  <rect x="24" y="258" width="240" height="52" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="40" y="280" fill="#e8e4df" font-size="12">샘플</text>
  <text x="40" y="299" fill="rgb(168,163,158)" font-size="9.5" font-family="'JetBrains Mono', monospace">(t0,v0) (t1,v1) …</text>

  <!-- 저장: 시리즈 인덱스 항목 -->
  <rect x="336" y="78" width="460" height="142" fill="rgba(212,168,83,0.10)" stroke="rgb(212,168,83)"/>
  <text x="352" y="100" fill="rgb(212,168,83)" font-size="11" font-weight="700">시리즈 인덱스 항목 하나 <tspan fill="rgb(168,163,158)" font-weight="400">— 유일한 라벨 셋마다 1개</tspan></text>

  <rect x="352" y="112" width="428" height="44" fill="rgba(212,168,83,0.20)" stroke="rgb(212,168,83)"/>
  <text x="366" y="130" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">__name__="node_cpu_seconds_total"</text>
  <text x="366" y="148" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">cpu="0"  job="node"  env="production"</text>

  <text x="352" y="176" fill="#e8e4df" font-size="10">chunk 개수 · chunk 마다 최소/최대 시각</text>
  <rect x="352" y="184" width="428" height="26" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="366" y="202" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">chunk 참조 uint64 × N</text>
  <text x="768" y="202" fill="rgb(168,163,158)" font-size="9.5" text-anchor="end">위치만 가리킵니다</text>

  <!-- 저장: chunk -->
  <rect x="336" y="258" width="460" height="86" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="352" y="280" fill="#e8e4df" font-size="11" font-weight="700"><tspan font-family="'JetBrains Mono', monospace">chunks/</tspan> 세그먼트 파일 안의 chunk</text>
  <rect x="352" y="292" width="200" height="28" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <text x="452" y="311" fill="#e8e4df" font-size="9.5" text-anchor="middle">델타 · 델타의 델타 · XOR 로 압축</text>
  <text x="568" y="311" fill="rgb(168,163,158)" font-size="9.5">시계열 옆이 아니라 따로 눕습니다</text>

  <!-- 대응 화살표 -->
  <line x1="272" y1="104" x2="330" y2="128" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#cs)"/>
  <text x="300" y="100" fill="rgb(212,168,83)" font-size="9.5" text-anchor="end">라벨로 녹아듦</text>

  <line x1="272" y1="194" x2="330" y2="150" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#cs)"/>
  <text x="300" y="240" fill="rgb(212,168,83)" font-size="9.5" text-anchor="end">항목 하나로</text>

  <line x1="272" y1="284" x2="330" y2="290" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#cs)"/>
  <text x="300" y="278" fill="rgb(212,168,83)" font-size="9.5" text-anchor="end">chunk 안으로</text>

  <!-- 참조 화살표 -->
  <line x1="440" y1="212" x2="440" y2="252" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#cs)"/>
  <text x="452" y="238" fill="rgb(212,168,83)" font-size="10">8바이트로 찾아갑니다</text>

  <!-- 참조 분해 -->
  <line x1="24" y1="366" x2="796" y2="366" stroke="rgb(92,84,74)"/>
  <text x="24" y="390" fill="#e8e4df" font-size="12">chunk 참조 8바이트를 반으로 쪼개 씁니다</text>

  <rect x="24" y="400" width="240" height="40" fill="rgba(102,187,106,0.13)" stroke="rgb(102,187,106)"/>
  <text x="144" y="418" fill="#e8e4df" font-size="10" text-anchor="middle">상위 4바이트</text>
  <text x="144" y="433" fill="rgb(168,163,158)" font-size="9.5" text-anchor="middle">어느 세그먼트 파일인가</text>

  <rect x="280" y="400" width="240" height="40" fill="rgba(102,187,106,0.13)" stroke="rgb(102,187,106)"/>
  <text x="400" y="418" fill="#e8e4df" font-size="10" text-anchor="middle">하위 4바이트</text>
  <text x="400" y="433" fill="rgb(168,163,158)" font-size="9.5" text-anchor="middle">그 파일 안 어느 오프셋인가</text>

  <text x="540" y="418" fill="#e8e4df" font-size="10">개념의 메트릭은 저장소에 독립된 실체가 없습니다 —</text>
  <text x="540" y="434" fill="#e8e4df" font-size="10">라벨 하나로 녹아듭니다.</text>
</svg>

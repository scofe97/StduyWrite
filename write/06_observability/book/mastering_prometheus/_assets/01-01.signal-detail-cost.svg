<svg viewBox="0 0 720 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>관측 신호의 상세도와 비용</title>
  <desc>메트릭·로그·트레이스를 상세도(가로)와 비용(세로) 축에 배치한 도식. 세 신호가 대각선을 이루고, 상세하면서 값싼 사분면은 비어 있다. 화살표는 메트릭에서 로그를 거쳐 트레이스로 좁혀 들어가는 드릴다운 순서를 나타낸다.</desc>

  <defs>
    <marker id="amberArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="440" fill="#0d0d0d"/>

  <text x="90" y="36" fill="#e8e4df" font-size="15">관측 신호의 상세도와 비용</text>

  <!-- 축 -->
  <line x1="90" y1="360" x2="665" y2="360" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <line x1="90" y1="360" x2="90" y2="60" stroke="rgb(42,37,32)" stroke-width="1.5"/>
  <text x="655" y="384" fill="rgb(138,133,128)" font-size="12" text-anchor="end">상세도 →</text>
  <text x="70" y="220" fill="rgb(138,133,128)" font-size="12" text-anchor="middle" transform="rotate(-90 70 220)">비용 →</text>

  <!-- 메트릭 (강조: Prometheus 가 담당) -->
  <rect x="110" y="286" width="170" height="64" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="195" y="314" fill="#e8e4df" font-size="14" text-anchor="middle">메트릭 Metrics</text>
  <text x="195" y="332" fill="rgb(138,133,128)" font-size="10.5" text-anchor="middle">포인트당 <tspan font-family="'JetBrains Mono', monospace">2B</tspan> 미만</text>

  <!-- 로그 -->
  <rect x="280" y="186" width="170" height="64" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="365" y="214" fill="#e8e4df" font-size="14" text-anchor="middle">로그 Logs</text>
  <text x="365" y="232" fill="rgb(138,133,128)" font-size="10.5" text-anchor="middle"><tspan font-family="'JetBrains Mono', monospace">request ID</tspan> 로 연결</text>

  <!-- 트레이스 -->
  <rect x="450" y="86" width="170" height="64" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="535" y="114" fill="#e8e4df" font-size="14" text-anchor="middle">트레이스 Traces</text>
  <text x="535" y="132" fill="rgb(138,133,128)" font-size="10.5" text-anchor="middle">샘플링 <tspan font-family="'JetBrains Mono', monospace">1/100</tspan></text>

  <!-- 드릴다운 화살표 -->
  <line x1="268" y1="288" x2="294" y2="254" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#amberArrow)"/>
  <line x1="438" y1="188" x2="464" y2="154" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#amberArrow)"/>
  <text x="306" y="276" fill="rgb(212,168,83)" font-size="11">드릴다운</text>

  <!-- 빈 사분면: 상세하면서 싼 신호는 없다 -->
  <rect x="430" y="268" width="195" height="76" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-dasharray="4 3"/>
  <text x="446" y="294" fill="rgb(212,168,83)" font-size="12">트레이드오프</text>
  <text x="446" y="312" fill="#e8e4df" font-size="11">싼데 상세한 신호는 없습니다.</text>
  <text x="446" y="330" fill="#e8e4df" font-size="11">상세도는 비용으로 삽니다.</text>

  <text x="90" y="406" fill="rgb(138,133,128)" font-size="10.5">앰버 박스 = Prometheus 가 다루는 신호</text>
</svg>

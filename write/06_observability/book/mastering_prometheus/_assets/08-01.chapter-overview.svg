<svg viewBox="0 0 900 566" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif">
  <title>Node Exporter 전체 지도 — 스크레이프 한 번이 값을 만들기까지</title>
  <desc>이 절 전체를 스크레이프 한 번의 여정으로 이은 지도다. Prometheus 가 Node Exporter 의 metrics 엔드포인트를 두드리는 것이 출발점이고, 그 요청이 네 단계를 지난다. 1단계는 exporter 의 세 부품으로, 메트릭 정의와 collector 와 레지스트리가 맞물린다. 등록 시점에는 Describe 가 메트릭의 형상만 레지스트리에 알리고 값은 아직 없으며, 스크레이프가 방아쇠가 되어 그때 비로소 Collect 가 돌아 최신 값을 채운다. 2단계는 collector 를 병렬로 도는 일로, Node Exporter 는 기본 활성 45개의 collector 를 저마다 별도 고루틴에 띄우므로 개수가 응답 속도를 좌우하지 않고 가장 느린 하나가 전체 시간을 결정한다. 3단계는 데이터 출처로, 대부분의 collector 는 procfs 라이브러리를 거쳐 proc 유사 파일시스템을 읽는다. CPU 는 백분율이 아니라 모드별 누적 초로 나오므로 코어 수로 나눠야 정규화되고, 부하 평균 대신 커널 4.20 이상의 PSI 기반 pressure 를 보는 편이 낫다. textfile collector 만은 예외로 디스크의 prom 파일을 읽어 단명 프로세스를 거둔다. 4단계는 응답으로, 모인 값이 텍스트 노출 형식으로 합쳐져 한 번에 반환된다. 아래쪽에는 트러블슈팅을 따로 뒀다. 스크레이프가 느리면 collector 별 소요 시간을 재는 duration 메트릭으로 범인 하나를 짚고, success 가 0 인 것은 하드웨어가 없을 때도 뜨므로 알림 대상으로 삼지 않는다.</desc>
  <rect width="900" height="566" fill="#0d0d0d"/>

  <defs>
    <marker id="na1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">스크레이프 한 번이 값을 만들기까지</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#b8b3ad">스크레이프가 방아쇠입니다</text>

  <!-- 입구 -->
  <rect x="30" y="72" width="180" height="52" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="120" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8ab6e0">Prometheus</text>
  <text x="120" y="112" text-anchor="middle" font-size="10" fill="#b8b3ad">GET /metrics</text>
  <line x1="218" y1="98" x2="256" y2="98" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#na1)"/>

  <!-- 1 세 부품 -->
  <rect x="264" y="72" width="606" height="52" rx="8" fill="rgb(212,168,83)"/>
  <text x="288" y="94" font-size="12" font-weight="700" fill="#0d0d0d">1. 세 부품 §2</text>
  <text x="288" y="112" font-size="10" font-weight="700" fill="#1a1a1a">정의 · collector · 장부</text>
  <rect x="614" y="82" width="120" height="32" rx="4" fill="#fdf3df"/>
  <text x="674" y="95" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">Describe · 등록 때</text>
  <text x="674" y="108" text-anchor="middle" font-size="9" font-weight="700" fill="#3a2f10">형상만 · 값 없음</text>
  <rect x="744" y="82" width="110" height="32" rx="4" fill="#fdf3df"/>
  <text x="799" y="95" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">Collect · 스크레이프</text>
  <text x="799" y="108" text-anchor="middle" font-size="9" font-weight="700" fill="#3a2f10">이때 값을 채웁니다</text>

  <line x1="450" y1="130" x2="450" y2="150" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#na1)"/>

  <!-- 2 병렬 -->
  <rect x="30" y="158" width="840" height="62" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="54" y="180" font-size="12" font-weight="700" fill="rgb(212,168,83)">2. 병렬 실행 §2·§3</text>
  <text x="240" y="180" font-size="10" fill="#b8b3ad">기본 45개 · 각자 고루틴</text>
  <rect x="54" y="190" width="256" height="22" rx="4" fill="#dceaf7"/>
  <text x="182" y="206" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10243a">개수는 속도를 좌우하지 않습니다</text>
  <rect x="322" y="190" width="256" height="22" rx="4" fill="#f2d4d4"/>
  <text x="450" y="206" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7a1f1f">가장 느린 하나가 결정합니다</text>
  <rect x="590" y="190" width="256" height="22" rx="4" fill="#dceaf7"/>
  <text x="718" y="206" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10243a">다른 exporter 는 보장 없음</text>

  <line x1="450" y1="226" x2="450" y2="246" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#na1)"/>

  <!-- 3 출처 -->
  <rect x="30" y="254" width="840" height="118" rx="8" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.5"/>
  <text x="54" y="276" font-size="12" font-weight="700" fill="rgb(212,168,83)">3. 어디서 긷는가 §3·§4</text>
  <text x="212" y="276" font-size="10" fill="#b8b3ad">procfs 경유 · 예외 있음</text>

  <rect x="54" y="288" width="792" height="24" rx="4" fill="#f5edda"/>
  <text x="450" y="304" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">/proc — 유사 파일시스템</text>

  <rect x="54" y="320" width="256" height="42" rx="4" fill="#fdf3df"/>
  <text x="182" y="335" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3a2f10">cpu — 백분율 아닌 초</text>
  <text x="182" y="352" text-anchor="middle" font-size="9" font-weight="700" fill="#3a2f10">코어 수로 나눠야 정규화됩니다</text>

  <rect x="322" y="320" width="256" height="42" rx="4" fill="#e6f7e7"/>
  <text x="450" y="335" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14521d">pressure — PSI 4.20+</text>
  <text x="450" y="352" text-anchor="middle" font-size="9" font-weight="700" fill="#14521d">loadavg 대신 이쪽을 봅니다</text>

  <rect x="590" y="320" width="256" height="42" rx="4" fill="#dceaf7"/>
  <text x="718" y="335" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10243a">textfile — .prom 파일</text>
  <text x="718" y="352" text-anchor="middle" font-size="9" font-weight="700" fill="#10243a">단명 프로세스를 거둡니다</text>

  <line x1="450" y1="378" x2="450" y2="398" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#na1)"/>

  <!-- 4 응답 -->
  <rect x="30" y="406" width="840" height="56" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="54" y="428" font-size="12" font-weight="700" fill="#8fd694">4. 한 번에 응답 §2</text>
  <text x="192" y="428" font-size="10" fill="#b8b3ad">텍스트 노출 형식으로</text>
  <rect x="54" y="436" width="380" height="20" rx="4" fill="#e6f7e7"/>
  <text x="244" y="451" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14521d">node_ 접두사 메트릭</text>
  <rect x="446" y="436" width="400" height="20" rx="4" fill="#e6f7e7"/>
  <text x="646" y="451" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14521d">.prom 내용도 함께</text>

  <!-- 트러블슈팅 별도 -->
  <rect x="30" y="478" width="840" height="66" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.6"/>
  <text x="54" y="500" font-size="12" font-weight="700" fill="#8ab6e0">트러블슈팅 §5</text>
  <text x="164" y="500" font-size="10" fill="#b8b3ad">duration 을 먼저 봅니다</text>
  <rect x="54" y="510" width="392" height="24" rx="4" fill="#dceaf7"/>
  <text x="250" y="526" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10243a">duration — 범인 하나</text>
  <rect x="458" y="510" width="388" height="24" rx="4" fill="#f2d4d4"/>
  <text x="652" y="526" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7a1f1f">success — 부재도 0</text>
</svg>

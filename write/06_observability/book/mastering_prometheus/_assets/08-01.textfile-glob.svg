<svg viewBox="0 0 880 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>textfile collector 의 glob 은 파일이 아니라 디렉토리를 고릅니다</title>
  <desc>collector.textfile.directory 에 준 glob 은 filepath.Glob 으로 디렉토리 목록을 만들고, 그 각각을 os.ReadDir 로 훑어 이름이 .prom 으로 끝나는 파일만 읽는다. 그래서 glob 은 .prom 파일보다 한 단계 위 디렉토리에 맞춰야 하며, 하위 디렉토리로 더 내려가지 않는다.</desc>

  <defs>
    <marker id="a8" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="430" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">textfile collector — glob 은 디렉토리에 맞춥니다</text>
  <text x="20" y="54" fill="rgb(138,133,128)" font-size="10.5">흔한 오해: glob 이 <tspan font-family="'JetBrains Mono', monospace" fill="#e8e4df">.prom</tspan> 파일을 직접 고른다고 읽으면 한 칸씩 어긋납니다.</text>

  <!-- Stage 1 -->
  <rect x="20" y="82" width="250" height="112" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="145" y="106" fill="#e8e4df" font-size="11.5" text-anchor="middle">① filepath.Glob(패턴)</text>
  <text x="145" y="130" fill="rgb(212,168,83)" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">/var/lib/prometheus/*/*</text>
  <text x="145" y="154" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">패턴에 맞는 <tspan fill="#e8e4df">디렉토리</tspan> 목록을</text>
  <text x="145" y="172" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">만듭니다</text>

  <line x1="274" y1="138" x2="308" y2="138" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#a8)"/>

  <!-- Stage 2 -->
  <rect x="316" y="82" width="250" height="112" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="441" y="106" fill="#e8e4df" font-size="11.5" text-anchor="middle">② os.ReadDir(디렉토리)</text>
  <text x="441" y="132" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">각 디렉토리를 한 겹만 훑고</text>
  <text x="441" y="156" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">이름이 <tspan font-family="'JetBrains Mono', monospace" fill="rgb(212,168,83)">.prom</tspan> 으로 끝나는</text>
  <text x="441" y="174" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">파일만 남깁니다</text>

  <line x1="570" y1="138" x2="604" y2="138" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#a8)"/>

  <!-- Stage 3 -->
  <rect x="612" y="82" width="248" height="112" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="736" y="106" fill="#e8e4df" font-size="11.5" text-anchor="middle">③ 파싱 후 노출</text>
  <text x="736" y="132" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">Node Exporter 의 <tspan font-family="'JetBrains Mono', monospace">/metrics</tspan> 에</text>
  <text x="736" y="150" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">평소 메트릭과 나란히 실립니다</text>
  <text x="736" y="176" fill="rgb(212,168,83)" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">node_textfile_mtime_seconds</text>

  <!-- Tree -->
  <line x1="20" y1="222" x2="860" y2="222" stroke="rgb(42,37,32)"/>
  <text x="20" y="248" fill="#e8e4df" font-size="11.5">패턴 <tspan font-family="'JetBrains Mono', monospace" fill="rgb(212,168,83)">/var/lib/prometheus/*/*</tspan> 이 실제로 고르는 것</text>

  <text x="34" y="276" fill="rgb(138,133,128)" font-size="10" font-family="'JetBrains Mono', monospace">/var/lib/prometheus/</text>
  <text x="58" y="296" fill="rgb(138,133,128)" font-size="10" font-family="'JetBrains Mono', monospace">cron_jobs/</text>
  <text x="82" y="316" fill="rgb(212,168,83)" font-size="10" font-family="'JetBrains Mono', monospace">job1/</text>
  <text x="150" y="316" fill="rgb(212,168,83)" font-size="9.5">← glob 이 고르는 디렉토리 (두 칸 내려온 자리)</text>
  <text x="106" y="336" fill="#e8e4df" font-size="10" font-family="'JetBrains Mono', monospace">metrics.prom</text>
  <text x="228" y="336" fill="rgb(138,133,128)" font-size="9.5">← ReadDir 이 읽는 파일</text>
  <text x="82" y="356" fill="rgb(212,168,83)" font-size="10" font-family="'JetBrains Mono', monospace">job2/</text>
  <text x="150" y="356" fill="rgb(212,168,83)" font-size="9.5">← 같은 깊이라 함께 걸립니다</text>
  <text x="58" y="376" fill="rgb(138,133,128)" font-size="10" font-family="'JetBrains Mono', monospace">my_app/</text>
  <text x="150" y="376" fill="rgb(138,133,128)" font-size="9.5">← 한 칸만 내려와 패턴에 안 맞습니다</text>

  <text x="20" y="410" fill="rgb(138,133,128)" font-size="10.5"><tspan font-family="'JetBrains Mono', monospace" fill="#e8e4df">.prom</tspan> 확장자는 코드에 박혀 있어 바꿀 수 없고, 하위 디렉토리로 재귀하지 않습니다.</text>
</svg>

<svg viewBox="0 0 900 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>행 지향과 시계열 지향 — 왜 압축이 갈리는가</title>
  <desc>행 지향 저장은 한 행에 트랜잭션 메타데이터 23 바이트 헤더와 여러 컬럼을 함께 담는다. 그래서 같은 시계열의 연속 샘플 사이에 남의 데이터가 끼어들고, 실제 값 16 바이트보다 메타데이터가 더 크다. 앞 값과의 차이를 계산하려 해도 바로 앞이 남의 컬럼이라 델타가 의미를 갖지 못한다. 시계열 지향 저장은 같은 시계열의 시각과 값만 나란히 눕히므로 이웃이 항상 같은 시계열의 직전 샘플이다. 그래서 델타-오브-델타와 XOR 압축이 성립하고 헤더도 chunk 하나에 한 번만 붙는다. TimescaleDB 가 압축할 때 행 저장을 열 저장으로 바꾸고 같은 알고리즘을 쓰는 것이 이 결론을 확인해 준다.</desc>

  <rect x="0" y="0" width="900" height="470" fill="#0d0d0d"/>
  <text x="24" y="30" fill="#e8e4df" font-size="15">같은 샘플을 어떻게 눕히느냐가 압축을 정합니다</text>

  <!-- 행 지향 -->
  <text x="24" y="64" fill="#f44336" font-size="12" font-weight="700">행 지향 (RDB) — 한 행에 메타데이터 + 여러 컬럼</text>
  <rect x="24" y="76" width="852" height="150" fill="#0d0d0d" stroke="#f44336"/>

  <text x="44" y="98" fill="rgb(138,133,128)" font-size="9">행 1</text>
  <rect x="80" y="86" width="150" height="26" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="155" y="103" style="fill:#7a1f1f" font-size="8.5" text-anchor="middle" font-weight="700">헤더 23B</text>
  <rect x="234" y="86" width="90" height="26" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="279" y="103" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">시각 8B</text>
  <rect x="328" y="86" width="90" height="26" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="373" y="103" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">값 8B</text>
  <rect x="422" y="86" width="120" height="26" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="482" y="103" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">다른 컬럼…</text>

  <text x="44" y="130" fill="rgb(138,133,128)" font-size="9">행 2</text>
  <rect x="80" y="118" width="150" height="26" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="155" y="135" style="fill:#7a1f1f" font-size="8.5" text-anchor="middle" font-weight="700">헤더 23B</text>
  <rect x="234" y="118" width="90" height="26" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="279" y="135" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">시각 8B</text>
  <rect x="328" y="118" width="90" height="26" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="373" y="135" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle">값 8B</text>
  <rect x="422" y="118" width="120" height="26" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="482" y="135" fill="rgb(138,133,128)" font-size="8.5" text-anchor="middle">다른 컬럼…</text>

  <text x="566" y="103" fill="#f44336" font-size="9.5" font-weight="700">데이터 16B 보다</text>
  <text x="566" y="120" fill="#f44336" font-size="9.5" font-weight="700">메타데이터 23B 가 큽니다</text>
  <text x="566" y="140" fill="rgb(138,133,128)" font-size="8.5">t_xmin · t_xmax · t_ctid …</text>

  <line x1="44" y1="160" x2="856" y2="160" stroke="rgb(92,84,74)" stroke-dasharray="4 3"/>

  <text x="44" y="180" fill="#e8e4df" font-size="9.5">값 8B 의 <tspan fill="#f44336" font-weight="700">바로 앞</tspan> 은 무엇입니까 →</text>
  <rect x="240" y="168" width="180" height="20" fill="#f2d4d4" stroke="#f2d4d4"/>
  <text x="330" y="182" style="fill:#7a1f1f" font-size="8.5" text-anchor="middle" font-weight="700">시각 · 헤더 · 남의 컬럼</text>
  <text x="436" y="182" fill="rgb(138,133,128)" font-size="9">= 같은 시계열의 직전 값이 아닙니다</text>

  <rect x="44" y="196" width="812" height="20" fill="#f44336" stroke="#f44336"/>
  <text x="450" y="210" style="fill:#0d0d0d" font-size="9" text-anchor="middle" font-weight="700">그래서 &quot;앞 값과의 차이&quot; 를 계산해도 의미가 없습니다 — 델타·XOR 압축이 원리적으로 불가</text>

  <!-- 시계열 지향 -->
  <text x="24" y="264" fill="#66bb6a" font-size="12" font-weight="700">시계열 지향 (TSDB) — 같은 시계열의 시각·값만 나란히</text>
  <rect x="24" y="276" width="852" height="126" fill="#0d0d0d" stroke="#66bb6a"/>

  <text x="44" y="298" fill="rgb(138,133,128)" font-size="9">chunk 하나 = 시계열 하나</text>
  <rect x="240" y="286" width="110" height="20" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="295" y="300" style="fill:#0d0d0d" font-size="8" text-anchor="middle" font-weight="700">헤더는 한 번만</text>

  <rect x="44" y="316" width="96" height="30" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="92" y="330" style="fill:#0d0d0d" font-size="8" text-anchor="middle">t1 · v1</text>
  <text x="92" y="342" style="fill:#0d0d0d" font-size="7.5" text-anchor="middle">그대로</text>
  <rect x="146" y="316" width="96" height="30" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="194" y="330" style="fill:#0d0d0d" font-size="8" text-anchor="middle">t2 · v2</text>
  <text x="194" y="342" style="fill:#0d0d0d" font-size="7.5" text-anchor="middle">차이만</text>
  <rect x="248" y="316" width="96" height="30" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="296" y="330" style="fill:#0d0d0d" font-size="8" text-anchor="middle">t3 · v3</text>
  <text x="296" y="342" style="fill:#0d0d0d" font-size="7.5" text-anchor="middle">차이만</text>
  <rect x="350" y="316" width="96" height="30" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="398" y="330" style="fill:#0d0d0d" font-size="8" text-anchor="middle">t4 · v4</text>
  <text x="398" y="342" style="fill:#0d0d0d" font-size="7.5" text-anchor="middle">차이만</text>
  <text x="456" y="335" fill="rgb(138,133,128)" font-size="9">… 120 개까지</text>

  <text x="44" y="368" fill="#e8e4df" font-size="9.5">값의 <tspan fill="#66bb6a" font-weight="700">바로 앞</tspan> 은 무엇입니까 →</text>
  <rect x="240" y="356" width="180" height="20" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="330" y="370" style="fill:#0d0d0d" font-size="8.5" text-anchor="middle" font-weight="700">같은 시계열의 직전 샘플</text>
  <text x="436" y="370" fill="rgb(138,133,128)" font-size="9">= 값이 서로 닮았습니다</text>

  <rect x="44" y="382" width="812" height="20" fill="#66bb6a" stroke="#66bb6a"/>
  <text x="450" y="396" style="fill:#0d0d0d" font-size="9" text-anchor="middle" font-weight="700">그래서 델타-오브-델타 · XOR 이 성립합니다 — 규칙적인 값일수록 거의 0 에 수렴</text>

  <!-- 반례 -->
  <line x1="24" y1="424" x2="876" y2="424" stroke="rgb(92,84,74)"/>
  <text x="24" y="446" fill="#e8e4df" font-size="11">반례가 결론을 확인해 줍니다 — <tspan fill="rgb(212,168,83)" font-weight="700">TimescaleDB</tspan> 는 압축할 때 행 저장을 <tspan fill="#66bb6a" font-weight="700">열 저장으로 바꾸고</tspan> 같은 알고리즘을 씁니다.</text>
  <text x="24" y="464" fill="rgb(138,133,128)" font-size="10">PostgreSQL 위에서도 &quot;같은 시계열을 붙여 놓기&quot; 를 먼저 해야 압축이 듣습니다. 구조가 답을 정합니다.</text>
</svg>

<svg viewBox="0 0 880 500" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>textfile collector 와 Pushgateway 는 값을 어디에 놓는지에서 갈립니다</title>
  <desc>같은 배치 작업의 결과를 textfile collector 로 남길 때와 Pushgateway 로 밀어 넣을 때를 세 축으로 대비한다. 첫째 축은 값을 놓는 자리로, textfile 은 노드의 디스크 파일에 놓고 Pushgateway 는 자기 프로세스 메모리에 놓는다. 그래서 컨테이너를 재시작하면 디스크에 있던 값은 새로 뜬 프로세스가 다시 읽어 그대로 살아나지만, 메모리에 있던 값은 프로세스와 함께 사라지고 배치는 이미 끝났으므로 다시 보내 줄 주체가 없다. 둘째 축은 라벨을 누가 붙이는가다. textfile 은 Prometheus 가 긁은 자리를 보고 job 라벨을 node-exporter 로 붙이므로 배치가 자기 이름을 잃고, Pushgateway 는 배치가 URL 경로에 job 이름을 박아 보내므로 정체가 보존된다. 셋째 축은 TSDB 에 남는 흔적이다. Prometheus 는 긁을 때마다 그 순간의 값을 도장 찍으므로 이미 찍힌 과거 점은 지워지지 않고 남지만, 밀어 넣은 값이 사라진 뒤로는 찍을 것이 없어 미래가 끊긴다.</desc>

  <defs>
    <marker id="tvpAmber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
    <marker id="tvpGray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(138,133,128)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="500" fill="#0d0d0d"/>

  <text x="20" y="30" fill="#e8e4df" font-size="15">배치는 둘 다 "값을 놓고 죽습니다" — 갈리는 것은 놓은 자리입니다</text>
  <text x="20" y="52" fill="rgb(138,133,128)" font-size="10.5">같은 조작(컨테이너 재시작)에 정반대로 반응한 실측이 세 축을 갈랐습니다.</text>

  <line x1="20" y1="66" x2="860" y2="66" stroke="rgb(42,37,32)" stroke-width="1"/>

  <!-- ── 축 라벨 열 ── -->
  <text x="28" y="112" fill="rgb(138,133,128)" font-size="10">축 ①</text>
  <text x="28" y="128" fill="#e8e4df" font-size="10.5">놓는 자리</text>

  <text x="28" y="242" fill="rgb(138,133,128)" font-size="10">축 ②</text>
  <text x="28" y="258" fill="#e8e4df" font-size="10.5">라벨 주체</text>

  <text x="28" y="352" fill="rgb(138,133,128)" font-size="10">축 ③</text>
  <text x="28" y="368" fill="#e8e4df" font-size="10.5">TSDB 흔적</text>

  <!-- ══ 왼쪽: textfile ══ -->
  <rect x="112" y="80" width="358" height="112" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="128" y="102" fill="#e8e4df" font-size="12">textfile collector</text>

  <text x="128" y="126" fill="rgb(138,133,128)" font-size="9.5">배치</text>
  <line x1="156" y1="122" x2="188" y2="122" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#tvpAmber)"/>
  <rect x="194" y="110" width="118" height="26" fill="rgb(212,168,83)"/>
  <text x="253" y="127" fill="#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">노드의 디스크 파일</text>
  <line x1="318" y1="122" x2="350" y2="122" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#tvpAmber)"/>
  <text x="356" y="126" fill="rgb(138,133,128)" font-size="9.5">Node Exporter 가 읽음</text>

  <text x="128" y="156" fill="#e8e4df" font-size="10">재시작하면 —</text>
  <rect x="216" y="145" width="88" height="20" fill="#dceaf7"/>
  <text x="260" y="159" fill="#10243a" font-size="9.5" text-anchor="middle" font-weight="700">그대로 살아남음</text>
  <text x="128" y="180" fill="rgb(138,133,128)" font-size="9.5">값이 프로세스 안이 아니라 디스크에 있어, 새로 떠서 다시 읽습니다</text>

  <!-- ══ 오른쪽: pushgateway ══ -->
  <rect x="490" y="80" width="370" height="112" fill="rgb(26,26,26)" stroke="rgb(92,84,74)"/>
  <text x="506" y="102" fill="#e8e4df" font-size="12">Pushgateway</text>

  <text x="506" y="126" fill="rgb(138,133,128)" font-size="9.5">배치</text>
  <line x1="534" y1="122" x2="566" y2="122" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#tvpGray)"/>
  <rect x="572" y="110" width="132" height="26" fill="#f2d4d4"/>
  <text x="638" y="127" fill="#7a1f1f" font-size="10" text-anchor="middle" font-weight="700">자기 프로세스 메모리</text>
  <line x1="710" y1="122" x2="742" y2="122" stroke="rgb(138,133,128)" stroke-width="1.5" marker-end="url(#tvpGray)"/>
  <text x="748" y="126" fill="rgb(138,133,128)" font-size="9.5">Prometheus 가 긁음</text>

  <text x="506" y="156" fill="#e8e4df" font-size="10">재시작하면 —</text>
  <rect x="594" y="145" width="76" height="20" fill="#f2d4d4"/>
  <text x="632" y="159" fill="#7a1f1f" font-size="9.5" text-anchor="middle" font-weight="700">영영 사라짐</text>
  <text x="506" y="180" fill="rgb(138,133,128)" font-size="9.5">배치는 이미 끝나서 다시 보내 줄 주체가 없습니다</text>

  <!-- ── 축 ② ── -->
  <rect x="112" y="212" width="358" height="98" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="128" y="234" fill="rgb(138,133,128)" font-size="9.5">Prometheus 가 긁은 자리를 보고 붙입니다</text>
  <rect x="128" y="244" width="326" height="24" fill="#f5edda"/>
  <text x="140" y="260" fill="#0d0d0d" font-size="9.5" font-family="'JetBrains Mono', monospace">job="node-exporter"  instance="node-exporter:9100"</text>
  <text x="128" y="288" fill="#e8e4df" font-size="10">배치가 자기 이름을 잃습니다</text>
  <text x="128" y="303" fill="rgb(138,133,128)" font-size="9.5">어느 노드인지는 남지만, 무슨 작업인지는 사라집니다</text>

  <rect x="490" y="212" width="370" height="98" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="506" y="234" fill="rgb(138,133,128)" font-size="9.5">배치가 URL 경로에 박아 보냅니다</text>
  <rect x="506" y="244" width="338" height="24" fill="#f5edda"/>
  <text x="518" y="260" fill="#0d0d0d" font-size="9.5" font-family="'JetBrains Mono', monospace">/metrics/job/history-archive → job="history-archive"</text>
  <text x="506" y="288" fill="#e8e4df" font-size="10">배치가 자기를 소개합니다</text>
  <text x="506" y="303" fill="rgb(138,133,128)" font-size="9.5">노드와 무관해서 어디서 돌든 같은 곳으로 보냅니다</text>

  <!-- ── 축 ③ ── -->
  <rect x="112" y="330" width="358" height="86" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="128" y="352" fill="rgb(138,133,128)" font-size="9.5">파일이 남아 계속 새 값을 냅니다</text>
  <line x1="128" y1="374" x2="452" y2="374" stroke="rgb(212,168,83)" stroke-width="2"/>
  <circle cx="152" cy="374" r="3" fill="rgb(212,168,83)"/>
  <circle cx="212" cy="374" r="3" fill="rgb(212,168,83)"/>
  <circle cx="272" cy="374" r="3" fill="rgb(212,168,83)"/>
  <circle cx="332" cy="374" r="3" fill="rgb(212,168,83)"/>
  <circle cx="392" cy="374" r="3" fill="rgb(212,168,83)"/>
  <circle cx="446" cy="374" r="3" fill="rgb(212,168,83)"/>
  <text x="128" y="404" fill="#e8e4df" font-size="10">선이 안 끊깁니다 — 재시작 뒤에도 점이 계속 찍힙니다</text>

  <rect x="490" y="330" width="370" height="86" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="506" y="352" fill="rgb(138,133,128)" font-size="9.5">과거는 남고 미래가 끊깁니다</text>
  <line x1="506" y1="374" x2="650" y2="374" stroke="rgb(212,168,83)" stroke-width="2"/>
  <circle cx="524" cy="374" r="3" fill="rgb(212,168,83)"/>
  <circle cx="566" cy="374" r="3" fill="rgb(212,168,83)"/>
  <circle cx="608" cy="374" r="3" fill="rgb(212,168,83)"/>
  <circle cx="646" cy="374" r="3" fill="rgb(212,168,83)"/>
  <line x1="654" y1="360" x2="654" y2="390" stroke="#f2d4d4" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="660" y="366" fill="#f2d4d4" font-size="9">재시작</text>
  <line x1="668" y1="374" x2="844" y2="374" stroke="rgb(92,84,74)" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="506" y="404" fill="#e8e4df" font-size="10">이미 찍힌 도장은 안 지워지지만, 새로 찍을 값이 없습니다</text>

  <!-- ── 하단 못박기 ── -->
  <rect x="20" y="434" width="840" height="48" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-dasharray="4 3"/>
  <text x="36" y="454" fill="rgb(212,168,83)" font-size="10.5">핵심</text>
  <text x="80" y="454" fill="#e8e4df" font-size="10.5">배치 입장에서는 둘 다 push 입니다. 갈리는 것은 값의 수명·정체·노드 결속 셋입니다.</text>
  <text x="36" y="472" fill="rgb(138,133,128)" font-size="10">배치가 하루 한 번 도는데 Pushgateway 가 죽으면 다음 배치까지 24시간 동안 값이 없고, 어제 데이터는 이미 처리돼 다시 돌릴 수도 없습니다.</text>
</svg>

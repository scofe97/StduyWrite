<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="/tsdb-status 네 표의 카디널리티 진단 신뢰도 — 라벨 이름별 값 개수가 가장 중요, 메모리 많이 쓰는 라벨과 라벨-값 쌍 표는 카디널리티 진단에 쓰지 말 것">
  <rect width="720" height="360" fill="#0d0d0d"/>
  <text x="360" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">/tsdb-status 네 표 — 카디널리티 진단에 뭘 믿나</text>

  <!-- table 1 : 가장 중요 (green) -->
  <rect x="40" y="60" width="640" height="58" rx="8" fill="#66bb6a"/>
  <text x="60" y="84" font-size="14" font-weight="700" fill="#0d0d0d">① 라벨 이름별 값 개수</text>
  <text x="60" y="105" font-size="12" fill="#14330a">어느 라벨이 가장 많은 값을 갖는가 — 카디널리티 범인을 짚는 표</text>
  <rect x="560" y="72" width="100" height="34" rx="6" fill="#0d0d0d"/>
  <text x="610" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#8fdc93">가장 중요</text>

  <!-- table 2 : 유용 (light blue) -->
  <rect x="40" y="128" width="640" height="58" rx="8" fill="#dceaf7"/>
  <text x="60" y="152" font-size="14" font-weight="700" fill="#10243a">② 메트릭 이름별 시계열 수</text>
  <text x="60" y="173" font-size="12" fill="#10243a">어느 메트릭 카디널리티가 큰가 — 느려질 메트릭을 짚어 줌</text>
  <rect x="560" y="140" width="100" height="34" rx="6" fill="#5b9bd5"/>
  <text x="610" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#e8e4df">보조로 유용</text>

  <!-- table 3 : 진단 금지 (dark, gray text) -->
  <rect x="40" y="196" width="640" height="58" rx="8" fill="#0d0d0d" stroke="#8a8580" stroke-width="1.3"/>
  <text x="60" y="220" font-size="14" font-weight="700" fill="#c9c4be">③ 메모리 많이 쓰는 라벨</text>
  <text x="60" y="241" font-size="12" fill="#8a8580">값의 개수뿐 아니라 길이에도 좌우 → 카디널리티 대리지표 부적합</text>
  <rect x="548" y="208" width="112" height="34" rx="6" fill="#3a1414"/>
  <text x="604" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#e88">진단에 쓰지 마</text>

  <!-- table 4 : 무용 (dark, gray text) -->
  <rect x="40" y="264" width="640" height="58" rx="8" fill="#0d0d0d" stroke="#8a8580" stroke-width="1.3"/>
  <text x="60" y="288" font-size="14" font-weight="700" fill="#c9c4be">④ 라벨-값 쌍별 시계열 수</text>
  <text x="60" y="309" font-size="12" fill="#8a8580">카디널리티와 무관 — 쓸모없는(전역화 가능) 라벨 찾기에나</text>
  <rect x="548" y="276" width="112" height="34" rx="6" fill="#3a1414"/>
  <text x="604" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#e88">넷 중 가장 무용</text>

  <text x="360" y="348" text-anchor="middle" font-size="11" fill="#8a8580">진단은 ①로 시작 → sort_desc(count by (__name__)) 로 범인 좁힘. ③④는 카디널리티 판단에서 제외.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif" role="img">
  <title>/tsdb-status 네 표의 카디널리티 진단 신뢰도</title>
  <desc>Prometheus 웹 UI 의 tsdb-status 페이지가 보여 주는 네 표를 신뢰도 순으로 늘어놓았다. 첫째 라벨 이름별 값 개수는 어느 라벨이 가장 많은 값을 갖는지 보여 주어 카디널리티 범인을 짚는 데 가장 중요하다. 둘째 메트릭 이름별 시계열 수는 어느 메트릭의 카디널리티가 큰지 알려 주어 느려질 메트릭을 짚어 준다. 셋째 메모리를 많이 쓰는 라벨 표는 값의 개수뿐 아니라 길이에도 좌우되므로 카디널리티의 대리 지표로는 부적합하다. 넷째 라벨-값 쌍별 시계열 수는 카디널리티와 무관하고 전역으로 올릴 수 있는 쓸모없는 라벨을 찾는 데에나 쓴다. 진단은 첫째 표에서 시작해 PromQL 로 범인 메트릭을 좁혀 간다.</desc>
  <rect width="720" height="360" fill="#0d0d0d"/>
  <text x="360" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">/tsdb-status 표 신뢰도</text>

  <!-- table 1 : 가장 중요 (green) -->
  <rect x="40" y="60" width="640" height="58" rx="8" fill="#66bb6a"/>
  <text x="60" y="84" font-size="14" font-weight="700" fill="#0d0d0d">1. 라벨 이름별 값 개수</text>
  <text x="60" y="105" font-size="12" fill="#14330a">어느 라벨이 값이 가장 많은가</text>
  <rect x="560" y="72" width="100" height="34" rx="6" fill="#e6f7e7"/>
  <text x="610" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#14521d">가장 중요</text>

  <!-- table 2 : 유용 (light blue) -->
  <rect x="40" y="128" width="640" height="58" rx="8" fill="#dceaf7"/>
  <text x="60" y="152" font-size="14" font-weight="700" fill="#10243a">2. 메트릭별 시계열 수</text>
  <text x="60" y="173" font-size="12" fill="#10243a">어느 메트릭이 큰가</text>
  <rect x="560" y="140" width="100" height="34" rx="6" fill="#5b9bd5"/>
  <text x="610" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#e8e4df">보조로 유용</text>

  <!-- table 3 : 진단 금지 (dark, gray text) -->
  <rect x="40" y="196" width="640" height="58" rx="8" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.3"/>
  <text x="60" y="220" font-size="14" font-weight="700" fill="#c9c4be">3. 메모리 많이 쓰는 라벨</text>
  <text x="60" y="241" font-size="12" fill="#b8b3ad">길이에도 좌우 · 대리지표 부적합</text>
  <rect x="548" y="208" width="112" height="34" rx="6" fill="#0d0d0d" stroke="#f44336"/>
  <text x="604" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#e88">진단에 쓰지 마</text>

  <!-- table 4 : 무용 (dark, gray text) -->
  <rect x="40" y="264" width="640" height="58" rx="8" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.3"/>
  <text x="60" y="288" font-size="14" font-weight="700" fill="#c9c4be">4. 라벨-값 쌍별 시계열 수</text>
  <text x="60" y="309" font-size="12" fill="#b8b3ad">카디널리티와 무관</text>
  <rect x="548" y="276" width="112" height="34" rx="6" fill="#0d0d0d" stroke="#f44336"/>
  <text x="604" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#e88">넷 중 가장 무용</text>

  <text x="360" y="348" text-anchor="middle" font-size="11" fill="#b8b3ad">진단은 1 번 표에서 시작</text>
</svg>

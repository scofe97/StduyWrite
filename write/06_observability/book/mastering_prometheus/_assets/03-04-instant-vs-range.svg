<svg xmlns="http://www.w3.org/2000/svg" width="740" height="410" viewBox="0 0 740 410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="순간 벡터는 시계열마다 값 하나를 돌려주고 범위 벡터는 대괄호로 기간을 지정해 값 여럿을 돌려준다. /query 는 둘 다 받지만 /query_range 는 순간 벡터만 받으므로 그래프를 그리려면 범위 벡터를 함수로 감싸야 한다">
  <rect width="740" height="410" fill="#0d0d0d"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">순간 벡터 vs 범위 벡터 — 대괄호가 경계</text>

  <defs>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8580"/></marker>
  </defs>

  <!-- instant vector -->
  <rect x="30" y="50" width="330" height="126" rx="10" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.4"/>
  <text x="48" y="74" font-size="14" font-weight="700" fill="#8ab6e0">순간 벡터 (instant)</text>
  <rect x="48" y="86" width="294" height="26" rx="4" fill="#dceaf7"/>
  <text x="195" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#10243a">http_requests_total</text>
  <text x="48" y="132" font-size="12" fill="#c9c4be">가장 최근 값 하나 — 시계열당 1개</text>
  <line x1="60" y1="152" x2="330" y2="152" stroke="#6b6660" stroke-width="1.2"/>
  <circle cx="310" cy="152" r="6" fill="#5b9bd5"/>
  <text x="60" y="170" font-size="10.5" fill="#8a8580">과거</text>
  <text x="316" y="170" text-anchor="end" font-size="10.5" fill="#8ab6e0">지금 ●</text>

  <!-- range vector -->
  <rect x="380" y="50" width="330" height="126" rx="10" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.4"/>
  <text x="398" y="74" font-size="14" font-weight="700" fill="#8fdc93">범위 벡터 (range)</text>
  <rect x="398" y="86" width="294" height="26" rx="4" fill="#e6f7e7"/>
  <text x="545" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14521d">http_requests_total[5m]</text>
  <text x="398" y="132" font-size="12" fill="#c9c4be">기간 안의 값 여럿 — 대괄호가 표시</text>
  <line x1="410" y1="152" x2="680" y2="152" stroke="#6b6660" stroke-width="1.2"/>
  <rect x="560" y="140" width="120" height="24" fill="#14330a" opacity="0.85"/>
  <circle cx="580" cy="152" r="5" fill="#66bb6a"/>
  <circle cx="610" cy="152" r="5" fill="#66bb6a"/>
  <circle cx="640" cy="152" r="5" fill="#66bb6a"/>
  <circle cx="668" cy="152" r="5" fill="#66bb6a"/>
  <text x="620" y="176" text-anchor="middle" font-size="10.5" fill="#8fdc93">[5m]</text>

  <!-- API endpoints -->
  <text x="370" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#e8e4df">두 API 엔드포인트가 받는 것</text>

  <rect x="30" y="222" width="330" height="80" rx="10" fill="#dceaf7"/>
  <text x="48" y="246" font-size="13" font-weight="700" fill="#10243a">/api/v1/query</text>
  <text x="48" y="268" font-size="11.5" fill="#10243a">순간 벡터 ✓   범위 벡터 ✓</text>
  <text x="48" y="288" font-size="11" fill="#10243a">현재 시각 기준 한 번 평가</text>

  <rect x="380" y="222" width="330" height="80" rx="10" fill="#f5edda"/>
  <text x="398" y="246" font-size="13" font-weight="700" fill="#3a2f10">/api/v1/query_range</text>
  <text x="398" y="268" font-size="11.5" font-weight="700" fill="#7a1f1f">순간 벡터만 ✓   범위 벡터 ✗</text>
  <text x="398" y="288" font-size="11" fill="#3a2f10">start·end·step 으로 반복 평가 — 그래프용</text>

  <!-- the trap -->
  <rect x="30" y="316" width="680" height="76" rx="10" fill="#0d0d0d" stroke="#f5c451" stroke-width="1.3"/>
  <text x="48" y="340" font-size="12.5" font-weight="700" fill="#f5c451">실무 최다 함정 — Grafana 그래프가 안 그려질 때</text>
  <rect x="48" y="350" width="300" height="26" rx="4" fill="#3a1414"/>
  <text x="198" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#f0a0a0">http_requests_total[5m]  ✗</text>
  <line x1="356" y1="363" x2="386" y2="363" stroke="#8a8580" stroke-width="1.5" marker-end="url(#pa)"/>
  <rect x="394" y="350" width="300" height="26" rx="4" fill="#e6f7e7"/>
  <text x="544" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#14521d">rate(http_requests_total[5m])  ✓</text>
</svg>

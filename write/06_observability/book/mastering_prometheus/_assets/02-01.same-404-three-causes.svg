<svg viewBox="0 0 880 438" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>같은 404 가 세 번 나왔는데 이유가 셋 다 달랐습니다</title>
  <desc>Spring Boot 앱의 prometheus 엔드포인트를 여는 과정에서 같은 404 응답이 세 번 나왔고 원인이 매번 달랐다. 첫 단계는 micrometer-registry-prometheus 가 클래스패스에 없어 자동설정이 건너뛰어져 빈 자체가 없는 상태다. 라이브러리를 넣으면 빈은 생기지만 management 노출 목록에 prometheus 가 없어 여전히 404 이고, 이때 빈은 있는데 창구가 닫힌 상태로 한 칸 이동한 것이다. include 에 prometheus 를 넣으면 200 이 되지만, 이번에는 긁는 쪽 설정에서 metrics_path 를 빼먹어 Prometheus 가 기본값 slash metrics 를 긁으므로 다시 404 가 된다. 세 단계 모두 화면에는 같은 숫자가 보이므로 숫자만 보고는 원인을 가릴 수 없고, 어느 층이 막혔는지를 따로 확인해야 한다. 아래쪽에는 대조군으로 actuator slash metrics 엔드포인트가 세 단계 내내 404 로 남는 것을 함께 표시한다. include 에 prometheus 만 적었으므로 metrics 창구는 끝까지 닫혀 있고, 이것이 빈의 존재와 노출이 별개 층이라는 것을 보여 준다.</desc>

  <defs>
    <marker id="s4Amber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="438" fill="#0d0d0d"/>

  <text x="20" y="30" fill="#e8e4df" font-size="15">같은 404, 세 번 — 이유는 셋 다 달랐습니다</text>
  <text x="20" y="52" fill="rgb(138,133,128)" font-size="10.5">화면에는 같은 숫자가 보입니다. 무엇이 막혔는지는 숫자가 알려 주지 않습니다.</text>

  <line x1="20" y1="66" x2="860" y2="66" stroke="rgb(42,37,32)" stroke-width="1"/>

  <!-- ── 단계 1 ── -->
  <rect x="20" y="84" width="256" height="150" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="36" y="106" fill="rgb(138,133,128)" font-size="10">1단계 — 라이브러리 없음</text>
  <rect x="36" y="116" width="60" height="24" fill="#f2d4d4"/>
  <text x="66" y="133" fill="#7a1f1f" font-size="11" text-anchor="middle" font-weight="700">404</text>
  <text x="106" y="133" fill="#e8e4df" font-size="10.5">빈이 없습니다</text>
  <text x="36" y="162" fill="rgb(138,133,128)" font-size="9.5">클래스패스에 레지스트리가 없어</text>
  <text x="36" y="178" fill="rgb(138,133,128)" font-size="9.5">자동설정 전체가 건너뛰어집니다</text>
  <rect x="36" y="188" width="222" height="22" fill="#f5edda"/>
  <text x="46" y="203" fill="#0d0d0d" font-size="8.5" font-family="'JetBrains Mono', monospace">@ConditionalOnClass 가 거짓</text>
  <text x="36" y="226" fill="rgb(138,133,128)" font-size="9.5">빈도 없고 노출도 없습니다</text>

  <line x1="280" y1="150" x2="308" y2="150" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#s4Amber)"/>
  <text x="294" y="140" fill="rgb(212,168,83)" font-size="8.5" text-anchor="middle">의존성</text>

  <!-- ── 단계 2 ── -->
  <rect x="312" y="84" width="256" height="150" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="328" y="106" fill="rgb(138,133,128)" font-size="10">2단계 — 라이브러리만 넣음</text>
  <rect x="328" y="116" width="60" height="24" fill="#f2d4d4"/>
  <text x="358" y="133" fill="#7a1f1f" font-size="11" text-anchor="middle" font-weight="700">404</text>
  <text x="398" y="133" fill="#e8e4df" font-size="10.5">노출이 안 됩니다</text>
  <text x="328" y="162" fill="rgb(138,133,128)" font-size="9.5">빈은 생겼는데 노출 목록에</text>
  <text x="328" y="178" fill="rgb(138,133,128)" font-size="9.5">이름이 없어 창구가 닫혀 있습니다</text>
  <rect x="328" y="188" width="222" height="22" fill="#f5edda"/>
  <text x="338" y="203" fill="#0d0d0d" font-size="8.5" font-family="'JetBrains Mono', monospace">@ConditionalOnAvailableEndpoint 가 거짓</text>
  <text x="328" y="226" fill="#e8e4df" font-size="9.5">한 칸 이동했습니다 — 빈은 있음</text>

  <line x1="572" y1="150" x2="600" y2="150" stroke="rgb(212,168,83)" stroke-width="1.6" marker-end="url(#s4Amber)"/>
  <text x="586" y="140" fill="rgb(212,168,83)" font-size="8.5" text-anchor="middle">include</text>

  <!-- ── 단계 3 ── -->
  <rect x="604" y="84" width="256" height="150" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="620" y="106" fill="rgb(138,133,128)" font-size="10">3단계 — 앱은 열렸는데</text>
  <rect x="620" y="116" width="60" height="24" fill="#f2d4d4"/>
  <text x="650" y="133" fill="#7a1f1f" font-size="11" text-anchor="middle" font-weight="700">404</text>
  <text x="690" y="133" fill="#e8e4df" font-size="10.5">경로가 어긋납니다</text>
  <text x="620" y="162" fill="rgb(138,133,128)" font-size="9.5">긁는 쪽이 경로 설정을 빼먹어</text>
  <text x="620" y="178" fill="rgb(138,133,128)" font-size="9.5">기본값을 조용히 씁니다</text>
  <rect x="620" y="188" width="222" height="22" fill="#f5edda"/>
  <text x="630" y="203" fill="#0d0d0d" font-size="8.5" font-family="'JetBrains Mono', monospace">metrics_path 누락 → /metrics 를 긁음</text>
  <text x="620" y="226" fill="#e8e4df" font-size="9.5">앱은 정상, 막힌 곳은 긁는 쪽입니다</text>

  <!-- ── 대조군 ── -->
  <rect x="20" y="252" width="840" height="78" fill="rgb(26,26,26)" stroke="rgb(92,84,74)"/>
  <text x="36" y="274" fill="#e8e4df" font-size="11">대조군 — 같은 세 단계에서 다른 엔드포인트는 어땠는가</text>

  <text x="36" y="298" fill="rgb(138,133,128)" font-size="9.5" font-family="'JetBrains Mono', monospace">/actuator/metrics</text>
  <rect x="176" y="286" width="54" height="20" fill="#f2d4d4"/>
  <text x="203" y="300" fill="#7a1f1f" font-size="9.5" text-anchor="middle" font-weight="700">404</text>
  <rect x="242" y="286" width="54" height="20" fill="#f2d4d4"/>
  <text x="269" y="300" fill="#7a1f1f" font-size="9.5" text-anchor="middle" font-weight="700">404</text>
  <rect x="308" y="286" width="54" height="20" fill="#f2d4d4"/>
  <text x="335" y="300" fill="#7a1f1f" font-size="9.5" text-anchor="middle" font-weight="700">404</text>
  <text x="378" y="300" fill="#e8e4df" font-size="9.5">빈은 처음부터 있었습니다 — 끝까지 닫힌 이유는 노출 목록에 안 적었기 때문입니다</text>

  <text x="36" y="320" fill="rgb(138,133,128)" font-size="9">두 엔드포인트는 같은 데이터를 보면서도 창구가 달라 각각 열어야 합니다.</text>

  <!-- ── 하단 못박기 ── -->
  <rect x="20" y="348" width="840" height="70" fill="#0d0d0d" stroke="rgb(138,133,128)" stroke-dasharray="4 3"/>
  <text x="36" y="368" fill="rgb(212,168,83)" font-size="10.5">핵심</text>
  <text x="80" y="368" fill="#e8e4df" font-size="10.5">"기본으로는 열려 있지 않아 명시적으로 노출해야 한다"는 한 문장이 실제로는 세 층입니다.</text>
  <text x="36" y="388" fill="rgb(138,133,128)" font-size="10">빈이 있는가 · 창구가 열렸는가 · 긁는 쪽이 맞는 문을 두드리는가. 세 층은 화면에 같은 숫자로 나옵니다.</text>
  <text x="36" y="406" fill="rgb(138,133,128)" font-size="10">3단계가 특히 고약합니다 — 설정 누락이 기동 실패가 아니라 런타임 404 로 뒤늦게 드러나기 때문입니다.</text>
</svg>

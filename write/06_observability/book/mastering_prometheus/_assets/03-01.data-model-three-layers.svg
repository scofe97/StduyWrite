<svg viewBox="0 0 820 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>데이터 모델 3층 — 메트릭·시계열·샘플</title>
  <desc>메트릭은 이름뿐인 최하층이고, 라벨이 붙으면 시계열이 되며, 시계열에 시각과 값의 튜플이 쌓이면 샘플이 된다. 위층은 아래층을 딛고 서므로 라벨을 빼면 시계열이 서지 않는다. 오른쪽에는 같은 메트릭 이름 아래 라벨이 시계열을 가르는 모습이 있고, 라벨로 구분되지 않는 중복 시계열은 스크레이프가 실패한다.</desc>

  <defs>
    <marker id="up" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="400" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">데이터 모델 3층 — 위층은 아래층을 딛고 섭니다</text>

  <!-- ③ 샘플 -->
  <rect x="24" y="60" width="330" height="62" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="40" y="84" fill="#e8e4df" font-size="13">③ 샘플</text>
  <text x="40" y="104" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">(t0,v0) (t1,v1) (t2,v2) …</text>
  <text x="344" y="84" fill="rgb(168,163,158)" font-size="9.5" text-anchor="end">float64 · ms epoch</text>

  <!-- ② 시계열 -->
  <rect x="24" y="160" width="330" height="62" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="40" y="184" fill="#e8e4df" font-size="13">② 시계열</text>
  <text x="40" y="204" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">readers_total{stage="draft"}</text>
  <text x="344" y="184" fill="rgb(168,163,158)" font-size="9.5" text-anchor="end">라벨로 특정됩니다</text>

  <!-- ① 메트릭 -->
  <rect x="24" y="260" width="330" height="62" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="40" y="284" fill="#e8e4df" font-size="13">① 메트릭</text>
  <text x="40" y="304" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">readers_total</text>
  <text x="344" y="284" fill="rgb(168,163,158)" font-size="9.5" text-anchor="end">이름뿐입니다</text>

  <!-- 층 사이 화살표 -->
  <line x1="189" y1="256" x2="189" y2="228" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#up)"/>
  <text x="200" y="248" fill="rgb(212,168,83)" font-size="10">+ 라벨</text>

  <line x1="189" y1="156" x2="189" y2="128" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#up)"/>
  <text x="200" y="148" fill="rgb(212,168,83)" font-size="10">+ (시각, 값)</text>

  <!-- 세로 구분선 -->
  <line x1="392" y1="56" x2="392" y2="330" stroke="rgb(92,84,74)" stroke-dasharray="5 4"/>

  <!-- 오른쪽: 라벨이 시계열을 가릅니다 -->
  <text x="424" y="76" fill="#e8e4df" font-size="12">라벨이 시계열을 가릅니다</text>

  <rect x="424" y="92" width="372" height="30" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="438" y="112" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">readers_total</text>
  <text x="782" y="112" fill="rgb(168,163,158)" font-size="9.5" text-anchor="end">메트릭 하나</text>

  <line x1="530" y1="122" x2="490" y2="150" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#up)"/>
  <line x1="640" y1="122" x2="680" y2="150" stroke="rgb(212,168,83)" stroke-width="1.5" marker-end="url(#up)"/>

  <rect x="424" y="156" width="176" height="46" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="512" y="176" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">{stage="published"}</text>
  <text x="512" y="193" fill="rgb(168,163,158)" font-size="9.5" text-anchor="middle">시계열 A</text>

  <rect x="620" y="156" width="176" height="46" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="708" y="176" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">{stage="draft"}</text>
  <text x="708" y="193" fill="rgb(168,163,158)" font-size="9.5" text-anchor="middle">시계열 B</text>

  <!-- 유일성 위반 -->
  <text x="424" y="240" fill="#e8e4df" font-size="12">라벨이 없으면 갈리지 않습니다</text>

  <rect x="424" y="256" width="372" height="66" fill="rgba(224,108,108,0.10)" stroke="rgb(224,108,108)"/>
  <text x="438" y="276" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">readers_total 123467890</text>
  <text x="438" y="293" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">readers_total 789</text>
  <text x="438" y="313" fill="rgb(224,108,108)" font-size="10" font-weight="700">같은 시계열 둘 → 스크레이프 실패</text>

  <text x="24" y="366" fill="#e8e4df" font-size="10.5">앰버 = 라벨이 만들어 내는 층 · 아래에서 위로 쌓입니다. 메트릭 이름은 내부적으로 <tspan font-family="'JetBrains Mono', monospace">__name__</tspan> 라벨입니다.</text>
</svg>

<svg viewBox="0 0 900 386" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif">
  <title>exporter 의 세 부품과 두 시점 — 등록은 한 번, Collect 는 스크레이프마다</title>
  <desc>exporter 를 이루는 세 부품이 두 개의 서로 다른 시점에 어떻게 관여하는지를 위아래 두 줄기로 나눠 그린 도식이다. 위 줄기는 프로세스가 뜰 때 한 번만 일어나는 등록 시점이다. 코드에 NewDesc 로 정의한 메트릭을 MustRegister 로 레지스트리에 넣으면, 레지스트리가 그 collector 의 Describe 메서드를 불러 어떤 메트릭이 추가되는지 형상만 확인한다. 이 시점에 메트릭의 값은 아직 존재하지 않으며 나중에 값을 넣겠다는 예고만 등록된 상태다. 아래 줄기는 Prometheus 가 스크레이프할 때마다 반복되는 시점이다. Prometheus 가 슬래시 metrics 경로를 두드리면 promhttp 핸들러가 레지스트리에 등록된 모든 collector 의 Collect 메서드를 부르고, 각 collector 가 그때 비로소 자기 데이터 소스를 읽어 최신 값을 채널로 보낸다. 레지스트리는 그 값들을 모아 텍스트 노출 형식으로 직렬화해 응답한다. 두 줄기를 가르는 핵심은 값이 미리 저장돼 있다가 조회되는 것이 아니라 스크레이프 자체가 수집의 방아쇠라는 점이다. Node Exporter 는 이 collector 를 하나가 아니라 수십 개 거느리며 각각을 별도 고루틴에서 돌린다.</desc>
  <rect width="900" height="386" fill="#0d0d0d"/>

  <defs>
    <marker id="ea" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
    <marker id="eg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">세 부품과 두 시점</text>

  <!-- 등록 시점 줄기 -->
  <rect x="24" y="52" width="852" height="112" rx="8" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="44" y="76" font-size="13" font-weight="700" fill="#8ab6e0">등록 시점 · 뜰 때 한 번</text>

  <rect x="44" y="92" width="180" height="52" rx="6" fill="#dceaf7"/>
  <text x="134" y="113" text-anchor="middle" font-size="11.5" font-weight="700" fill="#10243a">1. 메트릭 정의</text>
  <text x="134" y="131" text-anchor="middle" font-size="10" font-weight="700" fill="#10243a">NewDesc(...)</text>

  <line x1="230" y1="118" x2="266" y2="118" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#ea)"/>

  <rect x="272" y="92" width="180" height="52" rx="6" fill="#dceaf7"/>
  <text x="362" y="113" text-anchor="middle" font-size="11.5" font-weight="700" fill="#10243a">3. 레지스트리</text>
  <text x="362" y="131" text-anchor="middle" font-size="10" font-weight="700" fill="#10243a">MustRegister(c)</text>

  <line x1="458" y1="118" x2="494" y2="118" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#ea)"/>

  <rect x="500" y="92" width="180" height="52" rx="6" fill="#f5edda"/>
  <text x="590" y="113" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a2f10">2. collector</text>
  <text x="590" y="131" text-anchor="middle" font-size="10" font-weight="700" fill="#3a2f10">Describe(ch)</text>

  <line x1="686" y1="118" x2="722" y2="118" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#ea)"/>

  <rect x="728" y="92" width="128" height="52" rx="6" fill="#f2d4d4"/>
  <text x="792" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#7a1f1f">형상만 등록</text>
  <text x="792" y="131" text-anchor="middle" font-size="10" font-weight="700" fill="#7a1f1f">값은 없음</text>


  <!-- 시점 경계 -->
  <line x1="450" y1="172" x2="450" y2="196" stroke="#66bb6a" stroke-width="2" marker-end="url(#eg)"/>
  <text x="466" y="190" font-size="11" font-weight="700" fill="#8fd694">스크레이프가 방아쇠</text>

  <!-- 스크레이프 시점 줄기 -->
  <rect x="24" y="204" width="852" height="112" rx="8" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="44" y="228" font-size="13" font-weight="700" fill="#8fd694">스크레이프 시점 · 매번</text>

  <rect x="44" y="244" width="180" height="52" rx="6" fill="#dceaf7"/>
  <text x="134" y="265" text-anchor="middle" font-size="11.5" font-weight="700" fill="#10243a">Prometheus</text>
  <text x="134" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#10243a">GET /metrics</text>

  <line x1="230" y1="270" x2="266" y2="270" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#ea)"/>

  <rect x="272" y="244" width="180" height="52" rx="6" fill="#dceaf7"/>
  <text x="362" y="265" text-anchor="middle" font-size="11.5" font-weight="700" fill="#10243a">promhttp 핸들러</text>
  <text x="362" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#10243a">레지스트리로 전달</text>

  <line x1="458" y1="270" x2="494" y2="270" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#ea)"/>

  <rect x="500" y="244" width="180" height="52" rx="6" fill="#f5edda"/>
  <text x="590" y="265" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a2f10">2. collector</text>
  <text x="590" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#3a2f10">Collect(ch)</text>

  <line x1="686" y1="270" x2="722" y2="270" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#ea)"/>

  <rect x="728" y="244" width="128" height="52" rx="6" fill="#e6f7e7"/>
  <text x="792" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#14521d">최신 값을 채움</text>
  <text x="792" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#14521d">텍스트로 응답</text>


  <rect x="24" y="332" width="852" height="32" rx="6" fill="rgb(212,168,83)"/>
  <text x="44" y="353" font-size="11.5" font-weight="700" fill="#0d0d0d">값은 미리 있지 않습니다</text>
</svg>

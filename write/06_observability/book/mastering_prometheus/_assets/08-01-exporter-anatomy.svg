<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="exporter 는 메트릭 정의·collector·레지스트리 세 부품으로 이뤄진다. 등록 시점에 Describe 가 형상만 알리고, Prometheus 가 /metrics 를 두드리는 스크레이프 시점에 Collect 가 최신 값을 채운다">
  <rect width="740" height="380" fill="#0d0d0d"/>
  <text x="370" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">exporter 해부 — 세 부품과 두 시점</text>

  <!-- exporter box -->
  <rect x="40" y="56" width="420" height="230" rx="12" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="56" y="78" font-size="13" font-weight="700" fill="#8ab6e0">exporter</text>

  <!-- 3 parts -->
  <rect x="60" y="92" width="180" height="52" rx="7" fill="#dceaf7"/>
  <text x="150" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#10243a">① 메트릭 정의</text>
  <text x="150" y="132" text-anchor="middle" font-size="11" fill="#10243a">NewDesc(...)</text>

  <rect x="260" y="92" width="180" height="52" rx="7" fill="#f5edda"/>
  <text x="350" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#3a2f10">② collector</text>
  <text x="350" y="132" text-anchor="middle" font-size="11" fill="#3a2f10">Describe() · Collect()</text>

  <rect x="60" y="164" width="380" height="52" rx="7" fill="#dceaf7"/>
  <text x="250" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#10243a">③ 메트릭 레지스트리 (장부)</text>
  <text x="250" y="204" text-anchor="middle" font-size="11" fill="#10243a">MustRegister — 모든 메트릭·값을 추적</text>

  <!-- /metrics endpoint -->
  <rect x="60" y="236" width="380" height="34" rx="6" fill="#5b9bd5"/>
  <text x="250" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#e8e4df">/metrics HTTP 엔드포인트 (promhttp.Handler)</text>

  <!-- two moments (right) -->
  <rect x="500" y="92" width="200" height="86" rx="10" fill="#66bb6a"/>
  <text x="600" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#0d0d0d">등록 시점</text>
  <text x="600" y="140" text-anchor="middle" font-size="12" fill="#14330a">Describe() 호출</text>
  <text x="600" y="160" text-anchor="middle" font-size="11" fill="#14330a">형상만 알림 (값 없음)</text>

  <rect x="500" y="196" width="200" height="90" rx="10" fill="#66bb6a"/>
  <text x="600" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0d0d0d">스크레이프 시점</text>
  <text x="600" y="244" text-anchor="middle" font-size="12" fill="#14330a">Collect() 호출</text>
  <text x="600" y="264" text-anchor="middle" font-size="11" fill="#14330a">최신 값을 채워 반환</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8a8580"/></marker>
  </defs>
  <!-- register moment arrow: collector -> 등록 -->
  <line x1="440" y1="118" x2="496" y2="122" stroke="#8a8580" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- scrape moment arrow: /metrics -> 스크레이프 -->
  <line x1="440" y1="252" x2="496" y2="240" stroke="#8a8580" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Prometheus scrape -->
  <text x="250" y="308" text-anchor="middle" font-size="12" fill="#8ab6e0">▲ Prometheus 가 /metrics 를 두드리면 → Collect() 가 방아쇠</text>
  <text x="370" y="344" text-anchor="middle" font-size="11.5" fill="#8a8580">값은 미리 저장돼 있지 않다 — 스크레이프가 방아쇠. Node Exporter 는 이 collector 를 수십 개 거느린다.</text>
</svg>

<svg viewBox="0 0 820 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>샘플 하나가 걸어가는 길</title>
  <desc>스크레이프된 샘플이 WAL 에 먼저 기록된 뒤 메모리의 head chunk 에 쌓이고, 120 샘플이 차면 디스크의 chunks_head 세그먼트로 flush 되어 mmap 되며, head 블록이 최소 블록 범위의 1.5배를 넘으면 앞 2시간이 영속 블록으로 압축된다.</desc>

  <defs>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="400" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">샘플 하나가 걸어가는 길 — 스크레이프에서 영속 블록까지</text>

  <!-- 메모리/디스크 구분선 -->
  <line x1="8" y1="188" x2="700" y2="188" stroke="rgb(42,37,32)" stroke-dasharray="5 4"/>
  <text x="812" y="180" fill="rgb(138,133,128)" font-size="10.5" text-anchor="end">위 = 메모리</text>
  <text x="812" y="202" fill="rgb(138,133,128)" font-size="10.5" text-anchor="end">아래 = 디스크</text>

  <!-- 1. 스크레이프 (메모리) -->
  <rect x="20" y="110" width="140" height="58" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="90" y="134" fill="#e8e4df" font-size="12" text-anchor="middle">① 스크레이프 샘플</text>
  <text x="90" y="152" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">float64 · ms epoch</text>

  <!-- 2. WAL (디스크) -->
  <rect x="180" y="205" width="140" height="58" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="250" y="229" fill="#e8e4df" font-size="12" text-anchor="middle">② WAL 추가</text>
  <text x="250" y="247" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">내구성 확보 (ACID 의 D)</text>

  <!-- 3. head chunk (메모리) -->
  <rect x="340" y="110" width="140" height="58" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="410" y="134" fill="#e8e4df" font-size="12" text-anchor="middle">③ head chunk</text>
  <text x="410" y="152" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">120 샘플까지 메모리</text>

  <!-- 4. chunks_head (디스크) -->
  <rect x="486" y="205" width="158" height="58" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="565" y="229" fill="#e8e4df" font-size="11" text-anchor="middle">④ <tspan font-family="'JetBrains Mono', monospace">chunks_head</tspan> 세그먼트</text>
  <text x="565" y="247" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">≤128 MiB · mmap</text>

  <!-- 5. 영속 블록 (디스크) -->
  <rect x="660" y="205" width="140" height="58" fill="rgb(26,26,26)" stroke="rgb(212,168,83)"/>
  <text x="730" y="229" fill="#e8e4df" font-size="12" text-anchor="middle">⑤ 영속 블록</text>
  <text x="730" y="247" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">head 1.5×2h 초과 시</text>

  <!-- 화살표 -->
  <line x1="94" y1="170" x2="222" y2="202" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <line x1="286" y1="203" x2="386" y2="170" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <line x1="424" y1="170" x2="536" y2="202" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>
  <line x1="646" y1="234" x2="656" y2="234" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#am)"/>

  <text x="152" y="182" fill="rgb(212,168,83)" font-size="10">먼저 WAL</text>
  <text x="340" y="182" fill="rgb(212,168,83)" font-size="10" text-anchor="end">그다음 메모리</text>
  <text x="476" y="182" fill="rgb(212,168,83)" font-size="10">120 샘플 차면</text>

  <text x="730" y="292" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">이때 WAL 이 잘리고</text>
  <text x="730" y="308" fill="rgb(138,133,128)" font-size="10" text-anchor="middle">체크포인트가 생깁니다</text>

  <text x="24" y="378" fill="rgb(138,133,128)" font-size="10.5">앰버 = 메모리 상주 · 회색 = 디스크. 크래시가 나도 ②가 있어 데이터를 잃지 않습니다.</text>
</svg>

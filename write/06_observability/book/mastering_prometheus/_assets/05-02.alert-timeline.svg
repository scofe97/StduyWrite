<svg viewBox="0 0 860 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>단위 테스트의 알림 타임라인</title>
  <desc>server1 의 probe_success 는 4분까지 1이고 그 뒤 0이다. max_over_time 의 5분 창은 9분이 되어서야 0을 돌려주고, for 기간 5분이 더 지난 14분에 알림이 발화한다.</desc>

  <rect x="0" y="0" width="860" height="300" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">server1 은 왜 14분에 발화하는가</text>

  <!-- 경계선 -->
  <line x1="490" y1="76" x2="490" y2="234" stroke="rgb(212,168,83)" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="690" y1="76" x2="690" y2="234" stroke="rgb(212,168,83)" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="498" y="68" fill="rgb(212,168,83)" font-size="10">9분 — pending 진입</text>
  <text x="698" y="68" fill="rgb(212,168,83)" font-size="10">14분 — 발화</text>

  <!-- 행 1: probe_success -->
  <text x="20" y="100" fill="rgb(138,133,128)" font-size="10" font-family="'JetBrains Mono', monospace">probe_success</text>
  <text x="150" y="100" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="190" y="100" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="230" y="100" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="270" y="100" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="310" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="350" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="390" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="430" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="470" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="510" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="550" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="590" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="630" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="670" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="710" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="750" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="790" y="100" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>

  <!-- 행 2: max_over_time -->
  <text x="20" y="145" fill="rgb(138,133,128)" font-size="10" font-family="'JetBrains Mono', monospace">max_over_time [5m]</text>
  <text x="150" y="145" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="190" y="145" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="230" y="145" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="270" y="145" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="310" y="145" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="350" y="145" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="390" y="145" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="430" y="145" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="470" y="145" fill="rgb(212,168,83)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">1</text>
  <text x="510" y="145" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="550" y="145" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="590" y="145" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="630" y="145" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="670" y="145" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="710" y="145" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="750" y="145" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>
  <text x="790" y="145" fill="rgb(138,133,128)" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">0</text>

  <text x="136" y="166" fill="rgb(138,133,128)" font-size="9">8분까지는 5분 창 안에 값 1이 남아 있어 최댓값이 1입니다</text>

  <!-- 행 3: 알림 상태 -->
  <text x="20" y="196" fill="rgb(138,133,128)" font-size="10">알림 상태</text>
  <rect x="136" y="178" width="352" height="26" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="312" y="196" fill="rgb(138,133,128)" font-size="10.5" text-anchor="middle">inactive</text>
  <rect x="492" y="178" width="196" height="26" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="590" y="196" fill="rgb(212,168,83)" font-size="10.5" text-anchor="middle">pending (for: 5m)</text>
  <rect x="692" y="178" width="120" height="26" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="752" y="196" fill="#0d0d0d" font-size="10.5" font-weight="700" text-anchor="middle">firing</text>

  <!-- 축 -->
  <line x1="136" y1="222" x2="812" y2="222" stroke="rgb(42,37,32)"/>
  <text x="150" y="242" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">0</text>
  <text x="310" y="242" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">4</text>
  <text x="470" y="242" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">8</text>
  <text x="510" y="242" fill="rgb(212,168,83)" font-size="9" text-anchor="middle">9</text>
  <text x="630" y="242" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">12</text>
  <text x="710" y="242" fill="rgb(212,168,83)" font-size="9" text-anchor="middle">14</text>
  <text x="790" y="242" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">16</text>
  <text x="836" y="242" fill="rgb(138,133,128)" font-size="9" text-anchor="middle">분</text>

  <text x="20" y="278" fill="rgb(138,133,128)" font-size="10.5">스크레이프 실패가 <tspan font-family="'JetBrains Mono', monospace">for</tspan> 상태를 지우지 못하게 하려고 <tspan font-family="'JetBrains Mono', monospace">_over_time</tspan> 을 씁니다. 대신 창 길이만큼 발화가 늦어집니다.</text>
</svg>

<svg viewBox="0 0 900 560" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif">
  <title>빈 배열은 없다는 뜻이고 오류는 모른다는 뜻이다</title>
  <desc>Prometheus 는 http_sd 목록을 주기적으로 다시 물어본다. 갱신에 실패하면 직전 목록을 계속 쓰며 이 캐시에는 만료가 없다. 목록 서비스 장애가 감시 중단으로 번지지 않게 한 설계다. 그래서 타깃이 정말 0대일 때 오류로 답하면 Prometheus 가 갱신 실패로 읽고 이미 내려간 서버를 계속 긁는다. 200 과 빈 배열을 내야 타깃이 제거된다. 갱신 실패는 prometheus_sd_refresh_failures_total 로만 드러나므로 알림이 유일한 방어선이다.</desc>
  <rect width="900" height="560" fill="#0d0d0d"/>

  <defs>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
    <marker id="e2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f44336"/>
    </marker>
    <marker id="e3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66bb6a"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">없다와 모른다는 다릅니다</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#b8b3ad">0 대를 어떻게 알리느냐</text>

  <!-- 갱신 주기 -->
  <text x="40" y="88" font-size="13" font-weight="700" fill="rgb(212,168,83)">60 초마다 다시 물어봅니다</text>

  <rect x="40" y="100" width="820" height="60" rx="9" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="60" y="124" font-size="10.5" fill="#b8b3ad">12:00</text>
  <rect x="100" y="112" width="200" height="20" rx="4" fill="#e6f7e7"/>
  <text x="200" y="127" text-anchor="middle" font-size="10" font-weight="700" fill="#14521d">200 · 주소 2 개</text>
  <text x="60" y="148" font-size="10" fill="#8fdc93">목록 갱신</text>

  <line x1="308" y1="122" x2="336" y2="122" stroke="#b8b3ad" stroke-width="1.4" marker-end="url(#e1)"/>

  <text x="346" y="124" font-size="10.5" fill="#b8b3ad">12:01</text>
  <rect x="386" y="112" width="200" height="20" rx="4" fill="#e6f7e7"/>
  <text x="486" y="127" text-anchor="middle" font-size="10" font-weight="700" fill="#14521d">200 · 주소 2 개</text>
  <text x="346" y="148" font-size="10" fill="#8fdc93">목록 갱신</text>

  <line x1="594" y1="122" x2="622" y2="122" stroke="#b8b3ad" stroke-width="1.4" marker-end="url(#e1)"/>

  <text x="632" y="124" font-size="10.5" fill="#b8b3ad">12:02</text>
  <rect x="672" y="112" width="170" height="20" rx="4" fill="#fdf3df"/>
  <text x="757" y="127" text-anchor="middle" font-size="10" font-weight="700" fill="#3a2f10">여기서 갈립니다</text>

  <!-- 분기 -->
  <line x1="757" y1="166" x2="757" y2="186" stroke="#b8b3ad" stroke-width="1.4"/>
  <line x1="250" y1="186" x2="757" y2="186" stroke="#b8b3ad" stroke-width="1.4"/>
  <line x1="250" y1="186" x2="250" y2="214" stroke="#f44336" stroke-width="1.5" marker-end="url(#e2)"/>
  <line x1="650" y1="186" x2="650" y2="214" stroke="#66bb6a" stroke-width="1.5" marker-end="url(#e3)"/>

  <!-- 왼쪽: 오류 -->
  <rect x="40" y="222" width="400" height="140" rx="9" fill="#0d0d0d" stroke="#f44336" stroke-width="1.5"/>
  <text x="58" y="245" font-size="12.5" font-weight="700" fill="#f0a0a0">오류로 답하면</text>
  <rect x="58" y="254" width="364" height="22" rx="4" fill="#f2d4d4"/>
  <text x="240" y="270" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a1f1f">500 · 서버 없음을 오류로 표현</text>

  <text x="58" y="294" font-size="10.5" fill="#b8b3ad">Prometheus 의 해석</text>
  <rect x="58" y="302" width="364" height="22" rx="4" fill="#fdf3df"/>
  <text x="240" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">갱신 실패다. 직전 목록을 쓰자</text>

  <rect x="58" y="330" width="364" height="22" rx="4" fill="#f2d4d4"/>
  <text x="240" y="346" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a1f1f">내려간 서버를 계속 긁습니다</text>

  <!-- 오른쪽: 빈 배열 -->
  <rect x="470" y="222" width="390" height="140" rx="9" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="488" y="245" font-size="12.5" font-weight="700" fill="#8fdc93">빈 배열로 답하면</text>
  <rect x="488" y="254" width="354" height="22" rx="4" fill="#e6f7e7"/>
  <text x="665" y="270" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">200 · 빈 배열</text>

  <text x="488" y="294" font-size="10.5" fill="#b8b3ad">Prometheus 의 해석</text>
  <rect x="488" y="302" width="354" height="22" rx="4" fill="#dceaf7"/>
  <text x="665" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">정상 응답이고 목록이 비었다</text>

  <rect x="488" y="330" width="354" height="22" rx="4" fill="#e6f7e7"/>
  <text x="665" y="346" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">타깃을 전부 제거합니다</text>

  <!-- 캐시 만료 없음 -->
  <rect x="40" y="386" width="820" height="76" rx="9" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="58" y="409" font-size="12" font-weight="700" fill="rgb(212,168,83)">이 캐시에는 만료가 없습니다</text>
  <rect x="58" y="420" width="300" height="22" rx="4" fill="#fdf3df"/>
  <text x="208" y="436" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">메트릭은 5 분 뒤 사라짐</text>
  <text x="372" y="436" font-size="10.5" fill="#b8b3ad">그러나</text>
  <rect x="424" y="420" width="300" height="22" rx="4" fill="#f2d4d4"/>
  <text x="574" y="436" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a1f1f">목록은 3 일이든 그대로</text>
  <text x="738" y="436" font-size="10.5" fill="#b8b3ad">스스로 안 포기함</text>

  <!-- 방어선 -->
  <rect x="40" y="478" width="820" height="66" rx="9" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.3"/>
  <text x="58" y="501" font-size="12" font-weight="700" fill="#8ab6e0">그래서 알림이 유일한 방어선입니다</text>
  <rect x="58" y="512" width="500" height="22" rx="4" fill="#dceaf7"/>
  <text x="308" y="528" text-anchor="middle" font-size="10" font-weight="700" fill="#10243a">rate(prometheus_sd_refresh_failures_total[5m]) &gt; 0</text>
  <text x="574" y="528" font-size="10.5" fill="#b8b3ad">없으면 조용히 얼어붙습니다</text>
</svg>

<svg viewBox="0 0 900 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>TSM 과 Prometheus TSDB — 같은 저장 원리, 다른 데이터 모델</title>
  <desc>InfluxDB 의 TSM 과 Prometheus TSDB 는 저장 원리를 공유한다. 둘 다 WAL 에 먼저 적고 메모리에 모았다가 불변 파일로 내리고 컴팩션으로 합친다. 다른 것은 데이터 모델이다. TSM 의 시리즈 키는 measurement 와 태그 셋에 필드까지 더해 만들어지므로 필드가 세 개면 시계열이 세 개로 갈라진다. Prometheus 는 메트릭 이름을 __name__ 라벨로 넣은 라벨 셋 하나로 식별하며, 필드라는 자리가 없고 일반 스칼라 샘플의 값은 float64 하나다. 그래서 Prometheus 는 모든 시계열이 같은 모양이 되고 라벨 셋만으로 질의가 닫힌다. 이 그림은 두 엔진의 우열이나 채택 여부를 말하지 않는다.</desc>

  <rect x="0" y="0" width="900" height="430" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">같은 저장 원리, 다른 데이터 모델</text>

  <!-- 상단: 쓰기 경로는 같다 -->
  <rect x="24" y="54" width="852" height="72" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="40" y="76" fill="rgb(138,133,128)" font-size="10">쓰기 경로 — 둘이 사실상 같습니다</text>

  <rect x="40" y="86" width="150" height="28" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="115" y="105" style="fill:#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">WAL 먼저</text>
  <text x="200" y="105" fill="rgb(212,168,83)" font-size="12">→</text>
  <rect x="220" y="86" width="150" height="28" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="295" y="105" style="fill:#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">메모리에 모음</text>
  <text x="380" y="105" fill="rgb(212,168,83)" font-size="12">→</text>
  <rect x="400" y="86" width="150" height="28" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="475" y="105" style="fill:#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">불변 파일로</text>
  <text x="560" y="105" fill="rgb(212,168,83)" font-size="12">→</text>
  <rect x="580" y="86" width="150" height="28" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="655" y="105" style="fill:#0d0d0d" font-size="10" text-anchor="middle" font-weight="700">컴팩션으로 병합</text>
  <text x="748" y="105" fill="rgb(138,133,128)" font-size="10">원리는 공유합니다</text>

  <!-- 하단 좌: TSM -->
  <text x="24" y="156" fill="#e8e4df" font-size="12" font-weight="700">InfluxDB TSM</text>
  <text x="24" y="174" fill="rgb(138,133,128)" font-size="9.5">시리즈 키 = measurement + 태그 + 필드 이름</text>

  <rect x="24" y="186" width="420" height="200" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <rect x="40" y="196" width="388" height="46" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="52" y="218" style="fill:#10243a" font-size="9" font-family="'JetBrains Mono', monospace">weather,region=seoul</text>
  <text x="52" y="232" style="fill:#10243a" font-size="9" font-family="'JetBrains Mono', monospace">  wind=3.2,temp=20.1,hum=61</text>
  <text x="40" y="256" fill="rgb(138,133,128)" font-size="9.5">필드가 있어 <tspan fill="#e8e4df">줄이 하나</tspan>입니다 — 필드 3 개로 갈라집니다</text>

  <rect x="40" y="264" width="388" height="24" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="52" y="281" fill="#e8e4df" font-size="9" font-family="'JetBrains Mono', monospace">weather,region=seoul#wind</text>
  <rect x="40" y="292" width="388" height="24" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="52" y="309" fill="#e8e4df" font-size="9" font-family="'JetBrains Mono', monospace">weather,region=seoul#temp</text>
  <rect x="40" y="320" width="388" height="24" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="52" y="337" fill="#e8e4df" font-size="9" font-family="'JetBrains Mono', monospace">weather,region=seoul#hum</text>

  <text x="40" y="366" fill="rgb(138,133,128)" font-size="9.5">이름 · 태그 · 필드 <tspan fill="#e8e4df">세 가지가 각각 다른 자리</tspan>를 가집니다</text>

  <!-- 하단 우: Prometheus -->
  <text x="472" y="156" fill="#e8e4df" font-size="12" font-weight="700">Prometheus TSDB</text>
  <text x="472" y="174" fill="rgb(138,133,128)" font-size="9.5">시계열 = 라벨 셋 하나 (이름도 라벨)</text>

  <rect x="472" y="186" width="404" height="200" fill="#0d0d0d" stroke="rgb(212,168,83)"/>
  <rect x="488" y="196" width="372" height="46" fill="#dceaf7" stroke="#dceaf7"/>
  <text x="500" y="212" style="fill:#10243a" font-size="9" font-family="'JetBrains Mono', monospace">wind{region="seoul"} 3.2</text>
  <text x="500" y="224" style="fill:#10243a" font-size="9" font-family="'JetBrains Mono', monospace">temp{region="seoul"} 20.1</text>
  <text x="500" y="236" style="fill:#10243a" font-size="9" font-family="'JetBrains Mono', monospace">hum{region="seoul"} 61</text>
  <text x="488" y="256" fill="rgb(138,133,128)" font-size="9.5">필드가 없어 <tspan fill="#e8e4df">줄이 셋</tspan>입니다 — 스칼라 값은 float64</text>

  <rect x="488" y="264" width="372" height="24" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="500" y="281" style="fill:#0d0d0d" font-size="9" font-family="'JetBrains Mono', monospace">{__name__="wind", region="seoul"}</text>
  <rect x="488" y="292" width="372" height="24" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="500" y="309" style="fill:#0d0d0d" font-size="9" font-family="'JetBrains Mono', monospace">{__name__="temp", region="seoul"}</text>
  <rect x="488" y="320" width="372" height="24" fill="rgb(212,168,83)" stroke="rgb(212,168,83)"/>
  <text x="500" y="337" style="fill:#0d0d0d" font-size="9" font-family="'JetBrains Mono', monospace">{__name__="hum",  region="seoul"}</text>

  <text x="488" y="366" fill="rgb(138,133,128)" font-size="9.5">이름조차 <tspan fill="rgb(212,168,83)">라벨 하나</tspan>로 녹아 <tspan fill="#e8e4df">모두 같은 모양</tspan>입니다</text>

  <!-- 결론 -->
  <text x="24" y="412" fill="rgb(168,163,158)" font-size="10">시계열 개수는 같고 <tspan fill="rgb(212,168,83)">축만 다릅니다</tspan></text>
</svg>

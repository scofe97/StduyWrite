<svg viewBox="0 0 820 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>컴팩션과 보존 — 블록은 3배씩 커지고, 삭제는 단위가 둘입니다</title>
  <desc>컴팩션은 작고 인접한 블록 셋 이상을 하나로 합쳐 2시간에서 6시간, 18시간, 54시간으로 3배씩 키운다. 보존은 그렇게 커진 블록 중 시간이나 크기 임계를 넘긴 것을 폴더째 지운다. 삭제는 단위가 둘로 갈리는데, 사용자 삭제 요청은 시계열과 시간 범위라는 블록 일부가 대상이라 툼스톤으로 표시만 남기고 컴팩션 때 실제로 제거되며, 보존 만료는 블록 전체가 대상이라 폴더째 지운다. 블록이 불변이라 일부만 지울 수 없다는 제약이 이 차이를 만든다.</desc>

  <defs>
    <marker id="cm" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="420" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">컴팩션과 보존 — 3배씩 커지고, 끝에서 지워집니다</text>

  <!-- 컴팩션 단계 -->
  <text x="24" y="66" fill="#e8e4df" font-size="12">컴팩션 — 작은 블록 3개 이상이 모이면 다음 단계로</text>

  <!-- 2h 블록 3개 -->
  <rect x="24" y="82" width="44" height="42" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="46" y="108" fill="#e8e4df" font-size="10" text-anchor="middle">2h</text>
  <rect x="72" y="82" width="44" height="42" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="94" y="108" fill="#e8e4df" font-size="10" text-anchor="middle">2h</text>
  <rect x="120" y="82" width="44" height="42" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="142" y="108" fill="#e8e4df" font-size="10" text-anchor="middle">2h</text>
  <text x="94" y="140" fill="#e8e4df" font-size="10" text-anchor="middle">2h × 3</text>

  <line x1="176" y1="103" x2="206" y2="103" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#cm)"/>

  <!-- 6h -->
  <rect x="214" y="82" width="140" height="42" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="284" y="108" fill="#e8e4df" font-size="11" text-anchor="middle">6h</text>
  <text x="284" y="140" fill="#e8e4df" font-size="10" text-anchor="middle">셋이 하나로</text>

  <line x1="366" y1="103" x2="396" y2="103" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#cm)"/>

  <!-- 18h -->
  <rect x="404" y="82" width="170" height="42" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="489" y="108" fill="#e8e4df" font-size="11" text-anchor="middle">18h</text>

  <line x1="586" y1="103" x2="616" y2="103" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#cm)"/>

  <!-- 54h -->
  <rect x="624" y="82" width="172" height="42" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="710" y="108" fill="#e8e4df" font-size="11" text-anchor="middle">54h</text>
  <text x="710" y="140" fill="rgb(168,163,158)" font-size="10" text-anchor="middle">3배씩 · 1분마다 계획</text>

  <!-- 구분선 -->
  <line x1="24" y1="166" x2="796" y2="166" stroke="rgb(92,84,74)"/>

  <!-- 삭제 두 단위 -->
  <text x="24" y="192" fill="#e8e4df" font-size="12">삭제는 단위가 둘 — 단위가 다르면 방법도 갈립니다</text>

  <!-- 왼쪽: 사용자 삭제 -->
  <rect x="24" y="208" width="376" height="150" fill="none" stroke="rgb(224,108,108)"/>
  <text x="38" y="230" fill="rgb(224,108,108)" font-size="11" font-weight="700">사용자 삭제 요청 — 블록 일부</text>

  <rect x="38" y="244" width="348" height="46" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <rect x="150" y="252" width="86" height="30" fill="rgba(224,108,108,0.30)" stroke="rgb(224,108,108)"/>
  <text x="193" y="272" fill="#e8e4df" font-size="9.5" text-anchor="middle">지울 구간</text>
  <text x="70" y="272" fill="rgb(168,163,158)" font-size="9.5" text-anchor="middle">남김</text>
  <text x="320" y="272" fill="rgb(168,163,158)" font-size="9.5" text-anchor="middle">남김</text>

  <text x="38" y="312" fill="#e8e4df" font-size="10">단위 = 시계열 × 시간 범위</text>
  <text x="38" y="330" fill="#e8e4df" font-size="10">방법 = 툼스톤 표시 → 컴팩션 때 실제 제거</text>
  <text x="38" y="348" fill="rgb(168,163,158)" font-size="9.5">블록이 불변이라 일부만 도려낼 수 없습니다</text>

  <!-- 오른쪽: 보존 만료 -->
  <rect x="424" y="208" width="372" height="150" fill="none" stroke="rgb(92,84,74)"/>
  <text x="438" y="230" fill="#e8e4df" font-size="11" font-weight="700">보존 기간 만료 — 블록 전체</text>

  <rect x="438" y="244" width="344" height="46" fill="rgba(102,102,102,0.18)" stroke="rgb(138,133,128)" stroke-dasharray="5 4"/>
  <text x="610" y="272" fill="rgb(168,163,158)" font-size="10" text-anchor="middle">폴더째 사라짐</text>

  <text x="438" y="312" fill="#e8e4df" font-size="10">단위 = 블록 전체</text>
  <text x="438" y="330" fill="#e8e4df" font-size="10">방법 = 디렉토리 삭제</text>
  <text x="438" y="348" fill="rgb(168,163,158)" font-size="9.5">블록 경계가 곧 시간 경계라 그대로 맞습니다</text>

  <text x="24" y="392" fill="#e8e4df" font-size="10.5">툼스톤이 컴팩션 우선순위 3번인 이유 — 어차피 새 블록을 쓰는 김에 빼고 쓰면 값이 거의 안 듭니다.</text>
</svg>

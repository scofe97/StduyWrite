<svg viewBox="0 0 860 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>chunk 안에서 샘플이 비트 스트림으로 눌리는 구조</title>
  <desc>원본 샘플은 타임스탬프 8바이트와 값 8바이트로 하나에 16바이트를 차지한다. chunk 는 첫 샘플의 타임스탬프와 값만 그대로 저장하고, 이후 타임스탬프는 앞과의 델타로, 세 번째부터는 델타의 델타로 저장한다. 값은 앞 값과 비트 XOR 해 차이만 남기므로 값이 같으면 0 이 저장된다. 스크레이프 간격이 일정하면 델타의 델타가 전부 0 이 되어 한 샘플이 몇 비트로 줄고, 값이 변하지 않으면 XOR 결과도 0 이라 1 비트로 끝난다. 그 결과 chunk 안에서는 첫 샘플만 넓은 자리를 차지하고 뒤 샘플은 폭이 급격히 좁아지는 가변 길이 비트 스트림이 된다. 간격이 흔들리면 델타의 델타가 0 이 아니어서 비트 폭이 다시 넓어지고 블록이 예상보다 커진다.</desc>

  <defs>
    <marker id="cc-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="560" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">chunk 안에서 샘플이 눌리는 구조</text>

  <!-- ================= 1. 원본 샘플 ================= -->
  <text x="24" y="66" fill="#b8b3ad" font-size="10.5">1. 들어온 샘플 — 하나에 16 B</text>

  <rect x="24" y="76" width="812" height="58" fill="#0d0d0d" stroke="rgb(92,84,74)"/>

  <text x="38" y="100" fill="#b8b3ad" font-size="9" font-family="'JetBrains Mono', monospace">t</text>
  <text x="38" y="122" fill="#b8b3ad" font-size="9" font-family="'JetBrains Mono', monospace">v</text>

  <text x="150" y="100" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">10:00:00</text>
  <text x="150" y="122" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">42.0</text>

  <text x="320" y="100" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">10:00:15</text>
  <text x="320" y="122" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">42.0</text>

  <text x="490" y="100" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">10:00:30</text>
  <text x="490" y="122" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">42.0</text>

  <text x="660" y="100" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">10:00:45</text>
  <text x="660" y="122" fill="#e8e4df" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">42.5</text>

  <text x="790" y="112" fill="#b8b3ad" font-size="9.5" text-anchor="middle">…</text>

  <text x="836" y="66" fill="#b8b3ad" font-size="9.5" text-anchor="end">t 8 B + v 8 B</text>

  <!-- 변환 화살표 -->
  <line x1="430" y1="140" x2="430" y2="166" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#cc-arrow)"/>
  <text x="442" y="158" fill="rgb(212,168,83)" font-size="9.5">차이만 남김</text>

  <!-- ================= 2. 무엇을 저장하나 ================= -->
  <text x="24" y="192" fill="#b8b3ad" font-size="10.5">2. 실제로 저장되는 것</text>

  <rect x="24" y="202" width="812" height="86" fill="#0d0d0d" stroke="rgb(92,84,74)"/>

  <text x="38" y="228" fill="#b8b3ad" font-size="9" font-family="'JetBrains Mono', monospace">t</text>
  <text x="38" y="266" fill="#b8b3ad" font-size="9" font-family="'JetBrains Mono', monospace">v</text>

  <!-- 1번째: 원본 -->
  <rect x="88" y="212" width="124" height="30" fill="rgba(212,168,83,0.45)" stroke="rgb(212,168,83)"/>
  <text x="150" y="232" fill="#e8e4df" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">t0 원본</text>
  <rect x="88" y="250" width="124" height="30" fill="rgba(212,168,83,0.45)" stroke="rgb(212,168,83)"/>
  <text x="150" y="270" fill="#e8e4df" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">v0 원본</text>

  <!-- 2번째: 델타 / XOR -->
  <rect x="258" y="212" width="124" height="30" fill="rgba(212,168,83,0.18)" stroke="rgb(212,168,83)"/>
  <text x="320" y="232" fill="#e8e4df" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">델타 = 15s</text>
  <rect x="258" y="250" width="124" height="30" fill="rgba(102,187,106,0.20)" stroke="rgb(102,187,106)"/>
  <text x="320" y="270" fill="#e8e4df" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">XOR = 0</text>

  <!-- 3번째 -->
  <rect x="428" y="212" width="124" height="30" fill="rgba(102,187,106,0.20)" stroke="rgb(102,187,106)"/>
  <text x="490" y="232" fill="#e8e4df" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">델타의 델타 = 0</text>
  <rect x="428" y="250" width="124" height="30" fill="rgba(102,187,106,0.20)" stroke="rgb(102,187,106)"/>
  <text x="490" y="270" fill="#e8e4df" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">XOR = 0</text>

  <!-- 4번째 -->
  <rect x="598" y="212" width="124" height="30" fill="rgba(102,187,106,0.20)" stroke="rgb(102,187,106)"/>
  <text x="660" y="232" fill="#e8e4df" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">델타의 델타 = 0</text>
  <rect x="598" y="250" width="124" height="30" fill="rgba(212,168,83,0.18)" stroke="rgb(212,168,83)"/>
  <text x="660" y="270" fill="#e8e4df" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">XOR ≠ 0</text>

  <text x="790" y="232" fill="#b8b3ad" font-size="9.5" text-anchor="middle">…</text>
  <text x="790" y="270" fill="#b8b3ad" font-size="9.5" text-anchor="middle">…</text>

  <!-- ================= 3. 비트 스트림 ================= -->
  <text x="24" y="326" fill="#b8b3ad" font-size="10.5">3. chunk 안 비트 스트림 — 칸 너비 = 실제 차지하는 자리</text>

  <rect x="24" y="336" width="812" height="66" fill="#0d0d0d" stroke="rgb(92,84,74)"/>

  <!-- 헤더 -->
  <rect x="32" y="348" width="44" height="42" fill="rgba(102,102,102,0.25)" stroke="#b8b3ad"/>
  <text x="54" y="366" fill="#e8e4df" font-size="8" text-anchor="middle">길이</text>
  <text x="54" y="381" fill="#b8b3ad" font-size="7.5" text-anchor="middle">varint</text>

  <rect x="80" y="348" width="34" height="42" fill="rgba(102,187,106,0.25)" stroke="rgb(102,187,106)"/>
  <text x="97" y="366" fill="#e8e4df" font-size="8" text-anchor="middle">enc</text>
  <text x="97" y="381" fill="#b8b3ad" font-size="7.5" text-anchor="middle">1B</text>

  <!-- 첫 샘플: 넓다 -->
  <rect x="118" y="348" width="240" height="42" fill="rgba(212,168,83,0.45)" stroke="rgb(212,168,83)"/>
  <text x="238" y="366" fill="#e8e4df" font-size="8.5" text-anchor="middle">첫 샘플 t0 · v0</text>
  <text x="238" y="381" fill="#e8e4df" font-size="8" text-anchor="middle">128 비트</text>

  <!-- 2번째: 좁아짐 -->
  <rect x="362" y="348" width="56" height="42" fill="rgba(212,168,83,0.18)" stroke="rgb(212,168,83)"/>
  <text x="390" y="366" fill="#e8e4df" font-size="8" text-anchor="middle">2번째</text>
  <text x="390" y="381" fill="#b8b3ad" font-size="7.5" text-anchor="middle">수십 비트</text>

  <!-- 3번째부터: 델타의 델타가 0 이라 몇 비트로 끝난다 -->
  <rect x="422" y="348" width="16" height="42" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="442" y="348" width="16" height="42" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="462" y="348" width="16" height="42" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="482" y="348" width="16" height="42" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="502" y="348" width="16" height="42" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="522" y="348" width="16" height="42" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="542" y="348" width="16" height="42" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="562" y="348" width="16" height="42" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="582" y="348" width="16" height="42" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="602" y="348" width="16" height="42" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="622" y="348" width="16" height="42" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="642" y="348" width="16" height="42" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>

  <text x="676" y="371" fill="#b8b3ad" font-size="9">… 120 샘플</text>

  <!-- CRC -->
  <rect x="780" y="348" width="48" height="42" fill="#0d0d0d" stroke="rgb(92,84,74)"/>
  <text x="804" y="366" fill="#e8e4df" font-size="8" text-anchor="middle">CRC32</text>
  <text x="804" y="381" fill="#b8b3ad" font-size="7.5" text-anchor="middle">4B</text>

  <text x="24" y="418" fill="#b8b3ad" font-size="9.5">첫 샘플만 넓고 <tspan fill="rgb(102,187,106)">3번째부터는 몇 비트씩</tspan></text>

  <line x1="24" y1="436" x2="836" y2="436" stroke="rgb(92,84,74)"/>

  <!-- ================= 4. 주기가 흔들리면 ================= -->
  <text x="24" y="460" fill="#b8b3ad" font-size="10.5">4. 주기의 일관성이 곧 저장 비용</text>

  <!-- 일정 -->
  <rect x="24" y="472" width="398" height="72" fill="rgba(102,187,106,0.10)" stroke="rgb(102,187,106)"/>
  <text x="40" y="494" fill="rgb(102,187,106)" font-size="10.5" font-weight="700">간격이 일정하면</text>
  <text x="40" y="514" fill="#e8e4df" font-size="9" font-family="'JetBrains Mono', monospace">15s · 15s · 15s → 0 0 0</text>
  <rect x="40" y="524" width="20" height="12" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="64" y="524" width="20" height="12" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <rect x="88" y="524" width="20" height="12" fill="rgba(102,187,106,0.30)" stroke="rgb(102,187,106)"/>
  <text x="122" y="534" fill="#b8b3ad" font-size="9">폭이 좁게 유지</text>

  <!-- 흔들림 -->
  <rect x="438" y="472" width="398" height="72" fill="rgba(224,108,108,0.10)" stroke="rgb(224,108,108)"/>
  <text x="454" y="494" fill="rgb(224,108,108)" font-size="10.5" font-weight="700">간격이 흔들리면</text>
  <text x="454" y="514" fill="#e8e4df" font-size="9" font-family="'JetBrains Mono', monospace">15s · 14s · 17s → 0 아님</text>
  <rect x="454" y="524" width="52" height="12" fill="rgba(224,108,108,0.30)" stroke="rgb(224,108,108)"/>
  <rect x="510" y="524" width="52" height="12" fill="rgba(224,108,108,0.30)" stroke="rgb(224,108,108)"/>
  <rect x="566" y="524" width="52" height="12" fill="rgba(224,108,108,0.30)" stroke="rgb(224,108,108)"/>
  <text x="632" y="534" fill="#b8b3ad" font-size="9">폭이 다시 넓어짐</text>
</svg>

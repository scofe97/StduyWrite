<svg viewBox="0 0 820 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>chunk 압축 — 첫 값만 그대로, 나머지는 차이만</title>
  <desc>chunk 는 첫 타임스탬프와 첫 값만 그대로 저장하고, 이후 타임스탬프는 앞과의 델타로, 세 번째부터는 델타의 델타로 저장한다. 값은 앞 값과 비트 XOR 해 차이만 남기므로 값이 같으면 0 이 저장된다. 스크레이프 간격이 일정하면 델타의 델타가 전부 0 이 되어 압축이 잘 되고, 간격이 흔들리면 0 이 아닌 값이 남아 디스크를 더 먹는다.</desc>

  <rect x="0" y="0" width="820" height="400" fill="#0d0d0d"/>
  <text x="24" y="34" fill="#e8e4df" font-size="15">chunk 압축 — 첫 값만 그대로, 나머지는 차이만 남깁니다</text>

  <!-- 헤더 -->
  <text x="40" y="72" fill="rgb(168,163,158)" font-size="10">저장 위치</text>
  <text x="150" y="72" fill="rgb(168,163,158)" font-size="10" text-anchor="middle">1번째</text>
  <text x="290" y="72" fill="rgb(168,163,158)" font-size="10" text-anchor="middle">2번째</text>
  <text x="430" y="72" fill="rgb(168,163,158)" font-size="10" text-anchor="middle">3번째</text>
  <text x="570" y="72" fill="rgb(168,163,158)" font-size="10" text-anchor="middle">4번째</text>
  <text x="700" y="72" fill="rgb(168,163,158)" font-size="10" text-anchor="middle">…</text>

  <!-- 타임스탬프 행 -->
  <text x="40" y="106" fill="#e8e4df" font-size="11">타임스탬프</text>
  <rect x="96" y="86" width="108" height="34" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <text x="150" y="108" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">t0 그대로</text>

  <rect x="236" y="86" width="108" height="34" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="290" y="108" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">델타</text>

  <rect x="376" y="86" width="108" height="34" fill="rgba(102,187,106,0.13)" stroke="rgb(102,187,106)"/>
  <text x="430" y="108" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">델타의 델타</text>

  <rect x="516" y="86" width="108" height="34" fill="rgba(102,187,106,0.13)" stroke="rgb(102,187,106)"/>
  <text x="570" y="108" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">델타의 델타</text>

  <text x="700" y="108" fill="rgb(168,163,158)" font-size="10" text-anchor="middle">계속</text>

  <!-- 값 행 -->
  <text x="40" y="160" fill="#e8e4df" font-size="11">값</text>
  <rect x="96" y="140" width="108" height="34" fill="rgba(212,168,83,0.30)" stroke="rgb(212,168,83)"/>
  <text x="150" y="162" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">v0 그대로</text>

  <rect x="236" y="140" width="108" height="34" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="290" y="162" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">앞 값 XOR</text>

  <rect x="376" y="140" width="108" height="34" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="430" y="162" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">앞 값 XOR</text>

  <rect x="516" y="140" width="108" height="34" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="570" y="162" fill="#e8e4df" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">앞 값 XOR</text>

  <text x="700" y="162" fill="rgb(168,163,158)" font-size="10" text-anchor="middle">계속</text>

  <text x="24" y="204" fill="rgb(168,163,158)" font-size="10">진한 앰버 = 원본 그대로 저장되는 유일한 자리 · 연한 앰버 = 앞과의 차이 · 초록 = 차이의 차이(간격이 일정하면 0 이 되는 자리)</text>

  <!-- 구분선 -->
  <line x1="24" y1="228" x2="796" y2="228" stroke="rgb(92,84,74)"/>
  <text x="24" y="252" fill="#e8e4df" font-size="12">그래서 스크레이프 주기의 일관성이 곧 저장 비용입니다</text>

  <!-- 일정한 간격 -->
  <rect x="24" y="266" width="376" height="86" fill="rgba(102,187,106,0.10)" stroke="rgb(102,187,106)"/>
  <text x="38" y="286" fill="rgb(102,187,106)" font-size="11" font-weight="700">간격이 일정하면</text>
  <text x="38" y="308" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">15s · 15s · 15s → 델타의 델타 = 0 0 0</text>
  <text x="38" y="328" fill="#e8e4df" font-size="10">0 이 이어지므로 chunk 가 잘 압축됩니다</text>
  <text x="38" y="345" fill="rgb(168,163,158)" font-size="9.5">값이 안 변하면 XOR 결과도 0 입니다</text>

  <!-- 흔들리는 간격 -->
  <rect x="424" y="266" width="372" height="86" fill="rgba(224,108,108,0.10)" stroke="rgb(224,108,108)"/>
  <text x="438" y="286" fill="rgb(224,108,108)" font-size="11" font-weight="700">간격이 흔들리면</text>
  <text x="438" y="308" fill="#e8e4df" font-size="9.5" font-family="'JetBrains Mono', monospace">15s · 14s · 17s → 델타의 델타 ≠ 0</text>
  <text x="438" y="328" fill="#e8e4df" font-size="10">0 이 아닌 값이 남아 자리를 차지합니다</text>
  <text x="438" y="345" fill="rgb(168,163,158)" font-size="9.5">예상보다 디스크를 많이 먹는 블록이 생깁니다</text>
</svg>

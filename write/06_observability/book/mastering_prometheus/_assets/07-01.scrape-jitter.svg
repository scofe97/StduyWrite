<svg viewBox="0 0 880 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>스크레이프 지터가 블록을 키우는 과정</title>
  <desc>스크레이프 간격이 일정하면 타임스탬프의 델타의 델타가 0이 되어 압축 과정에서 타임스탬프가 사라진다. 간격이 몇 밀리초씩 흔들리면 델타의 델타가 0이 아니게 되어 샘플마다 타임스탬프를 저장해야 하고, 수백만 샘플이 쌓이면 블록마다 기가바이트 단위로 커진다.</desc>

  <rect x="0" y="0" width="880" height="300" fill="#0d0d0d"/>
  <text x="20" y="30" fill="#e8e4df" font-size="15">스크레이프 지터 — 몇 밀리초가 기가바이트가 됩니다</text>
  <text x="20" y="54" fill="rgb(138,133,128)" font-size="10.5">TSDB 는 세 번째 스크레이프부터 타임스탬프의 <tspan fill="#e8e4df">델타의 델타</tspan>만 저장합니다.</text>

  <!-- Row A: 정렬됨 -->
  <text x="20" y="106" fill="#e8e4df" font-size="11">정렬된 스크레이프</text>
  <line x1="170" y1="110" x2="700" y2="110" stroke="rgb(42,37,32)"/>
  <circle cx="170" cy="110" r="4" fill="rgb(212,168,83)"/>
  <circle cx="300" cy="110" r="4" fill="rgb(212,168,83)"/>
  <circle cx="430" cy="110" r="4" fill="rgb(212,168,83)"/>
  <circle cx="560" cy="110" r="4" fill="rgb(212,168,83)"/>
  <circle cx="690" cy="110" r="4" fill="rgb(212,168,83)"/>
  <text x="235" y="98" fill="rgb(138,133,128)" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">30.000s</text>
  <text x="365" y="98" fill="rgb(138,133,128)" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">30.000s</text>
  <text x="495" y="98" fill="rgb(138,133,128)" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">30.000s</text>
  <text x="625" y="98" fill="rgb(138,133,128)" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">30.000s</text>
  <text x="170" y="134" fill="rgb(212,168,83)" font-size="10">ΔΔ = 0 → 압축이 타임스탬프를 지웁니다</text>

  <!-- Row B: 지터 -->
  <text x="20" y="196" fill="#e8e4df" font-size="11">지터가 있는 스크레이프</text>
  <line x1="170" y1="200" x2="700" y2="200" stroke="rgb(42,37,32)"/>
  <circle cx="170" cy="200" r="4" fill="rgb(138,133,128)"/>
  <circle cx="303" cy="200" r="4" fill="rgb(138,133,128)"/>
  <circle cx="428" cy="200" r="4" fill="rgb(138,133,128)"/>
  <circle cx="563" cy="200" r="4" fill="rgb(138,133,128)"/>
  <circle cx="688" cy="200" r="4" fill="rgb(138,133,128)"/>
  <text x="236" y="188" fill="rgb(138,133,128)" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">30.003s</text>
  <text x="365" y="188" fill="rgb(138,133,128)" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">29.994s</text>
  <text x="495" y="188" fill="rgb(138,133,128)" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">30.006s</text>
  <text x="625" y="188" fill="rgb(138,133,128)" font-size="9" text-anchor="middle" font-family="'JetBrains Mono', monospace">29.996s</text>
  <text x="170" y="224" fill="#e8e4df" font-size="10">ΔΔ ≠ 0 → 샘플마다 타임스탬프를 저장합니다</text>

  <!-- 결과 -->
  <rect x="722" y="86" width="138" height="130" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="791" y="126" fill="#e8e4df" font-size="11" text-anchor="middle">블록이 커집니다</text>
  <text x="791" y="152" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">수백만 샘플이면</text>
  <text x="791" y="170" fill="rgb(212,168,83)" font-size="11" text-anchor="middle">블록마다 GiB</text>
  <text x="791" y="192" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">단위로 불어납니다</text>

  <line x1="20" y1="250" x2="860" y2="250" stroke="rgb(42,37,32)"/>
  <text x="20" y="274" fill="rgb(138,133,128)" font-size="10.5">기본값 <tspan font-family="'JetBrains Mono', monospace" fill="rgb(212,168,83)">2ms</tspan> 안쪽이면 Prometheus 가 타임스탬프를 스스로 정렬합니다. 허용치는 스크레이프 주기의 <tspan fill="#e8e4df">1%</tspan> 까지만 올라갑니다.</text>
</svg>

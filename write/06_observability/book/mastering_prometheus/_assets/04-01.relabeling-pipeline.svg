<svg viewBox="0 0 900 620" width="100%"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif">
  <title>relabeling 두 시점과 각 단계가 버리는 것</title>
  <desc>서비스 디스커버리는 존재하는 타깃을 전부 후보로 낸다. 표준 relabeling 은 스크레이프 전에 돌아 후보 중 감시할 타깃만 남기고, 메트릭 relabeling 은 스크레이프 후 저장 전에 돌아 받아온 시계열 중 보관할 것만 남긴다. 앞은 타깃을 거르고 뒤는 시계열을 거른다. __meta_ 로 시작하는 라벨은 표준 relabeling 이 도는 동안만 보이고 최종 시계열에는 남지 않으므로, 남기려면 replace 로 일반 라벨에 옮겨야 한다.</desc>
  <rect width="900" height="620" fill="#0d0d0d"/>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b8b3ad"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f44336"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e8e4df">relabeling 두 시점</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#b8b3ad">앞은 타깃을, 뒤는 시계열을 거릅니다</text>

  <!-- 1. SD -->
  <rect x="40" y="76" width="180" height="86" rx="9" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.3"/>
  <text x="58" y="99" font-size="12.5" font-weight="700" fill="#e8e4df">1. SD 프로바이더</text>
  <text x="58" y="119" font-size="11" fill="#b8b3ad">존재하는 것 전부</text>
  <rect x="58" y="128" width="144" height="22" rx="4" fill="#dceaf7"/>
  <text x="130" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#10243a">타깃 후보 500</text>

  <line x1="228" y1="119" x2="266" y2="119" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- 2. 표준 relabeling -->
  <rect x="274" y="70" width="230" height="98" rx="9" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.6"/>
  <text x="292" y="93" font-size="12.5" font-weight="700" fill="rgb(212,168,83)">2. relabel_configs</text>
  <text x="292" y="112" font-size="11" fill="#b8b3ad">스크레이프 전</text>
  <rect x="292" y="121" width="194" height="22" rx="4" fill="#fdf3df"/>
  <text x="389" y="137" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">keep · drop · replace</text>
  <text x="292" y="158" font-size="10.5" fill="rgb(212,168,83)">타깃을 고릅니다</text>

  <line x1="512" y1="119" x2="550" y2="119" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- 남은 타깃 -->
  <rect x="558" y="76" width="150" height="86" rx="9" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.3"/>
  <text x="576" y="99" font-size="12.5" font-weight="700" fill="#8fdc93">긁을 타깃</text>
  <rect x="576" y="110" width="114" height="22" rx="4" fill="#e6f7e7"/>
  <text x="633" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#14521d">40 개</text>
  <text x="576" y="150" font-size="10.5" fill="#b8b3ad">나머지는 버려짐</text>

  <!-- 버려짐 1 -->
  <line x1="389" y1="176" x2="389" y2="200" stroke="#f44336" stroke-width="1.4" marker-end="url(#a2)"/>
  <rect x="292" y="206" width="194" height="24" rx="4" fill="#f2d4d4"/>
  <text x="389" y="223" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a1f1f">460 개 · 요청 안 감</text>

  <line x1="633" y1="170" x2="633" y2="248" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- 3. 스크레이프 -->
  <rect x="558" y="256" width="302" height="74" rx="9" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.3"/>
  <text x="576" y="279" font-size="12.5" font-weight="700" fill="#e8e4df">3. 스크레이프</text>
  <rect x="576" y="290" width="120" height="22" rx="4" fill="#f4f9fd"/>
  <text x="636" y="306" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">HTTP GET</text>
  <text x="710" y="306" font-size="10.5" fill="#b8b3ad">타깃당 2,000 시계열</text>

  <line x1="550" y1="293" x2="512" y2="293" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- 4. 메트릭 relabeling -->
  <rect x="274" y="250" width="230" height="98" rx="9" fill="#0d0d0d" stroke="#66bb6a" stroke-width="1.6"/>
  <text x="292" y="273" font-size="12" font-weight="700" fill="#8fdc93">4. metric_relabel_configs</text>
  <text x="292" y="292" font-size="11" fill="#b8b3ad">저장 전</text>
  <rect x="292" y="301" width="194" height="22" rx="4" fill="#e6f7e7"/>
  <text x="389" y="317" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">__name__ 으로 판단</text>
  <text x="292" y="338" font-size="10.5" fill="#8fdc93">시계열을 고릅니다</text>

  <!-- 버려짐 2 -->
  <line x1="389" y1="356" x2="389" y2="380" stroke="#f44336" stroke-width="1.4" marker-end="url(#a2)"/>
  <rect x="292" y="386" width="194" height="24" rx="4" fill="#f2d4d4"/>
  <text x="389" y="403" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a1f1f">1,700 시계열 버림</text>

  <line x1="266" y1="293" x2="228" y2="293" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- 5. TSDB -->
  <rect x="40" y="250" width="180" height="98" rx="9" fill="#0d0d0d" stroke="#b8b3ad" stroke-width="1.3"/>
  <text x="58" y="273" font-size="12.5" font-weight="700" fill="#e8e4df">5. TSDB 저장</text>
  <rect x="58" y="284" width="144" height="22" rx="4" fill="#dceaf7"/>
  <text x="130" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#10243a">300 시계열</text>
  <text x="58" y="322" font-size="10.5" fill="#b8b3ad">여기 남은 것만 조회</text>
  <text x="58" y="340" font-size="10.5" fill="#b8b3ad">__ 라벨은 이미 없음</text>

  <!-- 라벨 수명 -->
  <rect x="40" y="436" width="820" height="76" rx="9" fill="#0d0d0d" stroke="rgb(212,168,83)" stroke-width="1.3"/>
  <text x="58" y="459" font-size="12" font-weight="700" fill="rgb(212,168,83)">__meta_ 라벨의 수명</text>
  <rect x="58" y="470" width="220" height="24" rx="4" fill="#fdf3df"/>
  <text x="168" y="487" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3a2f10">2 단계에서만 보임</text>
  <line x1="286" y1="482" x2="320" y2="482" stroke="#b8b3ad" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="330" y="470" width="220" height="24" rx="4" fill="#f2d4d4"/>
  <text x="440" y="487" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a1f1f">5 단계에는 없음</text>
  <text x="566" y="487" font-size="10.5" fill="#b8b3ad">남기려면 replace 로 옮김</text>

  <!-- 진단 -->
  <rect x="40" y="528" width="820" height="66" rx="9" fill="#0d0d0d" stroke="#5b9bd5" stroke-width="1.3"/>
  <text x="58" y="551" font-size="12" font-weight="700" fill="#8ab6e0">증상으로 자리를 찾습니다</text>
  <rect x="58" y="562" width="380" height="22" rx="4" fill="#dceaf7"/>
  <text x="248" y="578" text-anchor="middle" font-size="10.5" font-weight="700" fill="#10243a">타깃이 안 잡힘 = 2 단계</text>
  <rect x="452" y="562" width="380" height="22" rx="4" fill="#e6f7e7"/>
  <text x="642" y="578" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14521d">시계열이 쌓임 = 4 단계</text>
</svg>

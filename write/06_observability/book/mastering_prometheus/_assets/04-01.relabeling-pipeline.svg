<svg viewBox="0 0 860 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>relabeling 이 일어나는 두 시점</title>
  <desc>서비스 디스커버리가 숨은 메타 라벨을 붙인 후보 타깃을 내면, 스크레이프 전에 표준 relabeling 이 대상을 걸러 라벨을 붙이고, 스크레이프 후 저장 전에 메트릭 relabeling 이 시계열을 버리거나 고친다.</desc>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="rgb(212,168,83)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="340" fill="#0d0d0d"/>
  <text x="20" y="32" fill="#e8e4df" font-size="15">relabeling 이 일어나는 두 시점 — 스크레이프를 사이에 두고</text>

  <text x="20" y="72" fill="rgb(138,133,128)" font-size="10.5">서비스 디스커버리는 후보 타깃과 <tspan font-family="'JetBrains Mono', monospace">__meta_*</tspan> 숨은 라벨을 함께 냅니다. 이 라벨은 relabeling 중에만 보입니다.</text>

  <!-- ① SD -->
  <rect x="20" y="110" width="140" height="64" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="90" y="136" fill="#e8e4df" font-size="12" text-anchor="middle">① SD 프로바이더</text>
  <text x="90" y="155" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">25종 · 배경 갱신</text>

  <!-- ② 표준 relabeling (스크레이프 전) -->
  <rect x="190" y="110" width="140" height="64" fill="rgba(212,168,83,0.13)" stroke="rgb(212,168,83)"/>
  <text x="260" y="136" fill="#e8e4df" font-size="12" text-anchor="middle">② 표준 relabeling</text>
  <text x="260" y="155" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">스크레이프 전</text>

  <!-- ③ 스크레이프 -->
  <rect x="360" y="110" width="140" height="64" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="430" y="136" fill="#e8e4df" font-size="12" text-anchor="middle">③ 스크레이프</text>
  <text x="430" y="155" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">HTTP GET</text>

  <!-- ④ 메트릭 relabeling (스크레이프 후) -->
  <rect x="530" y="110" width="140" height="64" fill="rgba(102,187,106,0.13)" stroke="#66bb6a"/>
  <text x="600" y="136" fill="#e8e4df" font-size="12" text-anchor="middle">④ 메트릭 relabeling</text>
  <text x="600" y="155" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">스크레이프 후 · 저장 전</text>

  <!-- ⑤ TSDB -->
  <rect x="700" y="110" width="140" height="64" fill="rgb(26,26,26)" stroke="rgb(42,37,32)"/>
  <text x="770" y="136" fill="#e8e4df" font-size="12" text-anchor="middle">⑤ TSDB chunk</text>
  <text x="770" y="155" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">시계열 저장</text>

  <!-- 화살표 -->
  <line x1="162" y1="142" x2="184" y2="142" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="332" y1="142" x2="354" y2="142" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="502" y1="142" x2="524" y2="142" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="672" y1="142" x2="694" y2="142" stroke="rgb(212,168,83)" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 하단 주석 -->
  <text x="260" y="200" fill="rgb(212,168,83)" font-size="10" text-anchor="middle">대상 필터링 · 라벨 부여</text>
  <text x="260" y="216" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">keep · drop · replace</text>

  <text x="600" y="200" fill="#66bb6a" font-size="10" text-anchor="middle">시계열 버리기 · 고치기</text>
  <text x="600" y="216" fill="rgb(138,133,128)" font-size="9.5" text-anchor="middle">카디널리티 대응 (7장)</text>

  <text x="20" y="268" fill="rgb(138,133,128)" font-size="10.5"><tspan font-family="'JetBrains Mono', monospace">__</tspan> 로 시작하는 라벨은 relabeling 이 끝나면 제거됩니다. 프로바이더가 노출하는 비-메타 라벨은</text>
  <text x="20" y="286" fill="rgb(138,133,128)" font-size="10.5"><tspan font-family="'JetBrains Mono', monospace">__address__</tspan> 하나뿐이며, 나머지는 잡 설정이나 relabeling 으로 직접 붙여야 합니다.</text>

  <text x="20" y="322" fill="rgb(138,133,128)" font-size="10.5">앰버 = 스크레이프 전 단계 · 초록 = 스크레이프 후 단계</text>
</svg>

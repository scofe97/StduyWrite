<svg viewBox="0 0 900 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Pretendard', -apple-system, 'Noto Sans KR', sans-serif">
  <title>조건부 등록은 두 상황을 같은 화면으로 만듭니다</title>
  <desc>조건부 등록과 미리 등록을 두 행으로, 실패 0건과 앱 죽음을 두 열로 놓아 당직자가 보는 화면을 비교한다. 윗행 조건부 등록에서는 두 열 모두 선이 없는 화면이 되어 두 상황이 구별되지 않는다. 왼쪽은 아무것도 안 해도 되는 상황이고 오른쪽은 지금 대응해야 하는 상황인데 화면이 같으므로 당직자가 판단할 근거가 없다. 아랫행 미리 등록에서는 갈린다. 실패가 0건이면 0 에 붙은 평평한 선이 그려지고 앱이 죽으면 그 선이 사라지므로, 선이 있다는 사실 자체가 앱이 살아서 보고 중이라는 신호가 된다. 오른쪽 아래 칸만 선이 사라지고 나머지 세 칸 중 아래 왼쪽만 평평한 선이 있다.</desc>
  <defs>
    <style>
      .t   { fill: #e8e4df; }
      .dim { fill: rgb(168,163,158); }
      .mono{ font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="440" fill="#0d0d0d"/>

  <text x="24" y="34" class="t" font-size="15">새벽 3시, 선이 없는 화면 — 무엇을 뜻합니까</text>

  <!-- 열 제목 -->
  <text x="390" y="76" class="t" font-size="12" font-weight="700" text-anchor="middle">실패가 0건</text>
  <text x="390" y="94" class="dim" font-size="10" text-anchor="middle">아무것도 안 해도 됨</text>
  <text x="690" y="76" class="t" font-size="12" font-weight="700" text-anchor="middle">앱이 죽음</text>
  <text x="690" y="94" class="dim" font-size="10" text-anchor="middle">지금 대응해야 함</text>

  <!-- 행 제목 -->
  <text x="40" y="164" class="t" font-size="12" font-weight="700">조건부 등록</text>
  <text x="40" y="182" class="mono dim" font-size="9">catch 안에서 counter()</text>
  <text x="40" y="300" class="t" font-size="12" font-weight="700">미리 등록</text>
  <text x="40" y="318" class="mono dim" font-size="9">필드로 register()</text>

  <!-- 1행: 조건부 등록 — 둘 다 빈 화면 -->
  <rect x="250" y="110" width="280" height="96" rx="6" fill="#0d0d0d" stroke="rgb(240,150,190)" stroke-width="1.6"/>
  <line x1="266" y1="188" x2="514" y2="188" stroke="rgb(92,84,74)"/>
  <text x="390" y="158" class="dim" font-size="11" text-anchor="middle">(선 없음)</text>

  <rect x="550" y="110" width="280" height="96" rx="6" fill="#0d0d0d" stroke="rgb(240,150,190)" stroke-width="1.6"/>
  <line x1="566" y1="188" x2="814" y2="188" stroke="rgb(92,84,74)"/>
  <text x="690" y="158" class="dim" font-size="11" text-anchor="middle">(선 없음)</text>

  <rect x="250" y="216" width="580" height="30" rx="5" fill="rgba(240,150,190,0.14)" stroke="rgb(240,150,190)"/>
  <text x="540" y="236" font-size="11.5" font-weight="700" fill="rgb(240,150,190)" text-anchor="middle">같은 화면 — 구별할 방법이 없습니다</text>

  <!-- 2행: 미리 등록 — 갈림 -->
  <rect x="250" y="262" width="280" height="96" rx="6" fill="#0d0d0d" stroke="rgb(102,187,106)" stroke-width="1.6"/>
  <line x1="266" y1="340" x2="514" y2="340" stroke="rgb(92,84,74)"/>
  <line x1="266" y1="330" x2="514" y2="330" stroke="rgb(102,187,106)" stroke-width="2.4"/>
  <text x="390" y="300" font-size="10.5" fill="rgb(102,187,106)" text-anchor="middle">0 에 붙은 평평한 선</text>
  <text x="272" y="352" class="dim" font-size="9">0</text>

  <rect x="550" y="262" width="280" height="96" rx="6" fill="#0d0d0d" stroke="rgb(102,187,106)" stroke-width="1.6"/>
  <line x1="566" y1="340" x2="814" y2="340" stroke="rgb(92,84,74)"/>
  <line x1="566" y1="330" x2="660" y2="330" stroke="rgb(102,187,106)" stroke-width="2.4"/>
  <text x="742" y="326" class="dim" font-size="10.5" text-anchor="middle">여기서 끊깁니다</text>
  <text x="613" y="352" class="dim" font-size="9" text-anchor="middle">앱이 살아 있던 구간</text>

  <rect x="250" y="368" width="580" height="30" rx="5" fill="rgba(102,187,106,0.14)" stroke="rgb(102,187,106)"/>
  <text x="540" y="388" font-size="11.5" font-weight="700" fill="rgb(102,187,106)" text-anchor="middle">갈립니다 — 선이 있다는 것 자체가 "살아서 보고 중" 이라는 신호</text>

  <text x="24" y="424" class="dim" font-size="10">0 을 안 내보내면 <tspan fill="#e8e4df">좋은 상황과 최악의 상황이 같은 그림</tspan>이 됩니다 — 조용한 실패가 여기서 또 한 번 돌아옵니다.</text>
</svg>

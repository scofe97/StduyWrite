<body><noscript><section class="card" style="max-width:760px;margin:40px auto"><h1 style="margin-top:0">Prometheus 3·4·5·8장 핵심</h1><p>3장은 라벨이 시계열을 정하고 샘플이 WAL·head·block으로 저장되는 과정, 역색인이 질의를 이끄는 방식, mmap, 그리고 PromQL의 집계·벡터 매칭과 staleness를 다룹니다. 4장은 서비스 디스커버리와 스크레이프 전후 relabeling을 구분합니다. 5장은 Prometheus의 inactive·pending·firing과 Alertmanager의 그룹핑·라우팅·억제·시간 구간을 분리하고, promtool 룰 단위 테스트와 로드밸런서를 두면 안 되는 HA 구성을 설명합니다. 8장은 Node Exporter collector가 병렬로 실행되며 가장 느린 collector가 timeout을 결정한다는 점을 설명합니다.</p><p>JavaScript를 사용할 수 없으면 같은 폴더의 PDF와 <a href="02-01.%EC%8A%A4%ED%81%AC%EB%A0%88%EC%9D%B4%ED%94%84%EC%99%80%20%EC%A0%80%EC%9E%A5%20%ED%9D%90%EB%A6%84.html">스크레이프·저장 수명주기</a>, <a href="02-02.%EC%95%8C%EB%A6%BC%20%ED%9D%90%EB%A6%84.html">알림 수명주기</a>의 정적 설명을 확인하세요.</p></section></noscript><main class="deck" id="deck"></main><nav class="controls" aria-label="슬라이드 이동"><button id="prev" type="button">이전</button><button id="next" type="button">다음</button><button id="print" type="button">PDF 인쇄</button></nav>
<script>
const S=[
['시작','intro','<p class="tag">MASTERING PROMETHEUS</p><h1>Prometheus가 관측값을<br><span class="accent">믿을 만한 신호</span>로 만드는 과정</h1><p class="lead">데이터가 태어나 저장되고, 대상을 찾고, 경고가 사람에게 도착하기까지를 한 흐름으로 봅니다.</p>','README 장별 목표','기초부터 운영 판단까지','title-slide'],
['시작','intro','<h2>오늘 따라갈 한 줄</h2><p class="lead">대상을 찾는다 → 값을 긁는다 → 시계열로 저장한다 → 규칙을 평가한다 → 알림을 묶어 사람에게 보낸다.</p><div class="grid2"><div class="card"><h3>먼저 짚을 용어 넷</h3><ul><li><strong>메트릭</strong>: 측정 대상의 이름</li><li><strong>라벨</strong>: 같은 메트릭을 쪼개는 꼬리표</li><li><strong>스크레이프</strong>: 서버가 <code>/metrics</code>를 주기적으로 <span class="accent">가져가는</span> 일</li><li><strong>알림</strong>: 조건이 <span class="accent">일정 시간</span> 참일 때 생기는 상태</li></ul></div><div class="card"><h3>오늘의 순서</h3><p><span class="accent">수집</span> 무엇을 긁을지 고르고, 값은 누가 만드는가<br><span class="accent">저장</span> 그 값이 어떤 모양으로 쌓이고 질의되는가<br><span class="accent">알림</span> 두 프로그램의 책임 분리</p></div></div><p class="callout">맨 위 문장의 <span class="accent">다섯 단계를 순서 그대로</span> 따라갑니다. 값이 태어나는 자리에서 시작해, 사람에게 도착하는 데서 끝납니다.</p>','04-01 §전체 흐름 · 03-01 §메트릭·시계열·샘플','전체 지도'],
['수집','divider','<p class="tag">STEP 1 / 3</p><h1>수집 — 무엇을 긁고,<br><span class="accent">값은 누가 만드는가</span></h1><p class="lead">대상을 찾는다 → 값을 긁는다</p><div><span class="pill">서비스 디스커버리</span><span class="pill">relabeling</span><span class="pill">Exporter · collector</span><span class="pill">디버깅</span></div>','04-01 · 08-01','수집 시작','title-slide'],
['수집','ch4','<h2>서비스 디스커버리는 후보만 만듭니다</h2><div class="intro-block"><p class="lead">Prometheus는 스스로 대상을 알지 못합니다. <span class="accent">"어디를 긁어야 하는지" 주소 목록을 대신 받아 오는 일</span>이 서비스 디스커버리입니다.</p><p class="sub">파드는 뜨고 지고 IP도 계속 바뀝니다. 그래서 주소를 설정 파일에 적어 두는 대신, 쿠버네티스나 클라우드의 API에 <strong>주기적으로 다시 물어봅니다.</strong></p><p class="flowline"><b>API에 묻는다</b><span class="arw">→</span><b>후보 목록</b><span class="arw">→</span>relabeling이 고른다<span class="arw">→</span>남은 주소를 긁는다</p></div><div class="grid3"><div class="card"><h3>발견</h3><p>후보 목록과 <code>__meta_*</code> 라벨을 받습니다.</p><p class="muted">아직 <strong>아무것도 긁지 않은</strong> 상태입니다.</p></div><div class="card"><h3>선별</h3><p>relabeling이 <strong>남길 대상</strong>을 결정합니다.</p><p class="muted">여기서 후보 수가 <strong>줄어듭니다.</strong></p></div><div class="card"><h3>스크레이프</h3><p>살아남은 최종 주소로 요청합니다.</p><p class="muted">이때 비로소 <strong>값이 생깁니다.</strong></p></div></div><p class="callout">SD는 <span class="accent">후보만</span> 냅니다. 값은 exporter가 만들고, 무엇을 긁을지는 relabeling이 정합니다 — 셋의 책임이 다릅니다.</p>','04-01 §1 서비스 디스커버리는 후보만 찾습니다','대상 발견'],
['수집','ch4','<h2>relabeling은 두 번 돌고, 거르는 것이 다릅니다</h2><div class="intro-block"><p class="lead">이름이 닮아 헷갈리지만 <span class="accent">놓인 자리가 다르고, 그래서 거르는 대상도 다릅니다.</span></p><p class="sub">앞의 것은 <strong>긁기 전</strong>에 돌아 대상을 고르고, 뒤의 것은 <strong>저장하기 전</strong>에 돌아 시계열을 고릅니다.</p></div><table class="compare"><tr><th></th><th><code>relabel_configs</code></th><th><code>metric_relabel_configs</code></th></tr><tr><td>언제 도는가</td><td>스크레이프 <span class="accent">전</span></td><td>저장 <span class="accent">전</span></td></tr><tr><td>무엇을 거르는가</td><td><strong>타깃</strong> — 긁을 대상</td><td><strong>시계열</strong> — 저장할 값</td></tr><tr><td>무엇이 줄어드는가</td><td>스크레이프 부하 · 네트워크</td><td>카디널리티 · 디스크</td></tr><tr><td>못 하는 일</td><td class="muted">이미 받은 값은 못 거름</td><td class="muted">긁는 것 자체는 못 막음</td></tr></table><p class="question">특정 파드를 <em>아예 긁지 않으려면</em> 어느 쪽일까요?</p><p class="answer">정답: <code>relabel_configs</code>입니다. metric 쪽은 이미 긁은 뒤라 부하가 그대로 듭니다.</p>','04-01 §2 relabeling 은 두 번 돕니다','두 번 돈다'],
['수집','ch4','<h2>후보에서 저장까지, 무엇이 걸러지는가</h2><div class="intro-block"><p class="lead">단계마다 <span class="accent">걸러지는 것도, 남는 라벨도</span> 달라집니다.</p></div><svg class="viz" style="height:432px" viewBox="-6 -6 1282 476" role="img"><title>수집 파이프라인 상세 흐름</title><desc>서비스 디스커버리가 후보와 __meta_ 라벨을 만들고, 타깃 relabeling이 대상을 걸러 스크레이프한 뒤, 메트릭 relabeling이 시계열을 걸러 TSDB에 저장합니다. __meta_ 라벨은 스크레이프 직전에 사라집니다.</desc><defs><marker id="fa" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#d4a853"/></marker></defs><g text-anchor="middle"><rect x="16" y="66" width="176" height="96" rx="11" fill="#1a1a1a" stroke="#72a7d8" stroke-width="3"/><text x="104" y="100" fill="#72a7d8" font-size="18" font-weight="700">① 서비스 발견</text><text x="104" y="126" fill="#e8e4df" font-size="15">쿠버네티스 API</text><text x="104" y="148" fill="#aaa39c" font-size="14">후보 120개</text><rect x="286" y="66" width="212" height="96" rx="11" fill="#1a1a1a" stroke="#d4a853" stroke-width="3"/><text x="392" y="100" fill="#d4a853" font-size="18" font-weight="700">② relabel_configs</text><text x="392" y="126" fill="#e8e4df" font-size="15">keep / drop 으로 선별</text><text x="392" y="148" fill="#66bb6a" font-size="14">타깃 40개만 남음</text><rect x="592" y="66" width="176" height="96" rx="11" fill="#d4a853"/><text x="680" y="100" fill="#0d0d0d" font-size="18" font-weight="700">③ 스크레이프</text><text x="680" y="126" fill="#0d0d0d" font-size="15">HTTP GET /metrics</text><text x="680" y="148" fill="#0d0d0d" font-size="14">시계열 8,000</text><rect x="862" y="66" width="212" height="96" rx="11" fill="#1a1a1a" stroke="#ef6a63" stroke-width="3"/><text x="968" y="100" fill="#ef6a63" font-size="18" font-weight="700">④ metric_relabel</text><text x="968" y="126" fill="#e8e4df" font-size="15">시계열 drop</text><text x="968" y="148" fill="#66bb6a" font-size="14">5,000만 저장</text></g><path d="M192 114H276" stroke="#d4a853" stroke-width="3.5" marker-end="url(#fa)"/><path d="M498 114H582" stroke="#d4a853" stroke-width="3.5" marker-end="url(#fa)"/><path d="M768 114H852" stroke="#d4a853" stroke-width="3.5" marker-end="url(#fa)"/><path d="M1074 114H1150" stroke="#66bb6a" stroke-width="3.5" marker-end="url(#fa)"/><rect x="1160" y="84" width="92" height="60" rx="10" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="1206" y="112" fill="#66bb6a" font-size="17" font-weight="700" text-anchor="middle">TSDB</text><text x="1206" y="132" fill="#e8e4df" font-size="13" text-anchor="middle">저장</text><text x="16" y="212" fill="#aaa39c" font-size="15" font-weight="700">라벨이 살아 있는 구간</text><rect x="16" y="228" width="752" height="52" rx="8" fill="#1c1915" stroke="#d4a853" stroke-width="2" stroke-dasharray="6 4"/><text x="392" y="252" fill="#d4a853" font-size="15" text-anchor="middle">__meta_kubernetes_pod_label_app · __meta_..._node_name · __address__</text><text x="392" y="271" fill="#aaa39c" font-size="13" text-anchor="middle">대상을 고르는 데 쓰는 임시 재료 — 화면에도 보입니다</text><path d="M772 254H852" stroke="#ef6a63" stroke-width="3.5" marker-end="url(#fa)"/><rect x="862" y="228" width="212" height="52" rx="8" fill="#241615" stroke="#ef6a63" stroke-width="2"/><text x="968" y="252" fill="#ef6a63" font-size="15" text-anchor="middle" font-weight="700">__ 로 시작하면 전부 삭제</text><text x="968" y="271" fill="#aaa39c" font-size="13" text-anchor="middle">스크레이프 직후</text><rect x="16" y="308" width="1058" height="60" rx="8" fill="#141b22" stroke="#72a7d8" stroke-width="2"/><text x="36" y="332" fill="#72a7d8" font-size="15" font-weight="700">남기려면 옮겨 담아야 합니다</text><text x="36" y="356" fill="#d9e8f5" font-size="15" font-family="ui-monospace,monospace">source_labels: [__meta_kubernetes_pod_node_name] → target_label: node   (이제 저장됩니다)</text><text x="104" y="396" fill="#72a7d8" font-size="14" text-anchor="middle">주소를 받는다</text><text x="392" y="396" fill="#d4a853" font-size="14" text-anchor="middle">긁을 대상을 고른다</text><text x="680" y="396" fill="#d4a853" font-size="14" text-anchor="middle">값을 가져온다</text><text x="968" y="396" fill="#ef6a63" font-size="14" text-anchor="middle">저장할 값을 고른다</text><path d="M16 414H498" stroke="#2a2520" stroke-width="1"/><path d="M592 414H1074" stroke="#2a2520" stroke-width="1"/><text x="257" y="440" fill="#aaa39c" font-size="15" text-anchor="middle">여기까지는 <tspan fill="#d4a853">타깃</tspan> 개수가 줄어듭니다</text><text x="833" y="440" fill="#aaa39c" font-size="15" text-anchor="middle">여기서는 <tspan fill="#ef6a63">시계열</tspan> 개수가 줄어듭니다</text></svg>','04-01 §2 relabeling · §3 __meta_ 의 수명 · 인라인 SVG','전체 흐름'],
['수집','ch4','<h2>규칙 하나는 부품 다섯으로 읽습니다</h2><div class="intro-block"><p class="lead">규칙은 <span class="accent">"어떤 라벨을 보고, 무엇에 맞으면, 어떻게 한다"</span>의 반복입니다.</p><p class="sub">아래는 <strong>app=api 라벨이 붙은 파드만 긁겠다</strong>는 규칙입니다.</p></div><div class="grid2"><div><code class="big-code">relabel_configs:\n  - source_labels:\n      [__meta_..._label_app]\n    regex: api\n    action: keep</code><p class="sub" style="margin-top:20px">이 네 줄은 이렇게 읽습니다.</p><ol style="margin-top:8px"><li>파드에 붙은 <code>app</code> 라벨 값을 본다</li><li>그 값이 <code>api</code>와 정확히 같은가</li><li>같으면 <strong>남기고</strong>, 아니면 버린다</li></ol></div><div><table class="compare"><tr><th>필드</th><th>뜻</th></tr><tr><td><code>source_labels</code></td><td>어떤 라벨의 값을 볼 것인가</td></tr><tr><td><code>regex</code></td><td>그 값이 이 패턴에 맞는가 <span class="muted">(기본 <code>(.*)</code>)</span></td></tr><tr><td><code>action</code></td><td>맞으면 무엇을 할 것인가 <span class="muted">(기본 <code>replace</code>)</span></td></tr><tr><td><code>target_label</code></td><td>어느 라벨에 쓸 것인가</td></tr><tr><td><code>replacement</code></td><td>실제로 쓸 값 <span class="muted">(기본 <code>$1</code> 첫 캡처)</span></td></tr></table></div></div><p class="callout"><code>regex</code>는 <span class="accent">양쪽 끝이 앵커링</span>됩니다. 부분 일치를 원하면 <code>.*api.*</code>로 풀어야 합니다.</p>','04-01 §3 규칙 하나는 어떻게 읽습니까','규칙 문법'],
['수집','ch4','<h2>후보 수를 바꾸는 액션은 둘뿐입니다</h2><div class="intro-block"><p class="lead"><code>action</code>이 <span class="accent">대상을 줄일지, 라벨만 손댈지</span>를 가릅니다.</p><p class="sub">현행 문서는 액션을 11개 정의하지만 실무에서 손이 가는 것은 아래 다섯입니다.</p></div><div class="grid2"><div><code class="big-code">action: keep    # 남길 것만\naction: drop    # 뺄 것만\n\naction: replace # 값 옮기기\naction: labeldrop\naction: labelmap</code><p class="sub" style="margin-top:20px"><code>keep</code>과 <code>drop</code>은 서로 반대라 <strong>하나로 같은 일을 표현</strong>할 수 있습니다. 정규식이 단순해지는 쪽을 고르는 것이 관례입니다.</p></div><div><table class="compare"><tr><th>액션</th><th>하는 일</th><th>후보 수</th></tr><tr><td><code>keep</code></td><td>매칭되는 것만 남김</td><td class="accent">줄어듦</td></tr><tr><td><code>drop</code></td><td>매칭되는 것을 버림</td><td class="accent">줄어듦</td></tr><tr><td><code>replace</code></td><td>읽은 <strong>값</strong>을 옮겨 씀</td><td class="muted">안 바뀜</td></tr><tr><td><code>labeldrop</code></td><td>라벨 <strong>이름</strong>을 지움</td><td class="muted">안 바뀜</td></tr><tr><td><code>labelmap</code></td><td>라벨 이름을 복사</td><td class="muted">안 바뀜</td></tr></table></div></div><p class="callout"><code>replace</code>는 <span class="accent">값</span>을, <code>labeldrop</code>은 <span class="accent">라벨 자체</span>를 다룹니다. 이름이 비슷해 자주 헷갈리는 자리입니다.</p>','04-01 §3 액션 11개 중 실무 다섯','액션'],
['수집','ch4','<h2>쿠버네티스에서는 Operator가 대신 씁니다</h2><div class="intro-block"><p class="lead">지금까지 본 <span class="accent">SD 설정과 relabeling 규칙을 손으로 쓰지 않습니다.</span></p><p class="sub">사람은 <strong>ServiceMonitor</strong>라는 쿠버네티스 리소스에 "어느 서비스의 어느 포트를 긁어라"만 적고, Operator가 그것을 앞 장에서 본 <strong>실제 scrape 설정으로 번역</strong>합니다.</p><p class="flowline"><b>ServiceMonitor</b> 작성<span class="arw">→</span>Operator가 번역<span class="arw">→</span><b>prometheus.yaml</b> 생성<span class="arw">→</span>사이드카가 재적재</p></div><table class="compare"><tr><th>긁을 대상</th><th>사람이 쓰는 것</th><th>Operator가 하는 일</th></tr><tr><td>K8s Service·Pod</td><td><code>ServiceMonitor</code> · <code>PodMonitor</code></td><td>selector를 <code>kubernetes_sd</code> + relabel 규칙으로 <span class="accent">번역</span></td></tr><tr><td>블랙박스 프로빙</td><td><code>Probe</code></td><td>대응 SD와 스크레이프 설정 생성</td></tr><tr><td>EC2 · 사내 SD</td><td><code>additionalScrapeConfigs</code></td><td class="muted">번역 없음 — 처음부터 SD 문법으로 직접</td></tr></table><p class="callout">두 경로는 <span class="accent">번역 단계가 있느냐</span>로 갈립니다. <code>additionalScrapeConfigs</code>는 YAML을 직접 받지 않고 <span class="accent">Secret의 키</span>를 가리킵니다 — 스크레이프 설정에 자격증명이 섞이기 쉬워 평문 필드를 피한 설계입니다.</p>','04-01 §4 Operator 는 두 경로로 설정을 만듭니다','Operator'],
['수집','ch4','<h2>안 긁힐 때는 증상으로 화면을 고릅니다</h2><div class="intro-block"><p class="lead">여기까지가 대상을 고르는 과정입니다. <span class="accent">문제는 대개 두 화면 중 하나에서 갈립니다.</span></p><p class="sub"><code>/service-discovery</code>는 <strong>발견과 선별</strong>을, <code>/targets</code>는 <strong>연결</strong>을 보여 줍니다. 앞 화면이 정상인데 뒤가 DOWN이면 relabeling은 제 일을 다 한 것이므로 <strong>고칠 곳은 대상 쪽</strong>입니다.</p></div><div class="grid2"><div><table class="compare"><tr><th>증상</th><th>볼 화면</th></tr><tr><td>타깃이 아예 없음</td><td><code>/service-discovery</code></td></tr><tr><td>라벨이 예상과 다름</td><td><code>/service-discovery</code></td></tr><tr><td>타깃은 있는데 DOWN</td><td><code>/targets</code></td></tr></table></div><div><table class="compare"><tr><th><code>lastError</code></th><th>볼 곳</th></tr><tr><td>connection refused</td><td>대상의 바인딩 주소</td></tr><tr><td>404 Not Found</td><td><code>metrics_path</code></td></tr><tr><td>context deadline exceeded</td><td><code>scrape_timeout</code></td></tr></table></div></div><p class="callout"><code>up=0</code>은 <span class="bad">실패했다는 사실만</span> 말합니다. kubeadm 클러스터의 <code>connection refused</code>는 대개 메트릭이 <strong>루프백에만</strong> 바인딩된 것이지 설정 실수가 아닙니다.</p>','04-01 §5 디버깅은 증상으로 화면을 고릅니다','디버깅'],
['수집','ch8','<h2>Exporter는 다른 시스템의 값을 번역합니다</h2><p class="lead">Prometheus 형식으로 말하지 않는 대상(<code>/proc</code>, DB, 장비)을 <span class="accent">대신 통역</span>합니다.</p><div class="grid3"><div class="card"><h3>메트릭 정의</h3><p>이름·HELP·라벨 <strong>형상</strong>을 선언합니다.</p></div><div class="card"><h3>collector</h3><p>실제 값을 <strong>읽는 코드</strong>. 스크레이프마다 실행됩니다.</p></div><div class="card"><h3>레지스트리</h3><p>collector를 모아 <code>/metrics</code>로 <strong>노출</strong>합니다.</p></div></div><p class="callout"><code>Describe</code>는 <span class="accent">등록 때 형상</span>을, <code>Collect</code>는 <span class="accent">스크레이프 때 최신 값</span>을 냅니다. 값을 미리 담아 두지 않는다는 뜻입니다.</p>','08-01 §1 exporter 란 무엇인가 · §2 exporter 의 세 부품','해부'],
['수집','ch8','<h2>collector는 병렬로 실행됩니다</h2><div class="grid3"><div class="card"><h3>cpu</h3><p><code>/proc/stat</code></p></div><div class="card"><h3>meminfo</h3><p><code>/proc/meminfo</code></p></div><div class="card"><h3>filesystem</h3><p>마운트·파일시스템</p></div></div><p class="lead">전체 응답 시간 ≈ <span class="accent">가장 느린 collector 하나</span></p><p class="callout">collector 수의 <span class="bad">합이 아니라 최댓값</span>이 병목입니다. 기본 활성 collector는 45개이고, 각각 고루틴으로 동시에 돕니다.</p><p class="question">스크레이프가 느릴 때 collector 시간을 모두 더해야 할까요?</p><p class="answer">정답: 아닙니다. 병렬이므로 가장 오래 걸린 하나를 봅니다.</p>','08-01 §2 collector 고루틴 병렬 실행','병렬 실행'],
['수집','ch8','<h2>메모리는 free와 available을 구분합니다</h2><table class="compare"><tr><th>메트릭</th><th>뜻</th></tr><tr><td><code>node_memory_MemTotal_bytes</code></td><td>설치된 총 메모리</td></tr><tr><td class="ok"><code>node_memory_MemAvailable_bytes</code></td><td><span class="accent">쓸 수 있는</span> 메모리 (free + 회수 가능분)</td></tr><tr><td><code>node_memory_MemFree_bytes</code></td><td>즉시 쓸 수 있는 free만</td></tr></table><p class="callout"><strong>free</strong>는 아무도 안 쓰는 메모리, <strong>available</strong>은 지금 버퍼·캐시로 쓰이지만 <span class="accent">필요하면 회수되는 것까지</span> 포함합니다.</p><p class="callout">대시보드나 임계값에 <code>MemFree</code>를 쓰면 <span class="bad">멀쩡한 서버가 메모리 부족으로 보입니다.</span> 리눅스는 남는 메모리를 캐시로 쓰기 때문입니다.</p>','08-01 §3 meminfo collector','메모리'],
['수집','ch8','<h2>loadavg 대신 pressure를 보십시오</h2><div class="grid2"><div class="card"><h3 class="bad">loadavg — 쓰지 마십시오</h3><p>커널 소스의 주석이 이렇게 적혀 있습니다.<br><span class="muted">"Its a silly number but people think its important."</span></p><p>부하 평균이 높다고 체감되는 문제가 있는 것은 아닙니다.</p></div><div class="card"><h3 class="ok">pressure (PSI)</h3><p>커널 4.20+. 디스크 I/O·메모리·CPU 경합으로 <strong>일을 못 한 시간</strong>을 직접 잽니다.</p></div></div><table class="compare"><tr><th>범주</th><th>뜻</th></tr><tr><td>waiting</td><td>기다리는 프로세스는 있지만 스케줄러가 <span class="accent">다른 일을 찾음</span></td></tr><tr><td class="bad">stalled</td><td>아무 일도 못 찾아 <span class="bad">CPU 사이클을 통째로 버림</span> — 심각</td></tr></table><p class="callout">디스크·메모리 pressure는 <span class="ok">감시할 값으로 우선 고르십시오.</span> CPU pressure는 stalled가 없고 기존 사용률 지표와 겹쳐 효용이 덜합니다.</p>','08-01 §3 loadavg · pressure(PSI)','부하 판단'],
['수집','ch8','<h2>타임아웃은 duration으로 범인을 찾습니다</h2><code class="big-code">node_scrape_collector_duration_seconds</code><div class="grid2"><div class="card"><h3>먼저 볼 것</h3><p>collector별 소요 시간. <code>scrape_timeout</code>에 가까운 <strong>하나</strong>를 찾습니다.</p></div><div class="card"><h3>오해하기 쉬운 것</h3><p><code>node_scrape_collector_success=0</code>은 <span class="accent">하드웨어 부재</span>일 수도 있습니다. 실패가 아닌 경우가 많습니다.</p></div></div><p class="callout">느린 collector는 <code>--no-collector.&lt;이름&gt;</code>으로 끕니다. 전부 켜 두는 것이 항상 옳지는 않습니다.</p>','08-01 §5 트러블슈팅 · duration vs success','타임아웃'],
['수집','ch8','<h2>textfile collector는 짧은 작업의 기록을 노출합니다</h2><p class="lead">cron 작업 → <code>.prom</code> 파일 → Node Exporter <code>/metrics</code></p><div class="grid2"><div class="card"><h3>왜 필요한가</h3><p>백업·배치처럼 <strong>금방 끝나는</strong> 작업은 Prometheus가 긁으러 왔을 때 이미 죽어 있습니다.</p></div><div class="card"><h3>필수 설정</h3><p><code>--collector.textfile.directory</code>와 <code>.prom</code> 확장자</p></div></div><p class="callout">조용한 실패 방지 — <code>node_textfile_mtime_seconds</code>로 <span class="accent">파일이 오래됐는지</span> 감시합니다. 파일이 갱신되지 않아도 옛 값은 계속 노출되기 때문입니다.</p><p class="lab"><strong>실습 관찰</strong> · 잘못된 파일은 <code>node_textfile_scrape_error=1</code>로 드러났지만 다른 node 메트릭은 계속 수집됐습니다.</p>','08-01 §4 textfile collector · notification-lab 2026-07-28','단명 작업'],
['수집','ch8','<h2>복습: exporter를 의심하는 순서</h2><table class="compare"><tr><th>증상</th><th>먼저 볼 것</th></tr><tr><td>스크레이프가 느림 / timeout</td><td><code>collector_duration_seconds</code> 최댓값</td></tr><tr><td>특정 메트릭이 없음</td><td>그 collector가 켜져 있나, <code>success</code></td></tr><tr><td>배치 작업 기록이 안 보임</td><td><code>textfile</code> 디렉토리와 <code>mtime</code></td></tr><tr><td>메모리가 부족해 보임</td><td><code>MemFree</code>를 보고 있진 않은가</td></tr></table><p class="question">전체 스크레이프 시간이 3초입니다. collector가 45개일 때 평균 소요는?</p><p class="answer">정답: 평균을 구할 수 없습니다. 병렬이라 3초는 <span class="accent">가장 느린 하나</span>의 시간입니다.</p>','08-01 §5 트러블슈팅 종합','회상'],
['저장','divider','<p class="tag">STEP 2 / 3</p><h1>저장 — 그 값이<br><span class="accent">어떤 모양으로 쌓이는가</span></h1><p class="lead">시계열로 저장한다 → 질의한다</p><div><span class="pill">메트릭·라벨·샘플</span><span class="pill">WAL · head · block</span><span class="pill">인덱스 · 컴팩션</span><span class="pill">PromQL</span></div>','03-01 ~ 03-04','저장 시작','title-slide'],
['저장','ch3','<h2>라벨 전체가 시계열 하나를 정합니다</h2><div class="grid3"><div class="card"><h3>메트릭</h3><p>무엇을 재는가<br><code>requests_total</code></p></div><div class="card"><h3>시계열</h3><p>이름 + <strong>라벨 전체</strong><br><code>{job="api",method="GET"}</code></p></div><div class="card"><h3>샘플</h3><p>특정 시각의 값<br><code>12:00 → 842</code></p></div></div><p class="lead"><code>http_requests_total{method="GET",status="200"}</code></p><div class="grid2"><div class="card"><h3>좋은 라벨</h3><p>값 종류가 제한적이고 실제로 질문에 씁니다. <code>method</code>, <code>status</code>, <code>job</code></p></div><div class="card"><h3>위험한 라벨</h3><p class="bad">값이 계속 새로 생깁니다.</p><p><code>user_id</code>, <code>request_id</code>, <code>trace_id</code></p></div></div><p class="callout">라벨 값 하나가 달라지면 <span class="accent">별도의 시계열</span>이 생깁니다. 사용자 100만 명을 <code>user_id</code>로 넣으면 시계열 100만 개 — 이것이 <span class="accent">카디널리티 비용</span>입니다.</p>','03-01 §1 데이터 모델 3층 · §라벨 셋 · 07-01 §카디널리티','데이터 모델'],
['저장','ch3','<h2>타입은 관측 하나가 시계열 몇 개가 되는지를 정합니다</h2><table class="compare"><tr><th>타입</th><th>관측 1개 → 시계열</th><th>값의 움직임</th><th>쓰는 곳</th></tr><tr><td>Counter</td><td>1개</td><td>오르기만</td><td>요청 수, 오류 개수</td></tr><tr><td>Gauge</td><td>1개</td><td>오르내림</td><td>커넥션 수, 메모리</td></tr><tr><td>Histogram</td><td class="accent"><strong>버킷 수 + 2</strong></td><td>버킷마다 카운터</td><td>지연 분포, SLO</td></tr><tr><td>Summary</td><td class="accent"><strong>분위수 개수</strong></td><td>관측마다 재계산</td><td>단일 인스턴스 지연</td></tr></table><p class="callout">타입은 저장 방식을 바꾸지 않지만 <span class="accent">어떤 PromQL 함수를 쓸 수 있는지</span>를 정합니다. 뒤 두 타입은 관측 하나가 여러 시계열을 동시에 건드립니다 — 카디널리티가 여기서 다시 나옵니다.</p><p class="question">여러 인스턴스의 p95를 합쳐 보려면 Histogram과 Summary 중 무엇일까요?</p><p class="answer">정답: Histogram입니다. Summary는 클라이언트가 미리 계산해 버려 합산할 수 없습니다.</p>','03-01 §2 메트릭 타입 네 가지','타입'],
['저장','ch3','<h2>샘플 하나는 WAL과 head로 동시에 갑니다</h2><svg class="viz" viewBox="0 0 1050 300" role="img"><title>TSDB 쓰기 경로</title><desc>스크레이프 샘플이 WAL에 먼저 기록되고 head를 거쳐 영속 블록이 됩니다.</desc><defs><marker id="a7" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#d4a853"/></marker></defs><rect x="20" y="100" width="150" height="80" rx="12" fill="#d4a853"/><text x="95" y="133" fill="#0d0d0d" text-anchor="middle" font-size="19" font-weight="700">스크레이프</text><text x="95" y="159" fill="#0d0d0d" text-anchor="middle" font-size="15">샘플 1개</text><path d="M170 140H265V62H350" fill="none" stroke="#d4a853" stroke-width="4" marker-end="url(#a7)"/><path d="M265 140V222H350" fill="none" stroke="#d4a853" stroke-width="4" marker-end="url(#a7)"/><rect x="360" y="22" width="250" height="82" rx="12" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="485" y="56" fill="#66bb6a" text-anchor="middle" font-size="20" font-weight="700">1. WAL</text><text x="485" y="82" fill="#e8e4df" text-anchor="middle" font-size="15">재시작 복구용</text><rect x="360" y="182" width="250" height="82" rx="12" fill="#1a1a1a" stroke="#72a7d8" stroke-width="3"/><text x="485" y="216" fill="#72a7d8" text-anchor="middle" font-size="20" font-weight="700">2. head</text><text x="485" y="242" fill="#e8e4df" text-anchor="middle" font-size="15">메모리 · 현재 구간</text><path d="M610 222H735" stroke="#d4a853" stroke-width="4" marker-end="url(#a7)"/><text x="672" y="210" fill="#aaa39c" text-anchor="middle" font-size="14">2시간마다</text><rect x="745" y="182" width="255" height="82" rx="12" fill="#1a1a1a" stroke="#d4a853" stroke-width="3"/><text x="872" y="216" fill="#d4a853" text-anchor="middle" font-size="20" font-weight="700">3. 영속 블록</text><text x="872" y="242" fill="#e8e4df" text-anchor="middle" font-size="15">디스크 · 불변</text></svg><p class="lab"><strong>▶ 여기서 시연</strong> · <code>02-01.스크레이프와 저장 흐름.html</code>을 열어 단계를 넘겨 가며 봅니다.</p>','03-02 §2 샘플 하나가 걸어가는 길 · 인라인 SVG','쓰기 경로'],
['저장','ch3','<h2>WAL은 아직 블록이 아닌 데이터를 지킵니다</h2><div class="grid2"><div class="card"><h3>정상 실행</h3><p>샘플이 WAL에 <strong>먼저</strong> 기록되고, head(메모리)에도 담깁니다. 2시간마다 head가 잘려 디스크 블록이 됩니다.</p></div><div class="card"><h3>재시작</h3><p>메모리의 head는 사라집니다. WAL을 <strong>재생(replay)</strong>해 head를 되살립니다.</p></div></div><p class="callout">WAL이 없으면 <span class="bad">최대 2시간치 샘플이 재시작마다 증발합니다.</span> 내구성이 여기서 옵니다.</p><p class="question">head가 메모리에 있는데도 재시작 후 데이터가 남는 이유는?</p><p class="answer">정답: 같은 샘플이 WAL에도 디스크에 기록돼 있어 재생으로 복구되기 때문입니다.</p>','03-02 §3 WAL — 내구성은 여기서 옵니다 · §4 head chunk 생명주기','WAL'],
['저장','ch3','<h2>블록은 불변이고, 그 제약이 나머지를 규정합니다</h2><div class="grid2"><div class="card"><h3>chunks</h3><p>압축된 실제 샘플</p></div><div class="card"><h3>index</h3><p>라벨에서 시계열 위치를 찾는 역색인</p></div><div class="card"><h3>meta.json</h3><p>시간 범위와 통계</p></div><div class="card"><h3>tombstones</h3><p>삭제할 구간 <strong>표시</strong></p></div></div><table class="compare"><tr><th>하고 싶은 일</th><th>불변이라 실제로 하는 일</th></tr><tr><td>샘플 삭제</td><td>지우지 않고 <span class="accent">tombstone으로 표시</span></td></tr><tr><td>작은 블록 정리</td><td>고치지 않고 <span class="accent">합쳐서 새로 씀</span> (컴팩션)</td></tr><tr><td>오래된 데이터 만료</td><td>샘플이 아니라 <span class="accent">폴더째 삭제</span> (보존)</td></tr></table>','03-03 §1 블록과 chunk — 불변이 모든 것을 결정합니다','저장 구조'],
['저장','ch3','<h2>인덱스는 라벨에서 샘플까지 두 단을 거칩니다</h2><div class="grid2"><div class="card"><h3>포스팅 — 라벨 → ID</h3><p>라벨 조합마다 시리즈 ID 집합. 셀렉터가 여럿이면 <span class="accent">교집합</span>입니다.</p></div><div class="card"><h3>시리즈 — ID → 위치</h3><p>그 ID로 chunk가 어디 있는지 찾습니다.</p></div></div><code class="big-code">{job="kubelet"}    → [10, 11, 17]\n{env="production"} → [7, 9, 11, 13, 17]\n교집합             → [11, 17]   ← 실제로 읽을 대상</code><p class="callout">인덱스가 없으면 블록은 <span class="bad">읽을 수 없습니다.</span> 질의 속도는 이 두 단이 만듭니다.</p>','03-03 §2 인덱스 — 역색인이 질의를 이끕니다','인덱스'],
['저장','ch3','<h2>컴팩션이 키우고 보존이 지웁니다</h2><p class="lead"><span class="pill">2시간</span> ×3 → <span class="pill">6시간</span> ×3 → <span class="pill">18시간</span> ×3 → <span class="pill">54시간</span></p><div class="grid2"><div class="card"><h3>컴팩션 — 합쳐서 키움</h3><p>2시간 블록마다 <span class="accent">비슷한 인덱스가 반복</span>되는 낭비를 덜어냅니다. 작은 블록 3개 이상이 모이면 한 단계 올라갑니다. 질의가 열 파일 수가 줄고, tombstone 구간은 이때 빠집니다.</p></div><div class="card"><h3>보존 — 지움</h3><p>시간·크기 임계를 넘긴 블록을 <strong>디렉토리째</strong> 삭제합니다. 블록 밖에서 안을 가리키는 참조가 없어 정리가 단순합니다.</p></div></div><p class="callout">둘 다 <span class="accent">1분마다</span> 돕니다. 보존이 "샘플 단위"가 아닌 이유는 앞 장의 <span class="accent">불변성</span> 때문입니다.</p>','03-03 §3 컴팩션과 보존','수명주기'],
['저장','ch3','<h2>PromQL은 순간과 범위에서 출발합니다</h2><div class="grid2"><div class="card"><h3>순간 벡터 <code>up</code></h3><p>시계열마다 <strong>지금 값 하나</strong></p></div><div class="card"><h3>범위 벡터 <code>up[5m]</code></h3><p>지난 5분의 <strong>값들</strong>. 대괄호가 경계입니다.</p></div></div><code class="big-code">rate(http_requests_total[5m])   지난 5분의 Counter → 초당 평균 증가량\nsum by (job) (rate(...))        job만 남기고 나머지 라벨을 접음</code><div class="grid2"><div class="card"><h3><code>by</code> — 닫힌 목록</h3><p>남길 라벨을 적습니다. 새 라벨이 생겨도 결과가 그대로라 <span class="accent">변화에 강합니다.</span></p></div><div class="card"><h3><code>without</code> — 열린 목록</h3><p>버릴 라벨을 적습니다. 새 라벨이 생기면 <span class="bad">결과가 쪼개집니다.</span></p></div></div>','03-04 §2 순간·범위 벡터 · §6 연산자 — 집계','PromQL'],
['저장','ch3','<h2>그래프의 구멍은 대개 staleness입니다</h2><p class="lead">질의는 <span class="accent">5분</span>(<code>lookback delta</code>)을 거슬러 값을 찾고, 없으면 시계열이 사라진 것처럼 보입니다.</p><table class="compare"><tr><th>화면</th><th>실제 상황</th><th>해야 할 일</th></tr><tr><td>선 없음</td><td>그 사유의 실패가 <span class="ok">0건</span></td><td class="muted">아무것도 안 해도 됨</td></tr><tr><td>선 없음</td><td class="bad">앱이 죽어 메트릭을 못 냄</td><td class="bad">지금 대응</td></tr></table><p class="callout">같은 화면인데 <span class="accent">해야 할 일이 정반대</span>입니다. 값이 0이어도 같은 메트릭을 계속 내보내야 둘이 갈립니다 — <span class="accent">0인 평평한 선 자체가 "살아 있다"는 신호</span>입니다.</p><p class="lab"><strong>실무 수칙</strong> · 조건이 맞을 때만 메트릭을 등록하는 코드는 그래프에 구멍을 냅니다. 앱 시작 시 미리 등록하십시오.</p>','03-04 §5 staleness — 그래프의 구멍은 대개 이것입니다','staleness'],
['저장','ch8','<h2>배운 PromQL로 실제 값을 읽어 봅니다</h2><p class="lead">Node Exporter의 CPU는 백분율이 아니라 <span class="accent">각 모드에서 보낸 초</span>로 나옵니다.</p><code class="big-code">sum without (cpu, mode) (\n  rate(node_cpu_seconds_total{mode!="idle"}[5m])\n)</code><div class="grid2"><div class="card"><h3>결과의 뜻</h3><p>비유휴 시간의 비율. CPU가 하나면 최대 <code>1.0</code>, 둘이면 <code>2.0</code> — <span class="accent">코어 수만큼 커집니다.</span></p></div><div class="card"><h3>0~100%로 정규화</h3><p>코어 수로 나눕니다.<br><code>count without (cpu, mode) (node_cpu_seconds_total{mode="idle"})</code></p></div></div><p class="callout"><code>mode="idle"</code>은 취향이 아니라 <span class="accent">필수</span>입니다. 이 메트릭은 <code>(코어 × 모드)</code>만큼의 시계열이라, 모드를 하나로 고정해야 <code>count</code>가 코어 수가 됩니다.</p>','08-01 §3 cpu collector · 03-04 §6 집계','PromQL 적용'],
['알림','divider','<p class="tag">STEP 3 / 3</p><h1>알림 — 조건이 참일 때<br><span class="accent">누구에게 어떻게 닿는가</span></h1><p class="lead">규칙을 평가한다 → 묶어서 보낸다</p><div><span class="pill">inactive · pending · firing</span><span class="pill">그룹핑 · 라우팅</span><span class="pill">억제 · 시간 구간</span><span class="pill">룰 테스트 · HA</span></div>','05-01 · 05-02','알림 시작','title-slide'],
['알림','ch5','<h2>알림은 두 프로그램이 나눠 맡습니다</h2><div class="grid2"><div class="card"><h3>Prometheus</h3><ul><li>PromQL 규칙 평가</li><li>inactive / pending / firing</li><li>firing 알림을 <strong>전달</strong></li></ul></div><div class="card"><h3>Alertmanager</h3><ul><li>그룹핑과 라우팅</li><li>억제와 침묵</li><li>Slack·메일 <strong>발송</strong></li></ul></div></div><p class="callout">이 장의 단 하나의 메시지 — <span class="accent">두 상태는 다른 것입니다.</span> Prometheus는 알림을 <span class="bad">보내지 않습니다.</span></p><p class="lab"><strong>실습 관찰</strong> · Alertmanager를 멈춰도 Prometheus의 firing은 유지됐고 새 통지만 끊겼습니다.</p>','05-01 §1 Prometheus 와 Alertmanager 의 분업 · notification-lab 2026-07-28','책임 분리'],
['알림','ch5','<h2><code>for</code>는 순간 이상과 지속 이상을 가릅니다</h2><svg class="viz" viewBox="0 0 1050 280" role="img"><title>두 알림 상태 머신</title><desc>Prometheus에서 inactive, pending, firing으로 변한 뒤 Alertmanager에서 그룹과 억제와 통지를 처리합니다.</desc><defs><marker id="a20" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#d4a853"/></marker></defs><text x="25" y="30" fill="#72a7d8" font-size="16" font-weight="700">PROMETHEUS · 규칙 평가</text><g font-size="18" text-anchor="middle"><rect x="25" y="55" width="170" height="72" rx="36" fill="#1a1a1a" stroke="#aaa39c" stroke-width="3"/><text x="110" y="98" fill="#e8e4df">inactive</text><path d="M195 91H255" stroke="#d4a853" stroke-width="4" marker-end="url(#a20)"/><text x="225" y="78" fill="#aaa39c" font-size="13">조건 참</text><rect x="265" y="55" width="170" height="72" rx="36" fill="#1a1a1a" stroke="#d4a853" stroke-width="3"/><text x="350" y="98" fill="#d4a853">pending</text><path d="M435 91H495" stroke="#d4a853" stroke-width="4" marker-end="url(#a20)"/><text x="465" y="78" fill="#aaa39c" font-size="13">for 충족</text><rect x="505" y="55" width="170" height="72" rx="36" fill="#1a1a1a" stroke="#ef6a63" stroke-width="3"/><text x="590" y="98" fill="#ef6a63">firing</text><path d="M675 91H755" stroke="#d4a853" stroke-width="4" marker-end="url(#a20)"/><rect x="765" y="45" width="255" height="92" rx="12" fill="#1a1a1a" stroke="#66bb6a" stroke-width="3"/><text x="892" y="80" fill="#66bb6a">Alertmanager</text><text x="892" y="110" fill="#e8e4df" font-size="16">그룹 · 억제 · 발송</text></g><text x="25" y="180" fill="#aaa39c" font-size="15">조건이 거짓이 되면 pending은 초기화됩니다 — 이 구간이 짧은 실패에 지워집니다.</text><rect x="765" y="165" width="255" height="62" rx="10" fill="#1a1a1a" stroke="#66bb6a" stroke-width="2"/><text x="892" y="190" fill="#e8e4df" text-anchor="middle" font-size="15">수신 / 억제 / 통지</text><text x="892" y="213" fill="#aaa39c" text-anchor="middle" font-size="13">Prometheus 상태와 별개</text></svg><p class="lab"><strong>Kind 실습</strong> · 평가 주기 30초보다 짧은 <code>for: 10s</code>는 다음 평가에서 바로 firing됐고, <code>for: 2m</code>은 pending이 보였습니다.<br><strong>▶ 여기서 시연</strong> · <code>02-02.알림 흐름.html</code>에서 세 시나리오를 비교합니다.</p>','05-02 §2 for 기간이 알림의 품질을 가른다 · notification-lab 2026-08-05','상태'],
['알림','ch5','<h2><code>for</code>를 얼마로 둘지에는 경험칙이 있습니다</h2><div class="grid2"><div class="card"><h3>warning</h3><p><span class="accent">15분보다 짧지 않게.</span> 1~2시간짜리 <code>for</code>를 겁내지 마십시오.</p></div><div class="card"><h3>critical</h3><p><span class="accent">15분보다 길지 않게.</span> 짧은 <code>for</code>(<code>0m</code>·<code>5m</code>)는 여기에 아껴 둡니다.</p></div></div><p class="callout">놓치기 쉬운 제약 — <code>for</code>는 <span class="accent">룰 평가 주기보다 길어야</span> 의미가 있습니다. 5분마다 평가하면서 <code>for: 3m</code>을 걸면 그 3분은 <span class="bad">아무 일도 하지 않습니다.</span></p><div class="grid2"><div class="card"><h3>반대편 손잡이 <code>keep_firing_for</code></h3><p><code>for</code>가 <strong>발화 전</strong> 대기라면, 이것은 조건이 거짓이 된 <strong>뒤에도</strong> firing을 유지하는 시간입니다.</p></div><div class="card"><h3>왜 필요한가</h3><p>조건이 참·거짓을 오갈 때 <span class="bad">해소와 발화가 번갈아 쏟아지는 것</span>을 막습니다.</p></div></div>','05-02 §2 for 경험칙과 평가 주기 제약 · keep_firing_for','for 튜닝'],
['알림','ch5','<h2>짧은 실패가 <code>for</code>를 되돌릴 수 있습니다</h2><p class="lead">조건 14분 참 → 스크레이프 <span class="bad">한 번</span> 실패 → pending <span class="bad">0분</span></p><div class="grid2"><div class="card"><h3>왜 생기나</h3><p>데이터 공백이 조건을 <strong>거짓처럼</strong> 만듭니다. 앞 장의 staleness가 알림에서 되돌아오는 자리입니다.</p></div><div class="card"><h3>보강</h3><p><code>last_over_time()</code>으로 짧은 공백을 견딥니다. <code>max_over_time()</code>은 추가 지연이 붙습니다.</p></div></div><p class="callout">허용 구간은 <span class="accent">진짜 장애를 숨기지 않도록</span> 의도적으로 정합니다. 무작정 늘리면 탐지가 늦어집니다.</p>','05-02 §3 스크레이프 실패가 for 를 지운다','견고성'],
['알림','ch5','<h2>그룹핑은 폭풍을 한 묶음으로 바꿉니다</h2><p class="lead">노드 100대가 한꺼번에 죽으면 메일 100통이 아니라 <span class="accent">한 통</span>이어야 합니다.</p><div class="grid3"><div class="card"><h3>group_wait</h3><p>첫 알림 뒤 같은 그룹을 <strong>모으는</strong> 시간<br><span class="muted">기본 30초</span></p></div><div class="card"><h3>group_interval</h3><p>같은 그룹에 <strong>변경</strong>이 생겼을 때 다음 통지까지<br><span class="muted">기본 5분</span></p></div><div class="card"><h3>repeat_interval</h3><p>변화가 없어도 <strong>다시</strong> 알리는 주기<br><span class="muted">기본 4시간</span></p></div></div><p class="lab"><strong>실습 관찰</strong> · <code>group_by: [alertname]</code>에서 같은 값의 firing 두 건이 <code>group_wait</code> 안에 들어와 메일 한 통 <code>[FIRING:2]</code>이 됐습니다.</p>','05-01 §4 그룹핑 — 100개의 알림을 한 통으로 · notification-lab 2026-07-28','그룹핑'],
['알림','ch5','<h2>라우트 트리와 시간 구간이 수신자를 정합니다</h2><code class="big-code">severity="critical" → on-call\nteam="payments"     → payments-slack</code><div class="grid2"><div class="card"><h3>기본 동작</h3><p>첫 번째로 <strong>맞는</strong> 자식 라우트에서 멈춥니다.</p></div><div class="card"><h3><code>continue: true</code></h3><p>맞은 뒤에도 <strong>다음 형제</strong> 라우트를 계속 확인합니다.</p></div></div><div class="grid2"><div class="card"><h3><code>mute_time_intervals</code></h3><p>이 시간대에는 발송하지 않습니다. warning을 업무 시간에만 받을 때.</p></div><div class="card"><h3><code>active_time_intervals</code></h3><p>이 시간대에만 발송합니다.</p></div></div><p class="callout">시간 구간은 <span class="bad">최상위 라우트에는 걸 수 없습니다.</span> 구간 밖이면 발송만 멈출 뿐 <span class="accent">라우팅 탐색은 계속됩니다.</span></p>','05-01 §2 라우팅 · §3 continue · §5 시간 구간','라우팅'],
['알림','ch5','<h2>억제는 원인이 결과 알림을 가립니다</h2><p class="lead">DB가 죽으면 API 오류도 함께 터집니다. 당직자가 볼 것은 <span class="accent">원인 하나</span>입니다.</p><div class="grid3"><div class="card"><h3>source</h3><p class="bad">가리는 쪽</p><p><code>DBDown</code></p></div><div class="card"><h3>target</h3><p class="muted">가려지는 쪽</p><p><code>APIHighError</code></p></div><div class="card"><h3>equal</h3><p class="accent">값이 같아야 할 라벨</p><p><code>cluster</code>, <code>service</code></p></div></div><p class="callout"><code>equal</code>이 없으면 <span class="bad">다른 클러스터의 장애까지 가려집니다.</span> 하위 알림은 Prometheus에서 <span class="accent">여전히 firing</span>이고 통지만 막힙니다.</p>','05-01 §6 리시버와 억제 규칙','억제'],
['알림','ch5','<h2><code>promtool test rules</code>로 알림을 테스트합니다</h2><code class="big-code">promtool check rules rule.yaml   문법만 검사\npromtool test rules unit.yaml    기대대로 발화하는지 검사</code><div class="grid2"><div class="card"><h3>왜 <code>amtool</code>이 아닌가</h3><p>알림은 <span class="accent">Prometheus 안에서</span> 정의되고 평가되기 때문입니다. amtool은 Alertmanager 쪽 검증입니다.</p></div><div class="card"><h3>무엇을 단언하나</h3><p>시계열을 지어 넣고 "<strong>몇 분에</strong> 무엇이 <strong>어떤 라벨로</strong> 발화해야 하는지"를 적습니다.</p></div></div><p class="callout">사고 시간대에 쿼리를 돌려 보는 방식은 유효하지만, <span class="bad">룰을 손본 뒤에도 계속 동작하리라는 보장은 주지 못합니다.</span> 알림도 코드입니다.</p>','05-02 §4 알림 룰 단위 테스트','룰 테스트'],
['알림','ch5','<h2>Alertmanager 앞에 로드밸런서를 두지 마십시오</h2><div class="grid2"><div class="card"><h3>가십이 공유하는 것</h3><p>침묵, 그리고 <span class="ok">어떤 그룹을 이미 보냈는지.</span> 덕분에 같은 알림이 여러 번 가지 않습니다.</p></div><div class="card"><h3>공유하지 않는 것</h3><p class="bad">어떤 알림을 받았는지.</p><p>그래서 Prometheus가 <strong>모든 인스턴스</strong>에 직접 보내야 합니다.</p></div></div><p class="callout">LB로 한 대만 받게 하면, 그 인스턴스가 죽었을 때 나머지는 알림의 <span class="bad">존재 자체를 몰라</span> 대신 보낼 수 없습니다.</p><p class="answer">합의 알고리듬을 쓰지 않아 정족수가 필요 없습니다. 보통 2~3대를 서로 다른 AZ에 둡니다.</p>','05-01 §9 HA — 로드밸런서를 앞에 두지 마십시오','HA'],
['종합','synthesis','<h2>한 번의 스크레이프가 끝까지 가는 길</h2><ol><li>서비스 디스커버리가 <strong>후보</strong>를 냅니다.</li><li><code>relabel_configs</code>가 긁을 <strong>대상</strong>을 고릅니다.</li><li>Exporter의 collector가 <strong>값</strong>을 만듭니다.</li><li><code>metric_relabel_configs</code>가 저장할 <strong>시계열</strong>을 고릅니다.</li><li>TSDB가 <strong>WAL · head · block</strong>에 저장합니다.</li><li>규칙 평가 뒤 firing 알림이 <strong>Alertmanager</strong>로 갑니다.</li></ol><p class="callout">오늘 본 세 구간이 각각 이 흐름의 <span class="accent">한 토막</span>이었습니다 — 수집(1~4) · 저장(5) · 알림(6).</p>','수집·저장·알림·Exporter 종합','통합 지도'],
['종합','synthesis','<h2>장애가 보이지 않을 때 확인할 경계</h2><table class="compare"><tr><th>증상</th><th>경계</th><th>도구 / 신호</th></tr><tr><td>타깃 없음</td><td>SD → target relabel</td><td><code>/service-discovery</code>, <code>/targets</code></td></tr><tr><td>scrape timeout</td><td>collector → exporter</td><td><code>collector_duration</code></td></tr><tr><td>시계열 없음</td><td>metric relabel → TSDB</td><td>PromQL, 설정</td></tr><tr><td>그래프에 구멍</td><td>staleness</td><td>0을 계속 내보내는가</td></tr><tr><td>알림 안 옴</td><td>Prometheus → Alertmanager</td><td>pending/firing, route, inhibit</td></tr></table><p class="callout">어느 경계에서 사라졌는지에 따라 <span class="accent">원인도 고칠 곳도 달라집니다.</span></p>','04-01 §5 디버깅 · 08-01 §5 트러블슈팅 · 05-01 라우팅','운영 진단'],
['종합','synthesis','<h2>마지막 5문장 회상</h2><ol><li>라벨 <strong>전체</strong>가 시계열 하나를 정합니다.</li><li>샘플은 <strong>WAL → head → block</strong>으로 이동하고, 블록은 불변입니다.</li><li>relabeling은 타깃과 시계열을 <strong>서로 다른 위치</strong>에서 거릅니다.</li><li>Prometheus의 <strong>firing</strong>과 Alertmanager의 <strong>억제</strong>는 다른 상태입니다.</li><li>Node Exporter timeout은 <strong>가장 느린 collector</strong>의 duration부터 봅니다.</li></ol><p class="question">보지 않고 설명할 수 있다면 네 장의 뼈대를 잡은 것입니다.</p><p class="answer">다음은 한 대를 넘어서는 이야기입니다 — 06장 샤딩·HA · 07장 카디널리티 디버깅 · 09장 remote write · 10장 Thanos.</p>','네 주제 핵심 요약','최종 회상'],
];
const deck=document.querySelector('#deck');S.forEach((s,i)=>{const el=document.createElement('section');el.className='slide '+(s[5]||'');el.dataset.kicker=s[0];el.dataset.section=s[1];el.dataset.page=String(i+1).padStart(2,'0')+' / '+S.length;el.innerHTML=s[2]+'<div class="footer"><span>출처 섹션: '+s[3]+'</span><span>'+s[4]+'</span></div>';deck.append(el)});
const slides=[...document.querySelectorAll('.slide')];let index=0;function show(i){index=Math.max(0,Math.min(slides.length-1,i));slides[index].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'center'})}document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);document.querySelector('#print').onclick=()=>print();addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)index=slides.indexOf(e.target)}),{threshold:.6});slides.forEach(s=>observer.observe(s));
</script></body></html>

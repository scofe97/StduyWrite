<title id="dt">Redis 정상·장애·복구 중의 상태 전이</title><desc id="dd">마스터 크래시 감지 후 DB 폴백, 재가동 후 미전달 데이터 재동기화 완료 뒤 정상 복귀하는 상태 머신.</desc>
<rect width="960" height="540" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN COURSE · 02-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">Redis 정상·장애·복구 중의 상태 전이</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">[정상] Redis 우선 읽기 → [장애] DB 폴백 → [복구 중] DB→Redis 미전달 N건 동기화 → [정상 복귀]</text>

<title id="dt">메시징 장애 복원력을 여섯 절로 읽는다</title><desc id="dd">확인 응답과 영속화 사이의 틈을 방어하고 Redis 와 Kafka 장애를 대체 저장소로 흡수하는 여섯 단계 구조.</desc>
<rect width="960" height="480" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN COURSE · 02-01</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">메시징 장애 복원력을 여섯 절로 읽는다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">유실 지점 3곳 → DB 선영속 → ISR 리더 선출 → 로컬 Outbox → Cassandra 업서트 → 잔여 한계</text>
<rect x="24" y="112" width="280" height="132" rx="6" fill="#6A95D808" stroke="#6A95D8" stroke-width="1.0"/>
<rect x="46.56" y="128" width="26.88" height="20" rx="4" fill="#0D1117" stroke="#6A95D8" stroke-width="0.8"/>
<text x="60" y="142" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#6A95D8">§1</text>
<text x="92" y="142" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">정상 경로와 유실 지점</text>
<line x1="40" y1="166" x2="288" y2="166" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="44" y="192" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#6A95D8">전송 확인 · 비동기 틈</text>
<text x="44" y="220" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">유실 지점 세 곳</text>

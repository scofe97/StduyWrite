<title id="dt">게시물 9001 은 친구 4 명 중 3 명의 피드에 한 줄씩 쌓인다</title><desc id="dd">글쓴이 7 의 친구 ID 12 · 31 · 55 · 88 을 그래프 DB 에서 받고, 사용자 설정이 55 를 걸러 3 명이 남으며, 큐와 작업자를 거쳐 피드 캐시에 (9001, 12) · (9001, 31) · (9001, 88) 세 줄이 쌓인다.</desc>

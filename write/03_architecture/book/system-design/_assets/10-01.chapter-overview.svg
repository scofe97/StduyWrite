<title id="dt">알림 시스템을 일곱 절로 읽는다</title><desc id="dd">규모와 전달 경로를 정하고, 주소를 모아 두고, 서버 한 대의 한계를 큐와 작업자로 나눈 뒤 유실과 중복을 다루고 부가 기능으로 닫는다.</desc>

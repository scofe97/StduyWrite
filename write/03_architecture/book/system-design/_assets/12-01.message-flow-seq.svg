<title id="dt">메시지 901 은 ID 를 받고 큐를 지난 뒤 저장되고 전달된다</title><desc id="dd">채팅 서버 1 이 ID 를 받아 큐에 올리면 저장과 전달이 갈리고, 사용자 B 가 오프라인이면 푸시로 간다.</desc>
<rect width="1000" height="640" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 12-01 §7</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">메시지 901 은 ID 를 받고 큐를 지난 뒤 저장되고 전달된다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">사용자 A 가 사용자 B 에게 보낸 메시지</text>

<text x="480" y="268" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#6A95D8">D2([Sx,2])</text>
<rect x="120" y="372" width="300" height="64" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>
<text x="270" y="398" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">D3</text>
<text x="270" y="420" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#E3B341">D3([Sx,2],[Sy,1])</text>
<rect x="540" y="372" width="300" height="64" rx="6" fill="#E3B34112" stroke="#E3B341" stroke-width="1.2"/>

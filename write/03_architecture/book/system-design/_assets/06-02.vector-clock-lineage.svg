<title id="dt">서버마다 카운터를 올려 가며 갈라진 버전이 합쳐진다</title><desc id="dd">D3 와 D4 는 서로의 카운터를 모두 넘지 못해 충돌이고, D5 는 둘을 읽은 클라이언트가 Sx 에 써서 모두를 넘는다.</desc>
<rect width="960" height="688" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 06-02 §1</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">서버마다 카운터를 올려 가며 갈라진 버전이 합쳐진다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">쓴 서버의 카운터만 1 오르고, 다른 서버의 카운터는 읽은 값 그대로</text>
<path d="M 480 180 L 480 216" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="496" y="204" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">Sx 쓰기</text>
<path d="M 480 284 L 480 332 L 270 332 L 270 368" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="286" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">Sy 쓰기</text>
<path d="M 480 332 L 690 332 L 690 368" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="706" y="360" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">Sz 쓰기</text>
<path d="M 270 436 L 270 484 L 480 484 L 480 512" fill="none" stroke="#8B98A9" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="690" y1="436" x2="690" y2="484" stroke="#8B98A9" stroke-width="1.5"/>
<line x1="690" y1="484" x2="480" y2="484" stroke="#8B98A9" stroke-width="1.5"/>
<text x="496" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#8B98A9">Sx 조정 쓰기</text>
<rect x="330" y="116" width="300" height="64" rx="6" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>
<text x="480" y="142" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">D1</text>
<text x="480" y="164" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="400" fill="#8B98A9">D1([Sx,1])</text>
<rect x="330" y="220" width="300" height="64" rx="6" fill="#6A95D812" stroke="#6A95D8" stroke-width="1.2"/>

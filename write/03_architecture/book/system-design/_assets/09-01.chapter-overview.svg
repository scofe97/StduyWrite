<title id="dt">웹 크롤러를 일곱 절로 읽는다</title><desc id="dd">규모를 추정한 뒤 부품과 한 URL 의 여정을 보고, BFS 의 두 결함을 프론티어가 푸는 과정에서 다운로더·견고성·함정으로 이어 간다.</desc>

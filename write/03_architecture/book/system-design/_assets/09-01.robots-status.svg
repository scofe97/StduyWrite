<title id="dt">robots.txt 는 응답 코드가 행동을 정한다</title><desc id="dd">받아 온 규칙은 그대로 따르고, 파일이 없으면 모두 허용하며, 서버가 응답하지 못하면 모두 금지로 본다.</desc>
<rect width="960" height="564" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">SYSTEM DESIGN INTERVIEW · 09-01 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">robots.txt 는 응답 코드가 행동을 정한다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">200 은 규칙대로, 404 는 전부 허용, 503 은 전부 금지</text>
<rect x="320" y="100" width="320" height="48" rx="24" fill="#6A95D810" stroke="#6A95D8" stroke-width="1.1"/>
<text x="480" y="130" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="13" font-weight="600" fill="#F5F5F3">GET en.wikipedia.org/robots.txt</text>

<path d="M 336 250 L 176 250 L 176 368" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 480 310 L 480 368" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 624 250 L 784 250 L 784 368" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>

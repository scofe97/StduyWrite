<text x="480" y="342" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#E3B341">4xx · 404</text>
<rect x="663.52" y="240" width="80.96" height="20" rx="4" fill="#0D1117" stroke="#F0616D" stroke-width="0.8"/>
<text x="704" y="254" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="12" font-weight="400" fill="#F0616D">5xx · 503</text>
<rect x="56" y="372" width="240" height="96" rx="6" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.2"/>

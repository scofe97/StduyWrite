<title id="dt">새 메시지 301 을 받기까지 요청은 폴링 3 번, 롱 폴링 1 번, 웹소켓 1 번이다</title><desc id="dd">웹소켓만 서버가 먼저 보낸다. 폴링은 빈 응답이 쌓이고 롱 폴링은 응답마다 새 요청이 따른다.</desc>

<title id="dt">프론티어는 전면 큐로 순서를, 후면 큐로 예의를 정한다</title><desc id="dd">우선순위기가 URL 을 전면 큐에 나누고, 라우터가 호스트별 후면 큐에 담으며, 힙이 그 호스트를 다시 건드려도 되는 시각을 쥔다.</desc>

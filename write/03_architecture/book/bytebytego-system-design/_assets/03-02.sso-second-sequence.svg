<title id="dt">둘째 앱은 IdP 세션 덕분에 비밀번호를 묻지 않는다</title><desc id="dd">브라우저가 IdP 로 가면 세션 쿠키가 따라가서 로그인 화면 없이 코드가 돌아옵니다</desc>

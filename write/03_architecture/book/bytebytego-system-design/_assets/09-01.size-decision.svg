<title id="dt">색인 크기가 정해 주는 순서: 메모리에 들어가면 복제본이다</title><desc id="dd">1.71 GB 색인은 한 서버의 작업 집합에 들어가므로 모자란 것은 읽기 처리량뿐이고, 읽기 복제본이 그 부하를 퍼뜨립니다.</desc>
<rect width="960" height="584" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 09-01 §6</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">색인 크기가 정해 주는 순서: 메모리에 들어가면 복제본이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">1.71 GB 는 쿼드트리 색인 크기에 대한 설계 가정이고 지오해시 색인도 비슷합니다</text>
<path d="M 360 140 L 360 164" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 360 252 L 360 296" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 360 384 L 360 444" fill="none" stroke="#F08A59" stroke-width="1.4" marker-end="url(#acc)"/>
<path d="M 520 208 L 612 208" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 520 340 L 612 340" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="250" y="100" width="220" height="40" rx="20" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="360" y="125" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">쿼드트리 색인 1.71 GB</text>
<polygon points="360,164.0 520.0,208 360,252.0 200.0,208" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="360" y="213" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">한 서버 메모리에 들어가나?</text>
<polygon points="360,296.0 520.0,340 360,384.0 200.0,340" fill="#6A95D814" stroke="#6A95D8" stroke-width="1.2"/>
<text x="360" y="345" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">읽기가 한 서버를 넘나?</text>
<rect x="240.0" y="444" width="240" height="52" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.4"/>
<text x="360" y="466" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">읽기 복제본 추가</text>
<text x="360" y="486" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">쓰기는 주 DB 한 곳</text>
<rect x="612.0" y="182" width="224" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="724" y="204" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">샤딩 검토</text>
<text x="724" y="224" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">색인이 한 서버를 넘을 때</text>
<rect x="612.0" y="314" width="224" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="0.9"/>
<text x="724" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">서버 한 대</text>
<text x="724" y="356" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8B98A9">읽기 확장 불필요</text>

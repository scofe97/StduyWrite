<title id="dt">없는 키는 캐시도 못 막아 DB 까지 간다</title><desc id="dd">user:404 를 조회하면 방어 없이는 요청마다 SELECT 가 나가고, 널 캐시와 블룸 필터는 DB 앞에서 끊습니다</desc>

<title id="dt">가맹점에는 토큰만 남고 PAN 은 vault 에만 있다</title><desc id="dd">단계마다 PAN 과 토큰이 어느 자리에 있는지 같은 세 자리를 다시 그려 따라갑니다.</desc>

<title id="dt">발급사의 정산 지출은 청구액에서 인터체인지를 뺀 값이다</title><desc id="dd">청구 100.00 EUR 의 청산 기록이 발급사까지 가고, 신용카드 상한 0.3% 를 기준으로 발급사의 순지출은 99.70 EUR 입니다.</desc>
<rect width="1000" height="676" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BYTEBYTEGO · 07-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">발급사의 정산 지출은 청구액에서 인터체인지를 뺀 값이다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">금액은 문서용 예시이고 인터체인지는 상한 0.3% 를 기준으로 계산했습니다</text>

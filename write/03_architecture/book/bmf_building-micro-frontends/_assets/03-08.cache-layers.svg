<title id="dt">캐시를 놓을 수 있는 네 자리</title><desc id="dd">위로 갈수록 사용자에 가깝고 오리진이 지는 부담이 준다. 색이 붙은 층이 저자가 조합 자체를 건너뛰는 수단으로 든 자리다.</desc>
<rect width="1100" height="468" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 03-08 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">캐시를 놓을 수 있는 네 자리</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">왼쪽 화살표 방향으로 갈수록 사용자에 가깝습니다</text>
<rect x="80" y="120" width="940" height="68" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="100" y="158.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">04</text>
<text x="152" y="159.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">CDN</text>
<text x="1000" y="158.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">클라이언트와 콘텐츠 사이 지연을 줄인다</text>
<rect x="80" y="188" width="940" height="68" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="100" y="226.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F08A59">03</text>
<text x="152" y="227.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F08A59">조각 DOM 인메모리 캐시</text>
<text x="1000" y="226.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">매번 조합하지 않고 통째로 꺼내 쓴다</text>
<rect x="80" y="256" width="940" height="68" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="100" y="294.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">02</text>
<text x="152" y="295.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">마이크로서비스 응답 캐시</text>
<text x="1000" y="294.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">Redis 로 짧게 저장해 조합 처리량을 올린다</text>
<rect x="80" y="324" width="940" height="68" fill="#F5F5F308" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="100" y="362.0" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#5E6B7E">01</text>
<text x="152" y="363.0" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="600" fill="#F5F5F3">매번 조합하는 오리진</text>
<text x="1000" y="362.0" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#8B98A9">캐시가 없으면 요청마다 여기까지 내려간다</text>
<path d="M 56 380 L 56 132" fill="none" stroke="#5E6B7E" stroke-width="1.1" marker-end="url(#soft)"/>
<text x="40" y="256.0" transform="rotate(-90 40 256.0)" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" fill="#5E6B7E" letter-spacing="0.14em">TOWARD USER</text>

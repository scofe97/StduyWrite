<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 664" width="100%" role="img" aria-labelledby="dt dd">
<defs>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8B98A9"/></marker>
<marker id="ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3FB98C"/></marker>
<marker id="warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#E3B341"/></marker>
<marker id="bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F0616D"/></marker>
<marker id="info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6A95D8"/></marker>
<marker id="acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#F08A59"/></marker>
<marker id="soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5E6B7E"/></marker>
</defs>
<title id="dt">언제 쪼갤 것인가 — 감각이 아니라 관측이 근거다</title><desc id="dd">저자는 배포가 느려졌다는 체감이 아니라 API 별 확장 성격의 차이를 세고 나서 분할로 갔다.</desc>
<rect width="1000" height="664" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 01-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">언제 쪼갤 것인가 — 감각이 아니라 관측이 근거다</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">마름모가 판단이고 사각형이 행동입니다. 왼쪽 갈래가 순서를 뒤집었을 때의 결말입니다</text>
<rect x="390.0" y="94.0" width="340" height="48" rx="20" fill="#5E6B7E12" stroke="#5E6B7E" stroke-width="1.3"/>
<text x="560" y="123" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#5E6B7E">모놀리스가 성공하고 조직이 커졌다</text>
<path d="M 560 142 L 560 190.0" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<polygon points="560,192.0 710.0,236 560,280.0 410.0,236" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<text x="560" y="234" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F08A59">확장 성격을 셀 수 있는가</text>
<text x="560" y="254" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">로그·대시보드에 근거가 있는가</text>
<path d="M 410.0 236 L 200 236 L 200 322.0" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<text x="366.0" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#E3B341">아니오</text>
<rect x="50.0" y="324.0" width="300" height="64" rx="6" fill="#161B22" stroke="#E3B341" stroke-width="1.1"/>
<text x="200" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">감각만 있다</text>
<text x="200" y="373" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">배포가 느리다 · 릴리스가 무섭다 · 회의가 길다</text>
<path d="M 200 388.0 L 200 442" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)"/>
<rect x="50.0" y="444.0" width="300" height="48" rx="20" fill="#E3B34112" stroke="#E3B341" stroke-width="1.3"/>
<text x="200" y="473" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">경계를 모르는 채 나눈다</text>
<path d="M 200 492 L 200 554" fill="none" stroke="#E3B341" stroke-width="1.4" marker-end="url(#warn)" stroke-dasharray="5 5"/>
<rect x="50.0" y="554.0" width="300" height="48" rx="20" fill="#E3B34112" stroke="#E3B341" stroke-width="1.3"/>
<text x="200" y="583" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#E3B341">§3 의 실패 — 큰 진흙 공</text>
<path d="M 710.0 236 L 760 236 L 760 322.0" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<text x="736.0" y="226" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#3FB98C">예</text>
<rect x="600.0" y="324.0" width="320" height="64" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="760" y="352" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">관측을 센다</text>
<text x="760" y="373" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">캐시 듣는 API 는 CDN 이 받음 · 오리진 압박은 소수</text>
<path d="M 760 388.0 L 760 434.0" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="600.0" y="436.0" width="320" height="64" rx="6" fill="#161B22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="760" y="464" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#F5F5F3">그 경계로 분할한다</text>
<text x="760" y="485" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">저장소까지 나눔 · 공유하지 않음</text>
<path d="M 760 500.0 L 760 554" fill="none" stroke="#3FB98C" stroke-width="1.4" marker-end="url(#ok)"/>
<rect x="590.0" y="554.0" width="340" height="48" rx="20" fill="#3FB98C12" stroke="#3FB98C" stroke-width="1.3"/>
<text x="760" y="583" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#3FB98C">탈중앙 생태계 — 팀이 자기 묶음을 소유</text>
<line x1="12" y1="620" x2="952" y2="620" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="642" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="632" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="642" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">이 편의 판단</text>
<rect x="235" y="632" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="257" y="642" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">순서를 뒤집은 갈래</text>
<rect x="409" y="632" width="14" height="12" rx="2" fill="#3FB98C22" stroke="#3FB98C" stroke-width="1.1"/>
<text x="431" y="642" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">저자가 실제로 간 길</text>
</svg>
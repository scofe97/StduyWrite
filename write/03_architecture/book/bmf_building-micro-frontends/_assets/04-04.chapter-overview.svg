<title id="dt">프로젝트가 자라는 순서</title><desc id="dd">만든 것을 지키는 이야기다. 레거시를 끌어안고 새 기능을 얹고, 그것을 어디에 두고 얼마나 캐시할지로 닫는다.</desc>

<title id="dt">조각 하나가 실패했을 때의 판단</title><desc id="dd">런타임 조합이라 UI 조각마다 404·500 이 따로 난다. 저자는 비필수 조각의 처방만 적고 주 조각이 못 뜬 경우의 처방은 적지 않는다.</desc>
<rect width="940" height="624" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 01-02 §5</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">조각 하나가 실패했을 때의 판단</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">마름모가 판단, 사각형이 처리, 타원이 종착입니다. 색이 붙은 갈래가 저자가 처방을 적은 자리입니다</text>

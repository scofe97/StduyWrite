<title id="dt">스캐폴딩이 한 번에 심는 것</title><desc id="dd">위 레인이 표준을 등록해 두는 쪽이고 아래가 그것을 받아 시작하는 쪽이다. 색이 붙은 단계에서 명령 하나가 둘을 합친다.</desc>

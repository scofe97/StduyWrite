<title id="dt">토큰을 누가 붙일 것인가</title><desc id="dd">셸이 window.fetch 를 감싸면 모든 조각의 요청에 헤더가 붙는다. 색이 붙은 갈래가 저자가 이 방식에 잘 맞는다고 적은 쪽이다.</desc>
<rect width="1100" height="526" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 04-02 §4</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">토큰을 누가 붙일 것인가</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">마름모가 판단이고 사각형이 그 결과입니다</text>
<path d="M 550 156 L 550 170" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 420 216 L 275 216 L 275 312" fill="none" stroke="#F08A59" stroke-width="1.5" marker-end="url(#acc)"/>
<path d="M 680 216 L 825 216 L 825 312" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 275 364 L 275 400" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 825 364 L 825 400" fill="none" stroke="#8B98A9" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="350" y="104" width="400" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="550" y="128" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">조각이 API 를 부를 때 토큰이 필요하다</text>
<text x="550" y="145" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#8B98A9">Authorization: Bearer ...</text>
<polygon points="550,170 680,216 550,262 420,216" fill="#161B22" stroke="#8B98A9" stroke-width="1.2"/>
<text x="550" y="221" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="600" fill="#F5F5F3">수평 분할인가</text>
<text x="289" y="262" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#F08A59">그렇다</text>
<text x="839" y="262" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9.5" font-weight="400" fill="#8B98A9">아니다 · 수직 분할</text>
<rect x="95" y="312" width="360" height="52" rx="6" fill="#F08A5914" stroke="#F08A59" stroke-width="1.3"/>
<text x="275" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F08A59">셸이 fetch 를 감싸 일괄로 붙인다</text>
<text x="275" y="353" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="9" font-weight="400" fill="#F08A59">window.fetch = async (...) =&gt; {...}</text>
<rect x="645" y="312" width="360" height="52" rx="6" fill="#161B22" stroke="rgba(191,192,192,0.22)" stroke-width="1.0"/>
<text x="825" y="336" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">조각이 붙일지 스스로 정한다</text>
<text x="825" y="353" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#8B98A9">도메인마다 팀이 다르다</text>
<rect x="95" y="400" width="360" height="52" rx="6" fill="#F5F5F308" stroke="#8B98A9" stroke-width="0.8"/>
<text x="275" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">횡단 관심사를 셸이 모은다</text>
<text x="275" y="441" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#E3B341">토큰이 필요 없는 엔드포인트까지 붙는다</text>
<rect x="645" y="400" width="360" height="52" rx="6" fill="#F5F5F308" stroke="#8B98A9" stroke-width="0.8"/>
<text x="825" y="424" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#F5F5F3">필요한 곳에만 붙는다</text>
<text x="825" y="441" text-anchor="middle" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="400" fill="#8B98A9">다른 도메인으로 토큰이 새지 않는다</text>
<line x1="12" y1="482" x2="1052" y2="482" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="504" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="494" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">저자가 잘 맞는다고 적은 갈래</text>
<rect x="352" y="494" width="14" height="12" rx="2" fill="#E3B34122" stroke="#E3B341" stroke-width="1.1"/>
<text x="374" y="504" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">그 갈래가 지는 위험</text>
</svg>
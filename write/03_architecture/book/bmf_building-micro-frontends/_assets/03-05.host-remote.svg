<title id="dt">호스트가 리모트를 런타임에 가져온다</title><desc id="dd">왼쪽은 브라우저에서 도는 호스트이고 오른쪽은 별도로 배포된 정적 산출물이다. 조각은 빌드 시점이 아니라 런타임에 합쳐진다.</desc>

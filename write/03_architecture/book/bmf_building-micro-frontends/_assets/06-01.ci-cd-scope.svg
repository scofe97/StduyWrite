<title id="dt">세 전략의 자동화 범위</title><desc id="dd">안쪽이 좁은 범위이고 바깥으로 갈수록 사람의 손이 빠진다. 색이 붙은 겹이 대시보드의 클릭 하나를 남겨 둔 단계다.</desc>
<rect width="1000" height="524" fill="#0D1117"/>
<text x="12" y="26" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" letter-spacing="0.18em" fill="#5E6B7E">BUILDING MICRO-FRONTENDS · 06-01 §2</text>
<text x="12" y="52" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="600" fill="#F5F5F3">세 전략의 자동화 범위</text>
<text x="12" y="74" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8B98A9">오른쪽 태그가 그 전략에서 파이프라인이 멈추는 자리입니다</text>
<rect x="60" y="100" width="900" height="348" rx="8" fill="#F5F5F304" stroke="#F5F5F34D" stroke-width="1.0"/>
<rect x="84" y="94" width="150.4" height="12" rx="2" fill="#0D1117"/>
<text x="159.2" y="103" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#5E6B7E">CONTINUOUS DEPLOYMENT</text>
<text x="84" y="130" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">지속 배포</text>
<text x="84" y="150" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">커밋된 코드로 빌드한 아티팩트를 프로덕션에 곧바로 배포한다</text>
<text x="936" y="130" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="600" fill="#F5F5F3">멈추지 않는다</text>
<rect x="110" y="168" width="800" height="212" rx="8" fill="#F08A5912" stroke="#F08A59" stroke-width="1.4"/>
<rect x="134" y="162" width="137.60000000000002" height="12" rx="2" fill="#0D1117"/>
<text x="202.8" y="171" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#F08A59">CONTINUOUS DELIVERY</text>
<text x="134" y="198" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F08A59">지속 전달</text>
<text x="134" y="218" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">테스트 뒤 배포 준비가 끝난 아티팩트를 만들어 둔다</text>
<text x="886" y="198" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="600" fill="#F08A59">배포 대시보드 앞에서 멈춘다</text>
<rect x="160" y="236" width="700" height="76" rx="8" fill="#F5F5F306" stroke="#8B98A9" stroke-width="1.1"/>
<rect x="184" y="230" width="156.8" height="12" rx="2" fill="#0D1117"/>
<text x="262.4" y="239" text-anchor="middle" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="7.5" font-weight="400" fill="#5E6B7E">CONTINUOUS INTEGRATION</text>
<text x="184" y="266" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#F5F5F3">지속 통합</text>
<text x="184" y="286" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#8B98A9">main 으로 머지될 때마다 파이프라인이 돈다</text>
<text x="836" y="266" text-anchor="end" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="600" fill="#F5F5F3">릴리스 브랜치 앞에서 멈춘다</text>
<line x1="12" y1="480" x2="952" y2="480" stroke="rgba(191,192,192,0.22)" stroke-width="0.8"/>
<text x="12" y="502" text-anchor="start" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" font-size="8" font-weight="400" fill="#5E6B7E">LEGEND</text>
<rect x="100" y="492" width="14" height="12" rx="2" fill="#F08A5922" stroke="#F08A59" stroke-width="1.1"/>
<text x="122" y="502" text-anchor="start" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#8B98A9">사람의 클릭이 남아 있는 단계</text>
</svg>